<title>C&#244;ng t&#225;c &amp; Sự kiện TOEIC 750+</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: cargo-manifest page. Hero with a 3x3 container stack (one container per lesson), sticky container-tab bar, lesson panel with side index of the 5 parts. */
:root{
  /* Tailwind-style neutrals + one primary (Blue 600) */
  --bg:#F9FAFB; --surface:#FFFFFF; --surface-2:#F3F4F6; --ink:#111827; --muted:#6B7280; --line:#E5E7EB;
  --paper:#FFFFFF;
  /* Coordinated palette: navy = governance/trust, cobalt = primary, magenta = errors,
     emerald = correct, ochre = clues & timing, Viettel red = brand marks, xanh mạ = outputs & chips */
  --navy:#102B66; --navy-2:#183B7E; --navy-ink:#102B66;
  --cobalt:#1E62D0; --cobalt-2:#2A7BE8;
  --magenta:#D71A4A; --magenta-2:#E52E5E;
  --emerald:#0A8558; --emerald-2:#12A16E;
  --ochre:#D87D0E; --ochre-2:#E8901C; --ochre-soft:#FDF1E1;
  --brand:var(--cobalt); --brand-soft:#DCE8FB; --vi:var(--navy-2);
  --red:#EE0033; --red-soft:#FFE4EA; --green:#5FA61B; --green-soft:#EAF6DC;
  --ok:var(--emerald); --bad:var(--magenta); --coral:var(--red); --coral-soft:var(--red-soft);
  --c1:var(--brand); --c2:var(--brand); --c3:var(--brand); --c4:var(--brand); --c5:var(--brand); --c6:var(--brand); --c7:var(--brand); --c8:var(--brand); --c9:var(--brand); --c10:var(--brand);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --shadow:0 1px 2px rgba(17,24,39,.05),0 6px 20px -8px rgba(17,24,39,.15);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#030712; --surface:#111827; --surface-2:#0B1120; --ink:#F9FAFB; --muted:#9CA3AF; --line:#1F2937;
  --vi:#9DBDF5; --paper:#111827; --navy-ink:#C9D7F4;
  --brand:var(--cobalt-2); --brand-soft:#132A55; --ochre-soft:#33220B;
  --ok:var(--emerald-2); --bad:var(--magenta-2);
  --red:#FF3B5F; --red-soft:#3B0A16; --green:#8BCF45; --green-soft:#1C2E0E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#030712; --surface:#111827; --surface-2:#0B1120; --ink:#F9FAFB; --muted:#9CA3AF; --line:#1F2937;
  --vi:#9DBDF5; --paper:#111827; --navy-ink:#C9D7F4;
  --brand:var(--cobalt-2); --brand-soft:#132A55; --ochre-soft:#33220B;
  --ok:var(--emerald-2); --bad:var(--magenta-2);
  --red:#FF3B5F; --red-soft:#3B0A16; --green:#8BCF45; --green-soft:#1C2E0E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--c) 70%,transparent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono)}

/* ---------- Hero ---------- */
.hero{padding-block:40px 32px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:40px;align-items:center}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow b{color:var(--coral);font-weight:500}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,6.2vw,76px);line-height:.95;letter-spacing:-.01em;text-transform:uppercase;margin-top:14px}
.hero h1 span{color:var(--red)}
.hero .en-sub{font-family:var(--f-display);font-weight:600;font-size:clamp(16px,1.8vw,21px);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:12px}
.hero .desc{max-width:62ch;margin-top:16px;color:var(--muted);font-size:15px}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:24px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}

.yard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:440px;justify-self:end;width:100%}
.box{position:relative;aspect-ratio:2.1/1;max-width:100%;border:1px solid var(--line);border-radius:14px;cursor:pointer;color:var(--ink);text-align:left;padding:10px 12px;
  background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;transition:transform .18s ease,background .18s,border-color .18s,box-shadow .18s}
.box:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 8px 20px -10px color-mix(in srgb,var(--brand) 60%,transparent)}
.box .n{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--brand)}
.box .qr{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.box .code{font-size:11.5px;font-weight:500;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box.on{background:var(--brand);border-color:var(--brand);color:#fff}
.box.on .n,.box.on .qr,.box.on .code{color:#fff}
.box.alt .n{color:var(--coral)}

/* navy governance band behind the hero */
.hero-band{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff}
.hero-band .eyebrow{color:rgba(255,255,255,.7)}
.hero-band .eyebrow b{color:var(--ochre-2)}
.hero-band h1 span{color:var(--magenta-2)}
.hero-band .en-sub,.hero-band .desc,.hero-band .stat span{color:rgba(255,255,255,.74)}
.hero-band .stat b{color:#fff}
.hero-band .box{border-color:transparent}
.hero-band .box.on{background:var(--cobalt-2);border-color:#fff}

/* ---------- Tab bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-block:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:12px;padding-block:10px}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;flex:1;min-width:0;padding-bottom:2px;scroll-behavior:smooth}
.tab{--c:var(--c1);flex:0 0 auto;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 16px 5px 5px;cursor:pointer;text-align:left;transition:background .15s,border-color .15s}
.tab:hover{border-color:var(--c)}
.tab .door{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--c);font-family:var(--f-display);font-weight:800;font-size:16px;
  background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.tab .tl{display:flex;flex-direction:column;line-height:1.2}
.tab .tl b{font-size:13px;font-weight:600;white-space:nowrap}
.tab .tl small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#fff}
.tab[aria-selected="true"] .door{background:rgba(255,255,255,.22);color:#fff}
.tab[aria-selected="true"] .tl small{color:rgba(255,255,255,.82)}
.mode{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:0 0 auto;background:var(--surface-2)}
.mode button{border:0;background:none;padding:6px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--navy);color:#fff}

/* ---------- Lesson ---------- */
main{padding-block:28px 64px}
.lesson-head{--c:var(--c1);display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start;padding-bottom:24px;border-bottom:2px solid var(--navy-ink)}
.big-n{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,10vw,120px);line-height:.8;color:var(--c);letter-spacing:-.02em}
.big-n small{display:block;font-size:14px;letter-spacing:.2em;color:var(--muted);font-weight:600;margin-bottom:8px}
.lesson-head h2{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3.2vw,38px);line-height:1.05;text-transform:uppercase;color:var(--navy-ink)}
.lesson-head .en-t{font-family:var(--f-display);font-weight:600;font-size:clamp(15px,1.7vw,19px);color:var(--c);letter-spacing:.04em;margin-top:8px;text-transform:uppercase}
.src{display:inline-flex;gap:8px;align-items:center;margin-top:14px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.src b{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--c);letter-spacing:.06em}

.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:36px;margin-top:28px}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 82px);align-self:start;display:flex;flex-direction:column;gap:2px}
.toc a{display:flex;gap:10px;align-items:baseline;text-decoration:none;color:var(--muted);font-size:13.5px;padding:7px 10px;border-radius:6px;line-height:1.3}
.toc a b{font-family:var(--f-display);font-size:17px;color:var(--c);min-width:18px}
.toc a:hover,.toc a.on{background:var(--surface);color:var(--ink)}
.toc .toc-sub{padding-left:38px;font-size:12.5px}
.content{min-width:0;display:flex;flex-direction:column;gap:44px}

.part{display:flex;flex-direction:column;gap:22px;scroll-margin-top:96px}
.part-h{display:flex;gap:14px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px}
.part-h .pn{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.14em;color:#fff;background:var(--red);padding:3px 9px;border-radius:4px;white-space:nowrap}
.part-h h3{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.4vw,26px);text-transform:uppercase;line-height:1.1;color:var(--navy-ink)}
.sub{display:flex;flex-direction:column;gap:14px;scroll-margin-top:96px}
.sub-h{display:flex;gap:10px;align-items:baseline;font-weight:700;font-size:17px}
.sub-h .sn{font-family:var(--f-mono);font-size:12px;color:var(--c);font-weight:500}

/* strategy */
.strat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.strat-t{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;color:var(--c);text-transform:uppercase;line-height:1.5}
.steps{display:grid;gap:12px;counter-reset:s}
.step{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:start}
.step .when{font-family:var(--f-mono);font-size:11.5px;display:flex;flex-direction:column;gap:2px;border-right:2px solid var(--ochre);padding-right:10px}
.step .when span{color:var(--ochre)!important;font-weight:500}
.step .when b{font-family:var(--f-display);font-size:18px;font-weight:700;color:var(--ink)}
.step .when span{color:var(--muted)}
.step h5{margin:0 0 3px;font-size:14.5px;font-weight:700}
.step p{font-size:14.5px;color:var(--ink)}

/* passages = papers */
.papers{display:flex;flex-direction:column;gap:18px}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:22px 24px;display:flex;flex-direction:column;gap:9px;font-size:15px;position:relative}
.paper-tag{align-self:flex-start;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:3px;padding:2px 8px;margin-bottom:4px}
.ln-caps{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.04em;line-height:1.2}
.ln-kv{font-size:14px}
.ln-kv b{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted);margin-right:4px}
.ln-bul{padding-left:16px;position:relative}
.ln-bul::before{content:"";position:absolute;left:2px;top:.7em;width:6px;height:6px;background:var(--c);border-radius:1px}
.ln-sec{font-weight:700;margin-top:6px}
.ln-head{font-weight:700;margin-top:8px;color:var(--navy-ink)}
.ln-num{padding:2px 0 2px 14px;border-left:2px solid var(--brand);margin-left:2px}
.ln-num b{color:var(--brand)}
.ln-concl{background:var(--brand-soft);border-radius:6px;padding:8px 12px;font-size:14px}
.ln-concl b{color:var(--brand)}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:16px}
.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.score{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.score b{color:var(--ink);font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--c)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.q-stem{display:flex;gap:12px;font-weight:600}
.q-no{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--c);line-height:1.2;flex:0 0 auto}
.q-extra{font-style:italic;font-weight:400;color:var(--muted);margin-top:4px}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:8px 12px;cursor:pointer;font-size:14.5px;line-height:1.45;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--c)}
.opt .k{font-family:var(--f-mono);font-weight:500;font-size:13px;color:var(--c);flex:0 0 auto;margin-top:1px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surface))}
.opt.ok .k{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--surface))}
.opt.bad .k{color:var(--bad)}
.q-fb{font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.q-fb .r{font-weight:600}
.q-fb .r.ok{color:var(--ok)} .q-fb .r.bad{color:var(--bad)}
.q-fb a{color:var(--c)}

/* bilingual */
.bi-doc{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;color:var(--c);text-transform:uppercase;padding:10px 0 2px;border-top:1px dashed var(--line);margin-top:6px;line-height:1.5}
.bi-doc:first-child{border-top:0;margin-top:0;padding-top:0}
.bi{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--line)}
.pair:first-child{border-top:0}
.pair>div{padding:11px 16px;display:flex;flex-direction:column;gap:4px;font-size:14.5px;min-width:0}
.pair .en{color:var(--ink)}
.pair .vi{color:var(--vi);background:color-mix(in srgb,var(--vi) 5%,transparent);border-left:1px solid var(--line)}
.lang{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--muted);opacity:.8}
.bi-head{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-bottom:1px solid var(--line)}
.bi-head span{padding:7px 16px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted)}
.bi-head span+span{border-left:1px solid var(--line);color:var(--vi)}

.vi-t{color:var(--vi)}
/* recall mode blurs translations */
.recall .vi-r{filter:blur(6px);cursor:pointer;user-select:none;transition:filter .2s}
.recall .vi-r.peek{filter:none;user-select:auto}

/* question translation */
.qt{display:grid;gap:12px}
.qt-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.qt-card .stem{display:flex;gap:12px}
.qt-card .stem>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.qt-card .stem b{font-weight:600}
.qt-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;padding-left:44px}
.qt-opt{display:flex;gap:8px;font-size:14px;line-height:1.45}
.qt-opt>div{display:flex;flex-direction:column;min-width:0}
.qt-opt .k{font-family:var(--f-mono);color:var(--c);font-size:12.5px;margin-top:1px}
.qt-opt.correct .k{color:#fff;background:var(--ok);border-radius:3px;padding:0 4px;height:fit-content}

/* summary */
.sum{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.sum>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;font-size:14.5px;display:flex;flex-direction:column;gap:8px}
.ideas{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.ideas li{position:relative;padding-left:18px}
.ideas>li::before{content:"";position:absolute;left:3px;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--brand)}
.ideas ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.ideas ul li::before{content:"";position:absolute;left:4px;top:.75em;width:7px;height:1.5px;background:var(--muted)}

/* matrix */
.matrix{display:grid;gap:12px}
.mx{display:grid;grid-template-columns:200px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mx-l{padding:16px;background:color-mix(in srgb,var(--c) 9%,var(--surface));display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line)}
.mx-l .i{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--c)}
.mx-l b{font-size:14.5px;line-height:1.35}
.mx-l small{font-size:12.5px;color:var(--muted);line-height:1.35}
.mx-r{padding:14px 18px;display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.mx-r p{display:flex;gap:10px}
.mx-r .lang{flex:0 0 22px;margin-top:4px}

/* answers */
.ans{display:grid;gap:12px}
.an{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:100px}
.an.flash{animation:flash 1.4s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--c)}100%{box-shadow:0 0 0 0 transparent}}
.an-h{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.an-h .no{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--c)}
.an-h .key{font-family:var(--f-mono);font-weight:500;background:var(--ok);color:#fff;border-radius:4px;padding:1px 8px;font-size:13px}
.an-h .t{font-weight:600}
.trace{font-size:14px;border-left:3px solid var(--ochre);background:var(--ochre-soft);padding:9px 12px;border-radius:0 6px 6px 0;font-style:italic}
.trace .lbl{color:var(--ochre)}
.lbl{font-family:var(--f-mono);font-style:normal;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);display:block;margin-bottom:2px}
.expl{font-size:14.5px}
.an-stem{font-size:14px;color:var(--muted);margin-top:-4px}
.para{display:flex;flex-direction:column;gap:6px;font-size:14px}
.para .pr{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:start;background:var(--green-soft);border-radius:6px;padding:7px 10px}
.para .pr i{font-style:normal;color:var(--green);font-weight:700}
.para .pr span:last-child{font-weight:600}

áu (6) Phòng Suite Giường King Cao cấp Điều hành trong 5 đêm liên tiếp (Nhận phòng: 11/5 / Trả phòng: 16/5).","Contracted Nightly Corporate Rate: €245.00 per room (inclusive of high-speed Wi-Fi, daily European buffet breakfast, and access to private business center boardrooms).","Giá Doanh nghiệp Ký kết Hàng đêm: 245,00 Euro trên mỗi phòng (đã bao gồm Wi-Fi tốc độ cao, bữa sáng tự chọn phong cách Châu Âu hàng ngày và quyền sử dụng các phòng họp trung tâm dịch vụ doanh nhân riêng).","Airport Shuttle Logistics: Complimentary private executive Mercedes sprinter van scheduled for airport pickup at Frankfurt Terminal 1 on May 11 at 10:30 AM.","Hậu cần Xe Đưa đón Sân bay: Xe van Mercedes Sprinter điều hành riêng miễn phí được lên lịch đón tại Nhà ga số 1 Frankfurt vào ngày 11/5 lúc 10:30 sáng.","Internal Delegation Travel Authorization Form (Phiếu Phê duyệt Công tác Đoàn Nội bộ)","Solis Renewable Energy Inc. — Department of International Business Development","Submitted By: Marcus Henderson, Vice President of Global Partnerships","Approved By: Victoria Chen, Chief Financial Officer | Date: April 18, 2026","Công ty Năng lượng Tái tạo Solis — Ban Phát triển Kinh doanh Quốc tế","Người gửi: Marcus Henderson, Phó Chủ tịch Đối tác Toàn cầu","Người duyệt: Victoria Chen, Giám đốc Tài chính | Ngày: 18 tháng 4, 2026","Travel Justification \u0026 Budget Reconciliation: Summit Purpose: Delegation attendance and keynote presentation at the European Wind Energy Global Expo in Frankfurt.","Giải trình Chuyến đi \u0026 Cân đối Ngân sách: Mục đích Hội nghị: Đoàn tham dự và phát biểu khai mạc tại Triển lãm Toàn cầu Năng lượng Gió Châu Âu tại Frankfurt.","Marcus Henderson will present the opening plenary session on offshore turbine grid synchronization on May 12.","Ông Marcus Henderson sẽ trình bày tại phiên họp toàn thể khai mạc về giải pháp đồng bộ lưới điện tua-bin ngoài khơi vào ngày 12 tháng 5.","Authorized Corporate Attendees (6 Delegates): Marcus Henderson (VP, Global Partnerships), Dr. Stefan Lindqvist, Elena Rostova, David Sterling, Chloe Martin, Julian Keller.","Nhân sự Tham gia Được Duyệt (6 Đại biểu): Marcus Henderson (Phó Chủ tịch, Đối tác Toàn cầu), TS. Stefan Lindqvist, Elena Rostova, David Sterling, Chloe Martin, Julian Keller.","Budget Allocation \u0026 Policy Exceptions Authorized: Airfare \u0026 Lodging Total Authorized: $24,800.00 (charged to Global Expansion Cost Center #GE-401).","Phân bổ Ngân sách \u0026 Các Ngoại lệ Chính sách Được Phê duyệt: Tổng kinh phí Vé máy bay \u0026 Khách sạn được duyệt: 24.800,00 USD (hạch toán vào Trung tâm Chi phí Mở rộng Toàn cầu #GE-401).","Per Diem Allowance: In accordance with corporate travel policy for Western Europe, each delegate is authorized a standard daily meal and incidental per diem of $120.00 per day for 6 days ($720.00 per delegate / $4,320.00 total).","Phụ cấp Công tác phí Hàng ngày (Per Diem): Căn cứ chính sách công tác của công ty đối với khu vực Tây Âu, mỗi đại biểu được duyệt mức phụ cấp ăn uống và chi phí vặt tiêu chuẩn là 120,00 USD/ngày trong 6 ngày (720,00 USD/người / tổng cộng 4.320,00 USD).","Special Ground Logistics Authorization: A dedicated car service budget of €450.00 is approved for transporting delegates and audio-visual demonstration equipment between the Grand Rhine Hotel and the Frankfurt Messe Exhibition Hall.","Phê duyệt Hậu cần Đường bộ Đặc biệt: Ngân sách thuê xe riêng trị giá 450,00 Euro được phê duyệt để đưa đón các đại biểu và thiết bị trình chiếu mô hình nghe nhìn giữa Khách sạn Grand Rhine và Khu Triển lãm Messe Frankfurt.","1.4. Dịch chi tiết Câu hỏi \u0026 Phương án Trắc nghiệm","181. Điều gì được chỉ ra về chuyến bay của đoàn đại biểu tới Frankfurt?","(A) Chuyến bay có một điểm dừng quá cảnh theo lịch tại London","(B) Đó là chuyến bay thẳng trực tiếp vượt Đại Tây Dương không dừng","(C) Vé máy bay được đặt ở khoang ghế hạng phổ thông tiêu chuẩn","(D) Chuyến bay khởi hành từ Chicago vào lúc sáng sớm","182. Theo lịch trình chuyến đi, tiện ích nào đã được bao gồm trong giá phòng khách sạn?","(A) Bữa sáng tự chọn miễn phí hàng ngày","(B) Các cuộc gọi điện thoại đường dài quốc tế không giới hạn","(C) Vé xem biểu diễn miễn phí tại Nhà hát Opera Frankfurt","(D) Dịch vụ giặt khô theo yêu cầu bất cứ lúc nào","183. Sự kiện gì dự kiến sẽ diễn ra vào ngày 12 tháng 5?","(A) Các đại biểu sẽ rời Frankfurt để quay trở về Chicago","(B) Ông Henderson sẽ trình bày một bài phát biểu khai mạc tại triển lãm","(C) Giám đốc Tài chính Victoria Chen sẽ đến trong một chuyến thị sát","(D) Hợp đồng đặt phòng khối tại khách sạn sẽ hết hạn","184. Từ \"roster\" trong đoạn 2 của lịch trình có nghĩa gần nhất với","(A) danh sách / bảng phân bổ (list)","(B) hành lý / va-li (luggage)","(C) điểm đến / nơi đến (destination)","(D) tàu bay / máy bay (aircraft)","185. Khoản chi phí bổ sung nào được phê duyệt cụ thể trên Mẫu TR-04 mà KHÔNG phải là một phần của xe đưa đón khách sạn?","(A) Nâng hạng chuyến bay điều hành riêng cho Tiến sĩ Lindqvist","(B) Phương tiện vận chuyển đường bộ giữa khách sạn và khu vực triển lãm","(C) Dịch vụ ẩm thực chuyên biệt cho tiệc chiêu đãi khách hàng buổi tối","(D) Mua máy tính xách tay mới của công ty cho sáu đại biểu","1.5. Tóm tắt Viết lại Toàn bài theo Feynman (Feynman Monograph Summary)","English Executive Summary:","• Travel Itinerary \u0026 Logistics Booking: GlobalVoyage coordinates transatlantic delegation travel for Solis Renewable Energy: nonstop business-class flights between Chicago (ORD) and Frankfurt (FRA), 6 executive suites at Grand Rhine Hotel (€245/night with breakfast), and Terminal 1 van pickup on May 11.","• Strategic Mission \u0026 Presentation: The 6-person delegation led by VP Marcus Henderson attends the European Wind Energy Expo in Frankfurt, where Henderson delivers the opening plenary presentation on offshore turbine grid synchronization on May 12.","• Financial Approvals \u0026 Ground Operations: CFO Victoria Chen approves $24,800 airfare/hotel costs, standard $120/day per diems ($4,320 total), and a special €450 car budget to transport demonstration equipment between the hotel and the Messe Exhibition Hall.","Bản tóm tắt Tiếng Việt cốt lõi:","• Lập lịch trình \u0026 Đặt dịch vụ lữ hành: Công ty GlobalVoyage điều phối chuyến công tác quốc tế cho Solis Energy: Bay thẳng hạng thương gia Chicago - Frankfurt, đặt khối 6 phòng suite tại Khách sạn Grand Rhine (245 Euro/đêm bao ăn sáng) và xe van đón sân bay ngày 11/5.","• Mục tiêu chiến lược \u0026 Phát biểu hội nghị: Đoàn công tác gồm 6 chuyên gia do Phó Chủ tịch Marcus Henderson dẫn đầu tham dự Triển lãm Năng lượng Gió Châu Âu, trong đó ông Henderson trình bày báo cáo toàn thể khai mạc về đồng bộ lưới điện tua-bin vào ngày 12/5.","• Phê duyệt tài chính \u0026 Phương tiện đặc biệt: Giám đốc Tài chính duyệt tổng ngân sách vé và phòng 24.800 USD, công tác phí per diem 120 USD/người/ngày (tổng 4.320 USD) và cấp thêm 450 Euro thuê xe riêng vận chuyển thiết bị mô hình sang Trung tâm Hội chợ Messe.","PHẦN 2: ACTIVE RECALL 5 GIÂY (BẢNG MA TRẬN ĐỊNH VỊ SONG NGỮ)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["1. Đối tượng \u0026 Vai trò: Marcus Henderson (Phó Chủ tịch Đối tác Toàn cầu Solis Energy - Trưởng đoàn công tác) lập kế hoạch cùng đại lý lữ hành GlobalVoyage và trình duyệt ngân sách lên Victoria Chen (Giám đốc Tài chính CFO).","1. Characters \u0026 Roles: Marcus Henderson (VP of Global Partnerships at Solis - Delegation Lead) coordinates bookings with GlobalVoyage Travel and secures budget approvals from Victoria Chen (CFO)."]],[["2. Boi canh \u0026 Quy trinh loi"],["2. Bối cảnh \u0026 Quy trình lõi: Quản trị công tác quốc tế doanh nghiệp (Corporate International Travel \u0026 Delegation Management). Quy trình đặt vé đoàn và khối phòng khách sạn (Room Block Booking), kết hợp phê duyệt hạn mức công tác phí (Per Diem Policy) và giải ngân chi phí hậu cần vận chuyển thiết bị chuyên ngành.","2. Context \u0026 Core Workflow: Corporate international business travel and delegation logistics. Managing group airfare and hotel room blocks alongside per diem policy compliance and specialized equipment ground transit authorizations."]],[["3. Dau vet suy luan cheo"],["3. Dấu vết suy luận chéo: Ghép nối chuyến bay thẳng Boeing 787 ở Văn bản 1 với vai trò diễn giả khai mạc ngày 12/5 của ông Henderson ở Văn bản 2. Đối chiếu xe đưa đón sân bay miễn phí của khách sạn với khoản ngân sách xe riêng 450 Euro để nhận diện chi phí vận tải bổ sung.","3. Cross-Referencing Clues: Linking the nonstop 787 flight in Passage 1 with Mr. Henderson\u0027s keynote address on May 12 in Passage 2. Contrasting complimentary hotel airport shuttles with the newly authorized €450 Messe transit budget to isolate additional expenditures."]]],"t":"table"},"PHẦN 3: ĐÁP ÁN CHUẨN XÁC \u0026 DẤU VẾT TRUY XUẤT CHÉO (CROSS-REFERENCING \u0026 COMPREHENSIVE TRAP BREAKDOWN)","What is indicated about the delegates\u0027 flight to Frankfurt?","Dap an dung: (B) It is a direct nonstop transatlantic flight.","[Dau vet bai doc / Clue]: Itinerary, Outbound: \u0027Flight #EU-402 | Departs: Chicago O\u0027Hare (ORD)... Arrives: Frankfurt International (FRA)... (Nonstop Boeing 787).\u0027 Tương tự cho chiều về: Nonstop Boeing 787.","[Dien dat tuong duong / Paraphrase]: Nonstop Boeing 787 transatlantic flight \u003c=\u003e direct nonstop transatlantic flight","[Loi giai chi tiet]: Lịch trình bay ghi rõ cả chuyến đi và chuyến về đều là các chuyến bay thẳng không dừng (Nonstop Boeing 787) giữa sân bay Chicago O\u0027Hare và sân bay Frankfurt.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) It includes a scheduled layover in London.","- Ly do sai: Chuyến bay là bay thẳng nonstop, không quá cảnh ở London hay bất kỳ thành phố nào.","- Bay ETS: Bẫy Quá cảnh Bịa đặt (Fabricated Layover Trap)","(C) It was booked in standard economy class seating.","- Ly do sai: Đoàn 6 đại biểu được phân bổ vé hạng thương gia (Business Class allocation).","- Bay ETS: Bẫy Hạng Ghế Trái ngược (Class Inversion Trap)","(D) It departs from Chicago in the early morning.","- Ly do sai: Chuyến bay khởi hành vào buổi chiều muộn lúc 05:40 PM, không phải sáng sớm.","- Bay ETS: Bẫy Thời gian Khởi hành (Departure Time Trap)","According to the travel itinerary, what amenity is included in the hotel rate?","Dap an dung: (A) Complimentary daily breakfast buffet","[Dau vet bai doc / Clue]: Itinerary, Lodging: \u0027Contracted Nightly Corporate Rate: €245.00 per room (inclusive of high-speed Wi-Fi, daily European buffet breakfast...)\u0027","[Dien dat tuong duong / Paraphrase]: daily European buffet breakfast \u003c=\u003e Complimentary daily breakfast buffet","[Loi giai chi tiet]: Thỏa thuận khối phòng khách sạn nêu rõ giá phòng 245 Euro đã bao gồm bữa ăn sáng tự chọn phong cách Châu Âu hàng ngày (daily European buffet breakfast) và Wi-Fi tốc độ cao.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(B) Unlimited international long-distance telephone calls","- Ly do sai: Khách sạn cung cấp Wi-Fi chứ không bao gồm các cuộc gọi quốc tế miễn phí không giới hạn.","- Bay ETS: Bẫy Viễn thông Quốc tế (Telephone Trap)","(C) Free tickets to the Frankfurt Opera House","- Ly do sai: Không có vé xem hòa nhạc hay nhà hát nào trong tiện ích phòng.","- Bay ETS: Bẫy Tiện ích Giải trí Lạc đề (Entertainment Distractor)","(D) On-demand dry cleaning services","- Ly do sai: Dịch vụ giặt là không nằm trong danh mục miễn phí đi kèm giá phòng.","- Bay ETS: Bẫy Dịch vụ Giặt ủi (Dry Cleaning Trap)","What is scheduled to happen on May 12?","Dap an dung: (B) Mr. Henderson will deliver a keynote presentation at the expo.","[Dau vet bai doc / Clue]: Form TR-04, Mục Summit Purpose: \u0027Marcus Henderson will present the opening plenary session on offshore turbine grid synchronization on May 12.\u0027","[Dien dat tuong duong / Paraphrase]: present opening plenary session on May 12 \u003c=\u003e deliver a keynote presentation at the expo","[Loi giai chi tiet]: Bản phê duyệt công tác ghi rõ mục đích chuyến đi: Ông Marcus Henderson sẽ đăng đàn phát biểu tại phiên họp toàn thể khai mạc (opening plenary / keynote session) vào ngày 12 tháng 5.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) The delegates will depart Frankfurt to return to Chicago.","- Ly do sai: Chuyến bay về diễn ra vào ngày 16 tháng 5, không phải ngày 12.","- Bay ETS: Bẫy Ngày Bay Về (Return Date Trap)","(C) CFO Victoria Chen will arrive on an inspection visit.","- Ly do sai: Bà Chen là người ký duyệt ngân sách tại trụ sở, không có tên trong danh sách 6 người đi công tác.","- Bay ETS: Bẫy Nhân sự Ký duyệt (Approver Inversion Trap)","(D) The hotel room block contract will expire.","- Ly do sai: Khối phòng khách sạn được đặt kéo dài 5 đêm đến ngày 16 tháng 5.","- Bay ETS: Bẫy Hết hạn Khách sạn (Hotel Checkout Trap)","The word \"roster\" in paragraph 2 of the itinerary is closest in meaning to","Dap an dung: (A) list","[Dau vet bai doc / Clue]: Itinerary context: \u0027Passenger Roster: 6 Corporate Delegates (Business Class allocation)...\u0027","[Dien dat tuong duong / Paraphrase]: Passenger Roster \u003c=\u003e passenger list / manifest / roll of attendees","[Loi giai chi tiet]: Từ \u0027roster\u0027 trong quản lý nhân sự và lữ hành doanh nghiệp có nghĩa là bảng danh sách phân bổ người (list / register).","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(B) luggage","- Ly do sai: \u0027Luggage\u0027 là hành lý va-li.","- Bay ETS: Bẫy Từ cùng Chủ đề Lữ hành (Luggage Echo Trap)","(C) destination","- Ly do sai: \u0027Destination\u0027 là điểm đến.","- Bay ETS: Bẫy Từ vựng Địa lý (Geography Distractor)","(D) aircraft","- Ly do sai: \u0027Aircraft\u0027 là máy bay.","- Bay ETS: Bẫy Phương tiện Bay (Vehicle Trap)","What additional expense was specifically authorized on Form TR-04 that is NOT part of the hotel shuttle?","Dap an dung: (B) Ground transportation between the hotel and the exhibition hall","[Dau vet bai doc / Clue]: Văn bản 1 có xe đưa đón sân bay (Airport Shuttle). Văn bản 2, Mục Special Ground Logistics Authorization: \u0027A dedicated car service budget of €450.00 is approved for transporting delegates and audio-visual demonstration equipment between the Grand Rhine Hotel and the Frankfurt Messe Exhibition Hall.\u0027","[Dien dat tuong duong / Paraphrase]: car service budget of €450 between hotel and Messe hall \u003c=\u003e Ground transportation between the hotel and the exhibition hall","[Loi giai chi tiet]: Xe của khách sạn ở Văn bản 1 chỉ đưa đón tuyến Sân bay - Khách sạn. Mẫu TR-04 ở Văn bản 2 phê duyệt thêm khoản ngân sách đặc thù 450 Euro thuê xe riêng để chở đại biểu và thiết bị trình chiếu đi lại hàng ngày giữa khách sạn và khu hội chợ Messe.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) A private executive flight upgrade for Dr. Lindqvist","- Ly do sai: Tất cả 6 đại biểu đều đã bay hạng thương gia chuẩn, không có khoản nâng hạng riêng nào.","- Bay ETS: Bẫy Nâng hạng Vé cá nhân (Flight Upgrade Trap)","(C) Specialized catering for an evening client banquet","- Ly do sai: Không có ngân sách tiệc tối riêng nào được phê duyệt trong form này.","- Bay ETS: Bẫy Tiệc Tối Khách hàng (Dinner Banquet Trap)","(D) Purchase of new corporate laptops for the six delegates","- Ly do sai: Không có khoản chi mua sắm máy tính xách tay mới.","- Bay ETS: Bẫy Mua sắm Phần cứng (Hardware Purchase Trap)","PHẦN 4: KỸ THUẬT FEYNMAN SONG NGỮ \u0026 SƠ ĐỒ QUY TRÌNH (TƯ DUY PHÂN TÍCH NGHIỆP VỤ \u0026 BA)","4.1. Sơ đồ Quy trình Luân chuyển Nghiệp vụ (Corporate Delegation Travel Workflow)","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","LẬP LỊCH TRÌNH VÉ ĐOÀN \u0026 ĐẶT KHỐI PHÒNG DOANH NGHIỆP"],[],["BƯỚC 2","PHÊ DUYỆT NGÂN SÁCH CFO \u0026 CÔNG TÁC PHÍ PER DIEM"],[],["BƯỚC 3","THỰC THI SỰ KIỆN QUỐC TẾ \u0026 BÁO CÁO PHIÊN KHAI MẠC"]],[["• Chung tu \u0026 Kenh: Công ty Quản lý Lữ hành GlobalVoyage \u0026 Hệ thống Đặt chỗ GDS","• Nghiep vu thuc thi: Đại lý lữ hành thiết lập tuyến bay thẳng xuyên Đại Tây Dương ORD-FRA hạng thương gia cho 6 đại biểu; đàm phán hợp đồng khối phòng (Room Block) tại Khách sạn Grand Rhine 245 Euro/đêm bao ăn sáng và xe đón sân bay.","• Ket qua \u0026 Kiem soat: Xác nhận đặt chỗ đoàn #GV-99214 làm cơ sở trình duyệt tài chính."],["➔"],["• Chung tu \u0026 Kenh: Phiếu Phê duyệt Công tác Form TR-04 \u0026 Ban Tài chính Doanh nghiệp","• Nghiep vu thuc thi: CFO duyệt chi 24.800 USD vé và khách sạn, duyệt phụ cấp per diem 120 USD/người/ngày (tổng 4.320 USD) và phê duyệt bổ sung 450 Euro xe riêng chuyên chở thiết bị trình chiếu sang Trung tâm Hội chợ Messe.","• Ket qua \u0026 Kiem soat: Hạch toán trung tâm chi phí #GE-401 và phát hành lệnh tạm ứng tiền công tác."],["➔"],["• Chung tu \u0026 Kenh: Triển lãm Năng lượng Gió Châu Âu (Frankfurt Messe) \u0026 Thẻ Đại biểu VIP","• Nghiep vu thuc thi: Đoàn tiếp đất sân bay Frankfurt an toàn; xe riêng vận chuyển thiết bị mô hình; Phó Chủ tịch Henderson trình bày bài phát biểu khai mạc ngày 12/5 thu hút khách hàng B2B năng lượng gió toàn cầu.","• Ket qua \u0026 Kiem soat: Hoàn thành mục tiêu phát triển đối tác chiến lược và mở rộng thị trường Châu Âu."]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["STEP 1","GROUP AIR ITINERARY \u0026 CORPORATE ROOM BLOCK"],[],["STEP 2","CFO FISCAL CLEARANCE, PER DIEM \u0026 GROUND CONTINGENCY"],[],["STEP 3","SUMMIT EXECUTION, KEYNOTE DISPATCH \u0026 NETWORKING"]],[["• Documents \u0026 Channels: GlobalVoyage Corporate Travel Desk \u0026 GDS Reservation Platform","• Core Business Execution: Travel manager books nonstop transatlantic business flights ORD-FRA for 6 delegates; negotiates a corporate room block at Grand Rhine Hotel (€245/night with buffet breakfast and Terminal 1 van pickup).","• Key Deliverable \u0026 Control: Booking Reference #GV-99214 established for executive compliance review."],["➔"],["• Documents \u0026 Channels: Form TR-04 Authorization \u0026 Corporate Treasury Cost Center #GE-401","• Core Business Execution: CFO authorizes $24,800 airfare/hotel spend, mandates $120/day per diems ($4,320 total), and sanctions an exceptional €450 dedicated vehicle budget for AV demonstration equipment transit.","• Key Deliverable \u0026 Control: Cost Center #GE-401 funded and travel advance disbursement initialized."],["➔"],["• Documents \u0026 Channels: Frankfurt Messe Exhibition Hall \u0026 Global Wind Energy Congress","• Core Business Execution: Delegation lands in Frankfurt; transfers equipment via dedicated van; VP Henderson delivers opening keynote on turbine grid integration on May 12, driving European pipeline expansion.","• Key Deliverable \u0026 Control: Corporate commercial expansion objectives achieved with complete compliance."]]],"t":"table"},"4.2. Tư duy Phân tích Nghiệp vụ \u0026 BA (Bản Tiếng Việt)","• Bức tranh Toàn cảnh Nghiệp vụ (End-to-End Flow): Trong quản trị công tác quốc tế doanh nghiệp (Corporate Global Travel Management), BA phụ trách quy trình \u0027Travel \u0026 Entertainment\u0027 (T\u0026E) phải xâu chuỗi 3 luồng: Dòng Lịch trình \u0026 Hậu cần (Itinerary \u0026 Logistics: Vé máy bay -\u003e Khối phòng khách sạn -\u003e Xe đưa đón); Dòng Chính sách \u0026 Tuân thủ (Travel Policy \u0026 Compliance: Tiêu chuẩn hạng vé theo chức danh -\u003e Định mức công tác phí Per Diem theo vùng địa lý -\u003e Phê duyệt ngoại lệ); và Dòng Quyết toán Ngân hàng (Finance \u0026 Expense Settlement: Hạch toán mã phòng ban Cost Center -\u003e Tạm ứng thẻ doanh nghiệp Corporate Card -\u003e Đối soát hóa đơn sau chuyến đi).","• Điểm nghẽn \u0026 Rủi ro Vận hành Thực tế (Core Bottleneck \u0026 Risk): Nút thắt lớn nhất là \u0027Rủi ro gián đoạn thiết bị trình chiếu kỹ thuật cao\u0027 (Demonstration Equipment Transit Failure). Đoàn đi tham dự triển lãm quốc tế mang theo các mô hình tua-bin gió và màn hình demo nhạy cảm; nếu phụ thuộc vào taxi công cộng hoặc tàu điện ngầm đông đúc tại Frankfurt, thiết bị có thể bị va đập hỏng hóc hoặc thất lạc, làm đổ bể toàn bộ bài phát biểu khai mạc của Phó Chủ tịch. Rủi ro thứ hai là chi tiêu vượt định mức khách sạn: Việc đàm phán hợp đồng khối phòng (Corporate Room Block) giúp khóa cứng giá phòng 245 Euro trong mùa cao điểm hội nghị (khi giá phòng lẻ có thể tăng vọt lên 600-800 Euro/đêm).","• 3 Giải pháp Thiết kế Hệ thống \u0026 Kiểm soát Nghiệp vụ (BA \u0026 Travel System Architecture):","(1) Tự động hóa Khóa Khối Phòng Khách sạn Doanh nghiệp (Automated Corporate Room Block Lock-in): Tích hợp phần mềm quản lý công tác (như Concur/Navan) trực tiếp với chuỗi khách sạn đối tác: Khi có đoàn trên 5 người đi hội thảo lớn, hệ thống tự động cảnh báo đặt phòng khối trước 60 ngày để hưởng chiết khấu 40-50% và bao trọn bữa sáng cùng phòng họp mini.","(2) Cơ chế Cấp Hạn mức Ngoại lệ Vận chuyển Kỹ thuật Đặc biệt (Special Cargo \u0026 Ground Logistics Exception Protocol): Thiết lập luồng phê duyệt ngoại lệ tự động trên Form TR-04: Cho phép trưởng đoàn được duyệt thêm khoản ngân sách xe chuyên dụng (Dedicated Van Budget: 450 Euro) phục vụ vận chuyển tài sản công nghệ của công ty mà không bị chặn bởi trần chi phí đi lại thông thường.","(3) Ma trận Định mức Công tác phí Tự động theo Quốc gia (Dynamic Geographical Per Diem Engine): Hệ thống tự động tính toán phụ cấp ăn uống và chi phí vặt (Per Diem) dựa trên biểu giá quy định của Bộ Tài chính/Tổ chức quốc tế: Tự động nhân 120 USD x 6 ngày x 6 người = 4.320 USD và chuyển khoản thẳng vào tài khoản thẻ công tác, loại bỏ hoàn toàn việc nhân viên phải đi gom từng hóa đơn ăn lẻ tẻ 5-10 Euro để thanh toán.","• Tam giác Liên kết Nhận thức Đa chiều (Multi-Perspective Contextual Anchoring):","- Lăng kính Viễn thông / CNTT Viettel: Bài toán đoàn công tác cấp cao Viettel tham dự Hội nghị Di động Toàn cầu (Mobile World Congress - MWC tại Barcelona, Tây Ban Nha). Ban tổ chức đối ngoại Viettel luôn phải đặt vé máy bay và khách sạn trước 6 tháng, bố trí xe riêng đón tiễn sân bay và vận chuyển thiết bị trình diễn 5G/Open RAN từ khách sạn sang hội chợ triển lãm Fira Gran Via, đồng thời kiểm tra nghiêm ngặt bảo hiểm du lịch quốc tế và thẻ ra vào cho toàn bộ đoàn công tác.","- Lăng kính Quản trị Mầm non Ước Mơ Xanh: Khi trường mầm non tổ chức cho ban giám hiệu và các cô giáo nòng cốt đi tham quan học tập mô hình giáo dục sớm Reggio Emilia / STEAM tại Singapore hoặc Nhật Bản, cô Thu Huyền lập kế hoạch chi tiết: Đặt vé máy bay bay thẳng cho cả đoàn, chọn khách sạn gần các trường mầm non đối tác có bao ăn sáng để tiết kiệm thời gian; đồng thời duyệt trước khoản công tác phí cho từng cô giáo và thuê xe đưa đón riêng để bảo đảm an toàn tuyệt đối cho đoàn giáo viên.","- Lăng kính Bàn học Gia đình (Kèm cặp Bé Hà Ngân Lớp 5): Bài học về \u0027Lập kế hoạch du lịch chu đáo và quản lý chi tiêu\u0027: Khi gia đình chuẩn bị cho chuyến du lịch hè, bố cùng Hà Ngân lập danh sách những việc cần chuẩn bị: Giờ bay là mấy giờ, đồ dùng cá nhân cần xếp vào va-li gọn gàng (giống như danh sách 6 đại biểu đóng thùng đồ); mỗi ngày con được cấp một khoản tiền tiêu vặt nhỏ (giống như tiền Per Diem) để con học cách tự lên kế hoạch mua quà lưu niệm hoặc kem que một cách thông minh, không tiêu hoang phí.","4.3. Business Analyst Executive Summary (Bản Tiếng Anh)","• End-to-End Business \u0026 Facility Context: Corporate international delegation travel management reconciles enterprise business expansion milestones with strict budgetary compliance and logistics hardening. The lifecycle spans GDS air/hotel room block reservations, internal executive authorization (Form TR-04), specialized ground transit exceptions, and automated per diem expense allocations.","• Core Operational Bottleneck \u0026 Risk: The primary failure modes are conference-peak lodging volatility and demonstration asset transit failure. Securing commercial hotel suites ad hoc during international summits exposes corporations to severe rate inflation (€600-€800/night). Furthermore, transit disruption to fragile wind turbine demonstration models compromises keynote executive deliveries and damages B2B pipeline development.","• Key BA \u0026 System Architecture Solutions:","(1) Automated Master Corporate Room Block Procurement: Systematize programmatic group bookings (\u003e5 attendees) via enterprise travel platforms (Concur/Navan), locking negotiated discounted rates (€245/night inclusive of breakfasts and executive lounges) 60 days prior to global trade congresses.","(2) Technical Freight Ground Exception Policies: Codify specialized logistics exception workflows within Form TR-04, authorizing dedicated Mercedes sprinter ground charters (€450) to transport sensitive AV demonstration assets directly between hotels and exhibition pavilions.","(3) Algorithmic Regional Per Diem Engine: Standardize daily incidental allowances via automated lookup engines ($120/day Western Europe rate), transferring $4,320 directly to corporate card ledgers and eliminating manual reconciliation of low-value receipt fragments.","PHẦN 5: TỪ VỰNG \u0026 PARAPHRASE CHUYÊN SÂU (CHUẨN 3 DÒNG TỐI ƯU NẠP ANKI)","Itinerary  /aɪˈtɪnərɛri/  Travel Schedule / Journey Route / Planned Travel Program","Nghia: Lịch trình chuyến đi, văn bản ghi chi tiết các chuyến bay, khách sạn và mốc thời gian di chuyển.","Vd: The corporate travel agent prepared a comprehensive itinerary for the delegation to Frankfurt. - Đại lý lữ hành doanh nghiệp đã lập một lịch trình toàn diện cho đoàn công tác tới Frankfurt.","Room Block  /ruːm blɑːk/  Group Lodging Reservation / Pre-Allocated Suite Allocation / Reserved Hotel Inventory","Nghia: Khối phòng khách sạn được giữ chỗ trước với số lượng lớn dành riêng cho một đoàn doanh nghiệp.","Vd: The company reserved a room block of six executive suites at a negotiated corporate rate. - Công ty đã đặt giữ chỗ một khối phòng gồm sáu phòng suite điều hành với mức giá doanh nghiệp ưu đãi.","Per Diem  /pər ˈdiːəm/  Daily Living Allowance / Daily Subsistence Allowance / Expense Stipend","Nghia: Công tác phí hàng ngày, khoản phụ cấp cố định bằng tiền mặt để chi trả tiền ăn và chi phí vặt khi đi công tác.","Vd: Each delegate was authorized a standard per diem allowance of $120 per day for meals. - Mỗi đại biểu được duyệt mức phụ cấp công tác phí tiêu chuẩn là 120 USD/ngày cho tiền ăn uống.","Roster  /ˈrɑːstər/  Attendee List / Register of Personnel / Roll of Delegates / Manifest","Nghia: Bảng danh sách đại biểu, danh sách nhân sự tham gia đoàn công tác hoặc sự kiện.","Vd: The passenger roster included six senior executives and engineering specialists. - Danh sách hành khách bao gồm sáu lãnh đạo cấp cao và chuyên gia kỹ thuật.","Nonstop  /ˌnɑːnˈstɑːp/  Direct Flight / Uninterrupted Journey / Without Scheduled Layover","Nghia: Chuyến bay thẳng trực tiếp từ điểm đi đến điểm đến mà không dừng quá cảnh tại bất kỳ sân bay nào.","Vd: The transatlantic flight to Frankfurt was a direct nonstop route departing from Chicago. - Chuyến bay vượt Đại Tây Dương tới Frankfurt là đường bay thẳng trực tiếp khởi hành từ Chicago.","Plenary Session  /ˈpliːnəri ˈsɛʃn/  Full-Assembly Meeting / Opening Keynote Assembly / General Congress Session","Nghia: Phiên họp toàn thể, buổi họp khai mạc hoặc bế mạc quan trọng nhất của hội nghị có sự tham gia của toàn bộ đại biểu.","Vd: Vice President Henderson was invited to deliver the opening speech at the summit\u0027s plenary session. - Phó Chủ tịch Henderson đã được mời phát biểu khai mạc tại phiên họp toàn thể của hội nghị thượng đỉnh.","==================================================================================================","BÀI 2: Chính sách Chi phí Công tác Doanh nghiệp, Công tác phí (Per Diem) \u0026 Quyết toán Hoàn ứng (Questions 186-190 - Triple Passage)","Nguồn: ETS TOEIC Part 7 — Triple Passage (Corporate T\u0026E Expense Policy, Employee Expense Report \u0026 Finance Audit E-mail, Questions 186-190)","PHẦN 1: NỘI DUNG VĂN BẢN ĐỌC HIỂU \u0026 DỊCH THUẬT","1.1. Đề thi Tiếng Anh gốc (Strategy Guide \u0026 Original ETS Passages)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","Corporate Travel \u0026 Expense (T\u0026E) Policy Memorandu óc: Từ vựng kế toán \u0027disallowance\u0027 (Văn bản 3).","• Q190: \u0027What net amount will be deposited into checking account on Oct 2\u0027 -\u003e Móc: Số tiền thực tế được chuyển khoản (Văn bản 3).","Bước 3 (3 phút 45 giây) - Cách trả lời \u0026 Dấu hiệu tìm nhanh nhất cho đủ 5 câu hỏi: • Q186 (Mục đích - 20s): [Dấu hiệu nhanh]: Đọc tiêu đề và câu mở đầu của Văn bản 1: \u0027Corporate Travel \u0026 Expense (T\u0026E) Policy Memorandum... Key Compliance Rules for Business Travelers\u0027 -\u003e Vạch ra các quy tắc và hạn mức chi tiêu cho công tác doanh nghiệp -\u003e Chọn (A).","• Q187 (Chi tiết - 25s): [Dấu hiệu nhanh]: Nhìn vào mục 1 của Văn bản 1: \u0027Hotel room rates must not exceed pre-approved thresholds: New York ($350/night), Tokyo ($300/night), and London (£260/night exclusive of VAT)\u0027 -\u003e Mức tối đa tại London là 260 Bảng/đêm (£260.00) -\u003e Chọn (C).","• Q188 (Ghép nối Cross-referencing - 45s): [Dấu hiệu nhanh]: Văn bản 1 quy định: \u0027individual alcoholic beverages are excluded from reimbursement unless pre-approved as part of an official client entertainment dinner\u0027. Văn bản 2 ghi: \u0027Dinner at hotel bistro: £65.00... showing £45 entree and £20 craft beer\u0027. Văn bản 3 giải thích: \u0027personal dinner... included £20.00 ($26.00) for personal alcoholic beverages... non-reimbursable\u0027 -\u003e Đồ uống có cồn sử dụng cho mục đích cá nhân không được thanh toán theo chính sách công ty -\u003e Chọn (C).","• Q189 (Từ vựng ngữ cảnh - 20s): [Dấu hiệu nhanh]: \u0027Disallowance\u0027 trong kiểm toán kế toán có nghĩa là việc từ chối thanh toán / xuất toán một khoản chi phí vi phạm chính sách (rejection / refusal / denial) -\u003e Chọn (A).","• Q190 (Chi tiết số liệu - 25s): [Dấu hiệu nhanh]: Đọc phần Claim Summary cuối Văn bản 3: \u0027Net Approved Reimbursement: $3,296.00. A direct deposit of $3,296.00 has been scheduled for release... on October 2\u0027 -\u003e Số tiền được chuyển khoản là 3.296,00 USD -\u003e Chọn (C).","Bước 4 (25 giây cuối + Đúc kết Feynman): • Khóa sổ 5 đáp án: 186-A, 187-C, 188-C, 189-A, 190-C.","• Tóm tắt Feynman 1 câu: \u0027Giám đốc kinh doanh David Thorne đi công tác London đòi thanh toán 3.322 USD chi phí, nhưng bị kế toán xuất toán gạt bỏ 26 USD tiền bia uống một mình tại khách sạn vì vi phạm quy định cấm rượu cá nhân, nên chỉ được hoàn ứng số tiền ròng là 3.296 USD vào kỳ lương ngày 2/10.\u0027","1.3. Dịch Song ngữ Xen kẽ Từng Câu (Sentence-by-Sentence Translation)","Corporate Travel \u0026 Expense Policy Memorandum (Quy định Chi phí Công tác Doanh nghiệp)","Vanguard Global Logistics Inc. — Corporate Finance \u0026 Treasury Division","Policy Ref: POL-FIN-2026-12 | Effective Date: January 1, 2026","Công ty Tiếp vận Toàn cầu Vanguard — Khối Tài chính \u0026 Kho bạc Doanh nghiệp","Mã chính sách: POL-FIN-2026-12 | Ngày có hiệu lực: 1 tháng 1, 2026","Key Compliance Rules for Business Travelers:","Các Quy tắc Tuân thủ Then chốt dành cho Cán bộ Nhân viên Đi Công tác:","1. Lodging Caps by Tier-1 Metropolitan Region: Hotel room rates must not exceed pre-approved thresholds: New York ($350/night), Tokyo ($300/night), and London (£260/night exclusive of VAT).","1. Trần Giá Khách sạn theo Khu vực Đô thị Hạng 1: Đơn giá phòng khách sạn không được vượt quá các hạn mức được phê duyệt trước: New York (350 USD/đêm), Tokyo (300 USD/đêm) và London (260 Bảng Anh/đêm chưa bao gồm thuế VAT).","Any excess requires advance written pre-authorization from the employee\u0027s Division Executive Vice President.","Bất kỳ khoản vượt hạn mức nào đều bắt buộc phải có văn bản phê duyệt trước của Phó Chủ tịch Điều hành Khối phụ trách.","2. Per Diem vs. Actual Meal Receipts: Domestic travelers receive standard per diem allowances.","2. Công tác phí Trọn gói (Per Diem) so với Hóa đơn Bữa ăn Thực tế: Nhân viên đi công tác nội địa được nhận các khoản phụ cấp công tác phí trọn gói tiêu chuẩn.","For international client-facing sales roadshows, employees may submit actual itemized receipts up to $150.00 per day for meals, provided individual alcoholic beverages are excluded from reimbursement unless pre-approved as part of an official client entertainment dinner (Client Entertainment Form CE-02 required).","Đối với các chuyến công tác tiếp thị khách hàng quốc tế, nhân viên được phép gửi hóa đơn chi tiết thực tế lên tới 150,00 USD mỗi ngày cho tiền ăn, với điều kiện các loại đồ uống có cồn cá nhân bị loại trừ khỏi diện thanh toán trừ khi được phê duyệt trước như một phần của bữa tiệc chiêu đãi khách hàng chính thức (bắt buộc phải có Mẫu Tiếp khách CE-02).","3. Ground Transportation: Public transit, express airport trains, and standard ride-share services are fully reimbursable.","3. Phương tiện Di chuyển Đường bộ: Giao thông công cộng, tàu hỏa tốc hành sân bay và các dịch vụ gọi xe tiêu chuẩn được thanh toán hoàn ứng toàn bộ.","Premium limousine hires or luxury car rentals are strictly prohibited.","Việc thuê xe limousine cao cấp hoặc thuê xe hơi hạng sang bị nghiêm cấm tuyệt đối.","4. Submission \u0026 Audit Timetable: Expense reports (Form ER-10) with scannable itemized receipts must be submitted via the Concur portal within fifteen (15) calendar days of trip conclusion.","4. Lịch trình Nộp hồ sơ \u0026 Kiểm toán: Báo cáo chi phí (Mẫu ER-10) đính kèm hóa đơn chi tiết có thể quét được phải nộp qua cổng Concur trong vòng mười lăm (15) ngày dương lịch kể từ khi kết thúc chuyến đi.","Late submissions risk automatic rejection.","Các hồ sơ nộp muộn sẽ đối mặt với nguy cơ bị hệ thống tự động từ chối thanh toán.","Employee Business Expense Reimbursement Claim (Giấy Đề nghị Hoàn ứng Chi phí Công tác)","Employee: David Thorne, Regional Sales Director (Employee ID: #VGL-4419)","Department: European Enterprise Accounts | Trip Purpose: London Banking Roadshow","Travel Dates: September 14 - 18, 2026 | Submission Date: September 24, 2026","Nhân viên: David Thorne, Giám đốc Kinh doanh Khu vực (Mã nhân viên: #VGL-4419)","Phòng ban: Tài khoản Doanh nghiệp Châu Âu | Mục đích:
