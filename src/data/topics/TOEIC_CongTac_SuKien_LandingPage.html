: Oct 14–16) at the standard rate of CHF 18,000 per day.","Thuê địa điểm: Phòng Đại tiệc Mont Blanc trong 3 ngày liên tiếp (Ngày chuẩn bị: ngày 13 tháng 10 miễn phí sau 18:00; Các ngày sự kiện: 14–16 tháng 10) với mức giá tiêu chuẩn 18.000 Franc Thụy Sĩ/ngày.","Audio-Visual Package: Platinum Ultra-HD Broadcast Package (CHF 9,500 per day), including 2 central 220-inch 4K LED screens, 6 robotic 4K tracking cameras, digital sound console with Shure wireless micro-transmitters, and on-site certified sound \u0026 lighting engineers.","Gói Nghe nhìn Âm thanh Ánh sáng: Gói Phát sóng Platinum Ultra-HD (9.500 Franc Thụy Sĩ/ngày), bao gồm 2 màn hình LED 4K trung tâm 220-inch, 6 camera bám chuyển động 4K tự động, bàn điều khiển âm thanh kỹ thuật số kèm micro không dây Shure, cùng kỹ sư âm thanh \u0026 ánh sáng chứng chỉ túc trực tại chỗ.","Opening Gala Dinner (Oct 14): Three-course Swiss gourmet plated banquet for an estimated 700 delegates at CHF 95 per person.","Dạ tiệc Khai mạc (14 tháng 10): Bữa tiệc chiêu đãi 3 món cao cấp kiểu Thụy Sĩ phục vụ tận bàn cho ước tính 700 đại biểu với đơn giá 95 Franc Thụy Sĩ/người.","Commercial Terms: As a registered international academic/professional association, GFA qualifies for our 10% Institutional Discount applicable exclusively to venue room hire fees.","Điều khoản thương mại: Là một hiệp hội chuyên môn/học thuật quốc tế có đăng ký, GFA đủ điều kiện hưởng Chiết khấu Định chế 10% áp dụng riêng cho phí thuê hội trường.","A non-refundable 25% deposit is required upon contract signing.","Khoản tiền đặt cọc không hoàn lại 25% được yêu cầu thanh toán ngay khi ký hợp đồng.","Văn bản 3: Hợp đồng Sự kiện Đã Ký \u0026 Lịch Trình Thanh toán (Executed Agreement)","Văn bản 3: Hợp đồng Sự kiện Đã Ký \u0026 Lịch Trình Thanh toán (Executed Agreement)","Văn bản 3: Hợp đồng Sự kiện Đã Ký \u0026 Lịch Trình Thanh toán (Executed Agreement)","Contract Summary: Client: Global FinTech Alliance (Representative: Elena Rostova, Event Director); Reserved Hall: Mont Blanc Grand Ballroom.","Tóm tắt hợp đồng: Khách hàng: Liên minh FinTech Toàn cầu (Đại diện: Elena Rostova, Giám đốc Sự kiện); Hội trường đặt chỗ: Phòng Đại tiệc Mont Blanc.","Room Hire: 3 days @ CHF 18,000 = CHF 54,000. Less 10% Institutional Discount (-CHF 5,400) = Net CHF 48,600.","Thuê hội trường: 3 ngày @ 18.000 CHF = 54.000 CHF. Trừ Chiết khấu Định chế 10% (-5.400 CHF) = Thuần 48.600 CHF.","AV Package: 3 days @ CHF 9,500 = CHF 28,500.","Gói Nghe nhìn AV: 3 ngày @ 9.500 CHF = 28.500 CHF.","Initial Deposit Paid (June 2): CHF 19,275 (25% of total venue hire and AV charges). Remaining Balance Due: Payable no later than September 15, 2026.","Tiền đặt cọc ban đầu đã thanh toán (ngày 2 tháng 6): 19.275 CHF (25% tổng phí thuê địa điểm và AV). Số dư còn lại phải thanh toán chậm nhất là ngày 15 tháng 9 năm 2026.","Catering Guarantee Clause: The preliminary estimate of 700 banquet covers may be adjusted without penalty until October 1 (14 days prior to event date), after which the guaranteed minimum headcount is strictly invoiced.","Điều khoản Đảm bảo Suất ăn: Ước tính sơ bộ 700 suất tiệc có thể được điều chỉnh không phạt cho đến ngày 1 tháng 10 (14 ngày trước ngày diễn ra sự kiện), sau thời điểm đó số lượng khách tối thiểu cam kết sẽ bị xuất hóa đơn bắt buộc.","1.4. Bản dịch Câu hỏi \u0026 Phương án Lựa chọn (Translated Questions)","196. Đặc điểm kiến trúc nổi bật nào được trang bị riêng tại Phòng Đại tiệc Mont Blanc?","(A) Ghế ngồi bậc thang cố định kiểu khán phòng cho 500 người tham dự","(B) Các cabin dịch cabin đồng thời đa ngôn ngữ được tích hợp sẵn","(C) Sàn bê tông đánh bóng được thiết kế cho việc vận chuyển hàng hóa siêu trọng","(D) Các vách ngăn cách âm thông minh di động cho đào tạo kiểu lớp học","197. Trong thư báo giá, những hạng mục nào nằm trong Gói Thiết bị Nghe nhìn Platinum?","(A) Bữa tiệc tối 3 món cao cấp phục vụ tận bàn miễn phí","(B) Quyền truy cập dàn dựng sự kiện 24/24 bắt đầu từ ngày 10 tháng 10","(C) Màn hình LED 4K kép và camera bám chuyển động tự động kèm kỹ sư túc trực tại chỗ","(D) Vé xe tàu cao tốc miễn phí đưa đón dành cho các đại biểu hội nghị","198. Tại sao Liên minh FinTech Toàn cầu chọn Phòng Đại tiệc Mont Blanc thay vì Nhà triển lãm Léman?","(A) Nhà triển lãm Léman không đủ chiều cao trần nhà cho các hội thảo tài chính","(B) Nhà triển lãm Léman không thể đáp ứng 700 đại biểu trong cấu hình bàn tiệc","(C) Phòng Đại tiệc Mont Blanc có mức giá thuê theo ngày rẻ hơn","(D) Phòng Đại tiệc Mont Blanc cung cấp đường dốc bốc dỡ xe hàng hóa trực tiếp","199. Tổng chi phí thuần cho việc thuê hội trường và gói kỹ thuật AV trước khi tính tiệc là bao nhiêu?","(A) 48.600 Franc Thụy Sĩ","(B) 77.100 Franc Thụy Sĩ","(C) 82.500 Franc Thụy Sĩ","(D) 95.000 Franc Thụy Sĩ","200. Theo hợp đồng đã ký kết, hạn chót để chốt số lượng đại biểu dự tiệc tối mà không bị phạt là ngày nào?","(A) Ngày 2 tháng 6","(B) Ngày 15 tháng 9","(C) Ngày 1 tháng 10","(D) Ngày 14 tháng 10","1.5. Tóm tắt Ý chính Văn bản theo Phương pháp Feynman (Key Takeaways)","Bản tóm tắt Tiếng Anh (English Summary):","• [Core Takeaway] Mục đích giao dịch: GFA ký kết hợp đồng thuê Trung tâm Hội nghị Geneva Vista để tổ chức Hội nghị Thượng đỉnh FinTech Toàn cầu 2026 trong 3 ngày (14–16/10).","• [Core Takeaway] Lựa chọn mặt bằng: Mont Blanc Grand Ballroom được chọn vì sức chứa tiệc tối đạt 850 khách (đáp ứng 700 khách tiệc khai mạc ngày 14/10), trong khi Léman Pavilion chỉ xếp tối đa 600 khách tiệc.","• [Core Takeaway] Hạ tầng kỹ thuật nghe nhìn (AV): Chọn gói Platinum Ultra-HD trị giá 9.500 CHF/ngày với màn hình LED 4K 220-inch, 6 camera tracking và kỹ sư âm thanh/ánh sáng vận hành tại chỗ.","• [Core Takeaway] Cơ cấu tài chính \u0026 chiết khấu: Giá thuê mặt bằng gốc 54.000 CHF được giảm 10% (5.400 CHF) cho tổ chức học thuật xuống còn 48.600 CHF. Cộng tiền AV 28.500 CHF, tổng chi phí thuần là 77.100 CHF.","• [Core Takeaway] Đặt cọc và hạn chốt tiệc: Đã cọc 25% (19.275 CHF) vào ngày 2/6. Hạn chốt suất tiệc không phạt là 1/10 (14 ngày trước sự kiện), và số dư còn lại thanh toán trước 15/9.","Bản tóm tắt Tiếng Việt (Vietnamese Summary):","• Mục đích giao dịch: GFA ký kết hợp đồng thuê Trung tâm Hội nghị Geneva Vista để tổ chức Hội nghị Thượng đỉnh FinTech Toàn cầu 2026 trong 3 ngày (14–16/10).","• Lựa chọn mặt bằng: Mont Blanc Grand Ballroom được chọn vì sức chứa tiệc tối đạt 850 khách (đáp ứng 700 khách tiệc khai mạc ngày 14/10), trong khi Léman Pavilion chỉ xếp tối đa 600 khách tiệc.","• Hạ tầng kỹ thuật nghe nhìn (AV): Chọn gói Platinum Ultra-HD trị giá 9.500 CHF/ngày với màn hình LED 4K 220-inch, 6 camera tracking và kỹ sư âm thanh/ánh sáng vận hành tại chỗ.","• Cơ cấu tài chính \u0026 chiết khấu: Giá thuê mặt bằng gốc 54.000 CHF được giảm 10% (5.400 CHF) cho tổ chức học thuật xuống còn 48.600 CHF. Cộng tiền AV 28.500 CHF, tổng chi phí thuần là 77.100 CHF.","• Đặt cọc và hạn chốt tiệc: Đã cọc 25% (19.275 CHF) vào ngày 2/6. Hạn chốt suất tiệc không phạt là 1/10 (14 ngày trước sự kiện), và số dư còn lại thanh toán trước 15/9.","PHẦN 2: BẢNG TRUY VẤN TƯ DUY NGUYÊN BẢN (ACTIVE RECALL 5S MATRIX)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["1. Đối tượng \u0026 Vai trò: Elena Rostova (Giám đốc Sự kiện Liên minh FinTech Toàn cầu GFA - Bên Thuê) đàm phán hợp đồng tổ chức hội nghị cùng Marc Dubois (Giám đốc Trung tâm Hội nghị Geneva Vista GVICEC - Bên Cho Thuê) và đội ngũ kỹ thuật sản xuất âm thanh ánh sáng AV.","1. Characters \u0026 Roles: Elena Rostova (Event Director at Global FinTech Alliance - Event Organizer) negotiates convention contracts with Marc Dubois (Convention Director at Geneva Vista Convention Centre - Venue Landlord) alongside certified AV production engineers."]],[["2. Boi canh \u0026 Quy trinh loi"],["2. Bối cảnh \u0026 Quy trình lõi: Lựa chọn địa điểm và đàm phán dịch vụ hội nghị quốc tế quy mô 1.200 đại biểu phiên toàn thể và 700 khách tiệc tối. Ký kết gói AV phát sóng trực tiếp Platinum Ultra-HD 4K, tận dụng chiết khấu định chế 10% tiền mặt bằng hội trường và quản trị cam kết số lượng suất ăn (Catering Guarantee) chốt trước ngày 1/10.","2. Context \u0026 Core Workflow: International convention venue procurement for 1,200 plenary delegates and 700 banquet covers. Securing turnkey Platinum Ultra-HD 4K broadcast AV packages, leveraging 10% institutional room hire discounts, and managing catering headcount guarantee locks 14 days prior to event day."]],[["3. Dau vet suy luan cheo"],["3. Dấu vết suy luận chéo: Ghép nối sức chứa tiệc của Nhà triển lãm Léman (chỉ 600 khách) với nhu cầu 700 khách tiệc của GFA ở Văn bản 2 để hiểu tại sao Grand Ballroom (chứa 850 khách tiệc) được chọn; tính toán chiết khấu 10% chỉ áp dụng cho tiền phòng (54k - 5.4k = 48.6k CHF) cộng tiền AV 28.5k CHF ra tổng chi phí thuần 77.100 CHF.","3. Cross-Referencing Clues: Linking Léman Pavilion\u0027s 600-seat banquet ceiling with GFA\u0027s 700-seat dinner requirement in Passage 2 to validate why Mont Blanc Ballroom (850 banquet capacity) was selected; calculating the 10% discount applied strictly to room hire (net CHF 48,600) plus CHF 28,500 AV to yield CHF 77,100."]]],"t":"table"},"PHẦN 3: GIẢI MÃ ĐÁP ÁN, PHÂN TÍCH PARAPHRASE \u0026 BẪY ĐỀ THI ETS","What distinct architectural feature is offered by the Mont Blanc Grand Ballroom?","Dap an dung: (B) Built-in multilingual simultaneous interpretation booths","[Dau vet bai doc / Clue]: built-in simultaneous interpretation booths (6 languages)","[Dien dat tuong duong / Paraphrase]: built-in simultaneous interpretation booths (6 languages) ➔ Built-in multilingual simultaneous interpretation booths","[Loi giai chi tiet]: Đọc lướt Văn bản 1 tại mục mô tả Mont Blanc Grand Ballroom: \u0027Features: Motorized rigging points, dual 4K LED video walls, built-in simultaneous interpretation booths (6 languages)\u0027. Như vậy, phòng này được tích hợp sẵn các cabin phiên dịch đồng thời đa ngôn ngữ.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Fixed amphitheater seating for 500 attendees","- Ly do sai: Khán phòng ghế bậc thang cố định 500 chỗ là đặc tính của Khán phòng Jura (Jura Amphitheater), không phải của Mont Blanc.","- Bay ETS: False Attribution Trap (Gán sai hội trường)","(C) Polished concrete flooring designed for heavy cargo freight","- Ly do sai: Sàn bê tông đánh bóng chịu tải hàng nặng là thông số của Nhà triển lãm Léman (Léman Pavilion).","- Bay ETS: Wrong Facility Spec Trap","(D) Modular partition walls for classroom-style training","- Ly do sai: Vách ngăn cách âm di động thông minh thuộc về phòng họp nhỏ Matterhorn Meeting Suite.","- Bay ETS: Feature Misplacement Trap","In the quotation email, what is included in the AV Platinum Package?","Dap an dung: (C) Dual 4K LED screens and robotic tracking cameras with on-site engineers","[Dau vet bai doc / Clue]: including 2 central 220-inch 4K LED screens, 6 robotic 4K tracking cameras... and on-site certified sound \u0026 lighting engineers.","[Dien dat tuong duong / Paraphrase]: 2 central 4K LED screens + 6 robotic cameras + on-site engineers ➔ Dual 4K LED screens and robotic tracking cameras with on-site engineers","[Loi giai chi tiet]: Tại Văn bản 2, mục số 2 nêu rõ: \u0027Platinum Ultra-HD Broadcast Package (CHF 9,500 per day), including 2 central 220-inch 4K LED screens, 6 robotic 4K tracking cameras, digital sound console with Shure wireless micro-transmitters, and on-site certified sound \u0026 lighting engineers\u0027. Phương án (C) tóm lược chính xác các thiết bị và nhân sự đi kèm này.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Complimentary three-course gourmet plated dinners","- Ly do sai: Tiệc 3 món có đơn giá riêng là 95 CHF/người, là hạng mục F\u0026B ẩm thực độc lập, không nằm trong gói thiết bị AV.","- Bay ETS: Separate Service Billing Trap","(B) 24-hour setup access beginning on October 10","- Ly do sai: Thời gian setup chỉ được miễn phí sau 18:00 ngày 13 tháng 10, không phải quyền truy cập từ ngày 10.","- Bay ETS: Misread Date \u0026 Time Trap","(D) Free high-speed train shuttle tickets for conference delegates","- Ly do sai: Không có đề cập nào đến việc tặng vé tàu cao tốc trong đề xuất thương mại.","- Bay ETS: Invented Benefit Trap","Why did the Global FinTech Alliance select the Mont Blanc Grand Ballroom over the Léman Exhibition Pavilion?","Dap an dung: (B) Léman Pavilion cannot accommodate 700 delegates in a banquet configuration","[Dau vet bai doc / Clue]: Văn bản 1: \u0027Léman Exhibition Pavilion... Banquet Seating: 600\u0027 kết hợp Văn bản 2: \u0027Opening Gala Dinner... for an estimated 700 delegates\u0027.","[Dien dat tuong duong / Paraphrase]: Banquet Seating: 600 \u003c 700 delegates ➔ Léman Pavilion cannot accommodate 700 delegates in a banquet configuration","[Loi giai chi tiet]: Đây là câu hỏi liên kết giữa Văn bản 1 và Văn bản 2: Văn bản 2 cho biết GFA tổ chức dạ tiệc khai mạc cho 700 khách (\u0027Opening Gala Dinner: for an estimated 700 delegates\u0027). Nhìn lại Văn bản 1, Léman Pavilion có sức chứa tiệc chỉ 600 khách (\u0027Banquet Seating: 600\u0027), trong khi Mont Blanc chứa được 850 khách (\u0027Banquet Seating: 850\u0027). Do đó, Léman Pavilion không thể đáp ứng được 700 khách tiệc của GFA.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Léman Pavilion has insufficient ceiling height for financial seminars","- Ly do sai: Trần nhà Léman cao 6,0m là hoàn toàn đủ tiêu chuẩn, lý do loại bỏ thực tế là thiếu sức chứa bàn tiệc.","- Bay ETS: Irrelevant Technical Spec Trap","(C) Mont Blanc Grand Ballroom has a lower daily rental charge","- Ly do sai: Văn bản không hề nêu mức giá thuê theo ngày của Léman Pavilion để so sánh.","- Bay ETS: Unsubstantiated Assumption Trap","(D) Mont Blanc Grand Ballroom provides direct vehicle cargo loading ramps","- Ly do sai: Cửa bốc hàng siêu trọng là ưu thế của Léman Pavilion chứ không phải Mont Blanc.","- Bay ETS: Inverted Clue Trap","What was the net total cost for venue room hire and AV production before banquet catering?","Dap an dung: (B) CHF 77,100","[Dau vet bai doc / Clue]: Room Hire: Net CHF 48,600 + AV Package: CHF 28,500 = CHF 77,100 (reflected in the deposit calculation: 25% of 77,100 = 19,275).","[Dien dat tuong duong / Paraphrase]: Net room hire (48,600) + AV package (28,500) ➔ CHF 77,100","[Loi giai chi tiet]: Liên kết dữ liệu tính toán từ Văn bản 2 và Văn bản 3: Tiền thuê phòng 3 ngày = 3 × 18.000 = 54.000 CHF. Giảm 10% (chỉ áp dụng cho thuê phòng) = 5.400 CHF ➔ Phí phòng thuần = 48.600 CHF. Tiền thuê gói AV 3 ngày = 3 × 9.500 = 28.500 CHF (không chiết khấu). Tổng thuần trước khi tính tiệc = 48.600 + 28.500 = 77.100 CHF (được ghi rõ tại Văn bản 3).","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) CHF 48,600","- Ly do sai: 48.600 CHF chỉ mới là tiền thuê hội trường sau chiết khấu, chưa cộng 28.500 CHF tiền gói AV.","- Bay ETS: Partial Cost Trap (Quên cộng tiền AV)","(C) CHF 82,500","- Ly do sai: 82.500 CHF là tổng gộp ban đầu (54.000 + 28.500) khi chưa áp dụng chiết khấu 10% tiền phòng.","- Bay ETS: Gross Cost Trap (Quên trừ chiết khấu 10%)","(D) CHF 95,000","- Ly do sai: Con số ngẫu nhiên lấy từ đơn giá 95 CHF/suất tiệc ghép vào tổng tiền.","- Bay ETS: Arbitrary Number Trap","According to the signed agreement, by what date must the final banquet delegate count be finalized?","Dap an dung: (C) October 1","[Dau vet bai doc / Clue]: adjusted without penalty until October 1 (14 days prior to event date)","[Dien dat tuong duong / Paraphrase]: adjusted without penalty until October 1 ➔ finalized by October 1","[Loi giai chi tiet]: Đọc Văn bản 3 tại điều khoản Catering Guarantee Clause: \u0027The preliminary estimate of 700 banquet covers may be adjusted without penalty until October 1 (14 days prior to event date), after which the guaranteed minimum headcount is strictly invoiced\u0027. Ngày chốt số lượng suất tiệc mà không bị phạt là ngày 1 tháng 10.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) June 2","- Ly do sai: Ngày 2 tháng 6 là ngày ký kết hợp đồng và nộp tiền cọc 25%, không phải hạn chốt số lượng tiệc.","- Bay ETS: Contract Execution Date Trap","(B) September 15","- Ly do sai: Ngày 15 tháng 9 là hạn chót thanh toán số dư tài chính còn lại của hợp đồng.","- Bay ETS: Payment Balance Deadline Trap","(D) October 14","- Ly do sai: Ngày 14 tháng 10 là ngày bắt đầu hội nghị và diễn ra tiệc tối khai mạc, đã quá hạn điều chỉnh suất ăn.","- Bay ETS: Event Start Date Trap","PHẦN 4: CHUYỂN HÓA THỰC TIỄN \u0026 ỨNG DỤNG BẢO TOÀN GIÁ TRỊ DOANH NGHIỆP","4.1. Ma trận Quy trình Nghiệp vụ Thực tiễn Tuyến tính (Dual Sequential Workflow Matrix)","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","KHẢO SÁT \u0026 LỰA CHỌN MẶT BẰNG HỘI TRƯỜNG"],[],["BƯỚC 2","ĐÀM PHÁN GÓI AV KỸ THUẬT \u0026 CHIẾT KHẤU ĐỊNH CHẾ"],[],["BƯỚC 3","KÝ HỢP ĐỒNG \u0026 QUẢN TRỊ CAM KẾT SUẤT ĂN TIỆC"]],[["• Chung tu \u0026 Kenh: Hồ sơ Thông số Kỹ thuật Mặt bằng (Venue Brochure) \u0026 Khảo sát Thực địa Walkthrough","• Nghiep vu thuc thi: Đo lường quy mô khách tham dự (1.200 ghế rạp hát, 700 ghế tiệc tối) ➔ Đối chiếu thông số kỹ thuật, loại bỏ Léman Pavilion vì thiếu tải bàn tiệc, chọn Mont Blanc Grand Ballroom.","• Ket qua \u0026 Kiem soat: Chốt lựa chọn Phòng Đại tiệc Mont Blanc đáp ứng đồng thời cả phiên toàn thể và tiệc dạ hội."],["➔"],["• Chung tu \u0026 Kenh: Thư Báo giá Dịch vụ F\u0026B / AV \u0026 Hồ sơ Tư cách Tổ chức Học thuật","• Nghiep vu thuc thi: Lựa chọn gói Platinum AV Ultra-HD 4K có kỹ sư túc trực ➔ Đệ trình tư cách hiệp hội chuyên môn để hưởng chiết khấu 10% trên đơn giá thuê mặt bằng.","• Ket qua \u0026 Kiem soat: Tiết kiệm 5.400 CHF chi phí mặt bằng; xác lập tổng chi phí thuần 77.100 CHF và cọc 25% (19.275 CHF)."],["➔"],["• Chung tu \u0026 Kenh: Hợp đồng Sự kiện Đã Ký \u0026 Cổng Quản lý Đại biểu RSVP","• Nghiep vu thuc thi: Thiết lập mốc kiểm soát danh sách đại biểu trước hạn chốt bảo đảm suất ăn (Catering Guarantee - 14 ngày trước sự kiện) ➔ Chốt danh sách ăn tiệc chính xác trước 1/10.","• Ket qua \u0026 Kiem soat: Bảo đảm cung ứng bàn tiệc hoàn hảo, không bị phạt hợp đồng hoặc lãng phí chi phí phát sinh."]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["STEP 1","VENUE SOURCING \u0026 CAPACITY VETTING"],[],["STEP 2","AV PRODUCTION SCOPING \u0026 INSTITUTIONAL DISCOUNT"],[],["STEP 3","CONTRACT EXECUTION \u0026 CATERING GUARANTEE LOCK"]],[["• Documents \u0026 Channels: Facility Specification Brochure \u0026 On-Site Inspection Walkthrough","• Core Business Execution: Benchmark attendance (1,200 plenary theater seats, 700 banquet covers) ➔ Filter venues by banquet floor plan, eliminate Léman Pavilion, select Mont Blanc Grand Ballroom.","• Key Deliverable \u0026 Control: Locked in Mont Blanc Grand Ballroom providing dual plenary and 850-seat banquet capability."],["➔"],["• Documents \u0026 Channels: Event Quotation Proposal \u0026 Professional Association Documentation","• Core Business Execution: Contract turnkey Platinum Broadcast AV tier with dedicated on-site certified engineers ➔ Submit non-profit credentials to secure 10% discount on base room hire.","• Key Deliverable \u0026 Control: Saved CHF 5,400 in facility rental; established net total of CHF 77,100 with a 25% retainer (CHF 19,275)."],["➔"],["• Documents \u0026 Channels: Master Event Agreement \u0026 Delegate RSVP Management Portal","• Core Business Execution: Monitor delegate RSVPs against contractual catering guarantee deadline (14 days prior to event date) ➔ Lock in confirmed gala banquet covers prior to October 1.","• Key Deliverable \u0026 Control: Flawless banquet provisioning achieved with zero minimum-spend penalties or food wastage."]]],"t":"table"},"4.2. Phân tích Nghiệp vụ (BA) \u0026 Ba Góc nhìn Thực tế: Viettel Tammi, Trường Mầm non Ước Mơ Xanh \u0026 Bé Hà Ngân","• Bức tranh Toàn cảnh Nghiệp vụ (End-to-End Business Flow): Ứng dụng trong Viễn thông \u0026 Dự án Viettel Tammi: Khi Viettel Telecom tổ chức Hội nghị Khách hàng Doanh nghiệp Toàn quốc hoặc Hội nghị Ra mắt Nền tảng Tammi 2.0, việc lập yêu cầu kỹ thuật (RFP) cho địa điểm tổ chức sự kiện đòi hỏi tích hợp chặt chẽ giữa sức chứa vật lý và băng thông đường truyền mạng (Dedicated Leased Line cáp quang Viettel tốc độ cao) nhằm phục vụ phát sóng Livestream đa nền tảng và kết nối cầu truyền hình bảo mật cho hàng nghìn đại lý trên cả nước.","• Lăng kính Quản trị Mầm non Ước Mơ Xanh: Ứng dụng tại Trường Mầm non Ước Mơ Xanh: Khi tổ chức Đại lễ Tổng kết Năm học và Lễ Ra trường cho học sinh 5 tuổi tại trung tâm hội nghị ngoài trời/trong nhà, Ban Giám hiệu áp dụng nguyên tắc \u0027Catering \u0026 Seating Guarantee\u0027: rà soát kỹ lưỡng số lượng phụ huynh và bé tham dự trước ngày sự kiện 10 ngày để chốt số lượng suất ăn buffet dinh dưỡng và quà tặng tốt nghiệp, vừa tối ưu ngân sách nhà trường vừa đảm bảo an toàn vệ sinh thực phẩm.","• Lăng kính Bàn học Gia đình (Kèm cặp Bé Hà Ngân Lớp 5): Góc nhìn của Bé Hà Ngân: Bé Hà Ngân háo hức mặc chiếc váy đầm trắng biểu diễn tiết mục múa tập thể trên sân khấu lớn có màn hình LED rực rỡ và hệ thống âm thanh trong trẻo, không bị chói tai. Nhờ ban tổ chức chuẩn bị chu đáo từng bàn tiệc và khu vực giải khát riêng cho trẻ nhỏ, Hà Ngân và các bạn được thưởng thức bánh ngọt và nước hoa quả ngon miệng sau khi nhận giấy khen.","• Khung Liên kết Đa chiều (Multi-Perspective Synthesis): • Khía cạnh Hợp đồng \u0026 Pháp lý: Phân tách rõ ràng giữa chiết khấu định chế (chỉ giảm tiền mặt bằng) và các dịch vụ kỹ thuật thuê ngoài để tránh tranh chấp quyết toán hóa đơn VAT. • Khía cạnh Vận hành Sự kiện: Điểm mấu chốt để thành công là buổi bàn giao mặt bằng kỹ thuật (setup day) trước giờ diễn ra sự kiện và sự hiện diện của kỹ sư AV chứng chỉ túc trực tại hiện trường. • Khía cạnh Quản trị Chi phí: Điều khoản \u0027Catering Guarantee Clause\u0027 là công cụ kinh điển trong quản lý chuỗi cung ứng khách sạn nhằm triệt tiêu lãng phí suất ăn dư thừa.","4.3. Business Analysis \u0026 Multi-Perspective Synthesis (English Analysis)","• End-to-End Strategic Business Analysis: From an enterprise Business Analysis perspective, large-scale convention procurement represents a strategic alignment between physical spatial logistics, digital broadcasting capabilities, and contractual risk management. The GVICEC RFP demonstrates rigorous capacity filtering: prioritizing a pillarless grand ballroom with built-in simultaneous interpretation booths and high banquet clearance ensures seamless transition from daytime plenary keynote addresses to an evening gala banquet without room turnaround delays. Furthermore, establishing a strict 14-day catering guarantee buffer (October 1) operationalizes lean event economics, protecting corporate capital from attendee attrition while securing vendor service level agreements.","• Operational Risk Governance: Rigorous vendor SLA enforcement, contractual guarantee locks, and automated contingency buffers protect corporate enterprise assets and institutional prestige.","PHẦN 5: TỪ VỰNG THEN CHỐT \u0026 BẢNG KÝ ỨC DÀI HẠN (SPACED REPETITION)","Ballroom  /ˈbɔːlruːm/  Grand Banquet Hall / Reception Pavilion / Large Event Auditorium","Nghia: Phòng đại tiệc, phòng khánh tiết lớn trong khách sạn hoặc trung tâm hội nghị chuyên tổ chức tiệc chiêu đãi và hội thảo lớn.","Vd: The Mont Blanc Ballroom can accommodate up to 850 guests for a formal seated dinner. - Phòng Đại tiệc Mont Blanc có thể phục vụ lên đến 850 khách cho một bữa tiệc tối ngồi bàn trang trọng.","Plenary Session  /ˈpliːnəri ˈsɛʃən/  General Assembly / Full-Body Assembly / Keynote Gathering","Nghia: Phiên họp toàn thể, buổi họp chung có sự tham gia của tất cả các đại biểu tham dự hội nghị.","Vd: All delegates gathered in the grand hall for the opening plenary session on financial innovations. - Toàn bộ các đại biểu đã tập trung tại hội trường lớn để tham dự phiên họp toàn thể khai mạc về đổi mới tài chính.","Simultaneous Interpretation  /ˌsɪməlˈteɪniəs ɪnˌtɜːrprɪˈteɪʃən/  Real-Time Translation / Live Multilingual Interpreting","Nghia: Dịch cabin, phiên dịch đồng thời trực tiếp qua tai nghe cho nhiều ngôn ngữ cùng lúc trong phòng hội thảo.","Vd: The conference hall was equipped with booths for simultaneous interpretation in six official languages. - Hội trường hội nghị được trang bị các cabin để dịch cabin đồng thời bằng sáu ngôn ngữ chính thức.","Rigging Points  /ˈrɪɡɪŋ pɔɪnts/  Overhead Truss Mounts / Ceiling Suspension Anchors","Nghia: Điểm treo cáp chịu lực trên trần nhà, vị trí kỹ thuật để cố định giàn đèn, loa âm thanh và màn hình chiếu lớn.","Vd: Motorized rigging points allow production crews to hoist heavy LED screens safely. - Các điểm treo cáp cơ giới hóa cho phép đội kỹ thuật nâng các màn hình LED nặng một cách an toàn.","Catering Guarantee  /ˈkeɪtərɪŋ ˌɡærənˈtiː/  Minimum Headcount Commitment / Final Banquet Headcount Lock","Nghia: Cam kết số lượng suất ăn tối thiểu, điều khoản chốt số khách ăn tiệc mà bên thuê phải trả tiền dù thực tế có ít người hơn.","Vd: The organizer must submit the catering guarantee fourteen days before the gala dinner. - Đơn vị tổ chức phải nộp bản cam kết số lượng suất ăn tối thiểu mười bốn ngày trước dạ tiệc.","Folio / Walkthrough  /ˈwɔːkθruː/  On-Site Site Inspection / Preliminary Facility Survey","Nghia: Buổi khảo sát thực địa tận nơi, chuyến đi xem xét kỹ lưỡng cơ sở vật chất trước khi quyết định ký hợp đồng.","Vd: The event director conducted a comprehensive venue walkthrough before finalizing the proposal. - Giám đốc sự kiện đã tiến hành một buổi khảo sát thực địa địa điểm toàn diện trước khi chốt đề xuất.","==================================================================================================","BÀI 5: Lời mời Diễn giả Chính (Keynote Speaker), Thỏa thuận Thù lao (Honorarium) \u0026 Sắp xếp Đón tiễn Sân bay (Questions 181-185 - Double Passage)","Nguồn: ETS TOEIC Part 7 — Double Passage (Executive Keynote Speaker Invitation Letter \u0026 Signed Speaker Travel Logistics Form, Questions 181-185)","PHẦN 1: NỘI DUNG VĂN BẢN ĐỌC HIỂU \u0026 DỊCH THUẬT","1.1. Đề thi Tiếng Anh gốc (Strategy Guide \u0026 Original ETS Passages)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","Official Keynote Speaker Invitation Letter","Global Telecommunications Congress (GTC 2026)","Executive Program Committee | Chiyoda-ku, Tokyo, Japan","July 15, 2026","Dear Dr. Evelyn Vance,","Chief Artificial Intelligence Strategist | Silicon Horizon Labs","Palo Alto, California, USA","On behalf of the Organizing Committee of the 32nd Annual Global Telecommunications Congress (GTC 2026), it is our distinct honor to formally invite you as our Opening Keynote Speaker. The congress will take place at Tokyo Big Sight International Exhibition Center from November 12 to 14, 2026, gathering over 4,500 senior telecom executives, network architects, and government regulators worldwide.","Keynote Session Overview:","- Topic: \u0027Autonomous 6G Infrastructure: Integrating Edge AI and Ultra-Reliable Low-Latency Networks\u0027","- Date \u0026 Time: Thursday, November 12, 2026 | 09:30 AM – 10:45 AM (Plenary Auditorium A)","- Presentation Duration: 50 minutes of address followed by a 25-minute moderated audience Q\u0026A session.","Honorarium and Speaker Accommodations:","1. Speaking Honorarium: A professional honorarium of USD $7,500 net of local taxes. A 50% advance ($3,750) will be transferred upon receipt of your countersigned agreement, and the remaining 50% will be disbursed within fourteen (14) business days following your presentation.","2. Air Transportation: Full reimbursement for round-trip First/Business Class commercial airfare between San Francisco (SFO) and Tokyo (HND/NRT).","3. Luxury Lodging: Three (3) complimentary nights in an Executive Garden Suite at the Hotel New Otani Tokyo (November 11–14).","4. Airport VIP Ground Transfer: Private chauffeured black car executive transfer directly between Tokyo international airports and your hotel.","Please confirm your acceptance by completing and returning the attached Logistics \u0026 Technical Rider Form by August 15, 2026.","Sincerely yours,","Kenjiro Takahashi","Chairperson, Executive Program Committee, GTC 2026","Keynote Speaker Acceptance \u0026 Travel Logistics Form","Global Telecommunications Congress (GTC 2026)","Completed and Submitted by: Dr. Evelyn Vance | Date: August 3, 2026","Speaker Profile \u0026 Session Confirmation:","- Name: Dr. Evelyn Vance, Ph.D. | Affiliation: Silicon Horizon Labs","- Keynote Title: Autonomous 6G Infrastructure: Integrating Edge AI and Ultra-Reliable Low-Latency Networks (Confirmed)","- Technical AV Requirements: Dual wireless lapel microphones, dual 4K confidence monitors on stage, Apple Keynote presentation format with audio pass-through.","Travel \u0026 Ground Transportation Details:","- Inbound Flight: All Nippon Airways Flight #NH-107 (SFO to Tokyo Haneda HND) | Scheduled Arrival: Wednesday, November 11 at 04:20 PM.","- Outbound Flight: All Nippon Airways Flight #NH-108 (Tokyo Haneda HND to SFO) | Scheduled Departure: Saturday, November 14 at 07:45 PM.","- Chauffeur Meeting Point: Arrival Hall Exit 2, Haneda International Terminal. (Driver holding \u0027GTC 2026 — Dr. Evelyn Vance\u0027 nameplate).","Special Requirements \u0026 Dietary Preferences:","- Dietary Restriction: Strict gluten-free vegan meals for all conference banquets and in-flight catering.","- Wire Transfer Details: Silicon Horizon Research Foundation | Silicon Valley Bank, N.A. | Routing: #121000358 | Account: #9942-8810-77.","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","181 What is the primary purpose of the letter sent by Kenjiro Takahashi?","(A) To negotiate a licensing agreement for AI telecom patents","(B) To invite an industry expert to deliver the opening keynote speech at a congress","(C) To solicit corporate sponsorship funds for the Tokyo Big Sight venue","(D) To announce a call for research papers in autonomous vehicle software","182 What travel accommodation is NOT explicitly provided by the congress organizers?","(A) Reimbursed round-trip business or first-class international airfare","(B) Three nights of executive lodging at Hotel New Otani Tokyo","(C) Private chauffeured airport ground transfer service","(D) Guided sightseeing tour tickets across regional tourist destinations","183 In the speaker logistics form, what dietary preference does Dr. Vance specify?","(A) Traditional Japanese sushi and seafood","(B) Strict gluten-free vegan meals","(C) Halal-certified poultry entrees","(D) Low-sodium dairy dishes","184 When will Dr. Vance receive the final installment of her speaking honorarium?","(A) Upon returning the signed acceptance form by August 15","(B) Immediately when checking in at Tokyo Haneda Airport","(C) Within fourteen business days following her keynote presentation","(D) At the beginning of the next fiscal year on January 1","185 Where is the private driver instructed to meet Dr. Vance on November 11?","(A) At the hotel lobby of the Hotel New Otani Tokyo","(B) In front of Arrival Hall Exit 2 at Haneda International Terminal","(C) Inside Plenary Auditorium A at Tokyo Big Sight","(D) At the airline ticket counter in San Francisco Airport","1.2. Hướng dẫn Chiến lược Đọc hiểu \u0026 Phản xạ 5 Phút (5-Minute Strategy Guide)","CHIẾN THUẬT 5 PHÚT TỐI ƯU: NẮM BẮT BỐI CẢNH, GHÉP NỐI DỮ KIỆN \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Quét Z-Pattern: Kỹ thuật quét Z-Pattern trong 30 giây: Lướt nhanh qua người gửi và người nhận ở Văn bản 1 (Ủy ban Chương trình Hội nghị Viễn thông Toàn cầu Tokyo gửi Tiến sĩ Evelyn Vance, Giám đốc Chiến lược AI) và Văn bản 2 (Biểu mẫu xác nhận tham dự \u0026 thông tin hậu cần đón tiễn có chữ ký của diễn giả). Chú ý ngay chủ đề bài phát biểu, mức thù lao (honorarium), điều kiện vé máy bay/khách sạn và chuyến bay đến sân bay Haneda.","Bước 2 (60 giây) - Móc nối Logic \u0026 Sơ đồ Tinh thần: Khắc ghi móc nối logic trong 60 giây: Ban tổ chức mời TS. Vance thuyết trình phiên khai mạc về \u0027Mạng lưới 6G tự hành và AI biên\u0027. Họ đài thọ thù lao 7.500 USD (trả 1 năm 2026, quy tụ hơn 4.500 lãnh đạo cấp cao ngành viễn thông, kiến trúc sư mạng và các nhà quản lý chính phủ trên toàn cầu.","Topic: \u0027Autonomous 6G Infrastructure: Integrating Edge AI and Ultra-Reliable Low-Latency Networks\u0027 | Date \u0026 Time: Thursday, November 12, 2026 | 09:30 AM – 10:45 AM (Plenary Auditorium A).","Chủ đề: \u0027Hạ tầng 6G Tự hành: Tích hợp AI Biên và Mạng lưới Độ trễ Thấp Siêu Tin cậy\u0027 | Ngày \u0026 Giờ: Thứ Năm, ngày 12 tháng 11 năm 2026 | 09:30 – 10:45 sáng (Khán phòng Toàn thể A).","Presentation Duration: 50 minutes of address followed by a 25-minute moderated audience Q\u0026A session.","Thời lượng thuyết trình: 50 phút phát biểu tiếp nối bằng 25 phút phiên hỏi đáp (Q\u0026A) có điều phối với khán giả.","Speaking Honorarium: A professional honorarium of USD $7,500 net of local taxes.","Thù lao thuyết trình: Mức thù lao chuyên gia trị giá 7.500 Đô la Mỹ thực nhận (đã trừ thuế địa phương).","A 50% advance ($3,750) will be transferred upon receipt of your countersigned agreement, and the remaining 50% will be disbursed within fourteen (14) business days following your presentation.","Khoản tạm ứng 50% (3.750 USD) sẽ được chuyển khoản ngay khi nhận được thỏa thuận có chữ ký xác nhận của bà, và 50% còn lại sẽ được giải ngân trong vòng mười bốn (14) ngày làm việc sau buổi thuyết trình của bà.","Air Transportation: Full reimbursement for round-trip First/Business Class commercial airfare between San Francisco (SFO) and Tokyo (HND/NRT).","Vé máy bay: Hoàn trả toàn bộ tiền vé máy bay thương mại khứ hồi hạng Nhất/Thương gia giữa San Francisco (SFO) và Tokyo (HND/NRT).","Luxury Lodging: Three (3) complimentary nights in an Executive Garden Suite at the Hotel New Otani Tokyo (November 11–14).","Khách sạn cao cấp: Ba (3) đêm miễn phí tại Phòng Suite Executive hướng vườn tại Khách sạn New Otani Tokyo (từ ngày 11 đến 14 tháng 11).","Airport VIP Ground Transfer: Private chauffeured black car executive transfer directly between Tokyo international airports and your hotel.","Xe đưa đón sân bay VIP: Dịch vụ xe sang đưa đón riêng có tài xế trực tiếp giữa các sân bay quốc tế Tokyo và khách sạn của bà.","Please confirm your acceptance by completing and returning the attached Logistics \u0026 Technical Rider Form by August 15, 2026.","Xin vui lòng xác nhận sự đồng ý bằng cách điền và gửi lại Biểu mẫu Hậu cần \u0026 Yêu cầu Kỹ thuật đính kèm trước ngày 15 tháng 8 năm 2026.","Văn bản 2: Biểu Mẫu Hậu Cần \u0026 Đón Tiễn của Diễn Giả (Speaker Logistics Form)","Văn bản 2: Biểu Mẫu Hậu Cần \u0026 Đón Tiễn của Diễn Giả (Speaker Logistics Form)","Văn bản 2: Biểu Mẫu Hậu Cần \u0026 Đón Tiễn của Diễn Giả (Speaker Logistics Form)","Speaker Profile: Dr. Evelyn Vance, Ph.D. | Affiliation: Silicon Horizon Labs | Keynote Title: Autonomous 6G Infrastructure: Integrating Edge AI and Ultra-Reliable Low-Latency Networks (Confirmed).","Hồ sơ Diễn giả: Tiến sĩ Evelyn Vance | Đơn vị: Silicon Horizon Labs | Tiêu đề Diễn văn: Hạ tầng 6G Tự hành: Tích hợp AI Biên và Mạng lưới Độ trễ Thấp Siêu Tin cậy (Đã xác nhận).","Technical AV Requirements: Dual wireless lapel microphones, dual 4K confidence monitors on stage, Apple Keynote presentation format with audio pass-through.","Yêu cầu Kỹ thuật AV: Hai micro cài áo không dây, hai màn hình nhắc bài 4K trên sân khấu, định dạng bài thuyết trình Apple Keynote có truyền tín hiệu âm thanh.","Inbound Flight: All Nippon Airways Flight #NH-107 (SFO to Tokyo Haneda HND) | Scheduled Arrival: Wednesday, November 11 at 04:20 PM.","Chuyến bay đến: All Nippon Airways Chuyến #NH-107 (SFO đến Tokyo Haneda HND) | Giờ hạ cánh dự kiến: Thứ Tư, ngày 11 tháng 11 lúc 04:20 chiều.","Outbound Flight: All Nippon Airways Flight #NH-108 (Tokyo Haneda HND to SFO) | Scheduled Departure: Saturday, November 14 at 07:45 PM.","Chuyến bay về: All Nippon Airways Chuyến #NH-108 (Tokyo Haneda HND đến SFO) | Giờ cất cánh dự kiến: Thứ Bảy, ngày 14 tháng 11 lúc 07:45 tối.","Chauffeur Meeting Point: Arrival Hall Exit 2, Haneda
