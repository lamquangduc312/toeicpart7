 thích quy trình sơ tán khẩn cấp tại tòa nhà Chicago","197. Theo chỉ thị chính sách, biên độ phần trăm tăng lương theo năng lực nào được chỉ định cho Xếp loại 5?","(A) 0% – 1,5%","(B) 3,0% – 4,5%","(C) 5,5% – 7,0%","(D) 7,5% – 9,0%","198. Điều gì được chỉ ra về cô Choi trong phiếu đánh giá hiệu suất?","(A) Cô sẽ bị đưa vào Kế hoạch Cải thiện Hiệu suất bắt buộc trong 60 ngày.","(B) Công việc của cô đã trực tiếp góp phần làm giảm đáng kể tỷ lệ khách hàng bỏ dở giỏ hàng.","(C) Cô mới gia nhập công ty gần đây với tư cách thực tập sinh đồ họa mới vào nghề.","(D) Cô không đáp ứng được thời hạn dự án trong hạng mục phối hợp liên phòng ban.","199. Trong phiếu đánh giá, từ \u0027overhaul\u0027 trong tiêu chí 1 gần nghĩa nhất với từ nào?","(A) Hủy bỏ hoàn toàn (cancellation)","(B) Tái cấu trúc, cải tổ toàn diện (reconstruction / revamp)","(C) Trì hoãn thời gian (postponement)","(D) Thanh tra sơ bộ (inspection)","200. Tỷ lệ phần trăm tăng lương cụ thể nào được ông Sterling đề xuất cho cô Choi?","(A) 4,5%","(B) 7,0%","(C) 8,5%","(D) 10,0%","5. CÔ ĐỌNG BÀI HỌC FEYNMAN (FEYNMAN CRITICAL TAKEAWAYS)","Key Structural \u0026 Vocabulary Takeaways (English)","• Performance Appraisal to Compensation Mapping: Enterprise HR questions frequently evaluate the quantitative mapping between performance ratings (Rating 5 Far Exceeds) and specific merit increase bands (7.5% - 9.0%).","• Multi-Dimension Scorecard Synthesis: Part 7 scorecards weight multiple operational KPIs (quality, scalability, cross-collaboration, mentorship) to calculate a composite score governing executive advancement.","• Specialized HR Lexicon: Master performance appraisal terminology such as \u0027merit adjustment\u0027, \u0027overhaul\u0027 (complete revamp), \u0027composite score\u0027, \u0027abandonment rate\u0027, and \u0027Performance Improvement Plan (PIP)\u0027.","Bài học Cốt lõi \u0026 Quy tắc Tư duy (Tiếng Việt)","• Ánh xạ từ Hiệu suất sang Lương thưởng: Các câu hỏi nhân sự TOEIC luôn kiểm tra mối liên kết số học chặt chẽ giữa Hạng xếp loại (Xếp loại 5 - Xuất sắc) và biên độ tăng lương theo năng lực (7,5% - 9,0%).","• Tổng hợp Điểm số KPI Đa chiều: Bảng điểm Part 7 thường phân bổ trọng số cho nhiều chỉ tiêu khác nhau (chất lượng sản phẩm, khả năng mở rộng, phối hợp nhóm, đào tạo nhân tài) để cho ra Điểm số tổng hợp (Composite Score).","• Nhận diện Thuật ngữ Thăng chức \u0026 Đánh giá: Nhớ rõ \u0027merit increase\u0027 là tăng lương dựa trên thành tích, \u0027overhaul\u0027 là cải tổ tái thiết kế toàn diện, và \u0027composite score\u0027 là điểm tổng hợp đa trọng số.","ACTIVE RECALL 5S (MA TRẬN TRUY XUẤT CHÉO DỮ LIỆU)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["1. Đối tượng \u0026 Vai trò: Meridian Media Group ban hành quy chế đánh giá hiệu suất; Nhà thiết kế UX Karen Choi được đánh giá; Phó Chủ tịch Thiết kế Lucas Sterling chấm điểm phiếu KPI và gửi đề xuất thăng chức, tăng lương tới Hội đồng Lương thưởng.","1. Characters \u0026 Roles: Meridian Media Group issues annual appraisal policy; Senior UX Designer Karen Choi is evaluated; VP of Design Lucas Sterling signs off on her KPI scorecard and submits a promotion/merit adjustment recommendation."]],[["2. Boi canh \u0026 Quy trinh loi"],["2. Bối cảnh \u0026 Quy trình lõi: Chu kỳ đánh giá hiệu suất thường niên năm 2026. Thang điểm 5 bậc quy định Hạng 5 (95-100 điểm) được tăng lương 7,5%-9,0% và ưu tiên thăng chức ➔ Karen Choi đạt 96/100 điểm (Hạng 5) nhờ giảm 28% tỷ lệ bỏ giỏ hàng và xây dựng thư viện Figma cho 80 kỹ sư ➔ Đề xuất thăng chức lên Lead UX Architect và tăng lương 8,5% từ 1/10.","2. Context \u0026 Core Workflow: FY2026 annual performance evaluation cycle. Policy defines Rating 5 (95-100 pts) yielding 7.5%-9.0% merit raises and promotion eligibility ➔ Karen Choi scores 96/100 (Tier 5) by cutting checkout drop-offs by 28% and building enterprise Figma library ➔ Recommended for promotion to Lead UX Architect with 8.5% merit raise effective Oct 1."]],[["3. Dau vet suy luan cheo"],["3. Dấu vết suy luận chéo: Móc nối khung tăng lương 7,5%-9,0% ở Văn bản 1 với điểm số 96 điểm (Hạng 5) ở Văn bản 2; đối chiếu đề xuất tăng lương 8,5% ở Văn bản 3 để thấy con số này nằm chính xác trong khung quy định; liên kết thành tích giảm 28% bỏ giỏ hàng ở Văn bản 2 với mức tăng doanh thu 4,8 triệu USD ở Văn bản 3.","3. Cross-Referencing Clues: Linking the 7.5%-9.0% salary band in Passage 1 with the 96 composite score (Rating 5) in Passage 2; verifying that the 8.5% raise requested in Passage 3 conforms strictly to the policy band; correlating the 28% checkout drop-off reduction in Passage 2 with the $4.8M revenue uptick in Passage 3."]]],"t":"table"},"ĐÁP ÁN CHI TIẾT \u0026 BÓC TÁCH BẪY ETS","What is the primary purpose of the first document?","Dap an dung: (B) To outline the grading criteria and salary adjustment framework for annual evaluations","[Dau vet bai doc / Clue]: Văn bản 1, Tiêu đề \u0026 Đoạn 1: \u0027EXECUTIVE POLICY DIRECTIVE: ANNUAL PERFORMANCE APPRAISAL \u0026 MERIT ADJUSTMENT... implements a standardized 5-tier performance rating matrix across all business units. Annual merit salary increases and executive promotion eligibility are strictly calibrated...\u0027","[Dien dat tuong duong / Paraphrase]: annual performance appraisal \u0026 merit adjustment... 5-tier rating matrix ➔ outline the grading criteria and salary adjustment framework for annual evaluations","[Loi giai chi tiet]: Văn bản 1 là chỉ thị chính sách điều hành của tập đoàn nêu rõ các tiêu chí phân hạng hiệu suất 5 bậc và khung tăng lương theo năng lực trong kỳ đánh giá thường niên.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) To announce a corporate relocation to a new headquarters facility","- Ly do sai: Văn bản về đánh giá nhân sự nội bộ, không phải thông báo chuyển trụ sở công ty.","- Bay ETS: Bẫy Chuyển Trụ sở Doanh nghiệp (Corporate Relocation Trap)","(C) To solicit client feedback regarding recent digital advertising campaigns","- Ly do sai: Đây là quy định quản trị nhân sự nội bộ, không phải phiếu khảo sát ý kiến khách hàng.","- Bay ETS: Bẫy Khảo sát Khách hàng (Client Survey Trap)","(D) To explain emergency evacuation procedures in the Chicago building","- Ly do sai: Tài liệu không đề cập đến diễn tập hay quy trình sơ tán phòng cháy chữa cháy.","- Bay ETS: Bẫy Sơ tán Khẩn cấp (Emergency Evacuation Trap)","According to the policy directive, what merit increase percentage range is designated for a Rating 5 performance?","Dap an dung: (D) 7.5% – 9.0%","[Dau vet bai doc / Clue]: Văn bản 1, Phần Rating 5: \u0027• Rating 5: Far Exceeds Expectations (Score: 95 – 100) Eligible for a 7.5% – 9.0% annualized merit salary increase...\u0027","[Dien dat tuong duong / Paraphrase]: Rating 5... 7.5% – 9.0% annualized merit salary increase ➔ 7.5% – 9.0%","[Loi giai chi tiet]: Chỉ thị ở Văn bản 1 ghi rõ: nhân viên đạt Xếp loại 5 (Far Exceeds Expectations, điểm từ 95-100) sẽ đủ điều kiện nhận mức tăng lương theo năng lực từ 7,5% đến 9,0%.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) 0% – 1.5%","- Ly do sai: Khung 0% – 1,5% áp dụng cho Xếp loại 2 (Needs Improvement).","- Bay ETS: Bẫy Khung Điểm Cần Cải thiện (Needs Improvement Band Trap)","(B) 3.0% – 4.5%","- Ly do sai: Khung 3,0% – 4,5% áp dụng cho Xếp loại 3 (Meets Expectations).","- Bay ETS: Bẫy Khung Điểm Đạt Yêu cầu (Meets Expectations Band Trap)","(C) 5.5% – 7.0%","- Ly do sai: Khung 5,5% – 7,0% áp dụng cho Xếp loại 4 (Exceeds Expectations).","- Bay ETS: Bẫy Khung Điểm Cận Kề (Adjacent Tier 4 Trap)","What is indicated about Ms. Choi in the evaluation scorecard?","Dap an dung: (B) Her work directly contributed to a significant reduction in customer checkout drop-offs.","[Dau vet bai doc / Clue]: Văn bản 2, Mục 1: \u0027...reducing user checkout abandonment by 28%.\u0027","[Dien dat tuong duong / Paraphrase]: reducing user checkout abandonment by 28% ➔ directly contributed to a significant reduction in customer checkout drop-offs","[Loi giai chi tiet]: Trong bảng điểm đánh giá, thành tích nổi bật của cô Karen Choi là tái thiết kế giao diện giúp giảm 28% tỷ lệ người dùng bỏ dở quá trình thanh toán (checkout abandonment).","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) She will be placed on a 60-day mandatory Performance Improvement Plan","- Ly do sai: Kế hoạch PIP 60 ngày chỉ dành cho người bị Xếp loại 2, trong khi cô Choi đạt Xếp loại 5 xuất sắc.","- Bay ETS: Bẫy Áp Chế tài PIP (PIP Misapplication Trap)","(C) She recently joined the company as an entry-level junior graphic intern","- Ly do sai: Cô Choi là Nhà thiết kế Cấp cao (Senior Designer) và trực tiếp kèm cặp 4 nhân sự cấp dưới, không phải thực tập sinh.","- Bay ETS: Bẫy Cấp bậc Thực tập sinh (Junior Intern Confusion Trap)","(D) She failed to meet her project deadlines in the cross-functional collaboration category","- Ly do sai: Cô đạt 94/100 điểm ở tiêu chí phối hợp liên phòng ban, hoàn toàn hoàn thành xuất sắc nhiệm vụ.","- Bay ETS: Bẫy Trượt Tiến độ Dự án (Missed Deadline Trap)","In the evaluation scorecard, the word \u0027overhaul\u0027 in dimension 1 is closest in meaning to:","Dap an dung: (B) reconstruction","[Dau vet bai doc / Clue]: Văn bản 2, Tiêu chí 1: \u0027Spearheaded the comprehensive design overhaul of the Meridian Cloud platform, dramatically simplifying navigation architecture...\u0027","[Dien dat tuong duong / Paraphrase]: design overhaul ➔ comprehensive reconstruction / redesign / revamp","[Loi giai chi tiet]: Từ \u0027overhaul\u0027 trong ngữ cảnh thiết kế phần mềm có nghĩa là cuộc đại tu, tái thiết kế và xây dựng lại toàn diện (reconstruction).","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) cancellation","- Ly do sai: \u0027Cancellation\u0027 có nghĩa là hủy bỏ dự án, trái ngược hoàn toàn với việc tái thiết kế thành công.","- Bay ETS: Bẫy Hủy bỏ Dự án (Cancellation Antonym Trap)","(C) postponement","- Ly do sai: \u0027Postponement\u0027 có nghĩa là trì hoãn thời gian.","- Bay ETS: Bẫy Trì hoãn Thời gian (Delay Trap)","(D) inspection","- Ly do sai: \u0027Inspection\u0027 có nghĩa là thanh tra sơ bộ, không thể hiện hành động tái cấu trúc hệ thống.","- Bay ETS: Bẫy Thanh tra Kiểm tra (Inspection Confusion Trap)","What specific salary increase percentage does Mr. Sterling recommend for Ms. Choi?","Dap an dung: (C) 8.5%","[Dau vet bai doc / Clue]: Văn bản 3, Mục 2: \u00272. Base Salary Adjustment: An 8.5% merit salary increase, reflecting her top-tier scorecard rating (within the authorized 7.5% – 9.0% band).\u0027","[Dien dat tuong duong / Paraphrase]: An 8.5% merit salary increase ➔ 8.5%","[Loi giai chi tiet]: Trong email gửi Hội đồng Lương thưởng, ông Lucas Sterling đề xuất mức tăng lương cơ bản cụ thể cho cô Karen Choi là 8,5% (nằm trong biên độ cho phép từ 7,5% đến 9,0% của Hạng 5).","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) 4.5%","- Ly do sai: 4,5% là mức tối đa của Xếp loại 3.","- Bay ETS: Bẫy Số liệu Hạng Ba (Tier 3 Ceiling Trap)","(B) 7.0%","- Ly do sai: 7,0% là mức trần của Xếp loại 4.","- Bay ETS: Bẫy Mức trần Hạng Bốn (Tier 4 Maximum Trap)","(D) 10.0%","- Ly do sai: Mức 10,0% vượt quá biên độ tối đa 9,0% của tập đoàn và không được đề xuất.","- Bay ETS: Bẫy Số liệu Vượt khung (Unauthorized Percentage Trap)","PHƯƠNG PHÁP FEYNMAN - BẢN THUYẾT MINH BẬC THẦY","4.1 QUY TRÌNH NGHIỆP VỤ 3 BƯỚC TUẦN TỰ (DUAL SEQUENTIAL WORKFLOWS)","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","BAN HÀNH KHUNG ĐÁNH GIÁ 5 BẬC \u0026 TRỌNG SỐ KPI"],[],["BƯỚC 2","CHẤM ĐIỂM PHIẾU NĂNG LỰC \u0026 XÁC THỰC THÀNH TỰU"],[],["BƯỚC 3","ĐỆ TRÌNH THĂNG CHỨC \u0026 PHÊ DUYỆT TĂNG LƯƠNG 8.5%"]],[["• Chung tu \u0026 Kenh: Hội Đồng Quản Trị Nhân Sự \u0026 Cổng Thông Tin Chính Sách Doanh Nghiệp","• Nghiep vu thuc thi: Ban hành chỉ thị đánh giá thường niên ➔ Quy định Hạng 5 (95-100 điểm) được tăng lương 7,5%-9,0% và ưu tiên xét thăng chức lãnh đạo.","• Ket qua \u0026 Kiem soat: Khung chuẩn mực đo lường minh bạch, liên kết trực tiếp giữa đóng góp và đãi ngộ."],["➔"],["• Chung tu \u0026 Kenh: Phiếu Đánh Giá Hiệu Suất FY2026 \u0026 Báo Cáo Đo Lường Trải Nghiệm Người Dùng","• Nghiep vu thuc thi: Lucas Sterling chấm Karen Choi đạt 96/100 (Hạng 5) ➔ Xác nhận thành tích giảm 28% tỷ lệ bỏ giỏ hàng và xây dựng thư viện Figma cho 80 kỹ sư.","• Ket qua \u0026 Kiem soat: Hồ sơ đánh giá hiệu suất xuất sắc với các bằng chứng định lượng không thể bác bỏ."],["➔"],["• Chung tu \u0026 Kenh: Hội Đồng Lương Thưởng \u0026 Hệ Thống Bảng Lương ERP Doanh Nghiệp","• Nghiep vu thuc thi: Gửi email đề xuất thăng chức lên Lead UX Architect, tăng lương 8,5% và thưởng 800 RSU ➔ HR chốt phụ lục hợp đồng áp dụng từ 1/10.","• Ket qua \u0026 Kiem soat: Hoàn tất chu trình tưởng thưởng nhân tài, khích lệ động lực cống hiến lâu dài."]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["PHASE 1","POLICY GOVERNANCE \u0026 5-TIER KPI CALIBRATION"],[],["PHASE 2","SCORECARD EVALUATION \u0026 QUANTITATIVE IMPACT AUDIT"],[],["PHASE 3","EXECUTIVE ADVANCEMENT \u0026 8.5% MERIT ALLOCATION"]],[["• Documents \u0026 Channels: Compensation Committee Directives \u0026 Enterprise HR Intranet Portal","• Core Business Execution: Publish annual performance framework ➔ Establish Tier 5 (95-100 pts) merit band at 7.5%-9.0% with executive promotion fast-tracking.","• Key Deliverable \u0026 Control: Transparent performance-to-reward architecture aligning individual output with enterprise growth."],["➔"],["• Documents \u0026 Channels: FY2026 Performance Appraisal Scorecard \u0026 Product Analytics Dashboard","• Core Business Execution: Audit Karen Choi\u0027s output at 96/100 (Tier 5) ➔ Verify 28% drop in checkout abandonment and enterprise Figma design system adoption by 80+ engineers.","• Key Deliverable \u0026 Control: Empirically verified top-tier appraisal dossier ready for compensation review."],["➔"],["• Documents \u0026 Channels: Corporate Compensation \u0026 Benefits Committee \u0026 Enterprise Payroll Ledger","• Core Business Execution: Submit formal advancement to Lead UX Architect with 8.5% merit raise and 800 RSUs ➔ HR finalizes contract addendum effective October 1.","• Key Deliverable \u0026 Control: Closed-loop talent retention execution reinforcing high-performance corporate culture."]]],"t":"table"},"4.2 BẢN THUYẾT MINH FEYNMAN SONG NGỮ (ĐA GÓC NHÌN NGHIỆP VỤ)","• Bức tranh Toàn cảnh Nghiệp vụ (End-to-End Business Flow): Quy trình Đánh giá Hiệu suất Thường niên \u0026 Tăng lương theo Năng lực (Performance Appraisal \u0026 Merit Allocation) là trụ cột giữ chân nhân tài của các tập đoàn. Một chu trình hoàn chỉnh gồm 3 bước: Tập đoàn ban hành thang xếp loại và biên độ tăng lương minh bạch ➔ Cấp quản lý trực tiếp đánh giá nhân viên dựa trên các trọng số KPI định lượng (chất lượng công việc, tốc độ, tinh thần đồng đội và kèm cặp cấp dưới) ➔ Hội đồng Lương thưởng phê duyệt mức tăng lương cụ thể và bổ nhiệm thăng chức. Bất kỳ sự chênh lệch nào ngoài khung quy định đều bị hệ thống ERP từ chối.","• Lăng kính Viễn thông / CNTT Viettel: Tại Tập đoàn Viettel, công tác đánh giá cán bộ nhân viên được thực hiện định kỳ theo hệ thống KPI và phương pháp OKR hiện đại. Mỗi kỹ sư phần mềm hay chuyên viên kinh doanh đều có các chỉ tiêu số hóa rõ ràng (như thời gian giải quyết sự cố, tỷ lệ chuyển đổi khách hàng trên app MyViettel, doanh thu gói cước). Nhân sự đạt loại Xuất sắc (A+) không chỉ được nâng lương theo ngạch bậc mà còn được ưu tiên quy hoạch nguồn cán bộ quản lý trẻ và trao tặng các danh hiệu thi đua toàn quân.","• Lăng kính Quản trị Mầm non Ước Mơ Xanh: Tại trường mầm non, đánh giá giáo viên cuối năm học là cơ sở bình bầu thi đua: Ban Giám hiệu chấm điểm các cô theo 4 tiêu chí (Hồ sơ giáo án sáng tạo, Tỷ lệ trẻ khỏe mạnh tăng cân, Sự hài lòng của phụ huynh, và Hoạt động văn thể mỹ). Những cô giáo đạt loại Xuất sắc được nhà trường thăng chức Tổ trưởng Chuyên môn, nâng bậc phụ cấp thâm niên và tặng thưởng chuyến du lịch hè cho gia đình.","• Lăng kính Bàn học Gia đình (Kèm cặp Bé Hà Ngân Lớp Lá 5 Tuổi): Để giải thích cho bé Hà Ngân, ba dùng hình ảnh phiếu Bé Ngoan: \u0027Hà Ngân ơi, cuối tuần cô giáo phát phiếu Bé Ngoan cho các bạn. Nếu bạn nào cả tuần vừa ăn ngoan hết bát, vừa biết xếp đồ chơi gọn gàng, lại còn giúp cô phát vở cho các bạn thì được cô chấm điểm 10 xuất sắc và tặng vương miện ngôi sao nhỏ đúng không? Cô Karen đi làm cũng vậy, cô vẽ giao diện máy tính đẹp giúp bán được nhiều đồ chơi hơn và dạy các em nhỏ làm việc, thế là bác Giám đốc khen thưởng cô được thăng chức to hơn và thưởng thêm tiền lương để mua quà bánh đấy!\u0027","4.3 PHÂN TÍCH CHUYÊN SÂU DÀNH CHO BUSINESS ANALYST (ENGLISH BA PERSPECTIVE)","• Algorithmic Calibration in Enterprise Performance Management (EPM): Business Analysts designing EPM modules must enforce strict mathematical validation rules. When an appraisal score is calculated via weighted multi-variable dimensions (25% + 30% + 25% + 20% = 100%), the composite score (96) automatically resolves to a specific policy tier (Tier 5). The system must restrict manager input fields so that recommended salary raises (8.5%) cannot exceed the pre-authorized ceiling (7.5% - 9.0%) without two levels of executive executive override.","• Business Case Articulation for Out-of-Cycle Merit Promotions: A critical competency for BAs and business leaders is connecting human capital performance to balance-sheet business outcomes. In Mr. Sterling\u0027s justification memo, Karen Choi\u0027s promotion is not defended on subjective sentiment, but on audited metrics: a 28% decrease in checkout drop-offs translating directly to $4.8 million in top-line annualized revenue. BAs must ensure that HRIS platforms capture and link project ROI data directly to promotion nomination workflows.","BỘ TỪ VỰNG CHUYÊN ĐỀ TINH HOA (SPECIALIZED VOCABULARY MASTERY)","Performance Appraisal  /pɚˈfɔːr.məns əˈpreɪ.zəl/  Annual Review / Employee Evaluation / Performance Assessment / Competency Audit / Scorecard Review","Nghia: Đánh giá hiệu suất làm việc, quy trình định kỳ hàng năm hoặc nửa năm của doanh nghiệp nhằm xem xét, đo lường và xếp loại kết quả công việc và năng lực của nhân viên.","Vd: During her annual performance appraisal, the designer received top marks for technical innovation and mentorship. - Trong kỳ đánh giá hiệu suất hàng năm, nữ nhà thiết kế đã nhận điểm số cao nhất về đổi mới kỹ thuật và đào tạo kèm cặp.","Merit Increase  /ˈmer.ɪt ˈɪn.kriːs/  Performance-Based Raise / Merit Salary Adjustment / Incentive Salary Increment / Merit Pay Adjustment","Nghia: Tăng lương theo năng lực/thành tích, khoản tăng tỷ lệ phần trăm lương cơ bản được trao cho nhân viên dựa trên kết quả hoàn thành xuất sắc các chỉ tiêu công việc.","Vd: Employees achieving a Tier 5 rating were rewarded with an 8.5% annualized merit increase. - Những nhân viên đạt xếp hạng Hạng 5 đã được tưởng thưởng mức tăng lương theo năng lực thường niên 8,5%.","Overhaul  /ˈoʊ.vɚ.hɑːl/  Revamp / Complete Reconstruction / Modernization / Redesign / Thorough Renovation","Nghia: Cải tổ, đại tu, sửa đổi và xây dựng lại toàn bộ một hệ thống, quy trình hoặc giao diện phần mềm để nâng cao hiệu năng hoạt động.","Vd: The comprehensive design overhaul of the cloud platform eliminated technical debt and improved page loading speed. - Cuộc cải tổ thiết kế toàn diện của nền tảng đám mây đã loại bỏ nợ kỹ thuật và cải thiện tốc độ tải trang.","Composite Score  /kəmˈpɑː.zɪt skɔːr/  Aggregate Rating / Overall Weighted Score / Cumulative Evaluation Index / Total Grade","Nghia: Điểm số tổng hợp, điểm số chung cuộc được tính toán bằng cách nhân điểm từng tiêu chuẩn năng lực với trọng số phần trăm tương ứng của nó.","Vd: Her impressive composite score of 96 out of 100 placed her firmly in the highest performance category. - Điểm số tổng hợp ấn tượng 96 trên 100 điểm đã đưa cô đứng vững chắc trong nhóm hiệu suất cao nhất.","Abandonment Rate  /əˈbæn.dən.mənt reɪt/  Drop-Off Percentage / Churn Proportion / Desertion Metric / Incompletion Ratio","Nghia: Tỷ lệ bỏ dở, tỷ lệ phần trăm người dùng bắt đầu một quy trình (như mua hàng trực tuyến hay điền form) nhưng rời đi trước khi hoàn tất.","Vd: Optimizing the payment screen architecture reduced checkout abandonment rate by nearly thirty percent. - Việc tối ưu hóa cấu trúc màn hình thanh toán đã giảm tỷ lệ bỏ dở giỏ hàng gần ba mươi phần trăm.","Performance Improvement Plan (PIP)  /pɚˈfɔːr.məns ɪmˈpruːv.mənt plæn/  Corrective Action Plan / Remedial Coaching Program / Probationary Improvement Track","Nghia: Kế hoạch cải thiện hiệu suất, chương trình hỗ trợ có cấu trúc và giám sát trong thời hạn cố định (thường 60-90 ngày) dành cho nhân viên chưa đạt yêu cầu công việc.","Vd: Employees receiving a Rating 2 are placed on a structured 60-day Performance Improvement Plan with weekly milestones. - Những nhân viên nhận Xếp loại 2 sẽ bị đưa vào Kế hoạch Cải thiện Hiệu suất kéo dài 60 ngày với các cột mốc kiểm tra hàng tuần.","==================================================================================================","BÀI 5: KẾ HOẠCH CẢI THIỆN HIỆU SUẤT PIP \u0026 ĐÀO TẠO TÁI ĐỊNH HƯỚNG KỸ NĂNG (PERFORMANCE IMPROVEMENT PLAN \u0026 REMEDIAL COACHING MILESTONES)","ETS TOEIC - Double Passage (Q181-185) - Performance Improvement Plan (PIP), Sales Quota Turnaround \u0026 Remedial Evaluation","BÀI TẬP VÀ PHƯƠNG PHÁP GIẢI TOEIC PART 7 THEO NGUYÊN BẢN (FIRST PRINCIPLES)","1. ĐỀ BÀI GỐC (BILINGUAL CONTEXT: FORMAL PIP NOTICE \u0026 30-DAY PROGRESS EVALUATION)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","PIP NOTIFICATION MEMORANDUM","APEX CLOUD COMMUNICATIONS INC. — ATLANTA, GA","CONFIDENTIAL HUMAN RESOURCES MEMORANDUM","TO: Liam Patel, Senior Enterprise Account Executive","FROM: Sandra Bennett, Regional Vice President of Enterprise Sales","DATE: February 2","SUBJECT: Formal Notification: Placement on 60-Day Performance Improvement Plan (PIP)","Dear Liam,","This memorandum serves as formal notification that you are being placed on a binding 60-day Performance Improvement Plan (PIP), effective Monday, February 5, concluding on Friday, April 6. This corrective action is necessitated by sustained sales quota underperformance during Q4 2025, where you secured only 4 new enterprise cloud subscription contracts against your designated quarterly quota of 12 (representing a 33% quota attainment rate), accompanied by an elevated customer churn rate.","To restore your standing as an account executive in good standing, you must achieve the following concrete milestones within the 60-day remediation window:","1. Remedial Professional Development: Complete all four modules of our Advanced Consultative Enterprise Solution Selling workshop on the corporate LMS by Day 30 (March 6).","2. Account Re-engagement: Conduct verified exploratory discovery calls with at least 25 dormant or stalled enterprise accounts.","3. Revenue \u0026 Contract Target: Successfully close a minimum of 8 new qualified enterprise software contracts generating at least $400,000 in Annual Recurring Revenue (ARR) before April 6.","4. Supervised Governance: Attend bi-weekly progress reviews with myself and our designated HR Business Partner, Victoria Sterling.","Please understand that failure to demonstrate substantial, measurable improvement across these targets by April 6 will result in immediate termination of your employment.","MIDTERM EVALUATION MEMORANDUM","APEX CLOUD COMMUNICATIONS INC.","MIDTERM PIP PROGRESS EVALUATION AUDIT","TO: Liam Patel, Senior Enterprise Account Executive","FROM: Sandra Bennett (VP of Sales) \u0026 Victoria Sterling (HR Business Partner)","DATE: March 6","SUBJECT: 30-Day Performance Milestone Review — Commendable Turnaround Progress","Dear Liam,","We convened today to conduct your scheduled 30-day formal milestone audit under the Performance Improvement Plan instituted on February 5. We are exceptionally pleased to record remarkable progress across your assigned remediation tracks:","• Professional Development Track: 100% Completed. You successfully passed all four consultative sales modules ahead of schedule, earning an advanced certification in Enterprise Value Selling on February 26.","• Client Pipeline Activity: Target Exceeded. You documented 32 formal discovery sessions with dormant enterprise accounts, surpassing your required quota of 25.","• Revenue Progress: Strong Momentum. Over the past 30 days, you have already closed 5 new enterprise software contracts totaling $280,000 in verified Annual Recurring Revenue (ARR).","Having delivered over 60% of your 60-day revenue milestone in the first month, your trajectory demonstrates exemplary professional commitment. To formally conclude the PIP and be restored to full regular employment status without further probationary oversight, you are required to secure just 3 additional closed enterprise contracts (reaching the mandatory 8-contract target) prior to April 6.","Sincerely,","Sandra Bennett, VP of Sales","Victoria Sterling, Lead HR Business Partner","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","181. What is the primary purpose of the first memorandum?","(A) To congratulate an employee on earning an annual President\u0027s Club award","(B) To officially notify a sales executive of mandatory placement on a corrective performance plan","(C) To announce an enterprise-wide reduction in quarterly commission rates","(D) To solicit volunteers for a charitable community outreach campaign","182. According to the first document, how many enterprise contracts did Mr. Patel close in Q4 2025?","(A) 4","(B) 8","(C) 12","(D) 25","183. What is indicated about Mr. Patel\u0027s performance in the midterm evaluation?","(A) He failed to complete any of the required sales training modules.","(B) He generated over half of his required 60-day revenue target within the first 30 days.","(C) He submitted an official request for an emergency medical leave of absence.","(D) He refused to attend his scheduled bi-weekly supervisory meetings.","184. In the first memorandum, the word \u0027attainment\u0027 in paragraph 1, line 4 is closest in meaning to:","(A) achievement","(B) reduction","(C) postponement","(D) exploration","185. According to the midterm review, how many more contracts must Mr. Patel close before April 6 to conclude the PIP?","(A) 3","(B) 5","(C) 7","(D) 10","2. CHIẾN LƯỢC ĐỌC HIỂU 5 PHÚT TỐI ƯU (FIRST PRINCIPLES STRATEGY)","CHIẾN THUẬT 5 PHÚT TỐI ƯU: NẮM BẮT BỐI CẢNH, GHÉP NỐI DỮ KIỆN \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Quét Z-Pattern: Quét nhanh 2 văn bản: Văn bản 1 là Thông báo Áp dụng Kế hoạch Cải thiện Hiệu suất 60 ngày (PIP Notice) từ Giám đốc Kinh doanh Sandra Bennett gửi Chuyên viên Tài khoản Doanh nghiệp Liam Patel do chỉ đạt 4/12 hợp đồng trong Quý 4, yêu cầu chốt 8 hợp đồng mới ($400k ARR); Văn bản 2 là Báo cáo Đánh giá Tiến độ Giữa kỳ 30 Ngày (30-Day Midterm Review) ghi nhận Liam đã hoàn thành 4 khóa huấn luyện và chốt được 5 hợp đồng ($280k ARR), chỉ cần thêm 3 hợp đồng để thoát khỏi diện giám sát.","Bước 2 (60 giây) - Móc nối Logic \u0026 Sơ đồ Tinh thần: Thiết lập chuỗi khắc phục hiệu suất nhân sự: Xác định điểm nghẽn hiệu suất và áp PIP 60 ngày (Văn bản 1: mục tiêu 8 hợp đồng, hoàn thành 4 học phần bán hàng, kết nối lại 25 khách hàng cũ trước 6/4) ➔ Đo lường tiến độ giữa kỳ 30 ngày (Văn bản 2: đã chốt 5/8 hợp đồng, đạt $280k/$400k doanh số, hoàn thành 100% khóa học) ➔ Xác nhận điều kiện dỡ bỏ chế tài (chỉ cần ký thêm 3 hợp đồng nữa trước ngày 6/4).","Bước 3 (120 giây) - Định vị Manh mối \u0026 Giải đề Tốc độ: Câu 181 hỏi mục đích chính của văn bản 1 (thông báo đưa nhân viên vào kế hoạch khắc phục hiệu suất có thời hạn); Câu 182 hỏi số lượng hợp đồng Liam ký được trong Quý 4 (4 hợp đồng); Câu 183 (câu hỏi liên kết) hỏi nhận định đúng sau 30 ngày (đã hoàn thành hơn một nửa mục tiêu tài chính 60 ngày); Câu 184 (từ vựng theo ngữ cảnh) hỏi từ \u0027attainment\u0027 trong đoạn 1 (đồng nghĩa với achievement); Câu 185 (câu hỏi liên kết) hỏi số hợp đồng còn thiếu để hoàn tất PIP (3 hợp đồng nữa).","Bước 4 (30 giây) - Đúc kết Feynman 1 Câu: Hiểu bản chất: Kế hoạch Cải thiện Hiệu suất (PIP) không phải là sa thải ngay mà là cơ hội tái đào tạo có giám sát nghiêm ngặt với các mục tiêu định lượng đo lường theo từng chặng (30 ngày và 60 ngày) để cứu vãn nhân sự trước khi áp dụng chế tài chấm dứt hợp đồng.","3. BẢN DỊCH SONG NGỮ TOÀN VĂN (BILINGUAL PARALLEL TRANSLATION)","VĂN BẢN 1: THÔNG BÁO ÁP DỤNG KẾ HOẠCH CẢI THIỆN HIỆU SUẤT (APEX CLOUD)","APEX CLOUD COMMUNICATIONS INC. — ATLANTA, GA","CONFIDENTIAL HUMAN RESOURCES MEMORANDUM","TO: Liam Patel, Senior Enterprise Account Executive","FROM: Sandra Bennett, Regional Vice President of Enterprise Sales","DATE: February 2","SUBJECT: Formal Notification: Placement on 60-Day Performance Improvement Plan (PIP)","CÔNG TY APEX CLOUD COMMUNICATIONS — ATLANTA, GA","BẢN GHI NHỚ NHÂN SỰ BẢO MẬT","GỬI: Liam Patel, Chuyên viên Quản lý Khách hàng Doanh nghiệp Cấp cao","TỪ: Sandra Bennett, Phó Chủ tịch Khu vực Phụ trách Kinh doanh Doanh nghiệp","NGÀY: 2 tháng 2","CHỦ ĐỀ: Thông báo Chính thức: Áp dụng Kế hoạch Cải thiện Hiệu suất (PIP) trong 60 Ngày","Dear Liam,","This memorandum serves as formal notification that you are being placed on a binding 60-day Performance Improvement Plan (PIP), effective Monday, February 5, concluding on Friday, April 6. This corrective action is necessitated by sustained sales quota underperformance during Q4 2025, where you secured only 4 new enterprise cloud subscription contracts against your designated quarterly quota of 12 (representing a 33% quota attainment rate), accompanied by an elevated customer churn rate.","Kính gửi Liam,","Bản ghi nhớ này đóng vai trò như một thông báo chính thức rằng bạn đang được đưa vào Kế hoạch Cải thiện Hiệu suất (PIP) bắt buộc kéo dài 60 ngày, có hiệu lực từ Thứ Hai ngày 5 tháng 2 và kết thúc vào Thứ Sáu ngày 6 tháng 4. Biện pháp khắc phục này là cần thiết do kết quả doanh số không đạt chỉ tiêu kéo dài trong Quý 4 năm 2025, khi bạn chỉ ký được 4 hợp đồng thuê bao đám mây doanh nghiệp mới so với chỉ tiêu quý được giao là 12 hợp đồng (tương ứng với tỷ lệ hoàn thành chỉ tiêu 33%), kèm theo tỷ lệ khách hàng rời bỏ dịch vụ gia tăng.","To restore your standing as an account executive in good standing, you must achieve the following concrete milestones within the 60-day remediation window:","1. Remedial Professional Development: Complete all four modules of our Advanced Consultative Enterprise Solution Selling workshop on the corporate LMS by Day 30 (March 6).","2. Account Re-engagement: Conduct verified exploratory discovery calls with at least 25 dormant or stalled enterprise accounts.","3. Revenue \u0026 Contract Target: Successfully close a minimum of 8 new qualified enterprise software contracts generating at least $400,000 in Annual Recurring Revenue (ARR) before April 6.","4. Supervised Governance: Attend bi-weekly progress reviews with myself and our designated HR Business Partner, Victoria Sterling.","Để khôi phục vị thế là một chuyên viên kinh doanh có uy tín, bạn phải đạt được các cột mốc cụ thể sau đây trong thời hạn khắc phục 60 ngày:","1. Đào tạo Chuyên môn Khắc phục: Hoàn thành toàn bộ bốn học phần của khóa hội thảo Nâng cao về Bán Giải pháp Doanh nghiệp Tư vấn trên hệ thống LMS của công ty trước Ngày 30 (ngày 6 tháng 3).","2. Tái kết nối Khách hàng: Thực hiện các cuộc gọi khám phá nhu cầu đã xác thực với ít nhất 25 tài khoản doanh nghiệp không hoạt động hoặc đang bị đình trệ.","3. Chỉ tiêu Hợp đồng \u0026 Doanh thu: Ký kết thành công tối thiểu 8 hợp đồng phần mềm doanh nghiệp đủ điều kiện mới tạo ra ít nhất 400.000 USD Doanh thu Định kỳ Hàng năm (ARR) trước ngày 6 tháng 4.","4. Quản trị Có Giám sát: Tham gia các buổi đánh giá tiến độ hai tuần một lần cùng tôi và Đối tác Nhân sự Kinh doanh chuyên trách, bà Victoria Sterling.","Please understand that failure to demonstrate substantial, measurable improvement across these targets by April 6 will result in immediate termination of your employment.","Xin vui lòng hiểu rằng nếu không thể hiện được sự cải thiện rõ rệt, có thể đo lường được trên các mục tiêu này trước ngày 6 tháng 4, bạn sẽ đối mặt với việc chấm dứt hợp đồng lao động ngay lập tức.","VĂN BẢN 2: BÁO CÁO ĐÁNH GIÁ TIẾN ĐỘ GIỮA KỲ 30 NGÀY (APEX CLOUD)","APEX CLOUD COMMUNICATIONS INC.","MIDTERM PIP PROGRESS EVALUATION AUDIT","TO: Liam Patel, Senior Enterprise Account Executive","FROM: Sandra Bennett (VP of Sales) \u0026 Victoria Sterling (HR Business Partner)","DATE: March 6","SUBJECT: 30-Day Performance Milestone Review — Commendable Turnaround Progress","CÔNG TY APEX CLOUD COMMUNICATIONS","KIỂM TOÁN ĐÁNH GIÁ TIẾN ĐỘ PIP GIỮA KỲ","GỬI: Liam Patel, Chuyên viên Quản lý Khách hàng Doanh nghiệp Cấp cao","TỪ: Sandra Bennett (Phó Chủ tịch Kinh doanh) \u0026 Victoria Sterling (Đối tác Nhân sự)","NGÀY: 6 tháng 3","CHỦ ĐỀ: Đánh giá Cột mốc Hiệu suất 30 Ngày — Tiến độ Chuyển biến Đáng khen ngợi","Dear Liam,","We convened today to conduct your scheduled 30-day formal milestone audit under the Performance Improvement Plan instituted on February 5. We are exceptionally pleased to record remarkable progress across your assigned remediation tracks:","Kính gửi Liam,","Chúng tôi đã họp hôm nay để tiến hành đợt kiểm toán cột mốc 30 ngày chính thức theo lịch trình thuộc Kế hoạch Cải thiện Hiệu suất được ban hành vào ngày 5 tháng 2. Chúng tôi rất vui mừng ghi nhận những tiến bộ vượt bậc trên các hạng mục khắc phục được giao cho bạn:","• Professional Development Track: 100% Completed. You successfully passed all four consultative sales modules ahead of schedule, earning an advanced certification in Enterprise Value Selling on February 26.","• Client Pipeline Activity: Target Exceeded. You documented 32 formal discovery sessions with dormant enterprise accounts, surpassing your required quota of 25.","• Revenue Progress: Strong Momentum. Over the past 30 days, you have already closed 5 new enterprise software contracts totaling $280,000 in verified Annual Recurring Revenue (ARR).","• Hạng mục Phát triển Chuyên môn: Đã hoàn thành 100%. Bạn đã vượt qua toàn bộ bốn học phần bán hàng tư vấn trước thời hạn, nhận chứng chỉ nâng cao về Bán Giá trị Doanh nghiệp vào ngày 26 tháng 2.","• Hoạt động Phễu Khách hàng: Vượt Chỉ tiêu. Bạn đã ghi nhận 32 phiên thảo luận khám phá chính thức với các tài khoản doanh nghiệp cũ, vượt mức chỉ tiêu yêu cầu là 25.","• Tiến độ Doanh thu: Động lực Mạnh mẽ. Trong 30 ngày qua, bạn đã ký kết được 5 hợp đồng phần mềm doanh nghiệp mới với tổng trị giá 280.000 USD Doanh thu Định kỳ Hàng năm (ARR) đã xác thực.","Having delivered over 60% of your 60-day revenue milestone in the first month, your trajectory demonstrates exemplary professional commitment. To formally conclude the PIP and be restored to full regular employment status without further probationary oversight, you are required to secure just 3 additional closed enterprise contracts (reaching the mandatory 8-contract target) prior to April 6.","Sincerely,","Sandra Bennett, VP of Sales","Victoria Sterling, Lead HR Business Partner","Với việc đã hoàn thành hơn 60% cột mốc doanh thu 60 ngày chỉ trong tháng đầu tiên, quỹ đạo của bạn thể hiện sự cam kết nghề nghiệp mẫu mực. Để chính thức khép lại kế hoạch PIP và được khôi phục trạng thái nhân viên chính thức đầy đủ mà không còn chịu sự giám sát thử thách, bạn chỉ cần chốt thêm 3 hợp đồng doanh nghiệp nữa (để đạt mục tiêu bắt buộc là 8 hợp đồng) trước ngày 6 tháng 4.","Trân trọng,","Sandra Bennett, Phó Chủ tịch Kinh doanh","Victoria Sterling, Đối tác Nhân sự Kinh doanh Trưởng","4. DỊCH NGHĨA CÂU HỎI \u0026 ĐÁP ÁN (QUESTION \u0026 TRANSLATED OPTIONS)","181. Mục đích chủ yếu của bản ghi nhớ thứ nhất là gì?","(A) Chúc mừng một nhân viên đã giành được giải thưởng Câu lạc bộ Chủ tịch hàng năm","(B) Chính thức thông báo cho một chuyên viên kinh doanh về việc bắt buộc áp dụng kế hoạch khắc phục hiệu suất","(C) Công bố việc cắt giảm tỷ lệ hoa hồng định kỳ trên toàn doanh nghiệp","(D) Kêu gọi các tình nguyện viên tham gia chiến dịch tiếp cận cộng đồng từ thiện","182. Theo văn bản thứ nhất, ông Patel đã ký được bao nhiêu hợp đồng doanh nghiệp trong Quý 4 năm 2025?","(A) 4","(B) 8","(C) 12","(D) 25","183. Điều gì được chỉ ra về kết quả của ông Patel trong đợt đánh giá giữa kỳ?","(A) Ông không hoàn thành bất kỳ học phần đào tạo bán hàng bắt buộc nào.","(B) Ông đã tạo ra hơn một nửa chỉ tiêu doanh thu 60 ngày chỉ trong 30 ngày đầu tiên.","(C) Ông đã nộp đơn yêu cầu chính thức xin nghỉ phép y tế khẩn cấp.","(D) Ông từ chối tham gia các cuộc họp giám sát hai tuần một lần theo lịch trình.","184. Trong bản ghi nhớ thứ nhất, từ \u0027attainment\u0027 trong đoạn 1, dòng 4 gần nghĩa nhất với từ nào?","(A) Sự hoàn thành, đạt được chỉ tiêu (achievement / fulfillment)","(B) Sự cắt giảm, giảm thiểu (reduction)","(C) Sự trì hoãn thời gian (postponement)","(D) Sự thám hiểm, thăm dò (exploration)","185. Theo bản đánh giá giữa kỳ, ông Patel phải chốt thêm bao nhiêu hợp đồng trước ngày 6 tháng 4 để hoàn tất kế hoạch PIP?","(A) 3","(B) 5","(C) 7","(D) 10","5. CÔ ĐỌNG BÀI HỌC FEYNMAN (FEYNMAN CRITICAL TAKEAWAYS)","Key Structural \u0026 Vocabulary Takeaways (English)","• Performance Turnaround Architecture: Performance Improvement Plans (PIPs) in TOEIC pair qualitative re-skilling modules with strict time-bound quantitative quotas (e.g., contracts closed, ARR generated).","• Intermediate Milestone Verification: Tracking 30-day midterm milestones against 60-day overall thresholds demonstrates how candidates remediate performance gaps before formal contract action.","• High-Frequency Sales HR Lexicon: Master essential vocabulary including \u0027quota attainment\u0027, \u0027Annual Recurring Revenue (ARR)\u0027, \u0027dormant accounts\u0027, \u0027remediation window\u0027, and \u0027probationary oversight\u0027.","Bài học Cốt lõi \u0026 Quy tắc Tư duy (Tiếng Việt)","• Cấu trúc Kế hoạch Khắc phục Hiệu suất (PIP): Kế hoạch PIP trong bài thi TOEIC luôn kết hợp song hành giữa đào tạo lại kỹ năng mềm (re-skilling) và chỉ tiêu doanh số định lượng có thời hạn gắt gao (hợp đồng ký mới, doanh thu ARR).","• Đối chuẩn Tiến độ Giữa kỳ (Midterm Audit): Kỹ thuật suy luận chéo giữa mốc 30 ngày (đã đạt 5 hợp đồng / $280k) và mục tiêu 60 ngày (cần 8 hợp đồng / $400k) giúp tính toán chính xác phần còn thiếu (3 hợp đồng).","• Nhận diện Thuật ngữ Doanh số \u0026 Quản trị Nhân sự: Nắm vững \u0027quota attainment\u0027 (tỷ lệ hoàn thành chỉ tiêu), \u0027ARR\u0027 (doanh thu định kỳ hàng năm), \u0027dormant accounts\u0027 (khách hàng không hoạt động), và \u0027remediation window\u0027 (khung thời hạn khắc phục).","ACTIVE RECALL 5S (MA TRẬN TRUY XUẤT CHÉO DỮ LIỆU)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["1. Đối tượng \u0026 Vai trò: Sandra Bennett (Phó Chủ tịch Kinh doanh) và Victoria Sterling (Đối tác Nhân sự HRBP) giám sát nhân sự; Liam Patel (Chuyên viên Khách hàng Doanh nghiệp Cấp cao) bị áp dụng kế hoạch cải thiện hiệu suất 60 ngày do chỉ đạt 33% chỉ tiêu trong quý 4.","1. Characters \u0026 Roles: Sandra Bennett (VP of Sales) and Victoria Sterling (HRBP) govern performance; Senior Account Executive Liam Patel is placed on a 60-day PIP due to achieving only 33% of his Q4 sales quota."]],[["2. Boi canh \u0026 Quy trinh loi"],["2. Bối cảnh \u0026 Quy trình lõi: Quản trị hiệu suất và chuyển biến doanh số yếu kém. Quý 4 chỉ đạt 4/12 hợp đồng ➔ Áp dụng PIP 60 ngày (5/2 - 6/4) buộc học 4 khóa bán hàng, kết nối 25 khách hàng cũ và chốt 8 hợp đồng mới ($400k ARR) ➔ Đánh giá 30 ngày ghi nhận đã học xong, gọi 32 khách và chốt 5 hợp đồng ($280k ARR), chỉ cần ký thêm 3 hợp đồng để hoàn tất.","2. Context \u0026 Core Workflow: Remedial sales performance governance. Underperforming Q4 with 4/12 contracts ➔ Imposing 60-day PIP (Feb 5 - Apr 6) mandating 4 sales modules, 25 discovery calls, and 8 new contracts ($400k ARR) ➔ 30-day audit shows modules passed, 32 accounts called, and 5 contracts closed ($280k ARR), needing 3 more contracts to conclude PIP."]],[["3. Dau vet suy luan cheo"],["3. Dấu vết suy luận chéo: Móc nối mục tiêu 8 hợp đồng trong Văn bản 1 với kết quả 5 hợp đồng đã ký ở Văn bản 2 để xác nhận còn thiếu đúng 3 hợp đồng; đối chiếu mục tiêu 400.000 USD ở Văn bản 1 với con số 280.000 USD đạt được ở Văn bản 2 để kết luận hoàn thành trên 60% chỉ tiêu tài chính trong nửa thời gian.","3. Cross-Referencing Clues: Correlating the 8-contract mandate in Passage 1 with the 5 closed deals in Passage 2 to prove 3 deals remain; pairing the $400,000 ARR target in Passage 1 with the $280,000 achieved in Passage 2 to confirm over 60% revenue delivered in half the timeframe."]]],"t":"table"},"ĐÁP ÁN CHI TIẾT \u0026 BÓC TÁCH BẪY ETS","What is the primary purpose of the first memorandum?","Dap an dung: (B) To officially notify a sales executive of mandatory placement on a corrective performance plan","[Dau vet bai doc / Clue]: Văn bản 1, Tiêu đề \u0026 Đoạn 1: \u0027Formal Notification: Placement on 60-Day Performance Improvement Plan (PIP)... This memorandum serves as formal notification that you are being placed on a binding 60-day Performance Improvement Plan...\u0027","[Dien dat tuong duong / Paraphrase]: formal notification... placed on a binding 60-day Performance Improvement Plan ➔ officially notify a sales executive of mandatory placement on a corrective performance plan","[Loi giai chi tiet]: Văn bản 1 là thông báo nhân sự chính thức gửi chuyên viên kinh doanh Liam Patel về việc bắt buộc áp dụng kế hoạch cải thiện hiệu suất 60 ngày do kết quả doanh số không đạt chỉ tiêu.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) To congratulate an employee on earning an annual President\u0027s Club award","- Ly do sai: Văn bản xử lý kỷ luật hiệu suất kém, hoàn toàn không phải thư chúc mừng đạt giải thưởng kinh doanh xuất sắc.","- Bay ETS: Bẫy Khen thưởng Trái ngược (Award Congratulation Antonym Trap)","(C) To announce an enterprise-wide reduction in quarterly commission rates","- Ly do sai: Văn bản gửi riêng cá nhân ông Patel về chỉ tiêu cá nhân, không thông báo giảm tỷ lệ hoa hồng toàn công ty.","- Bay ETS: Bẫy Hoa hồng Doanh số (Commission Reduction Trap)","(D) To solicit volunteers for a charitable community outreach campaign","- Ly do sai: Tài liệu hoàn toàn không nhắc tới các hoạt động tình nguyện hay từ thiện cộng đồng.","- Bay ETS: Bẫy Hoạt động Xã hội (Charity Campaign Trap)","According to the first document, how many enterprise contracts did Mr. Patel close in Q4 2025?","Dap an dung: (A) 4","[Dau vet bai doc / Clue]: Văn bản 1, Đoạn 1: \u0027...where you secured only 4 new enterprise cloud subscription contracts against your designated quarterly quota of 12 (representing a 33% quota attainment rate)...\u0027","[Dien dat tuong duong / Paraphrase]: secured only 4 new enterprise cloud subscription contracts ➔ 4","[Loi giai chi tiet]: Văn bản 1 nêu rõ trong Quý 4 năm 2025, ông Patel chỉ ký được 4 hợp đồng mới so với chỉ tiêu giao là 12 hợp đồng.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(B) 8","- Ly do sai: 8 là số lượng hợp đồng mới ông phải ký được trong kế hoạch PIP 60 ngày.","- Bay ETS: Bẫy Mục tiêu PIP (PIP Target Trap)","(C) 12","- Ly do sai: 12 là chỉ tiêu doanh số được giao của Quý 4 mà ông đã không đạt được.","- Bay ETS: Bẫy Chỉ tiêu Quý Gốc (Original Quota Trap)","(D) 25","- Ly do sai: 25 là số lượng cuộc gọi tái kết nối với khách hàng cũ được yêu cầu trong PIP.","- Bay ETS: Bẫy Cuộc gọi Khám phá (Discovery Calls Trap)","What is indicated about Mr. Patel\u0027s performance in the midterm evaluation?","Dap an dung: (B) He generated over half of his required 60-day revenue target within the first 30 days.","[Dau vet bai doc / Clue]: Văn bản 1 yêu cầu 400.000 USD trong 60 ngày. Văn bản 2 xác nhận: \u0027...closed 5 new enterprise software contracts totaling $280,000 in verified Annual Recurring Revenue (ARR)... Having delivered over 60% of your 60-day revenue milestone in the first month...\u0027","[Dien dat tuong duong / Paraphrase]: $280k out of $400k (over 60%) in 30 days ➔ generated over half of his required 60-day revenue target within the first 30 days","[Loi giai chi tiet]: Bằng phương pháp suy luận chéo: Mục tiêu tài chính 60 ngày là 400.000 USD, nhưng chỉ sau 30 ngày đầu, ông Patel đã đạt 280.000 USD (chiếm trên 60%, tức hơn một nửa mục tiêu).","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) He failed to complete any of the required sales training modules","- Ly do sai: Ông đã hoàn thành 100% cả 4 học phần và nhận chứng chỉ trước thời hạn vào ngày 26/2.","- Bay ETS: Bẫy Phủ định Hoàn thành Đào tạo (Training Incompletion Trap)","(C) He submitted an official request for an emergency medical leave of absence","- Ly do sai: Ông Patel làm việc rất tích cực và không có đơn xin nghỉ phép ốm nào.","- Bay ETS: Bẫy Nghỉ ốm Khẩn cấp (Medical Leave Trap)","(D) He refused to attend his scheduled bi-weekly supervisory meetings","- Ly do sai: Ông đã tham gia buổi họp đánh giá giữa kỳ ngày 6/3 đúng quy định.","- Bay ETS: Bẫy Từ chối Họp Giám sát (Meeting Refusal Trap)","In the first memorandum, the word \u0027attainment\u0027 in paragraph 1, line 4 is closest in meaning to:","Dap an dung: (A) achievement","[Dau vet bai doc / Clue]: Văn bản 1, Đoạn 1: \u0027...representing a 33% quota attainment rate...\u0027","[Dien dat tuong duong / Paraphrase]: quota attainment rate ➔ quota achievement / fulfillment rate","[Loi giai chi tiet]: Thuật ngữ \u0027quota attainment\u0027 trong bán hàng có nghĩa là mức độ đạt được hoặc hoàn thành chỉ tiêu doanh số (achievement).","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(B) reduction","- Ly do sai: \u0027Reduction\u0027 có nghĩa là sự cắt giảm, giảm sút.","- Bay ETS: Bẫy Sự suy giảm (Reduction Trap)","(C) postponement","- Ly do sai: \u0027Postponement\u0027 có nghĩa là sự trì hoãn thời gian.","- Bay ETS: Bẫy Trì hoãn Thời gian (Postponement Trap)","(D) exploration","- Ly do sai: \u0027Exploration\u0027 có nghĩa là sự thăm dò, thám hiểm thị trường.","- Bay ETS: Bẫy Thăm dò Khám phá (Exploration Confusion Trap)","According to the midterm review, how many more contracts must Mr. Patel close before April 6 to conclude the PIP?","Dap an dung: (A) 3","[Dau vet bai doc / Clue]: Văn bản 2, Đoạn 4: \u0027To formally conclude the PIP and be restored to full regular employment status... you are required to secure just 3 additional closed enterprise contracts (reaching the mandatory 8-contract target) prior to April 6.\u0027","[Dien dat tuong duong / Paraphrase]: secure just 3 additional closed enterprise contracts ➔ 3","[Loi giai chi tiet]: Văn bản 2 nêu rõ: Để chính thức khép lại kế hoạch PIP và khôi phục hoàn toàn tư cách nhân viên chính thức, ông Patel chỉ cần ký thêm 3 hợp đồng nữa (đạt đủ mốc 8 hợp đồng) trước ngày 6 tháng 4.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(B) 5","- Ly do sai: 5 là số hợp đồng ông đã ký được trong 30 ngày đầu tiên.","- Bay ETS: Bẫy Số Hợp đồng Đã Ký (Already Closed Contracts Trap)","(C) 7","- Ly do sai: Con số 7 hoàn toàn không xuất hiện trong tài liệu.","- Bay ETS: Bẫy Số liệu Bịa đặt (Fabricated Figure Trap)","(D) 10","- Ly do sai: Con số 10 không phải là chỉ tiêu còn lại.","- Bay ETS: Bẫy Số Làm tròn Hư cấu (Arbitrary Number Trap)","PHƯƠNG PHÁP FEYNMAN - BẢN THUYẾT MINH BẬC THẦY","4.1 QUY TRÌNH NGHIỆP VỤ 3 BƯỚC TUẦN TỰ (DUAL SEQUENTIAL WORKFLOWS)","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","PHÁT HIỆN SỤT GIẢM DOANH SỐ \u0026 BAN HÀNH CHẾ TÀI PIP"],[],["BƯỚC 2","ĐÀO TẠO TƯ VẤN LẠI \u0026 TĂNG TỐC KẾT NỐI KHÁCH HÀNG"],[],["BƯỚC 3","KIỂM TOÁN GIỮA KỲ 30 NGÀY \u0026 XÁC LẬP CHỈ TIÊU VỀ ĐÍCH"]],[["• Chung tu \u0026 Kenh: Báo Cáo Doanh Thu Bán Hàng CRM \u0026 Biên Bản Nhân Sự Bảo Mật","• Nghiep vu thuc thi: Liam Patel chỉ đạt 4/12 hợp đồng Quý 4 (33% chỉ tiêu) ➔ Sandra Bennett ban hành PIP 60 ngày buộc hoàn thành 4 học phần và chốt 8 hợp đồng mới ($400k ARR).","• Ket qua \u0026 Kiem soat: Khuôn khổ khắc phục hiệu suất có tính ràng buộc pháp lý với chế tài rõ ràng."],["➔"],["• Chung tu \u0026 Kenh: Cổng Đào Tạo Trực Tuyến LMS \u0026 Hệ Thống Ghi Nhận Cuộc Gọi Khách Hàng","• Nghiep vu thuc thi: Liam hoàn thành 100% học phần bán hàng ngày 26/2 ➔ Thực hiện 32 cuộc gọi khám phá nhu cầu ➔ Chốt được 5 hợp đồng mới mang lại $280k ARR trong 30 ngày.","• Ket qua \u0026 Kiem soat: Sự chuyển biến ngoạn mục về năng lực bán hàng và động lực tài chính thực tế."],["➔"],["• Chung tu \u0026 Kenh: Hội Đồng Đánh Giá Giữa Kỳ (Phó Chủ Tịch Bán Hàng \u0026 Chuyên Viên HRBP)","• Nghiep vu thuc thi: Ghi nhận hoàn thành \u003e60% chỉ tiêu doanh số ➔ Ra thông báo động viên chỉ cần ký thêm 3 hợp đồng nữa trước 6/4 để chính thức xóa bỏ giám sát thử thách.","• Ket qua \u0026 Kiem soat: Cứu vãn nhân sự thành công, bảo vệ doanh thu công ty và giữ chân người tài."]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["PHASE 1","SALES QUOTA AUDIT \u0026 FORMAL PIP ISSUANCE"],[],["PHASE 2","SOLUTION SELLING RE-SKILLING \u0026 PIPELINE ACCELERATION"],[],["PHASE 3","30-DAY MIDTERM AUDIT \u0026 PIP EXIT ROADMAP"]],[["• Documents \u0026 Channels: CRM Pipeline Revenue Dashboard \u0026 Confidential HR Governance Notice","• Core Business Execution: Audit identifies Liam Patel at 33% quota in Q4 (4/12 contracts) ➔ Issue binding 60-day PIP mandating 4 sales modules, 25 calls, and 8 new deals ($400k ARR).","• Key Deliverable \u0026 Control: Legally enforceable remediation roadmap establishing clear turnaround conditions."],["➔"],["• Documents \u0026 Channels: Enterprise LMS Portal \u0026 CRM Account Re-engagement Records","• Core Business Execution: Pass all 4 consultative modules by Feb 26 ➔ Conduct 32 discovery calls ➔ Close 5 enterprise contracts delivering $280k ARR within the first 30 days.","• Key Deliverable \u0026 Control: Quantifiable operational turnaround validating professional commitment."],["➔"],["• Documents \u0026 Channels: Joint Supervisory Committee (VP of Sales \u0026 HR Business Partner)","• Core Business Execution: Record \u003e60% revenue target completion ➔ Issue formal review stipulating that closing 3 remaining contracts before April 6 will fully lift probationary status.","• Key Deliverable \u0026 Control: Successful employee turnaround de-risking talent turnover while securing revenue."]]],"t":"table"},"4.2 BẢN THUYẾT MINH FEYNMAN SONG NGỮ (ĐA GÓC NHÌN NGHIỆP VỤ)","• Bức tranh Toàn cảnh Nghiệp vụ (End-to-End Business Flow): Kế hoạch Cải thiện Hiệu suất (Performance Improvement Plan - PIP) là quy trình pháp lý chuẩn mực của các tập đoàn phương Tây để xử lý nhân sự không đạt KPI. Thay vì sa thải ngay lập tức (dễ dẫn tới khiếu kiện lao động), công ty cho nhân viên một cơ hội cuối cùng kéo dài 60 đến 90 ngày. Quy trình gồm 3 bước: Thông báo chính thức nêu rõ lỗi sai và chỉ tiêu định lượng bắt buộc ➔ Đào tạo lại chuyên môn và theo dõi sát sao từng tuần ➔ Đánh giá giữa kỳ và cuối kỳ để quyết định phục hồi vị trí hay chấm dứt hợp đồng. Nếu nhân viên nỗ lực chuyển biến, PIP chính là bàn đạp tái sinh sự nghiệp.","• Lăng kính Viễn thông / CNTT Viettel: Tại Tập đoàn Viettel, với lực lượng kinh doanh giải pháp B2B (Viettel Solutions) và bán hàng kênh số, khi một nhân sự liên tục không đạt doanh số KPI quý, người chỉ huy trực tiếp không bỏ rơi cấp dưới mà tiến hành \u0027kèm cặp 1-1\u0027. Trưởng phòng sẽ ngồi cùng nhân viên để phân tích phễu khách hàng, cử tham gia các lớp đào tạo sản phẩm mới (như Cloud, IoT, giải pháp thành phố thông minh) và giao chỉ tiêu thử thách trong 1-2 tháng. Khi người lao động bứt phá thành công, tập đoàn ghi nhận và biểu dương sự vươn lên vượt khó.","• Lăng kính Quản trị Mầm non Ước Mơ Xanh: Tại trường mầm non, nếu một cô giáo thực tập gặp khó khăn trong việc dỗ trẻ ăn ngủ hoặc chưa thành thạo soạn giáo án điện tử, Ban Giám hiệu áp dụng \u0027Kế hoạch Kèm cặp Bổ trợ 30 ngày\u0027: cử Cô Hiệu phó Chuyên môn dự giờ hàng tuần, hướng dẫn lại kỹ năng sư phạm và đặt mục tiêu trong 1 tháng phải giúp 100% trẻ trong lớp ăn hết suất. Khi cô giáo tiến bộ, nhà trường chính thức ký hợp đồng lao động dài hạn.","• Lăng kính Bàn học Gia đình (Kèm cặp Bé Hà Ngân Lớp Lá 5 Tuổi): Để giải thích cho bé Hà Ngân, ba dùng hình ảnh tập đi xe đạp: \u0027Hà Ngân ơi, khi con mới tập đi xe đạp 2 bánh mà bị ngã liên tục và chưa biết bóp phanh, ba không cất xe đi mà bảo: \u0027Ba cho con 2 tuần để tập luyện, mỗi ngày ba sẽ chạy sau giữ yên xe và dạy con cách nhìn thẳng nhé\u0027. Sau một tuần, con đã tự đạp được một đoạn dài và không bị ngã nữa. Ba khen ngợi con và bảo: \u0027Chỉ cần con tự đạp thêm 3 vòng sân nữa mà không cần ba giữ là con sẽ được nhận bằng khen lái xe tí hon xuất sắc nhé!\u0027\u0027","4.3 PHÂN TÍCH CHUYÊN SÂU DÀNH CHO BUSINESS ANALYST (ENGLISH BA PERSPECTIVE)","• Designing Auditable Corrective Action Workflows in CRM/HRIS: Business Analysts architecting sales performance governance must link CRM pipeline stages directly with HRIS disciplinary records. When an account executive\u0027s quarterly quota attainment drops below policy thresholds (e.g., 33%), the system should automatically trigger a PIP requisition. Crucially, the system must ingest real-time closed-won contract data to update PIP progress meters ($280k out of $400k achieved), providing objective, unalterable audit trails for both leadership and employment legal counsel.","• Risk Mitigation \u0026 Legal Defensibility in Human Capital Management: A vital analytical takeaway for enterprise BAs is that a PIP must be structured with verifiable, reasonable, and attainable milestones. Demanding impossible goals exposes the corporation to wrongful termination litigation. By structuring a 30-day formal milestone review with concrete progression gates (completing training + closing 5 of 8 deals), Apex Cloud demonstrates good-faith remedial investment, creating an legally airtight compliance record.","BỘ TỪ VỰNG CHUYÊN ĐỀ TINH HOA (SPECIALIZED VOCABULARY MASTERY)","Performance Improvement Plan (PIP)  /pɚˈfɔːr.məns ɪmˈpruːv.mənt plæn/  Corrective Action Plan / Remedial Action Program / Performance Turnaround Track / Probationary Plan","Nghia: Kế hoạch cải thiện hiệu suất, quy trình chính thức có thời hạn ràng buộc (thường 30-90 ngày) nhằm giúp nhân viên khắc phục tình trạng không đạt chỉ tiêu công việc dưới sự giám sát chặt chẽ.","Vd: After missing his sales target for two consecutive quarters, the account manager was placed on a 60-day Performance Improvement Plan. - Sau khi không đạt chỉ tiêu doanh số trong hai quý liên tiếp, vị trưởng nhóm quản lý tài khoản đã bị đưa vào Kế hoạch Cải thiện Hiệu suất 60 ngày.","Quota Attainment  /ˈkwoʊ.t̬ə əˈteɪn.mənt/  Sales Target Fulfillment / Quota Achievement / Goal Realization / Benchmark Completion Rate","Nghia: Mức độ hoàn thành chỉ tiêu doanh số, tỷ lệ phần trăm phản ánh kết quả kinh doanh thực tế đạt được so với định mức chỉ tiêu được giao.","Vd: Her outstanding 125% quota attainment earned her the regional Sales Executive of the Year award. - Tỷ lệ hoàn thành chỉ tiêu doanh số xuất sắc 125% đã mang lại cho cô giải thưởng Chuyên viên Kinh doanh Xuất sắc nhất Năm của khu vực.","Annual Recurring Revenue (ARR)  /ˈæn.ju.əl rɪˈkɝː.ɪŋ ˈrev.ə.nuː/  Contracted Annualized Revenue / Subscription Revenue Run-rate / Recurring Software Turnover","Nghia: Doanh thu định kỳ hàng năm, chỉ số tài chính cốt lõi trong các công ty phần mềm SaaS đo lường giá trị doanh thu từ các hợp đồng thuê bao định kỳ được chuẩn hóa trong 1 năm.","Vd: The five new enterprise software contracts generated over $280,000 in verified Annual Recurring Revenue. - Năm hợp đồng phần mềm doanh nghiệp mới đã tạo ra hơn 280.000 USD Doanh thu Định kỳ Hàng năm đã được xác thực.","Dormant Account  /ˈdɔːr.mənt əˈkaʊnt/  Inactive Client Account / Stalled Lead / Lapsed Customer Profile / Non-Transacting Account","Nghia: Tài khoản khách hàng không hoạt động/khách hàng ngủ đông, các khách hàng doanh nghiệp cũ đã từng giao dịch nhưng ngừng mua sắm hoặc không tương tác trong thời gian dài.","Vd: The sales representative conducted discovery calls to re-engage dormant accounts and reactivate software subscriptions. - Đại diện kinh doanh đã tiến hành các cuộc gọi khám phá nhu cầu để tái kết nối với các tài khoản khách hàng cũ và kích hoạt lại thuê bao phần mềm.","Probationary  /proʊˈbeɪ.ʃən.er.i/  Conditional / Trial / Under Supervision / Subject to Evaluation / Remedial Status","Nghia: Đang trong thời gian thử thách/giám sát, trạng thái nhân sự tạm thời chịu sự theo dõi đánh giá nghiêm ngặt trước khi được công nhận là nhân viên chính thức hoàn toàn.","Vd: Upon achieving the final contract milestone, the employee will be released from his probationary status. - Ngay sau khi đạt được cột mốc hợp đồng cuối cùng, người nhân viên sẽ được gỡ bỏ khỏi trạng thái giám sát thử thách.","Remediation  /rɪˌmiː.diˈeɪ.ʃən/  Correction / Rectification / Problem Resolution / Performance Turnaround / Corrective Remedying","Nghia: Biện pháp khắc phục, quá trình sửa chữa, uốn nắn những thiếu sót về kỹ năng hoặc kết quả làm việc để đưa hiệu suất trở lại mức chuẩn chấp nhận được.","Vd: The 60-day remediation window provided sufficient coaching and mentorship to resolve the sales performance deficit. - Thời hạn khắc phục 60 ngày đã cung cấp đầy đủ sự đào tạo và cố vấn để giải quyết sự thiếu hụt về hiệu suất bán hàng.","==================================================================================================","BÀI 6: CHÍNH SÁCH LÀM VIỆC TỪ XA LINH HOẠT, TRỢ CẤP VĂN PHÒNG \u0026 QUẢN TRỊ NĂNG SUẤT (HYBRID WORK POLICY, HOME OFFICE STIPEND \u0026 REMOTE GOVERNANCE)","ETS TOEIC - Triple Passage (Q186-190) - Enterprise Hybrid Workplace Guidelines, Ergonomic Equipment Reimbursement \u0026 Schedule Accommodation","BÀI TẬP VÀ PHƯƠNG PHÁP GIẢI TOEIC PART 7 THEO NGUYÊN BẢN (FIRST PRINCIPLES)","1. ĐỀ BÀI GỐC (TRIPLE PASSAGE: HYBRID POLICY DIRECTIVE, REIMBURSEMENT EXPENSE FORM \u0026 APPROVAL EMAIL)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","HYBRID WORKPLACE POLICY","OMNIVERSE DIGITAL ENTERPRISES INC. — SAN FRANCISCO, CA","CORPORATE HUMAN RESOURCES POLICY DIRECTIVE #HR-2026-04","Effective Date: January 15 | Mandatory Distribution","To promote sustained work-life integration and optimize employee productivity, Omniverse Digital is formally instituting its updated Global Flexible Workplace Framework. Eligible technical, product, and operational personnel may elect a 3/2 hybrid model (three designated days in the corporate office, two days remotely) or apply for full remote classification subject to vice presidential authorization.","Key Operational Provisions:","• Core Collaboration Window: All remote personnel must maintain active availability across Slack and Microsoft Teams during core working hours (10:00 AM – 03:00 PM PST) to facilitate cross-time-zone synchronization.","• Home Office Ergonomic Stipend: To ensure physical well-being and digital equity, Omniverse provides a one-time non-taxable equipment stipend of up to $800 per eligible employee. Qualifying purchases include commercial ergonomic desk chairs, external 4K monitors, standing desk converters, and peripheral hardware.","• Connectivity Allowance: A recurring monthly stipend of $75 will be disbursed to offset high-speed broadband internet utility expenses.","Reimbursement Procedure:","Employees must purchase eligible equipment independently, attach itemized vendor receipts to the Concur Expense Portal, and secure direct managerial approval prior to February 28. Approved claims will be credited to the subsequent regular payroll cycle.","EXPENSE REIMBURSEMENT CLAIM FORM","OMNIVERSE DIGITAL — EMPLOYEE EXPENSE REIMBURSEMENT CLAIM","Claim ID: #EXP-88104 | Submission Date: January 26","Employee Name: Rachel Gomez | Employee ID: #OD-9042","Position: Senior UX Copywriter | Department: Product Operations","Supervisor: Gregory Chang, Senior Director of Product Operations","Itemized Qualifying Expenses:","Line 1: Dell UltraSharp 27-inch 4K USB-C Hub Monitor (Vendor: BestBuy Commercial) — $385.00","Line 2: ErgoLift Dual-Tier Standing Desk Converter (Vendor: ErgoDirect Office) — $245.00","Line 3: High-Speed Fiber Optic Router \u0026 Setup Hardware (Vendor: AT\u0026T Fiber) — $115.00","TOTAL REIMBURSEMENT AMOUNT CLAIMED: $745.00","Stipend Category: One-Time Home Office Equipment Allowance (Policy #HR-2026-04)","Employee Attestation:","I certify that all items listed above were purchased exclusively for professional business use in my designated home office workspace. Verified PDF receipts are attached to this claim.","Submitted Electronically By: Rachel Gomez","APPROVAL EMAIL","To: Rachel Gomez \u003cr.gomez@omniverse-digital.com\u003e","From: Gregory Chang \u003cg.chang@omniverse-digital.com\u003e","Cc: Accounts Payable \u003cap-disbursements@omniverse-digital.com\u003e","Date: February 3","Subject: Expense Claim #EXP-88104 Approved \u0026 Remote Schedule Confirmation","Hi Rachel,","I have thoroughly reviewed your home office equipment reimbursement submission (#EXP-88104) totaling $745.00. Because all purchased items comply precisely with our ergonomic hardware guidelines and the total expense falls cleanly within our $800 policy ceiling, I have formally authorized the claim in the Concur portal.","Accounts Payable has confirmed that your $745.00 disbursement will be credited directly to your upcoming February 15 payroll direct deposit.","Additionally, I have formally approved your request for hybrid scheduling. Starting next week, your in-office days will be Monday, Wednesday, and Friday, with Tuesday and Thursday designated as your remote focus days. Thank you for setting up an ergonomic workstation to support our Q1 product roadmap.","Best regards,","Gregory Chang","Senior Director of Product Operations","Omniverse Digital Enterprises Inc.","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","186. What is the primary purpose of the first document?","(A) To announce a company-wide recall of defective office furniture","(B) To outline operational guidelines and financial allowances for hybrid work","(C) To solicit candidate applications for an open human resources director position","(D) To explain security guidelines for international business travel","187. According to the policy directive, what is the maximum one-time equipment stipend available to eligible staff?","(A) $75","(B) $245","(C) $745","(D) $800","188. Why was Ms. Gomez\u0027s reimbursement claim approved without any financial reduction?","(A) Her total requested expenditure did not exceed the corporate policy ceiling.","(B) She agreed to work entirely on-site at the San Francisco headquarters.","(C) She donated her previously owned computer monitor to the local office.","(D) Her department director personally paid for the standing desk converter.","189. In the policy directive, the word \u0027stipend\u0027 in paragraph 2, line 3 is closest in meaning to:","(A) penalty","(B) allowance","(C) invoice","(D) discount","190. When will Ms. Gomez receive her approved equipment reimbursement funds?","(A) January 15","(B) January 26","(C) February 15","(D) February 28","2. CHIẾN LƯỢC ĐỌC HIỂU 5 PHÚT TỐI ƯU (FIRST PRINCIPLES STRATEGY)","CHIẾN THUẬT 5 PHÚT TỐI ƯU: NẮM BẮT BỐI CẢNH, GHÉP NỐI DỮ KIỆN \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Quét Z-Pattern: Quét nhanh 3 văn bản: Văn bản 1 là Chỉ thị Chính sách Làm việc Hỗn hợp \u0026 Từ xa (Hybrid Policy Directive) của Tập đoàn Omniverse Digital cho phép mô hình 3 ngày tại văn phòng/2 ngày từ xa, cấp khoản trợ cấp thiết bị tại gia một lần tối đa $800 và $75/tháng tiền mạng; Văn bản 2 là Phiếu Đề nghị Bồi hoàn Chi phí (Reimbursement Form) của Rachel Gomez kê khai 3 hạng mục (màn hình 4K, bàn đứng, lắp mạng) tổng $745; Văn bản 3 là Email Phê duyệt của Quản lý Gregory Chang chấp thuận bồi hoàn $745 vào kỳ lương 15/2.","Bước 2 (60 giây) - Móc nối Logic \u0026 Sơ đồ Tinh thần: Thiết lập chuỗi phê duyệt trợ cấp văn phòng từ xa: Ban hành chính sách khung với hạn mức $800 (Văn bản 1) ➔ Nhân viên nộp bảng kê hóa đơn hợp lệ $745 kèm chứng từ (Văn bản 2: $385 màn hình + $245 bàn nâng + $115 mạng) ➔ Quản lý phê duyệt chi trả đúng hạn mức vào kỳ lương 15/2 và chốt lịch làm từ xa thứ Ba và thứ Năm (Văn bản 3).","Bước 3 (120 giây) - Định vị Manh mối \u0026 Giải đề Tốc độ: Câu 186 hỏi mục đích chính của văn bản 1 (công bố hướng dẫn chính sách và hỗ trợ tài chính cho làm việc từ xa); Câu 187 hỏi hạn mức trợ cấp thiết bị tối đa ($800); Câu 188 (câu hỏi liên kết) hỏi lý do phiếu chi của Rachel được duyệt nguyên vẹn (tổng $745 nằm dưới hạn mức trần $800); Câu 189 (từ vựng theo ngữ cảnh) hỏi từ \u0027stipend\u0027 trong đoạn 2 (đồng nghĩa với allowance / grant); Câu 190 (câu hỏi liên kết) hỏi thời điểm nhận tiền bồi hoàn (kỳ lương ngày 15 tháng 2).","Bước 4 (30 giây) - Đúc kết Feynman 1 Câu: Hiểu bản chất: Chính sách làm việc kết hợp (Hybrid Work) trong Part 7 luôn đi đôi giữa \u0027Quyền lợi tài chính\u0027 (Stipend/Allowance trang bị màn hình, bàn ghế công thái học) và \u0027Nghĩa vụ tuân thủ\u0027 (Giờ cộng tác cốt lõi Core Hours, hạn mức ngân sách và quy trình đối soát hóa đơn).","3. BẢN DỊCH SONG NGỮ TOÀN VĂN (BILINGUAL PARALLEL TRANSLATION)","VĂN BẢN 1: CHỈ THỊ CHÍNH SÁCH LÀM VIỆC TỪ XA HỖN HỢP (OMNIVERSE DIGITAL)","OMNIVERSE DIGITAL ENTERPRISES INC. — SAN FRANCISCO, CA","CORPORATE HUMAN RESOURCES POLICY DIRECTIVE #HR-2026-04","Effective Date: January 15 | Mandatory Distribution","TẬP ĐOÀN OMNIVERSE DIGITAL ENTERPRISES — SAN FRANCISCO, CA","CHỈ THỊ CHÍNH SÁCH NHÂN SỰ DOANH NGHIỆP SỐ #HR-2026-04","Ngày có hiệu lực: 15 tháng 1 | Phổ biến Bắt buộc","To promote sustained work-life integration and optimize employee productivity, Omniverse Digital is formally instituting its updated Global Flexible Workplace Framework. Eligible technical, product, and operational personnel may elect a 3/2 hybrid model (three designated days in the corporate office, two days remotely) or apply for full remote classification subject to vice presidential authorization.","Nhằm thúc đẩy sự cân bằng giữa công việc và cuộc sống lâu dài đồng thời tối ưu hóa năng suất của nhân viên, Omniverse Digital chính thức ban hành Khung Nơi làm việc Linh hoạt Toàn cầu cập nhật. Các nhân sự kỹ thuật, sản phẩm và vận hành đủ điều kiện có thể lựa chọn mô hình hỗn hợp 3/2 (ba ngày chỉ định tại văn phòng công ty, hai ngày làm việc từ xa) hoặc nộp đơn xin phân loại làm việc từ xa hoàn toàn tùy thuộc vào sự phê duyệt của Phó Chủ tịch.","Key Operational Provisions:","• Core Collaboration Window: All remote personnel must maintain active availability across Slack and Microsoft Teams during core working hours (10:00 AM – 03:00 PM PST) to facilitate cross-time-zone synchronization.","• Home Office Ergonomic Stipend: To ensure physical well-being and digital equity, Omniverse provides a one-time non-taxable equipment stipend of up to $800 per eligible employee. Qualifying purchases include commercial ergonomic desk chairs, external 4K monitors, standing desk converters, and peripheral hardware.","• Connectivity Allowance: A recurring monthly stipend of $75 will be disbursed to offset high-speed broadband internet utility expenses.","Các Điều khoản Vận hành Trọng yếu:","• Khung Giờ Hợp tác Cốt lõi: Tất cả nhân sự làm việc từ xa phải duy trì trạng thái sẵn sàng hoạt động trên Slack và Microsoft Teams trong các giờ làm việc cốt lõi (10:00 sáng – 03:00 chiều giờ PST) để tạo thuận lợi cho việc đồng bộ hóa giữa các múi giờ.","• Trợ cấp Công thái học Văn phòng Tại gia: Nhằm đảm bảo sức khỏe thể chất và sự bình đẳng kỹ thuật số, Omniverse cung cấp một khoản trợ cấp thiết bị miễn thuế một lần lên tới 800 USD cho mỗi nhân viên đủ điều kiện. Các mặt hàng mua sắm hợp lệ bao gồm ghế bàn làm việc công thái học thương mại, màn hình 4K gắn ngoài, bộ chuyển đổi bàn đứng và phần cứng ngoại vi.","• Phụ cấp Kết nối Mạng: Khoản trợ cấp định kỳ hàng tháng trị giá 75 USD sẽ được giải ngân để bù đắp chi phí tiện ích internet băng thông rộng tốc độ cao.","Reimbursement Procedure:","Employees must purchase eligible equipment independently, attach itemized vendor receipts to the Concur Expense Portal, and secure direct managerial approval prior to February 28. Approved claims will be credited to the subsequent regular payroll cycle.","Quy trình Bồi hoàn:","Nhân viên phải tự mua sắm các thiết bị hợp lệ, đính kèm các hóa đơn bán lẻ chi tiết của nhà cung cấp lên Cổng Chi phí Concur và nhận được sự phê duyệt trực tiếp của người quản lý trước ngày 28 tháng 2. Các yêu cầu được phê duyệt sẽ được ghi có vào kỳ tính lương định kỳ tiếp theo.","VĂN BẢN 2: PHIẾU ĐỀ NGHỊ BỒI HOÀN CHI PHÍ (RACHEL GOMEZ)","OMNIVERSE DIGITAL — EMPLOYEE EXPENSE REIMBURSEMENT CLAIM","Claim ID: #EXP-88104 | Submission Date: January 26","Employee Name: Rachel Gomez | Employee ID: #OD-9042","Position: Senior UX Copywriter | Department: Product Operations","Supervisor: Gregory Chang, Senior Director of Product Operations","OMNIVERSE DIGITAL — PHIẾU ĐỀ NGHỊ BỒI HOÀN CHI PHÍ NHÂN VIÊN","MÃ YÊU CẦU: #EXP-88104 | NGÀY NỘP: 26 THÁNG 1","Tên nhân viên: Rachel Gomez | Mã nhân viên: #OD-9042","Chức vụ: Chuyên viên Viết nội dung UX Cấp cao | Phòng ban: Vận hành Sản phẩm","Người quản lý: Gregory Chang, Giám đốc Cấp cao Vận hành Sản phẩm","Itemized Qualifying Expenses:","Line 1: Dell UltraSharp 27-inch 4K USB-C Hub Monitor (Vendor: BestBuy Commercial) — $385.00","Line 2: ErgoLift Dual-Tier Standing Desk Converter (Vendor: ErgoDirect Office) — $245.00","Line 3: High-Speed Fiber Optic Router \u0026 Setup Hardware (Vendor: AT\u0026T Fiber) — $115.00","TOTAL REIMBURSEMENT AMOUNT CLAIMED: $745.00","Stipend Category: One-Time Home Office Equipment Allowance (Policy #HR-2026-04)","Các Khoản Chi Hợp lệ Được Kê Khai Chi Tiết:","Dòng 1: Màn hình Dell UltraSharp 27 inch 4K Hub USB-C (Nhà cung cấp: BestBuy Commercial) — 385,00 USD","Dòng 2: Bộ Chuyển đổi Bàn làm việc Đứng Hai tầng ErgoLift (Nhà cung cấp: ErgoDirect Office) — 245,00 USD","Dòng 3: Thiết bị Định tuyến Cáp quang Tốc độ cao \u0026 Phần cứng Cài đặt (Nhà cung cấp: AT\u0026T Fiber) — 115,00 USD","TỔNG SỐ TIỀN BỒI HOÀN YÊU CẦU: 745,00 USD","Danh mục Trợ cấp: Trợ cấp Thiết bị Văn phòng Tại gia Một lần (Chính sách #HR-2026-04)","Employee Attestation:","I certify that all items listed above were purchased exclusively for professional business use in my designated home office workspace. Verified PDF receipts are attached to this claim.","Submitted Electronically By: Rachel Gomez","Cam đoan của Nhân viên:","Tôi xin cam đoan rằng tất cả các mặt hàng được liệt kê ở trên đều được mua sắm chỉ dành riêng cho việc sử dụng kinh doanh chuyên môn tại không gian làm việc văn phòng tại gia được chỉ định của tôi. Hóa đơn PDF đã xác thực được đính kèm vào yêu cầu này.","Đã nộp điện tử bởi: Rachel Gomez","VĂN BẢN 3: EMAIL PHÊ DUYỆT CỦA CẤP QUẢN LÝ (GREGORY CHANG)","To: Rachel Gomez \u003cr.gomez@omniverse-digital.com\u003e","From: Gregory Chang \u003cg.chang@omniverse-digital.com\u003e","Cc: Accounts Payable \u003cap-disbursements@omniverse-digital.com\u003e","Date: February 3","Subject: Expense Claim #EXP-88104 Approved \u0026 Remote Schedule Confirmation","Gửi: Rachel Gomez \u003cr.gomez@omniverse-digital.com\u003e","Từ: Gregory Chang \u003cg.chang@omniverse-digital.com\u003e","Đồng gửi: Bộ phận Kế toán Thanh toán \u003cap-disbursements@omniverse-digital.com\u003e","Ngày: 3 tháng 2","Chủ đề: Phê duyệt Yêu cầu Chi phí #EXP-88104 \u0026 Xác nhận Lịch trình Làm việc Từ xa","Hi Rachel,","I have thoroughly reviewed your home office equipment reimbursement submission (#EXP-88104) totaling $745.00. Because all purchased items comply precisely with our ergonomic hardware guidelines and the total expense falls cleanly within our $800 policy ceiling, I have formally authorized the claim in the Concur portal.","Chào Rachel,","Tôi đã xem xét kỹ lưỡng hồ sơ đề nghị bồi hoàn thiết bị văn phòng tại gia của bạn (#EXP-88104) với tổng số tiền là 745,00 USD. Do tất cả các mặt hàng đã mua đều tuân thủ chính xác các hướng dẫn về phần cứng công thái học của chúng ta và tổng chi phí nằm hoàn toàn trong hạn mức trần chính sách 800 USD, tôi đã chính thức phê duyệt yêu cầu bồi hoàn này trên cổng thông tin Concur.","Accounts Payable has confirmed that your $745.00 disbursement will be credited directly to your upcoming February 15 payroll direct deposit.","Additionally, I have formally approved your request for hybrid scheduling. Starting next week, your in-office days will be Monday, Wednesday, and Friday, with Tuesday and Thursday designated as your remote focus days. Thank you for setting up an ergonomic workstation to support our Q1 product roadmap.","Best regards,","Gregory Chang","Senior Director of Product Operations","Omniverse Digital Enterprises Inc.","Bộ phận Kế toán Thanh toán đã xác nhận rằng khoản giải ngân 745,00 USD của bạn sẽ được ghi có trực tiếp vào khoản chuyển khoản bảng lương định kỳ ngày 15 tháng 2 sắp tới.","Ngoài ra, tôi cũng đã chính thức phê duyệt yêu cầu về lịch trình làm việc kết hợp của bạn. Bắt đầu từ tuần tới, các ngày làm việc tại văn phòng của bạn sẽ là Thứ Hai, Thứ Tư và Thứ Sáu, trong khi Thứ Ba và Thứ Năm được chỉ định là những ngày làm việc từ xa tập trung của bạn. Cảm ơn bạn đã thiết lập một góc làm việc công thái học để hỗ trợ lộ trình sản phẩm Quý 1 của chúng ta.","Trân trọng,","Gregory Chang","Giám đốc Cấp cao Vận hành Sản phẩm","Tập đoàn Omniverse Digital Enterprises","4. DỊCH NGHĨA CÂU HỎI \u0026 ĐÁP ÁN (QUESTION \u0026 TRANSLATED OPTIONS)","186. Mục đích chủ yếu của văn bản thứ nhất là gì?","(A) Thông báo đợt thu hồi nội thất văn phòng bị lỗi trên toàn công ty","(B) Nêu các hướng dẫn vận hành và các khoản trợ cấp tài chính cho làm việc kết hợp","(C) Kêu gọi ứng viên nộp hồ sơ vào vị trí giám đốc nhân sự đang mở","(D) Giải thích các hướng dẫn an ninh khi đi công tác quốc tế","187. Theo chỉ thị chính sách, khoản trợ cấp thiết bị một lần tối đa dành cho nhân viên đủ điều kiện là bao nhiêu?","(A) 75 USD","(B) 245 USD","(C) 745 USD","(D) 800 USD","188. Tại sao yêu cầu bồi hoàn của cô Gomez lại được phê duyệt mà không bị cắt giảm tài chính?","(A) Tổng chi phí yêu cầu của cô không vượt quá mức trần chính sách của công ty.","(B) Cô đã đồng ý làm việc hoàn toàn trực tiếp tại trụ sở San Francisco.","(C) Cô đã quyên tặng màn hình máy tính cũ của mình cho văn phòng địa phương.","(D) Giám đốc phòng ban của cô đã tự bỏ tiền túi chi trả cho chiếc bàn đứng.","189. Trong chỉ thị chính sách, từ \u0027stipend\u0027 trong đoạn 2, dòng 3 gần nghĩa nhất với từ nào?","(A) Tiền phạt, chế tài (penalty)","(B) Khoản tiền trợ cấp, phụ cấp (allowance / grant)","(C) Hóa đơn thanh toán (invoice)","(D) Khoản chiết khấu giảm giá (discount)","190. Khi nào cô Gomez sẽ nhận được khoản tiền bồi hoàn thiết bị đã được phê duyệt của mình?","(A) 15 tháng 1","(B) 26 tháng 1","(C) 15 tháng 2","(D) 28 tháng 2","5. CÔ ĐỌNG BÀI HỌC FEYNMAN (FEYNMAN CRITICAL TAKEAWAYS)","Key Structural \u0026 Vocabulary Takeaways (English)","• Hybrid Workplace Policy Synthesis: TOEIC passages on remote work balance flexibility (3/2 model) against structured compliance (core collaboration hours 10 AM - 3 PM PST).","• Mathematical Ceiling Verification: Questions connecting policies to expense claim forms test whether itemized purchases ($745) remain within authorized caps ($800) for clean approval.","• Modern Remote Work Lexicon: Master essential workplace terms including \u0027stipend\u0027 (allowance), \u0027ergonomic workstation\u0027, \u0027core collaboration window\u0027, \u0027itemized receipts\u0027, and \u0027payroll credit\u0027.","Bài học Cốt lõi \u0026 Quy tắc Tư duy (Tiếng Việt)","• Cấu trúc Chính sách Làm việc Hỗn hợp (Hybrid): Đề thi TOEIC hiện đại cân bằng giữa quyền lợi linh hoạt (mô hình 3 ngày văn phòng / 2 ngày từ xa) và kỷ luật cộng tác bắt buộc (khung giờ vàng 10:00 - 15:00).","• Kỹ thuật Đối soát Hạn mức Tài chính (Ceiling Verification): Đọc nhanh và cộng các hạng mục chi tiêu ($385 + $245 + $115 = $745) rồi đối chiếu với mức trần $800 để trả lời các câu hỏi tại sao không bị cắt giảm tiền.","• Thuật ngữ Văn phòng Hiện đại: Nắm chắc \u0027stipend\u0027 (trợ cấp/phụ cấp định mức), \u0027ergonomic\u0027 (công thái học bảo vệ sức khỏe), \u0027core hours\u0027 (giờ làm việc cốt lõi), và \u0027itemized receipts\u0027 (hóa đơn bán lẻ có bảng kê chi tiết).","ACTIVE RECALL 5S (MA TRẬN TRUY XUẤT CHÉO DỮ LIỆU)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["1. Đối tượng \u0026 Vai trò: Omniverse Digital ban hành quy chế làm việc hỗn hợp; Chuyên viên Viết nội dung UX Rachel Gomez nộp phiếu xin bồi hoàn chi phí thiết bị làm việc tại nhà; Giám đốc Vận hành Gregory Chang duyệt chi và chốt lịch làm từ xa.","1. Characters \u0026 Roles: Omniverse Digital issues hybrid policy; Senior UX Copywriter Rachel Gomez files home office reimbursement claim; Director Gregory Chang approves disbursement and confirms schedule."]],[["2. Boi canh \u0026 Quy trinh loi"],["2. Bối cảnh \u0026 Quy trình lõi: Triển khai chế độ làm việc hỗn hợp 3/2 và trợ cấp công thái học. Chính sách cấp tối đa $800 thiết bị một lần và $75/tháng tiền mạng ➔ Rachel Gomez mua màn hình $385, bàn đứng $245, thiết bị mạng $115 (tổng $745) và nộp hóa đơn ➔ Quản lý phê duyệt bồi hoàn $745 vào kỳ lương 15/2 và chốt làm từ xa thứ Ba/thứ Năm.","2. Context \u0026 Core Workflow: Corporate hybrid 3/2 framework and ergonomic support. Policy offers $800 one-time equipment cap and $75 broadband monthly ➔ Rachel Gomez buys $385 monitor, $245 desk converter, $115 router ($745 total) with receipts ➔ Manager approves $745 for Feb 15 payroll and sets Tue/Thu remote days."]],[["3. Dau vet suy luan cheo"],["3. Dấu vết suy luận chéo: Móc nối hạn mức tối đa 800 USD ở Văn bản 1 với tổng số tiền 745 USD ở Văn bản 2 để giải thích lý do được duyệt 100%; liên kết ngày chi trả 15 tháng 2 ở Văn bản 3 với quy định chi trả vào kỳ lương tiếp theo ở Văn bản 1; đối chiếu lịch làm từ xa thứ Ba/Năm ở Văn bản 3 với mô hình 3/2 ở Văn bản 1.","3. Cross-Referencing Clues: Correlating the $800 policy ceiling in Passage 1 with the $745 claim total in Passage 2 to explain full approval; linking the Feb 15 payroll date in Passage 3 with the subsequent payroll cycle rule in Passage 1; matching the Tue/Thu remote days in Passage 3 with the 3/2 hybrid model in Passage 1."]]],"t":"table"},"ĐÁP ÁN CHI TIẾT \u0026 BÓC TÁCH BẪY ETS","What is the primary purpose of the first document?","Dap an dung: (B) To outline operational guidelines and financial allowances for hybrid work","[Dau vet bai doc / Clue]: Văn bản 1, Tiêu đề \u0026 Đoạn 1: \u0027CORPORATE HUMAN RESOURCES POLICY DIRECTIVE... Global Flexible Workplace Framework... Core Operational Provisions... Home Office Ergonomic Stipend...\u0027","[Dien dat tuong duong / Paraphrase]: Flexible workplace framework... operational provisions \u0026 ergonomic stipend ➔ outline operational guidelines and financial allowances for hybrid work","[Loi giai chi tiet]: Văn bản 1 là chỉ thị chính sách nhân sự của công ty ban hành các hướng dẫn vận hành (giờ làm việc cốt lõi, mô hình 3/2) và các khoản trợ cấp tài chính (trợ cấp thiết bị, tiền mạng) cho làm việc từ xa.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) To announce a company-wide recall of defective office furniture","- Ly do sai: Văn bản hướng dẫn mua mới nội thất công thái học, không phải thông báo thu hồi sản phẩm lỗi.","- Bay ETS: Bẫy Thu hồi Sản phẩm Lỗi (Defective Product Recall Trap)","(C) To solicit candidate applications for an open human resources director position","- Ly do sai: Tài liệu ban hành bởi ban nhân sự hiện tại, không phải thông báo tuyển dụng giám đốc nhân sự.","- Bay ETS: Bẫy Tuyển dụng Trưởng phòng (HR Recruitment Trap)","(D) To explain security guidelines for international business travel","- Ly do sai: Văn bản bàn về làm việc tại gia và trụ sở công ty, không bàn về công tác nước ngoài.","- Bay ETS: Bẫy Công tác Quốc tế (Business Travel Trap)","According to the policy directive, what is the maximum one-time equipment stipend available to eligible staff?","Dap an dung: (D) $
