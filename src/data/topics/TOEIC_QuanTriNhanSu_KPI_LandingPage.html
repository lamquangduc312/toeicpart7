<title>Quản trị nh&#226;n sự TOEIC 750+</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: cargo-manifest page. Hero with a 3x3 container stack (one container per lesson), sticky container-tab bar, lesson panel with side index of the 5 parts. */
:root{
  /* Tailwind-style neutrals + one primary (Blue 600) */
  --bg:#F9FAFB; --surface:#FFFFFF; --surface-2:#F3F4F6; --ink:#111827; --muted:#6B7280; --line:#E5E7EB;
  --paper:#FFFFFF;
  /* Coordinated palette: navy = governance/trust, cobalt = primary, magenta = errors,
     emerald = correct, ochre = clues & timing, Viettel red = brand marks, xanh mạ = outputs & chips */
  --navy:#102B66; --navy-2:#183B7E; --navy-ink:#102B66;
  --cobalt:#1E62D0; --cobalt-2:#2A7BE8;
  --magenta:#D71A4A; --magenta-2:#E52E5E;
  --emerald:#0A8558; --emerald-2:#12A16E;
  --ochre:#D87D0E; --ochre-2:#E8901C; --ochre-soft:#FDF1E1;
  --brand:var(--cobalt); --brand-soft:#DCE8FB; --vi:var(--navy-2);
  --red:#EE0033; --red-soft:#FFE4EA; --green:#5FA61B; --green-soft:#EAF6DC;
  --ok:var(--emerald); --bad:var(--magenta); --coral:var(--red); --coral-soft:var(--red-soft);
  --c1:var(--brand); --c2:var(--brand); --c3:var(--brand); --c4:var(--brand); --c5:var(--brand); --c6:var(--brand); --c7:var(--brand); --c8:var(--brand); --c9:var(--brand); --c10:var(--brand);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --shadow:0 1px 2px rgba(17,24,39,.05),0 6px 20px -8px rgba(17,24,39,.15);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#030712; --surface:#111827; --surface-2:#0B1120; --ink:#F9FAFB; --muted:#9CA3AF; --line:#1F2937;
  --vi:#9DBDF5; --paper:#111827; --navy-ink:#C9D7F4;
  --brand:var(--cobalt-2); --brand-soft:#132A55; --ochre-soft:#33220B;
  --ok:var(--emerald-2); --bad:var(--magenta-2);
  --red:#FF3B5F; --red-soft:#3B0A16; --green:#8BCF45; --green-soft:#1C2E0E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#030712; --surface:#111827; --surface-2:#0B1120; --ink:#F9FAFB; --muted:#9CA3AF; --line:#1F2937;
  --vi:#9DBDF5; --paper:#111827; --navy-ink:#C9D7F4;
  --brand:var(--cobalt-2); --brand-soft:#132A55; --ochre-soft:#33220B;
  --ok:var(--emerald-2); --bad:var(--magenta-2);
  --red:#FF3B5F; --red-soft:#3B0A16; --green:#8BCF45; --green-soft:#1C2E0E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{display:none}
.wrap{max-width:min(1600px,96vw);width:100%;margin:0 auto;padding-left:clamp(16px,2.5vw,40px);padding-right:clamp(16px,2.5vw,40px)}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--c) 70%,transparent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono)}

/* ---------- Hero ---------- */
.hero{padding-block:clamp(20px,3vw,36px);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.05fr);gap:clamp(20px,3vw,44px);align-items:center}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow b{color:var(--coral);font-weight:500}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3.2vw,44px);line-height:1.15;letter-spacing:-.01em;text-transform:uppercase;margin-top:10px;text-wrap:balance;word-break:break-word}
.hero h1 span{color:var(--red)}
.hero .en-sub{font-family:var(--f-display);font-weight:600;font-size:clamp(14px,1.5vw,18px);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.hero .desc{max-width:62ch;margin-top:16px;color:var(--muted);font-size:15px}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:24px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}

.yard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:620px;justify-self:end;width:100%}
.box{position:relative;min-height:76px;height:auto;aspect-ratio:auto;max-width:100%;border:1px solid var(--line);border-radius:12px;cursor:pointer;color:var(--ink);text-align:left;padding:8px 10px;background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;gap:4px;transition:transform .18s ease,background .18s,border-color .18s,box-shadow .18s}
.box:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 8px 20px -10px color-mix(in srgb,var(--brand) 60%,transparent)}
.box .n{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--brand)}
.box .qr{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.box .code{font-size:11.5px;font-weight:600;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;line-height:1.25;word-break:break-word}
.box.on{background:var(--brand);border-color:var(--brand);color:#fff}
.box.on .n,.box.on .qr,.box.on .code{color:#fff}
.box.alt .n{color:var(--coral)}

/* navy governance band behind the hero */
.hero-band{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff}
.hero-band .eyebrow{color:rgba(255,255,255,.7)}
.hero-band .eyebrow b{color:var(--ochre-2)}
.hero-band h1 span{color:var(--magenta-2)}
.hero-band .en-sub,.hero-band .desc,.hero-band .stat span{color:rgba(255,255,255,.74)}
.hero-band .stat b{color:#fff}
.hero-band .box{border-color:transparent}
.hero-band .box.on{background:var(--cobalt-2);border-color:#fff}

/* ---------- Tab bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-block:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:12px;padding-block:10px}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;flex:1;min-width:0;padding-bottom:2px;scroll-behavior:smooth}
.tab{--c:var(--c1);flex:0 0 auto;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 16px 5px 5px;cursor:pointer;text-align:left;transition:background .15s,border-color .15s}
.tab:hover{border-color:var(--c)}
.tab .door{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--c);font-family:var(--f-display);font-weight:800;font-size:16px;
  background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.tab .tl{display:flex;flex-direction:column;line-height:1.2}
.tab .tl b{font-size:13px;font-weight:600;white-space:nowrap}
.tab .tl small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#fff}
.tab[aria-selected="true"] .door{background:rgba(255,255,255,.22);color:#fff}
.tab[aria-selected="true"] .tl small{color:rgba(255,255,255,.82)}
.mode{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:0 0 auto;background:var(--surface-2)}
.mode button{border:0;background:none;padding:6px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--navy);color:#fff}

/* ---------- Lesson ---------- */
main{padding-block:28px 64px}
.lesson-head{--c:var(--c1);display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start;padding-bottom:24px;border-bottom:2px solid var(--navy-ink)}
.big-n{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,10vw,120px);line-height:.8;color:var(--c);letter-spacing:-.02em}
.big-n small{display:block;font-size:14px;letter-spacing:.2em;color:var(--muted);font-weight:600;margin-bottom:8px}
.lesson-head h2{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3.2vw,38px);line-height:1.05;text-transform:uppercase;color:var(--navy-ink)}
.lesson-head .en-t{font-family:var(--f-display);font-weight:600;font-size:clamp(15px,1.7vw,19px);color:var(--c);letter-spacing:.04em;margin-top:8px;text-transform:uppercase}
.src{display:inline-flex;gap:8px;align-items:center;margin-top:14px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.src b{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--c);letter-spacing:.06em}

.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:36px;margin-top:28px}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 82px);align-self:start;display:flex;flex-direction:column;gap:2px}
.toc a{display:flex;gap:10px;align-items:baseline;text-decoration:none;color:var(--muted);font-size:13.5px;padding:7px 10px;border-radius:6px;line-height:1.3}
.toc a b{font-family:var(--f-display);font-size:17px;color:var(--c);min-width:18px}
.toc a:hover,.toc a.on{background:var(--surface);color:var(--ink)}
.toc .toc-sub{padding-left:38px;font-size:12.5px}
.content{min-width:0;display:flex;flex-direction:column;gap:44px}

.part{display:flex;flex-direction:column;gap:22px;scroll-margin-top:96px}
.part-h{display:flex;gap:14px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px}
.part-h .pn{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.14em;color:#fff;background:var(--red);padding:3px 9px;border-radius:4px;white-space:nowrap}
.part-h h3{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.4vw,26px);text-transform:uppercase;line-height:1.1;color:var(--navy-ink)}
.sub{display:flex;flex-direction:column;gap:14px;scroll-margin-top:96px}
.sub-h{display:flex;gap:10px;align-items:baseline;font-weight:700;font-size:17px}
.sub-h .sn{font-family:var(--f-mono);font-size:12px;color:var(--c);font-weight:500}

/* strategy */
.strat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.strat-t{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;color:var(--c);text-transform:uppercase;line-height:1.5}
.steps{display:grid;gap:12px;counter-reset:s}
.step{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:start}
.step .when{font-family:var(--f-mono);font-size:11.5px;display:flex;flex-direction:column;gap:2px;border-right:2px solid var(--ochre);padding-right:10px}
.step .when span{color:var(--ochre)!important;font-weight:500}
.step .when b{font-family:var(--f-display);font-size:18px;font-weight:700;color:var(--ink)}
.step .when span{color:var(--muted)}
.step h5{margin:0 0 3px;font-size:14.5px;font-weight:700}
.step p{font-size:14.5px;color:var(--ink)}

/* passages = papers */
.papers{display:flex;flex-direction:column;gap:18px}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:22px 24px;display:flex;flex-direction:column;gap:9px;font-size:15px;position:relative}
.paper-tag{align-self:flex-start;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:3px;padding:2px 8px;margin-bottom:4px}
.ln-caps{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.04em;line-height:1.2}
.ln-kv{font-size:14px}
.ln-kv b{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted);margin-right:4px}
.ln-bul{padding-left:16px;position:relative}
.ln-bul::before{content:"";position:absolute;left:2px;top:.7em;width:6px;height:6px;background:var(--c);border-radius:1px}
.ln-sec{font-weight:700;margin-top:6px}
.ln-head{font-weight:700;margin-top:8px;color:var(--navy-ink)}
.ln-num{padding:2px 0 2px 14px;border-left:2px solid var(--brand);margin-left:2px}
.ln-num b{color:var(--brand)}
.ln-concl{background:var(--brand-soft);border-radius:6px;padding:8px 12px;font-size:14px}
.ln-concl b{color:var(--brand)}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:16px}
.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.score{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.score b{color:var(--ink);font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--c)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.q-stem{display:flex;gap:12px;font-weight:600}
.q-no{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--c);line-height:1.2;flex:0 0 auto}
.q-extra{font-style:italic;font-weight:400;color:var(--muted);margin-top:4px}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:8px 12px;cursor:pointer;font-size:14.5px;line-height:1.45;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--c)}
.opt .k{font-family:var(--f-mono);font-weight:500;font-size:13px;color:var(--c);flex:0 0 auto;margin-top:1px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surface))}
.opt.ok .k{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--surface))}
.opt.bad .k{color:var(--bad)}
.q-fb{font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.q-fb .r{font-weight:600}
.q-fb .r.ok{color:var(--ok)} .q-fb .r.bad{color:var(--bad)}
.q-fb a{color:var(--c)}

/* bilingual */
.bi-doc{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;color:var(--c);text-transform:uppercase;padding:10px 0 2px;border-top:1px dashed var(--line);margin-top:6px;line-height:1.5}
.bi-doc:first-child{border-top:0;margin-top:0;padding-top:0}
.bi{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--line)}
.pair:first-child{border-top:0}
.pair>div{padding:11px 16px;display:flex;flex-direction:column;gap:4px;font-size:14.5px;min-width:0}
.pair .en{color:var(--ink)}
.pair .vi{color:var(--vi);background:color-mix(in srgb,var(--vi) 5%,transparent);border-left:1px solid var(--line)}
.lang{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--muted);opacity:.8}
.bi-head{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-bottom:1px solid var(--line)}
.bi-head span{padding:7px 16px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted)}
.bi-head span+span{border-left:1px solid var(--line);color:var(--vi)}

.vi-t{color:var(--vi)}
/* recall mode blurs translations */
.recall .vi-r{filter:blur(6px);cursor:pointer;user-select:none;transition:filter .2s}
.recall .vi-r.peek{filter:none;user-select:auto}

/* question translation */
.qt{display:grid;gap:12px}
.qt-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.qt-card .stem{display:flex;gap:12px}
.qt-card .stem>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.qt-card .stem b{font-weight:600}
.qt-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;padding-left:44px}
.qt-opt{display:flex;gap:8px;font-size:14px;line-height:1.45}
.qt-opt>div{display:flex;flex-direction:column;min-width:0}
.qt-opt .k{font-family:var(--f-mono);color:var(--c);font-size:12.5px;margin-top:1px}
.qt-opt.correct .k{color:#fff;background:var(--ok);border-radius:3px;padding:0 4px;height:fit-content}

/* summary */
.sum{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.sum>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;font-size:14.5px;display:flex;flex-direction:column;gap:8px}
.ideas{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.ideas li{position:relative;padding-left:18px}
.ideas>li::before{content:"";position:absolute;left:3px;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--brand)}
.ideas ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.ideas ul li::before{content:"";position:absolute;left:4px;top:.75em;width:7px;height:1.5px;background:var(--muted)}

/* matrix */
.matrix{display:grid;gap:12px}
.mx{display:grid;grid-template-columns:200px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mx-l{padding:16px;background:color-mix(in srgb,var(--c) 9%,var(--surface));display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line)}
.mx-l .i{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--c)}
.mx-l b{font-size:14.5px;line-height:1.35}
.mx-l small{font-size:12.5px;color:var(--muted);line-height:1.35}
.mx-r{padding:14px 18px;display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.mx-r p{display:flex;gap:10px}
.mx-r .lang{flex:0 0 22px;margin-top:4px}

/* answers */
.ans{display:grid;gap:12px}
.an{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:100px}
.an.flash{animation:flash 1.4s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--c)}100%{box-shadow:0 0 0 0 transparent}}
.an-h{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.an-h .no{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--c)}
.an-h .key{font-family:var(--f-mono);font-weight:500;background:var(--ok);color:#fff;border-radius:4px;padding:1px 8px;font-size:13px}
.an-h .t{font-weight:600}
.trace{font-size:14px;border-left:3px solid var(--ochre);background:var(--ochre-soft);padding:9px 12px;border-radius:0 6px 6px 0;font-style:italic}
.trace .lbl{color:var(--ochre)}
.lbl{font-family:var(--f-mono);font-style:normal;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);display:block;margin-bottom:2px}
.expl{font-size:14.5px}
.an-stem{font-size:14px;color:var(--muted);margin-top:-4px}
.para{display:flex;flex-direction:column;gap:6px;font-size:14px}
.para .pr{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:start;background:var(--green-soft);border-radius:6px;padding:7px 10px}
.para .pr i{font-style:normal;color:var(--green);font-weight:700}
.para .pr span:last-child{font-weight:600}
.wrong{display:grid;gap:8px}
.wr{border:1px solid var(--line);border-radius:8px;padding:9px 12px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.wr-h{display:flex;gap:8px;align-items:baseline}
.wr-h b{font-family:var(--f-mono);font-weight:500;color:var(--bad);font-size:13px}
.wr-h span{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--bad) 55%,transparent);color:var(--muted)}
.trap{align-self:flex-start;font-size:12px;font-weight:600;color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);border-radius:4px;padding:2px 8px}
.ln-sub{padding-left:30px;position:relative;font-size:14px}
.ln-sub::before{content:"";position:absolute;left:16px;top:.75em;width:6px;height:1.5px;background:var(--muted)}
.ln-sub b{color:var(--navy-ink)}

/* workflow */
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;position:relative}
.fstep{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;position:relative}
.fstep:not(:last-child)::after{content:"";position:absolute;right:-12px;top:30px;width:10px;height:10px;border-top:2px solid var(--c);border-right:2px solid var(--c);transform:rotate(45deg);z-index:1}
.fstep h5{margin:0;font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.15;text-transform:uppercase}
.fstep h5 span{display:block;font-size:12px;color:var(--c);letter-spacing:.14em}
.fkv{font-size:13.5px;display:flex;flex-direction:column;gap:1px}
.fkv b{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fkv.out{background:var(--green-soft);border-radius:6px;padding:8px 10px}
.fkv.out b{color:var(--green)}
.ba{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.ba>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;font-size:14.5px;display:flex;flex-direction:column;gap:8px}
.ba h5{margin:0;font-size:14px;font-weight:700}

/* vocab */
.vocab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.vc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:9px}
.vc-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.vc-h .vn{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.vc-h h5{margin:0;font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.05}
.ipa{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chips .eq{font-family:var(--f-mono);font-size:12px;color:var(--c);margin-right:2px}
.chip{font-size:12.5px;border:1px solid color-mix(in srgb,var(--green) 45%,var(--line));color:var(--ink);border-radius:999px;padding:1px 9px;background:var(--green-soft)}
.chips .eq{color:var(--green)}
.vc .mean{font-size:14px;font-weight:500}
.vc .ex{font-size:13.5px;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:3px}
.vc .ex i{font-style:italic}

/* 50 pairs */
.pp-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pp-tools input{flex:1;min-width:0;max-width:420px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;font:inherit;font-size:14.5px;color:var(--ink)}
.tbl-w{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th{text-align:left;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--navy);padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;width:52px}
td.t{font-weight:600}
td.p{color:var(--muted)}
td.m{color:var(--vi)}
tbody tr:hover td{background:var(--surface-2)}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:8px;flex-wrap:wrap}
.pager button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 16px;cursor:pointer;min-width:0;max-width:48%;text-align:left}
.pager button:hover{border-color:var(--ink)}

.pager .next{margin-left:auto;align-items:flex-end;text-align:right}
footer{border-top:1px solid var(--line);padding-block:20px 32px;color:var(--muted);font-size:12.5px}

ing, or equivalent practical experience.","• A minimum of 10 years of progressive technical leadership in enterprise infrastructure engineering.","• Active professional-level cloud certification (AWS Certified Solutions Architect Professional or Microsoft Certified: Azure Solutions Architect Expert required).","• Willingness to relocate permanently to the greater Seattle metropolitan area upon appointment.","Compensation \u0026 Benefits:","• Competitive base salary: $215,000 – $245,000 annually, commensurate with verified executive experience.","• Annual performance-based discretionary bonus pool (up to 30% of base salary) and Restricted Stock Units (RSUs).","• Comprehensive executive relocation reimbursement package (covering moving, temporary corporate housing, and closing costs up to $15,000).","• Premium healthcare, 401(k) matching up to 6%, and unlimited paid time off (PTO).","Interested candidates should submit a comprehensive curriculum vitae (CV) and executive cover letter to our Talent Acquisition Committee at executive-recruiting@vanguardtech.com.","COVER LETTER \u0026 RESUME EXCERPT","To: Executive Talent Acquisition Committee \u003cexecutive-recruiting@vanguardtech.com\u003e","From: David K. Thorne \u003cdavid.thorne@cloudtech-advisors.net\u003e","Date: April 4","Subject: Application for Director of Cloud Infrastructure — David K. Thorne","Dear Members of the Talent Acquisition Committee,","I am writing to express my enthusiastic candidacy for the Director of Cloud Infrastructure position currently open at Vanguard Tech Solutions, as advertised on your corporate career portal. Having followed Vanguard’s innovative SaaS developments in financial technology, I am confident that my twelve years of hands-on infrastructure leadership align precisely with your technical roadmap.","In my current capacity as Senior Principal Infrastructure Architect at Apex Data Systems in Denver, Colorado, I orchestrated the seamless migration of 45 mission-critical banking workloads from on-premises data centers to a hybrid AWS-Azure infrastructure. This multi-year transformation yielded a 34% reduction in latency and generated $3.2 million in annualized operational infrastructure savings, all while maintaining 99.999% high availability.","Furthermore, I hold active credentials as both an AWS Certified Solutions Architect Professional (renewed January 2025) and a Microsoft Certified Azure DevOps Engineer Expert. Regarding the location requirement, although I currently reside in Denver, my family and I are fully prepared to relocate to Seattle immediately upon formal appointment, having previously lived in the Pacific Northwest for six years.","Attached please find my comprehensive CV, detailed architecture portfolio, and professional references. I welcome the opportunity to discuss how my technical acumen and team leadership can drive Vanguard’s platform reliability forward.","Sincerely,","David K. Thorne","Denver, Colorado | (303) 555-0184","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","181. What is the primary purpose of the first passage?","(A) To notify shareholders of an upcoming annual general meeting","(B) To solicit architectural bids for a new regional data center facility","(C) To advertise an executive-level leadership opportunity in cloud engineering","(D) To explain updated data privacy regulations to existing enterprise software clients","182. Which of the following is explicitly listed as a mandatory requirement in the job posting?","(A) Residence in the Seattle area for at least five consecutive years","(B) An active professional-level cloud architect certification","(C) Fluency in three or more European languages","(D) Direct experience managing an investment banking firm","183. What is indicated about Mr. Thorne in his application email?","(A) His professional experience exceeds the minimum duration required by Vanguard.","(B) He is requesting a complete waiver of the corporate relocation requirement.","(C) He has previously worked as a full-time software developer at Vanguard.","(D) He is currently unemployed following a corporate merger at Apex Data Systems.","184. In the email, the word \u0027orchestrated\u0027 in paragraph 2, line 3 is closest in meaning to:","(A) composed","(B) coordinated","(C) postponed","(D) investigated","185. According to the passages, what financial benefit will Mr. Thorne be eligible to receive if selected?","(A) Full reimbursement of business travel expenses up to $25,000","(B) Relocation expense assistance up to a maximum of $15,000","(C) An immediate 50% cash advance on his annual discretionary bonus","(D) Free long-term residential housing provided permanently by the company","2. CHIẾN LƯỢC ĐỌC HIỂU 5 PHÚT TỐI ƯU (FIRST PRINCIPLES STRATEGY)","CHIẾN THUẬT 5 PHÚT TỐI ƯU: NẮM BẮT BỐI CẢNH, GHÉP NỐI DỮ KIỆN \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Quét Z-Pattern: Quét nhanh 2 văn bản: Văn bản 1 là Bản tin Tuyển dụng Lãnh đạo Cấp cao (Executive Job Posting) từ Tập đoàn Vanguard Tech Solutions tìm kiếm Giám đốc Kỹ thuật Điện toán Đám mây (Senior Cloud Infrastructure Director), làm việc tại trụ sở Seattle, yêu cầu tối thiểu 10 năm kinh nghiệm và chứng chỉ kiến trúc đám mây; Văn bản 2 là Thư Ứng tuyển \u0026 Trích yếu Lý lịch (Cover Letter \u0026 Resume Summary) của ông David K. Thorne gửi Hội đồng Tuyển dụng, chứng minh 12 năm dẫn dắt di chuyển hạ tầng đám mây tại Apex Data Systems và sẵn sàng tái định cư ngay.","Bước 2 (60 giây) - Móc nối Logic \u0026 Sơ đồ Tinh thần: Thiết lập chuỗi đối soát hồ sơ ứng viên: Tiêu chuẩn tuyển dụng đầu vào (Văn bản 1: 10+ năm kinh nghiệm, chứng chỉ AWS/Azure Professional, chuyển nơi ở đến Seattle, gói hỗ trợ di chuyển 15.000 USD) ➔ Hồ sơ năng lực thực tế của ứng viên (Văn bản 2: David Thorne có 12 năm kinh nghiệm, sở hữu chứng chỉ AWS Solutions Architect \u0026 Azure DevOps Expert, hiện ở Denver nhưng cam kết chuyển đến Seattle trong 30 ngày) ➔ Ứng viên đáp ứng vượt trội mọi tiêu chí và thuộc diện được nhận gói tài trợ di chuyển.","Bước 3 (120 giây) - Định vị Manh mối \u0026 Giải đề Tốc độ: Câu 181 hỏi mục đích chính của văn bản 1 (quảng bá vị trí lãnh đạo kỹ thuật mở); Câu 182 hỏi tiêu chí bắt buộc trong tin tuyển dụng (chứng chỉ kiến trúc sư giải pháp đám mây); Câu 183 (câu hỏi liên kết) hỏi nhận định đúng về ông Thorne (kinh nghiệm thực tế vượt mức tối thiểu 10 năm); Câu 184 (từ vựng theo ngữ cảnh) hỏi từ \u0027orchestrated\u0027 trong đoạn 2 (đồng nghĩa với coordinated / managed); Câu 185 (câu hỏi liên kết) hỏi gói hỗ trợ tài chính ông Thorne đủ điều kiện nhận nếu trúng tuyển (khoản hỗ trợ di dời nơi ở tối đa 15.000 USD).","Bước 4 (30 giây) - Đúc kết Feynman 1 Câu: Hiểu bản chất: Quy trình tuyển dụng nhân sự cấp cao trong Part 7 luôn xoay quanh việc đối chiếu hai chiều giữa \u0027Tiêu chuẩn khắt khe của Nhà tuyển dụng\u0027 (Job Specifications) và \u0027Bằng chứng năng lực của Ứng viên\u0027 (Candidate Proof of Qualifications), kết nối chặt chẽ với các đãi ngộ đi kèm như gói di dời hay thưởng cổ phiếu.","3. BẢN DỊCH SONG NGỮ TOÀN VĂN (BILINGUAL PARALLEL TRANSLATION)","VĂN BẢN 1: BẢN TIN TUYỂN DỤNG LÃNH ĐẠO CẤP CAO (VANGUARD TECH SOLUTIONS)","VANGUARD TECH SOLUTIONS INC. — SEATTLE, WA","EXECUTIVE RECRUITMENT NOTICE: DIRECTOR OF CLOUD INFRASTRUCTURE","Posting Date: March 22 | Application Deadline: April 15","CÔNG TY VANGUARD TECH SOLUTIONS — THÀNH PHỐ SEATTLE, BANG WASHINGTON","THÔNG BÁO TUYỂN DỤNG LÃNH ĐẠO CẤP CAO: GIÁM ĐỐC HẠ TẦNG ĐÁM MÂY","Ngày đăng tin: 22 tháng 3 | Hạn chót nộp hồ sơ: 15 tháng 4","Vanguard Tech Solutions, an industry-leading enterprise SaaS provider serving Fortune 500 financial institutions, is actively seeking an exceptional, forward-thinking Director of Cloud Infrastructure to oversee our global hybrid cloud operations and lead our next-generation architecture transformation at our corporate headquarters in Seattle, Washington.","Vanguard Tech Solutions, nhà cung cấp phần mềm dạng dịch vụ (SaaS) doanh nghiệp hàng đầu ngành phục vụ các định chế tài chính Fortune 500, đang tích cực tìm kiếm một Giám đốc Hạ tầng Đám mây xuất sắc và có tư duy tiên phong để giám sát toàn bộ hoạt động đám mây lai toàn cầu và dẫn dắt cuộc chuyển đổi kiến trúc thế hệ mới tại trụ sở chính của chúng tôi ở Seattle, Washington.","Key Responsibilities:","• Direct a multinational engineering team of 45+ DevOps, systems reliability, and security specialists across North America and Europe.","• Architect and execute scalable migration roadmaps transitioning legacy monolithic frameworks to containerized Kubernetes microservices.","• Enforce strict SOC 2 Type II, ISO 27001, and financial data privacy regulatory compliance protocols across all distributed cloud clusters.","Trách nhiệm chính:","• Chỉ đạo đội ngũ kỹ thuật đa quốc gia gồm hơn 45 chuyên gia DevOps, độ tin cậy hệ thống và an ninh mạng trên khắp Bắc Mỹ và Châu Âu.","• Thiết kế kiến trúc và thực thi lộ trình di chuyển có khả năng mở rộng, chuyển đổi các khung kiến trúc nguyên khối cũ sang kiến trúc vi dịch vụ Kubernetes đóng gói container.","• Thực thi nghiêm ngặt các quy thức tuân thủ quy định về bảo mật SOC 2 Type II, ISO 27001 và quyền riêng tư dữ liệu tài chính trên toàn bộ các cụm đám mây phân tán.","Qualifications \u0026 Requirements:","• Bachelor’s or Master’s degree in Computer Science, Software Engineering, or equivalent practical experience.","• A minimum of 10 years of progressive technical leadership in enterprise infrastructure engineering.","• Active professional-level cloud certification (AWS Certified Solutions Architect Professional or Microsoft Certified: Azure Solutions Architect Expert required).","• Willingness to relocate permanently to the greater Seattle metropolitan area upon appointment.","Yêu cầu \u0026 Tiêu chuẩn Năng lực:","• Bằng Cử nhân hoặc Thạc sĩ chuyên ngành Khoa học Máy tính, Kỹ thuật Phần mềm hoặc kinh nghiệm thực tế tương đương.","• Tối thiểu 10 năm kinh nghiệm lãnh đạo kỹ thuật phát triển không ngừng trong lĩnh vực kỹ thuật hạ tầng doanh nghiệp.","• Sở hữu chứng chỉ đám mây cấp độ chuyên nghiệp còn hiệu lực (yêu cầu chứng chỉ AWS Certified Solutions Architect Professional hoặc Microsoft Certified: Azure Solutions Architect Expert).","• Sẵn sàng chuyển nơi ở cố định đến khu vực đô thị mở rộng Seattle sau khi được bổ nhiệm.","Compensation \u0026 Benefits:","• Competitive base salary: $215,000 – $245,000 annually, commensurate with verified executive experience.","• Annual performance-based discretionary bonus pool (up to 30% of base salary) and Restricted Stock Units (RSUs).","• Comprehensive executive relocation reimbursement package (covering moving, temporary corporate housing, and closing costs up to $15,000).","• Premium healthcare, 401(k) matching up to 6%, and unlimited paid time off (PTO).","Chế độ Đãi ngộ \u0026 Phúc lợi:","• Mức lương cơ bản cạnh tranh: 215.000 – 245.000 USD mỗi năm, tương xứng với kinh nghiệm lãnh đạo đã được xác thực.","• Quỹ thưởng tùy ý hàng năm dựa trên hiệu suất (lên tới 30% lương cơ bản) và Cổ phiếu Hạn chế Chuyển nhượng (RSUs).","• Gói bồi hoàn chi phí di dời nơi ở cấp điều hành toàn diện (chi trả vận chuyển, nhà ở tạm thời của công ty và phí pháp lý lên tới 15.000 USD).","• Chăm sóc sức khỏe cao cấp, quỹ hưu trí 401(k) đóng góp tương ứng lên tới 6%, và chế độ nghỉ phép hưởng nguyên lương không giới hạn (PTO).","Interested candidates should submit a comprehensive curriculum vitae (CV) and executive cover letter to our Talent Acquisition Committee at executive-recruiting@vanguardtech.com.","Các ứng viên quan tâm vui lòng gửi hồ sơ lý lịch toàn diện (CV) và thư xin việc cấp điều hành tới Hội đồng Tuyển dụng Nhân tài của chúng tôi theo địa chỉ email executive-recruiting@vanguardtech.com.","VĂN BẢN 2: THƯ ỨNG TUYỂN \u0026 TÓM TẮT HỒ SƠ ỨNG VIÊN (DAVID K. THORNE)","To: Executive Talent Acquisition Committee \u003cexecutive-recruiting@vanguardtech.com\u003e","From: David K. Thorne \u003cdavid.thorne@cloudtech-advisors.net\u003e","Date: April 4","Subject: Application for Director of Cloud Infrastructure — David K. Thorne","Gửi: Hội đồng Tuyển dụng Nhân tài Lãnh đạo \u003cexecutive-recruiting@vanguardtech.com\u003e","Từ: David K. Thorne \u003cdavid.thorne@cloudtech-advisors.net\u003e","Ngày: 4 tháng 4","Chủ đề: Hồ sơ Ứng tuyển Vị trí Giám đốc Hạ tầng Đám mây — David K. Thorne","Dear Members of the Talent Acquisition Committee,","I am writing to express my enthusiastic candidacy for the Director of Cloud Infrastructure position currently open at Vanguard Tech Solutions, as advertised on your corporate career portal. Having followed Vanguard’s innovative SaaS developments in financial technology, I am confident that my twelve years of hands-on infrastructure leadership align precisely with your technical roadmap.","Kính gửi các Thành viên Hội đồng Tuyển dụng Nhân tài,","Tôi viết thư này để bày tỏ sự hào hứng ứng tuyển vào vị trí Giám đốc Hạ tầng Đám mây hiện đang mở tại Vanguard Tech Solutions, như đã được đăng tải trên cổng thông tin nghề nghiệp của quý công ty. Dõi theo những bước phát triển SaaS đổi mới của Vanguard trong lĩnh vực công nghệ tài chính, tôi tự tin rằng mười hai năm kinh nghiệm lãnh đạo hạ tầng thực chiến của mình hoàn toàn phù hợp với lộ trình kỹ thuật của quý công ty.","In my current capacity as Senior Principal Infrastructure Architect at Apex Data Systems in Denver, Colorado, I orchestrated the seamless migration of 45 mission-critical banking workloads from on-premises data centers to a hybrid AWS-Azure infrastructure. This multi-year transformation yielded a 34% reduction in latency and generated $3.2 million in annualized operational infrastructure savings, all while maintaining 99.999% high availability.","Trên cương vị hiện tại là Kiến trúc sư Trưởng Hạ tầng Cấp cao tại Apex Data Systems ở Denver, bang Colorado, tôi đã trực tiếp điều phối quá trình di chuyển liền mạch 45 khối lượng công việc ngân hàng trọng yếu từ các trung tâm dữ liệu tại chỗ lên hạ tầng đám mây lai AWS-Azure. Cuộc chuyển đổi kéo dài nhiều năm này đã giúp giảm 34% độ trễ và mang lại khoản tiết kiệm chi phí hạ tầng vận hành thường niên 3,2 triệu USD, trong khi vẫn duy trì độ sẵn sàng cao kỷ lục 99,999%.","Furthermore, I hold active credentials as both an AWS Certified Solutions Architect Professional (renewed January 2025) and a Microsoft Certified Azure DevOps Engineer Expert. Regarding the location requirement, although I currently reside in Denver, my family and I are fully prepared to relocate to Seattle immediately upon formal appointment, having previously lived in the Pacific Northwest for six years.","Hơn nữa, tôi đang sở hữu các chứng chỉ chuyên môn còn hiệu lực gồm AWS Certified Solutions Architect Professional (gia hạn tháng 1 năm 2025) và Microsoft Certified Azure DevOps Engineer Expert. Về yêu cầu địa điểm làm việc, mặc dù hiện đang cư trú tại Denver, tôi và gia đình hoàn toàn sẵn sàng chuyển tới Seattle ngay sau khi được bổ nhiệm chính thức, do đã từng sinh sống tại khu vực Tây Bắc Thái Bình Dương trong sáu năm.","Attached please find my comprehensive CV, detailed architecture portfolio, and professional references. I welcome the opportunity to discuss how my technical acumen and team leadership can drive Vanguard’s platform reliability forward.","Sincerely,","David K. Thorne","Denver, Colorado | (303) 555-0184","Đính kèm thư này là bản CV toàn diện, hồ sơ năng lực kiến trúc chi tiết và danh sách người tham chiếu chuyên môn của tôi. Tôi rất mong có cơ hội được trao đổi về cách thức mà sự nhạy bén kỹ thuật và năng lực lãnh đạo đội ngũ của tôi có thể thúc đẩy độ tin cậy nền tảng của Vanguard tiến xa hơn.","Trân trọng,","David K. Thorne","Denver, Colorado | (303) 555-0184","4. DỊCH NGHĨA CÂU HỎI \u0026 ĐÁP ÁN (QUESTION \u0026 TRANSLATED OPTIONS)","181. Mục đích chủ yếu của văn bản thứ nhất là gì?","(A) Thông báo cho các cổ đông về cuộc họp đại hội đồng thường niên sắp tới","(B) Kêu gọi các gói thầu kiến trúc cho một cơ sở trung tâm dữ liệu khu vực mới","(C) Quảng bá một cơ hội lãnh đạo cấp điều hành trong lĩnh vực kỹ thuật đám mây","(D) Giải thích các quy định bảo mật dữ liệu cập nhật cho các khách hàng phần mềm doanh nghiệp","182. Điều nào sau đây được liệt kê rõ ràng là yêu cầu bắt buộc trong thông báo tuyển dụng?","(A) Cư trú tại khu vực Seattle liên tục trong ít nhất năm năm","(B) Có chứng chỉ kiến trúc sư đám mây cấp độ chuyên nghiệp còn hiệu lực","(C) Thông thạo từ ba ngôn ngữ châu Âu trở lên","(D) Có kinh nghiệm trực tiếp quản lý một công ty ngân hàng đầu tư","183. Điều gì được chỉ ra về ông Thorne trong thư điện tử ứng tuyển của ông?","(A) Kinh nghiệm chuyên môn của ông vượt quá thời gian tối thiểu mà Vanguard yêu cầu.","(B) Ông đang yêu cầu miễn trừ hoàn toàn yêu cầu chuyển nơi ở của công ty.","(C) Ông từng làm việc với tư cách lập trình viên toàn thời gian tại Vanguard.","(D) Ông hiện đang thất nghiệp sau một vụ sáp nhập doanh nghiệp tại Apex Data Systems.","184. Trong thư điện tử, từ \u0027orchestrated\u0027 trong đoạn 2, dòng 3 gần nghĩa nhất với từ nào?","(A) Sáng tác âm nhạc (composed)","(B) Điều phối, tổ chức quản lý (coordinated / organized)","(C) Trì hoãn thời gian (postponed)","(D) Điều tra, thanh tra (investigated)","185. Theo các văn bản, ông Thorne sẽ đủ điều kiện nhận quyền lợi tài chính nào nếu được lựa chọn?","(A) Bồi hoàn toàn bộ chi phí đi công tác lên tới 25.000 USD","(B) Khoản hỗ trợ chi phí di dời nơi ở lên tới mức tối đa 15.000 USD","(C) Tạm ứng tiền mặt ngay 50% khoản tiền thưởng tùy ý hàng năm","(D) Được công ty cấp miễn phí nhà ở dài hạn vĩnh viễn","5. CÔ ĐỌNG BÀI HỌC FEYNMAN (FEYNMAN CRITICAL TAKEAWAYS)","Key Structural \u0026 Vocabulary Takeaways (English)","• Executive Job Specifications Gating: High-level corporate recruitment texts in TOEIC establish strict multi-tiered prerequisites (e.g., 10-year experience baseline, professional cloud certifications, mandatory geographic relocation).","• Cross-Document Benchmark Verification: Always pair the threshold specified in the job notice (minimum 10 years) with the candidate\u0027s verified background in the cover letter (12 years completed), validating that requirements are surpassed.","• Critical Talent Acquisition Terminology: Key executive recruitment terms include \u0027commensurate with\u0027 (proportionate to), \u0027Restricted Stock Units\u0027 (RSUs), \u0027orchestrated\u0027 (coordinated / led), and \u0027relocation reimbursement\u0027.","Bài học Cốt lõi \u0026 Quy tắc Tư duy (Tiếng Việt)","• Tư duy Đối soát Chuẩn Tuyển dụng Lãnh đạo: Các bài đọc Part 7 về tuyển dụng cấp cao luôn thiết lập bộ lọc đa tầng (kinh nghiệm tối thiểu 10 năm, chứng chỉ kiến trúc sư quốc tế, cam kết chuyển nơi ở đến trụ sở chính).","• Kỹ thuật Suy luận Chéo Vượt Tiêu chuẩn: Ghép nối yêu cầu mốc sàn ở tin tuyển dụng (10 năm) với thông tin tự thuật của ứng viên (12 năm) để nhận diện trạng thái \u0027vượt chỉ tiêu\u0027 (exceeds the minimum duration).","• Nhận diện Thuật ngữ Tuyển mộ C\u0026B: Nắm chắc các thuật ngữ cốt lõi như \u0027commensurate with\u0027 (tương xứng với năng lực), \u0027RSUs\u0027 (cổ phiếu thưởng hạn chế chuyển nhượng), \u0027orchestrated\u0027 (chỉ huy, điều phối toàn diện), và \u0027relocation package\u0027 (trợ cấp di chuyển chỗ ở).","ACTIVE RECALL 5S (MA TRẬN TRUY XUẤT CHÉO DỮ LIỆU)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["1. Đối tượng \u0026 Vai trò: Tập đoàn phần mềm tài chính Vanguard Tech Solutions (trụ sở Seattle) đăng thông báo tuyển Giám đốc Hạ tầng Đám mây; Kiến trúc sư trưởng David K. Thorne (làm việc tại Apex Data Systems, cư trú tại Denver) nộp hồ sơ ứng tuyển kèm cam kết chuyển nơi ở.","1. Characters \u0026 Roles: Vanguard Tech Solutions (Seattle SaaS enterprise) posts an executive opening for Director of Cloud Infrastructure; Principal Architect David K. Thorne (Apex Data Systems, residing in Denver) submits an executive cover letter and CV committing to relocation."]],[["2. Boi canh \u0026 Quy trinh loi"],["2. Bối cảnh \u0026 Quy trình lõi: Tuyển chọn nhân sự điều hành kỹ thuật đám mây quy mô lớn. Yêu cầu tối thiểu 10 năm kinh nghiệm, có chứng chỉ AWS/Azure Professional, chấp nhận định cư tại Seattle với mức lương $215k-$245k và gói chuyển nhà $15.000 ➔ Ứng viên chứng minh 12 năm dẫn dắt di chuyển 45 hệ thống ngân hàng, sở hữu cả 2 chứng chỉ và sẵn sàng chuyển nhà ngay.","2. Context \u0026 Core Workflow: Executive recruitment for mission-critical cloud operations. Mandating 10+ years experience, AWS/Azure professional certs, and Seattle relocation supported by $15,000 allowance ➔ Candidate presents 12 years migrating 45 financial systems, holds both certifications, and pledges immediate relocation."]],[["3. Dau vet suy luan cheo"],["3. Dấu vết suy luận chéo: Móc nối mốc yêu cầu tối thiểu 10 năm ở Văn bản 1 với con số 12 năm của ông Thorne ở Văn bản 2 để kết luận kinh nghiệm vượt yêu cầu; liên kết cam kết chuyển nhà từ Denver về Seattle ở Văn bản 2 với quyền lợi nhận gói tài trợ di dời 15.000 USD ở Văn bản 1.","3. Cross-Referencing Clues: Linking the 10-year experience minimum in Passage 1 with Mr. Thorne\u0027s stated 12 years in Passage 2 to confirm qualifications exceed the baseline; pairing the candidate\u0027s Denver-to-Seattle relocation pledge in Passage 2 with the $15,000 relocation reimbursement benefit in Passage 1."]]],"t":"table"},"ĐÁP ÁN CHI TIẾT \u0026 BÓC TÁCH BẪY ETS","What is the primary purpose of the first passage?","Dap an dung: (C) To advertise an executive-level leadership opportunity in cloud engineering","[Dau vet bai doc / Clue]: Văn bản 1, Tiêu đề \u0026 Đoạn 1: \u0027EXECUTIVE RECRUITMENT NOTICE: DIRECTOR OF CLOUD INFRASTRUCTURE... is actively seeking an exceptional, forward-thinking Director of Cloud Infrastructure to oversee our global hybrid cloud operations...\u0027","[Dien dat tuong duong / Paraphrase]: Executive recruitment notice... Director of Cloud Infrastructure ➔ advertise an executive-level leadership opportunity in cloud engineering","[Loi giai chi tiet]: Văn bản 1 là thông báo tuyển dụng chính thức của công ty nhằm tìm kiếm ứng viên cho vị trí lãnh đạo cấp cao - Giám đốc Hạ tầng Đám mây.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) To notify shareholders of an upcoming annual general meeting","- Ly do sai: Văn bản là thông báo tuyển dụng nhân sự, không phải thư triệu tập đại hội đồng cổ đông thường niên.","- Bay ETS: Bẫy Đại hội Cổ đông (Shareholder Meeting Trap)","(B) To solicit architectural bids for a new regional data center facility","- Ly do sai: Công ty tuyển dụng nhân sự kiến trúc phần mềm, không phải mời thầu xây dựng công trình trung tâm dữ liệu vật lý.","- Bay ETS: Bẫy Đấu thầu Xây dựng Hạ tầng (Construction Tender Trap)","(D) To explain updated data privacy regulations to existing enterprise software clients","- Ly do sai: Các quy chuẩn bảo mật (SOC 2, ISO 27001) chỉ là yêu cầu công việc của ứng viên, không phải văn bản giải thích luật cho khách hàng.","- Bay ETS: Bẫy Quy định Pháp lý Dữ liệu (Compliance Notice Trap)","Which of the following is explicitly listed as a mandatory requirement in the job posting?","Dap an dung: (B) An active professional-level cloud architect certification","[Dau vet bai doc / Clue]: Văn bản 1, Phần Qualifications \u0026 Requirements: \u0027Active professional-level cloud certification (AWS Certified Solutions Architect Professional or Microsoft Certified: Azure Solutions Architect Expert required).\u0027","[Dien dat tuong duong / Paraphrase]: Active professional-level cloud certification... required ➔ An active professional-level cloud architect certification","[Loi giai chi tiet]: Bản tin tuyển dụng quy định rõ ứng viên bắt buộc phải có chứng chỉ kiến trúc đám mây cấp độ chuyên nghiệp (AWS hoặc Azure) còn hiệu lực.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Residence in the Seattle area for at least five consecutive years","- Ly do sai: Công ty chỉ yêu cầu sẵn sàng chuyển tới Seattle sau khi trúng tuyển, không đòi hỏi đã sống tại đó 5 năm trước đó.","- Bay ETS: Bẫy Cư trú Địa phương (Prior Residency Trap)","(C) Fluency in three or more European languages","- Ly do sai: Văn bản nhắc đến việc quản lý nhóm kỹ sư ở Bắc Mỹ và châu Âu, không hề bắt buộc nói thông thạo 3 ngôn ngữ.","- Bay ETS: Bẫy Đa ngôn ngữ Hư cấu (Fabricated Language Trap)","(D) Direct experience managing an investment banking firm","- Ly do sai: Khách hàng của công ty là các định chế tài chính, không đòi hỏi ứng viên phải từng làm giám đốc công ty ngân hàng đầu tư.","- Bay ETS: Bẫy Chức danh Ngành Tài chính (Banking Leadership Trap)","What is indicated about Mr. Thorne in his application email?","Dap an dung: (A) His professional experience exceeds the minimum duration required by Vanguard.","[Dau vet bai doc / Clue]: Văn bản 1 yêu cầu: \u0027A minimum of 10 years of progressive technical leadership\u0027. Văn bản 2, Đoạn 1: \u0027...my twelve years of hands-on infrastructure leadership align precisely with your technical roadmap.\u0027","[Dien dat tuong duong / Paraphrase]: 12 years vs. required 10 years ➔ professional experience exceeds the minimum duration","[Loi giai chi tiet]: Bằng phương pháp suy luận chéo: Văn bản 1 yêu cầu tối thiểu 10 năm kinh nghiệm, trong khi thư của ông Thorne xác nhận ông có 12 năm kinh nghiệm thực chiến, tức vượt mức yêu cầu tối thiểu.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(B) He is requesting a complete waiver of the corporate relocation requirement","- Ly do sai: Ông Thorne khẳng định gia đình ông hoàn toàn sẵn sàng chuyển nhà đến Seattle ngay lập tức, không xin miễn trừ.","- Bay ETS: Bẫy Đảo ngược Thái độ Ứng viên (Contradictory Willingness Trap)","(C) He has previously worked as a full-time software developer at Vanguard","- Ly do sai: Ông Thorne nói ông từng sống ở vùng Tây Bắc Thái Bình Dương, chứ chưa từng làm lập trình viên tại Vanguard.","- Bay ETS: Bẫy Lịch sử Công tác Cũ (Past Employment Confusion Trap)","(D) He is currently unemployed following a corporate merger at Apex Data Systems","- Ly do sai: Ông Thorne hiện đang giữ chức Kiến trúc sư Trưởng tại Apex Data Systems, hoàn toàn không bị thất nghiệp.","- Bay ETS: Bẫy Thất nghiệp Do Sáp nhập (Unemployment Misinterpretation Trap)","In the email, the word \u0027orchestrated\u0027 in paragraph 2, line 3 is closest in meaning to:","Dap an dung: (B) coordinated","[Dau vet bai doc / Clue]: Văn bản 2, Đoạn 2: \u0027...I orchestrated the seamless migration of 45 mission-critical banking workloads from on-premises data centers to a hybrid AWS-Azure infrastructure.\u0027","[Dien dat tuong duong / Paraphrase]: orchestrated the migration ➔ coordinated / managed / directed the migration project","[Loi giai chi tiet]: Trong ngữ cảnh kỹ thuật dự án, động từ \u0027orchestrate\u0027 mang nghĩa điều phối, tổ chức và quản lý một quy trình chuyển đổi phức tạp (coordinated).","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) composed","- Ly do sai: \u0027Composed\u0027 chỉ dùng cho sáng tác âm nhạc hoặc cấu thành, không mang nghĩa điều phối kỹ thuật dự án.","- Bay ETS: Bẫy Nghĩa Gốc Âm nhạc (Literal Musical Trap)","(C) postponed","- Ly do sai: \u0027Postponed\u0027 có nghĩa là hoãn lại, hoàn toàn trái ngược với hành động triển khai dự án thành công.","- Bay ETS: Bẫy Trì hoãn Trái nghĩa (Antonym Delay Trap)","(D) investigated","- Ly do sai: \u0027Investigated\u0027 có nghĩa là điều tra sự cố, không phải là chỉ đạo thực thi di chuyển hệ thống.","- Bay ETS: Bẫy Điều tra Kỹ thuật (Investigation Confusion Trap)","According to the passages, what financial benefit will Mr. Thorne be eligible to receive if selected?","Dap an dung: (B) Relocation expense assistance up to a maximum of $15,000","[Dau vet bai doc / Clue]: Văn bản 1: \u0027Comprehensive executive relocation reimbursement package (covering moving, temporary corporate housing, and closing costs up to $15,000).\u0027 Văn bản 2: ông Thorne cam kết di dời từ Denver đến Seattle.","[Dien dat tuong duong / Paraphrase]: relocation reimbursement package up to $15,000 ➔ relocation expense assistance up to a maximum of $15,000","[Loi giai chi tiet]: Văn bản 1 quy định ứng viên trúng tuyển phải chuyển nơi ở sẽ nhận gói hỗ trợ tái định cư lên tới 15.000 USD; do ông Thorne cam kết chuyển từ Denver về Seattle nên ông hoàn toàn đủ điều kiện thụ hưởng quyền lợi này.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Full reimbursement of business travel expenses up to $25,000","- Ly do sai: Con số 25.000 USD không xuất hiện; chỉ có mức lương từ 215.000 đến 245.000 USD và gói di dời 15.000 USD.","- Bay ETS: Bẫy Con số Hư cấu (Fabricated Figure Trap)","(C) An immediate 50% cash advance on his annual discretionary bonus","- Ly do sai: Thưởng hiệu suất tối đa 30% lương và không có chính sách ứng trước 50% tiền mặt.","- Bay ETS: Bẫy Tạm ứng Tiền thưởng (Bonus Advance Trap)","(D) Free long-term residential housing provided permanently by the company","- Ly do sai: Công ty chỉ hỗ trợ nhà ở tạm thời trong thời gian đầu di dời (temporary corporate housing), không cấp nhà ở vĩnh viễn.","- Bay ETS: Bẫy Cấp Nhà Vĩnh viễn (Permanent Housing Exaggeration Trap)","PHƯƠNG PHÁP FEYNMAN - BẢN THUYẾT MINH BẬC THẦY","4.1 QUY TRÌNH NGHIỆP VỤ 3 BƯỚC TUẦN TỰ (DUAL SEQUENTIAL WORKFLOWS)","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","BAN HÀNH TIÊU CHUẨN TUYỂN DỤNG \u0026 XÁC LẬP GÓI ĐÃI NGỘ"],[],["BƯỚC 2","NỘP HỒ SƠ ỨNG VIÊN \u0026 ĐỐI SOÁT CHỨNG CHỈ NĂNG LỰC"],[],["BƯỚC 3","THẨM ĐỊNH HỒ SƠ CHUYÊN SÂU \u0026 KÍCH HOẠT QUYỀN LỢI TÁI ĐỊNH CƯ"]],[["• Chung tu \u0026 Kenh: Cổng Thông Tin Tuyển Dụng Doanh Nghiệp \u0026 Mạng Lưới Headhunter C-Level","• Nghiep vu thuc thi: Vanguard công bố tuyển Giám đốc Hạ tầng Đám mây ➔ Áp chuẩn 10+ năm kinh nghiệm, chứng chỉ AWS/Azure Pro và gói đãi ngộ $215k-$245k kèm $15k hỗ trợ chuyển nhà.","• Ket qua \u0026 Kiem soat: Bộ tiêu chí sàng lọc hồ sơ chuẩn mực cho vị trí lãnh đạo công nghệ trọng yếu."],["➔"],["• Chung tu \u0026 Kenh: Hòm Thư Tuyển Dụng executive-recruiting@vanguardtech.com \u0026 Portfolio Kiến Trúc","• Nghiep vu thuc thi: David Thorne nộp CV chứng minh 12 năm kinh nghiệm, 45 dự án di chuyển đám mây thành công, chứng chỉ kép AWS/Azure và cam kết chuyển tới Seattle ngay.","• Ket qua \u0026 Kiem soat: Hồ sơ ứng viên sáng giá vượt chuẩn sàn, sẵn sàng cho các vòng phỏng vấn hội đồng."],["➔"],["• Chung tu \u0026 Kenh: Hội Đồng Tuyển Dụng Nhân Tài Lãnh Đạo \u0026 Ban Nhân Sự Chế Độ Đãi Ngộ C\u0026B","• Nghiep vu thuc thi: Rà soát tính xác thực của các chứng chỉ và thành tích tiết kiệm 3,2M USD ➔ Phê duyệt ứng viên vào danh sách phỏng vấn ngắn kèm dự toán gói di chuyển $15k.","• Ket qua \u0026 Kiem soat: Xác lập phương án chiêu mộ nhân tài công nghệ cao an toàn, đúng ngân sách."]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["PHASE 1","DEFINING JOB SPECIFICATIONS \u0026 COMPENSATION PACKAGING"],[],["PHASE 2","CANDIDATE APPLICATION \u0026 CREDENTIAL BENCHMARK MATCHING"],[],["PHASE 3","EXECUTIVE VETTING \u0026 RELOCATION BENEFIT AUTHORIZATION"]],[["• Documents \u0026 Channels: Enterprise Career Portal \u0026 Executive Search Headhunting Network","• Core Business Execution: Publish Cloud Director posting ➔ Mandate 10+ years experience, AWS/Azure professional certs, and establish $215k-$245k salary with $15k relocation budget.","• Key Deliverable \u0026 Control: Rigorous qualification gateway calibrated for mission-critical enterprise engineering."],["➔"],["• Documents \u0026 Channels: Executive Recruiting Desk \u0026 Cloud Architecture Portfolio Dossier","• Core Business Execution: David Thorne submits credentials proving 12 years leadership, 45 successful migrations, dual AWS/Azure certifications, and immediate Seattle relocation pledge.","• Key Deliverable \u0026 Control: Validated high-caliber candidate dossier exceeding baseline requirements."],["➔"],["• Documents \u0026 Channels: Talent Acquisition Committee \u0026 Corporate Compensation \u0026 Benefits Desk","• Core Business Execution: Verify architectural track record and $3.2M efficiency gains ➔ Advance candidate to executive panel interview with pre-approved $15k relocation framework.","• Key Deliverable \u0026 Control: De-risked executive talent onboarding aligned with enterprise headcount goals."]]],"t":"table"},"4.2 BẢN THUYẾT MINH FEYNMAN SONG NGỮ (ĐA GÓC NHÌN NGHIỆP VỤ)","• Bức tranh Toàn cảnh Nghiệp vụ (End-to-End Business Flow): Tuyển dụng Nhân sự Lãnh đạo Công nghệ (Executive Tech Recruitment) là mắt xích sống còn trong quản trị doanh nghiệp hiện đại. Khi một vị trí giám đốc hạ tầng bị khuyết, doanh nghiệp đối mặt với rủi ro an ninh mạng và gián đoạn vận hành hệ thống. Quá trình tuyển mộ diễn ra qua 3 bước: Xây dựng khung năng lực và gói đãi ngộ hấp dẫn (lương, thưởng cổ phiếu RSU, hỗ trợ chuyển nhà) ➔ Tiếp nhận và sàng lọc hồ sơ ứng viên đối soát với các mốc chuẩn kỹ thuật ➔ Phỏng vấn hội đồng và kích hoạt hợp đồng lao động cấp cao.","• Lăng kính Viễn thông / CNTT Viettel: Tại Tập đoàn Viettel, việc chiêu mộ các chuyên gia và lãnh đạo kiến trúc đám mây (Cloud Architects) cho hạ tầng Viettel Cloud và hệ sinh thái Tammi/mBCCS đòi hỏi quy trình thẩm định cực kỳ khắt khe. Các ứng viên không chỉ cần thâm niên kinh nghiệm thực chiến trên 10 năm mà còn phải có các chứng chỉ bảo mật quốc tế cao cấp, năng lực thiết kế hệ thống viễn thông chịu tải hàng chục triệu thuê bao đồng thời, và cam kết gắn bó lâu dài thông qua các chính sách đãi ngộ thu hút nhân tài toàn cầu.","• Lăng kính Quản trị Mầm non Ước Mơ Xanh: Tại trường mầm non, tuyển dụng nhân sự chủ chốt (như Bếp trưởng dinh dưỡng hay Cô giáo Phụ trách khối Mẫu giáo) cũng tuân theo nguyên lý đối chuẩn: Nhà trường đưa ra tiêu chuẩn bằng cấp sư phạm, chứng chỉ an toàn vệ sinh thực phẩm và kinh nghiệm chăm sóc trẻ ➔ Cô giáo nộp hồ sơ chứng minh số năm công tác và kỹ năng xử lý tình huống sư phạm ➔ Ban giám hiệu phỏng vấn thử việc và hỗ trợ phụ cấp đi lại cho các cô ở xa trường.","• Lăng kính Bàn học Gia đình (Kèm cặp Bé Hà Ngân Lớp Lá 5 Tuổi): Để giải thích cho bé Hà Ngân, ba dùng hình ảnh tuyển thuyền trưởng cho con tàu thám hiểm: \u0027Hà Ngân ơi, một con tàu vũ trụ khổng lồ muốn bay lên mặt trăng thì cần tìm một bác thuyền trưởng thật giỏi lái tàu ít nhất 10 năm và có bằng lái xịn nhất thế giới. Khi bác David nộp đơn, bác khoe bác đã lái tàu được 12 năm rồi, có cả hai chiếc huy hiệu lái tàu xuất sắc nhất và bác sẵn sàng dọn nhà đến gần bến tàu để lái tàu mỗi ngày. Thế là các chú trên tàu mời bác David đến thử việc và tặng bác một khoản tiền để bác chuyển đồ chơi của các bạn nhỏ nhà bác sang thành phố mới đấy!\u0027","4.3 PHÂN TÍCH CHUYÊN SÂU DÀNH CHO BUSINESS ANALYST (ENGLISH BA PERSPECTIVE)","• Competency Framework Gating in Talent Acquisition Systems: From an enterprise HR systems perspective, Business Analysts must design applicant tracking systems (ATS) that parse and cross-reference structured qualification vectors. In our case study, the system matches candidate attributes (12-year experience counter, verified AWS/Azure certification tokens, and geographic willingness flags) directly against job requisition rules, automating initial qualification scoring before routing dossiers to executive interview panels.","• Total Cost of Workforce (TCOW) \u0026 Relocation Package Modeling: BAs analyzing executive compensation models must account for ancillary talent acquisition overhead. A comprehensive offer consists not merely of the base salary band ($215k-$245k), but must factor in discretionary bonus multipliers (up to 30%), RSU dilution schedules, and capital-allocated relocation allowances ($15,000 cap). Modeling these variable components ensures accurate enterprise budget forecasting and seamless integration with corporate ERP payroll ledgers.","BỘ TỪ VỰNG CHUYÊN ĐỀ TINH HOA (SPECIALIZED VOCABULARY MASTERY)","Executive Recruitment  /ɪɡˈzek.jə.t̬ɪv rɪˈkruːt.mənt/  Headhunting / Senior Leadership Talent Search / C-Level Talent Acquisition / Executive Search Sourcing","Nghia: Tuyển dụng nhân sự cấp điều hành/lãnh đạo cao cấp, quy trình tìm kiếm, sàng lọc và chiêu mộ các giám đốc, phó chủ tịch hoặc chuyên gia đầu ngành cho các vị trí chiến lược của doanh nghiệp.","Vd: The technology conglomerate engaged a specialized headhunter firm for its global executive recruitment drive. - Tập đoàn công nghệ đã thuê một công ty săn đầu người chuyên nghiệp cho chiến dịch tuyển dụng nhân sự lãnh đạo toàn cầu của mình.","Commensurate with  /kəˈmen.sjɚ.ɪt wɪð/  Proportionate to / In accordance with / Corresponding to / Consistent with / Scaled to","Nghia: Tương xứng với, phù hợp và cân xứng với mức độ kinh nghiệm, trình độ học vấn hoặc năng lực thực tế.","Vd: The executive compensation package will be strictly commensurate with the candidate\u0027s verified industry track record. - Gói đãi ngộ cấp điều hành sẽ hoàn toàn tương xứng với thành tích ngành đã được xác thực của ứng viên.","Restricted Stock Unit (RSU)  /rɪˈstrɪk.tɪd stɑːk ˈjuː.nɪt/  Equity Compensation / Company Stock Grant / Deferred Equity Incentive / Vesting Share Grant","Nghia: Đơn vị cổ phiếu hạn chế chuyển nhượng, một hình thức thù lao bằng cổ phiếu doanh nghiệp cam kết trao cho nhân viên theo lộ trình gắn bó và đạt mục tiêu hiệu suất.","Vd: In addition to a high base salary, the new director was granted 2,000 RSUs vesting over a four-year period. - Ngoài mức lương cơ bản cao, vị giám đốc mới đã được cấp 2.000 cổ phiếu RSU với lộ trình thụ hưởng kéo dài trong bốn năm.","Orchestrate  /ˈɔːr.kə.streɪt/  Coordinate / Organize / Oversee / Direct / Manage / Spearhead / Mastermind","Nghia: Điều phối, chỉ đạo, tổ chức và sắp xếp một chương trình, chiến dịch hoặc quy trình phức tạp nhiều bên tham gia để đạt kết quả tối ưu.","Vd: The lead engineer successfully orchestrated the seamless migration of legacy databases to the new cloud cluster. - Kỹ sư trưởng đã điều phối thành công cuộc chuyển đổi liền mạch từ các cơ sở dữ liệu cũ sang cụm đám mây mới.","Relocation Package  /ˌriː.loʊˈkeɪ.ʃən ˈpæk.ɪdʒ/  Moving Reimbursement / Relocation Allowance / Transfer Assistance Stipend / Moving Expense Coverage","Nghia: Gói hỗ trợ di dời nơi ở, khoản kinh phí hoặc dịch vụ do công ty chi trả để giúp nhân viên mới hoặc người được điều động chuyển gia đình đến thành phố làm việc mới.","Vd: The executive relocation package covered full moving expenses, legal closing costs, and three months of corporate housing. - Gói hỗ trợ di dời cấp điều hành chi trả toàn bộ phí vận chuyển, chi phí pháp lý và ba tháng nhà ở tạm thời của công ty.","Discretionary Bonus  /dɪˈskreʃ.ə.ner.i ˈboʊ.nəs/  Performance-Based Incentive / Variable Incentive Payout / Merit Bonus / Management-Determined Bonus","Nghia: Khoản tiền thưởng tùy ý theo hiệu suất, phần thưởng tài chính không cố định trong hợp đồng mà được ban giám đốc quyết định dựa trên kết quả kinh doanh và đóng góp vượt trội.","Vd: Outstanding revenue growth allowed the board of directors to approve a 25% discretionary bonus for all team leaders. - Tăng trưởng doanh thu vượt trội đã cho phép hội đồng quản trị phê duyệt mức thưởng tùy ý 25% cho toàn bộ các trưởng nhóm.","==================================================================================================","BÀI 2: QUY TRÌNH PHỎNG VẤN ĐA VÒNG, THƯ MỜI NHẬN VIỆC \u0026 GÓI ĐÃI NGỘ C\u0026B (MULTI-STAGE INTERVIEW, OFFICIAL JOB OFFER \u0026 COMPENSATION NEGOTIATION)","ETS TOEIC - Triple Passage (Q186-190) - Executive Job Offer, Compensation \u0026 Benefits (C\u0026B) \u0026 Notice Period Negotiation","BÀI TẬP VÀ PHƯƠNG PHÁP GIẢI TOEIC PART 7 THEO NGUYÊN BẢN (FIRST PRINCIPLES)","1. ĐỀ BÀI GỐC (TRIPLE PASSAGE: INTERVIEW EVALUATION MEMO, FORMAL JOB OFFER \u0026 CANDIDATE NEGOTIATION EMAIL)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","INTERVIEW MEMORANDUM","APEX BIOHEALTH PHARMACEUTICALS CORP. — BOSTON, MA","INTERNAL TALENT ACQUISITION MEMORANDUM","TO: Senior Leadership Hiring Committee","FROM: Marcus Gallagher, Head of Talent Acquisition","DATE: April 28","SUBJECT: Candidate Recommendation: Senior Product Marketing Manager (Ref #MKT-884)","Following our extensive multi-stage evaluation process—which included technical domain assessments, cross-functional stakeholder presentations, and panel interviews with commercial directors—the committee unanimously recommends extending a formal job offer to Ms. Sophia Lin.","Throughout the final interview round on April 26, Ms. Lin demonstrated exceptional market strategy acumen, having spearheaded product launches across three European regulatory jurisdictions in her previous role at BioGenix Laboratories. Her references confirmed exemplary leadership and cross-departmental collaboration capabilities. Upon executive committee sign-off, our HR operations team will issue the standardized compensation and benefits package.","JOB OFFER LETTER","APEX BIOHEALTH PHARMACEUTICALS CORP.","750 Technology Square, Cambridge, MA 02139","May 2","Ms. Sophia Lin","428 Beacon Street, Apt. 5B","Boston, MA 02116","Dear Ms. Lin,","On behalf of Apex BioHealth Pharmaceuticals, I am delighted to formally offer you the full-time position of Senior Product Marketing Manager, reporting directly to our Vice President of Global Commercial Strategy. We were deeply impressed by your strategic vision and believe your expertise will accelerate our oncology therapeutic product portfolio.","The core terms of your employment offer are detailed below:","• Base Salary: An annualized base salary of $138,000, disbursed bi-weekly via direct payroll deposit.","• Sign-on Bonus: A one-time sign-on bonus of $12,000, payable on your first regular payroll distribution cycle, subject to applicable tax withholdings.","• Annual Incentive: Eligibility for an annual discretionary performance bonus with an enterprise target of 15% of your base salary.","• Health \u0026 Retirement: Comprehensive Tier-1 medical, dental, and vision coverage commencing on your first day of active employment, along with an immediate 5% dollar-for-dollar 401(k) employer matching contribution.","• Paid Time Off: Accrual of four weeks (20 business days) of paid vacation annually, plus ten recognized company holidays.","• Official Start Date: Monday, June 1.","Please note that this formal offer is contingent upon the successful completion of a routine pre-employment background screening and verification of academic credentials. To accept this offer, please electronically sign and return this document no later than 5:00 PM EST on Tuesday, May 12.","Sincerely,","Dr. Eleanor Vance","Chief Human Resources Officer","Apex BioHealth Pharmaceuticals Corp.","EMAIL","To: Dr. Eleanor Vance \u003ce.vance@apexbiohealth.com\u003e","From: Sophia Lin \u003csophia.lin@biogenix-alumni.org\u003e","Date: May 5","Subject: Job Offer Acceptance \u0026 Schedule Clarification — Sophia Lin","Dear Dr. Vance,","Thank you very much for extending the formal employment offer for the Senior Product Marketing Manager position. I am thrilled by the prospect of joining Apex BioHealth and enthusiastically accept the proposed compensation terms, including the base salary, sign-on incentive, and comprehensive benefits structure.","However, I would like to request a slight adjustment regarding my official start date. Under the executive employment contract at my current company, BioGenix Laboratories, I am legally obligated to fulfill a mandatory 30-day contractual notice period following formal resignation. Because I intend to submit my notice tomorrow morning, my final day of employment at BioGenix will be June 12.","Consequently, having a commencement date of June 1 is legally infeasible. I respectfully propose establishing Monday, June 15, as my official first day of active employment at Apex BioHealth. In the interim, I remain fully available to complete digital onboarding paperwork and can attend the remote benefits orientation scheduled for June 8 if permitted.","I have attached my signed acceptance document and look forward to your confirmation of the revised start date.","Warm regards,","Sophia Lin","(617) 555-0193","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","186. What is the primary purpose of the second document?","(A) To schedule a medical examination at a regional health clinic","(B) To outline the formal terms of an executive employment offer","(C) To announce corporate earnings results for the previous quarter","(D) To terminate an ongoing clinical trial agreement with a partner firm","187. According to the job offer letter, when will the sign-on bonus be disbursed?","(A) Exactly six months after satisfactory job performance","(B) During the first regular employee payroll distribution cycle","(C) Immediately upon electronic submission of the signed offer","(D) At the end of the calendar fiscal year in December","188. Why does Ms. Lin request a postponement of her original start date?","(A) She must complete an extended international vacation with her family.","(B) She is recovering from an unexpected medical surgical procedure.","(C) She is legally required to fulfill a 30-day notice period at her current workplace.","(D) She is waiting for the outcome of an interview with a competing firm.","189. In the job offer letter, the word \u0027contingent\u0027 in paragraph 4, line 1 is closest in meaning to:","(A) temporary","(B) dependent","(C) accidental","(D) resistant","190. What new start date does Ms. Lin propose in her email?","(A) May 12","(B) June 1","(C) June 8","(D) June 15","2. CHIẾN LƯỢC ĐỌC HIỂU 5 PHÚT TỐI ƯU (FIRST PRINCIPLES STRATEGY)","CHIẾN THUẬT 5 PHÚT TỐI ƯU: NẮM BẮT BỐI CẢNH, GHÉP NỐI DỮ KIỆN \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Quét Z-Pattern: Quét nhanh 3 văn bản: Văn bản 1 là Bản ghi nhớ Đánh giá Phỏng vấn (Interview Evaluation Memo) của Trưởng bộ phận Tuyển dụng gửi Ban Giám đốc Apex BioHealth đánh giá xuất sắc ứng viên Sophia Lin cho vị trí Giám đốc Tiếp thị Sản phẩm; Văn bản 2 là Thư Mời Nhận Việc Chính thức (Formal Job Offer Letter) đề xuất mức lương $138.000, thưởng gia nhập $12.000, ngày bắt đầu 1 tháng 6; Văn bản 3 là Thư điện tử (Email) từ cô Lin chấp thuận các điều khoản thù lao nhưng xin lùi ngày làm việc đến 15 tháng 6 do thời hạn báo trước 30 ngày tại công ty cũ.","Bước 2 (60 giây) - Móc nối Logic \u0026 Sơ đồ Tinh thần: Thiết lập chuỗi đàm phán hợp đồng lao động: Đánh giá phỏng vấn hoàn tất (Văn bản 1) ➔ Phát hành thư mời nhận việc với ngày bắt đầu dự kiến 1/6 kèm hạn chót ký ngày 12/5 (Văn bản 2) ➔ Phản hồi của ứng viên chấp thuận gói C\u0026B nhưng đàm phán lùi ngày bắt đầu sang 15/6 vì ràng buộc điều khoản thời gian báo trước (Notice Period) tại BioGenix Labs (Văn bản 3).","Bước 3 (120 giây) - Định vị Manh mối \u0026 Giải đề Tốc độ: Câu 186 hỏi mục đích chính của văn bản 2 (chính thức đưa ra lời mời làm việc và nêu chi tiết gói đãi ngộ); Câu 187 hỏi điều kiện chi trả khoản thưởng ký hợp đồng (chi trả vào kỳ lương đầu tiên); Câu 188 (câu hỏi liên kết) hỏi lý do cô Lin xin đổi ngày nhận việc (ràng buộc thời gian báo trước 30 ngày ở công ty hiện tại); Câu 189 (từ vựng theo ngữ cảnh) hỏi từ \u0027contingent\u0027 trong đoạn 3 (đồng nghĩa với dependent); Câu 190 (câu hỏi liên kết) hỏi ngày bắt đầu làm việc mới do cô Lin đề xuất (ngày 15 tháng 6).","Bước 4 (30 giây) - Đúc kết Feynman 1 Câu: Hiểu bản chất: Thư mời làm việc (Job Offer Letter) là một lời đề nghị giao kết hợp đồng có tính ràng buộc; khi ứng viên đồng ý về thù lao nhưng xin đổi ngày đi làm vì nghĩa vụ báo trước (Notice Period) với nơi làm cũ, đó là bước đàm phán lịch trình bắt đầu công việc điển hình trong quản trị nhân sự.","3. BẢN DỊCH SONG NGỮ TOÀN VĂN (BILINGUAL PARALLEL TRANSLATION)","VĂN BẢN 1: BẢN GHI NHỚ ĐÁNH GIÁ PHỎNG VẤN NỘI BỘ (APEX BIOHEALTH)","APEX BIOHEALTH PHARMACEUTICALS CORP. — BOSTON, MA","INTERNAL TALENT ACQUISITION MEMORANDUM","TO: Senior Leadership Hiring Committee","FROM: Marcus Gallagher, Head of Talent Acquisition","DATE: April 28","SUBJECT: Candidate Recommendation: Senior Product Marketing Manager (Ref #MKT-884)","TẬP ĐOÀN DƯỢC PHẨM APEX BIOHEALTH — BOSTON, MA","BẢN GHI NHỚ TUYỂN DỤNG NHÂN TÀI NỘI BỘ","GỬI: Hội đồng Tuyển dụng Lãnh đạo Cấp cao","TỪ: Marcus Gallagher, Trưởng bộ phận Tuyển dụng Nhân tài","NGÀY: 28 tháng 4","CHỦ ĐỀ: Đề xuất Ứng viên: Giám đốc Tiếp thị Sản phẩm Cấp cao (Mã #MKT-884)","Following our extensive multi-stage evaluation process—which included technical domain assessments, cross-functional stakeholder presentations, and panel interviews with commercial directors—the committee unanimously recommends extending a formal job offer to Ms. Sophia Lin.","Sau quy trình đánh giá đa vòng toàn diện của chúng tôi—bao gồm các bài kiểm tra chuyên môn kỹ thuật, bài thuyết trình trước các bên liên quan đa phòng ban và các cuộc phỏng vấn hội đồng với các giám đốc thương mại—hội đồng nhất trí đề xuất gửi thư mời làm việc chính thức tới cô Sophia Lin.","Throughout the final interview round on April 26, Ms. Lin demonstrated exceptional market strategy acumen, having spearheaded product launches across three European regulatory jurisdictions in her previous role at BioGenix Laboratories. Her references confirmed exemplary leadership and cross-departmental collaboration capabilities. Upon executive committee sign-off, our HR operations team will issue the standardized compensation and benefits package.","Trong suốt vòng phỏng vấn cuối cùng vào ngày 26 tháng 4, cô Lin đã thể hiện sự nhạy bén chiến lược thị trường xuất sắc, từng dẫn dắt việc ra mắt sản phẩm tại ba khu vực pháp lý châu Âu trong vai trò trước đây tại BioGenix Laboratories. Những người tham chiếu của cô đã xác nhận năng lực lãnh đạo mẫu mực và kỹ năng phối hợp liên phòng ban tuyệt vời. Ngay sau khi ban điều hành phê duyệt, đội ngũ vận hành nhân sự của chúng tôi sẽ phát hành gói chế độ đãi ngộ và phúc lợi theo quy chuẩn.","VĂN BẢN 2: THƯ MỜI NHẬN VIỆC CHÍNH THỨC (JOB OFFER LETTER)","APEX BIOHEALTH PHARMACEUTICALS CORP.","750 Technology Square, Cambridge, MA 02139","May 2","Ms. Sophia Lin","428 Beacon Street, Apt. 5B","Boston, MA 02116","Dear Ms. Lin,","TẬP ĐOÀN DƯỢC PHẨM APEX BIOHEALTH","Số 750 Quảng trường Công nghệ, Cambridge, MA 02139","Ngày 2 tháng 5","Cô Sophia Lin","Số 428 Phố Beacon, Căn hộ 5B","Boston, MA 02116","Kính gửi Cô Lin,","On behalf of Apex BioHealth Pharmaceuticals, I am delighted to formally offer you the full-time position of Senior Product Marketing Manager, reporting directly to our Vice President of Global Commercial Strategy. We were deeply impressed by your strategic vision and believe your expertise will accelerate our oncology therapeutic product portfolio.","Thay mặt Tập đoàn Dược phẩm Apex BioHealth, tôi rất vui mừng chính thức gửi tới cô lời mời làm việc toàn thời gian cho vị trí Giám đốc Tiếp thị Sản phẩm Cấp cao, báo cáo trực tiếp cho Phó Chủ tịch Chiến lược Thương mại Toàn cầu. Chúng tôi vô cùng ấn tượng với tầm nhìn chiến lược của cô và tin tưởng rằng chuyên môn của cô sẽ thúc đẩy danh mục sản phẩm điều trị ung thư của chúng tôi.","The core terms of your employment offer are detailed below:","• Base Salary: An annualized base salary of $138,000, disbursed bi-weekly via direct payroll deposit.","• Sign-on Bonus: A one-time sign-on bonus of $12,000, payable on your first regular payroll distribution cycle, subject to applicable tax withholdings.","• Annual Incentive: Eligibility for an annual discretionary performance bonus with an enterprise target of 15% of your base salary.","Các điều khoản cốt lõi trong lời mời làm việc của cô được nêu chi tiết dưới đây:","• Lương cơ bản: Mức lương cơ bản thường niên là 138.000 USD, được chi trả hai tuần một lần qua chuyển khoản ngân hàng trực tiếp.","• Tiền thưởng ký hợp đồng: Khoản thưởng gia nhập một lần trị giá 12.000 USD, được chi trả vào kỳ phân phối lương định kỳ đầu tiên của cô, tuân thủ các khoản khấu trừ thuế hiện hành.","• Thưởng hiệu suất hàng năm: Đủ điều kiện nhận tiền thưởng hiệu suất tùy ý hàng năm với mục tiêu cấp doanh nghiệp là 15% mức lương cơ bản.","• Health \u0026 Retirement: Comprehensive Tier-1 medical, dental, and vision coverage commencing on your first day of active employment, along with an immediate 5% dollar-for-dollar 401(k) employer matching contribution.","• Paid Time Off: Accrual of four weeks (20 business days) of paid vacation annually, plus ten recognized company holidays.","• Official Start Date: Monday, June 1.","• Y tế \u0026 Hưu trí: Gói bảo hiểm y tế, nha khoa và thị lực Hạng 1 toàn diện bắt đầu có hiệu lực ngay từ ngày làm việc đầu tiên của cô, cùng với khoản đóng góp quỹ hưu trí 401(k) tương ứng 1-1 tỷ lệ 5% từ phía công ty.","• Nghỉ phép hưởng lương: Tích lũy bốn tuần (20 ngày làm việc) nghỉ phép có lương mỗi năm, cộng thêm mười ngày nghỉ lễ theo quy định của công ty.","• Ngày bắt đầu làm việc chính thức: Thứ Hai, ngày 1 tháng 6.","Please note that this formal offer is contingent upon the successful completion of a routine pre-employment background screening and verification of academic credentials. To accept this offer, please electronically sign and return this document no later than 5:00 PM EST on Tuesday, May 12.","Sincerely,","Dr. Eleanor Vance","Chief Human Resources Officer","Apex BioHealth Pharmaceuticals Corp.","Xin lưu ý rằng lời mời làm việc chính thức này phụ thuộc vào việc hoàn tất đạt yêu cầu quá trình thẩm tra lý lịch trước tuyển dụng định kỳ và xác thực văn bằng học thuật. Để chấp thuận lời mời này, vui lòng ký điện tử và gửi lại văn bản này trước 17:00 giờ chuẩn miền Đông (EST) vào Thứ Ba, ngày 12 tháng 5.","Trân trọng,","Tiến sĩ Eleanor Vance","Giám đốc Nhân sự Cấp cao","Tập đoàn Dược phẩm Apex BioHealth","VĂN BẢN 3: THƯ ĐIỆN TỬ PHẢN HỒI \u0026 ĐÀM PHÁN THỜI HẠN (SOPHIA LIN)","To: Dr. Eleanor Vance \u003ce.vance@apexbiohealth.com\u003e","From: Sophia Lin \u003csophia.lin@biogenix-alumni.org\u003e","Date: May 5","Subject: Job Offer Acceptance \u0026 Schedule Clarification — Sophia Lin","Gửi: Tiến sĩ Eleanor Vance \u003ce.vance@apexbiohealth.com\u003e","Từ: Sophia Lin \u003csophia.lin@biogenix-alumni.org\u003e","Ngày: 5 tháng 5","Chủ đề: Chấp thuận Thư mời Làm việc \u0026 Làm rõ Lịch trình — Sophia Lin","Dear Dr. Vance,","Thank you very much for extending the formal employment offer for the Senior Product Marketing Manager position. I am thrilled by the prospect of joining Apex BioHealth and enthusiastically accept the proposed compensation terms, including the base salary, sign-on incentive, and comprehensive benefits structure.","Kính gửi Tiến sĩ Vance,","Cảm ơn bà rất nhiều vì đã gửi lời mời làm việc chính thức cho vị trí Giám đốc Tiếp thị Sản phẩm Cấp cao. Tôi rất hào hứng trước triển vọng gia nhập Apex BioHealth và nhiệt thành chấp thuận các điều khoản đãi ngộ được đề xuất, bao gồm mức lương cơ bản, khoản thưởng gia nhập và cơ cấu phúc lợi toàn diện.","However, I would like to request a slight adjustment regarding my official start date. Under the executive employment contract at my current company, BioGenix Laboratories, I am legally obligated to fulfill a mandatory 30-day contractual notice period following formal resignation. Because I intend to submit my notice tomorrow morning, my final day of employment at BioGenix will be June 12.","Tuy nhiên, tôi muốn xin một sự điều chỉnh nhỏ liên quan đến ngày bắt đầu làm việc chính thức của mình. Theo hợp đồng lao động cấp quản lý tại công ty hiện tại của tôi, BioGenix Laboratories, tôi có nghĩa vụ pháp lý phải hoàn thành thời hạn báo trước theo hợp đồng bắt buộc là 30 ngày sau khi nộp đơn từ chức chính thức. Vì tôi dự định nộp đơn vào sáng mai, ngày làm việc cuối cùng của tôi tại BioGenix sẽ là ngày 12 tháng 6.","Consequently, having a commencement date of June 1 is legally infeasible. I respectfully propose establishing Monday, June 15, as my official first day of active employment at Apex BioHealth. In the interim, I remain fully available to complete digital onboarding paperwork and can attend the remote benefits orientation scheduled for June 8 if permitted.","I have attached my signed acceptance document and look forward to your confirmation of the r
