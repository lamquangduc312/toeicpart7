800","[Dau vet bai doc / Clue]: Văn bản 1, Mục Home Office Ergonomic Stipend: \u0027...Omniverse provides a one-time non-taxable equipment stipend of up to $800 per eligible employee.\u0027","[Dien dat tuong duong / Paraphrase]: stipend of up to $800 ➔ $800","[Loi giai chi tiet]: Chính sách ở Văn bản 1 nêu rõ mức trợ cấp trang thiết bị một lần tối đa cho mỗi nhân viên đủ điều kiện là 800 USD.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) $75","- Ly do sai: 75 USD là khoản phụ cấp kết nối mạng internet hàng tháng, không phải trợ cấp thiết bị.","- Bay ETS: Bẫy Phụ cấp Internet Hàng tháng (Monthly Internet Allowance Trap)","(B) $245","- Ly do sai: 245 USD là giá tiền của chiếc bàn đứng ErgoLift trong phiếu kê khai của cô Gomez.","- Bay ETS: Bẫy Giá Bàn đứng Đơn lẻ (Item Cost Trap)","(C) $745","- Ly do sai: 745 USD là tổng số tiền mà cô Gomez đã mua và yêu cầu bồi hoàn, không phải hạn mức tối đa của công ty.","- Bay ETS: Bẫy Số tiền Thực kê khai (Actual Claim Total Trap)","Why was Ms. Gomez\u0027s reimbursement claim approved without any financial reduction?","Dap an dung: (A) Her total requested expenditure did not exceed the corporate policy ceiling.","[Dau vet bai doc / Clue]: Văn bản 1 quy định mức tối đa 800 USD. Văn bản 3, Đoạn 1: \u0027Because all purchased items comply precisely with our ergonomic hardware guidelines and the total expense falls cleanly within our $800 policy ceiling...\u0027","[Dien dat tuong duong / Paraphrase]: falls cleanly within our $800 policy ceiling ➔ total requested expenditure did not exceed the corporate policy ceiling","[Loi giai chi tiet]: Bằng phương pháp suy luận chéo giữa Văn bản 1, 2 và 3: Tổng số tiền cô Gomez yêu cầu bồi hoàn là 745 USD, nằm trọn vẹn dưới hạn mức trần 800 USD của công ty, do đó được phê duyệt nguyên vẹn 100%.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(B) She agreed to work entirely on-site at the San Francisco headquarters","- Ly do sai: Cô Gomez được duyệt làm việc từ xa vào thứ Ba và thứ Năm, không phải làm 100% tại văn phòng.","- Bay ETS: Bẫy Làm việc Trực tiếp Toàn thời gian (Full On-site Trap)","(C) She donated her previously owned computer monitor to the local office","- Ly do sai: Không có thông tin nào về việc cô quyên góp thiết bị cũ cho văn phòng.","- Bay ETS: Bẫy Quyên góp Thiết bị (Donation Trap)","(D) Her department director personally paid for the standing desk converter","- Ly do sai: Khoản chi do ngân sách công ty bồi hoàn qua bảng lương, giám đốc không tự bỏ tiền túi trả.","- Bay ETS: Bẫy Giám đốc Tự trả Tiền (Personal Payment Trap)","In the policy directive, the word \u0027stipend\u0027 in paragraph 2, line 3 is closest in meaning to:","Dap an dung: (B) allowance","[Dau vet bai doc / Clue]: Văn bản 1, Đoạn 2: \u0027...Omniverse provides a one-time non-taxable equipment stipend of up to $800 per eligible employee.\u0027","[Dien dat tuong duong / Paraphrase]: equipment stipend ➔ financial allowance / subsidy / grant","[Loi giai chi tiet]: Từ \u0027stipend\u0027 trong quản trị đãi ngộ nhân sự có nghĩa là khoản trợ cấp, phụ cấp tiền mặt được công ty cấp cho nhân viên cho mục đích cụ thể (allowance).","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) penalty","- Ly do sai: \u0027Penalty\u0027 có nghĩa là hình phạt, chế tài tài chính, trái ngược với khoản tiền hỗ trợ.","- Bay ETS: Bẫy Tiền phạt Trái nghĩa (Penalty Antonym Trap)","(C) invoice","- Ly do sai: \u0027Invoice\u0027 là hóa đơn đòi tiền của nhà cung cấp, không phải khoản trợ cấp.","- Bay ETS: Bẫy Hóa đơn Đòi tiền (Invoice Trap)","(D) discount","- Ly do sai: \u0027Discount\u0027 có nghĩa là mức chiết khấu giảm giá của người bán hàng.","- Bay ETS: Bẫy Chiết khấu Giảm giá (Discount Trap)","When will Ms. Gomez receive her approved equipment reimbursement funds?","Dap an dung: (C) February 15","[Dau vet bai doc / Clue]: Văn bản 3, Đoạn 2: \u0027Accounts Payable has confirmed that your $745.00 disbursement will be credited directly to your upcoming February 15 payroll direct deposit.\u0027","[Dien dat tuong duong / Paraphrase]: credited directly to your upcoming February 15 payroll direct deposit ➔ February 15","[Loi giai chi tiet]: Văn bản 3 xác nhận rõ ràng: Phòng Kế toán Thanh toán sẽ chuyển khoản trực tiếp số tiền 745 USD bồi hoàn vào tài khoản ngân hàng của cô trong kỳ lương ngày 15 tháng 2.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) January 15","- Ly do sai: Ngày 15 tháng 1 là ngày chính sách làm việc từ xa bắt đầu có hiệu lực.","- Bay ETS: Bẫy Ngày Hiệu lực Chính sách (Policy Effective Date Trap)","(B) January 26","- Ly do sai: Ngày 26 tháng 1 là ngày cô Gomez nộp phiếu đề nghị bồi hoàn.","- Bay ETS: Bẫy Ngày Nộp Hồ sơ (Submission Date Trap)","(D) February 28","- Ly do sai: Ngày 28 tháng 2 là hạn chót cuối cùng để nộp phiếu yêu cầu chi phí theo quy định.","- Bay ETS: Bẫy Hạn chót Nộp Hồ sơ (Final Filing Deadline Trap)","PHƯƠNG PHÁP FEYNMAN - BẢN THUYẾT MINH BẬC THẦY","4.1 QUY TRÌNH NGHIỆP VỤ 3 BƯỚC TUẦN TỰ (DUAL SEQUENTIAL WORKFLOWS)","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","BAN HÀNH CHÍNH SÁCH LÀM VIỆC TỪ XA \u0026 HẠN MỨC TRỢ CẤP"],[],["BƯỚC 2","MUA SẮM THIẾT BỊ CÔNG THÁI HỌC \u0026 KÊ KHAI BỒI HOÀN"],[],["BƯỚC 3","QUẢN LÝ DUYỆT CHI \u0026 CHỐT LỊCH LÀM VIỆC LINH HOẠT"]],[["• Chung tu \u0026 Kenh: Hội Đồng Quản Trị Nhân Sự \u0026 Cổng Thông Tin Chính Sách Nội Bộ","• Nghiep vu thuc thi: Ban hành khung làm việc hỗn hợp 3/2 ➔ Áp khung giờ hợp tác cốt lõi 10h-15h PST và gói trợ cấp thiết bị công thái học tối đa $800 kèm phụ cấp mạng $75/tháng.","• Ket qua \u0026 Kiem soat: Quy chế làm việc linh hoạt chuẩn hóa bảo đảm công bằng và sức khỏe nhân viên."],["➔"],["• Chung tu \u0026 Kenh: Cổng Quản Lý Chi Phí Doanh Nghiệp SAP Concur \u0026 Hóa Đơn Điện Tử BestBuy/Ergo","• Nghiep vu thuc thi: Rachel Gomez mua màn hình 4K ($385), bàn đứng ($245) và router mạng ($115) tổng $745 ➔ Nộp phiếu kê khai hợp lệ kèm hóa đơn trước hạn 28/2.","• Ket qua \u0026 Kiem soat: Hồ sơ đề nghị bồi hoàn hợp lệ, nằm trọn vẹn trong hạn mức ngân sách được duyệt."],["➔"],["• Chung tu \u0026 Kenh: Hệ Thống Phê Duyệt Quản Lý \u0026 Phòng Kế Toán Thanh Toán (AP Payroll)","• Nghiep vu thuc thi: Gregory Chang duyệt chi $745 ghi có vào kỳ lương 15/2 ➔ Chính thức chốt lịch làm việc tại nhà vào thứ Ba và thứ Năm hàng tuần cho nhân viên.","• Ket qua \u0026 Kiem soat: Hoàn tất thủ tục bồi hoàn minh bạch, thiết lập không gian làm việc đạt chuẩn hiệu năng."]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["PHASE 1","POLICY PROMULGATION \u0026 EQUIPMENT ALLOWANCE GATING"],[],["PHASE 2","ERGONOMIC PROCUREMENT \u0026 EXPENSE SUBMISSION"],[],["PHASE 3","MANAGERIAL SIGN-OFF \u0026 PAYROLL DISBURSEMENT"]],[["• Documents \u0026 Channels: Corporate HR Policy Desk \u0026 Employee Intranet Governance Portal","• Core Business Execution: Enact 3/2 flexible workplace framework ➔ Mandate 10 AM - 3 PM core hours and establish $800 ergonomic equipment stipend with $75 monthly connectivity.","• Key Deliverable \u0026 Control: Equitable remote workplace guidelines safeguarding ergonomics and organizational alignment."],["➔"],["• Documents \u0026 Channels: Concur Expense Management Platform \u0026 Commercial Invoices","• Core Business Execution: Procure 4K monitor ($385), standing desk ($245), and fiber router ($115) totaling $745 ➔ File itemized claim with PDF receipts before Feb 28 deadline.","• Key Deliverable \u0026 Control: Fully documented expense claim strictly adhering to enterprise reimbursement thresholds."],["➔"],["• Documents \u0026 Channels: Managerial Approval Gateway \u0026 Accounts Payable Payroll Ledger","• Core Business Execution: Gregory Chang authorizes $745 for Feb 15 direct deposit credit ➔ Confirm hybrid schedule assigning Tuesday and Thursday as remote focus days.","• Key Deliverable \u0026 Control: Closed-loop expense reimbursement operationalizing certified home workstations."]]],"t":"table"},"4.2 BẢN THUYẾT MINH FEYNMAN SONG NGỮ (ĐA GÓC NHÌN NGHIỆP VỤ)","• Bức tranh Toàn cảnh Nghiệp vụ (End-to-End Business Flow): Quản trị Làm việc Linh hoạt \u0026 Bồi hoàn Chi phí Văn phòng Tại gia (Hybrid Work Governance \u0026 Stipend Reimbursement) là bài toán phổ biến của các tập đoàn công nghệ toàn cầu. Mô hình làm việc hiện đại đòi hỏi sự cân bằng tinh tế giữa phúc lợi và kỷ luật: Doanh nghiệp hỗ trợ ngân sách cho nhân viên tự sắm bàn ghế chống đau lưng (ergonomics), màn hình lớn và đường truyền mạng ổn định ➔ Nhân viên có trách nhiệm nộp hóa đơn hợp lệ đúng hạn mức quy định (không được vượt trần) ➔ Cấp quản lý phê duyệt và chuyển tiền bồi hoàn vào kỳ lương gần nhất, đồng thời thống nhất lịch trực văn phòng để bảo đảm các cuộc họp quan trọng không bị vắng mặt.","• Lăng kính Viễn thông / CNTT Viettel: Tại Tập đoàn Viettel, trong các giai đoạn chuyển dịch số và triển khai các dự án phần mềm trọng điểm (như trợ lý ảo Tammi, hệ thống tính cước BCCS), nhiều đội ngũ kỹ sư công nghệ được áp dụng cơ chế làm việc linh hoạt (Flexitime / Hybrid). Viettel trang bị hạ tầng kết nối bảo mật VPN, cấp đường truyền internet cáp quang Viettel tốc độ cao và hỗ trợ trang thiết bị đầu cuối cho các chuyên gia, đồng thời thiết lập khung giờ giao ban cố định hàng ngày để theo dõi sát sao tiến độ sprint trên Jira.","• Lăng kính Quản trị Mầm non Ước Mơ Xanh: Tại trường mầm non, trong các đợt tập huấn trực tuyến hè hoặc hội thảo giáo dục sớm, các cô giáo được nhà trường hỗ trợ phụ cấp cước dữ liệu 4G và micro không dây để tham gia giảng dạy từ xa. Các cô gửi lại hóa đơn mua thiết bị cho Kế toán trường để được hoàn tiền vào bảng lương cuối tháng, đảm bảo mọi tiết học mẫu đều đạt chất lượng âm thanh và hình ảnh tốt nhất.","• Lăng kính Bàn học Gia đình (Kèm cặp Bé Hà Ngân Lớp Lá 5 Tuổi): Để giải thích cho bé Hà Ngân, ba dùng hình ảnh chiếc bàn học xinh xắn: \u0027Hà Ngân ơi, khi cô Rachel làm việc ở nhà, bác Giám đốc bảo: \u0027Công ty cho cô một khoản tiền mừng là 800 đồng để cô mua chiếc ghế ngồi êm ái không bị mỏi lưng và chiếc màn hình to để vẽ tranh nhé\u0027. Cô Rachel đi siêu thị mua hết 745 đồng, ít hơn 800 đồng bác Giám đốc cho. Thế là bác Giám đốc khen cô biết tiết kiệm và chuyển trả lại 745 đồng cho cô vào ngày trả lương, rồi cho phép cô được ở nhà làm việc vào thứ Ba và thứ Năm mỗi tuần đấy!\u0027","4.3 PHÂN TÍCH CHUYÊN SÂU DÀNH CHO BUSINESS ANALYST (ENGLISH BA PERSPECTIVE)","• Expense Audit Automation \u0026 Policy Threshold Gating in ERP: Business Analysts designing financial workflow automations must embed strict conditional logic into expense management systems (like Concur or SAP). When an employee files an \u0027Ergonomic Equipment\u0027 claim, the system must cross-check the claim total ($745) against the master policy limit ($800) and verify expense categories. Claims within policy limits route directly to single-tier manager approval, while any amount exceeding $800 triggers an automated split or exception routing to Finance Directors.","• Workforce Capacity Planning \u0026 Hybrid Scheduling Synchronization: A core analytical challenge in hybrid workforce systems is preventing office space under-utilization while ensuring collaboration density. By establishing \u0027Core Collaboration Hours\u0027 (10 AM - 3 PM) and fixed remote day quotas (Tuesday/Thursday), the enterprise balances individual autonomy with synchronous team alignment, feeding predictive occupancy data into corporate real estate facility management dashboards.","BỘ TỪ VỰNG CHUYÊN ĐỀ TINH HOA (SPECIALIZED VOCABULARY MASTERY)","Hybrid Work Model  /ˈhaɪ.brɪd wɝːk ˈmɑː.dəl/  Blended Work Schedule / Flexible Workplace Policy / Split In-Office \u0026 Remote Model","Nghia: Mô hình làm việc kết hợp/hỗn hợp, hình thức tổ chức công việc trong đó nhân viên phân chia thời gian làm việc giữa văn phòng công ty và làm việc từ xa tại nhà.","Vd: The technology firm adopted a 3/2 hybrid work model to balance team collaboration with personal flexibility. - Công ty công nghệ đã áp dụng mô hình làm việc kết hợp 3/2 để cân bằng giữa sự hợp tác nhóm và tính linh hoạt cá nhân.","Stipend  /ˈstaɪ.pend/  Allowance / Grant / Financial Subsidy / Expense Allocation / Monetary Support","Nghia: Khoản trợ cấp/phụ cấp định mức, số tiền cố định được công ty chi trả cho nhân viên để hỗ trợ một chi phí cụ thể như thiết bị làm việc, tiền mạng hay đào tạo.","Vd: All full-time remote employees received a one-time $800 stipend to purchase ergonomic home office furniture. - Tất cả nhân viên làm việc từ xa toàn thời gian đều nhận được khoản trợ cấp một lần trị giá 800 USD để mua sắm nội thất văn phòng tại gia công thái học.","Ergonomic  /ˌɝː.ɡəˈnɑː.mɪk/  Physiologically Designed / Posture-Supporting / Workplace Health-Optimized / User-Friendly Design","Nghia: Công thái học, thuộc tính thiết kế của trang thiết bị hoặc nội thất được tối ưu hóa để phù hợp với cơ thể con người, giảm thiểu căng thẳng cơ bắp và bảo vệ sức khỏe khi làm việc lâu.","Vd: Investing in ergonomic chairs and standing desks significantly reduced workplace fatigue and back pain. - Đầu tư vào ghế công thái học và bàn đứng đã giảm đáng kể tình trạng mệt mỏi và đau lưng tại nơi làm việc.","Core Hours  /kɔːr ˈaʊ.ɚz/  Mandatory Overlap Window / Synchronous Collaboration Period / Obligatory Working Hours","Nghia: Khung giờ làm việc cốt lõi, khoảng thời gian cố định trong ngày làm việc mà tất cả nhân viên (kể cả làm từ xa) bắt buộc phải trực tuyến để phối hợp và họp hành.","Vd: The company established core hours from 10:00 AM to 3:00 PM to facilitate team meetings across different time zones. - Công ty thiết lập khung giờ làm việc cốt lõi từ 10:00 sáng đến 3:00 chiều để tạo thuận lợi cho các cuộc họp nhóm giữa các múi giờ khác nhau.","Itemized Receipt  /ˈaɪ.t̬ə.maɪzd rɪˈsiːt/  Detailed Breakdown Invoice / Detailed Bill / Line-Item Sales Receipt / Specified Expense Proof","Nghia: Hóa đơn kê khai chi tiết, chứng từ bán hàng liệt kê rõ ràng từng mặt hàng đã mua, số lượng, đơn giá và tổng số tiền để phục vụ đối soát kế toán.","Vd: To claim reimbursement, the employee attached an itemized receipt displaying each hardware component purchased. - Để yêu cầu bồi hoàn, người nhân viên đã đính kèm một hóa đơn kê khai chi tiết hiển thị từng linh kiện phần cứng đã mua.","Reimbursement  /ˌriː.ɪmˈbɝːs.mənt/  Expense Repayment / Financial Restitution / Cost Compensation / Refund Disbursement","Nghia: Khoản tiền bồi hoàn/hoàn trả chi phí, việc công ty thanh toán lại cho nhân viên khoản tiền mà họ đã tự bỏ tiền túi ra chi trả trước cho các công việc của doanh nghiệp.","Vd: Approved equipment reimbursement claims are credited directly to the employee\u0027s payroll direct deposit. - Các yêu cầu bồi hoàn thiết bị đã được phê duyệt sẽ được ghi có trực tiếp vào khoản chuyển khoản bảng lương của nhân viên.","==================================================================================================","BÀI 7: CHẾ ĐỘ NGHỈ PHÉP PHỤ SẢN, PHÚC LỢI GIA ĐÌNH \u0026 QUY TRÌNH BÀN GIAO CÔNG VIỆC (PAID PARENTAL LEAVE, FAMILY WELLNESS \u0026 TRANSITION PROTOCOLS)","ETS TOEIC - Triple Passage (Q191-195) - Employee Benefits Guide, Parental Leave Application \u0026 HR Approval Confirmation","BÀI TẬP VÀ PHƯƠNG PHÁP GIẢI TOEIC PART 7 THEO NGUYÊN BẢN (FIRST PRINCIPLES)","1. ĐỀ BÀI GỐC (TRIPLE PASSAGE: BENEFITS GUIDE, LEAVE APPLICATION \u0026 HR CONFIRMATION LETTER)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","EMPLOYEE BENEFITS GUIDE","PINNACLE FINANCIAL HOLDINGS CORP. — CHARLOTTE, NC","EMPLOYEE BENEFITS HANDBOOK: SECTION 4 — FAMILY WELLNESS \u0026 PARENTAL LEAVE","Policy Document: #POL-BEN-2026-08","Pinnacle Financial Holdings recognizes that supporting working families is essential to talent retention and sustained operational excellence. Under our comprehensive parental leave framework, eligible personnel are granted paid time off following the birth, adoption, or long-term foster placement of a child:","1. Paid Parental Leave Tiers:","• Primary Caregiver Leave: Up to 16 consecutive weeks of fully paid leave (100% of regular base salary).","• Secondary Caregiver Leave: Up to 8 consecutive weeks of fully paid leave (100% of regular base salary).","2. Eligibility Criteria:","To qualify for fully paid parental leave, an employee must have completed at least 12 months of continuous full-time service with Pinnacle prior to the anticipated commencement date of the leave.","3. Benefits Continuation \u0026 Re-integration:","All standard employee health, dental, and life insurance protections remain fully active throughout the approved leave period, with Pinnacle maintaining its regular employer premium contributions. In addition, returning personnel may elect our \u0027Phased Return-to-Work\u0027 option, working 80% of regular weekly hours at 100% compensation during their first four weeks back to facilitate work-life transition.","4. Application Protocol:","Eligible employees must submit a formal parental leave request accompanied by a written project coverage and workload handover plan to the Benefits Administration Department at least 60 days prior to the expected leave date.","PARENTAL LEAVE APPLICATION FORM","PINNACLE FINANCIAL HOLDINGS — FORMAL PARENTAL LEAVE APPLICATION","Application Tracking ID: #PL-2026-441 | Submission Date: June 28","Employee Information:","Employee Name: Thomas Becker | Employee ID: #PFH-7820","Title: Senior Risk Modeling Analyst | Division: Quantitative Risk Analytics","Hire Date: March 1, 2023 | Continuous Service Length: 3 Years, 4 Months","Supervisor: Victoria Sterling, Vice President of Risk Modeling","Leave Request Details:","Designated Category: Secondary Caregiver Paid Parental Leave (Welcoming Newborn Child)","Requested Leave Commencement Date: Tuesday, September 1","Requested Final Day of Leave: Monday, October 26","Total Duration: Exactly 8 Consecutive Weeks (40 Working Days)","Workload Handover \u0026 Project Coverage Plan:","• Quantitative Risk Simulation Workflows: Primary daily simulation runs and liquidity reporting will be assumed by Senior Analyst Elena Rostova.","• Documentation \u0026 Repository: All statistical model documentation and codebase updates have been centralized in GitHub Repository #Risk-2026.","• Emergency Escalations: Elena Rostova has been granted administrative access to all staging environments.","Employee Electronic Signature: Thomas Becker | Date: June 28","APPROVAL CONFIRMATION LETTER","PINNACLE FINANCIAL HOLDINGS CORP.","Human Resources \u0026 Benefits Administration","500 South Tryon Street, Charlotte, NC 28202","July 15","Mr. Thomas Becker","Division of Quantitative Risk Analytics","Dear Thomas,","We have formally reviewed your application (#PL-2026-441) requesting Secondary Caregiver Paid Parental Leave. Because your continuous service tenure exceeds our 12-month policy threshold and your application was submitted well within the 60-day advance notification window, your request has been formally approved by the Benefits Committee.","Key Operational Details:","• Approved Paid Leave Window: September 1 through October 26 (8 consecutive weeks at 100% regular base salary).","• Benefits Status: Your premium tier medical, dental, and vision coverages will continue without interruption. Normal payroll deductions will resume upon your return.","• Workload Continuity: Your department VP has endorsed your coverage plan designating Elena Rostova as your operational backup.","• Expected Return Date: You are scheduled to officially resume your professional responsibilities on Tuesday, October 27.","If you wish to participate in the Phased Return-to-Work schedule (working 32 hours weekly for your first month back), please notify our office via email no later than October 13.","Congratulations on the upcoming arrival of your child!","Warm regards,","Miriam Caldwell","Director of Global Employee Benefits","Pinnacle Financial Holdings Corp.","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","191. What is the primary purpose of the first document?","(A) To advertise vacant positions in the quantitative risk department","(B) To outline policy guidelines and eligibility terms for employee parental leave","(C) To announce a corporate holiday schedule for financial trading markets","(D) To explain penalties for unauthorized employee workplace absenteeism","192. According to the benefits handbook, what is the maximum duration of fully paid leave available to a secondary caregiver?","(A) 4 weeks","(B) 8 weeks","(C) 12 weeks","(D) 16 weeks","193. Why does Mr. Becker qualify for fully paid parental leave under Pinnacle\u0027s policy?","(A) He holds an executive vice president title in the marketing division.","(B) He completed more than the required 12 months of continuous service.","(C) He volunteered to work remotely throughout the entire summer season.","(D) He agreed to forfeit his annual performance discretionary bonus.","194. In the benefits guide, the word \u0027phased\u0027 in section 3, line 4 is closest in meaning to:","(A) sudden","(B) gradual","(C) complete","(D) mandatory","195. When is Mr. Becker scheduled to officially resume his professional duties?","(A) June 28","(B) September 1","(C) October 13","(D) October 27","2. CHIẾN LƯỢC ĐỌC HIỂU 5 PHÚT TỐI ƯU (FIRST PRINCIPLES STRATEGY)","CHIẾN THUẬT 5 PHÚT TỐI ƯU: NẮM BẮT BỐI CẢNH, GHÉP NỐI DỮ KIỆN \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Quét Z-Pattern: Quét nhanh 3 văn bản: Văn bản 1 là Cẩm nang Phúc lợi Nhân viên (Benefits Guide) của Tập đoàn Tài chính Pinnacle quy định chế độ nghỉ thai sản/phụ sản hưởng nguyên lương (Người chăm sóc chính: 16 tuần, Người chăm sóc phụ: 8 tuần, điều kiện thâm niên tối thiểu 12 tháng); Văn bản 2 là Đơn xin Nghỉ phép Phụ sản (Leave Application Form) của Chuyên viên Phân tích Rủi ro Thomas Becker (thâm niên 3 năm 4 tháng, người chăm sóc phụ) xin nghỉ 8 tuần từ 1/9 đến 26/10 và bàn giao việc cho Elena Rostova; Văn bản 3 là Thư Phê duyệt Chính thức của Giám đốc Nhân sự Miriam Caldwell chấp thuận lịch nghỉ và ngày quay lại làm việc 27/10.","Bước 2 (60 giây) - Móc nối Logic \u0026 Sơ đồ Tinh thần: Thiết lập chuỗi phê duyệt phúc lợi nghỉ phép: Quy chế phúc lợi (Văn bản 1: yêu cầu thâm niên 12 tháng, người chăm sóc phụ được nghỉ 8 tuần hưởng 100% lương kèm chương trình quay lại làm việc từng giai đoạn Phased Return) ➔ Nộp đơn hợp lệ trước 60 ngày (Văn bản 2: Thomas Becker đủ thâm niên 40 tháng, xin nghỉ đúng 8 tuần và có kế hoạch bàn giao) ➔ Phê duyệt chính thức và bảo lưu 100% bảo hiểm y tế, ấn định ngày trở lại làm việc 27/10 (Văn bản 3).","Bước 3 (120 giây) - Định vị Manh mối \u0026 Giải đề Tốc độ: Câu 191 hỏi mục đích chính của văn bản 1 (trình bày chính sách nghỉ phụ sản và tiêu chuẩn hưởng phúc lợi); Câu 192 hỏi thời gian nghỉ phép tối đa hưởng 100% lương cho người chăm sóc phụ (8 tuần); Câu 193 (câu hỏi liên kết) hỏi lý do ông Becker đủ điều kiện (có thâm niên làm việc trên 12 tháng liên tục); Câu 194 (từ vựng theo ngữ cảnh) hỏi từ \u0027phased\u0027 trong đoạn 3 (đồng nghĩa với gradual / step-by-step); Câu 195 (câu hỏi liên kết) hỏi ngày ông Becker chính thức quay lại làm việc (ngày 27 tháng 10).","Bước 4 (30 giây) - Đúc kết Feynman 1 Câu: Hiểu bản chất: Chính sách nghỉ phụ sản và phúc lợi gia đình trong đề thi TOEIC kiểm tra khả năng đối soát điều kiện thâm niên (Eligibility Baseline), phân biệt quyền lợi giữa người chăm sóc chính/phụ (Primary vs. Secondary Caregiver) và kế hoạch bàn giao công việc (Workload Handoff Plan).","3. BẢN DỊCH SONG NGỮ TOÀN VĂN (BILINGUAL PARALLEL TRANSLATION)","VĂN BẢN 1: CẨM NANG PHÚC LỢI NHÂN VIÊN (PINNACLE FINANCIAL HOLDINGS)","PINNACLE FINANCIAL HOLDINGS CORP. — CHARLOTTE, NC","EMPLOYEE BENEFITS HANDBOOK: SECTION 4 — FAMILY WELLNESS \u0026 PARENTAL LEAVE","Policy Document: #POL-BEN-2026-08","TẬP ĐOÀN PINNACLE FINANCIAL HOLDINGS — CHARLOTTE, NC","CẨM NANG PHÚC LỢI NHÂN VIÊN: MỤC 4 — SỨC KHỎE GIA ĐÌNH \u0026 NGHỈ PHÉP PHỤ SẢN","Văn bản chính sách: #POL-BEN-2026-08","Pinnacle Financial Holdings recognizes that supporting working families is essential to talent retention and sustained operational excellence. Under our comprehensive parental leave framework, eligible personnel are granted paid time off following the birth, adoption, or long-term foster placement of a child:","Pinnacle Financial Holdings nhận thức rằng việc hỗ trợ các gia đình người lao động là yếu tố cốt lõi để giữ chân nhân tài và duy trì hoạt động xuất sắc lâu dài. Dưới khung chính sách nghỉ phép phụ sản toàn diện của chúng tôi, các nhân sự đủ điều kiện được cấp thời gian nghỉ phép hưởng lương sau khi sinh con, nhận con nuôi hoặc nhận nuôi dưỡng trẻ dài hạn:","1. Paid Parental Leave Tiers:","• Primary Caregiver Leave: Up to 16 consecutive weeks of fully paid leave (100% of regular base salary).","• Secondary Caregiver Leave: Up to 8 consecutive weeks of fully paid leave (100% of regular base salary).","1. Các Hạng mức Nghỉ phép Phụ sản Hưởng lương:","• Nghỉ phép Dành cho Người Chăm sóc Chính: Lên tới 16 tuần liên tục nghỉ phép hưởng nguyên lương (100% lương cơ bản thông thường).","• Nghỉ phép Dành cho Người Chăm sóc Phụ: Lên tới 8 tuần liên tục nghỉ phép hưởng nguyên lương (100% lương cơ bản thông thường).","2. Eligibility Criteria:","To qualify for fully paid parental leave, an employee must have completed at least 12 months of continuous full-time service with Pinnacle prior to the anticipated commencement date of the leave.","3. Benefits Continuation \u0026 Re-integration:","All standard employee health, dental, and life insurance protections remain fully active throughout the approved leave period, with Pinnacle maintaining its regular employer premium contributions.","2. Tiêu chuẩn Đủ điều kiện:","Để đủ điều kiện nghỉ phép phụ sản hưởng nguyên lương, nhân viên phải hoàn thành ít nhất 12 tháng làm việc toàn thời gian liên tục tại Pinnacle trước ngày bắt đầu nghỉ phép dự kiến.","3. Duy trì Phúc lợi \u0026 Tái hòa nhập:","Tất cả các chế độ bảo hiểm y tế, nha khoa và bảo hiểm nhân thọ tiêu chuẩn của nhân viên vẫn được duy trì hiệu lực đầy đủ trong suốt thời gian nghỉ phép đã được phê duyệt, với việc Pinnacle tiếp tục duy trì các khoản đóng góp phí bảo hiểm định kỳ từ phía người sử dụng lao động.","In addition, returning personnel may elect our \u0027Phased Return-to-Work\u0027 option, working 80% of regular weekly hours at 100% compensation during their first four weeks back to facilitate work-life transition.","4. Application Protocol:","Eligible employees must submit a formal parental leave request accompanied by a written project coverage and workload handover plan to the Benefits Administration Department at least 60 days prior to the expected leave date.","Ngoài ra, các nhân sự quay trở lại làm việc có thể lựa chọn chương trình \u0027Quay Lại Làm Việc Từng Giai Đoạn\u0027, làm việc 80% số giờ hàng tuần thông thường nhưng vẫn nhận 100% thù lao trong bốn tuần đầu tiên đi làm trở lại để tạo thuận lợi cho sự chuyển tiếp giữa công việc và gia đình.","4. Quy thức Nộp Đơn:","Nhân viên đủ điều kiện phải nộp đơn xin nghỉ phép phụ sản chính thức kèm theo kế hoạch dự phòng dự án và bàn giao khối lượng công việc bằng văn bản tới Bộ phận Quản trị Phúc lợi ít nhất 60 ngày trước ngày nghỉ dự kiến.","VĂN BẢN 2: ĐƠN XIN NGHỈ PHÉP PHỤ SẢN CHÍNH THỨC (THOMAS BECKER)","PINNACLE FINANCIAL HOLDINGS — FORMAL PARENTAL LEAVE APPLICATION","Application Tracking ID: #PL-2026-441 | Submission Date: June 28","Employee Information:","Employee Name: Thomas Becker | Employee ID: #PFH-7820","Title: Senior Risk Modeling Analyst | Division: Quantitative Risk Analytics","Hire Date: March 1, 2023 | Continuous Service Length: 3 Years, 4 Months","Supervisor: Victoria Sterling, Vice President of Risk Modeling","PINNACLE FINANCIAL HOLDINGS — ĐƠN XIN NGHỈ PHÉP PHỤ SẢN CHÍNH THỨC","Mã theo dõi đơn: #PL-2026-441 | Ngày nộp: 28 tháng 6","Thông tin nhân viên:","Tên nhân viên: Thomas Becker | Mã nhân viên: #PFH-7820","Chức vụ: Chuyên viên Phân tích Mô hình Rủi ro Cấp cao | Khối: Phân tích Rủi ro Định lượng","Ngày tuyển dụng: 1 tháng 3, 2023 | Thâm niên công tác liên tục: 3 năm, 4 tháng","Người quản lý: Victoria Sterling, Phó Chủ tịch Phụ trách Mô hình Hóa Rủi ro","Leave Request Details:","Designated Category: Secondary Caregiver Paid Parental Leave (Welcoming Newborn Child)","Requested Leave Commencement Date: Tuesday, September 1","Requested Final Day of Leave: Monday, October 26","Total Duration: Exactly 8 Consecutive Weeks (40 Working Days)","Chi tiết Yêu cầu Nghỉ phép:","Danh mục Chỉ định: Nghỉ phép Phụ sản Hưởng lương cho Người Chăm sóc Phụ (Đón con mới sinh)","Ngày Bắt đầu Nghỉ phép Yêu cầu: Thứ Ba, ngày 1 tháng 9","Ngày Nghỉ phép Cuối cùng Yêu cầu: Thứ Hai, ngày 26 tháng 10","Tổng Thời gian: Chính xác 8 Tuần Liên tục (40 Ngày Làm việc)","Workload Handover \u0026 Project Coverage Plan:","• Quantitative Risk Simulation Workflows: Primary daily simulation runs and liquidity reporting will be assumed by Senior Analyst Elena Rostova.","• Documentation \u0026 Repository: All statistical model documentation and codebase updates have been centralized in GitHub Repository #Risk-2026.","• Emergency Escalations: Elena Rostova has been granted administrative access to all staging environments.","Employee Electronic Signature: Thomas Becker | Date: June 28","Kế hoạch Bàn giao Công việc \u0026 Dự phòng Dự án:","• Quy trình Mô phỏng Rủi ro Định lượng: Các đợt chạy mô phỏng hàng ngày chính và báo cáo thanh khoản sẽ do Chuyên viên Phân tích Cấp cao Elena Rostova đảm nhận.","• Tài liệu \u0026 Kho lưu trữ: Toàn bộ tài liệu mô hình thống kê và các bản cập nhật mã nguồn đã được tập trung hóa trong Kho lưu trữ GitHub #Risk-2026.","• Xử lý Sự cố Khẩn cấp: Elena Rostova đã được cấp quyền quản trị trên tất cả các môi trường thử nghiệm.","Chữ ký điện tử của nhân viên: Thomas Becker | Ngày: 28 tháng 6","VĂN BẢN 3: THƯ XÁC NHẬN PHÊ DUYỆT CỦA PHÒNG NHÂN SỰ (MIRIAM CALDWELL)","PINNACLE FINANCIAL HOLDINGS CORP.","Human Resources \u0026 Benefits Administration","500 South Tryon Street, Charlotte, NC 28202","July 15","Mr. Thomas Becker","Division of Quantitative Risk Analytics","TẬP ĐOÀN PINNACLE FINANCIAL HOLDINGS","Bộ phận Nhân sự \u0026 Quản trị Phúc lợi","Số 500 Phố South Tryon, Charlotte, NC 28202","Ngày 15 tháng 7","Ông Thomas Becker","Khối Phân tích Rủi ro Định lượng","Dear Thomas,","We have formally reviewed your application (#PL-2026-441) requesting Secondary Caregiver Paid Parental Leave. Because your continuous service tenure exceeds our 12-month policy threshold and your application was submitted well within the 60-day advance notification window, your request has been formally approved by the Benefits Committee.","Kính gửi Thomas,","Chúng tôi đã xem xét chính thức đơn của bạn (#PL-2026-441) về việc xin Nghỉ phép Phụ sản Hưởng lương cho Người Chăm sóc Phụ. Do thâm niên công tác liên tục của bạn vượt quá ngưỡng chính sách 12 tháng của chúng tôi và đơn của bạn đã được nộp hoàn toàn đúng khung thời gian thông báo trước 60 ngày, yêu cầu của bạn đã được Hội đồng Phúc lợi chính thức phê duyệt.","Key Operational Details:","• Approved Paid Leave Window: September 1 through October 26 (8 consecutive weeks at 100% regular base salary).","• Benefits Status: Your premium tier medical, dental, and vision coverages will continue without interruption. Normal payroll deductions will resume upon your return.","• Workload Continuity: Your department VP has endorsed your coverage plan designating Elena Rostova as your operational backup.","• Expected Return Date: You are scheduled to officially resume your professional responsibilities on Tuesday, October 27.","Các Chi tiết Vận hành Trọng yếu:","• Khung Thời gian Nghỉ phép Hưởng lương Được duyệt: Từ ngày 1 tháng 9 đến ngày 26 tháng 10 (8 tuần liên tục hưởng 100% lương cơ bản thông thường).","• Trạng thái Phúc lợi: Các gói bảo hiểm y tế, nha khoa và thị lực hạng cao cấp của bạn sẽ tiếp tục được duy trì không gián đoạn. Các khoản khấu trừ bảng lương bình thường sẽ tiếp tục khi bạn quay lại.","• Tính liên tục của Công việc: Phó Chủ tịch khối của bạn đã xác nhận kế hoạch dự phòng phân công Elena Rostova làm người thay thế vận hành.","• Ngày Đi làm Lại Dự kiến: Bạn dự kiến sẽ chính thức tiếp tục các trách nhiệm chuyên môn của mình vào Thứ Ba, ngày 27 tháng 10.","If you wish to participate in the Phased Return-to-Work schedule (working 32 hours weekly for your first month back), please notify our office via email no later than October 13.","Congratulations on the upcoming arrival of your child!","Warm regards,","Miriam Caldwell","Director of Global Employee Benefits","Pinnacle Financial Holdings Corp.","Nếu bạn muốn tham gia vào lịch trình Quay Lại Làm Việc Từng Giai Đoạn (làm việc 32 giờ mỗi tuần trong tháng đầu tiên trở lại), vui lòng thông báo cho văn phòng chúng tôi qua email trước ngày 13 tháng 10.","Chúc mừng gia đình bạn sắp chào đón thành viên mới!","Trân trọng,","Miriam Caldwell","Giám đốc Phúc lợi Nhân viên Toàn cầu","Tập đoàn Pinnacle Financial Holdings","4. DỊCH NGHĨA CÂU HỎI \u0026 ĐÁP ÁN (QUESTION \u0026 TRANSLATED OPTIONS)","191. Mục đích chủ yếu của văn bản thứ nhất là gì?","(A) Quảng cáo các vị trí còn trống trong bộ phận rủi ro định lượng","(B) Nêu các hướng dẫn chính sách và điều kiện hưởng chế độ nghỉ phụ sản của nhân viên","(C) Thông báo lịch nghỉ lễ của công ty đối với các thị trường giao dịch tài chính","(D) Giải thích các hình phạt đối với việc nhân viên vắng mặt tại nơi làm việc không phép","192. Theo cẩm nang phúc lợi, thời gian nghỉ phép hưởng nguyên lương tối đa dành cho người chăm sóc phụ là bao lâu?","(A) 4 tuần","(B) 8 tuần","(C) 12 tuần","(D) 16 tuần","193. Tại sao ông Becker lại đủ điều kiện hưởng chế độ nghỉ phụ sản hưởng nguyên lương theo chính sách của Pinnacle?","(A) Ông giữ chức danh phó chủ tịch điều hành trong khối tiếp thị.","(B) Ông đã hoàn thành nhiều hơn thời gian 12 tháng làm việc liên tục theo yêu cầu.","(C) Ông đã tình nguyện làm việc từ xa trong suốt cả mùa hè.","(D) Ông đồng ý từ bỏ khoản tiền thưởng hiệu suất tùy ý hàng năm của mình.","194. Trong cẩm nang phúc lợi, từ \u0027phased\u0027 trong mục 3, dòng 4 gần nghĩa nhất với từ nào?","(A) Đột ngột, bất thình lình (sudden)","(B) Từng bước, dần dần (gradual / step-by-step)","(C) Hoàn chỉnh, trọn vẹn (complete)","(D) Bắt buộc cưỡng chế (mandatory)","195. Khi nào ông Becker dự kiến sẽ chính thức tiếp tục các nhiệm vụ chuyên môn của mình?","(A) 28 tháng 6","(B) 1 tháng 9","(C) 13 tháng 10","(D) 27 tháng 10","5. CÔ ĐỌNG BÀI HỌC FEYNMAN (FEYNMAN CRITICAL TAKEAWAYS)","Key Structural \u0026 Vocabulary Takeaways (English)","• Corporate Parental Benefits Gating: Modern enterprise benefits manuals delineate between primary caregiver (16 weeks) and secondary caregiver (8 weeks) paid allocations based on continuous service tenure thresholds (12 months).","• Calendar Arithmetic \u0026 Workload Transition: Always cross-reference the final leave day (Monday, Oct 26) with the official resumption date (Tuesday, Oct 27) and designated project backup personnel (Elena Rostova).","• High-Yield Benefits Lexicon: Master essential HR terms including \u0027parental leave\u0027, \u0027phased return-to-work\u0027 (gradual transition), \u0027tenure threshold\u0027, \u0027workload handover\u0027, and \u0027consecutive weeks\u0027.","Bài học Cốt lõi \u0026 Quy tắc Tư duy (Tiếng Việt)","• Phân định Phúc lợi Chăm sóc Gia đình: Các đề thi TOEIC hiện đại phân biệt rõ rệt giữa Người chăm sóc chính (16 tuần) và Người chăm sóc phụ (8 tuần) dựa trên ngưỡng thâm niên làm việc liên tục (tối thiểu 12 tháng).","• Kỹ thuật Tính Toán Ngày Trở Lại Làm Việc: Luôn đối chiếu ngày cuối cùng của kỳ nghỉ phép (Thứ Hai, 26/10) với ngày chính thức đi làm trở lại (Thứ Ba, 27/10) và nhân sự bàn giao dự phòng (Elena Rostova).","• Từ vựng Phúc lợi \u0026 Chế độ: Nắm vững \u0027parental leave\u0027 (nghỉ chăm con mới sinh/nhận nuôi), \u0027phased return\u0027 (quay lại làm việc từng bước), \u0027tenure\u0027 (thâm niên công tác), và \u0027workload handover\u0027 (bàn giao công việc).","ACTIVE RECALL 5S (MA TRẬN TRUY XUẤT CHÉO DỮ LIỆU)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["1. Đối tượng \u0026 Vai trò: Tập đoàn Pinnacle ban hành chính sách phúc lợi gia đình; Chuyên viên Phân tích Rủi ro Thomas Becker nộp đơn xin nghỉ chăm con; Đồng nghiệp Elena Rostova nhận bàn giao công việc; Giám đốc Phúc lợi Toàn cầu Miriam Caldwell phê duyệt đơn.","1. Characters \u0026 Roles: Pinnacle Financial Holdings issues family wellness policies; Senior Risk Analyst Thomas Becker applies for secondary caregiver leave; Colleague Elena Rostova assumes project coverage; Benefits Director Miriam Caldwell formally approves the leave."]],[["2. Boi canh \u0026 Quy trinh loi"],["2. Bối cảnh \u0026 Quy trình lõi: Quản trị phúc lợi nghỉ thai sản/phụ sản có hưởng lương. Chính sách cấp 8 tuần 100% lương cho người chăm sóc phụ có thâm niên trên 12 tháng ➔ Thomas Becker (thâm niên 3 năm 4 tháng) nộp đơn trước 60 ngày xin nghỉ từ 1/9 đến 26/10 và bàn giao mã nguồn ➔ HR phê duyệt toàn vẹn bảo hiểm và ấn định ngày đi làm lại là 27/10.","2. Context \u0026 Core Workflow: Paid parental leave administration. Policy grants 8 weeks at 100% pay for secondary caregivers with 12+ months tenure ➔ Thomas Becker (3 yrs 4 mos tenure) applies 60 days in advance for Sept 1 - Oct 26 leave with code handover ➔ HR confirms benefits continuity and sets Oct 27 return date."]],[["3. Dau vet suy luan cheo"],["3. Dấu vết suy luận chéo: Móc nối điều kiện thâm niên 12 tháng ở Văn bản 1 với thời gian công tác 3 năm 4 tháng ở Văn bản 2 để kết luận đủ điều kiện; liên kết ngày kết thúc nghỉ phép 26 tháng 10 ở Văn bản 2 với ngày đi làm lại 27 tháng 10 ở Văn bản 3; đối chiếu lựa chọn Phased Return ở Văn bản 1 với hạn chót đăng ký ngày 13 tháng 10 ở Văn bản 3.","3. Cross-Referencing Clues: Linking the 12-month tenure rule in Passage 1 with Becker\u0027s 3-year-4-month tenure in Passage 2 to validate eligibility; pairing the final leave date of Oct 26 in Passage 2 with the Oct 27 return date in Passage 3; matching the Phased Return-to-Work option in Passage 1 with the Oct 13 election deadline in Passage 3."]]],"t":"table"},"ĐÁP ÁN CHI TIẾT \u0026 BÓC TÁCH BẪY ETS","What is the primary purpose of the first document?","Dap an dung: (B) To outline policy guidelines and eligibility terms for employee parental leave","[Dau vet bai doc / Clue]: Văn bản 1, Tiêu đề \u0026 Đoạn 1: \u0027EMPLOYEE BENEFITS HANDBOOK: SECTION 4 — FAMILY WELLNESS \u0026 PARENTAL LEAVE... Under our comprehensive parental leave framework, eligible personnel are granted paid time off...\u0027","[Dien dat tuong duong / Paraphrase]: Family wellness \u0026 parental leave... eligible personnel granted paid time off ➔ outline policy guidelines and eligibility terms for employee parental leave","[Loi giai chi tiet]: Văn bản 1 là phần trích trong sổ tay phúc lợi nhân viên quy định các hướng dẫn chính sách, hạng mức thời gian và điều kiện để được hưởng chế độ nghỉ phụ sản có lương.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) To advertise vacant positions in the quantitative risk department","- Ly do sai: Văn bản về cẩm nang nhân sự nội bộ, không phải thông báo tuyển dụng chuyên viên rủi ro.","- Bay ETS: Bẫy Tuyển dụng Nhân sự Mới (Recruitment Advertising Trap)","(C) To announce a corporate holiday schedule for financial trading markets","- Ly do sai: Tài liệu bàn về chế độ nghỉ phép sinh con của cá nhân, không phải lịch nghỉ lễ thị trường tài chính.","- Bay ETS: Bẫy Lịch Nghỉ Lễ Thị trường (Market Holiday Schedule Trap)","(D) To explain penalties for unauthorized employee workplace absenteeism","- Ly do sai: Văn bản quy định về kỳ nghỉ phép hợp pháp được phê duyệt, không bàn về chế tài nghỉ việc không phép.","- Bay ETS: Bẫy Xử lý Vắng mặt Không phép (Absenteeism Penalty Trap)","According to the benefits handbook, what is the maximum duration of fully paid leave available to a secondary caregiver?","Dap an dung: (B) 8 weeks","[Dau vet bai doc / Clue]: Văn bản 1, Mục 1: \u0027• Secondary Caregiver Leave: Up to 8 consecutive weeks of fully paid leave (100% of regular base salary).\u0027","[Dien dat tuong duong / Paraphrase]: Secondary Caregiver Leave: Up to 8 consecutive weeks ➔ 8 weeks","[Loi giai chi tiet]: Cẩm nang phúc lợi quy định rõ: Người chăm sóc phụ (Secondary Caregiver) được hưởng tối đa 8 tuần nghỉ phép liên tục hưởng 100% lương cơ bản.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) 4 weeks","- Ly do sai: 4 tuần là thời gian tham gia chương trình quay lại làm việc từng giai đoạn (Phased Return).","- Bay ETS: Bẫy Thời gian Tái hòa nhập (Phased Return Trap)","(C) 12 weeks","- Ly do sai: 12 tháng là điều kiện thâm niên tối thiểu, không phải 12 tuần nghỉ.","- Bay ETS: Bẫy Nhầm lẫn Tuần và Tháng Thâm niên (Tenure Month vs Week Trap)","(D) 16 weeks","- Ly do sai: 16 tuần là thời gian nghỉ tối đa dành cho Người chăm sóc chính (Primary Caregiver).","- Bay ETS: Bẫy Nhầm lẫn Người Chăm sóc Chính (Primary Caregiver Confusion Trap)","Why does Mr. Becker qualify for fully paid parental leave under Pinnacle\u0027s policy?","Dap an dung: (B) He completed more than the required 12 months of continuous service.","[Dau vet bai doc / Clue]: Văn bản 1 yêu cầu: \u0027completed at least 12 months of continuous full-time service\u0027. Văn bản 2: \u0027Continuous Service Length: 3 Years, 4 Months\u0027.","[Dien dat tuong duong / Paraphrase]: 3 years, 4 months vs required 12 months ➔ completed more than the required 12 months of continuous service","[Loi giai chi tiet]: Bằng phương pháp suy luận chéo: Chính sách yêu cầu tối thiểu 12 tháng thâm niên, trong khi ông Becker đã công tác được 3 năm 4 tháng (40 tháng), vượt xa điều kiện tối thiểu để được hưởng quyền lợi.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) He holds an executive vice president title in the marketing division","- Ly do sai: Ông Becker là Chuyên viên Phân tích Cấp cao (Senior Analyst) trong khối Rủi ro, không phải Phó Chủ tịch Tiếp thị.","- Bay ETS: Bẫy Chức danh Sai lệch (Wrong Title Trap)","(C) He volunteered to work remotely throughout the entire summer season","- Ly do sai: Tài liệu không có chi tiết tình nguyện làm việc từ xa vào mùa hè.","- Bay ETS: Bẫy Làm việc Từ xa Hư cấu (Fabricated Remote Work Trap)","(D) He agreed to forfeit his annual performance discretionary bonus","- Ly do sai: Ông Becker hưởng nguyên 100% lương và không phải từ bỏ bất kỳ khoản thưởng nào.","- Bay ETS: Bẫy Từ bỏ Tiền thưởng (Bonus Forfeiture Trap)","In the benefits guide, the word \u0027phased\u0027 in section 3, line 4 is closest in meaning to:","Dap an dung: (B) gradual","[Dau vet bai doc / Clue]: Văn bản 1, Mục 3: \u0027In addition, returning personnel may elect our \u0027Phased Return-to-Work\u0027 option, working 80% of regular weekly hours at 100% compensation during their first four weeks back...\u0027","[Dien dat tuong duong / Paraphrase]: phased return-to-work ➔ gradual / progressive / step-by-step re-entry","[Loi giai chi tiet]: Từ \u0027phased\u0027 trong ngữ cảnh quay trở lại làm việc có nghĩa là theo từng giai đoạn, mang tính tiệm tiến từ từ (gradual), giúp người lao động không bị bỡ ngỡ.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) sudden","- Ly do sai: \u0027Sudden\u0027 có nghĩa là đột ngột, trái ngược hoàn toàn với ý nghĩa từng bước.","- Bay ETS: Bẫy Từ trái nghĩa (Antonym Trap)","(C) complete","- Ly do sai: \u0027Complete\u0027 có nghĩa là trọn vẹn, toàn bộ, không diễn đạt tính phân kỳ thời gian.","- Bay ETS: Bẫy Toàn thể (Complete Trap)","(D) mandatory","- Ly do sai: \u0027Mandatory\u0027 có nghĩa là bắt buộc, trong khi cẩm nang ghi rõ đây là quyền lựa chọn (may elect).","- Bay ETS: Bẫy Tính Bắt buộc (Mandatory False Premise Trap)","When is Mr. Becker scheduled to officially resume his professional duties?","Dap an dung: (D) October 27","[Dau vet bai doc / Clue]: Văn bản 3, Mục Expected Return Date: \u0027You are scheduled to officially resume your professional responsibilities on Tuesday, October 27.\u0027","[Dien dat tuong duong / Paraphrase]: resume your professional responsibilities on Tuesday, October 27 ➔ October 27","[Loi giai chi tiet]: Văn bản 3 xác nhận ngày cuối cùng của kỳ nghỉ là Thứ Hai ngày 26 tháng 10, và ngày ông Becker chính thức quay trở lại làm việc là Thứ Ba, ngày 27 tháng 10.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) June 28","- Ly do sai: Ngày 28 tháng 6 là ngày ông Becker ký nộp đơn xin nghỉ.","- Bay ETS: Bẫy Ngày Nộp Đơn (Filing Date Trap)","(B) September 1","- Ly do sai: Ngày 1 tháng 9 là ngày bắt đầu kỳ nghỉ phép của ông.","- Bay ETS: Bẫy Ngày Bắt đầu Nghỉ phép (Leave Start Date Trap)","(C) October 13","- Ly do sai: Ngày 13 tháng 10 là hạn chót để ông gửi email nếu muốn chọn chế độ đi làm lại từng giai đoạn.","- Bay ETS: Bẫy Hạn chót Thông báo Tái hòa nhập (Phased Election Deadline Trap)","PHƯƠNG PHÁP FEYNMAN - BẢN THUYẾT MINH BẬC THẦY","4.1 QUY TRÌNH NGHIỆP VỤ 3 BƯỚC TUẦN TỰ (DUAL SEQUENTIAL WORKFLOWS)","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","BAN HÀNH CHÍNH SÁCH PHÚC LỢI \u0026 TIÊU CHUẨN THÂM NIÊN"],[],["BƯỚC 2","NỘP ĐƠN NGHỈ PHÉP \u0026 THIẾT LẬP KẾ HOẠCH BÀN GIAO"],[],["BƯỚC 3","HỘI ĐỒNG PHÊ DUYỆT \u0026 LÊN LỊCH QUAY LẠI LÀM VIỆC"]],[["• Chung tu \u0026 Kenh: Ban Quản Trị Phúc Lợi Nhân Viên \u0026 Cẩm Nang Nhân Sự Chính Sách #POL-BEN","• Nghiep vu thuc thi: Ban hành khung nghỉ phụ sản ➔ Quy định 16 tuần cho người chăm sóc chính, 8 tuần cho người chăm sóc phụ có thâm niên từ 12 tháng, hưởng 100% lương.","• Ket qua \u0026 Kiem soat: Chính sách nhân văn giữ chân nhân tài và bảo đảm quyền lợi bảo hiểm liên tục."],["➔"],["• Chung tu \u0026 Kenh: Mẫu Đơn Đăng Ký #PL-2026-441 \u0026 Kho Lưu Trữ Mã Nguồn GitHub #Risk-2026","• Nghiep vu thuc thi: Thomas Becker nộp đơn trước 60 ngày ➔ Chứng minh 3 năm 4 tháng thâm niên ➔ Bàn giao toàn bộ việc chạy mô phỏng rủi ro cho Elena Rostova từ 1/9 đến 26/10.","• Ket qua \u0026 Kiem soat: Hồ sơ xin nghỉ phép hợp lệ, bảo đảm tính liên tục không gián đoạn của dự án rủi ro."],["➔"],["• Chung tu \u0026 Kenh: Thư Xác Nhận Chính Thức Của Giám Đốc Phúc Lợi \u0026 Hệ Thống Quản Lý Ca Làm","• Nghiep vu thuc thi: Miriam Caldwell phê duyệt 8 tuần nghỉ có lương ➔ Bảo lưu bảo hiểm ➔ Ấn định ngày đi làm lại là 27/10 kèm tùy chọn làm 80% giờ hưởng 100% lương tháng đầu.","• Ket qua \u0026 Kiem soat: Hoàn tất thủ tục phê duyệt mẫu mực, tạo sự an tâm tuyệt đối cho người lao động."]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["PHASE 1","POLICY FRAMEWORK \u0026 TENURE THRESHOLD DEFINITION"],[],["PHASE 2","LEAVE APPLICATION FILING \u0026 WORKLOAD HANDOVER"],[],["PHASE 3","EXECUTIVE APPROVAL \u0026 RETURN-TO-WORK SCHEDULING"]],[["• Documents \u0026 Channels: Benefits Administration Committee \u0026 Employee Policy Handbook #POL-BEN","• Core Business Execution: Establish parental tiers ➔ Grant 16 weeks for primary caregivers and 8 weeks for secondary caregivers with 12+ months service at 100% pay.","• Key Deliverable \u0026 Control: Institutionalized family wellness framework ensuring talent retention and equity."],["➔"],["• Documents \u0026 Channels: Formal Application #PL-2026-441 \u0026 Centralized GitHub Risk Repository","• Core Business Execution: File 60 days in advance ➔ Verify 3-year-4-month tenure ➔ Hand over daily risk simulations and liquidity modeling to backup analyst Elena Rostova.","• Key Deliverable \u0026 Control: Validated leave application accompanied by a watertight operational continuity plan."],["➔"],["• Documents \u0026 Channels: Benefits Confirmation Directive \u0026 Enterprise Workforce Management Ledger","• Core Business Execution: Miriam Caldwell formally approves 8-week leave ➔ Safeguard healthcare continuity ➔ Establish Oct 27 return date with 80% phased return option.","• Key Deliverable \u0026 Control: De-risked workforce leave execution balancing personal life with business continuity."]]],"t":"table"},"4.2 BẢN THUYẾT MINH FEYNMAN SONG NGỮ (ĐA GÓC NHÌN NGHIỆP VỤ)","• Bức tranh Toàn cảnh Nghiệp vụ (End-to-End Business Flow): Chế độ Nghỉ phép Chăm sóc Gia đình \u0026 Kế hoạch Dự phòng Vận hành (Parental Leave \u0026 Operational Continuity) thể hiện trình độ văn minh quản trị của doanh nghiệp. Để nhân sự yên tâm sinh con hoặc chăm sóc trẻ sơ sinh mà không làm gián đoạn guồng quay kinh doanh, quy trình đòi hỏi 3 bước chặt chẽ: Ban hành chính sách phúc lợi rõ ràng phân định theo vai trò (chăm sóc chính vs. phụ) và thâm niên ➔ Người lao động báo trước 60 ngày kèm phương án bàn giao công việc chi tiết cho đồng nghiệp dự phòng (Operational Backup) ➔ Ban Nhân sự phê duyệt, bảo lưu toàn bộ các chế độ bảo hiểm y tế và tạo điều kiện tái hòa nhập từng bước (Phased Return).","• Lăng kính Viễn thông / CNTT Viettel: Tại Tập đoàn Viettel, chính sách chăm lo cho hậu phương người lính luôn là nét đẹp văn hóa truyền thống. Các cán bộ, kỹ sư khi sinh con đều được hưởng đầy đủ chế độ thai sản theo quy định của Nhà nước và Bộ Quốc phòng, cùng với các khoản trợ cấp thăm hỏi, tặng quà từ Công đoàn Tập đoàn. Trước khi nghỉ phép, các kỹ sư hệ thống luôn lập biên bản bàn giao tài khoản máy chủ, phân công đồng nghiệp trực ca ứng cứu thông tin và cập nhật tài liệu kỹ thuật trên Wiki nội bộ để mạng lưới vận hành thông suốt 24/7.","• Lăng kính Quản trị Mầm non Ước Mơ Xanh: Tại trường mầm non, khi các cô giáo bước vào thời kỳ sinh nở, Nhà trường sắp xếp giáo viên thỉnh giảng hoặc điều chuyển cô giáo bảo mẫu có kinh nghiệm sang đứng lớp thay thế từ trước 1 tháng để các bé không bị lạ cô. Nhà trường duy trì đầy đủ quyền lợi bảo hiểm xã hội, tạo điều kiện cho cô giáo mới sinh con được về sớm 1 tiếng mỗi ngày để cho con bú trong năm đầu đời.","• Lăng kính Bàn học Gia đình (Kèm cặp Bé Hà Ngân Lớp Lá 5 Tuổi): Để giải thích cho bé Hà Ngân, ba dùng hình ảnh đón em bé chào đời: \u0027Hà Ngân ơi, khi nhà chú Thomas sắp có một em bé tí hon ra đời, chú xin phép công ty cho nghỉ 8 tuần để ở nhà pha sữa, giặt tã và bế em bé giúp mẹ. Công ty rất tốt bụng nên vẫn trả đủ 100% tiền lương cho chú mua sữa cho em bé. Nhưng trước khi nghỉ, chú Thomas đã cẩn thận nhờ cô Elena ngồi vào bàn làm việc của chú để giải các bài toán rủi ro trên máy tính. Đến ngày 27 tháng 10 em bé đã cứng cáp thì chú Thomas mới vui vẻ đi làm lại đấy!\u0027","4.3 PHÂN TÍCH CHUYÊN SÂU DÀNH CHO BUSINESS ANALYST (ENGLISH BA PERSPECTIVE)","• Absence Management Rules Engines \u0026 Benefit Continuity in HRIS: Business Analysts architecting leave management modules must configure parameter-driven eligibility filters. The system evaluates employment tenure against policy baselines (12 months required vs. 40 months verified) and validates advance notification windows (60 days prior). Upon approval, the HRIS must automatically signal payroll to suspend standard PTO deductions, maintain employer-paid healthcare benefit premiums, and project workforce capacity adjustments during the 8-week absence.","• Operational Redundancy \u0026 Access Provisioning in Continuity Planning: In high-stakes financial operations (such as quantitative risk modeling), an analyst\u0027s absence cannot halt daily compliance simulations. A key BA requirement is building system mechanisms for delegated authority: temporarily mirroring security credentials, assigning secondary sign-off workflows, and transferring GitHub commit rights to designated operational backups (Elena Rostova), ensuring full operational resilience without security compromises.","BỘ TỪ VỰNG CHUYÊN ĐỀ TINH HOA (SPECIALIZED VOCABULARY MASTERY)","Parental Leave  /pəˈren.t̬əl liːv/  Family Care Leave / Childcare Leave / Maternity \u0026 Paternity Leave / Infant Care Absence","Nghia: Nghỉ phép phụ sản/nghỉ chăm con, chế độ nghỉ phép dành cho cha mẹ sau khi sinh con, nhận con nuôi hoặc nhận nuôi dưỡng trẻ, thường được hưởng lương theo chính sách công ty.","Vd: The financial corporation offers sixteen weeks of fully paid parental leave to all eligible primary caregivers. - Tập đoàn tài chính cung cấp mười sáu tuần nghỉ phép phụ sản hưởng nguyên lương cho tất cả những người chăm sóc chính đủ điều kiện.","Continuous Service  /kənˈtɪn.ju.əs ˈsɝː.vɪs/  Uninterrupted Tenure / Service Length / Employment Duration / Cumulative Seniority","Nghia: Thời gian công tác liên tục, tổng khoảng thời gian nhân viên làm việc không bị gián đoạn tại doanh nghiệp, là căn cứ để tính toán các quyền lợi thâm niên và phúc lợi.","Vd: Employees must complete at least twelve months of continuous service to qualify for the corporate tuition assistance program. - Nhân viên phải hoàn thành ít nhất mười hai tháng làm việc liên tục để đủ điều kiện tham gia chương trình hỗ trợ học phí của công ty.","Phased Return-to-Work  /feɪzd rɪˈtɝːn tuː wɝːk/  Gradual Re-entry / Progressive Return / Step-by-Step Transition / Transition Re-integration Schedule","Nghia: Lộ trình quay lại làm việc từng giai đoạn, chính sách nhân sự cho phép nhân viên sau kỳ nghỉ dài (ốm đau, sinh con) được làm việc giảm giờ nhưng vẫn nhận đủ lương trong những tuần đầu.","Vd: The phased return-to-work program allowed the new mother to work 32 hours weekly during her first month back. - Chương trình quay lại làm việc từng giai đoạn đã cho phép người mẹ mới sinh làm việc 32 giờ mỗi tuần trong tháng đầu tiên đi làm trở lại.","Workload Handover  /ˈwɝːk.loʊd ˈhændˌoʊ.vɚ/  Task Delegation Plan / Operational Transition / Project Knowledge Transfer / Backup Coverage Plan","Nghia: Bàn giao khối lượng công việc, quy trình chuyển giao nhiệm vụ, tài liệu và quyền truy cập hệ thống cho đồng nghiệp dự phòng trước khi nghỉ phép dài hạn.","Vd: Before commencing his leave, the analyst conducted a detailed workload handover with his assigned operational backup. - Trước khi bắt đầu kỳ nghỉ phép, chuyên viên phân tích đã tiến hành bàn giao khối lượng công việc chi tiết với người thay thế vận hành được chỉ định.","Resumption  /rɪˈzʌmp.ʃən/  Recommencement / Restart / Continuation / Re-initiation of Duties","Nghia: Sự bắt đầu lại, tiếp tục công việc hoặc hoạt động sau một thời gian tạm ngừng hoặc nghỉ phép.","Vd: The HR director confirmed the official resumption of his professional responsibilities starting on Tuesday, October 27. - Giám đốc nhân sự đã xác nhận việc chính thức tiếp tục các trách nhiệm chuyên môn của ông bắt đầu từ Thứ Ba, ngày 27 tháng 10.","Backup  /ˈbæk.ʌp/  Substitute / Alternate / Operational Proxy / Designated Stand-In / Redundant Coverage","Nghia: Người thay thế dự phòng, đồng nghiệp được chỉ định đảm nhận các trách nhiệm và quyền hạn công việc của một nhân viên trong thời gian họ vắng mặt.","Vd: Elena Rostova was formally designated as the operational backup to manage risk simulation reporting during his absence. - Elena Rostova đã được chỉ định chính thức làm nhân sự dự phòng vận hành để quản lý báo cáo mô phỏng rủi ro trong thời gian ông vắng mặt.","==================================================================================================","BÀI 8: QUY CHẾ KHEN THƯỞNG NHÂN VIÊN XUẤT SẮC, GIẢI THƯỞNG ĐỔI MỚI \u0026 CỔ PHIẾU THƯỞNG (ANNUAL EXCELLENCE AWARDS, INNOVATION BOUNTY \u0026 RSU GRANTS)","ETS TOEIC - Double Passage (Q181-185) - Corporate Recognition Gala, Innovation Nomination \u0026 Executive Equity Awards","BÀI TẬP VÀ PHƯƠNG PHÁP GIẢI TOEIC PART 7 THEO NGUYÊN BẢN (FIRST PRINCIPLES)","1. ĐỀ BÀI GỐC (BILINGUAL CONTEXT: AWARDS GALA ANNOUNCEMENT \u0026 INNOVATION NOMINATION LETTER)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","AWARDS GALA ANNOUNCEMENT","NEXATECH SEMICONDUCTOR GLOBAL CORP. — SAN JOSE, CA","EXECUTIVE RECOGNITION DIRECTIVE: 14TH ANNUAL EXCELLENCE AWARDS GALA","Date: October 5 | Submission Deadline: November 1","NexaTech Semiconductor Global is proud to announce the hosting of our 14th Annual Global Employee Excellence Awards Gala, scheduled for the evening of Friday, December 4, at the San Jose Grand Convention Center. This premier corporate celebration honors the extraordinary achievements, inventive brilliance, and collaborative dedication of our worldwide workforce.","Award Categories \u0026 Grand Prize Packages:","• Technical Innovation of the Year: Reserved for the individual or engineering team that architected an unprecedented technological solution. The recipient will be awarded a $15,000 cash innovation bounty, 1,000 Restricted Stock Units (RSUs) vesting immediately, an engraved crystal commemorative trophy, and corporate sponsorship to present as a keynote speaker at the Global Silicon Summit in Tokyo, Japan.","• Operational Excellence Award: Recognizing sustained supply-chain efficiency ($10,000 bounty + 500 RSUs).","• Customer Obsession Champion: Honoring exemplary client retention and partnership growth ($8,000 bounty).","Nomination Eligibility Criteria:","1. Deployed Impact: The nominated solution must have been formally deployed into production environments between January 1 and September 30 of the current fiscal year.","2. Quantifiable Value: The project must have delivered audited operational cost savings or verified top-line revenue additions exceeding $1.0 million.","3. Cross-Functional Collaboration: Submissions must include written endorsements from at least two cooperating internal business departments.","Department directors must submit formal nomination dossiers to the Executive Awards Committee at awards-committee@nexatech.com by 5:00 PM PST on November 1.","NOMINATION DOSSIER LETTER","NEXATECH EMBEDDED SYSTEMS DIVISION — INTERNAL MEMORANDUM","TO: Executive Awards Selection Committee \u003cawards-committee@nexatech.com\u003e","FROM: Dr. Raymond Chen, Senior Director of Embedded Systems Engineering","DATE: October 24","SUBJECT: Formal Nomination: Technical Innovation of the Year — Carlos Mendoza","Dear Members of the Selection Committee,","It is my distinct privilege to formally nominate Mr. Carlos Mendoza, Lead Firmware Architect, for NexaTech’s 2026 Technical Innovation of the Year Award in recognition of his groundbreaking work spearheading the \u0027VoltSense Adaptive Power Algorithm.\u0027","Addressing critical battery drain challenges in our next-generation mobile microcontrollers, Mr. Mendoza single-handedly engineered a predictive dynamic voltage-scaling algorithm. Following rigorous lab validation, the solution was deployed globally across our commercial wafer fabrication lines in June 2026. Real-world telemetry logs over the past four months confirm that the algorithm achieved a 24% reduction in idle power draw and eliminated 40% of thermal throttling events.","From a financial and operational standpoint, our verified third-party audit reports confirm that the VoltSense deployment has generated $1.65 million in annualized manufacturing yield efficiencies and commercial licensing premiums, surpassing our division\u0027s full-year targets. Attached please find glowing endorsement letters from our Manufacturing Quality Assurance team and the Enterprise Automotive Sales division, confirming the cross-functional adoption of his architecture.","Carlos embodies the inventive spirit of NexaTech, and I urge the committee to bestow upon him this well-deserved recognition on December 4.","Respectfully submitted,","Dr. Raymond Chen","Senior Director of Embedded Engineering","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","181. What is the primary purpose of the first document?","(A) To announce a corporate restructuring affecting the Tokyo sales office","(B) To publicize an annual employee awards gala and outline nomination criteria","(C) To solicit candidate applications for an open embedded firmware architect position","(D) To explain warranty terms for newly launched mobile microcontrollers","182. According to the announcement, what prize is included for the Technical Innovation of the Year winner?","(A) An all-expenses-paid permanent relocation to London","(B) A $15,000 cash bounty, 1,000 RSUs, and sponsorship to a Tokyo conference","(C) A 50% discount on corporate semiconductor products for life","(D) A complimentary corporate lease on an electric executive automobile","183. Why does Mr. Mendoza qualify for the Technical Innovation of the Year award?","(A) He organized the annual shareholder convention in San Jose.","(B) His project was deployed in June 2026 and delivered $1.65 million in audited savings.","(C) He has completed more than twenty-five years of continuous executive service.","(D) He volunteered to manage the corporate charitable holiday foundation.","184. In the awards announcement, the word \u0027bounty\u0027 in the Award Categories section is closest in meaning to:","(A) penalty","(B) premium cash prize","(C) tax deduction","(D) membership fee","185. What event is scheduled to take place on Friday, December 4?","(A) The deadline for department directors to submit nomination dossiers","(B) The official commercial release of the VoltSense microcontroller","(C) The 14th Annual Global Employee Excellence Awards Gala","(D) An emergency safety audit of the San Jose wafer fabrication plant","2. CHIẾN LƯỢC ĐỌC HIỂU 5 PHÚT TỐI ƯU (FIRST PRINCIPLES STRATEGY)","CHIẾN THUẬT 5 PHÚT TỐI ƯU: NẮM BẮT BỐI CẢNH, GHÉP NỐI DỮ KIỆN \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Quét Z-Pattern: Quét nhanh 2 văn bản: Văn bản 1 là Thông báo Chỉ thị Điều hành (Executive Announcement) từ CEO và Giám đốc Nhân sự NexaTech Semiconductor công bố Lễ Trao giải Nhân viên Xuất sắc Thường niên lần thứ 14 vào ngày 4/12 tại San Jose, với giải thưởng Đổi mới Kỹ thuật trị giá 15.000 USD tiền mặt và 1.000 cổ phiếu RSU; Văn bản 2 là Thư Đề cử Chính thức (Nomination Letter) từ Tiến sĩ Raymond Chen đề cử Kiến trúc sư Firmware Carlos Mendoza nhờ sáng chế thuật toán tiết kiệm năng lượng VoltSense mang lại 1,65 triệu USD.","Bước 2 (60 giây) - Móc nối Logic \u0026 Sơ đồ Tinh thần: Thiết lập chuỗi đối soát tiêu chuẩn khen thưởng: Tiêu chí đề cử (Văn bản 1: dự án triển khai trong năm 2026, mang lại giá trị định lượng trên 1,0 triệu USD, hạn nộp 1/11) ➔ Hồ sơ thành tích của Carlos Mendoza (Văn bản 2: thuật toán triển khai tháng 6/2026, giảm 24% điện năng tiêu thụ, tạo ra 1,65 triệu USD giá trị tiết kiệm đã kiểm toán) ➔ Ứng viên vượt chuẩn đề cử và đủ điều kiện nhận giải thưởng lớn tại Gala ngày 4/12.","Bước 3 (120 giây) - Định vị Manh mối \u0026 Giải đề Tốc độ: Câu 181 hỏi mục đích chính của văn bản 1 (công bố lễ trao giải thưởng thường niên và kêu gọi nộp hồ sơ đề cử); Câu 182 hỏi cơ cấu phần thưởng cho giải Đổi mới Kỹ thuật (15.000 USD tiền mặt, 1.000 cổ phiếu RSU và chuyến đi Tokyo); Câu 183 (câu hỏi liên kết) hỏi lý do Carlos Mendoza đủ điều kiện đề cử (tạo ra 1,65 triệu USD tiết kiệm, vượt ngưỡng 1,0 triệu USD); Câu 184 (từ vựng theo ngữ cảnh) hỏi từ \u0027bounty\u0027 trong văn bản 1 (đồng nghĩa với award / cash prize); Câu 185 (câu hỏi liên kết) hỏi sự kiện diễn ra vào ngày 4 tháng 12 (Đại tiệc Trao giải Xuất sắc tại Trung tâm Hội nghị San Jose).","Bước 4 (30 giây) - Đúc kết Feynman 1 Câu: Hiểu bản chất: Quy chế tôn vinh nhân sự xuất sắc (Employee Recognition \u0026 Awards) trong bài thi TOEIC luôn liên kết giữa \u0027Tiêu chuẩn đề cử khắt khe\u0027 (Nomination Eligibility Thresholds: thời gian triển khai, giá trị kinh tế đo lường được) với \u0027Hồ sơ bảo chứng thành tựu của cấp quản lý\u0027 (Manager Endorsement Dossier).","3. BẢN DỊCH SONG NGỮ TOÀN VĂN (BILINGUAL PARALLEL TRANSLATION)","VĂN BẢN 1: THÔNG BÁO ĐẠI TIỆC TRAO GIẢI XUẤT SẮC (NEXATECH GLOBAL CORP)","NEXATECH SEMICONDUCTOR GLOBAL CORP. — SAN JOSE, CA","EXECUTIVE RECOGNITION DIRECTIVE: 14TH ANNUAL EXCELLENCE AWARDS GALA","Date: October 5 | Submission Deadline: November 1","TẬP ĐOÀN BÁN DẪN NEXATECH SEMICONDUCTOR TOÀN CẦU — SAN JOSE, CA","CHỈ THỊ KHEN THƯỞNG ĐIỀU HÀNH: ĐẠI TIỆC TRAO GIẢI XUẤT SẮC THƯỜNG NIÊN LẦN THỨ 14","Ngày: 5 tháng 10 | Hạn chót nộp hồ sơ: 1 tháng 11","NexaTech Semiconductor Global is proud to announce the hosting of our 14th Annual Global Employee Excellence Awards Gala, scheduled for the evening of Friday, December 4, at the San Jose Grand Convention Center. This premier corporate celebration honors the extraordinary achievements, inventive brilliance, and collaborative dedication of our worldwide workforce.","Tập đoàn NexaTech Semiconductor Global tự hào thông báo việc tổ chức Đại tiệc Trao giải Nhân viên Xuất sắc Toàn cầu Thường niên lần thứ 14 của chúng tôi, dự kiến diễn ra vào tối Thứ Sáu, ngày 4 tháng 12, tại Trung tâm Hội nghị Lớn San Jose. Lễ kỷ niệm doanh nghiệp hàng đầu này nhằm tôn vinh những thành tựu phi thường, sự sáng tạo vượt bậc và sự cống hiến hợp tác của lực lượng lao động trên toàn thế giới của chúng ta.","Award Categories \u0026 Grand Prize Packages:","• Technical Innovation of the Year: Reserved for the individual or engineering team that architected an unprecedented technological solution. The recipient will be awarded a $15,000 cash innovation bounty, 1,000 Restricted Stock Units (RSUs) vesting immediately, an engraved crystal commemorative trophy, and corporate sponsorship to present as a keynote speaker at the Global Silicon Summit in Tokyo, Japan.","Các Hạng mục Giải thưởng \u0026 Gói Giải thưởng Lớn:","• Đổi mới Kỹ thuật của Năm: Dành riêng cho cá nhân hoặc đội ngũ kỹ thuật đã thiết kế một giải pháp công nghệ chưa từng có tiền lệ. Người nhận giải sẽ được trao giải thưởng tiền mặt đổi mới 15.000 USD, 1.000 Cổ phiếu Hạn chế Chuyển nhượng (RSU) có hiệu lực ngay lập tức, một cúp pha lê lưu niệm khắc tên và sự tài trợ của công ty để thuyết trình với tư cách diễn giả chính tại Hội nghị Thượng đỉnh Bán dẫn Toàn cầu tại Tokyo, Nhật Bản.","• Operational Excellence Award: Recognizing sustained supply-chain efficiency ($10,000 bounty + 500 RSUs).","• Customer Obsession Champion: Honoring exemplary client retention and partnership growth ($8,000 bounty).","• Giải thưởng Vận hành Xuất sắc: Ghi nhận hiệu quả chuỗi cung ứng bền vững (10.000 USD tiền thưởng + 500 RSU).","• Quán quân Vì Khách hàng: Tôn vinh việc duy trì khách hàng mẫu mực và phát triển quan hệ đối tác (8.000 USD tiền thưởng).","Nomination Eligibility Criteria:","1. Deployed Impact: The nominated solution must have been formally deployed into production environments between January 1 and September 30 of the current fiscal year.","2. Quantifiable Value: The project must have delivered audited operational cost savings or verified top-line revenue additions exceeding $1.0 million.","3. Cross-Functional Collaboration: Submissions must include written endorsements from at least two cooperating internal business departments.","Tiêu chuẩn Đủ điều kiện Đề cử:","1. Tác động Đã Triển khai: Giải pháp được đề cử phải được triển khai chính thức vào môi trường sản xuất thực tế từ ngày 1 tháng 1 đến ngày 30 tháng 9 của năm tài chính hiện tại.","2. Giá trị Có thể Đo lường: Dự án phải mang lại khoản tiết kiệm chi phí vận hành đã kiểm toán hoặc doanh thu tăng thêm đã xác thực vượt quá 1,0 triệu USD.","3. Phối hợp Đa phòng ban: Hồ sơ nộp phải bao gồm thư xác nhận bằng văn bản từ ít nhất hai phòng ban kinh doanh nội bộ cùng hợp tác.","Department directors must submit formal nomination dossiers to the Executive Awards Committee at awards-committee@nexatech.com by 5:00 PM PST on November 1.","Giám đốc các phòng ban phải gửi hồ sơ đề cử chính thức tới Hội đồng Giải thưởng Điều hành theo địa chỉ awards-committee@nexatech.com trước 17:00 giờ PST ngày 1 tháng 11.","VĂN BẢN 2: HỒ SƠ ĐỀ CỬ GIẢI THƯỞNG CHÍNH THỨC (DR. RAYMOND CHEN)","NEXATECH EMBEDDED SYSTEMS DIVISION — INTERNAL MEMORANDUM","TO: Executive Awards Selection Committee \u003cawards-committee@nexatech.com\u003e","FROM: Dr. Raymond Chen, Senior Director of Embedded Systems Engineering","DATE: October 24","SUBJECT: Formal Nomination: Technical Innovation of the Year — Carlos Mendoza","KHỐI HỆ THỐNG NHÚNG NEXATECH — BẢN GHI NHỚ NỘI BỘ","GỬI: Hội đồng Tuyển chọn Giải thưởng Điều hành \u003cawards-committee@nexatech.com\u003e","TỪ: Tiến sĩ Raymond Chen, Giám đốc Cấp cao Kỹ thuật Hệ thống Nhúng","NGÀY: 24 tháng 10","CHỦ ĐỀ: Đề cử Chính thức: Đổi mới Kỹ thuật của Năm — Carlos Mendoza","Dear Members of the Selection Committee,","It is my distinct privilege to formally nominate Mr. Carlos Mendoza, Lead Firmware Architect, for NexaTech’s 2026 Technical Innovation of the Year Award in recognition of his groundbreaking work spearheading the \u0027VoltSense Adaptive Power Algorithm.\u0027","Kính gửi các Thành viên Hội đồng Tuyển chọn,","Tôi vô cùng vinh dự được chính thức đề cử ông Carlos Mendoza, Kiến trúc sư Trưởng Firmware, cho Giải thưởng Đổi mới Kỹ thuật của Năm 2026 của NexaTech nhằm ghi nhận công trình mang tính đột phá của ông khi dẫn dắt \u0027Thuật toán Năng lượng Thích ứng VoltSense\u0027.","Addressing critical battery drain challenges in our next-generation mobile microcontrollers, Mr. Mendoza single-handedly engineered a predictive dynamic voltage-scaling algorithm. Following rigorous lab validation, the solution was deployed globally across our commercial wafer fabrication lines in June 2026. Real-world telemetry logs over the past four months confirm that the algorithm achieved a 24% reduction in idle power draw and eliminated 40% of thermal throttling events.","Giải quyết các thách thức nghiêm trọng về hao pin trên các bộ vi điều khiển di động thế hệ mới của chúng ta, ông Mendoza đã một mình thiết kế thuật toán điều chỉnh điện áp động mang tính dự báo. Sau quá trình xác thực nghiêm ngặt trong phòng thí nghiệm, giải pháp đã được triển khai trên toàn cầu trên các dây chuyền chế tạo tấm bán dẫn thương mại của chúng ta vào tháng 6 năm 2026. Nhật ký dữ liệu đo từ xa thực tế trong bốn tháng qua xác nhận rằng thuật toán đã giảm được 24% lượng điện tiêu thụ khi ở trạng thái chờ và loại bỏ 40% các sự cố nghẽn cổ chai do nhiệt độ.","From a financial and operational standpoint, our verified third-party audit reports confirm that the VoltSense deployment has generated $1.65 million in annualized manufacturing yield efficiencies and commercial licensing premiums, surpassing our division\u0027s full-year targets. Attached please find glowing endorsement letters from our Manufacturing Quality Assurance team and the Enterprise Automotive Sales division, confirming the cross-functional adoption of his architecture.","Trên phương diện tài chính và vận hành, các báo cáo kiểm toán độc lập của bên thứ ba đã xác nhận rằng việc triển khai VoltSense đã tạo ra 1,65 triệu USD hiệu quả năng suất chế tạo hàng năm và phí bản quyền thương mại, vượt xa các mục tiêu cả năm của khối chúng tôi. Đính kèm thư này là các thư chứng nhận nhiệt liệt từ đội ngũ Đảm bảo Chất lượng Sản xuất (QA) và Khối Kinh doanh Ô tô Doanh nghiệp, xác nhận việc áp dụng kiến trúc của ông trên quy mô liên phòng ban.","Carlos embodies the inventive spirit of NexaTech, and I urge the committee to bestow upon him this well-deserved recognition on December 4.","Respectfully submitted,","Dr. Raymond Chen","Senior Director of Embedded Engineering","Carlos là hiện thân của tinh thần đổi mới sáng tạo tại NexaTech, và tôi khẩn thiết đề nghị hội đồng trao tặng cho ông sự vinh danh hoàn toàn xứng đáng này vào ngày 4 tháng 12.","Kính thư,","Tiến sĩ Raymond Chen","Giám đốc Cấp cao Kỹ thuật Nhúng","4. DỊCH NGHĨA CÂU HỎI \u0026 ĐÁP ÁN (QUESTION \u0026 TRANSLATED OPTIONS)","181. Mục đích chủ yếu của văn bản thứ nhất là gì?","(A) Thông báo tái cấu trúc doanh nghiệp ảnh hưởng đến văn phòng kinh doanh Tokyo","(B) Công bố đại tiệc trao giải nhân viên thường niên và nêu các tiêu chuẩn đề cử","(C) Kêu gọi nộp hồ sơ ứng tuyển vào vị trí kiến trúc sư firmware nhúng đang mở","(D) Giải thích các điều khoản bảo hành cho các bộ vi điều khiển di động mới ra mắt","182. Theo thông báo, phần thưởng nào được bao gồm cho người chiến thắng giải Đổi mới Kỹ thuật của Năm?","(A) Một chuyến chuyển nơi ở vĩnh viễn được công ty chi trả toàn bộ tới Luân Đôn","(B) Một khoản tiền thưởng 15.000 USD, 1.000 cổ phiếu RSU và tài trợ tham dự hội nghị Tokyo","(C) Giảm giá 50% trọn đời cho các sản phẩm bán dẫn của công ty","(D) Một hợp đồng thuê xe ô tô điều hành chạy điện miễn phí do công ty chi trả","183. Tại sao ông Mendoza lại đủ điều kiện nhận giải thưởng Đổi mới Kỹ thuật của Năm?","(A) Ông đã tổ chức đại hội đồng cổ đông thường niên tại San Jose.","(B) Dự án của ông đã được triển khai vào tháng 6 năm 2026 và mang lại 1,65 triệu USD tiền tiết kiệm đã kiểm toán.","(C) Ông đã hoàn thành hơn hai mươi lăm năm làm việc liên tục ở cấp điều hành.","(D) Ông đã tình nguyện quản lý quỹ từ thiện ngày lễ của công ty.","184. Trong thông báo giải thưởng, từ \u0027bounty\u0027 trong phần Award Categories gần nghĩa nhất với từ nào?","(A) Hình phạt, chế tài vi phạm (penalty)","(B) Khoản tiền thưởng, phần thưởng tiền mặt (cash award / monetary prize)","(C) Khoản khấu trừ thuế (tax deduction)","(D) Phí hội viên thường niên (membership fee)","185. Sự kiện gì dự kiến sẽ diễn ra vào Thứ Sáu, ngày 4 tháng 12?","(A) Hạn chót để các giám đốc phòng ban nộp hồ sơ đề cử","(B) Buổi ra mắt thương mại chính thức của bộ vi điều khiển VoltSense","(C) Đại tiệc Trao giải Nhân viên Xuất sắc Toàn cầu Thường niên lần thứ 14","(D) Đợt thanh tra an toàn khẩn cấp tại nhà máy chế tạo tấm bán dẫn San Jose","5. CÔ ĐỌNG BÀI HỌC FEYNMAN (FEYNMAN CRITICAL TAKEAWAYS)","Key Structural \u0026 Vocabulary Takeaways (English)","• Corporate Recognition Architecture: High-level TOEIC passages connect annual galas with technical innovation bounties, equity acceleration grants (RSUs), and international keynote representation.","• Dual-Condition Benchmark Verification: Candidates validate nomination eligibility by satisfying both a deployment date gate (June 2026 vs Jan-Sept window) and an audited financial floor ($1.65M achieved vs $1.0M threshold).","• High-Frequency Recognition Lexicon: Master terminology such as \u0027innovation bounty\u0027 (cash prize), \u0027Restricted Stock Units (RSUs)\u0027, \u0027commemorative trophy\u0027, \u0027telemetry logs\u0027, and \u0027cross-functional endorsement\u0027.","Bài học Cốt lõi \u0026 Quy tắc Tư duy (Tiếng Việt)","• Khung Tôn vinh \u0026 Khen thưởng Doanh nghiệp: Các đề thi TOEIC kết nối giữa sự kiện dạ tiệc tri ân thường niên với các gói tiền thưởng đổi mới sáng tạo, cổ phiếu thưởng chuyển nhượng ngay (RSUs) và cơ hội phát biểu hội nghị quốc tế.","• Kỹ thuật Đối soát Điều kiện Kép: Xác thực tính đủ điều kiện của ứng viên bằng cách kiểm tra đồng thời cả 2 điều kiện: mốc thời gian đưa vào sản xuất (tháng 6/2026 nằm trong khung 1/1 - 30/9) và giá trị kinh tế định lượng (1,65 triệu USD vượt sàn 1,0 triệu USD).","• Nhận diện Thuật ngữ Khen thưởng \u0026 Đổi mới: Nắm vững \u0027bounty\u0027 (khoản tiền thưởng lớn cho phát kiến), \u0027commemorative\u0027 (để tưởng niệm, lưu niệm), \u0027telemetry\u0027 (dữ liệu đo từ xa), và \u0027cross-functional endorsement\u0027 (sự xác nhận ủng hộ đa phòng ban).","ACTIVE RECALL 5S (MA TRẬN TRUY XUẤT CHÉO DỮ LIỆU)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["1. Đối tượng \u0026 Vai trò: Ban Điều hành NexaTech Semiconductor Global công bố đại tiệc trao giải xuất sắc; Tiến sĩ Raymond Chen (Giám đốc Kỹ thuật Nhúng) viết thư đề cử; Kiến trúc sư Firmware Carlos Mendoza là người được đề cử giải Đổi mới Kỹ thuật của Năm.","1. Characters \u0026 Roles: NexaTech Semiconductor Global leadership announces the annual recognition gala; Dr. Raymond Chen (Senior Director) authors the nomination letter; Lead Firmware Architect Carlos Mendoza is nominated for Technical Innovation of the Year."]],[["2. Boi canh \u0026 Quy trinh loi"],["2. Bối cảnh \u0026 Quy trình lõi: Tôn vinh sáng kiến kỹ thuật công nghệ bán dẫn. Quy chế yêu cầu triển khai trong 9 tháng đầu năm 2026 và tạo giá trị tiết kiệm trên 1,0 triệu USD để nhận thưởng $15.000 + 1.000 RSU ➔ Carlos Mendoza phát minh thuật toán VoltSense triển khai tháng 6/2026, giảm 24% điện năng chờ và tạo ra 1,65 triệu USD ➔ Đề cử chính thức trước hạn 1/11 để vinh danh ngày 4/12.","2. Context \u0026 Core Workflow: Semiconductor engineering innovation recognition. Policy requires deployment in Q1-Q3 2026 and \u003e$1.0M audited value to win $15,000 + 1,000 RSUs ➔ Carlos Mendoza develops VoltSense algorithm deployed June 2026, cutting power by 24% and yielding $1.65M ➔ Nominated ahead of Nov 1 deadline for Dec 4 gala."]],[["3. Dau vet suy luan cheo"],["3. Dấu vết suy luận chéo: Móc nối thời hạn triển khai (1/1 - 30/9) ở Văn bản 1 với thời điểm áp dụng tháng 6/2026 ở Văn bản 2; đối chiếu ngưỡng tài chính 1,0 triệu USD ở Văn bản 1 với giá trị 1,65 triệu USD đạt được ở Văn bản 2; liên kết ngày tổ chức Dạ tiệc 4/12 ở Văn bản 1 với lời đề nghị vinh danh vào ngày 4/12 ở Văn bản 2.","3. Cross-Referencing Clues: Linking the deployment window (Jan 1 - Sept 30) in Passage 1 with the June 2026 rollout in Passage 2; correlating the $1.0M financial floor in Passage 1 with the $1.65M audited savings in Passage 2; connecting the Dec 4 gala date in Passage 1 with Dr. Chen\u0027s December 4 recognition appeal in Passage 2."]]],"t":"table"},"ĐÁP ÁN CHI TIẾT \u0026 BÓC TÁCH BẪY ETS","What is the primary purpose of the first document?","Dap an dung: (B) To publicize an annual employee awards gala and outline nomination criteria","[Dau vet bai doc / Clue]: Văn bản 1, Tiêu đề \u0026 Đoạn 1: \u0027EXECUTIVE RECOGNITION DIRECTIVE: 14TH ANNUAL EXCELLENCE AWARDS GALA... announce the hosting of our 14th Annual Global Employee Excellence Awards Gala... Nomination Eligibility Criteria...\u0027","[Dien dat tuong duong / Paraphrase]: announce 14th Annual Global Employee Excellence Awards Gala... nomination eligibility criteria ➔ publicize an annual employee awards gala and outline nomination criteria","[Loi giai chi tiet]: Văn bản 1 là chỉ thị của ban điều hành công bố sự kiện đại tiệc trao giải nhân viên xuất sắc thường niên lần thứ 14 và nêu chi tiết các tiêu chuẩn đủ điều kiện nộp hồ sơ đề cử.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) To announce a corporate restructuring affecting the Tokyo sales office","- Ly do sai: Tokyo chỉ là nơi tổ chức hội nghị bán dẫn mà người đoạt giải sẽ được tài trợ tham dự, không phải văn phòng bị tái cấu trúc.","- Bay ETS: Bẫy Tái cấu trúc Chi nhánh (Tokyo Restructuring Trap)","(C) To solicit candidate applications for an open embedded firmware architect position","- Ly do sai: Công ty khen thưởng nhân sự hiện tại, không phải tuyển dụng mới vị trí kiến trúc sư firmware.","- Bay ETS: Bẫy Tuyển dụng Nhân sự Kỹ thuật (Firmware Recruitment Trap)","(D) To explain warranty terms for newly launched mobile microcontrollers","- Ly do sai: Vi điều khiển là sản phẩm được ứng dụng thuật toán, văn bản không bàn về chính sách bảo hành.","- Bay ETS: Bẫy Chính sách Bảo hành (Product Warranty Trap)","According to the announcement, what prize is included for the Technical Innovation of the Year winner?","Dap an dung: (B) A $15,000 cash bounty, 1,000 RSUs, and sponsorship to a Tokyo conference","[Dau vet bai doc / Clue]: Văn bản 1, Mục Technical Innovation of the Year: \u0027...awarded a $15,000 cash innovation bounty, 1,000 Restricted Stock Units (RSUs) vesting immediately, an engraved crystal commemorative trophy, and corporate sponsorship to present as a keynote speaker at the Global Silicon Summit in Tokyo, Japan.\u0027","[Dien dat tuong duong / Paraphrase]: $15,000 cash bounty, 1,000 RSUs... sponsorship to present in Tokyo ➔ A $15,000 cash bounty, 1,000 RSUs, and sponsorship to a Tokyo conference","[Loi giai chi tiet]: Văn bản 1 liệt kê rõ gói giải thưởng cho người đoạt giải Đổi mới Kỹ thuật gồm: 15.000 USD tiền mặt, 1.000 cổ phiếu RSU, cúp pha lê và tài trợ thuyết trình tại hội nghị ở Tokyo.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) An all-expenses-paid permanent relocation to London","- Ly do sai: Giải thưởng là tài trợ đi hội nghị tại Tokyo, không phải chuyển nơi ở vĩnh viễn tới Luân Đôn.","- Bay ETS: Bẫy Định cư Luân Đôn (London Relocation Trap)","(C) A 50% discount on corporate semiconductor products for life","- Ly do sai: Không có chính sách giảm giá 50% mua chip bán dẫn trọn đời.","- Bay ETS: Bẫy Giảm giá Sản phẩm Trọn đời (Lifetime Discount Trap)","(D) A complimentary corporate lease on an electric exe
