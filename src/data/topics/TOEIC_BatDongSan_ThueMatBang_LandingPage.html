kflow Diagram (English Translation):",{"rows":[[["STEP 1","FORM SL-10 SUBMISSION \u0026 AUDITED UNDERWRITING"],[],["STEP 2","LEGAL RISK TRIAGE \u0026 PROFIT-SPLIT ARBITRATION"],[],["STEP 3","$2M INSURANCE FILING, BIOMETRIC ONBOARDING \u0026 TURNOVER"]],[["• Documents \u0026 Channels: Sublease Application (Form SL-10) \u0026 Certified Deloitte Balance Sheet","• Core Business Execution: Master tenant (Optima Media) files to sublet 5,000 RSF west wing to FinTech Dynamics; submits audited statements showing $8.4M liquid reserves (12x rent) and remits $2,500 review fee.","• Key Deliverable \u0026 Control: Verified application package transferred to Vanguard Asset Underwriting board."],["➔"],["• Documents \u0026 Channels: Master Lease Section 19 Covenants \u0026 50% Profit-Sharing Model","• Core Business Execution: Landlord reconciles rental spread ($56 vs. $48), deducts $666.67/mo partition amortization, establishes $1,333.33/mo profit share, and enforces master tenant ongoing legal privity.","• Key Deliverable \u0026 Control: Executed Landlord Formal Consent Letter issued to master and subtenant entities."],["➔"],["• Documents \u0026 Channels: Commercial General Liability Certificate \u0026 Lobby Biometric Access Portal","• Core Business Execution: FinTech Dynamics supplies $2M insurance certificate naming Vanguard as additional insured; registers 42 staff on the turnstile biometric portal by Oct 28; takes possession on Nov 1.","• Key Deliverable \u0026 Control: Subtenant takes possession seamlessly, reducing master tenant surplus overhead."]]],"t":"table"},"4.2. Tư duy Phân tích Nghiệp vụ \u0026 BA (Bản Tiếng Việt)","• Bức tranh Toàn cảnh Nghiệp vụ (End-to-End Flow): Trong thị trường văn phòng thương mại cao cấp, nghiệp vụ cho thuê lại (Commercial Sublease) là công cụ tái cấu trúc chi phí quan trọng giúp doanh nghiệp giải phóng diện tích nhàn rỗi mà không vi phạm hợp đồng gốc. Mối quan hệ pháp lý kết nối ba bên: Chủ tòa nhà (Master Landlord) - Bên thuê chính (Master Tenant) - Bên thuê lại (Subtenant). Quy trình chuẩn kiểm soát từ: Rà soát điều khoản hợp đồng gốc (Privity of Contract \u0026 Consent Covenants) -\u003e Nộp hồ sơ thẩm định tài chính -\u003e Khấu trừ chi phí đầu tư phân chia mặt bằng (Demising Wall \u0026 Brokerage Amortization) -\u003e Đối soát tỷ lệ chia sẻ lợi nhuận 50/50 -\u003e Nộp chứng chỉ bảo hiểm và cấp quyền ra vào tòa nhà.","• Điểm nghẽn \u0026 Rủi ro Vận hành Thực tế (Core Bottleneck \u0026 Risk): Nút thắt rủi ro pháp lý lớn nhất là \u0027Rủi ro trách nhiệm liên đới của bên thuê chính\u0027 (Master Tenant Continuing Strict Liability). Nhiều doanh nghiệp lầm tưởng rằng khi cho thuê lại xong thì họ hết trách nhiệm; tuy nhiên theo luật thương mại, nếu bên thuê lại (FinTech) phá sản hoặc quỵt tiền thuê, bên thuê chính (Optima Media) vẫn phải tự bỏ tiền túi thanh toán 100% tiền thuê gốc cho chủ tòa nhà và chịu trách nhiệm khôi phục nguyên trạng mặt bằng khi hết hạn. Rủi ro thứ hai là tranh chấp tỷ lệ chia lợi nhuận: Nếu không làm rõ các khoản chi phí được phép khấu trừ (như tiền xây vách ngăn 16.000 USD), chủ nhà có thể đòi chia 50% trên tổng doanh thu gộp.","• 3 Giải pháp Thiết kế Hệ thống \u0026 Kiểm soát Nghiệp vụ (BA \u0026 Commercial Sublease Architecture):","(1) Hệ thống Tự động Tính toán Khấu trừ và Chia sẻ Lợi nhuận (Automated Sublease Profit-Sharing Engine): Xây dựng công cụ kế toán chuẩn hóa công thức: Lợi nhuận Ròng để Chia = [Giá Thuê Lại Nhận Được] - [Giá Thuê Gốc Hợp Đồng] - [Khấu hao Chi phí Môi giới \u0026 Xây vách ngăn Hợp lệ Hàng tháng]. Sau đó tự động trích xuất bút toán chia 50% chuyển về tài khoản của chủ tòa nhà đồng thời cùng kỳ thanh toán tiền thuê.","(2) Cơ chế Ký quỹ Bảo đảm Bổ sung từ Bên Thuê Lại (Subtenant Security Escrow \u0026 Direct Guarantee): Để phòng ngừa rủi ro bên thuê lại quỵt nợ làm liên lụy đến mình, bên thuê chính (Optima) bắt buộc phải yêu cầu bên thuê lại đặt cọc từ 3-4 tháng tiền thuê lại vào tài khoản phong tỏa (Escrow), kèm cam kết bảo lãnh trực tiếp từ công ty mẹ của bên thuê lại.","(3) Kiểm soát An ninh Phân khu qua Hệ thống Phân quyền Sinh trắc học (Zoned Access Control \u0026 Biometric Partitioning): Khi chia sẻ văn phòng (Shared Occupancy), BA phối hợp với an ninh tòa nhà thiết lập hệ thống kiểm soát ra vào độc lập: Thẻ và sinh trắc học của 42 nhân viên FinTech chỉ mở được cửa cánh Tây và phòng họp chung, tuyệt đối không có quyền mở cửa cánh Đông (khu vực dữ liệu truyền thông mật của Optima Media).","• Tam giác Liên kết Nhận thức Đa chiều (Multi-Perspective Contextual Anchoring):","- Lăng kính Viễn thông / CNTT Viettel: Bài toán cho thuê lại dung lượng truyền dẫn / Cho thuê hạ tầng cột ăng-ten dùng chung (Telecom Infrastructure Sharing). Khi Viettel đầu tư xây dựng trạm phát sóng hoặc tuyến cáp quang dung lượng lớn, để tối ưu hóa chi phí đầu tư (CAPEX), Viettel ký thỏa thuận chia sẻ hạ tầng cho các nhà mạng khác thuê lại các sợi quang nhàn rỗi hoặc đặt chung thiết bị phát sóng trên cột; hợp đồng luôn quy định rõ điều kiện kiểm tra kỹ thuật thiết bị của đối tác, bảo đảm không gây can nhiễu tần số và có cơ chế bảo lãnh tài chính rõ ràng.","- Lăng kính Quản trị Mầm non Ước Mơ Xanh: Khi trường mầm non có một phòng hội trường lớn tầng 2 không sử dụng hết công suất vào các buổi tối hoặc cuối tuần, cô Thu Huyền nghiên cứu cho một trung tâm năng khiếu mỹ thuật hoặc lớp dạy cờ vua trẻ em uy tín thuê lại vào sáng Chủ Nhật: Trường bắt buộc phải làm hợp đồng cho thuê lại có sự đồng ý của chủ mặt bằng tòa nhà, yêu cầu đơn vị thuê lại nộp tiền cọc bảo vệ cơ sở vật chất, cam kết dọn dẹp sạch sẽ đồ chơi và bảo đảm an toàn phòng cháy trước giờ các bé mầm non đi học lại vào sáng Thứ Hai.","- Lăng kính Bàn học Gia đình (Kèm cặp Bé Hà Ngân Lớp 5): Bài học về \u0027Trách nhiệm khi cho bạn mượn đồ\u0027: Khi Hà Ngân mượn một bộ cọ vẽ hoặc cuốn truyện tranh quý của bạn ở lớp về nhà, nếu bạn cùng bàn khác muốn mượn lại cuốn truyện đó từ Hà Ngân, con phải nhớ nguyên tắc: Phải hỏi ý kiến của bạn chủ cuốn sách trước (giống như xin phép chủ tòa nhà); và nếu bạn kia làm rách hay mất sách thì chính Hà Ngân vẫn là người phải chịu trách nhiệm đền cuốn sách mới cho bạn chủ ban đầu.","4.3. Business Analyst Executive Summary (Bản Tiếng Anh)","• End-to-End Business \u0026 Facility Context: Commercial subleasing represents a vital liquidity and space-optimization mechanism reconciling master tenant footprint contraction with landlord asset security. The governance framework integrates master lease covenant compliance (Section 19 privity rules), rigorous third-party underwriting, capital cost amortization offsets, automated profit-sharing reconciliations, and physical perimeter partitioning.","• Core Operational Bottleneck \u0026 Risk: The primary legal hazard is master tenant continuing strict liability (privity of contract). If the subtenant defaults on monthly installments or commits structural infractions, the master tenant remains unconditionally liable for full underlying lease obligations and end-of-term physical restoration. A secondary failure mode is profit-split disputes arising from ambiguous tenant improvement amortization deductions.","• Key BA \u0026 System Architecture Solutions:","(1) Standardized Net Excess Profit Reconciliation Models: Codify strict financial algorithms defining net distributable profit: [Sublease Gross Revenue] - [Master Rent] - [Certified Amortized Demising Capital Expenses ($666.67/mo)], dividing the verified remainder 50/50 ($1,333.33/mo) automatically within core accounting ERP platforms.","(2) Master Tenant Indemnification \u0026 Collateral Ring-Fencing: Enforce subtenant collateral covenants requiring 3-4 months of dedicated security escrow and direct parent corporate guarantees, shielding the master tenant from insolvency cross-default exposure.","(3) Role-Based Biometric Perimeter Segmentation: Coordinate with commercial facility access systems to partition physical access credentials, restricting 42 subtenant staff strictly to approved demised wings and shared common core areas while securing proprietary master tenant assets.","PHẦN 5: TỪ VỰNG \u0026 PARAPHRASE CHUYÊN SÂU (CHUẨN 3 DÒNG TỐI ƯU NẠP ANKI)","Sublease  /ˈsʌbliːs/  Sublet Agreement / Underlease / Secondary Tenancy Contract","Nghia: Hợp đồng cho thuê lại, trong đó bên thuê chính cho bên thứ ba thuê lại một phần hoặc toàn bộ mặt bằng.","Vd: Optima Media entered into a two-year sublease agreement with FinTech Dynamics for the western wing. - Công ty Truyền thông Optima đã ký hợp đồng cho thuê lại hai năm với FinTech Dynamics cho khu vực cánh phía tây.","Consent  /kənˈsɛnt/  Permission / Formal Authorization / Written Approval / Official Sanction","Nghia: Sự đồng thuận, phê chuẩn hoặc cho phép chính thức bằng văn bản của chủ sở hữu tài sản.","Vd: The tenant must obtain landlord prior written consent before executing any commercial sublease. - Bên thuê phải có được văn bản chấp thuận trước của chủ tòa nhà trước khi ký kết bất kỳ hợp đồng thuê lại nào.","Solvency  /ˈsɑːlvənsi/  Financial Viability / Fiscal Stability / Ability to Pay Debt Obligations","Nghia: Năng lực thanh toán, khả năng tài chính lành mạnh đảm bảo trả được đầy đủ các khoản nợ đến hạn.","Vd: The prospective subtenant demonstrated strong commercial solvency with $8.4 million in liquid assets. - Bên thuê lại tiềm năng đã chứng minh năng lực thanh toán thương mại vững chắc với 8,4 triệu USD tài sản lưu động.","Profit Sharing  /ˈprɑːfɪt ˈʃɛrɪŋ/  Excess Rent Remittance / Revenue Split / Surplus Gain Apportionment","Nghia: Cơ chế chia sẻ lợi nhuận, quy định bên thuê chính phải nộp lại một tỷ lệ tiền lãi chênh lệch giá thuê cho chủ tòa nhà.","Vd: Under the profit sharing clause, the tenant pays 50% of the excess rental income to the landlord. - Theo điều khoản chia sẻ lợi nhuận, bên thuê nộp 50% khoản thu nhập tiền thuê thặng dư cho chủ tòa nhà.","Demise  /dɪˈmaɪz/  Partitioned Leased Space / Conveyed Premises / Transferred Real Estate Footprint","Nghia: Mặt bằng được phân tách rõ ràng để chuyển giao quyền thuê theo văn bản hợp đồng.","Vd: The demised western wing includes four private corner offices and an open cubicle area. - Khu vực cánh phía tây được ngăn cách bàn giao bao gồm bốn văn phòng góc riêng và khu vực bàn làm việc mở.","Amortize  /ˈæmərtaɪz/  Depreciate Gradually / Spread Costs Across Duration / Prorate Capital Expenses","Nghia: Phân bổ chi phí dần dần, chia nhỏ khoản chi phí xây dựng cải tạo ban đầu đều qua từng tháng của hợp đồng.","Vd: The $16,000 partition construction cost was amortized over the 24-month sublease duration. - Chi phí xây dựng vách ngăn 16.000 USD đã được phân bổ đều trong suốt thời hạn hợp đồng thuê lại 24 tháng.","==================================================================================================","BÀI 8: Kiểm tra Tuân thủ PCCC, Cửa Thoát hiểm \u0026 Giấy phép Hoạt động (Certificate of Occupancy) (Questions 181-185 - Double Passage)","Nguồn: ETS TOEIC Part 7 — Double Passage (Municipal Fire Safety Inspection Report \u0026 Property Remediation Plan E-mail, Questions 181-185)","PHẦN 1: NỘI DUNG VĂN BẢN ĐỌC HIỂU \u0026 DỊCH THUẬT","1.1. Đề thi Tiếng Anh gốc (Strategy Guide \u0026 Original ETS Passages)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","Municipal Fire Prevention Bureau \u0026 Building Safety Department","Annual Commercial Life-Safety Compliance Inspection Report","Property: Beacon Heights Corporate Plaza (500 West End Boulevard)","Inspection Date: September 8, 2026 | Lead Fire Marshal: Captain Raymond Vance","Inspection Findings \u0026 Statutory Notices:","An annual mandated life-safety audit was conducted across all common areas, mechanical risers, and tenant suites of Beacon Heights Plaza. While central wet-pipe sprinkler pressure and fire alarm horn-strobe panels were certified fully operational, our inspection team identified three specific municipal fire code violations:","1. Violation Code #F-104 (Critical Hazard): The secondary emergency egress exit door on the 6th-floor east corridor was obstructed by surplus modular office furniture and wooden shipping pallets stored by Suite 650. Egress routes must maintain an unobstructed clearance width of at least 44 inches at all times.","2. Violation Code #F-218 (Moderate Hazard): Two illuminated emergency battery-backup EXIT directional signs on the 3rd floor parking garage failed the mandatory 90-minute illumination load test.","3. Violation Code #F-305 (Administrative Notice): Annual hydrostatic pressure testing certification tags for four chemical fire extinguishers in the basement boiler room expired on August 15, 2026.","Statutory Remediation Directive:","Property management must rectify Violation #F-104 within seven (7) calendar days (September 15, 2026) to prevent a stop-work citation. All moderate and administrative citations must be fully corrected prior to the final municipal re-inspection on September 22, 2026, for renewal of the building\u0027s Master Certificate of Occupancy.","E-mail (Property Manager Remediation Action Plan \u0026 Notice to Tenants)","To: All Beacon Heights Commercial Tenants \u003ctenants@beaconplaza.com\u003e","Cc: Captain Raymond Vance \u003cr.vance@metrofire.gov\u003e","From: Melissa Huang, Senior Property Director \u003cm.huang@beaconplaza.com\u003e","Date: September 11, 2026","Subject: Remediation Action Plan: Annual Fire Safety Inspection \u0026 Egress Protocols","Dear Beacon Heights Tenants,","Following our annual life-safety inspection conducted by the Municipal Fire Prevention Bureau earlier this week, Beacon Plaza management has mobilized immediate remedial measures to ensure full statutory compliance across all floors:","1. 6th-Floor Egress Clearance (Completed Today): Our building maintenance staff coordinated directly with the operations team at Suite 650 this morning. All palletized freight and surplus modular furniture blocking the east stairwell exit have been removed and transferred to our subterranean storage holding area. The hallway corridor now exceeds the mandated 44-inch clear width.","2. Emergency Exit Sign Replacement: Our certified electrical contractor (VoltTech Systems) is scheduled tomorrow, September 12, to replace the two defective 3rd-floor garage LED emergency signs with new 10-year lithium-polymer battery units.","3. Boiler Room Extinguisher Certification: HydroSafe Fire Systems recertified and tagged all basement chemical suppression cylinders yesterday afternoon.","Mandatory Fire Warden Walkthrough:","Captain Vance will conduct the municipal re-inspection walkthrough on Tuesday, September 22, at 10:00 AM. In preparation, we will conduct an internal preparatory walkthrough on Monday, September 21. We ask that all tenant floor wardens ensure that individual suite exit doors remain unlocked and corridors remain clear of recycling bins throughout next week.","Thank you for your cooperation in maintaining a safe commercial environment.","Sincerely,","Melissa Huang","Senior Director of Property Operations","Beacon Heights Corporate Plaza","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","181 What was the primary purpose of the inspection conducted on September 8?","(A) To evaluate the building\u0027s energy efficiency for tax credits","(B) To verify compliance with commercial fire and life-safety regulations","(C) To appraise the market value of the property for a commercial mortgage","(D) To measure interior office noise levels during rush hour","182 Which violation was classified as a critical hazard requiring correction within seven days?","(A) Expired inspection tags on basement fire extinguishers","(B) Dim lighting inside the primary passenger elevator cabs","(C) Blockage of an emergency egress exit door on the sixth floor","(D) Low water pressure in the rooftop central sprinkler tanks","183 How did Ms. Huang resolve the storage issue on the sixth floor?","(A) By issuing an immediate eviction notice to the tenant in Suite 650","(B) By relocating the pallets and modular furniture to a subterranean storage area","(C) By constructing a permanent storage closet in the east hallway corridor","(D) By selling the surplus office equipment at an online public auction","184 The word \"rectify\" in the statutory remediation directive is closest in meaning to","(A) examine","(B) correct","(C) justify","(D) prolong","185 What is scheduled to occur on September 22, 2026?","(A) The installation of replacement lithium-polymer emergency signs","(B) An internal fire drill conducted by tenant floor wardens","(C) The official municipal re-inspection by the lead fire marshal","(D) The expiration of the existing commercial lease agreements","1.2. Hướng dẫn làm bài Part 7: Chiến lược 5 phút tối ưu","CHIẾN THUẬT 5 PHÚT TỐI ƯU: NẮM BẮT BỐI CẢNH, GHÉP NỐI DỮ KIỆN \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Luồng quy trình Đoạn đôi (Quỹ đạo Quét chữ Z \u0026 Bộ lọc 3 Câu hỏi Tiềm thức): • Quỹ đạo hình chữ Z (Z-Pattern Eye Scan) qua 2 văn bản:","- Văn bản 1 (Fire Inspection Report): Điểm chạm 1: \u0027Annual Commercial Life-Safety Compliance Inspection\u0027 (Q1: Báo cáo kiểm tra an toàn PCCC tòa nhà văn phòng). Điểm chạm 2: \u0027Lead Fire Marshal: Raymond Vance | 3 violations: #F-104 (Critical: 6th-floor exit blocked by pallets), #F-218 (Garage exit signs), #F-305 (Boiler tags)\u0027 (Q2: 3 lỗi vi phạm gồm chặn cửa thoát hiểm tầng 6, đèn thoát hiểm hầm và bình chữa cháy). Điểm chạm 3: \u0027Remediate #F-104 within 7 days (Sept 15) | Re-inspection: Sept 22\u0027 (Q3: Phải xử lý lỗi nghiêm trọng trước 15/9, tái kiểm tra ngày 22/9).","- Văn bản 2 (Email - Kế hoạch khắc phục của Ban quản lý tòa nhà): Điểm chạm 1: \u0027Subject: Remediation Action Plan: Annual Fire Safety Inspection\u0027 (Q1: Kế hoạch khắc phục sự cố PCCC). Điểm chạm 2: \u0027Melissa Huang, Senior Property Director\u0027 (Q2: Ban quản lý gửi toàn thể khách thuê và thanh tra cứu hỏa). Điểm chạm 3: \u0027Action: Removed pallets to basement storage... Replaced garage signs Sept 12... Recertified boiler extinguishers... Captain Vance re-inspection Sept 22\u0027 (Q3: Chuyển pallet xuống hầm, thay đèn ngày 12/9, gia hạn bình cứu hỏa và chốt lịch tái kiểm tra ngày 22/9).","• Xâu chuỗi quy trình: Thanh tra PCCC chỉ ra 3 lỗi và ra tối hậu thư 7 ngày (Văn bản 1) -\u003e Ban quản lý lập tức dọn đồ xuống hầm, thuê thợ điện thay đèn và mời thanh tra trưởng quay lại kiểm định tái cấp Giấy phép Hoạt động vào ngày 22/9 (Văn bản 2).","Bước 2 (20 giây) - Quét nhanh 5 câu hỏi \u0026 Gắn móc từ khóa (Mental Hooks - KHÔNG đọc đáp án): • Q181: \u0027primary purpose of inspection conducted on Sept 8\u0027 -\u003e Móc: Mục đích cuộc kiểm tra ngày 8/9 (Văn bản 1).","• Q182: \u0027Which violation was classified as critical hazard requiring correction in 7 days\u0027 -\u003e Móc: Lỗi nghiêm trọng phải sửa trong 7 ngày (Văn bản 1).","• Q183: \u0027How did Ms. Huang resolve the storage issue on 6th floor\u0027 -\u003e Móc ghép nối: Cách giải quyết đồ đạc tầng 6 (Văn bản 2).","• Q184: \u0027word \"rectify\" in remediation directive is closest in meaning to\u0027 -\u003e Móc: Từ vựng ngữ cảnh \u0027rectify\u0027 (Văn bản 1).","• Q185: \u0027What is scheduled to occur on September 22, 2026\u0027 -\u003e Móc: Sự kiện diễn ra ngày 22/9 (Văn bản 1 + 2).","Bước 3 (3 phút 45 giây) - Cách trả lời \u0026 Dấu hiệu tìm nhanh nhất cho đủ 5 câu hỏi: • Q181 (Mục đích - 20s): [Dấu hiệu nhanh]: Đọc tiêu đề Văn bản 1: \u0027Annual Commercial Life-Safety Compliance Inspection Report\u0027 và câu đầu: \u0027An annual mandated life-safety audit was conducted across all common areas...\u0027 -\u003e Xác minh việc tuân thủ các quy định an toàn PCCC và tính mạng thương mại -\u003e Chọn (B).","• Q182 (Chi tiết - 25s): [Dấu hiệu nhanh]: Nhìn vào mục 1 của Văn bản 1: \u0027Violation Code #F-104 (Critical Hazard): The secondary emergency egress exit door on the 6th-floor east corridor was obstructed by surplus modular office furniture and wooden shipping pallets stored by Suite 650\u0027 -\u003e Cửa thoát hiểm khẩn cấp tầng 6 bị chặn bởi đồ đạc và pallet -\u003e Chọn (C).","• Q183 (Chi tiết xử lý - 25s): [Dấu hiệu nhanh]: Đọc mục 1 trong Email của bà Huang ở Văn bản 2: \u0027All palletized freight and surplus modular furniture blocking the east stairwell exit have been removed and transferred to our subterranean storage holding area\u0027 -\u003e Chuyển toàn bộ pallet và đồ đạc xuống kho lưu trữ dưới tầng hầm -\u003e Chọn (B).","• Q184 (Từ vựng ngữ cảnh - 20s): [Dấu hiệu nhanh]: \u0027Rectify a violation\u0027 trong quản lý xây dựng và luật PCCC là sửa chữa, khắc phục, chấn chỉnh lỗi sai (correct / fix / remedy) -\u003e Chọn (B).","• Q185 (Ghép nối thời gian - 35s): [Dấu hiệu nhanh]: Cả Văn bản 1 (dòng cuối: \u0027final municipal re-inspection on September 22, 2026\u0027) và Văn bản 2 (mục Mandatory Fire Warden: \u0027Captain Vance will conduct the municipal re-inspection walkthrough on Tuesday, September 22, at 10:00 AM\u0027) đều xác nhận: Cuộc tái kiểm tra chính thức của thanh tra cứu hỏa thành phố -\u003e Chọn (C).","Bước 4 (25 giây cuối + Đúc kết Feynman): • Khóa sổ 5 đáp án: 181-B, 182-C, 183-B, 184-B, 185-C.","• Tóm tắt Feynman 1 câu: \u0027Tòa nhà Beacon Heights bị thanh tra PCCC tuýt còi vì khách thuê tầng 6 để pallet gỗ chắn lối thoát hiểm, nên ban quản lý đã cấp tốc chuyển đồ xuống tầng hầm trong ngày, thay 2 biển đèn EXIT hầm để kịp đợt tái kiểm định cấp Giấy chứng nhận đủ điều kiện hoạt động (Certificate of Occupancy) vào ngày 22/9.\u0027","1.3. Dịch Song ngữ Xen kẽ Từng Câu (Sentence-by-Sentence Translation)","Annual Commercial Life-Safety Compliance Inspection Report (Báo cáo Thanh tra An toàn PCCC Định kỳ)","Municipal Fire Prevention Bureau \u0026 Building Safety Department","Property: Beacon Heights Corporate Plaza (500 West End Boulevard)","Inspection Date: September 8, 2026 | Lead Fire Marshal: Captain Raymond Vance","Cục Phòng cháy Chữa cháy Đô thị \u0026 Sở An toàn Tòa nhà","Bất động sản: Khu phức hợp Doanh nghiệp Beacon Heights (Số 500 Đại lộ West End)","Ngày thanh tra: 8 tháng 9, 2026 | Thanh tra Cứu hỏa Trưởng: Đại úy Raymond Vance","Inspection Findings \u0026 Statutory Notices: An annual mandated life-safety audit was conducted across all common areas, mechanical risers, and tenant suites of Beacon Heights Plaza.","Kết quả Thanh tra \u0026 Thông báo Pháp lý: Một đợt kiểm toán an toàn tính mạng bắt buộc hàng năm đã được tiến hành trên toàn bộ các khu vực chung, hộp kỹ thuật cơ điện và các gian văn phòng khách thuê của Tòa nhà Beacon Heights Plaza.","While central wet-pipe sprinkler pressure and fire alarm horn-strobe panels were certified fully operational, our inspection team identified three specific municipal fire code violations:","Trong khi áp lực hệ thống chữa cháy tự động ống ướt trung tâm và các bảng điều khiển chuông còi báo cháy được chứng nhận hoạt động bình thường, đoàn thanh tra của chúng tôi đã phát hiện ba lỗi vi phạm quy chuẩn PCCC đô thị cụ thể:","1. Violation Code #F-104 (Critical Hazard): The secondary emergency egress exit door on the 6th-floor east corridor was obstructed by surplus modular office furniture and wooden shipping pallets stored by Suite 650.","1. Mã Vi phạm #F-104 (Nguy cơ Nghiêm trọng): Cửa thoát hiểm khẩn cấp phụ tại hành lang phía đông tầng 6 bị cản trở bởi đồ nội thất văn phòng mô-đun dư thừa và các pallet gỗ giao hàng do Gian 650 cất giữ.","Egress routes must maintain an unobstructed clearance width of at least 44 inches at all times.","Các tuyến đường thoát hiểm bắt buộc phải luôn duy trì chiều rộng thông thủy không có vật cản ít nhất là 44 inch (1,12 mét) vào mọi thời điểm.","2. Violation Code #F-218 (Moderate Hazard): Two illuminated emergency battery-backup EXIT directional signs on the 3rd floor parking garage failed the mandatory 90-minute illumination load test.","2. Mã Vi phạm #F-218 (Nguy cơ Trung bình): Hai biển chỉ dẫn EXIT thoát hiểm khẩn cấp có pin dự phòng chiếu sáng tại nhà để xe tầng 3 đã không vượt qua được bài kiểm tra tải chiếu sáng bắt buộc trong 90 phút.","3. Violation Code #F-305 (Administrative Notice): Annual hydrostatic pressure testing certification tags for four chemical fire extinguishers in the basement boiler room expired on August 15, 2026.","3. Mã Vi phạm #F-305 (Thông báo Hành chính): Tem chứng nhận thử áp lực thủy tĩnh hàng năm cho bốn bình chữa cháy hóa chất trong phòng nồi hơi tầng hầm đã hết hạn vào ngày 15 tháng 8 năm 2026.","Statutory Remediation Directive: Property management must rectify Violation #F-104 within seven (7) calendar days (September 15, 2026) to prevent a stop-work citation.","Chỉ thị Khắc phục Bắt buộc theo Luật: Ban quản lý bất động sản phải khắc phục Mã Vi phạm #F-104 trong vòng bảy (7) ngày dương lịch (ngày 15 tháng 9 năm 2026) để tránh bị đình chỉ hoạt động.","All moderate and administrative citations must be fully corrected prior to the final municipal re-inspection on September 22, 2026, for renewal of the building\u0027s Master Certificate of Occupancy.","Toàn bộ các vi phạm mức độ trung bình và hành chính phải được sửa chữa hoàn tất trước đợt tái thanh tra thành phố cuối cùng vào ngày 22 tháng 9 năm 2026 để được gia hạn Giấy chứng nhận Đủ điều kiện Hoạt động (Certificate of Occupancy) của tòa nhà.","E-mail (Kế hoạch Hành động Khắc phục \u0026 Thông báo gửi Khách thuê)","To: All Beacon Heights Commercial Tenants \u003ctenants@beaconplaza.com\u003e","Cc: Captain Raymond Vance \u003cr.vance@metrofire.gov\u003e","From: Melissa Huang, Senior Property Director \u003cm.huang@beaconplaza.com\u003e","Date: September 11, 2026","Subject: Remediation Action Plan: Annual Fire Safety Inspection \u0026 Egress Protocols","Người nhận: Toàn thể Khách thuê Thương mại Beacon Heights \u003ctenants@beaconplaza.com\u003e","Đồng kính gửi: Đại úy Raymond Vance \u003cr.vance@metrofire.gov\u003e","Người gửi: Melissa Huang, Giám đốc Bất động sản Cấp cao \u003cm.huang@beaconplaza.com\u003e","Ngày: 11 tháng 9, 2026","Tiêu đề: Kế hoạch Hành động Khắc phục: Thanh tra An toàn PCCC Hàng năm \u0026 Quy chuẩn Thoát hiểm","Dear Beacon Heights Tenants, following our annual life-safety inspection conducted by the Municipal Fire Prevention Bureau earlier this week, Beacon Plaza management has mobilized immediate remedial measures to ensure full statutory compliance across all floors.","Kính gửi Quý Khách thuê Tòa nhà Beacon Heights, sau đợt kiểm tra an toàn PCCC hàng năm do Cục Phòng cháy Chữa cháy Đô thị tiến hành đầu tuần này, ban quản lý Beacon Plaza đã huy động các biện pháp khắc phục ngay lập tức để bảo đảm tuân thủ luật pháp toàn diện trên tất cả các tầng.","1. 6th-Floor Egress Clearance (Completed Today): Our building maintenance staff coordinated directly with the operations team at Suite 650 this morning.","1. Giải phóng Lối thoát hiểm Tầng 6 (Đã hoàn thành Hôm nay): Đội ngũ bảo dưỡng tòa nhà của chúng tôi đã phối hợp trực tiếp với bộ phận vận hành tại Gian 650 vào sáng nay.","All palletized freight and surplus modular furniture blocking the east stairwell exit have been removed and transferred to our subterranean storage holding area.","Toàn bộ hàng hóa đóng pallet và đồ nội thất mô-đun dư thừa cản trở lối thoát cầu thang bộ phía đông đã được dọn sạch và chuyển xuống kho lưu trữ dưới tầng hầm của chúng tôi.","The hallway corridor now exceeds the mandated 44-inch clear width.","Hành lang hiện tại đã vượt mức chiều rộng thông thủy bắt buộc 44 inch.","2. Emergency Exit Sign Replacement: Our certified electrical contractor (VoltTech Systems) is scheduled tomorrow, September 12, to replace the two defective 3rd-floor garage LED emergency signs with new 10-year lithium-polymer battery units.","2. Thay thế Biển Báo Thoát hiểm Khẩn cấp: Nhà thầu cơ điện có chứng chỉ của chúng tôi (Hệ thống VoltTech) đã lên lịch vào ngày mai, ngày 12 tháng 9, để thay thế hai biển báo LED khẩn cấp bị lỗi tại bãi đỗ xe tầng 3 bằng các cụm pin lithium-polymer mới có tuổi thọ 10 năm.","3. Boiler Room Extinguisher Certification: HydroSafe Fire Systems recertified and tagged all basement chemical suppression cylinders yesterday afternoon.","3. Chứng nhận Bình chữa cháy Phòng Nồi hơi: Công ty PCCC HydroSafe đã tái kiểm định và gắn tem kiểm tra cho toàn bộ các bình khí dập lửa hóa chất dưới tầng hầm vào chiều hôm qua.","Mandatory Fire Warden Walkthrough: Captain Vance will conduct the municipal re-inspection walkthrough on Tuesday, September 22, at 10:00 AM.","Kiểm tra Thực địa Bắt buộc của Đội trưởng PCCC: Đại úy Vance sẽ tiến hành chuyến kiểm tra thực địa tái thẩm định của thành phố vào Thứ Ba, ngày 22 tháng 9, lúc 10:00 sáng.","In preparation, we will conduct an internal preparatory walkthrough on Monday, September 21.","Để chuẩn bị, chúng tôi sẽ tiến hành đợt kiểm tra chuẩn bị nội bộ vào Thứ Hai, ngày 21 tháng 9.","We ask that all tenant floor wardens ensure that individual suite exit doors remain unlocked and corridors remain clear of recycling bins throughout next week.","Chúng tôi đề nghị toàn bộ các đội trưởng PCCC từng tầng của khách thuê bảo đảm các cửa thoát hiểm văn phòng không bị khóa và các hành lang không để các thùng rác tái chế trong suốt tuần tới.","Thank you for your cooperation in maintaining a safe commercial environment. Sincerely, Melissa Huang, Senior Director of Property Operations.","Cảm ơn sự hợp tác của quý vị trong việc duy trì một môi trường thương mại an toàn. Trân trọng, Melissa Huang, Giám đốc Cấp cao Vận hành Bất động sản.","1.4. Dịch chi tiết Câu hỏi \u0026 Phương án Trắc nghiệm","181. Mục đích chính của đợt thanh tra được tiến hành vào ngày 8 tháng 9 là gì?","(A) Để đánh giá hiệu quả sử dụng năng lượng của tòa nhà nhằm hưởng ưu đãi thuế","(B) Để kiểm tra và xác minh việc tuân thủ các quy định an toàn PCCC thương mại","(C) Để định giá giá trị thị trường của bất động sản phục vụ vay thế chấp thương mại","(D) Để đo lường mức độ tiếng ồn bên trong văn phòng trong các khung giờ cao điểm","182. Lỗi vi phạm nào được phân loại là nguy cơ nghiêm trọng bắt buộc phải sửa chữa trong vòng 7 ngày?","(A) Hết hạn tem kiểm định trên các bình chữa cháy dưới phòng nồi hơi tầng hầm","(B) Hệ thống đèn chiếu sáng bên trong cabin thang máy chở khách bị mờ","(C) Sự tắc nghẽn cản trở cửa thoát hiểm khẩn cấp tại tầng sáu","(D) Áp lực nước bị thấp tại các bồn chứa nước chữa cháy tự động trên tầng mái","183. Bà Huang đã giải quyết vấn đề chứa đồ đạc tại tầng 6 như thế nào?","(A) Bằng cách ban hành thông báo trục xuất ngay lập tức đối với khách thuê tại Gian 650","(B) Bằng cách chuyển toàn bộ pallet và đồ nội thất mô-đun xuống kho lưu trữ tầng hầm","(C) Bằng cách xây dựng một tủ chứa đồ cố định tại hành lang lối đi phía đông","(D) Bằng cách bán thanh lý các thiết bị văn phòng dư thừa trong một đợt đấu giá trực tuyến","184. Từ \"rectify\" trong chỉ thị khắc phục bắt buộc có nghĩa gần nhất với","(A) kiểm tra / rà soát (examine)","(B) sửa chữa / chấn chỉnh (correct)","(C) biện minh / thanh minh (justify)","(D) kéo dài / gia hạn thêm (prolong)","185. Sự kiện gì dự kiến sẽ diễn ra vào ngày 22 tháng 9 năm 2026?","(A) Việc lắp đặt các biển báo khẩn cấp pin lithium-polymer thay thế","(B) Một đợt diễn tập PCCC nội bộ do các đội trưởng tầng của khách thuê tiến hành","(C) Chuyến kiểm tra tái thẩm định chính thức của thành phố do thanh tra cứu hỏa trưởng thực hiện","(D) Thời điểm hết hạn của các hợp đồng thuê thương mại hiện hữu","1.5. Tóm tắt Viết lại Toàn bài theo Feynman (Feynman Monograph Summary)","English Executive Summary:","• Background \u0026 Fire Inspection Audit: Captain Raymond Vance of the Municipal Fire Prevention Bureau inspects Beacon Heights Plaza, issuing statutory notices for 3 infractions: a critical 7-day citation (#F-104) for a blocked 6th-floor fire exit, failed garage exit signs (#F-218), and expired extinguisher tags (#F-305).","• Property Manager Remediation: Director Melissa Huang coordinates same-day removal of Suite 650\u0027s pallets to basement storage (restoring 44-inch clearance), schedules electrical replacement of garage exit signs with 10-year lithium batteries, and recertifies all basement extinguishers.","• Final Re-inspection \u0026 Occupancy Recertification: Management schedules an internal preparatory audit for Sept 21 ahead of Captain Vance\u0027s official Sept 22 walkthrough at 10:00 AM, ensuring renewal of the building\u0027s Master Certificate of Occupancy.","Bản tóm tắt Tiếng Việt cốt lõi:","• Bối cảnh \u0026 Kết quả kiểm tra PCCC: Thanh tra Cứu hỏa Raymond Vance kiểm tra an toàn Tòa nhà Beacon Heights, phát hiện 3 lỗi gồm vi phạm nghiêm trọng #F-104 (pallet của Gian 650 chắn cửa thoát hiểm tầng 6, phải sửa trong 7 ngày), đèn EXIT nhà xe hỏng pin và bình chữa cháy nồi hơi hết hạn tem.","• Kế hoạch khắc phục của Ban quản lý: Giám đốc Melissa Huang điều động bảo dưỡng dọn sạch toàn bộ pallet xuống kho hầm trong ngày (đạt lại độ rộng thông thủy 1,12m), thuê thợ điện thay đèn EXIT pin lithium 10 năm vào ngày 12/9 và hoàn tất dán tem kiểm định bình chữa cháy.","• Tái kiểm tra \u0026 Cấp lại Giấy phép Hoạt động: Tòa nhà tổ chức diễn tập nội bộ ngày 21/9 trước khi đón đoàn thanh tra cứu hỏa thành phố tái kiểm tra hiện trường lúc 10h00 sáng ngày 22/9 nhằm gia hạn Giấy chứng nhận Đủ điều kiện Hoạt động (Certificate of Occupancy).","PHẦN 2: ACTIVE RECALL 5 GIÂY (BẢNG MA TRẬN ĐỊNH VỊ SONG NGỮ)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["1. Đối tượng \u0026 Vai trò: Đại úy Raymond Vance (Thanh tra Cứu hỏa Trưởng Đô thị - Cơ quan Quản lý Nhà nước) thanh tra an toàn và Melissa Huang (Giám đốc Bất động sản Cấp cao Tòa nhà Beacon Heights - Bên Vận hành chịu trách nhiệm khắc phục).","1. Characters \u0026 Roles: Captain Raymond Vance (Municipal Lead Fire Marshal - Regulatory Enforcement) audits life-safety compliance, and Melissa Huang (Senior Director of Property Operations - Building Operator) coordinates remediation."]],[["2. Boi canh \u0026 Quy trinh loi"],["2. Bối cảnh \u0026 Quy trình lõi: Quản trị tuân thủ quy chuẩn phòng cháy chữa cháy tòa nhà thương mại (Commercial Fire Life-Safety Compliance \u0026 Certificate of Occupancy). Khi nhận biên bản vi phạm có nguy cơ bị đình chỉ hoạt động (Stop-Work Order), ban quản lý phải kích hoạt quy trình ứng phó 7 ngày: Giải phóng hành lang thoát hiểm 44 inch, thay thế thiết bị điện khẩn cấp và hoàn thiện hồ sơ tái thẩm định.","2. Context \u0026 Core Workflow: Commercial high-rise fire life-safety regulatory compliance. Receiving citations that jeopardize the Master Certificate of Occupancy triggers a rapid 7-day remediation workflow: clearing 44-inch egress pathways, replacing backup lighting, and scheduling municipal re-inspections."]],[["3. Dau vet suy luan cheo"],["3. Dấu vết suy luận chéo: Ghép nối thời hạn chót 7 ngày (15/9) cho lỗi vi phạm #F-104 ở Văn bản 1 với hành động giải phóng mặt bằng ngay trong ngày 11/9 của bà Huang ở Văn bản 2. Khẳng định ngày tái kiểm tra 22/9 giữa hai văn bản để giải câu hỏi mốc thời gian.","3. Cross-Referencing Clues: Correlating the 7-day statutory deadline (Sept 15) for critical violation #F-104 in Passage 1 with Ms. Huang\u0027s prompt remediation on Sept 11 in Passage 2. Confirming the Sept 22 municipal re-inspection date referenced across both documents."]]],"t":"table"},"PHẦN 3: ĐÁP ÁN CHUẨN XÁC \u0026 DẤU VẾT TRUY XUẤT CHÉO (CROSS-REFERENCING \u0026 COMPREHENSIVE TRAP BREAKDOWN)","What was the primary purpose of the inspection conducted on September 8?","Dap an dung: (B) To verify compliance with commercial fire and life-safety regulations","[Dau vet bai doc / Clue]: Inspection Report, Tiêu đề: \u0027Annual Commercial Life-Safety Compliance Inspection Report\u0027 \u0026 Đoạn 1: \u0027An annual mandated life-safety audit was conducted across all common areas, mechanical risers, and tenant suites...\u0027","[Dien dat tuong duong / Paraphrase]: annual mandated life-safety audit \u003c=\u003e verify compliance with commercial fire and life-safety regulations","[Loi giai chi tiet]: Mục đích của cuộc thanh tra ngày 8/9 là thực hiện đợt kiểm toán an toàn bắt buộc hàng năm theo luật định nhằm kiểm tra và xác nhận việc tuân thủ các quy định phòng cháy chữa cháy và an toàn tính mạng trong tòa nhà thương mại.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) To evaluate the building\u0027s energy efficiency for tax credits","- Ly do sai: Đây là thanh tra an toàn PCCC của cơ quan cứu hỏa, không phải kiểm toán hiệu quả năng lượng hay thuế.","- Bay ETS: Bẫy Kiểm toán Năng lượng / Môi trường (Green Energy Trap)","(C) To appraise the market value of the property for a commercial mortgage","- Ly do sai: Không có hoạt động thẩm định giá trị tài sản để vay thế chấp ngân hàng.","- Bay ETS: Bẫy Thẩm định Tài chính (Appraisal Distractor Trap)","(D) To measure interior office noise levels during rush hour","- Ly do sai: Đoàn thanh tra kiểm tra hệ thống báo cháy, đầu phun sprinkler và lối thoát hiểm chứ không đo tiếng ồn.","- Bay ETS: Bẫy Đo đạc Tiếng ồn Lạc đề (Noise Level Trap)","Which violation was classified as a critical hazard requiring correction within seven days?","Dap an dung: (C) Blockage of an emergency egress exit door on the sixth floor","[Dau vet bai doc / Clue]: Inspection Report, Mục 1: \u00271. Violation Code #F-104 (Critical Hazard): The secondary emergency egress exit door on the 6th-floor east corridor was obstructed by surplus modular office furniture and wooden shipping pallets stored by Suite 650.\u0027","[Dien dat tuong duong / Paraphrase]: emergency egress exit door on 6th floor obstructed \u003c=\u003e Blockage of an emergency egress exit door on the sixth floor","[Loi giai chi tiet]: Báo cáo nêu rõ Vi phạm #F-104 được xếp loại là Nguy cơ Nghiêm trọng (Critical Hazard): Cửa thoát hiểm khẩn cấp ở hành lang phía đông tầng 6 bị cản trở bởi bàn ghế và pallet gỗ của Gian 650.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Expired inspection tags on basement fire extinguishers","- Ly do sai: Lỗi bình chữa cháy ở phòng nồi hơi (#F-305) chỉ là thông báo hành chính (Administrative Notice).","- Bay ETS: Bẫy Lỗi Hành chính Thứ cấp (Administrative Severity Trap)","(B) Dim lighting inside the primary passenger elevator cabs","- Ly do sai: Không có lỗi nào liên quan đến đèn chiếu sáng trong thang máy; lỗi đèn là ở biển EXIT nhà để xe tầng 3 (#F-218).","- Bay ETS: Bẫy Lỗi Tự biên Chi tiết (Fabricated Lighting Defect)","(D) Low water pressure in the rooftop central sprinkler tanks","- Ly do sai: Hệ thống đầu phun nước tự động sprinkler được chứng nhận hoạt động hoàn toàn bình thường (certified fully operational).","- Bay ETS: Bẫy Thiết bị Hoạt động Tốt (Functional System Trap)","How did Ms. Huang resolve the storage issue on the sixth floor?","Dap an dung: (B) By relocating the pallets and modular furniture to a subterranean storage area","[Dau vet bai doc / Clue]: E-mail, Mục 1: \u0027All palletized freight and surplus modular furniture blocking the east stairwell exit have been removed and transferred to our subterranean storage holding area.\u0027","[Dien dat tuong duong / Paraphrase]: transferred to our subterranean storage holding area \u003c=\u003e relocating the pallets and modular furniture to a subterranean storage area","[Loi giai chi tiet]: Bà Huang báo cáo rằng đội bảo trì đã dọn sạch toàn bộ hàng pallet và bàn ghế mô-đun gây cản trở lối thoát hiểm và chuyển chúng xuống khu vực kho lưu trữ dưới tầng hầm (subterranean storage area) của tòa nhà.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) By issuing an immediate eviction notice to the tenant in Suite 650","- Ly do sai: Bà Huang phối hợp xử lý trực tiếp với bộ phận vận hành của Gian 650 chứ không hề ra thông báo trục xuất khách thuê.","- Bay ETS: Bẫy Hành động Cực đoan (Extreme Eviction Trap)","(C) By constructing a permanent storage closet in the east hallway corridor","- Ly do sai: Hành lang phải giữ thông thoáng tối thiểu 44 inch, việc xây thêm tủ ở hành lang là hành vi vi phạm nghiêm trọng hơn.","- Bay ETS: Bẫy Giải pháp Ngược Quy chuẩn (Code Violation Inversion Trap)","(D) By selling the surplus office equipment at an online public auction","- Ly do sai: Tài sản của khách thuê được cất vào kho hầm chứ tòa nhà không có quyền đem bán đấu giá.","- Bay ETS: Bẫy Bán đấu giá Tài sản (Unauthorized Auction Trap)","The word \"rectify\" in the statutory remediation directive is closest in meaning to","Dap an dung: (B) correct","[Dau vet bai doc / Clue]: Directive context: \u0027Property management must rectify Violation #F-104 within seven calendar days...\u0027","[Dien dat tuong duong / Paraphrase]: rectify a violation \u003c=\u003e correct / remedy / resolve a deficiency","[Loi giai chi tiet]: Động từ \u0027rectify\u0027 khi đi kèm với vi phạm (violation, defect, hazard) có nghĩa là khắc phục, chấn chỉnh, sửa chữa lỗi sai (correct).","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) examine","- Ly do sai: \u0027Examine\u0027 là xem xét kiểm tra, việc xem xét đã xong trong đợt kiểm tra ban đầu.","- Bay ETS: Bẫy Giai đoạn Nghiệp vụ (Phase Mismatch Trap)","(C) justify","- Ly do sai: \u0027Justify\u0027 là giải thích biện minh, trong khi chỉ thị bắt buộc phải sửa lỗi.","- Bay ETS: Bẫy Biện hộ Trái ngược (Justification Distractor)","(D) prolong","- Ly do sai: \u0027Prolong\u0027 là kéo dài thời gian, trái ngược với yêu cầu xử lý khẩn cấp trong 7 ngày.","- Bay ETS: Bẫy Trái nghĩa (Opposite Meaning Trap)","What is scheduled to occur on September 22, 2026?","Dap an dung: (C) The official municipal re-inspection by the lead fire marshal","[Dau vet bai doc / Clue]: Văn bản 1, Dòng cuối: \u0027prior to the final municipal re-inspection on September 22, 2026, for renewal of the building\u0027s Master Certificate of Occupancy.\u0027 + Văn bản 2: \u0027Captain Vance will conduct the municipal re-inspection walkthrough on Tuesday, September 22, at 10:00 AM.\u0027","[Dien dat tuong duong / Paraphrase]: municipal re-inspection walkthrough conducted by Captain Vance \u003c=\u003e official municipal re-inspection by the lead fire marshal","[Loi giai chi tiet]: Cả hai văn bản đều khẳng định rõ: Ngày 22 tháng 9 năm 2026 là ngày Thanh tra Cứu hỏa trưởng (Đại úy Raymond Vance) tiến hành đợt tái kiểm tra chính thức của thành phố để gia hạn Giấy chứng nhận Đủ điều kiện Hoạt động (Certificate of Occupancy).","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) The installation of replacement lithium-polymer emergency signs","- Ly do sai: Việc thay thế biển báo khẩn cấp được lên lịch vào ngày 12 tháng 9 (ngày mai trong email).","- Bay ETS: Bẫy Ngày Lắp đặt Thiết bị (Hardware Installation Date Trap)","(B) An internal fire drill conducted by tenant floor wardens","- Ly do sai: Đợt kiểm tra thực địa nội bộ của tòa nhà diễn ra vào Thứ Hai ngày 21 tháng 9, một ngày trước đợt kiểm tra của thanh tra.","- Bay ETS: Bẫy Sự kiện Liền kề Ngày 21/9 (Adjacent Date Trap)","(D) The expiration of the existing commercial lease agreements","- Ly do sai: Không có hợp đồng thuê thương mại nào hết hạn vào ngày 22/9.","- Bay ETS: Bẫy Hết hạn Hợp đồng Lạc đề (Irrelevant Expiration Trap)","PHẦN 4: KỸ THUẬT FEYNMAN SONG NGỮ \u0026 SƠ ĐỒ QUY TRÌNH (TƯ DUY PHÂN TÍCH NGHIỆP VỤ \u0026 BA)","4.1. Sơ đồ Quy trình Luân chuyển Nghiệp vụ (Fire Safety Compliance \u0026 Recertification Workflow)","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","TIẾP NHẬN BIÊN BẢN THANH TRA \u0026 PHÂN LOẠI 3 NGUY CƠ"],[],["BƯỚC 2","ĐIỀU ĐỘNG BẢO TRÌ, THAY ĐÈN LITHIUM \u0026 GIA HẠN TEM PCCC"],[],["BƯỚC 3","DIỄN TẬP NỘI BỘ, TÁI KIỂM ĐỊNH \u0026 CẤP LẠI CERTIFICATE OF OCCUPANCY"]],[["• Chung tu \u0026 Kenh: Biên bản Thanh tra Cứu hỏa Đô thị \u0026 Cổng Quản lý Tòa nhà","• Nghiep vu thuc thi: Đoàn thanh tra phát hiện 3 lỗi vi phạm; ban quản lý phân loại mức độ khẩn cấp: Lỗi nghiêm trọng #F-104 (pallet chắn cửa thoát hiểm tầng 6 - hạn chót 7 ngày 15/9), lỗi biển EXIT hầm và tem kiểm định bình khí.","• Ket qua \u0026 Kiem soat: Xác lập mốc thời gian cảnh báo đình chỉ hoạt động và mục tiêu gia hạn Giấy phép Hoạt động."],["➔"],["• Chung tu \u0026 Kenh: Lực lượng Vận hành Tòa nhà \u0026 Nhà thầu Kỹ thuật Chuyên ngành (VoltTech / HydroSafe)","• Nghiep vu thuc thi: Dọn sạch pallet chuyển xuống kho hầm khôi phục thông thủy 44 inch; thay 2 biển EXIT pin lithium 10 năm tại bãi xe; kiểm định áp lực thủy tĩnh và dán tem mới cho cụm bình chữa cháy phòng nồi hơi.","• Ket qua \u0026 Kiem soat: 100% các hạng mục vi phạm được khắc phục triệt để trước hạn chót luật định."],["➔"],["• Chung tu \u0026 Kenh: Đội ngũ Trưởng tầng Khách thuê \u0026 Thanh tra Cứu hỏa Trưởng Raymond Vance","• Nghiep vu thuc thi: Ban quản lý tổ chức rà soát nội bộ ngày 21/9; đón Đại úy Vance kiểm tra thực địa lúc 10h00 ngày 22/9; nghiệm thu biên bản không còn lỗi vi phạm và cấp mới Giấy phép Đủ điều kiện Hoạt động.","• Ket qua \u0026 Kiem soat: Tòa nhà duy trì tính hợp pháp toàn diện, triệt tiêu rủi ro an toàn và bồi thường bảo hiểm."]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["STEP 1","INSPECTION AUDIT INGESTION \u0026 RISK TRIAGE"],[],["STEP 2","EGRESS REMEDIATION, LITHIUM SIGNING \u0026 RE-TAGGING"],[],["STEP 3","INTERNAL DRILL, RE-INSPECTION \u0026 OCCUPANCY RECERTIFICATION"]],[["• Documents \u0026 Channels: Municipal Life-Safety Report \u0026 Commercial Property Operations Desk","• Core Business Execution: Fire marshals identify 3 infractions; management triages urgency: Critical 7-day citation #F-104 (6th-floor egress blocked by freight - deadline Sept 15), garage battery signs, and boiler suppression tags.","• Key Deliverable \u0026 Control: Remediation critical path established protecting the Master Certificate of Occupancy."],["➔"],["• Documents \u0026 Channels: Building Maintenance Division \u0026 Certified Contractors (VoltTech / HydroSafe)","• Core Business Execution: Clear pallets to subterranean storage restoring 44-inch clearance; install 10-year lithium emergency EXIT signage; conduct hydrostatic recertification on basement chemical cylinders.","• Key Deliverable \u0026 Control: All physical and administrative citations rectified ahead of statutory deadlines."],["➔"],["• Documents \u0026 Channels: Tenant Floor Warden Network \u0026 Municipal Fire Marshal Raymond Vance","• Core Business Execution: Conduct preparatory walkthrough Sept 21; host Captain Vance for municipal audit at 10:00 AM on Sept 22; secure clean compliance sign-off and renewed Certificate of Occupancy.","• Key Deliverable \u0026 Control: Full statutory operating compliance verified, neutralizing casualty liability risks."]]],"t":"table"},"4.2. Tư duy Phân tích Nghiệp vụ \u0026 BA (Bản Tiếng Việt)","• Bức tranh Toàn cảnh Nghiệp vụ (End-to-End Flow): Trong vận hành bất động sản thương mại cao tầng (Commercial High-Rise Asset Operations), việc duy trì Giấy chứng nhận Đủ điều kiện Hoạt động (Certificate of Occupancy - CO) là điều kiện sống còn để tòa nhà được phép mở cửa kinh doanh hợp pháp. Chu trình quản trị PCCC kết nối 4 bên: Cục Cảnh sát PCCC đô thị (Municipal Fire Bureau) - Ban quản trị vận hành tòa nhà (Facility Management) - Khách thuê thương mại (Commercial Tenants) - Các nhà thầu cơ điện PCCC chuyên trách (Life-Safety Vendors). Luồng nghiệp vụ từ: Thanh tra đột xuất/định kỳ -\u003e Phân loại lỗi vi phạm theo ma trận rủi ro -\u003e Xử lý cấp tốc trong 7 ngày -\u003e Kiểm tra chéo nội bộ -\u003e Tái thẩm định thực địa và cấp đổi CO.","• Điểm nghẽn \u0026 Rủi ro Vận hành Thực tế (Core Bottleneck \u0026 Risk): Nút thắt nguy hiểm nhất là \u0027Thói quen lấn chiếm hành lang thoát hiểm làm kho chứa hàng tạm\u0027 (Egress Corridor Encroachment). Khách thuê (Suite 650) nhận các kiện hàng lớn hoặc thừa bàn ghế văn phòng đã tự ý xếp ra hành lang thoát hiểm; trong tình huống xảy ra hỏa hoạn có khói đen đặc, các kiện hàng này biến thành chướng ngại vật chết người làm nghẽn dòng người tháo chạy, dẫn đến ngạt khí và thảm họa thương vong. Về mặt pháp lý, nếu không xử lý trong 7 ngày, cơ quan chức năng sẽ ban hành Lệnh đình chỉ hoạt động (Stop-Work Citation / Closure Order), làm tê liệt toàn bộ hoạt động của hàng chục doanh nghiệp trong tòa tháp.","• 3 Giải pháp Thiết kế Hệ thống \u0026 Kiểm soát Nghiệp vụ (BA \u0026 Commercial Fire Safety Architecture):","(1) Hệ thống Camera AI Giám sát Lối thoát hiểm Tự động (AI-Powered Egress Corridor Surveillance): Tích hợp thuật toán thị giác máy tính vào hệ thống camera CCTV hành lang: Nếu phát hiện bất kỳ vật thể tĩnh (thùng hàng, pallet, bàn ghế) chắn ngang lối thoát hiểm quá 30 phút hoặc làm hẹp khoảng trống dưới 44 inch (1,12m), hệ thống tự động gửi cảnh báo khẩn cấp tới ứng dụng di động của bảo vệ tòa nhà để đến nhắc nhở xử lý ngay lập tức.","(2) Quy chuẩn Quản lý Khu vực Chứa Hàng Tầng Hầm Linh hoạt (Subterranean Temporary Overflow Staging Protocol): Ban quản lý quy hoạch một phân khu riêng biệt tại tầng hầm có kiểm soát PCCC (Sprinkler mật độ cao) để làm kho đệm tạm thời; cho phép khách thuê gửi các kiện hàng cồng kềnh trong thời gian tối đa 48 giờ miễn phí khi đang lắp đặt văn phòng, triệt tiêu hoàn toàn động cơ để hàng ngoài hành lang.","(3) Mạng lưới Đội trưởng PCCC Từng Tầng và Diễn tập 2 Bước (Two-Tier Fire Warden Preparatory Audit): Thiết lập cơ chế phân quyền an toàn: Mỗi công ty thuê mặt bằng bắt buộc phải đăng ký 2 nhân sự làm Đội trưởng PCCC (Floor Warden). Trước khi đón đoàn thanh tra thành phố 24 giờ, ban quản lý cùng các Floor Warden đi kiểm tra chéo (Cross-floor audit) để rà soát từng cửa thoát hiểm và từng bình cứu hỏa, bảo đảm tỷ lệ đỗ tái kiểm định đạt 100%.","• Tam giác Liên kết Nhận thức Đa chiều (Multi-Perspective Contextual Anchoring):","- Lăng kính Viễn thông / CNTT Viettel: Bài toán an toàn PCCC và hệ thống chữa cháy khí sạch FM-200 / Novec 1230 tại Trung tâm Dữ liệu Viettel. Tại các phòng máy chủ viễn thông chứa thiết bị mạng đắt tiền, việc dùng nước chữa cháy sẽ làm hỏng toàn bộ linh kiện điện tử; do đó Viettel trang bị hệ thống chữa cháy bằng khí sạch tự động ngắt điện và xả khí dập lửa trong 30 giây khi có khói, đồng thời quy định nghiêm ngặt không được để bất kỳ thùng carton hay vỏ bọc nhựa dễ cháy trong phòng server.","- Lăng kính Quản trị Mầm non Ước Mơ Xanh: Khi trường mầm non đón đoàn kiểm tra liên ngành PCCC quận/huyện, cô Thu Huyền trực tiếp rà soát từng chi tiết an toàn nhỏ nhất: Lối thoát hiểm phụ xuống sân trường phải luôn thông thoáng, tuyệt đối không để xe đẩy hay giá để giày dép của các con chắn cửa; toàn bộ bình chữa cháy bột mini phải còn nguyên tem kẹp chì và bảng nội quy tiêu lệnh PCCC phải được treo ở độ cao phù hợp, dễ quan sát.","- Lăng kính Bàn học Gia đình (Kèm cặp Bé Hà Ngân Lớp 5): Bài học về \u0027Ý thức an toàn và kỹ năng thoát hiểm khi có hỏa hoạn\u0027: Bố hướng dẫn Hà Ngân các kỹ năng sống quan trọng: Khi ở chung cư hoặc trung tâm thương mại, con luôn phải để ý biển báo EXIT màu xanh phát sáng dẫn ra cầu thang bộ thoát hiểm; nếu ngửi thấy mùi khói hoặc nghe còi báo động, tuyệt đối không được đi thang máy mà phải đi thang bộ thoát hiểm, dùng khăn ướt bịt mũi và đi khom lưng men theo chân tường để ra ngoài an toàn.","4.3. Business Analyst Executive Summary (Bản Tiếng Anh)","• End-to-End Business \u0026 Facility Context: In institutional commercial real estate management, statutory fire life-safety compliance governs asset operating legality and uninsurable liability exposure. The operational lifecycle spans municipal regulatory audits, critical-versus-administrative infraction triage, rapid physical remediation within statutory curing windows (7 days), and final municipal walkthroughs for Master Certificate of Occupancy recertification.","• Core Operational Bottleneck \u0026 Risk: The primary operational vulnerability is tenant corridor encroachment violating NFPA/municipal minimum egress clearance thresholds (44 inches). Storing wooden pallets and modular furnishings across fire stairwell egress pathways severely impedes rapid mass evacuation during emergency events. Failure to remediate within 7 days triggers municipal stop-work injunctions, halting commercial operations for the entire asset.","• Key BA \u0026 System Architecture Solutions:","(1) Computer-Vision Egress Obstruction Telemetry: Integrate AI video analytics on corridor CCTV arrays, automatically alerting facility dispatch if stationary freight obstructs minimum 44-inch egress clearance for over 30 minutes.","(2) Subterranean Logistics Staging Allocations: Designate managed subterranean holding zones to absorb tenant fit-out deliveries and surplus modular assets, systematically eliminating operational incentives for corridor staging.","(3) Two-Tier Pre-Inspection Audit Governance: Mandate an internal preparatory audit pairing property operations with tenant floor wardens 24 hours prior to municipal re-inspections, verifying unlocked egress points and zero combustible accumulation to guarantee 100% first-pass regulatory compliance.","PHẦN 5: TỪ VỰNG \u0026 PARAPHRASE CHUYÊN SÂU (CHUẨN 3 DÒNG TỐI ƯU NẠP ANKI)","Certificate of Occupancy  /sərˈtɪfɪkət əv ˈɑːkjəpənsi/  Occupancy Permit / Building Use Authorization / Statutory Operating License","Nghia: Giấy chứng nhận đủ điều kiện hoạt động, giấy phép do cơ quan quản lý đô thị cấp chứng nhận tòa nhà an toàn để đưa vào sử dụng.","Vd: The property passed all life-safety inspections to secure the renewal of its Certificate of Occupancy. - Bất động sản đã vượt qua toàn bộ các đợt kiểm tra an toàn tính mạng để được gia hạn Giấy chứng nhận Đủ điều kiện Hoạt động.","Egress  /ˈiːɡrɛs/  Emergency Exit Route / Evacuation Pathway / Way Out / Escape Corridor","Nghia: Lối thoát hiểm khẩn cấp, tuyến đường thoát nạn được chỉ định khi xảy ra sự cố cháy nổ.","Vd: Municipal building codes mandate an unobstructed emergency egress width of at least 44 inches. - Quy chuẩn xây dựng đô thị bắt buộc chiều rộng lối thoát hiểm khẩn cấp không có vật cản phải đạt ít nhất 44 inch.","Obstruct  /əbˈstrʌkt/  Block / Hinder / Impede / Barricade Egress Passages","Nghia: Làm tắc nghẽn, gây cản trở hoặc chắn ngang lối đi lại thoát hiểm.","Vd: Pallets and modular furniture were strictly prohibited from obstructing the secondary fire exit. - Các pallet hàng và đồ nội thất mô-đun bị nghiêm cấm việc cản trở lối thoát hiểm hỏa hoạn phụ.","Rectify  /ˈrɛktɪfaɪ/  Correct / Resolve / Remedy / Eliminate Deficiencies","Nghia: Sửa chữa, khắc phục, chấn chỉnh lỗi sai hoặc khắc phục tình trạng vi phạm quy chuẩn.","Vd: Property management took prompt action to rectify the fire safety violation within seven days. - Ban quản lý tòa nhà đã hành động nhanh chóng để khắc phục lỗi vi phạm an toàn PCCC trong vòng bảy ngày.","Remediation  /rɪˌmiːdiˈeɪʃn/  Corrective Action / Resolution Plan / Remedial Protocol / Hazard Elimination","Nghia: Biện pháp khắc phục, kế hoạch hành động chấn chỉnh nhằm đưa hệ thống trở lại trạng thái đạt chuẩn.","Vd: The director submitted a formal remediation plan detailing how all fire code infractions were resolved. - Giám đốc đã gửi một kế hoạch khắc phục chính thức nêu chi tiết cách thức giải quyết toàn bộ các lỗi vi phạm PCCC.","Walkthrough  /ˈwɔːkθruː/  Physical On-Site Tour / Step-by-Step Inspection / Visual Facility Audit","Nghia: Chuyến kiểm tra thực địa, đi bộ thị sát trực tiếp từng bước tại hiện trường công trình.","Vd: The lead fire marshal conducted a comprehensive walkthrough of all common corridors and mechanical rooms. - Thanh tra cứu hỏa trưởng đã tiến hành một chuyến thị sát thực địa toàn diện qua toàn bộ các hành lang chung và phòng máy.","==================================================================================================","BÀI 9: Kế hoạch Di dời Văn phòng Trụ sở, Mặt bằng Mở \u0026 Bàn giao Hoàn trả Hiện trạng (Questions 186-190 - Triple Passage)","Nguồn: ETS TOEIC Part 7 — Triple Passage (Corporate Relocation Memorandum, Moving Logistics Schedule \u0026 Handover Inspection Notice, Questions 186-190)","PHẦN 1: NỘI DUNG VĂN BẢN ĐỌC HIỂU \u0026 DỊCH THUẬT","1.1. Đề thi Tiếng Anh gốc (Strategy Guide \u0026 Original ETS Passages)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","Corporate Relocation Memorandum","Nexus Interactive Media Group — Executive Facilities Committee","To: All Headquarters Personnel | Date: October 12, 2026","Subject: Phased Transition Schedule: Relocation to Horizon Center","Team Nexus,","After eight successful years at Parkview Commercial Plaza (Floors 9 and 10), Nexus Interactive will officially relocate our global corporate headquarters to Horizon Center (Floors 28 through 30) over the weekend of November 13-15, 2026.","Key Relocation Milestones \u0026 Protocols:","- Workstation Crating Deadline: All staff must pack personal belongings and non-essential paperwork into assigned barcoded plastic crates by 05:00 PM on Thursday, November 12. Heavy computer monitors, docking stations, and ergonomic chairs will be tagged and transported by MetroFleet Commercial Movers.","- Data Center Migration: To ensure zero interruption to our cloud media streaming servers, our enterprise IT infrastructure will be decommissioned and transported in climate-controlled, air-ride vans during the overnight window between 11:00 PM Friday, November 13, and 06:00 AM Saturday, November 14.","- Remote Work Bridge: All employees will work remotely on Friday, November 13, and Monday, November 16, while our facilities crew completes workstation network drops and ergonomic adjustments.","- First Day in New Office: Tuesday, November 17, at 08:30 AM, featuring a welcome breakfast in the 28th-floor central atrium.","Commercial Move Logistics Schedule","MetroFleet Logistics \u0026 Relocation Services LLC — Project Plan #MF-8820","Client: Nexus Interactive Media Group | Origin: Parkview Plaza | Destination: Horizon Center","Project Manager: Carlos Mendez | Operations Lead: Damian Cross","Operational Phasing Summary:","- Phase 1 (Friday, Nov 13, 06:00 PM - 11:00 PM): Freight elevator padding and loading dock staging at Parkview Plaza. Removal of 450 numbered employee crates and executive boardroom furnishings.","- Phase 2 (Friday, Nov 13, 11:00 PM - Saturday, Nov 14, 06:00 AM): Dedicated high-security transport of 12 server racks and core fiber switches using specialized dual-suspension refrigerated transport vehicles. Direct delivery to Horizon Center 30th-floor data center.","- Phase 3 (Saturday, Nov 14, 08:00 AM - 08:00 PM): Delivery and placement of modular cubicles, monitors, and ergonomic task seating at Horizon Center.","- Phase 4 (Sunday, Nov 15, 09:00 AM - 04:00 PM): Decommissioning sweep at Parkview Plaza, including electronic recycling pickup and removal of all protective floor masonite runners.","Total Move Dedicated Personnel: 34 certified commercial movers, 4 logistics coordinators, 6 IT disconnect/reconnect technicians.","Premises Handover Inspection \u0026 Security Deposit Settlement Notice","Parkview Plaza Asset Management LLC","To: Gregory Vance, Chief Operating Officer | Nexus Interactive Media Group","Date: November 24, 2026","Subject: End-of-Lease Surrender Inspection: Suites 900 \u0026 1000","Dear Mr. Vance,","Parkview Plaza Asset Management conducted the formal lease surrender walkthrough of Floors 9 and 10 on November 20 with your facility manager, Ms. Elena Rostova.","We confirm that Nexus Interactive has satisfied the fundamental restoration requirements under Section 24 (Surrender of Premises), including the removal of specialized demising partitions and unapproved cabling risers. We commend your team on an orderly transition.","Final Security Deposit Reconciliation:","- Initial Security Deposit on File: $180,000.00","- Deductions for Discretionary Restoration:","1. Drywall Patching \u0026 Paint Touch-up (remedying wall-mounted monitor bracket damage across 14 conference rooms): $3,400.00","2. Industrial Hot-Water Steam Carpet Cleaning (removing coffee and toner stains in central corridors): $2,100.00","Total Allowable Deductions: $5,500.00","- Net Refundable Security Deposit: $174,500.00","A direct electronic wire transfer of $174,500.00 has been initiated today to your corporate treasury account at First Mercantile Commercial Bank (Wire Ref: #WTR-99021). This settlement formally terminates all ongoing liabilities under Lease Agreement #PKV-2018-44.","Sincerely,","Harold Sterling","Senior Property Director, Commercial Real Estate","Parkview Plaza Asset Management","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","186 What is the primary purpose of the memorandum sent by Nexus Interactive?","(A) To announce the opening of a new international branch in London","(B) To outline the schedule and instructions for a corporate headquarters relocation","(C) To solicit bids from commercial office moving contractors","(D) To inform employees about mandatory salary reductions","187 According to the logistics schedule, when will the company\u0027s servers be transported?","(A) Thursday afternoon before 05:00 PM","(B) Friday evening between 06:00 PM and 11:00 PM","(C) Overnight between Friday night and Saturday morning","(D) Sunday afternoon between 09:00 AM and 04:00 PM","188 How much money will be deducted from Nexus Interactive\u0027s security deposit?","(A) $2,100.00","(B) $3,400.00","(C) $5,500.00","(D) $174,500.00","189 The word \"surrender\" in paragraph 1 of the settlement notice is closest in meaning to","(A) relinquishment","(B) expansion","(C) construction","(D) destruction","190 What is indicated about Nexus Interactive employees in the memorandum?","(A) They will work remotely on Friday, November 13, and Monday, November 16.","(B) They must physically carry their computer monitors to the new building.","(C) They are required to unpack all server racks on Sunday, November 15.","(D) They must report to Horizon Center on Saturday morning for network testing.","1.2. Hướng dẫn làm bài Part 7: Chiến lược 5 phút tối ưu","CHIẾN THUẬT 5 PHÚT TỐI ƯU: NẮM BẮT BỐI CẢNH, GHÉP NỐI DỮ KIỆN \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Luồng quy trình Đoạn ba (Quỹ đạo Quét chữ Z \u0026 Bộ lọc 3 Câu hỏi Tiềm thức): • Quỹ đạo hình chữ Z (Z-Pattern Eye Scan) qua 3 văn bản:","- Văn bản 1 (Relocation Memo): Điểm chạm 1: \u0027Corporate Relocation Memo — Move to Horizon Center\u0027 (Q1: Thông báo chuyển trụ sở chính công ty). Điểm chạm 2: \u0027Floors 9-10 to Floors 28-30 | Weekend Nov 13-15\u0027 (Q2: Chuyển toàn bộ 2 tầng văn phòng vào cuối tuần 13-15/11). Điểm chạm 3: \u0027Remote work Nov 13 \u0026 16 | First day Nov 17\u0027 (Q3: Nhân viên làm từ xa thứ Sáu và thứ Hai, ngày làm việc đầu tiên là thứ Ba 17/11).","- Văn bản 2 (Move Logistics Schedule): Điểm chạm 1: \u0027MetroFleet Logistics — Project Plan #MF-8820\u0027 (Q1: Kế hoạch vận chuyển của công ty dọn nhà chuyên nghiệp). Điểm chạm 2: \u0027Phase 1: Crates (Fri 6-11 PM) | Phase 2: Servers (Fri 11 PM - Sat 6 AM)\u0027 (Q2: 4 giai đoạn dọn dẹp, riêng server chuyển ban đêm bằng xe chuyên dụng). Điểm chạm 3: \u0027Phase 4: Decommission sweep at Parkview Plaza\u0027 (Q3: Dọn dẹp trả lại mặt bằng cũ).","- Văn bản 3 (Handover Inspection \u0026 Deposit Notice): Điểm chạm 1: \u0027End-of-Lease Surrender Inspection \u0026 Deposit Settlement\u0027 (Q1: Biên bản nghiệm thu bàn giao trả mặt bằng và quyết toán tiền cọc). Điểm chạm 2: \u0027Deposit: $180,000 | Deductions: Drywall ($3,400) + Carpet ($2,100) = $5,500\u0027 (Q2: Trừ 5.500 USD tiền vá tường và giặt thảm). Điểm chạm 3: \u0027Net Refund $174,500 wired to First Mercantile\u0027 (Q3: Hoàn trả 174.500 USD qua ngân hàng, khép lại hợp đồng thuê cũ).","• Xâu chuỗi quy trình: Kế hoạch di dời trụ sở (Văn bản 1) -\u003e Lịch trình chuyển máy móc và server ban đêm của nhà xe chuyên nghiệp (Văn bản 2) -\u003e Nghiệm thu hoàn trả hiện trạng văn phòng cũ và chuyển trả 174.500 USD tiền cọc sau khi trừ chi phí sơn sửa (Văn bản 3).","Bước 2 (20 giây) - Quét nhanh 5 câu hỏi \u0026 Gắn móc từ khóa (Mental Hooks - KHÔNG đọc đáp án): • Q186: \u0027primary purpose of memorandum sent by Nexus Interactive\u0027 -\u003e Móc: Mục đích bản ghi nhớ nội bộ (Văn bản 1).","• Q187: \u0027According to logistics schedule, when will company servers be transported\u0027 -\u003e Móc: Khung giờ vận chuyển máy chủ server (Văn bản 2).","• Q188: \u0027How much money deducted from security deposit\u0027 -\u003e Móc: Số tiền bị trừ vào tiền cọc (Văn bản 3).","• Q189: \u0027word \"surrender\" in paragraph 1 is closest in meaning to\u0027 -\u003e Móc: Từ vựng chuyên ngành \u0027surrender\u0027 (Văn bản 3).","• Q190: \u0027What is indicated about Nexus Interactive employees\u0027 -\u003e Móc: Quy định đối với nhân viên công ty (Văn bản 1).","Bước 3 (3 phút 45 giây) - Cách trả lời \u0026 Dấu hiệu tìm nhanh nhất cho đủ 5 câu hỏi: • Q186 (Mục đích - 20s): [Dấu hiệu nhanh]: Đọc dòng Subject và đoạn 1 của Văn bản 1: \u0027Phased Transition Schedule: Relocation to Horizon Center... officially relocate our global corporate headquarters... over the weekend of November 13-15\u0027 -\u003e Vạch ra lịch trình và hướng dẫn chi tiết cho đợt di dời trụ sở công ty -\u003e Chọn (B).","• Q187 (Chi tiết - 25s): [Dấu hiệu nhanh]: Đọc Phase 2 ở Văn bản 2: \u0027Phase 2 (Friday, Nov 13, 11:00 PM - Saturday, Nov 14, 06:00 AM): Dedicated high-security transport of 12 server racks and core fiber switches...\u0027 -\u003e Vận chuyển xuyên đêm giữa đêm thứ Sáu và sáng thứ Bảy -\u003e Chọn (C).","• Q188 (Chi tiết số liệu - 25s): [Dấu hiệu nhanh]: Nhìn vào bảng kê Deductions ở Văn bản 3: \u00271. Drywall Patching: $3,400.00; 2. Carpet Cleaning: $2,100.00; Total Allowable Deductions: $5,500.00\u0027 -\u003e Bị trừ 5.500,00 USD -\u003e Chọn (C).","• Q189 (Từ vựng ngữ cảnh - 20s): [Dấu hiệu nhanh]: \u0027Lease surrender walkthrough\u0027 trong hợp đồng thuê bất động sản thương mại là việc bàn giao trả lại mặt bằng thuê cho chủ nhà khi hết hợp đồng (relinquishment / handover / return of premises) -\u003e Chọn (A).","• Q190 (Chi tiết - 30s): [Dấu hiệu nhanh]: Đọc gạch đầu dòng \u0027Remote Work Bridge\u0027 ở Văn bản 1: \u0027All employees will work remotely on Friday, November 13, and Monday, November 16...\u0027 -\u003e Nhân viên sẽ làm việc từ xa vào thứ Sáu 13/11 và thứ Hai 16/11 -\u003e Chọn (A).","Bước 4 (25 giây cuối + Đúc kết Feynman): • Khóa sổ 5 đáp án: 186-B, 187-C, 188-C, 189-A, 190-A.","• Tóm tắt Feynman 1 câu: \u0027Tập đoàn truyền thông Nexus chuyển toàn bộ trụ sở 2 tầng sang tòa tháp mới vào cuối tuần, cho toàn bộ nhân viên làm việc từ xa 2 ngày trong khi điều xe lạnh chuyên dụng chở server trong đêm, và được chủ tòa nhà cũ hoàn trả 174.500 USD tiền cọc sau khi trừ 5.500 USD tiền vá tường và giặt thảm hành lang.\u0027","1.3. Dịch Song ngữ Xen kẽ Từng Câu (Sentence-by-Sentence Translation)","Corporate Relocation Memorandum (Bản Ghi nhớ Chuyển Trụ sở Doanh nghiệp)","Nexus Interactive Media Group — Executive Facilities Committee","To: All Headquarters Personnel | Date: October 12, 2026","Subject: Phased Transition Schedule: Relocation to Horizon Center","Tập đoàn Truyền thông Tương tác Nexus — Ủy ban Cơ sở Vật chất Điều hành","Người nhận: Toàn thể Nhân sự Trụ sở | Ngày: 12 tháng 10, 2026","Tiêu đề: Lịch trình Chuyển giao Phân kỳ: Di dời sang Tòa nhà Trung tâm Horizon","Team Nexus, after eight successful years at Parkview Commercial Plaza (Floors 9 and 10), Nexus Interactive will officially relocate our global corporate headquarters to Horizon Center (Floors 28 through 30) over the weekend of November 13-15, 2026.","Thân gửi Đội ngũ Nexus, sau tám năm hoạt động thành công tại Khu phức hợp Thương mại Parkview Plaza (Tầng 9 và 10), Nexus Interactive sẽ chính thức di dời trụ sở doanh nghiệp toàn cầu của chúng ta sang Trung tâm Horizon (Tầng 28 đến 30) trong kỳ nghỉ cuối tuần từ ngày 13 đến 15 tháng 11 năm 2026.","Key Relocation Milestones \u0026 Protocols: Workstation Crating Deadline: All staff must pack personal belongings and non-essential paperwork into assigned barcoded plastic crates by 05:00 PM on Thursday, November 12.","Các Mốc Thời gian Then chốt \u0026 Quy chuẩn Di dời: Hạn chót Đóng thùng Bàn làm việc: Toàn thể nhân viên phải đóng gói đồ dùng cá nhân và hồ sơ giấy tờ không thiết yếu vào các thùng nhựa có mã vạch được phân bổ trước 05:00 chiều Thứ Năm, ngày 12 tháng 11.","Heavy computer monitors, docking stations, and ergonomic chairs will be tagged and transported by MetroFleet Commercial Movers.","Màn hình máy tính cỡ lớn, đế cắm chuyển đổi và ghế công thái học sẽ được gắn thẻ định danh và vận chuyển bởi Công ty Dọn nhà Thương mại MetroFleet.","Data Center Migration: To ensure zero interruption to our cloud media streaming servers, our enterprise IT infrastructure will be decommissioned and transported in climate-controlled, air-ride vans during the overnight window between 11:00 PM Friday, November 13, and 06:00 AM Saturday, November 14.","Di chuyển Trung tâm Dữ liệu: Nhằm bảo đảm không xảy ra gián đoạn đối với các máy chủ phát trực tuyến đa phương tiện đám mây, hạ tầng CNTT doanh nghiệp của chúng ta sẽ được ngắt nguồn và vận chuyển bằng các xe tải chuyên dụng có giảm chấn bóng hơi và kiểm soát nhiệt độ trong khung giờ xuyên đêm từ 11:00 đêm Thứ Sáu, ngày 13 tháng 11 đến 06:00 sáng Thứ Bảy, ngày 14 tháng 11.","Remote Work Bridge: All employees will work remotely on Friday, November 13, and Monday, November 16, while our facilities crew completes workstation network drops and ergonomic adjustments.","Cầu nối Làm việc Từ xa: Toàn bộ nhân viên sẽ làm việc từ xa vào Thứ Sáu, ngày 13 tháng 11 và Thứ Hai, ngày 16 tháng 11, trong khi đội cơ sở vật chất hoàn tất việc đấu nối cổng mạng bàn làm việc và căn chỉnh công thái học.","First Day in New Office: Tuesday, November 17, at 08:30 AM, featuring a welcome breakfast in the 28th-floor central atrium.","Ngày Đầu tiên tại Văn phòng Mới: Thứ Ba, ngày 17 tháng 11, lúc 08:30 sáng, với tiệc điểm tâm chào mừng tại sảnh thông tầng trung tâm tầng 28.","Commercial Move Logistics Schedule (Lịch trình Hậu cần Vận chuyển Thương mại)","MetroFleet Logistics \u0026 Relocation Services LLC — Project Plan #MF-8820","Client: Nexus Interactive Media Group | Origin: Parkview Plaza | Destination: Horizon Center","Project Manager: Carlos Mendez | Operations Lead: Damian Cross","Công ty TNHH Dịch vụ Hậu cần \u0026 Di dời MetroFleet — Kế hoạch Dự án #MF-8820","Khách hàng: Tập đoàn Truyền thông Nexus | Điểm đi: Parkview Plaza | Điểm đến: Horizon Center","Giám đốc Dự án: Carlos Mendez | Trưởng ca Vận hành: Damian Cross","Operational Phasing Summary: Phase 1 (Friday, Nov 13, 06:00 PM - 11:00 PM): Freight elevator padding and loading dock staging at Parkview Plaza.","Tóm tắt Phân kỳ Vận hành: Giai đoạn 1 (Thứ Sáu, 13/11, 06:00 tối - 11:00 đêm): Bọc đệm thang máy chở hàng và tập kết tại bến bốc dỡ Parkview Plaza.","Removal of 450 numbered employee crates and executive boardroom furnishings.","Vận chuyển 450 thùng đồ nhân viên có đánh số và đồ nội thất phòng họp điều hành.","Phase 2 (Friday, Nov 13, 11:00 PM - Saturday, Nov 14, 06:00 AM): Dedicated high-security transport of 12 server racks and core fiber switches using specialized dual-suspension refrigerated transport vehicles.","Giai đoạn 2 (Thứ Sáu, 13/11, 11:00 đêm - Thứ Bảy, 14/11, 06:00 sáng): Vận chuyển an ninh cao chuyên dụng cho 12 tủ rack máy chủ và thiết bị chuyển mạch quang cốt lõi bằng xe tải thùng lạnh có hệ thống treo kép chuyên dụng.","Direct delivery to Horizon Center 30th-floor data center.","Giao hàng trực tiếp tới trung tâm dữ liệu tầng 30 của Tòa nhà Horizon Center.","Phase 3 (Saturday, Nov 14, 08:00 AM - 08:00 PM): Delivery and placement of modular cubicles, monitors, and ergonomic task seating at Horizon Center.","Giai đoạn 3 (Thứ Bảy, 14/11, 08:00 sáng - 08:00 tối): Giao và sắp xếp các bàn làm việc mô-đun, màn hình máy tính và ghế ngồi làm việc công thái học tại Horizon Center.","Phase 4 (Sunday, Nov 15, 09:00 AM - 04:00 PM): Decommissioning sweep at Parkview Plaza, including electronic recycling pickup and removal of all protective floor masonite runners.","Giai đoạn 4 (Chủ Nhật, 15/11, 09:00 sáng - 04:00 chiều): Thu dọn giải phóng hiện trạng tại Parkview Plaza, bao gồm thu gom rác thải điện tử tái chế và tháo dỡ toàn bộ các tấm bảo vệ sàn masonite.","Total Move Dedicated Personnel: 34 certified commercial movers, 4 logistics coordinators, 6 IT disconnect/reconnect technicians.","Tổng Nhân sự Chuyên trách Di dời: 34 nhân viên dọn chuyển thương mại có chứng chỉ, 4 điều phối viên hậu cần, 6 kỹ thuật viên chuyên tháo lắp kết nối CNTT.","Premises Handover Inspection \u0026 Security Deposit Settlement Notice (Nghiệm thu Bàn giao \u0026 Quyết toán Tiền cọc)","Parkview Plaza Asset Management LLC","To: Gregory Vance, Chief Operating Officer | Nexus Interactive Media Group","Date: November 24, 2026","Subject: End-of-Lease Surrender Inspection: Suites 900 \u0026 1000","Công ty TNHH Quản lý Tài sản Parkview Plaza","Người nhận: Gregory Vance, Giám đốc Vận hành Cấp cao | Tập đoàn Truyền thông Nexus","Ngày: 24 tháng 11, 2026","Tiêu đề: Kiểm tra Nghiệm thu Bàn giao Mặt bằng khi Hết hạn Thuê: Gian 900 \u0026 1000","Dear Mr. Vance, Parkview Plaza Asset Management conducted the formal lease surrender walkthrough of Floors 9 and 10 on November 20 with your facility manager, Ms. Elena Rostova.","Kính gửi ông Vance, Ban Quản lý Tài sản Parkview Plaza đã tiến hành chuyến kiểm tra thực địa nghiệm thu bàn giao chính thức Tầng 9 và 10 vào ngày 20 tháng 11 cùng với giám đốc cơ sở của quý vị, bà Elena Rostova.","We confirm that Nexus Interactive has satisfied the fundamental restoration requirements under Section 24 (Surrender of Premises), including the removal of specialized demising partitions and unapproved cabling risers.","Chúng tôi xác nhận Nexus Interactive đã đáp ứng các yêu cầu hoàn trả nguyên trạng cơ bản theo Điều 24 (Bàn giao Mặt bằng), bao gồm việc tháo dỡ các vách ngăn phân chia chuyên dụng và các hộp cáp kỹ thuật chưa được phê duyệt.","We commend your team on an orderly transition.","Chúng tôi đánh giá cao đội ngũ của quý vị về một quá trình chuyển giao trật tự và bài bản.","Final Security Deposit Reconciliation: Initial Security Deposit on File: $180,000.00.","Đối soát Quyết toán Tiền cọc Bảo đảm Cuối cùng: Tiền cọc ban đầu lưu trên hệ thống: 180.000,00 USD.","Deductions for Discretionary Restoration: 1. Drywall Patching \u0026 Paint Touch-up (remedying wall-mounted monitor bracket damage across 14 conference rooms): $3,400.00.","Các Khoản khấu trừ cho Công tác Phục hồi Hiện trạng: 1. Vá tường thạch cao \u0026 Sơn dặm (khắc phục hư hại do giá treo màn hình gắn tường tại 14 phòng họp): 3.400,00 USD.","2. Industrial Hot-Water Steam Carpet Cleaning (removing coffee and toner stains in central corridors): $2,100.00. Total Allowable Deductions: $5,500.00.","2. Giặt Thảm Hơi nước Nóng Công nghiệp (tẩy vết ố cà phê và mực in tại các hành lang trung tâm): 2.100,00 USD. Tổng các khoản khấu trừ hợp lệ: 5.500,00 USD.","Net Refundable Security Deposit: $174,500.00.","Số tiền Cọc Hoàn trả Ròng: 174.500,00 USD.","A direct electronic wire transfer of $174,500.00 has been initiated today to your corporate treasury account at First Mercantile Commercial Bank (Wire Ref: #WTR-99021).","Một lệnh chuyển khoản ngân hàng điện tử trực tiếp trị giá 174.500,00 USD đã được khởi tạo trong ngày hôm nay tới tài khoản kho bạc doanh nghiệp của quý vị tại Ngân hàng Thương mại First Mercantile (Mã giao dịch: #WTR-99021).","This settlement formally terminates all ongoing liabilities under Lease Agreement #PKV-2018-44.","Thỏa thuận quyết toán này chính thức chấm dứt mọi trách nhiệm pháp lý ràng buộc theo Hợp đồng Thuê số #PKV-2018-44.","Sincerely, Harold Sterling, Senior Property Director, Commercial Real Estate, Parkview Plaza Asset Management.","Trân trọng, Harold Sterling, Giám đốc Bất động sản Cấp cao, Quản lý Bất động sản Thương mại Parkview Plaza.","1.4. Dịch chi tiết Câu hỏi \u0026 Phương án Trắc nghiệm","186. Mục đích chính của bản ghi nhớ do Nexus Interactive gửi là gì?","(A) Để công bố việc khai trương một chi nhánh quốc tế mới tại London","(B) Để vạch ra lịch trình và hướng dẫn chi tiết cho đợt di dời trụ sở công ty","(C) Để mời chào giá từ các nhà thầu chuyển văn phòng thương mại","(D) Để thông báo cho nhân viên về các đợt cắt giảm lương bắt buộc","187. Theo lịch trình hậu cần, hệ thống máy chủ của công ty sẽ được vận chuyển vào thời gian nào?","(A) Chiều Thứ Năm trước 05:00 chiều","(B) Tối Thứ Sáu trong khoảng từ 06:00 tối đến 11:00 đêm","(C) Xuyên đêm giữa đêm Thứ Sáu và sáng sớm Thứ Bảy","(D) Chiều Chủ Nhật trong khoảng từ 09:00 sáng đến 04:00 chiều","188. Số tiền bao nhiêu sẽ bị khấu trừ vào tiền cọc bảo đảm của Nexus Interactive?","(A) 2.100,00 USD","(B) 3.400,00 USD","(C) 5.500,00 USD","(D) 174.500,00 USD","189. Từ \"surrender\" trong đoạn 1 của thông báo quyết toán có nghĩa gần nhất với","(A) sự bàn giao trả lại mặt bằng (relinquishment)","(B) sự mở rộng diện tích (expansion)","(C) công tác xây dựng xây lắp (construction)","(D) sự phá hủy phá dỡ hoàn toàn (destruction)","190. Điều gì được chỉ ra về các nhân viên của Nexus Interactive trong bản ghi nhớ?","(A) Họ sẽ làm việc từ xa vào Thứ Sáu ngày 13/11 và Thứ Hai ngày 16/11","(B) Họ phải tự tay bê vác màn hình máy tính của mình sang tòa nhà mới","(C) Họ bắt buộc phải tháo dỡ toàn bộ các tủ rack máy chủ vào Chủ Nhật 15/11","(D) Họ phải có mặt tại Horizon Center vào sáng Thứ Bảy để kiểm tra mạng","1.5. Tóm tắt Viết lại Toàn bài theo Feynman (Feynman Monograph Summary)","English Executive Summary:","• Background \u0026 Headquarters Relocation Notice: Nexus Interactive schedules its global corporate relocation from Parkview Plaza (Floors 9-10) to Horizon Center (Floors 28-30) across the weekend of November 13-15, establishing remote work days on Nov 13 and Nov 16.","• Move Execution \u0026 Mission-Critical IT Transport: MetroFleet Movers executes a 4-phase logistics plan, including the overnight transport of 12 server racks and core fiber infrastructure between 11:00 PM Friday and 06:00 AM Saturday via climate-controlled dual-suspension vehicles.","• Surrender Walkthrough \u0026 Deposit Reconciliation: Parkview Plaza conducts the final surrender inspection on Nov 20, verifying removal of partitions and deducting $5,500 ($3,400 drywall patching + $2,100 carpet steam-cleaning) from the $180,000 deposit, refunding $174,500 via wire transfer.","Bản tóm tắt Tiếng Việt cốt lõi:","• Bối cảnh chuyển trụ sở: Tập đoàn Nexus Interactive lên lịch di dời trụ sở chính từ Tòa nhà Parkview (Tầng 9-10) sang Tháp Horizon (Tầng 28-30) trong cuối tuần 13-15/11, sắp xếp cho toàn bộ nhân viên làm việc từ xa vào ngày 13 và 16/11 để đội kỹ thuật hoàn tất hạ tầng mạng.","• Hậu cần chuyển dọn \u0026 Vận chuyển máy chủ đêm: Công ty vận chuyển MetroFleet triển khai kế hoạch 4 giai đoạn, đặc biệt điều động xe thùng lạnh giảm chấn chuyển 12 tủ rack máy chủ và thiết bị mạng cáp quang xuyên đêm từ 23h00 Thứ Sáu đến 6h00 sáng Thứ Bảy.","• Nghiệm thu hoàn trả mặt bằng \u0026 Quyết toán tiền cọc: Chủ tòa nhà cũ Parkview tiến hành nghiệm thu bàn giao ngày 20/11, khấu trừ 5.500 USD (3.400 USD vá tường gắn màn hình và 2.100 USD giặt thảm) vào khoản cọc 180.000 USD, và chuyển khoản hoàn trả 174.500 USD qua ngân hàng.","PHẦN 2: ACTIVE RECALL 5 GIÂY (BẢNG MA TRẬN ĐỊNH VỊ SONG NGỮ)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["1. Đối tượng \u0026 Vai trò: Gregory Vance (Giám đốc Vận hành Nexus Interactive - Khách thuê chuyển trụ sở) chỉ đạo việc di dời cùng Carlos Mendez (Giám đốc Dự án chuyển văn phòng MetroFleet) và làm việc với Harold Sterling (Giám đốc Bất động sản Parkview Plaza - Chủ tòa nhà cũ nghiệm thu hoàn cọc).","1. Characters \u0026 Roles: Gregory Vance (COO of Nexus Interactive - Relocating Tenant) oversees the headquarters move with Carlos Mendez (Project Manager at MetroFleet Movers) and settles accounts with Harold Sterling (Senior Property Director at Parkview Plaza - Former Landlord)."]],[["2. Boi canh \u0026 Quy trinh loi"],["2. Bối cảnh \u0026 Quy trình lõi: Quản trị di dời trụ sở doanh nghiệp quy mô lớn (Corporate Office Relocation \u0026 Lease Surrender). Quy trình chuyển dọn 25.000 RSF bảo đảm không gián đoạn máy chủ (Zero Server Outage), kết hợp hoàn trả
