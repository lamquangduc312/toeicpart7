<title>Bất động sản TOEIC 750+</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: cargo-manifest page. Hero with a 3x3 container stack (one container per lesson), sticky container-tab bar, lesson panel with side index of the 5 parts. */
:root{
  /* Tailwind-style neutrals + one primary (Blue 600) */
  --bg:#F9FAFB; --surface:#FFFFFF; --surface-2:#F3F4F6; --ink:#111827; --muted:#6B7280; --line:#E5E7EB;
  --paper:#FFFFFF;
  /* Coordinated palette: navy = governance/trust, cobalt = primary, magenta = errors,
     emerald = correct, ochre = clues & timing, Viettel red = brand marks, xanh mạ = outputs & chips */
  --navy:#102B66; --navy-2:#183B7E; --navy-ink:#102B66;
  --cobalt:#1E62D0; --cobalt-2:#2A7BE8;
  --magenta:#D71A4A; --magenta-2:#E52E5E;
  --emerald:#0A8558; --emerald-2:#12A16E;
  --ochre:#D87D0E; --ochre-2:#E8901C; --ochre-soft:#FDF1E1;
  --brand:var(--cobalt); --brand-soft:#DCE8FB; --vi:var(--navy-2);
  --red:#EE0033; --red-soft:#FFE4EA; --green:#5FA61B; --green-soft:#EAF6DC;
  --ok:var(--emerald); --bad:var(--magenta); --coral:var(--red); --coral-soft:var(--red-soft);
  --c1:var(--brand); --c2:var(--brand); --c3:var(--brand); --c4:var(--brand); --c5:var(--brand); --c6:var(--brand); --c7:var(--brand); --c8:var(--brand); --c9:var(--brand); --c10:var(--brand);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --shadow:0 1px 2px rgba(17,24,39,.05),0 6px 20px -8px rgba(17,24,39,.15);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#030712; --surface:#111827; --surface-2:#0B1120; --ink:#F9FAFB; --muted:#9CA3AF; --line:#1F2937;
  --vi:#9DBDF5; --paper:#111827; --navy-ink:#C9D7F4;
  --brand:var(--cobalt-2); --brand-soft:#132A55; --ochre-soft:#33220B;
  --ok:var(--emerald-2); --bad:var(--magenta-2);
  --red:#FF3B5F; --red-soft:#3B0A16; --green:#8BCF45; --green-soft:#1C2E0E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#030712; --surface:#111827; --surface-2:#0B1120; --ink:#F9FAFB; --muted:#9CA3AF; --line:#1F2937;
  --vi:#9DBDF5; --paper:#111827; --navy-ink:#C9D7F4;
  --brand:var(--cobalt-2); --brand-soft:#132A55; --ochre-soft:#33220B;
  --ok:var(--emerald-2); --bad:var(--magenta-2);
  --red:#FF3B5F; --red-soft:#3B0A16; --green:#8BCF45; --green-soft:#1C2E0E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{display:none}
.wrap{max-width:min(1600px,96vw);width:100%;margin:0 auto;padding-left:clamp(16px,2.5vw,40px);padding-right:clamp(16px,2.5vw,40px)}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--c) 70%,transparent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono)}

/* ---------- Hero ---------- */
.hero{padding-block:clamp(20px,3vw,36px);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.05fr);gap:clamp(20px,3vw,44px);align-items:center}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow b{color:var(--coral);font-weight:500}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3.2vw,44px);line-height:1.15;letter-spacing:-.01em;text-transform:uppercase;margin-top:10px;text-wrap:balance;word-break:break-word}
.hero h1 span{color:var(--red)}
.hero .en-sub{font-family:var(--f-display);font-weight:600;font-size:clamp(14px,1.5vw,18px);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.hero .desc{max-width:62ch;margin-top:16px;color:var(--muted);font-size:15px}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:24px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}

.yard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:620px;justify-self:end;width:100%}
.box{position:relative;min-height:76px;height:auto;aspect-ratio:auto;max-width:100%;border:1px solid var(--line);border-radius:12px;cursor:pointer;color:var(--ink);text-align:left;padding:8px 10px;background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;gap:4px;transition:transform .18s ease,background .18s,border-color .18s,box-shadow .18s}
.box:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 8px 20px -10px color-mix(in srgb,var(--brand) 60%,transparent)}
.box .n{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--brand)}
.box .qr{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.box .code{font-size:11.5px;font-weight:600;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;line-height:1.25;word-break:break-word}
.box.on{background:var(--brand);border-color:var(--brand);color:#fff}
.box.on .n,.box.on .qr,.box.on .code{color:#fff}
.box.alt .n{color:var(--coral)}

/* navy governance band behind the hero */
.hero-band{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff}
.hero-band .eyebrow{color:rgba(255,255,255,.7)}
.hero-band .eyebrow b{color:var(--ochre-2)}
.hero-band h1 span{color:var(--magenta-2)}
.hero-band .en-sub,.hero-band .desc,.hero-band .stat span{color:rgba(255,255,255,.74)}
.hero-band .stat b{color:#fff}
.hero-band .box{border-color:transparent}
.hero-band .box.on{background:var(--cobalt-2);border-color:#fff}

/* ---------- Tab bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-block:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:12px;padding-block:10px}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;flex:1;min-width:0;padding-bottom:2px;scroll-behavior:smooth}
.tab{--c:var(--c1);flex:0 0 auto;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 16px 5px 5px;cursor:pointer;text-align:left;transition:background .15s,border-color .15s}
.tab:hover{border-color:var(--c)}
.tab .door{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--c);font-family:var(--f-display);font-weight:800;font-size:16px;
  background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.tab .tl{display:flex;flex-direction:column;line-height:1.2}
.tab .tl b{font-size:13px;font-weight:600;white-space:nowrap}
.tab .tl small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#fff}
.tab[aria-selected="true"] .door{background:rgba(255,255,255,.22);color:#fff}
.tab[aria-selected="true"] .tl small{color:rgba(255,255,255,.82)}
.mode{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:0 0 auto;background:var(--surface-2)}
.mode button{border:0;background:none;padding:6px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--navy);color:#fff}

/* ---------- Lesson ---------- */
main{padding-block:28px 64px}
.lesson-head{--c:var(--c1);display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start;padding-bottom:24px;border-bottom:2px solid var(--navy-ink)}
.big-n{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,10vw,120px);line-height:.8;color:var(--c);letter-spacing:-.02em}
.big-n small{display:block;font-size:14px;letter-spacing:.2em;color:var(--muted);font-weight:600;margin-bottom:8px}
.lesson-head h2{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3.2vw,38px);line-height:1.05;text-transform:uppercase;color:var(--navy-ink)}
.lesson-head .en-t{font-family:var(--f-display);font-weight:600;font-size:clamp(15px,1.7vw,19px);color:var(--c);letter-spacing:.04em;margin-top:8px;text-transform:uppercase}
.src{display:inline-flex;gap:8px;align-items:center;margin-top:14px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.src b{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--c);letter-spacing:.06em}

.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:36px;margin-top:28px}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 82px);align-self:start;display:flex;flex-direction:column;gap:2px}
.toc a{display:flex;gap:10px;align-items:baseline;text-decoration:none;color:var(--muted);font-size:13.5px;padding:7px 10px;border-radius:6px;line-height:1.3}
.toc a b{font-family:var(--f-display);font-size:17px;color:var(--c);min-width:18px}
.toc a:hover,.toc a.on{background:var(--surface);color:var(--ink)}
.toc .toc-sub{padding-left:38px;font-size:12.5px}
.content{min-width:0;display:flex;flex-direction:column;gap:44px}

.part{display:flex;flex-direction:column;gap:22px;scroll-margin-top:96px}
.part-h{display:flex;gap:14px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px}
.part-h .pn{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.14em;color:#fff;background:var(--red);padding:3px 9px;border-radius:4px;white-space:nowrap}
.part-h h3{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.4vw,26px);text-transform:uppercase;line-height:1.1;color:var(--navy-ink)}
.sub{display:flex;flex-direction:column;gap:14px;scroll-margin-top:96px}
.sub-h{display:flex;gap:10px;align-items:baseline;font-weight:700;font-size:17px}
.sub-h .sn{font-family:var(--f-mono);font-size:12px;color:var(--c);font-weight:500}

/* strategy */
.strat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.strat-t{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;color:var(--c);text-transform:uppercase;line-height:1.5}
.steps{display:grid;gap:12px;counter-reset:s}
.step{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:start}
.step .when{font-family:var(--f-mono);font-size:11.5px;display:flex;flex-direction:column;gap:2px;border-right:2px solid var(--ochre);padding-right:10px}
.step .when span{color:var(--ochre)!important;font-weight:500}
.step .when b{font-family:var(--f-display);font-size:18px;font-weight:700;color:var(--ink)}
.step .when span{color:var(--muted)}
.step h5{margin:0 0 3px;font-size:14.5px;font-weight:700}
.step p{font-size:14.5px;color:var(--ink)}

/* passages = papers */
.papers{display:flex;flex-direction:column;gap:18px}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:22px 24px;display:flex;flex-direction:column;gap:9px;font-size:15px;position:relative}
.paper-tag{align-self:flex-start;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:3px;padding:2px 8px;margin-bottom:4px}
.ln-caps{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.04em;line-height:1.2}
.ln-kv{font-size:14px}
.ln-kv b{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted);margin-right:4px}
.ln-bul{padding-left:16px;position:relative}
.ln-bul::before{content:"";position:absolute;left:2px;top:.7em;width:6px;height:6px;background:var(--c);border-radius:1px}
.ln-sec{font-weight:700;margin-top:6px}
.ln-head{font-weight:700;margin-top:8px;color:var(--navy-ink)}
.ln-num{padding:2px 0 2px 14px;border-left:2px solid var(--brand);margin-left:2px}
.ln-num b{color:var(--brand)}
.ln-concl{background:var(--brand-soft);border-radius:6px;padding:8px 12px;font-size:14px}
.ln-concl b{color:var(--brand)}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:16px}
.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.score{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.score b{color:var(--ink);font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--c)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.q-stem{display:flex;gap:12px;font-weight:600}
.q-no{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--c);line-height:1.2;flex:0 0 auto}
.q-extra{font-style:italic;font-weight:400;color:var(--muted);margin-top:4px}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:8px 12px;cursor:pointer;font-size:14.5px;line-height:1.45;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--c)}
.opt .k{font-family:var(--f-mono);font-weight:500;font-size:13px;color:var(--c);flex:0 0 auto;margin-top:1px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surface))}
.opt.ok .k{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--surface))}
.opt.bad .k{color:var(--bad)}
.q-fb{font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.q-fb .r{font-weight:600}
.q-fb .r.ok{color:var(--ok)} .q-fb .r.bad{color:var(--bad)}
.q-fb a{color:var(--c)}

/* bilingual */
.bi-doc{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;color:var(--c);text-transform:uppercase;padding:10px 0 2px;border-top:1px dashed var(--line);margin-top:6px;line-height:1.5}
.bi-doc:first-child{border-top:0;margin-top:0;padding-top:0}
.bi{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--line)}
.pair:first-child{border-top:0}
.pair>div{padding:11px 16px;display:flex;flex-direction:column;gap:4px;font-size:14.5px;min-width:0}
.pair .en{color:var(--ink)}
.pair .vi{color:var(--vi);background:color-mix(in srgb,var(--vi) 5%,transparent);border-left:1px solid var(--line)}
.lang{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--muted);opacity:.8}
.bi-head{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-bottom:1px solid var(--line)}
.bi-head span{padding:7px 16px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted)}
.bi-head span+span{border-left:1px solid var(--line);color:var(--vi)}

.vi-t{color:var(--vi)}
/* recall mode blurs translations */
.recall .vi-r{filter:blur(6px);cursor:pointer;user-select:none;transition:filter .2s}
.recall .vi-r.peek{filter:none;user-select:auto}

/* question translation */
.qt{display:grid;gap:12px}
.qt-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.qt-card .stem{display:flex;gap:12px}
.qt-card .stem>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.qt-card .stem b{font-weight:600}
.qt-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;padding-left:44px}
.qt-opt{display:flex;gap:8px;font-size:14px;line-height:1.45}
.qt-opt>div{display:flex;flex-direction:column;min-width:0}
.qt-opt .k{font-family:var(--f-mono);color:var(--c);font-size:12.5px;margin-top:1px}
.qt-opt.correct .k{color:#fff;background:var(--ok);border-radius:3px;padding:0 4px;height:fit-content}

/* summary */
.sum{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.sum>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;font-size:14.5px;display:flex;flex-direction:column;gap:8px}
.ideas{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.ideas li{position:relative;padding-left:18px}
.ideas>li::before{content:"";position:absolute;left:3px;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--brand)}
.ideas ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.ideas ul li::before{content:"";position:absolute;left:4px;top:.75em;width:7px;height:1.5px;background:var(--muted)}

/* matrix */
.matrix{display:grid;gap:12px}
.mx{display:grid;grid-template-columns:200px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mx-l{padding:16px;background:color-mix(in srgb,var(--c) 9%,var(--surface));display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line)}
.mx-l .i{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--c)}
.mx-l b{font-size:14.5px;line-height:1.35}
.mx-l small{font-size:12.5px;color:var(--muted);line-height:1.35}
.mx-r{padding:14px 18px;display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.mx-r p{display:flex;gap:10px}
.mx-r .lang{flex:0 0 22px;margin-top:4px}

/* answers */
.ans{display:grid;gap:12px}
.an{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:100px}
.an.flash{animation:flash 1.4s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--c)}100%{box-shadow:0 0 0 0 transparent}}
.an-h{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.an-h .no{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--c)}
.an-h .key{font-family:var(--f-mono);font-weight:500;background:var(--ok);color:#fff;border-radius:4px;padding:1px 8px;font-size:13px}
.an-h .t{font-weight:600}
.trace{font-size:14px;border-left:3px solid var(--ochre);background:var(--ochre-soft);padding:9px 12px;border-radius:0 6px 6px 0;font-style:italic}
.trace .lbl{color:var(--ochre)}
.lbl{font-family:var(--f-mono);font-style:normal;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);display:block;margin-bottom:2px}
.expl{font-size:14.5px}
.an-stem{font-size:14px;color:var(--muted);margin-top:-4px}
.para{display:flex;flex-direction:column;gap:6px;font-size:14px}
.para .pr{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:start;background:var(--green-soft);border-radius:6px;padding:7px 10px}
.para .pr i{font-style:normal;color:var(--green);font-weight:700}
.para .pr span:last-child{font-weight:600}
.wrong{display:grid;gap:8px}
.wr{border:1px solid var(--line);border-radius:8px;padding:9px 12px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.wr-h{display:flex;gap:8px;align-items:baseline}
.wr-h b{font-family:var(--f-mono);font-weight:500;color:var(--bad);font-size:13px}
.wr-h span{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--bad) 55%,transparent);color:var(--muted)}
.trap{align-self:flex-start;font-size:12px;font-weight:600;color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);border-radius:4px;padding:2px 8px}
.ln-sub{padding-left:30px;position:relative;font-size:14px}
.ln-sub::before{content:"";position:absolute;left:16px;top:.75em;width:6px;height:1.5px;background:var(--muted)}
.ln-sub b{color:var(--navy-ink)}

/* workflow */
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;position:relative}
.fstep{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;position:relative}
.fstep:not(:last-child)::after{content:"";position:absolute;right:-12px;top:30px;width:10px;height:10px;border-top:2px solid var(--c);border-right:2px solid var(--c);transform:rotate(45deg);z-index:1}
.fstep h5{margin:0;font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.15;text-transform:uppercase}
.fstep h5 span{display:block;font-size:12px;color:var(--c);letter-spacing:.14em}
.fkv{font-size:13.5px;display:flex;flex-direction:column;gap:1px}
.fkv b{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fkv.out{background:var(--green-soft);border-radius:6px;padding:8px 10px}
.fkv.out b{color:var(--green)}
.ba{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.ba>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;font-size:14.5px;display:flex;flex-direction:column;gap:8px}
.ba h5{margin:0;font-size:14px;font-weight:700}

/* vocab */
.vocab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.vc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:9px}
.vc-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.vc-h .vn{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.vc-h h5{margin:0;font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.05}
.ipa{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chips .eq{font-family:var(--f-mono);font-size:12px;color:var(--c);margin-right:2px}
.chip{font-size:12.5px;border:1px solid color-mix(in srgb,var(--green) 45%,var(--line));color:var(--ink);border-radius:999px;padding:1px 9px;background:var(--green-soft)}
.chips .eq{color:var(--green)}
.vc .mean{font-size:14px;font-weight:500}
.vc .ex{font-size:13.5px;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:3px}
.vc .ex i{font-style:italic}

/* 50 pairs */
.pp-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pp-tools input{flex:1;min-width:0;max-width:420px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;font:inherit;font-size:14.5px;color:var(--ink)}
.tbl-w{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th{text-align:left;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--navy);padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;width:52px}
td.t{font-weight:600}
td.p{color:var(--muted)}
td.m{color:var(--vi)}
tbody tr:hover td{background:var(--surface-2)}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:8px;flex-wrap:wrap}
.pager button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 16px;cursor:pointer;min-width:0;max-width:48%;text-align:left}
.pager button:hover{border-color:var(--ink)}
.pager button small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pager button b{font-size:14px}
.pager .next{margin-left:auto;align-items:flex-end;text-align:right}
footer{border-top:1px solid var(--line);padding-block:20px 32px;color:var(--muted);font-size:12.5px}

cated freight elevator, 24/7 security concierge, secure subterranean loading dock, and 15 allocated subterranean parking spaces for Unit 102 retail patrons.","E-mail (Lease Inquiry \u0026 Build-out Request)","To: Marcus Sterling \u003cm.sterling@vanguardproperties.com\u003e","From: Danielle Rousseau \u003cd.rousseau@aurorafashions.com\u003e","Date: October 18, 2026","Subject: Formal Inquiry \u0026 Tenant Improvement Proposal — 450 Grand Ave, Unit 102","Dear Mr. Sterling,","Our executive leasing committee at Aurora Apparel Group has completed an initial evaluation of your commercial listing at 450 Grand Avenue. We are actively scouting locations for our upcoming regional flagship boutique in the downtown commercial corridor, and Unit 102 meets our operational square footage criteria perfectly.","Because we intend to execute a comprehensive architectural fit-out—including customized hardwood display fixtures, fitting room partitions, and specialized accent lighting—we would like to propose terms for a 7-year commercial lease:","1. We accept the base rental rate of $45.00/sq. ft. under the Triple Net structure.","2. We request a Tenant Improvement (TI) cash allowance of $25.00 per square foot toward our interior build-out, disbursed upon presentation of certified general contractor invoices.","3. Given that our architectural layout requires city permitting and structural approval, our construction contractor estimates a 16-week build-out timeline. We respectfully request that the rent-free abatement period be extended from three months to four months to align with our grand opening schedule on March 1.","4. We require confirmation that our delivery vehicles will have unrestricted access to the subterranean loading dock between 6:00 AM and 9:00 AM daily.","If these initial parameters are acceptable to Vanguard Properties, please furnish a draft Letter of Intent (LOI) by this Friday so we may proceed with our structural engineering survey.","Sincerely,","Danielle Rousseau","Director of Corporate Real Estate \u0026 Expansion","Aurora Apparel Group","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","181 What is indicated about Unit 102 in the flyer?","(A) It has already been fully furnished with display fixtures.","(B) It includes dedicated customer parking stalls in the underground garage.","(C) It is leased under a Modified Gross agreement.","(D) It requires a minimum lease commitment of seven years.","182 According to the flyer, what incentive is currently offered to tenants leasing Unit 102?","(A) Free utilities for the entire first calendar year","(B) Exemption from Common Area Maintenance fees for two years","(C) Three months of waived base rent during interior construction","(D) Complimentary architectural design consultations","183 Why does Ms. Rousseau request an extension of the rent abatement period?","(A) Her company\u0027s renovation work is expected to take 16 weeks.","(B) Aurora Apparel Group is experiencing a temporary budget deficit.","(C) The city zoning board denied their business operation license.","(D) The building\u0027s freight elevator is undergoing mandatory repairs.","184 The word \"furnish\" in paragraph 4 of the e-mail is closest in meaning to","(A) decorate","(B) provide","(C) assemble","(D) renovate","185 What is one condition Ms. Rousseau proposes that is NOT mentioned in the flyer?","(A) Access to the subterranean loading dock","(B) A 7-year lease term duration","(C) A cash Tenant Improvement allowance per square foot","(D) Installation of floor-to-ceiling glass windows","1.2. Hướng dẫn làm bài Part 7: Chiến lược 5 phút tối ưu","CHIẾN THUẬT 5 PHÚT TỐI ƯU: NẮM BẮT BỐI CẢNH, GHÉP NỐI DỮ KIỆN \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Luồng quy trình Đoạn đôi (Quỹ đạo Quét chữ Z \u0026 Bộ lọc 3 Câu hỏi Tiềm thức): • Quỹ đạo hình chữ Z (Z-Pattern Eye Scan) qua 2 văn bản:","- Văn bản 1 (Commercial Listing Flyer): Điểm chạm 1: \u0027Vanguard Commercial Properties — Unit 102 \u0026 Unit 205\u0027 (Q1: Tờ rơi chào thuê mặt bằng thương mại bán lẻ/showroom). Điểm chạm 2: \u0027Base Rent $45/sq. ft. NNN | Semi-Finished Shell | 15 allocated subterranean parking spaces\u0027 (Q2: Mặt bằng tầng 1 bàn giao thô hoàn thiện một phần, kèm chỗ đỗ xe hầm). Điểm chạm 3: \u0027Incentive: 3 months base rent abatement during build-out\u0027 (Q3: Ưu đãi miễn tiền thuê gốc 3 tháng thi công nội thất).","- Văn bản 2 (Email - Đề xuất thuê \u0026 đàm phán): Điểm chạm 1: \u0027Subject: Formal Inquiry \u0026 Tenant Improvement Proposal — Unit 102\u0027 (Q1: Thư hỏi thuê và đề xuất hỗ trợ cải tạo). Điểm chạm 2: \u0027Danielle Rousseau, Director of Corporate Real Estate at Aurora Apparel Group\u0027 (Q2: Khách thuê thương hiệu thời trang lớn đàm phán với chủ tòa nhà). Điểm chạm 3: \u00277-year lease... $25/sq. ft. TI allowance... extend abatement to 4 months (16-week build-out)\u0027 (Q3: Chấp nhận giá thuê, đề xuất thuê 7 năm, xin hỗ trợ hoàn thiện $25/sq. ft. và nới miễn tiền thuê lên 4 tháng).","• Xâu chuỗi tương tác: Chào thuê mặt bằng bán lẻ thô kèm ưu đãi 3 tháng (Văn bản 1) -\u003e Khách thuê thời trang đề xuất ký dài hạn 7 năm, xin thêm ngân sách hoàn thiện TI và tăng thời gian miễn tiền thuê lên 4 tháng cho vừa tiến độ 16 tuần (Văn bản 2).","Bước 2 (20 giây) - Quét nhanh 5 câu hỏi \u0026 Gắn móc từ khóa (Mental Hooks - KHÔNG đọc đáp án): • Q181: \u0027indicated about Unit 102 in flyer\u0027 -\u003e Móc: Chi tiết đặc điểm của Gian 102 (Văn bản 1).","• Q182: \u0027what incentive is currently offered to tenants leasing Unit 102\u0027 -\u003e Móc: Ưu đãi hiện có cho Gian 102 (Văn bản 1).","• Q183: \u0027Why does Ms. Rousseau request an extension of rent abatement\u0027 -\u003e Móc: Lý do xin nới thêm thời gian miễn tiền thuê (Văn bản 2).","• Q184: \u0027word \"furnish\" in paragraph 4 is closest in meaning to\u0027 -\u003e Móc: Từ vựng ngữ cảnh \u0027furnish\u0027 (Văn bản 2).","• Q185: \u0027condition proposed NOT mentioned in flyer\u0027 -\u003e Móc ghép nối/loại trừ: Điều kiện đề xuất mới không có trong tờ rơi (Văn bản 1 + 2).","Bước 3 (3 phút 45 giây) - Cách trả lời \u0026 Dấu hiệu tìm nhanh nhất cho đủ 5 câu hỏi: • Q181 (Chi tiết - 25s): [Dấu hiệu nhanh]: Quét phần Building Amenities ở chân Văn bản 1: \u002715 allocated subterranean parking spaces for Unit 102 retail patrons\u0027 -\u003e Có chỗ đỗ xe riêng dưới hầm dành cho khách hàng của Gian 102 -\u003e Chọn (B).","• Q182 (Chi tiết - 25s): [Dấu hiệu nhanh]: Quét mục \u0027Incentive Package\u0027 của Unit 102 ở Văn bản 1: \u00273 months of base rent abatement during the initial tenant build-out period\u0027 (miễn tiền thuê gốc 3 tháng trong thời gian thi công) -\u003e Chọn (C).","• Q183 (Chi tiết lý do - 30s): [Dấu hiệu nhanh]: Nhìn điều kiện số 3 trong Email của Ms. Rousseau: \u0027construction contractor estimates a 16-week build-out timeline. We respectfully request that the rent-free abatement period be extended from three months to four months\u0027 (16 tuần = 4 tháng) -\u003e Chọn (A).","• Q184 (Từ vựng ngữ cảnh - 25s): [Dấu hiệu nhanh]: Thay thế vào câu: \u0027please [furnish] a draft Letter of Intent (LOI) by this Friday\u0027 (vui lòng cung cấp/gửi bản thảo Ý định thư). Trong ngữ cảnh thương mại, \u0027furnish\u0027 = \u0027provide\u0027 (cung cấp tài liệu/thông tin) -\u003e Chọn (B).","• Q185 (Ghép nối so sánh - 45s): [Dấu hiệu nhanh]: So sánh các đề xuất ở Email với Flyer: Flyer có nhắc đến loading dock (A), có nhắc cam kết thuê tối thiểu (B), cửa kính hiển thị (D); nhưng Flyer KHÔNG hề có gói \u0027Tenant Improvement (TI) cash allowance of $25.00 per sq. ft.\u0027 (khoản hỗ trợ tiền mặt cải tạo) mà đây là yêu cầu mới do bên thuê chủ động đề xuất -\u003e Chọn (C).","Bước 4 (25 giây cuối + Đúc kết Feynman): • Khóa sổ 5 đáp án: 181-B, 182-C, 183-A, 184-B, 185-C.","• Tóm tắt Feynman 1 câu: \u0027Hãng thời trang Aurora hỏi thuê gian thương mại 390m² bàn giao thô tại trung tâm để làm cửa hàng Flagship, chấp nhận thuê 7 năm nhưng yêu cầu chủ tòa nhà tài trợ 25 USD/foot vuông tiền hoàn thiện nội thất và cho miễn phí tiền thuê 4 tháng đầu để kịp thi công 16 tuần.\u0027","1.3. Dịch Song ngữ Xen kẽ Từng Câu (Sentence-by-Sentence Translation)","Commercial Real Estate Listing Flyer (Tờ rơi Chào thuê Bất động sản Thương mại)","Vanguard Commercial Properties — Metropolitan Core Leasing","Property ID: VCP-8842 | Location: 450 Grand Avenue, Downtown Metro","Bất động sản Thương mại Vanguard — Bộ phận Cho thuê Trung tâm Đô thị","Mã bất động sản: VCP-8842 | Địa điểm: 450 Đại lộ Grand, Khu trung tâm","Prime Retail Spaces Available for Immediate Commercial Lease:","Các mặt bằng bán lẻ đắc địa hiện đang sẵn sàng cho thuê thương mại ngay lập tức:","Unit 102 (Ground Floor Retail Space): Usable Area: 4,200 sq. ft. (390 m²).","Gian 102 (Mặt bằng bán lẻ tầng trệt): Diện tích sử dụng: 4.200 foot vuông (390 m²).","Base Rent: $45.00 per sq. ft. annually (Triple Net Lease - NNN).","Giá thuê gốc: 45,00 USD trên mỗi foot vuông mỗi năm (Hợp đồng thuê thuần ba bên - NNN).","Estimated CAM (Common Area Maintenance) \u0026 Property Taxes: $8.50 per sq. ft.","Chi phí bảo trì khu vực chung (CAM) và thuế bất động sản ước tính: 8,50 USD trên mỗi foot vuông.","Handover Condition: Semi-Finished Shell (including dual HVAC units, rough-in plumbing, 200-amp electrical panels, and floor-to-ceiling glass display windows).","Hiện trạng bàn giao: Bàn giao thô hoàn thiện một phần (bao gồm 2 cụm điều hòa trung tâm HVAC, đường ống cấp thoát nước chờ sẵn, tủ điện 200-ampe và vách kính trưng bày kịch trần).","Minimum Lease Commitment: 5 years.","Thời hạn cam kết thuê tối thiểu: 5 năm.","Incentive Package: 3 months of base rent abatement during the initial tenant build-out period for qualified corporate tenants.","Gói ưu đãi: Miễn 3 tháng tiền thuê gốc trong thời gian đầu thi công nội thất của khách thuê dành cho các doanh nghiệp đủ điều kiện.","Unit 205 (Mezzanine Level Showroom / Boutique Space): Usable Area: 2,800 sq. ft. (260 m²); Base Rent: $38.00 per sq. ft. annually (Modified Gross Lease).","Gian 205 (Không gian Trưng bày / Cửa hàng tầng lửng): Diện tích sử dụng: 2.800 foot vuông (260 m²); Giá thuê gốc: 38,00 USD/foot vuông/năm (Hợp đồng thuê bao tiêu điều chỉnh).","Handover Condition: Fully Fitted (carpeted flooring, LED track lighting, built-in reception counter); Minimum Lease Commitment: 3 years.","Hiện trạng bàn giao: Hoàn thiện đầy đủ nội thất (sàn trải thảm, hệ thống đèn rọi ray LED, quầy lễ tân gắn sẵn); Cam kết thuê tối thiểu: 3 năm.","Building Amenities: Dedicated freight elevator, 24/7 security concierge, secure subterranean loading dock, and 15 allocated subterranean parking spaces for Unit 102 retail patrons.","Tiện ích tòa nhà: Thang máy chở hàng chuyên dụng, bộ phận bảo vệ lễ tân 24/7, bến bốc dỡ hàng an toàn dưới tầng hầm và 15 vị trí đỗ xe hầm chỉ định dành cho khách mua sắm của Gian 102.","E-mail (Thư điện tử Hỏi thuê \u0026 Đề xuất Hỗ trợ Cải tạo)","To: Marcus Sterling \u003cm.sterling@vanguardproperties.com\u003e","From: Danielle Rousseau \u003cd.rousseau@aurorafashions.com\u003e","Date: October 18, 2026","Subject: Formal Inquiry \u0026 Tenant Improvement Proposal — 450 Grand Ave, Unit 102","Người nhận: Marcus Sterling \u003cm.sterling@vanguardproperties.com\u003e","Người gửi: Danielle Rousseau \u003cd.rousseau@aurorafashions.com\u003e","Ngày: 18 tháng 10, 2026","Tiêu đề: Thư hỏi thuê chính thức \u0026 Đề xuất Hỗ trợ Hoàn thiện Mặt bằng — 450 Grand Ave, Gian 102","Dear Mr. Sterling, our executive leasing committee at Aurora Apparel Group has completed an initial evaluation of your commercial listing at 450 Grand Avenue.","Kính gửi ông Sterling, ủy ban phụ trách thuê mặt bằng cấp cao tại Tập đoàn May mặc Aurora đã hoàn tất đợt thẩm định sơ bộ danh mục chào thuê thương mại của ông tại số 450 Đại lộ Grand.","We are actively scouting locations for our upcoming regional flagship boutique in the downtown commercial corridor, and Unit 102 meets our operational square footage criteria perfectly.","Chúng tôi đang tích cực tìm kiếm địa điểm cho cửa hàng flagship bán lẻ khu vực sắp tới tại trục hành lang thương mại trung tâm thành phố, và Gian 102 đáp ứng hoàn hảo tiêu chí diện tích vận hành của chúng tôi.","Because we intend to execute a comprehensive architectural fit-out—including customized hardwood display fixtures, fitting room partitions, and specialized accent lighting—we would like to propose terms for a 7-year commercial lease.","Bởi vì chúng tôi dự định tiến hành một đợt thi công nội thất kiến trúc toàn diện—bao gồm kệ trưng bày gỗ cứng thiết kế riêng, vách ngăn phòng thử đồ và hệ thống đèn rọi điểm nhấn chuyên dụng—chúng tôi xin đề xuất các điều khoản cho hợp đồng thuê thương mại 7 năm.","1. We accept the base rental rate of $45.00/sq. ft. under the Triple Net structure.","1. Chúng tôi chấp thuận mức giá thuê gốc 45,00 USD/foot vuông theo mô hình Hợp đồng thuê thuần ba bên (NNN).","2. We request a Tenant Improvement (TI) cash allowance of $25.00 per square foot toward our interior build-out, disbursed upon presentation of certified general contractor invoices.","2. Chúng tôi đề nghị một khoản tiền mặt hỗ trợ hoàn thiện mặt bằng (TI) trị giá 25,00 USD trên mỗi foot vuông để phục vụ công tác xây lắp nội thất, được giải ngân khi xuất trình hóa đơn hợp lệ từ tổng thầu thi công.","3. Given that our architectural layout requires city permitting and structural approval, our construction contractor estimates a 16-week build-out timeline.","3. Xét thấy bản vẽ bố trí kiến trúc của chúng tôi đòi hỏi phải có giấy phép thành phố và phê duyệt kết cấu, nhà thầu xây dựng ước tính thời gian thi công sẽ kéo dài 16 tuần.","We respectfully request that the rent-free abatement period be extended from three months to four months to align with our grand opening schedule on March 1.","Chúng tôi trân trọng đề nghị thời gian miễn tiền thuê được gia hạn từ ba tháng lên bốn tháng để đồng bộ với lịch khai trương chính thức vào ngày 1 tháng 3.","4. We require confirmation that our delivery vehicles will have unrestricted access to the subterranean loading dock between 6:00 AM and 9:00 AM daily.","4. Chúng tôi yêu cầu xác nhận rằng các xe tải giao hàng của chúng tôi sẽ được ra vào không giới hạn bến bốc dỡ tầng hầm trong khung giờ từ 6:00 sáng đến 9:00 sáng hàng ngày.","If these initial parameters are acceptable to Vanguard Properties, please furnish a draft Letter of Intent (LOI) by this Friday so we may proceed with our structural engineering survey.","Nếu các thông số ban đầu này được Công ty Bất động sản Vanguard chấp thuận, xin vui lòng cung cấp bản thảo Ý định thư (LOI) trước thứ Sáu tuần này để chúng tôi có thể tiến hành khảo sát kỹ thuật kết cấu.","Sincerely, Danielle Rousseau, Director of Corporate Real Estate \u0026 Expansion, Aurora Apparel Group.","Trân trọng, Danielle Rousseau, Giám đốc Bất động sản Doanh nghiệp \u0026 Phát triển Mặt bằng, Tập đoàn May mặc Aurora.","1.4. Dịch chi tiết Câu hỏi \u0026 Phương án Trắc nghiệm","181. Điều gì được chỉ ra về Gian 102 trong tờ rơi?","(A) Nó đã được trang bị nội thất hoàn chỉnh với các kệ trưng bày","(B) Nó bao gồm các vị trí đỗ xe chuyên dụng cho khách hàng trong nhà để xe ngầm","(C) Nó được cho thuê theo hợp đồng thuê bao tiêu điều chỉnh (Modified Gross)","(D) Nó yêu cầu thời hạn cam kết hợp đồng thuê tối thiểu là 7 năm","182. Theo tờ rơi, ưu đãi nào hiện đang được cung cấp cho khách thuê Gian 102?","(A) Miễn phí toàn bộ tiền điện nước trong năm đầu tiên","(B) Miễn phí bảo trì khu vực chung (CAM) trong hai năm","(C) Miễn ba tháng tiền thuê gốc trong thời gian thi công nội thất","(D) Tư vấn thiết kế kiến trúc hoàn toàn miễn phí","183. Tại sao bà Rousseau yêu cầu gia hạn thời gian miễn tiền thuê?","(A) Công tác cải tạo nội thất của công ty bà dự kiến mất 16 tuần","(B) Tập đoàn May mặc Aurora đang gặp phải tình trạng thâm hụt ngân sách tạm thời","(C) Ủy ban quy hoạch đô thị từ chối cấp giấy phép hoạt động kinh doanh","(D) Thang máy chở hàng của tòa nhà đang phải trải qua đợt bảo dưỡng bắt buộc","184. Từ \"furnish\" trong đoạn 4 của bức thư điện tử có nghĩa gần nhất với","(A) trang trí / bày biện (decorate)","(B) cung cấp / gửi (provide)","(C) lắp ráp / gia công (assemble)","(D) sửa chữa / cải tạo (renovate)","185. Điều kiện nào bà Rousseau đề xuất mà KHÔNG được đề cập trong tờ rơi?","(A) Quyền ra vào bến bốc dỡ hàng hóa dưới tầng hầm","(B) Thời hạn thuê hợp đồng kéo dài 7 năm","(C) Khoản tiền mặt hỗ trợ hoàn thiện mặt bằng (TI) tính trên mỗi foot vuông","(D) Lắp đặt hệ thống cửa kính trưng bày kịch trần","1.5. Tóm tắt Viết lại Toàn bài theo Feynman (Feynman Monograph Summary)","English Executive Summary:","• Background \u0026 Space Availability: Vanguard Commercial Properties advertises Unit 102 (4,200 sq. ft.) at 450 Grand Avenue as a semi-finished commercial retail shell at $45.00/sq. ft. annually (NNN) with a 5-year minimum commitment and 3 months rent abatement.","• Tenant Proposal \u0026 Expansion Requirements: Aurora Apparel Group targets the ground-floor space for a regional flagship boutique, offering a longer 7-year lease term while counter-proposing a $25.00/sq. ft. Tenant Improvement (TI) cash allowance and morning loading dock access.","• Negotiation \u0026 Timeline Alignment: Due to a 16-week contractor construction and city permitting timeline ahead of a March 1 opening, the tenant formally requests extending the rent-free build-out abatement from 3 to 4 months and requests a draft LOI.","Bản tóm tắt Tiếng Việt cốt lõi:","• Bối cảnh chào thuê mặt bằng: Bất động sản Vanguard chào thuê Gian thương mại tầng trệt 102 (diện tích 390 m²) tại số 450 Đại lộ Grand với hiện trạng thô hoàn thiện một phần, đơn giá 45 USD/foot vuông/năm (Hợp đồng thuê thuần NNN), cam kết tối thiểu 5 năm kèm ưu đãi 3 tháng miễn tiền thuê.","• Nhu cầu mở rộng \u0026 Đề xuất của khách thuê: Tập đoàn May mặc Aurora nhắm địa điểm này để mở cửa hàng bán lẻ flagship khu vực, đề xuất nâng thời hạn hợp đồng lên 7 năm nhưng yêu cầu chủ tòa nhà tài trợ 25 USD/foot vuông chi phí hoàn thiện nội thất (TI allowance) và cam kết quyền bốc dỡ hàng hầm buổi sáng.","• Đàm phán tiến độ \u0026 Đồng bộ ngày khai trương: Do công tác thi công nội thất và xin giấy phép xây dựng đô thị kéo dài 16 tuần để kịp ngày khai trương 1/3, bên thuê đề nghị nới thời hạn miễn tiền thuê từ 3 tháng lên 4 tháng và yêu cầu ban hành bản thảo Ý định thư (LOI).","PHẦN 2: ACTIVE RECALL 5 GIÂY (BẢNG MA TRẬN ĐỊNH VỊ SONG NGỮ)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["1. Đối tượng \u0026 Vai trò: Marcus Sterling (Đại diện cho thuê Bất động sản Thương mại Vanguard - Bên Cho thuê / Landlord Broker) tiếp nhận đề xuất từ Danielle Rousseau (Giám đốc Bất động sản Doanh nghiệp Tập đoàn May mặc Aurora - Bên Thuê Bán lẻ / Retail Tenant).","1. Characters \u0026 Roles: Marcus Sterling (Leasing Representative for Vanguard Commercial Properties - Landlord Broker) receives a commercial lease counter-proposal from Danielle Rousseau (Director of Corporate Real Estate at Aurora Apparel Group - Corporate Retail Tenant)."]],[["2. Boi canh \u0026 Quy trinh loi"],["2. Bối cảnh \u0026 Quy trình lõi: Khảo sát mặt bằng bán lẻ flagship bàn giao thô (Semi-Finished Shell). Khách thuê đồng ý giá cước NNN $45/sq. ft. và cam kết thuê dài hạn 7 năm, nhưng đàm phán 2 điều khoản tài chính quan trọng: Khoản tiền tài trợ hoàn thiện nội thất ($25/sq. ft. TI Allowance) và nới thời gian miễn tiền thuê từ 3 lên 4 tháng để vừa khít tiến độ thi công 16 tuần.","2. Context \u0026 Core Workflow: Scouting a semi-finished shell retail space for a flagship store. Tenant accepts $45/sq. ft. NNN base rent and commits to a 7-year term, but negotiates two vital fiscal clauses: a $25/sq. ft. Tenant Improvement allowance and extending rent abatement from 3 to 4 months to match a 16-week build-out."]],[["3. Dau vet suy luan cheo"],["3. Dấu vết suy luận chéo: Ghép nối tiến độ thi công xây lắp 16 tuần ở Văn bản 2 với đề xuất nới thời gian miễn tiền thuê lên 4 tháng (16 tuần = 4 tháng x 4 tuần) để đồng bộ ngày khai trương 1/3. Đối chiếu các tiện ích có sẵn trong Flyer với các yêu cầu mới phát sinh trong Email để nhận diện điều khoản mới.","3. Cross-Referencing Clues: Correlating the 16-week contractor renovation schedule in Passage 2 with the request for 4 months rent abatement (16 weeks = 4 months) targeting March 1 opening. Contrasting base flyer amenities with new tenant concessions in the email to identify newly proposed terms."]]],"t":"table"},"PHẦN 3: ĐÁP ÁN CHUẨN XÁC \u0026 DẤU VẾT TRUY XUẤT CHÉO (CROSS-REFERENCING \u0026 COMPREHENSIVE TRAP BREAKDOWN)","What is indicated about Unit 102 in the flyer?","Dap an dung: (B) It includes dedicated customer parking stalls in the underground garage.","[Dau vet bai doc / Clue]: Flyer, Building Amenities: \u0027...and 15 allocated subterranean parking spaces for Unit 102 retail patrons.\u0027","[Dien dat tuong duong / Paraphrase]: allocated subterranean parking spaces for retail patrons \u003c=\u003e dedicated customer parking stalls in the underground garage","[Loi giai chi tiet]: Tờ rơi chào thuê ghi rõ tiện ích đi kèm của Gian 102 là có 15 chỗ đỗ xe ngầm dưới tầng hầm được phân bổ dành riêng cho khách hàng mua sắm (retail patrons).","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) It has already been fully furnished with display fixtures.","- Ly do sai: Gian 102 chỉ bàn giao dạng thô hoàn thiện một phần (Semi-Finished Shell), còn nội thất hoàn chỉnh (Fully Fitted) là của Gian 205.","- Bay ETS: Bẫy Đảo lộn Đối tượng (Subject Confusion Trap)","(C) It is leased under a Modified Gross agreement.","- Ly do sai: Gian 102 được cho thuê theo hình thức Triple Net Lease (NNN), còn Modified Gross là hình thức áp dụng cho Gian 205.","- Bay ETS: Bẫy Nhầm lẫn Điều khoản Hợp đồng (Contract Clause Mismatch)","(D) It requires a minimum lease commitment of seven years.","- Ly do sai: Tờ rơi chỉ yêu cầu cam kết tối thiểu 5 năm (Minimum Lease Commitment: 5 years); con số 7 năm là đề xuất chủ động của khách thuê trong Email.","- Bay ETS: Bẫy Lẫn lộn Giữa Đề thi và Đề xuất (Flyer vs. Inquiry Concession Trap)","According to the flyer, what incentive is currently offered to tenants leasing Unit 102?","Dap an dung: (C) Three months of waived base rent during interior construction","[Dau vet bai doc / Clue]: Flyer, Unit 102: \u0027Incentive Package: 3 months of base rent abatement during the initial tenant build-out period for qualified corporate tenants.\u0027","[Dien dat tuong duong / Paraphrase]: 3 months of base rent abatement during initial build-out \u003c=\u003e Three months of waived base rent during interior construction","[Loi giai chi tiet]: Thuật ngữ \u0027rent abatement\u0027 trong hợp đồng thuê bất động sản thương mại đồng nghĩa với \u0027waived rent\u0027 (khoản tiền thuê được miễn/giảm trừ). Tờ rơi nêu rõ ưu đãi là 3 tháng miễn tiền thuê gốc trong thời gian đầu thi công.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Free utilities for the entire first calendar year","- Ly do sai: Không có điều khoản miễn tiền điện nước; hợp đồng NNN yêu cầu khách thuê tự chi trả toàn bộ chi phí vận hành.","- Bay ETS: Bẫy Thông tin Không có trong bài (Fabricated Trap)","(B) Exemption from Common Area Maintenance fees for two years","- Ly do sai: Phí CAM ước tính là $8.50/sq. ft. và khách thuê vẫn phải thanh toán hàng tháng theo hợp đồng Triple Net.","- Bay ETS: Bẫy Nửa Đúng Nửa Sai (Half-True Trap)","(D) Complimentary architectural design consultations","- Ly do sai: Tòa nhà không cung cấp dịch vụ tư vấn kiến trúc miễn phí; khách thuê tự thuê nhà thầu thiết kế của riêng mình.","- Bay ETS: Bẫy Suy đoán Vô căn cứ (Unsubstantiated Assumption Trap)","Why does Ms. Rousseau request an extension of the rent abatement period?","Dap an dung: (A) Her company\u0027s renovation work is expected to take 16 weeks.","[Dau vet bai doc / Clue]: E-mail, Điều kiện 3: \u0027...our construction contractor estimates a 16-week build-out timeline. We respectfully request that the rent-free abatement period be extended from three months to four months to align with our grand opening schedule on March 1.\u0027","[Dien dat tuong duong / Paraphrase]: construction contractor estimates 16-week build-out timeline \u003c=\u003e renovation work is expected to take 16 weeks","[Loi giai chi tiet]: Nhà thầu xây dựng ước tính việc hoàn thiện nội thất và xin giấy phép mất 16 tuần (tương đương 4 tháng), nên bà Rousseau đề nghị kéo dài thời gian miễn tiền thuê từ 3 tháng lên 4 tháng để không phải trả tiền thuê khi chưa thể mở cửa kinh doanh.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(B) Aurora Apparel Group is experiencing a temporary budget deficit.","- Ly do sai: Tập đoàn Aurora đang mở rộng chuỗi bán lẻ và sẵn sàng cam kết hợp đồng 7 năm, không hề bị thâm hụt ngân sách.","- Bay ETS: Bẫy Đặt điều Trái ngược (Contradictory Assumption Trap)","(C) The city zoning board denied their business operation license.","- Ly do sai: Họ chỉ đang trong quá trình xin cấp phép quy hoạch kiến trúc (requires city permitting), chứ chưa hề bị từ chối giấy phép.","- Bay ETS: Bẫy Phóng đại Trầm trọng hóa (Exaggeration Trap)","(D) The building\u0027s freight elevator is undergoing mandatory repairs.","- Ly do sai: Thang máy chở hàng vẫn hoạt động bình thường như một tiện ích của tòa nhà, không có thông tin sửa chữa.","- Bay ETS: Bẫy Chi tiết Lạc đề (Irrelevant Detail Trap)","The word \"furnish\" in paragraph 4 of the e-mail is closest in meaning to","Dap an dung: (B) provide","[Dau vet bai doc / Clue]: E-mail, Đoạn 4: \u0027If these initial parameters are acceptable to Vanguard Properties, please furnish a draft Letter of Intent (LOI) by this Friday...\u0027","[Dien dat tuong duong / Paraphrase]: furnish a draft Letter of Intent \u003c=\u003e provide / supply / present a draft agreement","[Loi giai chi tiet]: Động từ \u0027furnish\u0027 khi đi kèm với tài liệu, hồ sơ chứng từ thương mại (document, report, agreement) có nghĩa là cung cấp, chuyển giao (provide/supply), tránh nhầm với nghĩa \u0027trang bị bàn ghế đồ đạc\u0027 trong gia đình.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) decorate","- Ly do sai: \u0027Decorate\u0027 là trang trí phòng ốc, không dùng cho việc ban hành văn bản pháp lý LOI.","- Bay ETS: Bẫy Nghĩa Đen Nội thất (Literal Furniture Trap)","(C) assemble","- Ly do sai: \u0027Assemble\u0027 là lắp ráp máy móc linh kiện hoặc tụ họp nhân sự.","- Bay ETS: Bẫy Từ vựng Sai ngữ cảnh (Context Mismatch Trap)","(D) renovate","- Ly do sai: \u0027Renovate\u0027 là cải tạo sửa chữa công trình xây dựng.","- Bay ETS: Bẫy Từ cùng Trường Nghĩa Xây dựng (Domain Echo Trap)","What is one condition Ms. Rousseau proposes that is NOT mentioned in the flyer?","Dap an dung: (C) A cash Tenant Improvement allowance per square foot","[Dau vet bai doc / Clue]: E-mail, Điều kiện 2: \u0027We request a Tenant Improvement (TI) cash allowance of $25.00 per square foot toward our interior build-out, disbursed upon presentation of certified general contractor invoices.\u0027 Đối chiếu tờ rơi: Tờ rơi chỉ đề cập đến miễn tiền thuê (rent abatement) chứ không có bất kỳ khoản hỗ trợ tiền mặt hoàn thiện (TI allowance) nào.","[Dien dat tuong duong / Paraphrase]: TI cash allowance of $25.00/sq. ft. requested by tenant \u003c=\u003e proposed condition NOT mentioned in original flyer","[Loi giai chi tiet]: Đây là câu hỏi so sánh đối chiếu giữa 2 văn bản: Flyer có đề cập bến bốc dỡ hàng (A), thời hạn thuê cam kết (B - flyer ghi 5 năm, thư đề xuất 7 năm nhưng khái niệm lease commitment đã có), vách kính kịch trần (D). Riêng khoản tiền mặt hỗ trợ cải tạo $25/foot vuông (Tenant Improvement Allowance) hoàn toàn là điều khoản mới do bên thuê yêu cầu bổ sung.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Access to the subterranean loading dock","- Ly do sai: Tờ rơi CÓ nhắc đến bến bốc dỡ hàng ngầm (\u0027secure subterranean loading dock\u0027) trong mục Building Amenities.","- Bay ETS: Bẫy Chi tiết Đã có trong bài (Existing Fact Trap)","(B) A 7-year lease term duration","- Ly do sai: Mặc dù flyer ghi 5 năm và email đề xuất 7 năm, nhưng câu hỏi hỏi về điều kiện hoàn toàn không có trong flyer; hơn nữa phương án (C) là yêu cầu tài chính hoàn toàn mới chưa từng xuất hiện.","- Bay ETS: Bẫy Nhiễu Thứ cấp (Secondary Distractor Trap)","(D) Installation of floor-to-ceiling glass windows","- Ly do sai: Vách kính kịch trần CÓ sẵn trong hiện trạng bàn giao của Flyer (\u0027floor-to-ceiling glass display windows\u0027).","- Bay ETS: Bẫy Chi tiết Đã có trong bài (Existing Fact Trap)","PHẦN 4: KỸ THUẬT FEYNMAN SONG NGỮ \u0026 SƠ ĐỒ QUY TRÌNH (TƯ DUY PHÂN TÍCH NGHIỆP VỤ \u0026 BA)","4.1. Sơ đồ Quy trình Luân chuyển Nghiệp vụ (End-to-End Commercial Leasing Workflow)","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","KHẢO SÁT MẶT BẰNG \u0026 PHÁT HÀNH LOI"],[],["BƯỚC 2","THẨM ĐỊNH KẾT CẤU \u0026 XIN CẤP PHÉP XÂY DỰNG"],[],["BƯỚC 3","THI CÔNG HOÀN THIỆN, GIẢI NGÂN TI \u0026 NGHIỆM THU"]],[["• Chung tu \u0026 Kenh: Tờ rơi Chào thuê Bất động sản \u0026 Thư Ý định Thuê (Letter of Intent - LOI)","• Nghiep vu thuc thi: Bộ phận Bất động sản doanh nghiệp rà soát tiêu chí mặt bằng bán lẻ (diện tích, lưu lượng khách, kết cấu thô); gửi thư đàm phán các điều khoản tài chính then chốt (giá thuê NNN, thời hạn thuê, hỗ trợ hoàn thiện TI allowance).","• Ket qua \u0026 Kiem soat: Bản thỏa thuận nguyên tắc (Executed LOI) làm cơ sở cho khảo sát kỹ thuật kết cấu."],["➔"],["• Chung tu \u0026 Kenh: Hồ sơ Bản vẽ Kiến trúc \u0026 Giấy phép Quy hoạch Đô thị (Building Permits)","• Nghiep vu thuc thi: Tổng thầu thi công đo đạc hiện trạng, thiết kế hệ thống MEP (điện nước, điều hòa PCCC), nộp hồ sơ xin cấp phép cải tạo thương mại lên cơ quan quản lý đô thị thành phố.","• Ket qua \u0026 Kiem soat: Giấy phép thi công xây dựng (Construction Permit) và kế hoạch tiến độ 16 tuần."],["➔"],["• Chung tu \u0026 Kenh: Hóa đơn Tổng thầu Có Chứng thực \u0026 Biên bản Nghiệm thu Bàn giao (PMR)","• Nghiep vu thuc thi: Triển khai thi công trong giai đoạn miễn tiền thuê (Rent Abatement); chủ tòa nhà nghiệm thu từng giai đoạn và giải ngân tiền hỗ trợ TI ($25/sq. ft.); kiểm tra PCCC cấp chứng nhận đủ điều kiện hoạt động.","• Ket qua \u0026 Kiem soat: Bàn giao chìa khóa khai trương cửa hàng Flagship (Grand Opening) đúng ngày 1/3."]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["STEP 1","SITE SELECTION \u0026 LOI NEGOTIATION"],[],["STEP 2","ARCHITECTURAL FIT-OUT \u0026 PERMITTING"],[],["STEP 3","FIT-OUT EXECUTION, TI DISBURSEMENT \u0026 OPENING"]],[["• Documents \u0026 Channels: Commercial Property Listing \u0026 Letter of Intent (LOI) Submission","• Core Business Execution: Corporate real estate directors evaluate flagship retail footprints, negotiating fundamental lease terms (NNN base rent, 7-year commitment, $25/sq. ft. TI allowance, and dock access).","• Key Deliverable \u0026 Control: Mutually executed Letter of Intent establishing legal and financial parameters."],["➔"],["• Documents \u0026 Channels: Engineering Blueprint Package \u0026 Municipal Building Permits","• Core Business Execution: General contractor conducts structural surveys, submits MEP (mechanical, electrical, plumbing) blueprints, and secures municipal tenant fit-out authorization.","• Key Deliverable \u0026 Control: Approved construction permits establishing the 16-week renovation runway."],["➔"],["• Documents \u0026 Channels: Certified Contractor Invoices \u0026 Certificate of Occupancy","• Core Business Execution: Execute interior construction under a 4-month rent-free abatement window; landlord audits milestones and disburses TI cash allowances; municipal fire safety inspection passed.","• Key Deliverable \u0026 Control: Flagship boutique grand opening on March 1 with optimized capital outlay."]]],"t":"table"},"4.2. Tư duy Phân tích Nghiệp vụ \u0026 BA (Bản Tiếng Việt)","• Bức tranh Toàn cảnh Nghiệp vụ (End-to-End Flow): Trong thị trường bất động sản thương mại cao cấp (Commercial Real Estate), quy trình thuê mặt bằng bán lẻ kết nối chặt chẽ giữa 3 dòng chảy: Dòng chảy Vật lý (Khảo sát hiện trạng thô -\u003e Bàn giao chìa khóa -\u003e Thi công vách ngăn/nội thất -\u003e Vận hành bến bốc dỡ hàng); Dòng chảy Pháp lý (Chào thuê -\u003e Ý định thư LOI -\u003e Hợp đồng thuê thương mại chính thức Lease Agreement -\u003e Giấy phép xây dựng thành phố -\u003e Biên bản nghiệm thu PCCC); và Dòng chảy Tài chính - Ngân hàng (Đặt cọc ký quỹ Escrow/Security Deposit -\u003e Giải ngân hỗ trợ hoàn thiện Tenant Improvement Allowance theo tiến độ chứng từ -\u003e Thanh toán chi phí vận hành chung CAM và tiền thuê NNN qua chuyển khoản định kỳ ACH).","• Điểm nghẽn \u0026 Rủi ro Vận hành Thực tế (Core Bottleneck \u0026 Risk): Rủi ro lớn nhất của bên thuê là \u0027Cháy tiến độ thi công vượt quá thời gian miễn tiền thuê\u0027 (Build-out Delays exceeding Rent Abatement). Nếu hồ sơ xin giấy phép xây dựng đô thị bị chậm trễ hoặc khâu hoàn thiện nội thất kéo dài quá 12 tuần (trong khi chỉ được miễn 3 tháng tiền thuê), doanh nghiệp sẽ phải bắt đầu trả tiền thuê hàng tháng ($15.750/tháng đối với mặt bằng 4.200 sq. ft.) trong khi chưa có doanh thu bán hàng. Điểm nghẽn thứ hai là tranh chấp giải ngân gói TI Allowance: Nếu hợp đồng không quy định rõ điều kiện chứng từ giải ngân, chủ tòa nhà có thể trì hoãn thanh toán khiến nhà thầu ngừng thi công.","• 3 Giải pháp Thiết kế Hệ thống \u0026 Kiểm soát Nghiệp vụ (BA \u0026 Real Estate Architecture):","(1) Thiết lập Điều khoản Đồng bộ Ngày Bắt đầu Tính Cước (Rent Commencement Date tied to Certificate of Occupancy): Trong hợp đồng thuê thương mại, điều khoản tính cước bắt buộc phải quy định: Ngày bắt đầu trả tiền thuê sẽ là ngày muộn hơn giữa [Ngày kết thúc thời gian miễn tiền thuê cam kết] và [Ngày cơ quan chức năng cấp Giấy chứng nhận đủ điều kiện hoạt động (Certificate of Occupancy)], bảo vệ bên thuê khỏi rủi ro chậm trễ do khách quan.","(2) Cơ chế Giải ngân Ký quỹ Khóa Hỗ trợ Hoàn thiện (TI Allowance Escrow Mechanism): Khoản tiền hỗ trợ hoàn thiện ($25 x 4.200 sq. ft. = $105.000) phải được chủ tòa nhà ký quỹ vào tài khoản phong tỏa của ngân hàng ngay khi ký hợp đồng chính thức, và tự động giải ngân theo từng đợt (Milestone-based disbursement) dựa trên biên bản xác nhận tiến độ của đơn vị tư vấn giám sát độc lập.","(3) Ma trận Phân quyền \u0026 Giám sát Bến bốc dỡ Hàng hóa Số hóa (Smart Dock Scheduling System): Tích hợp cổng đặt lịch bến bốc dỡ trực tuyến qua phần mềm quản lý tòa nhà, cấp mã QR ra vào barrier tự động cho đội xe tiếp vận của khách thuê trong khung giờ vàng 6:00 - 9:00 AM, ngăn chặn triệt để tình trạng ùn tắc giao thông tầng hầm.","• Tam giác Liên kết Nhận thức Đa chiều (Multi-Perspective Contextual Anchoring):","- Lăng kính Viễn thông / CNTT Viettel: Bài toán khảo sát và thuê mặt bằng mở Cửa hàng Giao dịch Viettel / Trung tâm Trải nghiệm Số (Viettel Store / Digital Hub). Khi chọn vị trí mặt bằng tại ngã tư trung tâm, ban quản lý dự án phải đàm phán hợp đồng thuê dài hạn, yêu cầu chủ nhà hỗ trợ thời gian thi công lắp đặt biển bảng nhận diện thương hiệu, phòng máy chủ mini và hệ thống cáp quang chuyên dụng, đồng thời ràng buộc điều khoản miễn tiền thuê trong thời gian lắp đặt thiết bị viễn thông.","- Lăng kính Quản trị Mầm non Ước Mơ Xanh: Khi trường mở rộng thêm cơ sở mầm non mới tại tầng 1 khu đô thị, cô Thu Huyền phải trực tiếp đàm phán với chủ đầu tư: Xin miễn tiền thuê 3-4 tháng hè để cải tạo phòng học STEAM, lát sàn gỗ chống trơn trượt và làm sân chơi cát; đồng thời yêu cầu chủ đầu tư cấp kinh phí hỗ trợ hoàn thiện hạ tầng an toàn trẻ nhỏ và cam kết lối đi riêng biệt không đi chung với khu vực giao nhận hàng hóa của tòa nhà.","- Lăng kính Bàn học Gia đình (Kèm cặp Bé Hà Ngân Lớp 5): Bài học về \u0027Tính toán chi phí và lập kế hoạch thời gian dự phòng\u0027: Khi bố mẹ cùng Hà Ngân lên kế hoạch thiết kế lại góc học tập mới (kê bàn học đôi, đóng giá sách bằng gỗ), con học được rằng cần phải tính trước: Mất bao nhiêu ngày để thợ đóng xong bàn (giống như tiến độ thi công 16 tuần), chi phí mua vật liệu là bao nhiêu và luôn phải để dành thêm 1 tuần dự phòng để sơn kịp khô trước ngày khai giảng năm học mới.","4.3. Business Analyst Executive Summary (Bản Tiếng Anh)","• End-to-End Business \u0026 Facility Context: Commercial real estate leasing encompasses three interdependent workflows: physical site handovers (semi-finished shell to turnkey flagship boutique), legal structuring (listing flyers to executed Letters of Intent and long-term lease covenants), and financial engineering (security deposits, Triple Net operational cost accounting, and staged Tenant Improvement disbursements).","• Core Operational Bottleneck \u0026 Risk: The primary operational exposure lies in fit-out schedule slippage exceeding rent abatement windows. If architectural permitting or specialized HVAC installations extend past the 12-week rent-free period, the tenant incurs substantial rental overhead ($15,750/month) with zero operational cash inflow. Additionally, ambiguous TI reimbursement terms can lead to contractor liquidity freezes.","• Key BA \u0026 System Architecture Solutions:","(1) Contingent Rent Commencement Milestones: Formulate lease covenants tying rent commencement directly to the issuance of the municipal Certificate of Occupancy rather than a rigid calendar date, transferring permitting latency risk.","(2) Escrow-Backed TI Disbursement Schedules: Require landlords to deposit negotiated build-out allowances ($105,000) into dedicated banking escrow accounts, released systematically against certified contractor phase-completion certificates.","(3) Automated Loading Dock Slot Management: Implement smart facility dock reservation platforms providing scheduled delivery authorization between 6:00 AM and 9:00 AM, guaranteeing continuous supply chain ingress without subterranean congestion.","PHẦN 5: TỪ VỰNG \u0026 PARAPHRASE CHUYÊN SÂU (CHUẨN 3 DÒNG TỐI ƯU NẠP ANKI)","Rent Abatement  /rɛnt əˈbeɪtmənt/  Waived Rent / Rent-Free Period / Rental Concession","Nghia: Khoản miễn hoặc giảm trừ tiền thuê trong một khoảng thời gian nhất định (thường là thời gian thi công nội thất).","Vd: The landlord granted a four-month rent abatement while the retail boutique completed its interior renovations. - Chủ tòa nhà đã chấp thuận miễn tiền thuê bốn tháng trong thời gian cửa hàng bán lẻ hoàn thiện công tác cải tạo nội thất.","Tenant Improvement Allowance  /ˈtɛnənt ɪmˈpruːvmənt əˈlaʊəns/  TI Allowance / Construction Allowance / Fit-out Cash Contribution","Nghia: Khoản tiền mặt mà chủ tòa nhà hỗ trợ cho khách thuê để cải tạo và hoàn thiện không gian nội thất theo nhu cầu.","Vd: Aurora Apparel requested a $25 per square foot Tenant Improvement allowance to finance customized store fixtures. - Hãng May mặc Aurora đã yêu cầu khoản hỗ trợ hoàn thiện 25 USD trên mỗi foot vuông để chi trả cho các kệ trưng bày thiết kế riêng.","Triple Net Lease  /ˈtrɪpl nɛt liːs/  NNN Lease / Net-Net-Net Agreement","Nghia: Hợp đồng thuê thuần ba bên, trong đó bên thuê ngoài tiền thuê gốc phải tự chi trả thuế bất động sản, bảo hiểm và phí bảo trì chung.","Vd: Under the Triple Net lease, the tenant is responsible for paying property taxes, insurance, and CAM fees. - Theo hợp đồng thuê thuần ba bên (NNN), khách thuê có trách nhiệm tự chi trả thuế tài sản, bảo hiểm và phí bảo trì khu vực chung.","Letter of Intent  /ˈlɛtər əv ɪnˈtɛnt/  LOI / Memorandum of Understanding / Preliminary Term Sheet","Nghia: Ý định thư hoặc văn bản thỏa thuận sơ bộ xác lập các nguyên tắc và điều khoản thuê chính trước khi ký hợp đồng.","Vd: The broker submitted a draft Letter of Intent outlining the seven-year lease terms for executive review. - Nhân viên môi giới đã gửi bản thảo Ý định thư nêu tóm tắt các điều khoản thuê bảy năm để ban lãnh đạo phê duyệt.","Furnish  /ˈfɜːrnɪʃ/  Provide / Supply / Present / Deliver Documentation","Nghia: Cung cấp, chuyển giao, gửi tài liệu chứng từ hoặc số liệu chính thức phục vụ công việc thương mại.","Vd: The property manager agreed to furnish the engineering blueprints before the end of the week. - Người quản lý tòa nhà đã đồng ý cung cấp các bản vẽ kỹ thuật kiến trúc trước thời điểm cuối tuần.","Subterranean  /ˌsʌbtəˈreɪniən/  Underground / Below-ground / Basement Facility","Nghia: Thuộc về tầng ngầm, dưới mặt đất (thường dùng cho hầm để xe, bến bốc dỡ hàng hóa tòa nhà).","Vd: Delivery trucks can access the subterranean loading dock directly via the private access ramp. - Các xe tải giao hàng có thể tiếp cận bến bốc dỡ hàng tầng hầm trực tiếp thông qua đường dốc riêng biệt.","==================================================================================================","BÀI 2: Đàm phán Hợp đồng Thuê Văn phòng Trụ sở, Phí Dịch vụ Chung (CAM) \u0026 Tiền cọc Bảo đảm (Questions 186-190 - Triple Passage)","Nguồn: ETS TOEIC Part 7 — Triple Passage (Commercial Lease Term Sheet, Tenant Negotiation Memorandum \u0026 Landlord Confirmation E-mail, Questions 186-190)","PHẦN 1: NỘI DUNG VĂN BẢN ĐỌC HIỂU \u0026 DỊCH THUẬT","1.1. Đề thi Tiếng Anh gốc (Strategy Guide \u0026 Original ETS Passages)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","Commercial Lease Agreement Term Sheet","Property: Pinnacle Tower, Suite 1400 (Floor 14), Financial District","Landlord: Pinnacle Commercial Holdings LLC | Prospective Tenant: NexaTech Software Corp.","Date: October 20, 2026","Key Proposed Terms:","- Leased Premises: 12,500 rentable square feet (RSF) of Class-A corporate office space.","- Initial Lease Term: 60 calendar months (Commencing January 1, 2027).","- Base Rental Rate: $52.00 per RSF annually ($54,166.67 per month), with a fixed 3% annual escalation starting Year 2.","- Security Deposit: Equivalent to three (3) months of initial base rent ($162,500.00), payable in full via wire transfer upon contract signing.","- Operating Expenses \u0026 CAM (Common Area Maintenance): Proportionate share based on tenant occupying 10% of total building rentable area. Estimated initial CAM rate: $9.20 per RSF annually.","- Parking Allocation: 25 reserved subterranean spaces at a preferential rate of $180.00 per stall per month.","- Lease Expiration Option: Tenant holds a one-time option to renew for an additional 36 months at prevailing 95% fair market rental value, provided written notification is served at least 9 months prior to lease expiration.","Internal Memorandum (Executive Review \u0026 Negotiation Counter-Proposal)","NexaTech Software Corp. — Real Estate \u0026 Facilities Committee","To: Arthur Pendelton, Chief Executive Officer","From: Sabrina Lin, Vice President of Corporate Operations","Date: October 24, 2026","Subject: Pinnacle Tower Suite 1400 — Lease Term Sheet Recommendations","Arthur,","Our legal counsel and financial planning team have thoroughly analyzed the proposed Pinnacle Tower lease term sheet. While the physical layout and telecommunications infrastructure align with our engineering headcount growth over the next five years, we recommend negotiating three critical financial provisions prior to signing:","1. Security Deposit Relief: Requiring $162,500 in upfront cash ties up capital needed for our server deployment. We should counter with a two-month cash deposit ($108,333.34) combined with an irrevocable bank Letter of Credit (LC) covering the third month.","2. CAM Expense Caps \u0026 Audit Rights: The term sheet currently lacks a cap on controllable CAM operating expenses. We must require an annual cap of 5% on controllable expenses (security, janitorial, landscaping) and insist on an explicit clause granting us annual audit rights to inspect building accounting ledgers within 60 days of receiving the year-end reconciliation statement.","3. Dedicated Server Room Cooling: We need written confirmation that supplemental chilled-water connections for our dedicated 24/7 server room will be provided without additional base infrastructure surcharges.","Please authorize these counter-terms so I can transmit them to Pinnacle Holdings today.","E-mail (Final Landlord Acceptance \u0026 Lease Execution Confirmation)","To: Sabrina Lin \u003cs.lin@nexatech.com\u003e","From: Gregory Vance \u003cg.vance@pinnacleholdings.com\u003e","Date: October 27, 2026","Subject: Re: Counter-Proposal \u0026 Final Execution — Pinnacle Tower Suite 1400","Dear Ms. Lin,","Thank you for transmitting NexaTech\u0027s recommendations regarding the lease term sheet for Suite 1400. After consulting with our investment asset managers, Pinnacle Commercial Holdings is pleased to confirm that we have accepted your proposed modifications with the following operational specifications:","1. Security Deposit Structure: We accept the combination of a two-month cash wire transfer ($108,333.34) and a one-month clean, irrevocable standby Letter of Credit from a federally chartered commercial bank.","2. Operating Expense Protection: We have incorporated a 5% cumulative ceiling on all controllable operating expenses. Furthermore, Section 8.4 of the finalized agreement explicitly grants NexaTech the right to engage an independent CPA firm to audit our annual operating expense statements, provided your notice is submitted within 60 days of receipt.","3. Supplemental Infrastructure: We have approved your supplemental chilled-water tie-in for the 14th-floor IT data center. The initial connection fee of $5,000 will be completely waived as a signing incentive.","The final execution contract has been uploaded to our secure legal portal. Please have Mr. Pendelton execute the digital signature by October 31 so our facility team can begin turnover preparations on November 15.","Best regards,","Gregory Vance","Senior Managing Director, Commercial Asset Leasing","Pinnacle Commercial Holdings LLC","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","186 What is the primary purpose of Ms. Lin\u0027s memorandum?","(A) To request approval to terminate a commercial real estate contract","(B) To recommend revisions to a prospective office lease agreement","(C) To announce the completion of an annual financial audit","(D) To solicit bids from corporate janitorial service vendors","187 According to the term sheet, how much was originally requested as a security deposit?","(A) $54,166.67","(B) $108,333.34","(C) $162,500.00","(D) $270,833.35","188 What compromise was agreed upon regarding the security deposit payment?","(A) Pinnacle Holdings waived the deposit entirely for the first year.","(B) NexaTech will pay the full amount over 12 equal monthly installments.","(C) NexaTech will provide two months in cash and a bank letter of credit for the rest.","(D) The deposit was converted into an equity share in Pinnacle Tower.","189 The word \"stipulate\" in the context of commercial lease terms is closest in meaning to","(A) specify","(B) estimate","(C) cancel","(D) postpone","190 What is NOT mentioned as an accepted modification in Mr. Vance\u0027s e-mail?","(A) A 5% ceiling on controllable operating expenses","(B) The right to conduct an independent financial audit of CAM statements","(C) The complete waiver of the initial server cooling connection fee","(D) A reduction in the monthly parking stall rental fee","1.2. Hướng dẫn làm bài Part 7: Chiến lược 5 phút tối ưu","CHIẾN THUẬT 5 PHÚT TỐI ƯU: NẮM BẮT BỐI CẢNH, GHÉP NỐI DỮ KIỆN \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Luồng quy trình Đoạn ba (Quỹ đạo Quét chữ Z \u0026 Bộ lọc 3 Câu hỏi Tiềm thức): • Quỹ đạo hình chữ Z (Z-Pattern Eye Scan) qua 3 văn bản:","- Văn bản 1 (Term Sheet - Bản tóm tắt điều khoản thuê): Điểm chạm 1: \u0027Pinnacle Tower, Suite 1400 (Floor 14)\u0027 (Q1: Bản tóm tắt điều khoản thuê văn phòng tầng 14). Điểm chạm 2: \u002712,500 RSF | $52.00/RSF | Security Deposit: 3 months ($162,500.00)\u0027 (Q2: Diện tích 12.500 sq. ft., tiền cọc 3 tháng tương đương 162.500 USD). Điểm chạm 3: \u0027Estimated CAM $9.20/RSF | 25 parking spaces\u0027 (Q3: Chi phí vận hành chung và số lượng chỗ đỗ xe).","- Văn bản 2 (Memo - Bản kiến nghị đàm phán nội bộ): Điểm chạm 1: \u0027Recommendations on Pinnacle Tower Lease\u0027 (Q1: Đề xuất đàm phán lại các điều khoản cọc và chi phí). Điểm chạm 2: \u0027From: Sabrina Lin, VP of Corporate Operations to CEO Arthur Pendelton\u0027 (Q2: Phó chủ tịch vận hành trình CEO phê duyệt phương án phản hồi). Điểm chạm 3: \u0027Counter-terms: (1) 2 months cash + 1 month LC; (2) 5% CAM cap \u0026 audit rights; (3) Dedicated cooling\u0027 (Q3: 3 yêu cầu giảm tải vốn đọng và chặn đội chi phí tòa nhà).","- Văn bản 3 (Email - Thư chấp thuận từ chủ tòa nhà): Điểm chạm 1: \u0027Re: Counter-Proposal \u0026 Final Execution\u0027 (Q1: Xác nhận chấp thuận điều khoản sửa đổi). Điểm chạm 2: \u0027Gregory Vance, Senior Managing Director, Pinnacle Commercial Holdings\u0027 (Q2: Chủ tòa nhà gửi lại xác nhận). Điểm chạm 3: \u0027Accept 2 months cash + 1 month LC... 5% cap \u0026 60-day audit... waive $5,000 cooling fee... sign by Oct 31\u0027 (Q3: Chấp nhận toàn bộ 3 yêu cầu, miễn phí 5.000 USD đấu nối làm mát máy chủ, yêu cầu ký trước 31/10).","• Xâu chuỗi giao dịch: Chủ tòa nhà đưa ra biểu mẫu cọc 3 tháng tiền mặt $162.500 và CAM mở (Văn bản 1) -\u003e Khách thuê phần mềm đề xuất giảm cọc tiền mặt xuống 2 tháng + 1 tháng bảo lãnh ngân hàng L/C và áp trần CAM 5% (Văn bản 2) -\u003e Chủ tòa nhà chấp thuận toàn bộ và miễn thêm 5.000 USD phí hạ tầng máy chủ (Văn bản 3).","Bước 2 (20 giây) - Quét nhanh 5 câu hỏi \u0026 Gắn móc từ khóa (Mental Hooks - KHÔNG đọc đáp án): • Q186: \u0027primary purpose of Ms. Lin\u0027s memorandum\u0027 -\u003e Móc: Mục đích bản ghi nhớ nội bộ (Văn bản 2).","• Q187: \u0027According to term sheet, how much originally requested as security deposit\u0027 -\u003e Móc: Số tiền cọc gốc trong Term Sheet (Văn bản 1).","• Q188: \u0027compromise agreed upon regarding security deposit payment\u0027 -\u003e Móc ghép nối: Thỏa hiệp thống nhất về tiền cọc (Văn bản 2 + 3).","• Q189: \u0027word \"stipulate\" in context of commercial lease\u0027 -\u003e Móc: Từ vựng chuyên ngành \u0027stipulate\u0027 (Văn bản 1).","• Q190: \u0027What is NOT mentioned as an accepted modification in Mr. Vance\u0027s e-mail\u0027 -\u003e Móc: Điều khoản KHÔNG được sửa đổi (Văn bản 3).","Bước 3 (3 phút 45 giây) - Cách trả lời \u0026 Dấu hiệu tìm nhanh nhất cho đủ 5 câu hỏi: • Q186 (Mục đích - 20s): [Dấu hiệu nhanh]: Đọc dòng Subject và 2 câu đầu của Memo: \u0027Pinnacle Tower Suite 1400 — Lease Term Sheet Recommendations... we recommend negotiating three critical financial provisions prior to signing\u0027 -\u003e Khuyến nghị sửa đổi các điều khoản hợp đồng thuê trước khi ký -\u003e Chọn (B).","• Q187 (Chi tiết - 25s): [Dấu hiệu nhanh]: Nhìn thẳng vào dòng \u0027Security Deposit\u0027 ở Văn bản 1: \u0027Equivalent to three (3) months of initial base rent ($162,500.00)\u0027 -\u003e Số tiền cọc ban đầu được yêu cầu là $162.500,00 -\u003e Chọn (C).","• Q188 (Ghép nối Cross-referencing - 45s): [Dấu hiệu nhanh]: Văn bản 2 đề xuất: \u0027counter with a two-month cash deposit ($108,333.34) combined with an irrevocable bank Letter of Credit (LC) covering the third month\u0027. Gióng sang Văn bản 3 mục 1: \u0027We accept the combination of a two-month cash wire transfer ($108,333.34) and a one-month clean, irrevocable standby Letter of Credit\u0027 -\u003e Thỏa thuận 2 tháng tiền mặt và 1 tháng bảo lãnh thư tín dụng ngân hàng -\u003e Chọn (C).","• Q189 (Từ vựng ngữ cảnh - 20s): [Dấu hiệu nhanh]: \u0027Stipulate\u0027 trong văn bản hợp đồng pháp lý có nghĩa là quy định, nêu rõ điều kiện (specify / require / state expressly) -\u003e Chọn (A).","• Q190 (Câu NOT - 45s): [Dấu hiệu nhanh]: Quét nhanh 3 điều khoản được chấp nhận trong Email của ông Vance: (1) Cọc tiền mặt + L/C; (2) Trần trần CAM 5% \u0026 quyền kiểm toán (A \u0026 B); (3) Miễn phí kết nối 5.000 USD hạ tầng làm mát (C). Riêng giá thuê chỗ đỗ xe (Parking fee: $180/xe/tháng) không hề được nhắc đến việc giảm giá -\u003e Chọn (D).","Bước 4 (25 giây cuối + Đúc kết Feynman): • Khóa sổ 5 đáp án: 186-B, 187-C, 188-C, 189-A, 190-D.","• Tóm tắt Feynman 1 câu: \u0027Hãng công nghệ NexaTech đàm phán thành công hợp đồng thuê văn phòng hạng A tầng 14 khi thuyết phục chủ tòa nhà cho giảm tiền cọc mặt từ 3 tháng ($162.500) xuống 2 tháng kèm 1 tháng bảo lãnh ngân hàng L/C, khóa trần tăng phí dịch vụ chung ở mức 5% và miễn luôn 5.000 USD phí làm mát phòng server.\u0027","1.3. Dịch Song ngữ Xen kẽ Từng Câu (Sentence-by-Sentence Translation)","Commercial Lease Agreement Term Sheet (Bảng Tóm tắt Điều khoản Hợp đồng Thuê Thương mại)","Property: Pinnacle Tower, Suite 1400 (Floor 14), Financial District","Landlord: Pinnacle Commercial Holdings LLC | Prospective Tenant: NexaTech Software Corp.","Date: October 20, 2026","Bất động sản: Tháp Pinnacle, Gian 1400 (Tầng 14), Khu Tài chính","Bên Cho thuê: Công ty TNHH Bất động sản Thương mại Pinnacle | Bên Thuê tiềm năng: Công ty Phần mềm NexaTech","Ngày: 20 tháng 10, 2026","Leased Premises: 12,500 rentable square feet (RSF) of Class-A corporate office space.","Mặt bằng cho thuê: 12.500 foot vuông tính tiền thuê (RSF) không gian văn phòng doanh nghiệp Hạng A.","Initial Lease Term: 60 calendar months (Commencing January 1, 2027).","Thời hạn thuê ban đầu: 60 tháng dương lịch (Bắt đầu từ ngày 1 tháng 1 năm 2027).","Base Rental Rate: $52.00 per RSF annually ($54,166.67 per month), with a fixed 3% annual escalation starting Year 2.","Giá thuê gốc: 52,00 USD trên mỗi foot vuông RSF hàng năm (54.166,67 USD/tháng), với mức trượt giá cố định 3% hàng năm bắt đầu từ Năm 2.","Security Deposit: Equivalent to three (3) months of initial base rent ($162,500.00), payable in full via wire transfer upon contract signing.","Tiền cọc bảo đảm: Tương đương ba (3) tháng tiền thuê gốc ban đầu (162.500,00 USD), thanh toán toàn bộ qua chuyển khoản ngân hàng ngay khi ký hợp đồng.","Operating Expenses \u0026 CAM (Common Area Maintenance): Proportionate share based on tenant occupying 10% of total building rentable area.","Chi phí vận hành \u0026 Phí bảo trì khu vực chung (CAM): Phân bổ theo tỷ lệ dựa trên việc b
