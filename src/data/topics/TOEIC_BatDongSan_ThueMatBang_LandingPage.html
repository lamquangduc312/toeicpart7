 nguyên trạng mặt bằng cũ (Restoration to Original Condition) theo Điều 24 để thu hồi tối đa tiền cọc bảo đảm.","2. Context \u0026 Core Workflow: Large-scale corporate headquarters relocation and lease surrender administration. Executing a zero-downtime IT migration over a 4-phase weekend while fulfilling end-of-lease physical restoration covenants to maximize security deposit recovery."]],[["3. Dau vet suy luan cheo"],["3. Dấu vết suy luận chéo: Ghép nối thời gian chuyển máy chủ ban đêm ở Văn bản 2 (Phase 2: 11 PM Fri - 6 AM Sat) với quy định làm việc từ xa ở Văn bản 1. Tính toán số tiền trừ cọc ($3.400 + $2.100 = $5.500) ở Văn bản 3 để đối chiếu với số tiền hoàn trả $174.500.","3. Cross-Referencing Clues: Linking Phase 2 server transport (11 PM Fri - 6 AM Sat) in Passage 2 with remote work provisions in Passage 1. Verifying deposit deduction math ($3,400 + $2,100 = $5,500) in Passage 3 against the net refund of $174,500."]]],"t":"table"},"PHẦN 3: ĐÁP ÁN CHUẨN XÁC \u0026 DẤU VẾT TRUY XUẤT CHÉO (CROSS-REFERENCING \u0026 COMPREHENSIVE TRAP BREAKDOWN)","What is the primary purpose of the memorandum sent by Nexus Interactive?","Dap an dung: (B) To outline the schedule and instructions for a corporate headquarters relocation","[Dau vet bai doc / Clue]: Memorandum, Tiêu đề \u0026 Đoạn 1: \u0027Subject: Phased Transition Schedule: Relocation to Horizon Center... officially relocate our global corporate headquarters... over the weekend of November 13-15... Key Relocation Milestones \u0026 Protocols...\u0027","[Dien dat tuong duong / Paraphrase]: Phased Transition Schedule: Relocation to Horizon Center \u003c=\u003e outline the schedule and instructions for a corporate headquarters relocation","[Loi giai chi tiet]: Bản ghi nhớ của ban lãnh đạo Nexus Interactive gửi toàn thể nhân viên nhằm mục đích thông báo lịch trình và hướng dẫn chi tiết từng bước cho đợt chuyển dọn toàn bộ trụ sở chính sang tòa nhà mới.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) To announce the opening of a new international branch in London","- Ly do sai: Văn bản thông báo chuyển trụ sở trong cùng thành phố chứ không mở chi nhánh quốc tế mới.","- Bay ETS: Bẫy Mở Chi nhánh Quốc tế (International Expansion Trap)","(C) To solicit bids from commercial office moving contractors","- Ly do sai: Công ty đã thuê xong MetroFleet Movers rồi, không phải tìm kiếm nhà thầu chuyển nhà.","- Bay ETS: Bẫy Giai đoạn Mua sắm (Vendor Procurement Trap)","(D) To inform employees about mandatory salary reductions","- Ly do sai: Không có thông tin giảm lương nhân viên; thậm chí công ty còn tổ chức tiệc chào mừng tại văn phòng mới.","- Bay ETS: Bẫy Cắt giảm Tiêu cực (Negative Salary Trap)","According to the logistics schedule, when will the company\u0027s servers be transported?","Dap an dung: (C) Overnight between Friday night and Saturday morning","[Dau vet bai doc / Clue]: Move Schedule, Phase 2: \u0027Phase 2 (Friday, Nov 13, 11:00 PM - Saturday, Nov 14, 06:00 AM): Dedicated high-security transport of 12 server racks and core fiber switches using specialized dual-suspension refrigerated transport vehicles.\u0027","[Dien dat tuong duong / Paraphrase]: Friday, Nov 13, 11:00 PM - Saturday, Nov 14, 06:00 AM \u003c=\u003e Overnight between Friday night and Saturday morning","[Loi giai chi tiet]: Lịch trình của công ty vận chuyển MetroFleet ghi rõ Phase 2 dành cho việc chuyển 12 tủ rack máy chủ diễn ra xuyên đêm từ 11:00 đêm Thứ Sáu (13/11) đến 06:00 sáng Thứ Bảy (14/11).","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Thursday afternoon before 05:00 PM","- Ly do sai: Đây là hạn chót để nhân viên đóng gói đồ dùng cá nhân vào thùng nhựa có mã vạch.","- Bay ETS: Bẫy Hạn chót Đóng thùng (Crating Deadline Trap)","(B) Friday evening between 06:00 PM and 11:00 PM","- Ly do sai: Khung giờ này là Phase 1 dành cho việc chuyển thùng tài liệu nhân viên và bàn ghế phòng họp.","- Bay ETS: Bẫy Giai đoạn 1 (Phase 1 Furniture Trap)","(D) Sunday afternoon between 09:00 AM and 04:00 PM","- Ly do sai: Khung giờ này là Phase 4 dành cho việc dọn rác và quét dọn tòa nhà cũ.","- Bay ETS: Bẫy Giai đoạn Dọn dẹp Cuối cùng (Phase 4 Sweep Trap)","How much money will be deducted from Nexus Interactive\u0027s security deposit?","Dap an dung: (C) $5,500.00","[Dau vet bai doc / Clue]: Settlement Notice, Bảng kê Deductions: \u00271. Drywall Patching \u0026 Paint Touch-up: $3,400.00; 2. Industrial Hot-Water Steam Carpet Cleaning: $2,100.00; Total Allowable Deductions: $5,500.00.\u0027","[Dien dat tuong duong / Paraphrase]: Total Allowable Deductions: $5,500.00 \u003c=\u003e $5,500.00 will be deducted from security deposit","[Loi giai chi tiet]: Thông báo quyết toán tiền cọc của chủ tòa nhà cũ ghi rõ tổng số tiền khấu trừ hợp lệ cho việc vá lỗ khoan tường treo màn hình ($3.400) và giặt thảm tẩy vết ố ($2.100) là đúng 5.500,00 USD.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) $2,100.00","- Ly do sai: Đây chỉ là chi phí giặt thảm công nghiệp.","- Bay ETS: Bẫy Chi phí Đơn lẻ (Carpet Only Trap)","(B) $3,400.00","- Ly do sai: Đây chỉ là chi phí vá tường thạch cao và sơn dặm.","- Bay ETS: Bẫy Chi phí Đơn lẻ (Drywall Only Trap)","(D) $174,500.00","- Ly do sai: Đây là số tiền cọc ròng được hoàn trả vào tài khoản ngân hàng, không phải số tiền bị trừ.","- Bay ETS: Bẫy Số tiền Hoàn trả Ròng (Net Refund Confusion Trap)","The word \"surrender\" in paragraph 1 of the settlement notice is closest in meaning to","Dap an dung: (A) relinquishment","[Dau vet bai doc / Clue]: Settlement Notice context: \u0027...formal lease surrender walkthrough of Floors 9 and 10 on November 20... satisfying restoration requirements under Section 24 (Surrender of Premises)...\u0027","[Dien dat tuong duong / Paraphrase]: lease surrender \u003c=\u003e relinquishment of premises / handover of leased space","[Loi giai chi tiet]: Thuật ngữ pháp lý \u0027surrender of premises\u0027 (trả lại mặt bằng thuê) có nghĩa là sự từ bỏ quyền sở hữu sử dụng và bàn giao lại mặt bằng cho chủ nhà (relinquishment / return / handover).","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(B) expansion","- Ly do sai: \u0027Expansion\u0027 là sự mở rộng quy mô, trái ngược với việc trả lại văn phòng.","- Bay ETS: Bẫy Trái nghĩa Trực tiếp (Opposite Meaning Trap)","(C) construction","- Ly do sai: \u0027Construction\u0027 là hoạt động xây dựng xây lắp.","- Bay ETS: Bẫy Hoạt động Kỹ thuật (Construction Echo)","(D) destruction","- Ly do sai: \u0027Destruction\u0027 là sự phá hủy tàn phá công trình.","- Bay ETS: Bẫy Nghĩa Tiêu cực Cực đoan (Extreme Destruction Trap)","What is indicated about Nexus Interactive employees in the memorandum?","Dap an dung: (A) They will work remotely on Friday, November 13, and Monday, November 16.","[Dau vet bai doc / Clue]: Memorandum, Mục Remote Work Bridge: \u0027All employees will work remotely on Friday, November 13, and Monday, November 16, while our facilities crew completes workstation network drops and ergonomic adjustments.\u0027","[Dien dat tuong duong / Paraphrase]: work remotely on Friday, Nov 13, and Monday, Nov 16 \u003c=\u003e work remotely on Friday, November 13, and Monday, November 16","[Loi giai chi tiet]: Bản ghi nhớ của công ty nêu rõ trong phần cầu nối làm việc từ xa: Toàn thể nhân viên sẽ làm việc tại nhà vào Thứ Sáu (13/11) và Thứ Hai (16/11) để đội kỹ thuật hoàn tất đấu nối mạng và chỉnh bàn ghế trước ngày mở cửa 17/11.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(B) They must physically carry their computer monitors to the new building.","- Ly do sai: Màn hình máy tính nặng sẽ do công ty vận chuyển MetroFleet dán thẻ và chuyển đi, nhân viên không phải tự vác.","- Bay ETS: Bẫy Vận chuyển Màn hình (Monitor Transport Trap)","(C) They are required to unpack all server racks on Sunday, November 15.","- Ly do sai: Việc lắp đặt máy chủ do 6 kỹ sư CNTT chuyên nghiệp đảm nhiệm vào Thứ Bảy, không phải nhân viên thông thường.","- Bay ETS: Bẫy Lắp đặt Máy chủ (Server Unpacking Trap)","(D) They must report to Horizon Center on Saturday morning for network testing.","- Ly do sai: Nhân viên chỉ có mặt tại văn phòng mới vào sáng Thứ Ba ngày 17 tháng 11.","- Bay ETS: Bẫy Ngày Có mặt Đầu tiên (First Day Mismatch Trap)","PHẦN 4: KỸ THUẬT FEYNMAN SONG NGỮ \u0026 SƠ ĐỒ QUY TRÌNH (TƯ DUY PHÂN TÍCH NGHIỆP VỤ \u0026 BA)","4.1. Sơ đồ Quy trình Luân chuyển Nghiệp vụ (Corporate Relocation \u0026 Surrender Workflow)","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","ĐÓNG THÙNG MÃ VẠCH \u0026 THIẾT LẬP CẦU NỐI TỪ XA"],[],["BƯỚC 2","VẬN CHUYỂN SERVER ĐÊM \u0026 ĐẤU NỐI MẠNG TÒA NHÀ MỚI"],[],["BƯỚC 3","NGHIỆM THU HOÀN TRẢ HIỆN TRẠNG \u0026 QUYẾT TOÁN CỌC $174.500"]],[["• Chung tu \u0026 Kenh: Thông báo Chuyển Trụ sở Doanh nghiệp \u0026 450 Thùng Nhựa Mã vạch","• Nghiep vu thuc thi: Nhân viên đóng gói đồ dùng cá nhân trước 17h00 ngày 12/11; kích hoạt chế độ làm việc từ xa 2 ngày (13 \u0026 16/11) cho 450 nhân sự để giải phóng mặt bằng cho nhà thầu dọn dẹp chuyên nghiệp.","• Ket qua \u0026 Kiem soat: Hoàn tất khâu chuẩn bị mặt bằng không làm gián đoạn hiệu suất làm việc của công ty."],["➔"],["• Chung tu \u0026 Kenh: Đội Xe Tải Chuyên dụng Giảm Chấn Bóng Hơi \u0026 Kỹ thuật viên CNTT MetroFleet","• Nghiep vu thuc thi: Di chuyển 12 tủ rack máy chủ và thiết bị mạng cáp quang xuyên đêm (23h00 - 6h00) bằng xe chuyên dụng giảm chấn; lắp đặt bàn ghế mô-đun và chạy kiểm thử cổng mạng tại tháp Horizon tầng 28-30.","• Ket qua \u0026 Kiem soat: Hạ tầng đám mây hoạt động liên tục 100%, sẵn sàng đón nhân viên vào sáng 17/11."],["➔"],["• Chung tu \u0026 Kenh: Biên bản Nghiệm thu Bàn giao (Lease Surrender) \u0026 Lệnh Chuyển tiền Ngân hàng","• Nghiep vu thuc thi: Đoàn kiểm tra tháo dỡ vách ngăn và dây cáp thừa; thỏa thuận cấn trừ 5.500 USD (vá tường và giặt thảm) vào tiền cọc 180.000 USD; chủ tòa nhà cũ giải ngân lệnh chuyển tiền 174.500 USD.","• Ket qua \u0026 Kiem soat: Chấm dứt hoàn toàn nghĩa vụ pháp lý hợp đồng cũ và thu hồi 97% tiền cọc ban đầu."]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["STEP 1","BARCODED CRATING \u0026 REMOTE CONTINUITY BRIDGE"],[],["STEP 2","OVERNIGHT IT TRANSPORT \u0026 NEW SUITE NETWORK DROPS"],[],["STEP 3","SURRENDER WALKTHROUGH \u0026 $174,500 DEPOSIT RECOVERY"]],[["• Documents \u0026 Channels: Corporate Relocation Memo \u0026 450 Scannable Plastic Crates","• Core Business Execution: Personnel seal personal belongings by 5:00 PM Nov 12; establish a 2-day remote continuity bridge (Nov 13 \u0026 16) for 450 staff, clearing floorplates for commercial movers.","• Key Deliverable \u0026 Control: Operational transition staging completed without enterprise productivity losses."],["➔"],["• Documents \u0026 Channels: Air-Ride Climate-Controlled Vans \u0026 MetroFleet IT Specialists","• Core Business Execution: Transport 12 mission-critical server racks overnight (11 PM Fri - 6 AM Sat) via dual-suspension vehicles; install ergonomic modular workstations and complete cabling on Floors 28-30.","• Key Deliverable \u0026 Control: Zero streaming server outages; new headquarters fully functional for Nov 17 opening."],["➔"],["• Documents \u0026 Channels: Joint Surrender Punch List \u0026 Bank Wire Transfer (#WTR-99021)","• Core Business Execution: Audit partition/cabling removal; reconcile $5,500 punch-list deductions ($3,400 drywall patching + $2,100 carpet steam extraction); landlord wires $174,500 net deposit balance.","• Key Deliverable \u0026 Control: Former lease liabilities legally terminated with a 97% capital recovery rate."]]],"t":"table"},"4.2. Tư duy Phân tích Nghiệp vụ \u0026 BA (Bản Tiếng Việt)","• Bức tranh Toàn cảnh Nghiệp vụ (End-to-End Flow): Trong quản trị văn phòng doanh nghiệp quy mô lớn (Enterprise Facilities \u0026 Workplace Strategy), quy trình di dời trụ sở (Corporate Relocation) là dự án phức hợp liên phòng ban: Ban điều hành (C-Suite) - Khối Vận hành \u0026 Cơ sở vật chất (Facilities) - Khối Công nghệ Thông tin (IT Infrastructure) - Đơn vị chuyển nhà thương mại (Commercial Logistics Vendor) - Chủ tòa nhà cũ \u0026 Chủ tòa nhà mới. Chu trình khép kín từ: Kế hoạch phân kỳ dọn dẹp -\u003e Đóng gói mã vạch phân tầng -\u003e Di chuyển trung tâm dữ liệu không gián đoạn (Zero-Downtime Server Migration) -\u003e Bàn giao trả mặt bằng cũ (Lease Surrender) -\u003e Quyết toán thu hồi tiền cọc ngân hàng (Security Deposit Recovery).","• Điểm nghẽn \u0026 Rủi ro Vận hành Thực tế (Core Bottleneck \u0026 Risk): Hai điểm nghẽn rủi ro sống còn trong đợt chuyển văn phòng: (1) Sập mạng máy chủ trong quá trình di chuyển (Server Hardware Shock \u0026 Latency): Rung lắc trên xe tải có thể làm hỏng ổ cứng hoặc gãy chân bo mạch máy chủ, làm tê liệt dịch vụ truyền thông trực tuyến toàn cầu của doanh nghiệp; (2) Tranh chấp hoàn trả hiện trạng mặt bằng (Make-Good / Restoration Disputes): Chủ tòa nhà cũ có thể vin vào các vết khoan tường treo tivi hoặc vết ố thảm để giam lỏng toàn bộ 180.000 USD tiền cọc trong nhiều tháng.","• 3 Giải pháp Thiết kế Hệ thống \u0026 Kiểm soát Nghiệp vụ (BA \u0026 Relocation Architecture):","(1) Kịch bản Vận chuyển Server Bằng Xe Giảm Chấn Khí Nén Chuyên Dụng (Air-Ride Climate-Controlled Logistics Protocol): Bắt buộc hợp đồng chuyển nhà phải chỉ định dòng xe tải chuyên dụng có hệ thống treo bóng hơi (Air-Ride Suspension) và điều hòa thùng xe liên tục 20°C, chuyển dọn vào khung giờ đêm 23h00-06h00 khi đường phố vắng nhất để triệt tiêu mọi rung chấn cơ học và rủi ro ùn tắc giao thông.","(2) Cơ chế Cầu nối Làm việc Từ xa Linh hoạt (Remote Work Continuity Bridge): Để bảo đảm an toàn lao động và tạo không gian 100% cho thợ kỹ thuật kéo dây cáp mạng và căn chỉnh bàn ghế, công ty cho nhân viên làm việc tại nhà vào Thứ Sáu và Thứ Hai. Giải pháp này giúp loại bỏ 100% rủi ro thương tích và bảo đảm ngày đầu tiên nhân viên bước vào văn phòng mới (Thứ Ba) là một trải nghiệm hoàn hảo không tì vết.","(3) Quy trình Đối soát Nghiệm thu Hoàn trả Hiện trạng Nhanh (Streamlined Make-Good Punch List Settlement): Thay vì tự thuê thợ ngoài vào sơn sửa lắt nhắt kéo dài thời gian bàn giao, đại diện khách thuê chủ động thỏa thuận danh mục cấn trừ hợp lý (Allowable Deductions: 3.400 USD vá tường + 2.100 USD giặt thảm) với chủ tòa nhà cũ. Việc nhượng bộ 5.500 USD (chưa đầy 3% tiền cọc) giúp doanh nghiệp giải phóng ngay lập tức 174.500 USD tiền mặt về tài khoản ngân hàng trong vòng 4 ngày.","• Tam giác Liên kết Nhận thức Đa chiều (Multi-Perspective Contextual Anchoring):","- Lăng kính Viễn thông / CNTT Viettel: Bài toán di dời Trung tâm Vận hành Mạng lưới Viettel (NOC - Network Operations Center). Khi chuyển trụ sở điều hành mạng từ tòa nhà cũ sang trụ sở mới tại Cầu Giấy, các kỹ sư viễn thông Viettel phải thiết lập đường truyền cáp quang song song chạy dự phòng 1:1, chuyển đổi từng cụm tổng đài vào ban đêm và bảo đảm khách hàng trên toàn quốc vẫn gọi điện, truy cập 4G/5G bình thường mà không hề hay biết trung tâm đầu não đang di chuyển.","- Lăng kính Quản trị Mầm non Ước Mơ Xanh: Khi trường mầm non chuyển sang một điểm trường mới khang trang hơn, cô Thu Huyền lên kế hoạch di dời vào tuần nghỉ hè: Các giáo cụ STEAM thông minh, sách truyện và đồ chơi bằng gỗ được đóng vào từng thùng nhựa dán tên lớp cụ thể; đội thợ chuyển bàn ghế và lắp đặt lại camera an ninh trước; đồng thời trường thuê đội sơn bả dọn sạch sẽ điểm trường cũ để bàn giao lại cho chủ nhà nhằm nhận lại đầy đủ 100% tiền cọc thuê nhà ban đầu.","- Lăng kính Bàn học Gia đình (Kèm cặp Bé Hà Ngân Lớp 5): Bài học về \u0027Tính ngăn nắp, kỷ luật và phân loại đồ dùng\u0027: Khi gia đình chuyển nhà hoặc chuẩn bị dọn dẹp góc học tập đón năm mới, bố hướng dẫn Hà Ngân cách phân loại đồ dùng vào các thùng carton có dán nhãn (giống như thùng mã vạch của công ty): Thùng nào đựng sách giáo khoa, thùng nào đựng gấu bông, thùng nào đựng bút màu; đồ đạc xếp gọn gàng thì khi sang phòng mới con sẽ tìm thấy ngay món đồ mình cần mà không bị thất lạc.","4.3. Business Analyst Executive Summary (Bản Tiếng Anh)","• End-to-End Business \u0026 Facility Context: Enterprise corporate relocation encompasses cross-functional program management reconciling workplace strategy, mission-critical infrastructure cutovers, specialized freight logistics, and end-of-lease surrender covenants. The execution model coordinates phased workstation packing, overnight data center transport, remote work business continuity, and capital security deposit reconciliations.","• Core Operational Bottleneck \u0026 Risk: The primary vulnerabilities center on infrastructure downtime and unliquidated lease-end restoration friction. Physical shock or thermal excursions during server transit can induce catastrophic hardware failures across live media streaming architectures. Furthermore, protracted \u0027make-good\u0027 disputes over tenant alterations can freeze corporate collateral deposits ($180,000) for extended calendar quarters.","• Key BA \u0026 System Architecture Solutions:","(1) Air-Ride Dual-Suspension Logistics Governance: Enforce strict logistical covenants mandating climate-stabilized, dual-suspension transport platforms deployed exclusively within designated low-traffic overnight windows (11 PM Fri - 6 AM Sat), permanently safeguarding sensitive core IT switching assets.","(2) Phased Remote Continuity Protocols: Deploy dual-day remote work bridges (Nov 13 \u0026 16) insulating 450 corporate knowledge workers from physical site hazard exposure while providing facility crews unimpeded access for workstation cable drops and ergonomic calibration.","(3) Proactive Surrender Deduction Reconciliation: Mitigate administrative latency by pre-negotiating reasonable restoration offsets ($3,400 drywall + $2,100 carpet = $5,500), achieving immediate closure and unlocking $174,500 in liquid capital wire returns within 4 business days of surrender walkthroughs.","PHẦN 5: TỪ VỰNG \u0026 PARAPHRASE CHUYÊN SÂU (CHUẨN 3 DÒNG TỐI ƯU NẠP ANKI)","Surrender  /səˈrɛndər/  Relinquishment / Handover of Leased Premises / Formal Tenancy Termination","Nghia: Bàn giao trả lại mặt bằng thuê cho chủ nhà khi hợp đồng kết thúc.","Vd: The tenant completed the formal lease surrender inspection on November 20. - Bên thuê đã hoàn tất chuyến kiểm tra thực địa nghiệm thu bàn giao trả lại mặt bằng vào ngày 20 tháng 11.","Relocation  /ˌriːloʊˈkeɪʃn/  Corporate Move / Facility Transfer / Headquarters Transition","Nghia: Hoạt động di dời trụ sở, chuyển văn phòng từ địa điểm cũ sang địa điểm mới.","Vd: Nexus Interactive executed a phased relocation of its corporate headquarters over the weekend. - Tập đoàn Nexus Interactive đã tiến hành đợt di dời phân kỳ trụ sở doanh nghiệp trong kỳ nghỉ cuối tuần.","Decommission  /ˌdiːkəˈmɪʃn/  Shut Down Safely / Dismantle / Take Out of Operational Service","Nghia: Ngắt nguồn an toàn, tháo dỡ thiết bị máy móc và đưa ra khỏi trạng thái vận hành.","Vd: Technicians worked overnight to decommission the server racks prior to transport. - Các kỹ thuật viên đã làm việc xuyên đêm để ngắt nguồn tháo dỡ các tủ rack máy chủ trước khi vận chuyển.","Restoration  /ˌrɛstəˈreɪʃn/  Reinstatement / Make-Good Obligation / Returning to Original Condition","Nghia: Công tác phục hồi, hoàn trả mặt bằng về nguyên trạng ban đầu theo quy định hợp đồng.","Vd: The lease agreement required the physical restoration of the office space before deposit release. - Hợp đồng thuê yêu cầu phải hoàn trả nguyên trạng cơ sở vật chất văn phòng trước khi giải tỏa tiền cọc.","Deduction  /dɪˈdʌkʃn/  Offset / Subtraction / Withholding from Deposit / Expense Chargeback","Nghia: Khoản khấu trừ, số tiền bị trừ bớt vào tiền cọc bảo đảm để chi trả cho các hư hại sửa chữa.","Vd: A total deduction of $5,500 was applied for wall patching and carpet cleaning. - Tổng số tiền khấu trừ 5.500 USD đã được áp dụng cho việc vá tường và giặt thảm.","Ergonomic  /ˌɜːrɡəˈnɑːmɪk/  Human-Engineered / Posture-Optimized / Workplace Health Designed","Nghia: Thuộc về công thái học, thiết kế tối ưu cho tư thế và sức khỏe người lao động (như bàn ghế, màn hình).","Vd: The new headquarters features ergonomic workstations and adjustable task chairs. - Trụ sở mới được trang bị các góc làm việc công thái học và ghế xoay có thể điều chỉnh độ cao.","==================================================================================================","PHẦN TỔNG KẾT: MA TRẬN 54 THUẬT NGỮ VÀNG BẤT ĐỘNG SẢN THƯƠNG MẠI, THUÊ MẶT BẰNG \u0026 QUẢN LÝ TÒA NHÀ (SPACED REPETITION ANKI)",{"rows":[[["STT"],["THUẬT NGỮ \u0026 PHIÊN ÂM IPA"],["DIỄN ĐẠT ĐỒNG NGHĨA (PARAPHRASE)"],["Ý NGHĨA NGHIỆP VỤ BẤT ĐỘNG SẢN \u0026 BA"]],[["1"],["Rent Abatement","/rɛnt əˈbeɪtmənt/"],["Waived Rent / Rent-Free Period / Rental Concession"],["Khoản miễn hoặc giảm trừ tiền thuê trong một khoảng thời gian nhất định (thường là thời gian thi công nội thất)."]],[["2"],["Tenant Improvement Allowance","/ˈtɛnənt ɪmˈpruːvmənt əˈlaʊəns/"],["TI Allowance / Construction Allowance / Fit-out Cash Contribution"],["Khoản tiền mặt mà chủ tòa nhà hỗ trợ cho khách thuê để cải tạo và hoàn thiện không gian nội thất theo nhu cầu."]],[["3"],["Triple Net Lease","/ˈtrɪpl nɛt liːs/"],["NNN Lease / Net-Net-Net Agreement"],["Hợp đồng thuê thuần ba bên, trong đó bên thuê ngoài tiền thuê gốc phải tự chi trả thuế bất động sản, bảo hiểm và phí bảo trì chung."]],[["4"],["Letter of Intent","/ˈlɛtər əv ɪnˈtɛnt/"],["LOI / Memorandum of Understanding / Preliminary Term Sheet"],["Ý định thư hoặc văn bản thỏa thuận sơ bộ xác lập các nguyên tắc và điều khoản thuê chính trước khi ký hợp đồng."]],[["5"],["Furnish","/ˈfɜːrnɪʃ/"],["Provide / Supply / Present / Deliver Documentation"],["Cung cấp, chuyển giao, gửi tài liệu chứng từ hoặc số liệu chính thức phục vụ công việc thương mại."]],[["6"],["Subterranean","/ˌsʌbtəˈreɪniən/"],["Underground / Below-ground / Basement Facility"],["Thuộc về tầng ngầm, dưới mặt đất (thường dùng cho hầm để xe, bến bốc dỡ hàng hóa tòa nhà)."]],[["7"],["Security Deposit","/sɪˈkjʊrəti dɪˈpɑːzɪt/"],["Lease Collateral / Upfront Rental Guarantee / Cautionary Escrow"],["Tiền cọc bảo đảm do bên thuê nộp để đảm bảo việc thực hiện đúng các nghĩa vụ hợp đồng."]],[["8"],["Common Area Maintenance","/ˈkɑːmən ˈɛriə ˈmeɪntənəns/"],["CAM Fees / Shared Operating Expenses / Building Service Charges"],["Phí bảo trì khu vực chung, bao gồm chi phí vận hành sảnh, thang máy, bảo vệ và vệ sinh tòa nhà."]],[["9"],["Stipulate","/ˈstɪpjəleɪt/"],["Specify / Mandate / Prescribe / Detail in Contract"],["Quy định, nêu rõ điều kiện hoặc yêu cầu bắt buộc trong văn bản hợp đồng pháp lý."]],[["10"],["Letter of Credit","/ˈlɛtər əv ˈkrɛdɪt/"],["LC / Standby Bank Guarantee / Financial Assurance Instrument"],["Thư tín dụng ngân hàng cam kết bảo lãnh thanh toán thay thế cho tiền cọc tiền mặt trong giao dịch thương mại."]],[["11"],["Rentable Square Feet","/ˈrɛntəbl skwɛr fiːt/"],["RSF / Gross Leasable Area / Chargeable Footprint"],["Diện tích tính tiền thuê, bao gồm diện tích sử dụng riêng cộng với tỷ lệ diện tích sử dụng chung trong tòa nhà."]],[["12"],["Waive","/weɪv/"],["Relinquish / Forgo / Exempt / Dismiss a Fee"],["Miễn trừ, từ bỏ quyền thu một khoản phí hoặc không bắt buộc thực hiện một nghĩa vụ tài chính."]],[["13"],["Variance","/ˈvɛriəns/"],["Exception / Exemption / Special Operating Permit / Deviation Approval"],["Sự cho phép ngoại lệ, giấy phép đặc biệt làm khác với quy định chuẩn của tòa nhà hoặc đô thị."]],[["14"],["Core Drilling","/kɔːr ˈdrɪlɪŋ/"],["Concrete Penetration / Structural Slab Coring / Hole Boring for Risers"],["Khoan rút lõi bê tông xuyên sàn hoặc tường để luồn đường ống kỹ thuật, dây cáp viễn thông."]],[["15"],["Fit-out","/ˈfɪt aʊt/"],["Interior Renovation / Tenant Build-out / Space Customization"],["Công tác hoàn thiện và cải tạo nội thất văn phòng từ phần thô đến khi sẵn sàng sử dụng."]],[["16"],["Disruption","/dɪsˈrʌpʃn/"],["Interruption / Disturbance / Operational Interference / Commotion"],["Sự gián đoạn, xáo trộn hoặc làm gián đoạn các hoạt động vận hành thường nhật."]],[["17"],["Debris","/dəˈbriː/"],["Construction Rubble / Waste Material / Wreckage / Demolition Refuse"],["Phế thải xây dựng, gạch đá vữa vụn phát sinh trong quá trình đập phá và thi công."]],[["18"],["Sign off","/saɪn ɔːf/"],["Approve Officially / Authorize / Endorse / Give Final Inspection Consent"],["Ký biên bản nghiệm thu chính thức, phê chuẩn hoặc xác nhận hoàn thành công việc đạt tiêu chuẩn."]],[["19"],["Abatement","/əˈbeɪtmənt/"],["Rent Reduction / Proportional Billing Credit / Concession Waiver"],["Sự giảm trừ, cắt giảm hoặc miễn thanh toán tiền thuê do dịch vụ thiết yếu bị gián đoạn."]],[["20"],["HVAC","/ˌeɪtʃ viː eɪ ˈsiː/"],["Climate Control System / Mechanical Air-Conditioning \u0026 Ventilation"],["Hệ thống sưởi ấm, thông gió và điều hòa không khí trong các tòa nhà thương mại."]],[["21"],["Downtime","/ˈdaʊntaɪm/"],["Service Interruption Period / Outage Duration / Inoperative Window"],["Thời gian ngừng hoạt động, thời gian chết của hệ thống máy móc hoặc dịch vụ tòa nhà."]],[["22"],["Seize","/siːz/"],["Jam Mechanically / Freeze Up / Lock Tight / Cease Rotation"],["Bị kẹt cơ khí, bó cứng động cơ khiến máy móc không thể quay hoặc vận hành được nữa."]],[["23"],["Dual-redundancy","/ˈduːəl rɪˈdʌndənsi/"],["Backup Duplication / Dual-Failover Architecture / Secondary Redundant Array"],["Hệ thống dự phòng kép, thiết kế sẵn cụm thiết bị thứ hai để tự động kích hoạt khi thiết bị chính gặp sự cố."]],[["24"],["Safeguard","/ˈseɪfɡɑːrd/"],["Protect / Shield / Ensure Preservation / Defensive Measure"],["Bảo vệ, che chắn hoặc biện pháp phòng ngừa nhằm ngăn ngừa rủi ro hư hỏng."]],[["25"],["Escalation Clause","/ˌɛskəˈleɪʃn klɔːz/"],["Rent Increase Provision / Annual Price Adjustment / Inflation Indexation Covenant"],["Điều khoản trượt giá quy định tỷ lệ tăng tiền thuê định kỳ hàng năm trong hợp đồng thương mại."]],[["26"],["Concession","/kənˈsɛʃn/"],["Allowance / Rental Incentive / Negotiated Compromise / Financial Rebate"],["Sự nhượng bộ, khoản ưu đãi hoặc chiết khấu tài chính do bên cho thuê dành cho bên thuê."]],[["27"],["Exercise an Option","/ˈɛksərsaɪz ən ˈɑːpʃn/"],["Execute Contractual Right / Elect Tenancy Extension / Formalize Option"],["Thực thi quyền chọn hợp đồng (như quyền ưu tiên gia hạn hợp đồng thuê hoặc quyền thuê thêm diện tích)."]],[["28"],["Refurbishment","/ˌriːˈfɜːrbɪʃmənt/"],["Renovation / Interior Modernization / Makeover / Space Refresh"],["Công tác tân trang, cải tạo, làm mới và hiện đại hóa không gian nội thất của tòa nhà."]],[["29"],["Compounding","/kəmˈpaʊndɪŋ/"],["Cumulative / Exponential Escalation / Successively Accruing"],["Lũy kế, tính dồn lãi/giá tăng dần theo cấp số nhân qua từng năm."]],[["30"],["In lieu of","/ɪn luː əv/"],["Instead of / As a Replacement For / In Place of"],["Thay vì, để thay thế cho một hạng mục hoặc điều khoản khác."]],[["31"],["Request for Proposals","/rɪˈkwɛst fər prəˈpoʊzlz/"],["RFP / Competitive Tender Notice / Bidding Solicitation Document"],["Hồ sơ yêu cầu đề xuất, tài liệu mời thầu chính thức do chủ đầu tư ban hành để mời các nhà thầu nộp phương án và báo giá."]],[["32"],["Comprehensive","/ˌkɑːmprɪˈhɛnsɪv/"],["All-Inclusive / Overarching / Complete Package / Full-Scope"],["Bao hàm toàn diện, trọn gói, bao quát đầy đủ mọi khía cạnh và dịch vụ cần thiết."]],[["33"],["Disqualify","/dɪsˈkwɑːlɪfaɪ/"],["Eliminate / Reject from Consideration / Declare Ineligible"],["Loại bỏ tư cách dự thầu, bác bỏ hồ sơ do vi phạm quy chế hoặc nộp muộn sau thời hạn chót."]],[["34"],["Predictive Analytics","/prɪˈdɪktɪv ˌænəˈlɪtɪks/"],["AI Forecast Modeling / Preemptive Failure Detection / Smart Diagnostic Telemetry"],["Phân tích dự đoán, sử dụng dữ liệu cảm biến và thuật toán thông minh để phát hiện trước hỏng hóc máy móc."]],[["35"],["Preventative Maintenance","/prɪˈvɛntətɪv ˈmeɪntənəns/"],["Proactive Servicing / Scheduled Equipment Upkeep / Routine Mechanical Audit"],["Bảo dưỡng phòng ngừa, kiểm tra và bảo trì định kỳ theo lịch nhằm ngăn chặn sự cố hỏng hóc đột ngột."]],[["36"],["Consortium","/kənˈsɔːrtiəm/"],["Syndicate / Owners Association / Coalition / Collaborative Enterprise"],["Liên minh, tập đoàn hoặc hiệp hội gồm nhiều tổ chức/chủ sở hữu liên kết lại cùng quản lý tài sản."]],[["37"],["Sublease","/ˈsʌbliːs/"],["Sublet Agreement / Underlease / Secondary Tenancy Contract"],["Hợp đồng cho thuê lại, trong đó bên thuê chính cho bên thứ ba thuê lại một phần hoặc toàn bộ mặt bằng."]],[["38"],["Consent","/kənˈsɛnt/"],["Permission / Formal Authorization / Written Approval / Official Sanction"],["Sự đồng thuận, phê chuẩn hoặc cho phép chính thức bằng văn bản của chủ sở hữu tài sản."]],[["39"],["Solvency","/ˈsɑːlvənsi/"],["Financial Viability / Fiscal Stability / Ability to Pay Debt Obligations"],["Năng lực thanh toán, khả năng tài chính lành mạnh đảm bảo trả được đầy đủ các khoản nợ đến hạn."]],[["40"],["Profit Sharing","/ˈprɑːfɪt ˈʃɛrɪŋ/"],["Excess Rent Remittance / Revenue Split / Surplus Gain Apportionment"],["Cơ chế chia sẻ lợi nhuận, quy định bên thuê chính phải nộp lại một tỷ lệ tiền lãi chênh lệch giá thuê cho chủ tòa nhà."]],[["41"],["Demise","/dɪˈmaɪz/"],["Partitioned Leased Space / Conveyed Premises / Transferred Real Estate Footprint"],["Mặt bằng được phân tách rõ ràng để chuyển giao quyền thuê theo văn bản hợp đồng."]],[["42"],["Amortize","/ˈæmərtaɪz/"],["Depreciate Gradually / Spread Costs Across Duration / Prorate Capital Expenses"],["Phân bổ chi phí dần dần, chia nhỏ khoản chi phí xây dựng cải tạo ban đầu đều qua từng tháng của hợp đồng."]],[["43"],["Certificate of Occupancy","/sərˈtɪfɪkət əv ˈɑːkjəpənsi/"],["Occupancy Permit / Building Use Authorization / Statutory Operating License"],["Giấy chứng nhận đủ điều kiện hoạt động, giấy phép do cơ quan quản lý đô thị cấp chứng nhận tòa nhà an toàn để đưa vào sử dụng."]],[["44"],["Egress","/ˈiːɡrɛs/"],["Emergency Exit Route / Evacuation Pathway / Way Out / Escape Corridor"],["Lối thoát hiểm khẩn cấp, tuyến đường thoát nạn được chỉ định khi xảy ra sự cố cháy nổ."]],[["45"],["Obstruct","/əbˈstrʌkt/"],["Block / Hinder / Impede / Barricade Egress Passages"],["Làm tắc nghẽn, gây cản trở hoặc chắn ngang lối đi lại thoát hiểm."]],[["46"],["Rectify","/ˈrɛktɪfaɪ/"],["Correct / Resolve / Remedy / Eliminate Deficiencies"],["Sửa chữa, khắc phục, chấn chỉnh lỗi sai hoặc khắc phục tình trạng vi phạm quy chuẩn."]],[["47"],["Remediation","/rɪˌmiːdiˈeɪʃn/"],["Corrective Action / Resolution Plan / Remedial Protocol / Hazard Elimination"],["Biện pháp khắc phục, kế hoạch hành động chấn chỉnh nhằm đưa hệ thống trở lại trạng thái đạt chuẩn."]],[["48"],["Walkthrough","/ˈwɔːkθruː/"],["Physical On-Site Tour / Step-by-Step Inspection / Visual Facility Audit"],["Chuyến kiểm tra thực địa, đi bộ thị sát trực tiếp từng bước tại hiện trường công trình."]],[["49"],["Surrender","/səˈrɛndər/"],["Relinquishment / Handover of Leased Premises / Formal Tenancy Termination"],["Bàn giao trả lại mặt bằng thuê cho chủ nhà khi hợp đồng kết thúc."]],[["50"],["Relocation","/ˌriːloʊˈkeɪʃn/"],["Corporate Move / Facility Transfer / Headquarters Transition"],["Hoạt động di dời trụ sở, chuyển văn phòng từ địa điểm cũ sang địa điểm mới."]],[["51"],["Decommission","/ˌdiːkəˈmɪʃn/"],["Shut Down Safely / Dismantle / Take Out of Operational Service"],["Ngắt nguồn an toàn, tháo dỡ thiết bị máy móc và đưa ra khỏi trạng thái vận hành."]],[["52"],["Restoration","/ˌrɛstəˈreɪʃn/"],["Reinstatement / Make-Good Obligation / Returning to Original Condition"],["Công tác phục hồi, hoàn trả mặt bằng về nguyên trạng ban đầu theo quy định hợp đồng."]],[["53"],["Deduction","/dɪˈdʌkʃn/"],["Offset / Subtraction / Withholding from Deposit / Expense Chargeback"],["Khoản khấu trừ, số tiền bị trừ bớt vào tiền cọc bảo đảm để chi trả cho các hư hại sửa chữa."]],[["54"],["Ergonomic","/ˌɜːrɡəˈnɑːmɪk/"],["Human-Engineered / Posture-Optimized / Workplace Health Designed"],["Thuộc về công thái học, thiết kế tối ưu cho tư thế và sức khỏe người lao động (như bàn ghế, màn hình)."]]],"t":"table"}]</script>
<script type="application/json" id="labels">["Mặt bằng bán lẻ \u0026 TI","Thuê văn phòng \u0026 CAM","Cải tạo \u0026 giấy phép","Sự cố HVAC \u0026 giảm tiền thuê","Gia hạn \u0026 trượt giá","Thầu quản lý tòa nhà","Thuê lại \u0026 thẩm định","PCCC \u0026 giấy phép","Di dời trụ sở"]</script>
<script>
(function(){
const RAW = JSON.parse(document.getElementById('src').textContent);
const VI_RE = /[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i;
const isVI = s => VI_RE.test(s);
let SHORT = []; try{ SHORT = JSON.parse(document.getElementById('labels').textContent)||[]; }catch(e){}

function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function add(p,...kids){ kids.forEach(k=>k&&p.appendChild(k)); return p; }
const isStr = x => typeof x === 'string';

/* ---------- split document ---------- */
const intro = RAW.slice(0,3);
const lessons = [];
let cur=null, finalTable=null, finalTitle='';
for(let i=3;i<RAW.length;i++){
  const it=RAW[i];
  if(isStr(it) && /^[=\-]{10,}$/.test(it)) continue;
  // "BÀI THỰC HÀNH SỐ N" alone (title on the next line) or "BÀI THỰC HÀNH SỐ N: Title" (title on the same line)
  if(isStr(it) && /^BÀI THỰC HÀNH SỐ\s*\d+/.test(it)){ const t=it.replace(/^BÀI THỰC HÀNH SỐ\s*\d+\s*:?\s*/,''); cur={items:t?[t]:[]}; lessons.push(cur); continue; }
  // "BÀI N: Title" keeps the title on the same line
  if(isStr(it) && /^BÀI\s+\d+\s*:/.test(it)){ cur={items:[it.replace(/^BÀI\s+\d+\s*:\s*/,'')]}; lessons.push(cur); continue; }
  if(isStr(it) && /^(BẢNG TỔNG HỢP|PHẦN TỔNG KẾT|PHAN TONG KET)/.test(it)){ cur=null; finalTitle=it; continue; }
  if(!cur){ if(!isStr(it)) finalTable=it; continue; }
  cur.items.push(it);
}
/* a lesson written without "PHẦN n:" lines ("1. ĐỀ BÀI GỐC" … "5. CÔ ĐỌNG", "ACTIVE RECALL 5S" + table,
   "ĐÁP ÁN CHI TIẾT", "4.1 …", "BỘ TỪ VỰNG …") gets the PHẦN / "1.N." lines the parser expects */
function normalizeNoParts(arr){
  if(arr.some(s=>isStr(s)&&/^PHẦN\s*\d\s*:/i.test(s))) return arr;
  const up=s=>s===s.toUpperCase()&&/[A-ZÀ-Ỹ]{3}/.test(s);
  const out=[]; let ph=0, last1=0, p2tab=false;
  arr.forEach(it=>{
    if(!isStr(it)){ if(ph===1&&last1>=5){ out.push('PHẦN 2: Active Recall 5S'); ph=2; } if(ph===2) p2tab=true; out.push(it); return; }
    const m=it.match(/^([1-5])\.\s+(.+)$/);
    if(m&&up(m[2])&&ph<=1){ if(!ph){ out.push('PHẦN 1: Văn bản đọc hiểu & dịch song ngữ'); ph=1; } out.push(`1.${m[1]}. ${m[2]}`); last1=+m[1]; return; }
    if(ph===1&&last1>=5&&up(it)&&/ACTIVE RECALL/i.test(it)){ out.push('PHẦN 2: '+it); ph=2; return; }
    if(ph===2&&p2tab){ ph=3; if(up(it)){ out.push('PHẦN 3: '+it); return; } out.push('PHẦN 3: Đáp án & dấu vết truy xuất'); }
    if(ph===3&&/^4\.1\s/.test(it)){ out.push('PHẦN 4: Phân tích Feynman & quy trình nghiệp vụ'); ph=4; }
    if(ph===4&&up(it)&&/TỪ VỰNG|VOCABULARY/i.test(it)){ out.push('PHẦN 5: '+it); ph=5; return; }
    out.push(it);
  });
  return out;
}
lessons.forEach((L,idx)=>{
  L.n=idx+1;
  let t=L.items[0]; const tq=t.match(/\s*\((Questions?\s*\d+\s*-\s*\d+[^()]*)\)\s*$/); if(tq) t=t.slice(0,tq.index);
  // trailing "(ENGLISH TITLE)" only when it is a real English title, not a short term like "(Credit Memo)":
  // 4+ words, or an all-caps title of 2+ words such as "(GRAPHIC DESIGN ASSOCIATE)"
  const m=t.match(/^(.*)\s\(([^()]*)\)\s*$/); const nw=m?m[2].split(/\s+/).length:0;
  const isEn=m&&!isVI(m[2])&&(nw>=4||(nw>=2&&m[2]===m[2].toUpperCase()&&/[A-Z]/.test(m[2])));
  L.vi = isEn?m[1]:t; L.en = isEn?m[2]:'';
  L.src = L.items[1].replace(/^Nguồn( bài học)?:\s*/,'');
  const q=(L.src+' '+L.items[0]).match(/Questions?\s*(\d+)\s*-\s*(\d+)/); L.qr = q?`Q${q[1]}–${q[2]}`:'';
  if(!SHORT[idx]){ const w=L.vi.split(/\s+/).slice(0,4).join(' ').toLowerCase(); SHORT[idx]=w.charAt(0).toUpperCase()+w.slice(1); }
  L.parts=[]; let P=null, S=null;
  for(const it of normalizeNoParts(L.items.slice(2))){
    if(isStr(it)){
      const pm=it.match(/^PHẦN\s*(\d)\s*:\s*(.*)$/i);
      if(pm){ P={n:+pm[1],title:pm[2],subs:[],items:[]}; L.parts.push(P); S=null; continue; }
      // "1.1. Title" or, in some docs, "1.1 ALL-CAPS TITLE" (no dot: only an upper-case title, so "1.5 million…" stays content)
      let sm=it.match(/^(\d\.\d)\.\s+(.*)$/); if(!sm){ sm=it.match(/^(\d\.\d)\s+(.+)$/); if(sm && sm[2]!==sm[2].toUpperCase()) sm=null; }
      // a doc that skips the "PHẦN 4:" line goes from PHẦN 3 straight to "4.1. ALL-CAPS TITLE": open PHẦN 4 there
      if(sm && P && +sm[1][0]===P.n+1 && sm[1][2]==='1' && P.n>=2 && sm[2]===sm[2].toUpperCase()){
        P={n:P.n+1,title:P.n+1===4?'PHÂN TÍCH FEYNMAN & QUY TRÌNH NGHIỆP VỤ':'PHẦN '+(P.n+1),subs:[],items:[]}; L.parts.push(P); }
      // only "N.x." of the current PHẦN N opens a sub-section; "4.1. Package…" inside a passage is content
      if(sm && P && +sm[1][0]===P.n){ S={id:sm[1],title:sm[2],items:[]}; P.subs.push(S); continue; }
    }
    if(S) S.items.push(it); else if(P) P.items.push(it);
  }
  // answer key from part 3
  L.key={}; L.answers=[];
  const p3=L.parts.find(p=>p.n===3);
  // two formats: "186. (A) text" + [Dau vet]/[Giai thich]
  //          or  "186. stem" + "Dap an dung: (A) text" + [Dau vet bai doc]/[Dien dat tuong duong]/[Loi giai chi tiet]/[Phan tich Phuong an Sai] + "(B) ..." "- Ly do sai:" "- Bay ETS:"
  //          or  an unnumbered stem line right before "Dap an dung:" (numbered from the lesson's "Questions N-M")
  if(p3){ let a=null, sec='';
    const newA=no=>{ a={no,k:'',t:'',stem:'',trace:'',expl:'',para:[],wrong:[]}; L.answers.push(a); sec=''; };
    // first question number: "Questions 181-185" in the title/source, else the first "181…" line after "[ORIGINAL ETS QUESTIONS"
    const iq=L.items.findIndex(s=>isStr(s)&&/^\[ORIGINAL ETS QUESTIONS/i.test(s)), fq=iq<0?null:L.items.slice(iq+1).find(s=>isStr(s)&&/^\d{3}(\.|\s|$)/.test(s));
    const s3=p3.items.filter(isStr), q0=+(((L.src+' '+L.items[0]).match(/Questions?\s*(\d+)/)||[])[1]||(fq||'').slice(0,3)||0);
    for(let j=0;j<s3.length;j++){ const s=s3[j];
      let m=s.match(/^(\d{3})\.\s*\(([A-D])\)\s*(.*)$/);
      if(m){ newA(m[1]); a.k=m[2]; a.t=m[3]; L.key[m[1]]=m[2]; continue; }
      m=s.match(/^(\d{3})\.\s+(.*)$/);
      if(m){ newA(m[1]); a.stem=m[2]; continue; }
      // (only when the previous answer is complete; otherwise the line continues a numbered stem)
      if(q0 && /^Dap an dung:/i.test(s3[j+1]||'') && !/^[\[(-]/.test(s) && (!a||a.k)){ newA(String(q0+L.answers.length)); a.stem=s; continue; }
      if(!a) continue;
      m=s.match(/^Dap an dung:\s*\(([A-D])\)\s*(.*)$/i);
      if(m){ a.k=m[1]; a.t=m[2]; L.key[a.no]=m[1]; continue; }
      m=s.match(/^\[([^\]]+)\]:?\s*(.*)$/);
      if(m){ const lab=m[1], rest=m[2];
        if(/^Dau vet/i.test(lab)){ sec='trace'; a.trace=rest; }
        else if(/Paraphrase|Dien dat/i.test(lab)){ sec='para'; rest.split(/\s*•\s*/).filter(Boolean).forEach(x=>a.para.push(x)); }
        else if(/Phuong an Sai|Bay/i.test(lab)){ sec='wrong'; }
        else { sec='expl'; a.expl+=(a.expl?' ':'')+rest; }
        continue; }
      if(sec==='wrong'){
        m=s.match(/^\(([A-D])\)\s*(.*)$/); if(m){ a.wrong.push({k:m[1],t:m[2],why:'',trap:''}); continue; }
        const w=a.wrong[a.wrong.length-1]; m=s.match(/^-\s*(Ly do sai|Bay ETS)\s*:\s*(.*)$/i);
        if(w&&m){ if(/^Ly/i.test(m[1])) w.why=m[2]; else w.trap=m[2]; continue; }
      }
      if(sec==='para' && /^•/.test(s)){ a.para.push(s.replace(/^•\s*/,'')); continue; }
      if(sec==='trace'){ a.trace+=' '+s; continue; }
      a.expl += (a.expl?' ':'')+s;
    }
  }
});
const TABS = lessons.map(L=>({id:'bai'+L.n, n:String(L.n).padStart(2,'0'), label:SHORT[L.n-1]||('Bài '+L.n), sub:L.qr, c:`var(--c${L.n})`}));
const NFIN = finalTable ? finalTable.rows.length-1 : 50;
const FINLABEL = /THU[ẬA]T NG[ỮU]/i.test(finalTitle) ? `${NFIN} thuật ngữ vàng` : `${NFIN} cặp Paraphrase`;
// newer docs end with PHẦN 5 of the last lesson and have no summary table: no paraphrase tab then
if(finalTable) TABS.push({id:'paraphrase', n:String(NFIN), label:FINLABEL, sub:'Tổng hợp nạp Anki', c:'var(--red)'});

/* ---------- line formatting for passages ---------- */
// passage header: known doc types, a bare "[Internal Recommendation] Letter", or generic "Doc Type [N] (Descriptor)";
// a bracket holding a date ("Boston (January 3)", "(Evaluated by …, Director — March 28)") is a dateline or caption, not a header
const DOC_RE=/^(E-mail|Email|Letter \d|Document \d|Internal Memorandum|Webpage|Press Release|Bill of Lading|Economic Logistics Article|Service Proposal)\b|^(?:[A-Z][a-z]+ ){0,3}Letter$|^[A-Z][A-Za-z&\/\- ]{2,50}(?: \d)? \((?![^()]*\b(?:January|February|March|April|May|June|July|August|September|October|November|December) \d)[A-Za-z][^()]*\)$/;
// an ALL-CAPS line like "REQUEST FOR PROPOSALS (RFP #VF-2026-08)" is a letterhead inside a passage, not a new passage
// "Document 2: Cloud Infrastructure Monitoring & Incident Report" names the paper after the colon
const isDocHead=s=>(/^((Document|Passage|Text)\s*\d+|Internal Memorandum|Memorandum)\s*:\s*\S/.test(s) && s.length<140) || (DOC_RE.test(s) && s.length<110 && !/:\s/.test(s) && !(s===s.toUpperCase() && /[A-Z]{4}/.test(s)));
function fmtLine(s){
  if(/^•\s*/.test(s)) return el('div','ln-bul',s.replace(/^•\s*/,''));
  const kv=s.match(/^([A-ZÀ-Ỹa-zà-ỹ][^:]{0,30}):\s+(.+)$/);
  if(kv && !/[.!?]$/.test(kv[1]) && kv[1].split(' ').length<=5){ const d=el('div','ln-kv'); add(d,el('b',null,kv[1]+':'),document.createTextNode(kv[2])); return d; }
  if(s===s.toUpperCase() && /[A-ZÀ-Ỹ]{3}/.test(s) && s.length<130) return el('div','ln-caps',s);
  if(/:$/.test(s) && s.length<60) return el('div','ln-sec',s);
  return el('p',null,s);
}

/* "• Label: text" bullet with a bold label; "• Label:" alone becomes a group heading */
function bullet(s){
  s=s.trim();
  if(/^[^:]{2,150}:$/.test(s)) return el('div','ln-head',s.slice(0,-1));
  const d=el('div','ln-bul'); const m=s.match(/^([^:]{2,150}?):\s+(.*)$/);
  if(m && !/[.!?]$/.test(m[1])){ let rest=m[2]; if(rest.startsWith(m[1]+':')) rest=rest.slice(m[1].length+1).trim();
    add(d,el('b',null,m[1]+': '),document.createTextNode(rest)); }
  else d.textContent=s;
  return d;
}
/* one line of a strategy / BA block: "• ..." bullet, "=> ..." conclusion, "(1) ..." numbered point, else paragraph */
function richLine(s){
  s=s.trim();
  if(/^•/.test(s)){ const r=s.replace(/^•\s*/,''); return r.trim()?bullet(r):null; }
  if(/^=>/.test(s)){ const d=bullet(s.replace(/^=>\s*/,'')); d.className='ln-concl'; return d; }
  if(/^\(\d+\)/.test(s)){ const d=bullet(s); d.className='ln-num'; return d; }
  if(/^-\s/.test(s)){ const d=bullet(s.replace(/^-\s*/,'')); d.className='ln-sub'; return d; }
  return el('p',null,s);
}

/* ---------- renderers ---------- */
function partShell(L,P){
  const sec=el('section','part'); sec.id=`b${L.n}-p${P.n}`;
  const h=el('div','part-h'); add(h,el('span','pn','PHẦN '+P.n),el('h3',null,P.title)); sec.appendChild(h);
  return sec;
}
function subShell(L,S){
  const d=el('div','sub'); d.id=`b${L.n}-s${S.id.replace('.','-')}`;

/* mode 'pass' = original passages only, 'quiz' = original questions only, 'strat' = strategy steps before the passages,
   'guide' = the whole sub-section is strategy (newer docs give it its own "Hướng dẫn làm bài Part 7" sub-section) */
function render11(L,items,box,mode){
  // passages start at "[ORIGINAL ETS PASSAGES…]", else at "Questions N-M refer to…" or the first passage header after the last "Bước" line
  let iP=items.findIndex(s=>isStr(s)&&/^\[ORIGINAL ETS PASSAGES/i.test(s)), pSkip=1;
  if(iP<0){ iP=items.findIndex(s=>isStr(s)&&/^Questions\s+\d+.*refer to/i.test(s)); pSkip=0; }
  if(iP<0){ let lastStep=-1; items.forEach((s,i)=>{ if(isStr(s)&&/^Bước\s*\d+\s*\(/.test(s)) lastStep=i; });
    iP=items.findIndex((s,i)=>i>lastStep&&isStr(s)&&(isDocHead(s)||/^\[Passage/i.test(s))); pSkip=0; }
  if(mode==='guide'){ iP=items.length; mode='strat'; }  // a stand-alone strategy sub-section is all strategy
  const iQ=items.findIndex(s=>isStr(s)&&/^(\[ORIGINAL ETS QUESTIONS|ETS Questions:?$)/i.test(s));
  const strat=items.slice(0,iP<0?0:iP), pass=items.slice(iP<0?0:iP+pSkip,iQ<0?items.length:iQ), qs=iQ<0?[]:items.slice(iQ+1);
  if(strat.length && mode==='strat'){
    const st=el('div','strat'); const steps=el('div','steps'); let lastTx=null;
    const addBody=(tx,text)=>{ text.split(/\s+•\s+/).forEach((seg,i)=>{ seg=seg.replace(/^•\s*/,'').trim(); if(seg) tx.appendChild(i||/^•/.test(text)?bullet(seg):el('p',null,seg)); }); };
    strat.forEach(s=>{
      // "Bước 1 (30 giây) - Title: body", or "Bước 4 (25 giây cuối + Đúc kết Feynman): body" with no title
      const m=s.match(/^(Bước\s*\d+)\s*\(([^)]+)\)\s*(?:-\s*([^:]+?))?:\s*(.*)$/);
      if(m){ const r=el('div','step'); const w=el('div','when'); add(w,el('b',null,m[1]),el('span',null,m[2]));
        const tx=el('div'); tx.style.cssText='display:flex;flex-direction:column;gap:4px'; if(m[3]) tx.appendChild(el('h5',null,m[3])); addBody(tx,m[4]); add(r,w,tx); steps.appendChild(r); lastTx=tx; }
      else if(lastTx){ const r=richLine(s); r&&lastTx.appendChild(r); }
      else st.appendChild(el('div','strat-t',s));
    });
    st.appendChild(steps); box.appendChild(st);
  }
  if(mode==='strat') return;
  // passages
  if(mode==='pass'){
  const papers=el('div','papers'); let pp=null, refer='';
  const newPaper=(tag)=>{ pp=el('article','paper'); if(tag) pp.appendChild(el('span','paper-tag',tag)); papers.appendChild(pp); };
  pass.forEach(s=>{
    if(!isStr(s)) return;
    if(/^Questions\s+\d+.*refer to/i.test(s)){ refer=s; return; }
    const pm=s.match(/^\[(Passage\s*\d+\s*:.*)\]$/i); if(pm){ newPaper(pm[1]); return; }
    if(isDocHead(s)){ newPaper(s); return; }
    if(!pp) newPaper('ETS Passage');
    pp.appendChild(fmtLine(s));
  });
  // "Double/Triple Passage" lessons whose papers have free-form headers: re-split into the expected number of papers
  const nExp=(t=>/Triple/i.test(t)?3:/Double/i.test(t)?2:/Single/i.test(t)?1:0)(L.src+' '+L.items[0]);
  if(nExp && papers.children.length!==nExp){
    const lines=pass.filter(s=>isStr(s)&&!/^Questions\s+\d+.*refer to/i.test(s)).map(s=>s.replace(/^\[(Passage\s*\d+\s*:.*)\]$/i,'$1'));
    const U=s=>s.toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();
    // "DAY 3: WEDNESDAY…", "COMPOSITE SCORE: 96 / 100", "ROOT CAUSE FINDINGS:" are field or section lines inside a paper
    const field=s=>/:$/.test(s)||((m=>m&&!/MEMO|MEMORANDUM|NOTICE|REPORT|LETTER|BULLETIN|ANNOUNCEMENT/i.test(m[1]))(s.match(/^([^:]{1,40}):\s/)));
    // a heading that names a document type outranks other headings
    const docWord=s=>/\b(LETTER|MEMO|MEMORANDUM|E-?MAIL|NOTICE|REPORT|FORM|POLICY|SCHEDULE|TICKET|ANNOUNCEMENT|INVOICE|RECEIPT|AGREEMENT|GUIDE|PROPOSAL|BULLETIN|SCORECARD|CLAIM|APPLICATION|CONFIRMATION|RELEASE|ADVERTISEMENT|STATEMENT|DIRECTIVE|LOG)\b/i.test(s);
    // recipient blocks: "Ms. Sophia Lin", "428 Beacon Street", "Boston, MA 02116"
    const addr=s=>/^(Mr|Ms|Mrs|Dr|Prof)\.?\s/.test(s)||/\b[A-Z]{2}\s\d{5}\b|^\d+\s+\w+.*\b(Street|St|Avenue|Ave|Square|Road|Rd|Boulevard|Blvd|Lane|Drive)\b/.test(s);
    const caps=s=>s===s.toUpperCase()&&/[A-Z]{4}/.test(s)&&s.length<120&&!field(s);
    const titleLike=s=>/^[A-Z][A-Za-z0-9&\/\-,'’()#. ]+$/.test(s)&&!/\.$/.test(s)&&s.length<90&&s.split(' ').length>=3;
    // metadata under a masthead: "To:", "Date:", "Work Order: #… | Location: …", "Submitted By: …", "Dear …"
    const meta=s=>/^(To|From|Date|Subject|Re|Attn|Ref|Memo|Issued|Sent|Posted|Submitted By|Notice Issued|Guest|Tenant|Ticket|Invoice|Order|Booking|Work Order)\b[^:]{0,24}:|\|\s*(Issued|Date|Ref)\b|^Dear\b|^[A-Z][\w ]{0,30}\b(Date|Reference|Ref|Number|ID)\s*:/i.test(s)||(/^[A-Z][\w .#&\/-]{1,30}:\s\S/.test(s)&&/\s\|\s/.test(s));
    // a short heading such as "Internal Corporate Memo: Logistics & Mandatory Safety Protocol" (no closing punctuation)
    // but not a "Priority: High" / "Signed: …" field line: a label before ":" needs 3+ words or a document word
    const headish=s=>{ if(!(s.length<100&&/^[A-Z]/.test(s)&&!/[.!?,;:]$/.test(s)&&!/\s\|\s/.test(s)&&s.split(' ').length<=14)) return false;
      const lb=s.match(/^([^:]{1,40}):\s/); return !lb||/Memo|Memorandum|Notice|Report|Letter|Bulletin|Announcement/i.test(lb[1]); };
    const closing=lines.map((s,i)=>s.length<30&&/^(Sincerely|Best|Kind|Warm|Regards|Respectfully|Yours|With)\b[\w ]*[,.]?$/i.test(s)?i:-1).filter(i=>i>=0);
    // English titles of the translated papers: "VĂN BẢN 1: … (INTERNAL DIRECTIVE & DECARBONIZATION MANDATE)"
    const tr=(L.parts[0]&&L.parts[0].subs||[]).flatMap(S=>S.items).filter(s=>isStr(s)&&/^\[?Văn bản\s*\d+/i.test(s));
    const titles=tr.map(s=>{ const m=s.match(/\(([^()]{8,})\)\s*\]?\s*:?$/); return m?U(m[1]):''; }).filter(t=>t.length>=8);
    const groups=[];
    lines.forEach((s,i)=>{ let sc=0; const u=U(s);
      if(/^Passage\s*\d+\s*:/i.test(s)||/\((DOCUMENT|PASSAGE|TEXT)\s*\d+(\s*OF\s*\d+)?\)\s*$/i.test(s)) sc=4;  // "… (DOCUMENT 2 OF 3)"
      // (the bracket of "VĂN BẢN 3: … (THOMAS BECKER)" may name a person: never match a "Mr. Thomas Becker" line)
      else if((caps(s)||isDocHead(s))&&!addr(s)&&titles.some(t=>u.length>=8&&u.length<=t.length*2&&(u.includes(t)||t.includes(u)))) sc=3;
      else if(isDocHead(s)) sc=2.5;
      else if((caps(s)||titleLike(s))&&!addr(s)&&!meta(s)&&lines.slice(i+1,i+6).some(meta)) sc=2.2;
      else if(headish(s)&&!addr(s)&&!meta(s)&&lines.slice(i+1,i+6).some(x=>meta(x)&&!/^Dear\b/.test(x))) sc=2;
      else if(titleLike(s)&&!addr(s)&&!meta(s)&&lines[i+1]&&(titleLike(lines[i+1])||/\s—\s/.test(lines[i+1]))) sc=1.5;  // two-line masthead
      else if(caps(s)) sc=1;
      if(sc&&sc<2.5&&caps(s)&&docWord(s)) sc+=0.5;
      // signature block after "Sincerely," (name, title, company); a heading with metadata under it may follow the name and title
      if(sc<4&&closing.some(c=>i>c&&i-c<=(sc>=2?2:3))) sc=0;
      if(!sc) return; const g=groups[groups.length-1];
      // an explicit "[Passage N: …]" marker is where its paper starts, even right after other heading-like lines
      // a masthead spans at most 5 lines: measured from the group's first line, so headings every few lines do not chain together
      // an explicit "[Passage N: …]" / "(DOCUMENT N OF M)" line is where its paper starts; otherwise the group's first line is
      if(g&&i-g.i<=4){ if(sc===4&&g.sc<4) g.i=i; g.last=i; g.sc=Math.max(g.sc,sc); } else groups.push({i,last:i,sc}); });
    const cut=groups.filter(g=>g.i>3).sort((a,b)=>b.sc-a.sc||a.i-b.i).slice(0,nExp-1).map(g=>g.i).sort((a,b)=>a-b);
    if(Math.abs(cut.length+1-nExp)<Math.abs(papers.children.length-nExp)){ papers.innerHTML=''; pp=null; let k=0;
      lines.forEach((s,i)=>{ if(i===0||cut.includes(i)){ k++; if(isDocHead(s)){ newPaper(s); return; } newPaper('Văn bản '+k); } pp.appendChild(fmtLine(s)); }); }
  }
  const lab=el('div','strat-t','Original ETS Passages · Đề thi tiếng Anh gốc'); lab.style.color='var(--muted)';
  box.appendChild(lab); if(refer){ const r=el('p',null,refer); r.style.cssText='font-style:italic;color:var(--muted);margin:0 0 10px'; box.appendChild(r); } box.appendChild(papers);
  return; }
  // quiz; a bare "191" line takes its stem from PHẦN 3
  const Q=[]; let q=null;
  qs.forEach(s=>{ if(!isStr(s)) return;
    let m=s.match(/^(?:Questions?\s+)?(\d{3})(?:(?:\.|\s)\s*(.*))?$/); if(m){ const a=L.answers.find(x=>x.no===m[1]); q={no:m[1],stem:m[2]||(a&&a.stem)||'',extra:[],opts:[]}; Q.push(q); return; }
    m=s.match(/^\(([A-D])\)\s*(.*)$/); if(m&&q){ q.opts.push({k:m[1],t:m[2]}); return; }
    if(q) q.extra.push(s);
  });
  // a bare "182." with no options in the doc: rebuild (A)–(D) from PHẦN 3 (correct answer + the three wrong options)
  Q.forEach(q=>{ const a=L.answers.find(x=>x.no===q.no); if(q.opts.length||!a||!a.k) return;
    q.opts=[{k:a.k,t:a.t},...a.wrong.map(w=>({k:w.k,t:w.t}))].sort((x,y)=>x.k<y.k?-1:1); });
  L.quiz=Q;
  if(!Q.length) return;
  const qz=el('div','quiz'); const top=el('div','quiz-top');
  const sc=el('div','score'); const reset=el('button','btn','Làm lại'); reset.type='button';
  add(top,el('div','strat-t','Original ETS Questions · Bấm chọn đáp án để tự kiểm tra'),add(el('div'),sc));
  top.lastChild.style.cssText='display:flex;gap:10px;align-items:center'; top.lastChild.appendChild(reset);
  qz.appendChild(top);
  const state={};
  const upd=()=>{ const done=Object.keys(state).length, ok=Object.values(state).filter(Boolean).length;
    sc.innerHTML=''; add(sc,document.createTextNode('Đã làm '),el('b',null,`${done}/${Q.length}`),document.createTextNode(' · Đúng '),el('b',null,String(ok))); };
  Q.forEach(q=>{
    const c=el('div','q'); const st=el('div','q-stem'); const stx=el('div',null,q.stem);
    q.extra.forEach(x=>stx.appendChild(el('div','q-extra',x)));
    add(st,el('span','q-no',q.no),stx); c.appendChild(st);
    const os=el('div','opts'); const fb=el('div','q-fb');
    const btns=q.opts.map(o=>{ const b=el('button','opt'); b.type='button'; add(b,el('span','k',`(${o.k})`),el('span',null,o.t));
      b.addEventListener('click',()=>{
        const right=L.key[q.no]; btns.forEach(x=>x.classList.remove('ok','bad'));
        const good=o.k===right; state[q.no]=good;
        b.classList.add(good?'ok':'bad');
        if(!good&&right){ const rb=btns[q.opts.findIndex(z=>z.k===right)]; rb&&rb.classList.add('ok'); }
        fb.innerHTML=''; const r=el('span','r '+(good?'ok':'bad'),good?'✓ Chính xác':`✗ Chưa đúng · đáp án (${right})`);
        const a=el('a',null,'Xem dấu vết truy xuất'); a.href='#'; a.addEventListener('click',e=>{e.preventDefault(); const t=document.getElementById(`b${L.n}-a${q.no}`); if(t){t.scrollIntoView({behavior:'smooth',block:'center'}); t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash');}});
        add(fb,r,a); upd();
      });
      os.appendChild(b); return b; });
    add(c,os,fb); qz.appendChild(c);
    reset.addEventListener('click',()=>{ btns.forEach(x=>x.classList.remove('ok','bad')); fb.innerHTML=''; delete state[q.no]; upd(); });
  });
  upd(); box.appendChild(qz);
}

function render12(items,box){
  const wrap=el('div','bi'); const head=el('div','bi-head'); add(head,el('span',null,'ENGLISH'),el('span',null,'TIẾNG VIỆT')); wrap.appendChild(head);
  const runs=[];
  items.forEach(s=>{ if(!isStr(s)) return;
    if(/^\[?Văn bản(\s*\d+)?\s*:/i.test(s)){ runs.push({doc:s.replace(/^\[(.*)\]$/,'$1')}); return; }
    const lg=isVI(s)?'vi':'en'; const last=runs[runs.length-1];
    if(last&&last.lg===lg) last.lines.push(s); else runs.push({lg,lines:[s]});
  });
  for(let i=0;i<runs.length;i++){
    const r=runs[i];
    if(r.doc){ const d=el('div','bi-doc',r.doc); d.style.padding='12px 16px 8px'; d.style.borderTop='1px solid var(--line)'; d.style.margin='0'; d.style.background='var(--surface-2)'; wrap.appendChild(d); continue; }
    const p=el('div','pair'); const en=el('div','en'), vi=el('div','vi vi-r');
    if(r.lg==='en'){ r.lines.forEach(s=>en.appendChild(fmtLine(s))); const nx=runs[i+1]; if(nx&&nx.lg==='vi'){ nx.lines.forEach(s=>vi.appendChild(fmtLine(s))); i++; } }
    else r.lines.forEach(s=>vi.appendChild(fmtLine(s)));
    add(p,en,vi); wrap.appendChild(p);
  }
  box.appendChild(wrap);
}

function render13(L,items,box){
  const list=el('div','qt'); let card=null, opts=null;
  const strs=items.filter(isStr);
  const isQ=s=>/^(Câu(\s+hỏi)?\s+)?\d{3}(\.\s|\s)/.test(s), isO=s=>/^\([A-D]\)/.test(s);
  // Vietnamese-only lines ("Câu 186. …", "(A) …") borrow the English stem / option from the quiz in 1.1
  let qq=null;
  for(let i=0;i<strs.length;i++){
    const s=strs[i], nx=strs[i+1], hasVi=nx&&!isQ(nx)&&!isO(nx);
    if(isQ(s)){ const m=s.match(/^(?:Câu(?:\s+hỏi)?\s+)?(\d{3})\.?\s*(.*)$/); qq=(L.quiz||[]).find(x=>x.no===m[1]);
      card=el('div','qt-card'); card.dataset.no=m[1]; const st=el('div','stem'); const tx=el('div');
      if(isVI(m[2])&&qq&&qq.stem){ tx.appendChild(el('b',null,qq.stem)); tx.appendChild(el('span','vi-t vi-r',m[2])); }
      else { tx.appendChild(el('b',null,m[2])); if(hasVi){ tx.appendChild(el('span','vi-t vi-r',nx)); i++; } }
      add(st,el('span','q-no',m[1]),tx); card.appendChild(st); opts=el('div','qt-opts'); card.appendChild(opts); list.appendChild(card); continue; }
    if(isO(s)&&opts){ const m=s.match(/^\(([A-D])\)\s*(.*)$/); const o=el('div','qt-opt'); if(L.key[card.dataset.no]===m[1]) o.classList.add('correct');
      const tx=el('div'); const eo=qq&&qq.opts.find(x=>x.k===m[1]);
      if(eo&&eo.t!==m[2]&&!hasVi){ tx.appendChild(el('span',null,eo.t)); tx.appendChild(el('span','vi-t vi-r',m[2])); }
      else { tx.appendChild(el('span',null,m[2])); if(hasVi){ tx.appendChild(el('span','vi-t vi-r',nx)); i++; } }
      add(o,el('span','k',`(${m[1]})`),tx); opts.appendChild(o); continue; }
    if(card) card.appendChild(el('p','vi-t vi-r',s));
  }
  // a translated stem with no translated options shows the original options, the correct one marked
  list.querySelectorAll('.qt-card').forEach(c=>{ const o=c.querySelector('.qt-opts'); const q=(L.quiz||[]).find(x=>x.no===c.dataset.no);
    if(o&&!o.children.length&&q) q.opts.forEach(x=>{ const d=el('div','qt-opt'+(L.key[q.no]===x.k?' correct':'')); add(d,el('span','k',`(${x.k})`),el('div',null,x.t)); o.appendChild(d); }); });
  box.appendChild(list);
}

function renderPairs(items,box,cls){
  const strs=items.filter(isStr); const g=el('div',cls);
  const en=el('div'), vi=el('div','vi-r');
  add(en,el('span','lang','ENGLISH')); add(vi,el('span','lang','TIẾNG VIỆT'));
  // "Bản tóm tắt bằng Tiếng Anh (English Summary):" is a column label, not an idea; "• idea" lines lose the bullet
  if(cls==='sum'){ strs.filter(s=>!/^Bản tóm tắt bằng|^(English|Vietnamese) Summary/i.test(s)).map(s=>s.replace(/^•\s*/,'')).filter(Boolean)
      .forEach(s=>(isVI(s)?vi:en).appendChild(ideaList(s,isVI(s)))); add(g,en,vi); box.appendChild(g); return; }
  strs.forEach(s=>(isVI(s)?vi:en).appendChild(el('p',isVI(s)?'vi-t':null,s)));

}

/* summary paragraph -> one bullet per sentence; a long tail after ": " becomes sub-bullets split at top-level ", and/và/nhờ/đồng thời" or "; " */
const ABBR=/\b(Mr|Ms|Mrs|Dr|St|No|Inc|Co|Ltd|Corp|vs|etc|e\.g|i\.e|approx|Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)\.$/i;
function topSplit(s,test){ // split where test(s,i) matches outside brackets/quotes; returns [pieces]
  const out=[]; let d=0, st=0;
  for(let i=0;i<s.length;i++){ const c=s[i];
    if('(['.includes(c)) d++; else if(')]'.includes(c)) d=Math.max(0,d-1);
    else if(!d){ const n=test(s,i); if(n){ out.push(s.slice(st,i+n.keep).trim()); st=i+n.skip; i=st-1; } } }
  out.push(s.slice(st).trim()); return out.filter(Boolean);
}
function sentences(s){
  return topSplit(s,(t,i)=>{ if(!/[.!?]/.test(t[i])||!/\s/.test(t[i+1]||'')) return null;
    if(ABBR.test(t.slice(Math.max(0,i-6),i+1))) return null;
    const nx=t.slice(i+1).trimStart()[0]||''; if(!/[A-ZÀ-Ỹ0-9"'‘“(]/.test(nx)) return null;
    return {keep:1,skip:1}; });
}
function ideaList(s,vi){
  const ul=el('ul','ideas'+(vi?' vi-t':''));
  sentences(s).forEach(sen=>{
    const li=el('li'); const ci=sen.search(/:\s/); let head=sen, tail='';
    if(ci>20 && sen.length-ci>90){ head=sen.slice(0,ci+1); tail=sen.slice(ci+1).trim(); }
    // long sentence without a colon tail: break at top-level ", allowing / , while / , đồng thời / —"
    if(!tail && sen.length>200){ const ps=topSplit(sen,(t,i)=>{ const m=t.slice(i).match(/^(,\s+(?=(?:allowing|while|whereas|đồng thời|trong khi)\s)|\s*—\s*)/); return m?{keep:0,skip:m[0].length}:null; });
      if(ps.length>1){ head=ps[0]; tail=ps.slice(1); } }
    li.appendChild(document.createTextNode(head));
    if(Array.isArray(tail)){ const sub=el('ul'); tail.forEach(p=>sub.appendChild(el('li',null,p))); li.appendChild(sub); }
    else if(tail){ const parts=topSplit(tail,(t,i)=>{ const m=t.slice(i).match(/^(,\s+(?=(?:and|và|nhờ|đồng thời|rồi|then|while)\s)|;\s+)/); return m?{keep:m[0].startsWith(';')?1:0,skip:m[0].length}:null; });
      const sub=el('ul'); parts.forEach(p=>sub.appendChild(el('li',null,p))); li.appendChild(sub); }
    ul.appendChild(li);
  });
  return ul;
}

function renderMatrix(items,box){
  const tb=items.find(x=>!isStr(x)); if(!tb) return;
  const m=el('div','matrix');
  tb.rows.slice(1).forEach(r=>{

    l.appendChild(el('span','i',im?(im[1]||im[2]).padStart(2,'0'):'·')); l.appendChild(el('b',null,im?im[3]:first));
    lab.slice(1).forEach(x=>l.appendChild(el('small',null,x.replace(/^\(|\)$/g,''))));
    const rr=el('div','mx-r');
    body.forEach(x=>{ const t=x.replace(/^•\s*/,''); const v=isVI(t); const p=el('p'); add(p,el('span','lang',v?'VI':'EN'),el('span',v?'vi-t vi-r':null,t)); rr.appendChild(p); });
    add(c,l,rr); m.appendChild(c);
  });
  box.appendChild(m);
}

function renderAnswers(L,box){
  const g=el('div','ans');
  L.answers.forEach(a=>{
    const c=el('div','an'); c.id=`b${L.n}-a${a.no}`;
    const h=el('div','an-h'); add(h,el('span','no',a.no),el('span','key',a.k),el('span','t',a.t)); c.appendChild(h);
    if(a.stem) c.appendChild(el('div','an-stem',a.stem));
    if(a.trace){ const t=el('div','trace'); add(t,el('span','lbl','Dấu vết truy xuất'),document.createTextNode(a.trace)); c.appendChild(t); }
    if(a.para.length){ const p=el('div','para'); p.appendChild(el('span','lbl','Diễn đạt tương đương · Paraphrase'));
      a.para.forEach(x=>{ const [l,r]=x.split(/\s*<->\s*/); const row=el('div','pr');
        if(r!==undefined) add(row,el('span',null,l),el('i',null,'⇄'),el('span',null,r)); else { row.style.display='block'; row.textContent=x; }
        p.appendChild(row); });
      c.appendChild(p); }
    if(a.expl){ const e=el('div','expl'); add(e,el('span','lbl',a.para.length||a.wrong.length?'Lời giải chi tiết':'Giải thích'),document.createTextNode(a.expl)); c.appendChild(e); }
    if(a.wrong.length){ const w=el('div','wrong'); w.appendChild(el('span','lbl','Phương án sai & bẫy ETS'));
      a.wrong.forEach(o=>{ const r=el('div','wr'); const h=el('div','wr-h'); add(h,el('b',null,'('+o.k+')'),el('span',null,o.t)); r.appendChild(h);
        if(o.why) r.appendChild(el('div',null,o.why)); if(o.trap) r.appendChild(el('span','trap',o.trap)); w.appendChild(r); });
      c.appendChild(w); }
    g.appendChild(c);
  });
  box.appendChild(g);
}

/* every table in 4.1 is one diagram (Vietnamese, then the English translation); the text line before a table is its caption.
   Arrow columns ("-->", "➔", "→") are dropped; a step head is "BƯỚC 1: Title" in one cell line or "BƯỚC 1" / "STEP 1" then the title */
function renderFlow(items,box){
  const keep=c=>c.length && !(c.length===1 && /^\s*(-+>|➔|→|➜|⇒|►|>)\s*$/.test(c[0]));
  let cap='';
  items.forEach(it=>{
    if(isStr(it)){ cap=it; return; }
    const tb=it, heads=tb.rows[0].filter(keep), bodies=(tb.rows[1]||[]).filter(keep);
    if(cap){ const c=el('div','strat-t',cap.replace(/:\s*$/,'')); c.style.cssText='color:var(--muted);margin:14px 0 8px'; box.appendChild(c); cap=''; }
    const f=el('div','flow');
    heads.forEach((hc,i)=>{
      const s=el('div','fstep'); const hm=hc[0].match(/^((?:BƯỚC|STEP)\s*\d+)\s*:?\s*(.*)$/i);
      const title=hm?[hm[2],...hc.slice(1)].filter(Boolean).join(' '):hc.join(' ');
      const h=el('h5'); if(hm){ add(h,el('span',null,hm[1]),document.createTextNode(title)); } else h.textContent=title;
      s.appendChild(h);
      (bodies[i]||[]).forEach(x=>{ x=x.replace(/^•\s*/,''); const m=x.match(/^([^:]{2,40}):\s*(.*)$/); const d=el('div','fkv'+(m&&/Đầu ra|Kết quả|Ket qua|Deliverable|Output/i.test(m[1])?' out':''));
        if(m) add(d,el('b',null,m[1]),el('span',null,m[2])); else d.textContent=x; s.appendChild(d); });
      f.appendChild(s);
    });
    box.appendChild(f);
  });
}

function renderVocab(items,box){
  const strs=items.filter(isStr); const g=el('div','vocab'); let c=null, n=0;
  strs.forEach(s=>{
    if(/^Ngh(?:ĩa|ia):/.test(s)&&c){ c.appendChild(el('div','mean vi-t vi-r',s.replace(/^Ngh(?:ĩa|ia):\s*/,''))); return; }
    if(/^Vd:/.test(s)&&c){ const t=s.replace(/^Vd:\s*/,''); const m=t.match(/^(.*?[.!?"”])\s+-\s+(.*)$/);
      const ex=el('div','ex'); if(m){ add(ex,el('i',null,m[1]),el('span','vi-t vi-r',m[2])); } else ex.appendChild(el('i',null,t)); c.appendChild(ex); return; }
    n++; c=el('div','vc'); const m=s.match(/^(?:(\d+)\.\s*)?(.+?)\s+(\/[^\/]+\/(?:\s*-\s*\/[^\/]+\/)*)\s+(?:(?:<=>|=)\s*)?(.+)$/);
    const h=el('div','vc-h'); add(h,el('span','vn',String(m&&m[1]?m[1]:n).padStart(2,'0')),el('h5',null,m?m[2]:s)); if(m) h.appendChild(el('span','ipa',m[3]));
    c.appendChild(h);
    if(m){ const ch=el('div','chips'); ch.appendChild(el('span','eq','≈')); m[4].split(/\s+\/\s+/).forEach(x=>ch.appendChild(el('span','chip',x))); c.appendChild(ch); }
    g.appendChild(c);
  });
  box.appendChild(g);
}

/* ---------- lesson page ---------- */
function renderLesson(L){
  const root=el('div'); root.style.setProperty('--c',`var(--c${L.n})`);
  const head=el('div','lesson-head'); head.style.setProperty('--c',`var(--c${L.n})`);
  const bn=el('div','big-n'); add(bn,el('small',null,'BÀI THỰC HÀNH'),document.createTextNode(String(L.n).padStart(2,'0')));
  const ht=el('div'); add(ht,el('h2',null,L.vi)); if(L.en) ht.appendChild(el('div','en-t',L.en));
  const src=el('div','src'); add(src,el('b',null,'NGUỒN'),el('span',null,L.src)); ht.appendChild(src);
  add(head,bn,ht); root.appendChild(head);

  const lay=el('div','layout'); const toc=el('nav','toc'); toc.setAttribute('aria-label','Mục lục bài '+L.n);
  const content=el('div','content');
  L.parts.forEach(P=>{
    const a=el('a'); a.href=`#b${L.n}-p${P.n}`; add(a,el('b',null,String(P.n)),el('span',null,shortPart(P))); toc.appendChild(a);
    a.addEventListener('click',e=>{e.preventDefault(); document.getElementById(`b${L.n}-p${P.n}`).scrollIntoView({behavior:'smooth'});});
    const sec=partShell(L,P);
    if(P.n===1){ splitPart1(P.subs).forEach(S=>{
        const sa=el('a','toc-sub',S.id+' '+S.short); sa.href='#'; sa.addEventListener('click',e=>{e.preventDefault(); document.getElementById(`b${L.n}-s${S.id.replace('.','-')}`).scrollIntoView({behavior:'smooth'});}); toc.appendChild(sa);
        const b=subShell(L,S);
        if(S.src==='1.1') render11(L,S.items,b,S.mode); else if(S.src==='1.2') render12(S.items,b); else if(S.src==='1.3') render13(L,S.items,b); else renderPairs(S.items,b,'sum');
        sec.appendChild(b); }); }
    else if(P.n===2) renderMatrix(P.items,sec);
    else if(P.n===3) renderAnswers(L,sec);
    else if(P.n===4){ P.subs.forEach(S=>{ const b=subShell(L,S);
        if(S.id==='4.1') renderFlow(S.items,b);
        else { const t=el('div','ba'); const d=el('div'); S.items.filter(isStr).forEach(s=>{ const r=richLine(s); r&&d.appendChild(r); }); t.style.gridTemplateColumns='minmax(0,1fr)'; t.appendChild(d); b.appendChild(t); }
        sec.appendChild(b); }); }
    else if(P.n===5) renderVocab(P.items,sec);
    content.appendChild(sec);
  });
  add(lay,toc,content); root.appendChild(lay);
  root.appendChild(pager(L.n-1));
  return root;
}
function shortPart(P){ return ({1:'Văn bản & dịch song ngữ',2:'Active Recall 5 giây',3:'Đáp án & dấu vết',4:'Feynman & quy trình BA',5:'Từ vựng & Paraphrase'})[P.n]||P.title; }
/* page order for PHẦN 1: 1.1 Đề gốc, 1.2 Câu hỏi gốc (both from the doc's 1.1), 1.3 Chiến thuật (the doc's own
   "Hướng dẫn làm bài Part 7" sub-section, or the "Bước" lines inside the doc's 1.1 in older docs), then translation,
   question translation and summary — matched by title so both doc layouts number the same */
function splitPart1(subs){
  const kind=S=>S.id==='1.1'?'1.1':/Hướng dẫn|Strategy|Chiến thuật|Chiến lược/i.test(S.title)?'guide':/Từng Câu|Sentence/i.test(S.title)?'1.2':/Câu hỏi|Question/i.test(S.title)?'1.3':/Song ngữ|Bilingual/i.test(S.title)?'1.2':'1.4';
  const short={'1.2':'Dịch từng câu','1.3':'Dịch câu hỏi','1.4':'Tóm tắt'};
  const s11=subs.find(S=>kind(S)==='1.1'), guide=subs.find(S=>kind(S)==='guide'), out=[];
  if(s11){
    out.push({...s11,src:'1.1',mode:'pass',short:'Đề gốc',title:'Đề thi Tiếng Anh gốc (Original ETS Passages)'});
    out.push({...s11,src:'1.1',mode:'quiz',short:'Câu hỏi gốc',title:'Câu hỏi Tiếng Anh gốc (Original ETS Questions)'});
  }
  if(guide) out.push({...guide,src:'1.1',mode:'guide',short:'Chiến thuật',title:'Hướng dẫn làm bài Part 7 (Strategy Guide)'});
  else if(s11) out.push({...s11,src:'1.1',mode:'strat',short:'Chiến thuật',title:'Hướng dẫn làm bài Part 7 (Strategy Guide)'});
  subs.forEach(S=>{ const k=kind(S); if(k!=='1.1'&&k!=='guide') out.push({...S,src:k,short:short[k]}); });
  out.forEach((S,i)=>S.id='1.'+(i+1));
  return out;
}

function renderParaphrase(){
  const root=el('div'); root.style.setProperty('--c','var(--red)');
  const head=el('div','lesson-head'); head.style.setProperty('--c','var(--c1)');
  const bn=el('div','big-n'); add(bn,el('small',null,'TỔNG HỢP'),document.createTextNode(String(NFIN)));
  const ht=el('div'); add(ht,el('h2',null,finalTitle.replace(/^BẢNG TỔNG HỢP 50 CẶP TỪ /,'').replace(/^(PHẦN TỔNG KẾT|PHAN TONG KET)\s*:\s*/i,'') || finalTitle));
  ht.appendChild(el('div','en-t',`Bảng tổng hợp ${FINLABEL.replace(/^\d+ /,NFIN+' ')} · Nạp Anki`));
  add(head,bn,ht); root.appendChild(head);
  const sec=el('section','part'); sec.style.marginTop='28px';
  const tools=el('div','pp-tools'); const inp=el('input'); inp.type='search'; inp.id='pp-search'; inp.placeholder='Tìm cụm từ, paraphrase hoặc nghĩa…'; inp.setAttribute('aria-label','Tìm trong '+FINLABEL);
  const cnt=el('span','score'); add(tools,inp,cnt); sec.appendChild(tools);
  const w=el('div','tbl-w'); const t=el('table'); const th=el('thead'); const tr=el('tr');
  const hdr=finalTable?finalTable.rows[0].map(c=>c.join(' ')):[]; hdr.forEach(x=>tr.appendChild(el('th',null,x))); th.appendChild(tr); t.appendChild(th);
  const tb=el('tbody'); const rows=[];
  (finalTable?finalTable.rows.slice(1):[]).forEach(r=>{ const row=el('tr'); ['n','t','p','m'].forEach((k,i)=>row.appendChild(el('td',k,(r[i]||[]).join(' ')))); tb.appendChild(row); rows.push([row,row.textContent.toLowerCase()]); });
  t.appendChild(tb); w.appendChild(t); sec.appendChild(w);
  const f=()=>{ const q=inp.value.trim().toLowerCase(); let k=0; rows.forEach(([r,tx])=>{ const show=!q||tx.includes(q); r.hidden=!show; if(show)k++; }); cnt.textContent=`${k}/${rows.length} cặp từ`; };
  inp.addEventListener('input',f); f();
  root.appendChild(sec); root.appendChild(pager(TABS.length-1));
  return root;
}

function pager(i){
  const p=el('div','pager');
  if(i>0){ const b=el('button','prev'); b.type='button'; add(b,el('small',null,'← Trước'),el('b',null,`${TABS[i-1].n} · ${TABS[i-1].label}`)); b.onclick=()=>show(TABS[i-1].id,true); p.appendChild(b); }
  if(i<TABS.length-1){ const b=el('button','next'); b.type='button'; add(b,el('small',null,'Tiếp →'),el('b',null,`${TABS[i+1].n} · ${TABS[i+1].label}`)); b.onclick=()=>show(TABS[i+1].id,true); p.appendChild(b); }
  return p;
}

/* ---------- hero, tabs ---------- */
const hero=document.getElementById('hero');
(function(){
  const left=el('div');
  const t0=intro[0]||''; const m=t0.match(/^(.*?):\s*(.*)$/);
  const eb=el('div','eyebrow'); add(eb,el('b',null,m?m[1]:t0),el('span',null,'· ETS TOEIC Part 7'));
  const h1=el('h1'); if(m){ const parts=m[2].split(' & '); h1.appendChild(document.createTextNode(parts[0])); if(parts[1]){ h1.appendChild(document.createElement('br')); h1.appendChild(el('span',null,'& '+parts[1])); } } else h1.textContent=t0;
  // intro[2] (source/method note) is intentionally not shown
  add(left,eb,h1,el('div','en-sub',intro[1]||''));
  const nq=lessons.reduce((a,L)=>a+L.answers.length,0), nv=lessons.reduce((a,L)=>a+(L.parts.find(p=>p.n===5)?.items.filter(s=>isStr(s)&&/^Ngh(?:ĩa|ia):/.test(s)).length||0),0);
  const st=el('div','stats');
  [[lessons.length,'bài thực hành'],[nq,'câu hỏi ETS gốc'],[nv,'thẻ từ vựng'],[NFIN,FINLABEL.replace(/^\d+ /,'')]].forEach(([v,l])=>{ const s=el('div','stat'); add(s,el('b',null,String(v)),el('span',null,l)); st.appendChild(s); });
  left.appendChild(st);
  const yard=el('div','yard'); yard.setAttribute('aria-label','Chọn nhanh bài học');
  lessons.forEach(L=>{ const b=el('button','box'); b.type='button'; b.style.setProperty('--c',`var(--c${L.n})`); b.dataset.id='bai'+L.n; b.title=SHORT[L.n-1];
    add(b,el('span','code',SHORT[L.n-1]||'BÀI'),el('span','n',String(L.n).padStart(2,'0')),el('span','qr',L.qr)); b.onclick=()=>show('bai'+L.n,true); yard.appendChild(b); });
  add(hero,left,yard);
})();

const tabsEl=document.getElementById('tabs'), main=document.getElementById('main');
const panels={}, tabBtns={};
TABS.forEach((T,i)=>{
  const b=el('button','tab'); b.type='button'; b.setAttribute('role','tab'); b.id='tab-'+T.id; b.setAttribute('aria-controls','panel-'+T.id); b.style.setProperty('--c',T.c);
  const tl=el('span','tl'); add(tl,el('b',null,T.label),el('small',null,T.sub));
  add(b,el('span','door',T.n),tl); b.onclick=()=>show(T.id,false);
  b.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ e.preventDefault(); const j=(i+(e.key==='ArrowRight'?1:-1)+TABS.length)%TABS.length; show(TABS[j].id,false); tabBtns[TABS[j].id].focus(); }});
  tabsEl.appendChild(b); tabBtns[T.id]=b;
  const p=el('section'); p.id='panel-'+T.id; p.setAttribute('role','tabpanel'); p.setAttribute('aria-labelledby','tab-'+T.id); p.hidden=true; main.appendChild(p); panels[T.id]=p;
});

function show(id,scroll){
  if(!panels[id]) id=TABS[0].id;
  const p=panels[id];
  if(!p.firstChild){ if(id==='paraphrase') p.appendChild(renderParaphrase()); else p.appendChild(renderLesson(lessons[+id.replace('bai','')-1])); }
  Object.entries(panels).forEach(([k,v])=>{ v.hidden=k!==id; tabBtns[k].setAttribute('aria-selected',String(k===id)); tabBtns[k].tabIndex=k===id?0:-1; });
  document.querySelectorAll('.box').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  tabBtns[id].scrollIntoView({block:'nearest',inline:'center'});
  try{ history.replaceState(null,'','#'+id); }catch(e){}
  try{ localStorage.setItem('lg-tab',id); }catch(e){}
  if(scroll!==null){ const bar=document.querySelector('.bar'); const y=main.getBoundingClientRect().top+window.scrollY-bar.offsetHeight-8; if(window.scrollY>y||scroll) window.scrollTo({top:y,behavior:'smooth'}); }
}

/* ---------- translation mode ---------- */
const mb=document.getElementById('m-both'), mr=document.getElementById('m-recall');
function setMode(r){ document.body.classList.toggle('recall',r); mb.setAttribute('aria-pressed',String(!r)); mr.setAttribute('aria-pressed',String(r)); try{localStorage.setItem('lg-mode',r?'1':'0');}catch(e){} if(!r) document.querySelectorAll('.peek').forEach(x=>x.classList.remove('peek')); }
mb.onclick=()=>setMode(false); mr.onclick=()=>setMode(true);
main.addEventListener('click',e=>{ if(!document.body.classList.contains('recall')) return; const v=e.target.closest('.vi-r'); if(v) v.classList.toggle('peek'); });
try{ if(localStorage.getItem('lg-mode')==='1') setMode(true); }catch(e){}

document.getElementById('foot').textContent='Nguồn: ChuyenDe_TOEIC_BatDongSan_ThueMatBang.docx';

let start=(location.hash||'').slice(1);
if(!panels[start]){ try{ start=localStorage.getItem('lg-tab')||''; }catch(e){ start=''; } }
show(panels[start]?start:TABS[0].id,null);
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(panels[h]) show(h,true); });
})();
</script>
