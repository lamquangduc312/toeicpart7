<title>Marketing số &amp; PR TOEIC 750+</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: cargo-manifest page. Hero with a 3x3 container stack (one container per lesson), sticky container-tab bar, lesson panel with side index of the 5 parts. */
:root{
  /* Tailwind-style neutrals + one primary (Blue 600) */
  --bg:#F9FAFB; --surface:#FFFFFF; --surface-2:#F3F4F6; --ink:#111827; --muted:#6B7280; --line:#E5E7EB;
  --paper:#FFFFFF;
  /* Coordinated palette: navy = governance/trust, cobalt = primary, magenta = errors,
     emerald = correct, ochre = clues & timing, Viettel red = brand marks, xanh mạ = outputs & chips */
  --navy:#102B66; --navy-2:#183B7E; --navy-ink:#102B66;
  --cobalt:#1E62D0; --cobalt-2:#2A7BE8;
  --magenta:#D71A4A; --magenta-2:#E52E5E;
  --emerald:#0A8558; --emerald-2:#12A16E;
  --ochre:#D87D0E; --ochre-2:#E8901C; --ochre-soft:#FDF1E1;
  --brand:var(--cobalt); --brand-soft:#DCE8FB; --vi:var(--navy-2);
  --red:#EE0033; --red-soft:#FFE4EA; --green:#5FA61B; --green-soft:#EAF6DC;
  --ok:var(--emerald); --bad:var(--magenta); --coral:var(--red); --coral-soft:var(--red-soft);
  --c1:var(--brand); --c2:var(--brand); --c3:var(--brand); --c4:var(--brand); --c5:var(--brand); --c6:var(--brand); --c7:var(--brand); --c8:var(--brand); --c9:var(--brand); --c10:var(--brand);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --shadow:0 1px 2px rgba(17,24,39,.05),0 6px 20px -8px rgba(17,24,39,.15);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#030712; --surface:#111827; --surface-2:#0B1120; --ink:#F9FAFB; --muted:#9CA3AF; --line:#1F2937;
  --vi:#9DBDF5; --paper:#111827; --navy-ink:#C9D7F4;
  --brand:var(--cobalt-2); --brand-soft:#132A55; --ochre-soft:#33220B;
  --ok:var(--emerald-2); --bad:var(--magenta-2);
  --red:#FF3B5F; --red-soft:#3B0A16; --green:#8BCF45; --green-soft:#1C2E0E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#030712; --surface:#111827; --surface-2:#0B1120; --ink:#F9FAFB; --muted:#9CA3AF; --line:#1F2937;
  --vi:#9DBDF5; --paper:#111827; --navy-ink:#C9D7F4;
  --brand:var(--cobalt-2); --brand-soft:#132A55; --ochre-soft:#33220B;
  --ok:var(--emerald-2); --bad:var(--magenta-2);
  --red:#FF3B5F; --red-soft:#3B0A16; --green:#8BCF45; --green-soft:#1C2E0E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{display:none}
.wrap{max-width:min(1600px,96vw);width:100%;margin:0 auto;padding-left:clamp(16px,2.5vw,40px);padding-right:clamp(16px,2.5vw,40px)}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--c) 70%,transparent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono)}

/* ---------- Hero ---------- */
.hero{padding-block:clamp(20px,3vw,36px);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.05fr);gap:clamp(20px,3vw,44px);align-items:center}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow b{color:var(--coral);font-weight:500}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3.2vw,44px);line-height:1.15;letter-spacing:-.01em;text-transform:uppercase;margin-top:10px;text-wrap:balance;word-break:break-word}
.hero h1 span{color:var(--red)}
.hero .en-sub{font-family:var(--f-display);font-weight:600;font-size:clamp(14px,1.5vw,18px);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.hero .desc{max-width:62ch;margin-top:16px;color:var(--muted);font-size:15px}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:24px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}

.yard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:620px;justify-self:end;width:100%}
.box{position:relative;min-height:76px;height:auto;aspect-ratio:auto;max-width:100%;border:1px solid var(--line);border-radius:12px;cursor:pointer;color:var(--ink);text-align:left;padding:8px 10px;background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;gap:4px;transition:transform .18s ease,background .18s,border-color .18s,box-shadow .18s}
.box:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 8px 20px -10px color-mix(in srgb,var(--brand) 60%,transparent)}
.box .n{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--brand)}
.box .qr{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.box .code{font-size:11.5px;font-weight:600;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;line-height:1.25;word-break:break-word}
.box.on{background:var(--brand);border-color:var(--brand);color:#fff}
.box.on .n,.box.on .qr,.box.on .code{color:#fff}
.box.alt .n{color:var(--coral)}

/* navy governance band behind the hero */
.hero-band{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff}
.hero-band .eyebrow{color:rgba(255,255,255,.7)}
.hero-band .eyebrow b{color:var(--ochre-2)}
.hero-band h1 span{color:var(--magenta-2)}
.hero-band .en-sub,.hero-band .desc,.hero-band .stat span{color:rgba(255,255,255,.74)}
.hero-band .stat b{color:#fff}
.hero-band .box{border-color:transparent}
.hero-band .box.on{background:var(--cobalt-2);border-color:#fff}

/* ---------- Tab bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-block:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:12px;padding-block:10px}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;flex:1;min-width:0;padding-bottom:2px;scroll-behavior:smooth}
.tab{--c:var(--c1);flex:0 0 auto;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 16px 5px 5px;cursor:pointer;text-align:left;transition:background .15s,border-color .15s}
.tab:hover{border-color:var(--c)}
.tab .door{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--c);font-family:var(--f-display);font-weight:800;font-size:16px;
  background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.tab .tl{display:flex;flex-direction:column;line-height:1.2}
.tab .tl b{font-size:13px;font-weight:600;white-space:nowrap}
.tab .tl small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#fff}
.tab[aria-selected="true"] .door{background:rgba(255,255,255,.22);color:#fff}
.tab[aria-selected="true"] .tl small{color:rgba(255,255,255,.82)}
.mode{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:0 0 auto;background:var(--surface-2)}
.mode button{border:0;background:none;padding:6px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--navy);color:#fff}

/* ---------- Lesson ---------- */
main{padding-block:28px 64px}
.lesson-head{--c:var(--c1);display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start;padding-bottom:24px;border-bottom:2px solid var(--navy-ink)}
.big-n{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,10vw,120px);line-height:.8;color:var(--c);letter-spacing:-.02em}
.big-n small{display:block;font-size:14px;letter-spacing:.2em;color:var(--muted);font-weight:600;margin-bottom:8px}
.lesson-head h2{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3.2vw,38px);line-height:1.05;text-transform:uppercase;color:var(--navy-ink)}
.lesson-head .en-t{font-family:var(--f-display);font-weight:600;font-size:clamp(15px,1.7vw,19px);color:var(--c);letter-spacing:.04em;margin-top:8px;text-transform:uppercase}
.src{display:inline-flex;gap:8px;align-items:center;margin-top:14px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.src b{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--c);letter-spacing:.06em}

.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:36px;margin-top:28px}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 82px);align-self:start;display:flex;flex-direction:column;gap:2px}
.toc a{display:flex;gap:10px;align-items:baseline;text-decoration:none;color:var(--muted);font-size:13.5px;padding:7px 10px;border-radius:6px;line-height:1.3}
.toc a b{font-family:var(--f-display);font-size:17px;color:var(--c);min-width:18px}
.toc a:hover,.toc a.on{background:var(--surface);color:var(--ink)}
.toc .toc-sub{padding-left:38px;font-size:12.5px}
.content{min-width:0;display:flex;flex-direction:column;gap:44px}

.part{display:flex;flex-direction:column;gap:22px;scroll-margin-top:96px}
.part-h{display:flex;gap:14px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px}
.part-h .pn{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.14em;color:#fff;background:var(--red);padding:3px 9px;border-radius:4px;white-space:nowrap}
.part-h h3{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.4vw,26px);text-transform:uppercase;line-height:1.1;color:var(--navy-ink)}
.sub{display:flex;flex-direction:column;gap:14px;scroll-margin-top:96px}
.sub-h{display:flex;gap:10px;align-items:baseline;font-weight:700;font-size:17px}
.sub-h .sn{font-family:var(--f-mono);font-size:12px;color:var(--c);font-weight:500}

/* strategy */
.strat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.strat-t{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;color:var(--c);text-transform:uppercase;line-height:1.5}
.steps{display:grid;gap:12px;counter-reset:s}
.step{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:start}
.step .when{font-family:var(--f-mono);font-size:11.5px;display:flex;flex-direction:column;gap:2px;border-right:2px solid var(--ochre);padding-right:10px}
.step .when span{color:var(--ochre)!important;font-weight:500}
.step .when b{font-family:var(--f-display);font-size:18px;font-weight:700;color:var(--ink)}
.step .when span{color:var(--muted)}
.step h5{margin:0 0 3px;font-size:14.5px;font-weight:700}
.step p{font-size:14.5px;color:var(--ink)}

/* passages = papers */
.papers{display:flex;flex-direction:column;gap:18px}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:22px 24px;display:flex;flex-direction:column;gap:9px;font-size:15px;position:relative}
.paper-tag{align-self:flex-start;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:3px;padding:2px 8px;margin-bottom:4px}
.ln-caps{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.04em;line-height:1.2}
.ln-kv{font-size:14px}
.ln-kv b{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted);margin-right:4px}
.ln-bul{padding-left:16px;position:relative}
.ln-bul::before{content:"";position:absolute;left:2px;top:.7em;width:6px;height:6px;background:var(--c);border-radius:1px}
.ln-sec{font-weight:700;margin-top:6px}
.ln-head{font-weight:700;margin-top:8px;color:var(--navy-ink)}
.ln-num{padding:2px 0 2px 14px;border-left:2px solid var(--brand);margin-left:2px}
.ln-num b{color:var(--brand)}
.ln-concl{background:var(--brand-soft);border-radius:6px;padding:8px 12px;font-size:14px}
.ln-concl b{color:var(--brand)}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:16px}
.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.score{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.score b{color:var(--ink);font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--c)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.q-stem{display:flex;gap:12px;font-weight:600}
.q-no{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--c);line-height:1.2;flex:0 0 auto}
.q-extra{font-style:italic;font-weight:400;color:var(--muted);margin-top:4px}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:8px 12px;cursor:pointer;font-size:14.5px;line-height:1.45;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--c)}
.opt .k{font-family:var(--f-mono);font-weight:500;font-size:13px;color:var(--c);flex:0 0 auto;margin-top:1px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surface))}
.opt.ok .k{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--surface))}
.opt.bad .k{color:var(--bad)}
.q-fb{font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.q-fb .r{font-weight:600}
.q-fb .r.ok{color:var(--ok)} .q-fb .r.bad{color:var(--bad)}
.q-fb a{color:var(--c)}

/* bilingual */
.bi-doc{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;color:var(--c);text-transform:uppercase;padding:10px 0 2px;border-top:1px dashed var(--line);margin-top:6px;line-height:1.5}
.bi-doc:first-child{border-top:0;margin-top:0;padding-top:0}
.bi{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--line)}
.pair:first-child{border-top:0}
.pair>div{padding:11px 16px;display:flex;flex-direction:column;gap:4px;font-size:14.5px;min-width:0}
.pair .en{color:var(--ink)}
.pair .vi{color:var(--vi);background:color-mix(in srgb,var(--vi) 5%,transparent);border-left:1px solid var(--line)}
.lang{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--muted);opacity:.8}
.bi-head{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-bottom:1px solid var(--line)}
.bi-head span{padding:7px 16px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted)}
.bi-head span+span{border-left:1px solid var(--line);color:var(--vi)}

.vi-t{color:var(--vi)}
/* recall mode blurs translations */
.recall .vi-r{filter:blur(6px);cursor:pointer;user-select:none;transition:filter .2s}
.recall .vi-r.peek{filter:none;user-select:auto}

/* question translation */
.qt{display:grid;gap:12px}
.qt-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.qt-card .stem{display:flex;gap:12px}
.qt-card .stem>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.qt-card .stem b{font-weight:600}
.qt-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;padding-left:44px}
.qt-opt{display:flex;gap:8px;font-size:14px;line-height:1.45}
.qt-opt>div{display:flex;flex-direction:column;min-width:0}
.qt-opt .k{font-family:var(--f-mono);color:var(--c);font-size:12.5px;margin-top:1px}
.qt-opt.correct .k{color:#fff;background:var(--ok);border-radius:3px;padding:0 4px;height:fit-content}

/* summary */
.sum{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.sum>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;font-size:14.5px;display:flex;flex-direction:column;gap:8px}
.ideas{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.ideas li{position:relative;padding-left:18px}
.ideas>li::before{content:"";position:absolute;left:3px;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--brand)}
.ideas ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.ideas ul li::before{content:"";position:absolute;left:4px;top:.75em;width:7px;height:1.5px;background:var(--muted)}

/* matrix */
.matrix{display:grid;gap:12px}
.mx{display:grid;grid-template-columns:200px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mx-l{padding:16px;background:color-mix(in srgb,var(--c) 9%,var(--surface));display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line)}
.mx-l .i{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--c)}
.mx-l b{font-size:14.5px;line-height:1.35}
.mx-l small{font-size:12.5px;color:var(--muted);line-height:1.35}
.mx-r{padding:14px 18px;display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.mx-r p{display:flex;gap:10px}
.mx-r .lang{flex:0 0 22px;margin-top:4px}

/* answers */
.ans{display:grid;gap:12px}
.an{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:100px}
.an.flash{animation:flash 1.4s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--c)}100%{box-shadow:0 0 0 0 transparent}}
.an-h{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.an-h .no{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--c)}
.an-h .key{font-family:var(--f-mono);font-weight:500;background:var(--ok);color:#fff;border-radius:4px;padding:1px 8px;font-size:13px}
.an-h .t{font-weight:600}
.trace{font-size:14px;border-left:3px solid var(--ochre);background:var(--ochre-soft);padding:9px 12px;border-radius:0 6px 6px 0;font-style:italic}
.trace .lbl{color:var(--ochre)}
.lbl{font-family:var(--f-mono);font-style:normal;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);display:block;margin-bottom:2px}
.expl{font-size:14.5px}
.an-stem{font-size:14px;color:var(--muted);margin-top:-4px}
.para{display:flex;flex-direction:column;gap:6px;font-size:14px}
.para .pr{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:start;background:var(--green-soft);border-radius:6px;padding:7px 10px}
.para .pr i{font-style:normal;color:var(--green);font-weight:700}
.para .pr span:last-child{font-weight:600}
.wrong{display:grid;gap:8px}
.wr{border:1px solid var(--line);border-radius:8px;padding:9px 12px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.wr-h{display:flex;gap:8px;align-items:baseline}
.wr-h b{font-family:var(--f-mono);font-weight:500;color:var(--bad);font-size:13px}
.wr-h span{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--bad) 55%,transparent);color:var(--muted)}
.trap{align-self:flex-start;font-size:12px;font-weight:600;color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);border-radius:4px;padding:2px 8px}
.ln-sub{padding-left:30px;position:relative;font-size:14px}
.ln-sub::before{content:"";position:absolute;left:16px;top:.75em;width:6px;height:1.5px;background:var(--muted)}
.ln-sub b{color:var(--navy-ink)}

/* workflow */
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;position:relative}
.fstep{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;position:relative}
.fstep:not(:last-child)::after{content:"";position:absolute;right:-12px;top:30px;width:10px;height:10px;border-top:2px solid var(--c);border-right:2px solid var(--c);transform:rotate(45deg);z-index:1}
.fstep h5{margin:0;font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.15;text-transform:uppercase}
.fstep h5 span{display:block;font-size:12px;color:var(--c);letter-spacing:.14em}
.fkv{font-size:13.5px;display:flex;flex-direction:column;gap:1px}
.fkv b{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fkv.out{background:var(--green-soft);border-radius:6px;padding:8px 10px}
.fkv.out b{color:var(--green)}
.ba{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.ba>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;font-size:14.5px;display:flex;flex-direction:column;gap:8px}
.ba h5{margin:0;font-size:14px;font-weight:700}

/* vocab */
.vocab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.vc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:9px}
.vc-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.vc-h .vn{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.vc-h h5{margin:0;font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.05}
.ipa{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chips .eq{font-family:var(--f-mono);font-size:12px;color:var(--c);margin-right:2px}
.chip{font-size:12.5px;border:1px solid color-mix(in srgb,var(--green) 45%,var(--line));color:var(--ink);border-radius:999px;padding:1px 9px;background:var(--green-soft)}
.chips .eq{color:var(--green)}
.vc .mean{font-size:14px;font-weight:500}
.vc .ex{font-size:13.5px;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:3px}
.vc .ex i{font-style:italic}

/* 50 pairs */
.pp-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pp-tools input{flex:1;min-width:0;max-width:420px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;font:inherit;font-size:14.5px;color:var(--ink)}
.tbl-w{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th{text-align:left;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--navy);padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;width:52px}
td.t{font-weight:600}
td.p{color:var(--muted)}
td.m{color:var(--vi)}
tbody tr:hover td{background:var(--surface-2)}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:8px;flex-wrap:wrap}
.pager button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 16px;cursor:pointer;min-width:0;max-width:48%;text-align:left}
.pager button:hover{border-color:var(--ink)}
.pager button small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pager button b{font-size:14px}
.pager .next{margin-left:auto;align-items:flex-end;text-align:right}
footer{border-top:1px solid var(--line);padding-block:20px 32px;color:var(--muted);font-size:12.5px}

ity and dynamic attribution modeling. Enterprise licenses will become commercially accessible starting February 1 through certified digital agency partners.\"","Agency Rate Card \u0026 Service Level Agreement","OmniPulse Media Solutions — Certified AuraMetrics Implementation Partner","Tiered Enterprise Agency Packages (Effective Quarter 1)","• Starter Tier ($5,000 monthly retainer + 10% ad spend):","Includes AuraMetrics 4.0 standard deployment, management of up to 2 digital channels (Search \u0026 Social), monthly ROAS reporting, and standard 48-hour helpdesk support.","• Growth Tier ($12,000 monthly retainer + 8% ad spend):","Includes full omnichannel deployment across up to 4 channels, automated bi-weekly creative refresh, bi-weekly performance reviews, guaranteed minimum ROAS threshold of 3.5x, and direct messaging support with a dedicated senior media planner.","• Enterprise Platinum Tier ($25,000 monthly retainer + 5% ad spend):","Full-funnel custom strategy across unlimited channels, dedicated programmatic account strategist, daily automated algorithmic bid adjustments, custom API webhook integration with proprietary client CRMs, and 24/7 priority SLA incident escalation.","*Special Incentive: Clients committing to a minimum 6-month Growth or Enterprise contract before February 10 will receive a 100% waiver of the one-time $4,500 system onboarding and API configuration fee.","E-mail (Campaign Authorization \u0026 Credit Deduction)","To: Marcus Thorne \u003cm.thorne@omnipulsemedia.com\u003e","From: Gregory Henderson \u003cg.henderson@zenithretail.com\u003e","Date: January 28","Subject: Zenith Retail Q2 Campaign Retainer \u0026 AuraMetrics Onboarding","Dear Mr. Thorne,","Following our review of your agency rate sheet and the recent press announcement regarding AuraMetrics 4.0, Zenith Retail has finalized its marketing allocation for the upcoming spring promotional campaign. We have decided to engage OmniPulse Media Solutions under the Growth Tier retainer for a duration of six months, covering our search, social media, and programmatic video channels with an estimated quarterly advertising expenditure of $150,000.","We intend to formally activate the promotional campaign on March 1 to coincide with our nationwide spring apparel release. Please prepare the master service agreement (MSA) for corporate signature by next Monday.","Additionally, please ensure that our initial invoice reflects a $5,000 credit deduction. As discussed during our December pilot evaluation, this credit covers the trial analytics fee that your team agreed to absorb upon our signing of a multi-month retainer. Furthermore, we wish to take advantage of the onboarding fee waiver stated in your promotional terms.","Sincerely,","Gregory Henderson","Vice President of Brand Marketing","Zenith Retail Group","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","186. What is the primary purpose of the press release?","(A) To announce a corporate merger between two software vendors","(B) To introduce an upgraded marketing analytics platform","(C) To recruit senior machine-learning software engineers","(D) To report quarterly financial revenues of an agency partner","187. According to the rate card, what service is exclusive to the Enterprise Platinum Tier?","(A) Standard 48-hour email support","(B) Bi-weekly creative asset refresh","(C) Custom API webhook integration with client CRMs","(D) Management of search and social media channels","188. What monthly agency retainer will Zenith Retail be billed under the agreed contract?","(A) $4,500","(B) $5,000","(C) $12,000","(D) $25,000","189. In the e-mail, the word \"activate\" in paragraph 2, line 1 is closest in meaning to","(A) initiate","(B) verify","(C) display","(D) repair","190. What adjustment to the initial billing statement does Mr. Henderson request?","(A) Elimination of the digital advertising spend percentage","(B) A $5,000 credit offset from a previous trial period","(C) An extension of the payment deadline to the end of March","(D) A refund for an unfulfilled programmatic display campaign","1.2. Hướng dẫn làm bài Part 7","Chiến lược 5 phút tối ưu: Nắm bắt Bối cảnh, Ghép nối Dữ kiện \u0026 Tóm tắt Feynman (1 phút/câu - 5 câu = 5 phút)","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Luồng sự việc (Quỹ đạo chữ Z \u0026 3 Câu hỏi Tiềm thức): • Văn bản 1 (Press Release): Thông cáo ra mắt nền tảng phân tích AuraMetrics 4.0 giúp tối ưu hóa ngân sách và đo lường ROAS đa kênh.","• Văn bản 2 (Rate Card \u0026 SLA): Bảng giá dịch vụ của OmniPulse Media gồm 3 bậc (Starter, Growth $12,000/tháng, Enterprise Platinum $25,000/tháng) và miễn phí cài đặt $4,500 cho hợp đồng từ 6 tháng.","• Văn bản 3 (E-mail): Khách hàng Zenith Retail chốt gói Growth 6 tháng, kích hoạt chiến dịch ngày 01/03, yêu cầu trừ 5.000 USD tiền cấn trừ dùng thử đợt pilot.","Bước 2 (20 giây) - Quét nhanh 5 câu hỏi \u0026 Phân loại: • Câu 186: Mục đích chính của Thông cáo báo chí (Câu hỏi Ý chính/Mục đích).","• Câu 187: Đặc quyền độc quyền của gói Enterprise Platinum (Câu hỏi Chi tiết đơn lẻ).","• Câu 188: Mức phí retainer hàng tháng mà Zenith Retail phải trả (Câu hỏi Ghép nối Văn bản 2 \u0026 3).","• Câu 189: Từ vựng theo ngữ cảnh \u0027activate\u0027 (Câu hỏi Từ vựng).","• Câu 190: Khoản điều chỉnh hóa đơn ban đầu mà ông Henderson yêu cầu (Câu hỏi Ghép nối \u0026 Chi tiết).","Bước 3 (3 phút 45 giây) - Cách trả lời \u0026 Dấu hiệu tìm nhanh nhất cho đủ 5 câu hỏi: • Câu 186: Tìm câu mở đầu đoạn 1 Press Release -\u003e \u0027officially announced the global release of AuraMetrics 4.0, an enterprise-grade omnichannel marketing analytics platform\u0027 -\u003e Chọn ngay (B).","• Câu 187: Quét mục \u0027Enterprise Platinum Tier\u0027 trên Rate Card -\u003e Tìm dòng có từ độc nhất \u0027custom API webhook integration with proprietary client CRMs\u0027 -\u003e Chọn (C).","• Câu 188: Ghép nối: Email dòng 5 ghi rõ \u0027engage OmniPulse Media Solutions under the Growth Tier retainer\u0027 + Bảng Rate Card ghi \u0027Growth Tier ($12,000 monthly retainer...)\u0027 -\u003e Chọn (C) $12,000.","• Câu 189: Thay thế \u0027activate the promotional campaign\u0027 = khởi động/khởi chạy chiến dịch quảng cáo -\u003e \u0027initiate\u0027 khớp nghĩa hoàn hảo -\u003e Chọn (A).","• Câu 190: Quét đoạn 3 Email: \u0027reflects a $5,000 credit deduction... trial analytics fee that your team agreed to absorb\u0027 -\u003e Chọn (B).","Bước 4 (25 giây cuối giờ thi) - Kiểm tra khóa đáp án \u0026 Đúc kết Feynman 1 câu: Rà soát nhanh chuỗi logic: Ra mắt phần mềm -\u003e Bảng giá Agency -\u003e Khách hàng ký gói Growth $12k/tháng, dỡ bỏ phí khởi tạo và khấu trừ $5k pilot -\u003e Khóa trọn vẹn 5 đáp án B-C-C-A-B.","1.3. Dịch Song ngữ Xen kẽ Từng Câu (Sentence-by-Sentence Translation)","Văn bản 1: Thông cáo Báo chí Ra mắt Sản phẩm Công nghệ Tiếp thị","SEATTLE, January 15 — AuraMetrics Technologies today officially announced the global release of AuraMetrics 4.0, an enterprise-grade omnichannel marketing analytics platform designed to optimize digital ad spend and multi-touch customer attribution in real time.","SEATTLE, ngày 15 tháng 1 — Công ty Công nghệ AuraMetrics hôm nay chính thức công bố việc phát hành toàn cầu AuraMetrics 4.0, một nền tảng phân tích tiếp thị đa kênh cấp doanh nghiệp được thiết kế để tối ưu hóa chi tiêu quảng cáo số và phân bổ điểm chạm khách hàng theo thời gian thực.","Powered by proprietary machine-learning algorithms, AuraMetrics 4.0 consolidates advertising performance metrics across social media, search engine marketing, programmatic display networks, and connected television (CTV) into a unified executive dashboard.","Được vận hành bởi các thuật toán máy học độc quyền, AuraMetrics 4.0 hợp nhất các chỉ số hiệu quả quảng cáo trên mạng xã hội, tiếp thị qua công cụ tìm kiếm, mạng lưới hiển thị tự động và truyền hình kết nối Internet (CTV) vào một bảng điều khiển điều hành duy nhất.","The platform\u0027s predictive bidding engine autonomously reallocates marketing budgets toward highest-performing creative assets, thereby driving substantial reductions in customer acquisition cost (CAC) while lifting return on ad spend (ROAS) by an average of 38 percent during enterprise beta trials.","Công cụ đấu thầu dự đoán của nền tảng sẽ tự động tái phân bổ ngân sách tiếp thị về phía các tài nguyên sáng tạo có hiệu suất cao nhất, từ đó thúc đẩy việc giảm đáng kể chi phí thu hút khách hàng (CAC) đồng thời nâng tỷ suất sinh lời trên chi phí quảng cáo (ROAS) thêm trung bình 38% trong các đợt thử nghiệm beta tại doanh nghiệp.","\"Modern chief marketing officers are inundated with fragmented campaign data across disparate ad networks,\" stated Vivian Vance, Chief Technology Officer at AuraMetrics.","\"Các giám đốc tiếp thị hiện đại đang bị quá tải bởi dữ liệu chiến dịch bị phân mảnh trên nhiều mạng quảng cáo khác nhau,\" bà Vivian Vance, Giám đốc Công nghệ tại AuraMetrics phát biểu.","\"AuraMetrics 4.0 eliminates reporting blind spots by providing cross-channel visibility and dynamic attribution modeling. Enterprise licenses will become commercially accessible starting February 1 through certified digital agency partners.\"","\"AuraMetrics 4.0 xóa bỏ các điểm mù báo cáo bằng cách cung cấp khả năng hiển thị đa kênh và mô hình phân bổ động. Giấy phép doanh nghiệp sẽ có thể tiếp cận thương mại bắt đầu từ ngày 1 tháng 2 thông qua các đối tác agency kỹ thuật số được chứng nhận.\"","Văn bản 2: Bảng Báo giá \u0026 Cam kết Chất lượng Dịch vụ Agency","OmniPulse Media Solutions — Certified AuraMetrics Implementation Partner. Tiered Enterprise Agency Packages (Effective Quarter 1).","Giải pháp Truyền thông OmniPulse — Đối tác Triển khai Được Chứng nhận của AuraMetrics. Các Gói Dịch vụ Agency Cấp Doanh nghiệp Theo Bậc (Hiệu lực Quý 1).","• Starter Tier ($5,000 monthly retainer + 10% ad spend): Includes AuraMetrics 4.0 standard deployment, management of up to 2 digital channels (Search \u0026 Social), monthly ROAS reporting, and standard 48-hour helpdesk support.","• Gói Khởi đầu (Phí duy trì 5.000 USD/tháng + 10% ngân sách quảng cáo): Bao gồm triển khai tiêu chuẩn AuraMetrics 4.0, quản lý tối đa 2 kênh số (Tìm kiếm \u0026 Mạng xã hội), báo cáo ROAS hàng tháng và hỗ trợ kỹ thuật tiêu chuẩn trong 48 giờ.","• Growth Tier ($12,000 monthly retainer + 8% ad spend): Includes full omnichannel deployment across up to 4 channels, automated bi-weekly creative refresh, bi-weekly performance reviews, guaranteed minimum ROAS threshold of 3.5x, and direct messaging support with a dedicated senior media planner.","• Gói Tăng trưởng (Phí duy trì 12.000 USD/tháng + 8% ngân sách quảng cáo): Bao gồm triển khai đa kênh toàn diện trên tối đa 4 kênh, tự động làm mới nội dung sáng tạo 2 tuần/lần, đánh giá hiệu suất định kỳ 2 tuần/lần, cam kết ngưỡng ROAS tối thiểu 3.5 lần và hỗ trợ trao đổi trực tiếp với chuyên viên hoạch định truyền thông cấp cao chuyên trách.","• Enterprise Platinum Tier ($25,000 monthly retainer + 5% ad spend): Full-funnel custom strategy across unlimited channels, dedicated programmatic account strategist, daily automated algorithmic bid adjustments, custom API webhook integration with proprietary client CRMs, and 24/7 priority SLA incident escalation.","• Gói Doanh nghiệp Bạch kim (Phí duy trì 25.000 USD/tháng + 5% ngân sách quảng cáo): Chiến lược phễu toàn diện tùy chỉnh trên không giới hạn kênh, chuyên gia chiến lược tài khoản lập trình tự động chuyên trách, điều chỉnh giá thầu bằng thuật toán tự động hàng ngày, tích hợp API webhook tùy biến với CRM nội bộ của khách hàng và quy trình leo thang sự cố SLA ưu tiên 24/7.","*Special Incentive: Clients committing to a minimum 6-month Growth or Enterprise contract before February 10 will receive a 100% waiver of the one-time $4,500 system onboarding and API configuration fee.","*Ưu đãi Đặc biệt: Khách hàng cam kết hợp đồng Gói Tăng trưởng hoặc Doanh nghiệp tối thiểu 6 tháng trước ngày 10 tháng 2 sẽ được miễn phí 100% chi phí khởi tạo hệ thống và cấu hình API một lần trị giá 4.500 USD.","Văn bản 3: Thư điện tử Phê duyệt Chiến dịch \u0026 Đề nghị Khấu trừ Chi phí","To: Marcus Thorne \u003cm.thorne@omnipulsemedia.com\u003e","From: Gregory Henderson \u003cg.henderson@zenithretail.com\u003e","Date: January 28","Subject: Zenith Retail Q2 Campaign Retainer \u0026 AuraMetrics Onboarding","Người nhận: Marcus Thorne \u003cm.thorne@omnipulsemedia.com\u003e","Người gửi: Gregory Henderson \u003cg.henderson@zenithretail.com\u003e","Ngày: 28 tháng 1","Tiêu đề: Phí Duy trì Chiến dịch Quý 2 \u0026 Khởi tạo Hệ thống AuraMetrics của Zenith Retail","Dear Mr. Thorne, Following our review of your agency rate sheet and the recent press announcement regarding AuraMetrics 4.0, Zenith Retail has finalized its marketing allocation for the upcoming spring promotional campaign.","Kính gửi ông Thorne, Sau khi xem xét bảng giá dịch vụ của quý agency và thông cáo báo chí gần đây liên quan đến AuraMetrics 4.0, Tập đoàn Bán lẻ Zenith đã hoàn tất việc phân bổ ngân sách tiếp thị cho chiến dịch quảng bá mùa xuân sắp tới.","We have decided to engage OmniPulse Media Solutions under the Growth Tier retainer for a duration of six months, covering our search, social media, and programmatic video channels with an estimated quarterly advertising expenditure of $150,000.","Chúng tôi đã quyết định hợp tác với Giải pháp Truyền thông OmniPulse theo gói duy trì Tăng trưởng trong thời hạn sáu tháng, bao quát các kênh tìm kiếm, mạng xã hội và video hiển thị tự động với mức chi tiêu quảng cáo dự kiến là 150.000 USD mỗi quý.","We intend to formally activate the promotional campaign on March 1 to coincide with our nationwide spring apparel release. Please prepare the master service agreement (MSA) for corporate signature by next Monday.","Chúng tôi dự định sẽ chính thức khởi động chiến dịch quảng bá vào ngày 1 tháng 3 để trùng khớp với đợt phát hành bộ sưu tập thời trang mùa xuân trên toàn quốc. Xin vui lòng chuẩn bị hợp đồng dịch vụ tổng thể (MSA) để ký kết cấp doanh nghiệp trước thứ Hai tới.","Additionally, please ensure that our initial invoice reflects a $5,000 credit deduction. As discussed during our December pilot evaluation, this credit covers the trial analytics fee that your team agreed to absorb upon our signing of a multi-month retainer.","Ngoài ra, xin vui lòng đảm bảo rằng hóa đơn đầu tiên của chúng tôi thể hiện khoản khấu trừ tín dụng trị giá 5.000 USD. Như đã thảo luận trong đợt đánh giá thử nghiệm hồi tháng 12, khoản tín dụng này chi trả cho khoản phí phân tích dùng thử mà đội ngũ của ông đã đồng ý tự chịu khi chúng tôi ký hợp đồng duy trì nhiều tháng.","Furthermore, we wish to take advantage of the onboarding fee waiver stated in your promotional terms. Sincerely, Gregory Henderson, Vice President of Brand Marketing, Zenith Retail Group.","Hơn nữa, chúng tôi muốn thụ hưởng quyền miễn giảm phí khởi tạo hệ thống như đã nêu trong các điều khoản ưu đãi của quý công ty. Trân trọng, Gregory Henderson, Phó Chủ tịch Tiếp thị Thương hiệu, Tập đoàn Bán lẻ Zenith.","1.4. Dịch chi tiết Câu hỏi \u0026 Phương án Trắc nghiệm","186. Mục đích chính của thông cáo báo chí là gì?","(A) Thông báo việc sáp nhập doanh nghiệp giữa hai nhà cung cấp phần mềm","(B) Giới thiệu một nền tảng phân tích tiếp thị đã được nâng cấp","(C) Tuyển dụng các kỹ sư phần mềm máy học cấp cao","(D) Báo cáo doanh thu tài chính hàng quý của một đối tác agency","187. Theo bảng giá, dịch vụ nào là đặc quyền riêng của Gói Doanh nghiệp Bạch kim?","(A) Hỗ trợ qua thư điện tử tiêu chuẩn trong 48 giờ","(B) Làm mới nội dung sáng tạo định kỳ 2 tuần một lần","(C) Tích hợp API webhook tùy biến với hệ thống CRM của khách hàng","(D) Quản lý các kênh tìm kiếm và mạng xã hội","188. Zenith Retail sẽ được lập hóa đơn với mức phí duy trì agency hàng tháng là bao nhiêu theo hợp đồng đã thỏa thuận?","(A) 4.500 USD","(B) 5.000 USD","(C) 12.000 USD","(D) 25.000 USD","189. Trong thư điện tử, từ \"activate\" ở đoạn 2, dòng 1 có nghĩa gần nhất với","(A) khởi đầu / bắt đầu (initiate)","(B) xác minh (verify)","(C) trưng bày (display)","(D) sửa chữa (repair)","190. Ông Henderson yêu cầu điều chỉnh điều gì đối với bảng quyết toán hóa đơn đầu tiên?","(A) Loại bỏ phần trăm chi tiêu quảng cáo số","(B) Một khoản bù trừ tín dụng 5.000 USD từ giai đoạn dùng thử trước đó","(C) Gia hạn thời hạn thanh toán đến cuối tháng 3","(D) Hoàn tiền cho một chiến dịch hiển thị tự động chưa hoàn thành","1.5. Tóm tắt Viết lại Toàn bài theo Feynman (Feynman Monograph Summary)","English Executive Summary:","• AuraMetrics Technologies launched AuraMetrics 4.0, an AI-powered omnichannel analytics platform designed to unify cross-network ad metrics and optimize ROAS across search, social, and programmatic media.","• OmniPulse Media Solutions, a certified implementation partner, published tiered monthly agency retainers ranging from $5,000 (Starter) to $25,000 (Enterprise Platinum), offering a full waiver of the $4,500 onboarding fee for 6-month commitments.","• Zenith Retail Group contracted OmniPulse under the Growth Tier ($12,000/month) for six months starting March 1, securing an onboarding waiver and demanding a $5,000 credit deduction from a prior pilot trial.","Bản tóm tắt Tiếng Việt cốt lõi:","• Công ty AuraMetrics ra mắt nền tảng phân tích tiếp thị đa kênh AuraMetrics 4.0 ứng dụng trí tuệ nhân tạo nhằm hợp nhất dữ liệu quảng cáo và nâng cao chỉ số ROAS trên nhiều kênh số.","• Agency OmniPulse Media công bố biểu phí duy trì theo 3 bậc từ 5.000 USD đến 25.000 USD/tháng, kèm ưu đãi miễn khoản phí khởi tạo 4.500 USD khi ký hợp đồng dịch vụ từ 6 tháng trở lên.","• Tập đoàn Zenith Retail chốt hợp đồng Gói Tăng trưởng (12.000 USD/tháng) trong 6 tháng từ ngày 01/03, được miễn phí cài đặt và yêu cầu trừ 5.000 USD phí thử nghiệm trước đó vào hóa đơn đầu tiên.","PHẦN 2: ACTIVE RECALL 5 GIÂY (BẢNG MA TRẬN ĐỊNH VỊ SONG NGỮ - THẨM MỸ \u0026 TRỰC QUAN)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["• Bên phát triển công nghệ: AuraMetrics Technologies (bà Vivian Vance - Giám đốc Công nghệ).","• Bên cung cấp dịch vụ Agency: OmniPulse Media Solutions (ông Marcus Thorne - Quản lý Đối tác).","• Bên khách hàng doanh nghiệp: Zenith Retail Group (ông Gregory Henderson - Phó Chủ tịch Tiếp thị Thương hiệu).","• Technology Developer: AuraMetrics Technologies (Vivian Vance - CTO).","• Implementation Agency: OmniPulse Media Solutions (Marcus Thorne - Account Lead).","• Enterprise Client: Zenith Retail Group (Gregory Henderson - VP of Brand Marketing)."]],[["2. Boi canh \u0026 Quy trinh loi"],["• Quy trình triển khai: Ra mắt nền tảng phân tích số đa kênh -\u003e Agency công bố biểu phí dịch vụ theo bậc và ưu đãi miễn phí khởi tạo -\u003e Khách hàng doanh nghiệp phê duyệt hợp đồng Gói Tăng trưởng 6 tháng, kích hoạt chiến dịch ra mắt bộ sưu tập xuân ngày 01/03 và khấu trừ phí dùng thử pilot.","• Core Flow: MarTech Platform Launch -\u003e Certified Agency Publishes Tiered Packages \u0026 Onboarding Waiver -\u003e Enterprise Client Finalizes 6-Month Growth Contract, Activates Spring Campaign on March 1 \u0026 Demands $5,000 Pilot Credit."]],[["3. Dau vet suy luan cheo"],["• Dữ kiện 1: Email nêu rõ Zenith Retail chọn \u0027Growth Tier retainer for a duration of six months\u0027.","• Dữ kiện 2: Bảng giá niêm yết \u0027Growth Tier ($12,000 monthly retainer + 8% ad spend)\u0027.","• Kết luận: Mức phí duy trì hàng tháng là 12.000 USD và doanh nghiệp đủ điều kiện được miễn 4.500 USD phí khởi tạo hệ thống.","• Clue 1: E-mail states Zenith Retail engages OmniPulse under the \u0027Growth Tier retainer for a duration of six months\u0027.","• Clue 2: Rate card specifies \u0027Growth Tier ($12,000 monthly retainer + 8% ad spend)\u0027.","• Cross-Synthesis: Monthly retainer is $12,000, and client automatically qualifies for the $4,500 onboarding waiver."]]],"t":"table"},"PHẦN 3: ĐÁP ÁN CHUẨN XÁC \u0026 DẤU VẾT TRUY XUẤT CHÉO (CROSS-REFERENCING \u0026 COMPREHENSIVE TRAP BREAKDOWN)","What is the primary purpose of the press release?","Dap an dung: (B) To introduce an upgraded marketing analytics platform","[Dau vet bai doc / Clue]: Press Release, Paragraph 1: \u0027AuraMetrics Technologies today officially announced the global release of AuraMetrics 4.0, an enterprise-grade omnichannel marketing analytics platform designed to optimize digital ad spend and multi-touch customer attribution in real time.\u0027","[Dien dat tuong duong / Paraphrase]: officially announced the global release of AuraMetrics 4.0 \u003c=\u003e introduce an upgraded marketing analytics platform","[Loi giai chi tiet]: Thông cáo báo chí được phát hành để công bố phiên bản 4.0 của nền tảng phân tích tiếp thị AuraMetrics, với các tính năng mới giúp tối ưu hóa chi tiêu và quy kết điểm chạm chuyển đổi.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) To announce a corporate merger between two software vendors","- Ly do sai: Bài viết nói về việc phát hành phần mềm mới thông qua các agency đối tác, không có thương vụ sáp nhập doanh nghiệp (merger) nào diễn ra.","- Bay ETS: Bẫy Thông tin Không được Đề cập (Fabricated Trap)","(C) To recruit senior machine-learning software engineers","- Ly do sai: Văn bản nhắc đến \u0027machine-learning algorithms\u0027 như một tính năng công nghệ của phần mềm, chứ không phải bài đăng tuyển dụng nhân sự.","- Bay ETS: Bẫy Từ vựng Giống hệt (False Echo Trap)","(D) To report quarterly financial revenues of an agency partner","- Ly do sai: Các số liệu tài chính trong bài là tỷ lệ nâng ROAS (38%) và bảng giá dịch vụ tương lai, không phải báo cáo doanh thu tài chính hàng quý.","- Bay ETS: Bẫy Nửa Đúng Nửa Sai (Half-True Trap)","According to the rate card, what service is exclusive to the Enterprise Platinum Tier?","Dap an dung: (C) Custom API webhook integration with client CRMs","[Dau vet bai doc / Clue]: Rate Card, Bullet 3: \u0027Enterprise Platinum Tier... custom API webhook integration with proprietary client CRMs, and 24/7 priority SLA incident escalation.\u0027","[Dien dat tuong duong / Paraphrase]: custom API webhook integration with proprietary client CRMs \u003c=\u003e Custom API webhook integration with client CRMs","[Loi giai chi tiet]: Trong bảng biểu so sánh 3 gói, tính năng tích hợp webhook API tùy biến với hệ thống CRM của khách hàng chỉ xuất hiện độc quyền tại gói Enterprise Platinum Tier.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Standard 48-hour email support","- Ly do sai: Đây là dịch vụ thuộc gói Starter Tier cơ bản nhất, không phải gói cao cấp nhất.","- Bay ETS: Bẫy Đảo lộn Cấp độ Dịch vụ (Misattribution Trap)","(B) Bi-weekly creative asset refresh","- Ly do sai: Làm mới nội dung sáng tạo 2 tuần/lần là tính năng của gói Growth Tier.","- Bay ETS: Bẫy Đảo lộn Cấp độ Dịch vụ (Misattribution Trap)","(D) Management of search and social media channels","- Ly do sai: Cả 3 gói đều quản lý kênh tìm kiếm và mạng xã hội; gói Platinum quản lý không giới hạn kênh (unlimited channels).","- Bay ETS: Bẫy Phổ quát hóa Chi tiết Riêng (Over-generalization Trap)","What monthly agency retainer will Zenith Retail be billed under the agreed contract?","Dap an dung: (C) $12,000","[Dau vet bai doc / Clue]: E-mail, Paragraph 1: \u0027engage OmniPulse Media Solutions under the Growth Tier retainer for a duration of six months\u0027 kết hợp với Rate Card: \u0027Growth Tier ($12,000 monthly retainer + 8% ad spend)\u0027.","[Dien dat tuong duong / Paraphrase]: engage... under Growth Tier retainer + Growth Tier ($12,000 monthly retainer) \u003c=\u003e billed $12,000 monthly","[Loi giai chi tiet]: Thực hiện phép truy xuất chéo giữa 2 văn bản: Thư điện tử xác nhận chọn gói \u0027Growth Tier\u0027 trong 6 tháng, và Bảng báo giá chỉ rõ gói này có phí cố định hàng tháng (retainer) là 12.000 USD.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) $4,500","- Ly do sai: 4.500 USD là phí cài đặt ban đầu (onboarding fee) được miễn phí, không phải phí duy trì hàng tháng.","- Bay ETS: Bẫy Con số Nhầm lẫn Ngữ cảnh (Number Miscontext Trap)","(B) $5,000","- Ly do sai: 5.000 USD là phí của gói Starter hoặc khoản tiền khấu trừ thử nghiệm, không phải phí gói Growth.","- Bay ETS: Bẫy Dữ liệu Đồng dạng (False Number Match Trap)","(D) $25,000","- Ly do sai: 25.000 USD là phí của gói Enterprise Platinum, không phải gói khách hàng đã ký.","- Bay ETS: Bẫy Dữ liệu Liền kề (Adjacent Trap)","In the e-mail, the word \"activate\" in paragraph 2, line 1 is closest in meaning to","Dap an dung: (A) initiate","[Dau vet bai doc / Clue]: E-mail, Paragraph 2: \u0027We intend to formally activate the promotional campaign on March 1 to coincide with our nationwide spring apparel release.\u0027","[Dien dat tuong duong / Paraphrase]: activate the campaign \u003c=\u003e initiate the campaign (chính thức khởi chạy / bắt đầu chiến dịch)","[Loi giai chi tiet]: Trong ngữ cảnh quản lý chiến dịch tiếp thị, \u0027activate a promotional campaign\u0027 mang nghĩa là đưa chiến dịch vào hoạt động thực tế, bắt đầu phát sóng quảng cáo, đồng nghĩa với \u0027initiate\u0027 hoặc \u0027launch\u0027.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(B) verify","- Ly do sai: Verify là kiểm tra, xác thực tính đúng đắn; không hợp nghĩa khi đi kèm chiến dịch quảng bá.","- Bay ETS: Bẫy Sai lệch Ngữ nghĩa Từ điển (Incorrect Sense Trap)","(C) display","- Ly do sai: Display là trưng bày hình ảnh; activate nhấn mạnh vào hành động khởi chạy quy trình toàn diện.","- Bay ETS: Bẫy Nghĩa Gần nhưng Lệch Tâm (Imprecise Synonym Trap)","(D) repair","- Ly do sai: Repair là sửa chữa hư hỏng, hoàn toàn sai ngữ cảnh.","- Bay ETS: Bẫy Mâu thuẫn Ngữ cảnh (Out of Context Trap)","What adjustment to the initial billing statement does Mr. Henderson request?","Dap an dung: (B) A $5,000 credit offset from a previous trial period","[Dau vet bai doc / Clue]: E-mail, Paragraph 3: \u0027ensure that our initial invoice reflects a $5,000 credit deduction. As discussed during our December pilot evaluation, this credit covers the trial analytics fee that your team agreed to absorb upon our signing of a multi-month retainer.\u0027","[Dien dat tuong duong / Paraphrase]: $5,000 credit deduction covers trial analytics fee \u003c=\u003e A $5,000 credit offset from a previous trial period","[Loi giai chi tiet]: Ông Henderson yêu cầu kế toán đối soát và trừ khoản tín dụng 5.000 USD vào hóa đơn đầu tiên vì agency đã đồng ý gánh chịu chi phí dùng thử pilot khi công ty ký hợp đồng chính thức nhiều tháng.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Elimination of the digital advertising spend percentage","- Ly do sai: Khách hàng không hề yêu cầu bỏ tỷ lệ 8% ngân sách quảng cáo.","- Bay ETS: Bẫy Thông tin Không có Căn cứ (Unsupported Statement Trap)","(C) An extension of the payment deadline to the end of March","- Ly do sai: Không có dòng nào đề cập đến việc xin lùi hạn thanh toán tiền hóa đơn.","- Bay ETS: Bẫy Suy đoán Không Căn cứ (Fabricated Trap)","(D) A refund for an unfulfilled programmatic display campaign","- Ly do sai: Chiến dịch chưa chạy nên không có chuyện đòi hoàn tiền vì chiến dịch không hoàn thành.","- Bay ETS: Bẫy Mâu thuẫn Trực tiếp (Direct Contradiction Trap)","PHẦN 4: KỸ THUẬT FEYNMAN SONG NGỮ \u0026 SƠ ĐỒ QUY TRÌNH (TƯ DUY PHÂN TÍCH TIẾP THỊ SỐ, PR \u0026 SẢN PHẨM)","4.1. Sơ đồ Quy trình Luân chuyển Nghiệp vụ (End-to-End Business \u0026 Marketing Workflow)","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["Bước 1","Nghiên cứu \u0026 Thẩm định"],[],["Bước 2","Đàm phán \u0026 Phê duyệt Hợp đồng"],[],["Bước 3","Khởi tạo \u0026 Hạch toán Tài chính"]],[["• Chung tu \u0026 Kenh: Thông cáo Báo chí \u0026 Hồ sơ Năng lực MarTech","• Nghiep vu thuc thi: Bộ phận Tiếp thị đánh giá năng lực nền tảng phân tích AuraMetrics 4.0, chạy thử nghiệm pilot tháng 12 và đối chiếu năng lực đo lường ROAS đa kênh.","• Ket qua \u0026 Kiem soat: Báo cáo thử nghiệm kỹ thuật \u0026 Thỏa thuận cấn trừ phí pilot 5.000 USD."],["➔"],["• Chung tu \u0026 Kenh: Biểu phí Dịch vụ Agency \u0026 Hợp đồng Dịch vụ Khung (MSA)","• Nghiep vu thuc thi: Đàm phán lựa chọn Gói Tăng trưởng (12.000 USD/tháng), cam kết thời hạn 6 tháng để kích hoạt điều khoản miễn phí khởi tạo hệ thống 4.500 USD.","• Ket qua \u0026 Kiem soat: Hợp đồng MSA hoàn thiện \u0026 Thống nhất ngân sách quảng cáo quý 150.000 USD."],["➔"],["• Chung tu \u0026 Kenh: Hệ thống Cổng Thanh toán Doanh nghiệp \u0026 Bảng điều khiển API","• Nghiep vu thuc thi: Kỹ thuật đấu nối API đa kênh, kế toán phát hành hóa đơn đầu tiên khấu trừ trực tiếp 5.000 USD tín dụng pilot và khóa lịch kích hoạt chiến dịch ngày 01/03.","• Ket qua \u0026 Kiem soat: Hóa đơn điều chỉnh hợp lệ \u0026 Chiến dịch sẵn sàng phát sóng đa nền tảng."]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["Step 1","Evaluation \u0026 Pilot Testing"],[],["Step 2","Contract Negotiation \u0026 SLA"],[],["Step 3","Onboarding \u0026 Billing Settlement"]],[["• Documents \u0026 Channels: Press Release \u0026 MarTech Capability Deck","• Core Business Execution: Marketing team assesses AuraMetrics 4.0 capabilities, conducts December pilot trial, and verifies cross-channel ROAS attribution tracking.","• Key Deliverable \u0026 Control: Pilot evaluation audit \u0026 $5,000 trial fee absorption agreement."],["➔"],["• Documents \u0026 Channels: Agency Rate Card \u0026 Master Service Agreement (MSA)","• Core Business Execution: Brand selects Growth Tier ($12,000/mo) for a 6-month term to secure complete waiver of the $4,500 onboarding and API integration fee.","• Key Deliverable \u0026 Control: Finalized MSA \u0026 Approved $150,000 quarterly ad spend allocation."],["➔"],["• Documents \u0026 Channels: Enterprise Payment Gateway \u0026 API Dashboard","• Core Business Execution: Engineering team configures cross-channel tracking while accounting issues initial invoice with $5,000 pilot credit offset prior to March 1 launch.","• Key Deliverable \u0026 Control: Adjusted commercial invoice \u0026 Ready-to-launch live campaigns."]]],"t":"table"},"4.2. Tư duy Phân tích Nghiệp vụ Tiếp thị Số \u0026 Quản trị Chiến dịch (Bản Tiếng Việt)","• Bức tranh Toàn cảnh Chuỗi Tiếp thị \u0026 Ra mắt Sản phẩm (End-to-End Campaign Flow): Trong một chiến dịch thương mại số quy mô lớn, luồng vận hành luôn chạy song hành 3 trục: (1) Trục Công nghệ \u0026 Dữ liệu (MarTech Flow): Nền tảng phân tích (AuraMetrics) kết nối trực tiếp với các kênh truyền thông (Search, Social, CTV, Programmatic) thông qua API để theo dõi điểm chạm khách hàng từ lúc nhìn thấy quảng cáo đến khi chốt đơn; (2) Trục Hợp đồng \u0026 Pháp lý (Contractual \u0026 SLA Flow): Hợp đồng dịch vụ khung (MSA) quy định rõ quyền sở hữu dữ liệu người dùng, cam kết mức sàn ROAS (tối thiểu 3.5x) và điều khoản bảo mật thông tin; (3) Trục Kế toán \u0026 Dòng tiền Ngân hàng (Settlement \u0026 Financial Flow): Doanh nghiệp kiểm soát chi phí qua mô hình Retainer hàng tháng + Tỷ lệ % chi tiêu quảng cáo, đồng thời sử dụng các khoản Thấu chi/Tín dụng dịch vụ (Credit Memo/Credit Deduction) từ đợt chạy thử nghiệm để đối soát chính xác công nợ ngân hàng.","• Điểm nghẽn \u0026 Rủi ro Vận hành Thực tế (Core Bottleneck \u0026 Risk): Nút thắt nguy hiểm nhất trong tiếp thị đa kênh là \u0027Phân mảnh dữ liệu và suy hao ngân sách\u0027 (Attribution Blindspot \u0026 Ad Spend Waste). Nếu không có công cụ phân tích hợp nhất, doanh nghiệp dễ bị các kênh quảng cáo báo cáo số liệu trùng lặp (Double-counting conversions), dẫn đến chi tiêu sai lệch cho các kênh kém hiệu quả trong khi chi phí thu hút khách hàng (CAC) tăng vọt.","• 3 Giải pháp Thiết kế Hệ thống \u0026 Kiểm soát Nghiệp vụ (BA, MarTech \u0026 Campaign Architecture):","(1) Thiết lập Kiến trúc Dữ liệu Đa kênh Hợp nhất (Unified Omni-channel Data Architecture): Đấu nối trực tiếp Webhook API giữa nền tảng đo lường và CRM nội bộ để ghi nhận chính xác doanh thu thực tế phát sinh trên mỗi mã khách hàng.","(2) Cơ chế Hợp đồng Ràng buộc Hiệu suất (Performance-Linked Service Contracts): Đưa chỉ số ngưỡng ROAS và KPI chuyển đổi vào điều khoản SLA thanh toán, phạt giảm trừ phí retainer nếu agency không đạt cam kết.","(3) Kiểm soát Đối soát Dòng tiền Ba chiều (3-Way Billing Reconciliation): Đối soát chặt chẽ giữa Hóa đơn Agency, Báo cáo Chi tiêu của Mạng quảng cáo (Ad Networks) và Sao kê Ngân hàng trước khi giải ngân lệnh thanh toán ACH/EFT.","• Tam giác Liên kết Nhận thức Đa chiều (Multi-Perspective Contextual Anchoring):","1. Lăng kính Viễn thông / CNTT Viettel: Bài toán ra mắt gói cước số hoặc ứng dụng số (Tammi/MyViettel) đòi hỏi hệ thống MarTech tự động phân bổ ngân sách theo thời gian thực trên các kênh số, kiểm soát nghiêm ngặt chi phí CAC và tuân thủ Luật Bảo vệ dữ liệu cá nhân.","2. Lăng kính Quản trị \u0026 Marketing Giáo dục (Trường Mầm non Ước Mơ Xanh - cô Thu Huyền): Chiến dịch tuyển sinh hè đòi hỏi phân bổ ngân sách giữa Fanpage, Zalo OA và sự kiện trải nghiệm thực tế; đo lường chính xác chi phí trên một phụ huynh để tối ưu hóa tỷ lệ chuyển đổi nhập học của các bé.","3. Lăng kính Bàn học Gia đình (Kèm cặp học sinh Lớp 5 - Bé Hà Ngân): Kỹ thuật lập kế hoạch học tập có mục tiêu: Phân bổ thời gian học các môn (Toán, Tiếng Việt, Tiếng Anh) như phân bổ ngân sách tiếp thị; bé Hà Ngân học cách đo lường hiệu quả sau mỗi buổi học (như kiểm tra chỉ số ROAS) để biết điểm nào cần củng cố thêm.","4.3. Business Analyst \u0026 Marketing Technology Executive Summary (Bản Tiếng Anh)","• End-to-End Marketing Campaign \u0026 Launch Context: High-impact digital marketing requires seamless convergence across technology (omnichannel predictive analytics tracking customer journeys), legal frameworks (performance SLAs guaranteeing minimum ROAS thresholds), and financial discipline (multi-tier agency retainers reconciled with promotional credits and net ad spend).","• Core Campaign Bottleneck \u0026 Risk: Attribution blind spots and fragmented cross-network reporting represent the greatest operational risk, leading to duplicate conversion reporting, misdirected ad capital, and inflated Customer Acquisition Costs (CAC).","• Key MarTech \u0026 Product Launch Architecture Solutions:","(1) Implement a unified API-driven attribution pipeline to eliminate data discrepancies across ad networks and client CRM repositories.","(2) Structure performance-contingent retainer agreements penalizing agency fees if baseline ROAS thresholds are unfulfilled.","(3) Enforce automated 3-way invoice reconciliation linking agency billing, platform media logs, and bank corporate payment statements.","• Multi-Perspective Contextual Anchoring (Three Practical Lenses):","1. Viettel Telecom / IT Enterprise Lens: Rolling out nationwide digital subscriptions requires algorithmic ad optimization, strict CAC capping, and automated billing audits complying with national cybersecurity regulations.","2. Preschool Education Management Lens (Uoc Mo Xanh Kindergarten - Principal Thu Huyen): Seasonal enrollment campaigns require targeted allocation across digital parent touchpoints and community open days, tracking cost per prospective student lead.","3. Family Study Desk Lens (Tutoring 5th Grader - Ha Ngan): Managing weekly study schedules mirrors marketing budget allocation; Ha Ngan evaluates her daily learning output (study ROAS) to prioritize challenging math problem sets.","PHẦN 5: TỪ VỰNG \u0026 PARAPHRASE CHUYÊN SÂU (CHUẨN 3 DÒNG TỐI ƯU NẠP ANKI)","Omnichannel analytics  /ˌɒmniˈtʃæn.əl ˌæn.əˈlɪt.ɪks/  Cross-platform data tracking / Unified attribution modeling","Nghia: Hệ thống phân tích dữ liệu tiếp thị đa kênh hợp nhất từ nhiều nguồn.","Vd: The new platform provides omnichannel analytics to evaluate ad performance across social media and search engines. - Nền tảng mới cung cấp phân tích đa kênh để đánh giá hiệu quả quảng cáo trên mạng xã hội và công cụ tìm kiếm.","Return on ad spend (ROAS)  /rɪˈtɜːn ɒn æd spend/  Advertising revenue ratio / Campaign profitability yield","Nghia: Tỷ suất sinh lời trên chi phí quảng cáo (Doanh thu tạo ra trên mỗi đồng vốn quảng cáo).","Vd: The agency delivered an average ROAS of 4.2x throughout the first quarter. - Agency đã mang lại tỷ suất sinh lời quảng cáo trung bình gấp 4,2 lần trong suốt quý đầu tiên.","Customer acquisition cost (CAC)  /ˈkʌs.tə.mər ˌæk.wɪˈzɪʃ.ən kɒst/  Cost per new customer / Prospect acquisition expense","Nghia: Chi phí để thu hút và chuyển đổi thành công một khách hàng mới.","Vd: Optimizing automated bidding algorithms helped the enterprise reduce its CAC by 25 percent. - Tối ưu hóa các thuật toán đấu thầu tự động đã giúp doanh nghiệp giảm 25% chi phí thu hút khách hàng.","Retainer fee  /rɪˈteɪ.nər fiː/  Fixed recurring service charge / Monthly maintenance payment","Nghia: Khoản phí duy trì dịch vụ cố định trả định kỳ hàng tháng cho đơn vị tư vấn/agency.","Vd: Zenith Retail agreed to a monthly retainer fee of $12,000 for full agency management. - Tập đoàn Zenith Retail đã đồng ý chi trả khoản phí duy trì 12.000 USD mỗi tháng cho dịch vụ quản trị toàn diện của agency.","Predictive bidding engine  /prɪˈdɪk.tɪv ˈbɪd.ɪŋ ˈen.dʒɪn/  Automated algorithmic ad auction system","Nghia: Công cụ đấu thầu giá quảng cáo tự động dựa trên thuật toán dự đoán AI.","Vd: The predictive bidding engine reallocates capital to highest-converting user segments. - Công cụ đấu thầu dự đoán tự động tái phân bổ vốn vào các phân khúc người dùng có tỷ lệ chuyển đổi cao nhất.","Onboarding fee  /ˈɒnˌbɔː.dɪŋ fiː/  Initial setup charge / System integration startup cost","Nghia: Khoản phí khởi tạo hệ thống và cấu hình kỹ thuật ban đầu khi bắt đầu sử dụng dịch vụ.","Vd: The agency granted a complete waiver of the $4,500 onboarding fee for long-term clients. - Agency đã áp dụng miễn giảm toàn bộ khoản phí khởi tạo 4.500 USD cho các khách hàng ký hợp đồng dài hạn.","Credit deduction  /ˈkred.ɪt dɪˈdʌk.ʃən/  Billing offset / Invoice credit adjustment / Account reimbursement","Nghia: Khoản khấu trừ tín dụng để giảm số tiền phải thanh toán trên hóa đơn.","Vd: The initial invoice reflected a $5,000 credit deduction from the previous trial period. - Hóa đơn ban đầu đã thể hiện khoản khấu trừ tín dụng 5.000 USD từ giai đoạn thử nghiệm trước đó.","Multi-touch attribution  /ˈmʌl.ti tʌtʃ ˌæt.rɪˈbjuː.ʃən/  Comprehensive journey conversion tracking","Nghia: Mô hình phân bổ đa điểm chạm đo lường mức độ đóng góp của từng kênh quảng cáo vào quyết định mua hàng.","Vd: Multi-touch attribution ensures every marketing channel receives proportionate credit for driving the final sale. - Phân bổ đa điểm chạm đảm bảo mọi kênh tiếp thị đều được ghi nhận công lao tương xứng trong việc thúc đẩy đơn hàng cuối cùng.","==================================================================================================","BÀI THỰC HÀNH SỐ 2: HỌP BÁO CÔNG BỐ SẢN PHẨM CÔNG NGHỆ ĐỘT PHÁ \u0026 QUẢN TRỊ BÁO CHÍ ĐỘC QUYỀN (PRODUCT LAUNCH PRESS CONFERENCE, MEDIA CREDENTIALING \u0026 EMBARGO AGREEMENT)","Nguồn bài học: ETS TOEIC Part 7 (Double Passage - Media Invitation Itinerary \u0026 Press Accreditation E-mail)","PHẦN 1: NỘI DUNG VĂN BẢN ĐỌC HIỂU \u0026 DỊCH THUẬT","1.1. Đề thi Tiếng Anh gốc (Strategy Guide \u0026 Original ETS Passages)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","Media Invitation \u0026 Press Briefing Itinerary","NOVATECH GLOBAL COMMUNICATIONS BUREAU","Official Press Invitation: Next-Generation Hardware Unveiling","Venue: Grand Hyatt Ballroom \u0026 Innovation Pavilion, San Francisco","Date: Thursday, October 14","Novatech cordially invites accredited media representatives, industry analysts, and technology correspondents to the exclusive global launch of the ZenPad Pro 12 commercial tablet, engineered with quantum-matrix displays and proprietary neural processing capabilities.","Event Schedule:","• 13:30 – 14:00: Media Registration \u0026 Credential Verification (Main Foyer)","• 14:00 – 15:00: Keynote Address by CEO Arthur Sterling: \"The Future of Enterprise Mobility\"","• 15:00 – 15:45: Interactive Product Demonstration \u0026 Hands-On Testing (Innovation Pavilion)","• 15:45 – 16:30: Executive Panel Q\u0026A Session with Chief Hardware Architect Dr. Elena Rostova","• 16:30 – 17:30: Networking Reception \u0026 Press Kit Distribution","*Strict Press Embargo Notice: All detailed benchmark data, product photographs taken in the Innovation Pavilion, and executive interview transcripts are subject to a mandatory global publication embargo until 18:00 Pacific Standard Time on October 14. Premature disclosure or online leaking will result in immediate revocation of press accreditation and legal action under our Non-Disclosure Agreement (NDA).","E-mail (Exclusive Interview Request \u0026 Advance Review Unit)","To: Donald Vance, Director of Global Media Relations \u003cd.vance@novatech.com\u003e","From: Laura Sterling, Senior Tech Editor \u003cl.sterling@techhorizonmag.com\u003e","Date: October 5","Subject: Media Accreditation Confirmation \u0026 Exclusive Coverage Inquiry (Tech Horizon Magazine)","Dear Mr. Vance,","Thank you for extending the press invitation to Novatech\u0027s upcoming hardware launch on October 14. I am pleased to confirm that I will attend in person representing Tech Horizon Magazine, alongside our senior photojournalist, Mr. David Chen.","Given our editorial calendar for the November cover story on enterprise computing, our publication is preparing an extensive 6-page feature dedicated to the ZenPad Pro 12. To facilitate comprehensive and rigorous technical reporting, we would like to formally request a 20-minute one-on-one interview with Dr. Elena Rostova immediately following the executive Q\u0026A panel.","Furthermore, we request the courier dispatch of an advance hardware review unit to our San Francisco editorial office by October 11. This 72-hour advance window will allow our testing laboratory to conduct independent battery endurance and benchmark assessments. We fully acknowledge the strict 18:00 embargo condition and are prepared to countersign your corporate NDA immediately upon receipt of the loan agreement.","Please let me know if these editorial arrangements can be accommodated.","Best regards,","Laura Sterling","Senior Technology Editor","Tech Horizon Magazine","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","176. What is the primary objective of the event announced in the invitation?","(A) To conduct an annual shareholder vote on corporate governance","(B) To unveil a new high-performance enterprise tablet","(C) To celebrate the opening of a retail electronics showroom","(D) To deliver a technical workshop for third-party software developers","177. What restriction is imposed on journalists attending the launch event?","(A) They cannot record audio during the keynote address","(B) They must pay an admission fee to access the Innovation Pavilion","(C) They are prohibited from publishing technical findings before 18:00 on October 14","(D) They cannot bring personal photography equipment into the ballroom","178. Why did Ms. Sterling send the e-mail to Mr. Vance?","(A) To decline the invitation due to a scheduling conflict","(B) To request an exclusive executive interview and an early evaluation device","(C) To complain about a defective tablet delivered to her office","(D) To inquire about advertising space rates in Novatech publications","179. In the e-mail, the word \"rigorous\" in paragraph 2, line 3 is closest in meaning to","(A) thorough","(B) costly","(C) rapid","(D) controversial","180. What condition does Ms. Sterling agree to satisfy before receiving the evaluation hardware?","(A) Paying a commercial equipment deposit fee","(B) Submitting a draft article for pre-publication censorship","(C) Countersigning a formal non-disclosure agreement","(D) Guaranteeing front-page placement in Tech Horizon Magazine","1.2. Hướng dẫn làm bài Part 7","Chiến lược 5 phút tối ưu: Nắm bắt Bối cảnh, Ghép nối Dữ kiện \u0026 Tóm tắt Feynman (1 phút/câu - 5 câu = 5 phút)","Bước 1 (20 giây) - Nắm bắt Bối cảnh \u0026 Luồng sự việc (Quỹ đạo chữ Z \u0026 3 Câu hỏi Tiềm thức): • Văn bản 1 (Press Invitation \u0026 Itinerary): Thư mời báo chí tham dự lễ ra mắt máy tính bảng ZenPad Pro 12 tại Grand Hyatt ngày 14/10, kèm lịch trình và điều khoản cấm công bố thông tin (Press Embargo) trước 18:00.","• Văn bản 2 (E-mail): Phóng viên Laura Sterling (Tạp chí Tech Horizon) xác nhận tham dự, xin phỏng vấn riêng 20 phút với Dr. Elena Rostova và mượn máy mẫu trước 72 giờ (ngày 11/10) kèm cam kết ký thỏa thuận bảo mật (NDA).","Bước 2 (15 giây) - Quét nhanh 5 câu hỏi \u0026 Phân loại: • Câu 176: Mục đích chính của sự kiện (Câu hỏi Mục đích cốt lõi).","• Câu 177: Quy định hạn chế áp đặt lên các nhà báo (Câu hỏi Chi tiết đơn lẻ).","• Câu 178: Lý do bà Sterling gửi thư cho ông Vance (Câu hỏi Chi tiết / Mục đích thư).","• Câu 179: Từ vựng theo ngữ cảnh \u0027rigorous\u0027 (Câu hỏi Từ vựng).","• Câu 180: Điều kiện bà Sterling đồng ý tuân thủ trước khi nhận máy thử nghiệm (Câu hỏi Ghép nối Dữ kiện).","Bước 3 (3 phút 50 giây) - Cách trả lời \u0026 Dấu hiệu tìm nhanh nhất cho đủ 5 câu hỏi: • Câu 176: Nhìn lướt dòng 2 Văn bản 1: \u0027global launch of the ZenPad Pro 12 commercial tablet\u0027 -\u003e Chọn (B).","• Câu 177: Nhìn mục \u0027*Strict Press Embargo Notice\u0027 cuối Văn bản 1: \u0027subject to a mandatory global publication embargo until 18:00 Pacific Standard Time on October 14\u0027 -\u003e Chọn (C).","• Câu 178: Nhìn đoạn 2 và 3 Email: \u0027request a 20-minute one-on-one interview with Dr. Elena Rostova\u0027 và \u0027request the courier dispatch of an advance hardware review unit\u0027 -\u003e Chọn (B).","• Câu 179: \u0027comprehensive and rigorous technical reporting\u0027 = báo cáo kỹ thuật toàn diện và kỹ lưỡng/chặt chẽ -\u003e \u0027thorough\u0027 khớp hoàn toàn -\u003e Chọn (A).","• Câu 180: Nhìn câu cuối đoạn 3 Email: \u0027prepared to countersign your corporate NDA immediately upon receipt of the loan agreement\u0027 -\u003e Chọn (C).","Bước 4 (25 giây cuối giờ thi) - Kiểm tra khóa đáp án \u0026 Đúc kết Feynman 1 câu: Chuỗi liên kết hoàn hảo: Họp báo ra mắt tablet -\u003e Quy định lệnh cấm tin 18h -\u003e Phóng viên xin phỏng vấn riêng + mượn máy sớm 72h và cam kết ký NDA -\u003e Khóa trọn 5 đáp án B-C-B-A-C.","1.3. Dịch Song ngữ Xen kẽ Từng Câu (Sentence-by-Sentence Translation)","Văn bản 1: Giấy mời Báo chí \u0026 Lịch trình Sự kiện Ra mắt Phần cứng","NOVATECH GLOBAL COMMUNICATIONS BUREAU. Official Press Invitation: Next-Generation Hardware Unveiling. Venue: Grand Hyatt Ballroom \u0026 Innovation Pavilion, San Francisco. Date: Thursday, October 14.","CỤC TRUYỀN THÔNG TOÀN CẦU NOVATECH. Giấy Mời Báo Chí Chính Thức: Lễ Công Bố Phần Cứng Thế Hệ Mới. Địa điểm: Khán phòng \u0026 Gian Trưng bày Sáng tạo Khách sạn Grand Hyatt, San Francisco. Ngày: Thứ Năm, 14 tháng 10.","Novatech cordially invites accredited media representatives, industry analysts, and technology correspondents to the exclusive global launch of the ZenPad Pro 12 commercial tablet, engineered with quantum-matrix displays and proprietary neural processing capabilities.","Novatech trân trọng kính mời các đại diện truyền thông được cấp thẻ báo chí, các nhà phân tích trong ngành và các phóng viên công nghệ tới tham dự buổi lễ ra mắt toàn cầu độc quyền của máy tính bảng thương mại ZenPad Pro 12, được thiết kế với màn hình ma trận lượng tử và năng lực xử lý thần kinh độc quyền.","Event Schedule: • 13:30 – 14:00: Media Registration \u0026 Credential Verification (Main Foyer). • 14:00 – 15:00: Keynote Address by CEO Arthur Sterling: \"The Future of Enterprise Mobility\".","Lịch trình Sự kiện: • 13:30 – 14:00: Đăng ký Báo chí \u0026 Xác thực Thẻ tác nghiệp (Sảnh chính). • 14:00 – 15:00: Bài phát biểu Chủ đạo của Tổng Giám đốc Arthur Sterling: \"Tương lai của Tính Di động trong Doanh nghiệp\".","• 15:00 – 15:45: Interactive Product Demonstration \u0026 Hands-On Testing (Innovation Pavilion). • 15:45 – 16:30: Executive Panel Q\u0026A Session with Chief Hardware Architect Dr. Elena Rostova.","• 15:00 – 15:45: Trình diễn Sản phẩm Tương tác \u0026 Trải nghiệm Trực tiếp (Gian Trưng bày Sáng tạo). • 15:45 – 16:30: Phiên Hỏi - Đáp của Hội đồng Điều hành cùng Kiến trúc sư Trưởng Phần cứng, Tiến sĩ Elena Rostova.","• 16:30 – 17:30: Networking Reception \u0026 Press Kit Distribution.","• 16:30 – 17:30: Tiệc Kết nối \u0026 Phát hành Bộ Tài liệu Báo chí (Press Kit).","*Strict Press Embargo Notice: All detailed benchmark data, product photographs taken in the Innovation Pavilion, and executive interview transcripts are subject to a mandatory global publication embargo until 18:00 Pacific Standard Time on October 14.","*Thông báo Lệnh cấm Công bố Thông tin Nghiêm ngặt: Toàn bộ dữ liệu điểm chuẩn chi tiết, hình ảnh sản phẩm chụp trong Gian Trưng bày Sáng tạo và biên bản phỏng vấn lãnh đạo phải tuân thủ lệnh cấm xuất bản toàn cầu bắt buộc cho đến 18:00 Giờ Chuẩn Thái Bình Dương ngày 14 tháng 10.","Premature disclosure or online leaking will result in immediate revocation of press accreditation and legal action under our Non-Disclosure Agreement (NDA).","Việc tiết lộ sớm hoặc rò rỉ thông tin lên mạng sẽ dẫn đến việc thu hồi ngay lập tức thẻ tác nghiệp báo chí và bị khởi kiện theo Thỏa thuận Không Tiết lộ Thông tin (NDA) của chúng tôi.","Văn bản 2: Thư điện tử Đề nghị Phỏng vấn Độc quyền \u0026 Cung cấp Thiết bị Dùng thử","To: Donald Vance, Director of Global Media Relations \u003cd.vance@novatech.com\u003e","From: Laura Sterling, Senior Tech Editor \u003cl.sterling@techhorizonmag.com\u003e","Date: October 5","Subject: Media Accreditation Confirmation \u0026 Exclusive Coverage Inquiry (Tech Horizon Magazine)","Người nhận: Donald Vance, Giám đốc Quan hệ Truyền thông Toàn cầu \u003cd.vance@novatech.com\u003e","Người gửi: Laura Sterling, Biên tập viên Công nghệ Cấp cao \u003cl.sterling@techhorizonmag.com\u003e","Ngày: 5 tháng 10","Tiêu đề: Xác nhận Thẻ Tác nghiệp Báo chí \u0026 Đề nghị Tác nghiệp Độc quyền (Tạp chí Tech Horizon)","Dear Mr. Vance, Thank you for extending the press invitation to Novatech\u0027s upcoming hardware launch on October 14. I am pleased to confirm that I will attend in person representing Tech Horizon Magazine, alongside our senior photojournalist, Mr. David Chen.","Kính gửi ông Vance, Cảm ơn ông đã gửi lời mời báo chí tham dự sự kiện ra mắt phần cứng sắp tới của Novatech vào ngày 14 tháng 10. Tôi rất vui mừng xác nhận rằng tôi sẽ đích thân tham dự đại diện cho Tạp chí Tech Horizon, cùng với phóng viên ảnh cấp cao của chúng tôi, ông David Chen.","Given our editorial calendar for the November cover story on enterprise computing, our publication is preparing an extensive 6-page feature dedicated to the ZenPad Pro 12.","Xét theo lịch xuất bản số báo chuyên đề trang bìa tháng 11 về điện toán doanh nghiệp, ấn phẩm của chúng tôi đang chuẩn bị một bài viết chuyên sâu dài 6 trang dành riêng cho ZenPad Pro 12.","To facilitate comprehensive and rigorous technical reporting, we would like to formally request a 20-minute one-on-one interview with Dr. Elena Rostova immediately following the executive Q\u0026A panel.","Để tạo điều kiện cho bài báo cáo kỹ thuật toàn diện và kỹ lưỡng, chúng tôi muốn chính thức đề nghị một cuộc phỏng vấn 1-1 kéo dài 20 phút với Tiến sĩ Elena Rostova ngay sau phiên Hỏi - Đáp của hội đồng điều hành.","Furthermore, we request the courier dispatch of an advance hardware review unit to our San Francisco editorial office by October 11.","Hơn nữa, chúng tôi đề nghị chuyển phát nhanh một thiết bị phần cứng mẫu dùng thử đến tòa soạn của chúng tôi tại San Francisco trước ngày 11 tháng 10.","This 72-hour advance window will allow our testing laboratory to conduct independent battery endurance and benchmark assessments.","Khoảng thời gian 72 giờ trước sự kiện này sẽ cho phép phòng thử nghiệm của chúng tôi thực hiện các bài đánh giá điểm chuẩn và độ bền của pin một cách độc lập.","We fully acknowledge the strict 18:00 embargo condition and are prepared to countersign your corporate NDA immediately upon receipt of the loan agreement. Please let me know if these editorial arrangements can be accommodated. Best regards, Laura Sterling, Senior Technology Editor, Tech Horizon Magazine.","Chúng tôi hoàn toàn thừa nhận điều kiện lệnh cấm tin 18:00 nghiêm ngặt và sẵn sàng ký đối chiếu thỏa thuận bảo mật NDA của quý công ty ngay khi nhận được hợp đồng mượn thiết bị. Xin vui lòng cho tôi biết nếu những sắp xếp biên tập này có thể được đáp ứng. Trân trọng, Laura Sterling, Biên tập viên Công nghệ Cấp cao, Tạp chí Tech Horizon.","1.4. Dịch chi tiết Câu hỏi \u0026 Phương án Trắc nghiệm","176. Mục tiêu chính của sự kiện được công bố trong giấy mời là gì?","(A) Tiến hành bỏ phiếu cổ đông thường niên về quản trị doanh nghiệp","(B) Công bố một dòng máy tính bảng doanh nghiệp hiệu năng cao mới","(C) Kỷ niệm ngày khai trương phòng trưng bày điện tử bán lẻ","(D) Tổ chức hội thảo kỹ thuật cho các nhà phát triển phần mềm bên thứ ba","177. Quy định hạn chế nào được áp đặt đối với các nhà báo tham dự sự kiện ra mắt?","(A) Họ không được phép ghi âm trong suốt bài phát biểu chủ đạo","(B) Họ phải trả phí vào cửa để tiếp cận Gian Trưng bày Sáng tạo","(C) Họ bị cấm công bố các phát hiện kỹ thuật trước 18:00 ngày 14 tháng 10","(D) Họ không được mang thiết bị chụp ảnh cá nhân vào khán phòng","178. Tại sao bà Sterling gửi thư điện tử cho ông Vance?","(A) Từ chối lời mời do trùng lịch làm việc","(B) Yêu cầu một cuộc phỏng vấn lãnh đạo độc quyền và một thiết bị đánh giá sớm","(C) Khiếu nại về một chiếc máy tính bảng bị lỗi giao đến văn phòng của bà","(D) Hỏi về bảng giá không gian quảng cáo trên các ấn phẩm của Novatech","179. Trong thư điện tử, từ \"rigorous\" ở đoạn 2, dòng 3 có nghĩa gần nhất với","(A) kỹ lưỡng / chặt chẽ (thorough)","(B) đắt đỏ (costly)","(C) nhanh chóng (rapid)","(D) gây tranh cãi (controversial)","180. Bà Sterling đồng ý đáp ứng điều kiện nào trước khi nhận phần cứng đánh giá?","(A) Chi trả một khoản phí đặt cọc thiết bị thương mại","(B) Nộp bản thảo bài viết để kiểm duyệt trước khi xuất bản","(C) Ký đối chiếu vào một thỏa thuận không tiết lộ thông tin (NDA) chính thức","(D) Cam kết đặt bài viết ở vị trí trang bìa trên Tạp chí Tech Horizon","1.5. Tóm tắt Viết
