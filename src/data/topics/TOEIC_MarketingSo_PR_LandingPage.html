d Distribution MOUs: During the October 26 signing ceremony, Nexa successfully executed two binding Memorandums of Understanding (MOUs) worth a combined initial procurement value of $1.8 million:","1. MetroAsia Retail Holdings: Exclusive retail distribution across Vietnam and Malaysia ($1.1M minimum Year 1 purchase volume).","2. Siam Green Distribution: Commercial air purification supply for 40 luxury hotel properties in Thailand ($700k initial contract).","• Negotiations Ongoing: Advanced contractual due diligence is currently progressing with Pacific Rim Home Logistics regarding Indonesian wholesale rights.","Return on Investment (ROI) Synthesis:","With $1.8 million in initial contract volume achieved against a $68,000 marketing expenditure, this mission yielded an outstanding top-line marketing return on ad spend (ROAS) multiple of 26.4x. I strongly recommend expanding our trade mission budget for next year\u0027s European Expansion Tour in Frankfurt.","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","196. What was the main purpose of the trade mission program in Singapore?","(A) To conduct scientific research on climate change trends","(B) To facilitate direct commercial partnerships and distribution agreements","(C) To audit corporate compliance with labor safety standards","(D) To celebrate the construction of a new convention center","197. Where did Mr. Park conduct his pre-scheduled matchmaking sessions on October 24?","(A) Grand Ballroom","(B) Hall B Exhibition Floor","(C) Executive Meeting Suite 4","(D) The Manila Hotel","198. How many qualified prospective sales leads were gathered by Nexa CleanTech during the event?","(A) 40","(B) 45","(C) 142","(D) 250","199. According to the audit report, what significant commercial milestone was achieved on October 26?","(A) Settlement of all outstanding booth fabrication invoices","(B) Execution of two distribution MOUs with a combined initial value of $1.8 million","(C) Finalization of a commercial retail partnership in Germany","(D) Filing of a new international patent application","200. In the audit report, the word \"yielded\" in paragraph 4, line 2 is closest in meaning to","(A) produced","(B) delayed","(C) sacrificed","(D) investigated","1.2. Hướng dẫn làm bài Part 7","Chiến lược 5 phút tối ưu: Nắm bắt Bối cảnh, Ghép nối Dữ kiện \u0026 Tóm tắt Feynman (1 phút/câu - 5 câu = 5 phút)","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Luồng sự việc (Quỹ đạo chữ Z \u0026 3 Câu hỏi Tiềm thức): • Văn bản 1 (Program): Lịch trình phái đoàn xúc tiến thương mại quốc tế tại Sands Expo Singapore (24-26/10) nhằm thúc đẩy ký kết phân phối và liên doanh thương mại.","• Văn bản 2 (Matchmaking Voucher): Lịch 4 cuộc gặp B2B vào chiều 24/10 của Kenneth Park (Nexa CleanTech) tại Phòng VIP Executive Meeting Suite 4 với các đối tác bán lẻ Đông Nam Á (MetroAsia, Siam Green, Pacific Rim, Manila Smart Home).","• Văn bản 3 (Audit Report): Báo cáo hiệu quả ROI gửi Hội đồng Quản trị: Tổng chi phí $68,000; thu về 142 liên hệ tiềm năng, ký thành công 2 Thỏa thuận MOU trị giá 1,8 triệu USD (MetroAsia $1.1M và Siam Green $700k), đạt tỷ suất sinh lời ROAS gấp 26,4 lần chi phí ban đầu.","Bước 2 (20 giây) - Quét nhanh 5 câu hỏi \u0026 Phân loại: • Câu 196: Mục đích chính của chương trình xúc tiến thương mại (Câu hỏi Ý chính/Mục đích).","• Câu 197: Địa điểm diễn ra các cuộc họp B2B của ông Park (Câu hỏi Chi tiết đơn lẻ).","• Câu 198: Số lượng khách hàng tiềm năng đã được thẩm định thu thập được (Câu hỏi Chi tiết số liệu).","• Câu 199: Thành tựu thương mại lớn đạt được vào ngày 26/10 (Câu hỏi Ghép nối Dữ kiện Văn bản 1 \u0026 3).","• Câu 200: Từ vựng theo ngữ cảnh \u0027yielded\u0027 (Câu hỏi Từ vựng).","Bước 3 (3 phút 45 giây) - Cách trả lời \u0026 Dấu hiệu tìm nhanh nhất cho đủ 5 câu hỏi: • Câu 196: Đọc mục Trade Delegation Objectives: \u0027facilitate direct commercial market entry, distribution licensing, and joint-venture partnerships\u0027 -\u003e Chọn (B) facilitate direct commercial partnerships and distribution agreements.","• Câu 197: Nhìn dòng Assigned Suite trên phiếu xác nhận: \u0027Executive Meeting Suite 4\u0027 -\u003e Chọn (C).","• Câu 198: Quét dòng \u0027Qualified Sales Pipeline\u0027 trong báo cáo: \u0027engaged with 142 verified commercial leads during the exhibition floor showcase\u0027 -\u003e Chọn (C) 142.","• Câu 199: Ghép nối: Lịch trình ngày 26/10 là lễ ký MOU + Báo cáo mục \u0027Executed Distribution MOUs: During the October 26 signing ceremony... executed two binding Memorandums of Understanding (MOUs) worth a combined initial procurement value of $1.8 million\u0027 -\u003e Chọn (B).","• Câu 200: \u0027yielded an outstanding top-line marketing return on ad spend (ROAS) multiple of 26.4x\u0027 = mang lại, tạo ra tỷ suất sinh lời gấp 26,4 lần -\u003e \u0027produced\u0027 khớp nghĩa hoàn toàn -\u003e Chọn (A).","Bước 4 (25 giây cuối giờ thi) - Kiểm tra khóa đáp án \u0026 Đúc kết Feynman 1 câu: Toàn bộ chuỗi xúc tiến thương mại B2B: Lịch trình hội chợ Singapore -\u003e 4 cuộc đàm phán tại Suite 4 -\u003e Báo cáo ROI thu về 142 leads và ký 2 MOU $1.8M (ROAS gấp 26.4x) -\u003e Khóa trọn 5 đáp án B-C-C-B-A.","1.3. Dịch Song ngữ Xen kẽ Từng Câu (Sentence-by-Sentence Translation)","Văn bản 1: Chương trình Phái đoàn Xúc tiến Thương mại \u0026 Lịch Kết nối B2B","INTERNATIONAL TRADE ADMINISTRATION — ASIA-PACIFIC EXPANSION INITIATIVE. Official Commercial Program: Singapore International Green Technology Expo. Location: Sands Expo \u0026 Convention Centre, Singapore | Dates: October 24 – 26.","CỤC THƯƠNG MẠI QUỐC TẾ — SÁNG KIẾN MỞ RỘNG KHU VỰC CHÂU Á - THÁI BÌNH DƯƠNG. Chương Trình Thương Mại Chính Thức: Triển Lãm Công Nghệ Xanh Quốc Tế Singapore. Địa điểm: Trung tâm Hội nghị \u0026 Triển lãm Sands Expo, Singapore | Ngày: 24 – 26 tháng 10.","Trade Delegation Objectives: The Asia-Pacific Trade Mission is organized to facilitate direct commercial market entry, distribution licensing, and joint-venture partnerships between high-growth domestic manufacturers and accredited regional commercial distributors across Southeast Asia.","Mục tiêu của Phái đoàn Thương mại: Phái đoàn Thương mại Châu Á - Thái Bình Dương được tổ chức để tạo điều kiện thuận lợi cho việc thâm nhập thị trường thương mại trực tiếp, cấp phép phân phối và thiết lập quan hệ đối tác liên doanh giữa các nhà sản xuất nội địa tăng trưởng cao và các nhà phân phối thương mại khu vực được chứng nhận trên khắp Đông Nam Á.","Official Schedule of Events: • October 24 (09:00 – 12:00): Ministerial Opening Plenary \u0026 Cross-Border E-Commerce Policy Panel (Grand Ballroom).","Lịch trình Sự kiện Chính thức: • 24 tháng 10 (09:00 – 12:00): Phiên Toàn thể Khai mạc Cấp Bộ trưởng \u0026 Tọa đàm Chính sách Thương mại Điện tử Xuyên Biên giới (Khán phòng Lớn).","• October 24 (13:30 – 17:30): Curated B2B Partner Matchmaking Sessions — Pre-scheduled 45-minute structured negotiations between authorized corporate delegates and pre-screened regional retail consortia (Executive Meeting Suites 1–8).","• 24 tháng 10 (13:30 – 17:30): Các Phiên Kết nối Đối tác B2B Chọn lọc — Các cuộc đàm phán có cấu trúc kéo dài 45 phút được lên lịch trước giữa các đại biểu doanh nghiệp được ủy quyền và các tập đoàn bán lẻ khu vực đã được sàng lọc trước (Phòng Họp Điều hành số 1–8).","• October 25 (10:00 – 16:00): Commercial Exhibition Floor Showcasing \u0026 Public Technology Demonstrations (Hall B). • October 26 (14:00 – 16:30): Bilateral Memorandum of Understanding (MOU) Signing Ceremonies \u0026 Networking Gala.","• 25 tháng 10 (10:00 – 16:00): Trưng bày Gian hàng Triển lãm Thương mại \u0026 Trình diễn Công nghệ Công khai (Nhà triển lãm B). • 26 tháng 10 (14:00 – 16:30): Lễ Ký kết Biên bản Ghi nhớ (MOU) Song phương \u0026 Dạ tiệc Kết nối.","Văn bản 2: Phiếu Xác nhận Lịch Đàm phán Kết nối Doanh nghiệp B2B","Singapore International Green Tech Expo — Matchmaking Confirmation Desk. Participating Delegate: Mr. Kenneth Park, International Commercial Director. Company: Nexa CleanTech Appliances Inc. | Assigned Suite: Executive Meeting Suite 4.","Triển Lãm Công Nghệ Xanh Quốc Tế Singapore — Bàn Xác Nhận Kết Nối Đối Tác. Đại biểu Tham dự: Ông Kenneth Park, Giám đốc Thương mại Quốc tế. Công ty: Thiết bị Công nghệ Sạch Nexa | Phòng Chỉ định: Phòng Họp Điều hành Số 4.","Scheduled Matchmaking Bilateral Sessions (October 24): 1. 13:30 – 14:15: MetroAsia Retail Holdings (Represented by Ms. Lin Tan, Procurement Director — Focus: Vietnam \u0026 Malaysia distribution of eco-friendly air purifiers).","Các Phiên Đàm phán Song phương Được Lên lịch (24 tháng 10): 1. 13:30 – 14:15: Tập đoàn Bán lẻ MetroAsia (Đại diện: Bà Lin Tan, Giám đốc Thu mua — Trọng tâm: Phân phối máy lọc không khí thân thiện môi trường tại Việt Nam \u0026 Malaysia).","2. 14:30 – 15:15: Siam Green Distribution Co. (Represented by Mr. Somchai Prasert, Head of Supply Chain — Focus: Commercial air filtration systems for hotel chains in Thailand).","2. 14:30 – 15:15: Công ty Phân phối Xanh Siam (Đại diện: Ông Somchai Prasert, Trưởng bộ phận Chuỗi Cung ứng — Trọng tâm: Hệ thống lọc không khí thương mại cho các chuỗi khách sạn tại Thái Lan).","3. 15:30 – 16:15: Pacific Rim Home Logistics (Represented by Mr. Ronald Wong — Focus: Exclusive wholesale fulfillment in Indonesia). 4. 16:30 – 17:15: Manila Smart Home Ventures (Represented by Ms. Corazon Aquino — Focus: Smart sensor appliances for residential developments).","3. 15:30 – 16:15: Tiếp vận Gia đình Vành đai Thái Bình Dương (Đại diện: Ông Ronald Wong — Trọng tâm: Dịch vụ bán buôn độc quyền tại Indonesia). 4. 16:30 – 17:15: Doanh nghiệp Nhà thông minh Manila (Đại diện: Bà Corazon Aquino — Trọng tâm: Thiết bị cảm biến thông minh cho các khu đô thị nhà ở).","*Protocol Reminder: Commercial delegates must present their valid diplomatic or commercial trade badges at the Suite 4 reception desk 10 minutes prior to their first scheduled bilateral session.","*Nhắc nhở về Quy chế: Các đại biểu thương mại phải xuất trình thẻ thương mại hoặc ngoại giao hợp lệ tại bàn lễ tân Phòng họp 4 trước 10 phút so với phiên đàm phán song phương đầu tiên theo lịch.","Văn bản 3: Báo cáo Kiểm toán Hiệu quả Đầu tư Tiếp thị (Marketing ROI) Sau Hội chợ","To: Board of Directors, Nexa CleanTech Appliances Inc.","From: Kenneth Park, International Commercial Director","Date: November 8","Subject: Executive Audit Report: Singapore Trade Mission ROI \u0026 Distribution Contracts","Kính gửi: Hội đồng Quản trị, Công ty Thiết bị Công nghệ Sạch Nexa","Người gửi: Kenneth Park, Giám đốc Thương mại Quốc tế","Ngày: 8 tháng 11","Tiêu đề: Báo Cáo Kiểm Toán Điều Hành: Hiệu Quả Đầu Tư (ROI) Phái Đoàn Thương Mại Singapore \u0026 Các Hợp Đồng Phân Phối","Executive Summary: Our delegation\u0027s participation in the Singapore International Green Tech Expo (October 24–26) generated unprecedented commercial returns. The comprehensive expenditure for booth space, executive travel, and specialized B2B matchmaking fees totaled $68,000.","Tóm tắt Điều hành: Sự tham gia của phái đoàn chúng ta tại Triển lãm Công nghệ Xanh Quốc tế Singapore (24–26 tháng 10) đã mang lại những kết quả thương mại chưa từng có. Toàn bộ chi phí cho diện tích gian hàng, chi phí công tác của lãnh đạo và phí kết nối đối tác B2B chuyên biệt có tổng giá trị là 68.000 USD.","Key Commercial Metrics \u0026 Deliverables: • Qualified Sales Pipeline: Our team engaged with 142 verified commercial leads during the exhibition floor showcase, with 68 percent classified as high-intent corporate procurement buyers.","Các Chỉ số \u0026 Sản phẩm Thương mại Trọng yếu: • Đường ống Khách hàng Tiềm năng Đủ tiêu chuẩn: Đội ngũ của chúng ta đã tiếp cận với 142 đầu mối thương mại đã được thẩm định trong đợt trưng bày tại sàn triển lãm, với 68% được phân loại là người mua thu mua doanh nghiệp có ý định cao.","• Executed Distribution MOUs: During the October 26 signing ceremony, Nexa successfully executed two binding Memorandums of Understanding (MOUs) worth a combined initial procurement value of $1.8 million: 1. MetroAsia Retail Holdings: Exclusive retail distribution across Vietnam and Malaysia ($1.1M minimum Year 1 purchase volume). 2. Siam Green Distribution: Commercial air purification supply for 40 luxury hotel properties in Thailand ($700k initial contract).","• Các Biên bản Ghi nhớ Phân phối Đã Ký: Trong lễ ký kết ngày 26 tháng 10, Nexa đã ký kết thành công hai Biên bản Ghi nhớ (MOU) ràng buộc có tổng giá trị thu mua ban đầu kết hợp là 1,8 triệu USD: 1. Tập đoàn Bán lẻ MetroAsia: Phân phối bán lẻ độc quyền trên khắp Việt Nam và Malaysia (sản lượng mua sắm tối thiểu Năm 1 là 1,1 triệu USD). 2. Phân phối Xanh Siam: Cung cấp hệ thống lọc không khí thương mại cho 40 bất động sản khách sạn cao cấp tại Thái Lan (hợp đồng ban đầu 700.000 USD).","• Negotiations Ongoing: Advanced contractual due diligence is currently progressing with Pacific Rim Home Logistics regarding Indonesian wholesale rights.","• Đàm phán Đang diễn ra: Quy trình thẩm định hợp đồng chuyên sâu hiện đang tiến triển với Tiếp vận Gia đình Vành đai Thái Bình Dương liên quan đến quyền bán buôn tại Indonesia.","Return on Investment (ROI) Synthesis: With $1.8 million in initial contract volume achieved against a $68,000 marketing expenditure, this mission yielded an outstanding top-line marketing return on ad spend (ROAS) multiple of 26.4x. I strongly recommend expanding our trade mission budget for next year\u0027s European Expansion Tour in Frankfurt. Warm regards, Kenneth Park.","Tổng hợp Hiệu quả Đầu tư (ROI): Với 1,8 triệu USD khối lượng hợp đồng ban đầu đạt được so với khoản chi phí tiếp thị 68.000 USD, chuyến công tác này đã mang lại tỷ suất sinh lời trên chi phí tiếp thị (ROAS) doanh thu vượt trội gấp 26,4 lần. Tôi thực sự khuyến nghị mở rộng ngân sách phái đoàn thương mại cho Chuyến Lưu diễn Mở rộng Châu Âu vào năm tới tại Frankfurt. Trân trọng, Kenneth Park.","1.4. Dịch chi tiết Câu hỏi \u0026 Phương án Trắc nghiệm","196. Mục đích chính của chương trình phái đoàn thương mại tại Singapore là gì?","(A) Tiến hành nghiên cứu khoa học về xu hướng biến đổi khí hậu","(B) Tạo điều kiện thuận lợi cho các quan hệ đối tác thương mại trực tiếp và các thỏa thuận phân phối","(C) Kiểm toán sự tuân thủ của doanh nghiệp đối với các tiêu chuẩn an toàn lao động","(D) Kỷ niệm việc xây dựng một trung tâm hội nghị mới","197. Ông Park đã tiến hành các phiên kết nối đối tác được lên lịch trước của mình ở đâu vào ngày 24 tháng 10?","(A) Khán phòng Lớn (Grand Ballroom)","(B) Sàn Triển lãm Nhà B (Hall B Exhibition Floor)","(C) Phòng Họp Điều hành Số 4 (Executive Meeting Suite 4)","(D) Khách sạn Manila","198. Nexa CleanTech đã thu thập được bao nhiêu đầu mối bán hàng tiềm năng đủ điều kiện trong suốt sự kiện?","(A) 40","(B) 45","(C) 142","(D) 250","199. Theo báo cáo kiểm toán, cột mốc thương mại quan trọng nào đã đạt được vào ngày 26 tháng 10?","(A) Quyết toán tất cả các hóa đơn thi công gian hàng còn tồn đọng","(B) Ký kết hai Biên bản Ghi nhớ phân phối với tổng giá trị ban đầu là 1,8 triệu USD","(C) Hoàn tất mối quan hệ đối tác bán lẻ thương mại tại Đức","(D) Đệ trình một đơn đăng ký bằng sáng chế quốc tế mới","200. Trong báo cáo kiểm toán, từ \"yielded\" ở đoạn 4, dòng 2 có nghĩa gần nhất với","(A) mang lại / tạo ra (produced)","(B) trì hoãn (delayed)","(C) hy sinh (sacrificed)","(D) điều tra (investigated)","1.5. Tóm tắt Viết lại Toàn bài theo Feynman (Feynman Monograph Summary)","English Executive Summary:","• The Asia-Pacific Trade Mission organized bilateral B2B matchmaking sessions at Sands Expo Singapore (October 24–26) to facilitate Southeast Asian market penetration for green tech manufacturers.","• Nexa CleanTech Commercial Director Kenneth Park conducted four structured bilateral distributor sessions in Executive Meeting Suite 4 on October 24.","• Park\u0027s board audit report documented extraordinary results against a $68,000 mission budget: generating 142 qualified leads and executing two binding MOUs on October 26 worth $1.8 million ($1.1M with MetroAsia for Vietnam/Malaysia and $700k with Siam Green for Thailand), achieving an exceptional 26.4x marketing ROAS.","Bản tóm tắt Tiếng Việt cốt lõi:","• Phái đoàn Xúc tiến Thương mại Châu Á - Thái Bình Dương tổ chức các phiên kết nối đối tác B2B tại Sands Expo Singapore (24–26/10) nhằm thúc đẩy ký kết phân phối thiết bị công nghệ xanh tại Đông Nam Á.","• Giám đốc Thương mại Quốc tế Kenneth Park (Nexa CleanTech) tiến hành 4 phiên đàm phán song phương tại Phòng Họp Điều hành Số 4 vào chiều 24/10.","• Báo cáo kiểm toán gửi Hội đồng Quản trị xác nhận kết quả vượt trội so với ngân sách 68.000 USD: thu thập 142 đầu mối liên hệ chất lượng và ký thành công 2 Biên bản Ghi nhớ (MOU) ngày 26/10 trị giá 1,8 triệu USD (MetroAsia 1,1 triệu USD và Siam Green 700.000 USD), đạt tỷ suất sinh lời ROAS gấp 26,4 lần.","PHẦN 2: ACTIVE RECALL 5 GIÂY (BẢNG MA TRẬN ĐỊNH VỊ SONG NGỮ - THẨM MỸ \u0026 TRỰC QUAN)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["• Cơ quan Điều phối Phái đoàn: Cục Thương mại Quốc tế (Sáng kiến Mở rộng Thị trường Châu Á - Thái Bình Dương).","• Doanh nghiệp Xuất khẩu: Nexa CleanTech Appliances Inc. (ông Kenneth Park - Giám đốc Thương mại Quốc tế).","• Các Đối tác Phân phối Khu vực: MetroAsia Retail Holdings (Việt Nam \u0026 Malaysia), Siam Green Distribution (Thái Lan), Pacific Rim Home Logistics (Indonesia).","• Mission Organizer: International Trade Administration (Asia-Pacific Commercial Expansion Initiative).","• Exporting Enterprise: Nexa CleanTech Appliances Inc. (Kenneth Park - International Commercial Director).","• Regional Distributors: MetroAsia Retail Holdings (Vietnam/Malaysia), Siam Green Distribution (Thailand), Pacific Rim Home Logistics (Indonesia)."]],[["2. Boi canh \u0026 Quy trinh loi"],["• Chuỗi Quy trình Xúc tiến Thương mại \u0026 Đánh giá Hiệu quả Đầu tư (B2B Trade Mission Pipeline): Tham gia phái đoàn xúc tiến thương mại quốc tế -\u003e Đàm phán song phương chọn lọc 45 phút/phiên (B2B Matchmaking) -\u003e Trưng bày công nghệ tại gian hàng mở rộng -\u003e Ký kết Biên bản Ghi nhớ (MOU Signing Ceremony) -\u003e Báo cáo kiểm toán hiệu quả đầu tư tiếp thị (Marketing ROAS Audit) chứng minh tỷ suất sinh lời 26.4x để mở rộng ngân sách năm sau.","• Global B2B Trade Promotion Pipeline: Trade Mission Accreditation -\u003e Structured 45-minute Matchmaking Bilaterals -\u003e Exhibition Showcase \u0026 Lead Capture -\u003e Official Bilateral MOU Signing Ceremony -\u003e Executive Marketing ROAS Audit verifying 26.4x revenue yield for budgetary expansion."]],[["3. Dau vet suy luan cheo"],["• Dữ kiện 1: Văn bản 1 lên lịch Lễ ký kết Biên bản Ghi nhớ (MOU Signing Ceremonies) vào chiều ngày 26 tháng 10.","• Dữ kiện 2: Văn bản 3 báo cáo ngày 26 tháng 10 Nexa đã ký thành công 2 MOU ràng buộc trị giá tổng cộng 1,8 triệu USD (MetroAsia 1.1M + Siam Green 700k).","• Kết luận: Ngày 26 tháng 10 là mốc thời gian chốt các thương vụ hợp đồng phân phối triệu đô của phái đoàn.","• Clue 1: Program designates October 26 for official bilateral MOU signing ceremonies.","• Clue 2: Report ratifies that during the October 26 ceremony, Nexa executed two binding MOUs totaling $1.8 million.","• Cross-Synthesis: October 26 represents the contractual conversion milestone where pre-negotiated bilateral agreements transitioned into signed corporate MOUs."]]],"t":"table"},"PHẦN 3: ĐÁP ÁN CHUẨN XÁC \u0026 DẤU VẾT TRUY XUẤT CHÉO (CROSS-REFERENCING \u0026 COMPREHENSIVE TRAP BREAKDOWN)","What was the main purpose of the trade mission program in Singapore?","Dap an dung: (B) To facilitate direct commercial partnerships and distribution agreements","[Dau vet bai doc / Clue]: Program, Trade Delegation Objectives: \u0027organized to facilitate direct commercial market entry, distribution licensing, and joint-venture partnerships between high-growth domestic manufacturers and accredited regional commercial distributors...\u0027","[Dien dat tuong duong / Paraphrase]: facilitate direct commercial market entry, distribution licensing, and joint-venture partnerships \u003c=\u003e facilitate direct commercial partnerships and distribution agreements","[Loi giai chi tiet]: Chương trình phái đoàn xúc tiến thương mại được tổ chức với mục tiêu cốt lõi là hỗ trợ các nhà sản xuất thiết lập quan hệ đối tác kinh doanh, cấp phép phân phối và mở rộng thị trường sang khu vực Đông Nam Á.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) To conduct scientific research on climate change trends","- Ly do sai: Hội chợ về công nghệ xanh (Green Technology Expo), nhưng mục đích là giao thương thương mại và bán sản phẩm chứ không phải nghiên cứu khoa học học thuật.","- Bay ETS: Bẫy Lĩnh vực Học thuật vs Thương mại (Academic vs Commercial Trap)","(C) To audit corporate compliance with labor safety standards","- Ly do sai: Không có cuộc kiểm toán lao động nào diễn ra tại sự kiện xúc tiến thương mại.","- Bay ETS: Bẫy Thanh tra An toàn Lao động (Labor Audit Trap)","(D) To celebrate the construction of a new convention center","- Ly do sai: Sands Expo là trung tâm hội nghị đã hoạt động lâu năm tại Singapore, không phải sự kiện khánh thành.","- Bay ETS: Bẫy Khai trương Cơ sở Vật chất (Inauguration Trap)","Where did Mr. Park conduct his pre-scheduled matchmaking sessions on October 24?","Dap an dung: (C) Executive Meeting Suite 4","[Dau vet bai doc / Clue]: Confirmation Voucher, Header: \u0027Participating Delegate: Mr. Kenneth Park... Assigned Suite: Executive Meeting Suite 4\u0027.","[Dien dat tuong duong / Paraphrase]: Assigned Suite: Executive Meeting Suite 4 \u003c=\u003e Executive Meeting Suite 4","[Loi giai chi tiet]: Phiếu xác nhận của bàn điều phối ghi rõ ông Kenneth Park được phân bổ và tiến hành toàn bộ 4 phiên đàm phán kết nối đối tác tại Phòng Họp Điều hành Số 4 (Executive Meeting Suite 4).","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Grand Ballroom","- Ly do sai: Khán phòng Lớn là nơi tổ chức phiên khai mạc cấp bộ trưởng vào buổi sáng 24/10.","- Bay ETS: Bẫy Địa điểm Buổi sáng (Morning Venue Trap)","(B) Hall B Exhibition Floor","- Ly do sai: Sàn triển lãm Nhà B là nơi trưng bày chung và diễn ra các buổi trình diễn công nghệ vào ngày 25/10.","- Bay ETS: Bẫy Sàn Triển lãm Ngày 25 (Exhibition Floor Trap)","(D) The Manila Hotel","- Ly do sai: Manila Smart Home Ventures là tên của đối tác đàm phán thứ 4, không phải tên địa điểm tổ chức cuộc họp.","- Bay ETS: Bẫy Tên Đối tác Nhầm Địa danh (Partner Name as Venue Trap)","How many qualified prospective sales leads were gathered by Nexa CleanTech during the event?","Dap an dung: (C) 142","[Dau vet bai doc / Clue]: Audit Report, Qualified Sales Pipeline: \u0027Our team engaged with 142 verified commercial leads during the exhibition floor showcase, with 68 percent classified as high-intent corporate procurement buyers.\u0027","[Dien dat tuong duong / Paraphrase]: 142 verified commercial leads \u003c=\u003e 142","[Loi giai chi tiet]: Báo cáo kiểm toán ghi rõ đội ngũ của công ty đã tiếp cận và thu thập được thông tin của 142 đầu mối khách hàng thương mại đã được kiểm chứng tính đủ điều kiện.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) 40","- Ly do sai: 40 là số lượng khách sạn cao cấp tại Thái Lan được cung cấp hệ thống lọc không khí trong hợp đồng của Siam Green.","- Bay ETS: Bẫy Số lượng Khách sạn (Hotel Quantity Trap)","(B) 45","- Ly do sai: 45 phút là thời lượng quy định của mỗi phiên đàm phán B2B.","- Bay ETS: Bẫy Thời lượng Đàm phán (Session Duration Trap)","(D) 250","- Ly do sai: Con số gây nhiễu lấy từ các bài học trước hoặc số lượng doanh nghiệp tham gia hội chợ.","- Bay ETS: Bẫy Dữ liệu Ngẫu nhiên (Random Count Trap)","According to the audit report, what significant commercial milestone was achieved on October 26?","Dap an dung: (B) Execution of two distribution MOUs with a combined initial value of $1.8 million","[Dau vet bai doc / Clue]: Audit Report: \u0027During the October 26 signing ceremony, Nexa successfully executed two binding Memorandums of Understanding (MOUs) worth a combined initial procurement value of $1.8 million: 1. MetroAsia Retail Holdings ($1.1M)... 2. Siam Green Distribution ($700k)...\u0027","[Dien dat tuong duong / Paraphrase]: executed two binding Memorandums of Understanding (MOUs) worth a combined initial procurement value of $1.8 million \u003c=\u003e Execution of two distribution MOUs with a combined initial value of $1.8 million","[Loi giai chi tiet]: Trong lễ ký kết ngày 26 tháng 10, công ty đã chính thức ký kết hai Biên bản Ghi nhớ phân phối ràng buộc có tổng giá trị mua sắm ban đầu đạt 1,8 triệu USD.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Settlement of all outstanding booth fabrication invoices","- Ly do sai: Báo cáo đề cập tổng chi phí $68,000 nhưng không phải mốc sự kiện ngày 26/10.","- Bay ETS: Bẫy Quyết toán Hóa đơn (Invoice Settlement Trap)","(C) Finalization of a commercial retail partnership in Germany","- Ly do sai: Frankfurt (Đức) là kế hoạch mở rộng cho năm sau, các thỏa thuận ngày 26/10 là với đối tác Đông Nam Á.","- Bay ETS: Bẫy Kế hoạch Năm sau (Future Tour Trap)","(D) Filing of a new international patent application","- Ly do sai: Không có hoạt động nộp đơn cấp bằng sáng chế nào được nêu trong báo cáo.","- Bay ETS: Bẫy Sở hữu Trí tuệ Không liên quan (Patent Trap)","In the audit report, the word \"yielded\" in paragraph 4, line 2 is closest in meaning to","Dap an dung: (A) produced","[Dau vet bai doc / Clue]: Audit Report, Paragraph 4: \u0027With $1.8 million in initial contract volume achieved against a $68,000 marketing expenditure, this mission yielded an outstanding top-line marketing return on ad spend (ROAS) multiple of 26.4x.\u0027","[Dien dat tuong duong / Paraphrase]: yielded an outstanding ROAS \u003c=\u003e produced an outstanding ROAS (mang lại / tạo ra / sinh lợi một tỷ suất sinh lời vượt trội)","[Loi giai chi tiet]: Trong ngữ cảnh đầu tư tài chính và phân tích lợi tức thương mại, \u0027yield\u0027 mang nghĩa là sinh ra, mang lại, tạo ra kết quả tài chính, đồng nghĩa với \u0027produced\u0027 hoặc \u0027generated\u0027.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(B) delayed","- Ly do sai: Delayed là trì hoãn, làm chậm trễ; trái ngược hoàn toàn với việc thu về kết quả tức thì.","- Bay ETS: Bẫy Trì hoãn Thời gian (Delay Trap)","(C) sacrificed","- Ly do sai: Sacrificed là hy sinh, mất đi; hoàn toàn sai nghĩa kinh doanh sinh lời.","- Bay ETS: Bẫy Mất mát Tiêu cực (Negative Loss Trap)","(D) investigated","- Ly do sai: Investigated là điều tra, khảo sát; không mang nghĩa tạo ra kết quả tài chính.","- Bay ETS: Bẫy Hành động Nghiên cứu (Research Action Trap)","PHẦN 4: KỸ THUẬT FEYNMAN SONG NGỮ \u0026 SƠ ĐỒ QUY TRÌNH (TƯ DUY PHÂN TÍCH TIẾP THỊ SỐ, PR \u0026 SẢN PHẨM)","4.1. Sơ đồ Quy trình Luân chuyển Nghiệp vụ (End-to-End Business \u0026 Marketing Workflow)","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["Bước 1","Đăng ký Phái đoàn \u0026 Sắp xếp Lịch B2B"],[],["Bước 2","Đàm phán Song phương \u0026 Trình diễn"],[],["Bước 3","Ký kết MOU \u0026 Quyết toán Hiệu quả ROI"]],[["• Chung tu \u0026 Kenh: Cổng Thông tin Cục Thương mại Quốc tế \u0026 Hệ thống Sàng lọc Đối tác","• Nghiep vu thuc thi: Đăng ký tham gia phái đoàn xúc tiến thương mại tại Singapore, nộp hồ sơ năng lực thiết bị và được xếp lịch 4 phiên đàm phán tại Suite 4.","• Ket qua \u0026 Kiem soat: Phiếu xác nhận lịch gặp gỡ đối tác B2B \u0026 Bộ tài liệu phân phối độc quyền."],["➔"],["• Chung tu \u0026 Kenh: Phòng Họp Điều hành Số 4 \u0026 Sàn Triển lãm Trực tiếp (Hall B)","• Nghiep vu thuc thi: Tiến hành 4 phiên đàm phán 45 phút vào chiều 24/10, trình diễn máy lọc không khí tại sàn triển lãm ngày 25/10 và thu thập 142 leads thương mại.","• Ket qua \u0026 Kiem soat: Thỏa thuận sơ bộ hạn mức mua sắm \u0026 142 đầu mối khách hàng doanh nghiệp."],["➔"],["• Chung tu \u0026 Kenh: Lễ Ký kết Biên bản Ghi nhớ Chính thức \u0026 Báo cáo Kiểm toán HĐQT","• Nghiep vu thuc thi: Ký 2 thỏa thuận MOU trị giá 1,8 triệu USD vào ngày 26/10, hạch toán đối soát chi phí $68k và xuất báo cáo ROI chứng minh ROAS đạt 26.4x.","• Ket qua \u0026 Kiem soat: 2 hợp đồng MOU ràng buộc pháp lý \u0026 Phê duyệt mở rộng ngân sách Châu Âu."]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["Step 1","Delegation Registration \u0026 Matchmaking"],[],["Step 2","Bilateral Negotiations \u0026 Technology Demo"],[],["Step 3","MOU Execution \u0026 Executive ROAS Audit"]],[["• Documents \u0026 Channels: International Trade Portal \u0026 Pre-Screened Partner Matching System","• Core Business Execution: Registers for the Singapore Trade Mission, submits clean-tech product portfolios, and schedules four 45-minute bilateral distributor sessions in Suite 4.","• Key Deliverable \u0026 Control: Confirmed B2B bilateral schedule \u0026 Exclusive distribution agreement drafts."],["➔"],["• Documents \u0026 Channels: Executive Meeting Suite 4 \u0026 Hall B Live Exhibition Showcase","• Core Business Execution: Conducts four structured negotiations on Oct 24, delivers live product demonstrations on Oct 25, and captures 142 qualified commercial leads.","• Key Deliverable \u0026 Control: Preliminary volume purchase covenants \u0026 142 verified corporate buyer leads."],["➔"],["• Documents \u0026 Channels: Official Bilateral MOU Signing Ceremony \u0026 Board Audit Ledger","• Core Business Execution: Executes two binding MOUs worth $1.8M on Oct 26, audits $68k budget, and delivers board report demonstrating an extraordinary 26.4x marketing ROAS.","• Key Deliverable \u0026 Control: Two legally binding commercial MOUs \u0026 Authorized European budget expansion."]]],"t":"table"},"4.2. Tư duy Phân tích Nghiệp vụ Tiếp thị Số \u0026 Quản trị Chiến dịch (Bản Tiếng Việt)","• Bức tranh Toàn cảnh Chuỗi Tiếp thị \u0026 Ra mắt Sản phẩm (End-to-End Campaign Flow): Tham gia phái đoàn xúc tiến thương mại quốc tế (Global Trade Mission) và hội chợ B2B là phương thức mở rộng kênh phân phối toàn cầu có hiệu quả đầu tư (ROI) cao nhất nếu được vận hành theo quy trình đàm phán khép kín: (1) Luồng Sàng lọc Đối tác \u0026 Kết nối Sơ bộ (Pre-vetted Matchmaking Flow): Doanh nghiệp không đến hội chợ để \u0027phát tờ rơi dạo\u0027, mà thông qua ban tổ chức để sàng lọc trước năng lực tài chính và mạng lưới bán lẻ của các nhà phân phối khu vực, xếp lịch đàm phán riêng 1-1 trước khi lên máy bay; (2) Luồng Chuyển hóa Đàm phán thành Cam kết Pháp lý (Bilateral Negotiation to MOU Flow): Tận dụng không khí trang trọng của hội chợ để chuyển hóa các phiên thảo luận 45 phút thành các Biên bản Ghi nhớ hợp tác (MOU) ràng buộc sản lượng cam kết tối thiểu (Minimum Annual Guarantee) trong năm đầu tiên; (3) Luồng Kiểm toán Lợi tức Đầu tư Tiếp thị (Marketing ROI \u0026 Resource Allocation Flow): Lãnh đạo doanh nghiệp đo lường hiệu quả chuyến đi bằng con số tài chính cụ thể: so sánh tổng chi phí thực tế ($68,000) với tổng giá trị hợp đồng ký kết ($1,800,000) để tính ra tỷ suất sinh lời ROAS (26.4x), từ đó làm căn cứ bảo vệ đề xuất tăng ngân sách mở rộng sang các thị trường lớn hơn.","• Điểm nghẽn \u0026 Rủi ro Vận hành Thực tế (Core Bottleneck \u0026 Risk): Nút thắt nguy hiểm nhất trong xúc tiến thương mại B2B là \u0027Ký MOU hình thức nhưng không thể chuyển thành đơn đặt hàng thực tế do đứt gãy khâu thẩm định sau hội chợ\u0027 (Paper MOU Breakdown \u0026 Post-Show Churn). Rất nhiều doanh nghiệp ký biên bản ghi nhớ rầm rộ tại sự kiện nhưng sau đó không có đội ngũ pháp chế và logistics theo sát kiểm tra năng lực thanh toán qua Thư tín dụng (L/C) của đối tác, khiến thỏa thuận triệu đô trở thành hợp đồng giấy vô nghĩa.","• 3 Giải pháp Thiết kế Hệ thống \u0026 Kiểm soát Nghiệp vụ (BA, MarTech \u0026 Campaign Architecture):","(1) Thiết lập Hệ thống CRM Quản trị Phễu Khách hàng Triển lãm (Event-Integrated B2B Lead Management System): Trang bị máy quét mã vạch thẻ đại biểu (Badge Scanner) đồng bộ tức thì thông tin của 142 khách hàng vào CRM, tự động phân loại mức độ tiềm năng (A/B/C) và kích hoạt email cảm ơn kèm tài liệu kỹ thuật trong vòng 24 giờ sau cuộc gặp.","(2) Quy trình Thẩm định Pháp lý \u0026 Tài chính Ngân hàng Hậu Triển lãm (Post-Show Due Diligence \u0026 Bank Escrow Protocol): Quy định trong vòng 14 ngày sau khi ký MOU, đối tác phân phối phải mở Thư tín dụng không hủy ngang (Irrevocable L/C) hoặc đặt cọc bảo lãnh thực hiện hợp đồng tại ngân hàng chỉ định trước khi cấp quyền phân phối độc quyền.","(3) Mô hình Đánh giá Hiệu quả Tiếp thị Đa Nhân tố (Multi-Factor Marketing ROI Matrix): Xây dựng bảng đối soát tài chính trên hệ thống ERP tích hợp toàn bộ chi phí vé máy bay, khách sạn, thuê mặt bằng, thiết kế gian hàng và đối soát với doanh thu thu tiền thực tế phát sinh trong 12 tháng tiếp theo để tính toán chỉ số LTV (Customer Lifetime Value).","• Tam giác Liên kết Nhận thức Đa chiều (Multi-Perspective Contextual Anchoring):","1. Lăng kính Viễn thông / CNTT Viettel: Viettel Global khi tham gia các diễn đàn xúc tiến đầu tư viễn thông quốc tế tại Châu Phi hay Mỹ Latinh: Tiếp cận các cơ quan quản lý viễn thông sở tại, đàm phán giấy phép tần số và ký kết các thỏa thuận hợp tác phát triển hạ tầng mạng viễn thông số với giá trị hàng trăm triệu USD.","2. Lăng kính Quản trị \u0026 Marketing Giáo dục (Trường Mầm non Ước Mơ Xanh - cô Thu Huyền): Tham gia Diễn đàn Giáo dục Mầm non Quốc tế: Gặp gỡ các đối tác chuyển giao bản quyền chương trình STEAM mầm non từ Singapore/Hàn Quốc, ký thỏa thuận ghi nhớ hợp tác thử nghiệm giáo trình mới và đào tạo giáo viên chuẩn quốc tế cho trường.","3. Lăng kính Bàn học Gia đình (Kèm cặp học sinh Lớp 5 - Bé Hà Ngân): Bài học về đánh giá kết quả công việc (Đo lường ROI cá nhân): Dạy bé Hà Ngân cách nhìn lại một tuần học tập: So sánh thời gian và công sức mình đã bỏ ra (như chi phí đầu tư) với kết quả bài kiểm tra và sự tiến bộ của bản thân; nếu phương pháp nào mang lại kết quả cao thì tiếp tục phát huy và nhân rộng (như việc mở rộng ngân sách cho thị trường mới).","4.3. Business Analyst \u0026 Marketing Technology Executive Summary (Bản Tiếng Anh)","• End-to-End Marketing Campaign \u0026 Launch Context: Global B2B trade expansion maximizes marketing capital by integrating pre-screened bilateral matchmaking (curating high-intent distributor cohorts prior to travel), commercial stagecraft, formal MOU signing milestones, and analytical return-on-marketing-spend (ROAS) verification.","• Core Campaign Bottleneck \u0026 Risk: Non-binding \u0027paper MOUs\u0027 that fail post-show contract conversion due to delayed technical due diligence, lack of structured CRM follow-up protocols, and unverified distributor creditworthiness.","• Key MarTech \u0026 Product Launch Architecture Solutions:","(1) Deploy synchronized digital badge-scanning telemetry feeding commercial booth traffic directly into enterprise CRM funnels with automated 24-hour lead routing.","(2) Institutionalize a 14-day post-expo commercial covenant mandating the issuance of irrevocable bank Letters of Credit (L/C) before activating regional exclusivity territorial rights.","(3) Enforce an ERP-integrated Multi-Factor Marketing ROI tracking module consolidating travel, space, and collateral expenses against trailing 12-month net distributor revenue collections.","• Multi-Perspective Contextual Anchoring (Three Practical Lenses):","1. Viettel Telecom / IT Enterprise Lens: Viettel Global commercial delegations: orchestrating sovereign market entry negotiations, securing international telecom operating concessions, and executing multi-million-dollar infrastructure partnerships.","2. Preschool Education Management Lens (Uoc Mo Xanh Kindergarten - Principal Thu Huyen): Attending international early childhood symposia: negotiating international STEAM curriculum licensing rights and executing partnership MOUs for teacher professional development.","3. Family Study Desk Lens (Tutoring 5th Grader - Ha Ngan): Evaluating effort versus outcome: Ha Ngan learns to reflect on her weekly study investment (time and focus dedicated to challenging grammar or math modules) against her academic test mastery, reinforcing self-directed efficiency.","PHẦN 5: TỪ VỰNG \u0026 PARAPHRASE CHUYÊN SÂU (CHUẨN 3 DÒNG TỐI ƯU NẠP ANKI)","Trade mission  /treɪd ˈmɪʃ.ən/  Commercial delegation / International market expansion tour","Nghia: Phái đoàn xúc tiến thương mại quốc tế gồm các doanh nghiệp và đại diện chính phủ ra nước ngoài tìm kiếm cơ hội hợp tác kinh doanh.","Vd: The international trade mission facilitated direct market entry across Southeast Asian economies. - Phái đoàn xúc tiến thương mại quốc tế đã tạo điều kiện thuận lợi cho việc thâm nhập thị trường trực tiếp trên khắp các nền kinh tế Đông Nam Á.","B2B matchmaking  /biː tuː biː ˈmætʃˌmeɪ.kɪŋ/  Curated partner pairing / Pre-scheduled bilateral negotiations","Nghia: Hoạt động kết nối kinh doanh doanh nghiệp với doanh nghiệp được sắp xếp và lên lịch gặp gỡ trước theo nhu cầu hợp tác.","Vd: The B2B matchmaking sessions allowed corporate delegates to conduct 45-minute structured negotiations. - Các phiên kết nối đối tác B2B cho phép các đại biểu doanh nghiệp tiến hành các cuộc đàm phán có cấu trúc kéo dài 45 phút.","Memorandum of Understanding (MOU)  /ˌmem.əˈræn.dəm əv ˌʌn.dəˈstæn.dɪŋ/  Preliminary commercial pact / Framework cooperation accord","Nghia: Biên bản ghi nhớ hợp tác thương mại xác lập các nguyên tắc và cam kết ban đầu giữa hai hay nhiều bên.","Vd: Nexa executed two binding MOUs with regional distributors worth an initial $1.8 million. - Nexa đã ký kết hai biên bản ghi nhớ hợp tác ràng buộc với các nhà phân phối khu vực có giá trị ban đầu là 1,8 triệu USD.","Marketing ROAS multiple  /ˈmɑː.kɪ.tɪŋ ɑːr əʊ eɪ es ˈmʌl.tɪ.pəl/  Top-line revenue return ratio / Campaign capital efficiency factor","Nghia: Hệ số tỷ suất sinh lời doanh thu trên mỗi đồng chi phí đầu tư tiếp thị.","Vd: The trade mission yielded an exceptional marketing ROAS multiple of 26.4x against total expenses. - Chuyến công tác xúc tiến thương mại đã mang lại hệ số tỷ suất sinh lời tiếp thị vượt trội gấp 26,4 lần so với tổng chi phí.","Distribution licensing  /ˌdɪs.trɪˈbjuː.ʃən ˈlaɪ.səns.ɪŋ/  Territorial commercial franchise / Regional sales authorization","Nghia: Việc cấp phép quyền phân phối sản phẩm độc quyền hoặc không độc quyền cho đối tác tại một khu vực địa lý cụ thể.","Vd: The corporate director negotiated exclusive distribution licensing rights for the Vietnamese retail market. - Giám đốc doanh nghiệp đã đàm phán cấp quyền phân phối độc quyền cho thị trường bán lẻ Việt Nam.","Qualified commercial leads  /ˈkwɒl.ɪ.faɪd kəˈmɜː.ʃəl liːdz/  Vetted business prospects / High-intent procurement contacts","Nghia: Các đầu mối liên hệ khách hàng thương mại đã được thẩm định và xác minh có nhu cầu và khả năng tài chính thực tế.","Vd: The exhibition booth generated 142 qualified commercial leads during the 3-day trade showcase. - Gian hàng triển lãm đã tạo ra 142 đầu mối thương mại đủ điều kiện trong suốt 3 ngày trưng bày thương mại.","Contractual due diligence  /kənˈtræk.tʃu.əl dʒuː ˈdɪl.ɪ.dʒəns/  Legal background verification / Counterparty risk investigation","Nghia: Quy trình thẩm định pháp lý và năng lực tài chính toàn diện của đối tác trước khi ký hợp đồng chính thức.","Vd: Contractual due diligence is currently underway to assess the distributor\u0027s regional creditworthiness. - Quy trình thẩm định hợp đồng hiện đang được tiến hành để đánh giá uy tín tín dụng khu vực của nhà phân phối.","Wholesale fulfillment  /ˈhəʊl.seɪl fʊlˈfɪl.mənt/  Bulk order logistics / B2B inventory delivery execution","Nghia: Quy trình xử lý, lưu kho và hoàn tất các đơn đặt hàng bán buôn quy mô lớn cho mạng lưới đại lý.","Vd: Pacific Rim Logistics specialized in wholesale fulfillment across major island territories. - Công ty Tiếp vận Vành đai Thái Bình Dương chuyên trách xử lý đơn hàng bán buôn trên các vùng lãnh thổ hải đảo lớn.","==================================================================================================","PHẦN TỔNG KẾT: MA TRẬN 60 THUẬT NGỮ VÀNG MARKETING SỐ, PR, QUẢNG BÁ THƯƠNG HIỆU \u0026 RA MẮT SẢN PHẨM (SPACED REPETITION ANKI)",{"rows":[[["STT"],["Cụm từ gốc trong đề ETS"],["Paraphrase đồng nghĩa"],["Ý nghĩa nghiệp vụ thực tế"]],[["1"],["Omnichannel analytics"],["Cross-platform data tracking / Unified attribution modeling"],["Phân tích tiếp thị đa kênh hợp nhất từ mạng xã hội, tìm kiếm đến hiển thị số"]],[["2"],["Return on ad spend (ROAS)"],["Advertising revenue ratio / Campaign profitability yield"],["Tỷ suất sinh lời trên chi phí quảng cáo (Doanh thu tạo ra trên mỗi đồng chi phí)"]],[["3"],["Customer acquisition cost (CAC)"],["Cost per new customer / Prospect conversion expenditure"],["Chi phí để thu hút và chuyển đổi thành công một khách hàng mới"]],[["4"],["Multi-touch attribution"],["Customer journey attribution / Cross-channel credit allocation"],["Mô hình quy kết đa điểm chạm phân bổ giá trị cho từng kênh tương tác"]],[["5"],["Predictive bidding engine"],["Algorithmic ad auction / Automated machine-learning bid system"],["Công cụ đấu thầu giá quảng cáo tự động hóa dựa trên thuật toán AI dự đoán"]],[["6"],["Retainer fee"],["Fixed recurring service charge / Monthly advisory fee"],["Khoản phí duy trì dịch vụ cố định hàng tháng trả cho đơn vị tư vấn hoặc agency"]],[["7"],["Onboarding fee"],["Initial system configuration fee / Setup implementation charge"],["Khoản phí khởi tạo hệ thống và cấu hình kỹ thuật ban đầu của phần mềm"]],[["8"],["Credit deduction"],["Billing offset / Invoice credit adjustment / Account reimbursement"],["Khoản khấu trừ tín dụng giảm trừ số tiền phải thanh toán trên hóa đơn"]],[["9"],["Press embargo"],["News disclosure hold / Publication blackout until specific date"],["Lệnh cấm cơ quan báo chí công bố thông tin trước giờ G quy định"]],[["10"],["Non-disclosure agreement (NDA)"],["Confidentiality covenant / Proprietary trade secrecy contract"],["Thỏa thuận bảo mật thông tin cam kết không tiết lộ cho bên thứ ba"]],[["11"],["Media credentialing"],["Press accreditation / Reporter identity verification gate"],["Quy trình thẩm định và cấp thẻ tác nghiệp báo chí ch ic billboard advertising / Public digital display network"],["Quảng cáo kỹ thuật số ngoài trời trên các màn hình LED hoành tráng tại khu đô thị"]],[["46"],["Proof of Performance (PoP)"],["Broadcast execution verification / Certified playout audit"],["Biên bản chứng nhận kiểm toán bằng chứng phát sóng quảng cáo kèm dữ liệu thời gian thực"]],[["47"],["Individually serialized"],["Sequentially numbered edition / Uniquely cataloged timepiece"],["Được đánh số sê-ri riêng lẻ khẳng định tính giới hạn và độc bản của sản phẩm cao cấp"]],[["48"],["Bespoke engraving"],["Custom-made monogram inscription / Tailored laser etching"],["Dịch vụ khắc chữ lồng thủ công cá nhân hóa theo yêu cầu riêng của khách hàng thượng lưu"]],[["49"],["Trade mission"],["Commercial delegation / International market expansion tour"],["Phái đoàn xúc tiến thương mại quốc tế tìm kiếm đối tác và mở rộng kênh phân phối xuất khẩu"]],[["50"],["Memorandum of Understanding (MOU)"],["Preliminary commercial pact / Framework cooperation accord"],["Biên bản ghi nhớ hợp tác xác lập các nguyên tắc và hạn mức thương mại ban đầu"]]],"t":"table"}]</script>

<script>
(function(){
const RAW = JSON.parse(document.getElementById('src').textContent);
const VI_RE = /[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i;

function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function add(p,...kids){ kids.forEach(k=>k&&p.appendChild(k)); return p; }
const isStr = x => typeof x === 'string';

/* ---------- split document ---------- */
const intro = RAW.slice(0,3);
const lessons = [];
let cur=null, finalTable=null, finalTitle='';
for(let i=3;i<RAW.length;i++){
  const it=RAW[i];
  if(isStr(it) && /^[=\-]{10,}$/.test(it)) continue;

  if(isStr(it) && /^BÀI THỰC HÀNH SỐ\s*\d+/.test(it)){ const t=it.replace(/^BÀI THỰC HÀNH SỐ\s*\d+\s*:?\s*/,''); cur={items:t?[t]:[]}; lessons.push(cur); continue; }

  if(isStr(it) && /^BÀI\s+\d+\s*:/.test(it)){ cur={items:[it.replace(/^BÀI\s+\d+\s*:\s*/,'')]}; lessons.push(cur); continue; }
  if(isStr(it) && /^(BẢNG TỔNG HỢP|PHẦN TỔNG KẾT|PHAN TONG KET)/.test(it)){ cur=null; finalTitle=it; continue; }

/* a lesson written without "PHẦN n:" lines ("1. ĐỀ BÀI GỐC" … "5. CÔ ĐỌNG", "ACTIVE RECALL 5S" + table,
   "ĐÁP ÁN CHI TIẾT", "4.1 …", "BỘ TỪ VỰNG …") gets the PHẦN / "1.N." lines the parser expects */
function normalizeNoParts(arr){
  if(arr.some(s=>isStr(s)&&/^PHẦN\s*\d\s*:/i.test(s))) return arr;
  const up=s=>s===s.toUpperCase()&&/[A-ZÀ-Ỹ]{3}/.test(s);
  const out=[]; let ph=0, last1=0, p2tab=false;
  arr.forEach(it=>{
    if(!isStr(it)){ if(ph===1&&last1>=5){ out.push('PHẦN 2: Active Recall 5S'); ph=2; } if(ph===2) p2tab=true; out.push(it); return; }
    const m=it.match(/^([1-5])\.\s+(.+)$/);
    if(m&&up(m[2])&&ph<=1){ if(!ph){ out.push('PHẦN 1: Văn bản đọc hiểu & dịch song ngữ'); ph=1; } out.push(`1.${m[1]}. ${m[2]}`); last1=+m[1]; return; }
    if(ph===1&&last1>=5&&up(it)&&/ACTIVE RECALL/i.test(it)){ out.push('PHẦN 2: '+it); ph=2; return; }
    if(ph===2&&p2tab){ ph=3; if(up(it)){ out.push('PHẦN 3: '+it); return; } out.push('PHẦN 3: Đáp án & dấu vết truy xuất'); }
    if(ph===3&&/^4\.1\s/.test(it)){ out.push('PHẦN 4: Phân tích Feynman & quy trình nghiệp vụ'); ph=4; }
    if(ph===4&&up(it)&&/TỪ VỰNG|VOCABULARY/i.test(it)){ out.push('PHẦN 5: '+it); ph=5; return; }
    out.push(it);

}
lessons.forEach((L,idx)=>{
  L.n=idx+1;
  let t=L.items[0]; const tq=t.match(/\s*\((Questions?\s*\d+\s*-\s*\d+[^()]*)\)\s*$/); if(tq) t=t.slice(0,tq.index);
  // trailing "(ENGLISH TITLE)" only when it is a real English title, not a short term like "(Credit Memo)":
  // 4+ words, or an all-caps title of 2+ words such as "(GRAPHIC DESIGN ASSOCIATE)"
  const m=t.match(/^(.*)\s\(([^()]*)\)\s*$/); const nw=m?m[2].split(/\s+/).length:0;
  const isEn=m&&!isVI(m[2])&&(nw>=4||(nw>=2&&m[2]===m[2].toUpperCase()&&/[A-Z]/.test(m[2])));
  L.vi = isEn?m[1]:t; L.en = isEn?m[2]:'';
  L.src = L.items[1].replace(/^Nguồn( bài học)?:\s*/,'');
  const q=(L.src+' '+L.items[0]).match(/Questions?\s*(\d+)\s*-\s*(\d+)/); L.qr = q?`Q${q[1]}–${q[2]}`:'';
  if(!SHORT[idx]){ const w=L.vi.split(/\s+/).slice(0,4).join(' ').toLowerCase(); SHORT[idx]=w.charAt(0).toUpperCase()+w.slice(1); }
  L.parts=[]; let P=null, S=null;
  for(const it of normalizeNoParts(L.items.slice(2))){
    if(isStr(it)){
      const pm=it.match(/^PHẦN\s*(\d)\s*:\s*(.*)$/i);
      if(pm){ P={n:+pm[1],title:pm[2],subs:[],items:[]}; L.parts.push(P); S=null; continue; }
      // "1.1. Title" or, in some docs, "1.1 ALL-CAPS TITLE" (no dot: only an upper-case title, so "1.5 million…" stays content)
      let sm=it.match(/^(\d\.\d)\.\s+(.*)$/); if(!sm){ sm=it.match(/^(\d\.\d)\s+(.+)$/); if(sm && sm[2]!==sm[2].toUpperCase()) sm=null; }
      // a doc that skips the "PHẦN 4:" line goes from PHẦN 3 straight to "4.1. ALL-CAPS TITLE": open PHẦN 4 there
      if(sm && P && +sm[1][0]===P.n+1 && sm[1][2]==='1' && P.n>=2 && sm[2]===sm[2].toUpperCase()){
        P={n:P.n+1,title:P.n+1===4?'PHÂN TÍCH FEYNMAN & QUY TRÌNH NGHIỆP VỤ':'PHẦN '+(P.n+1),subs:[],items:[]}; L.parts.push(P); }
      // only "N.x." of the current PHẦN N opens a sub-section; "4.1. Package…" inside a passage is content
      if(sm && P && +sm[1][0]===P.n){ S={id:sm[1],title:sm[2],items:[]}; P.subs.push(S); continue; }
    }
    if(S) S.items.push(it); else if(P) P.items.push(it);
  }
  // answer key from part 3
  L.key={}; L.answers=[];
  const p3=L.parts.find(p=>p.n===3);
  // two formats: "186. (A) text" + [Dau vet]/[Giai thich]
  //          or  "186. stem" + "Dap an dung: (A) text" + [Dau vet bai doc]/[Dien dat tuong duong]/[Loi giai chi tiet]/[Phan tich Phuong an Sai] + "(B) ..." "- Ly do sai:" "- Bay ETS:"
  //          or  an unnumbered stem line right before "Dap an dung:" (numbered from the lesson's "Questions N-M")
  if(p3){ let a=null, sec='';
    const newA=no=>{ a={no,k:'',t:'',stem:'',trace:'',expl:'',para:[],wrong:[]}; L.answers.push(a); sec=''; };
    // first question number: "Questions 181-185" in the title/source, else the first "181…" line after "[ORIGINAL ETS QUESTIONS"
    const iq=L.items.findIndex(s=>isStr(s)&&/^\[ORIGINAL ETS QUESTIONS/i.test(s)), fq=iq<0?null:L.items.slice(iq+1).find(s=>isStr(s)&&/^\d{3}(\.|\s|$)/.test(s));
    const s3=p3.items.filter(isStr), q0=+(((L.src+' '+L.items[0]).match(/Questions?\s*(\d+)/)||[])[1]||(fq||'').slice(0,3)||0);
    for(let j=0;j<s3.length;j++){ const s=s3[j];
      let m=s.match(/^(\d{3})\.\s*\(([A-D])\)\s*(.*)$/);
      if(m){ newA(m[1]); a.k=m[2]; a.t=m[3]; L.key[m[1]]=m[2]; continue; }
      m=s.match(/^(\d{3})\.\s+(.*)$/);
      if(m){ newA(m[1]); a.stem=m[2]; continue; }

      if(q0 && /^Dap an dung:/i.test(s3[j+1]||'') && !/^[\[(-]/.test(s) && (!a||a.k)){ newA(String(q0+L.answers.length)); a.stem=s; continue; }
      if(!a) continue;
      m=s.match(/^Dap an dung:\s*\(([A-D])\)\s*(.*)$/i);
      if(m){ a.k=m[1]; a.t=m[2]; L.key[a.no]=m[1]; continue; }
      m=s.match(/^\[([^\]]+)\]:?\s*(.*)$/);
      if(m){ const lab=m[1], rest=m[2];
        if(/^Dau vet/i.test(lab)){ sec='trace'; a.trace=rest; }
        else if(/Paraphrase|Dien dat/i.test(lab)){ sec='para'; rest.split(/\s*•\s*/).filter(Boolean).forEach(x=>a.para.push(x)); }
        else if(/Phuong an Sai|Bay/i.test(lab)){ sec='wrong'; }

        m=s.match(/^\(([A-D])\)\s*(.*)$/); if(m){ a.wrong.push({k:m[1],t:m[2],why:'',trap:''}); continue; }
        const w=a.wrong[a.wrong.length-1]; m=s.match(/^-\s*(Ly do sai|Bay ETS)\s*:\s*(.*)$/i);
        if(w&&m){ if(/^Ly/i.test(m[1])) w.why=m[2]; else w.trap=m[2]; continue; }
      }
      if(sec==='para' && /^•/.test(s)){ a.para.push(s.replace(/^•\s*/,'')); continue; }
      if(sec==='trace'){ a.trace+=' '+s; continue; }
      a.expl += (a.expl?' ':'')+s;
    }
  }
});
const TABS = lessons.map(L=>({id:'bai'+L.n, n:String(L.n).padStart(2,'0'), label:SHORT[L.n-1]||('Bài '+L.n), sub:L.qr, c:`var(--c${L.n})`}));
const NFIN = finalTable ? finalTable.rows.length-1 : 50;
const FINLABEL = /THU[ẬA]T NG[ỮU]/i.test(finalTitle) ? `${NFIN} thuật ngữ vàng` : `${NFIN} cặp Paraphrase`;
// newer docs end with PHẦN 5 of the last lesson and have no summary table: no paraphrase tab then
if(finalTable) TABS.push({id:'paraphrase', n:String(NFIN), label:FINLABEL, sub:'Tổng hợp nạp Anki', c:'var(--red)'});

/* ---------- line formatting for passages ---------- */
// passage header: known doc types, a bare "[Internal Recommendation] Letter", or generic "Doc Type [N] (Descriptor)";
// a bracket holding a date ("Boston (January 3)", "(Evaluated by …, Director — March 28)") is a dateline or caption, not a header
const DOC_RE=/^(E-mail|Email|Letter \d|Document \d|Internal Memorandum|Webpage|Press Release|Bill of Lading|Economic Logistics Article|Service Proposal)\b|^(?:[A-Z][a-z]+ ){0,3}Letter$|^[A-Z][A-Za-z&\/\- ]{2,50}(?: \d)? \((?![^()]*\b(?:January|February|March|April|May|June|July|August|September|October|November|December) \d)[A-Za-z][^()]*\)$/;
// an ALL-CAPS line like "REQUEST FOR PROPOSALS (RFP #VF-2026-08)" is a letterhead inside a passage, not a new passage
// "Document 2: Cloud Infrastructure Monitoring & Incident Report" names the paper after the colon
const isDocHead=s=>(/^((Document|Passage|Text)\s*\d+|Internal Memorandum|Memorandum)\s*:\s*\S/.test(s) && s.length<140) || (DOC_RE.test(s) && s.length<110 && !/:\s/.test(s) && !(s===s.toUpperCase() && /[A-Z]{4}/.test(s)));
function fmtLine(s){
  if(/^•\s*/.test(s)) return el('div','ln-bul',s.replace(/^•\s*/,''));
  const kv=s.match(/^([A-ZÀ-Ỹa-zà-ỹ][^:]{0,30}):\s+(.+)$/);
  if(kv && !/[.!?]$/.test(kv[1]) && kv[1].split(' ').length<=5){ const d=el('div','ln-kv'); add(d,el('b',null,kv[1]+':'),document.createTextNode(kv[2])); return d; }
  if(s===s.toUpperCase() && /[A-ZÀ-Ỹ]{3}/.test(s) && s.length<130) return el('div','ln-caps',s);
  if(/:$/.test(s) && s.length<60) return el('div','ln-sec',s);
  return el('p',null,s);
}

/* "• Label: text" bullet with a bold label; "• Label:" alone becomes a group heading */
function bullet(s){
  s=s.trim();
  if(/^[^:]{2,150}:$/.test(s)) return el('div','ln-head',s.slice(0,-1));
  const d=el('div','ln-bul'); const m=s.match(/^([^:]{2,150}?):\s+(.*)$/);
  if(m && !/[.!?]$/.test(m[1])){ let rest=m[2]; if(rest.startsWith(m[1]+':')) rest=rest.slice(m[1].length+1).trim();
    add(d,el('b',null,m[1]+': '),document.createTextNode(rest)); }
  else d.textContent=s;
  return d;
}
/* one line of a strategy / BA block: "• ..." bullet, "=> ..." conclusion, "(1) ..." numbered point, else paragraph */
function richLine(s){
  s=s.trim();
  if(/^•/.test(s)){ const r=s.replace(/^•\s*/,''); return r.trim()?bullet(r):null; }
  if(/^=>/.test(s)){ const d=bullet(s.replace(/^=>\s*/,'')); d.className='ln-concl'; return d; }
  if(/^\(\d+\)/.test(s)){ const d=bullet(s); d.className='ln-num'; return d; }
  if(/^-\s/.test(s)){ const d=bullet(s.replace(/^-\s*/,'')); d.className='ln-sub'; return d; }
  return el('p',null,s);
}

/* ---------- renderers ---------- */
function partShell(L,P){
  const sec=el('section','part'); sec.id=`b${L.n}-p${P.n}`;
  const h=el('div','part-h'); add(h,el('span','pn','PHẦN '+P.n),el('h3',null,P.title)); sec.appendChild(h);

function subShell(L,S){

}

/* mode 'pass' = original passages only, 'quiz' = original questions only, 'strat' = strategy steps before the passages,
   'guide' = the whole sub-section is strategy (newer docs give it its own "Hướng dẫn làm bài Part 7" sub-section) */
function render11(L,items,box,mode){
  // passages start at "[ORIGINAL ETS PASSAGES…]", else at "Questions N-M refer to…" or the first passage header after the last "Bước" line
  let iP=items.findIndex(s=>isStr(s)&&/^\[ORIGINAL ETS PASSAGES/i.test(s)), pSkip=1;
  if(iP<0){ iP=items.findIndex(s=>isStr(s)&&/^Questions\s+\d+.*refer to/i.test(s)); pSkip=0; }
  if(iP<0){ let lastStep=-1; items.forEach((s,i)=>{ if(isStr(s)&&/^Bước\s*\d+\s*\(/.test(s)) lastStep=i; });
    iP=items.findIndex((s,i)=>i>lastStep&&isStr(s)&&(isDocHead(s)||/^\[Passage/i.test(s))); pSkip=0; }
  if(mode==='guide'){ iP=items.length; mode='strat'; }  // a stand-alone strategy sub-section is all strategy
  const iQ=items.findIndex(s=>isStr(s)&&/^(\[ORIGINAL ETS QUESTIONS|ETS Questions:?$)/i.test(s));
  const strat=items.slice(0,iP<0?0:iP), pass=items.slice(iP<0?0:iP+pSkip,iQ<0?items.length:iQ), qs=iQ<0?[]:items.slice(iQ+1);
  if(strat.length && mode==='strat'){
    const st=el('div','strat'); const steps=el('div','steps'); let lastTx=null;
    const addBody=(tx,text)=>{ text.split(/\s+•\s+/).forEach((seg,i)=>{ seg=seg.replace(/^•\s*/,'').trim(); if(seg) tx.appendChild(i||/^•/.test(text)?bullet(seg):el('p',null,seg)); }); };
    strat.forEach(s=>{
      // "Bước 1 (30 giây) - Title: body", or "Bước 4 (25 giây cuối + Đúc kết Feynman): body" with no title
      const m=s.match(/^(Bước\s*\d+)\s*\(([^)]+)\)\s*(?:-\s*([^:]+?))?:\s*(.*)$/);
      if(m){ const r=el('div','step'); const w=el('div','when'); add(w,el('b',null,m[1]),el('span',null,m[2]));

  if(mode==='strat') return;

  const papers=el('div','papers'); let pp=null, refer='';
  const newPaper=(tag)=>{ pp=el('article','paper'); if(tag) pp.appendChild(el('span','paper-tag',tag)); papers.appendChild(pp); };
  pass.forEach(s=>{
    if(!isStr(s)) return;

  // "Double/Triple Passage" lessons whose papers have free-form headers: re-split into the expected number of papers
  const nExp=(t=>/Triple/i.test(t)?3:/Double/i.test(t)?2:/Single/i.test(t)?1:0)(L.src+' '+L.items[0]);

    const titleLike=s=>/^[A-Z][A-Za-z0-9&\/\-,'’()#. ]+$/.test(s)&&!/\.$/.test(s)&&s.length<90&&s.split(' ').length>=3;
    // metadata under a masthead: "To:", "Date:", "Work Order: #… | Location: …", "Submitted By: …", "Dear …"
    const meta=s=>/^(To|From|Date|Subject|Re|Attn|Ref|Memo|Issued|Sent|Posted|Submitted By|Notice Issued|Guest|Tenant|Ticket|Invoice|Order|Booking|Work Order)\b[^:]{0,24}:|\|\s*(Issued|Date|Ref)\b|^Dear\b|^[A-Z][\w ]{0,30}\b(Date|Reference|Ref|Number|ID)\s*:/i.test(s)||(/^[A-Z][\w .#&\/-]{1,30}:\s\S/.test(s)&&/\s\|\s/.test(s));

    const headish=s=>{ if(!(s.length<100&&/^[A-Z]/.test(s)&&!/[.!?,;:]$/.test(s)&&!/\s\|\s/.test(s)&&s.split(' ').length<=14)) return false;
      const lb=s.match(/^([^:]{1,40}):\s/); return !lb||/Memo|Memorandum|Notice|Report|Letter|Bulletin|Announcement/i.test(lb[1]); };

    // English titles of the translated papers: "VĂN BẢN 1: … (INTERNAL DIRECTIVE & DECARBONIZATION MANDATE)"
    const tr=(L.parts[0]&&L.parts[0].subs||[]).flatMap(S=>S.items).filter(s=>isStr(s)&&/^\[?Văn bản\s*\d+/i.test(s));
    const titles=tr.map(s=>{ const m=s.match(/\(([^()]{8,})\)\s*\]?\s*:?$/); return m?U(m[1]):''; }).filter(t=>t.length>=8);
    const groups=[];
    lines.forEach((s,i)=>{ let sc=0; const u=U(s);
      if(/^Passage\s*\d+\s*:/i.test(s)||/\((DOCUMENT|PASSAGE|TEXT)\s*\d+(\s*OF\s*\d+)?\)\s*$/i.test(s)) sc=4;  // "… (DOCUMENT 2 OF 3)"

      else if((caps(s)||isDocHead(s))&&!addr(s)&&titles.some(t=>u.length>=8&&u.length<=t.length*2&&(u.includes(t)||t.includes(u)))) sc=3;
      else if(isDocHead(s)) sc=2.5;

      else if(headish(s)&&!addr(s)&&!meta(s)&&lines.slice(i+1,i+6).some(x=>meta(x)&&!/^Dear\b/.test(x))) sc=2;
      else if(titleLike(s)&&!addr(s)&&!meta(s)&&lines[i+1]&&(titleLike(lines[i+1])||/\s—\s/.test(lines[i+1]))) sc=1.5;  // two-line masthead

      // signature block after "Sincerely," (name, title, company); a heading with metadata under it may follow the name and title

      if(!sc) return; const g=groups[groups.length-1];
      // an explicit "[Passage N: …]" marker is where its paper starts, even right after other heading-like lines
      // a masthead spans at most 5 lines: measured from the group's first line, so headings every few lines do not chain together
      // an explicit "[Passage N: …]" / "(DOCUMENT N OF M)" line is where its paper starts; otherwise the group's first line is
      if(g&&i-g.i<=4){ if(sc===4&&g.sc<4) g.i=i; g.last=i; g.sc=Math.max(g.sc,sc); } else groups.push({i,last:i,sc}); });
    const cut=groups.filter(g=>g.i>3).sort((a,b)=>b.sc-a.sc||a.i-b.i).slice(0,nExp-1).map(g=>g.i).sort((a,b)=>a-b);
    if(Math.abs(cut.length+1-nExp)<Math.abs(papers.children.length-nExp)){ papers.innerHTML=''; pp=null; let k=0;
      lines.forEach((s,i)=>{ if(i===0||cut.includes(i)){ k++; if(isDocHead(s)){ newPaper(s); return; } newPaper('Văn bản '+k); } pp.appendChild(fmtLine(s)); }); }
  }
  const lab=el('div','strat-t','Original ETS Passages · Đề thi tiếng Anh gốc'); lab.style.color='var(--muted)';
  box.appendChild(lab); if(refer){ const r=el('p',null,refer); r.style.cssText='font-style:italic;color:var(--muted);margin:0 0 10px'; box.appendChild(r); } box.appendChild(papers);
  return; }
  // quiz; a bare "191" line takes its stem from PHẦN 3
  const Q=[]; let q=null;
  qs.forEach(s=>{ if(!isStr(s)) return;
    let m=s.match(/^(?:Questions?\s+)?(\d{3})(?:(?:\.|\s)\s*(.*))?$/); if(m){ const a=L.answers.find(x=>x.no===m[1]); q={no:m[1],stem:m[2]||(a&&a.stem)||'',extra:[],opts:[]}; Q.push(q); return; }

  L.quiz=Q;
  if(!Q.length) return;
  const qz=el('div','quiz'); const top=el('div','quiz-top');
  const sc=el('div','score'); const reset=el('button','btn','Làm lại'); reset.type='button';
  add(top,el('div','strat-t','Original ETS Questions · Bấm chọn đáp án để tự kiểm tra'),add(el('div'),sc));
  top.lastChild.style.cssText='display:flex;gap:10px;align-items:center'; top.lastChild.appendChild(reset);
  qz.appendChild(top);
  const state={};
  const upd=()=>{ const done=Object.keys(state).length, ok=Object.values(state).filter(Boolean).length;
    sc.innerHTML=''; add(sc,document.createTextNode('Đã làm '),el('b',null,`${done}/${Q.length}`),document.createTextNode(' · Đúng '),el('b',null,String(ok))); };
  Q.forEach(q=>{
    const c=el('div','q'); const st=el('div','q-stem'); const stx=el('div',null,q.stem);

      b.addEventListener('click',()=>{

  });

}

/* summary paragraph -> one bullet per sentence; a long tail after ": " becomes sub-bullets split at top-level ", and/và/nhờ/đồng thời" or "; " */
const ABBR=/\b(Mr|Ms|Mrs|Dr|St|No|Inc|Co|Ltd|Corp|vs|etc|e\.g|i\.e|approx|Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)\.$/i;
function topSplit(s,test){ // split where test(s,i) matches outside brackets/quotes; returns [pieces]
  const out=[]; let d=0, st=0;
  for(let i=0;i<s.length;i++){ const c=s[i];
    if('(['.includes(c)) d++; else if(')]'.includes(c)) d=Math.max(0,d-1);
    else if(!d){ const n=test(s,i); if(n){ out.push(s.slice(st,i+n.keep).trim()); st=i+n.skip; i=st-1; } } }
  out.push(s.slice(st).trim()); return out.filter(Boolean);
}
function sentences(s){
  return topSplit(s,(t,i)=>{ if(!/[.!?]/.test(t[i])||!/\s/.test(t[i+1]||'')) return null;
    if(ABBR.test(t.slice(Math.max(0,i-6),i+1))) return null;
    const nx=t.slice(i+1).trimStart()[0]||''; if(!/[A-ZÀ-Ỹ0-9"'‘“(]/.test(nx)) return null;
    return {keep:1,skip:1}; });
}
function ideaList(s,vi){
  const ul=el('ul','ideas'+(vi?' vi-t':''));
  sentences(s).forEach(sen=>{
    const li=el('li'); const ci=sen.search(/:\s/); let head=sen, tail='';
    if(ci>20 && sen.length-ci>90){ head=sen.slice(0,ci+1); tail=sen.slice(ci+1).trim(); }
    // long sentence without a colon tail: break at top-level ", allowing / , while / , đồng thời / —"
    if(!tail && sen.length>200){ const ps=topSplit(sen,(t,i)=>{ const m=t.slice(i).match(/^(,\s+(?=(?:allowing|while|whereas|đồng thời|trong khi)\s)|\s*—\s*)/); return m?{keep:0,skip:m[0].length}:null; });
      if(ps.length>1){ head=ps[0]; tail=ps.slice(1); } }
    li.appendChild(document.createTextNode(head));
    if(Array.isArray(tail)){ const sub=el('ul'); tail.forEach(p=>sub.appendChild(el('li',null,p))); li.appendChild(sub); }
    else if(tail){ const parts=topSplit(tail,(t,i)=>{ const m=t.slice(i).match(/^(,\s+(?=(?:and|và|nhờ|đồng thời|rồi|then|while)\s)|;\s+)/); return m?{keep:m[0].startsWith(';')?1:0,skip:m[0].length}:null; });
      const sub=el('ul'); parts.forEach(p=>sub.appendChild(el('li',null,p))); li.appendChild(sub); }
    ul.appendChild(li);
  });
  return ul;
}

/* every table in 4.1 is one diagram (Vietnamese, then the English translation); the text line before a table is its caption.
   Arrow columns ("-->", "➔", "→") are dropped; a step head is "BƯỚC 1: Title" in one cell line or "BƯỚC 1" / "STEP 1" then the title */
function renderFlow(items,box){
  const keep=c=>c.length && !(c.length===1 && /^\s*(-+>|➔|→|➜|⇒|►|>)\s*$/.test(c[0]));
  let cap='';
  items.forEach(it=>{
    if(isStr(it)){ cap=it; return; }
    const tb=it, heads=tb.rows[0].filter(keep), bodies=(tb.rows[1]||[]).filter(keep);
    if(cap){ const c=el('div','strat-t',cap.replace(/:\s*$/,'')); c.style.cssText='color:var(--muted);margin:14px 0 8px'; box.appendChild(c); cap=''; }
    const f=el('div','flow');
    heads.forEach((hc,i)=>{
      const s=el('div','fstep'); const hm=hc[0].match(/^((?:BƯỚC|STEP)\s*\d+)\s*:?\s*(.*)$/i);
      const title=hm?[hm[2],...hc.slice(1)].filter(Boolean).join(' '):hc.join(' ');
      const h=el('h5'); if(hm){ add(h,el('span',null,hm[1]),document.createTextNode(title)); } else h.textContent=title;
      s.appendChild(h);
      (bodies[i]||[]).forEach(x=>{ x=x.replace(/^•\s*/,''); const m=x.match(/^([^:]{2,40}):\s*(.*)$/); const d=el('div','fkv'+(m&&/Đầu ra|Kết quả|Ket qua|Deliverable|Output/i.test(m[1])?' out':''));
        if(m) add(d,el('b',null,m[1]),el('span',null,m[2])); else d.textContent=x; s.appendChild(d); });
      f.appendChild(s);
    });
    box.appendChild(f);
  });
}

function renderVocab(items,box){
  const strs=items.filter(isStr); const g=el('div','vocab'); let c=null, n=0;
  strs.forEach(s=>{
    if(/^Ngh(?:ĩa|ia):/.test(s)&&c){ c.appendChild(el('div','mean vi-t vi-r',s.replace(/^Ngh(?:ĩa|ia):\s*/,''))); return; }
    if(/^Vd:/.test(s)&&c){ const t=s.replace(/^Vd:\s*/,''); const m=t.match(/^(.*?[.!?"”])\s+-\s+(.*)$/);
      const ex=el('div','ex'); if(m){ add(ex,el('i',null,m[1]),el('span','vi-t vi-r',m[2])); } else ex.appendChild(el('i',null,t)); c.appendChild(ex); return; }
    n++; c=el('div','vc'); const m=s.match(/^(?:(\d+)\.\s*)?(.+?)\s+(\/[^\/]+\/(?:\s*-\s*\/[^\/]+\/)*)\s+(?:(?:<=>|=)\s*)?(.+)$/);
    const h=el('div','vc-h'); add(h,el('span','vn',String(m&&m[1]?m[1]:n).padStart(2,'0')),el('h5',null,m?m[2]:s)); if(m) h.appendChild(el('span','ipa',m[3]));
    c.appendChild(h);
    if(m){ const ch=el('div','chips'); ch.appendChild(el('span','eq','≈')); m[4].split(/\s+\/\s+/).forEach(x=>ch.appendChild(el('span','chip',x))); c.appendChild(ch); }
    g.appendChild(c);
  });
  box.appendChild(g);
}

/* ---------- lesson page ---------- */
function renderLesson(L){
  const root=el('div'); root.style.setProperty('--c',`var(--c${L.n})`);
  const head=el('div','lesson-head'); head.style.setProperty('--c',`var(--c${L.n})`);
  const bn=el('div','big-n'); add(bn,el('small',null,'BÀI THỰC HÀNH'),document.createTextNode(String(L.n).padStart(2,'0')));
  const ht=el('div'); add(ht,el('h2',null,L.vi)); if(L.en) ht.appendChild(el('div','en-t',L.en));
  const src=el('div','src'); add(src,el('b',null,'NGUỒN'),el('span',null,L.src)); ht.appendChild(src);
  add(head,bn,ht); root.appendChild(head);

  const lay=el('div','layout'); const toc=el('nav','toc'); toc.setAttribute('aria-label','Mục lục bài '+L.n);
  const content=el('div','content');
  L.parts.forEach(P=>{
    const a=el('a'); a.href=`#b${L.n}-p${P.n}`; add(a,el('b',null,String(P.n)),el('span',null,shortPart(P))); toc.appendChild(a);
    a.addEventListener('click',e=>{e.preventDefault(); document.getElementById(`b${L.n}-p${P.n}`).scrollIntoView({behavior:'smooth'});});
    const sec=partShell(L,P);
    if(P.n===1){ splitPart1(P.subs).forEach(S=>{
        const sa=el('a','toc-sub',S.id+' '+S.short); sa.href='#'; sa.addEventListener('click',e=>{e.preventDefault(); document.getElementById(`b${L.n}-s${S.id.replace('.','-')}`).scrollIntoView({behavior:'smooth'});}); toc.appendChild(sa);
        const b=subShell(L,S);
        if(S.src==='1.1') render11(L,S.items,b,S.mode); else if(S.src==='1.2') render12(S.items,b); else if(S.src==='1.3') render13(L,S.items,b); else renderPairs(S.items,b,'sum');
        sec.appendChild(b); }); }
    else if(P.n===2) renderMatrix(P.items,sec);
    else if(P.n===3) renderAnswers(L,sec);
    else if(P.n===4){ P.subs.forEach(S=>{ const b=subShell(L,S);
        if(S.id==='4.1') renderFlow(S.items,b);
        else { const t=el('div','ba'); const d=el('div'); S.items.filter(isStr).forEach(s=>{ const r=richLine(s); r&&d.appendChild(r); }); t.style.gridTemplateColumns='minmax(0,1fr)'; t.appendChild(d); b.appendChild(t); }
        sec.appendChild(b); }); }
    else if(P.n===5) renderVocab(P.items,sec);
    content.appendChild(sec);
  });
  add(lay,toc,content); root.appendChild(lay);
  root.appendChild(pager(L.n-1));
  return root;
}
function shortPart(P){ return ({1:'Văn bản & dịch song ngữ',2:'Active Recall 5 giây',3:'Đáp án & dấu vết',4:'Feynman & quy trình BA',5:'Từ vựng & Paraphrase'})[P.n]||P.title; }
/* page order for PHẦN 1: 1.1 Đề gốc, 1.2 Câu hỏi gốc (both from the doc's 1.1), 1.3 Chiến thuật (the doc's own
   "Hướng dẫn làm bài Part 7" sub-section, or the "Bước" lines inside the doc's 1.1 in older docs), then translation,
   question translation and summary — matched by title so both doc layouts number the same */
function splitPart1(subs){
  const kind=S=>S.id==='1.1'?'1.1':/Hướng dẫn|Strategy|Chiến thuật|Chiến lược/i.test(S.title)?'guide':/Từng Câu|Sentence/i.test(S.title)?'1.2':/Câu hỏi|Question/i.test(S.title)?'1.3':/Song ngữ|Bilingual/i.test(S.title)?'1.2':'1.4';
  const short={'1.2':'Dịch từng câu','1.3':'Dịch câu hỏi','1.4':'Tóm tắt'};
  const s11=subs.find(S=>kind(S)==='1.1'), guide=subs.find(S=>kind(S)==='guide'), out=[];
  if(s11){
    out.push({...s11,src:'1.1',mode:'pass',short:'Đề gốc',title:'Đề thi Tiếng Anh gốc (Original ETS Passages)'});
    out.push({...s11,src:'1.1',mode:'quiz',short:'Câu hỏi gốc',title:'Câu hỏi Tiếng Anh gốc (Original ETS Questions)'});
  }
  if(guide) out.push({...guide,src:'1.1',mode:'guide',short:'Chiến thuật',title:'Hướng dẫn làm bài Part 7 (Strategy Guide)'});
  else if(s11) out.push({...s11,src:'1.1',mode:'strat',short:'Chiến thuật',title:'Hướng dẫn làm bài Part 7 (Strategy Guide)'});
  subs.forEach(S=>{ const k=kind(S); if(k!=='1.1'&&k!=='guide') out.push({...S,src:k,short:short[k]}); });
  out.forEach((S,i)=>S.id='1.'+(i+1));
  return out;
}

function renderParaphrase(){
  const root=el('div'); root.style.setProperty('--c','var(--red)');
  const head=el('div','lesson-head'); head.style.setProperty('--c','var(--c1)');
  const bn=el('div','big-n'); add(bn,el('small',null,'TỔNG HỢP'),document.createTextNode(String(NFIN)));
  const ht=el('div'); add(ht,el('h2',null,finalTitle.replace(/^BẢNG TỔNG HỢP 50 CẶP TỪ /,'').replace(/^(PHẦN TỔNG KẾT|PHAN TONG KET)\s*:\s*/i,'') || finalTitle));
  ht.appendChild(el('div','en-t',`Bảng tổng hợp ${FINLABEL.replace(/^\d+ /,NFIN+' ')} · Nạp Anki`));
  add(head,bn,ht); root.appendChild(head);
  const sec=el('section','part'); sec.style.marginTop='28px';
  const tools=el('div','pp-tools'); const inp=el('input'); inp.type='search'; inp.id='pp-search'; inp.placeholder='Tìm cụm từ, paraphrase hoặc nghĩa…'; inp.setAttribute('aria-label','Tìm trong '+FINLABEL);
  const cnt=el('span','score'); add(tools,inp,cnt); sec.appendChild(tools);
  const w=el('div','tbl-w'); const t=el('table'); const th=el('thead'); const tr=el('tr');
  const hdr=finalTable?finalTable.rows[0].map(c=>c.join(' ')):[]; hdr.forEach(x=>tr.appendChild(el('th',null,x))); th.appendChild(tr); t.appendChild(th);
  const tb=el('tbody'); const rows=[];
  (finalTable?finalTable.rows.slice(1):[]).forEach(r=>{ const row=el('tr'); ['n','t','p','m'].forEach((k,i)=>row.appendChild(el('td',k,(r[i]||[]).join(' ')))); tb.appendChild(row); rows.push([row,row.textContent.toLowerCase()]); });
  t.appendChild(tb); w.appendChild(t); sec.appendChild(w);
  const f=()=>{ const q=inp.value.trim().toLowerCase(); let k=0; rows.forEach(([r,tx])=>{ const show=!q||tx.includes(q); r.hidden=!show; if(show)k++; }); cnt.textContent=`${k}/${rows.length} cặp từ`; };
  inp.addEventListener('input',f); f();
  root.appendChild(sec); root.appendChild(pager(TABS.length-1));
  return root;
}

function pager(i){
  const p=el('div','pager');
  if(i>0){ const b=el('button','prev'); b.type='button'; add(b,el('small',null,'← Trước'),el('b',null,`${TABS[i-1].n} · ${TABS[i-1].label}`)); b.onclick=()=>show(TABS[i-1].id,true); p.appendChild(b); }
  if(i<TABS.length-1){ const b=el('button','next'); b.type='button'; add(b,el('small',null,'Tiếp →'),el('b',null,`${TABS[i+1].n} · ${TABS[i+1].label}`)); b.onclick=()=>show(TABS[i+1].id,true); p.appendChild(b); }
  return p;
}

/* ---------- hero, tabs ---------- */
const hero=document.getElementById('hero');
(function(){
  const left=el('div');
  const t0=intro[0]||''; const m=t0.match(/^(.*?):\s*(.*)$/);
  const eb=el('div','eyebrow'); add(eb,el('b',null,m?m[1]:t0),el('span',null,'· ETS TOEIC Part 7'));

  // intro[2] (source/method note) is intentionally not shown
  add(left,eb,h1,el('div','en-sub',intro[1]||''));
  const nq=lessons.reduce((a,L)=>a+L.answers.length,0), nv=lessons.reduce((a,L)=>a+(L.parts.find(p=>p.n===5)?.items.filter(s=>isStr(s)&&/^Ngh(?:ĩa|ia):/.test(s)).length||0),0);
  const st=el('div','stats');
  [[lessons.length,'bài thực hành'],[nq,'câu hỏi ETS gốc'],[nv,'thẻ từ vựng'],[NFIN,FINLABEL.replace(/^\d+ /,'')]].forEach(([v,l])=>{ const s=el('div','stat'); add(s,el('b',null,String(v)),el('span',null,l)); st.appendChild(s); });
  left.appendChild(st);
  const yard=el('div','yard'); yard.setAttribute('aria-label','Chọn nhanh bài học');
  lessons.forEach(L=>{ const b=el('button','box'); b.type='button'; b.style.setProperty('--c',`var(--c${L.n})`); b.dataset.id='bai'+L.n; b.title=SHORT[L.n-1];
    add(b,el('span','code',SHORT[L.n-1]||'BÀI'),el('span','n',String(L.n).padStart(2,'0')),el('span','qr',L.qr)); b.onclick=()=>show('bai'+L.n,true); yard.appendChild(b); });
  add(hero,left,yard);
})();

const tabsEl=document.getElementById('tabs'), main=document.getElementById('main');
const panels={}, tabBtns={};
TABS.forEach((T,i)=>{
  const b=el('button','tab'); b.type='button'; b.setAttribute('role','tab'); b.id='tab-'+T.id; b.setAttribute('aria-controls','panel-'+T.id); b.style.setProperty('--c',T.c);
  const tl=el('span','tl'); add(tl,el('b',null,T.label),el('small',null,T.sub));
  add(b,el('span','door',T.n),tl); b.onclick=()=>show(T.id,false);
  b.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ e.preventDefault(); const j=(i+(e.key==='ArrowRight'?1:-1)+TABS.length)%TABS.length; show(TABS[j].id,false); tabBtns[TABS[j].id].focus(); }});
  tabsEl.appendChild(b); tabBtns[T.id]=b;
  const p=el('section'); p.id='panel-'+T.id; p.setAttribute('role','tabpanel'); p.setAttribute('aria-labelledby','tab-'+T.id); p.hidden=true; main.appendChild(p); panels[T.id]=p;
});

function show(id,scroll){
  if(!panels[id]) id=TABS[0].id;
  const p=panels[id];
  if(!p.firstChild){ if(id==='paraphrase') p.appendChild(renderParaphrase()); else p.appendChild(renderLesson(lessons[+id.replace('bai','')-1])); }
  Object.entries(panels).forEach(([k,v])=>{ v.hidden=k!==id; tabBtns[k].setAttribute('aria-selected',String(k===id)); tabBtns[k].tabIndex=k===id?0:-1; });
  document.querySelectorAll('.box').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  tabBtns[id].scrollIntoView({block:'nearest',inline:'center'});
  try{ history.replaceState(null,'','#'+id); }catch(e){}
  try{ localStorage.setItem('lg-tab',id); }catch(e){}
  if(scroll!==null){ const bar=document.querySelector('.bar'); const y=main.getBoundingClientRect().top+window.scrollY-bar.offsetHeight-8; if(window.scrollY>y||scroll) window.scrollTo({top:y,behavior:'smooth'}); }
}

const mb=document.getElementById('m-both'), mr=document.getElementById('m-recall');
function setMode(r){ document.body.classList.toggle('recall',r); mb.setAttribute('aria-pressed',String(!r)); mr.setAttribute('aria-pressed',String(r)); try{localStorage.setItem('lg-mode',r?'1':'0');}catch(e){} if(!r) document.querySelectorAll('.peek').forEach(x=>x.classList.remove('peek')); }
mb.onclick=()=>setMode(false); mr.onclick=()=>setMode(true);
main.addEventListener('click',e=>{ if(!document.body.classList.contains('recall')) return; const v=e.target.closest('.vi-r'); if(v) v.classList.toggle('peek'); });
try{ if(localStorage.getItem('lg-mode')==='1') setMode(true); }catch(e){}

document.getElementById('foot').textContent='Nguồn: ChuyenDe_TOEIC_MarketingSo_PR_ThuongHieu_RaMatSanPham.docx';

let start=(location.hash||'').slice(1);
if(!panels[start]){ try{ start=localStorage.getItem('lg-tab')||''; }catch(e){ start=''; } }
show(panels[start]?start:TABS[0].id,null);
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(panels[h]) show(h,true); });
})();
