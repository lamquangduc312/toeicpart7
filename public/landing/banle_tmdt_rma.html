d QR code displayed on their mobile smartphone.","[Loi giai chi tiet]: Bước 2 và Bước 3 của hướng dẫn ứng dụng chỉ rõ khách hàng chỉ cần xuất trình mã QR kỹ thuật số động được mã hóa hiển thị trực tiếp trên màn hình điện thoại thông minh để nhân viên quét mã. Đáp án (B) phản ánh hoàn toàn đúng quy trình.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) A printed paper receipt and photo identification","- Ly do sai: Quy trình là \u0027Label-Free\u0027 (hoàn toàn không cần in giấy), và không yêu cầu xuất trình giấy tờ tùy thân.","- Bay ETS: Paper Verification Trap (Bẫy thủ tục giấy tờ truyền thống)","(C) A notarized affidavit verifying the item\u0027s purchase price","- Ly do sai: Không cần giấy cam kết công chứng giá mua.","- Bay ETS: Notarized Document Trap (Bẫy thủ tục công chứng vô lý)","(D) A sealed cardboard box wrapped with reinforced brown packaging tape","- Ly do sai: Chương trình là \u0027Box-Free\u0027 (không dùng hộp), khách mang sản phẩm rời không cần đóng thùng dán băng keo.","- Bay ETS: Opposite Packaging Trap (Bẫy đóng thùng dán băng keo trái ngược)","When is a customer\u0027s refund initiated under the GreenReturn process?","Dap an dung: (C) Immediately upon the QuickStop associate scanning the customer\u0027s mobile QR code","[Dau vet bai doc / Clue]: Văn bản 2, mục Instant Refund Activation Guarantee: \u0027The moment the QuickStop associate scans your mobile QR code, an automated programmatic API trigger dispatches to your bank or card issuer. Your refund is released immediately upon physical drop-off rather than making you wait days for warehouse delivery!\u0027","[Dien dat tuong duong / Paraphrase]: The moment the associate scans your mobile QR code ➔ Immediately upon the QuickStop associate scanning the customer\u0027s mobile QR code.","[Loi giai chi tiet]: Văn bản 2 khẳng định cam kết hoàn tiền tức thì: ngay khoảnh khắc nhân viên quét mã QR trên màn hình điện thoại của khách, hệ thống API sẽ lập tức kích hoạt lệnh hoàn tiền về ngân hàng của khách mà không phải đợi hàng về đến kho bãi. Phương án (C) là đáp án đúng.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) As soon as the item is manufactured at the overseas factory","- Ly do sai: Sản xuất tại nhà máy là giai đoạn ban đầu, hoàn toàn vô lý với thời điểm hoàn tiền đổi trả.","- Bay ETS: Manufacturing Timeline Trap (Bẫy dòng thời gian sản xuất)","(B) After the item is recertified by technicians at the regional reclamation hub","- Ly do sai: Đây là quy trình cũ truyền thống; quy trình GreenReturn giải phóng tiền hoàn ngay tại quầy trước khi hàng về đến kho.","- Bay ETS: Traditional Warehouse Wait Trap (Bẫy chờ kiểm định kho truyền thống)","(D) Exactly 30 days after the annual sustainability report is published","- Ly do sai: Báo cáo thường niên của bên thứ ba không liên quan đến thời điểm hoàn tiền cho từng cá nhân.","- Bay ETS: Audit Report Timeline Trap (Bẫy thời điểm báo cáo kiểm toán)","According to Document 3, what financial benefit did Apex achieve during Year 1 of the program?","Dap an dung: (A) An annual net logistics cost reduction of $18.4 million","[Dau vet bai doc / Clue]: Văn bản 3, mục 2: \u0027• Net Logistics Cost Savings: By eliminating home pickup surcharges and reducing cardboard packaging freight volume, Apex realized an annualized net logistics cost savings of $18.4 million.\u0027","[Dien dat tuong duong / Paraphrase]: annualized net logistics cost savings of $18.4 million ➔ An annual net logistics cost reduction of $18.4 million.","[Loi giai chi tiet]: Báo cáo kiểm toán độc lập ở Văn bản 3 ghi nhận sau 1 năm thực hiện mạng lưới GreenReturn, sàn thương mại điện tử Apex đã tiết kiệm ròng chi phí logistics lên tới 18.4 triệu USD nhờ giảm bớt phụ phí lấy hàng tại nhà và giảm thể tích hàng cồng kềnh. Đáp án (A) hoàn toàn trùng khớp.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(B) A complete elimination of all employee healthcare expenditures","- Ly do sai: Bài nói về tiết kiệm chi phí logistics, không hề nói về cắt giảm bảo hiểm y tế nhân viên.","- Bay ETS: Healthcare Expense Trap (Bẫy chi phí y tế nhân viên)","(C) An acquisition of the entire QuickStop retail corporation for $6,800","- Ly do sai: 6,800 là số tấn giấy bìa carton được cứu sống, không phải số tiền mua lại tập đoàn QuickStop.","- Bay ETS: Numerical Misapplication Trap (Bẫy lấy khối lượng rác thải làm giá mua công ty)","(D) A 100% tax exemption from the federal transportation board","- Ly do sai: Không có khoản miễn thuế 100% nào từ ủy ban giao thông vận tải liên bang.","- Bay ETS: Tax Exemption Fabrication Trap (Bẫy miễn thuế liên bang tự bịa)","In Document 1, the word \u0027consolidated\u0027 in paragraph 3 is closest in meaning to","Dap an dung: (B) combined","[Dau vet bai doc / Clue]: Văn bản 1, mục Consolidated Low-Emission Freight Dispatch: \u0027returned items deposited at QuickStop locations are consolidated into daily bulk cargo shipments.\u0027","[Dien dat tuong duong / Paraphrase]: consolidated (được gom lại, kết hợp lại thành khối lớn) = combined / aggregated / merged.","[Loi giai chi tiet]: Trong ngữ cảnh logistics và quản lý chuỗi cung ứng hàng hóa, thuật ngữ \u0027consolidate\u0027 có nghĩa là gom nhiều kiện hàng nhỏ lẻ lại với nhau để tạo thành một chuyến hàng lớn (bulk shipment) nhằm tối ưu hóa chi phí và phương tiện vận chuyển. Từ đồng nghĩa chính xác nhất là \u0027combined\u0027 (được kết hợp, gom lại).","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) separated","- Ly do sai: \u0027separated\u0027 có nghĩa là bị chia tách riêng lẻ, trái ngược hoàn toàn với việc gom hàng lại.","- Bay ETS: Antonym Trap (Bẫy từ trái nghĩa: chia tách)","(C) prohibited","- Ly do sai: \u0027prohibited\u0027 có nghĩa là bị ngăn cấm, không liên quan đến thao tác vận chuyển hàng hóa.","- Bay ETS: Prohibition Distortion Trap (Bẫy từ vựng ngăn cấm)","(D) delayed","- Ly do sai: \u0027delayed\u0027 có nghĩa là bị trì hoãn, không phản ánh hành động gom hàng tối ưu hóa.","- Bay ETS: Time Delay Trap (Bẫy trì hoãn thời gian)","4.1. BẢN ĐỒ TIẾN TRÌNH LOGISTICS THU HỒI NGƯỢC XANH \u0026 HOÀN TIỀN PUDO (GREEN REVERSE LOGISTICS WORKFLOW)","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","CHỌN KÊNH GREENRETURN TRÊN APP \u0026 TẠO MÃ QR ĐỘNG KHÔNG CẦN IN NHÃN"],[],["BƯỚC 2","QUÉT MÃ TẠI QUẦY CỬA HÀNG TIỆN LỢI, CHO VÀO TÚI VẢI \u0026 BẮN LỆNH HOÀN TIỀN TỨC THÌ"],[],["BƯỚC 3","GOM HÀNG LÔ LỚN HÀNG ĐÊM VỀ TRUNG TÂM PHÂN LOẠI \u0026 TÁI ĐƯA VÀO VÒNG QUAY TỒN KHO"]],[["• Chung tu \u0026 Kenh: Ứng Dụng Mua Sắm Apex Mobile \u0026 Cổng Đổi Trả Tự Phục Vụ (Self-Service RMA)","• Nghiep vu thuc thi: Khách chọn sản phẩm cần trả ➔ Bấm chọn \u0027GreenReturn tại QuickStop gần nhà\u0027 ➔ Hệ thống tạo mã QR động chứa mã RMA ➔ Khách cầm sản phẩm rời ra cửa hàng tiện lợi mà không cần tìm hộp hay in nhãn.","• Ket qua \u0026 Kiem soat: Xóa bỏ 100% rào cản đóng gói và rác thải bìa carton của khách hàng tại nhà."],["➔"],["• Chung tu \u0026 Kenh: Quầy Thu Ngân QuickStop (Điểm PUDO) \u0026 Cổng Thanh Toán API Đám Mây","• Nghiep vu thuc thi: Thu ngân quét mã QR trên màn hình điện thoại ➔ Cho sản phẩm vào túi vải bạt GreenReturn tái sử dụng ➔ Bắn webhook API kích hoạt hoàn tiền về thẻ khách hàng ngay tại quầy ➔ Trao biên lai điện tử trong 60 giây.","• Ket qua \u0026 Kiem soat: Khách nhận tiền hoàn ngay lập tức tại quầy mà không phải chờ hàng chuyển về kho."],["➔"],["• Chung tu \u0026 Kenh: Đội Xe Trung Chuyển Ban Đêm \u0026 Trung Tâm Thu Hồi Hàng Hóa Khu Vực (Reclamation Hub)","• Nghiep vu thuc thi: Xe tải lớn gom toàn bộ túi bạt từ 12,000 điểm QuickStop hàng đêm ➔ Vận chuyển thẳng về trung tâm phân loại ➔ Rút ngắn chu kỳ nhập kho từ 9.4 ngày xuống 3.1 ngày ➔ Cắt giảm 65% chuyến xe tải nhỏ lẻ.","• Ket qua \u0026 Kiem soat: Tiết kiệm 18.4 triệu USD chi phí vận hành, giảm 14,200 tấn CO2 và nâng điểm CSAT lên 94%."]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["PHASE 1","GREENRETURN IN-APP CHANNEL SELECTION \u0026 DYNAMIC QR GENERATION"],[],["PHASE 2","IN-STORE PUDO SCAN, REUSABLE TOTE BAGGING \u0026 INSTANT API REFUND DISBURSEMENT"],[],["PHASE 3","NIGHTLY BULK FREIGHT CONSOLIDATION \u0026 RAPID RECLAMATION HUB INTAKE"]],[["• Documents \u0026 Channels: Apex Mobile Shopping App \u0026 Self-Service Reverse Logistics Portal","• Core Business Execution: Customer selects item in app ➔ Chooses \u0027GreenReturn: QuickStop Drop-Off\u0027 ➔ App generates dynamic encrypted QR code with embedded RMA ➔ Customer brings loose merchandise without box or paper label.","• Key Deliverable \u0026 Control: Eradicates 100% of at-home consumer packing friction and cardboard waste."],["➔"],["• Documents \u0026 Channels: QuickStop PUDO Counter Terminal \u0026 Cloud Payment Gateway Webhooks","• Core Business Execution: Cashier scans customer smartphone QR ➔ Bags loose item into reusable poly-tote ➔ Triggers programmatic API refund directly to issuing bank ➔ Issues electronic digital drop-off receipt in \u003c60s.","• Key Deliverable \u0026 Control: Customer secures instant bank refund right at the counter without waiting for depot transit."],["➔"],["• Documents \u0026 Channels: Consolidated Nightly Freight Shuttles \u0026 Regional Reclamation Hubs","• Core Business Execution: Dedicated cargo shuttles consolidate totes from 12,000 hubs nightly ➔ Transports bulk cargo to regional depots ➔ Slashes return turnaround from 9.4 to 3.1 days ➔ Reduces courier trips by 65%.","• Key Deliverable \u0026 Control: Delivers $18.4M in net savings, eliminates 14,200 tons of CO2, and propels CSAT to 94%."]]],"t":"table"},"4.2. GÓC NHÌN NGHIỆP VỤ FEYNMAN (FEYNMAN MULTI-PERSPECTIVE ANALYSIS)","• Bức tranh Toàn cảnh Nghiệp vụ (End-to-End Business Flow): Logistics thu hồi ngược (Reverse Logistics) từng là \u0027hố đen ngốn tiền\u0027 lớn nhất của ngành thương mại điện tử: chi phí bưu tá đến từng nhà lấy hàng lẻ tẻ (residential pickup) cực kỳ đắt đỏ, hàng triệu tấn thùng carton và băng dính thải ra môi trường, và thời gian chờ đợi hoàn tiền lên đến 7-10 ngày khiến khách hàng ức chế. Mô hình Mạng lưới Điểm Gửi Hàng PUDO (Pick-Up \u0026 Drop-Off) kết hợp \u0027Không Hộp, Không Nhãn\u0027 (Box-Free / Label-Free) là cuộc cách mạng toàn diện: Bằng cách biến các cửa hàng tiện lợi quen thuộc ở đầu ngõ thành trạm thu gom hàng, doanh nghiệp chuyển bài toán phân tán thành gom hàng tập trung (Consolidation), hoàn tiền tức thì qua mã QR ngay tại quầy thu ngân, vừa tiết kiệm hàng chục triệu USD vừa tạo nên một chuỗi cung ứng tuần hoàn (Circular Economy) thân thiện với môi trường.","• Lăng kính Viễn thông / CNTT Viettel: Tại Tổng Công ty Bưu chính Viettel (Viettel Post), mô hình Điểm tiếp nhận PUDO và Tủ khóa thông minh (Viettel Post Hub / Smart Locker) được triển khai sâu rộng tới từng thôn bản, khu chung cư và tòa nhà văn phòng. Khách hàng đổi trả hàng thương mại điện tử chỉ cần mở ứng dụng Viettel Post, lấy mã QR trên app và đem bưu phẩm ra bưu cục Viettel Post hoặc cửa hàng tiện lợi đối tác gần nhất mà không cần in giấy gửi. Bưu tá chỉ cần quét mã QR là hệ thống tự động in nhãn gom chung bưu phẩm vào thùng luân chuyển tái sử dụng, giúp Viettel Post tối ưu hóa mạng lưới xe tải chở hàng liên tỉnh và cắt giảm hàng ngàn tấn rác thải nhựa mỗi năm.","• Lăng kính Trường Mầm non Ước Mơ Xanh \u0026 Giáo dục Mầm non: Trong các hoạt động giáo dục môi trường tại trường mầm non, phong trào \u0027Bé gom sách cũ và đồ chơi tái chế\u0027 cũng được tổ chức theo nguyên lý trạm PUDO xanh. Nhà trường đặt những chiếc giỏ vải tái sử dụng màu xanh tại sảnh đón trẻ, các bé không cần dùng túi ni-lông hay hộp giấy bọc đồ mà mang trực tiếp những cuốn sách truyện hoặc đồ chơi còn nguyên vẹn đến quầy \u0027Thư viện Đổi Đồ\u0027. Cô giáo quét mã vạch phiếu sticker trên tay bé và tặng bé một bông hoa chăm ngoan điểm 10, dạy các bé bài học sâu sắc về tiết kiệm giấy và yêu quý hành tinh xanh.","• Lăng kính Trực quan Hóa cho Bé Hà Ngân (5 tuổi): Con hãy tưởng tượng chú chim bồ câu đưa thư không cần phải vác những chiếc thùng giấy to đùng và nặng nề nữa! Khi con có một chiếc áo len nhỏ muốn đổi lấy chiếc áo to hơn, con không cần tìm hộp giấy hay băng dính dán chặt đâu nhé. Con chỉ cần cầm chiếc áo xinh xắn ra cửa hàng tiện lợi quen thuộc ở đầu ngõ, nơi có bác bảo vệ thân thiện. Mẹ mở điện thoại ra đưa một hình vuông thần kỳ (mã QR) cho cô thu ngân quét một tiếng \u0027Bíp!\u0027. Cô liền bỏ chiếc áo vào một chiếc túi vải màu xanh lá cây êm ái, và ngay lập tức điện thoại của mẹ reo lên thông báo tiền đã được gửi về tài khoản rồi! Thật là nhanh và giúp cho các bác cây xanh trong rừng không bị chặt để làm hộp giấy nữa đấy!","4.3. PHÂN TÍCH CHUYÊN SÂU DÀNH CHO BUSINESS ANALYST (BA PERSPECTIVE)","• PUDO Partner API Integration \u0026 Real-Time POS Counter Scanning Architecture: Business Analysts architecting Reverse Logistics Ecosystems must design real-time edge integration between e-commerce marketplace backends and third-party convenience store POS terminals. When an associate scans a customer\u0027s dynamic mobile QR code at a PUDO register, the POS dispatches an encrypted payload over secure HTTPS/mTLS to the merchant\u0027s RMA Orchestration API. The event payload verifies the 14-day token validity, locks the return status to \u0027Intake_Received_PUDO\u0027, assigns the item to the specific reusable tote container ID, and fires an asynchronous credit card refund disbursement webhook in real time, shifting the consumer trust paradigm from post-inspection settlement to proof-of-intake settlement.","• Circular Supply Chain Consolidation \u0026 ESG Reverse Freight Optimization: From an enterprise operations and ESG sustainability analytics perspective, BA models must optimize reverse freight routing using Route Optimization Algorithms. Instead of point-to-point LTL (Less-Than-Truckload) residential sweeps, the transport management system (TMS) schedules consolidated Milk-Run routing, dispatching high-capacity cargo shuttles nightly across localized clusters of 12,000 PUDO nodes. Enterprise reporting modules track key circular metrics—such as metric tons of avoided virgin cardboard packaging, total miles traveled per returned unit, and fuel consumption efficiency—feeding automated data pipelines directly into the corporation\u0027s annual ESG Sustainability Disclosures (CSRD / SASB frameworks).","PHẦN 5: TỪ VỰNG CHUYÊN SÂU \u0026 BẢNG ÔN TẬP ĐỊNH KỲ ANKI (VOCABULARY \u0026 SPACED REPETITION)","PUDO (Pick-Up \u0026 Drop-Off)  /ˈpuːdoʊ/  Access Point Network / Out-of-Home Parcel Point / Neighborhood Drop Station / Hub Node","Nghia: Mạng lưới điểm nhận và gửi hàng; mô hình hợp tác logistics biến các cửa hàng tiện lợi, trạm xăng hoặc quầy bán lẻ lân cận thành điểm giao nhận bưu kiện tập trung cho người dân.","Vd: Expanding the PUDO network to twelve thousand convenience stores allowed customers to drop off returns within walking distance. - Việc mở rộng mạng lưới điểm PUDO tới mười hai nghìn cửa hàng tiện lợi đã cho phép khách hàng gửi trả hàng trong phạm vi đi bộ.","Consolidate  /kənˈsɑːlɪdeɪt/  Combine / Aggregate / Merge / Group Bulk Cargo / Pool Shipments","Nghia: Gom hàng, hợp nhất, kết hợp lại; việc tập hợp nhiều kiện hàng nhỏ lẻ thành một lô hàng lớn để vận chuyển tập trung nhằm giảm chi phí và khí thải.","Vd: Returned parcels are consolidated nightly into large freight containers to cut transport emissions by forty percent. - Các bưu kiện gửi trả được gom lại hàng đêm vào các công-ten-nơ vận tải lớn để cắt giảm bốn mươi phần trăm lượng khí thải vận tải.","Box-Free, Label-Free  /bɑːks friː ˈleɪbəl friː/  Packageless Return / Digital QR Drop-Off / Bare Item Return / Paperless Logistics","Nghia: Đổi trả không cần hộp, không cần nhãn; giải pháp đổi trả hàng hiện đại cho phép khách hàng mang sản phẩm trần đến quầy quét mã QR mà không cần tìm thùng carton hay in giấy gửi.","Vd: The box-free, label-free return system eliminated thousands of tons of wasteful single-use cardboard packaging. - Hệ thống đổi trả không cần hộp, không cần nhãn đã loại bỏ hàng ngàn tấn bao bì carton dùng một lần lãng phí.","Dynamic QR Code  /daɪˈnæmɪk kjuː ɑːr koʊd/  Encrypted Mobile Barcode / Real-Time Scannable Token / Dynamic Digital Identifier","Nghia: Mã QR động; mã ma trận kỹ thuật số hiển thị trên điện thoại thông minh có thể cập nhật trạng thái dữ liệu theo thời gian thực và kích hoạt các lệnh thanh toán hoàn tiền tức thì.","Vd: Scanning the customer\u0027s dynamic QR code at the counter triggered an immediate refund to their payment card. - Việc quét mã QR động của khách hàng tại quầy đã kích hoạt một khoản hoàn tiền ngay lập tức về thẻ thanh toán của họ.","Virgin Cardboard  /ˈvɜːrdʒɪn ˈkɑːrdbɔːrd/  Raw Wood-Pulp Packaging / Non-Recycled Fiber Board / Primary Paper Stock","Nghia: Giấy carton nguyên sinh; loại giấy bìa làm trực tiếp từ bột gỗ rừng tự nhiên chưa qua tái chế, việc hạn chế sử dụng giúp bảo vệ tài nguyên rừng và môi trường.","Vd: Processing returns box-free prevented thousands of metric tons of virgin cardboard from being dumped into landfills. - Việc xử lý đổi trả không dùng hộp đã ngăn chặn hàng ngàn tấn giấy carton nguyên sinh khỏi bị đổ ra các bãi chôn lấp.","Circular Economy  /ˈsɜːrkjələr ɪˈkɑːnəmi/  Closed-Loop System / Sustainable Resource Cycle / Regenerative Industrial Model","Nghia: Kinh tế tuần hoàn; mô hình kinh tế trong đó các sản phẩm, nguyên vật liệu và tài nguyên được tái sử dụng, thu hồi và tái chế tối đa nhằm triệt tiêu rác thải.","Vd: Green reverse logistics plays a pivotal role in transitioning retail supply chains into a true circular economy. - Logistics thu hồi ngược xanh đóng vai trò then chốt trong việc chuyển đổi các chuỗi cung ứng bán lẻ thành một nền kinh tế tuần hoàn đích thực.","==================================================================================================","PHẦN TỔNG KẾT: MA TRẬN 54 THUẬT NGỮ VÀNG BÁN LẺ ĐA KÊNH, THƯƠNG MẠI ĐIỆN TỬ, ĐỔI TRẢ HÀNG HÓA (RMA) \u0026 CHÍNH SÁCH HOÀN TIỀN (SPACED REPETITION ANKI)",{"rows":[[["STT"],["THUẬT NGỮ \u0026 PHIÊN ÂM IPA"],["DIỄN ĐẠT ĐỒNG NGHĨA (PARAPHRASE)"],["Ý NGHĨA NGHIỆP VỤ BÁN LẺ, THƯƠNG MẠI ĐIỆN TỬ, RMA \u0026 HOÀN TIỀN"]],[["1"],["BOPIS (Buy Online, Pick Up in Store)","/ˈboʊpɪs/"],["Click-and-Collect / In-Store Collection / Online-to-Offline (O2O) Fulfillment"],["Mua hàng trực tuyến, nhận tại cửa hàng; mô hình bán lẻ kết hợp cho phép khách đặt hàng qua mạng và tự đến lấy đồ tại cửa hàng vật lý."]],[["2"],["Restocking Fee","/riːˈstɑːkɪŋ fiː/"],["Inventory Return Surcharge / Repackaging Fee / Processing Deduction"],["Phí tái lưu kho; khoản phí mà nhà bán lẻ khấu trừ vào tiền hoàn của khách hàng để bù đắp chi phí kiểm tra, đóng gói lại và nhập hàng vào kho."]],[["3"],["Holding Period","/ˈhoʊldɪŋ ˈpɪəriəd/"],["Reservation Window / Retention Window / Custody Duration"],["Thời hạn lưu giữ hàng; khoảng thời gian tối đa mà cửa hàng cam kết giữ sản phẩm tại tủ đồ hoặc quầy nhận hàng trước khi hủy đơn."]],[["4"],["Smart Locker","/smɑːrt ˈlɑːkər/"],["Automated Parcel Locker / Electronic Collection Kiosk / 24/7 Pickup Compartment"],["Tủ khóa thông minh; hệ thống ngăn tủ điện tử mở bằng mã QR hoặc mã PIN cho phép khách hàng tự nhận bưu kiện 24/7 mà không cần gặp nhân viên."]],[["5"],["Forfeit","/ˈfɔːrfɪt/"],["Surrender / Give Up Rights To / Relinquish / Lose Entitlement"],["Đánh mất quyền lợi, bị tước bỏ đặc quyền; mất quyền sở hữu hoặc quyền thụ hưởng do vi phạm điều kiện hợp đồng hoặc quá thời hạn quy định."]],[["6"],["Inventory Turnover","/ˈɪnvəntɔːri ˈtɜːrnˌoʊvər/"],["Stock Turnover Rate / Velocity of Goods / Inventory Velocity"],["Tốc độ vòng quay hàng tồn kho; chỉ số đo lường số lần hàng tồn kho được bán hoặc thay thế trong một khoảng thời gian nhất định."]],[["7"],["Return Merchandise Authorization (RMA)","/rɪˈtɜːrn ˈmɜːrtʃəndaɪz ˌɔːθərəˈzeɪʃən/"],["Return Authorization Code / Authorized Return Ticket / Return Tracking Identifier"],["Mã ủy quyền đổi trả hàng hóa; mã số định danh duy nhất do nhà bán lẻ cấp cho phép khách hàng gửi trả sản phẩm để kiểm tra, đổi mới hoặc hoàn tiền."]],[["8"],["Prepaid Shipping Label","/ˌpriːˈpeɪd ˈʃɪpɪŋ ˈleɪbəl/"],["Complimentary Return Waybill / Merchant-Funded Courier Label / Pre-Addressed Dispatch Slip"],["Nhãn vận chuyển trả trước; tem nhãn bưu chính đã được người bán thanh toán toàn bộ cước phí, khách hàng chỉ cần in ra và dán lên gói hàng."]],[["9"],["Damaged in Transit","/ˈdæmɪdʒd ɪn ˈtrænzɪt/"],["Shipping Casualty / Freight Mishandling Damage / In-Transit Collision Impairment"],["Hư hỏng trong quá trình vận chuyển; tình trạng sản phẩm bị va đập, nứt vỡ hoặc biến dạng trong lúc nhân viên giao vận chuyên chở kiện hàng."]],[["10"],["Affix","/əˈfɪks/"],["Attach Securely / Stick Onto / Fasten / Adhere"],["Dán vào, gắn chặt vào; dán chắc chắn nhãn bưu phẩm, tem bảo hành hoặc tài liệu lên bề mặt bao bì bên ngoài kiện hàng."]],[["11"],["Buyer’s Remorse","/ˈbaɪərz rɪˈmɔːrs/"],["Customer Change of Mind / Post-Purchase Regret / Discretionary Return"],["Hối hận sau khi mua (thay đổi ý định mua); trường hợp khách hàng muốn trả lại hàng do đổi ý, không thích màu sắc hoặc hết nhu cầu chứ sản phẩm không hề có lỗi."]],[["12"],["Reverse Logistics","/rɪˈvɜːrs ləˈdʒɪstɪks/"],["Product Return Flow / Closed-Loop Supply Chain / Aftermarket Reclamation Logistics"],["Logistics thu hồi ngược; quy trình quản lý chuỗi cung ứng dòng chảy ngược từ tay người tiêu dùng quay trở lại nhà bán lẻ hoặc nhà sản xuất để tái chế, sửa chữa hoặc tiêu hủy."]],[["13"],["Restocking Deduction","/riːˈstɑːkɪŋ dɪˈdʌkʃən/"],["Inventory Repackaging Deduction / Returned Goods Surcharge / Processing Fee Withholding"],["Khoản khấu trừ phí tái lưu kho; số tiền bị trừ trực tiếp vào giá trị tiền hàng hoàn lại để trang trải chi phí kiểm tra, làm mới và đóng gói lại."]],[["14"],["Pristine","/ˈprɪstiːn/"],["Immaculate / Flawless / In Mint Condition / Spotless / Untouched"],["Nguyên vẹn, hoàn hảo, như mới; tình trạng ngoại quan tinh tươm không có bất kỳ dấu hiệu hư hao, vết xước hay vết bẩn nào."]],[["15"],["Open-Box","/ˌoʊpən ˈbɑːks/"],["Customer Returned / Unsealed Merchandise / Factory Recertified / Repackaged Good"],["Hàng mở hộp; hàng hóa đã bị bóc seal bao bì bên ngoài nhưng phần cứng bên trong vẫn còn mới và hoạt động đầy đủ chức năng, thường được bán lại với giá giảm."]],[["16"],["Store Credit","/stɔːr ˈkredɪt/"],["Merchant Credit Voucher / In-Store Account Balance / Shopping Credit Allowance"],["Tín dụng cửa hàng; số dư tiền ảo do nhà bán lẻ cấp cho tài khoản của khách hàng để mua sắm các sản phẩm khác thay vì hoàn tiền mặt vào thẻ ngân hàng."]],[["17"],["Disbursement","/dɪsˈbɜːrsmənt/"],["Payment Release / Fund Remittance / Settlement Payout / Financial Reimbursement"],["Sự chi trả, khoản tiền hoàn giải ngân; hành động chuyển tiền thanh toán hoặc tiền hoàn từ tài khoản doanh nghiệp về tài khoản của khách hàng."]],[["18"],["Grace Clause","/ɡreɪs klɔːz/"],["Forgiveness Period / Extension Window / Conditional Remediation Period"],["Điều khoản ân hạn; khoảng thời gian gia hạn cho phép khách hàng khắc phục sai sót (như gửi bổ sung phụ kiện) để nhận lại đầy đủ quyền lợi tài chính."]],[["19"],["BORIS (Buy Online, Return In-Store)","/ˈbɔːrɪs/"],["In-Store Online Return / Cross-Channel Store Return / O2O Return Integration"],["Mua hàng trực tuyến, đổi trả tại cửa hàng; giải pháp bán lẻ đa kênh cho phép người tiêu dùng mua hàng qua mạng nhưng có thể đem trả hoặc đổi trực tiếp tại các cửa hàng vật lý."]],[["20"],["Frictionless","/ˈfrɪkʃənləs/"],["Effortless / Seamless / Hassle-Free / Smooth / Unimpeded"],["Trơn tru, dễ dàng, không gặp trở ngại; quy trình vận hành dịch vụ thuận tiện tối đa, loại bỏ hoàn toàn các phiền toái hoặc rào cản đối với khách hàng."]],[["21"],["Even Exchange","/ˈiːvən ɪksˈtʃeɪndʒ/"],["One-to-One Product Swap / Zero-Balance Exchange / Direct Value-Neutral Replacement"],["Đổi ngang giá, đổi sản phẩm cùng giá trị; việc đổi một sản phẩm lấy sản phẩm cùng loại khác size hoặc khác màu mà không phát sinh thêm bất kỳ khoản chênh lệch tiền nào."]],[["22"],["Store Credit","/stɔːr ˈkredɪt/"],["Merchant Credit Voucher / In-Store Purchasing Allowance / Customer Account Balance"],["Tín dụng cửa hàng; số dư tiền điện tử hoặc phiếu quà tặng do nhà bán lẻ cấp cho khách hàng dùng để mua sắm hàng hóa tại hệ thống của họ."]],[["23"],["Foot Traffic","/fʊt ˈtræfɪk/"],["In-Store Shopper Volume / Store Patronage / Walk-in Customer Volume"],["Lượng khách ghé thăm cửa hàng; số lượng người tiêu dùng đi bộ trực tiếp bước chân vào không gian mua sắm của một cửa hàng bán lẻ vật lý."]],[["24"],["Customer Lifetime Value (LTV)","/ˈkʌstəmər ˈlaɪftaɪm ˈvæljuː/"],["Customer Lifetime Equity / Long-Term Account Worth / Cumulative Customer Profitability"],["Giá trị vòng đời khách hàng (LTV); tổng giá trị lợi nhuận mà một khách hàng mang lại cho doanh nghiệp trong toàn bộ mối quan hệ gắn bó lâu dài."]],[["25"],["Status Exception","/ˈsteɪtəs ɪkˈsepʃən/"],["Delivery Anomaly / Shipment Irregularity / Transit Disruption Flag / Delivery Impediment"],["Trạng thái ngoại lệ giao hàng; cảnh báo trên hệ thống bưu chính thông báo bưu kiện gặp sự cố đột xuất (như hư hỏng, thiên tai, tai nạn) làm gián đoạn lịch trình giao hàng thông thường."]],[["26"],["In-Transit Damage","/ɪn ˈtrænzɪt ˈdæmɪdʒ/"],["Shipping Casualty / Cargo Breakage / Freight Transportation Impairment"],["Hư hỏng trong quá trình vận chuyển; hiện tượng hàng hóa bị va đập, nứt vỡ hoặc bẹp rúm trong quá trình được chuyên chở từ kho của người bán đến tay người mua."]],[["27"],["Proactive Outreach","/proʊˈæktɪv ˈaʊtriːtʃ/"],["Preemptive Customer Communication / Anticipatory Service Engagement / Proactive Support"],["Tiếp cận chủ động; hành động của bộ phận dịch vụ khách hàng chủ động liên hệ trước để giải quyết vấn đề trước khi khách hàng kịp nhận biết hoặc gửi khiếu nại."]],[["28"],["Aborted","/əˈbɔːrtɪd/"],["Terminated / Cancelled / Halted / Discontinued / Abandoned"],["Bị hủy bỏ, bị đình chỉ; hành động dừng lại hoàn toàn một quy trình hoặc kế hoạch giao hàng đang diễn ra do phát hiện sự cố nguy hiểm."]],[["29"],["Subrogation","/ˌsʌbrəˈɡeɪʃən/"],["Right of Recovery / Legal Claim Substitution / Insurer Indemnification Transfer"],["Sự thế quyền bồi thường (bảo hiểm); quyền của người bán hoặc công ty bảo hiểm sau khi đã đền bù cho khách hàng sẽ đứng ra đòi lại toàn bộ số tiền thiệt hại từ bên vận tải gây ra lỗi."]],[["30"],["Declared Value","/dɪˈklerd ˈvæljuː/"],["Insured Freight Valuation / Certified Consignment Worth / Declared Cargo Assessment"],["Giá trị khai báo bảo hiểm; số tiền giá trị thực của hàng hóa được người gửi ghi trên vận đơn bưu chính làm căn cứ để công ty bảo hiểm đền bù khi xảy ra sự cố mất mát, hư hỏng."]],[["31"],["Points Reinstatement","/pɔɪnts ˌriːɪnˈsteɪtmənt/"],["Reward Point Restoration / Loyalty Balance Rollback / Credit Re-Accrual"],["Sự khôi phục điểm thưởng; quy trình cộng trả lại toàn bộ số điểm thưởng tích lũy đã dùng vào tài khoản hội viên sau khi hủy đơn hoặc đổi trả hàng hóa thành công."]],[["32"],["Reinstate","/ˌriːɪnˈsteɪt/"],["Restore / Reactivate / Return to Status Quo / Re-establish"],["Khôi phục, phục hồi; trả lại nguyên trạng một quyền lợi, đặc quyền, chức vụ hoặc số dư tài khoản đã bị trừ trước đó."]],[["33"],["Loyalty Tier","/ˈlɔɪəlti tɪər/"],["Membership Level / Patronage Bracket / Rewards Classification Category"],["Hạng hội viên thân thiết; các cấp bậc thành viên (như Bạc, Vàng, Bạch kim) được xếp hạng dựa trên tổng mức chi tiêu mua sắm hàng năm của khách hàng."]],[["34"],["Concierge Support","/koʊnˈsjerʒ səˈpɔːrt/"],["White-Glove Dedicated Service / Bespoke Client Care / Premium Personal Assistance"],["Dịch vụ chăm sóc khách hàng VIP riêng biệt; dịch vụ tư vấn và hỗ trợ cá nhân hóa cao cấp phục vụ riêng cho các khách hàng thượng lưu."]],[["35"],["Split-Tender Transaction","/splɪt ˈtendər trænˈzækʃən/"],["Multi-Method Payment / Dual-Source Settlement / Hybrid Funding Purchase"],["Giao dịch thanh toán kết hợp; việc thanh toán một đơn hàng bằng cách phối hợp nhiều phương thức khác nhau (như điểm thưởng + thẻ tín dụng, hoặc tiền mặt + thẻ quà tặng)."]],[["36"],["High-Net-Worth Client","/haɪ net wɜːrθ ˈklaɪənt/"], <script>
(function(){

const isVI = s => VI_RE.test(s);
let SHORT = []; try{ SHORT = JSON.parse(document.getElementById('labels').textContent)||[]; }catch(e){}

function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function add(p,...kids){ kids.forEach(k=>k&&p.appendChild(k)); return p; }
const isStr = x => typeof x === 'string';

/* ---------- split document ---------- */
const intro = RAW.slice(0,3);
const lessons = [];
let cur=null, finalTable=null, finalTitle='';
for(let i=3;i<RAW.length;i++){
  const it=RAW[i];
  if(isStr(it) && /^[=\-]{10,}$/.test(it)) continue;
  // "BÀI THỰC HÀNH SỐ N" alone (title on the next line) or "BÀI THỰC HÀNH SỐ N: Title" (title on the same line)
  if(isStr(it) && /^BÀI THỰC HÀNH SỐ\s*\d+/.test(it)){ const t=it.replace(/^BÀI THỰC HÀNH SỐ\s*\d+\s*:?\s*/,''); cur={items:t?[t]:[]}; lessons.push(cur); continue; }
  // "BÀI N: Title" keeps the title on the same line
  if(isStr(it) && /^BÀI\s+\d+\s*:/.test(it)){ cur={items:[it.replace(/^BÀI\s+\d+\s*:\s*/,'')]}; lessons.push(cur); continue; }
  if(isStr(it) && /^(BẢNG TỔNG HỢP|PHẦN TỔNG KẾT|PHAN TONG KET)/.test(it)){ cur=null; finalTitle=it; continue; }
  if(!cur){ if(!isStr(it)) finalTable=it; continue; }
  cur.items.push(it);
}
/* a lesson written without "PHẦN n:" lines ("1. ĐỀ BÀI GỐC" … "5. CÔ ĐỌNG", "ACTIVE RECALL 5S" + table,
   "ĐÁP ÁN CHI TIẾT", "4.1 …", "BỘ TỪ VỰNG …") gets the PHẦN / "1.N." lines the parser expects */
function normalizeNoParts(arr){
  if(arr.some(s=>isStr(s)&&/^PHẦN\s*\d\s*:/i.test(s))) return arr;
  const up=s=>s===s.toUpperCase()&&/[A-ZÀ-Ỹ]{3}/.test(s);
  const out=[]; let ph=0, last1=0, p2tab=false;
  arr.forEach(it=>{
    if(!isStr(it)){ if(ph===1&&last1>=5){ out.push('PHẦN 2: Active Recall 5S'); ph=2; } if(ph===2) p2tab=true; out.push(it); return; }
    const m=it.match(/^([1-5])\.\s+(.+)$/);
    if(m&&up(m[2])&&ph<=1){ if(!ph){ out.push('PHẦN 1: Văn bản đọc hiểu & dịch song ngữ'); ph=1; } out.push(`1.${m[1]}. ${m[2]}`); last1=+m[1]; return; }
    if(ph===1&&last1>=5&&up(it)&&/ACTIVE RECALL/i.test(it)){ out.push('PHẦN 2: '+it); ph=2; return; }
    if(ph===2&&p2tab){ ph=3; if(up(it)){ out.push('PHẦN 3: '+it); return; } out.push('PHẦN 3: Đáp án & dấu vết truy xuất'); }
    if(ph===3&&/^4\.1\s/.test(it)){ out.push('PHẦN 4: Phân tích Feynman & quy trình nghiệp vụ'); ph=4; }
    if(ph===4&&up(it)&&/TỪ VỰNG|VOCABULARY/i.test(it)){ out.push('PHẦN 5: '+it); ph=5; return; }
    out.push(it);
  });
  return out;
}
lessons.forEach((L,idx)=>{
  L.n=idx+1;
  let t=L.items[0]; const tq=t.match(/\s*\((Questions?\s*\d+\s*-\s*\d+[^()]*)\)\s*$/); if(tq) t=t.slice(0,tq.index);
  // trailing "(ENGLISH TITLE)" only when it is a real English title, not a short term like "(Credit Memo)":
  // 4+ words, or an all-caps title of 2+ words such as "(GRAPHIC DESIGN ASSOCIATE)"
  const m=t.match(/^(.*)\s\(([^()]*)\)\s*$/); const nw=m?m[2].split(/\s+/).length:0;
  const isEn=m&&!isVI(m[2])&&(nw>=4||(nw>=2&&m[2]===m[2].toUpperCase()&&/[A-Z]/.test(m[2])));
  L.vi = isEn?m[1]:t; L.en = isEn?m[2]:'';
  L.src = L.items[1].replace(/^Nguồn( bài học)?:\s*/,'');
  const q=(L.src+' '+L.items[0]).match(/Questions?\s*(\d+)\s*-\s*(\d+)/); L.qr = q?`Q${q[1]}–${q[2]}`:'';
  if(!SHORT[idx]){ const w=L.vi.split(/\s+/).slice(0,4).join(' ').toLowerCase(); SHORT[idx]=w.charAt(0).toUpperCase()+w.slice(1); }
  L.parts=[]; let P=null, S=null;
  for(const it of normalizeNoParts(L.items.slice(2))){
    if(isStr(it)){
      const pm=it.match(/^PHẦN\s*(\d)\s*:\s*(.*)$/i);
      if(pm){ P={n:+pm[1],title:pm[2],subs:[],items:[]}; L.parts.push(P); S=null; continue; }
      // "1.1. Title" or, in some docs, "1.1 ALL-CAPS TITLE" (no dot: only an upper-case title, so "1.5 million…" stays content)
      let sm=it.match(/^(\d\.\d)\.\s+(.*)$/); if(!sm){ sm=it.match(/^(\d\.\d)\s+(.+)$/); if(sm && sm[2]!==sm[2].toUpperCase()) sm=null; }
      // a doc that skips the "PHẦN 4:" line goes from PHẦN 3 straight to "4.1. ALL-CAPS TITLE": open PHẦN 4 there
      if(sm && P && +sm[1][0]===P.n+1 && sm[1][2]==='1' && P.n>=2 && sm[2]===sm[2].toUpperCase()){
        P={n:P.n+1,title:P.n+1===4?'PHÂN TÍCH FEYNMAN & QUY TRÌNH NGHIỆP VỤ':'PHẦN '+(P.n+1),subs:[],items:[]}; L.parts.push(P); }
      // only "N.x." of the current PHẦN N opens a sub-section; "4.1. Package…" inside a passage is content
      if(sm && P && +sm[1][0]===P.n){ S={id:sm[1],title:sm[2],items:[]}; P.subs.push(S); continue; }
    }
    if(S) S.items.push(it); else if(P) P.items.push(it);
  }
  // answer key from part 3
  L.key={}; L.answers=[];
  const p3=L.parts.find(p=>p.n===3);
  // two formats: "186. (A) text" + [Dau vet]/[Giai thich]
  //          or  "186. stem" + "Dap an dung: (A) text" + [Dau vet bai doc]/[Dien dat tuong duong]/[Loi giai chi tiet]/[Phan tich Phuong an Sai] + "(B) ..." "- Ly do sai:" "- Bay ETS:"
  //          or  an unnumbered stem line right before "Dap an dung:" (numbered from the lesson's "Questions N-M")
  if(p3){ let a=null, sec='';
    const newA=no=>{ a={no,k:'',t:'',stem:'',trace:'',expl:'',para:[],wrong:[]}; L.answers.push(a); sec=''; };
    // first question number: "Questions 181-185" in the title/source, else the first "181…" line after "[ORIGINAL ETS QUESTIONS"
    const iq=L.items.findIndex(s=>isStr(s)&&/^\[ORIGINAL ETS QUESTIONS/i.test(s)), fq=iq<0?null:L.items.slice(iq+1).find(s=>isStr(s)&&/^\d{3}(\.|\s|$)/.test(s));
    const s3=p3.items.filter(isStr), q0=+(((L.src+' '+L.items[0]).match(/Questions?\s*(\d+)/)||[])[1]||(fq||'').slice(0,3)||0);

/* ---------- line formatting for passages ---------- */
// passage header: known doc types, a bare "[Internal Recommendation] Letter", or generic "Doc Type [N] (Descriptor)";
// a bracket holding a date ("Boston (January 3)", "(Evaluated by …, Director — March 28)") is a dateline or caption, not a header
const DOC_RE=/^(E-mail|Email|Letter \d|Document \d|Internal Memorandum|Webpage|Press Release|Bill of Lading|Economic Logistics Article|Service Proposal)\b|^(?:[A-Z][a-z]+ ){0,3}Letter$|^[A-Z][A-Za-z&\/\- ]{2,50}(?: \d)? \((?![^()]*\b(?:January|February|March|April|May|June|July|August|September|October|November|December) \d)[A-Za-z][^()]*\)$/;
// an ALL-CAPS line like "REQUEST FOR PROPOSALS (RFP #VF-2026-08)" is a letterhead inside a passage, not a new passage
// "Document 2: Cloud Infrastructure Monitoring & Incident Report" names the paper after the colon
const isDocHead=s=>(/^((Document|Passage|Text)\s*\d+|Internal Memorandum|Memorandum)\s*:\s*\S/.test(s) && s.length<140) || (DOC_RE.test(s) && s.length<110 && !/:\s/.test(s) && !(s===s.toUpperCase() && /[A-Z]{4}/.test(s)));
function fmtLine(s){
  if(/^•\s*/.test(s)) return el('div','ln-bul',s.replace(/^•\s*/,''));
  const kv=s.match(/^([A-ZÀ-Ỹa-zà-ỹ][^:]{0,30}):\s+(.+)$/);
  if(kv && !/[.!?]$/.test(kv[1]) && kv[1].split(' ').length<=5){ const d=el('div','ln-kv'); add(d,el('b',null,kv[1]+':'),document.createTextNode(kv[2])); return d; }
  if(s===s.toUpperCase() && /[A-ZÀ-Ỹ]{3}/.test(s) && s.length<130) return el('div','ln-caps',s);
  if(/:$/.test(s) && s.length<60) return el('div','ln-sec',s);
  return el('p',null,s);
}

/* "• Label: text" bullet with a bold label; "• Label:" alone becomes a group heading */
function bullet(s){
  s=s.trim();
  if(/^[^:]{2,150}:$/.test(s)) return el('div','ln-head',s.slice(0,-1));
  const d=el('div','ln-bul'); const m=s.match(/^([^:]{2,150}?):\s+(.*)$/);
  if(m && !/[.!?]$/.test(m[1])){ let rest=m[2]; if(rest.startsWith(m[1]+':')) rest=rest.slice(m[1].length+1).trim();
    add(d,el('b',null,m[1]+': '),document.createTextNode(rest)); }
  else d.textContent=s;
  return d;
}
/* one line of a strategy / BA block: "• ..." bullet, "=> ..." conclusion, "(1) ..." numbered point, else paragraph */
function richLine(s){
  s=s.trim();
  if(/^•/.test(s)){ const r=s.replace(/^•\s*/,''); return r.trim()?bullet(r):null; }
  if(/^=>/.test(s)){ const d=bullet(s.replace(/^=>\s*/,'')); d.className='ln-concl'; return d; }
  if(/^\(\d+\)/.test(s)){ const d=bullet(s); d.className='ln-num'; return d; }
  if(/^-\s/.test(s)){ const d=bullet(s.replace(/^-\s*/,'')); d.className='ln-sub'; return d; }
  return el('p',null,s);
}

      else if(headish(s)&&!addr(s)&&!meta(s)&&lines.slice(i+1,i+6).some(x=>meta(x)&&!/^Dear\b/.test(x))) sc=2;
      else if(titleLike(s)&&!addr(s)&&!meta(s)&&lines[i+1]&&(titleLike(lines[i+1])||/\s—\s/.test(lines[i+1]))) sc=1.5;  // two-line masthead

      if(g&&i-g.i<=4){ if(sc===4&&g.sc<4) g.i=i; g.last=i; g.sc=Math.max(g.sc,sc); } else groups.push({i,last:i,sc}); });
    const cut=groups.filter(g=>g.i>3).sort((a,b)=>b.sc-a.sc||a.i-b.i).slice(0,nExp-1).map(g=>g.i).sort((a,b)=>a-b);

  Q.forEach(q=>{

      b.addEventListener('click',()=>{

/* summary paragraph -> one bullet per sentence; a long tail after ": " becomes sub-bullets split at top-level ", and/và/nhờ/đồng thời" or "; " */
const ABBR=/\b(Mr|Ms|Mrs|Dr|St|No|Inc|Co|Ltd|Corp|vs|etc|e\.g|i\.e|approx|Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)\.$/i;
function topSplit(s,test){ // split where test(s,i) matches outside brackets/quotes; returns [pieces]
  const out=[]; let d=0, st=0;
  for(let i=0;i<s.length;i++){ const c=s[i];
    if('(['.includes(c)) d++; else if(')]'.includes(c)) d=Math.max(0,d-1);
    else if(!d){ const n=test(s,i); if(n){ out.push(s.slice(st,i+n.keep).trim()); st=i+n.skip; i=st-1; } } }
  out.push(s.slice(st).trim()); return out.filter(Boolean);
}
function sentences(s){
  return topSplit(s,(t,i)=>{ if(!/[.!?]/.test(t[i])||!/\s/.test(t[i+1]||'')) return null;
    if(ABBR.test(t.slice(Math.max(0,i-6),i+1))) return null;
    const nx=t.slice(i+1).trimStart()[0]||''; if(!/[A-ZÀ-Ỹ0-9"'‘“(]/.test(nx)) return null;
    return {keep:1,skip:1}; });
}
function ideaList(s,vi){
  const ul=el('ul','ideas'+(vi?' vi-t':''));
  sentences(s).forEach(sen=>{
    const li=el('li'); const ci=sen.search(/:\s/); let head=sen, tail='';
    if(ci>20 && sen.length-ci>90){ head=sen.slice(0,ci+1); tail=sen.slice(ci+1).trim(); }
    // long sentence without a colon tail: break at top-level ", allowing / , while / , đồng thời / —"
    if(!tail && sen.length>200){ const ps=topSplit(sen,(t,i)=>{ const m=t.slice(i).match(/^(,\s+(?=(?:allowing|while|whereas|đồng thời|trong khi)\s)|\s*—\s*)/); return m?{keep:0,skip:m[0].length}:null; });
      if(ps.length>1){ head=ps[0]; tail=ps.slice(1); } }
    li.appendChild(document.createTextNode(head));
    if(Array.isArray(tail)){ const sub=el('ul'); tail.forEach(p=>sub.appendChild(el('li',null,p))); li.appendChild(sub); }
    else if(tail){ const parts=topSplit(tail,(t,i)=>{ const m=t.slice(i).match(/^(,\s+(?=(?:and|và|nhờ|đồng thời|rồi|then|while)\s)|;\s+)/); return m?{keep:m[0].startsWith(';')?1:0,skip:m[0].length}:null; });
      const sub=el('ul'); parts.forEach(p=>sub.appendChild(el('li',null,p))); li.appendChild(sub); }
    ul.appendChild(li);
  });
  return ul;
}

/* every table in 4.1 is one diagram (Vietnamese, then the English translation); the text line before a table is its caption.
   Arrow columns ("-->", "➔", "→") are dropped; a step head is "BƯỚC 1: Title" in one cell line or "BƯỚC 1" / "STEP 1" then the title */
function renderFlow(items,box){
  const keep=c=>c.length && !(c.length===1 && /^\s*(-+>|➔|→|➜|⇒|►|>)\s*$/.test(c[0]));
  let cap='';
  items.forEach(it=>{
    if(isStr(it)){ cap=it; return; }
    const tb=it, heads=tb.rows[0].filter(keep), bodies=(tb.rows[1]||[]).filter(keep);
    if(cap){ const c=el('div','strat-t',cap.replace(/:\s*$/,'')); c.style.cssText='color:var(--muted);margin:14px 0 8px'; box.appendChild(c); cap=''; }
    const f=el('div','flow');
    heads.forEach((hc,i)=>{
      const s=el('div','fstep'); const hm=hc[0].match(/^((?:BƯỚC|STEP)\s*\d+)\s*:?\s*(.*)$/i);
      const title=hm?[hm[2],...hc.slice(1)].filter(Boolean).join(' '):hc.join(' ');
      const h=el('h5'); if(hm){ add(h,el('span',null,hm[1]),document.createTextNode(title)); } else h.textContent=title;
      s.appendChild(h);
      (bodies[i]||[]).forEach(x=>{ x=x.replace(/^•\s*/,''); const m=x.match(/^([^:]{2,40}):\s*(.*)$/); const d=el('div','fkv'+(m&&/Đầu ra|Kết quả|Ket qua|Deliverable|Output/i.test(m[1])?' out':''));
        if(m) add(d,el('b',null,m[1]),el('span',null,m[2])); else d.textContent=x; s.appendChild(d); });
      f.appendChild(s);
    });
    box.appendChild(f);
  });
}

function renderVocab(items,box){
  const strs=items.filter(isStr); const g=el('div','vocab'); let c=null, n=0;
  strs.forEach(s=>{
    if(/^Ngh(?:ĩa|ia):/.test(s)&&c){ c.appendChild(el('div','mean vi-t vi-r',s.replace(/^Ngh(?:ĩa|ia):\s*/,''))); return; }
    if(/^Vd:/.test(s)&&c){ const t=s.replace(/^Vd:\s*/,''); const m=t.match(/^(.*?[.!?"”])\s+-\s+(.*)$/);
      const ex=el('div','ex'); if(m){ add(ex,el('i',null,m[1]),el('span','vi-t vi-r',m[2])); } else ex.appendChild(el('i',null,t)); c.appendChild(ex); return; }
    n++; c=el('div','vc'); const m=s.match(/^(?:(\d+)\.\s*)?(.+?)\s+(\/[^\/]+\/(?:\s*-\s*\/[^\/]+\/)*)\s+(?:(?:<=>|=)\s*)?(.+)$/);
    const h=el('div','vc-h'); add(h,el('span','vn',String(m&&m[1]?m[1]:n).padStart(2,'0')),el('h5',null,m?m[2]:s)); if(m) h.appendChild(el('span','ipa',m[3]));
    c.appendChild(h);
    if(m){ const ch=el('div','chips'); ch.appendChild(el('span','eq','≈')); m[4].split(/\s+\/\s+/).forEach(x=>ch.appendChild(el('span','chip',x))); c.appendChild(ch); }
    g.appendChild(c);
  });
  box.appendChild(g);
}

/* page order for PHẦN 1: 1.1 Đề gốc, 1.2 Câu hỏi gốc (both from the doc's 1.1), 1.3 Chiến thuật (the doc's own
   "Hướng dẫn làm bài Part 7" sub-section, or the "Bước" lines inside the doc's 1.1 in older docs), then translation,
   question translation and summary — matched by title so both doc layouts number the same */
function splitPart1(subs){
  const kind=S=>S.id==='1.1'?'1.1':/Hướng dẫn|Strategy|Chiến thuật|Chiến lược/i.test(S.title)?'guide':/Từng Câu|Sentence/i.test(S.title)?'1.2':/Câu hỏi|Question/i.test(S.title)?'1.3':/Song ngữ|Bilingual/i.test(S.title)?'1.2':'1.4';
  const short={'1.2':'Dịch từng câu','1.3':'Dịch câu hỏi','1.4':'Tóm tắt'};
  const s11=subs.find(S=>kind(S)==='1.1'), guide=subs.find(S=>kind(S)==='guide'), out=[];
  if(s11){
    out.push({...s11,src:'1.1',mode:'pass',short:'Đề gốc',title:'Đề thi Tiếng Anh gốc (Original ETS Passages)'});
    out.push({...s11,src:'1.1',mode:'quiz',short:'Câu hỏi gốc',title:'Câu hỏi Tiếng Anh gốc (Original ETS Questions)'});
  }
  if(guide) out.push({...guide,src:'1.1',mode:'guide',short:'Chiến thuật',title:'Hướng dẫn làm bài Part 7 (Strategy Guide)'});
  else if(s11) out.push({...s11,src:'1.1',mode:'strat',short:'Chiến thuật',title:'Hướng dẫn làm bài Part 7 (Strategy Guide)'});
  subs.forEach(S=>{ const k=kind(S); if(k!=='1.1'&&k!=='guide') out.push({...S,src:k,short:short[k]}); });
  out.forEach((S,i)=>S.id='1.'+(i+1));
  return out;
}
