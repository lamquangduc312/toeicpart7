6 Grace Recovery: On April 9, Luminary disbursed $281.39 to Mercer’s MasterCard ($349.00 subtotal minus a 25% restocking deduction of $87.25, plus $19.64 adjusted sales tax). Mercer was granted a 7-day grace clause to mail the missing cable to recover $34.90 by reclassifying the return to Grade B.","TÓM TẮT FEYNMAN 1 TRANG (BẢN TIẾNG VIỆT)","• Khung Chính sách Phí Tái Lưu kho \u0026 Ma trận Phân hạng: Luminary Audio Direct áp dụng chính sách phí nhập kho phân cấp: Hạng A (nguyên seal chưa khui, phí 0%), Hạng B (mở hộp như mới còn nguyên phụ kiện, phí 15%), và Hạng C (đổi trả thiếu phụ kiện hoặc xước xát nhẹ, phí 25%).","• Kiểm định Giám định Kỹ thuật Kho: Khách hàng Julian Mercer gửi trả tai nghe cao cấp SoundMaster ANC-900 (trị giá 349.00 USD) theo mã #RMA-7104-LUM. Kỹ thuật viên kiểm tra thấy phần cứng và đệm tai hoàn hảo không tì vết nhưng bị thiếu sợi cáp sạc nhanh USB-C bọc dù, khiến đơn bị đánh tụt xuống Hạng C.","• Quyết toán Tài chính \u0026 Điều khoản Ân hạn: Ngày 9/4, kế toán quyết toán hoàn 281.39 USD về thẻ MasterCard của ông Mercer (tiền hàng 349 USD trừ 25% phí hoàn kho là 87.25 USD, cộng 19.64 USD tiền hoàn thuế). Khách hàng được cho thời hạn 7 ngày gửi bổ sung dây cáp để được nâng lên Hạng B và nhận lại thêm 34.90 USD.","PHẦN 2: BẢNG LUYỆN TRUY XUẤT CHỦ ĐỘNG ACTIVE RECALL 5 GIÂY (ACTIVE RECALL MATRIX)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["Ma trận Phân loại Tình trạng Hàng Đổi trả: Hạng A (0%), Hạng B (15%), Hạng C (25%)","Graded Return Matrix: Grade A (0%), Grade B (15%), Grade C (25% Deduction)"]],[["2. Boi canh \u0026 Quy trinh loi"],["Giám định Kỹ thuật Tại Kho \u0026 Phát hiện Thiếu Dây Cáp Sạc USB-C","Depot Technical Bench QA \u0026 Identification of Missing USB-C Charging Cable"]],[["3. Dau vet suy luan cheo"],["Quyết toán Tiền hoàn Khấu trừ Phí Tái Lưu kho \u0026 Điều khoản Gửi Bổ sung 7 Ngày","Net Card Refund Settlement \u0026 7-Day Accessory Grace Recovery Clause"]]],"t":"table"},"PHẦN 3: GIẢI MÃ ĐÁP ÁN, PHÂN TÍCH BẪY ETS \u0026 TRUY VẾT DỮ KIỆN (DEEP-DIVE ANSWERS \u0026 TRAP ANALYSIS)","According to Document 1, what restocking fee is assessed on items returned in Grade A condition?","Dap an dung: (A) 0%","[Dau vet bai doc / Clue]: Văn bản 1, mục Grade A: \u0027Grade A (Factory Sealed / Unopened Condition): The product remains encased in original manufacturer cellophane wrap with unbroken tamper-evident seals. Restocking Deduction: 0% (Eligible for 100% full refund of the purchase price).\u0027","[Dien dat tuong duong / Paraphrase]: Restocking Deduction: 0% ➔ 0%.","[Loi giai chi tiet]: Chính sách ở Văn bản 1 nêu rõ sản phẩm đạt tiêu chuẩn Hạng A (còn nguyên seal bọc màng bóng kính và tem niêm phong) sẽ không bị trừ bất kỳ khoản phí nào (0%), được hoàn tiền 100%. Phương án (A) là đáp án chính xác.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(B) 10%","- Ly do sai: 10% là phần thưởng tín dụng cộng thêm (bonus credit) nếu chọn nhận store credit, không phải phí của Hạng A.","- Bay ETS: Bonus Percentage Confusion Trap (Bẫy nhầm lẫn tỷ lệ phần thưởng khuyến mại)","(C) 15%","- Ly do sai: 15% là mức phí tái lưu kho dành cho Hạng B (Open Box / Like-New).","- Bay ETS: Grade B Surcharge Trap (Bẫy nhầm sang phí Hạng B)","(D) 25%","- Ly do sai: 25% là mức phí tái lưu kho của Hạng C (thiếu phụ kiện).","- Bay ETS: Grade C Surcharge Trap (Bẫy nhầm sang phí Hạng C)","What issue was identified during the inspection of Mr. Mercer\u0027s returned headphones?","Dap an dung: (C) The braided USB-C charging cable was missing from the package","[Dau vet bai doc / Clue]: Văn bản 2, mục 4: \u0027However, the custom braided 1.5-meter USB-C fast-charging cable was absent from the internal accessory compartment.\u0027","[Dien dat tuong duong / Paraphrase]: custom braided USB-C cable was absent ➔ The braided USB-C charging cable was missing from the package.","[Loi giai chi tiet]: Biên bản kiểm tra của kỹ thuật viên Greg Kowalski xác nhận rằng tai nghe hoạt động hoàn hảo và ngoại quan rất đẹp, nhưng sợi cáp sạc nhanh USB-C bọc dù dài 1.5m đã bị thiếu trong ngăn phụ kiện. Đáp án (C) thể hiện đúng dữ liệu này.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) The Bluetooth wireless connectivity failed to pair with test equipment","- Ly do sai: Bài ghi rõ kết nối Bluetooth 5.3 được kiểm tra hoạt động 100% bình thường (tested 100% functional).","- Bay ETS: Direct Contradiction Trap (Bẫy mâu thuẫn trực tiếp với kết quả kỹ thuật)","(B) The headband cushion exhibited severe cosmetic cracking","- Ly do sai: Đệm đầu và đệm tai được ghi nhận là sạch sẽ hoàn hảo (immaculate with zero scratches or wear).","- Bay ETS: Opposite Condition Trap (Bẫy mô tả tình trạng hư hỏng trái ngược)","(D) The protective travel case was stained with liquid residue","- Ly do sai: Hộp bảo vệ du lịch bán cứng vẫn còn nguyên trong hộp và không hề bị bẩn chất lỏng.","- Bay ETS: Fabricated Defect Trap (Bẫy khuyết tật tự bịa đặt)","Why was Mr. Mercer\u0027s return assigned to Grade C rather than Grade B?","Dap an dung: (B) An essential original charging cord was absent from the box","[Dau vet bai doc / Clue]: Văn bản 2, phần Technician Disposition: \u0027Due to the missing USB-C fast-charging cord, this unit cannot be recertified under Grade B. The return is classified as Grade C (Incomplete Return / Missing Accessory).\u0027 kết hợp định nghĩa Hạng B ở Văn bản 1: \u0027returned with 100% of original interior foam, cables, manuals, and accessories.\u0027","[Dien dat tuong duong / Paraphrase]: missing USB-C charging cord ➔ An essential original charging cord was absent from the box.","[Loi giai chi tiet]: Tiêu chuẩn Hạng B bắt buộc phải có đầy đủ 100% phụ kiện và dây cáp ban đầu. Do ông Mercer thiếu dây sạc USB-C, kỹ thuật viên không thể xếp vào Hạng B mà phải chuyển sang Hạng C (Incomplete Return). Phương án (B) là câu trả lời chính xác.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) He failed to include the original retail store paper receipt","- Ly do sai: Hệ thống tra cứu theo mã hóa đơn điện tử và mã RMA, không yêu cầu hóa đơn giấy.","- Bay ETS: Paper Receipt Trap (Bẫy đòi hỏi hóa đơn giấy vật lý)","(C) The package was returned past the 30-day return window","- Ly do sai: Đơn hàng vẫn nằm trong thời hạn đổi trả hợp lệ và đã có mã RMA duyệt trước.","- Bay ETS: Return Window Violation Trap (Bẫy quá thời hạn đổi trả)","(D) The serial number on the headphones did not match the invoice","- Ly do sai: Nếu sai số sê-ri thì hàng đã bị từ chối tiếp nhận (Non-Returnable), không thể được xếp vào Hạng C.","- Bay ETS: Mismatch Rejection Trap (Bẫy sai lệch số sê-ri nghiêm trọng)","What was the exact dollar deduction taken from Mr. Mercer\u0027s merchandise subtotal for the restocking fee?","Dap an dung: (C) $87.25","[Dau vet bai doc / Clue]: Văn bản 3, bảng kê chi tiết: \u0027• Original Merchandise Subtotal: $349.00... • Less: Grade C Restocking Deduction (25% of merchandise subtotal): -$87.25\u0027.","[Dien dat tuong duong / Paraphrase]: Grade C Restocking Deduction: -$87.25 ➔ $87.25.","[Loi giai chi tiet]: Theo bảng sao kê quyết toán ở Văn bản 3, khoản khấu trừ phí tái lưu kho Hạng C (25% của tiền hàng 349 USD) có giá trị đúng bằng $87.25 ($349 × 0.25 = $87.25). Đáp án (C) hoàn toàn trùng khớp.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) $26.18","- Ly do sai: $26.18 là số tiền thuế bán hàng ban đầu mà ông Mercer đã nộp khi mua hàng.","- Bay ETS: Sales Tax Amount Trap (Bẫy số tiền thuế bán hàng)","(B) $34.90","- Ly do sai: $34.90 là khoản tiền ông sẽ được hoàn thêm nếu gửi trả lại dây sạc trong 7 ngày (chênh lệch giữa 25% và 15%).","- Bay ETS: Accessory Adjustment Trap (Bẫy số tiền điều chỉnh phụ kiện ân hạn)","(D) $261.75","- Ly do sai: $261.75 là số tiền hàng ròng còn lại sau khi đã trừ phí ($349 - $87.25 = $261.75), không phải bản thân khoản phí.","- Bay ETS: Net Remainder Trap (Bẫy lấy số tiền còn lại làm tiền phí)","In Document 1, the word \u0027pristine\u0027 in paragraph 3 is closest in meaning to","Dap an dung: (A) immaculate","[Dau vet bai doc / Clue]: Văn bản 1, mục Grade B: \u0027the hardware is in pristine cosmetic condition, fully functional...\u0027","[Dien dat tuong duong / Paraphrase]: pristine (nguyên vẹn, hoàn hảo, sạch bóng như mới) = immaculate / flawless / spotless.","[Loi giai chi tiet]: Trong ngữ cảnh đánh giá tình trạng ngoại quan của sản phẩm điện tử tiêu dùng, từ \u0027pristine\u0027 có nghĩa là hoàn hảo, sạch sẽ, không một vết xước hay vết bẩn nào (như mới). Từ \u0027immaculate\u0027 (tinh tươm, không tì vết) là từ đồng nghĩa chính xác nhất.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(B) antique","- Ly do sai: \u0027antique\u0027 có nghĩa là cổ xưa, đồ cổ, trái ngược với tình trạng sản phẩm điện tử đời mới.","- Bay ETS: Age Inversion Trap (Bẫy tuổi đời đồ cổ)","(C) artificial","- Ly do sai: \u0027artificial\u0027 có nghĩa là nhân tạo, giả tạo, không mô tả tình trạng bề mặt sản phẩm.","- Bay ETS: Material Distortion Trap (Bẫy đặc tính vật liệu)","(D) fragile","- Ly do sai: \u0027fragile\u0027 có nghĩa là mong manh, dễ vỡ, không diễn đạt mức độ hoàn mỹ của sản phẩm.","- Bay ETS: Structural Vulnerability Trap (Bẫy tính chất dễ vỡ)","4.1. BẢN ĐỒ TIẾN TRÌNH GIÁM ĐỊNH KHO \u0026 QUYẾT TOÁN PHÍ TÁI LƯU KHO (RETURN QA \u0026 REFUND SETTLEMENT WORKFLOW)","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","TIẾP NHẬN BƯU KIỆN \u0026 CHẨN ĐOÁN KỸ THUẬT PHÂN CẤP TẠI KHO"],[],["BƯỚC 2","PHÂN HẠNG TÌNH TRẠNG HÀNG \u0026 ÁP ĐẶT MÃ KHẤU TRỪ PHÍ LƯU KHO"],[],["BƯỚC 3","PHÁT HÀNH TIỀN HOÀN QUA THẺ \u0026 KÍCH HOẠT ĐIỀU KHOẢN ÂN HẠN 7 NGÀY"]],[["• Chung tu \u0026 Kenh: Trung Tâm Hoàn Tất Đơn Hàng \u0026 Bàn Thử Nghiệm Kỹ Thuật (QA Test Bench)","• Nghiep vu thuc thi: Kho tiếp nhận kiện hàng #PKG-94021 ➔ Quét mã RMA #RMA-7104 ➔ Kỹ thuật viên kiểm tra chức năng âm thanh, Bluetooth, khử ồn ANC ➔ Đo đạc ngoại quan đệm tai ➔ Kiểm đếm phụ kiện trong hộp.","• Ket qua \u0026 Kiem soat: Biên bản chẩn đoán ghi nhận máy hoạt động 100% nhưng thiếu dây sạc nhanh USB-C bọc dù."],["➔"],["• Chung tu \u0026 Kenh: Hệ Thống Quản Lý Kho Bãi (WMS) \u0026 Phân Hệ Đổi Trả Ngược (Reverse ERP)","• Nghiep vu thuc thi: Thiếu phụ kiện nguyên bản ➔ Hệ thống tự động chuyển phân loại từ Hạng B xuống Hạng C ➔ Áp mã khấu trừ C-25 (25% tiền hàng = $87.25) ➔ Điều chỉnh tiền hoàn thuế tỷ lệ (+$19.64).","• Ket qua \u0026 Kiem soat: Bảng tính quyết toán tài chính tự động được phê duyệt và đẩy sang cổng thanh toán thẻ."],["➔"],["• Chung tu \u0026 Kenh: Cổng Thanh Toán Thẻ Ngân Hàng \u0026 Hệ Thống CRM Chăm Sóc Khách Hàng","• Nghiep vu thuc thi: Chuyển khoản hoàn tiền $281.39 về thẻ MasterCard trong 3-5 ngày ➔ Gửi email sao kê minh bạch chi tiết ➔ Thông báo điều khoản gửi bổ sung dây cáp trong 7 ngày để nhận lại $34.90.","• Ket qua \u0026 Kiem soat: Đảm bảo sự công bằng tài chính cho nhà bán lẻ và giữ vững niềm tin trải nghiệm của khách hàng."]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["PHASE 1","PARCEL INTAKE \u0026 MULTI-POINT DIAGNOSTIC BENCH QA"],[],["PHASE 2","MERCHANDISE GRADING \u0026 AUTOMATED RESTOCKING DEDUCTION"],[],["PHASE 3","CARD REFUND DISBURSEMENT \u0026 7-DAY ACCESSORY GRACE ACTIVATION"]],[["• Documents \u0026 Channels: Central Fulfillment Depot \u0026 Technician Testing Bench","• Core Business Execution: Depot receives parcel #PKG-94021 ➔ Scans RMA #RMA-7104 ➔ Technician audits audio drivers, Bluetooth, ANC circuitry ➔ Inspects headband/earcups ➔ Audits interior accessory tray.","• Key Deliverable \u0026 Control: QA report confirms 100% functionality but identifies missing braided USB-C cable."],["➔"],["• Documents \u0026 Channels: Warehouse Management System (WMS) \u0026 Reverse Logistics ERP","• Core Business Execution: Missing cord disqualifies unit from Grade B ➔ Reclassifies item to Grade C ➔ Imposes 25% restocking deduction ($87.25) ➔ Recalculates pro-rated sales tax refund (+$19.64).","• Key Deliverable \u0026 Control: Approved financial settlement payload routed to merchant payment gateway."],["➔"],["• Documents \u0026 Channels: Payment Card Processor Gateway \u0026 Customer Engagement CRM","• Core Business Execution: Disburses $281.39 net refund to customer MasterCard in 3-5 days ➔ Transmits itemized statement ➔ Activates 7-day grace clause allowing cable return to recover $34.90.","• Key Deliverable \u0026 Control: Mitigates merchant liquidation loss while maintaining transparent customer goodwill."]]],"t":"table"},"4.2. GÓC NHÌN NGHIỆP VỤ FEYNMAN (FEYNMAN MULTI-PERSPECTIVE ANALYSIS)","• Bức tranh Toàn cảnh Nghiệp vụ (End-to-End Business Flow): Hàng đổi trả trong thương mại điện tử không thể bán lại với giá gốc 100% nếu hộp đã bị xé niêm phong hoặc thiếu phụ kiện. Quy trình Quản trị Đổi trả Hàng hóa (Returns Management) bắt buộc phải có bước Giám định Chất lượng Đầu vào (Intake QA Testing). Bằng việc chia cấp độ rõ ràng (Grade A/B/C), nhà bán lẻ biến việc trừ tiền hoàn thành một công thức toán học minh bạch: Hàng nguyên seal được hoàn 100%; hàng khui hộp mất 15% để bù đắp chi phí dán nhãn Open-Box bán thanh lý; hàng thiếu dây cáp mất 25% để nhân viên kho phải mua cáp mới đóng gói lại. Điều khoản ân hạn 7 ngày gửi bổ sung phụ kiện chính là nghệ thuật giữ chân khách hàng (Customer Retention) tinh tế.","• Lăng kính Viễn thông / CNTT Viettel: Tại hệ sinh thái Viettel Store và Trung tâm Bán hàng Đa kênh Viettel, chính sách đổi trả điện thoại iPhone, Samsung hay laptop tuân thủ nghiêm ngặt bảng phân loại hiện trạng máy. Khi khách hàng trả máy trong 30 ngày vì đổi ý, nhân viên kỹ thuật Viettel Store sẽ dùng kính hiển vi và phần mềm chuyên dụng kiểm tra số lần sạc pin, tình trạng xước viền và sự đầy đủ của củ sạc, tai nghe và que chọc SIM trong hộp. Nếu thiếu phụ kiện chính hãng của nhà sản xuất, hệ thống POS sẽ tự động áp dụng công thức trừ tiền tương ứng trên hợp đồng điện tử trước khi hoàn tiền về tài khoản Viettel Money của khách hàng.","• Lăng kính Trường Mầm non Ước Mơ Xanh \u0026 Giáo dục Mầm non: Khi trường mầm non mua sắm thiết bị âm thanh loa kéo di động hoặc micro không dây phục vụ các tiết mục biểu diễn văn nghệ cho trẻ, nếu đem trả lại do công suất quá lớn so với lớp học, cô giáo phụ trách hành chính phải kiểm tra cẩn thận túi đựng, sạc pin và micro trước khi đóng thùng gửi lại đơn vị cung ứng. Nếu chẳng may để quên chiếc micro nhỏ ở lớp, đơn vị cung cấp sẽ trừ tiền cọc linh kiện; khi cô giáo tìm thấy và gửi bổ sung thì nhà cung cấp mới hoàn nốt phần tiền còn lại cho quỹ trường.","• Lăng kính Trực quan Hóa cho Bé Hà Ngân (5 tuổi): Con hãy tưởng tượng chú gấu bông của con có một chiếc nơ đỏ xinh xắn trên cổ! Khi con mượn bạn gấu về chơi thử nhưng muốn gửi trả lại cửa hàng để đổi lấy bạn búp bê, chú bán hàng sẽ kiểm tra xem bạn gấu có sạch sẽ không và chiếc nơ đỏ có còn nguyên vẹn không. Nếu con chẳng may làm rơi mất chiếc nơ đỏ ở phòng khách, chú bán hàng sẽ giữ lại một đồng tiền nhỏ để mua chiếc nơ mới gắn cho bạn gấu. Nhưng nếu con tìm thấy chiếc nơ và mang trả lại cho chú, chú sẽ mỉm cười và trả lại đồng tiền đó cho con ngay!","4.3. PHÂN TÍCH CHUYÊN SÂU DÀNH CHO BUSINESS ANALYST (BA PERSPECTIVE)","• Graded Restocking Algorithmic Engine \u0026 BOM Reconciliation: Business Analysts configuring Reverse Logistics modules in enterprise ERPs (e.g., NetSuite / SAP) must establish dynamic Bill-of-Materials (BOM) checklists linked to QA technician inspection screens. When a serial number is scanned, the mobile handheld terminal prompts the technician with mandatory checkbox audits (Chassis Integrity, Driver Diagnostics, Accessory Completeness). Unchecking an accessory item (such as the USB-C cable) must dynamically re-evaluate the disposition rule engine, automatically demoting the item\u0027s SKU disposition to \u0027Grade C Open-Box\u0027 and calculating the exact dollar penalty based on predefined catalog penalty percentages.","• Automated Financial Splitting \u0026 Tax Amortization Logic: From a financial systems perspective, refund settlement logic requires rigorous multi-line ledger entries. When a $349.00 item is returned with a 25% restocking deduction ($87.25), the refund engine cannot simply deduct $87.25 from the gross transaction. It must calculate proportional state sales tax amortization: $26.18 original tax paid is adjusted proportionally (Tax Refunded = $19.64, Tax Retained on Restocking Service = $6.54). The net amount disbursed to the credit card processor payload ($281.39) reconciles the merchant\u0027s reverse logistics labor revenue account while generating automated credit memos that balance tax authority reporting requirements.","PHẦN 5: TỪ VỰNG CHUYÊN SÂU \u0026 BẢNG ÔN TẬP ĐỊNH KỲ ANKI (VOCABULARY \u0026 SPACED REPETITION)","Restocking Deduction  /riːˈstɑːkɪŋ dɪˈdʌkʃən/  Inventory Repackaging Deduction / Returned Goods Surcharge / Processing Fee Withholding","Nghia: Khoản khấu trừ phí tái lưu kho; số tiền bị trừ trực tiếp vào giá trị tiền hàng hoàn lại để trang trải chi phí kiểm tra, làm mới và đóng gói lại.","Vd: A twenty-five percent restocking deduction was applied because the original fast-charging accessory was missing. - Khoản khấu trừ phí tái lưu kho hai mươi lăm phần trăm đã được áp dụng vì thiếu phụ kiện sạc nhanh ban đầu.","Pristine  /ˈprɪstiːn/  Immaculate / Flawless / In Mint Condition / Spotless / Untouched","Nghia: Nguyên vẹn, hoàn hảo, như mới; tình trạng ngoại quan tinh tươm không có bất kỳ dấu hiệu hư hao, vết xước hay vết bẩn nào.","Vd: Although the box was unsealed, the wireless headphones remained in pristine cosmetic condition. - Mặc dù bao bì đã bị bóc niêm phong, chiếc tai nghe không dây vẫn ở trong tình trạng ngoại quan hoàn hảo như mới.","Open-Box  /ˌoʊpən ˈbɑːks/  Customer Returned / Unsealed Merchandise / Factory Recertified / Repackaged Good","Nghia: Hàng mở hộp; hàng hóa đã bị bóc seal bao bì bên ngoài nhưng phần cứng bên trong vẫn còn mới và hoạt động đầy đủ chức năng, thường được bán lại với giá giảm.","Vd: Retailers liquidate open-box electronics at a discount after verifying all internal components are fully operational. - Các nhà bán lẻ thanh lý các thiết bị điện tử mở hộp với mức giá giảm sau khi xác minh toàn bộ linh kiện bên trong vẫn hoạt động hoàn hảo.","Store Credit  /stɔːr ˈkredɪt/  Merchant Credit Voucher / In-Store Account Balance / Shopping Credit Allowance","Nghia: Tín dụng cửa hàng; số dư tiền ảo do nhà bán lẻ cấp cho tài khoản của khách hàng để mua sắm các sản phẩm khác thay vì hoàn tiền mặt vào thẻ ngân hàng.","Vd: Customers opting for store credit received a ten percent bonus allowance and avoided all restocking fees. - Những khách hàng lựa chọn nhận tín dụng cửa hàng đã được cộng thêm mười phần trăm tiền thưởng và được miễn toàn bộ phí tái lưu kho.","Disbursement  /dɪsˈbɜːrsmənt/  Payment Release / Fund Remittance / Settlement Payout / Financial Reimbursement","Nghia: Sự chi trả, khoản tiền hoàn giải ngân; hành động chuyển tiền thanh toán hoặc tiền hoàn từ tài khoản doanh nghiệp về tài khoản của khách hàng.","Vd: The accounting department finalized the electronic disbursement within three business days of receiving the package. - Bộ phận kế toán đã hoàn tất việc giải ngân chi trả điện tử trong vòng ba ngày làm việc kể từ khi nhận được gói hàng.","Grace Clause  /ɡreɪs klɔːz/  Forgiveness Period / Extension Window / Conditional Remediation Period","Nghia: Điều khoản ân hạn; khoảng thời gian gia hạn cho phép khách hàng khắc phục sai sót (như gửi bổ sung phụ kiện) để nhận lại đầy đủ quyền lợi tài chính.","Vd: Under the seven-day grace clause, returning the forgotten charging cable restored the buyer\u0027s higher refund rate. - Theo điều khoản ân hạn bảy ngày, việc gửi trả lại dây sạc bị để quên đã giúp khôi phục tỷ lệ hoàn tiền cao hơn cho người mua.","==================================================================================================","BÀI 4: TÍCH HỢP ĐỔI TRẢ ĐA KÊNH: MUA TRỰC TUYẾN ĐỔI TRẢ TẠI CỬA HÀNG (BORIS), ĐỔI SIZE NGANG GIÁ \u0026 ĐỒNG BỘ DỮ LIỆU POS (BUY ONLINE, RETURN IN-STORE - BORIS, IN-STORE EXCHANGES \u0026 OMNICHANNEL POS SYNCHRONIZATION)","ETS TOEIC Part 7 - Triple Passage (Test 1, Questions 196 - 200)","PHẦN 1: BÀI ĐỌC HIỂU GỐC ETS \u0026 HƯỚNG DẪN CHIẾN THUẬT (5-MINUTE STRATEGY GUIDE)","1.1. BÀI ĐỌC HIỂU GỐC \u0026 CÂU HỎI THEO BỘ ĐỀ ETS (ORIGINAL PASSAGES \u0026 QUESTIONS)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","OMNICHANNEL SERVICE ANNOUNCEMENT (DOCUMENT 1 OF 3)","VANGUARD OUTDOOR \u0026 APPAREL — PRESS RELEASE \u0026 APP UPDATE","FOR IMMEDIATE RELEASE: August 1","Headline: Vanguard Unveils \u0027Instant BORIS\u0027 Across All 350 Retail Outlets Nationwide","Vanguard Outdoor \u0026 Apparel today announced the complete nationwide rollout of its innovative Buy Online, Return In-Store (BORIS) integration across its entire retail footprint. Designed to eliminate the hassle of repacking boxes and waiting for postal carrier refunds, Instant BORIS bridges our e-commerce platform and physical storefronts.","Key Program Features:","• Frictionless In-Person Returns: Customers who purchase apparel, footwear, or camping gear on www.vanguardapparel.com or via the Vanguard mobile app can now return or exchange items at any physical store within 45 days of receipt.","• Zero Shipping Overhead: Avoid postal return label deductions entirely. Returning merchandise in person is always 100% free of handling charges.","• Instant Gratification \u0026 Same-Day Exchanges: Simply present your in-app order barcode to any customer service cashier. If an item does not fit, store associates can instantly execute a direct, zero-balance exchange for an alternate size or color from available store inventory, or disburse an immediate refund directly to your original payment card.","• Bonus In-Store Incentive: Shoppers electing to convert their return into Vanguard Store Credit will receive an automatic 10% bonus spending voucher usable immediately on any in-store purchase.","IN-STORE POS RETURN \u0026 EXCHANGE RECEIPT (DOCUMENT 2 OF 3)","VANGUARD APPAREL — STORE #108 (CHICAGO MAGNIFICENT MILE)","625 North Michigan Avenue, Chicago, IL 60611","Register POS-04 | Cashier: Carlos M. (ID #EMP-4820)","Transaction Date: August 14 | Time: 14:28 CST","Receipt Reference: #POS-EX-99210-CH","CUSTOMER TRANSACTION: OMNICHANNEL BORIS EXCHANGE","Customer Name: Chloe Bennett (Vanguard Rewards Member #VR-83921)","Original E-Commerce Order Reference: #VAN-83021 (Delivered August 9)","RETURNED MERCHANDISE:","• SKU: #FTW-TRL-75-BLK | Desc: Apex Peak Waterproof Trail Boot (Black)","• Size: US Women\u0027s 7.5 | Condition: Inspected - Unworn with tags attached","• Return Reason: Size Fit (Customer noted forefoot toe box was too narrow / snug)","• Credit Amount Credited: -$185.00","EXCHANGED MERCHANDISE ISSUED:","• SKU: #FTW-TRL-80-BLK | Desc: Apex Peak Waterproof Trail Boot (Black)","• Size: US Women\u0027s 8.0 | Condition: Brand-New / In-Store Floor Stock","• Unit Retail Price: $185.00","• Price Difference: $0.00","• Local Sales Tax Adjustment (10.25%): $0.00","TOTAL AMOUNT DUE / TENDERED: $0.00","Balance Settled: Direct 1-to-1 Even Exchange Completed at POS.","Warranty Status: 1-Year Apex Manufacturer Trail Protection transferred to new serial.","AUTOMATED POST-TRANSACTION SURVEY \u0026 INCENTIVE (DOCUMENT 3 OF 3)","VANGUARD CUSTOMER EXPERIENCE TEAM","TO: Chloe Bennett \u003cchloe.bennett@midwestdesign.org\u003e","FROM: Vanguard Experience Insights \u003cexperience@vanguardapparel.com\u003e","DATE: August 15","SUBJECT: How was your Instant BORIS visit at our Chicago Flagship Store?","Dear Ms. Bennett,","Thank you for visiting our Magnificent Mile store yesterday, August 14, to exchange your Apex Peak Trail Boots from Order #VAN-83021.","We hope your new Size 8.0 boots provide the comfortable, supportive fit you need for your upcoming trail excursions! Your digital equipment registry has been updated, and your 1-Year Trail Protection warranty is fully active for the exchanged pair.","Because Instant BORIS was recently introduced nationwide, your feedback is vital to optimizing our checkout counters and staff training. We would greatly appreciate two minutes of your time to complete our brief 4-question satisfaction survey:","[Take 2-Minute Customer Experience Survey]","As a token of our appreciation for your continuous loyalty as a Vanguard Rewards Member, upon completing the survey, an exclusive $15.00 promotional discount code will be deposited directly into your Vanguard mobile app wallet. This voucher is valid for 60 days on any apparel or gear purchase exceeding $50, either online or at any Vanguard retail location.","Thank you for choosing Vanguard Outdoor.","Warmly,","Rachel Sterling","Vice President of Omnichannel Customer Experience","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","196. What is highlighted as a primary benefit of the Instant BORIS program in Document 1?","(A) Discounted international air cargo shipping rates","(B) The ability to return online purchases at physical retail locations without shipping fees","(C) Free dry cleaning services for all returned apparel items","(D) Complimentary home pickup by Vanguard courier drivers","197. Why did Ms. Bennett visit the Vanguard store on Michigan Avenue?","(A) To apply for a part-time retail sales associate position","(B) To collect an online order that had been held in a store locker","(C) To exchange hiking footwear for a larger size because the original pair was too tight","(D) To attend an outdoor survival seminar hosted by store management","198. According to Document 2, how much was Ms. Bennett charged for the exchange transaction?","(A) $0.00","(B) $12.50","(C) $18.50","(D) $185.00","199. What incentive is offered to Ms. Bennett in the follow-up email?","(A) An extension of her footwear warranty to a lifetime guarantee","(B) A complimentary pair of merino wool hiking socks","(C) A $15.00 digital discount voucher for completing a brief survey","(D) An invitation to an exclusive VIP camping equipment gala","200. In Document 1, the word \u0027frictionless\u0027 in paragraph 2 is closest in meaning to","(A) effortless","(B) abrasive","(C) slippery","(D) unpredictable","1.2. HƯỚNG DẪN CHIẾN THUẬT 5 PHÚT TỐI ƯU (5-MINUTE HIGH-SPEED STRATEGY GUIDE)","CHIẾN THUẬT 5 PHÚT TỐI ƯU: NẮM BẮT BỐI CẢNH, GHÉP NỐI DỮ KIỆN \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Quét Z-Pattern: Văn bản 1 là Thông cáo Báo chí / Bản tin Ứng dụng Di động của thương hiệu thời trang thể thao Vanguard Apparel công bố tính năng \u0027Instant BORIS\u0027 (Buy Online, Return In-Store) trên 350 cửa hàng toàn quốc, cho phép đổi trả hàng mua qua mạng trực tiếp tại quầy thanh toán cửa hàng vật lý, hỗ trợ hoàn tiền ngay hoặc đổi size ngang giá không mất phí vận chuyển; Văn bản 2 là Biên lai Giao dịch Đổi hàng Đa kênh tại Điểm bán (In-Store POS Exchange Receipt) của Cửa hàng Chicago #108 đối với khách hàng Chloe Bennett, mang đôi giày leo núi chống nước mua online (Size 7.5, $185.00) đến đổi lấy Size 8.0 do bị chật; Văn bản 3 là Thư điện tử Khảo sát Mức độ Hài lòng (CSAT Follow-Up Survey) gửi cho cô Bennett, xác nhận kích hoạt bảo hành cho đôi giày Size 8.0 mới và tặng mã giảm giá 15 USD cho lần mua sắm tiếp theo.","Bước 2 (60 giây) - Móc nối Logic \u0026 Sơ đồ Tinh thần: Móc nối quy trình bán lẻ đa kênh khép kín: Chính sách đổi trả BORIS tại cửa hàng (Văn bản 1) ➔ Khách hàng mang đơn online ra cửa hàng quét mã vạch POS để đổi size ngay lập tức với chênh lệch 0 đồng (Văn bản 2) ➔ Hệ thống CRM tự động đồng bộ hồ sơ, kích hoạt bảo hành và gửi phiếu khảo sát tặng voucher (Văn bản 3).","Bước 3 (120 giây) - Định vị Manh mối \u0026 Giải đề Tốc độ: Câu 196 hỏi lợi thế nổi bật của dịch vụ Instant BORIS (cho phép đổi trả hàng online tại bất kỳ cửa hàng vật lý nào mà không tốn phí gửi hàng bưu điện); Câu 197 hỏi tại sao cô Bennett mang đôi giày đến cửa hàng Chicago (để đổi sang cỡ giày lớn hơn vì cỡ cũ bị chật); Câu 198 (liên kết Văn bản 1 \u0026 2) hỏi chi phí phụ thu mà cô Bennett phải trả khi đổi sang Size 8.0 ($0.00 - đổi ngang giá tại chỗ); Câu 199 (liên kết Văn bản 2 \u0026 3) hỏi cô Bennett nhận được quyền lợi gì trong email sau giao dịch (phiếu giảm giá $15 cho lần mua sắm tiếp theo); Câu 200 (từ vựng) hỏi từ \u0027seamless\u0027 trong Văn bản 1 (đồng nghĩa với flawless / smooth / frictionless).","Bước 4 (30 giây) - Đúc kết Feynman 1 Câu: Bản chất của BORIS trong đề thi TOEIC là sự xóa nhòa ranh giới giữa online và offline: Cửa hàng vật lý trở thành trạm dịch vụ khách hàng tức thì (Instant Service Station), biến nguy cơ mất khách do hàng không vừa size thành cơ hội nâng cao sự trung thành và giữ trọn doanh thu.","1.3. BẢN DỊCH SONG NGỮ CHUẨN XÁC TOÀN VĂN (ACCURATE BILINGUAL TRANSLATION)","VĂN BẢN 1: THÔNG CÁO BÁO CHÍ VỀ TÍNH NĂNG ĐỔI TRẢ ĐA KÊNH BORIS (VANGUARD)","VANGUARD OUTDOOR \u0026 APPAREL — PRESS RELEASE \u0026 APP UPDATE","FOR IMMEDIATE RELEASE: August 1","Headline: Vanguard Unveils \u0027Instant BORIS\u0027 Across All 350 Retail Outlets Nationwide","VANGUARD OUTDOOR \u0026 APPAREL — THÔNG CÁO BÁO CHÍ \u0026 CẬP NHẬT ỨNG DỤNG","PHÁT HÀNH NGAY: Ngày 1 tháng 8","Tiêu đề: Vanguard Công bố Tính năng \u0027Instant BORIS\u0027 Trên Toàn bộ 350 Cửa hàng Bán lẻ Toàn quốc","Vanguard Outdoor \u0026 Apparel today announced the complete nationwide rollout of its innovative Buy Online, Return In-Store (BORIS) integration across its entire retail footprint. Designed to eliminate the hassle of repacking boxes and waiting for postal carrier refunds, Instant BORIS bridges our e-commerce platform and physical storefronts.","Hôm nay, Công ty Thời trang \u0026 Dã ngoại Vanguard công bố việc triển khai toàn diện trên toàn quốc tính năng tích hợp Mua Hàng Trực Tuyến - Đổi Trả Tại Cửa Hàng (BORIS) đột phá trên toàn bộ mạng lưới bán lẻ của mình. Được thiết kế nhằm xóa bỏ sự phiền toái của việc đóng thùng gửi lại và chờ đợi tiền hoàn từ các đơn vị bưu chính, Instant BORIS đóng vai trò là cầu nối giữa nền tảng thương mại điện tử và các cửa hàng vật lý của chúng tôi.","Key Program Features:","• Frictionless In-Person Returns: Customers who purchase apparel, footwear, or camping gear on www.vanguardapparel.com or via the Vanguard mobile app can now return or exchange items at any physical store within 45 days of receipt.","• Zero Shipping Overhead: Avoid postal return label deductions entirely. Returning merchandise in person is always 100% free of handling charges.","• Instant Gratification \u0026 Same-Day Exchanges: Simply present your in-app order barcode to any customer service cashier. If an item does not fit, store associates can instantly execute a direct, zero-balance exchange for an alternate size or color from available store inventory, or disburse an immediate refund directly to your original payment card.","• Bonus In-Store Incentive: Shoppers electing to convert their return into Vanguard Store Credit will receive an automatic 10% bonus spending voucher usable immediately on any in-store purchase.","Các Tính năng Then chốt của Chương trình:","• Đổi trả Trực tiếp Dễ dàng Thuận tiện: Những khách hàng mua quần áo, giày dép hoặc đồ dã ngoại trên trang web www.vanguardapparel.com hoặc qua ứng dụng di động Vanguard giờ đây có thể trả hoặc đổi sản phẩm tại bất kỳ cửa hàng vật lý nào trong vòng 45 ngày kể từ ngày nhận hàng.","• Không Mất Phí Vận chuyển: Tránh hoàn toàn việc bị khấu trừ phí nhãn bưu điện đổi trả. Việc mang hàng trả trực tiếp luôn được miễn 100% các khoản phí xử lý.","• Trải nghiệm Tức thì \u0026 Đổi hàng Trong ngày: Quý khách chỉ cần xuất trình mã vạch đơn hàng trên ứng dụng cho bất kỳ thu ngân quầy dịch vụ khách hàng nào. Nếu sản phẩm không vừa vặn, nhân viên cửa hàng có thể thực hiện đổi ngay sang kích cỡ hoặc màu sắc khác từ kho hàng sẵn có tại cửa hàng với mức chênh lệch 0 đồng, hoặc hoàn tiền ngay lập tức về thẻ thanh toán ban đầu của quý khách.","• Phần thưởng Ưu đãi tại Cửa hàng: Những người mua sắm lựa chọn chuyển tiền hoàn thành Điểm Tín dụng Cửa hàng Vanguard sẽ tự động nhận thêm phiếu chi tiêu thưởng 10% có thể sử dụng ngay lập tức cho bất kỳ giao dịch mua sắm nào tại cửa hàng.","VĂN BẢN 2: BIÊN LAI ĐỔI HÀNG ĐA KÊNH TẠI CỬA HÀNG (CHI NHÁNH CHICAGO #108)","VANGUARD APPAREL — STORE #108 (CHICAGO MAGNIFICENT MILE)","625 North Michigan Avenue, Chicago, IL 60611","Register POS-04 | Cashier: Carlos M. (ID #EMP-4820)","Transaction Date: August 14 | Time: 14:28 CST","Receipt Reference: #POS-EX-99210-CH","VANGUARD APPAREL — CỬA HÀNG SỐ 108 (CHICAGO MAGNIFICENT MILE)","Số 625 Đại lộ North Michigan, Chicago, IL 60611","Quầy Thu ngân POS-04 | Thu ngân: Carlos M. (Mã NV #EMP-4820)","Ngày giao dịch: Ngày 14 tháng 8 | Giờ: 14:28 CST","Mã Biên lai: #POS-EX-99210-CH","CUSTOMER TRANSACTION: OMNICHANNEL BORIS EXCHANGE","Customer Name: Chloe Bennett (Vanguard Rewards Member #VR-83921)","Original E-Commerce Order Reference: #VAN-83021 (Delivered August 9)","RETURNED MERCHANDISE:","• SKU: #FTW-TRL-75-BLK | Desc: Apex Peak Waterproof Trail Boot (Black)","• Size: US Women\u0027s 7.5 | Condition: Inspected - Unworn with tags attached","• Return Reason: Size Fit (Customer noted forefoot toe box was too narrow / snug)","• Credit Amount Credited: -$185.00","GIAO DỊCH KHÁCH HÀNG: ĐỔI HÀNG ĐA KÊNH BORIS","Tên khách hàng: Chloe Bennett (Hội viên Thân thiết Vanguard #VR-83921)","Mã Đơn hàng Thương mại Điện tử Gốc: #VAN-83021 (Giao ngày 9 tháng 8)","HÀNG HÓA GỬI TRẢ:","• Mã SKU: #FTW-TRL-75-BLK | Mô tả: Giày Leo Núi Chống Nước Apex Peak (Màu Đen)","• Kích cỡ: Nữ Mỹ Size 7.5 | Tình trạng: Đã kiểm định - Chưa qua sử dụng, còn nguyên tem mác","• Lý do Đổi trả: Độ vừa vặn kích cỡ (Khách hàng phản ánh phần mũi giày trước quá hẹp / bị chật)","• Khoản tiền Ghi có Hoàn lại: -$185.00","EXCHANGED MERCHANDISE ISSUED:","• SKU: #FTW-TRL-80-BLK | Desc: Apex Peak Waterproof Trail Boot (Black)","• Size: US Women\u0027s 8.0 | Condition: Brand-New / In-Store Floor Stock","• Unit Retail Price: $185.00","• Price Difference: $0.00","• Local Sales Tax Adjustment (10.25%): $0.00","TOTAL AMOUNT DUE / TENDERED: $0.00","Ba à nâng đỡ vững chắc mà cô cần cho các chuyến dã ngoại sắp tới! Sổ đăng ký thiết bị kỹ thuật số của cô đã được cập nhật, và gói bảo hành Bảo vệ Leo núi 1 năm đã được kích hoạt đầy đủ cho đôi giày vừa đổi.","Because Instant BORIS was recently introduced nationwide, your feedback is vital to optimizing our checkout counters and staff training. We would greatly appreciate two minutes of your time to complete our brief 4-question satisfaction survey:","[Take 2-Minute Customer Experience Survey]","As a token of our appreciation for your continuous loyalty as a Vanguard Rewards Member, upon completing the survey, an exclusive $15.00 promotional discount code will be deposited directly into your Vanguard mobile app wallet. This voucher is valid for 60 days on any apparel or gear purchase exceeding $50, either online or at any Vanguard retail location.","Thank you for choosing Vanguard Outdoor.","Warmly,","Rachel Sterling","Vice President of Omnichannel Customer Experience","Bởi vì chương trình Instant BORIS mới được triển khai trên toàn quốc gần đây, phản hồi của cô có ý nghĩa sống còn trong việc tối ưu hóa quầy thu ngân và công tác đào tạo nhân viên của chúng tôi. Chúng tôi rất trân trọng nếu cô có thể dành hai phút thời gian để hoàn thành bài khảo sát mức độ hài lòng ngắn gồm 4 câu hỏi:","[Làm Khảo sát Trải nghiệm Khách hàng 2 Phút]","Như một lời tri ân gửi đến lòng trung thành gắn bó của cô với tư cách là Hội viên Thân thiết Vanguard Rewards, sau khi hoàn thành khảo sát, một mã giảm giá khuyến mãi độc quyền trị giá 15.00 USD sẽ được nạp trực tiếp vào ví ứng dụng di động Vanguard của cô. Phiếu mua hàng này có hiệu lực trong 60 ngày đối với bất kỳ đơn mua quần áo hoặc dụng cụ nào có giá trị trên 50 USD, áp dụng mua trực tuyến hoặc tại bất kỳ cửa hàng bán lẻ Vanguard nào.","Cảm ơn cô đã lựa chọn Vanguard Outdoor.","Thân ái,","Rachel Sterling","Phó Chủ tịch Phụ trách Trải nghiệm Khách hàng Đa kênh","1.4. BẢN DỊCH CÂU HỎI \u0026 ĐÁP ÁN KHÔNG LẶP TỪNG PHƯƠNG ÁN (STREAMLINED QUESTION TRANSLATION)","196. Lợi ích nổi bật nào của chương trình Instant BORIS được nhấn mạnh trong Văn bản 1?","(A) Mức cước vận chuyển hàng không quốc tế được chiết khấu ưu đãi","(B) Khả năng đổi trả các đơn hàng mua online trực tiếp tại các cửa hàng bán lẻ vật lý mà không tốn phí gửi hàng","(C) Dịch vụ giặt khô miễn phí cho tất cả các mặt hàng quần áo gửi trả","(D) Nhân viên giao nhận của Vanguard đến tận nhà lấy hàng trả miễn phí","197. Tại sao cô Bennett lại đến cửa hàng Vanguard trên Đại lộ Michigan?","(A) Để nộp đơn ứng tuyển vị trí nhân viên bán lẻ bán thời gian","(B) Để nhận đơn hàng đặt trực tuyến đang được giữ trong tủ khóa của cửa hàng","(C) Để đổi đôi giày dã ngoại lấy cỡ lớn hơn vì đôi cũ bị chật mũi","(D) Để tham dự một hội thảo kỹ năng sinh tồn ngoài trời do quản lý cửa hàng tổ chức","198. Theo Văn bản 2, cô Bennett đã phải trả bao nhiêu tiền cho giao dịch đổi hàng?","(A) $0.00 (không mất đồng nào)","(B) $12.50","(C) $18.50","(D) $185.00","199. Ưu đãi nào được dành cho cô Bennett trong bức thư điện tử tiếp theo?","(A) Gia hạn bảo hành giày của cô thành bảo hành trọn đời","(B) Một đôi tất dã ngoại dệt bằng len merino miễn phí","(C) Mã phiếu giảm giá điện tử trị giá 15.00 USD khi hoàn thành một bài khảo sát ngắn","(D) Thư mời tham dự buổi dạ tiệc giới thiệu thiết bị cắm trại VIP độc quyền","200. Trong Văn bản 1, từ \u0027frictionless\u0027 ở đoạn 2 gần nghĩa nhất với từ nào?","(A) dễ dàng, không gặp trở ngại (effortless)","(B) nhám, mài mòn (abrasive)","(C) trơn trượt (slippery)","(D) khó lường trước (unpredictable)","1.5. TÓM TẮT BÀI ĐỌC THEO PHƯƠNG PHÁP FEYNMAN (FEYNMAN 1-PAGE SUMMARY)","FEYNMAN 1-PAGE SUMMARY (EXECUTIVE ENGLISH)","• Strategic Omnichannel Deployment: Vanguard Outdoor \u0026 Apparel launched \u0027Instant BORIS\u0027 (Buy Online, Return In-Store) across 350 retail locations, granting customers a 45-day window to return online merchandise in person without repacking, postal fees, or transit wait times, while offering direct POS exchanges and a 10% bonus on store credit conversions.","• In-Store POS Execution: Customer Chloe Bennett (Order #VAN-83021) visited the Chicago flagship store on August 14 to exchange unworn Apex Peak Trail Boots (Size 7.5, $185.00) that were too snug. Cashier Carlos processed a seamless 1-to-1 even exchange for Size 8.0 with a $0.00 balance adjustment and transferred the 1-Year Trail Protection warranty.","• Post-Transaction CRM \u0026 Incentive Loop: On August 15, Vanguard dispatched an automated CSAT follow-up survey offering a $15.00 mobile wallet voucher valid for 60 days on orders over $50, reinforcing customer loyalty and driving omnichannel repeat sales.","TÓM TẮT FEYNMAN 1 TRANG (BẢN TIẾNG VIỆT)","• Chiến lược Triển khai Bán lẻ Đa kênh: Vanguard Outdoor \u0026 Apparel ra mắt chương trình \u0027Instant BORIS\u0027 (Mua online, Đổi trả tại cửa hàng) tại 350 chi nhánh, cho phép đổi trả hàng trong 45 ngày hoàn toàn miễn phí bưu chính, không cần đóng gói lại, đồng thời hỗ trợ đổi hàng tức thì tại quầy POS và cộng thêm 10% thưởng nếu nhận tín dụng cửa hàng.","• Thực thi Thực tế tại Quầy POS: Khách hàng Chloe Bennett mang đôi giày leo núi nguyên tem mác (Size 7.5, 185.00 USD) từ đơn hàng online đến Cửa hàng Chicago vào ngày 14/8 vì bị chật mũi. Nhân viên thu ngân đã thực hiện đổi ngang 1-đối-1 sang Size 8.0 có sẵn tại quầy với chênh lệch 0 đồng và chuyển giao nguyên vẹn quyền lợi bảo hành 1 năm.","• Vòng lặp Chăm sóc CRM \u0026 Tái mua hàng: Ngày 15/8, hệ thống tự động gửi email khảo sát trải nghiệm dịch vụ CSAT kèm tặng mã voucher 15 USD nạp thẳng vào ví điện tử ứng dụng cho đơn hàng kế tiếp trên 50 USD, vừa nâng cao chỉ số hài lòng vừa kích thích doanh số mua sắm lặp lại.","PHẦN 2: BẢNG LUYỆN TRUY XUẤT CHỦ ĐỘNG ACTIVE RECALL 5 GIÂY (ACTIVE RECALL MATRIX)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["Mô hình Mua Online, Đổi trả Tại Cửa hàng (BORIS) Miễn 100% Cước Vận chuyển","Buy Online, Return In-Store (BORIS) \u0026 Zero Postal Handling Overhead"]],[["2. Boi canh \u0026 Quy trinh loi"],["Đổi Ngang Sản phẩm 1-đối-1 Tại Quầy Thu ngân POS (Chênh lệch 0 Đồng)","Direct 1-to-1 Even Exchange Completed at Point-of-Sale (Zero Balance Due)"]],[["3. Dau vet suy luan cheo"],["Đồng bộ Bảo hành Kỹ thuật số \u0026 Tặng Voucher Ví Điện tử Sau Khảo sát CSAT","Warranty Transfer Synchronization \u0026 Mobile Wallet Survey Incentive Coupon"]]],"t":"table"},"PHẦN 3: GIẢI MÃ ĐÁP ÁN, PHÂN TÍCH BẪY ETS \u0026 TRUY VẾT DỮ KIỆN (DEEP-DIVE ANSWERS \u0026 TRAP ANALYSIS)","What is highlighted as a primary benefit of the Instant BORIS program in Document 1?","Dap an dung: (B) The ability to return online purchases at physical retail locations without shipping fees","[Dau vet bai doc / Clue]: Văn bản 1, mục Key Program Features: \u0027Frictionless In-Person Returns: Customers who purchase apparel... on www.vanguardapparel.com... can now return or exchange items at any physical store within 45 days...\u0027 kết hợp: \u0027Zero Shipping Overhead: Avoid postal return label deductions entirely. Returning merchandise in person is always 100% free of handling charges.\u0027","[Dien dat tuong duong / Paraphrase]: return online items at any physical store + 100% free of handling charges ➔ The ability to return online purchases at physical retail locations without shipping fees.","[Loi giai chi tiet]: Văn bản 1 khẳng định ưu điểm hàng đầu của Instant BORIS là cho phép khách mua online mang sản phẩm ra đổi trả trực tiếp tại bất kỳ cửa hàng bán lẻ nào trong 350 chi nhánh mà không tốn một đồng phí vận chuyển bưu điện nào. Phương án (B) phản ánh hoàn toàn chính xác đặc tính này.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Discounted international air cargo shipping rates","- Ly do sai: Chương trình áp dụng cho hệ thống bán lẻ nội địa, không nói về giảm giá cước vận tải hàng không quốc tế.","- Bay ETS: International Logistics Trap (Bẫy vận tải hàng không quốc tế ngoài chủ đề)","(C) Free dry cleaning services for all returned apparel items","- Ly do sai: Hàng đổi trả phải còn nguyên tem mác chưa qua sử dụng, cửa hàng không tặng dịch vụ giặt khô miễn phí.","- Bay ETS: Fabricated Service Trap (Bẫy dịch vụ giặt là bịa đặt)","(D) Complimentary home pickup by Vanguard courier drivers","- Ly do sai: BORIS yêu cầu khách tự mang ra cửa hàng (In-Person Returns), không phải nhân viên đến tận nhà lấy hàng.","- Bay ETS: Opposite Channel Trap (Bẫy ngược kênh phân phối: đến nhà thay vì ra cửa hàng)","Why did Ms. Bennett visit the Vanguard store on Michigan Avenue?","Dap an dung: (C) To exchange hiking footwear for a larger size because the original pair was too tight","[Dau vet bai doc / Clue]: Văn bản 2, mục Return Reason: \u0027Size Fit (Customer noted forefoot toe box was too narrow / snug)\u0027 kết hợp chi tiết đổi từ SKU Size 7.5 sang SKU Size 8.0.","[Dien dat tuong duong / Paraphrase]: toe box was too snug + exchanged from Size 7.5 to Size 8.0 ➔ To exchange hiking footwear for a larger size because the original pair was too tight.","[Loi giai chi tiet]: Biên lai POS ở Văn bản 2 ghi rõ lý do trả hàng là do kích cỡ bị chật ở phần mũi chân (toe box too narrow/snug) và khách hàng thực hiện đổi đôi giày leo núi từ cỡ 7.5 lên cỡ 8.0 lớn hơn. Đáp án (C) thể hiện đúng động cơ của cô Bennett.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) To apply for a part-time retail sales associate position","- Ly do sai: Cô là khách hàng đến giao dịch đổi hàng, không phải ứng viên xin việc làm thu ngân.","- Bay ETS: Recruitment Confusion Trap (Bẫy lẫn lộn sang chủ đề tuyển dụng)","(B) To collect an online order that had been held in a store locker","- Ly do sai: Đơn hàng #VAN-83021 đã được giao tận nhà vào ngày 9/8 (Delivered August 9), cô mang hàng đến để đổi chứ không phải đến nhận hàng từ tủ locker.","- Bay ETS: BOPIS Confusion Trap (Bẫy nhầm lẫn giữa nhận hàng BOPIS và đổi hàng BORIS)","(D) To attend an outdoor survival seminar hosted by store management","- Ly do sai: Không có hội thảo kỹ năng sinh tồn nào được tổ chức vào ngày 14/8.","- Bay ETS: Event Fabrication Trap (Bẫy sự kiện dã ngoại không có thật)","According to Document 2, how much was Ms. Bennett charged for the exchange transaction?","Dap an dung: (A) $0.00","[Dau vet bai doc / Clue]: Văn bản 2, phần tổng kết giao dịch: \u0027Price Difference: $0.00 | Local Sales Tax Adjustment (10.25%): $0.00 | TOTAL AMOUNT DUE / TENDERED: $0.00 | Balance Settled: Direct 1-to-1 Even Exchange Completed at POS.\u0027","[Dien dat tuong duong / Paraphrase]: TOTAL AMOUNT DUE: $0.00 ➔ $0.00.","[Loi giai chi tiet]: Biên lai thu ngân thể hiện rõ đây là giao dịch đổi ngang 1-đối-1 cùng một dòng sản phẩm chỉ khác kích cỡ, giá tiền hai đôi bằng nhau ($185.00), nên số tiền khách hàng phải trả thêm là $0.00. Phương án (A) là đáp án chuẩn xác.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(B) $12.50","- Ly do sai: $12.50 là khoản phí nhãn vận chuyển bưu điện nếu gửi qua đường bưu cục (đã được miễn hoàn toàn khi đến cửa hàng).","- Bay ETS: Postal Fee Distractor Trap (Bẫy mức phí bưu điện tiêu chuẩn)","(C) $18.50","- Ly do sai: $18.50 là con số gây nhiễu lấy từ 10% của $185.","- Bay ETS: Percentage Calculation Trap (Bẫy tính toán 10% gây nhiễu)","(D) $185.00","- Ly do sai: $185.00 là giá bán lẻ ban đầu của đôi giày, không phải số tiền phải trả thêm khi đổi.","- Bay ETS: Original Retail Price Trap (Bẫy lấy giá gốc làm số tiền thanh toán thêm)","What incentive is offered to Ms. Bennett in the follow-up email?","Dap an dung: (C) A $15.00 digital discount voucher for completing a brief survey","[Dau vet bai doc / Clue]: Văn bản 3: \u0027upon completing the survey, an exclusive $15.00 promotional discount code will be deposited directly into your Vanguard mobile app wallet.\u0027","[Dien dat tuong duong / Paraphrase]: $15.00 promotional discount code upon completing survey ➔ A $15.00 digital discount voucher for completing a brief survey.","[Loi giai chi tiet]: Email ở Văn bản 3 gửi lời cảm ơn và đề nghị cô Bennett làm bài khảo sát 4 câu hỏi trong 2 phút; đổi lại, cô sẽ nhận được một mã giảm giá $15.00 nạp vào ví điện tử trên ứng dụng di động Vanguard. Đáp án (C) hoàn toàn trùng khớp.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) An extension of her footwear warranty to a lifetime guarantee","- Ly do sai: Gói bảo hành của cô là 1 năm (1-Year Protection), không được nâng cấp thành bảo hành trọn đời.","- Bay ETS: Exaggerated Guarantee Trap (Bẫy phóng đại chế độ bảo hành trọn đời)","(B) A complimentary pair of merino wool hiking socks","- Ly do sai: Bài không tặng tất leo núi miễn phí.","- Bay ETS: Physical Gift Trap (Bẫy quà tặng hiện vật không tồn tại)","(D) An invitation to an exclusive VIP camping equipment gala","- Ly do sai: Không có dạ tiệc cắm trại VIP nào được đề cập.","- Bay ETS: VIP Event Trap (Bẫy sự kiện dạ tiệc sang trọng)","In Document 1, the word \u0027frictionless\u0027 in paragraph 2 is closest in meaning to","Dap an dung: (A) effortless","[Dau vet bai doc / Clue]: Văn bản 1, mục Key Program Features: \u0027Frictionless In-Person Returns: Customers who purchase apparel... can now return or exchange items at any physical store within 45 days...\u0027","[Dien dat tuong duong / Paraphrase]: frictionless (trơn tru, không gặp rào cản, dễ dàng không ma sát) = effortless / smooth / hassle-free.","[Loi giai chi tiet]: Trong bối cảnh trải nghiệm khách hàng và dịch vụ bán lẻ đa kênh, thuật ngữ \u0027frictionless\u0027 được dùng với nghĩa bóng chỉ quy trình diễn ra trơn tru, dễ dàng, không gây phiền hà hay tốn nhiều công sức cho khách hàng. Từ đồng nghĩa chính xác nhất là \u0027effortless\u0027 (dễ dàng, không tốn sức).","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(B) abrasive","- Ly do sai: \u0027abrasive\u0027 có nghĩa là mài mòn, thô ráp, hoàn toàn trái ngược với ý nghĩa thuận lợi.","- Bay ETS: Opposite Texture Trap (Bẫy tính chất thô ráp đối lập)","(C) slippery","- Ly do sai: \u0027slippery\u0027 có nghĩa đen là trơn trượt về mặt vật lý, không thể hiện quy trình dịch vụ thuận tiện.","- Bay ETS: Literal Physical Trap (Bẫy nghĩa đen vật lý trơn trượt)","(D) unpredictable","- Ly do sai: \u0027unpredictable\u0027 có nghĩa là khó đoán định, mang sắc thái tiêu cực trong trải nghiệm dịch vụ.","- Bay ETS: Negative Trait Trap (Bẫy tính từ tiêu cực sai ngữ cảnh)","4.1. BẢN ĐỒ TIẾN TRÌNH ĐỔI HÀNG ĐA KÊNH BORIS \u0026 ĐỒNG BỘ DỮ LIỆU TỨC THÌ (OMNICHANNEL BORIS WORKFLOW)","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","MUA HÀNG TRỰC TUYẾN \u0026 PHÁT HIỆN LỆCH SIZE KHI THỬ ĐỒ TẠI NHÀ"],[],["BƯỚC 2","QUÉT MÃ VẠCH TẠI QUẦY POS CỬA HÀNG \u0026 THỰC HIỆN ĐỔI SIZE NGANG GIÁ"],[],["BƯỚC 3","ĐỒNG BỘ DỮ LIỆU TỒN KHO ERP, KHẢO SÁT CSAT \u0026 TẶNG VOUCHER VÍ APP"]],[["• Chung tu \u0026 Kenh: Trang Web / App Bán Lẻ \u0026 Giao Nhận Bưu Kiện Tận Nhà","• Nghiep vu thuc thi: Khách hàng đặt giày leo núi Size 7.5 trên App Vanguard ➔ Nhận hàng ngày 9/8 ➔ Thử đồ thấy mũi giày bị chật ➔ Mở App lấy mã vạch đơn hàng điện tử mà không cần in ấn hóa đơn giấy.","• Ket qua \u0026 Kiem soat: Khách hàng sẵn sàng mang giày ra cửa hàng vật lý để thực hiện BORIS."],["➔"],["• Chung tu \u0026 Kenh: Quầy Chăm Sóc Khách Hàng Tại Cửa Hàng Vật Lý \u0026 Hệ Thống POS Đa Kênh","• Nghiep vu thuc thi: Thu ngân Carlos quét mã vạch trên điện thoại ➔ Kiểm tra giày mới nguyên tem ➔ Lấy Size 8.0 từ kệ trưng bày ➔ Hệ thống POS tự động cấn trừ -$185 và +$185 (chênh lệch $0.00) ➔ Chuyển giao dữ liệu bảo hành.","• Ket qua \u0026 Kiem soat: Khách hàng nhận ngay đôi giày vừa vặn trong chưa đầy 3 phút mà không tốn cước phí."],["➔"],["• Chung tu \u0026 Kenh: Hệ Thống Đám Mây ERP / CRM \u0026 Công Cụ Tự Động Hóa Trải Nghiệm Khách Hàng","• Nghiep vu thuc thi: Hệ thống POS đẩy dữ liệu cập nhật tồn kho về kho Chicago ➔ Kích hoạt email khảo sát trải nghiệm CSAT ➔ Khách hàng trả lời 4 câu hỏi ➔ Tự động nạp voucher 15 USD vào ví điện tử trên App.","• Ket qua \u0026 Kiem soat: Biến một tình huống đổi hàng do sai size thành cơ hội nâng cao tỷ lệ khách hàng trung thành."]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["PHASE 1","ONLINE PURCHASE \u0026 IN-HOME SIZE FIT DISCREPANCY"],[],["PHASE 2","IN-STORE POS BARCODE SCAN \u0026 ZERO-BALANCE EVEN EXCHANGE"],[],["PHASE 3","ERP INVENTORY RECONCILIATION, CSAT LOOP \u0026 APP WALLET REWARD"]],[["• Documents \u0026 Channels: E-Commerce Mobile App \u0026 Residential Carrier Delivery","• Core Business Execution: Customer orders Trail Boots (Size 7.5) via mobile app ➔ Receives parcel on August 9 ➔ Identifies snug toe box ➔ Pulls up in-app order barcode without printing physical paper slips.","• Key Deliverable \u0026 Control: Customer is fully prepped to utilize seamless in-store BORIS return."],["➔"],["• Documents \u0026 Channels: Flagship Store Customer Service Counter \u0026 Omnichannel POS Terminal","• Core Business Execution: Associate Carlos scans in-app barcode ➔ Audits unworn condition with tags ➔ Pulls Size 8.0 from floor stock ➔ POS offsets -$185 and +$185 ($0 balance due) ➔ Transfers serial warranty.","• Key Deliverable \u0026 Control: Customer walks away with properly fitting footwear in under 3 minutes with zero fees."],["➔"],["• Documents \u0026 Channels: Cloud ERP Omnichannel Engine \u0026 Automated Customer Engagement CRM","• Core Business Execution: POS pushes real-time inventory increment to Chicago store ledger ➔ Triggers post-visit CSAT survey email ➔ Completes 4-question survey ➔ Auto-deposits $15 voucher into app wallet.","• Key Deliverable \u0026 Control: Transforms potential product dissatisfaction into high retention and repeat purchasing."]]],"t":"table"},"4.2. GÓC NHÌN NGHIỆP VỤ FEYNMAN (FEYNMAN MULTI-PERSPECTIVE ANALYSIS)","• Bức tranh Toàn cảnh Nghiệp vụ (End-to-End Business Flow): Mô hình BORIS (Buy Online, Return In-Store) là vũ khí chiến lược tối thượng của các nhà bán lẻ đa kênh (Omnichannel Retailers) trước các đối thủ thuần thương mại điện tử (Pure-Play E-Commerce). Khi khách hàng trả hàng qua đường bưu điện, nhà bán lẻ mất chi phí vận chuyển ngược (Reverse Shipping Cost: $5-$15), mất thời gian lưu chuyển 7-10 ngày và có nguy cơ mất khách vĩnh viễn vì trải nghiệm phiền toái. Ngược lại, khi kéo khách hàng đến cửa hàng vật lý thông qua BORIS: Khách đổi được ngay sản phẩm vừa vặn (Instant Gratification), tỷ lệ khách tiện tay mua thêm một món đồ khác tại cửa hàng (In-Store Upsell) lên tới 35-40%, và chi phí logistics thu hồi giảm xuống gần bằng 0.","• Lăng kính Viễn thông / CNTT Viettel: Tại Viettel Store và Trung tâm Kênh Số Viettel, tính năng tích hợp đa kênh O2O (Online-to-Offline) được triển khai triệt để. Khách hàng đặt mua phụ kiện thông minh (Smartwatch, Tai nghe Bluetooth) trên trang web viettelstore.vn hoặc qua ứng dụng My Viettel, nếu về đeo thử thấy không ưng màu sắc hoặc kích cỡ dây, hoàn toàn có thể mang trực tiếp ra bất kỳ siêu thị Viettel Store nào gần nhà. Nhân viên siêu thị chỉ cần quét mã QR trên ứng dụng mBCCS/POS là có thể đổi ngay màu khác hoặc nâng cấp lên dòng sản phẩm cao hơn chỉ trong 2 phút, giúp khách hàng luôn an tâm mua sắm trên nền tảng số của Viettel.","• Lăng kính Trường Mầm non Ước Mơ Xanh \u0026 Giáo dục Mầm non: Đầu năm học mới, khi phụ huynh đăng ký mua set đồng phục thể dục mầm non cho con qua nhóm Zalo hoặc ứng dụng nhà trường, khi đem về bé mặc thử bị chật nách hoặc ngắn đũng quần. Sáng hôm sau khi đưa bé đến lớp, phụ huynh mang trả lại cô giáo chủ nhiệm tại cửa lớp. Cô giáo kiểm tra đồng phục còn nguyên tem và đổi ngay set đồng phục lớn hơn 1 size từ tủ đồ dự phòng của lớp cho bé mà phụ huynh không phải trả thêm bất kỳ khoản phí nào, tạo nên sự thuận tiện và gắn kết mật thiết giữa phụ huynh và nhà trường.","• Lăng kính Trực quan Hóa cho Bé Hà Ngân (5 tuổi): Con hãy tưởng tượng mẹ mua tặng con một đôi giày búp bê màu hồng siêu đẹp qua điện thoại, nhưng khi xỏ chân vào con thấy ngón chân bị đau vì giày hơi chật một tí xíu! Mẹ không cần phải gói giày vào hộp gửi đi xa đâu nhé. Mẹ chỉ cần nắm tay con dẫn đến cửa hàng giày rực rỡ ở góc phố. Chú bán hàng vui tính sẽ quét một tiếng \u0027Tít\u0027 trên chiếc điện thoại của mẹ, rồi cúi xuống lấy một đôi giày y hệt nhưng rộng rãi, êm ái hơn để con xỏ chân vào nhảy múa tung tăng ngay lập tức!","4.3. PHÂN TÍCH CHUYÊN SÂU DÀNH CHO BUSINESS ANALYST (BA PERSPECTIVE)","• Omnichannel POS Real-Time Inventory \u0026 Cross-Channel Order Ingestion: Business Analysts architecting BORIS capabilities must integrate Point-of-Sale (POS) systems directly with central E-Commerce Order Management Systems (OMS) via low-latency REST/GraphQL APIs. When an in-app barcode is scanned at the physical checkout counter, the POS must execute a dynamic order lookup, validate purchase timestamps within the 45-day return threshold, and display real-time local store stock for identical SKUs with different sizing attributes. The system must process an \u0027Even Exchange Transaction\u0027 that simultaneously increments the local return bin inventory while decrementing floor stock without altering financial accounting balances ($0.00 tender).","• Serialized Warranty Portability \u0026 Omnichannel CSAT Closed-Loop Marketing: From an enterprise systems standpoint, BA requirements must ensure asset serialization and warranty data integrity across physical and digital channels. When a serialized product (e.g., trail footwear with registered warranty chips or electronics) is exchanged, the ERP must trigger an asynchronous warranty re-assignment, transferring the remaining balance of the 1-Year Manufacturer Protection policy to the newly issued serial number. Concurrently, an event webhook dispatches the post-transaction survey trigger to the CRM marketing automation engine, depositing single-use coupon tokens into the customer\u0027s mobile wallet to maximize Customer Lifetime Value (LTV).","PHẦN 5: TỪ VỰNG CHUYÊN SÂU \u0026 BẢNG ÔN TẬP ĐỊNH KỲ ANKI (VOCABULARY \u0026 SPACED REPETITION)","BORIS (Buy Online, Return In-Store)  /ˈbɔːrɪs/  In-Store Online Return / Cross-Channel Store Return / O2O Return Integration","Nghia: Mua hàng trực tuyến, đổi trả tại cửa hàng; giải pháp bán lẻ đa kênh cho phép người tiêu dùng mua hàng qua mạng nhưng có thể đem trả hoặc đổi trực tiếp tại các cửa hàng vật lý.","Vd: Implementing BORIS drastically lowered shipping expenses and generated additional in-store foot traffic. - Việc triển khai mô hình BORIS đã giúp giảm đáng kể chi phí vận chuyển đồng thời thu hút thêm lượng khách ghé thăm cửa hàng vật lý.","Frictionless  /ˈfrɪkʃənləs/  Effortless / Seamless / Hassle-Free / Smooth / Unimpeded","Nghia: Trơn tru, dễ dàng, không gặp trở ngại; quy trình vận hành dịch vụ thuận tiện tối đa, loại bỏ hoàn toàn các phiền toái hoặc rào cản đối với khách hàng.","Vd: The retailer designed a frictionless exchange process where customers swap sizes in under three minutes. - Nhà bán lẻ đã thiết kế một quy trình đổi hàng trơn tru dễ dàng, nơi khách hàng có thể đổi cỡ trong chưa đầy ba phút.","Even Exchange  /ˈiːvən ɪksˈtʃeɪndʒ/  One-to-One Product Swap / Zero-Balance Exchange / Direct Value-Neutral Replacement","Nghia: Đổi ngang giá, đổi sản phẩm cùng giá trị; việc đổi một sản phẩm lấy sản phẩm cùng loại khác size hoặc khác màu mà không phát sinh thêm bất kỳ khoản chênh lệch tiền nào.","Vd: The cashier completed an even exchange for the customer who needed a larger shoe size with zero additional payment. - Thu ngân đã hoàn tất giao dịch đổi ngang giá cho vị khách cần cỡ giày lớn hơn mà không phải thanh toán thêm bất kỳ đồng nào.","Store Credit  /stɔːr ˈkredɪt/  Merchant Credit Voucher / In-Store Purchasing Allowance / Customer Account Balance","Nghia: Tín dụng cửa hàng; số dư tiền điện tử hoặc phiếu quà tặng do nhà bán lẻ cấp cho khách hàng dùng để mua sắm hàng hóa tại hệ thống của họ.","Vd: Customers opting for store credit rather than a card refund enjoyed an extra ten percent bonus allowance. - Những khách hàng chọn nhận tín dụng cửa hàng thay vì hoàn tiền về thẻ đã được hưởng thêm khoản phụ cấp thưởng mười phần trăm.","Foot Traffic  /fʊt ˈtræfɪk/  In-Store Shopper Volume / Store Patronage / Walk-in Customer Volume","Nghia: Lượng khách ghé thăm cửa hàng; số lượng người tiêu dùng đi bộ trực tiếp bước chân vào không gian mua sắm của một cửa hàng bán lẻ vật lý.","Vd: The in-store return policy proved highly effective at driving valuable foot traffic into brick-and-mortar outlets. - Chính sách đổi trả trực tiếp tại cửa hàng đã chứng minh tính hiệu quả vượt trội trong việc thúc đẩy lượng khách ghé thăm các điểm bán truyền thống.","Customer Lifetime Value (LTV)  /ˈkʌstəmər ˈlaɪftaɪm ˈvæljuː/  Customer Lifetime Equity / Long-Term Account Worth / Cumulative Customer Profitability","Nghia: Giá trị vòng đời khách hàng (LTV); tổng giá trị lợi nhuận mà một khách hàng mang lại cho doanh nghiệp trong toàn bộ mối quan hệ gắn bó lâu dài.","Vd: Offering quick resolution and post-exchange discount vouchers directly boosts customer lifetime value. - Cung cấp phương án giải quyết nhanh chóng và các phiếu giảm giá sau khi đổi hàng giúp gia tăng trực tiếp giá trị vòng đời của khách hàng.","==================================================================================================","BÀI 5: SỰ CỐ VẬN CHUYỂN NGOẠI LỆ, HÀNG VỠ HỎNG TRÊN ĐƯỜNG GIAO \u0026 QUY TRÌNH BẢO HIỂM BỒI HOÀN HỎA TỐC (CARRIER TRANSIT EXCEPTION, IN-TRANSIT DAMAGE CLAIMS \u0026 EXPEDITED RESHIPMENT GUARANTEE)","ETS TOEIC Part 7 - Double Passage (Test 1, Questions 181 - 185)","PHẦN 1: BÀI ĐỌC HIỂU GỐC ETS \u0026 HƯỚNG DẪN CHIẾN THUẬT (5-MINUTE STRATEGY GUIDE)","1.1. BÀI ĐỌC HIỂU GỐC \u0026 CÂU HỎI THEO BỘ ĐỀ ETS (ORIGINAL PASSAGES \u0026 QUESTIONS)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","COURIER SHIPMENT TRACKING \u0026 EXCEPTION LOG (DOCUMENT 1 OF 2)","VELOCITY EXPRESS LOGISTICS — PACKAGE TELEMETRY AUDIT","Waybill Tracking Number: #VX-9082-1048-US","Service Tier: Standard Ground Freight Insured","Shipper: Artisanal Porcelain \u0026 Glassware Direct (Portland, OR)","Consignee: Dr. Raymond Sterling (Denver, CO)","Declared Value: $280.00 USD | Contents: Handcrafted Scandinavian Crystal Decanter \u0026 Tumbler Set","Tracking Milestone History:","• Sept 18, 09:15 AM — Origin Facility Scan: Parcel inducted at Portland Regional Hub (Carton intact).","• Sept 19, 06:40 PM — In-Transit Transit Point: Departed Salt Lake City Sorting Terminal.","• Sept 20, 04:12 AM — Destination Terminal Scan: Arrived at Denver Automated Sorting Depot.","• Sept 20, 04:38 AM — STATUS EXCEPTION DETECTED: Automated sorting conveyor optical sensors identified structural collapse of exterior shipping carton. Secondary physical audit confirmed external wall crushed under adjacent heavy cargo. Audible sounds of shattered glassware detected inside packaging. Scheduled courier delivery to consignee permanently ABORTED to prevent injury.","• Sept 20, 05:00 AM — Status: Routed to Regional Claims \u0026 Hazardous Reclamation Center. Electronic incident notification dispatched to merchant host system.","PROACTIVE CUSTOMER RESOLUTION EMAIL (DOCUMENT 2 OF 2)","ARTISANAL PORCELAIN \u0026 GLASSWARE DIRECT","TO: Dr. Raymond Sterling \u003cr.sterling@denverhealth.edu\u003e","FROM: Beatrice Holloway, Director of Client Resolutions \u003cresolutions@artisanalglass.com\u003e","DATE: September 20 (07:30 AM)","SUBJECT: Immediate Resolution: Urgent Update Regarding Order #AG-74920 (Waybill #VX-9082-1048-US)","Dear Dr. Sterling,","We are contacting you proactively this morning regarding your order of our Handcrafted Scandinavian Crystal Decanter Set (#AG-74920), which was scheduled for home delivery in Denver this afternoon.","At 4:38 AM today, our operations center received an automated electronic casualty alert from Velocity Express. During mechanical sorting at their Denver depot, your parcel suffered catastrophic transit damage caused by an external freight collapse, and the crystal decanter inside was shattered. Rather than subjecting you to an unpleasant delivery experience or requiring you to initiate a claims dispute, our merchant policy dictates that we resolve this immediately on your behalf.","Because we understand this glassware set was selected for a special occasion, we have already set aside an identical, premium-inspected decanter set from our private artisan reserve and wish to offer you the following two immediate resolutions:","1. Complimentary Priority Overnight Reshipment: We will pack your replacement set immediately using our heavy-duty triple-layer air-cushioned shock packaging and dispatch it via FedEx Priority Overnight at our expense for guaranteed delivery by 10:30 AM tomorrow, September 21. Additionally, we will deposit a $30.00 digital gift card into your account to compensate for your stress.","2. Instant 100% Full Refund: If your timeline no longer permits receipt of the glassware, simply reply to this email, and our accounting team will execute a full refund of $308.00 ($280.00 purchase price + $28.00 sales tax and postage) back to your American Express card within two hours.","Please reply with your preferred option at your earliest convenience so our packaging artisans can prepare your shipment.","With our sincere apologies,","Beatrice Holloway","Director of Client Resolutions \u0026 Logistics Assurance","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","181. According to Document 1, why was the scheduled delivery to Dr. Sterling aborted?","(A) The recipient\u0027s residential address could not be verified by the driver","(B) Severe weather conditions caused a temporary closure of all Denver roads","(C) The shipping carton collapsed and shattered glass was detected inside","(D) The package was accidentally placed on an outbound international flight","182. From what location was the original parcel shipped?","(A) Portland, Oregon","(B) Salt Lake City, Utah","(C) Denver, Colorado","(D) Seattle, Washington","183. What is indicated about Ms. Holloway in Document 2?","(A) She personally inspected the broken glassware at the Denver depot","(B) She proact
