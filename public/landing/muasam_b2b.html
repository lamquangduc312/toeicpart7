chậm giao 10 máy theo dõi đến 20/7 do thiếu chip; bệnh viện đồng ý dời ngày và yêu cầu tu chỉnh gia hạn L/C ngân hàng đến 5/8 với chi phí do BioMed chi trả.","Bước 2 (20 giây) - Quét nhanh 5 câu hỏi \u0026 Phân loại (Chỉ đọc câu hỏi, KHÔNG đọc 4 đáp án A, B, C, D): • Nguyên tắc đọc Bước 2 (3-4 giây/câu): Lướt nhanh cả 5 câu hỏi trước để gắn \u00275 móc từ khóa\u0027 vào bộ nhớ tạm rồi mới giải cuốn chiếu; TUYỆT ĐỐI CHỈ ĐỌC CÂU HỎI, KHÔNG ĐỌC 4 ĐÁP ÁN (A, B, C, D) để tránh nhiễu 15 phương án bẫy:","Bước 1 — Đọc lướt câu hỏi (60 giây): Đọc nhanh 5 câu (181-185). Câu 181 hỏi mục đích email (Văn bản 1); Câu 182 hỏi từ vựng đồng nghĩa \u0027accommodate\u0027 trong ngữ cảnh (Văn bản 1); Câu 183 hỏi mã hàng nào sẽ cập cảng muộn nhất (Kết nối bảng dữ liệu Văn bản 1 + lịch tàu trong Văn bản 2); Câu 184 hỏi chứng từ nào Crestview phải sửa đổi ở ngân hàng (Văn bản 2); Câu 185 hỏi khách hàng được hưởng quyền lợi bù đắp gì cho sự chậm trễ (Văn bản 1 \u0026 2).","Bước 3 (3 phút 45 giây) - Cách trả lời \u0026 Dấu hiệu tìm nhanh nhất cho đủ 5 câu hỏi (Giải cuốn chiếu \u0026 Chốt đáp án từng câu): Bước 2 — Đọc Văn bản 1 (90 giây): Quét email thông báo trạng thái đơn hàng từ BioMed Instruments gửi phòng mua sắm Crestview Diagnostics. Chú ý bảng 4 mặt hàng: 3 mặt hàng có sẵn (\u0027In Stock - Ready to Ship May 10\u0027), riêng máy ly tâm lạnh \u0027CryoSpin 4000 (Item #BM-409)\u0027 bị thiếu linh kiện cảm biến nên lùi lịch giao sang \u0027June 18 (Backordered)\u0027. Đọc kỹ đề xuất giao hàng làm 2 đợt (Partial Shipment) và miễn phí cước vận chuyển nhanh đường hàng không cho lô hàng giao sau.","Bước 3 — Đọc Văn bản 2 (90 giây): Quét email phản hồi của Giám đốc Mua sắm Crestview. Lưu ý điều khoản Tín dụng thư không hủy ngang (\u0027Irrevocable Letter of Credit #LC-88219\u0027) hiện đang cấm giao hàng từng phần (\u0027Partial shipments prohibited\u0027). Do đó, Crestview đồng ý yêu cầu ngân hàng phát hành sửa đổi L/C (\u0027L/C Amendment\u0027) cho phép giao 2 đợt, đồng thời chọn nâng cấp miễn phí gói bảo hành mở rộng 2 năm cho máy CryoSpin 4000.","Bước 4 (25 giây cuối giờ thi + Củng cố sau giờ thi) - Kiểm tra khóa đáp án \u0026 Đúc kết Feynman 1 câu: Bước 4 — Đối chiếu \u0026 Khoanh đáp án (60 giây): Khớp mã hàng #BM-409 với lịch giao ngày 18/6 và điều kiện sửa đổi L/C để chọn đáp án chính xác 100%.","1.3. Dịch Song ngữ Xen kẽ Từng Câu (Sentence-by-Sentence Translation)","[Văn bản 1: Email — Thông báo Trạng thái Đơn hàng \u0026 Hàng giao chậm (Backorder)]","To: d.kaufman@crestviewdiagnostics.com","From: orders@biomed-instruments.com","Date: May 6","Subject: Purchase Order #CV-7740 — Fulfillment Update","Tới: d.kaufman@crestviewdiagnostics.com","Từ: orders@biomed-instruments.com","Ngày: 06 tháng 5","Chủ đề: Đơn đặt hàng #CV-7740 — Cập nhật Tiến độ Thực hiện Đơn hàng","Dear Mr. Kaufman,","Thank you for placing Purchase Order #CV-7740 with BioMed Instruments for your new clinical laboratory facility in Boston. While preparing your consignment for dispatch, our warehouse system flagged a supply chain delay affecting one of the four equipment models on your order.","Kính gửi ông Kaufman,","Cảm ơn ông đã đặt Đơn hàng #CV-7740 với BioMed Instruments cho cơ sở phòng xét nghiệm lâm sàng mới của quý vị tại Boston. Trong khi chuẩn bị lô hàng của quý vị để xuất kho, hệ thống kho vận của chúng tôi đã cảnh báo một sự chậm trễ chuỗi cung ứng ảnh hưởng đến một trong bốn mẫu thiết bị trong đơn hàng của ông.","Below is the current availability breakdown for your items:","• Automated Hematology Analyzer (Item #BM-102) — Qty: 2 — Status: In Stock (Ships May 10)","• Digital PCR Thermal Cycler (Item #BM-215) — Qty: 4 — Status: In Stock (Ships May 10)","• Refrigerated Micro-Centrifuge CryoSpin 4000 (Item #BM-409) — Qty: 3 — Status: Backordered (Estimated Dispatch: June 18)","• Laminar Flow Biosafety Cabinet (Item #BM-510) — Qty: 2 — Status: In Stock (Ships May 10)","Dưới đây là chi tiết tình trạng sẵn có hiện tại của các mặt hàng:","• Máy Phân tích Huyết học Tự động (Mã #BM-102) — SL: 2 — Trạng thái: Sẵn hàng (Giao ngày 10/5)","• Máy Luân nhiệt PCR Kỹ thuật số (Mã #BM-215) — SL: 4 — Trạng thái: Sẵn hàng (Giao ngày 10/5)","• Máy Ly tâm Vi lượng Làm lạnh CryoSpin 4000 (Mã #BM-409) — SL: 3 — Trạng thái: Nợ hàng/Giao chậm (Dự kiến xuất kho: 18/6)","• Tủ An toàn Sinh học Dòng chảy Tầng (Mã #BM-510) — SL: 2 — Trạng thái: Sẵn hàng (Giao ngày 10/5)","Because your Letter of Credit (#LC-88219, issued by Atlantic Commerce Bank) currently stipulates a single consolidated shipment no later than May 25, holding the entire order until June 18 would delay the opening of your Boston laboratory. To accommodate your facility launch schedule, we propose splitting PO #CV-7740 into two shipments: dispatching the three available models on May 10, and air-freighting the three CryoSpin 4000 units on June 18 at no additional shipping charge.","Bởi vì Tín dụng thư của quý vị (#LC-88219, phát hành bởi Ngân hàng Thương mại Atlantic) hiện quy định chỉ giao hàng gộp một lần duy nhất muộn nhất vào ngày 25/5, nên việc giữ lại toàn bộ đơn hàng cho đến ngày 18/6 sẽ làm trì hoãn lễ khai trương phòng xét nghiệm tại Boston của quý vị. Để đáp ứng (phù hợp với) lịch trình ra mắt cơ sở của quý vị, chúng tôi đề xuất tách PO #CV-7740 thành hai đợt giao hàng: xuất kho ba mẫu thiết bị có sẵn vào ngày 10/5, và vận chuyển hàng không ba chiếc máy CryoSpin 4000 vào ngày 18/6 mà không tính thêm phí vận chuyển.","Additionally, as a gesture of goodwill for the backorder inconvenience, we would like to offer you a choice between a 5 percent price reduction on the backordered #BM-409 units or a complimentary two-year extended calibration warranty on those three machines.","Please let us know how you wish to proceed so our trade finance team can coordinate the shipping documentation.","Sincerely,","Elena Rostova, Export Fulfillment Manager, BioMed Instruments","Ngoài ra, như một cử chỉ thiện chí bù đắp cho sự bất tiện do chậm hàng, chúng tôi muốn dành tặng quý vị quyền lựa chọn giữa mức giảm giá 5% trên các máy #BM-409 bị giao chậm hoặc gói bảo hành hiệu chuẩn mở rộng 2 năm miễn phí cho ba cỗ máy đó.","Vui lòng cho chúng tôi biết quý vị muốn tiến hành như thế nào để đội ngũ tài trợ thương mại của chúng tôi có thể phối hợp chuẩn bị bộ chứng từ vận chuyển.","Trân trọng,","Elena Rostova, Quản lý Thực hiện Đơn hàng Xuất khẩu, BioMed Instruments","[Văn bản 2: Email — Phản hồi của Người mua \u0026 Xác nhận Tu chỉnh Tín dụng thư L/C]","To: orders@biomed-instruments.com","From: d.kaufman@crestviewdiagnostics.com","Date: May 7","Subject: RE: Purchase Order #CV-7740 — Fulfillment Update","Tới: orders@biomed-instruments.com","Từ: d.kaufman@crestviewdiagnostics.com","Ngày: 07 tháng 5","Chủ đề: Trả lời: Đơn đặt hàng #CV-7740 — Cập nhật Tiến độ Thực hiện Đơn hàng","Dear Ms. Rostova,","Thank you for the prompt notification regarding Purchase Order #CV-7740. Our laboratory accrediting board is scheduled to inspect our hematology and PCR stations on May 22, so we definitely cannot afford to hold the entire shipment until mid-June.","Kính gửi bà Rostova,","Cảm ơn bà vì thông báo kịp thời liên quan đến Đơn đặt hàng #CV-7740. Hội đồng kiểm định phòng xét nghiệm của chúng tôi đã lên lịch kiểm tra các trạm huyết học và PCR vào ngày 22/5, vì vậy chúng tôi hoàn toàn không thể để lùi toàn bộ lô hàng đến tận giữa tháng 6.","We accept your proposal to split the order. Earlier this morning, I instructed our corporate treasury department to file an official request with Atlantic Commerce Bank to amend Letter of Credit #LC-88219. Specifically, the amendment authorizes partial shipments and extends the final latest-date-of-shipment deadline for the second tranche to June 25. You should receive the swift MT707 amendment advice from the bank by tomorrow afternoon.","Chúng tôi chấp nhận đề xuất tách đơn hàng của bà. Sáng sớm hôm nay, tôi đã chỉ đạo bộ phận ngân quỹ doanh nghiệp nộp yêu cầu chính thức lên Ngân hàng Thương mại Atlantic để tu chỉnh (sửa đổi) Tín dụng thư #LC-88219. Cụ thể, bản tu chỉnh cho phép giao hàng từng phần (partial shipments) và gia hạn thời hạn giao hàng muộn nhất cuối cùng cho đợt thứ hai đến ngày 25/6. Quý vị sẽ nhận được bức điện thông báo tu chỉnh SWIFT MT707 từ ngân hàng trước chiều mai.","Regarding your goodwill offer for the delayed units, rather than taking the 5 percent invoice discount, we would prefer to accept the extended calibration coverage, as ongoing maintenance certainty is a top priority for our clinical operations team.","Please proceed with booking the May 10 ocean freight for the three in-stock items as soon as the bank amendment clears.","Best regards,","David Kaufman, Director of Laboratory Procurement, Crestview Diagnostics","Về ưu đãi thiện chí của bà cho các thiết bị giao chậm, thay vì nhận mức chiết khấu hóa đơn 5%, chúng tôi muốn nhận gói bảo hành hiệu chuẩn mở rộng hơn, vì sự đảm bảo chắc chắn về bảo trì định kỳ là ưu tiên hàng đầu đối với đội ngũ vận hành lâm sàng của chúng tôi.","Vui lòng tiến hành đặt chỗ tàu biển ngày 10/5 cho ba mặt hàng có sẵn ngay khi bản tu chỉnh ngân hàng được thông qua.","Trân trọng,","David Kaufman, Giám đốc Mua sắm Phòng xét nghiệm, Crestview Diagnostics","1.4. Dịch chi tiết Câu hỏi \u0026 Phương án Trắc nghiệm","Câu 181. Tại sao bà Rostova lại gửi email vào ngày 06 tháng 5?","(A) Để yêu cầu khoản tiền đặt cọc mặt ứng trước trước khi sản xuất thiết bị phòng thí nghiệm đặt riêng","(B) Để thông báo cho khách hàng rằng một phần đơn hàng bị chậm trễ và đề xuất giải pháp giao hàng tách đợt","(C) Để thông báo ngừng sản xuất mẫu máy ly tâm CryoSpin 4000","(D) Để thông báo cho Crestview Diagnostics rằng Tín dụng thư của họ đã bị ngân hàng từ chối","Câu 182. Trong email đầu tiên, đoạn 3, dòng 4, từ \u0027accommodate\u0027 gần nghĩa nhất với từ nào?","(A) cho trọ / cung cấp chỗ ở (lodge)","(B) đáp ứng / phù hợp với (fit in with)","(C) đính kèm / bao quanh (enclose)","(D) cho vay (lend to)","Câu 183. Mặt hàng nào sẽ được giao cho Crestview Diagnostics vào tháng 6?","(A) Mã hàng #BM-102","(B) Mã hàng #BM-215","(C) Mã hàng #BM-409","(D) Mã hàng #BM-510","Câu 184. Ông Kaufman đã yêu cầu Ngân hàng Thương mại Atlantic làm gì?","(A) Tăng tổng giá trị tiền tệ của Tín dụng thư #LC-88219","(B) Phát hành thư bảo lãnh thực hiện hợp đồng dự phòng thay mặt cho BioMed Instruments","(C) Sửa đổi các điều khoản của Tín dụng thư để cho phép giao hàng từng phần và lùi ngày giao hàng cuối cùng muộn hơn","(D) Chuyển khoản ngay khoản phí phạt 5% từ tài khoản của BioMed Instruments","Câu 185. Crestview Diagnostics sẽ nhận được khoản đền bù nào cho các thiết bị bị giao chậm?","(A) Khoản giảm giá 5% trên toàn bộ đơn đặt hàng","(B) Miễn phí thêm một chiếc Tủ An toàn Sinh học Dòng chảy Tầng","(C) Hoàn trả phí tu chỉnh L/C của ngân hàng","(D) Miễn phí vận chuyển nhanh bằng đường hàng không và gói bảo hành mở rộng hai năm miễn phí cho các thiết bị bị chậm hàng","1.5. Tóm tắt Viết lại Toàn bài theo Feynman (Feynman Monograph Summary)","English Executive Summary:","• BioMed Instruments notifies Crestview Diagnostics that while 3 out of 4 medical equipment items on PO #CV-7740 are ready to ship on May 10, the CryoSpin 4000 centrifuge (Item #BM-409) is backordered until June 18.","• Because Letter of Credit #LC-88219 prohibits partial shipments, BioMed proposes splitting the shipment (with free air freight for the June batch) and offers either a 5% discount or a free 2-year extended warranty on #BM-409.","• Crestview agrees, instructs Atlantic Commerce Bank to issue an MT707 L/C amendment allowing partial shipments and extending the final shipping deadline to June 25, and selects the complimentary 2-year extended calibration warranty.","Bản tóm tắt Tiếng Việt cốt lõi:","• BioMed Instruments thông báo cho Crestview Diagnostics rằng trong khi 3 trên 4 mặt hàng thiết bị y tế thuộc PO #CV-7740 đã sẵn sàng giao vào ngày 10/5, máy ly tâm CryoSpin 4000 (Mã #BM-409) bị nợ hàng (backordered) đến ngày 18/6.","• Do Tín dụng thư #LC-88219 hiện cấm giao hàng từng phần, BioMed đề xuất tách lô hàng thành 2 đợt (miễn phí cước hàng không cho lô tháng 6) và tặng quyền chọn giảm giá 5% hoặc bảo hành mở rộng 2 năm miễn phí cho mã #BM-409.","• Crestview đồng ý, chỉ đạo Ngân hàng Thương mại Atlantic phát hành bức điện SWIFT MT707 tu chỉnh L/C cho phép giao hàng từng phần và gia hạn ngày giao cuối cùng đến 25/6, đồng thời chọn gói bảo hành hiệu chuẩn mở rộng 2 năm miễn phí.","PHẦN 2: KÍCH HOẠT TƯ DUY Đọc HIỂU \u0026 TỪ VỰNG (ACTIVE RECALL 5 GIÂY)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["Mốc câu hỏi 1 — Từ khóa \u0027backordered\u0027 \u0026 \u0027accommodate your schedule\u0027: Khi nhà cung cấp báo 1 mặt hàng bị \u0027backordered\u0027 (tạm hết hàng/hẹn giao sau), từ \u0027accommodate\u0027 đi với \u0027schedule/request/needs\u0027 luôn mang nghĩa \u0027đáp ứng / điều chỉnh cho phù hợp với\u0027 (= fit in with / meet), tuyệt đối không dịch là \u0027cung cấp chỗ ở\u0027!","Question Anchor 1 — \u0027Backordered\u0027 \u0026 \u0027Accommodate your schedule\u0027: When a vendor reports an item is \u0027backordered\u0027, the verb \u0027accommodate\u0027 paired with \u0027schedule/request/needs\u0027 always means \u0027fit in with / meet / adapt to\u0027, never \u0027lodge\u0027."]],[["2. Boi canh \u0026 Quy trinh loi"],["Mốc câu hỏi 2 — Rào cản Tín dụng thư (\u0027Single consolidated shipment\u0027 vs. \u0027Partial shipments\u0027): Trong thanh toán L/C quốc tế, nếu điều khoản gốc ghi giao gộp 1 lần (\u0027single consolidated shipment\u0027), nhà xuất khẩu giao lẻ sẽ bị ngân hàng từ chối thanh toán (\u0027discrepancy\u0027). Người mua phải làm thủ tục Tu chỉnh L/C (\u0027amend the Letter of Credit\u0027) để cho phép \u0027partial shipments\u0027.","Question Anchor 2 — L/C Barrier (\u0027Single consolidated shipment\u0027 vs. \u0027Partial shipments\u0027): Under an international Letter of Credit, if the original terms require a single consolidated shipment, shipping partially causes a bank discrepancy. The buyer must request an L/C Amendment to authorize partial shipments."]],[["3. Dau vet suy luan cheo"],["Mốc câu hỏi 3 — Bẫy \u0027Either A or B\u0027 trong đền bù thiện chí (Goodwill Offer): Văn bản 1 đưa ra 2 lựa chọn (\u0027a 5% price reduction OR a complimentary 2-year extended warranty\u0027) cộng với \u0027air-freighting at no additional charge\u0027. Văn bản 2 chốt chọn bảo hành mở rộng (\u0027rather than taking the 5% discount, we prefer the extended calibration coverage\u0027).","Question Anchor 3 — \u0027Either A or B\u0027 Goodwill Offer Trap: Passage 1 offers free air freight PLUS a choice between a 5% discount OR a 2-year extended warranty. Passage 2 explicitly rejects the 5% discount and selects the extended calibration coverage."]]],"t":"table"},"PHẦN 3: ĐÁP ÁN CHUẨN XÁC \u0026 DẤU VẾT TRUY XUẤT CHÉO","181. Why did Ms. Rostova send the e-mail on May 6?","Dap an dung: (B) To inform a customer that part of an order is delayed and propose a split-delivery solution","[Dau vet bai doc / Clue]: Văn bản 1, Đoạn 1 \u0026 3: \u0027...our warehouse system flagged a supply chain delay affecting one of the four equipment models... we propose splitting PO #CV-7740 into two shipments...\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027warehouse system flagged a supply chain delay affecting one of the four equipment models\u0027 \u003c-\u003e \u0027part of an order is delayed\u0027","• \u0027we propose splitting PO into two shipments\u0027 \u003c-\u003e \u0027propose a split-delivery solution\u0027","[Loi giai chi tiet]: Mục đích chính của email ngày 06/5 là thông báo mã hàng #BM-409 bị chậm hàng (backordered) đến ngày 18/6 và đề xuất giải pháp tách đơn hàng giao làm 2 đợt. Đáp án (B) khớp hoàn toàn.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) To request an advance cash deposit before manufacturing custom laboratory equipment","- Ly do sai: Trong bài không hề yêu cầu đặt cọc tiền mặt vì hai bên đang sử dụng phương thức thanh toán Tín dụng thư không hủy ngang (Letter of Credit) do ngân hàng Atlantic bảo lãnh.","- Bay ETS: Bẫy Thông tin Bịa đặt / Không được Đề cập (Not Mentioned Trap)","(C) To announce the discontinuation of the CryoSpin 4000 centrifuge model","- Ly do sai: Mẫu máy CryoSpin 4000 chỉ bị chậm linh kiện sản xuất và giao lùi sang 18/6 chứ công ty không hề ngừng sản xuất (discontinue) mẫu này.","- Bay ETS: Bẫy Bóp méo Mức độ Sự thật (Exaggeration / Distortion Trap)","(D) To notify Crestview Diagnostics that its Letter of Credit was rejected by the bank","- Ly do sai: Thư tín dụng L/C không hề bị ngân hàng từ chối; ngược lại L/C đã được mở hợp lệ nhưng chỉ cho phép giao gộp 1 lần, nên bên bán mới đề xuất người mua làm thủ tục sửa đổi L/C.","- Bay ETS: Bẫy Mâu thuẫn với Bản chất Sự việc (Opposite / Contradiction Trap)","182. In the first e-mail, paragraph 3, line 4, the word \"accommodate\" is closest in meaning to","Dap an dung: (B) fit in with","[Dau vet bai doc / Clue]: Văn bản 1, Đoạn 3: \u0027To accommodate your facility launch schedule, we propose splitting PO #CV-7740 into two shipments...\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027accommodate your schedule\u0027 \u003c-\u003e \u0027fit in with your schedule\u0027 (= đáp ứng / điều chỉnh cho phù hợp với lịch trình)","[Loi giai chi tiet]: Trong ngữ cảnh \u0027To accommodate your facility launch schedule\u0027 (Để đáp ứng / phù hợp với lịch trình khai trương cơ sở của quý vị), động từ \u0027accommodate\u0027 đồng nghĩa với \u0027fit in with\u0027 (phù hợp với / đáp ứng).","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) lodge","- Ly do sai: \u0027lodge\u0027 là nghĩa đen khi nói về việc cung cấp chỗ ăn ở khách sạn, hoàn toàn vô nghĩa khi đi với tân ngữ \u0027schedule\u0027 (lịch trình).","- Bay ETS: Bẫy Nghĩa đen Phổ thông (Literal Dictionary Meaning Trap)","(C) enclose","- Ly do sai: \u0027enclose\u0027 có nghĩa là đính kèm tài liệu trong phong bì hoặc email, không đi với \u0027schedule\u0027.","- Bay ETS: Bẫy Từ vựng Thư tín Thường gặp (Letter Writing Distractor Trap)","(D) lend to","- Ly do sai: \u0027lend to\u0027 là cho vay tiền bạc hoặc đồ đạc, sai hoàn toàn bản chất ngữ nghĩa của câu.","- Bay ETS: Bẫy Ngữ nghĩa Tài chính Lạc đề (Irrelevant Financial Meaning Trap)","183. Which item will be delivered to Crestview Diagnostics in June?","Dap an dung: (C) Item #BM-409","[Dau vet bai doc / Clue]: Văn bản 1, Danh sách mặt hàng: \u0027• Refrigerated Micro-Centrifuge CryoSpin 4000 (Item #BM-409) — Qty: 3 — Status: Backordered (Estimated Dispatch: June 18)\u0027.","[Dien dat tuong duong / Paraphrase]: • \u0027Estimated Dispatch: June 18\u0027 \u003c-\u003e \u0027delivered to Crestview Diagnostics in June\u0027","[Loi giai chi tiet]: Ba mã hàng #BM-102, #BM-215 và #BM-510 đều sẵn hàng và giao ngày 10/5. Duy nhất mã #BM-409 bị nợ hàng (backordered) và dự kiến xuất kho ngày 18/6.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Item #BM-102","- Ly do sai: Mã #BM-102 có trạng thái \u0027In Stock (Ships May 10)\u0027, được giao ngay trong tháng 5.","- Bay ETS: Bẫy Mốc Thời gian Đợt 1 (May Shipment Distractor Trap)","(B) Item #BM-215","- Ly do sai: Mã #BM-215 sẵn sàng xuất kho vào ngày 10/5.","- Bay ETS: Bẫy Mặt hàng Sẵn kho Đợt 1 (In-Stock Item Trap)","(D) Item #BM-510","- Ly do sai: Mã #BM-510 cũng được giao trong đợt 1 vào ngày 10/5.","- Bay ETS: Bẫy Mặt hàng Đủ điều kiện Giao sớm (Early Delivery Distractor)","184. What did Mr. Kaufman ask Atlantic Commerce Bank to do?","Dap an dung: (C) Modify the terms of a Letter of Credit to permit partial deliveries and a later final ship date","[Dau vet bai doc / Clue]: Văn bản 2, Đoạn 2: \u0027...file an official request with Atlantic Commerce Bank to amend Letter of Credit #LC-88219. Specifically, the amendment authorizes partial shipments and extends the final latest-date-of-shipment deadline for the second tranche to June 25.\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027amend Letter of Credit\u0027 \u003c-\u003e \u0027Modify the terms of a Letter of Credit\u0027","• \u0027authorizes partial shipments\u0027 \u003c-\u003e \u0027permit partial deliveries\u0027","• \u0027extends the final latest-date-of-shipment deadline... to June 25\u0027 \u003c-\u003e \u0027a later final ship date\u0027","[Loi giai chi tiet]: \u0027Amend Letter of Credit\u0027 được paraphrase thành \u0027Modify the terms of a Letter of Credit\u0027, và \u0027authorizes partial shipments and extends the final latest-date-of-shipment\u0027 khớp 100% với đáp án (C).","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Increase the total monetary value of Letter of Credit #LC-88219","- Ly do sai: Tổng số lượng và giá trị thiết bị không thay đổi, chỉ chia nhỏ đợt giao hàng nên không cần tăng hạn mức giá trị tiền tệ của L/C.","- Bay ETS: Bẫy Giá trị Tiền tệ L/C (L/C Value Expansion Trap)","(B) Issue a standby performance guarantee on behalf of BioMed Instruments","- Ly do sai: Bảo lãnh thực hiện hợp đồng dự phòng (Standby Letter of Credit) không được đề cập trong trường hợp này.","- Bay ETS: Bẫy Nhầm lẫn Loại hình Bảo lãnh Ngân hàng (Standby Guarantee Trap)","(D) Wire an immediate 5 percent penalty fee from BioMed Instruments\u0027 account","- Ly do sai: Không hề có khoản phạt tiền nào bị trích thu từ tài khoản bên bán; 5% là mức chiết khấu thiện chí mà BioMed đề xuất nếu khách hàng muốn nhận tiền giảm giá.","- Bay ETS: Bẫy Đảo lộn Chiết khấu Thiện chí thành Tiền phạt (Goodwill vs. Penalty Trap)","185. What compensation will Crestview Diagnostics receive for the delayed equipment?","Dap an dung: (D) Free expedited air shipping and a complimentary two-year extended warranty on the backordered units","[Dau vet bai doc / Clue]: Văn bản 1, Đoạn 3: \u0027air-freighting the three CryoSpin 4000 units on June 18 at no additional shipping charge\u0027 kết nối Văn bản 2, Đoạn 3: \u0027rather than taking the 5 percent invoice discount, we would prefer to accept the extended calibration coverage\u0027.","[Dien dat tuong duong / Paraphrase]: • \u0027air-freighting... at no additional shipping charge\u0027 \u003c-\u003e \u0027Free expedited air shipping\u0027","• \u0027complimentary two-year extended calibration warranty\u0027 \u003c-\u003e \u0027complimentary two-year extended warranty on the backordered units\u0027","[Loi giai chi tiet]: Tổng hợp ưu đãi từ cả 2 văn bản: BioMed miễn phí vận chuyển đường hàng không cho lô hàng giao bù tháng 6 VÀ Crestview chọn gói bảo hành hiệu chuẩn mở rộng 2 năm miễn phí (thay vì giảm giá 5%).","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) A 5 percent discount on the entire purchase order","- Ly do sai: Văn bản 2 nêu rõ người mua đã từ chối nhận giảm giá 5% (\u0027rather than taking the 5 percent invoice discount, we prefer extended coverage\u0027), hơn nữa ưu đãi gốc chỉ áp dụng cho mã #BM-409 chứ không phải toàn bộ đơn hàng.","- Bay ETS: Bẫy Lựa chọn Bị Từ chối \u0026 Bẫy Mở rộng Phạm vi (Rejected Choice \u0026 Scope Trap)","(B) A free extra unit of the Laminar Flow Biosafety Cabinet","- Ly do sai: Không có chiếc tủ an toàn sinh học nào được tặng thêm.","- Bay ETS: Bẫy Tặng thêm Hàng hóa Bịa đặt (Fabricated Bonus Product Trap)","(C) Reimbursement for the bank\u0027s L/C amendment fee","- Ly do sai: Hai bên không hề thỏa thuận việc bên bán hoàn lại phí tu chỉnh L/C cho bên mua.","- Bay ETS: Bẫy Chi phí Ngân hàng Suy diễn (Assumed Bank Fee Reimbursement Trap)","PHẦN 4: PHÂN TÍCH CHUYÊN SÂU — TƯ DUY NGUYÊN BẢN (FIRST PRINCIPLES) \u0026 FEYNMAN","4.1. Sơ đồ Luồng Nghiệp vụ: Chuỗi Xử lý Nợ hàng (Backorder) \u0026 Tu chỉnh L/C Giao hàng Từng phần","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","Phát hiện Đứt gãy Tồn kho \u0026 Đề xuất Tách Lô hàng (Backorder \u0026 Split-Shipment Proposal)"],[],["BƯỚC 2","Kiểm tra Ràng buộc Thanh toán L/C \u0026 Phát hành Điện Tu chỉnh SWIFT MT707 (L/C Amendment)"],[],["BƯỚC 3","Chốt Quyền lợi Đền bù Bảo hành \u0026 Xuất kho Đợt 1 (Goodwill Confirmation \u0026 Tranche 1 Dispatch)"]],[["• Chung tu \u0026 Kenh: Hệ thống WMS Kho vận -\u003e Email Xuất khẩu (Văn bản 1)","• Nghiep vu thuc thi: Hệ thống kho phát hiện thiếu hụt mã #BM-409 (lùi sang 18/6) trong khi 3 mã khác sẵn sàng giao ngày 10/5; Quản lý Xuất khẩu đề xuất tách đơn làm 2 đợt kèm miễn phí Air Freight và quyền chọn đền bù thiện chí","• Ket qua \u0026 Kiem soat: Thông báo Backorder + Phương án Giao hàng Từng phần (Partial Shipment Proposal)"],["➔"],["• Chung tu \u0026 Kenh: Giám đốc Mua sắm -\u003e Bộ phận Ngân quỹ -\u003e Ngân hàng Phát hành (Văn bản 2)","• Nghiep vu thuc thi: Đối chiếu lịch kiểm định phòng lab (22/5); yêu cầu Atlantic Commerce Bank phát hành điện SWIFT MT707 sửa đổi L/C #LC-88219: mở khóa điều khoản \u0027Partial Shipments Allowed\u0027 và gia hạn Latest Date of Shipment đến 25/6","• Ket qua \u0026 Kiem soat: Bức điện Tu chỉnh Tín dụng thư (SWIFT MT707 L/C Amendment Advice) hợp thức hóa thanh toán từng đợt"],["➔"],["• Chung tu \u0026 Kenh: Email Xác nhận của Người mua -\u003e Bộ phận Tài trợ Thương mại \u0026 Logistics Nhà bán","• Nghiep vu thuc thi: Người mua chọn Gói bảo hành hiệu chuẩn mở rộng 2 năm (từ chối chiết khấu 5%); Nhà bán nhận điện MT707 và lập tức đóng hàng xuất tàu biển đợt 1 vào ngày 10/5","• Ket qua \u0026 Kiem soat: Vận đơn Đường biển Đợt 1 (May 10 Bill of Lading) + Phụ lục Bảo hành Mở rộng 2 năm cho mã #BM-409"]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["STEP 1","SOLE-SOURCE TECHNICAL JUSTIFICATION \u0026 EXECUTIVE PROCUREMENT WAIVER"],[],["STEP 2","CURRENCY FORWARD CONTRACT HEDGING VIA CORPORATE TREASURY BANK"],[],["STEP 3","FACTORY ACCEPTANCE TESTING (FAT) \u0026 SWIFT MT103 LETTER SETTLEMENT"]],[["• Documents \u0026 Channels: Sole-Source Justification Memo, Proprietary Metallurgy Certificate \u0026 CPO Approval","• Core Business Execution: Chemical plant specifies specialized titanium reactor valves; engineering verifies only German manufacturer Valvetech holds proprietary metallurgy patents; CPO signs sole-source competitive bidding waiver for €350,000 contract.","• Key Deliverable \u0026 Control: Legally compliant sole-source procurement authorization meeting enterprise audit standards"],["➔"],["• Documents \u0026 Channels: FX Forward Contract Confirmation, Corporate Treasury Desk \u0026 Commercial Bank","• Core Business Execution: To hedge against Euro appreciation over 6-month fabrication lead time, treasury locks in FX Forward Contract at 1.0800 USD/EUR with corporate bank for €350,000, fixing dollar commitment at $378,000.","• Key Deliverable \u0026 Control: Complete elimination of foreign exchange volatility risk across long-lead manufacturing cycle"],["➔"],["• Documents \u0026 Channels: Factory Acceptance Certificate, Export Customs Clearance \u0026 SWIFT MT103 Wire","• Core Business Execution: Quality engineers approve Factory Acceptance Testing in Munich; corporate bank exercises forward currency contract, wiring €350,000 via SWIFT MT103 against endorsed shipping documents.","• Key Deliverable \u0026 Control: Zero budget overrun and successful on-time delivery of critical industrial assets"]]],"t":"table"},"4.2. Giải thích Bản chất theo Tư duy Nguyên bản (First Principles) \u0026 Phương pháp Feynman (Tiếng Việt)","• Bản chất Luồng End-to-End (3 Dòng chảy đồng bộ — Thực thể + Pháp lý/Chứng từ + Ngân hàng/Kế toán): (1) Dòng chảy Vật lý (Physical Flow): 3 mẫu thiết bị có sẵn (#BM-102, #BM-215, #BM-510) được xuất kho đi đường biển ngày 10/5 để kịp phục vụ đoàn kiểm định ngày 22/5, còn 3 máy ly tâm #BM-409 bị nợ hàng (backordered) sẽ được chuyển phát nhanh bằng đường hàng không (air-freighted) vào ngày 18/6; (2) Dòng chảy Pháp lý \u0026 Chứng từ (Legal \u0026 Documentary Flow): Đơn đặt hàng PO #CV-7740 được tách thành 2 bộ chứng từ vận tải độc lập (1 bộ Vận đơn đường biển tháng 5 và 1 bộ Vận đơn hàng không AWB tháng 6), kèm theo cam kết nâng cấp bảo hành hiệu chuẩn mở rộng thêm 2 năm miễn phí; (3) Dòng chảy Ngân hàng \u0026 Kế toán (Banking \u0026 Accounting Flow): Ngân hàng Thương mại Atlantic phát hành bức điện tu chỉnh SWIFT MT707 cho Tín dụng thư không hủy ngang #LC-88219 (sửa điều khoản cấm giao từng phần thành cho phép giao hàng từng phần — \u0027Partial Shipments Authorized\u0027 — và lùi hạn giao hàng cuối cùng sang 25/6), cho phép nhà xuất khẩu BioMed chiết khấu bộ chứng từ đợt 1 thu tiền ngay trong tháng 5 mà không bị bắt lỗi bất hợp lệ (discrepancy).","• Điểm nghẽn Cốt lõi (Core Bottleneck): Sự xung đột cứng nhắc giữa biến động chuỗi cung ứng vật lý (1 mã hàng bị đứt gãy linh kiện giao trễ 5 tuần) và điều khoản thanh toán đóng băng của Tín dụng thư L/C (\u0027Single consolidated shipment no later than May 25\u0027). Nếu nhà bán tự ý giao trước 3 mã hàng khi chưa tu chỉnh L/C, ngân hàng phát hành sẽ từ chối thanh toán toàn bộ trị giá lô hàng do vi phạm điều khoản giao hàng gộp; ngược lại, nếu chờ đủ 4 mã hàng mới giao thì phòng xét nghiệm của người mua sẽ trượt kỳ kiểm định cấp phép ngày 22/5.","• 3 Giải pháp Hệ thống cho Chuyên viên Phân tích Nghiệp vụ (BA Solutions):","(1) Thiết kế Cổng tự động đối chiếu Tồn kho - Điều khoản L/C (Automated ATP-to-L/C Compliance Engine): Tích hợp dữ liệu Tồn kho khả dụng (Available-to-Promise - ATP) trên ERP với các trường dữ liệu chuẩn SWIFT MT700 (Trường 43P - Partial Shipments và Trường 44C - Latest Date of Shipment) để tự động cảnh báo ngay khi có 1 dòng hàng PO bị nhảy trạng thái Backorder vượt quá hạn giao L/C.","(2) Xây dựng Quy trình Phê duyệt Tách đơn \u0026 Khởi tạo Yêu cầu Tu chỉnh L/C Một chạm (One-Click Split-PO \u0026 MT707 Amendment Workflow): Cho phép Giám đốc Mua sắm bấm chọn phương án tách đợt giao hàng (Tranche Splitting) và lựa chọn gói đền bù SLA (Chiết khấu % hoặc Gia hạn Bảo hành) trực tiếp trên cổng B2B; hệ thống tự động sinh lệnh đề nghị ngân hàng phát hành điện tu chỉnh MT707.","(3) Cấu hình Cơ chế Giải ngân L/C Từng phần theo Đợt giao hàng (Tranche-Based L/C Drawdown \u0026 Warranty Ledger): Tự động tách hạn mức L/C #LC-88219 thành 2 đợt thanh toán khớp với trị giá hóa đơn thương mại Đợt 1 (ngày 10/5) và Đợt 2 (ngày 18/6), đồng thời tự động cộng thêm 24 tháng vào hạn bảo hành trên phân hệ Quản lý Tài sản Thiết bị (EAM) cho 3 số serial máy #BM-409.","4.3. Giải thích Chuyên sâu Song ngữ (Bilingual First Principles \u0026 Feynman Analysis - English)","• End-to-End Flow Nature (3 Synchronized Streams — Physical + Legal/Documentary + Banking/Accounting): (1) Physical Flow: Three available equipment models (#BM-102, #BM-215, #BM-510) are dispatched via ocean freight on May 10 to meet the May 22 laboratory accreditation inspection, while the three backordered #BM-409 centrifuges are air-freighted on June 18; (2) Legal \u0026 Documentary Flow: PO #CV-7740 is split into two distinct shipping document sets (a May Ocean Bill of Lading and a June Air Waybill), paired with a binding two-year complimentary calibration warranty addendum; (3) Banking \u0026 Accounting Flow: Atlantic Commerce Bank transmits a SWIFT MT707 amendment for Irrevocable Letter of Credit #LC-88219 (changing \u0027Partial Shipments Prohibited\u0027 to \u0027Authorized\u0027 and extending the latest shipment date to June 25), enabling BioMed to draw down payment for the first tranche in May without triggering an L/C discrepancy.","• Core Bottleneck: A rigid collision between physical supply chain volatility (a 5-week component delay on one SKU) and frozen documentary credit rules (\u0027Single consolidated shipment no later than May 25\u0027). Shipping partial goods without an L/C amendment causes bank payment rejection for documentary discrepancy, whereas holding the entire order causes the buyer\u0027s clinical laboratory to fail its May 22 accreditation audit.","• 3 Systemic BA Solutions:","(1) Automated ATP-to-L/C Compliance Engine: Cross-check ERP Available-to-Promise (ATP) inventory dates against SWIFT MT700 fields (Field 43P Partial Shipments \u0026 Field 44C Latest Date of Shipment) to trigger instant alerts whenever a backordered SKU breaches L/C shipment constraints.","(2) One-Click Split-PO \u0026 MT707 Amendment Workflow: Enable the Procurement Director to approve split deliveries and select goodwill SLA remedies (invoice discount vs. extended warranty) in one click, auto-generating the treasury request for a bank SWIFT MT707 amendment.","(3) Tranche-Based L/C Drawdown \u0026 Warranty Ledger: Automatically partition L/C #LC-88219 into two drawdown tranches matching the May 10 and June 18 commercial invoices, while auto-extending the Enterprise Asset Management (EAM) calibration warranty ledger by 24 months for the three #BM-409 serial numbers.","PHẦN 5: BẢNG TỪ VỰNG \u0026 CẤU TRÚC CỐT LÕI (8 THUẬT NGỮ B2B \u0026 TÍN DỤNG THƯ L/C)","1. consignment (n)  /kənˈsaɪnmənt/  = shipment / batch of goods / dispatched cargo","Nghia: Lô hàng gửi đi / Lô hàng ký gửi","Vd: While preparing your consignment for dispatch, our warehouse system flagged a supply chain delay. - Trong khi chuẩn bị lô hàng của quý vị để xuất kho, hệ thống kho vận của chúng tôi đã cảnh báo một sự chậm trễ chuỗi cung ứng.","2. backordered (adj) / backorder (n/v)  /ˈbækˌɔːrdərd/  = temporarily out of stock / on delayed delivery / awaiting restock","Nghia: Nợ hàng / Tạm hết hàng hẹn giao sau","Vd: Three units of the CryoSpin 4000 centrifuge are currently backordered until June 18. - Ba chiếc máy ly tâm CryoSpin 4000 hiện đang bị nợ hàng (tạm hết hàng hẹn giao sau) cho đến ngày 18 tháng 6.","3. stipulate (v)  /ˈstɪpjuleɪt/  = specify / require as a contract condition / mandate","Nghia: Quy định rõ / Đặt điều kiện bắt buộc (trong hợp đồng/L/C)","Vd: Your Letter of Credit currently stipulates a single consolidated shipment no later than May 25. - Tín dụng thư của quý vị hiện quy định bắt buộc phải giao hàng gộp một lần duy nhất muộn nhất vào ngày 25 tháng 5.","4. accommodate (v)  /əˈkɑːmədeɪt/  = fit in with / meet / adapt to / fulfill a request","Nghia: Đáp ứng / Điều chỉnh cho phù hợp với (nhu cầu, lịch trình)","Vd: To accommodate your facility launch schedule, we propose splitting the purchase order into two shipments. - Để đáp ứng lịch trình khai trương cơ sở của quý vị, chúng tôi đề xuất tách đơn đặt hàng thành hai đợt giao hàng.","5. gesture of goodwill (n phr)  /ˈdʒestʃər əv ˌɡʊdˈwɪl/  = courtesy compensation / token of appreciation / customer-care concession","Nghia: Cử chỉ thiện chí (khoản tặng/bù đắp để giữ quan hệ tốt với khách hàng)","Vd: As a gesture of goodwill for the inconvenience, we are offering a complimentary two-year extended warranty. - Như một cử chỉ thiện chí bù đắp cho sự bất tiện này, chúng tôi xin tặng gói bảo hành mở rộng hai năm miễn phí.","6. accrediting board (n phr)  /əˈkredɪtɪŋ bɔːrd/  = certification authority / regulatory inspection committee / licensing body","Nghia: Hội đồng kiểm định / Cơ quan cấp phép chất lượng","Vd: Our laboratory accrediting board is scheduled to inspect our hematology stations on May 22. - Hội đồng kiểm định phòng xét nghiệm của chúng tôi đã lên lịch kiểm tra các trạm huyết học vào ngày 22 tháng 5.","7. amend (v) / amendment (n)  /əˈmend/ - /əˈmendmənt/  = modify formally / revise / alter contract or L/C terms","Nghia: Tu chỉnh / Sửa đổi chính thức (Tín dụng thư L/C hoặc Hợp đồng)","Vd: I instructed our treasury department to ask Atlantic Commerce Bank to amend Letter of Credit #LC-88219. - Tôi đã chỉ đạo bộ phận ngân quỹ yêu cầu Ngân hàng Thương mại Atlantic tu chỉnh Tín dụng thư #LC-88219.","8. tranche (n)  /trɑːntʃ/  = installment / portion / scheduled batch of delivery or payment","Nghia: Đợt / Phần giải ngân hoặc giao hàng (chia theo giai đoạn)","Vd: The amendment extends the final shipment deadline for the second tranche to June 25. - Bản tu chỉnh gia hạn thời hạn giao hàng cuối cùng cho đợt thứ hai đến ngày 25 tháng 6.","==================================================================================================","BÀI 5: Chính sách Thẻ Mua sắm Doanh nghiệp (Corporate P-Card Policy), Sao kê Thẻ Hàng tháng \u0026 Kiểm toán Nội bộ Giao dịch Chia nhỏ Lách hạn mức (Questions 186-190 - Triple Passage)","Nguồn: ETS TOEIC Part 7 — Triple Passage (Corporate Purchasing Card Policy, Monthly Statement \u0026 Internal Audit Split-Transaction Inquiry)","PHẦN 1: NỘI DUNG BÀI ĐỌC, CÂU HỎI \u0026 BẢN DỊCH SONG NGỮ","1.1. Đề thi Tiếng Anh gốc (Strategy Guide \u0026 Original ETS Passages)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","Questions 186-190 refer to the following policy excerpt, statement, and e-mail.","[Passage 1: Policy Excerpt — Corporate Purchasing Card (P-Card) Guidelines]","STRATOS MEDIA GROUP — CORPORATE PURCHASING CARD POLICY (REF: #FIN-402)","Effective Date: January 1","1. Purpose \u0026 Authorized Use","Corporate Purchasing Cards (P-Cards) are issued to designated department managers to streamline low-value, high-frequency operational purchases such as office supplies, minor facility repairs, trade show booth materials, and urgent software subscriptions. P-Cards may NOT be used for personal expenses, employee travel and hotel lodging (which must be booked through the Concur Travel Card program), or long-term capital equipment leases.","2. Spending Thresholds \u0026 Pre-Approval Rules","• Single-Transaction Limit: $5,000.00 (including tax and shipping).","• Monthly Cycle Spending Cap: $20,000.00 per cardholder.","• Purchases reaching or exceeding $5,000.00 must be processed through a standard Purchase Order (PO) in the ERP system OR receive prior written authorization from the Vice President of Finance.","3. Prohibition of Split Transactions","Cardholders are strictly prohibited from dividing a single invoice or vendor order into two or more smaller charges (\u0027split transactions\u0027) to circumvent the $5,000.00 single-transaction threshold. Our automated expense auditing software flags consecutive charges made to the same merchant within a 48-hour window.","4. Compliance \u0026 Retroactive Ratification","All itemized receipts must be uploaded to the SpendGuard portal within 5 business days of statement closing. If an emergency operational necessity results in a threshold violation, the cardholder must submit a Policy Exception Form (#EX-09) counter-signed by the Vice President of Finance, Rachel Lindqvist, within 7 business days of an audit inquiry, or face temporary card suspension.","[Passage 2: Statement — Monthly P-Card Billing Statement (August)]","FIRST METRO COMMERCIAL BANK — CORPORATE P-CARD STATEMENT","Cardholder: Marcus Vance (Director of Live Events, Marketing Dept.)","Account Number: ****-****-****-4418 | Billing Cycle: August 1 – August 31","Monthly Credit Limit: $20,000.00 | Total Cycle Spend: $11,430.00","Trans. ID — Date — Merchant Name — Category — Amount — Receipt Status","#TX-901 — Aug 04 — Apex Banner \u0026 Print Co. — Trade Show Graphics — $1,850.00 — Verified","#TX-902 — Aug 09 — CloudStream Pro SaaS — Live Broadcast License — $680.00 — Verified","#TX-904 — Aug 14 — Lumina Stage \u0026 AV Rentals — Event Equipment — $3,200.00 — FLAGGED (Rule #3)","#TX-905 — Aug 14 — Lumina Stage \u0026 AV Rentals — Event Equipment — $3,200.00 — FLAGGED (Rule #3)","#TX-908 — Aug 22 — Metro Courier Express — Urgent Freight — $420.00 — Verified","#TX-911 — Aug 27 — GreenLeaf Floral Design — Stage Decor — $2,080.00 — Verified","SYSTEM AUDIT ALERT: Transactions #TX-904 and #TX-905 were executed at the same merchant on August 14 totaling $6,400.00. Cardholder explanation and compliance documentation required by September 9.","[Passage 3: E-mail — Cardholder Audit Explanation]","To: internalaudit@stratosmediagroup.com","From: m.vance@stratosmediagroup.com","Date: September 3","Subject: Audit Inquiry Response — P-Card Account #4418 (August Statement)","Dear Internal Audit Team,","I am writing in response to the automated compliance alert regarding Transactions #TX-904 and #TX-905 on my August P-Card statement.","On the morning of August 14, just four hours before the keynote opening of our Annual Advertisers Summit, the main curved LED backdrop panel at the venue suffered a power-surge failure. Because our regular AV vendor could not deliver a replacement in time, I sourced an emergency replacement LED wall from a local supplier, Lumina Stage \u0026 AV Rentals, for a total rental and technician setup fee of $6,400.00.","Lumina required immediate payment before unloading the truck. When their field technician attempted to run the full $6,400.00 charge on my P-Card, the terminal declined the payment due to the $5,000.00 single-swipe cap. With keynote speakers already arriving for rehearsals, I authorized the technician to run two separate charges of $3,200.00 so the crew could begin installation immediately.","I have uploaded the original $6,400.00 consolidated invoice and the incident report from the venue engineer to the SpendGuard portal. I have also completed the required exception document and forwarded it to Ms. Lindqvist\u0027s office this morning for her review and signature. I will upload the fully executed form well before the September 9 deadline.","Sincerely,","Marcus Vance","Director of Live Events, Stratos Media Group","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","186. According to the policy excerpt, which of the following purchases is prohibited on a Corporate P-Card?","(A) Promotional banners for an industry trade show","(B) A monthly subscription for live-streaming software","(C) Airline tickets and hotel rooms for a business trip","(D) Emergency courier delivery services","187. What is the maximum amount a cardholder may spend in a single transaction without prior authorization?","(A) $3,200.00","(B) $5,000.00","(C) $6,400.00","(D) $20,000.00","188. Why were Transactions #TX-904 and #TX-905 flagged by the auditing software?","(A) They caused Mr. Vance to exceed his $20,000.00 monthly spending limit.","(B) The itemized receipts were not uploaded within five business days.","(C) Lumina Stage \u0026 AV Rentals is an unapproved international merchant.","(D) A single $6,400.00 purchase was divided into two smaller charges on the same day to bypass the single-swipe limit.","189. Why did Mr. Vance rent equipment from Lumina Stage \u0026 AV Rentals on August 14?","(A) The original stage display broke down shortly before a major conference began.","(B) Apex Banner \u0026 Print Co. failed to deliver the trade show graphics on time.","(C) The venue unexpectedly doubled the size of the main auditorium.","(D) Ms. Lindqvist instructed him to switch to a less expensive equipment provider.","190. What document has Mr. Vance sent to Ms. Lindqvist for signature?","(A) Policy Exception Form #EX-09","(B) A Concur Travel Card application","(C) An annual marketing budget proposal","(D) A long-term capital equipment lease contract","1.2. Hướng dẫn làm bài Part 7","CHIẾN THUẬT 5 PHÚT TỐI ƯU: QUÉT 3 ĐIỂM CHẠM, GIẢI ĐỦ 5 CÂU HỎI \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Luồng quy trình Đoạn ba (Quỹ đạo Quét chữ Z \u0026 Bộ lọc 3 Câu hỏi Tiềm thức): • Chiến thuật Đoạn Ba (30 giây = 10s x 3 văn bản) — Quy trình Nghiệp vụ 3 Chặng Khép kín:","- Tuyệt đối KHÔNG đọc sâu thân bài; mắt lướt theo Quỹ đạo hình chữ Z (Z-Pattern Eye Scan) qua 3 điểm chạm:","• Văn bản 1 (Policy Excerpt - Quy định sử dụng Thẻ mua sắm doanh nghiệp P-Card):","- Điểm chạm 1 (Nét ngang trên): Tiêu đề \u0027CORPORATE PURCHASING CARD (P-CARD) POLICY \u0026 SPENDING LIMITS\u0027 -\u003e Trả lời Q1: Quy chế chi tiêu và hạn mức mua sắm bằng thẻ công ty.","- Điểm chạm 2 (Nét chéo xuống footer): Ban Kiểm soát Chi phí \u0026 Kế toán Doanh nghiệp -\u003e Trả lời Q2: Doanh nghiệp quy định trách nhiệm cho các chủ thẻ P-Card.","- Điểm chạm 3 (Nét móc neo hai đầu): Hạn mức (\u0027single transaction limit $2,500, alcohol/travel prohibited, receipts must be uploaded within 5 business days\u0027) -\u003e Trả lời Q3: Giới hạn mỗi giao dịch tối đa $2.500, cấm mua rượu/vé du lịch, phải nộp hóa đơn trong 5 ngày.","• Văn bản 2 (Statement - Bảng sao kê giao dịch thẻ hàng tháng):","- Điểm chạm 1 (Nét ngang trên): Tiêu đề \u0027MONTHLY P-CARD ACCOUNT STATEMENT – AUGUST\u0027 -\u003e Trả lời Q1: Bảng sao kê chi tiết các khoản quẹt thẻ ngân hàng trong tháng 8.","- Điểm chạm 2 (Nét chéo xuống footer): Cardholder \u0027David Ross (Senior Facility Engineer)\u0027 -\u003e Trả lời Q2: Kỹ sư trưởng quản lý cơ sở vật chất tòa nhà sử dụng thẻ.","- Điểm chạm 3 (Nét móc neo hai đầu): Khoản chi bất thường (\u0027Item 3: Emergency HVAC compressor replacement $2,450; Item 5: Software subscription $350\u0027) -\u003e Trả lời Q3: Quẹt thẻ mua máy nén điều hòa khẩn cấp $2.450 (dưới trần $2.500) và phần mềm $350.","• Văn bản 3 (E-mail - Thư giải trình kiểm toán chi tiêu bất thường):","- Điểm chạm 1 (Nét ngang trên): Dòng \u0027Subject: P-Card Audit Explanation – Emergency HVAC Repair\u0027 -\u003e Trả lời Q1: Email giải trình lý do phát sinh chi phí lớn trên sao kê.","- Điểm chạm 2 (Nét chéo xuống footer): \u0027From: David Ross\u0027 gửi \u0027Internal Audit Committee\u0027 -\u003e Trả lời Q2: Chủ thẻ giải trình với ban kiểm soát nội bộ.","- Điểm chạm 3 (Nét móc neo hai đầu): Giải trình (\u0027compressor failed during heatwave, verbal pre-approval obtained from VP, vendor receipt attached\u0027) -\u003e Trả lời Q3: Giải thích máy điều hòa hỏng giữa đợt nắng nóng, đã xin duyệt miệng từ Phó Chủ tịch và nộp đủ hóa đơn.","• Quy trình nghiệp vụ 3 chặng khép kín: Quy chế (Hạn mức $2.500/lần, cấm chi tiêu sai mục đích) -\u003e Sao kê (Khoản quẹt $2.450 sửa điều hòa) -\u003e Giải trình (Được duyệt miệng do sự cố khẩn cấp, nộp hóa đơn hợp lệ).","=\u003e Chốt luồng sự việc sau 30s: Kỹ sư David Ross quẹt thẻ P-Card $2.450 mua máy nén điều hòa (nằm trong hạn mức $2.500); bị kiểm toán yêu cầu giải trình và anh đã chứng minh đây là sửa chữa khẩn cấp được sếp phê duyệt.","Bước 2 (20 giây) - Quét nhanh 5 câu hỏi \u0026 Phân loại (Chỉ đọc câu hỏi, KHÔNG đọc 4 đáp án A, B, C, D): • Nguyên tắc đọc Bước 2 (3-4 giây/câu): Lướt nhanh cả 5 câu hỏi trước để gắn \u00275 móc từ khóa\u0027 vào bộ nhớ tạm rồi mới giải cuốn chiếu; TUYỆT ĐỐI CHỈ ĐỌC CÂU HỎI, KHÔNG ĐỌC 4 ĐÁP ÁN (A, B, C, D) để tránh nhiễu 15 phương án bẫy:","Bước 1 — Đọc lướt câu hỏi (60 giây): Đọc nhanh 5 câu (186-190). Câu 186 hỏi trường hợp nào bị cấm sử dụng thẻ P-Card (Văn bản 1); Câu 187 hỏi hạn mức tối đa cho một lần quẹt thẻ không cần xin phê duyệt trước (Văn bản 1); Câu 188 hỏi tại sao kiểm toán viên lại gắn cờ cảnh báo giao dịch tại \u0027Lumina Stage \u0026 AV Rentals\u0027 (Kết nối quy định cấm \u0027Split Transactions\u0027 ở Văn bản 1 + 2 dòng quẹt thẻ $3,200 liên tiếp cùng ngày ở Văn bản 2); Câu 189 hỏi mục đích email của ông Vance (Văn bản 3); Câu 190 hỏi ông Vance phải nộp bổ sung biểu mẫu/chữ ký của ai trước thứ Sáu (Kết nối Văn bản 1 + Văn bản 3).","Bước 3 (3 phút 45 giây) - Cách trả lời \u0026 Dấu hiệu tìm nhanh nhất cho đủ 5 câu hỏi (Giải cuốn chiếu \u0026 Chốt đáp án từng câu): Bước 2 — Đọc Văn bản 1 (80 giây): Quét Sổ tay Chính sách Thẻ Mua sắm Doanh nghiệp (Corporate P-Card Policy #FIN-402) của tập đoàn Stratos Media. Ghi nhớ 3 con số sống còn: (1) Single-Transaction Limit = $5,000; (2) Monthly Card Limit = $20,000; (3) Nghiêm cấm hành vi chia nhỏ hóa đơn (\u0027Split Transactions\u0027) để lách mốc $5,000 — mọi khoản mua từ $5,000 trở lên phải có chữ ký duyệt trước hoặc phê duyệt hồi tố (\u0027retroactive sign-off\u0027) của Phó Chủ tịch Tài chính (VP of Finance).","Bước 3 — Đọc Văn bản 2 \u0026 3 (100 giây): Văn bản 2 là Bảng sao kê thẻ P-Card tháng 8 của ông Marcus Vance (Trưởng phòng Sự kiện). Nhìn vào ngày Aug 14: có tới 2 giao dịch quẹt thẻ liên tiếp tại \u0027Lumina Stage \u0026 AV Rentals\u0027 (#TX-904 và #TX-905), mỗi giao dịch đúng $3,200 (Tổng = $6,400 \u003e $5,000!). Văn bản 3 là email giải trình của ông Vance gửi Kiểm toán Nội bộ: giải thích rằng do màn hình LED cong bị hỏng đột xuất trước giờ diễn hội nghị, nhà cung cấp đòi thanh toán ngay $6,400 nhưng máy POS bị lỗi hạn mức thẻ $5,000 nên thu ngân đã quẹt làm 2 lần $3,200.","Bước 4 (25 giây cuối giờ thi + Củng cố sau giờ thi) - Kiểm tra khóa đáp án \u0026 Đúc kết Feynman 1 câu: Bước 4 — Đối chiếu \u0026 Khoanh đáp án (60 giây): Khớp lỗi vi phạm \u0027Split Transaction\u0027 ($3,200 x 2 = $6,400) và thủ tục xin phê duyệt hồi tố (Form #EX-09 có chữ ký của VP of Finance Rachel Lindqvist) để chọn đáp án.","1.3. Dịch Song ngữ Xen kẽ Từng Câu (Sentence-by-Sentence Translation)","[Văn bản 1: Trích lục Chính sách — Quy định Sử dụng Thẻ Mua sắm Doanh nghiệp (P-Card)]","STRATOS MEDIA GROUP — CORPORATE PURCHASING CARD POLICY (REF: #FIN-402)","Effective Date: January 1","1. Purpose \u0026 Authorized Use","Corporate Purchasing Cards (P-Cards) are issued to designated department managers to streamline low-value, high-frequency operational purchases such as office supplies, minor facility repairs, trade show booth materials, and urgent software subscriptions. P-Cards may NOT be used for personal expenses, employee travel and hotel lodging (which must be booked through the Concur Travel Card program), or long-term capital equipment leases.","TẬP ĐOÀN TRUYỀN THÔNG STRATOS — CHÍNH SÁCH THẺ MUA SẮM DOANH NGHIỆP (MÃ: #FIN-402)","Ngày hiệu lực: 01 tháng 1","1. Mục đích \u0026 Phạm vi Sử dụng được Cấp phép","Thẻ Mua sắm Doanh nghiệp (P-Card) được cấp cho các trưởng bộ phận được chỉ định nhằm tinh gọn các giao dịch mua sắm vận hành có giá trị thấp, tần suất cao như văn phòng phẩm, sửa chữa cơ sở vật chất nhỏ, vật tư gian hàng triển lãm và các gói thuê bao phần mềm khẩn cấp. KHÔNG được sử dụng thẻ P-Card cho chi phí cá nhân, vé đi lại và khách sạn lưu trú của nhân viên (bắt buộc phải đặt qua chương trình Thẻ Công tác Concur), hoặc các hợp đồng thuê tài sản thiết bị vốn dài hạn.","2. Spending Thresholds \u0026 Pre-Approval Rules","• Single-Transaction Limit: $5,000.00 (including tax and shipping).","• Monthly Cycle Spending Cap: $20,000.00 per cardholder.","• Purchases reaching or exceeding $5,000.00 must be processed through a standard Purchase Order (PO) in the ERP system OR receive prior written authorization from the Vice President of Finance.","2. Hạn mức Chi tiêu \u0026 Quy tắc Phê duyệt Trước","• Hạn mức một lần giao dịch: 5.000,00 USD (đã bao gồm thuế và phí vận chuyển).","• Trần chi tiêu chu kỳ hàng tháng: 20.000,00 USD cho mỗi chủ thẻ.","• Các khoản mua sắm chạm mức hoặc vượt quá 5.000,00 USD phải được xử lý thông qua Đơn đặt hàng (PO) tiêu chuẩn trên hệ thống ERP HOẶC phải nhận được sự chấp thuận bằng văn bản trước từ Phó Chủ tịch Tài chính.","3. Prohibition of Split Transactions","Cardholders are strictly prohibited from dividing a single invoice or vendor order into two or more smaller charges (\u0027split transactions\u0027) to circumvent the $5,000.00 single-transaction threshold. Our automated expense auditing software flags consecutive charges made to the same merchant within a 48-hour window.","3. Nghiêm cấm Chia nhỏ Giao dịch (Split Transactions)","Chủ thẻ bị nghiêm cấm chia nhỏ một hóa đơn hoặc một đơn hàng của nhà cung cấp thành hai hay nhiều lần quẹt thẻ nhỏ hơn (\u0027giao dịch chia nhỏ\u0027) nhằm lách qua ngưỡng hạn mức một lần giao dịch 5.000,00 USD. Phần mềm kiểm toán chi phí tự động của chúng tôi sẽ gắn cờ cảnh báo đối với các khoản thanh toán liên tiếp tại cùng một đơn vị chấp nhận thẻ trong khung thời gian 48 giờ.","4. Compliance \u0026 Retroactive Ratification","All itemized receipts must be uploaded to the SpendGuard portal within 5 business days of statement closing. If an emergency operational necessity results in a threshold violation, the cardholder must submit a Policy Exception Form (#EX-09) counter-signed by the Vice President of Finance, Rachel Lindqvist, within 7 business days of an audit inquiry, or face temporary card suspension.","4. Tuân thủ \u0026 Phê duyệt Hồi tố (Chấp thuận bổ sung sau sự việc)","Tất cả biên lai chi tiết từng khoản mục phải được tải lên cổng SpendGuard trong vòng 5 ngày làm việc kể từ ngày chốt sao kê. Nếu một tình huống vận hành khẩn cấp dẫn đến việc vi phạm ngưỡng hạn mức, chủ thẻ phải nộp Biểu mẫu Ngoại lệ Chính sách (#EX-09) có chữ ký đồng phê duyệt của Phó Chủ tịch Tài chính, bà Rachel Lindqvist, trong vòng 7 ngày làm việc kể từ khi có yêu cầu giải trình kiểm toán, nếu không sẽ bị tạm khóa thẻ.","[Văn bản 2: Sao kê — Bảng Sao kê Thanh toán Thẻ P-Card Hàng tháng (Tháng 8)]","FIRST METRO COMMERCIAL BANK — CORPORATE P-CARD STATEMENT","Cardholder: Marcus Vance (Director of Live Events, Marketing Dept.)","Account Number: ****-****-****-4418 | Billing Cycle: August 1 – August 31","Monthly Credit Limit: $20,000.00 | Total Cycle Spend: $11,430.00","NGÂN HÀNG THƯƠNG MẠI FIRST METRO — SAO KÊ THẺ P-CARD DOANH NGHIỆP","Chủ thẻ: Marcus Vance (Giám đốc Sự kiện Trực tiếp, Phòng Marketing)","Số tài khoản: ****-****-****-4418 | Kỳ sao kê: 01/8 – 31/8","Hạn mức tín dụng tháng: 20.000,00 USD | Tổng chi tiêu trong kỳ: 11.430,00 USD","Trans. ID — Date — Merchant Name — Category — Amount — Receipt Status","#TX-901 — Aug 04 — Apex Banner \u0026 Print Co. — Trade Show Graphics — $1,850.00 — Verified","#TX-902 — Aug 09 — CloudStream Pro SaaS — Live Broadcast License — $680.00 — Verified","#TX-904 — Aug 14 — Lumina Stage \u0026 AV Rentals — Event Equipment — $3,200.00 — FLAGGED (Rule #3)","#TX-905 — Aug 14 — Lumina Stage \u0026 AV Rentals — Event Equipment — $3,200.00 — FLAGGED (Rule #3)","#TX-908 — Aug 22 — Metro Courier Express — Urgent Freight — $420.00 — Verified","#TX-911 — Aug 27 — GreenLeaf Floral Design — Stage Decor — $2,080.00 — Verified","Mã GD — Ngày — Tên Đơn vị Chấp nhận Thẻ — Hạng mục — Số tiền — Trạng thái Biên lai","#TX-901 — 04/8 — Apex Banner \u0026 Print Co. — Ấn phẩm Triển lãm — 1.850,00 USD — Đã xác minh","#TX-902 — 09/8 — CloudStream Pro SaaS — Bản quyền Phát sóng Trực tiếp — 680,00 USD — Đã xác minh","#TX-904 — 14/8 — Lumina Stage \u0026 AV Rentals — Thiết bị Sự kiện — 3.200,00 USD — BỊ GẮN CỜ (Quy tắc #3)","#TX-905 — 14/8 — Lumina Stage \u0026 AV Rentals — Thiết bị Sự kiện — 3.200,00 USD — BỊ GẮN CỜ (Quy tắc #3)","#TX-908 — 22/8 — Metro Courier Express — Vận chuyển Khẩn cấp — 420,00 USD — Đã xác minh","#TX-911 — 27/8 — GreenLeaf Floral Design — Trang trí Sân khấu — 2.080,00 USD — Đã xác minh","SYSTEM AUDIT ALERT: Transactions #TX-904 and #TX-905 were executed at the same merchant on August 14 totaling $6,400.00. Cardholder explanation and compliance documentation required by September 9.","CẢNH BÁO KIỂM TOÁN HỆ THỐNG: Giao dịch #TX-904 và #TX-905 đã được thực hiện tại cùng một đơn vị bán hàng vào ngày 14/8 với tổng số tiền là 6.400,00 USD. Yêu cầu chủ thẻ giải trình và nộp hồ sơ tuân thủ trước ngày 09 tháng 9.","[Văn bản 3: Email — Giải trình Kiểm toán của Chủ thẻ]","To: internalaudit@stratosmediagroup.com","From: m.vance@stratosmediagroup.com","Date: September 3","Subject: Audit Inquiry Response — P-Card Account #4418 (August Statement)","Dear Internal Audit Team,","I am writing in response to the automated compliance alert regarding Transactions #TX-904 and #TX-905 on my August P-Card statement.","Tới: internalaudit@stratosmediagroup.com","Từ: m.vance@stratosmediagroup.com","Ngày: 03 tháng 9","Chủ đề: Phản hồi Yêu cầu Giải trình Kiểm toán — Tài khoản P-Card #4418 (Sao kê Tháng 8)","Kính gửi Đội ngũ Kiểm toán Nội bộ,","Tôi viết thư này để phản hồi cảnh báo tuân thủ tự động liên quan đến Giao dịch #TX-904 và #TX-905 trên bảng sao kê thẻ P-Card tháng 8 của tôi.","On the morning of August 14, just four hours before the keynote opening of our Annual Advertisers Summit, the main curved LED backdrop panel at the venue suffered a power-surge failure. Because our regular AV vendor could not deliver a replacement in time, I sourced an emergency replacement LED wall from a local supplier, Lumina Stage \u0026 AV Rentals, for a total rental and technician setup fee of $6,400.00.","Vào sáng ngày 14/8, chỉ bốn tiếng trước lễ khai mạc chính của Hội nghị Thượng đỉnh các Nhà Quảng cáo Thường niên của chúng ta, tấm màn hình nền LED cong chính tại địa điểm tổ chức đã bị hỏng do sự cố tăng áp đột ngột. Bởi vì nhà cung cấp thiết bị nghe nhìn (AV) thường xuyên của chúng ta không thể giao thiết bị thay thế kịp thời, tôi đã tìm thuê khẩn cấp một bức tường màn hình LED thay thế từ nhà cung cấp địa phương, Lumina Stage \u0026 AV Rentals, với tổng chi phí thuê và kỹ thuật viên lắp đặt là 6.400,00 USD.","Lumina required immediate payment before unloading the truck. When their field technician attempted to run the full $6,400.00 charge on my P-Card, the terminal declined the payment due to the $5,000.00 single-swipe cap. With keynote speakers already arriving for rehearsals, I authorized the technician to run two separate charges of $3,200.00 so the crew could begin installation immediately.","Lumina yêu cầu phải thanh toán ngay lập tức trước khi dỡ hàng khỏi xe tải. Khi kỹ thuật viên hiện trường của họ cố gắng quẹt toàn bộ số tiền 6.400,00 USD trên thẻ P-Card của tôi, máy POS đã từ chối thanh toán do trần giới hạn một lần quẹt 5.000,00 USD. Trong tình thế các diễn giả chính đã bắt đầu có mặt để tổng duyệt, tôi đã cho phép kỹ thuật viên quẹt thành hai giao dịch riêng biệt trị giá 3.200,00 USD để đội thi công có thể bắt đầu lắp đặt ngay lập tức.","I have uploaded the original $6,400.00 consolidated invoice and the incident report from the venue engineer to the SpendGuard portal. I have also completed the required exception document and forwarded it to Ms. Lindqvist\u0027s office this morning for her review and signature. I will upload the fully executed form well before the September 9 deadline.","Sincerely,","Marcus Vance, Director of Live Events, Stratos Media Group","Tôi đã tải hóa đơn tổng hợp gốc trị giá 6.400,00 USD cùng biên bản sự cố của kỹ sư tòa nhà lên cổng SpendGuard. Sáng nay tôi cũng đã điền xong biểu mẫu ngoại lệ theo quy định và chuyển tới văn phòng của bà Lindqvist để bà xem xét và ký duyệt. Tôi sẽ tải lên biểu mẫu đã có đầy đủ chữ ký trước hạn chót ngày 09/9.","Trân trọng,","Marcus Vance, Giám đốc Sự kiện Trực tiếp, Tập đoàn Truyền thông Stratos","1.4. Dịch chi tiết Câu hỏi \u0026 Phương án Trắc nghiệm","Câu 186. Theo trích lục chính sách, khoản mua sắm nào sau đây bị cấm thanh toán bằng Thẻ P-Card Doanh nghiệp?","(A) Băng rôn quảng cáo cho một hội chợ triển lãm trong ngành","(B) Gói thuê bao hàng tháng cho phần mềm phát sóng trực tiếp","(C) Vé máy bay và phòng khách sạn cho một chuyến công tác","(D) Dịch vụ chuyển phát nhanh khẩn cấp","Câu 187. Số tiền tối đa mà chủ thẻ được phép chi tiêu trong một lần giao dịch mà không cần xin phê duyệt trước là bao nhiêu?","(A) 3.200,00 USD","(B) 5.000,00 USD","(C) 6.400,00 USD","(D) 20.000,00 USD","Câu 188. Tại sao Giao dịch #TX-904 và #TX-905 lại bị phần mềm kiểm toán gắn cờ cảnh báo?","(A) Chúng khiến ông Vance vượt quá hạn mức chi tiêu hàng tháng 20.000,00 USD.","(B) Các biên lai chi tiết không được tải lên trong vòng năm ngày làm việc.","(C) Lumina Stage \u0026 AV Rentals là một đơn vị bán hàng quốc tế chưa được phê duyệt.","(D) Một khoản mua hàng 6.400,00 USD duy nhất đã bị chia thành hai lần quẹt thẻ nhỏ hơn trong cùng một ngày để lách qua hạn mức một lần quẹt thẻ.","Câu 189. Tại sao ông Vance lại thuê thiết bị từ Lumina Stage \u0026 AV Rentals vào ngày 14 tháng 8?","(A) Màn hình sân khấu ban đầu bị hỏng ngay trước khi một hội nghị lớn bắt đầu.","(B) Apex Banner \u0026 Print Co. đã không giao ấn phẩm triển lãm đúng hạn.","(C) Địa điểm tổ chức bất ngờ mở rộng gấp đôi kích thước hội trường chính.","(D) Bà Lindqvist đã chỉ đạo ông chuyển sang một nhà cung cấp thiết bị rẻ hơn.","Câu 190. Ông Vance đã gửi tài liệu nào cho bà Lindqvist để xin chữ ký?","(A) Biểu mẫu Ngoại lệ Chính sách #EX-09 (Policy Exception Form #EX-09)","(B) Đơn đăng ký Thẻ Công tác Concur","(C) Bản đề xuất ngân sách marketing thường niên","(D) Hợp đồng thuê thiết bị vốn dài hạn","1.5. Tóm tắt Viết lại Toàn bài theo Feynman (Feynman Monograph Summary)","English Executive Summary:","• Stratos Media Group\u0027s Corporate P-Card Policy (#FIN-402) sets a $5,000 single-transaction limit and strictly prohibits splitting invoices (\u0027split transactions\u0027) to bypass this cap, requiring a Policy Exception Form (#EX-09) signed by VP of Finance Rachel Lindqvist for any emergency violation.","• On his August statement, Live Events Director Marcus Vance is flagged for two consecutive $3,200 charges (#TX-904 \u0026 #TX-905, totaling $6,400) at Lumina Stage \u0026 AV Rentals on August 14.","• In his audit response, Mr. Vance explains that the main conference LED wall suffered a power-surge failure 4 hours before keynote opening, forcing him to split the $6,400 emergency replacement charge into two $3,200 swipes after the POS terminal blocked the single $6,400 swipe, and confirms that he has submitted Form #EX-09 to Ms. Lindqvist for retroactive ratification.","Bản tóm tắt Tiếng Việt cốt lõi:","• Chính sách Thẻ Mua sắm Doanh nghiệp (#FIN-402) của Tập đoàn Truyền thông Stratos quy định hạn mức 5.000 USD/lần giao dịch và nghiêm cấm hành vi chia nhỏ hóa đơn (\u0027split transactions\u0027) để lách trần này, đồng thời yêu cầu phải có Biểu mẫu Ngoại lệ Chính sách (#EX-09) do Phó Chủ tịch Tài chính Rachel Lindqvist ký duyệt đối với mọi vi phạm khẩn cấp.","• Trên bảng sao kê tháng 8, Giám đốc Sự kiện Marcus Vance bị gắn cờ cảnh báo vì 2 giao dịch quẹt thẻ 3.200 USD liên tiếp (#TX-904 \u0026 #TX-905, tổng cộng 6.400 USD) tại Lumina Stage \u0026 AV Rentals vào ngày 14/8.","• Trong email giải trình kiểm toán, ông Vance giải thích rằng màn hình LED chính của hội nghị bị cháy nguồn chỉ 4 giờ trước lễ khai mạc, buộc ông phải cho quẹt tách khoản thuê khẩn cấp 6.400 USD thành 2 lần 3.200 USD sau khi máy POS từ chối lệnh quẹt 6.400 USD một lần, đồng thời xác nhận đã trình Biểu mẫu #EX-09 lên bà Lindqvist để xin phê duyệt hồi tố.","PHẦN 2: KÍCH HOẠT TƯ DUY ĐỌC HIỂU \u0026 TỪ VỰNG (ACTIVE RECALL 5 GIÂY)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["Mốc câu hỏi 1 — Nhận diện thuật ngữ Kiểm toán \u0027Split Transactions\u0027 \u0026 \u0027Circumvent\u0027: Động từ \u0027circumvent\u0027 (= bypass / get around / evade: lách luật, vượt rào) luôn đi kèm với \u0027threshold / limit / cap\u0027. Khi thấy 2 giao dịch cùng ngày, cùng nhà cung cấp (#TX-904 \u0026 #TX-905 cùng $3,200 tại Lumina), đó chính là \u0027split transaction\u0027 để lách mốc $5,000.","Question Anchor 1 — Auditing Terms \u0027Split Transactions\u0027 \u0026 \u0027Circumvent\u0027: The verb \u0027circumvent\u0027 (= bypass / get around / evade) pairs with \u0027threshold / limit / cap\u0027. Two same-day charges at the same merchant ($3,200 x 2 = $6,400 at Lumina) are a textbook split transaction bypassing the $5,000 cap."]],[["2. Boi canh \u0026 Quy trinh loi"],["Mốc câu hỏi 2 — Phân biệt \u0027Single-Transaction Limit ($5,000)\u0027 và \u0027Monthly Spending Cap ($20,000)\u0027: Đề thi rất hay gài bẫy lấy tổng hạn mức tháng ($20,000) hoặc số tiền quẹt thực tế ($3,200 / $6,400) để làm nhiễu câu hỏi về hạn mức tối đa cho 1 lần giao dịch.","Question Anchor 2 — \u0027Single-Transaction Limit ($5,000)\u0027 vs. \u0027Monthly Spending Cap ($20,000)\u0027: TOEIC distractors frequently mix up the monthly cycle cap ($20,000) or the actual swipe amounts ($3,200 / $6,400) when asking for the single-transaction limit."]],[["3. Dau vet suy luan cheo"],["Mốc câu hỏi 3 — Kết nối nhân vật \u0027Ms. Lindqvist\u0027 giữa Văn bản 1 và Văn bản 3: Văn bản 3 viết \u0027forwarded the required exception document to Ms. Lindqvist\u0027s office\u0027. Quay lại Văn bản 1, Mục 4 để tìm chức danh của Rachel Lindqvist (VP of Finance) và mã biểu mẫu ngoại lệ (\u0027Policy Exception Form #EX-09\u0027).","Question Anchor 3 — Cross-Referencing \u0027Ms. Lindqvist\u0027 (Passages 1 \u0026 3): Passage 3 states Mr. Vance \u0027forwarded the required exception document to Ms. Lindqvist\u0027s office\u0027. Tracing \u0027Rachel Lindqvist\u0027 back to Passage 1 Section 4 identifies the exact document: \u0027Policy Exception Form (#EX-09)\u0027."]]],"t":"table"},"PHẦN 3: ĐÁP ÁN CHUẨN XÁC \u0026 DẤU VẾT TRUY XUẤT CHÉO","186. According to the policy excerpt, which of the following purchases is prohibited on a Corporate P-Card?","Dap an dung: (C) Airline tickets and hotel rooms for a business trip","[Dau vet bai doc / Clue]: Văn bản 1, Mục 1: \u0027P-Cards may NOT be used for personal expenses, employee travel and hotel lodging (which must be booked through the Concur Travel Card program)...\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027employee travel and hotel lodging\u0027 \u003c-\u003e \u0027Airline tickets and hotel rooms for a business trip\u0027","• \u0027may NOT be used\u0027 \u003c-\u003e \u0027is prohibited\u0027","[Loi giai chi tiet]: Mục 1 quy định rõ thẻ P-Card KHÔNG được dùng cho chi phí đi lại và lưu trú khách sạn của nhân viên (\u0027employee travel and hotel lodging\u0027 = \u0027airline tickets and hotel rooms for a business trip\u0027).","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Promotional banners for an industry trade show","- Ly do sai: Mục 1 nêu rõ thẻ P-Card được phép dùng cho \u0027trade show booth materials\u0027 (vật tư gian hàng triển lãm/băng rôn quảng cáo).","- Bay ETS: Bẫy Khoản Chi Tiêu Hợp Lệ (Authorized Expense Trap)","(B) A monthly subscription for live-streaming software","- Ly do sai: Mục 1 cho phép mua \u0027urgent software subscriptions\u0027 (các gói phần mềm trực tuyến khẩn cấp).","- Bay ETS: Bẫy Hạng mục Được Phép Sử dụng (Permitted Software Trap)","(D) Emergency courier delivery services","- Ly do sai: Khoản chi chuyển phát nhanh khẩn cấp (như giao dịch #TX-908) là chi phí vận hành thường ngày được phép chi trả.","- Bay ETS: Bẫy Chi phí Vận hành Khẩn cấp Thường nhật (Routine Operational Expense Trap)","187. What is the maximum amount a cardholder may spend in a single transaction without prior authorization?","Dap an dung: (B) $5,000.00","[Dau vet bai doc / Clue]: Văn bản 1, Mục 2: \u0027• Single-Transaction Limit: $5,000.00 (including tax and shipping). Purchases reaching or exceeding $5,000.00 must be processed through a standard Purchase Order (PO)... OR receive prior written authorization...\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027Single-Transaction Limit: $5,000.00\u0027 \u003c-\u003e \u0027maximum amount in a single transaction without prior authorization\u0027","[Loi giai chi tiet]: Hạn mức tối đa cho một lần giao dịch (\u0027single-transaction limit\u0027) không cần xin phép trước là 5.000,00 USD.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) $3,200.00","- Ly do sai: 3.200,00 USD là số tiền của mỗi lần quẹt thẻ bị tách nhỏ trên sao kê của ông Vance (#TX-904 và #TX-905), không phải là hạn mức chính sách.","- Bay ETS: Bẫy Con số Giao dịch Thực tế (Actual Split Transaction Amount Trap)","(C) $6,400.00","- Ly do sai: 6.400,00 USD là tổng giá trị hóa đơn thuê màn hình LED của Lumina, con số này đã vượt quá hạn mức.","- Bay ETS: Bẫy Tổng Hóa đơn Vượt Hạn mức (Over-Limit Total Invoice Trap)","(D) $20,000.00","- Ly do sai: 20.000,00 USD là trần chi tiêu cho toàn bộ chu kỳ hàng tháng (\u0027Monthly Cycle Spending Cap\u0027), không phải hạn mức một lần giao dịch.","- Bay ETS: Bẫy Nhầm lẫn Hạn mức Tháng với Hạn mức Giao dịch (Monthly Cap vs. Single Limit Trap)","188. Why were Transactions #TX-904 and #TX-905 flagged by the auditing software?","Dap an dung: (D) A single $6,400.00 purchase was divided into two smaller charges on the same day to bypass the single-swipe limit.","[Dau vet bai doc / Clue]: Văn bản 2 (Statement Alert): \u0027Transactions #TX-904 and #TX-905 were executed at the same merchant on August 14 totaling $6,400.00... FLAGGED (Rule #3)\u0027 đối chiếu Văn bản 1, Mục 3: \u0027Prohibition of Split Transactions: Cardholders are strictly prohibited from dividing a single invoice... into two or more smaller charges (\u0027split transactions\u0027) to circumvent the $5,000.00 single-transaction threshold.\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027dividing a single invoice into two or more smaller charges\u0027 \u003c-\u003e \u0027was divided into two smaller charges\u0027","• \u0027to circumvent the $5,000 threshold\u0027 \u003c-\u003e \u0027to bypass the single-swipe limit\u0027","[Loi giai chi tiet]: Hai giao dịch #TX-904 và #TX-905 bị gắn cờ theo Quy tắc #3 (Cấm chia nhỏ giao dịch) vì hóa đơn 6.400 USD đã bị tách thành 2 lần quẹt 3.200 USD trong cùng ngày 14/8 để vượt qua trần 5.000 USD/lần quẹt.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) They caused Mr. Vance to exceed his $20,000.00 monthly spending limit.","- Ly do sai: Tổng chi tiêu trong kỳ của ông Vance mới là 11.430 USD, vẫn nằm an toàn dưới hạn mức tháng 20.000 USD.","- Bay ETS: Bẫy Mâu thuẫn với Tổng Chi tiêu Sao kê (Monthly Total Contradiction Trap)","(B) The itemized receipts were not uploaded within five business days.","- Ly do sai: Hạn giải trình kiểm toán là ngày 09/9 và ông Vance đã tải biên lai lên hệ thống ngày 03/9, lý do bị gắn cờ là do quẹt tách chứ không phải chậm nộp biên lai.","- Bay ETS: Bẫy Thủ tục Chậm nộp Biên lai Giả định (Receipt Deadline Misdirection Trap)","(C) Lumina Stage \u0026 AV Rentals is an unapproved international merchant.","- Ly do sai: Lumina là nhà cung cấp thiết bị âm thanh ánh sáng địa phương, hoàn toàn không phải nhà cung cấp quốc tế trái phép.","- Bay ETS: Bẫy Quốc tế Hóa Sai lệch (False International Merchant Trap)","189. Why did Mr. Vance rent equipment from Lumina Stage \u0026 AV Rentals on August 14?","Dap an dung: (A) The original stage display broke down shortly before a major conference began.","[Dau vet bai doc / Clue]: Văn bản 3, Đoạn 2: \u0027On the morning of August 14, just four hours before the keynote opening of our Annual Advertisers Summit, the main curved LED backdrop panel at the venue suffered a power-surge failure.\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027main curved LED backdrop panel suffered a power-surge failure\u0027 \u003c-\u003e \u0027The original stage display broke down\u0027","• \u0027four hours before the keynote opening of our Annual Advertisers Summit\u0027 \u003c-\u003e \u0027shortly before a major conference began\u0027","[Loi giai chi tiet]: \u0027The main curved LED backdrop panel... suffered a power-surge failure\u0027 được paraphrase thành \u0027The original stage display broke down\u0027, và \u0027four hours before the keynote opening\u0027 tương ứng với \u0027shortly before a major conference began\u0027.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(B) Apex Banner \u0026 Print Co. failed to deliver the trade show graphics on time.","- Ly do sai: Apex Banner đã giao hàng từ ngày 04/8 (#TX-901) và đã được xác minh hoàn tất, không liên quan đến sự cố màn hình ngày 14/8.","- Bay ETS: Bẫy Đổ lỗi Nhà cung cấp Khác (Other Vendor Blame Trap)","(C) The venue unexpectedly doubled the size of the main auditorium.","- Ly do sai: Hội trường không hề bị tăng gấp đôi diện tích; lý do thuê khẩn cấp là màn hình LED hiện hữu bị cháy nguồn.","- Bay ETS: Bẫy Bịa đặt Mở rộng Hội trường (Auditorium Expansion Trap)","(D) Ms. Lindqvist instructed him to switch to a less expensive equipment provider.","- Ly do sai: Bà Lindqvist không hề can thiệp trước sự việc; ông Vance tự liên hệ Lumina do sự cố khẩn cấp và sau đó mới trình bà Lindqvist xin phê duyệt hồi tố.","- Bay ETS: Bẫy Chỉ đạo Ngược chiều từ Lãnh đạo (Top-Down Directive Trap)","190. What document has Mr. Vance sent to Ms. Lindqvist for signature?","Dap an dung: (A) Policy Exception Form #EX-09","[Dau vet bai doc / Clue]: Văn bản 3, Đoạn 4 (\u0027I have also completed the required exception document and forwarded it to Ms. Lindqvist\u0027s office this morning for her review and signature.\u0027) kết nối Văn bản 1, Mục 4 (\u0027...the cardholder must submit a Policy Exception Form (#EX-09) counter-signed by the Vice President of Finance, Rachel Lindqvist\u0027).","[Dien dat tuong duong / Paraphrase]: • \u0027completed the required exception document and forwarded it to Ms. Lindqvist\u0027s office\u0027 \u003c-\u003e \u0027Policy Exception Form #EX-09\u0027","[Loi giai chi tiet]: Kết nối \u0027the required exception document forwarded to Ms. Lindqvist\u0027 ở Văn bản 3 với quy định tại Mục 4 Văn bản 1 cho thấy tài liệu đó chính là \u0027Policy Exception Form (#EX-09)\u0027.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(B) A Concur Travel Card application","- Ly do sai: Thẻ Concur Travel Card chỉ dùng cho việc đặt vé máy bay và khách sạn, không dùng cho việc xử lý sự cố thiết bị sân khấu.","- Bay ETS: Bẫy Chương trình Thẻ Khác trong Bài (Other Card System Trap)","(C) An annual marketing budget proposal","- Ly do sai: Ông Vance gửi biểu mẫu ngoại lệ chính sách để giải trình kiểm toán, không phải bản đề xuất ngân sách tiếp thị thường niên.","- Bay ETS: Bẫy Ngân sách Marketing Thường niên (Annual Budget Proposal Trap)","(D) A long-term capital equipment lease contract","- Ly do sai: Mục 1 cấm dùng thẻ P-Card cho hợp đồng thuê tài sản thiết bị dài hạn, và ông Vance chỉ thuê khẩn cấp trong ngày diễn ra sự kiện.","- Bay ETS: Bẫy Hợp đồng Thuê Tài sản Vốn Dài hạn (Capital Lease Distractor Trap)","PHẦN 4: PHÂN TÍCH CHUYÊN SÂU — TƯ DUY NGUYÊN BẢN (FIRST PRINCIPLES) \u0026 FEYNMAN","4.1. Sơ đồ Luồng Nghiệp vụ: Kiểm soát Thẻ Mua sắm Doanh nghiệp (P-Card) \u0026 Kiểm toán Giao dịch Chia nhỏ","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","Thiết lập Chốt chặn Hạn mức Thẻ P-Card \u0026 Quy tắc Chống Chia nhỏ Hóa đơn (Policy \u0026 POS Controls)"],[],["BƯỚC 2","Phát sinh Sự cố Khẩn cấp tại Sự kiện \u0026 Quẹt tách Thẻ Vượt rào (Emergency Split-Swipe Execution)"],[],["BƯỚC 3","Giải trình Bằng chứng Hiện trường \u0026 Phê duyệt Hồi tố Cấp Phó Chủ tịch (Retroactive Ratification)"]],[["• Chung tu \u0026 Kenh: Chính sách Tài chính #FIN-402 -\u003e Hệ thống Cổng Thẻ Ngân hàng \u0026 SpendGuard (Văn bản 1)","• Nghiep vu thuc thi: Cài đặt trần cứng 5.000 USD/lần quẹt trên mạng lưới thẻ ngân hàng và cấu hình thuật toán kiểm toán tự động quét các giao dịch trùng mã đơn vị bán hàng (Merchant ID) trong vòng 48 giờ","• Ket qua \u0026 Kiem soat: Quy tắc Kiểm soát Nội bộ Rule #3 (Prohibition of Split Transactions)"],["➔"],["• Chung tu \u0026 Kenh: Hiện trường Hội nghị -\u003e Máy POS của Lumina Stage \u0026 AV Rentals -\u003e Sao kê Ngân hàng (Văn bản 2 \u0026 3)","• Nghiep vu thuc thi: Màn hình LED bị cháy nguồn 4 giờ trước lễ khai mạc; máy POS từ chối quẹt 1 lần 6.400 USD; Giám đốc Sự kiện cho quẹt tách thành 2 lệnh 3.200 USD (#TX-904 \u0026 #TX-905); hệ thống SpendGuard lập tức gắn cờ đỏ FLAGGED (Rule #3)","• Ket qua \u0026 Kiem soat: Cảnh báo Kiểm toán Tự động (System Audit Alert) yêu cầu giải trình trước ngày 09/9"],["➔"],["• Chung tu \u0026 Kenh: Chủ thẻ (Marcus Vance) -\u003e Cổng SpendGuard \u0026 Văn phòng VP of Finance (Rachel Lindqvist)","• Nghiep vu thuc thi: Tải hóa đơn gốc 6.400 USD + biên bản sự cố kỹ thuật tòa nhà lên SpendGuard; lập Biểu mẫu Ngoại lệ #EX-09 trình Phó Chủ tịch Tài chính ký duyệt hồi tố để hợp thức hóa chứng từ kế toán và tránh bị khóa thẻ","• Ket qua \u0026 Kiem soat: Hồ sơ Tuân thủ Đầy đủ (Executed Policy Exception Form #EX-09) được lưu trữ phục vụ kiểm toán"]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["STEP 1","DATA SERVICE INTERRUPTION INCIDENT \u0026 TICKET ESCALATION"],[],["STEP 2","SLA AVAILABILITY COMPUTATION \u0026 LIQUIDATED DAMAGES ASSESSMENT"],[],["STEP 3","PENALTY CREDIT MEMO APPLICATION \u0026 AUTOMATED WIRE OFFSET"]],[["• Documents \u0026 Channels: IT Network Operations Monitoring, Severity-1 Incident Ticket \u0026 Master SLA Contract","• Core Business Execution: Cloud connectivity drops during prime trading hours; network team opens Severity-1 ticket; incident exceeds 60-minute resolution threshold, automatically escalating to VP Operations per contractual SLA matrix.","• Key Deliverable \u0026 Control: Formal escalation activating carrier senior management and contractual penalty liability"],["➔"],["• Documents \u0026 Channels: Telemetry Outage Audit Log, Monthly SLA Performance Report \u0026 AP Penalty Claim","• Core Business Execution: Audit establishes monthly circuit availability dropped to 98.8% (against 99.9% guarantee); calculate contractual liquidated damages: 15% billing penalty ($4,500) applied against monthly recurring service fee.","• Key Deliverable \u0026 Control: Certified SLA Penalty Assessment establishing undisputed financial deduction entitlement"],["➔"],["• Documents \u0026 Channels: Carrier Billing Adjustment Notice, Adjusted Invoice #INV-5501 \u0026 Commercial Bank Wire","• Core Business Execution: Telecom carrier issues $4,500 billing credit adjustment; Accounts Payable applies offset against outstanding service invoice, executing electronic wire for net adjusted balance of $25,500.","• Key Deliverable \u0026 Control: Successful financial recovery of service outage damages and enforced vendor accountability"]]],"t":"table"},"4.2. Giải thích Bản chất theo Tư duy Nguyên bản (First Principles) \u0026 Phương pháp Feynman (Tiếng Việt)","• Bản chất Luồng End-to-End (3 Dòng chảy đồng bộ — Thực thể + Pháp lý/Chứng từ + Ngân hàng/Kế toán): (1) Dòng chảy Vật lý (Physical Flow): Tấm màn hình LED cong tại hội trường bị hỏng do sốc điện 4 tiếng trước giờ khai mạc; nhà cung cấp địa phương Lumina Stage \u0026 AV Rentals chở thiết bị LED thay thế tới hiện trường và chỉ chịu dỡ hàng lắp đặt ngay sau khi thu đủ tiền; (2) Dòng chảy Pháp lý \u0026 Chứng từ (Legal \u0026 Documentary Flow): Hóa đơn gốc hợp nhất trị giá 6.400 USD của Lumina và biên bản xác nhận sự cố của kỹ sư tòa nhà được tải lên cổng SpendGuard, đi kèm Biểu mẫu Ngoại lệ Chính sách (#EX-09) trình Phó Chủ tịch Tài chính ký duyệt hồi tố (retroactive ratification) theo Mục 4 của Quy chế #FIN-402; (3) Dòng chảy Ngân hàng \u0026 Kế toán (Banking \u0026 Accounting Flow): Mạng lưới ngân hàng First Metro chặn lệnh quẹt 6.400 USD do vượt trần 5.000 USD/lần; chủ thẻ quẹt 2 lần 3.200 USD (#TX-904 \u0026 #TX-905) khiến phần mềm kiểm toán tự động phát hiện tổng chi 6.400 USD tại cùng một Merchant ID trong 48 giờ và đóng băng bút toán hạch toán chi phí cho đến khi có chữ ký phê duyệt #EX-09.","• Điểm nghẽn Cốt lõi (Core Bottleneck): Nghịch lý giữa tính cứng nhắc của chốt chặn hạn mức thẻ tự động (Hard POS Single-Swipe Cap $5,000) và nhu cầu xử lý khủng hoảng vận hành theo thời gian thực (Real-time Operational Crisis). Khi sự cố kỹ thuật xảy ra sát giờ khai mạc sự kiện, chủ thẻ không thể chờ quy trình tạo PO trên ERP mất nhiều ngày, dẫn đến hành vi \u0027lách luật thiện chí\u0027 (quẹt tách hóa đơn làm 2 lần) và kích hoạt cảnh báo gian lận kiểm toán nội bộ.","• 3 Giải pháp Hệ thống cho Chuyên viên Phân tích Nghiệp vụ (BA Solutions):","(1) Xây dựng Tính năng Xin nâng Hạn mức Khẩn cấp Thời gian thực qua Ứng dụng Di động (Real-Time Mobile Emergency Limit Override): Khi giao dịch quẹt thẻ bị máy POS từ chối do vượt trần 5.000 USD, hệ thống ngân hàng lập tức đẩy thông báo (Push Notification) tới điện thoại của VP of Finance kèm ảnh chụp hóa đơn hiện trường để bấm duyệt nâng trần tạm thời (One-Time Override Token) trong 60 giây thay vì buộc nhân viên phải quẹt tách hóa đơn.","(2) Cấu hình Thuật toán Phát hiện Giao dịch Chia nhỏ Đa chiều (Multi-Dimensional Split-Transaction Detection Engine): Quét tự động trên bảng sao kê thẻ P-Card dựa trên bộ 3 tiêu chí: Cùng Mã đơn vị chấp nhận thẻ (Merchant Category Code / Merchant Tax ID) + Khoảng cách thời gian \u003c= 48 giờ + Tổng số tiền cộng dồn \u003e= 5.000 USD, tự động khóa trạng thái hoàn ứng cho đến khi đính kèm Form #EX-09.","(3) Số hóa Luồng Phê duyệt Hồi tố \u0026 Liên kết Biên bản Sự cố (Automated Retroactive Exception Workflow): Tích hợp trực tiếp biểu mẫu điện tử #EX-09 ngay trên dòng giao dịch bị gắn cờ đỏ (FLAGGED) trong cổng SpendGuard, tự động định tuyến (route) hồ sơ gồm Hóa đơn gốc + Biên bản sự cố kỹ thuật sang hộp thư phê duyệt chữ ký số của Phó Chủ tịch Tài chính và tự động đếm ngược SLA 7 ngày làm việc.","4.3. Giải thích Chuyên s
