e 2... Approved by: Sophia Campbell, Chief Information Officer, Apex Global Logistics\u0027.","[Dien dat tuong duong / Paraphrase]: • \u0027Approved by: Sophia Campbell, Chief Information Officer\u0027 \u003c-\u003e \u0027Sophia Campbell, the Chief Information Officer\u0027","• \u0027certify that Nexis... successfully met all contractual acceptance criteria\u0027 \u003c-\u003e \u0027confirmed that Nexis... satisfied the requirements\u0027","[Loi giai chi tiet]: Bà Sophia Campbell, Giám đốc Công nghệ Thông tin (CIO) của Apex Global Logistics, là người trực tiếp ký chứng chỉ chấp thuận bàn giao nghiệm thu Mốc 2.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) A commercial escrow officer at First Commercial Bank","- Ly do sai: Cán bộ ngân hàng First Commercial chỉ thực hiện lệnh chuyển khoản sau khi nhận được biên bản nghiệm thu từ Apex, không phải người xác nhận kỹ thuật.","- Bay ETS: Bẫy Đại diện Ngân hàng Thực thi Thanh toán (Escrow Officer Trap)","(B) The lead software architect at Nexis Enterprise Solutions","- Ly do sai: Kiến trúc sư của Nexis là bên nhà thầu thực hiện, không có thẩm quyền ký nghiệm thu chấp thuận sản phẩm thay mặt khách hàng.","- Bay ETS: Bẫy Nhân sự Nhà thầu Thực thi (Vendor Architect Trap)","(D) Marcus Thorne, the Chief Financial Officer","- Ly do sai: Marcus Thorne là Giám đốc Tài chính ký lệnh ủy quyền ngân hàng (Văn bản 3) dựa trên chứng chỉ kỹ thuật do CIO Sophia Campbell đã duyệt trước đó.","- Bay ETS: Bẫy Nhầm lẫn Lãnh đạo Tài chính với Lãnh đạo Kỹ thuật (CFO vs. CIO Trap)","199. How much money will First Commercial Bank wire to Nexis Enterprise Solutions for Milestone 2?","Dap an dung: (B) $237,500.00","[Dau vet bai doc / Clue]: Văn bản 3, Đoạn 2: \u0027• Gross Milestone 2 Valuation: $250,000.00 | • Less: 5% Mandatory Performance Retention: -$12,500.00 | • Net Wire Transfer Authorized for Release: $237,500.00. Please execute an immediate SWIFT wire transfer of $237,500.00...\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027Net Wire Transfer Authorized for Release: $237,500.00\u0027 \u003c-\u003e \u0027wire $237,500.00 to Nexis Enterprise Solutions\u0027","[Loi giai chi tiet]: Tổng giá trị Mốc 2 là 250.000 USD, trừ 5% tiền giữ lại bảo hành (12.500 USD), số tiền thực tế ngân hàng chuyển khoản cho nhà thầu là 237.500,00 USD.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) $100,000.00","- Ly do sai: 100.000,00 USD là giá trị thanh toán của Mốc 1.","- Bay ETS: Bẫy Số tiền Mốc 1 (Milestone 1 Valuation Trap)","(C) $250,000.00","- Ly do sai: 250.000,00 USD là tổng giá trị danh nghĩa của Mốc 2 trước khi khấu trừ 5% tiền giữ lại bảo hành.","- Bay ETS: Bẫy Giá trị Danh nghĩa Chưa Khấu trừ (Gross Milestone Value Trap)","(D) $500,000.00","- Ly do sai: 500.000,00 USD là tổng giá trị toàn bộ hợp đồng tư vấn triển khai ERP.","- Bay ETS: Bẫy Tổng Giá trị Hợp đồng Toàn phần (Total Contract Value Trap)","200. When will Nexis Enterprise Solutions receive the withheld retention funds?","Dap an dung: (C) 90 days after the final system Go-Live, provided no major outages occur","[Dau vet bai doc / Clue]: Văn bản 1, Mục 2: \u0027...released to Nexis Enterprise Solutions exactly 90 calendar days following the final Milestone 3 Go-Live, provided no Level-1 system outages occur.\u0027 kết nối Văn bản 3: \u0027remain in Escrow... until the 90-day post-go-live warranty period concludes next year.\u0027","[Dien dat tuong duong / Paraphrase]: • \u002790 calendar days following the final Milestone 3 Go-Live, provided no Level-1 system outages occur\u0027 \u003c-\u003e \u002790 days after the final system Go-Live, provided no major outages occur\u0027","[Loi giai chi tiet]: Khoản tiền giữ lại bảo hành 5% tích lũy sẽ được giải ngân cho Nexis đúng 90 ngày sau khi hệ thống chính thức Go-Live ở Mốc 3, với điều kiện không xảy ra sự cố gián đoạn hệ thống nghiêm trọng.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Exactly 30 days after Milestone 2 acceptance","- Ly do sai: Mốc 30 ngày là thời điểm nghiệm thu thanh toán cho Mốc 3 sau khi go-live, không phải thời điểm giải ngân tiền bảo hành.","- Bay ETS: Bẫy Thời hạn Nghiệm thu Mốc 3 (Milestone 3 Acceptance Trap)","(B) Upon contract signing and blueprint approval","- Ly do sai: Ký hợp đồng và duyệt blueprint là thời điểm của Mốc 1, lúc này khoản tiền bảo hành mới bắt đầu bị khấu trừ chứ chưa được hoàn trả.","- Bay ETS: Bẫy Thời điểm Khởi động Dự án (Project Kickoff Trap)","(D) As soon as the historical data migration is verified","- Ly do sai: Chuyển đổi dữ liệu chỉ là một hạng mục con trong Mốc 2, không phải mốc giải ngân tiền bảo hành toàn dự án.","- Bay ETS: Bẫy Hạng mục Kỹ thuật Trung gian (Sub-Deliverable Trap)","PHẦN 4: PHÂN TÍCH CHUYÊN SÂU — TƯ DUY NGUYÊN BẢN (FIRST PRINCIPLES) \u0026 FEYNMAN","4.1. Sơ đồ Luồng Nghiệp vụ: Mua sắm Dịch vụ ERP Theo Mốc, Giữ lại Bảo hành \u0026 Giải ngân Ký quỹ Escrow","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","Xác lập Hợp đồng SOW 3 Mốc \u0026 Mở Tài khoản Ký quỹ Escrow Ngân hàng (SOW \u0026 Escrow Account Setup)"],[],["BƯỚC 2","Nghiệm thu Sản phẩm Kỹ thuật \u0026 Ký Chứng chỉ Chấp thuận Bàn giao (Deliverable Acceptance Sign-Off)"],[],["BƯỚC 3","Khấu trừ Tiền Bảo hành \u0026 Phát lệnh Giải ngân Chuyển khoản Ròng (Retention Holdback \u0026 Net Wire)"]],[["• Chung tu \u0026 Kenh: Hợp đồng SOW-ERP-501 -\u003e First Commercial Bank (Văn bản 1)","• Nghiep vu thuc thi: Ký kết phạm vi công việc 500.000 USD chia 3 mốc (20%/50%/30%); mở tài khoản ký quỹ ba bên tại Ngân hàng First Commercial; thiết lập cơ chế giữ lại bảo hành bắt buộc 5% (Retention Holdback) cho mỗi mốc","• Ket qua \u0026 Kiem soat: Bản SOW #ERP-501 + Hợp đồng Ký quỹ Ba bên (Tri-Party Escrow Agreement)"],["➔"],["• Chung tu \u0026 Kenh: Nexis Enterprise Solutions -\u003e Ban Chỉ đạo CNTT Apex (Sophia Campbell) (Văn bản 2)","• Nghiep vu thuc thi: Hoàn tất cấu hình phân hệ tài chính/chuỗi cung ứng, chuyển đổi 3 năm dữ liệu sổ cái và đạt tỷ lệ Pass 100% qua 48 kịch bản kiểm thử UAT; CIO ký Biên bản Chấp thuận Nghiệm thu Mốc 2 vào ngày 12/10","• Ket qua \u0026 Kiem soat: Biên bản Chấp thuận Bàn giao Mốc 2 Đầy đủ Chữ ký Pháp lý"],["➔"],["• Chung tu \u0026 Kenh: CFO Apex (Marcus Thorne) -\u003e Khối Ký quỹ Ngân hàng First Commercial (Văn bản 3)","• Nghiep vu thuc thi: CFO gửi lệnh ủy quyền không hủy ngang ngày 15/10: Yêu cầu ngân hàng chuyển khoản ròng 237.500 USD (giá trị 250.000 USD trừ 5% retention = 12.500 USD) qua điện SWIFT, đồng thời tiếp tục phong tỏa 12.500 USD trong tài khoản ký quỹ","• Ket qua \u0026 Kiem soat: Điện SWIFT MT103 Giải ngân $237,500.00 + Số dư Ký quỹ Bảo hành 5% Được Giữ lại"]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["STEP 1","3-MILESTONE SOW EXECUTION \u0026 TRI-PARTY BANK ESCROW ACCOUNT SETUP"],[],["STEP 2","TECHNICAL DELIVERABLE ACCEPTANCE \u0026 MILESTONE 2 FORMAL SIGN-OFF"],[],["STEP 3","5% RETENTION DEDUCTION \u0026 NET WIRE DISBURSEMENT AUTHORIZATION"]],[["• Documents \u0026 Channels: Statement of Work (SOW #ERP-501), Tri-Party Escrow Agreement \u0026 First Commercial Bank","• Core Business Execution: Execute $500,000 ERP consulting SOW structured across 3 milestones (20% / 50% / 30%); fund dedicated tri-party escrow account at First Commercial Bank; mandate 5% retention holdback deduction across all disbursements.","• Key Deliverable \u0026 Control: Executed SOW #ERP-501 and funded escrow account securing vendor payment and enterprise quality"],["➔"],["• Documents \u0026 Channels: Nexis Enterprise Solutions Completion Dossier, Steering Committee Sign-Off \u0026 UAT Log","• Core Business Execution: Complete finance and supply chain modules, migrate 3 years of legacy ledger data, achieving 100% pass rate across 48 UAT test scenarios; Apex CIO executes formal Milestone 2 Acceptance Certificate on October 12.","• Key Deliverable \u0026 Control: Fully endorsed Milestone 2 Deliverable Acceptance Certificate unlocking payment authorization"],["➔"],["• Documents \u0026 Channels: CFO Wire Authorization (Marcus Thorne) \u0026 First Commercial Bank Escrow Department","• Core Business Execution: CFO issues irrevocable wire release on October 15: instructs bank to wire net $237,500 ($250,000 milestone value less 5% retention holdback = $12,500) via SWIFT, while retaining $12,500 in warranty escrow.","• Key Deliverable \u0026 Control: SWIFT MT103 disbursement confirmation of $237,500 and escrow retention balance maintained"]]],"t":"table"},"4.2. Giải thích Bản chất theo Tư duy Nguyên bản (First Principles) \u0026 Phương pháp Feynman (Tiếng Việt)","• Bản chất Luồng End-to-End (3 Dòng chảy đồng bộ — Thực thể + Pháp lý/Chứng từ + Ngân hàng/Kế toán): (1) Dòng chảy Kỹ thuật \u0026 Thực thi (Technical \u0026 Implementation Flow): Đội ngũ chuyên gia tư vấn Nexis cài đặt và cấu hình hệ thống ERP đám mây, nạp dữ liệu kế toán 3 năm trước vào cơ sở dữ liệu mới và phối hợp với người dùng Apex thực hiện 48 kịch bản kiểm thử chấp nhận (UAT) với kết quả đạt 100%; (2) Dòng chảy Pháp lý \u0026 Nghiệm thu (Legal \u0026 Acceptance Flow): Hợp đồng dịch vụ tư vấn #SOW-ERP-501 quy định giải ngân theo kết quả bàn giao thực tế (Milestone-based Deliverables); CIO Sophia Campbell đại diện bên mua ký Biên bản Nghiệm thu Bàn giao ngày 12/10 xác nhận đủ điều kiện thanh toán Mốc 2; (3) Dòng chảy Ngân hàng \u0026 Kế toán (Banking \u0026 Accounting Flow): Tiền dự án được ký quỹ phong tỏa tại Ngân hàng Thương mại First Commercial; CFO Marcus Thorne phát lệnh ủy quyền không hủy ngang yêu cầu ngân hàng khấu trừ 5% tiền bảo hành (12.500 USD) giữ lại trong tài khoản Escrow và chuyển khoản ròng 237.500 USD qua mạng lưới SWIFT cho nhà thầu, đảm bảo toàn bộ 25.000 USD tiền bảo hành cả dự án chỉ được thanh toán sau 90 ngày vận hành không lỗi nghiêm trọng.","• Điểm nghẽn Cốt lõi (Core Bottleneck): Rủi ro bất cân xứng thông tin và bỏ rơi dự án (Moral Hazard \u0026 Abandonment Risk) trong các dự án công nghệ thông tin quy mô lớn. Nếu chủ đầu tư thanh toán theo thời gian làm việc (Time \u0026 Materials), nhà thầu dễ kéo dài tiến độ; ngược lại nếu trả hết tiền trước khi vận hành, nhà thầu có thể thiếu trách nhiệm khi phát sinh sự cố sau Go-Live. Giải pháp tài chính kết hợp \u0027Thanh toán Theo Mốc Bàn giao\u0027 (Milestone SOW) + \u0027Tài khoản Ký quỹ Phong tỏa\u0027 (Bank Escrow) + \u0027Khấu trừ Giữ lại Bảo hành 5%\u0027 (Retention Holdback 90 days) bảo đảm tối đa sự ràng buộc trách nhiệm kỹ thuật và dòng tiền an toàn cho cả hai bên.","• 3 Giải pháp Hệ thống cho Chuyên viên Phân tích Nghiệp vụ (BA Solutions):","(1) Thiết lập Cổng Nghiệm thu Mốc Tự động Liên kết Kịch bản Kiểm thử (Automated Milestone-to-UAT Gate Engine): Tích hợp phân hệ Quản lý Kiểm thử (Test Management Platform) với hệ thống ERP Quản trị Dự án; chỉ khi 100% kịch bản UAT chuyển trạng thái \u0027Passed\u0027 và 0 lỗi nghiêm trọng (Critical Defects = 0), hệ thống mới tự động mở khóa nút bấm \u0027Ký Biên bản Nghiệm thu Bàn giao\u0027 cho CIO.","(2) Cấu hình Công cụ Tự động Tính Toán Khấu trừ Tiền Bảo hành (Automated Milestone Retention Calculation Rule): Thiết lập quy tắc kế toán trên ERP: Bất kỳ hóa đơn mốc thanh toán nào (Milestone Invoice) khi tạo ra đều tự động phân bổ thành 2 dòng hạch toán: 95% chuyển vào tài khoản Công nợ Nhà thầu Phải trả Ngay và 5% chuyển vào tài khoản Phong tỏa Bảo hành (Retention Escrow Payable).","(3) Kết nối API Ngân hàng Ký quỹ \u0026 Phát lệnh Giải ngân Một chạm (Bank Escrow API Integration): Tích hợp trực tiếp lệnh phê duyệt của CFO với hệ thống ngân hàng ký quỹ First Commercial qua chuẩn bảo mật API; tự động đính kèm chữ ký số của CIO và tự động kích hoạt đếm ngược đồng hồ bảo hành 90 ngày sau sự kiện Go-Live thành công.","4.3. Giải thích Chuyên sâu Song ngữ (Bilingual First Principles \u0026 Feynman Analysis - English)","• End-to-End Flow Nature (3 Synchronized Streams — Physical + Legal/Documentary + Banking/Accounting): (1) Technical \u0026 Implementation Flow: Nexis consultants configure the cloud ERP financials/supply chain modules, migrate 3 years of clean historical ledger records, and execute 48 UAT test scenarios to achieve a 100% pass rate; (2) Legal \u0026 Acceptance Flow: Statement of Work #SOW-ERP-501 ties commercial disbursements to verifiable deliverables; CIO Sophia Campbell executes the formal Deliverable Acceptance Certificate on October 12, creating the legal predicate for Milestone 2 disbursement; (3) Banking \u0026 Accounting Flow: Project capital is held in a tri-party bank escrow at First Commercial Bank; CFO Marcus Thorne transmits an irrevocable release order deducting the 5% retention holdback ($12,500.00) and wiring the net $237,500.00 balance via SWIFT, locking the cumulative $25,000 warranty escrow for 90 days post-go-live.","• Core Bottleneck: Resolving moral hazard and delivery failure in mission-critical corporate IT implementations. If buyers disburse funds upfront, vendors may abandon unresolved post-launch bugs; if buyers delay all payments until the end, vendors face crippling cash-flow deficits. The triad of Milestone Deliverable Acceptance, Bank Escrow Protection, and a 90-Day 5% Retention Holdback aligns vendor performance incentives with corporate operational continuity.","• 3 Systemic BA Solutions:","(1) Automated Milestone-to-UAT Gate Engine: Interface defect-tracking tools with project ERP gates to programmatically block executive sign-off workflows until all Level-1/Level-2 test defects reach verified \u0027Closed\u0027 status.","(2) Automated Milestone Retention Calculation Rule: Program automated financial split logic into vendor billing modules to route 95% of milestone values to active accounts payable and reserve 5% into dedicated retention liability accounts.","(3) Bank Escrow API Integration: Implement direct API bridges between the corporate treasury system and escrow banking partners to automate SWIFT MT103 wire generation upon dual CIO/CFO cryptographic e-signatures while initiating automated 90-day post-go-live retention timers.","PHẦN 5: BẢNG TỪ VỰNG \u0026 CẤU TRÚC CỐT LÕI (8 THUẬT NGỮ MUA SẮM DỊCH VỤ CNTT \u0026 TÀI CHÍNH KÝ QUỸ)","1. Statement of Work (SOW) (n phr)  /ˈsteɪtmənt əv wɜːrk/  = project scope agreement / deliverable specification document","Nghia: Bản tuyên bố phạm vi công việc (văn bản quy định chi tiết đầu việc, mốc tiến độ và điều kiện nghiệm thu)","Vd: Payments are tied strictly to milestones outlined in Statement of Work #SOW-ERP-501. - Các khoản thanh toán được gắn liền chặt chẽ với các mốc quy định trong Bản phạm vi công việc #SOW-ERP-501.","2. deliverable (n)  /dɪˈlɪvərəbl/  = agreed work product / completed milestone output / project artifact","Nghia: Sản phẩm bàn giao (kết quả công việc cụ thể phải nộp để nghiệm thu)","Vd: Milestone 2 payments are released upon sign-off of all required deliverables. - Các khoản thanh toán Mốc 2 được giải ngân khi ký nghiệm thu toàn bộ các sản phẩm bàn giao bắt buộc.","3. User Acceptance Testing (UAT) (n phr)  /ˈjuːzər əkˈseptəns ˈtestɪŋ/  = end-user validation phase / operational scenario testing","Nghia: Kiểm thử chấp nhận của người dùng (giai đoạn người dùng trực tiếp dùng thử để xác nhận phần mềm đạt yêu cầu)","Vd: Deliverable 2C confirmed 100 percent pass rate across 48 UAT operational scenarios. - Sản phẩm 2C xác nhận tỷ lệ đạt 100% qua 48 kịch bản kiểm thử chấp nhận của người dùng (UAT).","4. retention holdback (n phr)  /rɪˈtenʃn ˈhoʊldbæk/  = warranty reserve deduction / withheld performance guarantee fund","Nghia: Khoản tiền giữ lại bảo hành thực hiện hợp đồng","Vd: A mandatory 5% performance retention fee will be withheld from each milestone invoice. - Khoản phí giữ lại bảo hành thực hiện 5% bắt buộc sẽ được khấu trừ từ mỗi hóa đơn thanh toán mốc.","5. escrow account (n phr)  /ˈeskroʊ əˌkaʊnt/  = neutral third-party trust account / pledged bank holding account","Nghia: Tài khoản ký quỹ (tài khoản ngân hàng bên thứ ba phong tỏa tiền cho đến khi hoàn thành điều kiện hợp đồng)","Vd: Funds are administered through an irrevocable bank escrow account at First Commercial Bank. - Nguồn tiền được quản lý qua tài khoản ký quỹ ngân hàng không hủy ngang tại Ngân hàng First Commercial.","6. disburse (v) / disbursement (n)  /dɪsˈbɜːrs/ - /dɪsˈbɜːrsmənt/  = release funds / pay out money / execute authorized transfer","Nghia: Giải ngân / Chi tiền từ tài khoản","Vd: Please accept this memorandum as our formal authorization to disburse funds for Milestone 2. - Vui lòng tiếp nhận bản ghi nhớ này như sự ủy quyền chính thức của chúng tôi để giải ngân tiền cho Mốc 2.","7. Go-Live (n/adj)  /ˈɡoʊ laɪv/  = system deployment date / launch of production operations","Nghia: Đưa hệ thống vào vận hành chính thức (thay thế hệ thống cũ)","Vd: The retention funds will be released 90 days after Milestone 3 Go-Live. - Khoản tiền bảo hành sẽ được giải ngân 90 ngày sau khi Mốc 3 chính thức đưa vào vận hành (Go-Live).","8. outage (n)  /ˈaʊtɪdʒ/  = system downtime / service interruption / operational blackout","Nghia: Sự cố ngừng trệ hệ thống / Mất dịch vụ","Vd: Retention funds are released provided no Level-1 system outages occur. - Tiền bảo hành được giải ngân với điều kiện không xảy ra sự cố ngừng trệ hệ thống Cấp độ 1.","==================================================================================================","BÀI 10: Đối soát Công nợ Phải trả Cuối năm (Year-End Statement of Account Reconciliation), Kiểm toán Bút toán Trùng lặp \u0026 Điện chuyển tiền Đang luân chuyển (Questions 196-200 - Triple Passage)","Nguồn: ETS TOEIC Part 7 — Triple Passage (Vendor Statement of Account, Internal AP Audit Worksheet \u0026 Year-End Settlement E-mail)","PHẦN 1: NỘI DUNG BÀI ĐỌC, CÂU HỎI \u0026 BẢN DỊCH SONG NGỮ","1.1. Đề thi Tiếng Anh gốc (Strategy Guide \u0026 Original ETS Passages)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","Questions 196-200 refer to the following statement of account, audit worksheet, and e-mail.","[Passage 1: Statement of Account — Vendor Annual Accounts Receivable Summary]","APEX INDUSTRIAL PARTS SUPPLY CORP. — STATEMENT OF ACCOUNT (SOA)","Client: Orion Manufacturing Inc. (Attn: Accounts Payable) | Account No.: #CL-4409","Statement Closing Date: December 15 | Annual Audit Reconciliation Cycle","Date — Trans. Type — Reference No. — Description — Debit (Charges) — Credit (Payments) — Balance","Oct 05 — Invoice — #INV-710 — Precision Ball Bearings — $6,500.00 — — — $6,500.00","Oct 28 — Payment — #PMT-801 — Bank Wire Transfer (Settles #INV-710) — — — $6,500.00 — $0.00","Nov 12 — Invoice — #INV-719 — Hydraulic Cylinders (PO #OR-4402) — $3,800.00 — — — $3,800.00","Nov 20 — Invoice — #INV-725 — Industrial Conveyor Belts — $9,800.00 — — — $13,600.00","Dec 02 — Payment — #PMT-844 — Bank ACH Payment (Settles #INV-725) — — — $9,800.00 — $3,800.00","Dec 05 — Invoice — #INV-731 — Hydraulic Cylinders (PO #OR-4402) — $3,800.00 — — — $7,600.00","Dec 09 — Invoice — #INV-738 — CNC Carbide Drill Bits — $10,850.00 — — — $18,450.00","CLOSING STATEMENT BALANCE DUE BY DECEMBER 31: $18,450.00","Please reconcile this statement against your internal purchase ledger and notify us of any discrepancies within 10 business days.","[Passage 2: Internal Audit Worksheet — Orion Accounts Payable Reconciliation]","ORION MANUFACTURING INC. — INTERNAL AP AUDIT RECONCILIATION WORKSHEET","Vendor: Apex Industrial Parts Supply Corp. | Fiscal Year-End Closing Audit","Prepared by: Rachel Bennett, Senior AP Accountant | Date: December 18","Audit Findings on Statement #CL-4409 (Apex Closing Balance: $18,450.00):","1. Discrepancy #1 — Duplicate Invoice Billing (#INV-731: $3,800.00):","Our three-way match records confirm that Purchase Order #OR-4402 (Hydraulic Cylinders) was fulfilled and delivered on November 14 under Goods Receipt #GR-910. Apex properly billed this order under Invoice #INV-719 ($3,800.00) on November 12. Invoice #INV-731 issued on December 5 contains identical line items, part numbers, and references PO #OR-4402. Warehouse receiving logs show no second delivery. Finding: #INV-731 is a duplicate billing and must be voided (-$3,800.00).","2. Discrepancy #2 — Bank Wire in Transit (#PMT-881: $4,200.00):","On December 14, Orion treasury executed a partial payment wire of $4,200.00 via Atlantic Commerce Bank (Federal Wire Ref #FED-091482) to pay down open invoices. Because Apex generated Statement #CL-4409 on December 15 before interbank clearing completed, this credit does not appear on their statement. Finding: In-transit payment must be credited (-$4,200.00).","Reconciliation Summary:","• Apex Billed Balance: $18,450.00","• Less: Duplicate Invoice #INV-731: -$3,800.00","• Less: In-Transit Wire Transfer #PMT-881: -$4,200.00","• TRUE ADJUSTED NET PAYABLE BALANCE: $10,450.00","[Passage 3: E-mail — Year-End Reconciliation \u0026 Final Settlement Payment]","To: ar-reconciliation@apexindustrialparts.com","From: r.bennett@orionmanufacturing.com","Date: December 20","Subject: Statement #CL-4409 Reconciliation \u0026 Year-End Settlement Wire","Dear Apex Credit \u0026 Receivables Team,","We have completed our year-end accounts payable reconciliation for Statement of Account #CL-4409 dated December 15.","Attached is our internal audit worksheet detailing two necessary reconciliations. First, Invoice #INV-731 ($3,800.00) is a duplicate charge for PO #OR-4402, which was previously billed under #INV-719. Please issue a formal cancellation notice voiding #INV-731. Second, our $4,200.00 bank wire (#PMT-881) executed on December 14 crossed in the mail with your statement closing date; your treasury should have received credit confirmation by December 17.","Applying these two adjustments reduces our open payable balance from $18,450.00 to exactly $10,450.00. Earlier today, our corporate treasury scheduled an electronic wire transfer of $10,450.00 (Wire Ref #FED-092201) to settle all remaining open charges for Invoice #INV-719 ($3,800 minus $4,200 partial wire) and Invoice #INV-738 ($10,850).","Please send us an updated, zero-balance Statement of Account by January 10 for our external audit filing.","Sincerely,","Rachel Bennett","Senior Accounts Payable Accountant, Orion Manufacturing Inc.","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","196. What was the total closing balance claimed by Apex Industrial Parts on December 15?","(A) $3,800.00","(B) $10,450.00","(C) $10,850.00","(D) $18,450.00","197. Why did Orion Manufacturing request the cancellation of Invoice #INV-731?","(A) The hydraulic cylinders arrived with damaged packaging.","(B) It was an erroneous duplicate bill for an order already charged under #INV-719.","(C) The purchase order was canceled by the plant manager before shipment.","(D) Apex charged an unauthorized 15% price increase on the drill bits.","198. Why was payment #PMT-881 omitted from the statement of account?","(A) It was sent by check rather than electronic transfer.","(B) Orion Manufacturing\u0027s bank declined the transaction.","(C) It was wired on December 14 and had not cleared before the statement was generated.","(D) Apex Industrial Parts credited the payment to a different client\u0027s account.","199. How much did Orion Manufacturing wire to Apex Industrial Parts on December 20 to settle its account?","(A) $4,200.00","(B) $9,800.00","(C) $10,450.00","(D) $14,250.00","200. What document does Ms. Bennett expect to receive by January 10?","(A) A revised statement of account showing a balance of zero","(B) A price quote for upcoming conveyor belt orders","(C) A signed master procurement contract for next fiscal year","(D) An audited tax return statement from Apex\u0027s certified accountant","1.2. Hướng dẫn làm bài Part 7","CHIẾN THUẬT 5 PHÚT TỐI ƯU: QUÉT 3 ĐIỂM CHẠM, GIẢI ĐỦ 5 CÂU HỎI \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Luồng quy trình Đoạn ba (Quỹ đạo Quét chữ Z \u0026 Bộ lọc 3 Câu hỏi Tiềm thức): • Chiến thuật Đoạn Ba (30 giây = 10s x 3 văn bản) — Quy trình Nghiệp vụ 3 Chặng Khép kín:","- Tuyệt đối KHÔNG đọc sâu thân bài; mắt lướt theo Quỹ đạo hình chữ Z (Z-Pattern Eye Scan) qua 3 điểm chạm:","• Văn bản 1 (Statement of Account - Bảng đối soát công nợ cuối năm từ nhà cung cấp):","- Điểm chạm 1 (Nét ngang trên): Tiêu đề \u0027ANNUAL STATEMENT OF ACCOUNT – ACCOUNTS RECEIVABLE\u0027 -\u003e Trả lời Q1: Bảng kê công nợ phải thu hàng năm do nhà sản xuất gửi khách hàng.","- Điểm chạm 2 (Nét chéo xuống footer): Supplier \u0027Precision Tools Germany\u0027 \u0026 Customer \u0027Titan Manufacturing\u0027 -\u003e Trả lời Q2: Hãng máy cơ khí đối soát công nợ với nhà máy Titan.","- Điểm chạm 3 (Nét móc neo hai đầu): Số dư nhà cung cấp theo dõi (\u0027Total invoices $240,000, payments received $180,000, ending balance due: $60,000\u0027) -\u003e Trả lời Q3: Bên bán theo dõi thấy khách còn nợ số dư cuối năm là $60.000.","• Văn bản 2 (Internal Audit Worksheet - Bảng làm việc kiểm toán công nợ nội bộ):","- Điểm chạm 1 (Nét ngang trên): Tiêu đề \u0027ACCOUNTS PAYABLE INTERNAL RECONCILIATION WORKSHEET\u0027 -\u003e Trả lời Q1: Bảng đối soát kế toán nội bộ của bên mua phân tích chênh lệch công nợ.","- Điểm chạm 2 (Nét chéo xuống footer): Phòng Kế toán Thanh toán Titan Manufacturing -\u003e Trả lời Q2: Kiểm toán nội bộ bên mua rà soát các khoản tiền đã chuyển.","- Điểm chạm 3 (Nét móc neo hai đầu): Phát hiện sai lệch (\u0027Invoice #PT-8890 ($15,000) was paid via wire on Dec 20 but not credited by vendor; net actual balance due is $45,000 ($60k - $15k)\u0027) -\u003e Trả lời Q3: Phát hiện khoản $15.000 đã chuyển ngày 20/12 bên bán chưa kịp hạch toán, số nợ thực tế chỉ là $45.000.","• Văn bản 3 (E-mail - Thư giải trình đối soát \u0026 Ủy nhiệm chi thanh toán dứt điểm):","- Điểm chạm 1 (Nét ngang trên): Dòng \u0027Subject: Year-End Statement Reconciliation \u0026 Final Payment Transfer\u0027 -\u003e Trả lời Q1: Email gửi giải trình đối chiếu công nợ và ủy nhiệm chi chuyển tiền tất toán.","- Điểm chạm 2 (Nét chéo xuống footer): \u0027From: Accounting Controller, Titan\u0027 gửi \u0027Precision Tools AR\u0027 -\u003e Trả lời Q2: Kế toán trưởng bên mua gửi bằng chứng ngân hàng cho bên bán.","- Điểm chạm 3 (Nét móc neo hai đầu): Chốt quyết toán (\u0027attached wire receipt for $15,000 and initiates final wire of $45,000 to fully clear account before Dec 31\u0027) -\u003e Trả lời Q3: Đính kèm lệnh chuyển tiền $15.000 cũ và chuyển nốt $45.000 để tất toán sạch nợ cuối năm.","• Quy trình nghiệp vụ 3 chặng khép kín: Bảng công nợ (Bên bán đòi $60.000) -\u003e Kiểm toán nội bộ (Bên mua tìm thấy lệnh $15.000 chuyển ngày 20/12 chưa hạch toán, nợ thực chỉ còn $45.000) -\u003e Tất toán (Email: Gửi bằng chứng $15.000 và chuyển nốt $45.000 để xóa nợ).","=\u003e Chốt luồng sự việc sau 30s: Nhà cung cấp gửi bảng đòi nợ $60.000 cuối năm; kế toán Titan đối soát tìm ra khoản $15.000 đã chuyển ngày 20/12 nhưng bên bán chưa ghi nhận, nên gửi thư giải trình kèm ủy nhiệm chi chuyển nốt $45.000 để tất toán sạch nợ.","Bước 2 (20 giây) - Quét nhanh 5 câu hỏi \u0026 Phân loại (Chỉ đọc câu hỏi, KHÔNG đọc 4 đáp án A, B, C, D): • Nguyên tắc đọc Bước 2 (3-4 giây/câu): Lướt nhanh cả 5 câu hỏi trước để gắn \u00275 móc từ khóa\u0027 vào bộ nhớ tạm rồi mới giải cuốn chiếu; TUYỆT ĐỐI CHỈ ĐỌC CÂU HỎI, KHÔNG ĐỌC 4 ĐÁP ÁN (A, B, C, D) để tránh nhiễu 15 phương án bẫy:","Bước 1 — Đọc lướt câu hỏi (60 giây): Đọc nhanh 5 câu (196-200). Câu 196 hỏi số dư cuối kỳ mà nhà cung cấp Apex Industrial Parts đòi thanh toán trên Bảng sao kê tài khoản (Văn bản 1); Câu 197 hỏi khoản mục nào trên Bảng sao kê là một hóa đơn bị lập trùng lặp (Kết nối Văn bản 1 và Văn bản 2); Câu 198 hỏi tại sao khoản thanh toán $4,200 (Mã #PMT-881) lại chưa xuất hiện trên Bảng sao kê tài khoản của nhà cung cấp (Văn bản 2 \u0026 3); Câu 199 hỏi số tiền thực tế đúng nhất mà công ty mua hàng Orion Manufacturing sẽ chuyển khoản để tất toán số dư cuối năm (Kết nối phép tính đối soát công nợ ở Văn bản 2 và Văn bản 3); Câu 200 hỏi tập đoàn Orion Manufacturing yêu cầu Apex gửi lại tài liệu gì trước ngày 10/1 năm sau (Văn bản 3).","Bước 3 (3 phút 45 giây) - Cách trả lời \u0026 Dấu hiệu tìm nhanh nhất cho đủ 5 câu hỏi (Giải cuốn chiếu \u0026 Chốt đáp án từng câu): Bước 2 — Đọc Văn bản 1 (80 giây): Quét Bảng Sao kê Tài khoản Công nợ Cuối năm (Year-End Statement of Account - SOA) do Apex Industrial Parts gửi Orion Manufacturing ngày 15/12. Chú ý số dư đầu kỳ $0, danh sách 5 hóa đơn tháng 10-12 (#INV-710, #INV-719, #INV-725, #INV-731, #INV-738) trừ 2 khoản thanh toán đã nhận (#PMT-801 $6,500 và #PMT-844 $9,800), đưa ra Số dư Nợ cuối kỳ đòi thanh toán là $18,450.00.","Bước 3 — Đọc Văn bản 2 \u0026 3 (100 giây): Văn bản 2 là Bảng Kiểm toán Đối soát Sổ cái Phải trả (AP Ledger Audit Worksheet) của Kế toán trưởng Orion: phát hiện (1) Hóa đơn #INV-731 ($3,800) bị lập trùng lặp hoàn toàn với Hóa đơn #INV-719 (cùng 1 đơn hàng PO #OR-4402 đã nhận ngày 14/11) nên phải hủy bỏ; (2) Khoản chuyển khoản ngân hàng $4,200 (Mã #PMT-881) thực hiện ngày 14/12 đang trong trạng thái luân chuyển (in-transit wire) nên nhà cung cấp chưa kịp ghi nhận trước ngày chốt sổ 15/12. Phép tính điều chỉnh: $18,450 (Đòi ban đầu) - $3,800 (Hóa đơn trùng) - $4,200 (Tiền đang chuyển) = $10,450.00. Văn bản 3 là email của Orion gửi Apex xác nhận đã phát lệnh chuyển nốt $10,450 vào ngày 22/12 và yêu cầu Apex phát hành Bảng xác nhận Công nợ bằng 0 (Zero-Balance SOA) trước ngày 10/1 để phục vụ kiểm toán độc lập.","Bước 4 (25 giây cuối giờ thi + Củng cố sau giờ thi) - Kiểm tra khóa đáp án \u0026 Đúc kết Feynman 1 câu: Bước 4 — Đối chiếu \u0026 Khoanh đáp án (60 giây): Khớp số liệu toán học đối soát $18,450 - $3,800 - $4,200 = $10,450 và các mốc thời gian chứng từ để chọn đáp án chuẩn xác.","1.3. Dịch Song ngữ Xen kẽ Từng Câu (Sentence-by-Sentence Translation)","[Văn bản 1: Bảng Sao kê Tài khoản — Tổng kết Công nợ Phải thu Thường niên của Nhà cung cấp]","APEX INDUSTRIAL PARTS SUPPLY CORP. — STATEMENT OF ACCOUNT (SOA)","Client: Orion Manufacturing Inc. (Attn: Accounts Payable) | Account No.: #CL-4409","Statement Closing Date: December 15 | Annual Audit Reconciliation Cycle","TẬP ĐOÀN CUNG ỨNG PHỤ TÙNG CÔNG NGHIỆP APEX — BẢNG SAO KÊ TÀI KHOẢN (SOA)","Khách hàng: Orion Manufacturing Inc. (Kính gửi: Phòng Kế toán Phải trả) | Số tài khoản: #CL-4409","Ngày chốt sao kê: 15 tháng 12 | Chu kỳ Đối soát Kiểm toán Thường niên","Date — Trans. Type — Reference No. — Description — Debit (Charges) — Credit (Payments) — Balance","Oct 05 — Invoice — #INV-710 — Precision Ball Bearings — $6,500.00 — — — $6,500.00","Oct 28 — Payment — #PMT-801 — Bank Wire Transfer (Settles #INV-710) — — — $6,500.00 — $0.00","Nov 12 — Invoice — #INV-719 — Hydraulic Cylinders (PO #OR-4402) — $3,800.00 — — — $3,800.00","Nov 20 — Invoice — #INV-725 — Industrial Conveyor Belts — $9,800.00 — — — $13,600.00","Dec 02 — Payment — #PMT-844 — Bank ACH Payment (Settles #INV-725) — — — $9,800.00 — $3,800.00","Dec 05 — Invoice — #INV-731 — Hydraulic Cylinders (PO #OR-4402) — $3,800.00 — — — $7,600.00","Dec 09 — Invoice — #INV-738 — CNC Carbide Drill Bits — $10,850.00 — — — $18,450.00","Ngày — Loại GD — Mã Tham chiếu — Diễn giải — Ghi Nợ (Phát sinh) — Ghi Có (Thanh toán) — Số dư","05/10 — Hóa đơn — #INV-710 — Vòng bi Chính xác — 6.500,00 USD — — — 6.500,00 USD","28/10 — Thanh toán — #PMT-801 — Chuyển khoản Ngân hàng (Tất toán #INV-710) — — — 6.500,00 USD — 0,00 USD","12/11 — Hóa đơn — #INV-719 — Xi lanh Thủy lực (PO #OR-4402) — 3.800,00 USD — — — 3.800,00 USD","20/11 — Hóa đơn — #INV-725 — Băng chuyền Công nghiệp — 9.800,00 USD — — — 13.600,00 USD","02/12 — Thanh toán — #PMT-844 — Chuyển khoản ACH (Tất toán #INV-725) — — — 9.800,00 USD — 3.800,00 USD","05/12 — Hóa đơn — #INV-731 — Xi lanh Thủy lực (PO #OR-4402) — 3.800,00 USD — — — 7.600,00 USD","09/12 — Hóa đơn — #INV-738 — Mũi khoan Hợp kim CNC — 10.850,00 USD — — — 18.450,00 USD","CLOSING STATEMENT BALANCE DUE BY DECEMBER 31: $18,450.00","Please reconcile this statement against your internal purchase ledger and notify us of any discrepancies within 10 business days.","SỐ DƯ CUỐI KỲ PHẢI THANH TOÁN TRƯỚC NGÀY 31 THÁNG 12: 18.450,00 USD","Vui lòng đối soát bảng sao kê này với sổ cái mua hàng nội bộ của quý vị và thông báo cho chúng tôi bất kỳ sai lệch nào trong vòng 10 ngày làm việc.","[Văn bản 2: Bảng Kiểm toán Nội bộ — Đối soát Sổ cái Phải trả của Orion]","ORION MANUFACTURING INC. — INTERNAL AP AUDIT RECONCILIATION WORKSHEET","Vendor: Apex Industrial Parts Supply Corp. | Fiscal Year-End Closing Audit","Prepared by: Rachel Bennett, Senior AP Accountant | Date: December 18","ORION MANUFACTURING INC. — BẢNG ĐỐI SOÁT KIỂM TOÁN CÔNG NỢ PHẢI TRẢ NỘI BỘ","Nhà cung cấp: Tập đoàn Cung ứng Phụ tùng Công nghiệp Apex | Kiểm toán Khóa sổ Cuối Năm Tài chính","Người lập: Rachel Bennett, Kế toán viên Cấp cao Phải trả | Ngày: 18 tháng 12","Audit Findings on Statement #CL-4409 (Apex Closing Balance: $18,450.00):","1. Discrepancy #1 — Duplicate Invoice Billing (#INV-731: $3,800.00):","Our three-way match records confirm that Purchase Order #OR-4402 (Hydraulic Cylinders) was fulfilled and delivered on November 14 under Goods Receipt #GR-910. Apex properly billed this order under Invoice #INV-719 ($3,800.00) on November 12. Invoice #INV-731 issued on December 5 contains identical line items, part numbers, and references PO #OR-4402. Warehouse receiving logs show no second delivery. Finding: #INV-731 is a duplicate billing and must be voided (-$3,800.00).","Kết quả Kiểm toán trên Bảng sao kê #CL-4409 (Số dư Cuối kỳ của Apex: 18.450,00 USD):","1. Sai lệch #1 — Lập Hóa đơn Trùng lặp (#INV-731: 3.800,00 USD):","Hồ sơ đối soát 3 chiều của chúng tôi xác nhận Đơn đặt hàng #OR-4402 (Xi lanh Thủy lực) đã được thực hiện và bàn giao vào ngày 14/11 theo Biên bản Nhận hàng #GR-910. Apex đã xuất hóa đơn đúng cho đơn này theo Hóa đơn #INV-719 (3.800,00 USD) vào ngày 12/11. Hóa đơn #INV-731 phát hành ngày 05/12 chứa các dòng mặt hàng, mã phụ tùng giống hệt và cùng tham chiếu PO #OR-4402. Nhật ký kho hàng không ghi nhận đợt giao hàng thứ hai. Kết luận: #INV-731 là hóa đơn tính cước trùng lặp và phải bị hủy bỏ (-3.800,00 USD).","2. Discrepancy #2 — Bank Wire in Transit (#PMT-881: $4,200.00):","On December 14, Orion treasury executed a partial payment wire of $4,200.00 via Atlantic Commerce Bank (Federal Wire Ref #FED-091482) to pay down open invoices. Because Apex generated Statement #CL-4409 on December 15 before interbank clearing completed, this credit does not appear on their statement. Finding: In-transit payment must be credited (-$4,200.00).","2. Sai lệch #2 — Điện chuyển tiền Ngân hàng Đang luân chuyển (#PMT-881: 4.200,00 USD):","Vào ngày 14/12, khối ngân quỹ Orion đã thực hiện lệnh chuyển khoản thanh toán một phần trị giá 4.200,00 USD qua Ngân hàng Thương mại Atlantic (Mã điện chuyển tiền Fedwire #FED-091482) để giảm trừ các hóa đơn còn mở. Bởi vì Apex lập Bảng sao kê #CL-4409 vào ngày 15/12 trước khi quá trình bù trừ liên ngân hàng hoàn tất, khoản ghi có này chưa xuất hiện trên sao kê của họ. Kết luận: Khoản thanh toán đang trên đường chuyển phải được ghi nhận giảm trừ (-4.200,00 USD).","Reconciliation Summary:","• Apex Billed Balance: $18,450.00","• Less: Duplicate Invoice #INV-731: -$3,800.00","• Less: In-Transit Wire Transfer #PMT-881: -$4,200.00","• TRUE ADJUSTED NET PAYABLE BALANCE: $10,450.00","Tổng kết Đối soát:","• Số dư Apex Yêu cầu Thanh toán: 18.450,00 USD","• Trừ: Hóa đơn Trùng lặp #INV-731: -3.800,00 USD","• Trừ: Điện Chuyển tiền Đang luân chuyển #PMT-881: -4.200,00 USD","• SỐ DƯ PHẢI TRẢ RÒNG ĐÃ ĐIỀU CHỈNH CHUẨN XÁC: 10.450,00 USD","[Văn bản 3: Email — Đối soát Cuối năm \u0026 Quyết toán Thanh toán Dứt điểm]","To: ar-reconciliation@apexindustrialparts.com","From: r.bennett@orionmanufacturing.com","Date: December 20","Subject: Statement #CL-4409 Reconciliation \u0026 Year-End Settlement Wire","Tới: ar-reconciliation@apexindustrialparts.com","Từ: r.bennett@orionmanufacturing.com","Ngày: 20 tháng 12","Chủ đề: Đối soát Sao kê #CL-4409 \u0026 Điện chuyển tiền Quyết toán Cuối năm","Dear Apex Credit \u0026 Receivables Team,","We have completed our year-end accounts payable reconciliation for Statement of Account #CL-4409 dated December 15.","Attached is our internal audit worksheet detailing two necessary reconciliations. First, Invoice #INV-731 ($3,800.00) is a duplicate charge for PO #OR-4402, which was previously billed under #INV-719. Please issue a formal cancellation notice voiding #INV-731. Second, our $4,200.00 bank wire (#PMT-881) executed on December 14 crossed in the mail with your statement closing date; your treasury should have received credit confirmation by December 17.","Kính gửi Đội ngũ Tín dụng \u0026 Phải thu Apex,","Chúng tôi đã hoàn tất việc đối soát công nợ phải trả cuối năm cho Bảng sao kê tài khoản #CL-4409 ngày 15 tháng 12.","Đính kèm là bảng kiểm toán nội bộ của chúng tôi chi tiết hai điểm điều chỉnh cần thiết. Thứ nhất, Hóa đơn #INV-731 (3.800,00 USD) là khoản tính cước trùng lặp cho PO #OR-4402 vốn đã được tính trước đó theo #INV-719. Vui lòng phát hành thông báo hủy bỏ chính thức vô hiệu hóa #INV-731. Thứ hai, lệnh chuyển tiền ngân hàng 4.200,00 USD của chúng tôi (#PMT-881) thực hiện ngày 14/12 đã bị lệch thời điểm với ngày chốt sao kê của quý vị; ngân quỹ của quý vị đáng lẽ đã nhận được xác nhận ghi có trước ngày 17/12.","Applying these two adjustments reduces our open payable balance from $18,450.00 to exactly $10,450.00. Earlier today, our corporate treasury scheduled an electronic wire transfer of $10,450.00 (Wire Ref #FED-092201) to settle all remaining open charges for Invoice #INV-719 ($3,800 minus $4,200 partial wire) and Invoice #INV-738 ($10,850).","Please send us an updated, zero-balance Statement of Account by January 10 for our external audit filing.","Sincerely,","Rachel Bennett, Senior Accounts Payable Accountant, Orion Manufacturing Inc.","Áp dụng hai khoản điều chỉnh này giúp giảm số dư công nợ còn mở của chúng tôi từ 18.450,00 USD xuống đúng 10.450,00 USD. Sáng sớm hôm nay, khối ngân quỹ doanh nghiệp của chúng tôi đã lên lịch lệnh chuyển khoản điện tử 10.450,00 USD (Mã Fedwire #FED-092201) để tất toán toàn bộ các khoản nợ còn lại cho Hóa đơn #INV-719 (3.800 trừ 4.200 tiền chuyển trước đó) và Hóa đơn #INV-738 (10.850 USD).","Vui lòng gửi cho chúng tôi Bảng sao kê tài khoản cập nhật có số dư bằng 0 trước ngày 10 tháng 1 để phục vụ hồ sơ kiểm toán độc lập bên ngoài của chúng tôi.","Trân trọng,","Rachel Bennett, Kế toán viên Cấp cao Phải trả, Orion Manufacturing Inc.","1.4. Dịch chi tiết Câu hỏi \u0026 Phương án Trắc nghiệm","Câu 196. Tổng số dư nợ cuối kỳ mà Apex Industrial Parts yêu cầu thanh toán vào ngày 15 tháng 12 là bao nhiêu?","(A) 3.800,00 USD","(B) 10.450,00 USD","(C) 10.850,00 USD","(D) 18.450,00 USD","Câu 197. Tại sao Orion Manufacturing lại yêu cầu hủy bỏ Hóa đơn #INV-731?","(A) Các xi lanh thủy lực được chuyển đến với bao bì bị hư hỏng.","(B) Đó là hóa đơn bị lập trùng lặp do sai sót cho một đơn hàng đã được tính tiền theo mã #INV-719.","(C) Đơn đặt hàng đã bị giám đốc nhà máy hủy bỏ trước khi hàng được gửi đi.","(D) Apex đã tính tăng giá 15% trái phép đối với các mũi khoan hợp kim.","Câu 198. Tại sao khoản thanh toán #PMT-881 lại bị bỏ sót trên bảng sao kê tài khoản?","(A) Khoản thanh toán được gửi bằng séc thay vì chuyển khoản điện tử.","(B) Ngân hàng của Orion Manufacturing đã từ chối giao dịch.","(C) Lệnh chuyển tiền được thực hiện vào ngày 14 tháng 12 và chưa kịp bù trừ xong trước khi bảng sao kê được xuất ra.","(D) Apex Industrial Parts đã ghi có nhầm khoản thanh toán vào tài khoản của một khách hàng khác.","Câu 199. Orion Manufacturing đã chuyển khoản bao nhiêu tiền cho Apex Industrial Parts vào ngày 20 tháng 12 để tất toán tài khoản của mình?","(A) 4.200,00 USD","(B) 9.800,00 USD","(C) 10.450,00 USD","(D) 14.250,00 USD","Câu 200. Bà Bennett mong đợi nhận được tài liệu nào trước ngày 10 tháng 1?","(A) Bảng sao kê tài khoản được cập nhật thể hiện số dư bằng 0","(B) Bảng báo giá cho các đơn đặt hàng băng chuyền sắp tới","(C) Hợp đồng mua sắm khung đã ký cho năm tài chính tiếp theo","(D) Bản sao kê khai thuế đã kiểm toán từ kế toán công chứng của Apex","1.5. Tóm tắt Viết lại Toàn bài theo Feynman (Feynman Monograph Summary)","English Executive Summary:","• On December 15, vendor Apex Industrial Parts issues annual Statement of Account #CL-4409 to Orion Manufacturing demanding a closing balance of $18,450.00.","• Senior AP Accountant Rachel Bennett audits the statement against internal ERP records, uncovering two discrepancies: (1) Invoice #INV-731 ($3,800.00) is an erroneous duplicate bill for PO #OR-4402, which was already invoiced under #INV-719; (2) A $4,200.00 bank wire (#PMT-881) executed on December 14 was in transit and missed the statement cutoff date.","• Correcting both items ($18,450 - $3,800 duplicate - $4,200 in-transit) adjusts the net open payable balance to $10,450.00.","• On December 20, Orion wires $10,450.00 to fully settle its account and requests a zero-balance Statement of Account by January 10 for external audit compliance.","Bản tóm tắt Tiếng Việt cốt lõi:","• Ngày 15/12, nhà cung cấp Apex Industrial Parts gửi Bảng sao kê tài khoản thường niên #CL-4409 cho Orion Manufacturing yêu cầu thanh toán số dư nợ 18.450,00 USD.","• Kế toán viên Cấp cao Phải trả Rachel Bennett tiến hành kiểm toán đối soát với sổ cái ERP nội bộ và phát hiện hai sai lệch: (1) Hóa đơn #INV-731 (3.800,00 USD) là hóa đơn lập trùng lặp cho đơn PO #OR-4402 vốn đã được tính cước theo mã #INV-719; (2) Khoản chuyển khoản 4.200,00 USD (#PMT-881) thực hiện ngày 14/12 đang luân chuyển trên mạng liên ngân hàng nên chưa kịp vào sao kê chốt ngày 15/12.","• Sau khi điều chỉnh (18.450 - 3.800 hóa đơn trùng - 4.200 tiền đang chuyển), số dư nợ thực tế giảm về 10.450,00 USD.","• Ngày 20/12, Orion chuyển khoản nốt 10.450,00 USD để tất toán sạch nợ và yêu cầu Apex gửi lại Bảng sao kê có số dư bằng 0 trước ngày 10/1 để phục vụ kiểm toán độc lập.","PHẦN 2: KÍCH HOẠT TƯ DUY ĐỌC HIỂU \u0026 TỪ VỰNG (ACTIVE RECALL 5 GIÂY)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["Mốc câu hỏi 1 — Phát hiện Bút toán Trùng lặp (Duplicate Billing): So sánh Văn bản 1 dòng ngày Nov 12 (#INV-719: $3,800 PO #OR-4402) với dòng ngày Dec 05 (#INV-731: $3,800 PO #OR-4402). Cùng mã PO, cùng số tiền, cùng tên hàng mà kho chỉ nhận 1 lần giao hàng duy nhất -\u003e Hóa đơn #INV-731 là hóa đơn trùng bắt buộc phải hủy (voided).","Question Anchor 1 — Catching Duplicate Billing: Comparing Nov 12 (#INV-719: $3,800 PO #OR-4402) with Dec 05 (#INV-731: $3,800 PO #OR-4402) reveals identical items and PO numbers. Warehouse logs confirm a single shipment, proving #INV-731 is an invalid duplicate."]],[["2. Boi canh \u0026 Quy trinh loi"],["Mốc câu hỏi 2 — Thuật ngữ \u0027Bank Wire in Transit\u0027 (Tiền đang trên đường chuyển): Khi chuyển tiền ngày 14/12 nhưng nhà cung cấp chốt sao kê ngày 15/12, tiền liên ngân hàng chưa bù trừ xong (\u0027crossed in the mail / in transit\u0027) nên sao kê chưa ghi nhận Có.","Question Anchor 2 — \u0027Bank Wire in Transit\u0027 Timing Mismatch: Payment executed December 14 crossed with the vendor\u0027s December 15 statement closing date, explaining why #PMT-881 was omitted from the statement."]],[["3. Dau vet suy luan cheo"],["Mốc câu hỏi 3 — Phép tính Đối soát Cuối kỳ: $18,450 (Số dư đòi) - $3,800 (Hóa đơn trùng) - $4,200 (Tiền chuyển đang luân chuyển) = $10,450.00 (Số tiền thực chuyển ngày 20/12).","Question Anchor 3 — Final Reconciliation Equation: $18,450 (Billed SOA) - $3,800 (Duplicate) - $4,200 (In-transit wire) = $10,450.00 (Exact settlement wire executed Dec 20)."]]],"t":"table"},"PHẦN 3: ĐÁP ÁN CHUẨN XÁC \u0026 DẤU VẾT TRUY XUẤT CHÉO","196. What was the total closing balance claimed by Apex Industrial Parts on December 15?","Dap an dung: (D) $18,450.00","[Dau vet bai doc / Clue]: Văn bản 1, Dòng chốt bảng sao kê: \u0027CLOSING STATEMENT BALANCE DUE BY DECEMBER 31: $18,450.00\u0027.","[Dien dat tuong duong / Paraphrase]: • \u0027CLOSING STATEMENT BALANCE DUE\u0027 \u003c-\u003e \u0027total closing balance claimed by Apex Industrial Parts\u0027","[Loi giai chi tiet]: Trên Bảng sao kê tài khoản chốt ngày 15/12 (Văn bản 1), số dư cuối kỳ mà nhà cung cấp Apex Industrial Parts yêu cầu thanh toán là 18.450,00 USD.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) $3,800.00","- Ly do sai: 3.800,00 USD là số tiền của Hóa đơn #INV-719 và hóa đơn lập trùng #INV-731.","- Bay ETS: Bẫy Giá trị Khoản mục Đơn lẻ (Single Invoice Trap)","(B) $10,450.00","- Ly do sai: 10.450,00 USD là số dư thực tế sau khi kế toán Orion đã đối soát và điều chỉnh trừ đi các lỗi sai, không phải con số mà Apex đòi ban đầu.","- Bay ETS: Bẫy Số dư Đã Điều chỉnh (Adjusted Net Payable Trap)","(C) $10,850.00","- Ly do sai: 10.850,00 USD là số tiền của Hóa đơn #INV-738 (mũi khoan CNC).","- Bay ETS: Bẫy Giá trị Hóa đơn Riêng lẻ (Line Item Value Trap)","197. Why did Orion Manufacturing request the cancellation of Invoice #INV-731?","Dap an dung: (B) It was an erroneous duplicate bill for an order already charged under #INV-719.","[Dau vet bai doc / Clue]: Văn bản 2, Mục 1: \u0027...Purchase Order #OR-4402 (Hydraulic Cylinders) was fulfilled and delivered on November 14... Apex properly billed this order under Invoice #INV-719 ($3,800.00)... Invoice #INV-731 issued on December 5 contains identical line items... Warehouse receiving logs show no second delivery. Finding: #INV-731 is a duplicate billing and must be voided.\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027INV-731 is a duplicate billing and must be voided\u0027 \u003c-\u003e \u0027an erroneous duplicate bill for an order already charged under #INV-719\u0027","[Loi giai chi tiet]: Hóa đơn #INV-731 tính tiền cùng một đơn hàng xi lanh thủy lực PO #OR-4402 đã được tính tiền trước đó trên Hóa đơn #INV-719, trong khi kho chỉ nhận một chuyến hàng duy nhất, do đó đây là lỗi xuất hóa đơn trùng lặp.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) The hydraulic cylinders arrived with damaged packaging.","- Ly do sai: Hàng hóa xi lanh thủy lực đã được nhận nguyên vẹn từ ngày 14/11 theo biên bản #GR-910, không có báo cáo bao bì hư hỏng.","- Bay ETS: Bẫy Lỗi Bao bì Hư hỏng Tưởng tượng (Damaged Goods Fabrication Trap)","(C) The purchase order was canceled by the plant manager before shipment.","- Ly do sai: Đơn đặt hàng PO #OR-4402 không bị hủy mà đã được giao nhận và đưa vào sản xuất từ tháng 11.","- Bay ETS: Bẫy Hủy Đơn hàng Trái ngược Sự thật (Canceled PO Contradiction Trap)","(D) Apex charged an unauthorized 15% price increase on the drill bits.","- Ly do sai: Hóa đơn mũi khoan CNC là #INV-738 ($10,850), hoàn toàn không liên quan đến Hóa đơn #INV-731 ($3,800).","- Bay ETS: Bẫy Tăng giá Mũi khoan Sai lệch Khoản mục (Price Hike Line-Item Trap)","198. Why was payment #PMT-881 omitted from the statement of account?","Dap an dung: (C) It was wired on December 14 and had not cleared before the statement was generated.","[Dau vet bai doc / Clue]: Văn bản 2, Mục 2: \u0027On December 14, Orion treasury executed a partial payment wire of $4,200.00... Because Apex generated Statement #CL-4409 on December 15 before interbank clearing completed, this credit does not appear on their statement.\u0027 kết nối Văn bản 3: \u0027crossed in the mail with your statement closing date\u0027.","[Dien dat tuong duong / Paraphrase]: • \u0027executed on December 14... before interbank clearing completed\u0027 \u003c-\u003e \u0027wired on December 14 and had not cleared before the statement was generated\u0027","[Loi giai chi tiet]: Lệnh chuyển tiền 4.200 USD được thực hiện ngày 14/12, trong khi bảng sao kê của Apex được xuất ngày 15/12 trước khi tiền hoàn tất bù trừ liên ngân hàng, dẫn đến việc bị bỏ sót trên sao kê.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) It was sent by check rather than electronic transfer.","- Ly do sai: Khoản thanh toán được thực hiện bằng điện chuyển khoản ngân hàng trực tuyến (Federal Wire Ref #FED-091482), không phải trả bằng séc giấy.","- Bay ETS: Bẫy Hình thức Thanh toán Bằng Séc (Paper Check Distractor Trap)","(B) Orion Manufacturing\u0027s bank declined the transaction.","- Ly do sai: Giao dịch đã được ngân hàng Atlantic xử lý thành công và gửi đi, không hề bị từ chối.","- Bay ETS: Bẫy Ngân hàng Từ chối Giao dịch Sai sự thật (Bank Rejection Trap)","(D) Apex Industrial Parts credited the payment to a different client\u0027s account.","- Ly do sai: Khoản tiền chưa vào sổ của Apex là do độ trễ thời gian luân chuyển liên ngân hàng chứ không phải do Apex ghi nhầm sang tài khoản khách khác.","- Bay ETS: Bẫy Ghi nhầm Tài khoản Khách hàng (Misposted Payment Trap)","199. How much did Orion Manufacturing wire to Apex Industrial Parts on December 20 to settle its account?","Dap an dung: (C) $10,450.00","[Dau vet bai doc / Clue]: Văn bản 3, Đoạn 2: \u0027Applying these two adjustments reduces our open payable balance from $18,450.00 to exactly $10,450.00. Earlier today, our corporate treasury scheduled an electronic wire transfer of $10,450.00 (Wire Ref #FED-092201) to settle all remaining open charges...\u0027","[Dien dat tuong duong / Paraphrase]: • Phép tính đối soát: $18,450.00 (Số dư đòi ban đầu) - $3,800.00 (Hóa đơn trùng #INV-731) - $4,200.00 (Tiền đang luân chuyển #PMT-881) = $10,450.00","[Loi giai chi tiet]: Sau khi trừ hóa đơn trùng lặp 3.800 USD và khoản tiền 4.200 USD đã chuyển trước đó, số tiền chính xác mà Orion chuyển khoản vào ngày 20/12 để thanh toán dứt điểm là 10.450,00 USD.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) $4,200.00","- Ly do sai: 4.200,00 USD là khoản tiền chuyển trước đó vào ngày 14/12 (#PMT-881).","- Bay ETS: Bẫy Khoản Chuyển tiền Trước đó (In-Transit Amount Trap)","(B) $9,800.00","- Ly do sai: 9.800,00 USD là số tiền của Hóa đơn #INV-725 đã được thanh toán xong từ ngày 02/12.","- Bay ETS: Bẫy Khoản Đã Tất toán Từ trước (Historical Paid Item Trap)","(D) $14,250.00","- Ly do sai: 14.250,00 USD là kết quả nếu chỉ trừ khoản tiền 4.200 USD mà quên không trừ hóa đơn trùng lặp 3.800 USD ($18,450 - $4,200 = $14,250).","- Bay ETS: Bẫy Đối soát Nửa vời (Partial Reconciliation Trap)","200. What document does Ms. Bennett expect to receive by January 10?","Dap an dung: (A) A revised statement of account showing a balance of zero","[Dau vet bai doc / Clue]: Văn bản 3, Đoạn cuối: \u0027Please send us an updated, zero-balance Statement of Account by January 10 for our external audit filing.\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027an updated, zero-balance Statement of Account\u0027 \u003c-\u003e \u0027A revised statement of account showing a balance of zero\u0027","[Loi giai chi tiet]: Đoạn cuối email nêu rõ bà Bennett yêu cầu Apex gửi một Bảng sao kê tài khoản cập nhật thể hiện số dư bằng 0 trước ngày 10/1 để nộp hồ sơ kiểm toán độc lập.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(B) A price quote for upcoming conveyor belt orders","- Ly do sai: Bà Bennett không yêu cầu báo giá băng chuyền mới; thư chỉ tập trung vào việc quyết toán dứt điểm công nợ năm cũ.","- Bay ETS: Bẫy Báo giá Đơn hàng Mới (New Quote Trap)","(C) A signed master procurement contract for next fiscal year","- Ly do sai: Tài liệu cần nộp là sao kê công nợ bằng 0 cho kiểm toán, không phải hợp đồng khung năm tài chính mới.","- Bay ETS: Bẫy Hợp đồng Mua sắm Năm sau (Next-Year Contract Trap)","(D) An audited tax return statement from Apex\u0027s certified accountant","- Ly do sai: Bà Bennett cần bảng sao kê công nợ giữa 2 bên để phục vụ kiểm toán của chính Orion, không đòi hồ sơ khai thuế của Apex.","- Bay ETS: Bẫy Tờ khai Thuế Bên thứ ba (Tax Return Speculation Trap)","PHẦN 4: PHÂN TÍCH CHUYÊN SÂU — TƯ DUY NGUYÊN BẢN (FIRST PRINCIPLES) \u0026 FEYNMAN","4.1. Sơ đồ Luồng Nghiệp vụ: Đối soát Công nợ Phải trả (AP Reconciliation), Khử Bút toán Trùng \u0026 Khóa sổ Cuối năm","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","Nhà cung cấp Phát hành Bảng Sao kê Tài khoản Công nợ Cuối năm (Vendor Statement of Account Issuance)"],[],["BƯỚC 2","Kiểm toán Đối soát Sổ cái Nội bộ \u0026 Phát hiện 2 Sai lệch Trọng yếu (Internal AP Ledger Audit)"],[],["BƯỚC 3","Quyết toán Chuyển khoản Dứt điểm \u0026 Yêu cầu Sao kê Số dư Bằng 0 (Final Wire Settlement \u0026 Zero-Balance SOA)"]],[["• Chung tu \u0026 Kenh: Apex Industrial Parts Supply -\u003e Cổng AP Orion Manufacturing (Văn bản 1)","• Nghiep vu thuc thi: Chốt dữ liệu công nợ năm đến ngày 15/12; liệt kê 5 hóa đơn và 2 khoản thanh toán; phát hành Bảng sao kê #CL-4409 yêu cầu thanh toán số dư nợ cuối kỳ 18.450 USD trước ngày 31/12","• Ket qua \u0026 Kiem soat: Bảng Sao kê Tài khoản Thường niên #CL-4409 (Closing Balance: $18,450.00)"],["➔"],["• Chung tu \u0026 Kenh: Kế toán viên Cấp cao Rachel Bennett (Orion) (Văn bản 2)","• Nghiep vu thuc thi: Đối chiếu sổ cái ERP: Phát hiện Hóa đơn #INV-731 ($3,800) bị lập trùng cho PO #OR-4402 đã thanh toán và phát hiện điện chuyển tiền ngân hàng $4,200 (#PMT-881) ngày 14/12 đang luân chuyển; tính toán số dư thực tế $10,450","• Ket qua \u0026 Kiem soat: Bảng Kiểm toán Đối soát Sổ cái Phải trả (Internal Audit Reconciliation Worksheet)"],["➔"],["• Chung tu \u0026 Kenh: Khối Ngân quỹ Orion -\u003e Tài khoản Ngân hàng Apex (Văn bản 3)","• Nghiep vu thuc thi: Phát lệnh chuyển tiền Fedwire $10,450 tất toán sạch nợ vào ngày 20/12; yêu cầu Apex hủy hóa đơn trùng #INV-731 và gửi Bảng xác nhận số dư bằng 0 trước 10/1 để phục vụ kiểm toán độc lập","• Ket qua \u0026 Kiem soat: Lệnh Chuyển tiền Quyết toán #FED-092201 ($10,450.00) + Bảng Sao kê Công nợ Bằng 0 Khóa sổ Năm"]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["STEP 1","VENDOR STATEMENT OF ACCOUNT ISSUANCE (YEAR-END CLOSING BALANCE)"],[],["STEP 2","INTERNAL ACCOUNTS PAYABLE LEDGER AUDIT \u0026 DISCREPANCY DISCOVERY"],[],["STEP 3","FINAL FEDWIRE REMITTANCE \u0026 ZERO-BALANCE RECONCILIATION STATEMENT"]],[["• Documents \u0026 Channels: Apex Industrial Parts Supply -\u003e Orion Manufacturing Accounts Payable Portal","• Core Business Execution: Finalize annual vendor ledger through December 15; list 5 outstanding invoices and 2 remittances; issue Statement of Account #CL-4409 requesting payment of $18,450 balance prior to December 31 fiscal year-end.","• Key Deliverable \u0026 Control: Annual Statement of Account #CL-4409 (Reported Closing Balance: $18,450.00)"],["➔"],["• Documents \u0026 Channels: Senior Accountant Audit Worksheet (Rachel Bennett, Orion Manufacturing)","• Core Business Execution: Reconcile ERP ledger: identify Invoice #INV-731 ($3,800) was erroneously billed twice for paid PO #OR-4402; identify December 14 wire transfer of $4,200 (#PMT-881) in transit; calculate true adjusted balance of $10,450.","• Key Deliverable \u0026 Control: Certified AP Ledger Reconciliation Worksheet establishing verified net payable of $10,450"],["➔"],["• Documents \u0026 Channels: Orion Corporate Treasury -\u003e Apex Industrial Commercial Bank Account","• Core Business Execution: Issue Fedwire wire transfer of $10,450 on December 20 to fully settle all outstanding liabilities; mandate Apex cancel duplicate invoice #INV-731 and return certified zero-balance confirmation before January 10.","• Key Deliverable \u0026 Control: Fedwire Confirmation #FED-092201 ($10,450.00) and verified Zero-Balance Statement for fiscal audit"]]],"t":"table"},"4.2. Giải thích Bản chất theo Tư duy Nguyên bản (First Principles) \u0026 Phương pháp Feynman (Tiếng Việt)","• Bản chất Luồng End-to-End (3 Dòng chảy đồng bộ — Thực thể + Pháp lý/Chứng từ + Ngân hàng/Kế toán): (1) Dòng chảy Vật lý (Physical Flow): Các lô hàng phụ tùng công nghiệp (vòng bi, xi lanh thủy lực, băng chuyền, mũi khoan) đã được giao nhận đầy đủ tại các nhà máy Orion trong quý 4, riêng đơn PO #OR-4402 kho chỉ nhận duy nhất 1 lần giao hàng vào ngày 14/11; (2) Dòng chảy Pháp lý \u0026 Chứng từ (Legal \u0026 Documentary Flow): Apex xuất Bảng sao kê #CL-4409 đòi nợ 18.450 USD; Kế toán Orion đối soát 3 chiều phát hiện Hóa đơn #INV-731 xuất ngày 05/12 là bản sao trùng lặp vô căn cứ của Hóa đơn #INV-719, buộc Apex phải phát hành công văn hủy bỏ hóa đơn để đảm bảo tính hợp lệ pháp lý cho hồ sơ kiểm toán độc lập bên ngoài; (3) Dòng chảy Ngân hàng \u0026 Kế toán (Banking \u0026 Accounting Flow): Mạng lưới thanh toán Fedwire ghi nhận lệnh chuyển 4.200 USD vào ngày 14/12 bị lệch pha thời gian với ngày chốt sao kê 15/12 của Apex (hiện tượng In-transit Wire). Kế toán Orion lập bảng điều chỉnh công nợ: lấy 18.450 USD trừ 3.800 USD hóa đơn trùng và trừ 4.200 USD tiền đang chuyển, xác định chính xác số nợ còn lại là 10.450 USD và thực hiện chuyển khoản dứt điểm ngày 20/12 để đưa số dư công nợ về bằng 0.","• Điểm nghẽn Cốt lõi (Core Bottleneck): Lỗi bất đối xứng dữ liệu thời gian thực (Timing Mismatch \u0026 Human Billing Errors) vào kỳ khóa sổ kế toán cuối năm (Fiscal Year-End Closing). Nhà cung cấp thường chịu áp lực doanh số cuối năm nên dễ xuất hóa đơn trùng (Duplicate Invoicing); đồng thời độ trễ bù trừ liên ngân hàng (Interbank Clearing Lag 24-48h) tạo ra các khoản \u0027tiền đang trên đường đi\u0027 (In-transit Payments) làm sai lệch số dư trên sao kê. Nếu doanh nghiệp mua hàng không có quy trình đối soát độc lập mà vội vã chuyển đủ tiền theo sao kê đòi nợ, doanh nghiệp sẽ bị thanh toán trùng và thất thoát tiền mặt nghiêm trọng.","• 3 Giải pháp Hệ thống cho Chuyên viên Phân tích Nghiệp vụ (BA Solutions):","(1) Xây dựng Công cụ Chặn Hóa đơn Trùng lặp Tự động (Automated Duplicate Invoice Prevention Rule): Thiết lập thuật toán kiểm tra chéo trên cổng kế toán: Ngăn chặn tuyệt đối việc nhập hoặc xuất một hóa đơn mới nếu trùng 3 trường thông tin: Mã Đơn đặt hàng (PO Number) + Mã Nhà cung cấp (Vendor ID) + Số tiền hóa đơn giống hệt hóa đơn đã tồn tại trong vòng 60 ngày.","(2) Tự động Hạch toán Khoản Tiền Đang Luân chuyển (Automated In-Transit Payment Reconciliation Matching): Cấu hình hệ thống ERP liên kết với cổng ngân hàng để tự động đối chiếu mã điện chuyển tiền Fedwire/SWIFT; tự động gắn cờ \u0027In-Transit\u0027 trên bảng đối soát công nợ ngay khi lệnh chuyển tiền được tạo, giúp kế toán không bị nhầm lẫn khi nhận sao kê của đối tác.","(3) Tự động Tạo Bảng Đối soát Công nợ Điện tử \u0026 Yêu cầu Xác nhận Số dư Bằng 0 (Automated SOA Reconciliation \u0026 Zero-Balance Sign-Off Workflow): Tích hợp luồng đối soát công nợ tự động trên Cổng Nhà cung cấp (Vendor Portal): Hệ thống tự động so khớp sao kê của nhà cung cấp với sổ cái nội bộ, tự động sinh biên bản điều chỉnh sai lệch và tự động cấp chứng chỉ \u0027Zero-Balance Confirmation\u0027 có chữ ký số hai bên ngay sau khi lệnh chuyển tiền cuối cùng được xác thực.","4.3. Giải thích Chuyên sâu Song ngữ (Bilingual First Principles \u0026 Feynman Analysis - English)","• End-to-End Flow Nature (3 Synchronized Streams — Physical + Legal/Documentary + Banking/Accounting): (1) Physical Flow: Industrial components (bearings, cylinders, belts, drill bits) were physically inspected and received across Q4; warehouse logs confirm PO #OR-4402 arrived on November 14 with zero subsequent deliveries; (2) Legal \u0026 Documentary Flow: Apex\u0027s Statement #CL-4409 demanded $18,450.00; Orion\u0027s 3-way matching verified that Invoice #INV-731 was an invalid duplicate of #INV-719, legally requiring a formal void notice to satisfy external auditors; (3) Banking \u0026 Accounting Flow: Interbank clearing lags caused the December 14 wire (#PMT-881 for $4,200.00) to cross Apex\u0027s December 15 cutoff; Orion\u0027s audit worksheet corrected both variances ($18,450 - $3,800 duplicate - $4,200 in-transit = $10,450.00 net payable), culminating in the final December 20 Fedwire release to achieve a validated zero balance.","• Core Bottleneck: Asymmetric timing and duplicate entry vulnerabilities during annual fiscal year-end closing. Vendors rushing to close annual receivables frequently generate duplicate billings, while 24-to-48-hour interbank clearing cycles spawn in-transit payment mismatches. Paying vendor statements blindly without rigorous internal sub-ledger reconciliation leaks significant working capital.","• 3 Systemic BA Solutions:","(1) Automated Duplicate Invoice Prevention Rule: Implement system-level validation algorithms: reject any incoming or outgoing invoice matching an existing record on Vendor Tax ID + Purchase Order Number + Exact Currency Amount within a 60-day rolling window.","(2) Automated In-Transit Payment Reconciliation Matching: Connect the ERP Accounts Payable ledger directly to bank treasury Fedwire/SWIFT feeds to automatically flag issued payments as \u0027In-Transit\u0027, preventing artificial ledger variances when vendor statements cross in transit.","(3) Automated SOA Reconciliation \u0026 Zero-Balance Sign-Off Workflow: Deploy an automated reconciliation module in the Vendor Portal that ingests vendor statement PDFs, performs line-item reconciliation against internal AP ledgers, highlights variances, and triggers an automated bilateral Zero-Balance Certificate upon final settlement wire confirmation.","PHẦN 5: BẢNG TỪ VỰNG \u0026 CẤU TRÚC CỐT LÕI (8 THUẬT NGỮ KIỂM TOÁN CÔNG NỢ \u0026 ĐỐI SOÁT CUỐI NĂM)","1. Statement of Account (SOA) (n phr)  /ˈsteɪtmənt əv əˈkaʊnt/  = summary billing statement / receivables ledger summary / balance sheet of open items","Nghia: Bảng sao kê tài khoản công nợ (bản tổng kết toàn bộ hóa đơn và thanh toán giữa hai bên)","Vd: Please reconcile this Statement of Account against your internal purchase ledger. - Vui lòng đối soát Bảng sao kê tài khoản này với sổ cái mua hàng nội bộ của quý vị.","2. reconcile (v) / reconciliation (n)  /ˈrekənsaɪl/ - /ˌrekənsɪliˈeɪʃn/  = balance accounts / resolve accounting variances / compare financial records","Nghia: Đối soát / So khớp số liệu kế toán để xử lý sai lệch","Vd: We have completed our year-end accounts payable reconciliation for Statement #CL-4409. - Chúng tôi đã hoàn tất việc đối soát công nợ phải trả cuối năm cho Bảng sao kê #CL-4409.","3. duplicate billing (n phr)  /ˈduːplɪkət ˈbɪlɪŋ/  = double invoicing / repeated charge for the same order","Nghia: Lập hóa đơn trùng lặp (tính tiền hai lần cho cùng một đơn hàng)","Vd: Invoice #INV-731 is a duplicate billing for PO #OR-4402 and must be voided. - Hóa đơn #INV-731 là hóa đơn tính cước trùng lặp cho PO #OR-4402 và phải bị hủy bỏ.","4. in-transit payment (n phr)  /ɪn ˈtrænzɪt ˈpeɪmənt/  = uncleared wire transfer / payment floating in banking channels","Nghia: Khoản thanh toán đang trên đường chuyển (đã gửi nhưng bên nhận chưa kịp nhận do độ trễ liên ngân hàng)","Vd: The $4,200.00 bank wire was in transit when the statement was generated. - Khoản chuyển tiền ngân hàng 4.200,00 USD đang trên đường chuyển khi bảng sao kê được lập.","5. void (v/adj)  /vɔɪd/  = cancel formally / render null and void / invalidate an invoice","Nghia: Hủy bỏ / Vô hiệu hóa (một hóa đơn, séc hoặc hợp đồng)","Vd: Please issue a formal cancellation notice voiding the duplicate invoice. - Vui lòng phát hành thông báo hủy bỏ chính thức vô hiệu hóa hóa đơn bị lập trùng.","6. pay down (v phr)  /peɪ daʊn/  = reduce debt balance / make a partial payment against open liabilities","Nghia: Thanh toán giảm nợ / Trả bớt một phần nợ công nợ","Vd: Orion treasury executed a wire of $4,200.00 to pay down open invoices. - Khối ngân quỹ Orion đã thực hiện lệnh chuyển 4.200,00 USD để giảm trừ bớt các hóa đơn còn mở.","7. cross in the mail (idiom)  /krɔːs ɪn ðə meɪl/  = pass each other in transit / occur simultaneously before communication clears","Nghia: Bị lệch pha thời điểm (thư hoặc lệnh thanh toán gửi đi cùng lúc với thông báo đòi nợ nên chưa kịp gặp nhau)","Vd: Our payment crossed in the mail with your monthly statement closing date. - Khoản thanh toán của chúng tôi đã bị lệch thời điểm với ngày chốt sao kê hàng tháng của quý vị.","8. zero-balance (adj/n)  /ˈzɪroʊ ˈbæləns/  = fully cleared balance / nil liability / settled account","Nghia: Số dư bằng 0 (đã tất toán sạch sẽ không còn nợ nần)","Vd: Please send an updated zero-balance statement for our external audit filing. - Vui lòng gửi bảng sao kê cập nhật có số dư bằng 0 để chúng tôi nộp hồ sơ kiểm toán độc lập.","==================================================================================================",{"rows":[[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]],[[],[],[],[]]],"t":"table"}]</script>
<script type="application/json" id="labels">["Giá sỉ \u0026 Credit Memo","Đấu thầu RFP","Chiết khấu 2/10 Net 30","Backorder \u0026 L/C","Thẻ P-Card \u0026 kiểm toán","Thuê máy in \u0026 cước","Hợp đồng tiệc","Tỷ giá \u0026 kỳ hạn","ERP theo mốc \u0026 Escrow","Đối soát công nợ"]</script>
<script>
(function(){
const RAW = JSON.parse(document.getElementById('src').textContent);
const VI_RE = /[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i;
const isVI = s => VI_RE.test(s);
let SHORT = []; try{ SHORT = JSON.parse(document.getElementById('labels').textContent)||[]; }catch(e){}

function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function add(p,...kids){ kids.forEach(k=>k&&p.appendChild(k)); return p; }
const isStr = x => typeof x === 'string';

/* ---------- split document ---------- */
const intro = RAW.slice(0,3);
const lessons = [];
let cur=null, finalTable=null, finalTitle='';
for(let i=3;i<RAW.length;i++){
  const it=RAW[i];
  if(isStr(it) && /^[=\-]{10,}$/.test(it)) continue;
  // "BÀI THỰC HÀNH SỐ N" alone (title on the next line) or "BÀI THỰC HÀNH SỐ N: Title" (title on the same line)
  if(isStr(it) && /^BÀI THỰC HÀNH SỐ\s*\d+/.test(it)){ const t=it.replace(/^BÀI THỰC HÀNH SỐ\s*\d+\s*:?\s*/,''); cur={items:t?[t]:[]}; lessons.push(cur); continue; }
  // "BÀI N: Title" keeps the title on the same line
  if(isStr(it) && /^BÀI\s+\d+\s*:/.test(it)){ cur={items:[it.replace(/^BÀI\s+\d+\s*:\s*/,'')]}; lessons.push(cur); continue; }
  if(isStr(it) && /^(BẢNG TỔNG HỢP|PHẦN TỔNG KẾT|PHAN TONG KET)/.test(it)){ cur=null; finalTitle=it; continue; }
  if(!cur){ if(!isStr(it)) finalTable=it; continue; }
  cur.items.push(it);
}
lessons.forEach((L,idx)=>{
  L.n=idx+1;
  let t=L.items[0]; const tq=t.match(/\s*\((Questions?\s*\d+\s*-\s*\d+[^()]*)\)\s*$/); if(tq) t=t.slice(0,tq.index);
  // trailing "(ENGLISH TITLE)" only when it is a real English title, not a short term like "(Credit Memo)":
  // 4+ words, or an all-caps title of 2+ words such as "(GRAPHIC DESIGN ASSOCIATE)"
  const m=t.match(/^(.*)\s\(([^()]*)\)\s*$/); const nw=m?m[2].split(/\s+/).length:0;
  const isEn=m&&!isVI(m[2])&&(nw>=4||(nw>=2&&m[2]===m[2].toUpperCase()&&/[A-Z]/.test(m[2])));
  L.vi = isEn?m[1]:t; L.en = isEn?m[2]:'';
  L.src = L.items[1].replace(/^Nguồn( bài học)?:\s*/,'');
  const q=(L.src+' '+L.items[0]).match(/Questions?\s*(\d+)\s*-\s*(\d+)/); L.qr = q?`Q${q[1]}–${q[2]}`:'';
  if(!SHORT[idx]){ const w=L.vi.split(/\s+/).slice(0,4).join(' ').toLowerCase(); SHORT[idx]=w.charAt(0).toUpperCase()+w.slice(1); }
  L.parts=[]; let P=null, S=null;
  for(const it of L.items.slice(2)){
    if(isStr(it)){
      const pm=it.match(/^PHẦN\s*(\d)\s*:\s*(.*)$/i);
      if(pm){ P={n:+pm[1],title:pm[2],subs:[],items:[]}; L.parts.push(P); S=null; continue; }
      const sm=it.match(/^(\d\.\d)\.\s+(.*)$/);
      // only "N.x." of the current PHẦN N opens a sub-section; "4.1. Package…" inside a passage is content
      if(sm && P && +sm[1][0]===P.n){ S={id:sm[1],title:sm[2],items:[]}; P.subs.push(S); continue; }
    }
    if(S) S.items.push(it); else if(P) P.items.push(it);
  }
  // answer key from part 3
  L.key={}; L.answers=[];
  const p3=L.parts.find(p=>p.n===3);
  // two formats: "186. (A) text" + [Dau vet]/[Giai thich]
  //          or  "186. stem" + "Dap an dung: (A) text" + [Dau vet bai doc]/[Dien dat tuong duong]/[Loi giai chi tiet]/[Phan tich Phuong an Sai] + "(B) ..." "- Ly do sai:" "- Bay ETS:"
  if(p3){ let a=null, sec='';
    const newA=no=>{ a={no,k:'',t:'',stem:'',trace:'',expl:'',para:[],wrong:[]}; L.answers.push(a); sec=''; };
    for(const s of p3.items){ if(!isStr(s)) continue;
      let m=s.match(/^(\d{3})\.\s*\(([A-D])\)\s*(.*)$/);
      if(m){ newA(m[1]); a.k=m[2]; a.t=m[3]; L.key[m[1]]=m[2]; continue; }
      m=s.match(/^(\d{3})\.\s+(.*)$/);
      if(m){ newA(m[1]); a.stem=m[2]; continue; }
      if(!a) continue;
      m=s.match(/^Dap an dung:\s*\(([A-D])\)\s*(.*)$/i);
      if(m){ a.k=m[1]; a.t=m[2]; L.key[a.no]=m[1]; continue; }
      m=s.match(/^\[([^\]]+)\]:?\s*(.*)$/);
      if(m){ const lab=m[1], rest=m[2];
        if(/^Dau vet/i.test(lab)){ sec='trace'; a.trace=rest; }
        else if(/Paraphrase|Dien dat/i.test(lab)){ sec='para'; rest.split(/\s*•\s*/).filter(Boolean).forEach(x=>a.para.push(x)); }
        else if(/Phuong an Sai|Bay/i.test(lab)){ sec='wrong'; }
        else { sec='expl'; a.expl+=(a.expl?' ':'')+rest; }
        continue; }
      if(sec==='wrong'){
        m=s.match(/^\(([A-D])\)\s*(.*)$/); if(m){ a.wrong.push({k:m[1],t:m[2],why:'',trap:''}); continue; }
        const w=a.wrong[a.wrong.length-1]; m=s.match(/^-\s*(Ly do sai|Bay ETS)\s*:\s*(.*)$/i);
        if(w&&m){ if(/^Ly/i.test(m[1])) w.why=m[2]; else w.trap=m[2]; continue; }
      }
      if(sec==='para' && /^•/.test(s)){ a.para.push(s.replace(/^•\s*/,'')); continue; }
      if(sec==='trace'){ a.trace+=' '+s; continue; }
      a.expl += (a.expl?' ':'')+s;
    }
  }
});
const TABS = lessons.map(L=>({id:'bai'+L.n, n:String(L.n).padStart(2,'0'), label:SHORT[L.n-1]||('Bài '+L.n), sub:L.qr, c:`var(--c${L.n})`}));
const NFIN = finalTable ? finalTable.rows.length-1 : 50;
const FINLABEL = /THU[ẬA]T NG[ỮU]/i.test(finalTitle) ? `${NFIN} thuật ngữ vàng` : `${NFIN} cặp Paraphrase`;
TABS.push({id:'paraphrase', n:String(NFIN), label:FINLABEL, sub:'Tổng hợp nạp Anki', c:'var(--red)'});

/* ---------- line formatting for passages ---------- */
// passage header: known doc types, a bare "[Internal Recommendation] Letter", or generic "Doc Type [N] (Descriptor)";
// a bracket holding a date ("Boston (January 3)", "(Evaluated by …, Director — March 28)") is a dateline or caption, not a header
const DOC_RE=/^(E-mail|Email|Letter \d|Document \d|Internal Memorandum|Webpage|Press Release|Bill of Lading|Economic Logistics Article|Service Proposal)\b|^(?:[A-Z][a-z]+ ){0,3}Letter$|^[A-Z][A-Za-z&\/\- ]{2,50}(?: \d)? \((?![^()]*\b(?:January|February|March|April|May|June|July|August|September|October|November|December) \d)[A-Za-z][^()]*\)$/;
// an ALL-CAPS line like "REQUEST FOR PROPOSALS (RFP #VF-2026-08)" is a letterhead inside a passage, not a new passage
const isDocHead=s=>DOC_RE.test(s) && s.length<110 && !/:\s/.test(s) && !(s===s.toUpperCase() && /[A-Z]{4}/.test(s));
function fmtLine(s){
  if(/^•\s*/.test(s)) return el('div','ln-bul',s.replace(/^•\s*/,''));
  const kv=s.match(/^([A-ZÀ-Ỹa-zà-ỹ][^:]{0,30}):\s+(.+)$/);
  if(kv && !/[.!?]$/.test(kv[1]) && kv[1].split(' ').length<=5){ const d=el('div','ln-kv'); add(d,el('b',null,kv[1]+':'),document.createTextNode(kv[2])); return d; }
  if(s===s.toUpperCase() && /[A-ZÀ-Ỹ]{3}/.test(s) && s.length<130) return el('div','ln-caps',s);
  if(/:$/.test(s) && s.length<60) return el('div','ln-sec',s);
  return el('p',null,s);
}

/* "• Label: text" bullet with a bold label; "• Label:" alone becomes a group heading */
function bullet(s){
  s=s.trim();
  if(/^[^:]{2,150}:$/.test(s)) return el('div','ln-head',s.slice(0,-1));
  const d=el('div','ln-bul'); const m=s.match(/^([^:]{2,150}?):\s+(.*)$/);
  if(m && !/[.!?]$/.test(m[1])){ let rest=m[2]; if(rest.startsWith(m[1]+':')) rest=rest.slice(m[1].length+1).trim();
    add(d,el('b',null,m[1]+': '),document.createTextNode(rest)); }
  else d.textContent=s;
  return d;
}
/* one line of a strategy / BA block: "• ..." bullet, "=> ..." conclusion, "(1) ..." numbered point, else paragraph */
function richLine(s){
  s=s.trim();
  if(/^•/.test(s)){ const r=s.replace(/^•\s*/,''); return r.trim()?bullet(r):null; }
  if(/^=>/.test(s)){ const d=bullet(s.replace(/^=>\s*/,'')); d.className='ln-concl'; return d; }
  if(/^\(\d+\)/.test(s)){ const d=bullet(s); d.className='ln-num'; return d; }
  if(/^-\s/.test(s)){ const d=bullet(s.replace(/^-\s*/,'')); d.className='ln-sub'; return d; }
  return el('p',null,s);
}
