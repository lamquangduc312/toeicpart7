<title>Mua sắm B2B TOEIC 750+</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: cargo-manifest page. Hero with a 3x3 container stack (one container per lesson), sticky container-tab bar, lesson panel with side index of the 5 parts. */
:root{
  /* Tailwind-style neutrals + one primary (Blue 600) */
  --bg:#F9FAFB; --surface:#FFFFFF; --surface-2:#F3F4F6; --ink:#111827; --muted:#6B7280; --line:#E5E7EB;
  --paper:#FFFFFF;
  /* Coordinated palette: navy = governance/trust, cobalt = primary, magenta = errors,
     emerald = correct, ochre = clues & timing, Viettel red = brand marks, xanh mạ = outputs & chips */
  --navy:#102B66; --navy-2:#183B7E; --navy-ink:#102B66;
  --cobalt:#1E62D0; --cobalt-2:#2A7BE8;
  --magenta:#D71A4A; --magenta-2:#E52E5E;
  --emerald:#0A8558; --emerald-2:#12A16E;
  --ochre:#D87D0E; --ochre-2:#E8901C; --ochre-soft:#FDF1E1;
  --brand:var(--cobalt); --brand-soft:#DCE8FB; --vi:var(--navy-2);
  --red:#EE0033; --red-soft:#FFE4EA; --green:#5FA61B; --green-soft:#EAF6DC;
  --ok:var(--emerald); --bad:var(--magenta); --coral:var(--red); --coral-soft:var(--red-soft);
  --c1:var(--brand); --c2:var(--brand); --c3:var(--brand); --c4:var(--brand); --c5:var(--brand); --c6:var(--brand); --c7:var(--brand); --c8:var(--brand); --c9:var(--brand); --c10:var(--brand);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --shadow:0 1px 2px rgba(17,24,39,.05),0 6px 20px -8px rgba(17,24,39,.15);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#030712; --surface:#111827; --surface-2:#0B1120; --ink:#F9FAFB; --muted:#9CA3AF; --line:#1F2937;
  --vi:#9DBDF5; --paper:#111827; --navy-ink:#C9D7F4;
  --brand:var(--cobalt-2); --brand-soft:#132A55; --ochre-soft:#33220B;
  --ok:var(--emerald-2); --bad:var(--magenta-2);
  --red:#FF3B5F; --red-soft:#3B0A16; --green:#8BCF45; --green-soft:#1C2E0E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#030712; --surface:#111827; --surface-2:#0B1120; --ink:#F9FAFB; --muted:#9CA3AF; --line:#1F2937;
  --vi:#9DBDF5; --paper:#111827; --navy-ink:#C9D7F4;
  --brand:var(--cobalt-2); --brand-soft:#132A55; --ochre-soft:#33220B;
  --ok:var(--emerald-2); --bad:var(--magenta-2);
  --red:#FF3B5F; --red-soft:#3B0A16; --green:#8BCF45; --green-soft:#1C2E0E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{display:none}
.wrap{max-width:min(1600px,96vw);width:100%;margin:0 auto;padding-left:clamp(16px,2.5vw,40px);padding-right:clamp(16px,2.5vw,40px)}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--c) 70%,transparent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono)}

/* ---------- Hero ---------- */
.hero{padding-block:clamp(20px,3vw,36px);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.05fr);gap:clamp(20px,3vw,44px);align-items:center}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow b{color:var(--coral);font-weight:500}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3.2vw,44px);line-height:1.15;letter-spacing:-.01em;text-transform:uppercase;margin-top:10px;text-wrap:balance;word-break:break-word}
.hero h1 span{color:var(--red)}
.hero .en-sub{font-family:var(--f-display);font-weight:600;font-size:clamp(14px,1.5vw,18px);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.hero .desc{max-width:62ch;margin-top:16px;color:var(--muted);font-size:15px}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:24px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}

.yard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:620px;justify-self:end;width:100%}
.box{position:relative;min-height:76px;height:auto;aspect-ratio:auto;max-width:100%;border:1px solid var(--line);border-radius:12px;cursor:pointer;color:var(--ink);text-align:left;padding:8px 10px;background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;gap:4px;transition:transform .18s ease,background .18s,border-color .18s,box-shadow .18s}
.box:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 8px 20px -10px color-mix(in srgb,var(--brand) 60%,transparent)}
.box .n{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--brand)}
.box .qr{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.box .code{font-size:11.5px;font-weight:600;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;line-height:1.25;word-break:break-word}
.box.on{background:var(--brand);border-color:var(--brand);color:#fff}
.box.on .n,.box.on .qr,.box.on .code{color:#fff}
.box.alt .n{color:var(--coral)}

/* navy governance band behind the hero */
.hero-band{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff}
.hero-band .eyebrow{color:rgba(255,255,255,.7)}
.hero-band .eyebrow b{color:var(--ochre-2)}
.hero-band h1 span{color:var(--magenta-2)}
.hero-band .en-sub,.hero-band .desc,.hero-band .stat span{color:rgba(255,255,255,.74)}
.hero-band .stat b{color:#fff}
.hero-band .box{border-color:transparent}
.hero-band .box.on{background:var(--cobalt-2);border-color:#fff}

/* ---------- Tab bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-block:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:12px;padding-block:10px}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;flex:1;min-width:0;padding-bottom:2px;scroll-behavior:smooth}
.tab{--c:var(--c1);flex:0 0 auto;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 16px 5px 5px;cursor:pointer;text-align:left;transition:background .15s,border-color .15s}
.tab:hover{border-color:var(--c)}
.tab .door{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--c);font-family:var(--f-display);font-weight:800;font-size:16px;
  background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.tab .tl{display:flex;flex-direction:column;line-height:1.2}
.tab .tl b{font-size:13px;font-weight:600;white-space:nowrap}
.tab .tl small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#fff}
.tab[aria-selected="true"] .door{background:rgba(255,255,255,.22);color:#fff}
.tab[aria-selected="true"] .tl small{color:rgba(255,255,255,.82)}
.mode{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:0 0 auto;background:var(--surface-2)}
.mode button{border:0;background:none;padding:6px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--navy);color:#fff}

/* ---------- Lesson ---------- */
main{padding-block:28px 64px}
.lesson-head{--c:var(--c1);display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start;padding-bottom:24px;border-bottom:2px solid var(--navy-ink)}
.big-n{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,10vw,120px);line-height:.8;color:var(--c);letter-spacing:-.02em}
.big-n small{display:block;font-size:14px;letter-spacing:.2em;color:var(--muted);font-weight:600;margin-bottom:8px}
.lesson-head h2{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3.2vw,38px);line-height:1.05;text-transform:uppercase;color:var(--navy-ink)}
.lesson-head .en-t{font-family:var(--f-display);font-weight:600;font-size:clamp(15px,1.7vw,19px);color:var(--c);letter-spacing:.04em;margin-top:8px;text-transform:uppercase}
.src{display:inline-flex;gap:8px;align-items:center;margin-top:14px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.src b{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--c);letter-spacing:.06em}

.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:36px;margin-top:28px}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 82px);align-self:start;display:flex;flex-direction:column;gap:2px}
.toc a{display:flex;gap:10px;align-items:baseline;text-decoration:none;color:var(--muted);font-size:13.5px;padding:7px 10px;border-radius:6px;line-height:1.3}
.toc a b{font-family:var(--f-display);font-size:17px;color:var(--c);min-width:18px}
.toc a:hover,.toc a.on{background:var(--surface);color:var(--ink)}
.toc .toc-sub{padding-left:38px;font-size:12.5px}
.content{min-width:0;display:flex;flex-direction:column;gap:44px}

.part{display:flex;flex-direction:column;gap:22px;scroll-margin-top:96px}
.part-h{display:flex;gap:14px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px}
.part-h .pn{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.14em;color:#fff;background:var(--red);padding:3px 9px;border-radius:4px;white-space:nowrap}
.part-h h3{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.4vw,26px);text-transform:uppercase;line-height:1.1;color:var(--navy-ink)}
.sub{display:flex;flex-direction:column;gap:14px;scroll-margin-top:96px}
.sub-h{display:flex;gap:10px;align-items:baseline;font-weight:700;font-size:17px}
.sub-h .sn{font-family:var(--f-mono);font-size:12px;color:var(--c);font-weight:500}

/* strategy */
.strat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.strat-t{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;color:var(--c);text-transform:uppercase;line-height:1.5}
.steps{display:grid;gap:12px;counter-reset:s}
.step{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:start}
.step .when{font-family:var(--f-mono);font-size:11.5px;display:flex;flex-direction:column;gap:2px;border-right:2px solid var(--ochre);padding-right:10px}
.step .when span{color:var(--ochre)!important;font-weight:500}
.step .when b{font-family:var(--f-display);font-size:18px;font-weight:700;color:var(--ink)}
.step .when span{color:var(--muted)}
.step h5{margin:0 0 3px;font-size:14.5px;font-weight:700}
.step p{font-size:14.5px;color:var(--ink)}

/* passages = papers */
.papers{display:flex;flex-direction:column;gap:18px}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:22px 24px;display:flex;flex-direction:column;gap:9px;font-size:15px;position:relative}
.paper-tag{align-self:flex-start;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:3px;padding:2px 8px;margin-bottom:4px}
.ln-caps{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.04em;line-height:1.2}
.ln-kv{font-size:14px}
.ln-kv b{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted);margin-right:4px}
.ln-bul{padding-left:16px;position:relative}
.ln-bul::before{content:"";position:absolute;left:2px;top:.7em;width:6px;height:6px;background:var(--c);border-radius:1px}
.ln-sec{font-weight:700;margin-top:6px}
.ln-head{font-weight:700;margin-top:8px;color:var(--navy-ink)}
.ln-num{padding:2px 0 2px 14px;border-left:2px solid var(--brand);margin-left:2px}
.ln-num b{color:var(--brand)}
.ln-concl{background:var(--brand-soft);border-radius:6px;padding:8px 12px;font-size:14px}
.ln-concl b{color:var(--brand)}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:16px}
.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.score{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.score b{color:var(--ink);font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--c)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.q-stem{display:flex;gap:12px;font-weight:600}
.q-no{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--c);line-height:1.2;flex:0 0 auto}
.q-extra{font-style:italic;font-weight:400;color:var(--muted);margin-top:4px}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:8px 12px;cursor:pointer;font-size:14.5px;line-height:1.45;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--c)}
.opt .k{font-family:var(--f-mono);font-weight:500;font-size:13px;color:var(--c);flex:0 0 auto;margin-top:1px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surface))}
.opt.ok .k{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--surface))}
.opt.bad .k{color:var(--bad)}
.q-fb{font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.q-fb .r{font-weight:600}
.q-fb .r.ok{color:var(--ok)} .q-fb .r.bad{color:var(--bad)}
.q-fb a{color:var(--c)}

/* bilingual */
.bi-doc{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;color:var(--c);text-transform:uppercase;padding:10px 0 2px;border-top:1px dashed var(--line);margin-top:6px;line-height:1.5}
.bi-doc:first-child{border-top:0;margin-top:0;padding-top:0}
.bi{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--line)}
.pair:first-child{border-top:0}
.pair>div{padding:11px 16px;display:flex;flex-direction:column;gap:4px;font-size:14.5px;min-width:0}
.pair .en{color:var(--ink)}
.pair .vi{color:var(--vi);background:color-mix(in srgb,var(--vi) 5%,transparent);border-left:1px solid var(--line)}
.lang{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--muted);opacity:.8}
.bi-head{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-bottom:1px solid var(--line)}
.bi-head span{padding:7px 16px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted)}
.bi-head span+span{border-left:1px solid var(--line);color:var(--vi)}

.vi-t{color:var(--vi)}
/* recall mode blurs translations */
.recall .vi-r{filter:blur(6px);cursor:pointer;user-select:none;transition:filter .2s}
.recall .vi-r.peek{filter:none;user-select:auto}

/* question translation */
.qt{display:grid;gap:12px}
.qt-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.qt-card .stem{display:flex;gap:12px}
.qt-card .stem>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.qt-card .stem b{font-weight:600}
.qt-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;padding-left:44px}
.qt-opt{display:flex;gap:8px;font-size:14px;line-height:1.45}
.qt-opt>div{display:flex;flex-direction:column;min-width:0}
.qt-opt .k{font-family:var(--f-mono);color:var(--c);font-size:12.5px;margin-top:1px}
.qt-opt.correct .k{color:#fff;background:var(--ok);border-radius:3px;padding:0 4px;height:fit-content}

/* summary */
.sum{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.sum>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;font-size:14.5px;display:flex;flex-direction:column;gap:8px}
.ideas{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.ideas li{position:relative;padding-left:18px}
.ideas>li::before{content:"";position:absolute;left:3px;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--brand)}
.ideas ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.ideas ul li::before{content:"";position:absolute;left:4px;top:.75em;width:7px;height:1.5px;background:var(--muted)}

/* matrix */
.matrix{display:grid;gap:12px}
.mx{display:grid;grid-template-columns:200px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mx-l{padding:16px;background:color-mix(in srgb,var(--c) 9%,var(--surface));display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line)}
.mx-l .i{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--c)}
.mx-l b{font-size:14.5px;line-height:1.35}
.mx-l small{font-size:12.5px;color:var(--muted);line-height:1.35}
.mx-r{padding:14px 18px;display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.mx-r p{display:flex;gap:10px}
.mx-r .lang{flex:0 0 22px;margin-top:4px}

/* answers */
.ans{display:grid;gap:12px}
.an{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:100px}
.an.flash{animation:flash 1.4s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--c)}100%{box-shadow:0 0 0 0 transparent}}
.an-h{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.an-h .no{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--c)}
.an-h .key{font-family:var(--f-mono);font-weight:500;background:var(--ok);color:#fff;border-radius:4px;padding:1px 8px;font-size:13px}
.an-h .t{font-weight:600}
.trace{font-size:14px;border-left:3px solid var(--ochre);background:var(--ochre-soft);padding:9px 12px;border-radius:0 6px 6px 0;font-style:italic}
.trace .lbl{color:var(--ochre)}
.lbl{font-family:var(--f-mono);font-style:normal;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);display:block;margin-bottom:2px}
.expl{font-size:14.5px}
.an-stem{font-size:14px;color:var(--muted);margin-top:-4px}
.para{display:flex;flex-direction:column;gap:6px;font-size:14px}
.para .pr{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:start;background:var(--green-soft);border-radius:6px;padding:7px 10px}
.para .pr i{font-style:normal;color:var(--green);font-weight:700}
.para .pr span:last-child{font-weight:600}
.wrong{display:grid;gap:8px}
.wr{border:1px solid var(--line);border-radius:8px;padding:9px 12px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.wr-h{display:flex;gap:8px;align-items:baseline}
.wr-h b{font-family:var(--f-mono);font-weight:500;color:var(--bad);font-size:13px}
.wr-h span{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--bad) 55%,transparent);color:var(--muted)}
.trap{align-self:flex-start;font-size:12px;font-weight:600;color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);border-radius:4px;padding:2px 8px}
.ln-sub{padding-left:30px;position:relative;font-size:14px}
.ln-sub::before{content:"";position:absolute;left:16px;top:.75em;width:6px;height:1.5px;background:var(--muted)}
.ln-sub b{color:var(--navy-ink)}

/* workflow */
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;position:relative}
.fstep{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;position:relative}
.fstep:not(:last-child)::after{content:"";position:absolute;right:-12px;top:30px;width:10px;height:10px;border-top:2px solid var(--c);border-right:2px solid var(--c);transform:rotate(45deg);z-index:1}
.fstep h5{margin:0;font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.15;text-transform:uppercase}
.fstep h5 span{display:block;font-size:12px;color:var(--c);letter-spacing:.14em}
.fkv{font-size:13.5px;display:flex;flex-direction:column;gap:1px}
.fkv b{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fkv.out{background:var(--green-soft);border-radius:6px;padding:8px 10px}
.fkv.out b{color:var(--green)}
.ba{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.ba>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;font-size:14.5px;display:flex;flex-direction:column;gap:8px}
.ba h5{margin:0;font-size:14px;font-weight:700}

/* vocab */
.vocab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.vc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:9px}
.vc-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.vc-h .vn{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.vc-h h5{margin:0;font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.05}
.ipa{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chips .eq{font-family:var(--f-mono);font-size:12px;color:var(--c);margin-right:2px}
.chip{font-size:12.5px;border:1px solid color-mix(in srgb,var(--green) 45%,var(--line));color:var(--ink);border-radius:999px;padding:1px 9px;background:var(--green-soft)}
.chips .eq{color:var(--green)}
.vc .mean{font-size:14px;font-weight:500}
.vc .ex{font-size:13.5px;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:3px}
.vc .ex i{font-style:italic}

/* 50 pairs */
.pp-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pp-tools input{flex:1;min-width:0;max-width:420px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;font:inherit;font-size:14.5px;color:var(--ink)}
.tbl-w{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th{text-align:left;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--navy);padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;width:52px}
td.t{font-weight:600}
td.p{color:var(--muted)}
td.m{color:var(--vi)}
tbody tr:hover td{background:var(--surface-2)}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:8px;flex-wrap:wrap}
.pager button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 16px;cursor:pointer;min-width:0;max-width:48%;text-align:left}
.pager button:hover{border-color:var(--ink)}
.pager button small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pager button b{font-size:14px}
.pager .next{margin-left:auto;align-items:flex-end;text-align:right}
footer{border-top:1px solid var(--line);padding-block:20px 32px;color:var(--muted);font-size:12.5px}

<script type="application/json" id="src">["CHUYÊN ĐỀ 4: MUA SẮM DOANH NGHIỆP B2B, ĐẤU THẦU, HÓA ĐƠN, ĐỐI SOÁT CÔNG NỢ \u0026 THANH TOÁN NGÂN HÀNG","TÀI LIỆU LUYỆN THI TOEIC PART 7 — ĐOẠN ĐÔI \u0026 ĐOẠN BA CHUYÊN SÂU (10 BÀI HỌC — 50 CÂU HỎI ETS TOÀN DIỆN)","==================================================================================================","BÀI 1: Chính sách Bán sỉ Theo Bậc (Tiered Wholesale Pricing), Đối soát Ba chiều (3-Way Matching) \u0026 Chứng từ Ghi có (Credit Memo) (Questions 186-190 - Triple Passage)","Nguồn: ETS TOEIC Part 7 — Triple Passage (Wholesale Catalog, Commercial Invoice \u0026 Accounting Dispute E-mail)","PHẦN 1: NỘI DUNG BÀI ĐỌC, CÂU HỎI \u0026 BẢN DỊCH SONG NGỮ","1.1. Đề thi Tiếng Anh gốc (Strategy Guide \u0026 Original ETS Passages)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","Questions 186-190 refer to the following catalog excerpt, invoice, and e-mail.","[Passage 1: Catalog Excerpt — Apex Ergonomics B2B Wholesale Pricing]","APEX ERGONOMICS COMMERCIAL SUPPLY CATALOG","Corporate Furnishing Solutions — Valid through December 31","1. Ergonomic Seating Collection","• Item #EP-100S — ErgoTask Standard Swivel Chair: $180.00","• Item #EP-200M — ErgoPro Executive Mesh Chair (Lumbar Support): $300.00","• Item #EP-300L — ErgoLuxe Top-Grain Leather Chair: $480.00","2. Corporate Volume Discount Tiers (Applied to Single-Order Quantities)","• Tier 1 (10 to 29 units): 10% discount off standard list price","• Tier 2 (30 to 49 units): 15% discount off standard list price","• Tier 3 (50 or more units): 20% discount off list price + Complimentary white-glove delivery and on-site assembly (standard $450.00 service fee waived)","3. Payment \u0026 Settlement Terms","All corporate invoices are payable within 30 days of delivery (Net 30) via Automated Clearing House (ACH) or bank wire transfer. Any billing discrepancies must be reported to Accounts Receivable within 7 business days of invoice receipt.","[Passage 2: Invoice — Apex Ergonomics Commercial Billing]","APEX ERGONOMICS COMMERCIAL BILLING DIVISION","INVOICE NO.: #AE-4092 | Invoice Date: November 4 | Payment Terms: Net 30","Bill To: Vance \u0026 Partners Law Firm (Attn: Accounts Payable)","1200 Constitution Plaza, Floor 14, Boston, MA 02110","Line Items:","• EP-200M | ErgoPro Executive Mesh Chair | Quantity: 60 Units | Unit List Price: $300.00 | Line Total: $18,000.00","• DISC-T1 | Corporate Volume Discount (Tier 1 — 10% Applied) | -$1,800.00","• SRV-ASM | White-Glove Delivery \u0026 On-Site Assembly Fee | 1 Lot | $450.00","TOTAL BALANCE DUE BY DECEMBER 4: $16,650.00","Delivery Note: All 60 chairs were delivered and assembled at Vance \u0026 Partners\u0027 downtown headquarters on November 3 (Signed Goods Receipt #GR-712).","[Passage 3: E-mail — Billing Discrepancy \u0026 Credit Memo Request]","To: Accounts Receivable \u003cbilling@apexergonomics.com\u003e","From: Arthur Pendelton \u003ca.pendelton@vancelaw.com\u003e","Date: November 6","Subject: Billing Discrepancy on Invoice #AE-4092 \u0026 Credit Memo Request","Dear Apex Billing Team,","While performing our three-way matching audit between our Purchase Order (#PO-8812), Goods Receipt (#GR-712), and your Invoice #AE-4092 received yesterday, our accounting department identified two billing errors.","First, our order was for 60 units of the ErgoPro Executive Mesh Chair (Item #EP-200M). According to your B2B catalog, orders of 50 or more units qualify for the Tier 3 volume discount (20% off), yet your invoice only applied a 10% Tier 1 discount. This resulted in an under-discount of $1,800.00.","Second, the catalog explicitly states that Tier 3 orders receive complimentary white-glove delivery and assembly, waiving the $450.00 service fee. However, Line 3 of your invoice billed us $450.00 for this service.","Please issue an official Credit Memo for $2,250.00 to correct these two line items. Once the Credit Memo is uploaded to our vendor portal, our treasury bank will release the corrected net wire payment of $14,400.00 prior to the December 4 due date.","Sincerely,","Arthur Pendelton, Chief Accountant, Vance \u0026 Partners Law Firm","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","186. What is the minimum order quantity required to receive free on-site assembly?","(A) 10 units","(B) 29 units","(C) 30 units","(D) 50 units","187. What product did Vance \u0026 Partners purchase?","(A) Motorized sit-stand desks","(B) Executive mesh office chairs","(C) Acoustic conference booths","(D) Modular reception sofas","188. Why did Mr. Pendelton write to Apex Ergonomics?","(A) To return 10 damaged chairs from the November 3 delivery","(B) To request an extension beyond the December 4 payment deadline","(C) To request a billing adjustment for overcharges on an invoice","(D) To change the delivery address for an upcoming furniture order","189. What discount rate should have been applied to Vance \u0026 Partners\u0027 chair purchase?","(A) 10%","(B) 12%","(C) 15%","(D) 20%","190. How much will Vance \u0026 Partners actually wire to Apex Ergonomics?","(A) $14,400.00","(B) $16,200.00","(C) $16,650.00","(D) $18,000.00","1.2. Hướng dẫn làm bài Part 7","CHIẾN THUẬT 5 PHÚT TỐI ƯU: QUÉT 3 ĐIỂM CHẠM, GIẢI ĐỦ 5 CÂU HỎI \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Luồng quy trình Đoạn ba (Quỹ đạo Quét chữ Z \u0026 Bộ lọc 3 Câu hỏi Tiềm thức): • Chiến thuật Đoạn Ba (30 giây = 10s x 3 văn bản) — Quy trình Nghiệp vụ 3 Chặng Khép kín:","- Tuyệt đối KHÔNG đọc sâu thân bài; mắt lướt theo Quỹ đạo hình chữ Z (Z-Pattern Eye Scan) qua 3 điểm chạm:","• Văn bản 1 (Catalog Excerpt - Bảng giá bán sỉ theo bậc B2B):","- Điểm chạm 1 (Nét ngang trên): Tiêu đề \u0027Apex Ergonomics – B2B Wholesale Pricing \u0026 Volume Discounts\u0027 -\u003e Trả lời Q1: Bảng giá chiết khấu bậc thang cho đồ nội thất văn phòng.","- Điểm chạm 2 (Nét chéo xuống footer): Ban Kinh doanh Thương mại Apex Ergonomics -\u003e Trả lời Q2: Nhà sản xuất nội thất quy định điều kiện chiết khấu cho khách mua sỉ.","- Điểm chạm 3 (Nét móc neo hai đầu): Bậc ưu đãi (\u0027Tier 1: 10-29 units 10%; Tier 2: 30-49 units 15%; Tier 3: 50+ units 20% discount and free white-glove assembly waiving $450 fee\u0027) -\u003e Trả lời Q3: Đơn hàng từ 50 chiếc trở lên được giảm 20% và miễn phí lắp đặt $450.","• Văn bản 2 (Invoice - Hóa đơn thương mại tính tiền):","- Điểm chạm 1 (Nét ngang trên): Tiêu đề \u0027COMMERCIAL INVOICE #AE-4092\u0027 -\u003e Trả lời Q1: Hóa đơn tính cước và tiền hàng nội thất.","- Điểm chạm 2 (Nét chéo xuống footer): Customer \u0027Vance \u0026 Partners Law Firm\u0027 \u0026 Vendor \u0027Apex Ergonomics\u0027 -\u003e Trả lời Q2: Hãng luật mua 60 chiếc ghế lưới công thái học EP-200M từ Apex.","- Điểm chạm 3 (Nét móc neo hai đầu): Tính sai cước (\u0027Billed 60 units @ $300 = $18,000, but applied Tier 1 discount 10% (-$1,800) and charged $450 assembly fee, total $16,650\u0027) -\u003e Trả lời Q3: Mua 60 chiếc (thuộc Tier 3) nhưng hóa đơn lại tính nhầm mức chiết khấu Tier 1 và vẫn thu $450 phí lắp ráp.","• Văn bản 3 (E-mail - Thư yêu cầu cấp Credit Memo đối soát chênh lệch):","- Điểm chạm 1 (Nét ngang trên): Dòng \u0027Subject: Invoice #AE-4092 Discrepancy \u0026 Credit Memo Request\u0027 -\u003e Trả lời Q1: Email khiếu nại sai lệch tính tiền và yêu cầu cấp chứng từ ghi có Credit Memo.","- Điểm chạm 2 (Nét chéo xuống footer): \u0027From: Arthur Pendelton, Accounts Payable Manager\u0027 gửi Apex Billing -\u003e Trả lời Q2: Kế toán trưởng bên mua gửi bộ phận kế toán bên bán.","- Điểm chạm 3 (Nét móc neo hai đầu): Yêu cầu điều chỉnh (\u0027demands $2,250 Credit Memo to reflect 20% discount (-$3,600) and waived assembly fee, net payable $14,400\u0027) -\u003e Trả lời Q3: Đòi cấp Credit Memo $2.250 để chuyển khoản số tiền đúng là $14.400.","• Quy trình nghiệp vụ 3 chặng khép kín: Bảng giá (VB1: Mua \u003e= 50 cái hưởng Tier 3 giảm 20% và miễn $450) -\u003e Hóa đơn (VB2: Mua 60 cái nhưng tính nhầm Tier 1 và vẫn thu $450) -\u003e Khiếu nại (VB3: Đòi Credit Memo $2.250 để thanh toán đúng $14.400).","=\u003e Chốt luồng sự việc sau 30s: Vance \u0026 Partners mua 60 ghế (đủ chuẩn Tier 3 giảm 20% và miễn phí lắp đặt $450) nhưng Apex tính nhầm thành Tier 1; kế toán trưởng yêu cầu cấp Credit Memo $2.250 để trả đúng số tiền $14.400.","Bước 2 (20 giây) - Quét nhanh 5 câu hỏi \u0026 Phân loại (Chỉ đọc câu hỏi, KHÔNG đọc 4 đáp án A, B, C, D): • Nguyên tắc đọc Bước 2 (3-4 giây/câu): Lướt nhanh cả 5 câu hỏi trước để gắn \u00275 móc từ khóa\u0027 vào bộ nhớ tạm rồi mới giải cuốn chiếu; TUYỆT ĐỐI CHỈ ĐỌC CÂU HỎI, KHÔNG ĐỌC 4 ĐÁP ÁN (A, B, C, D) để tránh nhiễu 15 phương án bẫy:","Bước 1 — Đọc lướt câu hỏi (60 giây): Câu 186 hỏi mức số lượng tối thiểu để nhận ưu đãi lắp đặt miễn phí (Văn bản 1); Câu 187 hỏi tên sản phẩm Vance \u0026 Partners đặt mua (Kết nối Mã hàng ở Văn bản 2 + Tên sản phẩm ở Văn bản 1); Câu 188 hỏi mục đích viết thư của ông Pendelton (Văn bản 3); Câu 189 hỏi mức chiết khấu đúng theo hợp đồng là bao nhiêu % (Kết nối Số lượng ở Văn bản 2 + Bậc chiết khấu ở Văn bản 1); Câu 190 hỏi số tiền thực tế Vance \u0026 Partners sẽ chuyển khoản sau khi được cấp Credit Memo (Kết nối Văn bản 2 + Văn bản 3).","Bước 3 (3 phút 45 giây) - Cách trả lời \u0026 Dấu hiệu tìm nhanh nhất cho đủ 5 câu hỏi (Giải cuốn chiếu \u0026 Chốt đáp án từng câu): Bước 2 — Đọc Văn bản 1 (80 giây): Nắm vững 3 bậc chiết khấu: Tier 1 (10-29 chiếc: 10%), Tier 2 (30-49 chiếc: 15%), Tier 3 (50 chiếc trở lên: 20% + Miễn phí lắp đặt tại chỗ trị giá $450).","Bước 3 — Đọc Văn bản 2 \u0026 3 (100 giây): Hóa đơn #AE-4092 tính tiền 60 chiếc ghế lưới EP-200M ($18,000) nhưng chỉ trừ chiết khấu Tier 1 (10% = -$1,800) và vẫn tính phí lắp đặt $450 -\u003e Kế toán trưởng Pendelton đối soát 3 chiều (PO - Goods Receipt - Invoice) phát hiện sai lệch và yêu cầu cấp Credit Memo $2,250 để thanh toán số tiền chuẩn $14,400.","Bước 4 (25 giây cuối giờ thi + Củng cố sau giờ thi) - Kiểm tra khóa đáp án \u0026 Đúc kết Feynman 1 câu: Bước 4 — Đối chiếu \u0026 Khoanh đáp án (60 giây): Khớp 60 chiếc \u003e= 50 chiếc thuộc Tier 3 (20% + miễn $450) để chọn ngay đáp án đúng cho các câu hỏi chéo.","1.3. Dịch Song ngữ Xen kẽ Từng Câu (Sentence-by-Sentence Translation)","[Văn bản 1: Trích lục Danh mục Bán sỉ B2B — Apex Ergonomics]","APEX ERGONOMICS COMMERCIAL SUPPLY CATALOG","Corporate Furnishing Solutions — Valid through December 31","DANH MỤC CUNG ỨNG THƯƠNG MẠI APEX ERGONOMICS","Giải pháp Nội thất Doanh nghiệp — Hiệu lực đến ngày 31 tháng 12","1. Ergonomic Seating Collection","• Item #EP-100S — ErgoTask Standard Swivel Chair: $180.00","• Item #EP-200M — ErgoPro Executive Mesh Chair (Lumbar Support): $300.00","• Item #EP-300L — ErgoLuxe Top-Grain Leather Chair: $480.00","1. Bộ sưu tập Ghế Công thái học","• Mã #EP-100S — Ghế xoay Tiêu chuẩn ErgoTask: 180,00 USD","• Mã #EP-200M — Ghế lưới Điều hành ErgoPro (Có đệm tựa lưng): 300,00 USD","• Mã #EP-300L — Ghế da Cao cấp ErgoLuxe: 480,00 USD","2. Corporate Volume Discount Tiers (Applied to Single-Order Quantities)","• Tier 1 (10 to 29 units): 10% discount off standard list price","• Tier 2 (30 to 49 units): 15% discount off standard list price","• Tier 3 (50 or more units): 20% discount off list price + Complimentary white-glove delivery and on-site assembly (standard $450.00 service fee waived)","2. Các Bậc Chiết khấu Số lượng Doanh nghiệp (Áp dụng cho số lượng trên một đơn hàng)","• Bậc 1 (từ 10 đến 29 chiếc): Giảm 10% trên giá niêm yết chuẩn","• Bậc 2 (từ 30 đến 49 chiếc): Giảm 15% trên giá niêm yết chuẩn","• Bậc 3 (từ 50 chiếc trở lên): Giảm 20% trên giá niêm yết + Tặng kèm dịch vụ giao hàng tận nơi cao cấp và lắp đặt hoàn thiện tại chỗ (miễn trừ khoản phí dịch vụ tiêu chuẩn 450,00 USD)","3. Payment \u0026 Settlement Terms","All corporate invoices are payable within 30 days of delivery (Net 30) via Automated Clearing House (ACH) or bank wire transfer. Any billing discrepancies must be reported to Accounts Receivable within 7 business days of invoice receipt.","3. Điều khoản Thanh toán \u0026 Quyết toán","Toàn bộ hóa đơn doanh nghiệp phải được thanh toán trong vòng 30 ngày kể từ ngày giao hàng (Net 30) qua Hệ thống Thanh toán Tự động (ACH) hoặc điện chuyển tiền ngân hàng. Mọi sai lệch về hóa đơn phải được thông báo cho Bộ phận Kế toán Phải thu trong vòng 7 ngày làm việc kể từ khi nhận hóa đơn.","[Văn bản 2: Hóa đơn Thương mại #AE-4092 — Khối Tính cước Thương mại Apex]","APEX ERGONOMICS COMMERCIAL BILLING DIVISION","INVOICE NO.: #AE-4092 | Invoice Date: November 4 | Payment Terms: Net 30","Bill To: Vance \u0026 Partners Law Firm (Attn: Accounts Payable)","1200 Constitution Plaza, Floor 14, Boston, MA 02110","KHỐI TÍNH CƯỚC THƯƠNG MẠI APEX ERGONOMICS","SỐ HÓA ĐƠN: #AE-4092 | Ngày xuất hóa đơn: 04 tháng 11 | Điều khoản thanh toán: Net 30","Đơn vị nhận hóa đơn: Công ty Luật Vance \u0026 Partners (Kính gửi: Phòng Kế toán Phải trả)","Số 1200 Quảng trường Constitution, Tầng 14, Boston, MA 02110","Line Items:","• EP-200M | ErgoPro Executive Mesh Chair | Quantity: 60 Units | Unit List Price: $300.00 | Line Total: $18,000.00","• DISC-T1 | Corporate Volume Discount (Tier 1 — 10% Applied) | -$1,800.00","• SRV-ASM | White-Glove Delivery \u0026 On-Site Assembly Fee | 1 Lot | $450.00","Các Khoản mục Hóa đơn:","• Mã EP-200M | Ghế lưới Điều hành ErgoPro | Số lượng: 60 Chiếc | Đơn giá niêm yết: 300,00 USD | Thành tiền: 18.000,00 USD","• Mã DISC-T1 | Chiết khấu Số lượng Doanh nghiệp (Áp dụng Bậc 1 — Giảm 10%) | -1.800,00 USD","• Mã SRV-ASM | Phí Giao hàng Cao cấp \u0026 Lắp đặt Tại chỗ | 1 Lô | 450,00 USD","TOTAL BALANCE DUE BY DECEMBER 4: $16,650.00","Delivery Note: All 60 chairs were delivered and assembled at Vance \u0026 Partners\u0027 downtown headquarters on November 3 (Signed Goods Receipt #GR-712).","TỔNG SỐ DƯ PHẢI THANH TOÁN TRƯỚC NGÀY 04 THÁNG 12: 16.650,00 USD","Ghi chú Giao hàng: Toàn bộ 60 chiếc ghế đã được bàn giao và lắp đặt hoàn chỉnh tại trụ sở trung tâm của Vance \u0026 Partners vào ngày 03 tháng 11 (Biên bản Nhận hàng đã ký số #GR-712).","[Văn bản 3: Thư điện tử Khiếu nại Sai lệch Hóa đơn \u0026 Yêu cầu Chứng từ Ghi có]","To: Accounts Receivable \u003cbilling@apexergonomics.com\u003e","From: Arthur Pendelton \u003ca.pendelton@vancelaw.com\u003e","Date: November 6","Subject: Billing Discrepancy on Invoice #AE-4092 \u0026 Credit Memo Request","Người nhận: Bộ phận Kế toán Phải thu \u003cbilling@apexergonomics.com\u003e","Người gửi: Arthur Pendelton \u003ca.pendelton@vancelaw.com\u003e","Ngày: 06 tháng 11","Tiêu đề: Sai lệch Tính cước trên Hóa đơn #AE-4092 \u0026 Yêu cầu Phát hành Chứng từ Ghi có (Credit Memo)","Dear Apex Billing Team,","While performing our three-way matching audit between our Purchase Order (#PO-8812), Goods Receipt (#GR-712), and your Invoice #AE-4092 received yesterday, our accounting department identified two billing errors.","Kính gửi Bộ phận Tính cước Apex,","Trong quá trình thực hiện nghiệp vụ kiểm toán đối soát ba chiều (three-way matching) giữa Đơn đặt hàng (#PO-8812), Biên bản Nhận hàng (#GR-712) và Hóa đơn #AE-4092 của quý công ty nhận được hôm qua, phòng kế toán của chúng tôi đã phát hiện hai lỗi tính sai tiền.","First, our order was for 60 units of the ErgoPro Executive Mesh Chair (Item #EP-200M). According to your B2B catalog, orders of 50 or more units qualify for the Tier 3 volume discount (20% off), yet your invoice only applied a 10% Tier 1 discount. This resulted in an under-discount of $1,800.00.","Thứ nhất, đơn hàng của chúng tôi là 60 chiếc Ghế lưới Điều hành ErgoPro (Mã #EP-200M). Theo danh mục B2B của quý công ty, các đơn hàng từ 50 chiếc trở lên đủ điều kiện hưởng chiết khấu số lượng Bậc 3 (giảm 20%), vậy mà hóa đơn của quý vị chỉ áp dụng mức chiết khấu 10% của Bậc 1. Điều này dẫn đến việc giảm thiếu 1.800,00 USD tiền chiết khấu.","Second, the catalog explicitly states that Tier 3 orders receive complimentary white-glove delivery and assembly, waiving the $450.00 service fee. However, Line 3 of your invoice billed us $450.00 for this service.","Thứ hai, danh mục nêu rất rõ rằng các đơn hàng Bậc 3 được tặng kèm dịch vụ giao hàng tận nơi cao cấp và lắp ráp, miễn trừ khoản phí dịch vụ 450,00 USD. Tuy nhiên, Dòng 3 trên hóa đơn lại tính chúng tôi 450,00 USD cho dịch vụ này.","Please issue an official Credit Memo for $2,250.00 to correct these two line items. Once the Credit Memo is uploaded to our vendor portal, our treasury bank will release the corrected net wire payment of $14,400.00 prior to the December 4 due date.","Sincerely,","Arthur Pendelton, Chief Accountant, Vance \u0026 Partners Law Firm","Vui lòng phát hành một Chứng từ Ghi có (Credit Memo) chính thức trị giá 2.250,00 USD để điều chỉnh hai dòng mục này. Ngay khi Chứng từ Ghi có được tải lên cổng thông tin nhà cung cấp của chúng tôi, ngân hàng quản lý ngân quỹ của chúng tôi sẽ giải ngân khoản thanh toán chuyển khoản đúng là 14.400,00 USD trước ngày đến hạn 04 tháng 12.","Trân trọng,","Arthur Pendelton, Kế toán trưởng, Công ty Luật Vance \u0026 Partners","1.4. Dịch chi tiết Câu hỏi \u0026 Phương án Trắc nghiệm","Câu 186. Số lượng đặt hàng tối thiểu bắt buộc để nhận được dịch vụ lắp đặt tận nơi miễn phí là bao nhiêu?","(A) 10 sản phẩm","(B) 29 sản phẩm","(C) 30 sản phẩm","(D) 50 sản phẩm","Câu 187. Công ty Luật Vance \u0026 Partners đã đặt mua sản phẩm nào?","(A) Bàn làm việc nâng hạ bằng động cơ điện","(B) Ghế văn phòng bọc lưới dành cho cấp điều hành","(C) Buồng họp cách âm chuyên dụng","(D) Bộ ghế sofa tiếp khách lắp ghép","Câu 188. Tại sao ông Pendelton lại viết thư gửi cho Apex Ergonomics?","(A) Để trả lại 10 chiếc ghế bị hư hỏng từ đợt giao hàng ngày 03 tháng 11","(B) Để xin gia hạn thêm thời gian thanh toán sau hạn chót ngày 04 tháng 12","(C) Để yêu cầu điều chỉnh hóa đơn đối với các khoản tiền bị tính thừa","(D) Để thay đổi địa chỉ giao hàng cho một đơn đặt mua nội thất sắp tới","Câu 189. Mức tỷ lệ chiết khấu đúng lẽ ra phải được áp dụng cho đơn mua ghế của Vance \u0026 Partners là bao nhiêu?","(A) 10%","(B) 12%","(C) 15%","(D) 20%","Câu 190. Công ty Luật Vance \u0026 Partners thực tế sẽ chuyển khoản ngân hàng bao nhiêu tiền cho Apex Ergonomics?","(A) 14.400,00 USD","(B) 16.200,00 USD","(C) 16.650,00 USD","(D) 18.000,00 USD","1.5. Tóm tắt Viết lại Toàn bài theo Feynman (Feynman Monograph Summary)","English Executive Summary:","• Apex Ergonomics\u0027 B2B catalog offers three volume discount tiers: Tier 1 (10–29 units, 10% off), Tier 2 (30–49 units, 15% off), and Tier 3 (50+ units, 20% off plus a full waiver of the $450 delivery and assembly fee).","• On November 4, Apex bills Vance \u0026 Partners Law Firm $16,650 on Invoice #AE-4092 for 60 ErgoPro Executive Mesh Chairs (#EP-200M at $300 each = $18,000), erroneously applying only the 10% Tier 1 discount (-$1,800) and charging $450 for assembly.","• On November 6, Chief Accountant Arthur Pendelton emails Apex\u0027s billing team after a three-way matching audit, requesting a $2,250 Credit Memo ($1,800 missing Tier 3 discount plus $450 waived assembly fee) so the firm\u0027s bank can wire the corrected balance of $14,400.","Bản tóm tắt Tiếng Việt cốt lõi:","• Danh mục bán sỉ B2B của Apex Ergonomics quy định 3 bậc chiết khấu theo số lượng: Bậc 1 (10–29 chiếc, giảm 10%), Bậc 2 (30–49 chiếc, giảm 15%) và Bậc 3 (từ 50 chiếc trở lên, giảm 20% kèm miễn phí hoàn toàn 450 USD phí giao hàng và lắp đặt).","• Ngày 04/11, Apex xuất Hóa đơn #AE-4092 đòi Công ty Luật Vance \u0026 Partners 16.650 USD cho 60 chiếc ghế lưới điều hành ErgoPro (#EP-200M giá 300 USD/chiếc = 18.000 USD), nhưng lại áp nhầm mức chiết khấu Bậc 1 giảm 10% (-1.800 USD) và vẫn thu 450 USD phí lắp đặt.","• Ngày 06/11, sau khi thực hiện đối soát 3 chiều, Kế toán trưởng Arthur Pendelton gửi email yêu cầu Apex phát hành Chứng từ Ghi có (Credit Memo) trị giá 2.250 USD (1.800 USD tiền chiết khấu thiếu + 450 USD phí lắp đặt được miễn) để ngân hàng của công ty luật giải ngân số tiền đúng là 14.400 USD.","PHẦN 2: ACTIVE RECALL 5 GIÂY (BẢNG MA TRẬN ĐỊNH VỊ SONG NGỮ)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["Đối tượng \u0026 Vai trò: Apex Ergonomics (Nhà cung cấp nội thất văn phòng B2B xuất hóa đơn sai bậc chiết khấu) \u003c-\u003e Vance \u0026 Partners Law Firm (Khách hàng mua 60 ghế thực hiện đối soát 3 chiều và đòi Credit Memo).","Stakeholders \u0026 Roles: Apex Ergonomics (B2B office furniture vendor issuing a miscalculated invoice) \u003c-\u003e Vance \u0026 Partners Law Firm (Corporate buyer of 60 chairs conducting a 3-way match audit and requesting a Credit Memo)."]],[["2. Boi canh \u0026 Quy trinh loi"],["Bối cảnh \u0026 Quy trình lõi: Đối soát 3 Chiều trong Mua sắm B2B (3-Way Matching: PO – Goods Receipt – Invoice): Phát hiện lỗi áp sai bậc chiết khấu sỉ (10% thay vì 20%) và tính nhầm phí lắp đặt được miễn ($450) -\u003e Khóa lệnh thanh toán ngân hàng chờ Credit Memo.","Business Context \u0026 Core Flow: B2B Accounts Payable 3-Way Matching (PO – GR – Invoice): Catching a tier miscalculation (10% instead of 20%) and an unwaived $450 assembly fee -\u003e Holding bank wire release until a $2,250 Credit Memo is issued."]],[["3. Dau vet suy luan cheo"],["Dấu vết suy luận chéo then chốt: Hóa đơn 2 ghi mua 60 chiếc mã EP-200M -\u003e Gióng Bảng 1: EP-200M là ghế lưới điều hành, và 60 chiếc \u003e= 50 nên thuộc Tier 3 (giảm 20% = -$3,600, miễn $450 lắp đặt) -\u003e Chỉ phải trả $14,400.","Key Cross-Referencing Clues: Invoice 2 shows 60 units of EP-200M -\u003e Catalog 1 maps EP-200M to Executive Mesh Chairs and places 60 units in Tier 3 (20% off = -$3,600, $450 fee waived) -\u003e Net payable is $14,400."]]],"t":"table"},"PHẦN 3: ĐÁP ÁN CHUẨN XÁC \u0026 DẤU VẾT TRUY XUẤT CHÉO","186. What is the minimum order quantity required to receive free on-site assembly?","Dap an dung: (D) 50 units","[Dau vet bai doc / Clue]: Văn bản 1 (Catalog Excerpt), Mục 2: \u0027Tier 3 (50 or more units): 20% discount off list price + Complimentary white-glove delivery and on-site assembly (standard $450.00 service fee waived).\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027Complimentary white-glove delivery and on-site assembly (standard $450.00 service fee waived)\u0027 \u003c-\u003e \u0027free on-site assembly\u0027","• \u002750 or more units\u0027 \u003c-\u003e \u0027minimum order quantity of 50 units\u0027","[Loi giai chi tiet]: Mục 2 của bảng giá quy định rõ đơn hàng phải đạt từ 50 sản phẩm trở lên (\u002750 or more units\u0027) mới thuộc Bậc 3 để được tặng kèm miễn phí giao hàng và lắp đặt tại chỗ.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) 10 units","- Ly do sai: 10 sản phẩm chỉ là mức tối thiểu để đạt Bậc 1 (Tier 1) được giảm 10% giá niêm yết, không được miễn phí lắp đặt.","- Bay ETS: Bẫy Mốc Khởi điểm Bậc Thấp (Sub-tier Threshold Trap)","(B) 29 units","- Ly do sai: 29 sản phẩm là mức trần cao nhất của Bậc 1 (10-29 chiếc), vẫn phải trả đủ 450 USD phí dịch vụ lắp đặt.","- Bay ETS: Bẫy Ngưỡng Trần Bậc 1 (Tier 1 Ceiling Distractor)","(C) 30 units","- Ly do sai: 30 sản phẩm là mốc bắt đầu của Bậc 2 (Tier 2, 30-49 chiếc), chỉ được giảm 15% chứ chưa đủ điều kiện miễn phí lắp đặt.","- Bay ETS: Bẫy Bậc Liền kề Gây nhiễu (Adjacent Tier Distractor Trap)","187. What product did Vance \u0026 Partners purchase?","Dap an dung: (B) Executive mesh office chairs","[Dau vet bai doc / Clue]: Văn bản 2 (Invoice #AE-4092): \u0027EP-200M | ErgoPro Executive Mesh Chair | Quantity: 60 Units\u0027 đối chiếu với Văn bản 1 (Catalog), Mục 1: \u0027Item #EP-200M — ErgoPro Executive Mesh Chair (Lumbar Support): $300.00\u0027.","[Dien dat tuong duong / Paraphrase]: • \u0027ErgoPro Executive Mesh Chair\u0027 \u003c-\u003e \u0027Executive mesh office chairs\u0027","• \u0027Item #EP-200M\u0027 (Mã định danh sản phẩm được liên kết chéo giữa hóa đơn và bảng giá)","[Loi giai chi tiet]: Đối chiếu mã hàng EP-200M trên hóa đơn và danh mục sản phẩm cho thấy Vance \u0026 Partners đã mua 60 chiếc ghế văn phòng bọc lưới dành cho cấp điều hành.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Motorized sit-stand desks","- Ly do sai: Bàn nâng hạ bằng điện hoàn toàn không xuất hiện trong danh mục sản phẩm của Apex Ergonomics.","- Bay ETS: Bẫy Thông tin Không được Đề cập (Not Mentioned Trap)","(C) Acoustic conference booths","- Ly do sai: Buồng cách âm không nằm trong đơn hàng mua sắm của công ty luật.","- Bay ETS: Bẫy Sản phẩm Sai lệch Ngành hàng (Irrelevant Product Trap)","(D) Modular reception sofas","- Ly do sai: Ghế sofa phòng tiếp khách không phải là mặt hàng mã EP-200M.","- Bay ETS: Bẫy Sản phẩm Ngoại lai (Unrelated Item Trap)","188. Why did Mr. Pendelton write to Apex Ergonomics?","Dap an dung: (C) To request a billing adjustment for overcharges on an invoice","[Dau vet bai doc / Clue]: Văn bản 3 (E-mail), Tiêu đề \u0026 Đoạn 1: \u0027Subject: Billing Discrepancy on Invoice #AE-4092 \u0026 Credit Memo Request... our accounting department identified two billing errors... Please issue an official Credit Memo for $2,250.00 to correct these two line items.\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027Billing Discrepancy... identified two billing errors... Credit Memo Request\u0027 \u003c-\u003e \u0027request a billing adjustment for overcharges on an invoice\u0027","[Loi giai chi tiet]: Ông Pendelton viết thư để thông báo hai lỗi tính thừa tiền trên Hóa đơn #AE-4092 và yêu cầu phát hành Chứng từ ghi có (Credit Memo) điều chỉnh giảm 2.250 USD.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) To return 10 damaged chairs from the November 3 delivery","- Ly do sai: Toàn bộ 60 ghế đã được bàn giao đầy đủ nguyên vẹn theo biên bản ký nhận #GR-712, không hề có ghế bị hư hỏng để đổi trả.","- Bay ETS: Bẫy Bịa đặt Sự cố Hư hỏng Hàng hóa (Fabricated Defect Trap)","(B) To request an extension beyond the December 4 payment deadline","- Ly do sai: Ông Pendelton khẳng định sẽ thanh toán trước hạn 04/12 ngay khi nhận được Credit Memo chứ không hề xin gia hạn nợ.","- Bay ETS: Bẫy Trái ngược với Kế hoạch Thanh toán (Opposite Intent Trap)","(D) To change the delivery address for an upcoming furniture order","- Ly do sai: Hàng đã giao xong tại trụ sở Boston ngày 03/11, không có nội dung nào xin đổi địa chỉ giao hàng.","- Bay ETS: Bẫy Lỗi thời Gian Luân chuyển (Post-Delivery Temporal Trap)","189. What discount rate should have been applied to Vance \u0026 Partners\u0027 chair purchase?","Dap an dung: (D) 20%","[Dau vet bai doc / Clue]: Văn bản 2 (Invoice): \u0027Quantity: 60 Units\u0027 kết nối với Văn bản 1 (Catalog): \u0027Tier 3 (50 or more units): 20% discount off list price\u0027 và Văn bản 3 (E-mail): \u0027orders of 50 or more units qualify for the Tier 3 volume discount (20% off)\u0027.","[Dien dat tuong duong / Paraphrase]: • \u002760 Units\u0027 \u003e= \u002750 or more units\u0027 \u003c-\u003e \u0027qualify for Tier 3 volume discount (20% off)\u0027","[Loi giai chi tiet]: Truy xuất chéo: Khách hàng mua 60 chiếc ghế (lớn hơn ngưỡng 50 chiếc của Bậc 3), do đó mức chiết khấu đúng theo hợp đồng là 20% chứ không phải 10% như hóa đơn đã tính nhầm.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) 10%","- Ly do sai: 10% là tỷ lệ chiết khấu Bậc 1 bị tính nhầm trên Hóa đơn #AE-4092, đây là lỗi sai đang bị khiếu nại.","- Bay ETS: Bẫy Con số Xuất hiện trên Hóa đơn Sai (Erroneous Invoice Trap)","(B) 12%","- Ly do sai: Con số 12% hoàn toàn không tồn tại trong bất kỳ văn bản nào của bài đọc.","- Bay ETS: Bẫy Số liệu Bịa đặt Hoàn toàn (Fabricated Figure Trap)","(C) 15%","- Ly do sai: 15% là tỷ lệ chiết khấu của Bậc 2 (chỉ áp dụng cho đơn từ 30 đến 49 chiếc), không khớp với số lượng 60 chiếc.","- Bay ETS: Bẫy Bậc Chiết khấu Kế cận (Adjacent Tier Trap)","190. How much will Vance \u0026 Partners actually wire to Apex Ergonomics?","Dap an dung: (A) $14,400.00","[Dau vet bai doc / Clue]: Văn bản 3 (E-mail), Đoạn cuối: \u0027Once the Credit Memo is uploaded to our vendor portal, our treasury bank will release the corrected net wire payment of $14,400.00 prior to the December 4 due date.\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027release the corrected net wire payment of $14,400.00\u0027 \u003c-\u003e \u0027actually wire $14,400.00\u0027","• Tính toán đối soát: $18,000 (Tổng giá gốc) - 20% Chiết khấu ($3,600) + $0 Phí lắp đặt = $14,400.00","[Loi giai chi tiet]: Giá niêm yết 60 ghế là 18.000 USD. Sau khi trừ 20% chiết khấu (-3.600 USD) và được miễn phí lắp đặt (0 USD), tổng số tiền chuyển khoản đúng mà Vance \u0026 Partners sẽ thanh toán là 14.400,00 USD.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(B) $16,200.00","- Ly do sai: 16.200 USD là số tiền nếu trừ chiết khấu 10% (-$1,800) nhưng bỏ phí lắp đặt, không phải là con số thanh toán cuối cùng.","- Bay ETS: Bẫy Phép tính Trung gian Nửa vời (Partial Calculation Trap)","(C) $16,650.00","- Ly do sai: 16.650 USD là tổng số tiền bị tính sai trên Hóa đơn #AE-4092 ban đầu trước khi đối soát điều chỉnh.","- Bay ETS: Bẫy Số dư Ban đầu Chưa Điều chỉnh (Pre-Adjustment Balance Trap)","(D) $18,000.00","- Ly do sai: 18.000 USD là tổng giá trị đơn hàng tính theo giá niêm yết nguyên giá chưa áp dụng bất kỳ khoản chiết khấu nào.","- Bay ETS: Bẫy Tổng Giá Niêm yết Gốc (Full Gross List Price Trap)","PHẦN 4: KỸ THUẬT FEYNMAN SONG NGỮ \u0026 SƠ ĐỒ QUY TRÌNH (TƯ DUY PHÂN TÍCH NGHIỆP VỤ CHUỖI CUNG ỨNG \u0026 BA)","4.1. Sơ đồ Quy trình Luân chuyển Nghiệp vụ (End-to-End 3-Way Matching, Credit Memo \u0026 Bank Wire Release)","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","Xuất kho Bàn giao Hàng hóa \u0026 Lập Hóa đơn Thương mại (Dispatch, Delivery \u0026 Invoicing)"],[],["BƯỚC 2","Kiểm toán Đối soát 3 Chiều \u0026 Phát hiện Sai lệch (Accounts Payable 3-Way Matching Audit)"],[],["BƯỚC 3","Phát hành Chứng từ Ghi có \u0026 Giải ngân Điện chuyển tiền Ngân hàng (Credit Memo \u0026 Wire Release)"]],[["• Chung tu \u0026 Kenh: Kho Apex Ergonomics -\u003e Trụ sở Vance \u0026 Partners -\u003e Cổng ERP Kế toán","• Nghiep vu thuc thi: Giao 60 ghế ErgoPro EP-200M và lắp đặt hoàn thiện tại chỗ; ký nhận Biên bản Giao hàng #GR-712; Khối tính cước Apex phát hành Hóa đơn #AE-4092 đòi $16,650 (áp nhầm Tier 1 giảm 10% và tính $450 phí lắp đặt)","• Ket qua \u0026 Kiem soat: Hóa đơn Thương mại #AE-4092 + Biên bản Giao nhận Hàng hóa #GR-712"],["➔"],["• Chung tu \u0026 Kenh: Phòng Kế toán Phải trả Vance \u0026 Partners (Arthur Pendelton)","• Nghiep vu thuc thi: Đối chiếu 3 chứng từ: Đơn đặt hàng PO-8812 (60 ghế) x Biên bản nhận hàng GR-712 (60 ghế) x Hóa đơn AE-4092; phát hiện áp sai mức chiết khấu Tier 3 (20%) thành Tier 1 (10%) và tính sai phí dịch vụ được miễn ($450)","• Ket qua \u0026 Kiem soat: Báo cáo Sai lệch Tính cước (Discrepancy Flag) + Khóa lệnh giải ngân thanh toán ngân hàng"],["➔"],["• Chung tu \u0026 Kenh: Bộ phận Billing Apex -\u003e Ngân hàng Quản lý Ngân quỹ Vance \u0026 Partners","• Nghiep vu thuc thi: Apex phát hành Chứng từ Ghi có (Credit Memo) điều chỉnh giảm $2,250; Kế toán Vance \u0026 Partners nạp Credit Memo vào ERP để cấn trừ hóa đơn; ngân hàng giải ngân lệnh chuyển tiền $14,400 trước ngày 04/12","• Ket qua \u0026 Kiem soat: Chứng từ Ghi có Credit Memo $2,250 + Điện xác nhận Chuyển tiền Ngân hàng Wire Confirmation $14,400"]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["STEP 1","DISPATCH, DELIVERY \u0026 INVOICE ISSUANCE"],[],["STEP 2","ACCOUNTS PAYABLE 3-WAY MATCHING AUDIT \u0026 DISCREPANCY IDENTIFICATION"],[],["STEP 3","CREDIT MEMO ISSUANCE \u0026 NET BANK WIRE CLEARING"]],[["• Documents \u0026 Channels: Apex Ergonomics Warehouse -\u003e Vance \u0026 Partners HQ -\u003e ERP Billing Module","• Core Business Execution: Deliver 60 ErgoPro EP-200M chairs with on-site assembly; endorse Delivery Receipt #GR-712; Apex billing issues Invoice #AE-4092 demanding $16,650 (erroneously applying 10% Tier 1 discount and charging $450 assembly).","• Key Deliverable \u0026 Control: Commercial Invoice #AE-4092 + Goods Receipt Note #GR-712"],["➔"],["• Documents \u0026 Channels: Vance \u0026 Partners Accounts Payable Department (Arthur Pendelton)","• Core Business Execution: Reconcile 3 core documents: PO-8812 (60 units) x Goods Receipt GR-712 (60 units) x Invoice AE-4092; identify billing variance: failure to apply 20% Tier 3 discount and unlawful assessment of waived $450 assembly fee.","• Key Deliverable \u0026 Control: Discrepancy Flag report and immediate payment freeze on commercial bank disbursement"],["➔"],["• Documents \u0026 Channels: Apex Billing Department -\u003e Vance \u0026 Partners Corporate Treasury Bank","• Core Business Execution: Apex issues $2,250 Credit Memo; Vance \u0026 Partners AP logs Credit Memo in ERP to offset payable balance; treasury authorizes commercial bank wire of corrected balance ($14,400) prior to December 4.","• Key Deliverable \u0026 Control: Credit Memo $2,250 + Electronic Bank Wire Confirmation of $14,400 full settlement"]]],"t":"table"},"4.2. Giải thích Bản chất theo Tư duy Nguyên bản (First Principles) \u0026 Phương pháp Feynman (Tiếng Việt)","• Bản chất Luồng End-to-End (3 Dòng chảy đồng bộ — Thực thể + Pháp lý/Chứng từ + Ngân hàng/Kế toán): (1) Dòng chảy Vật lý (Physical Flow): 60 chiếc ghế lưới ErgoPro EP-200M được đội xe tải Apex vận chuyển từ kho đến tòa nhà của công ty luật Vance \u0026 Partners tại Boston, bốc dỡ bằng dịch vụ cao cấp và lắp ráp hoàn chỉnh tại tầng 14 vào ngày 03/11; (2) Dòng chảy Pháp lý \u0026 Chứng từ (Legal \u0026 Documentary Flow): Hợp đồng khung B2B quy định 3 bậc giá sỉ; khi giao hàng xong, đại diện khách hàng ký nhận Biên bản nhận hàng #GR-712. Khối kế toán nhận Hóa đơn #AE-4092 nhưng đối soát thấy lệch so với Đơn đặt hàng #PO-8812, lập tức gửi thư khiếu nại chính thức yêu cầu phát hành Chứng từ Ghi có (Credit Memo) trị giá 2.250 USD để làm căn cứ pháp lý sửa đổi số tiền trên hóa đơn; (3) Dòng chảy Ngân hàng \u0026 Kế toán (Banking \u0026 Accounting Flow): Hệ thống ERP tự động khóa lệnh chuyển tiền qua mạng lưới ACH/Wire khi phát hiện đối soát 3 chiều không khớp (3-Way Match Exception). Chỉ khi Apex tải Credit Memo lên để cấn trừ công nợ phải trả, kế toán trưởng mới phê duyệt lệnh chuyển tiền thực tế 14.400 USD trước hạn chót Net 30 ngày 04/12.","• Điểm nghẽn Cốt lõi (Core Bottleneck): Sự thiếu đồng bộ dữ liệu giữa bảng giá khuyến mãi bán hàng (Sales Pricing Master Data) và hệ thống sinh hóa đơn tự động (Automated Billing Engine). Nhân viên kinh doanh chốt đơn 60 ghế theo chính sách Tier 3, nhưng hệ thống tính cước mặc định lấy hạn mức Bậc 1 khiến khách hàng bị tính thừa 2.250 USD. Nếu không có quy trình đối soát 3 chiều, doanh nghiệp mua sẽ bị thất thoát tài chính nghiêm trọng.","• 3 Giải pháp Hệ thống cho Chuyên viên Phân tích Nghiệp vụ (BA Solutions):","(1) Xây dựng Công cụ Đối soát 3 Chiều Tự động (Automated 3-Way Matching Engine): Cấu hình hệ thống ERP tự động so khớp từng dòng hàng giữa PO, GR và Invoice; nếu chênh lệch đơn giá, tỷ lệ chiết khấu hoặc phụ phí \u003e 0%, hệ thống tự động gắn cờ chặn thanh toán (Payment Block) và gửi thông báo cho kế toán.","(2) Tự động hóa Luồng Đề nghị \u0026 Cấn trừ Credit Memo (Automated Credit Memo Workflow): Khi nhà cung cấp chấp nhận khiếu nại sai cước, hệ thống tự động sinh số Credit Memo liên kết trực tiếp với mã Hóa đơn gốc, tự động trừ số dư công nợ phải trả (Accounts Payable Ledger) mà không cần can thiệp thủ công.","(3) Kiểm soát Điều kiện Bậc Giá theo Số lượng Tồn kho Khả dụng (Tiered Pricing Validation Rule): Thiết lập validation rule trên hệ thống bán hàng: Cứ số lượng đơn hàng \u003e= 50 chiếc thì bắt buộc áp dụng mã chiết khấu DISC-T3 (20%) và tự động gán đơn giá phí lắp đặt SRV-ASM = 0 USD.","4.3. Giải thích Chuyên sâu Song ngữ (Bilingual First Principles \u0026 Feynman Analysis - English)","• End-to-End Flow Nature (3 Synchronized Streams — Physical + Legal/Documentary + Banking/Accounting): (1) Physical Flow: 60 units of ErgoPro EP-200M mesh chairs are dispatched from Apex\u0027s warehouse, transported to Vance \u0026 Partners\u0027 14th-floor Boston office, and assembled on site on November 3; (2) Legal \u0026 Documentary Flow: The commercial B2B relationship is governed by the Wholesale Catalog tier policies; post-delivery, the buyer signs Goods Receipt #GR-712. Upon receiving Invoice #AE-4092, the accounting team identifies a breach of Tier 3 terms and issues an official dispute letter demanding a $2,250.00 Credit Memo to legally rectify the payable balance; (3) Banking \u0026 Accounting Flow: The ERP system places an automated payment hold on ACH/bank wire execution due to a 3-way matching discrepancy. Once the Credit Memo offsets the accounts payable sub-ledger, corporate treasury releases the corrected net wire transfer of $14,400.00 within Net 30 terms.","• Core Bottleneck: Data misalignment between front-end commercial discount policies and back-end billing configuration. The sales order for 60 units met Tier 3 criteria, yet the billing software defaulted to Tier 1 pricing and failed to suppress the assembly surcharge, creating an unwarranted $2,250.00 overcharge. Without rigorous 3-way matching, corporate buyers suffer cash-flow leakage.","• 3 Systemic BA Solutions:","(1) Automated 3-Way Matching Engine: Configure ERP algorithms to perform line-by-line tolerance checks across PO, GR, and Invoice data; any variance in discount tiers or service waivers instantly triggers an automated payment hold.","(2) Integrated Credit Memo Clearing Workflow: Enable an electronic dispute portal where approved Credit Memos automatically adjust open AP invoice line items and recalculate net remittance amounts in real time.","(3) Dynamic Pricing Validation Rules: Embed constraint logic into the B2B catalog order entry system: any order quantity exceeding 49 units must mandate Tier 3 pricing (20% off) and enforce a $0 override on white-glove assembly line items.","PHẦN 5: BẢNG TỪ VỰNG \u0026 CẤU TRÚC CỐT LÕI (8 THUẬT NGỮ B2B \u0026 KẾ TOÁN ĐỐI SOÁT)","1. volume discount tier (n phr)  /ˈvɑːljuːm ˈdɪskaʊnt tɪr/  = bulk purchase discount level / tiered wholesale pricing","Nghia: Bậc chiết khấu theo số lượng (mua càng nhiều giá càng giảm)","Vd: Orders of 50 or more units qualify for the Tier 3 volume discount. - Các đơn hàng từ 50 sản phẩm trở lên đủ điều kiện hưởng chiết khấu số lượng Bậc 3.","2. three-way matching (n phr)  /θriː weɪ ˈmætʃɪŋ/  = verification comparing PO, Goods Receipt, and Vendor Invoice","Nghia: Đối soát 3 chiều (đối chiếu Đơn đặt hàng, Phiếu giao nhận hàng và Hóa đơn)","Vd: Our accounting team detected two billing errors during the three-way matching audit. - Đội ngũ kế toán của chúng tôi đã phát hiện hai lỗi lập hóa đơn trong quá trình kiểm toán đối soát ba chiều.","3. credit memo (n phr)  /ˈkredɪt ˈmemoʊ/  = credit note / invoice reduction voucher / negative adjustment document","Nghia: Chứng từ ghi có (văn bản của bên bán giảm trừ tiền trên hóa đơn cho bên mua)","Vd: Please issue an official Credit Memo for $2,250.00 to correct these overcharges. - Vui lòng phát hành Chứng từ Ghi có chính thức trị giá 2.250,00 USD để điều chỉnh các khoản tính thừa này.","4. discrepancy (n)  /dɪˈskrepənsi/  = inconsistency / mismatch / variance / billing error","Nghia: Sự sai lệch / Điểm không khớp giữa các chứng từ","Vd: Any billing discrepancies must be reported to Accounts Receivable within 7 business days. - Mọi sự sai lệch về tính cước phải được báo cáo cho Bộ phận Kế toán Phải thu trong vòng 7 ngày làm việc.","5. waive (v) / waiver (n)  /weɪv/ - /ˈweɪvər/  = forgo / exempt / eliminate a required fee or rule","Nghia: Miễn trừ / Bỏ qua không thu phí (hoặc không áp dụng một điều kiện)","Vd: The standard $450.00 white-glove assembly service fee is waived for Tier 3 orders. - Khoản phí dịch vụ lắp ráp cao cấp tiêu chuẩn 450,00 USD được miễn trừ cho các đơn hàng Bậc 3.","6. Net 30 (n phr)  /net ˈθɜːrti/  = full payment due within 30 days of invoice date","Nghia: Điều khoản thanh toán Net 30 (thanh toán toàn bộ trong vòng 30 ngày kể từ ngày giao hàng/hóa đơn)","Vd: All corporate invoices are payable within 30 days of delivery (Net 30) via bank wire. - Toàn bộ hóa đơn doanh nghiệp phải được thanh toán trong vòng 30 ngày kể từ ngày giao hàng (Net 30) qua chuyển khoản.","7. Automated Clearing House (ACH) (n phr)  /ˈɔːtəmeɪtɪd ˈklɪrɪŋ haʊs/  = electronic interbank fund transfer network / electronic payment","Nghia: Hệ thống thanh toán bù trừ tự động giữa các ngân hàng","Vd: Payment can be settled through an Automated Clearing House (ACH) transfer. - Khoản thanh toán có thể được quyết toán thông qua hình thức chuyển khoản bù trừ tự động (ACH).","8. under-discount (n/v)  /ˈʌndər ˈdɪskaʊnt/  = insufficient deduction / failure to apply full rebate","Nghia: Chiết khấu thiếu / Không áp dụng đủ số tiền giảm giá theo quy định","Vd: Applying a 10% rate instead of 20% resulted in an under-discount of $1,800.00. - Việc áp dụng tỷ lệ 10% thay vì 20% đã dẫn đến khoản chiết khấu thiếu là 1.800,00 USD.","==================================================================================================","BÀI 2: THƯ MỜI THẦU CUNG ỨNG BAO BÌ SINH HỌC (RFP), MA TRẬN CHẤM THẦU \u0026 THÔNG BÁO TRÚNG THẦU KÈM BẢO LÃNH NGÂN HÀNG (RFP BIDDING, VENDOR MATRIX \u0026 PERFORMANCE BOND)","Nguồn bài học: ETS TOEIC Part 7 (Triple Passage - Cụm 3 đoạn văn: Request for Proposals, Bid Evaluation Table \u0026 Contract Award E-mail, Questions 191-195)","PHẦN 1: NỘI DUNG VĂN BẢN \u0026 DỊCH THUẬT SONG NGỮ","1.1. Đề thi Tiếng Anh gốc (Strategy Guide \u0026 Original ETS Passages)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","Request for Proposals (Public Tender Notice)","VERDANT ORGANIC FOODS CORPORATION","REQUEST FOR PROPOSALS (RFP #VF-2026-08)","Annual Supply Contract: 2,000,000 Biodegradable Takeout Containers","1. Project Scope:","Verdant Organic Foods invites sealed bids from qualified packaging manufacturers to supply 2,000,000 molded-fiber biodegradable meal containers for our 45 regional supermarket delis over a 12-month period.","2. Mandatory Qualification Criteria (Knock-Out Requirements):","Proposals that fail to meet any of the following three mandatory benchmarks will be automatically disqualified during technical screening:","• Environmental Certification: Bidders must hold an active ISO-14855 industrial compostability certificate.","• Delivery Lead Time: Vendors must guarantee a maximum replenishment lead time of 10 business days from purchase order issuance to regional warehouse delivery.","• Unit Price Ceiling: Quoted wholesale price must not exceed $0.45 per container (inclusive of domestic freight).","3. Financial Security Requirement:","Within 10 days of contract award, the winning supplier must furnish an irrevocable Bank Performance Bond equal to 10% of the total annual contract value to guarantee uninterrupted supply.","Bid Evaluation Matrix (Internal Table)","VERDANT PROCUREMENT COMMITTEE — VENDOR BID EVALUATION SUMMARY","RFP Reference: #VF-2026-08 | Evaluation Date: April 12","Bidder Name | Quoted Unit Price | ISO-14855 Certified? | Delivery Lead Time | Committee Status","----------------------------------------------------------------------------------------------------","1. EcoPack Industries | $0.42 / unit | Yes (Verified) | 14 business days | Disqualified","2. BioBox Packaging | $0.39 / unit | Pending Approval | 7 business days | Disqualified","3. TerraWrap Solutions | $0.44 / unit | Yes (Verified) | 8 business days | Approved","4. GreenFiber Corp | $0.48 / unit | Yes (Verified) | 6 business days | Disqualified","Committee Note: Total annual contract value for the approved bidder (2,000,000 units x $0.44) equals $880,000.00.","E-mail (Official Contract Award)","To: Linnea Lindholm, Director of Enterprise Sales \u003cl.lindholm@terrawrap.com\u003e","From: Marcus Vance, Chief Procurement Officer \u003cm.vance@verdantfoods.com\u003e","Date: April 15","Subject: Official Contract Award for RFP #VF-2026-08","Dear Ms. Lindholm,","On behalf of Verdant Organic Foods\u0027 Procurement Committee, I am pleased to inform you that TerraWrap Solutions has been awarded the 12-month supply contract for RFP #VF-2026-08 at your quoted rate of $0.44 per unit (total contract value: $880,000.00).","Although three other manufacturers submitted competitive proposals, TerraWrap was the only bidder to satisfy all three mandatory technical, delivery, and pricing criteria stipulated in our RFP.","In accordance with Section 3 of the tender rules, please instruct your corporate bank to issue the mandatory 10% Performance Bond ($88,000.00) in favor of Verdant Organic Foods no later than April 25. Once our treasury department verifies the bank bond, we will issue our first Purchase Order for 250,000 containers.","Sincerely,","Marcus Vance","Chief Procurement Officer, Verdant Organic Foods","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","191","(A) $0.39","(B) $0.42","(C) $0.45","(D) $0.48","192","(A) Its quoted unit price exceeded the budget ceiling.","(B) Its delivery lead time was longer than the permitted maximum.","(C) It lacked an active ISO-14855 environmental certificate.","(D) It refused to supply all 45 regional supermarkets.","193","(A) EcoPack Industries","(B) BioBox Packaging","(C) TerraWrap Solutions","(D) GreenFiber Corp","194","(A) It offered the fastest delivery time of six business days.","(B) It was the previous packaging supplier for Verdant Organic Foods.","(C) It agreed to waive the first month\u0027s shipping charges.","(D) It was the only bidder that met all three mandatory requirements.","195","(A) A bank performance guarantee for $88,000","(B) An initial shipment of 250,000 food containers","(C) A renewed ISO-14855 laboratory test report","(D) A refund check for defective packaging","1.2. Hướng dẫn làm bài Part 7","CHIẾN THUẬT 5 PHÚT TỐI ƯU: QUÉT 3 ĐIỂM CHẠM, GIẢI ĐỦ 5 CÂU HỎI \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Luồng quy trình Đoạn ba (Quỹ đạo Quét chữ Z \u0026 Bộ lọc 3 Câu hỏi Tiềm thức): • Chiến thuật Đoạn Ba (30 giây = 10s x 3 văn bản) — Quy trình Nghiệp vụ 3 Chặng Khép kín:","- Tuyệt đối KHÔNG đọc sâu thân bài; mắt lướt theo Quỹ đạo hình chữ Z (Z-Pattern l master supply contract and furnish performance bond before October 15\u0027) -\u003e Trả lời Q3: Mời ký hợp đồng nguyên tắc và nộp bảo lãnh thực hiện hợp đồng trước ngày 15/10.","• Quy trình nghiệp vụ 3 chặng khép kín: Mời thầu (RFP: Tiêu chí giá 40%, phân hủy 30%) -\u003e Chấm thầu (Matrix: GreenPack dẫn đầu 92.5 điểm) -\u003e Trao thầu (Email: Thông báo trúng thầu, hẹn nộp bảo lãnh trước 15/10).","=\u003e Chốt luồng sự việc sau 30s: BioLife Foods phát hành RFP tìm bao bì sinh học; sau khi chấm ma trận 4 tiêu chí, GreenPack Solutions đạt điểm cao nhất (92.5) và nhận thông báo trúng thầu để ký hợp đồng trước ngày 15/10.","Bước 2 (20 giây) - Quét nhanh 5 câu hỏi \u0026 Phân loại (Chỉ đọc câu hỏi, KHÔNG đọc 4 đáp án A, B, C, D): • Nguyên tắc đọc Bước 2 (3-4 giây/câu): Lướt nhanh 5 câu hỏi trước để gắn \u00275 móc từ khóa\u0027 vào bộ nhớ tạm:","• Q191: Thấy \u0027What is the maximum unit price Verdant Organic Foods is willing to pay\u0027 -\u003e Câu hỏi Chi tiết con số ở Văn bản 1 (Móc: mức giá trần tối đa cho mỗi hộp).","• Q192: Thấy \u0027Why was EcoPack Industries disqualified from the bidding process\u0027 -\u003e Câu ghép nối Văn bản 1 + 2 (Móc: lý do EcoPack bị loại).","• Q193: Thấy \u0027Which vendor offered the lowest price per container\u0027 -\u003e Câu hỏi Tra bảng ở Văn bản 2 (Móc: nhà thầu nào chào giá thấp nhất).","• Q194: Thấy \u0027Why did TerraWrap Solutions win the contract\u0027 -\u003e Câu ghép nối Văn bản 1 + 2 + 3 (Móc: lý do TerraWrap trúng thầu).","• Q195: Thấy \u0027What must Ms. Lindholm submit by April 25\u0027 -\u003e Câu hỏi Chi tiết hành động ở Văn bản 3 (Móc: bà Lindholm phải nộp chứng từ gì trước 25/4).","Bước 3 (3 phút 45 giây) - Cách trả lời \u0026 Dấu hiệu tìm nhanh nhất cho đủ 5 câu hỏi (Giải cuốn chiếu \u0026 Chốt đáp án từng câu): • Q191 (Câu hỏi Chi tiết - 20s): [Dấu hiệu tìm nhanh nhất]: Quét Mục 2 Văn bản 1 tìm \u0027Unit Price Ceiling\u0027: \u0027Quoted price must not exceed $0.45 per container\u0027 =\u003e $0.45 =\u003e Chọn (C).","• Q192 (Câu ghép nối Văn bản 1 + 2 - 45s): [Dấu hiệu tìm nhanh nhất]: Gióng dòng \u0027EcoPack Industries\u0027 trên Bảng 2: Giá $0.42 (Đạt \u003c= $0.45), ISO-14855: Yes (Đạt), nhưng cột \u0027Delivery Lead Time\u0027 là \u002714 business days\u0027. Gióng lên Mục 2 Văn bản 1: Yêu cầu bắt buộc là \u0027maximum lead time of 10 business days\u0027 =\u003e Thời gian giao hàng của EcoPack vượt quá giới hạn 10 ngày =\u003e Chọn (B).","• Q193 (Câu hỏi Bảng biểu - 20s): [Dấu hiệu tìm nhanh nhất]: Nhìn cột \u0027Quoted Unit Price\u0027 của cả 4 nhà thầu ở Bảng 2: EcoPack ($0.42), BioBox ($0.39), TerraWrap ($0.44), GreenFiber ($0.48) =\u003e Thấp nhất là $0.39 của BioBox Packaging (nhưng BioBox bị loại vì không có chứng chỉ ISO) =\u003e Chọn (B).","• Q194 (Câu ghép nối Văn bản 1 + 2 + 3 - 50s): [Dấu hiệu tìm nhanh nhất]: Văn bản 3 câu 2 giải thích rõ: \u0027TerraWrap was the only bidder to satisfy all three mandatory technical and commercial criteria stipulated in the RFP\u0027 (BioBox thiếu ISO, EcoPack giao trễ 14 ngày, GreenFiber giá đắt $0.48 \u003e $0.45) =\u003e Là nhà thầu duy nhất đáp ứng đầy đủ cả 3 tiêu chuẩn bắt buộc =\u003e Chọn (D).","• Q195 (Câu hỏi Chi tiết - 25s): [Dấu hiệu tìm nhanh nhất]: Quét Văn bản 3 tìm mốc \u0027April 25\u0027: \u0027instruct your corporate bank to issue the mandatory 10% Performance Bond ($88,000) in favor of Verdant Organic Foods no later than April 25\u0027 =\u003e Chứng thư bảo lãnh thực hiện hợp đồng từ ngân hàng =\u003e Chọn (A).","Bước 4 (25 giây cuối giờ thi + Củng cố sau giờ thi) - Kiểm tra khóa đáp án \u0026 Đúc kết Feynman 1 câu: • [Trong 5 phút làm bài - 25 giây cuối]: Kiểm tra nhanh bẫy Q193 (hỏi ai chào giá thấp nhất = BioBox $0.39, khác với ai trúng thầu = TerraWrap $0.44), khóa sổ 5 đáp án C - B - B - D - A.","• [Sau khi làm bài - Củng cố kiến thức dài hạn bằng Feynman]: Tự đúc kết 1 câu tiếng Việt đời thường: \u0027Đấu thầu 2 triệu hộp thức ăn hữu cơ: BioBox rẻ nhất ($0.39) nhưng thiếu chứng chỉ ISO, EcoPack giao chậm 14 ngày, GreenFiber vượt giá trần $0.45, nên chỉ có TerraWrap ($0.44, có ISO, giao 8 ngày) trúng thầu và phải nộp bảo lãnh ngân hàng 10%.\u0027","1.3. Dịch Song ngữ Xen kẽ Từng Câu (Sentence-by-Sentence Translation)","Văn bản 1: Hồ sơ Mời thầu Cung ứng Bao bì Phân hủy Sinh học (Request for Proposals - RFP)","VERDANT ORGANIC FOODS CORPORATION","REQUEST FOR PROPOSALS (RFP #VF-2026-08)","Annual Supply Contract: 2,000,000 Biodegradable Takeout Containers","TẬP ĐOÀN THỰC PHẨM HỮU CƠ VERDANT","THÔNG BÁO MỜI THẦU (HỒ SƠ MỜI THẦU SỐ #VF-2026-08)","Hợp đồng Cung ứng Thường niên: 2.000.000 Hộp Đựng Thực phẩm Phân hủy Sinh học","1. Project Scope: Verdant Organic Foods invites sealed bids from qualified packaging manufacturers to supply 2,000,000 molded-fiber biodegradable meal containers for our 45 regional supermarket delis over a 12-month period.","1. Phạm vi Dự án: Tập đoàn Thực phẩm Hữu cơ Verdant kính mời các nhà sản xuất bao bì đủ năng lực nộp hồ sơ dự thầu niêm phong để cung cấp 2.000.000 hộp đựng suất ăn bằng sợi ép phân hủy sinh học cho 45 quầy ẩm thực siêu thị khu vực của chúng tôi trong thời hạn 12 tháng.","2. Mandatory Qualification Criteria (Knock-Out Requirements): Proposals that fail to meet any of the following three mandatory benchmarks will be automatically disqualified during technical screening:","2. Tiêu chí Năng lực Bắt buộc (Tiêu chí Loại trực tiếp): Các hồ sơ dự thầu không đáp ứng được bất kỳ tiêu chuẩn nào trong ba tiêu chí bắt buộc dưới đây sẽ tự động bị loại ngay tại vòng sàng lọc kỹ thuật:","• Environmental Certification: Bidders must hold an active ISO-14855 industrial compostability certificate.","• Chứng nhận Môi trường: Nhà thầu bắt buộc phải sở hữu chứng chỉ phân hủy hữu cơ công nghiệp ISO-14855 đang còn hiệu lực.","• Delivery Lead Time: Vendors must guarantee a maximum replenishment lead time of 10 business days from purchase order issuance to regional warehouse delivery.","• Thời gian Giao hàng (Lead Time): Nhà cung cấp phải cam kết thời gian bổ sung hàng tối đa không quá 10 ngày làm việc kể từ ngày phát hành đơn đặt hàng đến khi giao tới kho khu vực.","• Unit Price Ceiling: Quoted wholesale price must not exceed $0.45 per container (inclusive of domestic freight).","• Giá Trần Đơn vị: Đơn giá bán sỉ chào thầu tuyệt đối không được vượt quá 0,45 USD mỗi hộp (đã bao gồm cước vận chuyển nội địa).","3. Financial Security Requirement: Within 10 days of contract award, the winning supplier must furnish an irrevocable Bank Performance Bond equal to 10% of the total annual contract value to guarantee uninterrupted supply.","3. Yêu cầu Bảo đảm Tài chính: Trong vòng 10 ngày kể từ khi có thông báo trúng thầu, nhà cung cấp thắng thầu bắt buộc phải nộp Chứng thư Bảo lãnh Thực hiện Hợp đồng không hủy ngang từ Ngân hàng tương đương 10% tổng giá trị hợp đồng cả năm nhằm bảo đảm nguồn cung không bị đứt gãy.","Văn bản 2: Bảng Tổng hợp Chấm điểm Hồ sơ Dự thầu (Vendor Bid Evaluation Summary)","VERDANT PROCUREMENT COMMITTEE — VENDOR BID EVALUATION SUMMARY","RFP Reference: #VF-2026-08 | Evaluation Date: April 12","HỘI ĐỒNG MUA SẮM ĐẤU THẦU VERDANT — BẢNG TỔNG HỢP ĐÁNH GIÁ HỒ SƠ DỰ THẦU","Mã Hồ sơ Mời thầu: #VF-2026-08 | Ngày chấm thầu: 12 tháng 4","1. EcoPack Industries | Quoted Price: $0.42 / unit | ISO-14855: Yes (Verified) | Delivery Lead Time: 14 business days | Status: Disqualified","1. EcoPack Industries | Giá chào thầu: $0,42 / hộp | Chứng chỉ ISO-14855: Có (Đã xác minh) | Thời gian giao hàng: 14 ngày làm việc | Trạng thái: Bị loại (do giao hàng quá 10 ngày)","2. BioBox Packaging | Quoted Price: $0.39 / unit | ISO-14855: Pending Approval | Delivery Lead Time: 7 business days | Status: Disqualified","2. BioBox Packaging | Giá chào thầu: $0,39 / hộp | Chứng chỉ ISO-14855: Đang chờ cấp duyệt | Thời gian giao hàng: 7 ngày làm việc | Trạng thái: Bị loại (do chưa có chứng chỉ ISO)","3. TerraWrap Solutions | Quoted Price: $0.44 / unit | ISO-14855: Yes (Verified) | Delivery Lead Time: 8 business days | Status: Ap
