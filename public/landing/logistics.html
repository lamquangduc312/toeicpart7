<title>Logistics TOEIC 750+</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: cargo-manifest page. Hero with a 3x3 container stack (one container per lesson), sticky container-tab bar, lesson panel with side index of the 5 parts. */
:root{
  /* Tailwind-style neutrals + one primary (Blue 600) */
  --bg:#F9FAFB; --surface:#FFFFFF; --surface-2:#F3F4F6; --ink:#111827; --muted:#6B7280; --line:#E5E7EB;
  --paper:#FFFFFF;
  /* Coordinated palette: navy = governance/trust, cobalt = primary, magenta = errors,
     emerald = correct, ochre = clues & timing, Viettel red = brand marks, xanh mạ = outputs & chips */
  --navy:#102B66; --navy-2:#183B7E; --navy-ink:#102B66;
  --cobalt:#1E62D0; --cobalt-2:#2A7BE8;
  --magenta:#D71A4A; --magenta-2:#E52E5E;
  --emerald:#0A8558; --emerald-2:#12A16E;
  --ochre:#D87D0E; --ochre-2:#E8901C; --ochre-soft:#FDF1E1;
  --brand:var(--cobalt); --brand-soft:#DCE8FB; --vi:var(--navy-2);
  --red:#EE0033; --red-soft:#FFE4EA; --green:#5FA61B; --green-soft:#EAF6DC;
  --ok:var(--emerald); --bad:var(--magenta); --coral:var(--red); --coral-soft:var(--red-soft);
  --c1:var(--brand); --c2:var(--brand); --c3:var(--brand); --c4:var(--brand); --c5:var(--brand); --c6:var(--brand); --c7:var(--brand); --c8:var(--brand); --c9:var(--brand); --c10:var(--brand);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --shadow:0 1px 2px rgba(17,24,39,.05),0 6px 20px -8px rgba(17,24,39,.15);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#030712; --surface:#111827; --surface-2:#0B1120; --ink:#F9FAFB; --muted:#9CA3AF; --line:#1F2937;
  --vi:#9DBDF5; --paper:#111827; --navy-ink:#C9D7F4;
  --brand:var(--cobalt-2); --brand-soft:#132A55; --ochre-soft:#33220B;
  --ok:var(--emerald-2); --bad:var(--magenta-2);
  --red:#FF3B5F; --red-soft:#3B0A16; --green:#8BCF45; --green-soft:#1C2E0E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#030712; --surface:#111827; --surface-2:#0B1120; --ink:#F9FAFB; --muted:#9CA3AF; --line:#1F2937;
  --vi:#9DBDF5; --paper:#111827; --navy-ink:#C9D7F4;
  --brand:var(--cobalt-2); --brand-soft:#132A55; --ochre-soft:#33220B;
  --ok:var(--emerald-2); --bad:var(--magenta-2);
  --red:#FF3B5F; --red-soft:#3B0A16; --green:#8BCF45; --green-soft:#1C2E0E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{display:none}
.wrap{max-width:min(1600px,96vw);width:100%;margin:0 auto;padding-left:clamp(16px,2.5vw,40px);padding-right:clamp(16px,2.5vw,40px)}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--c) 70%,transparent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono)}

/* ---------- Hero ---------- */
.hero{padding-block:clamp(20px,3vw,36px);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.05fr);gap:clamp(20px,3vw,44px);align-items:center}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow b{color:var(--coral);font-weight:500}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3.2vw,44px);line-height:1.15;letter-spacing:-.01em;text-transform:uppercase;margin-top:10px;text-wrap:balance;word-break:break-word}
.hero h1 span{color:var(--red)}
.hero .en-sub{font-family:var(--f-display);font-weight:600;font-size:clamp(14px,1.5vw,18px);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.hero .desc{max-width:62ch;margin-top:16px;color:var(--muted);font-size:15px}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:24px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}

.yard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:620px;justify-self:end;width:100%}
.box{position:relative;min-height:76px;height:auto;aspect-ratio:auto;max-width:100%;border:1px solid var(--line);border-radius:12px;cursor:pointer;color:var(--ink);text-align:left;padding:8px 10px;background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;gap:4px;transition:transform .18s ease,background .18s,border-color .18s,box-shadow .18s}
.box:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 8px 20px -10px color-mix(in srgb,var(--brand) 60%,transparent)}
.box .n{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--brand)}
.box .qr{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.box .code{font-size:11.5px;font-weight:600;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;line-height:1.25;word-break:break-word}
.box.on{background:var(--brand);border-color:var(--brand);color:#fff}
.box.on .n,.box.on .qr,.box.on .code{color:#fff}
.box.alt .n{color:var(--coral)}

/* navy governance band behind the hero */
.hero-band{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff}
.hero-band .eyebrow{color:rgba(255,255,255,.7)}
.hero-band .eyebrow b{color:var(--ochre-2)}
.hero-band h1 span{color:var(--magenta-2)}
.hero-band .en-sub,.hero-band .desc,.hero-band .stat span{color:rgba(255,255,255,.74)}
.hero-band .stat b{color:#fff}
.hero-band .box{border-color:transparent}
.hero-band .box.on{background:var(--cobalt-2);border-color:#fff}

/* ---------- Tab bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-block:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:12px;padding-block:10px}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;flex:1;min-width:0;padding-bottom:2px;scroll-behavior:smooth}
.tab{--c:var(--c1);flex:0 0 auto;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 16px 5px 5px;cursor:pointer;text-align:left;transition:background .15s,border-color .15s}
.tab:hover{border-color:var(--c)}
.tab .door{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--c);font-family:var(--f-display);font-weight:800;font-size:16px;
  background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.tab .tl{display:flex;flex-direction:column;line-height:1.2}
.tab .tl b{font-size:13px;font-weight:600;white-space:nowrap}
.tab .tl small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#fff}
.tab[aria-selected="true"] .door{background:rgba(255,255,255,.22);color:#fff}
.tab[aria-selected="true"] .tl small{color:rgba(255,255,255,.82)}
.mode{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:0 0 auto;background:var(--surface-2)}
.mode button{border:0;background:none;padding:6px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--navy);color:#fff}

/* ---------- Lesson ---------- */
main{padding-block:28px 64px}
.lesson-head{--c:var(--c1);display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start;padding-bottom:24px;border-bottom:2px solid var(--navy-ink)}
.big-n{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,10vw,120px);line-height:.8;color:var(--c);letter-spacing:-.02em}
.big-n small{display:block;font-size:14px;letter-spacing:.2em;color:var(--muted);font-weight:600;margin-bottom:8px}
.lesson-head h2{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3.2vw,38px);line-height:1.05;text-transform:uppercase;color:var(--navy-ink)}
.lesson-head .en-t{font-family:var(--f-display);font-weight:600;font-size:clamp(15px,1.7vw,19px);color:var(--c);letter-spacing:.04em;margin-top:8px;text-transform:uppercase}
.src{display:inline-flex;gap:8px;align-items:center;margin-top:14px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.src b{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--c);letter-spacing:.06em}

.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:36px;margin-top:28px}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 82px);align-self:start;display:flex;flex-direction:column;gap:2px}
.toc a{display:flex;gap:10px;align-items:baseline;text-decoration:none;color:var(--muted);font-size:13.5px;padding:7px 10px;border-radius:6px;line-height:1.3}
.toc a b{font-family:var(--f-display);font-size:17px;color:var(--c);min-width:18px}
.toc a:hover,.toc a.on{background:var(--surface);color:var(--ink)}
.toc .toc-sub{padding-left:38px;font-size:12.5px}
.content{min-width:0;display:flex;flex-direction:column;gap:44px}

.part{display:flex;flex-direction:column;gap:22px;scroll-margin-top:96px}
.part-h{display:flex;gap:14px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px}
.part-h .pn{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.14em;color:#fff;background:var(--red);padding:3px 9px;border-radius:4px;white-space:nowrap}
.part-h h3{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.4vw,26px);text-transform:uppercase;line-height:1.1;color:var(--navy-ink)}
.sub{display:flex;flex-direction:column;gap:14px;scroll-margin-top:96px}
.sub-h{display:flex;gap:10px;align-items:baseline;font-weight:700;font-size:17px}
.sub-h .sn{font-family:var(--f-mono);font-size:12px;color:var(--c);font-weight:500}

/* strategy */
.strat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.strat-t{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;color:var(--c);text-transform:uppercase;line-height:1.5}
.steps{display:grid;gap:12px;counter-reset:s}
.step{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:start}
.step .when{font-family:var(--f-mono);font-size:11.5px;display:flex;flex-direction:column;gap:2px;border-right:2px solid var(--ochre);padding-right:10px}
.step .when span{color:var(--ochre)!important;font-weight:500}
.step .when b{font-family:var(--f-display);font-size:18px;font-weight:700;color:var(--ink)}
.step .when span{color:var(--muted)}
.step h5{margin:0 0 3px;font-size:14.5px;font-weight:700}
.step p{font-size:14.5px;color:var(--ink)}

/* passages = papers */
.papers{display:flex;flex-direction:column;gap:18px}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:22px 24px;display:flex;flex-direction:column;gap:9px;font-size:15px;position:relative}
.paper-tag{align-self:flex-start;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:3px;padding:2px 8px;margin-bottom:4px}
.ln-caps{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.04em;line-height:1.2}
.ln-kv{font-size:14px}
.ln-kv b{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted);margin-right:4px}
.ln-bul{padding-left:16px;position:relative}
.ln-bul::before{content:"";position:absolute;left:2px;top:.7em;width:6px;height:6px;background:var(--c);border-radius:1px}
.ln-sec{font-weight:700;margin-top:6px}
.ln-head{font-weight:700;margin-top:8px;color:var(--navy-ink)}
.ln-num{padding:2px 0 2px 14px;border-left:2px solid var(--brand);margin-left:2px}
.ln-num b{color:var(--brand)}
.ln-concl{background:var(--brand-soft);border-radius:6px;padding:8px 12px;font-size:14px}
.ln-concl b{color:var(--brand)}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:16px}
.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.score{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.score b{color:var(--ink);font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--c)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.q-stem{display:flex;gap:12px;font-weight:600}
.q-no{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--c);line-height:1.2;flex:0 0 auto}
.q-extra{font-style:italic;font-weight:400;color:var(--muted);margin-top:4px}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:8px 12px;cursor:pointer;font-size:14.5px;line-height:1.45;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--c)}
.opt .k{font-family:var(--f-mono);font-weight:500;font-size:13px;color:var(--c);flex:0 0 auto;margin-top:1px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surface))}
.opt.ok .k{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--surface))}
.opt.bad .k{color:var(--bad)}
.q-fb{font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.q-fb .r{font-weight:600}
.q-fb .r.ok{color:var(--ok)} .q-fb .r.bad{color:var(--bad)}
.q-fb a{color:var(--c)}

/* bilingual */
.bi-doc{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;color:var(--c);text-transform:uppercase;padding:10px 0 2px;border-top:1px dashed var(--line);margin-top:6px;line-height:1.5}
.bi-doc:first-child{border-top:0;margin-top:0;padding-top:0}
.bi{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--line)}
.pair:first-child{border-top:0}
.pair>div{padding:11px 16px;display:flex;flex-direction:column;gap:4px;font-size:14.5px;min-width:0}
.pair .en{color:var(--ink)}
.pair .vi{color:var(--vi);background:color-mix(in srgb,var(--vi) 5%,transparent);border-left:1px solid var(--line)}
.lang{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--muted);opacity:.8}
.bi-head{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-bottom:1px solid var(--line)}
.bi-head span{padding:7px 16px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted)}
.bi-head span+span{border-left:1px solid var(--line);color:var(--vi)}

.vi-t{color:var(--vi)}
/* recall mode blurs translations */
.recall .vi-r{filter:blur(6px);cursor:pointer;user-select:none;transition:filter .2s}
.recall .vi-r.peek{filter:none;user-select:auto}

/* question translation */
.qt{display:grid;gap:12px}
.qt-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.qt-card .stem{display:flex;gap:12px}
.qt-card .stem>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.qt-card .stem b{font-weight:600}
.qt-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;padding-left:44px}
.qt-opt{display:flex;gap:8px;font-size:14px;line-height:1.45}
.qt-opt>div{display:flex;flex-direction:column;min-width:0}
.qt-opt .k{font-family:var(--f-mono);color:var(--c);font-size:12.5px;margin-top:1px}
.qt-opt.correct .k{color:#fff;background:var(--ok);border-radius:3px;padding:0 4px;height:fit-content}

/* summary */
.sum{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.sum>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;font-size:14.5px;display:flex;flex-direction:column;gap:8px}
.ideas{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.ideas li{position:relative;padding-left:18px}
.ideas>li::before{content:"";position:absolute;left:3px;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--brand)}
.ideas ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.ideas ul li::before{content:"";position:absolute;left:4px;top:.75em;width:7px;height:1.5px;background:var(--muted)}

/* matrix */
.matrix{display:grid;gap:12px}
.mx{display:grid;grid-template-columns:200px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mx-l{padding:16px;background:color-mix(in srgb,var(--c) 9%,var(--surface));display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line)}
.mx-l .i{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--c)}
.mx-l b{font-size:14.5px;line-height:1.35}
.mx-l small{font-size:12.5px;color:var(--muted);line-height:1.35}
.mx-r{padding:14px 18px;display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.mx-r p{display:flex;gap:10px}
.mx-r .lang{flex:0 0 22px;margin-top:4px}

/* answers */
.ans{display:grid;gap:12px}
.an{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:100px}
.an.flash{animation:flash 1.4s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--c)}100%{box-shadow:0 0 0 0 transparent}}
.an-h{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.an-h .no{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--c)}
.an-h .key{font-family:var(--f-mono);font-weight:500;background:var(--ok);color:#fff;border-radius:4px;padding:1px 8px;font-size:13px}
.an-h .t{font-weight:600}
.trace{font-size:14px;border-left:3px solid var(--ochre);background:var(--ochre-soft);padding:9px 12px;border-radius:0 6px 6px 0;font-style:italic}
.trace .lbl{color:var(--ochre)}
.lbl{font-family:var(--f-mono);font-style:normal;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);display:block;margin-bottom:2px}
.expl{font-size:14.5px}
.an-stem{font-size:14px;color:var(--muted);margin-top:-4px}
.para{display:flex;flex-direction:column;gap:6px;font-size:14px}
.para .pr{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:start;background:var(--green-soft);border-radius:6px;padding:7px 10px}
.para .pr i{font-style:normal;color:var(--green);font-weight:700}
.para .pr span:last-child{font-weight:600}
.wrong{display:grid;gap:8px}
.wr{border:1px solid var(--line);border-radius:8px;padding:9px 12px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.wr-h{display:flex;gap:8px;align-items:baseline}
.wr-h b{font-family:var(--f-mono);font-weight:500;color:var(--bad);font-size:13px}
.wr-h span{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--bad) 55%,transparent);color:var(--muted)}
.trap{align-self:flex-start;font-size:12px;font-weight:600;color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);border-radius:4px;padding:2px 8px}
.ln-sub{padding-left:30px;position:relative;font-size:14px}
.ln-sub::before{content:"";position:absolute;left:16px;top:.75em;width:6px;height:1.5px;background:var(--muted)}
.ln-sub b{color:var(--navy-ink)}

/* workflow */
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;position:relative}
.fstep{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;position:relative}
.fstep:not(:last-child)::after{content:"";position:absolute;right:-12px;top:30px;width:10px;height:10px;border-top:2px solid var(--c);border-right:2px solid var(--c);transform:rotate(45deg);z-index:1}
.fstep h5{margin:0;font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.15;text-transform:uppercase}
.fstep h5 span{display:block;font-size:12px;color:var(--c);letter-spacing:.14em}
.fkv{font-size:13.5px;display:flex;flex-direction:column;gap:1px}
.fkv b{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fkv.out{background:var(--green-soft);border-radius:6px;padding:8px 10px}
.fkv.out b{color:var(--green)}
.ba{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.ba>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;font-size:14.5px;display:flex;flex-direction:column;gap:8px}
.ba h5{margin:0;font-size:14px;font-weight:700}

/* vocab */
.vocab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.vc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:9px}
.vc-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.vc-h .vn{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.vc-h h5{margin:0;font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.05}
.ipa{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chips .eq{font-family:var(--f-mono);font-size:12px;color:var(--c);margin-right:2px}
.chip{font-size:12.5px;border:1px solid color-mix(in srgb,var(--green) 45%,var(--line));color:var(--ink);border-radius:999px;padding:1px 9px;background:var(--green-soft)}
.chips .eq{color:var(--green)}
.vc .mean{font-size:14px;font-weight:500}
.vc .ex{font-size:13.5px;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:3px}
.vc .ex i{font-style:italic}

/* 50 pairs */
.pp-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pp-tools input{flex:1;min-width:0;max-width:420px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;font:inherit;font-size:14.5px;color:var(--ink)}
.tbl-w{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th{text-align:left;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--navy);padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;width:52px}
td.t{font-weight:600}
td.p{color:var(--muted)}
td.m{color:var(--vi)}
tbody tr:hover td{background:var(--surface-2)}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:8px;flex-wrap:wrap}
.pager button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 16px;cursor:pointer;min-width:0;max-width:48%;text-align:left}
.pager button:hover{border-color:var(--ink)}
.pager button small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pager button b{font-size:14px}
.pager .next{margin-left:auto;align-items:flex-end;text-align:right}
footer{border-top:1px solid var(--line);padding-block:20px 32px;color:var(--muted);font-size:12.5px}

<script type="application/json" id="src">["CHUYÊN ĐỀ TỔNG HỢP TOEIC 750+: LOGISTICS \u0026 QUẢN LÝ CHUỖI CUNG ỨNG","LOGISTICS, SUPPLY CHAIN MANAGEMENT, FREIGHT FORWARDING \u0026 WAREHOUSING MONOGRAPH","==================================================================================================","BÀI THỰC HÀNH SỐ 1: HỢP ĐỒNG DỊCH VỤ LOGISTICS BÊN THỨ BA (3PL) \u0026 ĐIỀU PHỐI VẬN TẢI HÀNG HẢI QUỐC TẾ (MULTIMODAL FREIGHT FORWARDING \u0026 PORT DISPATCH)","Nguồn bài học: ETS TOEIC Part 7 (Triple Passage - Cụm 3 đoạn văn: E-mails \u0026 Bill of Lading, Questions 186-190)","PHẦN 1: NỘI DUNG VĂN BẢN \u0026 DỊCH THUẬT SONG NGỮ","1.1. Đề thi Tiếng Anh gốc (Strategy Guide \u0026 Original ETS Passages)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","E-mail 1 (Freight Service Request)","To: Elena Rostova \u003ce.rostova@apexlogistics.com\u003e","From: Martin Lindqvist \u003cm.lindqvist@nordictelecom.se\u003e","Date: March 12","Subject: Multimodal Shipping Request - Rotterdam to Gothenburg","Dear Ms. Rostova,","Nordic Telecom Systems is preparing to transport 40 standard shipping containers of heavy telecommunications infrastructure, specifically outdoor fiber-optic trunk cabling and weatherproof transmission enclosures, from our manufacturing partner\u0027s facility in Rotterdam to our primary Nordic logistics hub at the Port of Gothenburg.","Given the delicate nature of optical components, all containers must be hermetically sealed and equipped with real-time temperature telemetry devices. We require comprehensive freight forwarding services, including maritime transport, export/import customs brokerage, and bonded storage at your Gothenburg terminal until our fleet of flatbed trucks arrives for final dispatch.","Please provide a formal shipping confirmation and Bill of Lading detailing transit schedules, demurrage policies, and all handling charges.","Sincerely,","Martin Lindqvist","Director of Global Procurement","Nordic Telecom Systems","Bill of Lading \u0026 Shipping Confirmation (Form)","APEX GLOBAL FREIGHT \u0026 LOGISTICS","OCEAN BILL OF LADING #AGF-88204-EU","Rotterdam Gateway Terminal, Netherlands","Shipper: Nordic Telecom Systems (Stockholm, Sweden)","Carrier: Baltic Maritime Express Lines | Vessel: MV Nordic Pioneer | Voyage: 14-North","Port of Loading: Rotterdam, NL | Port of Discharge: Gothenburg, SE","Target Departure: March 18 | Target Arrival: March 22","Cargo Manifest:","• Quantity: 40 x 40ft High-Cube Sealed Shipping Containers","• Commodity Description: Optical telecommunications cables and outdoor cabinet enclosures","• Total Gross Weight: 480 Metric Tons | Stowage: Below deck / climate-monitored","• Incoterms 2020: CIF (Cost, Insurance, and Freight) - Gothenburg Port","Billing Summary:","• Ocean Freight \u0026 Vessel Handling: €42,000","• Priority Customs Brokerage \u0026 Port Surcharge: €6,400","• Marine Transit Cargo Insurance (Comprehensive): €3,600","• Total Freight Payable: €52,000","Terms and Storage Policy:","Consignee receives 5 business days of complimentary terminal storage (demurrage grace period) commencing on the official vessel discharge date. Daily demurrage rates of €150 per container will apply thereafter.","E-mail 2 (Port Warehouse Arrival \u0026 Clearance Notice)","To: Martin Lindqvist \u003cm.lindqvist@nordictelecom.se\u003e","From: Henrik Dahl \u003ch.dahl@gothenburgport-terminal.se\u003e","Date: March 24","Subject: Inbound Shipment Clearance \u0026 Gate Release - AGF-88204-EU","Dear Mr. Lindqvist,","This is to notify you that the MV Nordic Pioneer successfully berthed at the Gothenburg Deepwater Terminal on Friday, March 22, and all 40 containers were offloaded by 18:00.","Thirty-eight containers cleared Swedish customs clearance immediately yesterday morning and have been transferred to our temperature-regulated bonded warehouse. The remaining two containers (AGF-88204-39 and AGF-88204-40) were subjected to a mandatory physical seal integrity inspection by border customs agents, which was completed satisfactorily earlier today, March 24.","All 40 units have now received customs gate release. Since your transport contractor will begin hauling the containers tomorrow morning, March 25, no demurrage or port storage charges have been incurred under your 5-day grace period. Please ensure your truck drivers carry digital gate-pass barcodes.","Best regards,","Henrik Dahl","Terminal Operations Supervisor","Gothenburg Port Logistics Hub","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","186","(A) To arrange transportation for telecommunications equipment","(B) To report damaged fiber-optic cabling","(C) To request payment for an overdue freight invoice","(D) To apply for a customs broker license in Rotterdam","187","(A) Assembly of transmission cabinets at destination","(B) Ocean freight, transit insurance, and port delivery costs","(C) Flatbed trucking to individual telecom tower sites","(D) Free indefinite storage at the loading dock","188","(A) Marine propulsion engines","(B) Flatbed transport trailers","(C) Optical cables and outdoor enclosures","(D) Automated warehouse conveyor belts","189","(A) The carrier waived the fees due to weather delays","(B) The shipment was collected within the allowable grace period","(C) Swedish customs agreed to cover all storage expenses","(D) The containers were rerouted to an alternative maritime port","190","(A) They were returned to the port of origin in Rotterdam","(B) They sustained severe water damage during ocean transit","(C) They required physical inspection by border authorities","(D) They contained unauthorized electronic components","1.2. Hướng dẫn làm bài Part 7","CHIẾN THUẬT 5 PHÚT TỐI ƯU: QUÉT 3 ĐIỂM CHẠM, GIẢI ĐỦ 5 CÂU HỎI \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Luồng quy trình Đoạn ba (Quỹ đạo Quét chữ Z \u0026 Bộ lọc 3 Câu hỏi Tiềm thức): • Chiến thuật Đoạn Ba (30 giây = 10s x 3 văn bản) — Quy trình Nghiệp vụ 3 Chặng Khép kín:","- Tuyệt đối KHÔNG đọc sâu thân bài; mắt di chuyển theo Quỹ đạo hình chữ Z (Z-Pattern Eye Scan) qua 3 điểm chạm của từng văn bản để kích hoạt Bộ lọc 3 Câu hỏi Tiềm thức:","• Văn bản 1 (E-mail 1 - Freight Service Request):","- Điểm chạm 1 (Nét ngang trên): Dòng \u0027Subject: Multimodal Shipping Request - Rotterdam to Gothenburg\u0027 -\u003e Trả lời Q1: E-mail yêu cầu dịch vụ vận tải đa phương thức container đường biển.","- Điểm chạm 2 (Nét chéo xuống footer): Header \u0027From: Martin Lindqvist (Nordic Telecom)\u0027 gửi \u0027To: Apex Logistics\u0027 -\u003e Trả lời Q2: Chủ hàng thiết bị viễn thông liên hệ công ty giao nhận vận tải 3PL.","- Điểm chạm 3 (Nét móc neo hai đầu): Câu mở đầu (\u0027preparing to transport 40 standard shipping containers of heavy telecommunications infrastructure\u0027) \u0026 câu chốt (\u0027need formal quotation by Friday\u0027) -\u003e Trả lời Q3: Đặt vận chuyển 40 container cáp quang trước hạn chót thứ Sáu.","• Văn bản 2 (Bill of Lading \u0026 Shipping Confirmation - Vận đơn đường biển CIF):","- Điểm chạm 1 (Nét ngang trên): Tiêu đề in hoa \u0027OCEAN BILL OF LADING #AGF-88204-EU\u0027 -\u003e Trả lời Q1: Vận đơn đường biển chính thức kèm xác nhận cước phí.","- Điểm chạm 2 (Nét chéo xuống footer): Shipper \u0027Apex Global Freight\u0027 \u0026 Consignee \u0027Nordic Telecom Systems\u0027 -\u003e Trả lời Q2: Vận chuyển theo điều kiện CIF (Gothenburg Port) giao cho Nordic Telecom.","- Điểm chạm 3 (Nét móc neo hai đầu): Tên tàu \u0027Vessel: MV Nordic Pioneer\u0027 \u0026 điều khoản lưu bãi \u00275 business days of complimentary terminal storage\u0027 -\u003e Trả lời Q3: Hàng chở bằng tàu Pioneer, có 5 ngày miễn phí lưu bãi cảng (demurrage grace period).","• Văn bản 3 (E-mail 2 - Port Clearance \u0026 Gate Release Notice):","- Điểm chạm 1 (Nét ngang trên): Dòng \u0027Subject: Inbound Shipment Clearance \u0026 Gate Release\u0027 -\u003e Trả lời Q1: Thông báo hoàn tất thủ tục hải quan và lệnh mở cổng kho cảng.","- Điểm chạm 2 (Nét chéo xuống footer): \u0027From: Henrik Dahl (Gothenburg Port Authority)\u0027 gửi \u0027Martin Lindqvist\u0027 -\u003e Trả lời Q2: Giám sát cảng biển thông báo trực tiếp cho chủ hàng.","- Điểm chạm 3 (Nét móc neo hai đầu): Câu đầu (\u0027berthed on March 22... cleared customs\u0027) \u0026 câu chốt (\u0027trucks begin hauling on March 25, no demurrage fees incurred\u0027) -\u003e Trả lời Q3: Tàu cập cảng 22/3, xe đến bốc hàng 25/3 trong hạn miễn phí (2 container số 39-40 đã kiểm xong kẹp chì).","• Quy trình nghiệp vụ 3 chặng khép kín: Khởi phát (Email 1: Thuê 3PL vận tải) -\u003e Triển khai (Vận đơn B/L: Tàu Pioneer chở 40 cont theo giá CIF) -\u003e Chốt đối soát (Email 2: Thông quan cảng, xe đến lấy ngày thứ 3, không mất phí phạt lưu bãi).","=\u003e Chốt luồng sự việc sau 30s: Nordic thuê Apex chở 40 container cáp quang đường biển từ Rotterdam về cảng Gothenburg theo điều kiện CIF, thông quan hải quan và điều xe bốc dỡ vào ngày thứ 3 trong hạn ân hạn 5 ngày miễn phí.","Bước 2 (20 giây) - Quét nhanh 5 câu hỏi \u0026 Phân loại (Chỉ đọc câu hỏi, KHÔNG đọc 4 đáp án A, B, C, D): • Nguyên tắc đọc Bước 2 (3-4 giây/câu): Lướt nhanh cả 5 câu hỏi trước để gắn \u00275 móc từ khóa\u0027 vào bộ nhớ tạm rồi mới giải cuốn chiếu; TUYỆT ĐỐI CHỈ ĐỌC CÂU HỎI, KHÔNG ĐỌC 4 ĐÁP ÁN (A, B, C, D) để tránh nhiễu 15 phương án bẫy (chỉ liếc đáp án khi gặp câu NOT/TRUE):","• Q186: Thấy \u0027primary purpose of the first e-mail\u0027 -\u003e Câu hỏi Mục đích chính (Móc: mục đích Email 1).","• Q187: Thấy \u0027Bill of Lading\u0027, \u0027CIF shipping terms\u0027 -\u003e Câu hỏi Chi tiết đơn lẻ (Móc: CIF gồm gì).","• Q188: Thấy \u0027cargo transported by MV Nordic Pioneer\u0027 -\u003e Câu hỏi Chi tiết theo tên riêng (Móc: hàng trên tàu Pioneer).","• Q189: Thấy \u0027Why NOT required to pay demurrage fees\u0027 -\u003e Câu hỏi Ghép nối dữ kiện 2 văn bản (Móc: miễn phí lưu bãi demurrage).","• Q190: Thấy \u0027containers AGF-88204-39 and AGF-88204-40\u0027 -\u003e Câu hỏi Chi tiết/Ghép theo mã định danh (Móc: container đuôi #39, #40).","Bước 3 (3 phút 45 giây) - Cách trả lời \u0026 Dấu hiệu tìm nhanh nhất cho đủ 5 câu hỏi (Giải cuốn chiếu \u0026 Chốt đáp án từng câu): • Q186 (Câu hỏi Mục đích - 20s): [Dấu hiệu tìm nhanh nhất]: Nhìn thẳng dòng \u0027Subject: Multimodal Shipping Request\u0027 và câu đầu tiên đoạn 1 Email 1 (\u0027preparing to transport 40 standard shipping containers of heavy telecommunications infrastructure\u0027) =\u003e Dữ kiện gốc (\u0027transport telecommunications infrastructure\u0027) khớp với Paraphrase (\u0027arrange transportation for telecommunications equipment\u0027) =\u003e Chọn (A).","• Q187 (Câu hỏi Chi tiết - 30s): [Dấu hiệu tìm nhanh nhất]: Quét mắt vào Vận đơn tìm chữ in hoa \u0027CIF\u0027 tại mục Cargo Manifest (\u0027Incoterms 2020: CIF (Cost, Insurance, and Freight)\u0027) kết hợp mục Billing Summary (\u0027Ocean Freight... Marine Transit Cargo Insurance\u0027) =\u003e Bao gồm cước biển, bảo hiểm và phí giao tới cảng =\u003e Chọn (B).","• Q188 (Câu hỏi Chi tiết - 25s): [Dấu hiệu tìm nhanh nhất]: Quét tìm tên tàu \u0027MV Nordic Pioneer\u0027 ở đầu Vận đơn, dóng thẳng xuống dòng \u0027Commodity Description: Optical telecommunications cables and outdoor cabinet enclosures\u0027 =\u003e Cáp quang và tủ thiết bị ngoài trời =\u003e Chọn (C).","• Q189 (Câu hỏi Ghép 2 văn bản - 50s): [Dấu hiệu tìm nhanh nhất]: Bắt từ khóa \u0027demurrage fees\u0027 (phí lưu bãi). Ghép Dữ kiện 1 (Cuối Vận đơn: Miễn phí lưu bãi 5 ngày làm việc \u00275 business days... grace period\u0027 tính từ ngày tàu dỡ hàng) + Dữ kiện 2 (Email 2: Tàu cập cảng ngày 22/3, xe tải đến lấy hàng sáng 25/3 - mới là ngày thứ 3) =\u003e Kết luận: Lấy hàng trong thời hạn ân hạn cho phép (\u0027collected within the allowable grace period\u0027) =\u003e Chọn (B).","• Q190 (Câu hỏi Chi tiết mã định danh - 35s): [Dấu hiệu tìm nhanh nhất]: Quét mắt tìm đúng con số \u0027AGF-88204-39 and AGF-88204-40\u0027 ở đoạn 2 Email 2 =\u003e Đọc ngay cụm đứng sau: \u0027subjected to a mandatory physical seal integrity inspection by border customs agents\u0027 =\u003e Phải qua kiểm tra thực tế của cơ quan biên phòng =\u003e Chọn (C).","• [Mẹo mở rộng cho 3 dạng đặc biệt]: Điền câu [1][2][3][4] -\u003e Bắt từ mồi (This/These/However) ở đầu câu cần điền ghép với câu ngay trước ô trống; Điền từ vựng -\u003e Thay bằng [...] rồi ghép ý Trước + Sau; Câu NOT/TRUE -\u003e Gom từ khóa 4 đáp án quét 1 lượt gạch bỏ 3 ý đúng.","Bước 4 (25 giây cuối giờ thi + Củng cố sau giờ thi) - Kiểm tra khóa đáp án \u0026 Đúc kết Feynman 1 câu: • [Trong 5 phút làm bài - 25 giây cuối]: Rà nhanh từ đồng nghĩa (Paraphrase) của câu ghép Q189, Q190 xem có khớp với luồng sự việc ở Bước 1 không và khóa sổ 5 đáp án A - B - C - B - C.","• [Sau khi làm bài - Củng cố kiến thức dài hạn bằng Feynman]: Tự đúc kết bản chất cả bài thành 1 câu tiếng Việt đời thường để lưu kịch bản nghiệp vụ vào trí nhớ dài hạn: \u0027Mua 40 thùng cáp quang đi tàu biển từ Hà Lan về Thụy Điển theo giá CIF; cảng cho gửi miễn phí 5 ngày, ngày thứ 3 xe tải đã đến lấy (sau khi 2 thùng kiểm tra xong kẹp chì) nên không mất tiền phạt lưu bãi.\u0027","1.3. Dịch Song ngữ Xen kẽ Từng Câu (Sentence-by-Sentence Translation)","Văn bản 1: Thư điện tử yêu cầu dịch vụ vận tải đa phương thức (Freight Service Request)","E-mail 1 (Freight Service Request)","To: Elena Rostova \u003ce.rostova@apexlogistics.com\u003e","From: Martin Lindqvist \u003cm.lindqvist@nordictelecom.se\u003e","Date: March 12","Subject: Multimodal Shipping Request - Rotterdam to Gothenburg","Thư điện tử 1 (Yêu cầu dịch vụ vận tải hàng hóa)","Người nhận: Elena Rostova \u003ce.rostova@apexlogistics.com\u003e","Người gửi: Martin Lindqvist \u003cm.lindqvist@nordictelecom.se\u003e","Ngày: 12 tháng 3","Tiêu đề: Yêu cầu vận chuyển đa phương thức - Tuyến Rotterdam đi Gothenburg","Dear Ms. Rostova,","Kính gửi bà Rostova,","Nordic Telecom Systems is preparing to transport 40 standard shipping containers of heavy telecommunications infrastructure, specifically outdoor fiber-optic trunk cabling and weatherproof transmission enclosures, from our manufacturing partner\u0027s facility in Rotterdam to our primary Nordic logistics hub at the Port of Gothenburg.","Tập đoàn Nordic Telecom Systems đang chuẩn bị vận chuyển 40 container tiêu chuẩn chứa hạ tầng thiết bị viễn thông trọng tải lớn, cụ thể là hệ thống cáp quang trục ngoài trời và các tủ trạm phát sóng chịu thời tiết, từ nhà máy của đối tác sản xuất tại Rotterdam về trung tâm logistics Bắc Âu trọng điểm của chúng tôi tại Cảng Gothenburg.","Given the delicate nature of optical components, all containers must be hermetically sealed and equipped with real-time temperature telemetry devices.","Do đặc tính nhạy cảm và chính xác cao của các linh kiện quang học, toàn bộ container bắt buộc phải được niêm phong kín khí tuyệt đối và trang bị thiết bị giám sát nhiệt độ truyền dữ liệu thời gian thực.","We require comprehensive freight forwarding services, including maritime transport, export/import customs brokerage, and bonded storage at your Gothenburg terminal until our fleet of flatbed trucks arrives for final dispatch.","Chúng tôi yêu cầu gói dịch vụ giao nhận vận tải toàn diện, bao gồm vận tải đường biển, dịch vụ đại lý khai báo hải quan xuất/nhập khẩu, và lưu kho ngoại quan tại bến cảng Gothenburg cho đến khi đội xe tải sàn phẳng của chúng tôi đến nhận hàng để điều phối chặng cuối.","Please provide a formal shipping confirmation and Bill of Lading detailing transit schedules, demurrage policies, and all handling charges.","Xin vui lòng cung cấp bản xác nhận vận chuyển chính thức và Vận đơn đường biển nêu chi tiết lịch trình hành trình, quy định về phí lưu container/lưu bãi, cùng toàn bộ chi phí bốc dỡ xử lý.","Sincerely,","Trân trọng,","Martin Lindqvist","Director of Global Procurement","Nordic Telecom Systems","Martin Lindqvist","Giám đốc Mua sắm Toàn cầu","Tập đoàn Nordic Telecom Systems","Văn bản 2: Vận đơn đường biển \u0026 Xác nhận chi phí vận tải (Bill of Lading \u0026 Cost Confirmation)","APEX GLOBAL FREIGHT \u0026 LOGISTICS","OCEAN BILL OF LADING #AGF-88204-EU","Rotterdam Gateway Terminal, Netherlands","CÔNG TY DỊCH VỤ GIAO NHẬN \u0026 LOGISTICS TOÀN CẦU APEX","VẬN ĐƠN ĐƯỜNG BIỂN #AGF-88204-EU","Cảng cửa ngõ Rotterdam, Hà Lan","Shipper: Nordic Telecom Systems (Stockholm, Sweden) | Carrier: Baltic Maritime Express Lines | Vessel: MV Nordic Pioneer | Voyage: 14-North","Chủ hàng (Người gửi): Nordic Telecom Systems (Stockholm, Thụy Điển) | Hãng vận chuyển: Baltic Maritime Express Lines | Tàu vận tải: MV Nordic Pioneer | Chuyến hải trình: 14-Bắc","Port of Loading: Rotterdam, NL | Port of Discharge: Gothenburg, SE | Target Departure: March 18 | Target Arrival: March 22","Cảng xếp hàng: Rotterdam, Hà Lan | Cảng dỡ hàng: Gothenburg, Thụy Điển | Ngày khởi hành dự kiến: 18 tháng 3 | Ngày đến dự kiến: 22 tháng 3","Cargo Manifest: 40 x 40ft High-Cube Sealed Shipping Containers | Commodity Description: Optical telecommunications cables and outdoor cabinet enclosures | Total Gross Weight: 480 Metric Tons | Stowage: Below deck / climate-monitored","Bản kê khai hàng hóa: 40 container kín khí loại cao 40ft | Mô tả chủng loại hàng: Cáp quang viễn thông và các khối tủ trạm thiết bị ngoài trời | Tổng trọng lượng thô: 480 tấn | Vị trí xếp hàng: Dưới hầm tàu / có kiểm soát vi khí hậu","Incoterms 2020: CIF (Cost, Insurance, and Freight) - Gothenburg Port","Điều kiện thương mại Incoterms 2020: CIF (Tiền hàng, Bảo hiểm và Cước phí) - Giao tại Cảng Gothenburg","Billing Summary: Ocean Freight \u0026 Vessel Handling: €42,000 | Priority Customs Brokerage \u0026 Port Surcharge: €6,400 | Marine Transit Cargo Insurance (Comprehensive): €3,600 | Total Freight Payable: €52,000","Bảng tổng hợp cước phí: Cước vận tải biển \u0026 Bốc xếp tàu: €42.000 | Dịch vụ đại lý hải quan ưu tiên \u0026 Phụ phí cảng: €6.400 | Bảo hiểm hàng hóa vận chuyển đường biển toàn diện: €3.600 | Tổng cước phí phải thanh toán: €52.000","Terms and Storage Policy: Consignee receives 5 business days of complimentary terminal storage (demurrage grace period) commencing on the official vessel discharge date. Daily demurrage rates of €150 per container will apply thereafter.","Điều khoản \u0026 Quy định lưu kho: Người nhận hàng được hưởng 5 ngày làm việc miễn phí lưu bãi tại cảng (thời hạn ân hạn phí lưu container) tính từ ngày dỡ hàng chính thức khỏi tàu. Mức phí lưu phạt sau đó là €150/container mỗi ngày.","Văn bản 3: Thư thông báo hoàn tất thông quan \u0026 Lịch xuất kho cảng (Port Arrival \u0026 Clearance Notice)","E-mail 2 (Port Warehouse Arrival \u0026 Clearance Notice)","To: Martin Lindqvist \u003cm.lindqvist@nordictelecom.se\u003e","From: Henrik Dahl \u003ch.dahl@gothenburgport-terminal.se\u003e","Date: March 24","Subject: Inbound Shipment Clearance \u0026 Gate Release - AGF-88204-EU","Thư điện tử 2 (Thông báo hàng cập kho cảng \u0026 Thông quan)","Người nhận: Martin Lindqvist \u003cm.lindqvist@nordictelecom.se\u003e","Người gửi: Henrik Dahl \u003ch.dahl@gothenburgport-terminal.se\u003e","Ngày: 24 tháng 3","Tiêu đề: Thông quan lô hàng nhập bến \u0026 Lệnh mở cổng xuất bãi - AGF-88204-EU","Dear Mr. Lindqvist,","Kính gửi ông Lindqvist,","This is to notify you that the MV Nordic Pioneer successfully berthed at the Gothenburg Deepwater Terminal on Friday, March 22, and all 40 containers were offloaded by 18:00.","Xin thông báo tới ông rằng tàu MV Nordic Pioneer đã cập bến thành công tại Cảng nước sâu Gothenburg vào thứ Sáu, ngày 22 tháng 3, và toàn bộ 40 container đã được bốc dỡ hoàn tất trước 18:00.","Thirty-eight containers cleared Swedish customs clearance immediately yesterday morning and have been transferred to our temperature-regulated bonded warehouse.","38 container đã hoàn tất thủ tục thông quan hải quan Thụy Điển ngay sáng hôm qua và đã được chuyển vào khu kho ngoại quan kiểm soát nhiệt độ của chúng tôi.","The remaining two containers (AGF-88204-39 and AGF-88204-40) were subjected to a mandatory physical seal integrity inspection by border customs agents, which was completed satisfactorily earlier today, March 24.","Hai container còn lại (mã số AGF-88204-39 và AGF-88204-40) đã phải trải qua quy trình kiểm tra thực tế tính nguyên vẹn của kẹp chì niêm phong bắt buộc bởi lực lượng hải quan cửa khẩu, và đã hoàn tất đạt chuẩn vào đầu ngày hôm nay, 24 tháng 3.","All 40 units have now received customs gate release.","Hiện tại toàn bộ 40 kiện container đã nhận được lệnh mở cổng xuất bãi của hải quan.","Since your transport contractor will begin hauling the containers tomorrow morning, March 25, no demurrage or port storage charges have been incurred under your 5-day grace period.","Vì nhà thầu vận tải đường bộ của ông sẽ bắt đầu bốc chuyển các container vào sáng mai, ngày 25 tháng 3, nên không phát sinh bất kỳ khoản phí lưu container hoặc phí lưu kho cảng nào do vẫn nằm trong thời hạn ân hạn 5 ngày miễn phí.","Please ensure your truck drivers carry digital gate-pass barcodes.","Xin vui lòng đảm bảo các tài xế xe tải mang theo mã vạch ra vào cổng điện tử.","Best regards,","Henrik Dahl","Terminal Operations Supervisor","Gothenburg Port Logistics Hub","Trân trọng,","Henrik Dahl","Giám sát Điều hành Cảng bến","Trung tâm Logistics Cảng Gothenburg","1.4. Dịch chi tiết Câu hỏi \u0026 Phương án Trắc nghiệm","186. Mục đích chính của bức thư điện tử đầu tiên là gì?","(A) Để sắp xếp dịch vụ vận chuyển cho các thiết bị viễn thông","(B) Để báo cáo về việc đường dây cáp quang bị hư hỏng","(C) Để yêu cầu thanh toán hóa đơn cước vận tải quá hạn","(D) Để nộp đơn xin cấp giấy phép đại lý hải quan tại Rotterdam","187. Theo Vận đơn đường biển, điều khoản giao hàng CIF bao gồm những gì?","(A) Lắp ráp các tủ trạm phát sóng tại điểm đến","(B) Cước vận tải biển, bảo hiểm hàng hải và chi phí giao tới cảng đích","(C) Vận chuyển bằng xe tải sàn phẳng tới từng vị trí cột trạm viễn thông","(D) Lưu kho miễn phí vô thời hạn tại bến bốc hàng","188. Loại hàng hóa nào đã được vận chuyển bởi tàu MV Nordic Pioneer?","(A) Động cơ đẩy hàng hải dùng cho tàu biển","(B) Các rơ-moóc xe tải sàn phẳng chuyên chở","(C) Cáp quang và các khối tủ thiết bị ngoài trời","(D) Hệ thống băng chuyền nhà kho tự động","189. Tại sao Nordic Telecom Systems KHÔNG phải trả phí phạt lưu bãi/lưu container?","(A) Hãng tàu miễn phí do sự cố chậm trễ vì thời tiết","(B) Lô hàng được điều phối nhận bốc trong thời hạn ân hạn miễn phí cho phép","(C) Cơ quan hải quan Thụy Điển đồng ý chi trả toàn bộ phí lưu kho","(D) Các container đã được chuyển hướng sang một cảng biển thay thế","190. Điều gì được chỉ ra về hai container AGF-88204-39 và AGF-88204-40?","(A) Chúng đã bị trả ngược về cảng khởi hành tại Rotterdam","(B) Chúng bị hư hại ngấm nước nghiêm trọng trong hải trình trên biển","(C) Chúng đã phải trải qua quy trình kiểm tra kẹp chì thực tế của cơ quan biên phòng","(D) Chúng chứa các linh kiện điện tử không được cấp phép","1.5. Tóm tắt Viết lại Toàn bài theo Feynman (Feynman Monograph Summary)","English Executive Summary:","• Nordic Telecom Systems contracted Apex Global Freight \u0026 Logistics to transport 40 climate-controlled containers of optical fiber cabling and transmission cabinets from Rotterdam to Gothenburg under CIF terms. The shipment departed on March 18 aboard the MV Nordic Pioneer and berthed at Gothenburg on March 22.","• Thirty-eight containers cleared Swedish customs immediately, while two units underwent mandatory physical seal inspections, gaining final clearance on March 24.","• Because Nordic Telecom arranged truck dispatch starting March 25—well within the five-business-day demurrage grace period—no terminal storage penalties were incurred.","Bản tóm tắt Tiếng Việt cốt lõi:","• Tập đoàn Nordic Telecom Systems đã ký hợp đồng với hãng giao nhận Apex Global Freight để vận chuyển 40 container cáp quang và tủ trạm phát sóng viễn thông kiểm soát nhiệt độ từ Rotterdam về Gothenburg theo điều kiện CIF.","• Lô hàng khởi hành ngày 18/3 trên tàu MV Nordic Pioneer và cập cảng Gothenburg ngày 22/3.","• 38 container được thông quan ngay lập tức, trong khi 2 container phải trải qua kiểm tra kẹp chì thực tế và hoàn tất vào ngày 24/3.","• Do chủ hàng điều động xe tải đến nhận hàng từ ngày 25/3—nằm trọn vẹn trong thời hạn ân hạn 5 ngày làm việc—nên toàn bộ lô hàng không bị phát sinh bất kỳ khoản phí phạt lưu bãi nào.","PHẦN 2: ACTIVE RECALL 5 GIÂY (BẢNG MA TRẬN ĐỊNH VỊ SONG NGỮ)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["Đối tượng \u0026 Vai trò: Nordic Telecom Systems (Chủ hàng/Bên mua linh kiện), Apex Global Freight (Nhà cung cấp dịch vụ logistics 3PL/Freight Forwarder), Baltic Maritime Express (Hãng tàu vận tải biển MV Nordic Pioneer) và Ban Quản lý Cảng biển Gothenburg (Cơ quan vận hành cầu cảng \u0026 kho ngoại quan).","Stakeholders \u0026 Roles: Nordic Telecom Systems (Consignee/Shipper of telecom gear), Apex Global Freight (3PL logistics forwarder), Baltic Maritime Express (Ocean carrier vessel operator), and Gothenburg Port Authority (Terminal operator \u0026 bonded warehouse)."]],[["2. Boi canh \u0026 Quy trinh loi"],["Bối cảnh \u0026 Quy trình lõi: Chuỗi vận tải đa phương thức xuyên biên giới (Đường biển -\u003e Cảng biển -\u003e Kho ngoại quan -\u003e Vận tải đường bộ chặng cuối). Hàng hóa giá trị cao đòi hỏi niêm phong kẹp chì và kiểm soát nhiệt độ; rủi ro chính là phát sinh phí phạt lưu container (Demurrage) nếu thời gian thông quan hải quan kéo dài vượt quá thời hạn ân hạn.","Business Context \u0026 Core Flow: Cross-border multimodal supply chain (Ocean freight -\u003e Deepwater terminal discharge -\u003e Bonded storage -\u003e Last-mile road haulage). High-value equipment demands climate monitoring; primary operational risk is demurrage penalties if customs clearance exceeds the complimentary grace period."]],[["3. Dau vet suy luan cheo"],["Dấu vết suy luận chéo then chốt: Vận đơn ghi rõ tàu đến ngày 22/3 và ân hạn 5 ngày làm việc. Email 3 xác nhận 2 container bị giữ kiểm tra kẹp chì đến 24/3, và xe tải đến nhận hàng vào sáng 25/3 =\u003e 25/3 chỉ mới là ngày làm việc thứ 3 sau khi dỡ hàng =\u003e Kết luận chắc chắn không bị phạt lưu kho.","Key Cross-Referencing Clues: Bill of Lading specifies arrival on March 22 with a 5-day grace period. Email 3 confirms physical seal inspection delayed two units until March 24, but truck dispatch starts March 25 =\u003e March 25 is within 3 business days of vessel discharge =\u003e Conclusively zero demurrage incurred."]]],"t":"table"},"PHẦN 3: ĐÁP ÁN CHUẨN XÁC \u0026 DẤU VẾT TRUY XUẤT CHÉO","186. What is the primary purpose of the first e-mail?","Dap an dung: (A) To arrange transportation for telecommunications equipment","[Dau vet bai doc / Clue]: Email 1: \u0027Nordic Telecom Systems is preparing to transport 40 standard shipping containers of heavy telecommunications infrastructure... We require comprehensive freight forwarding services...\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027transport 40 standard shipping containers of heavy telecommunications infrastructure\u0027 \u003c-\u003e \u0027arrange transportation for telecommunications equipment\u0027","• \u0027require comprehensive freight forwarding services\u0027 \u003c-\u003e \u0027arrange transportation\u0027","[Loi giai chi tiet]: Martin Lindqvist viết email gửi công ty giao nhận vận tải Apex để yêu cầu báo giá và thu xếp vận chuyển 40 container thiết bị viễn thông từ Rotterdam về Gothenburg. Phương án (A) phản ánh chính xác mục đích cốt lõi.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(B) To report damaged fiber-optic cabling","- Ly do sai: Hàng hóa chưa vận chuyển và không có báo cáo hư hỏng nào trong email đầu tiên.","- Bay ETS: Bẫy Thông tin Sai lệch / Mâu thuẫn Trực tiếp (Contradictory Trap)","(C) To request payment for an overdue freight invoice","- Ly do sai: Email này là yêu cầu thu xếp dịch vụ và hỏi báo giá, không phải yêu cầu thanh toán hóa đơn quá hạn.","- Bay ETS: Bẫy Đảo lộn Vai trò Chủ thể (Role Reversal Trap)","(D) To apply for a customs broker license in Rotterdam","- Ly do sai: Người gửi là công ty viễn thông thuê đại lý hải quan chứ không phải nộp đơn xin cấp chứng chỉ môi giới hải quan.","- Bay ETS: Bẫy Từ vựng Gây nhiễu / Không đề cập (Not Mentioned Trap)","187. According to the Bill of Lading, what is included in the CIF shipping terms?","Dap an dung: (B) Ocean freight, transit insurance, and port delivery costs","[Dau vet bai doc / Clue]: Bill of Lading: \u0027Incoterms 2020: CIF (Cost, Insurance, and Freight) - Gothenburg Port\u0027 và bảng kê: \u0027Ocean Freight... Priority Customs Brokerage... Marine Transit Cargo Insurance... Total Freight Payable: €52,000\u0027.","[Dien dat tuong duong / Paraphrase]: • \u0027CIF (Cost, Insurance, and Freight)\u0027 \u003c-\u003e \u0027Ocean freight, transit insurance, and port delivery costs\u0027","[Loi giai chi tiet]: Theo điều kiện thương mại CIF (Cost, Insurance, and Freight) trong Incoterms 2020, bên vận chuyển chịu trách nhiệm về cước biển quốc tế, phí bảo hiểm hàng hải và các chi phí đưa hàng tới cảng đến quy định.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Assembly of transmission cabinets at destination","- Ly do sai: Điều kiện CIF cảng biển chỉ chịu trách nhiệm đến cầu cảng, không bao gồm lắp ráp thiết bị tại công trường đích.","- Bay ETS: Bẫy Mở rộng Phạm vi Dịch vụ (Scope Overextension Trap)","(C) Flatbed trucking to individual telecom tower sites","- Ly do sai: Vận tải nội địa từ cảng đến từng trạm phát sóng do nhà thầu mặt đất của Nordic tự điều phối riêng.","- Bay ETS: Bẫy Đánh tráo Phân đoạn Vận chuyển (Leg Substitution Trap)","(D) Free indefinite storage at the loading dock","- Ly do sai: Văn bản nêu rõ chỉ có thời gian ân hạn 5 ngày miễn phí, không có chuyện lưu kho vô thời hạn.","- Bay ETS: Bẫy Từ ngữ Tuyệt đối hóa \u0027Indefinite\u0027 (Extreme Language Trap)","188. What cargo was transported by the MV Nordic Pioneer?","Dap an dung: (C) Optical cables and outdoor enclosures","[Dau vet bai doc / Clue]: Bill of Lading: \u0027Vessel: MV Nordic Pioneer\u0027 - \u0027Commodity Description: Optical telecommunications cables and outdoor cabinet enclosures\u0027. Kết hợp Email 1: \u0027outdoor fiber-optic trunk cabling and weatherproof transmission enclosures\u0027.","[Dien dat tuong duong / Paraphrase]: • \u0027Optical telecommunications cables and outdoor cabinet enclosures\u0027 \u003c-\u003e \u0027Optical cables and outdoor enclosures\u0027","[Loi giai chi tiet]: Vận đơn và email đồng nhất xác định mặt hàng xếp lên tàu MV Nordic Pioneer là các cuộn cáp quang viễn thông trục chính và tủ bảo vệ thiết bị ngoài trời.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Marine propulsion engines","- Ly do sai: Tàu biển dùng động cơ đẩy nhưng đó là trang bị của tàu, không phải lô hàng được vận chuyển.","- Bay ETS: Bẫy Từ vựng Hàng hải Gây nhiễu (Topical Distractor Trap)","(B) Flatbed transport trailers","- Ly do sai: Rơ-moóc sàn phẳng là phương tiện vận tải đường bộ của công ty kéo xe, không phải hàng đóng trong container trên tàu.","- Bay ETS: Bẫy Nhầm lẫn Phương tiện với Hàng hóa (Vehicle vs. Cargo Trap)","(D) Automated warehouse conveyor belts","- Ly do sai: Băng chuyền nhà kho tự động hoàn toàn không được nhắc tới trong hợp đồng lô hàng này.","- Bay ETS: Bẫy Thông tin Không liên quan (Out-of-Context Trap)","189. Why will Nordic Telecom Systems NOT be required to pay demurrage fees?","Dap an dung: (B) The shipment was collected within the allowable grace period","[Dau vet bai doc / Clue]: Bill of Lading: \u0027Consignee receives 5 business days of complimentary terminal storage (demurrage grace period)...\u0027 Email 3: \u0027docked on Friday, March 22... your transport contractor will begin hauling... March 25, no demurrage or port storage charges have been incurred under your 5-day grace period.\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027begin hauling on March 25... under your 5-day grace period\u0027 \u003c-\u003e \u0027collected within the allowable grace period\u0027","[Loi giai chi tiet]: Tàu cập cảng thứ Sáu 22/3, công ty điều xe đến bốc hàng vào thứ Hai 25/3, rơi vào ngày làm việc thứ 2 sau khi dỡ hàng, nằm trọn trong thời hạn ân hạn 5 ngày miễn phí lưu bãi.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) The carrier waived the fees due to weather delays","- Ly do sai: Thời tiết không gây trễ hạn và hãng vận tải không thực hiện việc miễn phí đặc biệt vì thời tiết.","- Bay ETS: Bẫy Lý do Giả mạo / Bịa đặt (Fabricated Reason Trap)","(C) Swedish customs agreed to cover all storage expenses","- Ly do sai: Cơ quan hải quan Thụy Điển chỉ kiểm tra thủ tục, không bao giờ chi trả chi phí lưu kho bãi thay doanh nghiệp.","- Bay ETS: Bẫy Vô lý về Mặt Nghiệp vụ (Illogical Entity Trap)","(D) The containers were rerouted to an alternative maritime port","- Ly do sai: Toàn bộ container cập cảng Gothenburg đúng kế hoạch, không bị chuyển hướng sang cảng khác.","- Bay ETS: Bẫy Sai lệch Địa điểm Vận chuyển (Rerouting Falsehood Trap)","190. What is indicated about containers AGF-88204-39 and AGF-88204-40?","Dap an dung: (C) They required physical inspection by border authorities","[Dau vet bai doc / Clue]: Email 3: \u0027The remaining two containers (AGF-88204-39 and AGF-88204-40) were subjected to a mandatory physical seal integrity inspection by border customs agents, which was completed satisfactorily earlier today, March 24.\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027subjected to a mandatory physical seal integrity inspection by border customs agents\u0027 \u003c-\u003e \u0027required physical inspection by border authorities\u0027","[Loi giai chi tiet]: Hai container số cuối 39 và 40 bị nhân viên hải quan cửa khẩu tiến hành kiểm tra thực tế tính nguyên vẹn của chì niêm phong trước khi phê duyệt thông quan xuất kho cảng.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) They were returned to the port of origin in Rotterdam","- Ly do sai: Hàng đã hoàn thành kiểm tra và chuẩn bị bốc dỡ tại Gothenburg, không hề bị trả về Rotterdam.","- Bay ETS: Bẫy Mâu thuẫn Diễn biến Sự việc (Opposite Outcome Trap)","(B) They sustained severe water damage during ocean transit","- Ly do sai: Văn bản nêu rõ hàng được đóng thùng chịu thời tiết (weatherproof) và không có báo cáo ngấm nước hay hư hại.","- Bay ETS: Bẫy Bịa đặt Thiệt hại (Fabricated Damage Trap)","(D) They contained unauthorized electronic components","- Ly do sai: Kết quả kiểm tra hoàn tất thỏa đáng (\u0027completed satisfactorily\u0027), không có hàng hóa trái phép nào bị phát hiện.","- Bay ETS: Bẫy Cáo buộc Vô căn cứ (Unsubstantiated Claim Trap)","PHẦN 4: KỸ THUẬT FEYNMAN SONG NGỮ \u0026 SƠ ĐỒ QUY TRÌNH (TƯ DUY PHÂN TÍCH NGHIỆP VỤ CHUỖI CUNG ỨNG \u0026 BA)","4.1. Sơ đồ Quy trình Luân chuyển Nghiệp vụ (End-to-End Supply Chain \u0026 Banking Workflow)","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","HỢP ĐỒNG CIF, MỞ L/C NGÂN HÀNG \u0026 PHÁT HÀNH B/L"],[],["BƯỚC 2","VẬN TẢI BIỂN \u0026 LUÂN CHUYỂN CHỨNG TỪ QUA 2 NGÂN HÀNG"],[],["BƯỚC 3","THÔNG QUAN HẢI QUAN, NỘP THUẾ \u0026 RÚT HÀNG VỀ KHO"]],[["• Chung tu \u0026 Kenh: Hợp đồng CIF, Thư tín dụng (L/C) Ngân hàng Mở \u0026 Vận đơn (Ocean B/L)","• Nghiep vu thuc thi: Ngân hàng Bên Mua mở L/C bảo lãnh thanh toán gửi Ngân hàng Bên Bán; đóng 40 cont cáp quang, bấm kẹp chì (Seal), mua bảo hiểm CIF \u0026 bốc lên tàu.","• Ket qua \u0026 Kiem soat: Phát hành Vận đơn gốc (#AGF-88204-EU) để lập Bộ chứng từ thanh toán"],["➔"],["• Chung tu \u0026 Kenh: Tàu MV Nordic Pioneer \u0026 Liên ngân hàng (NH Bên Bán -\u003e NH Bên Mua)","• Nghiep vu thuc thi: Tàu chở 40 cont cập cảng Gothenburg ngày 22/3; song song đó, NH Bên Bán chuyển Bộ chứng từ (B/L + Invoice + Bảo hiểm) sang NH Bên Mua để giải ngân tiền hàng.","• Ket qua \u0026 Kiem soat: Bên Mua nhận B/L gốc đổi Lệnh giao hàng (D/O); kích hoạt 5 ngày miễn phí lưu bãi (22/3 - 27/3)"],["➔"],["• Chung tu \u0026 Kenh: Tờ khai Hải quan, Lệnh giao hàng (D/O) \u0026 Cổng cảng (Gate Release)","• Nghiep vu thuc thi: Nộp thuế, thông quan luồng xanh 38 cont; kiểm hóa thực tế kẹp chì 2 cont (#39, #40) xong ngày 24/3; điều đoàn xe tải xuất trình D/O rút toàn bộ hàng sáng 25/3.","• Ket qua \u0026 Kiem soat: Lấy hàng ở ngày thứ 3/5 -\u003e Miễn 100% phí phạt lưu bãi (Demurrage) \u0026 nhập kho tính giá thành"]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["STEP 1","CIF CONTRACT, BANK L/C ISSUANCE \u0026 BILL OF LADING (B/L) RELEASE"],[],["STEP 2","MARITIME TRANSIT \u0026 INTER-BANK DOCUMENTARY COLLECTION"],[],["STEP 3","CUSTOMS CLEARANCE, TARIFF SETTLEMENT \u0026 TERMINAL GATE RELEASE"]],[["• Documents \u0026 Channels: CIF Sales Contract, Commercial Bank Letter of Credit (L/C) \u0026 Ocean Bill of Lading (B/L)","• Core Business Execution: Buyer\u0027s bank opens irrevocable L/C guaranteeing payment to Seller\u0027s bank; pack 40 climate-controlled containers of optical cable, affix security bolt seals, procure CIF maritime insurance, and load aboard MV Nordic Pioneer.","• Key Deliverable \u0026 Control: Issuance of Original Bill of Lading (#AGF-88204-EU) establishing trade payment negotiable documents"],["➔"],["• Documents \u0026 Channels: MV Nordic Pioneer Vessel Manifest \u0026 Inter-Bank Clearing (Seller Bank -\u003e Buyer Bank)","• Core Business Execution: Vessel berths at Port of Gothenburg on March 22; concurrently, Seller\u0027s bank transmits original shipping documents (B/L + Commercial Invoice + Insurance Certificate) to Buyer\u0027s bank to release cargo funds.","• Key Deliverable \u0026 Control: Buyer receives Original B/L to endorse Delivery Order (D/O); activates 5-day free demurrage window (March 22–27)"],["➔"],["• Documents \u0026 Channels: Electronic Customs Declaration, Delivery Order (D/O) \u0026 Port Terminal Gate Release","• Core Business Execution: Pay import tariffs, clear green channel for 38 containers; complete physical customs inspection of seals on 2 containers (#39, #40) on March 24; dispatch drayage fleet presenting D/O to retrieve full shipment on March 25.","• Key Deliverable \u0026 Control: Cargo evacuated on Day 3 of 5 -\u003e 100% exemption from terminal demurrage penalties \u0026 landed cost booking"]]],"t":"table"},"4.2. Tư duy Phân tích Nghiệp vụ Chuỗi Cung Ứng \u0026 BA (Bản Tiếng Việt)","• Bức tranh Toàn cảnh Chuỗi cung ứng (Song hành Luồng Hàng hóa \u0026 Luồng Chứng từ Ngân hàng): Một thương vụ nhập khẩu đường biển quốc tế theo điều kiện CIF luôn vận hành song song 2 luồng khép kín qua 3 chặng: (Chặng 1 - Khởi tạo \u0026 Bảo lãnh Ngân hàng): Bên Mua ký hợp đồng CIF và yêu cầu Ngân hàng Bên Mua (Issuing Bank) mở Thư tín dụng (L/C) gửi sang Ngân hàng Bên Bán (Advising Bank) để cam kết thanh toán; Bên Bán thuê 3PL đóng 40 container, bấm kẹp chì (Seal) và giao lên tàu -\u003e (Chặng 2 - Vận tải biển \u0026 Giao dịch Bộ chứng từ Liên ngân hàng): Hãng tàu phát hành Vận đơn đường biển gốc (Ocean B/L - chứng từ sở hữu hàng hóa); Bên Bán nộp Bộ chứng từ (Vận đơn B/L + Hóa đơn Commercial Invoice + Chứng thư Bảo hiểm CIF + Packing List) vào Ngân hàng Bên Bán để chuyển sang Ngân hàng Bên Mua kiểm tra và giải ngân thanh toán; Bên Mua thanh toán cho Ngân hàng của mình để nhận bộ B/L gốc (hoặc Telex Release) -\u003e (Chặng 3 - Đổi lệnh D/O, Thông quan Hải quan \u0026 Rút hàng): Khi tàu cập cảng đích, Bên Mua đem B/L đến hãng tàu đổi Lệnh giao hàng (Delivery Order - D/O), mở Tờ khai Hải quan, nộp thuế nhập khẩu, hoàn tất kiểm tra kẹp chì (Customs Seal) và điều xe tải rút hàng về kho trong hạn miễn phí lưu bãi.","• Điểm nghẽn \u0026 Rủi ro Vận hành Thực tế (Core Bottleneck \u0026 Risk): Rủi ro lớn nhất tại cảng đích là \u0027Đứt nhịp giữa Luồng Chứng từ Ngân hàng và Luồng Hàng hóa\u0027 (tàu đã cập cảng ngày 22/3 nhưng bộ chứng từ B/L ở ngân hàng bị sai lệch hoặc khâu kiểm hóa kẹp chì hải quan kéo dài). Nếu không lấy được Lệnh giao hàng (D/O) và thông quan xong trong 5 ngày làm việc miễn phí (Grace Period), doanh nghiệp sẽ bị phạt phí lưu bãi (Demurrage) và phí lưu vỏ container (Detention) rất nặng.","• 3 Giải pháp Thiết kế Hệ thống \u0026 Kiểm soát Nghiệp vụ (BA \u0026 Supply Chain Architecture):","(1) Quản trị Đồng bộ Hợp đồng CIF, Tín dụng thư (L/C) \u0026 Bộ Chứng từ Điện tử (e-B/L \u0026 Trade Finance): Trên hệ thống ERP/TMS, liên kết chặt chẽ phân hệ Mua sắm với Tài trợ Thương mại (Trade Finance). Với điều kiện CIF, hệ thống tự động kiểm tra chéo 4 chứng từ bắt buộc (Vận đơn B/L + Hóa đơn Invoice + Bảo hiểm Hàng hải + Điều khoản L/C của Ngân hàng) nhằm phát hiện sớm lỗi sai lệch chứng từ (Discrepancy), hỗ trợ sử dụng Vận đơn điện tử (e-B/L / Surrendered B/L) để Ngân hàng giải phóng chứng từ tức thời ngay khi tàu cập cảng.","(2) Đồng hồ Đếm ngược Hạn Lưu bãi (Demurrage Countdown) \u0026 Cảnh báo Thông quan Hải quan: Tự động lấy mốc ngày tàu dỡ hàng (Discharge Date: 22/3) cộng với số ngày ân hạn trên Vận đơn (5 ngày làm việc) để tính ra Hạn chót rút hàng miễn phí (Free-time Deadline: 27/3). Khi có container bị phân luồng đỏ phải kiểm hóa thực tế kẹp chì (như 2 container đuôi #39, #40), hệ thống lập tức bắn cảnh báo khẩn để bộ phận Xuất nhập khẩu xử lý xong trước hạn chót.","(3) Giám sát Kẹp chì Điện tử (e-Seal), Điều phối Xe tải \u0026 Hạch toán Giá thành Nhập kho (Landed Cost): Tích hợp dữ liệu cảm biến nhiệt độ/độ ẩm IoT suốt hải trình; ngay khi có Lệnh giao hàng (D/O) và Thông báo giải phóng cảng (Gate Release), hệ thống tự động điều xe tải sàn phẳng vào rút hàng (ngày 25/3) và tự động kết chuyển toàn bộ Giá CIF + Thuế nhập khẩu + Phí ngân hàng L/C + Cước xe tải nội địa để tính chính xác Giá thành nhập kho (Total Landed Cost).","4.3. Business Analyst \u0026 Supply Chain Executive Summary (Bản Tiếng Anh)","• End-to-End Supply Chain Context: International CIF ocean importation operates across two parallel tracks—physical cargo movement and interbank documentary settlement: (1) The Buyer\u0027s Bank (Issuing Bank) issues a Letter of Credit (L/C) to the Seller\u0027s Bank (Advising/Negotiating Bank); (2) Upon vessel loading, the Seller submits the shipping documents (Original Ocean B/L, Commercial Invoice, and CIF Marine Insurance Policy) through the Seller\u0027s Bank to the Buyer\u0027s Bank for payment release; (3) The Buyer redeems the Original B/L from its bank to exchange for a Delivery Order (D/O), clears customs, and dispatches trucks to collect the containers.","• Core Operational Bottleneck \u0026 Risk: Any misalignment between interbank document release and port customs clearance—such as L/C document discrepancies or secondary customs seal inspections (#39, #40)—can delay container pickup beyond the 5-day complimentary storage window, triggering steep demurrage penalties.","• Key BA \u0026 System Architecture Solutions:","(1) Integrated CIF, L/C \u0026 e-B/L Documentary Governance: Link ERP procurement and Trade Finance modules to cross-validate CIF shipping documents (Ocean B/L, Invoice, Insurance Certificate) against L/C terms, enabling fast bank endorsement and electronic Delivery Order (e-D/O) release.","(2) Automated Demurrage Grace-Period \u0026 Customs SLA Tracking: Synchronize vessel berthing dates (March 22) with the B/L\u0027s 5-day free storage window to trigger priority customs-clearance alerts for flagged containers before demurrage fees accrue.","(3) IoT Seal Telemetry, Gate Dispatch \u0026 Landed-Cost Accounting: Connect e-Seal telemetry and port gate-release notices to dispatch flatbed trucks within the grace period (March 25) while automatically capitalizing CIF value, bank L/C fees, customs duties, and inland drayage into final warehouse landed cost.","PHẦN 5: TỪ VỰNG \u0026 PARAPHRASE CHUYÊN SÂU (CHUẨN 3 DÒNG TỐI ƯU NẠP ANKI)","1. Freight forwarding  /freɪt ˈfɔːrwərdɪŋ/  \u003c=\u003e Cargo dispatch service / Logistics brokerage","Nghia: Dịch vụ giao nhận vận tải hàng hóa đa phương thức","Vd: Our global supply chain relies on professional freight forwarding to handle customs brokerage and maritime transport. - Chuỗi cung ứng toàn cầu của chúng tôi phụ thuộc vào dịch vụ giao nhận vận tải chuyên nghiệp để xử lý thủ tục hải quan và vận chuyển đường biển.","2. Bill of Lading (B/L)  /bɪl əv ˈleɪdɪŋ/  \u003c=\u003e Shipping manifest / Carriage contract / Waybill","Nghia: Vận đơn đường biển (Hợp đồng vận chuyển kiêm biên lai giao nhận hàng)","Vd: The port terminal supervisor requested an original Bill of Lading prior to releasing the shipping containers. - Giám sát viên bến cảng đã yêu cầu xuất trình bản gốc Vận đơn đường biển trước khi phát lệnh giải phóng các container hàng.","3. Demurrage  /dɪˈmɜːrɪdʒ/  \u003c=\u003e Storage penalty fee / Detention charge / Terminal overdue fee","Nghia: Phí phạt lưu bãi / Phí phạt chậm trả vỏ container quá thời hạn cho phép","Vd: By dispatching flatbed trucks within the five-day grace period, the company avoided costly demurrage penalties. - Bằng cách điều động xe tải sàn phẳng trong thời hạn ân hạn 5 ngày, công ty đã tránh được các khoản phí phạt lưu bãi tốn kém.","4. Bonded warehouse  /ˈbɑːndɪd ˈwerhaʊs/  \u003c=\u003e Customs-controlled storage / Duty-free logistics depot","Nghia: Kho ngoại quan (Kho lưu giữ hàng hóa chưa nộp thuế xuất nhập khẩu dưới sự giám sát của hải quan)","Vd: Imported telecommunications equipment remains stored in a temperature-controlled bonded warehouse awaiting customs gate release. - Thiết bị viễn thông nhập khẩu được lưu trữ trong kho ngoại quan kiểm soát nhiệt độ trong khi chờ lệnh giải phóng xuất bãi của hải quan.","5. Hermetically sealed  /hɜːrˈmetɪkli siːld/  \u003c=\u003e Airtight enclosed / Waterproof protected / Vacuum-sealed","Nghia: Niêm phong kín khí tuyệt đối (Chống ẩm, nước và không khí xâm nhập)","Vd: Sensitive fiber-optic cables must be shipped in hermetically sealed containers to prevent ambient moisture damage. - Cáp quang nhạy cảm bắt buộc phải được vận chuyển trong các container niêm phong kín khí để ngăn ngừa hư hại do độ ẩm môi trường.","6. Consignee  /ˌkɑːnsaɪˈniː/  \u003c=\u003e Cargo recipient / Receiver / Designated importer","Nghia: Người nhận hàng (Cá nhân hoặc tổ chức được chỉ định nhận lô hàng trên vận đơn)","Vd: The consignee must present verified digital credentials and pay applicable duties before cargo pickup. - Người nhận hàng phải xuất trình thông tin xác thực điện tử và thanh toán các khoản thuế hiện hành trước khi lấy hàng.","7. Seal integrity inspection  /siːl ɪnˈteɡrəti ɪnˈspekʃn/  \u003c=\u003e Tamper-evident verification / Border security check","Nghia: Kiểm tra thực tế tính nguyên vẹn của kẹp chì niêm phong hàng hóa","Vd: Customs authorities performed a mandatory seal integrity inspection to ensure container contents had not been tampered with. - Cơ quan hải quan đã thực hiện kiểm tra thực tế tính nguyên vẹn của kẹp chì để đảm bảo hàng hóa trong container không bị can thiệp trái phép.","8. Multimodal transport  /ˌmʌltiˈmoʊdl ˈtrænspɔːrt/  \u003c=\u003e Combined intermodal freight / Sea-land-rail shipment","Nghia: Vận tải đa phương thức (Kết hợp vận tải biển, đường sắt và đường bộ)","Vd: Using multimodal transport enabled the distributor to transfer containers smoothly from cargo ship to road fleet. - Sử dụng vận tải đa phương thức đã giúp nhà phân phối chuyển giao container nhịp nhàng từ tàu hàng sang đội xe tải đường bộ.","==================================================================================================","BÀI THỰC HÀNH SỐ 2: ỨNG PHÓ GIÁN ĐOẠN CHUỖI CUNG ỨNG \u0026 KÍCH HOẠT VẬN TẢI HÀNG KHÔNG KHẨN CẤP (SUPPLY CHAIN DISRUPTION \u0026 CONTINGENCY AIR FREIGHT EXPEDITING)","Nguồn bài học: ETS TOEIC Part 7 (Double Passage - Cụm 2 đoạn văn: Internal Memorandum \u0026 Service Proposal, Questions 181-185)","PHẦN 1: NỘI DUNG VĂN BẢN \u0026 DỊCH THUẬT SONG NGỮ","1.1. Đề thi Tiếng Anh gốc (Strategy Guide \u0026 Original ETS Passages)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","Internal Memorandum (Urgent Contingency Directive)","SOLIS ELECTRONICS GLOBAL - MEMORANDUM","To: Regional Operations \u0026 Plant Managers","From: David Chen, VP of Global Supply Chain","Date: July 15","Subject: Urgent Contingency Directive: Port Bottleneck at Port of Singapore","Team,","As you may be aware, prolonged severe congestion at the Port of Singapore has created an acute supply chain bottleneck. Ocean carrier vessels transporting our core batch of automotive-grade microcontroller chipsets (Shipment Batch #MC-770) have encountered an unexpected two-week berthing delay.","Our manufacturing assembly plants in Dallas, Texas, and Guadalajara, Mexico, are operating with lean buffer inventories that will be exhausted within five calendar days. A full production shutdown would result in contractual downtime penalties exceeding $120,000 per day.","Under corporate Risk Mitigation Protocol 4B, I am immediately activating our logistics contingency plan: shifting our next scheduled shipment of 25 metric tons of semiconductor components from ocean transit to expedited international air charter.","Logistics directors must identify an air cargo specialist capable of delivering the entire cargo consignment from Singapore Changi (SIN) to Dallas/Fort Worth (DFW) under a strict 72-hour turnaround window. Palletized cargo requires shock-absorbing packaging and calibrated temperature telemetry.","Please submit all qualified charter bids to my office no later than July 18.","David Chen","Vice President of Global Supply Chain","Service Proposal \u0026 Air Freight Charter Quotation","AEROLINK CARGO SOLUTIONS - CHARTER PROPOSAL \u0026 FLIGHT ROUTING","Singapore Regional Hub | Changi International Airport","Date: July 17","Prepared for: David Chen, Vice President of Global Supply Chain, Solis Electronics","Quotation Reference: AL-CHARTER-9942","Executive Overview:","Aerolink Cargo Solutions is pleased to submit this dedicated air freight charter proposal in response to your urgent transpacific shipment requirement.","Flight Routing and Aircraft Specifications:","• Aircraft Allocated: Dedicated Boeing 777-200F Heavy Cargo Freighter","• Flight Path: Direct nonstop routing: Singapore (SIN) to Dallas/Fort Worth (DFW)","• Flight Duration: 20 hours 45 minutes | Total Door-to-Door Turnaround: 48 Hours","• Target Wheels-Up Departure: July 20 at 02:00 SGT | Target DFW Touchdown: July 20 at 14:45 CDT","Cargo Protection \u0026 Regulatory Handling:","• Capacity Reserved: 30 Metric Tons (Accommodates full 25 MT consignment)","• Palletization: Aircraft loaded with reinforced shock-absorbing pneumatic honeycomb pallets designed specifically for high-precision microchips.","• Monitoring: Active IoT telemetry transmitting continuous temperature, humidity, and G-force vibration metrics directly to your dashboard.","• Customs Processing: Priority Electronic Data Interchange (EDI) pre-clearance with US Customs and Border Protection prior to aircraft touchdown.","Cost Summary: All-inclusive charter fee of $245,000 (includes jet fuel surcharge, ramp handling, export paperwork, and dedicated tarmac trucking at DFW).","Validity: This charter window is guaranteed until 17:00 SGT on July 18.","Sincerely,","Sarah Jenkins","Director of Aerospace \u0026 Tech Logistics","Aerolink Cargo Solutions","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","181","(A) A sudden increase in ocean shipping insurance premiums","(B) A severe delay in maritime shipping that threatens manufacturing","(C) Quality defects discovered in automotive microcontroller chipsets","(D) A strike by factory workers at the Dallas assembly plant","182","(A) They must operate passenger flights with cargo belly capacity","(B) They must complete the entire delivery within seventy-two hours","(C) They must store the microchips at an off-site warehouse in Singapore","(D) They must provide ocean shipping rebates for delayed shipments","183","(A) It requires a stopover in Tokyo to refuel the aircraft","(B) It guarantees transit completion in less time than the requested deadline","(C) It exceeds the allowable maximum gross weight capacity","(D) It charges additional fees for customs pre-clearance","184","(A) By using specialized shock-dampening pallets and active telemetry","(B) By packing them in standard cardboard cartons with dry ice","(C) By assigning a courier technician to supervise each container","(D) By keeping the cargo under low atmospheric pressure","185","(A) Request an extension on ocean demurrage fees in Singapore","(B) Relocate its Dallas manufacturing operations to Guadalajara","(C) Accept Aerolink\u0027s air charter proposal to secure the aircraft","(D) Cancel all pending customer orders for automotive components","1.2. Hướng dẫn làm bài Part 7","CHIẾN THUẬT 5 PHÚT TỐI ƯU: QUÉT 3 ĐIỂM CHẠM, GIẢI ĐỦ 5 CÂU HỎI \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (20 giây) - Nắm bắt Bối cảnh \u0026 Luồng tương tác Đoạn kép (Quỹ đạo Quét chữ Z \u0026 Bộ lọc 3 Câu hỏi Tiềm thức): • Chiến thuật Đoạn Kép (20 giây = 10s VB1 + 10s VB2) — Mô hình Tương tác 2 Chiều (Action -\u003e Reaction):","- Tuyệt đối KHÔNG đọc sâu thân bài; mắt lướt theo Quỹ đạo hình chữ Z (Z-Pattern Eye Scan) qua 3 điểm chạm của từng văn bản để kích hoạt Bộ lọc 3 Câu hỏi Tiềm thức:","• Văn bản 1 (Internal Memorandum - Chỉ thị khẩn ứng phó sự cố):","- Điểm chạm 1 (Nét ngang trên): Tiêu đề in đậm \u0027MEMORANDUM - Subject: Contingency Air Freight Procurement\u0027 -\u003e Trả lời Q1: Bản ghi nhớ nội bộ về mua sắm khẩn cấp dịch vụ thuê chuyến bay vận tải hàng không.","- Điểm chạm 2 (Nét chéo xuống footer): \u0027To: Executive Logistics Committee | From: Raymond Chen, VP of Global Supply Chain\u0027 -\u003e Trả lời Q2: Lãnh đạo chuỗi cung ứng chỉ đạo các bộ phận vận tải nội bộ.","- Điểm chạm 3 (Nét móc neo hai đầu): Câu đầu (\u0027severe port congestion at Port Klang... container vessel delayed by 2 weeks\u0027) \u0026 câu chốt (\u0027air charter provider must guarantee delivery in no more than 72 hours\u0027) -\u003e Trả lời Q3: Tàu biển trễ 2 tuần đe dọa dừng nhà máy Penang, bắt buộc tìm đơn vị bay charter giao hàng dưới 72 giờ.","• Văn bản 2 (Service Proposal \u0026 Quotation - Đề xuất dịch vụ \u0026 Báo giá):","- Điểm chạm 1 (Nét ngang trên): Tiêu đề \u0
