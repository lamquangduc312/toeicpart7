u hướng Giao dịch (Reverse Transaction Intent Trap)","193. What is indicated about products sold in the type of packaging used by Green Globe?","Dap an dung: (D) Their share of the market is rising.","[Dau vet bai doc / Clue]: Bài báo thị trường: \u0027According to retail industry analytics, consumer demand for beauty and oral care products packaged in refillable, endlessly recyclable glass jars experienced a 28% year-over-year market expansion...\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027experienced a 28% year-over-year market expansion\u0027 \u003c-\u003e \u0027Their share of the market is rising\u0027","[Loi giai chi tiet]: Dữ liệu nghiên cứu ngành khẳng định các sản phẩm mỹ phẩm và chăm sóc răng miệng đựng trong hũ thủy tinh tái chế nhiều lần đang ghi nhận mức tăng trưởng thị phần ấn tượng đạt 28% mỗi năm.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) They have been recalled due to safety defects","- Ly do sai: Sản phẩm hũ thủy tinh sinh thái được khen ngợi về độ an toàn và thân thiện môi trường, không bị thu hồi.","- Bay ETS: Bẫy Thu hồi Sản phẩm Giả tạo (False Product Recall Trap)","(B) They are restricted exclusively to dental hospitals","- Ly do sai: Sản phẩm hướng tới các chuỗi nhà thuốc và siêu thị bán lẻ đại chúng, không giới hạn riêng trong bệnh viện nha khoa.","- Bay ETS: Bẫy Giới hạn Thị trường Phi lý (Market Restriction Trap)","(C) They generate less consumer revenue than metal canisters","- Ly do sai: Tăng trưởng thị phần tăng cao chứng tỏ doanh thu tăng trưởng mạnh mẽ chứ không kém hơn các dạng lon kim loại.","- Bay ETS: Bẫy Suy đoán Tiêu cực Vô căn cứ (Unsubstantiated Negative Claim Trap)","194. What does Ms. Brown indicate about Green Globe toothpaste?","Dap an dung: (C) It is available in two countries.","[Dau vet bai doc / Clue]: Thư giới thiệu của bà Brown: \u0027...Our patented toothpaste tablet formula in refillable glass vessels has already achieved exceptional retail success across our pilot supermarket partners in Canada and Germany...\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027pilot supermarket partners in Canada and Germany\u0027 \u003c-\u003e \u0027available in two countries\u0027","[Loi giai chi tiet]: Bà Brown dẫn chứng sản phẩm viên kem đánh răng đựng trong hũ thủy tinh của Green Globe đã được phân phối thành công tại mạng lưới bán lẻ thử nghiệm ở 2 quốc gia là Canada và Đức.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) It is formulated without organic peppermint oil","- Ly do sai: Bảng thành phần ghi rõ sản phẩm sử dụng tinh dầu bạc hà hữu cơ tự nhiên để tạo hương vị dễ chịu.","- Bay ETS: Bẫy Trái ngược Thành phần Công thức (Ingredient Opposite Trap)","(B) It requires a doctor\u0027s prescription to purchase","- Ly do sai: Sản phẩm thuộc nhóm chăm sóc cá nhân không kê đơn (OTC), người tiêu dùng có thể mua tự do tại các kệ hàng bán lẻ.","- Bay ETS: Bẫy Nhầm lẫn Thuốc Kê đơn (Prescription Confusion Trap)","(D) It is sold in disposable plastic packets","- Ly do sai: Cốt lõi thương hiệu là giải pháp không rác thải đóng trong hũ thủy tinh, hoàn toàn không dùng túi ni-lông dùng một lần.","- Bay ETS: Bẫy Trái ngược Giá trị Cốt lõi (Core Brand Principle Contradiction Trap)","195. What is most likely true about the order placed by Macker Drugstores?","Dap an dung: (B) The merchandise will be used in a market test.","[Dau vet bai doc / Clue]: Đơn đặt hàng (Văn bản 3): \u0027Order Note: Merchandise destined for initial 90-day regional retail trial across 25 select Midwestern metro storefronts prior to full-chain national distribution rollout.\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027destined for initial 90-day regional retail trial across 25 storefronts\u0027 \u003c-\u003e \u0027merchandise will be used in a market test\u0027","[Loi giai chi tiet]: Ghi chú trên đơn hàng khẳng định lô hàng nhập khẩu này được phân bổ thử nghiệm trong 90 ngày tại 25 cửa hàng trọng điểm khu vực Trung Tây để đo lường phản ứng thị trường trước khi triển khai toàn diện trên toàn quốc.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) It will be delivered directly by ocean freight container","- Ly do sai: Hàng được vận tải nội địa bằng đường bộ từ kho phân phối Chicago đến 25 cửa hàng, không dùng tàu biển vào giữa nội lục.","- Bay ETS: Bẫy Sai lệch Phương thức Trung chuyển Nội địa (Inland Distribution Trap)","(C) It was paid entirely using government environmental grants","- Ly do sai: Đơn hàng do ngân sách thu mua thương mại của chuỗi bán lẻ Macker chi trả, không phải nguồn vốn trợ cấp của chính phủ.","- Bay ETS: Bẫy Nguồn vốn Tài trợ Sai lệch (Government Grant Trap)","(D) It includes 50,000 cases of synthetic packaging wraps","- Ly do sai: Quy mô thử nghiệm ban đầu là 2.500 hũ thủy tinh sinh thái, không phải 50.000 kiện màng bọc tổng hợp.","- Bay ETS: Bẫy Khống chế Số lượng \u0026 Vật liệu Sai (Quantity \u0026 Material Distortion Trap)","PHẦN 4: KỸ THUẬT FEYNMAN SONG NGỮ \u0026 SƠ ĐỒ QUY TRÌNH (TƯ DUY PHÂN TÍCH NGHIỆP VỤ CHUỖI CUNG ỨNG \u0026 BA)","4.1. Sơ đồ Quy trình Luân chuyển Nghiệp vụ (End-to-End Supply Chain \u0026 Banking Workflow)","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","THUYẾT TRÌNH BAO BÌ XANH, MỞ MÃ NHÀ CUNG CẤP \u0026 ĐƠN PILOT"],[],["BƯỚC 2","GIAO HÀNG VỀ TỔNG KHO DC #4, ĐỐI SOÁT CHIẾT KHẤU $0 \u0026 THANH TOÁN"],[],["BƯỚC 3","ĐÁNH GIÁ SỨC MUA (SELL-THROUGH) \u0026 KÍCH HOẠT HỢP ĐỒNG SỈ TOÀN CHUỖI"]],[["• Chung tu \u0026 Kenh: Bài báo Bao bì, Thư Chào hàng (Ms. Brown -\u003e Mr. Patel) \u0026 Hồ sơ Ngân hàng NCC","• Nghiep vu thuc thi: Tuýp nhôm-nhựa khó tái chế mất dần thị phần vào tay lọ thủy tinh; sau buổi thuyết trình, hãng Green Globe (bán tại Mỹ \u0026 Canada) mở mã nhà cung cấp và chốt đơn bán thử 2 thùng.","• Ket qua \u0026 Kiem soat: Ký Đơn hàng Thử nghiệm Thị trường (Pilot PO: 2 thùng cho 1 cửa hàng)"],["➔"],["• Chung tu \u0026 Kenh: Hóa đơn #6733348, Tổng kho Macker DC #4 \u0026 Ngân hàng Thanh toán (ACH/EFT)","• Nghiep vu thuc thi: Giao 2 thùng lọ thủy tinh ($290) + cước $26 = $316 về Tổng kho DC; vì 2 thùng \u003c= 10 thùng nên chiết khấu sỉ = $0.00; Ngân hàng chuỗi nhà thuốc giải ngân $316 sau khi DC nhập kho.","• Ket qua \u0026 Kiem soat: Tổng kho DC điều chuyển đích danh 2 thùng về 1 cửa hàng Flagship để bán thử"],["➔"],["• Chung tu \u0026 Kenh: Dữ liệu POS Cửa hàng, Hợp đồng Cung ứng Khung \u0026 Tài trợ Chuỗi Ngân hàng","• Nghiep vu thuc thi: Đo tốc độ bán thực tế tại cửa hàng thử nghiệm; khi đạt chỉ tiêu, kích hoạt đơn đặt hàng lớn (\u003e 10 thùng) cho toàn chuỗi nhà thuốc Macker để hưởng chiết khấu khối lượng.","• Ket qua \u0026 Kiem soat: Mở rộng phân phối toàn chuỗi; kích hoạt chiết khấu sỉ \u0026 thanh toán tự động EDI"]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["STEP 1","SUSTAINABLE PACKAGING PITCH, VENDOR CODE ONBOARDING \u0026 PILOT PO"],[],["STEP 2","DISTRIBUTION CENTER RECEIVING, $0 WHOLESALE DISCOUNT \u0026 PAYMENT"],[],["STEP 3","RETAIL SELL-THROUGH AUDIT \u0026 CHAIN-WIDE VOLUME MASTER CONTRACT"]],[["• Documents \u0026 Channels: Packaging Industry Whitepaper, Formal Sales Pitch \u0026 Vendor Banking Setup Form","• Core Business Execution: Pharmaceutical retailer Green Globe shifts from non-recyclable aluminum-plastic tubes to sustainable amber glass jars; vendor onboarding completed and 2-case initial pilot order authorized for flagship store trial.","• Key Deliverable \u0026 Control: Execution of Pilot Purchase Order (2 cases for 1 designated retail location)"],["➔"],["• Documents \u0026 Channels: Invoice #6733348, Macker DC #4 Receiving Manifest \u0026 Automated Clearing House (ACH)","• Core Business Execution: Deliver 2 cases ($290) + $26 ground freight = $316 to Macker DC #4; since order volume \u003c= 10 cases, wholesale volume rebate equals $0.00; pharmacy chain bank releases $316 upon DC inventory check-in.","• Key Deliverable \u0026 Control: Cross-dock dispatch of 2 pilot cases directly to designated retail flagship store"],["➔"],["• Documents \u0026 Channels: Store Point-of-Sale (POS) Analytics, Master Supply Agreement \u0026 EDI Automatic Ordering","• Core Business Execution: Track retail sell-through velocity at test store; upon exceeding sales KPI, trigger recurring chain-wide bulk purchase orders (\u003e 10 cases) across all Macker pharmacy outlets, unlocking wholesale tier discounts.","• Key Deliverable \u0026 Control: Nationwide retail chain rollout with automated EDI order fulfillment and electronic clearing"]]],"t":"table"},"4.2. Tư duy Phân tích Nghiệp vụ Chuỗi Cung Ứng \u0026 BA (Bản Tiếng Việt)","• Bức tranh Toàn cảnh Chuỗi cung ứng (Đưa Sản phẩm Bao bì Xanh vào Chuỗi Bán lẻ: Thẩm định Nhà cung cấp -\u003e Đơn Thử nghiệm DC -\u003e Thanh toán Ngân hàng \u0026 Nhân rộng Toàn chuỗi): Để một sản phẩm tiêu dùng bền vững (kem đánh răng đựng trong lọ thủy tinh tái chế của Green Globe, hiện bán tại 2 quốc gia Mỹ \u0026 Canada) thâm nhập vào một chuỗi nhà thuốc lớn (Macker Drugstores), quy trình thực tế diễn ra qua 3 giai đoạn khép kín: (1) Giai đoạn Chào hàng B2B \u0026 Mở mã Nhà cung cấp (Vendor Onboarding): Tuýp bóp nhôm-nhựa đa lớp gần như không thể tái chế nên mất dần thị phần vào tay bao bì lọ thủy tinh; sau buổi thuyết trình bán hàng (Sales Presentation), chuỗi nhà thuốc mở mã Nhà cung cấp và xác thực Tài khoản Ngân hàng thụ hưởng trên hệ thống ERP -\u003e (2) Giai đoạn Đơn hàng Thử nghiệm qua Tổng kho DC (Pilot Order \u0026 DC Routing): Thay vì mạo hiểm nhập sỉ ngay cho cả trăm cửa hàng, chuỗi nhà thuốc đặt 2 thùng đầu tiên ($290 + $26 phí ship = $316, chiết khấu sỉ = $0.00 vì chưa trên 10 thùng) giao về Trung tâm Phân phối (DC Facility #4) để kiểm định chất lượng và chuyển về bán thử (Market Test) tại 1 cửa hàng Flagship; Ngân hàng Bên Mua giải ngân $316 theo phương thức chuyển khoản điện tử (EFT/ACH) sau khi kho DC xác nhận nhập hàng -\u003e (3) Giai đoạn Mở rộng Toàn chuỗi (Chainwide Rollout): Khi dữ liệu máy tính tiền (POS) tại cửa hàng thử nghiệm chứng minh sức mua tốt, hệ thống tự động nâng cấp lên đơn hàng sỉ (\u003e 10 thùng) hưởng chiết khấu khối lượng và kích hoạt hạn mức tài trợ chuỗi cung ứng với Ngân hàng.","• Điểm nghẽn \u0026 Rủi ro Vận hành Thực tế (Core Bottleneck \u0026 Risk): Nếu chuỗi bán lẻ nhập sỉ ngay hàng trăm thùng sản phẩm có bao bì mới lạ (lọ thủy tinh thay vì tuýp bóp) mà chưa qua bước thử nghiệm thị trường 2 thùng, doanh nghiệp sẽ đối mặt với rủi ro hàng bán chậm gây đọng vốn lưu động và chật kho DC; ngược lại, ở giai đoạn thử nghiệm 2 thùng, hệ thống kế toán phải kiểm soát chặt để không áp nhầm chiết khấu mua sỉ (chỉ dành cho đơn trên 10 thùng).","• 3 Giải pháp Thiết kế Hệ thống \u0026 Kiểm soát Nghiệp vụ (BA \u0026 Supply Chain Architecture):","(1) Quản trị Luồng Đơn hàng Thử nghiệm Thị trường qua Tổng kho DC (Pilot Market-Test \u0026 DC Cross-Docking): Trên hệ thống Quản trị Đơn hàng Bán lẻ (Retail OMS/WMS), thiết lập luồng \u0027Đơn hàng Thử nghiệm\u0027 (Pilot PO): Hàng vẫn được giao về Tổng kho DC trung tâm (Facility #4) để kiểm tra tiêu chuẩn mã vạch/bao bì và đối soát hóa đơn, sau đó hệ thống tự động gắn lệnh xuất thẳng (Cross-dock) toàn bộ 2 thùng về đúng 1 cửa hàng Flagship duy nhất.","(2) Kiểm soát Tự động Ngưỡng Chiết khấu Bậc thang \u0026 Đối soát Thanh toán Ngân hàng (Volume Discount Tier \u0026 Bank EFT Control): Cấu hình quy tắc kiểm tra số lượng trên Hóa đơn thương mại: Với đơn hàng \u003c= 10 thùng (như đơn 2 thùng = $290), trường `Volume Discount (Orders \u003e 10 cases)` tự động khóa ở mức `$0.00`; hệ thống thực hiện đối soát 3 chiều (PO - Phiếu nhập kho DC - Hóa đơn #6733348) để Ngân hàng chuỗi nhà thuốc giải ngân chính xác $316.","(3) Phân tích Tốc độ Bán lẻ (POS Sell-Through) để Tự động Kích hoạt Đơn hàng Sỉ (\u003e 10 Thùng): Kết nối dữ liệu bán hàng POS tại cửa hàng thử nghiệm với hệ thống Mua sắm; ngay khi tốc độ bán của 2 thùng lọ thủy tinh vượt ngưỡng mục tiêu, hệ thống tự động đề xuất lệnh đặt hàng bổ sung quy mô lớn (\u003e 10 thùng) cho toàn chuỗi, tự động áp mức chiết khấu sỉ và mở hạn mức thanh toán tự động qua Ngân hàng.","4.3. Business Analyst \u0026 Supply Chain Executive Summary (Bản Tiếng Anh)","• End-to-End Supply Chain Context: Onboarding a sustainable product into a major pharmacy chain spans three complete stages: (1) B2B sales presentation and vendor/bank onboarding, capitalizing on the market shift away from non-recyclable aluminum-plastic tubes toward recyclable glass jars (currently sold across two countries: the US and Canada); (2) Executing a 2-case pilot order ($290 + $26 shipping = $316, with $0.00 volume discount since it is under the 10-case threshold) delivered to Macker\u0027s Distribution Center (DC #4) for a single-store market test and settled via interbank EFT/ACH upon DC receipt; and (3) Scaling to chainwide bulk orders (\u003e10 cases) once flagship POS sell-through is validated.","• Core Operational Bottleneck \u0026 Risk: Ordering chainwide bulk quantities of an unfamiliar packaging format (jar toothpaste) without a small-lot market test risks severe capital tie-up and DC overstock, whereas lax billing controls during pilot orders can erroneously grant bulk discounts on small 2-case shipments.","• Key BA \u0026 System Architecture Solutions:","(1) DC-to-Flagship Pilot Order Routing: Configure retail WMS/OMS platforms to receive small test consignments (2 cases) at the central Distribution Center and cross-dock them exclusively to the designated pilot store.","(2) Automated Volume-Discount Threshold \u0026 Bank EFT Matching: Enforce invoice validation rules that lock volume discounts at $0.00 for orders of 10 cases or fewer, triggering automated 3-Way Matching (Pilot PO - DC Receipt - Invoice #6733348) for bank EFT disbursement.","(3) POS Sell-Through Analytics \u0026 Bulk Reorder Trigger: Monitor flagship store sell-through rates in real time to automatically transition successful pilot SKUs into chainwide reorders (\u003e10 cases) with tiered volume rebates.","PHẦN 5: TỪ VỰNG \u0026 PARAPHRASE CHUYÊN SÂU (CHUẨN 3 DÒNG TỐI ƯU NẠP ANKI)","Distribution center (DC)  /ˌdɪstrɪˈbjuːʃn ˈsentər/  Central fulfillment hub / Regional warehouse depot / Logistics routing facility","Nghia: Trung tâm phân phối tổng, kho hàng đầu mối chuyên tiếp nhận các lô hàng sỉ lớn từ các nhà cung cấp để phân loại và điều phối giao lẻ về các cửa hàng chi nhánh.","Vd: All inbound health and personal care shipments are consolidated at the company\u0027s regional distribution center before dispatch. - Toàn bộ các lô hàng chăm sóc sức khỏe và cá nhân nhập vào đều được gom tập trung tại trung tâm phân phối khu vực của công ty trước khi xuất điều phối.","Pilot-test  /ˈpaɪlət test/  Market trial / Feasibility experiment / Trial run","Nghia: Thử nghiệm thí điểm quy mô nhỏ trên một phạm vi hạn chế để đo lường tính khả thi, phản ứng khách hàng trước khi triển khai chính thức trên diện rộng.","Vd: The pharmacy retail chain decided to pilot-test the new organic skincare line in three downtown stores prior to nationwide rollout. - Chuỗi bán lẻ dược phẩm đã quyết định thử nghiệm thí điểm dòng mỹ phẩm hữu cơ mới tại ba cửa hàng trung tâm trước khi phân phối trên toàn quốc.","Volume discount  /ˈvɑːljuːm ˈdɪskaʊnt/  Bulk rebate / Quantity price concession / Scale price break","Nghia: Mức chiết khấu giảm giá theo khối lượng, ưu đãi giảm đơn giá hàng hóa khi đối tác đặt mua với số lượng lớn vượt ngưỡng quy định.","Vd: The manufacturer provides a substantial 15 percent volume discount on purchase orders exceeding five hundred units. - Nhà sản xuất áp dụng mức chiết khấu khối lượng đáng kể lên tới 15% cho các đơn đặt hàng mua sắm vượt quá năm trăm sản phẩm.","Collapsible  /kəˈlæpsəbl/  Foldable / Compressible / Pliable tube","Nghia: Có thể bóp gập lại được, có thể xẹp xuống được (thường dùng để mô tả các loại tuýp kem đánh răng, tuýp thuốc mỡ dẻo).","Vd: Traditional collapsible aluminum-plastic laminate tubes pose significant recycling challenges in modern waste processing facilities. - Các loại tuýp màng nhôm-nhựa truyền thống có thể bóp gập lại đặt ra những thách thức tái chế lớn tại các cơ sở xử lý rác thải hiện đại.","Chainwide  /ˈtʃeɪnwaɪd/  Across all retail branches / System-wide / Enterprise-wide","Nghia: Áp dụng đồng loạt trên toàn bộ chuỗi hệ thống cửa hàng, chi nhánh bán lẻ của một doanh nghiệp.","Vd: Following the resounding success of the local pilot, the company launched a chainwide distribution campaign across 150 pharmacies. - Sau thành công vang dội của đợt thử nghiệm cục bộ, công ty đã phát động một chiến dịch phân phối trên toàn chuỗi phủ khắp 150 nhà thuốc.","==================================================================================================","BẢNG TỔNG HỢP 50 CẶP TỪ PARAPHRASE CHUYÊN SÂU CHỦ ĐỀ LOGISTICS \u0026 QUẢN LÝ CHUỖI CUNG ỨNG NẠP ANKI",{"rows":[[["STT"],["Cụm từ gốc trong đề ETS"],["Paraphrase đồng nghĩa"],["Ý nghĩa nghiệp vụ thực tế"]],[["1"],["Freight forwarding"],["Cargo dispatch service / Logistics brokerage"],["Dịch vụ giao nhận vận tải hàng hóa đa phương thức"]],[["2"],["Bill of Lading (B/L)"],["Shipping manifest / Carriage contract / Waybill"],["Vận đơn đường biển (Hợp đồng vận chuyển kiêm biên lai giao nhận)"]],[["3"],["Demurrage charges"],["Storage penalty fee / Terminal detention fee"],["Phí phạt lưu bãi / Phí phạt lưu vỏ container quá hạn"]],[["4"],["Bonded warehouse"],["Customs-controlled storage / Duty-free depot"],["Kho ngoại quan (Lưu giữ hàng chờ làm thủ tục hải quan)"]],[["5"],["Hermetically sealed"],["Airtight enclosed / Vacuum-sealed container"],["Niêm phong kín khí tuyệt đối (Chống ẩm và nước xâm nhập)"]],[["6"],["Consignee"],["Cargo recipient / Receiver / Designated importer"],["Người nhận hàng (Bên thụ hưởng hàng hóa trên vận đơn)"]],[["7"],["Seal integrity inspection"],["Tamper-evident verification / Border security check"],["Kiểm tra thực tế tính nguyên vẹn của kẹp chì hải quan"]],[["8"],["Multimodal transport"],["Combined intermodal freight / Sea-land-rail shipment"],["Vận tải đa phương thức kết hợp nhiều loại hình phương tiện"]],[["9  tinh giản danh mục mã hàng hóa tồn kho"]],[["23"],["Fulfillment center"],["Distribution warehouse / Order processing hub"],["Tổng kho hoàn tất đơn hàng thương mại điện tử"]],[["24"],["Return Merchandise (RMA)"],["Product return authorization / Defect exchange slip"],["Quy trình xác nhận và cấp phép đổi trả hàng hóa bị lỗi"]],[["25"],["Restocking fee"],["Warehouse processing surcharge / Inventory return fee"],["Phí phụ thu xử lý nhập lại kho đối với hàng đổi trả"]],[["26"],["Reverse logistics"],["Return flow management / Backward supply pipeline"],["Hậu cần ngược (Quản lý thu hồi, sửa chữa và tái chế sản phẩm)"]],[["27"],["SLA delivery penalty"],["Contractual delay rebate / Default liquidated damages"],["Tiền phạt vi phạm cam kết chất lượng dịch vụ giao hàng"]],[["28"],["Billing credit adjustment"],["Account ledger offset / Invoice balance deduction"],["Khấu trừ đối soát hóa đơn / Bù trừ công nợ thanh toán"]],[["29"],["Gross non-performance"],["Material breach of contract / Egregious service failure"],["Vi phạm nghiêm trọng nghĩa vụ cam kết trong hợp đồng"]],[["30"],["Dedicated account desk"],["VIP client coordinator / Single point of contact (SPOC)"],["Đầu mối chuyên trách hỗ trợ và điều phối tài khoản khách hàng VIP"]],[["31"],["Freight space"],["Cargo capacity / Shipping volume allowance"],["Dung tích xếp dỡ hàng hóa trên tàu thuyền hoặc máy bay"]],[["32"],["In short supply"],["Critically scarce / Severe inventory deficit / Shortage"],["Rơi vào tình trạng khan hiếm nguồn cung trầm trọng"]],[["33"],["Outpace availability"],["Surpass capacity / Exceed market supply"],["Tăng trưởng vượt xa năng lực cung ứng sẵn có trên thị trường"]],[["34"],["Bulk materials"],["Loose aggregate cargo / Mass industrial supplies"],["Vật tư hàng rời khối lượng lớn (đất, cát, sỏi dăm, đá khối)"]],[["35"],["Commercial invoice"],["Billing manifest / Financial shipping statement"],["Hóa đơn thương mại xác định nghĩa vụ thanh toán và thuế hải quan"]],[["36"],["Volume discount"],["Tiered bulk rebate / Quantity price concession"],["Chiết khấu thương mại giảm giá đơn hàng theo khối lượng lớn"]],[["37"],["Electronic invoicing"],["Automated e-billing / Digital EDI invoicing system"],["Hệ thống lập và truyền nhận hóa đơn điện tử tự động"]],[["38"],["Software rollout"],["System deployment / Enterprise application release"],["Quá trình triển khai nhân rộng phần mềm trên toàn doanh nghiệp"]],[["39"],["Procurement pipeline"],["Sourcing process / Raw material acquisition cycle"],["Quy trình thu mua và cung ứng nguyên phụ liệu cho nhà máy"]],[["40"],["Pricing accuracy"],["Rate verification / Contract price audit / Tariff validation"],["Kiểm tra độ chuẩn xác của đơn giá trước khi phát hành hóa đơn"]],[["41"],["Three-way matching"],["PO-POD-Invoice audit / Cross-ledger reconciliation"],["Đối soát ba chiều khớp giữa Đơn mua, Phiếu giao và Hóa đơn"]],[["42"],["3PL partner alliance"],["Third-party logistics synergy / Contract carrier affiliation"],["Liên minh hợp tác chiến lược với doanh nghiệp logistics bên thứ ba"]],[["43"],["Cash-flow strain"],["Liquidity crunch / Working capital bottleneck"],["Áp lực căng thẳng thanh khoản dòng tiền do nợ đọng hoặc giao trễ"]],[["44"],["Distribution center (DC)"],["Central fulfillment hub / Regional warehouse depot"],["Trung tâm phân phối tổng điều phối hàng về mạng lưới bán lẻ"]],[["45"],["Pilot-test order"],["Market trial purchase / Feasibility sample consignment"],["Đơn đặt hàng thử nghiệm quy mô nhỏ để kiểm chứng thị trường"]],[["46"],["Chainwide rollout"],["Network-wide launch / Full retail expansion"],["Triển khai phân phối đồng loạt trên toàn bộ chuỗi cửa hàng"]],[["47"],["Collapsible packaging"],["Pliable multi-layer tube / Squeezable container"],["Bao bì tuýp màng phức hợp ép dẻo có thể bóp gập lại"]],[["48"],["Sustainable packaging"],["Eco-friendly recyclable container / Circular packaging"],["Bao bì xanh thân thiện môi trường có thể tái chế tuần hoàn"]],[["49"],["Lead time buffer"],["Safety transit margin / Scheduled delivery allowance"],["Khoảng thời gian đệm dự phòng chống rủi ro giao hàng trễ"]],[["50"],["Shipment tracking telemetry"],["GPS cargo route monitoring / End-to-end shipment visibility"],["Hệ thống viễn thông giám sát lộ trình vận tải và tình trạng hàng hóa"]]],"t":"table"}]</script>

function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function add(p,...kids){ kids.forEach(k=>k&&p.appendChild(k)); return p; }
const isStr = x => typeof x === 'string';

/* ---------- split document ---------- */
const intro = RAW.slice(0,3);
const lessons = [];
let cur=null, finalTable=null, finalTitle='';
for(let i=3;i<RAW.length;i++){
  const it=RAW[i];
  if(isStr(it) && /^[=\-]{10,}$/.test(it)) continue;
  // "BÀI THỰC HÀNH SỐ N" alone (title on the next line) or "BÀI THỰC HÀNH SỐ N: Title" (title on the same line)
  if(isStr(it) && /^BÀI THỰC HÀNH SỐ\s*\d+/.test(it)){ const t=it.replace(/^BÀI THỰC HÀNH SỐ\s*\d+\s*:?\s*/,''); cur={items:t?[t]:[]}; lessons.push(cur); continue; }
  // "BÀI N: Title" keeps the title on the same line
  if(isStr(it) && /^BÀI\s+\d+\s*:/.test(it)){ cur={items:[it.replace(/^BÀI\s+\d+\s*:\s*/,'')]}; lessons.push(cur); continue; }
  if(isStr(it) && /^(BẢNG TỔNG HỢP|PHẦN TỔNG KẾT|PHAN TONG KET)/.test(it)){ cur=null; finalTitle=it; continue; }
  if(!cur){ if(!isStr(it)) finalTable=it; continue; }
  cur.items.push(it);
}
lessons.forEach((L,idx)=>{
  L.n=idx+1;
  let t=L.items[0]; const tq=t.match(/\s*\((Questions?\s*\d+\s*-\s*\d+[^()]*)\)\s*$/); if(tq) t=t.slice(0,tq.index);
  // trailing "(ENGLISH TITLE)" only when it is a real English title, not a short term like "(Credit Memo)":
  // 4+ words, or an all-caps title of 2+ words such as "(GRAPHIC DESIGN ASSOCIATE)"
  const m=t.match(/^(.*)\s\(([^()]*)\)\s*$/); const nw=m?m[2].split(/\s+/).length:0;
  const isEn=m&&!isVI(m[2])&&(nw>=4||(nw>=2&&m[2]===m[2].toUpperCase()&&/[A-Z]/.test(m[2])));
  L.vi = isEn?m[1]:t; L.en = isEn?m[2]:'';
  L.src = L.items[1].replace(/^Nguồn( bài học)?:\s*/,'');
  const q=(L.src+' '+L.items[0]).match(/Questions?\s*(\d+)\s*-\s*(\d+)/); L.qr = q?`Q${q[1]}–${q[2]}`:'';
  if(!SHORT[idx]){ const w=L.vi.split(/\s+/).slice(0,4).join(' ').toLowerCase(); SHORT[idx]=w.charAt(0).toUpperCase()+w.slice(1); }
  L.parts=[]; let P=null, S=null;
  for(const it of L.items.slice(2)){
    if(isStr(it)){
      const pm=it.match(/^PHẦN\s*(\d)\s*:\s*(.*)$/i);
      if(pm){ P={n:+pm[1],title:pm[2],subs:[],items:[]}; L.parts.push(P); S=null; continue; }
      const sm=it.match(/^(\d\.\d)\.\s+(.*)$/);
      // only "N.x." of the current PHẦN N opens a sub-section; "4.1. Package…" inside a passage is content
      if(sm && P && +sm[1][0]===P.n){ S={id:sm[1],title:sm[2],items:[]}; P.subs.push(S); continue; }
    }
    if(S) S.items.push(it); else if(P) P.items.push(it);
  }
  // answer key from part 3
  L.key={}; L.answers=[];
  const p3=L.parts.find(p=>p.n===3);
  // two formats: "186. (A) text" + [Dau vet]/[Giai thich]
  //          or  "186. stem" + "Dap an dung: (A) text" + [Dau vet bai doc]/[Dien dat tuong duong]/[Loi giai chi tiet]/[Phan tich Phuong an Sai] + "(B) ..." "- Ly do sai:" "- Bay ETS:"
  if(p3){ let a=null, sec='';
    const newA=no=>{ a={no,k:'',t:'',stem:'',trace:'',expl:'',para:[],wrong:[]}; L.answers.push(a); sec=''; };
    for(const s of p3.items){ if(!isStr(s)) continue;
      let m=s.match(/^(\d{3})\.\s*\(([A-D])\)\s*(.*)$/);
      if(m){ newA(m[1]); a.k=m[2]; a.t=m[3]; L.key[m[1]]=m[2]; continue; }
      m=s.match(/^(\d{3})\.\s+(.*)$/);
      if(m){ newA(m[1]); a.stem=m[2]; continue; }
      if(!a) continue;
      m=s.match(/^Dap an dung:\s*\(([A-D])\)\s*(.*)$/i);
      if(m){ a.k=m[1]; a.t=m[2]; L.key[a.no]=m[1]; continue; }
      m=s.match(/^\[([^\]]+)\]:?\s*(.*)$/);
      if(m){ const lab=m[1], rest=m[2];
        if(/^Dau vet/i.test(lab)){ sec='trace'; a.trace=rest; }
        else if(/Paraphrase|Dien dat/i.test(lab)){ sec='para'; rest.split(/\s*•\s*/).filter(Boolean).forEach(x=>a.para.push(x)); }
        else if(/Phuong an Sai|Bay/i.test(lab)){ sec='wrong'; }
        else { sec='expl'; a.expl+=(a.expl?' ':'')+rest; }
        continue; }
      if(sec==='wrong'){
        m=s.match(/^\(([A-D])\)\s*(.*)$/); if(m){ a.wrong.push({k:m[1],t:m[2],why:'',trap:''}); continue; }
        const w=a.wrong[a.wrong.length-1]; m=s.match(/^-\s*(Ly do sai|Bay ETS)\s*:\s*(.*)$/i);
        if(w&&m){ if(/^Ly/i.test(m[1])) w.why=m[2]; else w.trap=m[2]; continue; }
      }
      if(sec==='para' && /^•/.test(s)){ a.para.push(s.replace(/^•\s*/,'')); continue; }
      if(sec==='trace'){ a.trace+=' '+s; continue; }
      a.expl += (a.expl?' ':'')+s;
    }
  }
});
const TABS = lessons.map(L=>({id:'bai'+L.n, n:String(L.n).padStart(2,'0'), label:SHORT[L.n-1]||('Bài '+L.n), sub:L.qr, c:`var(--c${L.n})`}));
const NFIN = finalTable ? finalTable.rows.length-1 : 50;
const FINLABEL = /THU[ẬA]T NG[ỮU]/i.test(finalTitle) ? `${NFIN} thuật ngữ vàng` : `${NFIN} cặp Paraphrase`;
TABS.push({id:'paraphrase', n:String(NFIN), label:FINLABEL, sub:'Tổng hợp nạp Anki', c:'var(--red)'});

/* ---------- line formatting for passages ---------- */
// passage header: known doc types, a bare "[Internal Recommendation] Letter", or generic "Doc Type [N] (Descriptor)";
// a bracket holding a date ("Boston (January 3)", "(Evaluated by …, Director — March 28)") is a dateline or caption, not a header
const DOC_RE=/^(E-mail|Email|Letter \d|Document \d|Internal Memorandum|Webpage|Press Release|Bill of Lading|Economic Logistics Article|Service Proposal)\b|^(?:[A-Z][a-z]+ ){0,3}Letter$|^[A-Z][A-Za-z&\/\- ]{2,50}(?: \d)? \((?![^()]*\b(?:January|February|March|April|May|June|July|August|September|October|November|December) \d)[A-Za-z][^()]*\)$/;
// an ALL-CAPS line like "REQUEST FOR PROPOSALS (RFP #VF-2026-08)" is a letterhead inside a passage, not a new passage
const isDocHead=s=>DOC_RE.test(s) && s.length<110 && !/:\s/.test(s) && !(s===s.toUpperCase() && /[A-Z]{4}/.test(s));
function fmtLine(s){
  if(/^•\s*/.test(s)) return el('div','ln-bul',s.replace(/^•\s*/,''));
  const kv=s.match(/^([A-ZÀ-Ỹa-zà-ỹ][^:]{0,30}):\s+(.+)$/);
  if(kv && !/[.!?]$/.test(kv[1]) && kv[1].split(' ').length<=5){ const d=el('div','ln-kv'); add(d,el('b',null,kv[1]+':'),document.createTextNode(kv[2])); return d; }
  if(s===s.toUpperCase() && /[A-ZÀ-Ỹ]{3}/.test(s) && s.length<130) return el('div','ln-caps',s);
  if(/:$/.test(s) && s.length<60) return el('div','ln-sec',s);
  return el('p',null,s);
}

/* "• Label: text" bullet with a bold label; "• Label:" alone becomes a group heading */
function bullet(s){
  s=s.trim();
  if(/^[^:]{2,150}:$/.test(s)) return el('div','ln-head',s.slice(0,-1));
  const d=el('div','ln-bul'); const m=s.match(/^([^:]{2,150}?):\s+(.*)$/);
  if(m && !/[.!?]$/.test(m[1])){ let rest=m[2]; if(rest.startsWith(m[1]+':')) rest=rest.slice(m[1].length+1).trim();
    add(d,el('b',null,m[1]+': '),document.createTextNode(rest)); }
  else d.textContent=s;
  return d;
}
/* one line of a strategy / BA block: "• ..." bullet, "=> ..." conclusion, "(1) ..." numbered point, else paragraph */
function richLine(s){
  s=s.trim();
  if(/^•/.test(s)){ const r=s.replace(/^•\s*/,''); return r.trim()?bullet(r):null; }
  if(/^=>/.test(s)){ const d=bullet(s.replace(/^=>\s*/,'')); d.className='ln-concl'; return d; }
  if(/^\(\d+\)/.test(s)){ const d=bullet(s); d.className='ln-num'; return d; }
  if(/^-\s/.test(s)){ const d=bullet(s.replace(/^-\s*/,'')); d.className='ln-sub'; return d; }
  return el('p',null,s);
}

/* ---------- renderers ---------- */
function partShell(L,P){
  const sec=el('section','part'); sec.id=`b${L.n}-p${P.n}`;
  const h=el('div','part-h'); add(h,el('span','pn','PHẦN '+P.n),el('h3',null,P.title)); sec.appendChild(h);
  return sec;
}
function subShell(L,S){
  const d=el('div','sub'); d.id=`b${L.n}-s${S.id.replace('.','-')}`;
  const h=el('div','sub-h'); add(h,el('span','sn',S.id),el('span',null,S.title)); d.appendChild(h); return d;
}

/* mode 'pass' = original passages only, 'quiz' = original questions only, 'strat' = strategy steps before the passages,
   'guide' = the whole sub-section is strategy (newer docs give it its own "Hướng dẫn làm bài Part 7" sub-section) */
function render11(L,items,box,mode){
  // passages start at "[ORIGINAL ETS PASSAGES…]", else at "Questions N-M refer to…" or the first passage header after the last "Bước" line
  let iP=items.findIndex(s=>isStr(s)&&/^\[ORIGINAL ETS PASSAGES/i.test(s)), pSkip=1;
  if(iP<0){ iP=items.findIndex(s=>isStr(s)&&/^Questions\s+\d+.*refer to/i.test(s)); pSkip=0; }
  if(iP<0){ let lastStep=-1; items.forEach((s,i)=>{ if(isStr(s)&&/^Bước\s*\d+\s*\(/.test(s)) lastStep=i; });
    iP=items.findIndex((s,i)=>i>lastStep&&isStr(s)&&(isDocHead(s)||/^\[Passage/i.test(s))); pSkip=0; }
  if(mode==='guide'){ iP=items.length; mode='strat'; }  // a stand-alone strategy sub-section is all strategy
  const iQ=items.findIndex(s=>isStr(s)&&/^(\[ORIGINAL ETS QUESTIONS|ETS Questions:?$)/i.test(s));
  const strat=items.slice(0,iP<0?0:iP), pass=items.slice(iP<0?0:iP+pSkip,iQ<0?items.length:iQ), qs=iQ<0?[]:items.slice(iQ+1);
  if(strat.length && mode==='strat'){
    const st=el('div','strat'); const steps=el('div','steps'); let lastTx=null;
    const addBody=(tx,text)=>{ text.split(/\s+•\s+/).forEach((seg,i)=>{ seg=seg.replace(/^•\s*/,'').trim(); if(seg) tx.appendChild(i||/^•/.test(text)?bullet(seg):el('p',null,seg)); }); };
    strat.forEach(s=>{
      const m=s.match(/^(Bước\s*\d+)\s*\(([^)]+)\)\s*-\s*([^:]+?):\s*(.*)$/);
      if(m){ const r=el('div','step'); const w=el('div','when'); add(w,el('b',null,m[1]),el('span',null,m[2]));
        const tx=el('div'); tx.style.cssText='display:flex;flex-direction:column;gap:4px'; tx.appendChild(el('h5',null,m[3])); addBody(tx,m[4]); add(r,w,tx); steps.appendChild(r); lastTx=tx; }
      else if(lastTx){ const r=richLine(s); r&&lastTx.appendChild(r); }
      else st.appendChild(el('div','strat-t',s));
    });
    st.appendChild(steps); box.appendChild(st);
  }
  if(mode==='strat') return;
  // passages
  if(mode==='pass'){
  const papers=el('div','papers'); let pp=null, refer='';
  const newPaper=(tag)=>{ pp=el('article','paper'); if(tag) pp.appendChild(el('span','paper-tag',tag)); papers.appendChild(pp); };
  pass.forEach(s=>{
    if(!isStr(s)) return;
    if(/^Questions\s+\d+.*refer to/i.test(s)){ refer=s; return; }
    const pm=s.match(/^\[(Passage\s*\d+\s*:.*)\]$/i); if(pm){ newPaper(pm[1]); return; }
    if(isDocHead(s)){ newPaper(s); return; }
    if(!pp) newPaper('ETS Passage');
    pp.appendChild(fmtLine(s));
  });
  const lab=el('div','strat-t','Original ETS Passages · Đề thi tiếng Anh gốc'); lab.style.color='var(--muted)';
  box.appendChild(lab); if(refer){ const r=el('p',null,refer); r.style.cssText='font-style:italic;color:var(--muted);margin:0 0 10px'; box.appendChild(r); } box.appendChild(papers);
  return; }
  // quiz; a bare "191" line takes its stem from PHẦN 3
  const Q=[]; let q=null;
  qs.forEach(s=>{ if(!isStr(s)) return;
    let m=s.match(/^(\d{3})(?:\.\s*(.*))?$/); if(m){ const a=L.answers.find(x=>x.no===m[1]); q={no:m[1],stem:m[2]||(a&&a.stem)||'',extra:[],opts:[]}; Q.push(q); return; }
    m=s.match(/^\(([A-D])\)\s*(.*)$/); if(m&&q){ q.opts.push({k:m[1],t:m[2]}); return; }
    if(q) q.extra.push(s);
  });
  L.quiz=Q;
  if(!Q.length) return;
  const qz=el('div','quiz'); const top=el('div','quiz-top');
  const sc=el('div','score'); const reset=el('button','btn','Làm lại'); reset.type='button';
  add(top,el('div','strat-t','Original ETS Questions · Bấm chọn đáp án để tự kiểm tra'),add(el('div'),sc));
  top.lastChild.style.cssText='display:flex;gap:10px;align-items:center'; top.lastChild.appendChild(reset);
  qz.appendChild(top);
  const state={};
  const upd=()=>{ const done=Object.keys(state).length, ok=Object.values(state).filter(Boolean).length;
    sc.innerHTML=''; add(sc,document.createTextNode('Đã làm '),el('b',null,`${done}/${Q.length}`),document.createTextNode(' · Đúng '),el('b',null,String(ok))); };
  Q.forEach(q=>{
    const c=el('div','q'); const st=el('div','q-stem'); const stx=el('div',null,q.stem);
    q.extra.forEach(x=>stx.appendChild(el('div','q-extra',x)));
    add(st,el('span','q-no',q.no),stx); c.appendChild(st);
    const os=el('div','opts'); const fb=el('div','q-fb');
    const btns=q.opts.map(o=>{ const b=el('button','opt'); b.type='button'; add(b,el('span','k',`(${o.k})`),el('span',null,o.t));
      b.addEventListener('click',()=>{
        const right=L.key[q.no]; btns.forEach(x=>x.classList.remove('ok','bad'));
        const good=o.k===right; state[q.no]=good;
        b.classList.add(good?'ok':'bad');
        if(!good&&right){ const rb=btns[q.opts.findIndex(z=>z.k===right)]; rb&&rb.classList.add('ok'); }
        fb.innerHTML=''; const r=el('span','r '+(good?'ok':'bad'),good?'✓ Chính xác':`✗ Chưa đúng · đáp án (${right})`);
        const a=el('a',null,'Xem dấu vết truy xuất'); a.href='#'; a.addEventListener('click',e=>{e.preventDefault(); const t=document.getElementById(`b${L.n}-a${q.no}`); if(t){t.scrollIntoView({behavior:'smooth',block:'center'}); t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash');}});
        add(fb,r,a); upd();
      });
      os.appendChild(b); return b; });
    add(c,os,fb); qz.appendChild(c);
    reset.addEventListener('click',()=>{ btns.forEach(x=>x.classList.remove('ok','bad')); fb.innerHTML=''; delete state[q.no]; upd(); });
  });
  upd(); box.appendChild(qz);
}

function render12(items,box){
  const wrap=el('div','bi'); const head=el('div','bi-head'); add(head,el('span',null,'ENGLISH'),el('span',null,'TIẾNG VIỆT')); wrap.appendChild(head);
  const runs=[];
  items.forEach(s=>{ if(!isStr(s)) return;
    if(/^\[?Văn bản(\s*\d+)?\s*:/.test(s)){ runs.push({doc:s.replace(/^\[(.*)\]$/,'$1')}); return; }
    const lg=isVI(s)?'vi':'en'; const last=runs[runs.length-1];
    if(last&&last.lg===lg) last.lines.push(s); else runs.push({lg,lines:[s]});
  });
  for(let i=0;i<runs.length;i++){
    const r=runs[i];
    if(r.doc){ const d=el('div','bi-doc',r.doc); d.style.padding='12px 16px 8px'; d.style.borderTop='1px solid var(--line)'; d.style.margin='0'; d.style.background='var(--surface-2)'; wrap.appendChild(d); continue; }
    const p=el('div','pair'); const en=el('div','en'), vi=el('div','vi vi-r');
    if(r.lg==='en'){ r.lines.forEach(s=>en.appendChild(fmtLine(s))); const nx=runs[i+1]; if(nx&&nx.lg==='vi'){ nx.lines.forEach(s=>vi.appendChild(fmtLine(s))); i++; } }
    else r.lines.forEach(s=>vi.appendChild(fmtLine(s)));
    add(p,en,vi); wrap.appendChild(p);
  }
  box.appendChild(wrap);
}

function render13(L,items,box){
  const list=el('div','qt'); let card=null, opts=null;
  const strs=items.filter(isStr);
  const isQ=s=>/^(Câu\s+)?\d{3}\.\s/.test(s), isO=s=>/^\([A-D]\)/.test(s);
  // Vietnamese-only lines ("Câu 186. …", "(A) …") borrow the English stem / option from the quiz in 1.1
  let qq=null;
  for(let i=0;i<strs.length;i++){
    const s=strs[i], nx=strs[i+1], hasVi=nx&&!isQ(nx)&&!isO(nx);
    if(isQ(s)){ const m=s.match(/^(?:Câu\s+)?(\d{3})\.\s*(.*)$/); qq=(L.quiz||[]).find(x=>x.no===m[1]);
      card=el('div','qt-card'); card.dataset.no=m[1]; const st=el('div','stem'); const tx=el('div');
      if(isVI(m[2])&&qq&&qq.stem){ tx.appendChild(el('b',null,qq.stem)); tx.appendChild(el('span','vi-t vi-r',m[2])); }
      else { tx.appendChild(el('b',null,m[2])); if(hasVi){ tx.appendChild(el('span','vi-t vi-r',nx)); i++; } }
      add(st,el('span','q-no',m[1]),tx); card.appendChild(st); opts=el('div','qt-opts'); card.appendChild(opts); list.appendChild(card); continue; }
    if(isO(s)&&opts){ const m=s.match(/^\(([A-D])\)\s*(.*)$/); const o=el('div','qt-opt'); if(L.key[card.dataset.no]===m[1]) o.classList.add('correct');
      const tx=el('div'); const eo=qq&&qq.opts.find(x=>x.k===m[1]);
      if(eo&&eo.t!==m[2]&&!hasVi){ tx.appendChild(el('span',null,eo.t)); tx.appendChild(el('span','vi-t vi-r',m[2])); }
      else { tx.appendChild(el('span',null,m[2])); if(hasVi){ tx.appendChild(el('span','vi-t vi-r',nx)); i++; } }
      add(o,el('span','k',`(${m[1]})`),tx); opts.appendChild(o); continue; }
    if(card) card.appendChild(el('p','vi-t vi-r',s));
  }
  box.appendChild(list);
}

function renderPairs(items,box,cls){
  const strs=items.filter(isStr); const g=el('div',cls);
  const en=el('div'), vi=el('div','vi-r');
  add(en,el('span','lang','ENGLISH')); add(vi,el('span','lang','TIẾNG VIỆT'));
  if(cls==='sum'){ strs.forEach(s=>(isVI(s)?vi:en).appendChild(ideaList(s,isVI(s)))); add(g,en,vi); box.appendChild(g); return; }
  strs.forEach(s=>(isVI(s)?vi:en).appendChild(el('p',isVI(s)?'vi-t':null,s)));
  add(g,en,vi); box.appendChild(g);
}

/* summary paragraph -> one bullet per sentence; a long tail after ": " becomes sub-bullets split at top-level ", and/và/nhờ/đồng thời" or "; " */
const ABBR=/\b(Mr|Ms|Mrs|Dr|St|No|Inc|Co|Ltd|Corp|vs|etc|e\.g|i\.e|approx|Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)\.$/i;
function topSplit(s,test){ // split where test(s,i) matches outside brackets/quotes; returns [pieces]
  const out=[]; let d=0, st=0;
  for(let i=0;i<s.length;i++){ const c=s[i];
    if('(['.includes(c)) d++; else if(')]'.includes(c)) d=Math.max(0,d-1);
    else if(!d){ const n=test(s,i); if(n){ out.push(s.slice(st,i+n.keep).trim()); st=i+n.skip; i=st-1; } } }
  out.push(s.slice(st).trim()); return out.filter(Boolean);
}
function sentences(s){
  return topSplit(s,(t,i)=>{ if(!/[.!?]/.test(t[i])||!/\s/.test(t[i+1]||'')) return null;
    if(ABBR.test(t.slice(Math.max(0,i-6),i+1))) return null;
    const nx=t.slice(i+1).trimStart()[0]||''; if(!/[A-ZÀ-Ỹ0-9"'‘“(]/.test(nx)) return null;
    return {keep:1,skip:1}; });
}
function ideaList(s,vi){
  const ul=el('ul','ideas'+(vi?' vi-t':''));
  sentences(s).forEach(sen=>{
    const li=el('li'); const ci=sen.search(/:\s/); let head=sen, tail='';
    if(ci>20 && sen.length-ci>90){ head=sen.slice(0,ci+1); tail=sen.slice(ci+1).trim(); }
    // long sentence without a colon tail: break at top-level ", allowing / , while / , đồng thời / —"
    if(!tail && sen.length>200){ const ps=topSplit(sen,(t,i)=>{ const m=t.slice(i).match(/^(,\s+(?=(?:allowing|while|whereas|đồng thời|trong khi)\s)|\s*—\s*)/); return m?{keep:0,skip:m[0].length}:null; });
      if(ps.length>1){ head=ps[0]; tail=ps.slice(1); } }
    li.appendChild(document.createTextNode(head));
    if(Array.isArray(tail)){ const sub=el('ul'); tail.forEach(p=>sub.appendChild(el('li',null,p))); li.appendChild(sub); }
    else if(tail){ const parts=topSplit(tail,(t,i)=>{ const m=t.slice(i).match(/^(,\s+(?=(?:and|và|nhờ|đồng thời|rồi|then|while)\s)|;\s+)/); return m?{keep:m[0].startsWith(';')?1:0,skip:m[0].length}:null; });
      const sub=el('ul'); parts.forEach(p=>sub.appendChild(el('li',null,p))); li.appendChild(sub); }
    ul.appendChild(li);
  });
  return ul;
}

function renderMatrix(items,box){
  const tb=items.find(x=>!isStr(x)); if(!tb) return;
  const m=el('div','matrix');
  tb.rows.slice(1).forEach(r=>{
    const lab=r[0]||[], body=r[1]||[]; const c=el('div','mx'); const l=el('div','mx-l');
    let first=lab[0]||''; const im=first.match(/^\[(\d+)\]\s*(.*)$/);
    l.appendChild(el('span','i',im?im[1].padStart(2,'0'):'·')); l.appendChild(el('b',null,im?im[2]:first));
    lab.slice(1).forEach(x=>l.appendChild(el('small',null,x.replace(/^\(|\)$/g,''))));
    const rr=el('div','mx-r');
    body.forEach(x=>{ const t=x.replace(/^•\s*/,''); const v=isVI(t); const p=el('p'); add(p,el('span','lang',v?'VI':'EN'),el('span',v?'vi-t vi-r':null,t)); rr.appendChild(p); });
    add(c,l,rr); m.appendChild(c);
  });
  box.appendChild(m);
}

function renderAnswers(L,box){
  const g=el('div','ans');
  L.answers.forEach(a=>{
    const c=el('div','an'); c.id=`b${L.n}-a${a.no}`;
    const h=el('div','an-h'); add(h,el('span','no',a.no),el('span','key',a.k),el('span','t',a.t)); c.appendChild(h);
    if(a.stem) c.appendChild(el('div','an-stem',a.stem));
    if(a.trace){ const t=el('div','trace'); add(t,el('span','lbl','Dấu vết truy xuất'),document.createTextNode(a.trace)); c.appendChild(t); }
    if(a.para.length){ const p=el('div','para'); p.appendChild(el('span','lbl','Diễn đạt tương đương · Paraphrase'));
      a.para.forEach(x=>{ const [l,r]=x.split(/\s*<->\s*/); const row=el('div','pr');
        if(r!==undefined) add(row,el('span',null,l),el('i',null,'⇄'),el('span',null,r)); else { row.style.display='block'; row.textContent=x; }
        p.appendChild(row); });
      c.appendChild(p); }
    if(a.expl){ const e=el('div','expl'); add(e,el('span','lbl',a.para.length||a.wrong.length?'Lời giải chi tiết':'Giải thích'),document.createTextNode(a.expl)); c.appendChild(e); }
    if(a.wrong.length){ const w=el('div','wrong'); w.appendChild(el('span','lbl','Phương án sai & bẫy ETS'));
      a.wrong.forEach(o=>{ const r=el('div','wr'); const h=el('div','wr-h'); add(h,el('b',null,'('+o.k+')'),el('span',null,o.t)); r.appendChild(h);
        if(o.why) r.appendChild(el('div',null,o.why)); if(o.trap) r.appendChild(el('span','trap',o.trap)); w.appendChild(r); });
      c.appendChild(w); }
    g.appendChild(c);
  });
  box.appendChild(g);
}

/* every table in 4.1 is one diagram (Vietnamese, then the English translation); the text line before a table is its caption.
   Arrow columns ("-->", "➔", "→") are dropped; a step head is "BƯỚC 1: Title" in one cell line or "BƯỚC 1" / "STEP 1" then the title */
function renderFlow(items,box){
  const keep=c=>c.length && !(c.length===1 && /^\s*(-+>|➔|→|➜|⇒|►|>)\s*$/.test(c[0]));
  let cap='';
  items.forEach(it=>{
    if(isStr(it)){ cap=it; return; }
    const tb=it, heads=tb.rows[0].filter(keep), bodies=(tb.rows[1]||[]).filter(keep);
    if(cap){ const c=el('div','strat-t',cap.replace(/:\s*$/,'')); c.style.cssText='color:var(--muted);margin:14px 0 8px'; box.appendChild(c); cap=''; }
    const f=el('div','flow');
    heads.forEach((hc,i)=>{
      const s=el('div','fstep'); const hm=hc[0].match(/^((?:BƯỚC|STEP)\s*\d+)\s*:?\s*(.*)$/i);
      const title=hm?[hm[2],...hc.slice(1)].filter(Boolean).join(' '):hc.join(' ');
      const h=el('h5'); if(hm){ add(h,el('span',null,hm[1]),document.createTextNode(title)); } else h.textContent=title;
      s.appendChild(h);
      (bodies[i]||[]).forEach(x=>{ x=x.replace(/^•\s*/,''); const m=x.match(/^([^:]{2,40}):\s*(.*)$/); const d=el('div','fkv'+(m&&/Đầu ra|Kết quả|Ket qua|Deliverable|Output/i.test(m[1])?' out':''));
        if(m) add(d,el('b',null,m[1]),el('span',null,m[2])); else d.textContent=x; s.appendChild(d); });
      f.appendChild(s);
    });
    box.appendChild(f);
  });
}

function renderVocab(items,box){
  const strs=items.filter(isStr); const g=el('div','vocab'); let c=null, n=0;
  strs.forEach(s=>{
    if(/^Ngh(?:ĩa|ia):/.test(s)&&c){ c.appendChild(el('div','mean vi-t vi-r',s.replace(/^Ngh(?:ĩa|ia):\s*/,''))); return; }
    if(/^Vd:/.test(s)&&c){ const t=s.replace(/^Vd:\s*/,''); const m=t.match(/^(.*?[.!?"”])\s+-\s+(.*)$/);
      const ex=el('div','ex'); if(m){ add(ex,el('i',null,m[1]),el('span','vi-t vi-r',m[2])); } else ex.appendChild(el('i',null,t)); c.appendChild(ex); return; }
    n++; c=el('div','vc'); const m=s.match(/^(?:(\d+)\.\s*)?(.+?)\s+(\/[^\/]+\/(?:\s*-\s*\/[^\/]+\/)*)\s+(?:(?:<=>|=)\s*)?(.+)$/);
    const h=el('div','vc-h'); add(h,el('span','vn',String(m&&m[1]?m[1]:n).padStart(2,'0')),el('h5',null,m?m[2]:s)); if(m) h.appendChild(el('span','ipa',m[3]));
    c.appendChild(h);
    if(m){ const ch=el('div','chips'); ch.appendChild(el('span','eq','≈')); m[4].split(/\s+\/\s+/).forEach(x=>ch.appendChild(el('span','chip',x))); c.appendChild(ch); }
    g.appendChild(c);
  });
  box.appendChild(g);
}

/* ---------- lesson page ---------- */
function renderLesson(L){
  const root=el('div'); root.style.setProperty('--c',`var(--c${L.n})`);
  const head=el('div','lesson-head'); head.style.setProperty('--c',`var(--c${L.n})`);
  const bn=el('div','big-n'); add(bn,el('small',null,'BÀI THỰC HÀNH'),document.createTextNode(String(L.n).padStart(2,'0')));
  const ht=el('div'); add(ht,el('h2',null,L.vi)); if(L.en) ht.appendChild(el('div','en-t',L.en));
  const src=el('div','src'); add(src,el('b',null,'NGUỒN'),el('span',null,L.src)); ht.appendChild(src);
  add(head,bn,ht); root.appendChild(head);

  const lay=el('div','layout'); const toc=el('nav','toc'); toc.setAttribute('aria-label','Mục lục bài '+L.n);
  const content=el('div','content');
  L.parts.forEach(P=>{
    const a=el('a'); a.href=`#b${L.n}-p${P.n}`; add(a,el('b',null,String(P.n)),el('span',null,shortPart(P))); toc.appendChild(a);
    a.addEventListener('click',e=>{e.preventDefault(); document.getElementById(`b${L.n}-p${P.n}`).scrollIntoView({behavior:'smooth'});});
    const sec=partShell(L,P);
    if(P.n===1){ splitPart1(P.subs).forEach(S=>{
        const sa=el('a','toc-sub',S.id+' '+S.short); sa.href='#'; sa.addEventListener('click',e=>{e.preventDefault(); document.getElementById(`b${L.n}-s${S.id.replace('.','-')}`).scrollIntoView({behavior:'smooth'});}); toc.appendChild(sa);
        const b=subShell(L,S);
        if(S.src==='1.1') render11(L,S.items,b,S.mode); else if(S.src==='1.2') render12(S.items,b); else if(S.src==='1.3') render13(L,S.items,b); else renderPairs(S.items,b,'sum');
        sec.appendChild(b); }); }
    else if(P.n===2) renderMatrix(P.items,sec);
    else if(P.n===3) renderAnswers(L,sec);
    else if(P.n===4){ P.subs.forEach(S=>{ const b=subShell(L,S);
        if(S.id==='4.1') renderFlow(S.items,b);
        else { const t=el('div','ba'); const d=el('div'); S.items.filter(isStr).forEach(s=>{ const r=richLine(s); r&&d.appendChild(r); }); t.style.gridTemplateColumns='minmax(0,1fr)'; t.appendChild(d); b.appendChild(t); }
        sec.appendChild(b); }); }
    else if(P.n===5) renderVocab(P.items,sec);
    content.appendChild(sec);
  });
  add(lay,toc,content); root.appendChild(lay);
  root.appendChild(pager(L.n-1));
  return root;
}
function shortPart(P){ return ({1:'Văn bản & dịch song ngữ',2:'Active Recall 5 giây',3:'Đáp án & dấu vết',4:'Feynman & quy trình BA',5:'Từ vựng & Paraphrase'})[P.n]||P.title; }
/* page order for PHẦN 1: 1.1 Đề gốc, 1.2 Câu hỏi gốc (both from the doc's 1.1), 1.3 Chiến thuật (the doc's own
   "Hướng dẫn làm bài Part 7" sub-section, or the "Bước" lines inside the doc's 1.1 in older docs), then translation,
   question translation and summary — matched by title so both doc layouts number the same */
function splitPart1(subs){
  const kind=S=>/Hướng dẫn làm bài|Strategy Guide/i.test(S.title)&&S.id!=='1.1'?'guide':/Từng Câu|Sentence/i.test(S.title)?'1.2':/Câu hỏi|Question/i.test(S.title)?'1.3':/Tóm tắt|Summary/i.test(S.title)?'1.4':S.id==='1.1'?'1.1':'1.4';
  const short={'1.2':'Dịch từng câu','1.3':'Dịch câu hỏi','1.4':'Tóm tắt'};
  const s11=subs.find(S=>kind(S)==='1.1'), guide=subs.find(S=>kind(S)==='guide'), out=[];
  if(s11){
    out.push({...s11,src:'1.1',mode:'pass',short:'Đề gốc',title:'Đề thi Tiếng Anh gốc (Original ETS Passages)'});
    out.push({...s11,src:'1.1',mode:'quiz',short:'Câu hỏi gốc',title:'Câu hỏi Tiếng Anh gốc (Original ETS Questions)'});
  }
  if(guide) out.push({...guide,src:'1.1',mode:'guide',short:'Chiến thuật',title:'Hướng dẫn làm bài Part 7 (Strategy Guide)'});
  else if(s11) out.push({...s11,src:'1.1',mode:'strat',short:'Chiến thuật',title:'Hướng dẫn làm bài Part 7 (Strategy Guide)'});
  subs.forEach(S=>{ const k=kind(S); if(k!=='1.1'&&k!=='guide') out.push({...S,src:k,short:short[k]}); });
  out.forEach((S,i)=>S.id='1.'+(i+1));
  return out;
}

function renderParaphrase(){
  const root=el('div'); root.style.setProperty('--c','var(--red)');
  const head=el('div','lesson-head'); head.style.setProperty('--c','var(--c1)');
  const bn=el('div','big-n'); add(bn,el('small',null,'TỔNG HỢP'),document.createTextNode(String(NFIN)));
  const ht=el('div'); add(ht,el('h2',null,finalTitle.replace(/^BẢNG TỔNG HỢP 50 CẶP TỪ /,'').replace(/^(PHẦN TỔNG KẾT|PHAN TONG KET)\s*:\s*/i,'') || finalTitle));
  ht.appendChild(el('div','en-t',`Bảng tổng hợp ${FINLABEL.replace(/^\d+ /,NFIN+' ')} · Nạp Anki`));
  add(head,bn,ht); root.appendChild(head);
  const sec=el('section','part'); sec.style.marginTop='28px';
  const tools=el('div','pp-tools'); const inp=el('input'); inp.type='search'; inp.id='pp-search'; inp.placeholder='Tìm cụm từ, paraphrase hoặc nghĩa…'; inp.setAttribute('aria-label','Tìm trong '+FINLABEL);
  const cnt=el('span','score'); add(tools,inp,cnt); sec.appendChild(tools);
  const w=el('div','tbl-w'); const t=el('table'); const th=el('thead'); const tr=el('tr');
  const hdr=finalTable?finalTable.rows[0].map(c=>c.join(' ')):[]; hdr.forEach(x=>tr.appendChild(el('th',null,x))); th.appendChild(tr); t.appendChild(th);
  const tb=el('tbody'); const rows=[];
  (finalTable?finalTable.rows.slice(1):[]).forEach(r=>{ const row=el('tr'); ['n','t','p','m'].forEach((k,i)=>row.appendChild(el('td',k,(r[i]||[]).join(' ')))); tb.appendChild(row); rows.push([row,row.textContent.toLowerCase()]); });
  t.appendChild(tb); w.appendChild(t); sec.appendChild(w);
  const f=()=>{ const q=inp.value.trim().toLowerCase(); let k=0; rows.forEach(([r,tx])=>{ const show=!q||tx.includes(q); r.hidden=!show; if(show)k++; }); cnt.textContent=`${k}/${rows.length} cặp từ`; };
  inp.addEventListener('input',f); f();
  root.appendChild(sec); root.appendChild(pager(TABS.length-1));
  return root;
}

function pager(i){
  const p=el('div','pager');
  if(i>0){ const b=el('button','prev'); b.type='button'; add(b,el('small',null,'← Trước'),el('b',null,`${TABS[i-1].n} · ${TABS[i-1].label}`)); b.onclick=()=>show(TABS[i-1].id,true); p.appendChild(b); }
  if(i<TABS.length-1){ const b=el('button','next'); b.type='button'; add(b,el('small',null,'Tiếp →'),el('b',null,`${TABS[i+1].n} · ${TABS[i+1].label}`)); b.onclick=()=>show(TABS[i+1].id,true); p.appendChild(b); }
  return p;
}

/* ---------- hero, tabs ---------- */
const hero=document.getElementById('hero');
(function(){
  const left=el('div');
  const t0=intro[0]||''; const m=t0.match(/^(.*?):\s*(.*)$/);
  const eb=el('div','eyebrow'); add(eb,el('b',null,m?m[1]:t0),el('span',null,'· ETS TOEIC Part 7'));
  const h1=el('h1'); if(m){ const parts=m[2].split(' & '); h1.appendChild(document.createTextNode(parts[0])); if(parts[1]){ h1.appendChild(document.createElement('br')); h1.appendChild(el('span',null,'& '+parts[1])); } } else h1.textContent=t0;
  // intro[2] (source/method note) is intentionally not shown
  add(left,eb,h1,el('div','en-sub',intro[1]||''));
  const nq=lessons.reduce((a,L)=>a+L.answers.length,0), nv=lessons.reduce((a,L)=>a+(L.parts.find(p=>p.n===5)?.items.filter(s=>isStr(s)&&/^Ngh(?:ĩa|ia):/.test(s)).length||0),0);
  const st=el('div','stats');
  [[lessons.length,'bài thực hành'],[nq,'câu hỏi ETS gốc'],[nv,'thẻ từ vựng'],[NFIN,FINLABEL.replace(/^\d+ /,'')]].forEach(([v,l])=>{ const s=el('div','stat'); add(s,el('b',null,String(v)),el('span',null,l)); st.appendChild(s); });
  left.appendChild(st);
  const yard=el('div','yard'); yard.setAttribute('aria-label','Chọn nhanh bài học');
  lessons.forEach(L=>{ const b=el('button','box'); b.type='button'; b.style.setProperty('--c',`var(--c${L.n})`); b.dataset.id='bai'+L.n; b.title=SHORT[L.n-1];
    add(b,el('span','code',SHORT[L.n-1]||'BÀI'),el('span','n',String(L.n).padStart(2,'0')),el('span','qr',L.qr)); b.onclick=()=>show('bai'+L.n,true); yard.appendChild(b); });
  add(hero,left,yard);
})();

const tabsEl=document.getElementById('tabs'), main=document.getElementById('main');
const panels={}, tabBtns={};
TABS.forEach((T,i)=>{
  const b=el('button','tab'); b.type='button'; b.setAttribute('role','tab'); b.id='tab-'+T.id; b.setAttribute('aria-controls','panel-'+T.id); b.style.setProperty('--c',T.c);
  const tl=el('span','tl'); add(tl,el('b',null,T.label),el('small',null,T.sub));
  add(b,el('span','door',T.n),tl); b.onclick=()=>show(T.id,false);
  b.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ e.preventDefault(); const j=(i+(e.key==='ArrowRight'?1:-1)+TABS.length)%TABS.length; show(TABS[j].id,false); tabBtns[TABS[j].id].focus(); }});
  tabsEl.appendChild(b); tabBtns[T.id]=b;
  const p=el('section'); p.id='panel-'+T.id; p.setAttribute('role','tabpanel'); p.setAttribute('aria-labelledby','tab-'+T.id); p.hidden=true; main.appendChild(p); panels[T.id]=p;
});

function show(id,scroll){
  if(!panels[id]) id=TABS[0].id;
  const p=panels[id];
  if(!p.firstChild){ if(id==='paraphrase') p.appendChild(renderParaphrase()); else p.appendChild(renderLesson(lessons[+id.replace('bai','')-1])); }
  Object.entries(panels).forEach(([k,v])=>{ v.hidden=k!==id; tabBtns[k].setAttribute('aria-selected',String(k===id)); tabBtns[k].tabIndex=k===id?0:-1; });
  document.querySelectorAll('.box').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  tabBtns[id].scrollIntoView({block:'nearest',inline:'center'});
  try{ history.replaceState(null,'','#'+id); }catch(e){}
  try{ localStorage.setItem('lg-tab',id); }catch(e){}
  if(scroll!==null){ const bar=document.querySelector('.bar'); const y=main.getBoundingClientRect().top+window.scrollY-bar.offsetHeight-8; if(window.scrollY>y||scroll) window.scrollTo({top:y,behavior:'smooth'}); }
}

/* ---------- translation mode ---------- */
const mb=document.getElementById('m-both'), mr=document.getElementById('m-recall');
function setMode(r){ document.body.classList.toggle('recall',r); mb.setAttribute('aria-pressed',String(!r)); mr.setAttribute('aria-pressed',String(r)); try{localStorage.setItem('lg-mode',r?'1':'0');}catch(e){} if(!r) document.querySelectorAll('.peek').forEach(x=>x.classList.remove('peek')); }
mb.onclick=()=>setMode(false); mr.onclick=()=>setMode(true);
main.addEventListener('click',e=>{ if(!document.body.classList.contains('recall')) return; const v=e.target.closest('.vi-r'); if(v) v.classList.toggle('peek'); });
try{ if(localStorage.getItem('lg-mode')==='1') setMode(true); }catch(e){}

document.getElementById('foot').textContent='Nguồn: ChuyenDe_TOEIC_Logistics_ChuoiCungUng.docx';

let start=(location.hash||'').slice(1);
if(!panels[start]){ try{ start=localStorage.getItem('lg-tab')||''; }catch(e){ start=''; } }
show(panels[start]?start:TABS[0].id,null);
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(panels[h]) show(h,true); });
})();
</script>
