ated Cash Flows), Bản Thuyết minh Chi tiêu Vốn Đầu tư CAPEX \u0026 Nghị quyết Tăng Cổ tức của Hội đồng Quản trị (Board Dividend Resolution) (Questions 186-190 - Triple Passage)","Nguồn: ETS TOEIC Part 7 — Triple Passage (Statement of Cash Flows Excerpt, CAPEX Authorization Memo \u0026 Board Dividend Resolution)","PHẦN 1: NỘI DUNG BÀI ĐỌC, CÂU HỎI \u0026 BẢN DỊCH SONG NGỮ","1.1. Đề thi Tiếng Anh gốc (Strategy Guide \u0026 Original ETS Passages)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","Questions 186-190 refer to the following cash flow statement, capital allocation memo, and board resolution.","[Passage 1: Financial Statement Excerpt — OmniLogix International Inc.]","OMNILOGIX INTERNATIONAL INC.","Consolidated Statement of Cash Flows (Selected Highlights)","Fiscal Year Ended September 30 (Amounts in millions of USD)","Cash Flows from Operating Activities:","• Consolidated Net Income: $65.0","• Adjustments: Depreciation \u0026 Amortization: $48.0","• Stock-Based Compensation Expense: $6.5","• Changes in Operating Assets and Working Capital: +$3.0","Net Cash Generated from Operating Activities: $122.5","Cash Flows from Investing Activities:","• Capital Expenditures (CAPEX) — Warehouse Robotics \u0026 Automated Sorting: -$85.0","• Strategic Acquisition of Autonomous Logistics Patents: -$12.0","Net Cash Used in Investing Activities: -$97.0","Cash Flows from Financing Activities:","• Proceeds from Short-Term Revolving Bank Credit: +$30.0","• Principal Repayment of Senior Unsecured Notes: -$25.0","• Cash Dividends Paid on Common Stock ($0.40 per share on 50M shares): -$20.0","Net Cash Used in Financing Activities: -$15.0","Net Increase in Cash and Cash Equivalents: $10.5","Ending Cash and Restricted Cash Balance: $45.2","Free Cash Flow (FCF = Operating Cash Flow minus CAPEX): $37.5","[Passage 2: Capital Allocation \u0026 CAPEX Justification Memo — Corporate Treasury]","INTERNAL MEMORANDUM — CONFIDENTIAL","To: Board of Directors, OmniLogix International Inc.","From: Brenda Thorne, Chief Financial Officer","Date: October 24 | Subject: Fiscal 2026 Capital Allocation Strategy \u0026 CAPEX Proposal","As demonstrated in our FY 2025 financial statements, OmniLogix generated exceptional operating cash flows of $122.5 million, enabling us to self-fund our $85.0 million robotics modernization initiative while returning $20.0 million to shareholders in dividends and generating $37.5 million in Free Cash Flow.","For fiscal 2026, treasury recommends expanding our capital expenditure budget to $95.0 million to execute Phase 2 of our automated distribution hubs in Rotterdam and Antwerp. Financial modeling indicates this investment yields an Internal Rate of Return (IRR) of 21.4% with an attractive capital payback period of 3.8 years.","Given our disciplined balance sheet and modest net leverage, we propose that the Board concurrently reward equity investors by raising our quarterly dividend from $0.40 to $0.45 per share (an annualized rate of $1.80 per share). Our stress tests confirm that projected FY 2026 operating cash flow of $135.0 million provides ample headroom to support both the expanded $95.0 million CAPEX program and the $22.5 million dividend burden without requiring incremental debt issuance.","[Passage 3: Formal Resolution of the Board of Directors — OmniLogix International]","OMNILOGIX INTERNATIONAL INC. — RESOLUTIONS OF THE BOARD OF DIRECTORS","Meeting Convened: November 8 at Corporate Headquarters, Chicago, IL","Upon review of the CFO\u0027s Capital Allocation Memorandum, the Board of Directors unanimously adopted the following binding corporate resolutions:","Resolution 1 (Approval of Fiscal 2026 Capital Budget):","RESOLVED, that an aggregate capital expenditure budget of up to $95.0 million is hereby approved for fiscal year 2026 to construct automated fulfillment infrastructure in Rotterdam and Antwerp.","Resolution 2 (Declaration of Increased Quarterly Cash Dividend):","RESOLVED, that the regular quarterly dividend on common stock is hereby increased by 12.5%, from $0.40 to $0.45 per share. The dividend shall be payable on December 20 to stockholders of record at the close of business on December 1. Total cash disbursement shall equal $22,500,000.00 based on 50,000,000 common shares currently outstanding.","Resolution 3 (Liquidity Covenant Oversight):","RESOLVED, that corporate management shall maintain minimum cash reserves of not less than $35.0 million at all times and ensure that the consolidated net debt-to-capitalization ratio does not exceed 40%.","By Order of the Board,","Jonathan Sterling, Corporate Secretary","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","186. How much net cash was generated from operating activities during the fiscal year?","(A) $37.5 million","(B) $65.0 million","(C) $85.0 million","(D) $122.5 million","187. What accounted for the largest use of cash in investing activities?","(A) Repaying maturing bank loans and credit facilities","(B) Capital expenditures on automated robotics and warehouse sorting","(C) Purchasing patents from an insolvent rival logistics carrier","(D) Distributing regular quarterly dividends to preferred stockholders","188. By what percentage did the Board of Directors increase the quarterly dividend?","(A) 5.0%","(B) 8.5%","(C) 12.5%","(D) 21.4%","189. Under Resolution 2, what total amount of cash will OmniLogix distribute in dividends on December 20?","(A) $10.5 million","(B) $20.0 million","(C) $22.5 million","(D) $95.0 million","190. In Passage 2, paragraph 2, the term \u0027payback period\u0027 refers to the time required to","(A) renegotiate long-term interest rates with lending institutions","(B) recover the original cash investment through project cash flows","(C) distribute all retained earnings to common shareholders","(D) train automated robotics technicians at overseas warehouses","1.2. Hướng dẫn làm bài Part 7","CHIẾN THUẬT 5 PHÚT TỐI ƯU: NẮM BẮT BỐI CẢNH, GHÉP NỐI DỮ KIỆN \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Luồng sự việc (Quỹ đạo Quét chữ Z \u0026 3 Câu hỏi Tiềm thức): • Văn bản 1 (Báo cáo Lưu chuyển Tiền tệ): Dòng tiền kinh doanh $122.5M; Chi tiêu CAPEX tự động hóa -$85M; Trả cổ tức -$20M ($0.40/cổ phiếu trên 50M cổ phiếu); Dòng tiền tự do FCF đạt $37.5M.","• Văn bản 2 (Bản Thuyết minh của CFO Brenda Thorne): Đề xuất tăng ngân sách CAPEX năm 2026 lên $95M cho kho Rotterdam/Antwerp (IRR 21.4%, hoàn vốn 3.8 năm); kiến nghị tăng cổ tức từ $0.40 lên $0.45/cổ phiếu vì dòng tiền tự tạo dồi dào.","• Văn bản 3 (Nghị quyết Hội đồng Quản trị): HĐQT phê chuẩn ngân sách CAPEX $95M; tăng cổ tức 12.5% lên $0.45/cổ phiếu (tổng chi $22.5M ngày 20/12 trên 50M cổ phiếu); giữ tiền mặt tối thiểu $35M.","=\u003e Luồng sự việc: Báo cáo dòng tiền dồi dào -\u003e CFO đề xuất vừa tăng đầu tư robot vừa tăng cổ tức -\u003e HĐQT ban hành nghị quyết phê chuẩn ngân sách CAPEX và chốt ngày chi trả cổ tức mới.","Bước 2 (20 giây) - Quét nhanh 5 câu hỏi \u0026 Gắn móc từ khóa: • Câu 186: Dòng tiền thuần từ hoạt động kinh doanh (Từ khóa: net cash generated from operating activities).","• Câu 187: Khoản mục dùng nhiều tiền nhất trong hoạt động đầu tư (Từ khóa: largest use of cash, investing activities).","• Câu 188: Tỷ lệ % HĐQT tăng cổ tức (Từ khóa: percentage, Board increase quarterly dividend).","• Câu 189: Tổng số tiền cổ tức chi trả ngày 20/12 (Từ khóa: total amount distribute dividends, December 20).","• Câu 190: Khái niệm \u0027payback period\u0027 chỉ điều gì (Từ khóa: payback period refers to time required to).","Bước 3 (3 phút 45 giây) - Giải cuốn chiếu \u0026 Khóa đáp án: • Câu 186 (Chi tiết - Bảng VB1): Dòng \u0027Net Cash Generated from Operating Activities: $122.5\u0027 -\u003e Chọn (D) 122.5 triệu USD.","• Câu 187 (Chi tiết - VB1): Mục Investing gồm CAPEX -$85.0M và mua bằng sáng chế -$12.0M -\u003e Khoản lớn nhất là CAPEX robot kho tự động -$85.0M -\u003e Chọn (B).","• Câu 188 (Chi tiết - VB3 Nghị quyết 2): \u0027increased by 12.5%, from $0.40 to $0.45 per share\u0027 (Cũng tính được: (0.45 - 0.40) / 0.40 = 12.5%) -\u003e Chọn (C).","• Câu 189 (Ghép nối - VB2 \u0026 VB3): 50 triệu cổ phiếu x $0.45 = $22.5 triệu USD (VB3 ghi rõ: \u0027Total cash disbursement shall equal $22,500,000.00\u0027) -\u003e Chọn (C).","• Câu 190 (Từ vựng chuyên ngành tài chính): \u0027payback period\u0027 = thời gian hoàn vốn (thời gian cần thiết để dòng tiền từ dự án thu hồi lại vốn đầu tư ban đầu) -\u003e Chọn (B) recover original cash investment.","Bước 4 (25 giây) - Rà soát \u0026 Đúc kết Feynman: Tự đúc kết 1 câu: Nhờ dòng tiền kinh doanh làm ra hơn 122 triệu USD, công ty vừa tự tin rót 95 triệu USD mua robot kho tự động thu hồi vốn sau 3.8 năm, vừa nâng cổ tức thêm 12.5% chia trọn 22.5 triệu USD cho cổ đông mà không cần vay nợ.","1.3. Dịch Song ngữ Xen kẽ Từng Câu (Sentence-by-Sentence Translation)","[Văn bản 1: Báo cáo Lưu chuyển Tiền tệ Hợp nhất — Tập đoàn OmniLogix]","OMNILOGIX INTERNATIONAL INC.","Consolidated Statement of Cash Flows (Selected Highlights)","Fiscal Year Ended September 30 (Amounts in millions of USD)","TẬP ĐOÀN QUỐC TẾ OMNILOGIX","Báo cáo Lưu chuyển Tiền tệ Hợp nhất (Dữ liệu Nổi bật Chọn lọc)","Niên độ Tài chính Kết thúc Ngày 30 Tháng 9 (Số liệu tính theo triệu USD)","Net Cash Generated from Operating Activities: $122.5 million (Net Income: $65.0M + Depreciation \u0026 Amortization: $48.0M + Stock Compensation: $6.5M + Working Capital: $3.0M).","Dòng tiền Thuần Tạo ra từ Hoạt động Kinh doanh: 122,5 triệu USD (Lợi nhuận Ròng: 65,0M + Khấu hao Tài sản: 48,0M + Thù lao Cổ phiếu: 6,5M + Thay đổi Vốn lưu động: 3,0M).","Cash Flows from Investing Activities: Capital Expenditures (CAPEX) — Warehouse Robotics: -$85.0M | Patent Acquisitions: -$12.0M | Net Cash Used in Investing: -$97.0M.","Dòng tiền từ Hoạt động Đầu tư: Chi tiêu Vốn Đầu tư (CAPEX) — Robot Kho bãi: -85,0 triệu USD | Mua lại Bằng sáng chế: -12,0 triệu USD | Dòng tiền Thuần Sử dụng trong Hoạt động Đầu tư: -97,0 triệu USD.","Cash Flows from Financing Activities: Bank Credit Proceeds: +$30.0M | Senior Notes Repayment: -$25.0M | Cash Dividends Paid ($0.40/share on 50M shares): -$20.0M | Net Cash from Financing: -$15.0M.","Dòng tiền từ Hoạt động Tài chính: Thu từ Vay Tín dụng Ngân hàng: +30,0M | Hoàn trả Gốc Trái phiếu Ưu tiên: -25,0M | Trả Cổ tức Tiền mặt (0,40 USD/cổ phiếu trên 50 triệu cổ phiếu): -20,0M | Dòng tiền Thuần Hoạt động Tài chính: -15,0 triệu USD.","Net Increase in Cash and Cash Equivalents: $10.5M | Ending Cash Balance: $45.2M | Free Cash Flow (FCF = Operating Cash Flow minus CAPEX): $37.5M.","Mức Tăng Thuần Tiền và Tương đương Tiền: 10,5 triệu USD | Số dư Tiền cuối kỳ: 45,2 triệu USD | Dòng Tiền Tự Do (FCF = Dòng tiền Kinh doanh trừ CAPEX): 37,5 triệu USD.","[Văn bản 2: Bản Thuyết minh Chiến lược Phân bổ Vốn \u0026 CAPEX — Ban Ngân quỹ]","INTERNAL MEMORANDUM — CONFIDENTIAL","To: Board of Directors, OmniLogix International Inc.","From: Brenda Thorne, Chief Financial Officer","Date: October 24 | Subject: Fiscal 2026 Capital Allocation Strategy \u0026 CAPEX Proposal","BẢN GHI NHỚ NỘI BỘ — BẢO MẬT","Kính gửi: Hội đồng Quản trị, Tập đoàn Quốc tế OmniLogix","Người gửi: Brenda Thorne, Giám đốc Tài chính","Ngày: 24 Tháng 10 | Tiêu đề: Chiến lược Phân bổ Vốn \u0026 Đề xuất CAPEX Năm Tài chính 2026","OmniLogix generated exceptional operating cash flows of $122.5 million, enabling us to self-fund our $85.0 million robotics modernization initiative while returning $20.0 million in dividends and generating $37.5 million in Free Cash Flow.","OmniLogix đã tạo ra dòng tiền kinh doanh xuất sắc đạt 122,5 triệu USD, cho phép chúng tôi tự tài trợ chương trình hiện đại hóa robot 85,0 triệu USD đồng thời chi trả 20,0 triệu USD cổ tức và tạo ra 37,5 triệu USD Dòng Tiền Tự Do.","For fiscal 2026, treasury recommends expanding our capital expenditure budget to $95.0 million to execute Phase 2 of automated distribution hubs in Rotterdam and Antwerp.","Đối với năm tài chính 2026, ban ngân quỹ đề xuất mở rộng ngân sách chi tiêu vốn đầu tư lên 95,0 triệu USD để triển khai Giai đoạn 2 các trung tâm phân phối tự động tại Rotterdam và Antwerp.","Financial modeling indicates this investment yields an Internal Rate of Return (IRR) of 21.4% with an attractive capital payback period of 3.8 years.","Mô hình tài chính chỉ ra rằng khoản đầu tư này mang lại Tỷ suất Sinh lời Nội bộ (IRR) là 21,4% với thời gian hoàn vốn đầu tư hấp dẫn là 3,8 năm.","We propose raising our quarterly dividend from $0.40 to $0.45 per share, as projected FY 2026 operating cash flow of $135.0 million provides ample headroom without incremental debt.","Chúng tôi đề xuất tăng cổ tức hàng quý từ 0,40 USD lên 0,45 USD mỗi cổ phần, vì dòng tiền hoạt động dự phóng năm 2026 là 135,0 triệu USD tạo ra dư địa dồi dào mà không cần vay thêm nợ mới.","[Văn bản 3: Nghị quyết Chính thức của Hội đồng Quản trị — Tập đoàn OmniLogix]","OMNILOGIX INTERNATIONAL INC. — RESOLUTIONS OF THE BOARD OF DIRECTORS","Meeting Convened: November 8 at Corporate Headquarters, Chicago, IL","TẬP ĐOÀN QUỐC TẾ OMNILOGIX — NGHỊ QUYẾT CỦA HỘI ĐỒNG QUẢN TRỊ","Kỳ họp Triệu tập: Ngày 8 Tháng 11 tại Trụ sở Doanh nghiệp, Chicago, IL","Resolution 1: RESOLVED, that an aggregate capital expenditure budget of up to $95.0 million is hereby approved for fiscal year 2026 to construct automated fulfillment infrastructure.","Nghị quyết 1: QUYẾT NGHỊ, phê chuẩn tổng ngân sách chi tiêu vốn đầu tư lên tới 95,0 triệu USD cho năm tài chính 2026 để xây dựng hạ tầng xử lý đơn hàng tự động.","Resolution 2: RESOLVED, that the regular quarterly dividend on common stock is hereby increased by 12.5%, from $0.40 to $0.45 per share, payable on December 20 to stockholders of record on December 1, totaling $22,500,000.00.","Nghị quyết 2: QUYẾT NGHỊ, cổ tức tiền mặt định kỳ hàng quý trên cổ phần phổ thông chính thức tăng thêm 12,5%, từ 0,40 USD lên 0,45 USD/cổ phiếu, chi trả vào ngày 20 Tháng 12 cho cổ đông chốt danh sách ngày 1 Tháng 12, với tổng số tiền chi trả là 22.500.000,00 USD.","Resolution 3: RESOLVED, that corporate management shall maintain minimum cash reserves of not less than $35.0 million at all times and ensure net debt-to-capitalization does not exceed 40%.","Nghị quyết 3: QUYẾT NGHỊ, ban điều hành doanh nghiệp phải duy trì dự trữ tiền mặt tối thiểu không dưới 35,0 triệu USD tại mọi thời điểm và bảo đảm tỷ lệ nợ ròng trên tổng vốn không vượt quá 40%.","1.4. Dịch chi tiết Câu hỏi \u0026 Phương án Trắc nghiệm","Câu 186. Bao nhiêu tiền mặt thuần đã được tạo ra từ hoạt động kinh doanh trong năm tài chính vừa qua?","(A) 37,5 triệu USD","(B) 65,0 triệu USD","(C) 85,0 triệu USD","(D) 122,5 triệu USD","Câu 187. Khoản mục nào chiếm tỷ trọng sử dụng tiền mặt lớn nhất trong hoạt động đầu tư?","(A) Hoàn trả các khoản vay ngân hàng và hạn mức tín dụng sắp đáo hạn","(B) Chi tiêu vốn đầu tư vào robot tự động hóa và trung tâm phân loại kho","(C) Mua lại các bằng sáng chế từ một hãng vận tải logistics đối thủ phá sản","(D) Phân phối cổ tức định kỳ hàng quý cho các cổ đông sở hữu cổ phiếu ưu đãi","Câu 188. Hội đồng Quản trị đã tăng mức chi trả cổ tức hàng quý thêm bao nhiêu phần trăm?","(A) 5,0%","(B) 8,5%","(C) 12,5%","(D) 21,4%","Câu 189. Theo Nghị quyết 2, tổng số tiền mặt mà OmniLogix sẽ phân phối chi trả cổ tức vào ngày 20 tháng 12 là bao nhiêu?","(A) 10,5 triệu USD","(B) 20,0 triệu USD","(C) 22,5 triệu USD","(D) 95,0 triệu USD","Câu 190. Trong Văn bản 2, đoạn 2, thuật ngữ \u0027payback period\u0027 đề cập đến khoảng thời gian cần thiết để làm gì?","(A) Tái thương lượng lãi suất nợ vay dài hạn với các tổ chức tín dụng cho vay","(B) Thu hồi lại số vốn đầu tư tiền mặt ban đầu thông qua các dòng tiền của dự án","(C) Phân phối toàn bộ lợi nhuận giữ lại cho các cổ đông phổ thông","(D) Đào tạo đội ngũ kỹ thuật viên vận hành robot tự động tại các nhà kho ở nước ngoài","1.5. Tóm tắt Viết lại Toàn bài theo Feynman (Feynman Monograph Summary)","English Executive Summary:","• Robust Operating Cash Engine: OmniLogix generated $122.5M in net operating cash flow during FY 2025, enabling the company to fund $85.0M in automation CAPEX, pay $20.0M in shareholder dividends, and maintain $37.5M in positive Free Cash Flow with $45.2M in ending cash.","• Treasury CAPEX \u0026 Return Recommendation: CFO Brenda Thorne proposed expanding the fiscal 2026 capital budget to $95.0M for European fulfillment hubs in Rotterdam and Antwerp (21.4% IRR, 3.8-year payback) while raising quarterly dividends from $0.40 to $0.45 per share.","• Board Dividend Hike \u0026 Governance Oversight: On November 8, the Board formally authorized the $95.0M CAPEX budget, approved a 12.5% dividend increase to $0.45 per share ($22.5M total distribution on 50M shares payable December 20), and enacted strict liquidity controls requiring a $35.0M minimum cash cushion.","Bản tóm tắt Tiếng Việt cốt lõi:","• Cỗ Máy Tạo Tiền Kinh Doanh Vững Chắc: Trong năm tài chính 2025, OmniLogix làm ra 122,5 triệu USD dòng tiền thuần từ hoạt động kinh doanh, đủ tự tài trợ 85,0 triệu USD CAPEX đầu tư robot, chia 20,0 triệu USD cổ tức và giữ lại 37,5 triệu USD dòng tiền tự do FCF.","• Đề Xuất Đầu Tư Robot \u0026 Nâng Cổ Tức của CFO: Giám đốc Tài chính Brenda Thorne đề xuất tăng ngân sách CAPEX năm 2026 lên 95,0 triệu USD cho trung tâm kho vận tại Rotterdam và Antwerp (tỷ suất IRR 21,4%, hoàn vốn 3,8 năm) đồng thời nâng cổ tức từ 0,40 USD lên 0,45 USD/cổ phiếu.","• Nghị Quyết HĐQT Tăng Cổ Tức \u0026 An Toàn Vốn: Ngày 08/11, HĐQT chính thức thông qua gói CAPEX 95 triệu USD, phê chuẩn tăng cổ tức 12,5% lên 0,45 USD/cổ phiếu (tổng chi 22,5 triệu USD vào ngày 20/12 cho 50 triệu cổ phiếu) và ban hành quy định duy trì quỹ dự phòng tiền mặt tối thiểu 35 triệu USD.","PHẦN 2: ACTIVE RECALL 5 GIÂY (BẢNG MA TRẬN ĐỊNH VỊ SONG NGỮ)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["1. Đối tượng \u0026 Vai trò: OmniLogix International (Tập đoàn kho bãi tự động công bố báo cáo dòng tiền) \u003c-\u003e Brenda Thorne (CFO thuyết minh chiến lược phân bổ vốn CAPEX và cổ tức) \u003c-\u003e Hội đồng Quản trị (Ban hành nghị quyết nâng cổ tức 12.5% và chốt ngân sách 95M USD).","1. Stakeholders \u0026 Roles: OmniLogix International (Automated logistics group publishing cash flows) \u003c-\u003e Brenda Thorne (CFO justifying CAPEX allocation and dividend hikes) \u003c-\u003e Board of Directors (Enacting resolutions raising dividends by 12.5% and setting $95M CAPEX ceiling)."]],[["2. Boi canh \u0026 Quy trinh loi"],["2. Bối cảnh \u0026 Quy trình lõi: Phân bổ Nguồn vốn Doanh nghiệp \u0026 Dòng tiền Tự do (Corporate Capital Allocation \u0026 Free Cash Flow): Dòng tiền kinh doanh vượt trội ($122.5M) tài trợ trọn vẹn cả chi tiêu tài sản cố định CAPEX ($85M) và cổ tức tiền mặt ($20M) -\u003e HĐQT phê duyệt tái đầu tư mở rộng và gia tăng giá trị cho cổ đông.","2. Business Context \u0026 Core Flow: Capital Allocation \u0026 Free Cash Flow Deployment: Robust operating cash flows ($122.5M) fully absorb both tangible CAPEX ($85M) and equity dividend payouts ($20M) -\u003e Board ratifies expanded growth investments alongside increased cash distributions."]],[["3. Dau vet suy luan cheo"],["3. Dấu vết suy luận chéo: Cổ tức cũ là $0.40/cổ phiếu ($20M trên 50M cổ phiếu ở VB1) -\u003e CFO đề xuất tăng lên $0.45 ở VB2 -\u003e VB3 xác nhận tăng 12.5% và tính ra tổng tiền phân phối là $22,500,000.00 vào ngày 20/12.","3. Key Cross-Referencing Clues: Prior dividend of $0.40/share ($20M on 50M shares in Passage 1) -\u003e CFO proposes $0.45 in Passage 2 -\u003e Passage 3 confirms 12.5% hike, yielding total disbursement of $22,500,000.00 on December 20."]]],"t":"table"},"PHẦN 3: ĐÁP ÁN CHUẨN XÁC \u0026 DẤU VẾT TRUY XUẤT CHÉO (CROSS-REFERENCING \u0026 TRAP BREAKDOWN)","186. How much net cash was generated from operating activities during the fiscal year?","Dap an dung: (D) $122.5 million","[Dau vet bai doc / Clue]: Văn bản 1, Dòng kết thúc phần Hoạt động Kinh doanh: \u0027Net Cash Generated from Operating Activities: $122.5 [million]\u0027.","[Dien dat tuong duong / Paraphrase]: • Tra cứu trực tiếp Báo cáo Dòng tiền: \u0027Net Cash Generated from Operating Activities\u0027 = $122.5M.","[Loi giai chi tiet]: Báo cáo lưu chuyển tiền tệ hợp nhất chỉ rõ dòng tiền thuần tạo ra từ hoạt động kinh doanh (Operating Cash Flow) của OmniLogix là 122,5 triệu USD.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) $37.5 million","- Ly do sai: 37.5 triệu USD là Dòng Tiền Tự Do (Free Cash Flow = $122.5M - $85.0M CAPEX), không phải tổng dòng tiền kinh doanh.","- Bay ETS: Bẫy Nhầm lẫn Dòng Tiền Tự Do (Free Cash Flow Trap)","(B) $65.0 million","- Ly do sai: 65.0 triệu USD là Lợi nhuận Ròng Kế toán (Net Income), chưa cộng khấu hao và điều chỉnh vốn lưu động.","- Bay ETS: Bẫy Lợi nhuận Kế toán vs. Dòng tiền (Net Income vs. Cash Flow Trap)","(C) $85.0 million","- Ly do sai: 85.0 triệu USD là số tiền chi tiêu mua sắm robot kho bãi (CAPEX) trong hoạt động đầu tư.","- Bay ETS: Bẫy Chi tiêu Vốn Đầu tư (CAPEX Confusion Trap)","187. What accounted for the largest use of cash in investing activities?","Dap an dung: (B) Capital expenditures on automated robotics and warehouse sorting","[Dau vet bai doc / Clue]: Văn bản 1, Mục Investing Activities: \u0027Capital Expenditures (CAPEX) — Warehouse Robotics \u0026 Automated Sorting: -$85.0 [million]\u0027 so với Patent Acquisitions: -$12.0M.","[Dien dat tuong duong / Paraphrase]: • \u0027-$85.0M on Warehouse Robotics \u0026 Automated Sorting\u0027 chiếm đại đa số trong tổng -$97.0M đầu tư \u003c-\u003e \u0027Capital expenditures on automated robotics and warehouse sorting\u0027","[Loi giai chi tiet]: Trong hoạt động đầu tư, chi tiêu vốn CAPEX vào hệ thống robot kho bãi và dây chuyền phân loại tự động chiếm tới 85 triệu USD trên tổng số 97 triệu USD tiền chi đầu tư.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Repaying maturing bank loans and credit facilities","- Ly do sai: Hoàn trả nợ vay trái phiếu (-$25M) thuộc Hoạt động Tài chính (Financing Activities), không thuộc hoạt động đầu tư.","- Bay ETS: Bẫy Nhầm lẫn Phân loại Hoạt động Dòng tiền (Financing vs. Investing Trap)","(C) Purchasing patents from an insolvent rival logistics carrier","- Ly do sai: Mua bằng sáng chế chỉ tiêu tốn 12.0 triệu USD, nhỏ hơn rất nhiều so với khoản 85.0 triệu USD mua robot.","- Bay ETS: Bẫy Khoản mục Đầu tư Thứ yếu (Minor Investment Item Trap)","(D) Distributing regular quarterly dividends to preferred stockholders","- Ly do sai: Chi trả cổ tức (-$20M) là dòng tiền của Hoạt động Tài chính, không phải hoạt động đầu tư.","- Bay ETS: Bẫy Dòng tiền Cổ tức (Dividend Financing Trap)","188. By what percentage did the Board of Directors increase the quarterly dividend?","Dap an dung: (C) 12.5%","[Dau vet bai doc / Clue]: Văn bản 3, Nghị quyết 2: \u0027RESOLVED, that the regular quarterly dividend on common stock is hereby increased by 12.5%, from $0.40 to $0.45 per share.\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027increased by 12.5%\u0027 \u003c-\u003e \u0027percentage did the Board of Directors increase the quarterly dividend: 12.5%\u0027","[Loi giai chi tiet]: Nghị quyết số 2 của Hội đồng Quản trị ghi rõ mức tăng cổ tức hàng quý là 12,5% (tăng từ 0,40 USD lên 0,45 USD cho mỗi cổ phần).","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) 5.0%","- Ly do sai: Con số 5.0% không xuất hiện trong bài đọc.","- Bay ETS: Bẫy Tỷ lệ Phần trăm Bịa đặt (Fabricated Percentage Trap)","(B) 8.5%","- Ly do sai: 8.5% là con số tăng trưởng doanh thu ở Bài 1 (Valenta), hoàn toàn không liên quan đến bài đọc này.","- Bay ETS: Bẫy Số liệu Từ Bài Đọc Khác (Foreign Data Trap)","(D) 21.4%","- Ly do sai: 21.4% là Tỷ suất Sinh lời Nội bộ (IRR) của dự án kho tự động nêu trong bản thuyết minh của CFO ở Văn bản 2.","- Bay ETS: Bẫy Lấy nhầm Tỷ suất Sinh lời Dự án (Project IRR Trap)","189. Under Resolution 2, what total amount of cash will OmniLogix distribute in dividends on December 20?","Dap an dung: (C) $22.5 million","[Dau vet bai doc / Clue]: Văn bản 3, Nghị quyết 2: \u0027Total cash disbursement shall equal $22,500,000.00 based on 50,000,000 common shares currently outstanding.\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027$22,500,000.00\u0027 \u003c-\u003e \u0027$22.5 million\u0027","• Hoặc tính toán: 50,000,000 cổ phần x $0.45/cổ phần = $22,500,000.00.","[Loi giai chi tiet]: Theo Nghị quyết 2, với 50 triệu cổ phiếu đang lưu hành và mức chi trả mới 0,45 USD/cổ phiếu, tổng số tiền mặt OmniLogix sẽ phân phối chi trả cổ tức vào ngày 20 tháng 12 là 22,5 triệu USD.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) $10.5 million","- Ly do sai: 10.5 triệu USD là mức tăng thuần tiền mặt trong năm tài chính 2025 ở Văn bản 1.","- Bay ETS: Bẫy Tăng trưởng Tiền mặt Thuần (Net Cash Increase Trap)","(B) $20.0 million","- Ly do sai: 20.0 triệu USD là số tiền cổ tức cũ của năm trước (50M cổ phiếu x $0.40).","- Bay ETS: Bẫy Số tiền Cổ tức Cũ Chưa Tăng (Prior Dividend Figure Trap)","(D) $95.0 million","- Ly do sai: 95.0 triệu USD là tổng ngân sách CAPEX đầu tư xây kho tự động ở Nghị quyết 1.","- Bay ETS: Bẫy Lấy nhầm Ngân sách CAPEX (CAPEX Budget Trap)","190. In Passage 2, paragraph 2, the term \u0027payback period\u0027 refers to the time required to","Dap an dung: (B) recover the original cash investment through project cash flows","[Dau vet bai doc / Clue]: Văn bản 2, Đoạn 2: \u0027...this investment yields an Internal Rate of Return (IRR) of 21.4% with an attractive capital payback period of 3.8 years.\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027payback period\u0027 (thời gian hoàn vốn) = thời gian cần thiết để thu hồi vốn đầu tư ban đầu \u003c-\u003e \u0027recover the original cash investment through project cash flows\u0027","[Loi giai chi tiet]: Trong quản trị tài chính và thẩm định dự án đầu tư CAPEX, \u0027payback period\u0027 (thời gian hoàn vốn) là thời gian cần thiết để các dòng tiền thuần do dự án tạo ra bù đắp đủ toàn bộ chi phí vốn đầu tư ban đầu.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) renegotiate long-term interest rates with lending institutions","- Ly do sai: Tái đàm phán lãi suất vay ngân hàng không liên quan đến thời gian hoàn vốn của một dự án đầu tư máy móc.","- Bay ETS: Bẫy Đàm phán Nợ Vay (Debt Renegotiation Trap)","(C) distribute all retained earnings to common shareholders","- Ly do sai: Phân phối lợi nhuận giữ lại là chính sách cổ tức, không phải thời gian hoàn vốn CAPEX.","- Bay ETS: Bẫy Phân phối Lợi nhuận (Earnings Distribution Trap)","(D) train automated robotics technicians at overseas warehouses","- Ly do sai: Đào tạo nhân sự kỹ thuật là hoạt động vận hành nhân sự, không phải thước đo tài chính.","- Bay ETS: Bẫy Vận hành Kỹ thuật (Technical Training Trap)","PHẦN 4: KỸ THUẬT FEYNMAN SONG NGỮ \u0026 SƠ ĐỒ QUY TRÌNH (TƯ DUY QUẢN TRỊ DÒNG TIỀN \u0026 BA)","4.1. Sơ đồ Quy trình Luân chuyển Nghiệp vụ (Operating Cash Generation, CAPEX \u0026 Dividend Execution)","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","Tổng hợp Báo cáo Dòng tiền \u0026 Xác định Dòng tiền Tự do (Cash Flow Consolidation \u0026 FCF Modeling)"],[],["BƯỚC 2","Thuyết minh Phân bổ Nguồn vốn \u0026 Thẩm định Hiệu quả CAPEX (Capital Allocation Justification \u0026 IRR)"],[],["BƯỚC 3","HĐQT Phê chuẩn Nghị quyết \u0026 Kích hoạt Lệnh Giải ngân Cổ tức (Board Resolution \u0026 Dividend Disbursement)"]],[["• Chung tu \u0026 Kenh: Phòng Kế toán Tổng hợp OmniLogix -\u003e Hệ thống ERP Oracle Cloud Financials","• Nghiep vu thuc thi: Đối soát dòng tiền kinh doanh $122.5M; trừ chi tiêu CAPEX thiết bị kho robot $85.0M và cổ tức cũ $20.0M; xác định Dòng tiền Tự do FCF dương $37.5M và số dư tiền mặt cuối kỳ $45.2M","• Ket qua \u0026 Kiem soat: Báo cáo Lưu chuyển Tiền tệ Kiểm toán (Cash Flow Statement) + Mô hình Dòng tiền Tự do FCF Model"],["➔"],["• Chung tu \u0026 Kenh: CFO Brenda Thorne -\u003e Ban Chiến lược \u0026 Hội đồng Quản trị","• Nghiep vu thuc thi: Lập tờ trình đề xuất tăng ngân sách CAPEX năm 2026 lên $95.0M cho kho Rotterdam/Antwerp với IRR 21,4% và thời gian hoàn vốn 3,8 năm; đồng thời đề xuất tăng cổ tức thêm 12,5% lên $0,45/cổ phiếu","• Ket qua \u0026 Kiem soat: Bản Ghi nhớ Chiến lược Phân bổ Vốn (CFO Memo) + Bảng Thẩm định Suất Sinh lời Dự án CAPEX"],["➔"],["• Chung tu \u0026 Kenh: Hội đồng Quản trị -\u003e Ngân hàng Thanh toán Đại lý Lưu ký Computershare","• Nghiep vu thuc thi: HĐQT ban hành Nghị quyết phê duyệt trần CAPEX $95M và phê duyệt chi $22.5M cổ tức ngày 20/12; Computershare chốt quyền ngày 01/12 và tự động chuyển khoản tiền mặt cho 50 triệu cổ phần","• Ket qua \u0026 Kiem soat: Nghị quyết HĐQT Đã Ký (Board Resolutions) + Lệnh Chuyển tiền Quyết toán Cổ tức Fedwire $22.5M"]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["STEP 1","CASH FLOW CONSOLIDATION \u0026 FREE CASH FLOW MODELING"],[],["STEP 2","CAPITAL ALLOCATION JUSTIFICATION \u0026 PROJECT IRR APPRAISAL"],[],["STEP 3","BOARD RESOLUTION ENACTMENT \u0026 DIVIDEND DISBURSEMENT"]],[["• Documents \u0026 Channels: • Documents \u0026 Channels: OmniLogix Corporate Accounting -\u003e Oracle Financials Cloud","• Core Business Execution: • Core Business Execution: Reconcile $122.5M operating cash flow; deduct $85.0M robotics CAPEX and $20.0M dividends; establish $37.5M Free Cash Flow surplus with $45.2M ending cash balance.","• Key Deliverable \u0026 Control: • Key Deliverable \u0026 Control: Audited Statement of Cash Flows + Dynamic Free Cash Flow (FCF) Variance Report"],["➔"],["• Documents \u0026 Channels: • Documents \u0026 Channels: CFO Brenda Thorne -\u003e Board Strategy Committee","• Core Business Execution: • Core Business Execution: Model $95.0M FY 2026 CAPEX expansion for European hubs (21.4% IRR, 3.8-year payback); present formal memorandum recommending a 12.5% dividend increase to $0.45 per share.","• Key Deliverable \u0026 Control: • Key Deliverable \u0026 Control: Executive Capital Allocation Memorandum + DCF Capital Budgeting Model"],["➔"],["• Documents \u0026 Channels: • Documents \u0026 Channels: Board of Directors -\u003e Computershare Paying Agent \u0026 Depository","• Core Business Execution: • Core Business Execution: Enact binding resolutions authorizing $95M CAPEX ceiling and $22.5M dividend payout; Computershare captures Dec 1 record date and executes cash wire distributions on Dec 20.","• Key Deliverable \u0026 Control: • Key Deliverable \u0026 Control: Certified Board Minutes + Bank Wire Settlement Journal of $22,500,000.00"]]],"t":"table"},"4.2. Tư duy Phân tích Nghiệp vụ Quản trị Dòng tiền Doanh nghiệp \u0026 BA (Bản Tiếng Việt)","• Bức tranh Toàn cảnh Phân bổ Nguồn vốn (End-to-End Flow): Một chu kỳ quản trị dòng tiền đỉnh cao của tập đoàn niêm yết kết nối qua 3 luồng: (1) Luồng Tạo tiền Vận hành (Cash Generation Stream): Doanh thu bán hàng trừ chi phí thực tế tạo ra Dòng tiền từ Hoạt động Kinh doanh ($122.5M) — đây là nguồn \u0027máu\u0027 thật của doanh nghiệp, độc lập hoàn toàn với các thủ thuật kế toán dồn tích (Accrual accounting); (2) Luồng Tái đầu tư Mở rộng Tài sản Cố định (CAPEX Reinvestment Stream): Doanh nghiệp dùng chính dòng tiền thặng dư để tái đầu tư vào công nghệ tự động hóa kho ($85M và kế hoạch $95M) nhằm hạ giá thành dài hạn; dự án chỉ được duyệt khi vượt qua bài toán thẩm định khắt khe: Tỷ suất sinh lời nội bộ IRR đạt 21.4% (vượt xa chi phí sử dụng vốn WACC) và thời gian hoàn vốn ngắn 3.8 năm; (3) Luồng Trả tiền cho Nhà đầu tư \u0026 Giữ an toàn Thanh khoản (Shareholder Return \u0026 Liquidity Buffer): Sau khi đã trừ CAPEX, phần Dòng Tiền Tự Do còn lại ($37.5M) được dùng để chia cổ tức tiền mặt ($22.5M) nhằm giữ chân cổ đông, trong khi vẫn duy trì gối đệm tiền mặt an toàn tối thiểu $35M phòng ngừa rủi ro đứt gãy kinh tế.","• Điểm nghẽn \u0026 Rủi ro Vận hành Thực tế (Core Bottleneck \u0026 Risk): Bẫy \u0027Thiếu hụt Thanh khoản Dù Có Lãi Kế toán\u0027 (Profitable Insolvency) và Rủi ro Bội chi Ngân sách CAPEX (CAPEX Overrun). Nhiều doanh nghiệp báo lãi ròng rất cao trên Báo cáo Kết quả Kinh doanh nhưng dòng tiền kinh doanh lại âm do bị khách hàng chiếm dụng vốn (nợ đọng khó đòi). Ngược lại, nếu dự án kho tự động 95 triệu USD bị đội vốn lên 130 triệu USD trong khi chu kỳ hoàn vốn kéo dài từ 3.8 năm lên 7 năm, doanh nghiệp sẽ rơi vào tình thế kiệt quệ tiền mặt, buộc phải cắt giảm cổ tức và đối mặt với làn sóng bán tháo cổ phiếu.","• 3 Giải pháp Thiết kế Hệ thống \u0026 Phân tích Nghiệp vụ (BA Solutions):","(1) Hệ thống Tự động Hóa Đo lường Dòng Tiền Tự Do \u0026 Kế hoạch Chia Cổ tức (Automated Free Cash Flow \u0026 Dividend Payout Engine): Thiết lập công thức tính toán tự động FCF = Operating Cash Flow - Maintenance CAPEX trên hệ thống ERP; nếu FCF dự phóng quý tới không đủ trang trải tỷ lệ chi trả cổ tức 100%, hệ thống tự động khóa đề xuất tăng cổ tức để bảo vệ thanh khoản.","(2) Phân hệ Kiểm soát Dự toán \u0026 Giải ngân CAPEX Theo Mốc Nghiệm thu (Milestone-based CAPEX Budget Gatekeeper): Cấu hình module quản trị dự án tự động khóa các lệnh chi tiền cho nhà thầu robot; chỉ khi hệ thống IoT tại kho Rotterdam báo cáo số lượng cánh tay robot đã lắp ráp và chạy thử thành công, hệ thống mới tự động giải ngân từng gói vốn trong hạn mức 95 triệu USD.","(3) Giám sát Trần Đòn bẩy Tài chính \u0026 Tỷ lệ Tiền mặt Tối thiểu (Liquidity Floor \u0026 Debt-to-Capitalization Monitor): Tích hợp thuật toán giám sát 24/7 bảo đảm số dư tiền gửi ngân hàng không bao giờ tụt xuống dưới ngưỡng trần 35 triệu USD theo đúng Nghị quyết số 3 của Hội đồng Quản trị; nếu phát hiện nguy cơ chạm ngưỡng, hệ thống tự động kích hoạt cảnh báo gửi CFO.","4.3. Business Analyst \u0026 Cash Management Systems Executive Summary (Bản Tiếng Anh)","• End-to-End Corporate Capital Allocation Context: Disciplined corporate cash management orchestrates three interconnected financial flows: (1) Cash Generation Core: Operating cash flows ($122.5M) strip away accrual distortions, reflecting pure cash conversion from commercial logistics services; (2) Hurdle-Rate Capital Reinvestment: Self-funding $85M-$95M robotics CAPEX based on rigorous discounted cash flow metrics: achieving a 21.4% IRR (well above WACC) and an aggressive 3.8-year payback horizon; (3) Shareholder Yield \u0026 Balance Sheet Fortress: Deploying Free Cash Flow ($37.5M) to support an increased $22.5M quarterly dividend distribution while enforcing a non-negotiable $35M liquidity floor and a 40% debt-to-capitalization ceiling.","• Core Operational Bottleneck \u0026 Risk: The Accrual-Cash Disconnect and CAPEX Overrun Liabilities. Generating GAAP accounting profits while suffering negative operating cash flows creates fatal working capital traps. Furthermore, if European fulfillment infrastructure encounters cost overruns beyond the $95M approved ceiling, the payback period extends, compressing Free Cash Flow and endangering regular dividend sustainability.","• Key BA \u0026 Treasury System Architecture Solutions:","(1) Dynamic FCF \u0026 Dividend Coverage Telemetry: Embed automated dividend-coverage algorithms within financial consolidation tools, calculating the ratio of Free Cash Flow to projected dividend obligations before executive compensation or dividend revisions can be submitted to the Board.","(2) Milestone-Driven CAPEX Gatekeeping Controls: Configure ERP purchase order workflows where robotics vendor milestone drawdowns require digitally certified commissioning telemetry, strictly enforcing the $95M authorized ceiling.","(3) Continuous Liquidity Floor \u0026 Leverage Compliance Radar: Implement automated treasury sweeps and covenant tracking that continuously monitor cash positions against the mandatory $35M floor, automatically alerting the CFO if unexpected operational outflows threaten board covenants.","4.4. Tam giác Liên kết Nhận thức Đa chiều (Multi-Perspective Contextual Anchoring)","1. Lăng kính Viễn thông \u0026 Ngân sách CAPEX Viettel: Bài toán quản trị dòng tiền đầu tư hạ tầng mạng 4G/5G và trung tâm dữ liệu IDC của Viettel: Tập đoàn tính toán kỹ lưỡng dòng tiền kinh doanh từ hàng chục triệu thuê bao để cân đối ngân sách đầu tư CAPEX hàng nghìn tỷ đồng mua sắm thiết bị trạm phát sóng; chỉ những dự án có tỷ suất sinh lời IRR vượt trội và thời gian hoàn vốn dưới 5 năm mới được phê duyệt giải ngân, bảo đảm nộp ngân sách nhà nước đầy đủ và chia cổ tức đều đặn.","2. Lăng kính Quản trị Trường Mầm non Ước Mơ Xanh (cô Thu Huyền): Bài toán cân đối dòng tiền học phí và chi tiêu đầu tư cơ sở vật chất: Cô Thu Huyền dùng số tiền học phí thực thu hàng tháng (dòng tiền kinh doanh) để chi trả lương giáo viên và tiền ăn, phần tiền dư thừa tích lũy (dòng tiền tự do FCF) được trích ra 70% đầu tư mua sắm bộ đồ chơi STEAM thông minh (CAPEX) và 30% chia thưởng thi đua cuối năm cho các cô giáo để tạo động lực cống hiến.","3. Lăng kính Bàn học Gia đình (Kèm cặp học sinh Lớp 5 - Bé Hà Ngân): Bài học \u0027Kế hoạch hũ tiền nuôi lợn đất của Hà Ngân\u0027: Mỗi tháng Hà Ngân nhận 100.000 đồng tiền thưởng giúp mẹ làm việc nhà (dòng tiền kinh doanh); con bỏ 60.000 đồng mua bộ bút sáp màu và compa mới để học vẽ (đầu tư CAPEX phục vụ học tập lâu dài), còn lại 40.000 đồng tiền nhàn rỗi (Free Cash Flow) con trích một nửa mua truyện tranh đọc giải trí và một nửa giữ lại trong ống heo dự phòng.","PHẦN 5: BẢNG TỪ VỰNG \u0026 CẤU TRÚC CỐT LÕI (8 THUẬT NGỮ DÒNG TIỀN \u0026 PHÂN BỔ VỐN)","1. operating cash flow (n phr)  /ˈɑːpəreɪtɪŋ kæʃ floʊ/  = cash flow from operations (CFO) / operational cash generation","Nghia: Dòng tiền từ hoạt động kinh doanh (tiền thực thu từ hoạt động cốt lõi của doanh nghiệp)","Vd: Strong operating cash flow enabled the company to self-fund its automation projects. - Dòng tiền kinh doanh dồi dào đã cho phép công ty tự tài trợ các dự án tự động hóa của mình.","2. capital expenditure (CAPEX) (n phr)  /ˈkæpɪtl ɪkˈspendɪtʃər/  = fixed asset investment / infrastructure spending / capital outlay","Nghia: Chi tiêu vốn đầu tư (tiền mua sắm, nâng cấp tài sản cố định như nhà xưởng, máy móc)","Vd: The board approved a ninety-five million dollar capital expenditure budget for new warehouses. - Hội đồng quản trị đã phê chuẩn ngân sách chi tiêu vốn 95 triệu USD cho các nhà kho mới.","3. free cash flow (FCF) (n phr)  /friː kæʃ floʊ/  = operating cash flow minus capital expenditures / unencumbered cash surplus","Nghia: Dòng tiền tự do (tiền mặt còn lại sau khi đã trừ toàn bộ chi tiêu vốn CAPEX)","Vd: Free cash flow reached thirty-seven million dollars, supporting increased shareholder distributions. - Dòng tiền tự do đạt 37 triệu USD, hỗ trợ việc gia tăng phân phối lợi nhuận cho cổ đông.","4. internal rate of return (IRR) (n phr)  /ɪnˈtɜːrnl reɪt əv rɪˈtɜːrn/  = project hurdle profitability / annualized capital return percentage","Nghia: Tỷ suất sinh lời nội bộ (tỷ lệ chiết khấu làm cho giá trị hiện tại ròng NPV của dự án bằng 0)","Vd: The robotics expansion project boasts an attractive internal rate of return of 21.4%. - Dự án mở rộng robot tự động sở hữu tỷ suất sinh lời nội bộ hấp dẫn lên tới 21,4%.","5. payback period (n phr)  /ˈpeɪbæk ˈpɪriəd/  = capital recovery timeframe / duration needed to recoup initial investment","Nghia: Thời gian hoàn vốn (thời gian cần thiết để thu hồi lại toàn bộ số vốn đầu tư ban đầu)","Vd: The proposed warehouse investment has an estimated payback period of 3.8 years. - Khoản đầu tư nhà kho được đề xuất có thời gian hoàn vốn ước tính là 3,8 năm.","6. cash dividend (n phr)  /kæʃ ˈdɪvɪdend/  = direct equity distribution / liquid dividend payout to shareholders","Nghia: Cổ tức bằng tiền mặt (khoản lợi nhuận chi trả trực tiếp bằng tiền cho cổ đông)","Vd: The board declared an increased quarterly cash dividend of $0.45 per common share. - Hội đồng quản trị đã công bố mức cổ tức tiền mặt hàng quý tăng lên 0,45 USD mỗi cổ phần.","7. stockholder of record (n phr)  /ˈstɑːkhoʊldər əv ˈrekərd/  = registered shareholder on record date / entitled equity holder","Nghia: Cổ đông có tên trong danh sách đăng ký vào ngày chốt quyền","Vd: Dividends will be paid to stockholders of record at the close of business on December 1. - Cổ tức sẽ được chi trả cho các cổ đông có tên trong sổ đăng ký vào cuối ngày làm việc 1 tháng 12.","8. capital allocation (n phr)  /ˈkæpɪtl ˌæləˈkeɪʃn/  = strategic fund deployment / distribution between reinvestment, debt repayment, and dividends","Nghia: Phân bổ nguồn vốn (chiến lược quyết định tỷ trọng tiền tái đầu tư, trả nợ hay chia cổ tức)","Vd: Disciplined capital allocation is essential to maximizing long-term shareholder value. - Việc phân bổ nguồn vốn có kỷ luật là điều cốt yếu để tối đa hóa giá trị dài hạn cho cổ đông.","==================================================================================================","BÀI 7: Hợp đồng Hoán đổi Lãi suất (Interest Rate Swap - ISDA Master Agreement) \u0026 Báo cáo Thanh toán Bù trừ Ròng Định kỳ (Quarterly Net Settlement Statement) (Questions 176-180 - Double Passage)","Nguồn: ETS TOEIC Part 7 — Double Passage (ISDA Swap Trade Confirmation \u0026 Bank Net Settlement Statement)","PHẦN 1: NỘI DUNG BÀI ĐỌC, CÂU HỎI \u0026 BẢN DỊCH SONG NGỮ","1.1. Đề thi Tiếng Anh gốc (Strategy Guide \u0026 Original ETS Passages)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","Questions 176-180 refer to the following swap confirmation and quarterly settlement statement.","[Passage 1: Interest Rate Swap Confirmation — ISDA Master Agreement Excerpt]","APEX CAPITAL MARKETS \u0026 BANKING GROUP","Interest Rate Derivative Trade Confirmation — Governed by ISDA Master Agreement","Trade Identifier: #IRS-NYC-99214 | Date: March 15","1. Transaction Parties","• Party A (Fixed Rate Payer): Metropolitan Transit Holdings LLC","• Party B (Floating Rate Payer): Apex Capital Bank, N.A.","2. Contractual Terms","• Notional Principal Amount: $100,000,000.00 USD (One Hundred Million US Dollars)","• Effective Date: April 1 | Termination Date: April 1 (5-Year Tenor)","• Fixed Rate Payer Terms: Party A pays a fixed rate of 4.25% per annum, calculated on an actual/360-day basis, payable quarterly in arrears on January 1, April 1, July 1, and October 1.","• Floating Rate Payer Terms: Party B pays a floating rate equal to the 3-Month CME Term SOFR (Secured Overnight Financing Rate), fixed two business days prior to the beginning of each calculation period, payable on identical quarterly dates.","• Purpose of Transaction: Synthetic liability conversion to hedge variable interest rate risk on Metropolitan\u0027s $100 million floating-rate commercial bank credit line.","• Settlement Convention: Netting applies pursuant to Section 2(c) of the ISDA Master Agreement; only the net differential between Fixed and Floating obligations shall be wired on each settlement date.","[Passage 2: Quarterly Net Settlement Statement — Apex Capital Bank Derivative Operations]","APEX CAPITAL BANK, N.A. — DERIVATIVE SETTLEMENT SERVICES","Wall Street Plaza, New York, NY 10005","Quarterly Swap Netting \u0026 Settlement Statement","Calculation Period: July 1 to October 1 (92 Days) | Security ID: #IRS-NYC-99214","To: Metropolitan Transit Holdings LLC (Attn: Corporate Treasury)","Dear Client:","Please review the quarterly interest rate swap calculation and net cash settlement breakdown for the period ending October 1:","1. Contract Base Information:","• Notional Principal Amount: $100,000,000.00","• Number of Days in Period: 92 days (Actual/360 day-count)","2. Fixed Rate Leg Calculation (Metropolitan Obligation):","• Fixed Swap Rate: 4.25% per annum","• Calculation: $100,000,000.00 x 4.25% x (92 / 360)","• Gross Fixed Amount Due from Metropolitan: $1,085,277.78","3. Floating Rate Leg Calculation (Apex Bank Obligation):","• Benchmark 3-Month CME Term SOFR (Fixed on June 28): 5.10% per annum","• Calculation: $100,000,000.00 x 5.10% x (92 / 360)","• Gross Floating Amount Due from Apex Bank: $1,302,500.00","4. Net Settlement Determination:","Because the floating rate obligation ($1,302,500.00) exceeds the fixed rate obligation ($1,085,277.78), Party B (Apex Capital Bank) shall remit a Net Settlement Payment to Party A (Metropolitan Transit Holdings).","• Net Settlement Amount Due to Metropolitan: $217,222.22","Remittance Details: Funds of $217,222.22 will be wired via Fedwire on October 1 to your treasury account at Citibank, N.A. (Account #4409-1188).","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","176. What was the main purpose of Metropolitan Transit entering into the swap agreement?","(A) To borrow $100 million in physical cash to purchase new subway railcars","(B) To hedge against the financial risk of rising floating interest rates","(C) To speculate on foreign exchange rate currency movements","(D) To transfer corporate ownership of transit infrastructure to Apex Bank","177. What is the notional principal amount of the swap contract?","(A) $1,085,277.78","(B) $1,302,500.00","(C) $12,000,000.00","(D) $100,000,000.00","178. What benchmark floating interest rate was fixed for the July 1 to October 1 period?","(A) 1.85%","(B) 4.25%","(C) 5.10%","(D) 6.25%","179. Why did Apex Capital Bank remit $217,222.22 to Metropolitan Transit on October 1?","(A) Metropolitan failed to satisfy its quarterly debt coverage covenants.","(B) The floating rate SOFR benchmark was higher than the agreed fixed rate.","(C) The swap agreement was prematurely terminated by mutual agreement.","(D) Apex Bank refunded an upfront commitment fee charged in error.","180. Under Section 2(c) of the agreement, how are quarterly payments settled?","(A) Both parties wire their full gross interest payments to an escrow custodian.","(B) The fixed rate payer pays interest only at the five-year termination date.","(C) Only the net difference between the two interest obligations is transferred.","(D) Payments are made exclusively through newly issued corporate preferred shares.","1.2. Hướng dẫn làm bài Part 7","CHIẾN THUẬT 5 PHÚT TỐI ƯU: NẮM BẮT BỐI CẢNH, GHÉP NỐI DỮ KIỆN \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Luồng sự việc (Quỹ đạo Quét chữ Z \u0026 3 Câu hỏi Tiềm thức): • Văn bản 1 (Hợp đồng Xác nhận Hoán đổi Lãi suất ISDA): Metropolitan Transit ký hợp đồng Swap quy mô vốn danh nghĩa 100 triệu USD trong 5 năm với Apex Capital Bank; Metropolitan trả lãi suất cố định 4.25%/năm, nhận lại lãi suất thả nổi 3-month SOFR; mục đích: phòng ngừa rủi ro lãi suất thả nổi của khoản nợ vay 100 triệu USD; nguyên tắc thanh toán bù trừ ròng (Netting).","• Văn bản 2 (Báo cáo Thanh toán Bù trừ Quý): Kỳ tính lãi 92 ngày; Lãi suất cố định 4.25% tính ra $1,085,277.78; Lãi suất thả nổi SOFR thị trường tăng lên 5.10% tính ra $1,302,500.00; Do lãi thả nổi cao hơn lãi cố định nên Ngân hàng Apex phải chuyển khoản số tiền chênh lệch ròng $217,222.22 cho Metropolitan vào ngày 01/10.","=\u003e Luồng sự việc: Ký hợp đồng phái sinh Swap để cố định chi phí lãi vay -\u003e Lãi suất thị trường tăng cao hơn mức cố định -\u003e Ngân hàng bù đắp số tiền chênh lệch cho doanh nghiệp.","Bước 2 (20 giây) - Quét nhanh 5 câu hỏi \u0026 Gắn móc từ khóa: • Câu 176: Mục đích chính tham gia hợp đồng hoán đổi lãi suất (Từ khóa: main purpose, swap agreement).","• Câu 177: Giá trị vốn danh nghĩa của hợp đồng (Từ khóa: notional principal amount).","• Câu 178: Lãi suất cơ sở thả nổi được chốt cho kỳ quý 3 là bao nhiêu (Từ khóa: benchmark floating interest rate fixed).","• Câu 179: Tại sao Ngân hàng Apex phải chuyển tiền cho Metropolitan (Từ khóa: why Apex Bank remit $217,222.22).","• Câu 180: Các khoản thanh toán hàng quý được giải quyết ra sao theo điều khoản bù trừ (Từ khóa: how quarterly payments settled, Section 2c).","Bước 3 (3 phút 45 giây) - Giải cuốn chiếu \u0026 Khóa đáp án: • Câu 176 (Chi tiết - VB1 Mục 2): \u0027hedge variable interest rate risk on Metropolitan\u0027s $100 million floating-rate commercial bank credit line\u0027 -\u003e Chọn (B) Phòng ngừa rủi ro lãi suất thả nổi gia tăng.","• Câu 177 (Chi tiết - VB1 Mục 2 \u0026 VB2 Mục 1): \u0027Notional Principal Amount: $100,000,000.00 USD\u0027 -\u003e Chọn (D) 100 triệu USD.","• Câu 178 (Chi tiết - VB2 Mục 3): \u0027Benchmark 3-Month CME Term SOFR (Fixed on June 28): 5.10% per annum\u0027 -\u003e Chọn (C) 5.10%.","• Câu 179 (Ghép nối \u0026 Suy luận - VB2 Mục 4): Lãi thả nổi (5.10% = $1.302M) cao hơn lãi cố định (4.25% = $1.085M) nên ngân hàng phải thanh toán phần thặng dư chênh lệch -\u003e Chọn (B).","• Câu 180 (Chi tiết - VB1 dòng cuối): \u0027Netting applies... only the net differential between Fixed and Floating obligations shall be wired\u0027 -\u003e Chỉ chuyển khoản số tiền chênh lệch ròng -\u003e Chọn (C).","Bước 4 (25 giây) - Rà soát \u0026 Đúc kết Feynman: Tự đúc kết 1 câu: Hợp đồng hoán đổi lãi suất giúp doanh nghiệp \u0027khóa\u0027 lãi suất vay ở mức 4.25%, nên khi lãi suất thị trường tăng vọt lên 5.10%, ngân hàng phải \u0027móc tiền túi\u0027 bù lại 217.222 USD tiền chênh lệch cho công ty.","1.3. Dịch Song ngữ Xen kẽ Từng Câu (Sentence-by-Sentence Translation)","[Văn bản 1: Bản Xác nhận Giao dịch Hoán đổi Lãi suất — Mẫu Hợp đồng Chuẩn ISDA]","APEX CAPITAL MARKETS \u0026 BANKING GROUP","Interest Rate Derivative Trade Confirmation — Governed by ISDA Master Agreement","Trade Identifier: #IRS-NYC-99214 | Date: March 15","KHỐI NGÂN HÀNG \u0026 THỊ TRƯỜNG VỐN APEX","Xác nhận Giao dịch Phái sinh Lãi suất — Điều chỉnh theo Hợp đồng Khung ISDA","Mã Định danh Giao dịch: #IRS-NYC-99214 | Ngày: 15 Tháng 3","Party A (Fixed Rate Payer): Metropolitan Transit Holdings LLC | Party B (Floating Rate Payer): Apex Capital Bank, N.A.","Bên A (Bên Trả Lãi suất Cố định): Công ty Quản lý Vận tải Đô thị Metropolitan | Bên B (Bên Trả Lãi suất Thả nổi): Ngân hàng Thương mại Apex, N.A.","Notional Principal Amount: $100,000,000.00 USD (One Hundred Million US Dollars) | Tenor: 5 Years (Matures April 1).","Giá trị Vốn Gốc Danh nghĩa: 100.000.000,00 USD (Một trăm triệu Đô la Mỹ) | Kỳ hạn: 5 Năm (Đáo hạn Ngày 1 Tháng 4).","Party A pays a fixed rate of 4.25% per annum quarterly in arrears on Jan 1, Apr 1, Jul 1, and Oct 1.","Bên A thanh toán lãi suất cố định 4,25%/năm định kỳ trả sau hàng quý vào các ngày 1 Tháng 1, 1 Tháng 4, 1 Tháng 7 và 1 Tháng 10.","Party B pays a floating rate equal to the 3-Month CME Term SOFR, fixed two business days prior to each calculation period.","Bên B thanh toán lãi suất thả nổi bằng lãi suất CME Term SOFR kỳ hạn 3 Tháng, được chốt hai ngày làm việc trước mỗi kỳ tính toán.","Purpose: Synthetic liability conversion to hedge variable interest rate risk on Metropolitan\u0027s $100 million floating-rate credit line.","Mục đích: Chuyển đổi công nợ nhân tạo nhằm phòng ngừa rủi ro biến động lãi suất thả nổi đối với hạn mức tín dụng ngân hàng 100 triệu USD của Metropolitan.","Settlement Convention: Netting applies pursuant to Section 2(c) of the ISDA Master Agreement; only the net differential between Fixed and Floating obligations shall be wired.","Quy ước Quyết toán: Cơ chế thanh toán bù trừ ròng (Netting) được áp dụng theo Điều 2(c) của Hợp đồng Khung ISDA; chỉ có số tiền chênh lệch ròng giữa nghĩa vụ Cố định và Thả nổi mới được điện chuyển.","[Văn bản 2: Báo cáo Thanh toán Bù trừ Ròng Hàng quý — Khối Phái sinh Ngân hàng Apex]","APEX CAPITAL BANK, N.A. — DERIVATIVE SETTLEMENT SERVICES","Quarterly Swap Netting \u0026 Settlement Statement","Calculation Period: July 1 to October 1 (92 Days) | Security ID: #IRS-NYC-99214","NGÂN HÀNG THƯƠNG MẠI APEX, N.A. — DỊCH VỤ QUYẾT TOÁN CÔNG CỤ PHÁI SINH","Báo cáo Bù trừ \u0026 Quyết toán Hoán đổi Lãi suất Hàng quý","Kỳ Tính toán: Ngày 1 Tháng 7 đến Ngày 1 Tháng 10 (92 Ngày) | Mã Hợp đồng: #IRS-NYC-99214","Notional Principal Amount: $100,000,000.00 | Days in Period: 92 days (Actual/360 day-count).","Giá trị Vốn Gốc Danh nghĩa: 100.000.000,00 USD | Số ngày trong Kỳ: 92 ngày (Quy ước ngày thực tế/360 ngày).","Fixed Leg: $100,000,000.00 x 4.25% x (92 / 360) = Gross Fixed Due from Metropolitan: $1,085,277.78.","Vế Lãi suất Cố định: 100.000.000,00 USD x 4,25% x (92 ngày / 360 ngày) = Tổng Tiền Cố định Metropolitan Phải nộp: 1.085.277,78 USD.","Floating Leg: 3-Month SOFR benchmark (Fixed June 28) = 5.10% per annum | $100,000,000.00 x 5.10% x (92 / 360) = Gross Floating Due from Apex Bank: $1,302,500.00.","Vế Lãi suất Thả nổi: Lãi suất cơ sở SOFR 3 Tháng (Chốt ngày 28/6) = 5,10%/năm | 100.000.000,00 USD x 5,10% x (92 ngày / 360 ngày) = Tổng Tiền Thả nổi Ngân hàng Apex Phải nộp: 1.302.500,00 USD.","Because floating ($1,302,500.00) exceeds fixed ($1,085,277.78), Apex Bank shall remit a Net Settlement Payment of $217,222.22 to Metropolitan.","Do số tiền thả nổi (1.302.500,00 USD) lớn hơn số tiền cố định (1.085.277,78 USD), Ngân hàng Apex có nghĩa vụ chuyển Số tiền Thanh toán Bù trừ Ròng là 217.222,22 USD cho Metropolitan.","Remittance Details: Funds of $217,222.22 will be wired via Fedwire on October 1 to Citibank Account #4409-1188.","Chi tiết Chuyển tiền: Số tiền 217.222,22 USD sẽ được điện chuyển qua hệ thống Fedwire vào ngày 1 Tháng 10 về Tài khoản số #4409-1188 tại Ngân hàng Citibank.","1.4. Dịch chi tiết Câu hỏi \u0026 Phương án Trắc nghiệm","Câu 176. Mục đích chính yếu của Metropolitan Transit khi ký kết hợp đồng hoán đổi lãi suất là gì?","(A) Vay 100 triệu USD tiền mặt vật lý để mua các toa xe tàu điện ngầm mới","(B) Phòng ngừa rủi ro tài chính khi lãi suất thả nổi trên thị trường gia tăng","(C) Đầu cơ kiếm lời trên sự biến động tỷ giá hối đoái ngoại tệ","(D) Chuyển nhượng quyền sở hữu doanh nghiệp hạ tầng giao thông cho Ngân hàng Apex","Câu 177. Giá trị vốn gốc danh nghĩa của hợp đồng hoán đổi lãi suất này là bao nhiêu?","(A) 1.085.277,78 USD","(B) 1.302.500,00 USD","(C) 12.000.000,00 USD","(D) 100.000.000,00 USD","Câu 178. Mức lãi suất cơ sở thả nổi nào đã được chốt cho kỳ tính toán từ ngày 1 tháng 7 đến ngày 1 tháng 10?","(A) 1,85%","(B) 4,25%","(C) 5,10%","(D) 6,25%","Câu 179. Tại sao Ngân hàng Apex Capital lại phải chuyển khoản 217.222,22 USD cho Metropolitan Transit vào ngày 1 tháng 10?","(A) Metropolitan không đáp ứng được các giao ước trang trải nợ vay hàng quý.","(B) Lãi suất cơ sở thả nổi SOFR trên thị trường cao hơn mức lãi suất cố định đã thỏa thuận.","(C) Hợp đồng hoán đổi lãi suất bị chấm dứt trước hạn do sự đồng thuận của hai bên.","(D) Ngân hàng Apex hoàn lại khoản phí cam kết ban đầu bị tính nhầm.","Câu 180. Theo Điều 2(c) của hợp đồng, các khoản thanh toán hàng quý được quyết toán theo phương thức nào?","(A) Cả hai bên cùng chuyển khoản toàn bộ số tiền lãi gộp của mình vào một tài khoản ký quỹ trung gian.","(B) Bên trả lãi suất cố định chỉ phải thanh toán tiền lãi vào ngày kết thúc hợp đồng sau 5 năm.","(C) Chỉ có số tiền chênh lệch ròng giữa hai nghĩa vụ tiền lãi mới được chuyển khoản.","(D) Các khoản thanh toán được thực hiện độc quyền bằng cổ phiếu ưu đãi mới phát hành.","1.5. Tóm tắt Viết lại Toàn bài theo Feynman (Feynman Monograph Summary)","English Executive Summary:","• Derivative Hedging Contract Structure: Metropolitan Transit entered into a 5-year, $100.0M notional ISDA Master Agreement swap with Apex Capital Bank, paying a fixed 4.25% rate and receiving floating 3-month Term SOFR to hedge its variable-rate bank debt.","• Benchmark Inversion \u0026 Rate Fixing: For the 92-day calculation period ending October 1, the benchmark SOFR was fixed at 5.10%, generating a floating obligation of $1,302,500.00 from Apex Bank against Metropolitan\u0027s fixed obligation of $1,085,277.78.","• Net Cash Settlement Liquidation: Applying ISDA Section 2(c) netting rules, Apex Capital Bank wired a net settlement amount of $217,222.22 via Fedwire directly to Metropolitan Transit\u0027s Citibank treasury account on October 1.","Bản tóm tắt Tiếng Việt cốt lõi:","• Cấu trúc Hợp đồng Phái sinh Phòng hộ Lãi suất: Metropolitan ký hợp đồng hoán đổi lãi suất ISDA quy mô danh nghĩa 100 triệu USD kỳ hạn 5 năm với Ngân hàng Apex, chấp nhận trả cố định 4,25%/năm và nhận lại lãi thả nổi SOFR 3 tháng để phòng hộ rủi ro lãi vay ngân hàng.","• Chốt Lãi suất Thị trường Đảo chiều: Trong kỳ tính lãi 92 ngày kết thúc ngày 01/10, lãi suất SOFR chốt ở mức 5,10%, làm phát sinh nghĩa vụ thả nổi của Ngân hàng Apex là 1.302.500,00 USD so với nghĩa vụ cố định của Metropolitan là 1.085.277,78 USD.","• Quyết toán Bù trừ Ròng Bằng Tiền: Áp dụng cơ chế Netting theo chuẩn ISDA, Ngân hàng Apex chuyển khoản trực tiếp số tiền chênh lệch ròng 217.222,22 USD qua hệ thống Fedwire về tài khoản ngân quỹ của Metropolitan tại Citibank vào ngày 01/10.","PHẦN 2: ACTIVE RECALL 5 GIÂY (BẢNG MA TRẬN ĐỊNH VỊ SONG NGỮ)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["1. Đối tượng \u0026 Vai trò: Metropolitan Transit (Bên vay công nợ thực hiện phái sinh trả lãi cố định 4.25% để phòng vệ) \u003c-\u003e Apex Capital Bank (Ngân hàng đối tác nhận cố định, trả lãi thả nổi SOFR và chi trả tiền chênh lệch bù trừ ròng).","1. Stakeholders \u0026 Roles: Metropolitan Transit (Corporate borrower paying fixed 4.25% swap leg to hedge exposure) \u003c-\u003e Apex Capital Bank (Swap dealer receiving fixed, paying floating SOFR and remitting net settlement cash)."]],[["2. Boi canh \u0026 Quy trinh loi"],["2. Bối cảnh \u0026 Quy trình lõi: Quản trị Rủi ro Tài chính \u0026 Hoán đổi Lãi suất (Interest Rate Risk Management \u0026 Derivative Netting): Doanh nghiệp chuyển đổi nghĩa vụ nợ thả nổi sang cố định trên quy mô danh nghĩa $100M -\u003e Khi SOFR tăng vọt lên 5.10%, hợp đồng phái sinh tự động bù trừ ròng (Netting) mang lại dòng tiền mặt dương cho công ty.","2. Business Context \u0026 Core Flow: Financial Risk Hedging \u0026 Derivative Netting Mechanics: Corporate converts floating debt to synthetic fixed debt on $100M notional -\u003e When SOFR spikes to 5.10%, contractual netting generates positive cash inflow offsetting external loan costs."]],[["3. Dau vet suy luan cheo"],["3. Dấu vết suy luận chéo: Nghĩa vụ Cố định là $1,085,277.78 (4.25%) trong khi Nghĩa vụ Thả nổi là $1,302,500.00 (5.10%) -\u003e Hiệu số ròng $1,302,500.00 - $1,085,277.78 = $217,222.22 chính là số tiền Apex Bank bắt buộc phải chuyển khoản cho Metropolitan vào ngày 01/10.","3. Key Cross-Referencing Clues: Fixed leg equals $1,085,277.78 (4.25%) while floating leg equals $1,302,500.00 (5.10%) -\u003e The net spread of $217,222.22 represents the mandatory cash remittance from Apex Bank to Metropolitan on October 1."]]],"t":"table"},"PHẦN 3: ĐÁP ÁN CHUẨN XÁC \u0026 DẤU VẾT TRUY XUẤT CHÉO (CROSS-REFERENCING \u0026 TRAP BREAKDOWN)","176. What was the main purpose of Metropolitan Transit entering into the swap agreement?","Dap an dung: (B) To hedge against the financial risk of rising floating interest rates","[Dau vet bai doc / Clue]: Văn bản 1, Mục 2: \u0027Purpose of Transaction: Synthetic liability conversion to hedge variable interest rate risk on Metropolitan\u0027s $100 million floating-rate commercial bank credit line.\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027to hedge variable interest rate risk on Metropolitan\u0027s... floating-rate credit line\u0027 \u003c-\u003e \u0027To hedge against the financial risk of rising floating interest rates\u0027","[Loi giai chi tiet]: Hợp đồng phái sinh được lập ra nhằm chuyển đổi nghĩa vụ nợ nhân tạo, giúp Metropolitan phòng ngừa rủi ro tài chính khi lãi suất thả nổi của khoản vay ngân hàng gia tăng.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) To borrow $100 million in physical cash to purchase new subway railcars","- Ly do sai: Hợp đồng hoán đổi lãi suất không phải là hợp đồng vay tiền; số tiền 100 triệu USD chỉ là vốn danh nghĩa (Notional Amount) để tính tiền lãi.","- Bay ETS: Bẫy Nhầm lẫn Vốn Danh nghĩa với Khoản Vay Thực (Notional vs. Funded Loan Trap)","(C) To speculate on foreign exchange rate currency movements","- Ly do sai: Đây là hoán đổi lãi suất đồng USD (Interest Rate Swap), không phải hoán đổi tiền tệ ngoại hối (Currency Swap).","- Bay ETS: Bẫy Phái sinh Ngoại hối (FX Derivative Trap)","(D) To transfer corporate ownership of transit infrastructure to Apex Bank","- Ly do sai: Hợp đồng tài chính phái sinh hoàn toàn không chuyển nhượng tài sản hay quyền sở hữu công ty cho ngân hàng.","- Bay ETS: Bẫy Chuyển nhượng Quyền Sở hữu (Ownership Transfer Trap)","177. What is the notional principal amount of the swap contract?","Dap an dung: (D) $100,000,000.00","[Dau vet bai doc / Clue]: Văn bản 1, Mục 2: \u0027Notional Principal Amount: $100,000,000.00 USD (One Hundred Million US Dollars)\u0027.","[Dien dat tuong duong / Paraphrase]: • Tra cứu trực tiếp: \u0027Notional Principal Amount\u0027 = $100,000,000.00.","[Loi giai chi tiet]: Giá trị vốn gốc danh nghĩa làm căn cứ để tính toán tiền lãi giữa hai bên được quy định rõ trong hợp đồng ISDA là 100 triệu USD.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) $1,085,277.78","- Ly do sai: 1.085.277,78 USD là số tiền lãi gộp của vế cố định trong quý 3.","- Bay ETS: Bẫy Số tiền Lãi Vế Cố định (Fixed Leg Gross Interest Trap)","(B) $1,302,500.00","- Ly do sai: 1.302.500,00 USD là số tiền lãi gộp của vế thả nổi trong quý 3.","- Bay ETS: Bẫy Số tiền Lãi Vế Thả nổi (Floating Leg Gross Interest Trap)","(C) $12,000,000.00","- Ly do sai: 12 triệu USD là giá trị bảo lãnh SBLC ở Bài 5, không liên quan đến bài đọc này.","- Bay ETS: Bẫy Số liệu Từ Bài Đọc Trước (Cross-Lesson Figure Trap)","178. What benchmark floating interest rate was fixed for the July 1 to October 1 period?","Dap an dung: (C) 5.10%","[Dau vet bai doc / Clue]: Văn bản 2, Mục 3: \u0027Benchmark 3-Month CME Term SOFR (Fixed on June 28): 5.10% per annum\u0027.","[Dien dat tuong duong / Paraphrase]: • \u0027Benchmark 3-Month CME Term SOFR...: 5.10% per annum\u0027 \u003c-\u003e \u0027benchmark floating interest rate: 5.10%\u0027","[Loi giai chi tiet]: Lãi suất cơ sở thả nổi SOFR kỳ hạn 3 tháng được chốt vào ngày 28/6 cho kỳ thanh toán quý 3 là 5,10%/năm.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) 1.85%","- Ly do sai: 1.85% là biên độ tín dụng ở Bài 2 (Hạn mức tín dụng Talon).","- Bay ETS: Bẫy Biên độ Tín dụng Cũ (Old Margin Distractor Trap)","(B) 4.25%","- Ly do sai: 4.25% là lãi suất vế cố định (Fixed Swap Rate) mà Metropolitan phải trả, không phải lãi suất cơ sở thả nổi.","- Bay ETS: Bẫy Lãi suất Vế Cố định (Fixed vs. Floating Rate Trap)","(D) 6.25%","- Ly do sai: 6.25% là tổng lãi suất vay ở Bài 2.","- Bay ETS: Bẫy Số liệu Lãi vay Bài học Khác (Cross-Lesson Rate Trap)","179. Why did Apex Capital Bank remit $217,222.22 to Metropolitan Transit on October 1?","Dap an dung: (B) The floating rate SOFR benchmark was higher than the agreed fixed rate.","[Dau vet bai doc / Clue]: Văn bản 2, Mục 4: \u0027Because the floating rate obligation ($1,302,500.00) exceeds the fixed rate obligation ($1,085,277.78), Party B (Apex Capital Bank) shall remit a Net Settlement Payment to Party A... $217,222.22\u0027.","[Dien dat tuong duong / Paraphrase]: • \u0027floating rate obligation exceeds the fixed rate obligation\u0027 \u003c-\u003e \u0027floating rate SOFR benchmark was higher than the agreed fixed rate\u0027","[Loi giai chi tiet]: Trong hợp đồng hoán đổi, vì lãi suất thả nổi thực tế (5.10%) cao hơn mức lãi suất cố định (4.25%), bên trả lãi thả nổi (Ngân hàng Apex) có nghĩa vụ phải thanh toán số tiền chênh lệch bù trừ ròng 217.222,22 USD cho Metropolitan.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Metropolitan failed to satisfy its quarterly debt coverage covenants.","- Ly do sai: Đây là giao dịch phái sinh bình thường, không liên quan đến việc vi phạm giao ước nợ vay.","- Bay ETS: Bẫy Vi phạm Giao ước Không Căn cứ (Baseless Covenant Trap)","(C) The swap agreement was prematurely terminated by mutual agreement.","- Ly do sai: Hợp đồng có thời hạn 5 năm và đang vận hành bình thường theo định kỳ quý, không hề bị chấm dứt trước hạn.","- Bay ETS: Bẫy Chấm dứt Hợp đồng Trước hạn (Early Termination Trap)","(D) Apex Bank refunded an upfront commitment fee charged in error.","- Ly do sai: Khoản tiền này là số tiền bù trừ ròng định kỳ của phái sinh, không phải hoàn lại phí cam kết.","- Bay ETS: Bẫy Hoàn Phí Nhầm lẫn (Fee Refund Fallacy Trap)","180. Under Section 2(c) of the agreement, how are quarterly payments settled?","Dap an dung: (C) Only the net difference between the two interest obligations is transferred.","[Dau vet bai doc / Clue]: Văn bản 1, Mục 2 dòng cuối: \u0027Settlement Convention: Netting applies pursuant to Section 2(c) of the ISDA Master Agreement; only the net differential between Fixed and Floating obligations shall be wired on each settlement date.\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027only the net differential between Fixed and Floating obligations shall be wired\u0027 \u003c-\u003e \u0027Only the net difference between the two interest obligations is transferred\u0027","[Loi giai chi tiet]: Điều 2(c) của hợp đồng khung ISDA quy định nguyên tắc bù trừ ròng (Netting): hai bên không chuyển toàn bộ số tiền lãi gộp cho nhau mà chỉ chuyển khoản duy nhất phần chênh lệch ròng giữa hai nghĩa vụ thanh toán.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Both parties wire their full gross interest payments to an escrow custodian.","- Ly do sai: Hai bên không chuyển tiền gộp qua tài khoản ký quỹ mà bù trừ trực tiếp và chỉ chuyển số tiền ròng.","- Bay ETS: Bẫy Chuyển Toàn bộ Tiền Gộp (Gross Cash Movement Trap)","(B) The fixed rate payer pays interest only at the five-year termination date.","- Ly do sai: Tiền lãi được quyết toán định kỳ hàng quý (quarterly in arrears), không phải đợi đến hết 5 năm mới trả.","- Bay ETS: Bẫy Trả Tiền Một Lần Khi Đáo Hạn (Bullet Settlement Trap)","(D) Payments are made exclusively through newly issued corporate preferred shares.","- Ly do sai: Thanh toán bằng tiền mặt qua mạng lưới điện chuyển tiền Fedwire, không dùng cổ phiếu.","- Bay ETS: Bẫy Thanh toán Bằng Cổ phiếu (Equity Payment Fallacy)","PHẦN 4: KỸ THUẬT FEYNMAN SONG NGỮ \u0026 SƠ ĐỒ QUY TRÌNH (TƯ DUY PHÁI SINH PHÒNG NGỪA RỦI RO \u0026 BA)","4.1. Sơ đồ Quy trình Luân chuyển Nghiệp vụ (ISDA Execution, Rate Fixing \u0026 Net Cash Clearing)","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","Xác lập Hợp đồng Khung ISDA \u0026 Xác nhận Hoán đổi Lãi suất (ISDA Execution \u0026 Swap Confirmation)"],[],["BƯỚC 2","Chốt Lãi suất Cơ sở SOFR \u0026 Tính toán Nghĩa vụ Hai Vế (Rate Fixing \u0026 Gross Interest Accrual)"],[],["BƯỚC 3","Thực hiện Bù trừ Ròng \u0026 Điện chuyển Tiền Chênh lệch Fedwire (Netting \u0026 Cash Remittance)"]],[["• Chung tu \u0026 Kenh: Ban Ngân quỹ Metropolitan Transit -\u003e Bàn Giao dịch Phái sinh Ngân hàng Apex","• Nghiep vu thuc thi: Ký kết thỏa thuận hoán đổi lãi suất quy mô danh nghĩa 100 triệu USD kỳ hạn 5 năm; Metropolitan chốt trả lãi cố định 4,25%/năm và nhận lãi thả nổi SOFR 3 tháng để triệt tiêu rủi ro lãi vay biến động","• Ket qua \u0026 Kiem soat: Bản Xác nhận Giao dịch Phái sinh (Trade Confirmation #IRS-NYC-99214) chuẩn ISDA"],["➔"],["• Chung tu \u0026 Kenh: Bàn Tính toán Vận hành Ngân hàng Apex -\u003e Sàn Giao dịch CME Group","• Nghiep vu thuc thi: Chốt lãi suất 3-month CME Term SOFR ở mức 5,10% vào ngày 28/6; tính toán nghĩa vụ cố định của Metropolitan ($1.085.277,78) và nghĩa vụ thả nổi của Ngân hàng Apex ($1.302.500,00) cho 92 ngày","• Ket qua \u0026 Kiem soat: Bảng Tính toán Lãi suất Hai Vế (Fixed \u0026 Floating Valuation Sheet) + Dữ liệu Lãi suất Thị trường"],["➔"],["• Chung tu \u0026 Kenh: Phòng Quyết toán Ngân hàng Apex -\u003e Tài khoản Ngân quỹ Metropolitan tại Citibank","• Nghiep vu thuc thi: Áp dụng cơ chế Netting theo Điều 2(c) ISDA: lấy nghĩa vụ thả nổi trừ nghĩa vụ cố định ra số tiền ròng 217.222,22 USD; Ngân hàng Apex điện chuyển tiền qua Fedwire về Citibank của Metropolitan vào ngày 01/10","• Ket qua \u0026 Kiem soat: Báo cáo Quyết toán Bù trừ Ròng (Quarterly Netting Advice) + Điện Báo Có Fedwire $217.222,22 USD"]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["STEP 1","ISDA MASTER AGREEMENT EXECUTION \u0026 TRADE CONFIRMATION"],[],["STEP 2","BENCHMARK FIXING \u0026 DUAL-LEG ACCRUAL VALUATION"],[],["STEP 3","CONTRACTUAL NETTING CALCULATION \u0026 FEDWIRE DISBURSEMENT"]],[["• Documents \u0026 Channels: • Documents \u0026 Channels: Metropolitan Transit Treasury -\u003e Apex Capital Derivatives Desk","• Core Business Execution: • Core Business Execution: Execute 5-year, $100.0M notional interest rate swap under ISDA terms; Metropolitan commits to paying fixed 4.25% while receiving 3-month Term SOFR to synthetically fix floating loan debt.","• Key Deliverable \u0026 Control: • Key Deliverable \u0026 Control: Legally Binding Trade Confirmation #IRS-NYC-99214 governed by ISDA rules"],["➔"],["• Documents \u0026 Channels: • Documents \u0026 Channels: Apex Derivative Operations Desk -\u003e CME Group SOFR Fixing Portal","• Core Business Execution: • Core Business Execution: Capture 3-month CME Term SOFR at 5.10% on T-2; compute Metropolitan\u0027s fixed leg ($1,085,277.78) against Apex\u0027s floating leg obligation ($1,302,500.00) across 92 actual calendar days.","• Key Deliverable \u0026 Control: • Key Deliverable \u0026 Control: Dual-Leg Accrual Calculation Register + CME Benchmark Verification Record"],["➔"],["• Documents \u0026 Channels: • Documents \u0026 Channels: Apex Middle-Office Settlements -\u003e Metropolitan Citibank Account","• Core Business Execution: • Core Business Execution: Enforce Section 2(c) netting: deduct fixed leg from floating leg to establish net payable of $217,222.22; execute electronic Fedwire funds transfer to Citibank on October 1.","• Key Deliverable \u0026 Control: • Key Deliverable \u0026 Control: Quarterly Swap Netting Settlement Advice + Fedwire Funds Confirmation"]]],"t":"table"},"4.2. Tư duy Phân tích Nghiệp vụ Công cụ Phái sinh \u0026 Phòng ngừa Rủi ro (Bản Tiếng Việt)","• Bức tranh Toàn cảnh Hoán đổi Lãi suất ISDA (End-to-End Flow): Một hợp đồng hoán đổi lãi suất doanh nghiệp vận hành qua 3 luồng: (1) Luồng Nợ Vay Cơ sở Ngoài Đời thực (Underlying Loan Liability): Metropolitan vay 100 triệu USD nợ ngân hàng chịu lãi suất thả nổi SOFR để mua tàu điện; khi lạm phát tăng, lãi suất thả nổi tăng khiến chi phí trả lãi phình to; (2) Luồng Phái sinh Tổng hợp Bù trừ (Synthetic Derivative Overlay): Doanh nghiệp không cần đổi hợp đồng vay cũ mà ký một \u0027Hợp đồng hoán đổi lãi suất\u0027 độc lập với một ngân hàng đầu tư (Apex); theo đó, Metropolitan trả lãi cố định 4.25% và nhận lại đúng mức lãi thả nổi SOFR từ Apex. Hai dòng tiền thả nổi (vừa nhận từ Apex, vừa trả cho ngân hàng cho vay) tự động triệt tiêu lẫn nhau, biến khoản nợ thực tế thành nợ lãi suất cố định 4.25%; (3) Luồng Bù trừ Ròng Giảm thiểu Rủi ro Thanh toán (Netting Settlement): Nhờ nguyên tắc Netting theo chuẩn quốc tế ISDA, hai bên không bao giờ phải chuyển hàng triệu USD tiền mặt qua lại mà hệ thống tự động trừ cấn hai vế; bên nào nợ nhiều hơn sẽ chuyển khoản phần chênh lệch ròng (217.222 USD), giảm thiểu tối đa rủi ro thanh toán liên ngân hàng.","• Điểm nghẽn \u0026 Rủi ro Vận hành Thực tế (Core Bottleneck \u0026 Risk): Rủi ro Lệch Pha Chỉ số Lãi suất Cơ sở (Basis Risk) và Rủi ro Đối tác Mất Khả năng Thanh toán (Counterparty Credit Risk). Nếu khoản nợ vay thực tế của công ty áp dụng lãi suất SOFR bình quân gộp (Compounded SOFR in arrears) nhưng hợp đồng hoán đổi lại ký theo SOFR kỳ hạn trả trước (Term SOFR in advance), sự chênh lệch giữa hai công thức sẽ khiến công ty vẫn bị hở rủi ro tài chính. Ngoài ra, nếu ngân hàng đối tác Apex lâm vào khủng hoảng thanh khoản hoặc phá sản, công ty sẽ mất khoản tiền bồi hoàn chênh lệch khi lãi suất thị trường tăng cao.","• 3 Giải pháp Thiết kế Hệ thống \u0026 Phân tích Nghiệp vụ (BA Solutions):","(1) Hệ thống Định giá \u0026 Đối soát Phái sinh Tự động (Automated Mark-to-Market \u0026 Netting Engine): Xây dựng module kết nối nguồn dữ liệu tài chính Bloomberg/Refinitiv để tự động chụp lãi suất SOFR tại ngày chốt T-2, tự động tính toán số ngày thực tế theo quy ước Actual/360 và tự động đối soát bảng tính thanh toán bù trừ ròng với ngân hàng trước ngày chuyển tiền 24 giờ.","(2) Công cụ Kiểm định Hiệu quả Phòng vệ Kế toán Chuẩn IFRS 9 / US GAAP (Hedge Effectiveness Testing Engine): Tích hợp thuật toán hồi quy so sánh độ tương quan giữa biến động dòng tiền của khoản nợ vay thực tế và dòng tiền phái sinh, bảo đảm hợp đồng thỏa mãn chuẩn mực kế toán phòng hộ (Hedge Accounting), tránh làm biến động thất thường lợi nhuận kế toán trên Báo cáo Kết quả Kinh doanh.","(3) Giám sát Hạn mức Rủi ro Tín dụng Đối tác (Counterparty Exposure \u0026 Credit Support Annex - CSA Tracker): Tự động giám sát giá trị thị trường MTM của hợp đồng phái sinh; nếu giá trị hợp đồng nghiêng về phía Metropolitan vượt ngưỡng an toàn (ví dụ vượt 2 triệu USD), hệ thống tự động yêu cầu ngân hàng đối tác phải nộp tài sản thế chấp bổ sung (Collateral Margin Call) theo thỏa thuận CSA.","4.3. Business Analyst \u0026 Derivative Systems Executive Summary (Bản Tiếng Anh)","• End-to-End Interest Rate Derivative Context: Corporate liability hedging via ISDA Master Agreements bridges three operational workflows: (1) Underlying Loan Exposure: Metropolitan carries $100M floating-rate bank debt exposed to monetary tightening volatility; (2) Synthetic Overlay Transformation: Executing an independent interest rate swap pays fixed 4.25% and receives 3-month Term SOFR, perfectly offsetting floating liabilities into predictable fixed commitments; (3) Bilateral Netting Settlement: Enforcing ISDA Section 2(c) eliminates reciprocal gross transfers, settling only the net differential ($217,222.22) via interbank clearing, mitigating settlement counterparty exposure.","• Core Operational Bottleneck \u0026 Risk: Basis Risk and Counterparty Default Exposure. Discrepancies between loan benchmark conventions (Compounded SOFR) and derivative benchmarks (Term SOFR) create structural basis leakage. Furthermore, in an elevated interest rate cycle where the derivative is deeply in-the-money for the corporate borrower, counterparty default by the swap dealer would eliminate interest rate protection.","• Key BA \u0026 Capital Markets System Architecture Solutions:","(1) Algorithmic SOFR Rate-Capture \u0026 Netting Reconciliation Engine: Connect treasury systems via secure financial APIs to automated CME/Federal Reserve benchmark feeds, pre-calculating actual/360 day-fraction obligations and validating dealer netting statements 24 hours prior to settlement.","(2) IFRS 9 / ASC 815 Hedge Accounting Compliance Engine: Deploy automated regression and dollar-offset algorithms proving high hedge effectiveness between debt cash flows and swap receipts, insulating corporate P\u0026L from non-cash fair value fluctuations.","(3) Credit Support Annex (CSA) Daily Collateral Tracker: Automate mark-to-market derivative valuation tracking counterparty exposure; trigger automated collateral margin calls if dealer replacement liabilities exceed contractual thresholds.","4.4. Tam giác Liên kết Nhận thức Đa chiều (Multi-Perspective Contextual Anchoring)","1. Lăng kính Viễn thông \u0026 Quản trị Rủi ro Tỷ giá/Lãi suất Viettel: Bài toán quản trị danh mục vốn vay ngoại tệ (USD, EUR) của Viettel để đầu tư các dự án mạng viễn thông quốc tế: Tập đoàn sử dụng các hợp đồng phái sinh hoán đổi lãi suất (IRS) và hoán đổi tiền tệ chéo (Cross-Currency Swap) để khóa chi phí lãi vay cố định, loại bỏ hoàn toàn rủi ro khi Cục Dự trữ Liên bang Mỹ (Fed) tăng lãi suất đồng USD.","2. Lăng kính Quản trị Trường Mầm non Ước Mơ Xanh (cô Thu Huyền): Bài toán ký hợp đồng mua thực phẩm bán trú dài hạn với mức giá cố định: Cô Thu Huyền thỏa thuận với nhà cung cấp rau củ sạch một mức giá cố định 30.000 đồng/kg cho cả năm học; khi giá thị trường ngoài chợ tăng vọt lên 40.000 đồng/kg do mưa bão, nhà cung cấp vẫn phải bán đúng giá 30.000 đồng (hoặc bù tiền chênh lệch), giúp nhà trường luôn giữ vững ngân sách bữa ăn cho trẻ mà không phải tăng tiền ăn của phụ huynh.","3. Lăng kính Bàn học Gia đình (Kèm cặp học sinh Lớp 5 - Bé Hà Ngân): Bài học \u0027Đổi vé xe bus tháng cố định\u0027: Bố giải thích cho Hà Ngân vì sao nên mua vé xe bus tháng 100.000 đồng đi học thay vì trả vé ngày: nếu tháng đó trời mưa rét phải đi nhiều chuyến xe hoặc giá vé lẻ tăng, con vẫn chỉ mất đúng 100.000 đồng cố định (giống như hợp đồng hoán đổi lãi suất giúp doanh nghiệp luôn biết trước chính xác số tiền phải trả mà không lo thị trường tăng giá).","PHẦN 5: BẢNG TỪ VỰNG \u0026 CẤU TRÚC CỐT LÕI (8 THUẬT NGỮ PHÁI SINH \u0026 QUẢN TRỊ RỦI RO)","1. interest rate swap (n phr)  /ˈɪntrəst reɪt swɑːp/  = derivative interest exchange contract / fixed-to-floating liability swap","Nghia: Hợp đồng hoán đổi lãi suất (công cụ phái sinh trao đổi dòng tiền lãi cố định lấy thả nổi hoặc ngược lại)","Vd: The agency entered into an interest rate swap to convert its variable debt into fixed obligations. - Cơ quan này đã ký hợp đồng hoán đổi lãi suất để chuyển đổi các khoản nợ biến đổi thành nghĩa vụ cố định.","2. notional principal (n phr)  /ˈnoʊʃənl ˈprɪnsəpl/  = theoretical contract value / reference principal amount for calculating interest","Nghia: Vốn gốc danh nghĩa (số tiền quy ước dùng làm cơ sở tính tiền lãi trong hợp đồng phái sinh)","Vd: The notional principal amount of one hundred million dollars was never actually exchanged. - Khoản vốn gốc danh nghĩa 100 triệu USD chưa bao giờ thực sự được chuyển giao giữa hai bên.","3. netting (n)  /ˈnetɪŋ/  = offset settlement / payment consolidation / net balance remittance","Nghia: Thanh toán bù trừ ròng (cơ chế chỉ chuyển khoản số tiền chênh lệch giữa hai nghĩa vụ tài chính)","Vd: Contractual netting reduced transaction costs and eliminated reciprocal gross payments. - Cơ chế bù trừ ròng theo hợp đồng đã giảm thiểu chi phí giao dịch và loại bỏ các khoản chuyển tiền gộp qua lại.","4. hedge (v/n)  /hedʒ/  = protect against financial risk / risk mitigation contract / offset market exposure","Nghia: Phòng ngừa rủi ro / Hợp đồng bảo hiểm rủi ro tài chính","Vd: Corporations frequently hedge floating interest rate exposure using derivative instruments. - Các tập đoàn thường xuyên phòng ngừa rủi ro lãi suất thả nổi bằng các công cụ phái sinh.","5. fixed rate payer (n phr)  /fɪkst reɪt ˈpeɪər/  = counterparty obligated to pay predetermined constant interest","Nghia: Bên trả lãi suất cố định (trong hợp đồng hoán đổi lãi suất)","Vd: Metropolitan served as the fixed rate payer, remitting 4.25% per annum. - Metropolitan đóng vai trò là bên trả lãi suất cố định, thanh toán 4,25% mỗi năm.","6. floating rate payer (n phr)  /ˈfloʊtɪŋ reɪt ˈpeɪər/  = counterparty obligated to pay benchmark-linked variable interest","Nghia: Bên trả lãi suất thả nổi (bên chịu nghĩa vụ chi trả theo lãi suất cơ sở của thị trường)","Vd: The investment bank acted as the floating rate payer tied to three-month CME Term SOFR. - Ngân hàng đầu tư đóng vai trò là bên trả lãi suất thả nổi gắn liền với chỉ số CME Term SOFR kỳ hạn 3 tháng.","7. actual/360 day-count (n phr)  /ˈæktʃuəl θriː ˈsɪksti deɪ kaʊnt/  = money market interest convention based on actual elapsed days divided by 360","Nghia: Quy ước tính lãi ngày thực tế/360 ngày (chuẩn mực tính lãi phổ biến trong thị trường tiền tệ)","Vd: Interest for the ninety-two-day period was accrued on an actual/360 basis. - Tiền lãi cho kỳ tính toán 92 ngày được dồn tích trên cơ sở số ngày thực tế/360 ngày.","8. counterparty risk (n phr)  /ˈkaʊntərpɑːrti rɪsk/  = default risk of trading partner / risk that a contract partner fails to fulfill debt","Nghia: Rủi ro đối tác (nguy cơ đối tác trong hợp đồng tài chính không hoàn thành nghĩa vụ thanh toán)","Vd: Credit support annexes are established to mitigate bilateral counterparty risk. - Các phụ lục hỗ trợ tín dụng được thiết lập nhằm giảm thiểu rủi ro đối tác song phương.","==================================================================================================","BÀI 8: Biên bản Đại hội Cổ đông Thường niên (AGM Notice \u0026 Proxy), Kết quả Biểu quyết Ủy quyền \u0026 Phát hành Cổ phiếu Ưu đãi Chuyển đổi (Convertible Preferred Stock) (Questions 191-195 - Triple Passage)","Nguồn: ETS TOEIC Part 7 — Triple Passage (Annual Shareholder Proxy Notice, Certified Voting Results \u0026 CEO Capital Raising Update)","PHẦN 1: NỘI DUNG BÀI ĐỌC, CÂU HỎI \
