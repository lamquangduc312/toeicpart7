<title>T&#224;i ch&#237;nh &amp; Ng&#226;n h&#224;ng TOEIC 750+</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: cargo-manifest page. Hero with a 3x3 container stack (one container per lesson), sticky container-tab bar, lesson panel with side index of the 5 parts. */
:root{
  /* Tailwind-style neutrals + one primary (Blue 600) */
  --bg:#F9FAFB; --surface:#FFFFFF; --surface-2:#F3F4F6; --ink:#111827; --muted:#6B7280; --line:#E5E7EB;
  --paper:#FFFFFF;
  /* Coordinated palette: navy = governance/trust, cobalt = primary, magenta = errors,
     emerald = correct, ochre = clues & timing, Viettel red = brand marks, xanh mạ = outputs & chips */
  --navy:#102B66; --navy-2:#183B7E; --navy-ink:#102B66;
  --cobalt:#1E62D0; --cobalt-2:#2A7BE8;
  --magenta:#D71A4A; --magenta-2:#E52E5E;
  --emerald:#0A8558; --emerald-2:#12A16E;
  --ochre:#D87D0E; --ochre-2:#E8901C; --ochre-soft:#FDF1E1;
  --brand:var(--cobalt); --brand-soft:#DCE8FB; --vi:var(--navy-2);
  --red:#EE0033; --red-soft:#FFE4EA; --green:#5FA61B; --green-soft:#EAF6DC;
  --ok:var(--emerald); --bad:var(--magenta); --coral:var(--red); --coral-soft:var(--red-soft);
  --c1:var(--brand); --c2:var(--brand); --c3:var(--brand); --c4:var(--brand); --c5:var(--brand); --c6:var(--brand); --c7:var(--brand); --c8:var(--brand); --c9:var(--brand); --c10:var(--brand);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --shadow:0 1px 2px rgba(17,24,39,.05),0 6px 20px -8px rgba(17,24,39,.15);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#030712; --surface:#111827; --surface-2:#0B1120; --ink:#F9FAFB; --muted:#9CA3AF; --line:#1F2937;
  --vi:#9DBDF5; --paper:#111827; --navy-ink:#C9D7F4;
  --brand:var(--cobalt-2); --brand-soft:#132A55; --ochre-soft:#33220B;
  --ok:var(--emerald-2); --bad:var(--magenta-2);
  --red:#FF3B5F; --red-soft:#3B0A16; --green:#8BCF45; --green-soft:#1C2E0E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#030712; --surface:#111827; --surface-2:#0B1120; --ink:#F9FAFB; --muted:#9CA3AF; --line:#1F2937;
  --vi:#9DBDF5; --paper:#111827; --navy-ink:#C9D7F4;
  --brand:var(--cobalt-2); --brand-soft:#132A55; --ochre-soft:#33220B;
  --ok:var(--emerald-2); --bad:var(--magenta-2);
  --red:#FF3B5F; --red-soft:#3B0A16; --green:#8BCF45; --green-soft:#1C2E0E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{display:none}
.wrap{max-width:min(1600px,96vw);width:100%;margin:0 auto;padding-left:clamp(16px,2.5vw,40px);padding-right:clamp(16px,2.5vw,40px)}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--c) 70%,transparent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono)}

/* ---------- Hero ---------- */
.hero{padding-block:clamp(20px,3vw,36px);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.05fr);gap:clamp(20px,3vw,44px);align-items:center}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow b{color:var(--coral);font-weight:500}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3.2vw,44px);line-height:1.15;letter-spacing:-.01em;text-transform:uppercase;margin-top:10px;text-wrap:balance;word-break:break-word}
.hero h1 span{color:var(--red)}
.hero .en-sub{font-family:var(--f-display);font-weight:600;font-size:clamp(14px,1.5vw,18px);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.hero .desc{max-width:62ch;margin-top:16px;color:var(--muted);font-size:15px}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:24px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}

.yard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:620px;justify-self:end;width:100%}
.box{position:relative;min-height:76px;height:auto;aspect-ratio:auto;max-width:100%;border:1px solid var(--line);border-radius:12px;cursor:pointer;color:var(--ink);text-align:left;padding:8px 10px;background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;gap:4px;transition:transform .18s ease,background .18s,border-color .18s,box-shadow .18s}
.box:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 8px 20px -10px color-mix(in srgb,var(--brand) 60%,transparent)}
.box .n{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--brand)}
.box .qr{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.box .code{font-size:11.5px;font-weight:600;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;line-height:1.25;word-break:break-word}
.box.on{background:var(--brand);border-color:var(--brand);color:#fff}
.box.on .n,.box.on .qr,.box.on .code{color:#fff}
.box.alt .n{color:var(--coral)}

/* navy governance band behind the hero */
.hero-band{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff}
.hero-band .eyebrow{color:rgba(255,255,255,.7)}
.hero-band .eyebrow b{color:var(--ochre-2)}
.hero-band h1 span{color:var(--magenta-2)}
.hero-band .en-sub,.hero-band .desc,.hero-band .stat span{color:rgba(255,255,255,.74)}
.hero-band .stat b{color:#fff}
.hero-band .box{border-color:transparent}
.hero-band .box.on{background:var(--cobalt-2);border-color:#fff}

/* ---------- Tab bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-block:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:12px;padding-block:10px}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;flex:1;min-width:0;padding-bottom:2px;scroll-behavior:smooth}
.tab{--c:var(--c1);flex:0 0 auto;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 16px 5px 5px;cursor:pointer;text-align:left;transition:background .15s,border-color .15s}
.tab:hover{border-color:var(--c)}
.tab .door{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--c);font-family:var(--f-display);font-weight:800;font-size:16px;
  background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.tab .tl{display:flex;flex-direction:column;line-height:1.2}
.tab .tl b{font-size:13px;font-weight:600;white-space:nowrap}
.tab .tl small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#fff}
.tab[aria-selected="true"] .door{background:rgba(255,255,255,.22);color:#fff}
.tab[aria-selected="true"] .tl small{color:rgba(255,255,255,.82)}
.mode{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:0 0 auto;background:var(--surface-2)}
.mode button{border:0;background:none;padding:6px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--navy);color:#fff}

/* ---------- Lesson ---------- */
main{padding-block:28px 64px}
.lesson-head{--c:var(--c1);display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start;padding-bottom:24px;border-bottom:2px solid var(--navy-ink)}
.big-n{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,10vw,120px);line-height:.8;color:var(--c);letter-spacing:-.02em}
.big-n small{display:block;font-size:14px;letter-spacing:.2em;color:var(--muted);font-weight:600;margin-bottom:8px}
.lesson-head h2{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3.2vw,38px);line-height:1.05;text-transform:uppercase;color:var(--navy-ink)}
.lesson-head .en-t{font-family:var(--f-display);font-weight:600;font-size:clamp(15px,1.7vw,19px);color:var(--c);letter-spacing:.04em;margin-top:8px;text-transform:uppercase}
.src{display:inline-flex;gap:8px;align-items:center;margin-top:14px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.src b{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--c);letter-spacing:.06em}

.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:36px;margin-top:28px}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 82px);align-self:start;display:flex;flex-direction:column;gap:2px}
.toc a{display:flex;gap:10px;align-items:baseline;text-decoration:none;color:var(--muted);font-size:13.5px;padding:7px 10px;border-radius:6px;line-height:1.3}
.toc a b{font-family:var(--f-display);font-size:17px;color:var(--c);min-width:18px}
.toc a:hover,.toc a.on{background:var(--surface);color:var(--ink)}
.toc .toc-sub{padding-left:38px;font-size:12.5px}
.content{min-width:0;display:flex;flex-direction:column;gap:44px}

.part{display:flex;flex-direction:column;gap:22px;scroll-margin-top:96px}
.part-h{display:flex;gap:14px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px}
.part-h .pn{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.14em;color:#fff;background:var(--red);padding:3px 9px;border-radius:4px;white-space:nowrap}
.part-h h3{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.4vw,26px);text-transform:uppercase;line-height:1.1;color:var(--navy-ink)}
.sub{display:flex;flex-direction:column;gap:14px;scroll-margin-top:96px}
.sub-h{display:flex;gap:10px;align-items:baseline;font-weight:700;font-size:17px}
.sub-h .sn{font-family:var(--f-mono);font-size:12px;color:var(--c);font-weight:500}

/* strategy */
.strat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.strat-t{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;color:var(--c);text-transform:uppercase;line-height:1.5}
.steps{display:grid;gap:12px;counter-reset:s}
.step{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:start}
.step .when{font-family:var(--f-mono);font-size:11.5px;display:flex;flex-direction:column;gap:2px;border-right:2px solid var(--ochre);padding-right:10px}
.step .when span{color:var(--ochre)!important;font-weight:500}
.step .when b{font-family:var(--f-display);font-size:18px;font-weight:700;color:var(--ink)}
.step .when span{color:var(--muted)}
.step h5{margin:0 0 3px;font-size:14.5px;font-weight:700}
.step p{font-size:14.5px;color:var(--ink)}

/* passages = papers */
.papers{display:flex;flex-direction:column;gap:18px}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:22px 24px;display:flex;flex-direction:column;gap:9px;font-size:15px;position:relative}
.paper-tag{align-self:flex-start;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:3px;padding:2px 8px;margin-bottom:4px}
.ln-caps{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.04em;line-height:1.2}
.ln-kv{font-size:14px}
.ln-kv b{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted);margin-right:4px}
.ln-bul{padding-left:16px;position:relative}
.ln-bul::before{content:"";position:absolute;left:2px;top:.7em;width:6px;height:6px;background:var(--c);border-radius:1px}
.ln-sec{font-weight:700;margin-top:6px}
.ln-head{font-weight:700;margin-top:8px;color:var(--navy-ink)}
.ln-num{padding:2px 0 2px 14px;border-left:2px solid var(--brand);margin-left:2px}
.ln-num b{color:var(--brand)}
.ln-concl{background:var(--brand-soft);border-radius:6px;padding:8px 12px;font-size:14px}
.ln-concl b{color:var(--brand)}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:16px}
.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.score{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.score b{color:var(--ink);font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--c)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.q-stem{display:flex;gap:12px;font-weight:600}
.q-no{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--c);line-height:1.2;flex:0 0 auto}
.q-extra{font-style:italic;font-weight:400;color:var(--muted);margin-top:4px}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:8px 12px;cursor:pointer;font-size:14.5px;line-height:1.45;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--c)}
.opt .k{font-family:var(--f-mono);font-weight:500;font-size:13px;color:var(--c);flex:0 0 auto;margin-top:1px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surface))}
.opt.ok .k{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--surface))}
.opt.bad .k{color:var(--bad)}
.q-fb{font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.q-fb .r{font-weight:600}
.q-fb .r.ok{color:var(--ok)} .q-fb .r.bad{color:var(--bad)}
.q-fb a{color:var(--c)}

/* bilingual */
.bi-doc{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;color:var(--c);text-transform:uppercase;padding:10px 0 2px;border-top:1px dashed var(--line);margin-top:6px;line-height:1.5}
.bi-doc:first-child{border-top:0;margin-top:0;padding-top:0}
.bi{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--line)}
.pair:first-child{border-top:0}
.pair>div{padding:11px 16px;display:flex;flex-direction:column;gap:4px;font-size:14.5px;min-width:0}
.pair .en{color:var(--ink)}
.pair .vi{color:var(--vi);background:color-mix(in srgb,var(--vi) 5%,transparent);border-left:1px solid var(--line)}
.lang{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--muted);opacity:.8}
.bi-head{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-bottom:1px solid var(--line)}
.bi-head span{padding:7px 16px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted)}
.bi-head span+span{border-left:1px solid var(--line);color:var(--vi)}

.vi-t{color:var(--vi)}
/* recall mode blurs translations */
.recall .vi-r{filter:blur(6px);cursor:pointer;user-select:none;transition:filter .2s}
.recall .vi-r.peek{filter:none;user-select:auto}

/* question translation */
.qt{display:grid;gap:12px}
.qt-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.qt-card .stem{display:flex;gap:12px}
.qt-card .stem>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.qt-card .stem b{font-weight:600}
.qt-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;padding-left:44px}
.qt-opt{display:flex;gap:8px;font-size:14px;line-height:1.45}
.qt-opt>div{display:flex;flex-direction:column;min-width:0}
.qt-opt .k{font-family:var(--f-mono);color:var(--c);font-size:12.5px;margin-top:1px}
.qt-opt.correct .k{color:#fff;background:var(--ok);border-radius:3px;padding:0 4px;height:fit-content}

/* summary */
.sum{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.sum>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;font-size:14.5px;display:flex;flex-direction:column;gap:8px}
.ideas{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.ideas li{position:relative;padding-left:18px}
.ideas>li::before{content:"";position:absolute;left:3px;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--brand)}
.ideas ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.ideas ul li::before{content:"";position:absolute;left:4px;top:.75em;width:7px;height:1.5px;background:var(--muted)}

/* matrix */
.matrix{display:grid;gap:12px}
.mx{display:grid;grid-template-columns:200px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mx-l{padding:16px;background:color-mix(in srgb,var(--c) 9%,var(--surface));display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line)}
.mx-l .i{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--c)}
.mx-l b{font-size:14.5px;line-height:1.35}
.mx-l small{font-size:12.5px;color:var(--muted);line-height:1.35}
.mx-r{padding:14px 18px;display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.mx-r p{display:flex;gap:10px}
.mx-r .lang{flex:0 0 22px;margin-top:4px}

/* answers */
.ans{display:grid;gap:12px}
.an{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:100px}
.an.flash{animation:flash 1.4s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--c)}100%{box-shadow:0 0 0 0 transparent}}
.an-h{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.an-h .no{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--c)}
.an-h .key{font-family:var(--f-mono);font-weight:500;background:var(--ok);color:#fff;border-radius:4px;padding:1px 8px;font-size:13px}
.an-h .t{font-weight:600}
.trace{font-size:14px;border-left:3px solid var(--ochre);background:var(--ochre-soft);padding:9px 12px;border-radius:0 6px 6px 0;font-style:italic}
.trace .lbl{color:var(--ochre)}
.lbl{font-family:var(--f-mono);font-style:normal;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);display:block;margin-bottom:2px}
.expl{font-size:14.5px}
.an-stem{font-size:14px;color:var(--muted);margin-top:-4px}
.para{display:flex;flex-direction:column;gap:6px;font-size:14px}
.para .pr{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:start;background:var(--green-soft);border-radius:6px;padding:7px 10px}
.para .pr i{font-style:normal;color:var(--green);font-weight:700}
.para .pr span:last-child{font-weight:600}
.wrong{display:grid;gap:8px}
.wr{border:1px solid var(--line);border-radius:8px;padding:9px 12px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.wr-h{display:flex;gap:8px;align-items:baseline}
.wr-h b{font-family:var(--f-mono);font-weight:500;color:var(--bad);font-size:13px}
.wr-h span{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--bad) 55%,transparent);color:var(--muted)}
.trap{align-self:flex-start;font-size:12px;font-weight:600;color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);border-radius:4px;padding:2px 8px}
.ln-sub{padding-left:30px;position:relative;font-size:14px}
.ln-sub::before{content:"";position:absolute;left:16px;top:.75em;width:6px;height:1.5px;background:var(--muted)}
.ln-sub b{color:var(--navy-ink)}

/* workflow */
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;position:relative}
.fstep{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;position:relative}
.fstep:not(:last-child)::after{content:"";position:absolute;right:-12px;top:30px;width:10px;height:10px;border-top:2px solid var(--c);border-right:2px solid var(--c);transform:rotate(45deg);z-index:1}
.fstep h5{margin:0;font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.15;text-transform:uppercase}
.fstep h5 span{display:block;font-size:12px;color:var(--c);letter-spacing:.14em}
.fkv{font-size:13.5px;display:flex;flex-direction:column;gap:1px}
.fkv b{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fkv.out{background:var(--green-soft);border-radius:6px;padding:8px 10px}
.fkv.out b{color:var(--green)}
.ba{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.ba>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;font-size:14.5px;display:flex;flex-direction:column;gap:8px}
.ba h5{margin:0;font-size:14px;font-weight:700}

/* vocab */
.vocab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.vc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:9px}
.vc-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.vc-h .vn{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.vc-h h5{margin:0;font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.05}
.ipa{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chips .eq{font-family:var(--f-mono);font-size:12px;color:var(--c);margin-right:2px}
.chip{font-size:12.5px;border:1px solid color-mix(in srgb,var(--green) 45%,var(--line));color:var(--ink);border-radius:999px;padding:1px 9px;background:var(--green-soft)}
.chips .eq{color:var(--green)}
.vc .mean{font-size:14px;font-weight:500}
.vc .ex{font-size:13.5px;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:3px}
.vc .ex i{font-style:italic}

/* 50 pairs */
.pp-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pp-tools input{flex:1;min-width:0;max-width:420px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;font:inherit;font-size:14.5px;color:var(--ink)}
.tbl-w{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th{text-align:left;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--navy);padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;width:52px}
td.t{font-weight:600}
td.p{color:var(--muted)}
td.m{color:var(--vi)}
tbody tr:hover td{background:var(--surface-2)}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:8px;flex-wrap:wrap}
.pager button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 16px;cursor:pointer;min-width:0;max-width:48%;text-align:left}
.pager button:hover{border-color:var(--ink)}
.pager button small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pager button b{font-size:14px}
.pager .next{margin-left:auto;align-items:flex-end;text-align:right}
footer{border-top:1px solid var(--line);padding-block:20px 32px;color:var(--muted);font-size:12.5px}

<script type="application/json" id="src">["CHUYÊN ĐỀ ĐỌC HIỂU TOEIC PART 7: TÀI CHÍNH DOANH NGHIỆP, PHÂN TÍCH ĐẦU TƯ, CÔNG CỤ NGÂN HÀNG \u0026 BÁO CÁO THƯỜNG NIÊN","CORPORATE FINANCE, INVESTMENT ANALYSIS, BANKING INSTRUMENTS \u0026 ANNUAL REPORTS — PHƯƠNG PHÁP FEYNMAN SONG NGỮ, ACTIVE RECALL 5S, TRUY XUẤT CHÉO \u0026 SPACED REPETITION ANKI (10 BÀI ĐOẠN 2 \u0026 3 VĂN BẢN — 50 CÂU HỎI)","==================================================================================================","BÀI 1: Báo cáo Thường niên (Annual Report \u0026 Shareholder Letter), Bảng Kết quả Kinh doanh Hợp nhất (Consolidated Statement of Earnings) \u0026 Báo cáo Phân tích Chứng khoán (Equity Research Analyst Note) (Questions 186-190 - Triple Passage)","Nguồn: ETS TOEIC Part 7 — Triple Passage (Shareholder Letter, Consolidated Statement of Earnings \u0026 Equity Research Note)","PHẦN 1: NỘI DUNG BÀI ĐỌC, CÂU HỎI \u0026 BẢN DỊCH SONG NGỮ","1.1. Đề thi Tiếng Anh gốc (Strategy Guide \u0026 Original ETS Passages)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","Questions 186-190 refer to the following shareholder letter, financial statement, and equity research note.","[Passage 1: Shareholder Letter — Valenta Consumer Brands Corp. Annual Report]","VALENTA CONSUMER BRANDS CORPORATION","Annual Report to Shareholders — Fiscal Year Ended September 30","To Our Valued Shareholders:","Fiscal year 2025 represented a pivotal transition for Valenta Consumer Brands. In response to shifting consumer preferences and inflationary headwinds in raw materials, we accelerated our multi-year supply chain consolidation initiative and streamlined our direct-to-consumer digital channels.","While our top-line revenue expanded by 8.5% year-over-year to reach $480 million, our operating margin experienced temporary compression due to one-time restructuring charges and severance costs totaling $14.2 million associated with the decommissioning of our older packaging facility in Cincinnati. However, excluding these non-recurring items, our core operating cash flows remain exceptionally robust.","Looking ahead to fiscal 2026, we anticipate gross margin recovery driven by automated fulfillment centers in Dallas and Atlanta. Furthermore, our Board of Directors has reaffirmed our commitment to shareholder returns by maintaining our regular quarterly dividend of $0.35 per share and authorizing a new $25 million share repurchase program. We extend our sincere gratitude to our global workforce, customers, and long-term investors for their unwavering dedication.","Sincerely,","Marcus Sterling","Chief Executive Officer, Valenta Consumer Brands Corporation","[Passage 2: Financial Statement Excerpt — Valenta Consumer Brands Corp.]","VALENTA CONSUMER BRANDS CORPORATION","Consolidated Statement of Earnings (Selected Data)","(Amounts in millions of USD, except per-share data)","Financial Metric | FY 2023 | FY 2024 | FY 2025","Total Net Revenue | $410.0 | $442.4 | $480.0","Cost of Goods Sold (COGS) | $246.0 | $265.4 | $292.8","Gross Profit | $164.0 | $177.0 | $187.2","Selling, General \u0026 Administrative (SG\u0026A) | $98.4 | $106.2 | $115.2","Facility Restructuring \u0026 Severance Expense | $0.0 | $0.0 | $14.2","Operating Income (EBIT) | $65.6 | $70.8 | $57.8","Interest Expense \u0026 Financing Costs | $6.2 | $5.8 | $5.4","Income Before Income Taxes | $59.4 | $65.0 | $52.4","Income Tax Expense | $14.8 | $16.2 | $13.1","Consolidated Net Income | $44.6 | $48.8 | $39.3","Diluted Earnings Per Share (EPS) | $2.23 | $2.44 | $1.96","Weighted-Average Common Shares Outstanding | 20.0M | 20.0M | 20.0M","*Note: Operating cash flow generated during FY 2025 was $68.4 million, reflecting strong working capital optimization.","[Passage 3: Equity Research Analyst Note — Horizon Capital Markets]","HORIZON CAPITAL MARKETS — EQUITY RESEARCH","Company Update: Valenta Consumer Brands (NYSE: VCB)","Rating: Downgrade from BUY to HOLD | 12-Month Target Price: $38.00 (from $46.00)","Date: November 12 | Senior Analyst: Clara Vance, CFA","Investment Thesis \u0026 Earnings Analysis:","Valenta reported fiscal 2025 results that demonstrated resilient customer demand but underscored short-term margin erosion. Diluted EPS fell to $1.96, missing the consensus Wall Street estimate of $2.15 by $0.19. The decline was heavily influenced by the Cincinnati plant shutdown costs.","While management portrays the $14.2 million restructuring expense as strictly transitory, we note that gross margin contracted from 40.0% in FY 2024 to 39.0% in FY 2025, signaling persistent fulfillment and freight cost pressures. At the current share price of $42.50, Valenta trades at a forward P/E multiple of 19.5x our revised FY 2026 EPS forecast of $2.18, representing a full valuation relative to packaged food peers trading at 16.8x.","We would turn constructive on the stock if management demonstrates faster margin expansion from the new Dallas and Atlanta automation hubs or announces the divestiture of its low-margin non-core beverage division. Until such visibility emerges, we advise institutional clients to maintain a neutral positioning.","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","186. What was a primary factor that reduced Valenta\u0027s reported operating income in FY 2025?","(A) An unprecedented surge in corporate income tax rates","(B) One-time expenses related to closing a packaging plant","(C) A sharp contraction in total net sales revenue","(D) Significant losses incurred from derivative financial instruments","187. According to the financial statement, what was Valenta\u0027s operating income (EBIT) in FY 2024?","(A) $39.3 million","(B) $48.8 million","(C) $57.8 million","(D) $70.8 million","188. What does Ms. Vance recommend that investors do regarding Valenta\u0027s shares?","(A) Sell their entire holding immediately to avoid insolvency","(B) Maintain their current holdings without increasing positions","(C) Purchase additional shares before the upcoming dividend record date","(D) Vote against the re-election of Marcus Sterling at the AGM","189. In the equity research note, what is indicated about Valenta\u0027s valuation compared to industry peers?","(A) It trades at a lower price-to-earnings multiple than rival firms.","(B) Its debt-to-equity ratio exceeds statutory regulatory ceilings.","(C) It is valued at a higher multiple than the peer group average.","(D) Its dividend yield is the highest among consumer brand companies.","190. Which corporate action would likely cause Horizon Capital Markets to upgrade its rating on Valenta?","(A) Selling off its underperforming non-core beverage business","(B) Canceling the newly authorized $25 million share buyback program","(C) Reopening the decommissioned packaging facility in Cincinnati","(D) Increasing annual capital expenditures in overseas packaging plants","1.2. Hướng dẫn làm bài Part 7","CHIẾN THUẬT 5 PHÚT TỐI ƯU: NẮM BẮT BỐI CẢNH, GHÉP NỐI DỮ KIỆN \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Luồng sự việc (Quỹ đạo Quét chữ Z \u0026 3 Câu hỏi Tiềm thức): • Văn bản 1 (Thư gửi Cổ đông): Quét Tiêu đề + Chữ ký Marcus Sterling, CEO. Nhận diện bối cảnh: Doanh thu năm 2025 tăng 8.5% đạt 480 triệu USD, nhưng lợi nhuận bị ép tạm thời do chi phí tái cấu trúc nhà máy Cincinnati 14.2 triệu USD; duy trì cổ tức $0.35/quý và mua lại 25 triệu USD cổ phiếu.","• Văn bản 2 (Bảng Kết quả Kinh doanh): Bảng số liệu 3 năm (2023-2025): Doanh thu tăng từ $410M -\u003e $442.4M -\u003e $480M; EBIT giảm từ $70.8M xuống $57.8M do chi phí bất thường $14.2M; Lợi nhuận ròng đạt $39.3M, EPS đạt $1.96.","• Văn bản 3 (Báo cáo Phân tích Chứng khoán): Chuyên gia Clara Vance hạ khuyến nghị từ BUY xuống HOLD, mục tiêu $38; nhận định P/E dự phóng 19.5x đắt hơn trung bình ngành 16.8x; đề xuất thoái vốn mảng đồ uống không cốt lõi để nâng biên lợi nhuận.","=\u003e Luồng sự việc: Doanh nghiệp tăng trưởng doanh thu nhưng biên lợi nhuận thu hẹp vì tái cơ cấu -\u003e Báo cáo tài chính phản ánh EPS giảm -\u003e Công ty chứng khoán hạ xếp hạng cổ phiếu và chờ đợi tín hiệu thoái vốn hoặc tự động hóa kho.","Bước 2 (20 giây) - Quét nhanh 5 câu hỏi \u0026 Gắn móc từ khóa: • Câu 186: Yếu tố làm giảm EBIT FY 2025 (Từ khóa: primary factor, reduced operating income, FY 2025).","• Câu 187: Operating income năm 2024 là bao nhiêu (Từ khóa: operating income EBIT, FY 2024).","• Câu 188: Khuyến nghị của bà Vance với cổ phiếu (Từ khóa: Ms. Vance recommend, shares).","• Câu 189: Định giá của Valenta so với các đối thủ cùng ngành (Từ khóa: valuation, compared to industry peers).","• Câu 190: Hành động nào khiến Horizon nâng hạng khuyến nghị (Từ khóa: cause upgrade rating, corporate action).","Bước 3 (3 phút 45 giây) - Giải cuốn chiếu \u0026 Khóa đáp án: • Câu 186 (Chi tiết - VB1 \u0026 VB2): Chi phí đóng cửa nhà máy Cincinnati và trợ cấp thôi việc $14.2M -\u003e Chọn (B).","• Câu 187 (Chi tiết - Bảng VB2): Dòng \u0027Operating Income (EBIT)\u0027 cột FY 2024 ghi rõ $70.8 million -\u003e Chọn (D).","• Câu 188 (Chi tiết - VB3): Hạ từ BUY xuống HOLD (\u0027advise institutional clients to maintain a neutral positioning\u0027) -\u003e Chọn (B) giữ nguyên không mua thêm.","• Câu 189 (Ghép nối - VB3): Valenta giao dịch ở mức P/E 19.5x trong khi trung bình ngành là 16.8x -\u003e Đắt hơn / Định giá cao hơn đối thủ -\u003e Chọn (C).","• Câu 190 (Chi tiết - VB3 đoạn cuối): \u0027turn constructive on the stock if management... announces the divestiture of its low-margin non-core beverage division\u0027 -\u003e Chọn (A) Bán mảng đồ uống không cốt lõi.","Bước 4 (25 giây) - Rà soát \u0026 Đúc kết Feynman: Tự đúc kết 1 câu: Valenta bị sụt giảm lợi nhuận kế toán do gánh chi phí đóng nhà máy cũ 14.2 triệu USD, khiến định giá P/E trở nên đắt đỏ so với ngành và bị phân tích viên hạ xếp hạng xuống HOLD cho đến khi bán xong mảng kinh doanh thừa thãi.","1.3. Dịch Song ngữ Xen kẽ Từng Câu (Sentence-by-Sentence Translation)","[Văn bản 1: Thư gửi Cổ đông — Báo cáo Thường niên Tập đoàn Valenta]","VALENTA CONSUMER BRANDS CORPORATION","Annual Report to Shareholders — Fiscal Year Ended September 30","To Our Valued Shareholders:","TẬP ĐOÀN HÀNG TIÊU DÙNG VALENTA","Báo cáo Thường niên Gửi Cổ đông — Niên độ Tài chính Kết thúc Ngày 30 Tháng 9","Kính gửi Quý Cổ đông:","Fiscal year 2025 represented a pivotal transition for Valenta Consumer Brands.","Năm tài chính 2025 đánh dấu một giai đoạn chuyển dịch mang tính then chốt đối với Hàng tiêu dùng Valenta.","In response to shifting consumer preferences and inflationary headwinds in raw materials, we accelerated our multi-year supply chain consolidation initiative and streamlined our direct-to-consumer digital channels.","Nhằm thích ứng với sự thay đổi trong thị hiếu của người tiêu dùng và áp lực lạm phát chi phí nguyên liệu thô, chúng tôi đã đẩy nhanh sáng kiến hợp nhất chuỗi cung ứng nhiều năm và tinh gọn các kênh kỹ thuật số bán hàng trực tiếp tới người tiêu dùng.","While our top-line revenue expanded by 8.5% year-over-year to reach $480 million, our operating margin experienced temporary compression due to one-time restructuring charges and severance costs totaling $14.2 million associated with the decommissioning of our older packaging facility in Cincinnati.","Mặc dù doanh thu thuần tổng thể tăng trưởng 8,5% so với cùng kỳ năm trước để đạt mức 480 triệu USD, biên lợi nhuận hoạt động của chúng tôi đã chịu sự thu hẹp tạm thời do các chi phí tái cấu trúc một lần và chi phí trợ cấp thôi việc với tổng trị giá 14,2 triệu USD liên quan đến việc đóng cửa nhà máy đóng gói cũ tại Cincinnati.","However, excluding these non-recurring items, our core operating cash flows remain exceptionally robust.","Tuy nhiên, nếu loại trừ các khoản mục phát sinh không thường xuyên này, dòng tiền từ hoạt động kinh doanh cốt lõi của chúng tôi vẫn duy trì mức độ dồi dào và vững chắc đặc biệt.","Looking ahead to fiscal 2026, we anticipate gross margin recovery driven by automated fulfillment centers in Dallas and Atlanta.","Hướng tới năm tài chính 2026, chúng tôi dự báo biên lợi nhuận gộp sẽ phục hồi mạnh mẽ nhờ sự đóng góp của các trung tâm xử lý đơn hàng tự động tại Dallas và Atlanta.","Furthermore, our Board of Directors has reaffirmed our commitment to shareholder returns by maintaining our regular quarterly dividend of $0.35 per share and authorizing a new $25 million share repurchase program.","Hơn nữa, Hội đồng Quản trị đã tái khẳng định cam kết tối đa hóa lợi nhuận cho cổ đông bằng việc duy trì mức chi trả cổ tức định kỳ hàng quý là 0,35 USD cho mỗi cổ phần và phê duyệt chương trình mua lại cổ phiếu quỹ mới trị giá 25 triệu USD.","We extend our sincere gratitude to our global workforce, customers, and long-term investors for their unwavering dedication.","Marcus Sterling, Chief Executive Officer","Chúng tôi xin gửi lời cảm ơn chân thành sâu sắc nhất tới toàn thể cán bộ nhân viên toàn cầu, quý khách hàng và các nhà đầu tư dài hạn vì sự tận tâm kiên định.","Marcus Sterling, Tổng Giám đốc Điều hành","[Văn bản 2: Trích lục Báo cáo Tài chính — Bảng Kết quả Kinh doanh Hợp nhất]","VALENTA CONSUMER BRANDS CORPORATION","Consolidated Statement of Earnings (Selected Data)","(Amounts in millions of USD, except per-share data)","TẬP ĐOÀN HÀNG TIÊU DÙNG VALENTA","Bảng Kết quả Kinh doanh Hợp nhất (Dữ liệu Chọn lọc)","(Các số liệu tính theo triệu USD, ngoại trừ dữ liệu trên mỗi cổ phần)","Total Net Revenue: FY 2023: $410.0M | FY 2024: $442.4M | FY 2025: $480.0M","Tổng Doanh thu Thuần: Năm 2023: 410,0 triệu USD | Năm 2024: 442,4 triệu USD | Năm 2025: 480,0 triệu USD","Cost of Goods Sold (COGS): FY 2023: $246.0M | FY 2024: $265.4M | FY 2025: $292.8M","Gross Profit: FY 2023: $164.0M | FY 2024: $177.0M | FY 2025: $187.2M","Giá vốn Hàng bán (COGS): Năm 2023: 246,0 triệu USD | Năm 2024: 265,4 triệu USD | Năm 2025: 292,8 triệu USD","Lợi nhuận Gộp: Năm 2023: 164,0 triệu USD | Năm 2024: 177,0 triệu USD | Năm 2025: 187,2 triệu USD","Selling, General \u0026 Administrative (SG\u0026A): FY 2023: $98.4M | FY 2024: $106.2M | FY 2025: $115.2M","Facility Restructuring \u0026 Severance Expense: FY 2023: $0.0M | FY 2024: $0.0M | FY 2025: $14.2M","Chi phí Bán hàng \u0026 Quản lý Doanh nghiệp (SG\u0026A): Năm 2023: 98,4 triệu USD | Năm 2024: 106,2 triệu USD | Năm 2025: 115,2 triệu USD","Chi phí Tái cấu trúc Cơ sở \u0026 Trợ cấp Thôi việc: Năm 2023: 0,0 triệu USD | Năm 2024: 0,0 triệu USD | Năm 2025: 14,2 triệu USD","Operating Income (EBIT): FY 2023: $65.6M | FY 2024: $70.8M | FY 2025: $57.8M","Consolidated Net Income: FY 2023: $44.6M | FY 2024: $48.8M | FY 2025: $39.3M","Lợi nhuận Thuần từ Hoạt động Kinh doanh (EBIT): Năm 2023: 65,6 triệu USD | Năm 2024: 70,8 triệu USD | Năm 2025: 57,8 triệu USD","Lợi nhuận Ròng Hợp nhất: Năm 2023: 44,6 triệu USD | Năm 2024: 48,8 triệu USD | Năm 2025: 39,3 triệu USD","Diluted Earnings Per Share (EPS): FY 2023: $2.23 | FY 2024: $2.44 | FY 2025: $1.96","Weighted-Average Common Shares: 20.0M","Lãi Pha loãng trên Mỗi Cổ phần (EPS): Năm 2023: 2,23 USD | Năm 2024: 2,44 USD | Năm 2025: 1,96 USD","Số lượng Cổ phần Phổ thông Lưu hành Bình quân: 20,0 triệu cổ phiếu","[Văn bản 3: Báo cáo Đánh giá của Chuyên gia Phân tích Chứng khoán — Horizon Capital Markets]","HORIZON CAPITAL MARKETS — EQUITY RESEARCH","Company Update: Valenta Consumer Brands (NYSE: VCB)","Rating: Downgrade from BUY to HOLD | 12-Month Target Price: $38.00 (from $46.00)","Date: November 12 | Senior Analyst: Clara Vance, CFA","CÔNG TY CHỨNG KHOÁN THỊ TRƯỜNG VỐN HORIZON — NGHIÊN CỨU PHÂN TÍCH CỔ PHIẾU","Bản tin Cập nhật Doanh nghiệp: Hàng tiêu dùng Valenta (Mã niêm yết NYSE: VCB)","Xếp hạng: Hạ khuyến nghị từ MUA xuống NẮM GIỮ | Giá Mục tiêu 12 Tháng: 38,00 USD (từ mức 46,00 USD)","Ngày: 12 tháng 11 | Chuyên gia Phân tích Cấp cao: Clara Vance, CFA","Valenta reported fiscal 2025 results that demonstrated resilient customer demand but underscored short-term margin erosion.","Valenta đã công bố kết quả năm tài chính 2025 cho thấy nhu cầu tiêu dùng của khách hàng vẫn duy trì kiên cường nhưng lại làm nổi bật lên sự suy giảm biên lợi nhuận trong ngắn hạn.","Diluted EPS fell to $1.96, missing the consensus Wall Street estimate of $2.15 by $0.19. The decline was heavily influenced by the Cincinnati plant shutdown costs.","Lãi pha loãng trên mỗi cổ phần (EPS) sụt giảm xuống 1,96 USD, thấp hơn 0,19 USD so với mức dự báo đồng thuận của Phố Wall là 2,15 USD. Sự sụt giảm này chịu ảnh hưởng lớn từ các chi phí đóng cửa nhà máy tại Cincinnati.","While management portrays the $14.2 million restructuring expense as strictly transitory, we note that gross margin contracted from 40.0% in FY 2024 to 39.0% in FY 2025, signaling persistent fulfillment and freight cost pressures.","Mặc dù ban điều hành mô tả khoản chi phí tái cơ cấu 14,2 triệu USD chỉ mang tính chất nhất thời, chúng tôi ghi nhận rằng biên lợi nhuận gộp đã co hẹp từ 40,0% trong năm 2024 xuống còn 39,0% trong năm 2025, báo hiệu áp lực dai dẳng về chi phí vận chuyển và hoàn tất đơn hàng.","At the current share price of $42.50, Valenta trades at a forward P/E multiple of 19.5x our revised FY 2026 EPS forecast of $2.18, representing a full valuation relative to packaged food peers trading at 16.8x.","Ở mức giá cổ phiếu hiện tại là 42,50 USD, Valenta đang được giao dịch ở hệ số P/E dự phóng 19,5 lần dựa trên dự báo EPS năm 2026 đã điều chỉnh của chúng tôi là 2,18 USD, đại diện cho mức định giá đã phản ánh hết giá trị so với các đối thủ ngành thực phẩm đóng gói đang giao dịch ở mức 16,8 lần.","We would turn constructive on the stock if management demonstrates faster margin expansion from the new Dallas and Atlanta automation hubs or announces the divestiture of its low-margin non-core beverage division.","Chúng tôi sẽ chuyển sang quan điểm tích cực đối với cổ phiếu nếu ban lãnh đạo chứng minh được tốc độ mở rộng biên lợi nhuận nhanh hơn từ các trung tâm tự động hóa mới tại Dallas và Atlanta hoặc công bố kế hoạch thoái vốn khỏi mảng kinh doanh đồ uống không cốt lõi có biên lợi nhuận thấp.","Until such visibility emerges, we advise institutional clients to maintain a neutral positioning.","Cho đến khi những triển vọng rõ ràng như vậy xuất hiện, chúng tôi khuyến nghị các khách hàng tổ chức nên duy trì trạng thái đầu tư trung lập (Nắm giữ).","1.4. Dịch chi tiết Câu hỏi \u0026 Phương án Trắc nghiệm","Câu 186. Yếu tố chính yếu nào đã làm giảm lợi nhuận thuần từ hoạt động kinh doanh được báo cáo của Valenta trong năm tài chính 2025?","(A) Sự tăng đột biến chưa từng có về thuế suất thu nhập doanh nghiệp","(B) Các khoản chi phí một lần liên quan đến việc đóng cửa nhà máy đóng gói","(C) Sự suy giảm nghiêm trọng trong tổng doanh thu thuần bán hàng","(D) Các khoản thua lỗ đáng kể phát sinh từ công cụ tài chính phái sinh","Câu 187. Theo bảng báo cáo tài chính, lợi nhuận thuần từ hoạt động kinh doanh (EBIT) của Valenta trong năm 2024 là bao nhiêu?","(A) 39,3 triệu USD","(B) 48,8 triệu USD","(C) 57,8 triệu USD","(D) 70,8 triệu USD","Câu 188. Bà Vance khuyến nghị các nhà đầu tư nên làm gì đối với số cổ phần nắm giữ tại Valenta?","(A) Bán toàn bộ số cổ phiếu đang nắm giữ ngay lập tức để tránh nguy cơ phá sản","(B) Duy trì số lượng cổ phần hiện tại mà không mua gia tăng thêm vị thế","(C) Mua thêm cổ phiếu trước ngày chốt quyền chia cổ tức sắp tới","(D) Bỏ phiếu phản đối việc tái đắc cử của ông Marcus Sterling tại kỳ họp Đại hội đồng cổ đông","Câu 189. Trong bản phân tích nghiên cứu cổ phiếu, điều gì được chỉ ra về định giá của Valenta so với các đối thủ cùng ngành?","(A) Cổ phiếu đang được giao dịch ở hệ số giá trên thu nhập (P/E) thấp hơn các công ty đối thủ.","(B) Tỷ lệ nợ trên vốn chủ sở hữu vượt quá trần quy định của luật pháp.","(C) Cổ phiếu đang được định giá ở hệ số cao hơn so với mức trung bình của nhóm doanh nghiệp cùng ngành.","(D) Tỷ suất cổ tức của công ty là cao nhất trong số các công ty hàng tiêu dùng.","Câu 190. Hành động chiến lược doanh nghiệp nào nhiều khả năng sẽ khiến Công ty Chứng khoán Horizon nâng mức xếp hạng khuyến nghị đối với Valenta?","(A) Bán thoái vốn mảng kinh doanh đồ uống không cốt lõi hoạt động kém hiệu quả","(B) Hủy bỏ chương trình mua lại cổ phiếu trị giá 25 triệu USD mới được phê duyệt","(C) Mở cửa hoạt động trở lại cơ sở đóng gói đã ngừng vận hành tại Cincinnati","(D) Tăng chi tiêu vốn đầu tư hàng năm vào các nhà máy đóng gói ở nước ngoài","1.5. Tóm tắt Viết lại Toàn bài theo Feynman (Feynman Monograph Summary)","English Executive Summary:","• Strategic Transition \u0026 Earnings Results: In its FY 2025 Annual Report, Valenta Consumer Brands expanded net revenue by 8.5% to $480.0M, but operating income contracted to $57.8M (and diluted EPS to $1.96) after absorbing $14.2M in one-time severance and facility decommissioning charges for its Cincinnati packaging plant.","• Capital Allocation \u0026 Shareholder Returns: Management reaffirmed balance sheet stability with $68.4M in operating cash flow, sustaining its regular $0.35 quarterly dividend ($1.40 annualized) and authorizing an accretive $25M share buyback plan to offset earnings dilution.","• Wall Street Reaction \u0026 Valuation Downgrade: Horizon Capital Markets downgraded the stock from BUY to HOLD (lowering its target price to $38.00), noting that Valenta\u0027s forward P/E multiple of 19.5x is overextended compared to peer averages of 16.8x, and stating that an upgrade requires tangible margin expansion from automated hubs in Dallas/Atlanta or the complete divestiture of its low-margin non-core beverage division.","Bản tóm tắt Tiếng Việt cốt lõi:","• Chuyển dịch Chiến lược \u0026 Kết quả Kinh doanh: Trong Báo cáo Thường niên năm tài chính 2025, Tập đoàn Hàng tiêu dùng Valenta đạt doanh thu 480,0 triệu USD (tăng trưởng 8,5%), nhưng lợi nhuận hoạt động EBIT giảm xuống 57,8 triệu USD và EPS giảm còn 1,96 USD do gánh khoản chi phí bất thường 14,2 triệu USD để đóng cửa nhà máy cũ ở Cincinnati.","• Phân bổ Nguồn vốn \u0026 Cổ tức: Ban điều hành giữ vững tính thanh khoản với 68,4 triệu USD dòng tiền kinh doanh, duy trì mức cổ tức 0,35 USD/cổ phiếu/quý và phê duyệt gói mua lại cổ phiếu quỹ 25 triệu USD nhằm gia tăng giá trị cho cổ đông dài hạn.","• Phản ứng Thị trường Vốn \u0026 Hạ bậc Định giá: Công ty Chứng khoán Horizon hạ xếp hạng từ MUA xuống NẮM GIỮ (hạ giá mục tiêu xuống 38 USD), nhận định định giá P/E dự phóng 19,5 lần là đắt đỏ so với trung bình ngành (16,8 lần); chuyên gia chỉ nâng hạng khi Valenta phục hồi biên lợi nhuận nhờ kho tự động hoặc bán thoái vốn mảng đồ uống không cốt lõi.","PHẦN 2: ACTIVE RECALL 5 GIÂY (BẢNG MA TRẬN ĐỊNH VỊ SONG NGỮ)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["1. Đối tượng \u0026 Vai trò: Marcus Sterling (CEO Valenta công bố Báo cáo thường niên giải trình chi phí tái cấu trúc tạm thời) \u003c-\u003e Ban Tài chính Kế toán (Lập Bảng kết quả kinh doanh so sánh 3 năm) \u003c-\u003e Clara Vance, CFA (Chuyên gia phân tích chứng khoán Horizon Capital hạ khuyến nghị xuống NẮM GIỮ do P/E cao).","1. Stakeholders \u0026 Roles: Marcus Sterling (Valenta CEO issuing Annual Report explaining transitory restructuring charges) \u003c-\u003e Corporate Finance Division (Compiling 3-year comparative earnings statement) \u003c-\u003e Clara Vance, CFA (Horizon Equity Research analyst downgrading stock to HOLD on full valuation)."]],[["2. Boi canh \u0026 Quy trinh loi"],["2. Bối cảnh \u0026 Quy trình lõi: Công bố Thông tin Tài chính Niên độ \u0026 Đánh giá Định giá Thị trường Vốn: Doanh nghiệp ghi nhận doanh thu kỷ lục nhưng lợi nhuận kế toán sụt giảm do chi phí tái cơ cấu nhà máy đóng gói -\u003e Giới đầu tư tổ chức đánh giá lại hệ số P/E dự phóng so với mặt bằng ngành hàng tiêu dùng.","2. Business Context \u0026 Core Flow: Annual Financial Reporting \u0026 Capital Market Valuation: Company reports record revenue but compressed accounting earnings from plant closure costs -\u003e Institutional research reassesses forward P/E multiples relative to consumer packaged goods peers."]],[["3. Dau vet suy luan cheo"],["3. Dấu vết suy luận chéo: Chi phí bất thường $14.2M (VB1) xuất hiện ở dòng \u0027Facility Restructuring\u0027 (VB2) -\u003e Kéo EBIT giảm từ $70.8M xuống $57.8M -\u003e VB3 chỉ rõ EPS giảm về $1.96 khiến P/E đạt 19.5x (cao hơn ngành 16.8x), dẫn đến quyết định hạ khuyến nghị xuống HOLD.","3. Key Cross-Referencing Clues: The $14.2M one-time cost (Passage 1) aligns with the \u0027Facility Restructuring\u0027 line (Passage 2) -\u003e Suppressing EBIT from $70.8M to $57.8M -\u003e Passage 3 highlights EPS dropping to $1.96, pushing forward P/E to 19.5x (vs. peer 16.8x), justifying the rating cut to HOLD."]]],"t":"table"},"PHẦN 3: ĐÁP ÁN CHUẨN XÁC \u0026 DẤU VẾT TRUY XUẤT CHÉO (CROSS-REFERENCING \u0026 TRAP BREAKDOWN)","186. What was a primary factor that reduced Valenta\u0027s reported operating income in FY 2025?","Dap an dung: (B) One-time expenses related to closing a packaging plant","[Dau vet bai doc / Clue]: Văn bản 1 (Thư Cổ đông), Đoạn 2: \u0027...operating margin experienced temporary compression due to one-time restructuring charges and severance costs totaling $14.2 million associated with the decommissioning of our older packaging facility in Cincinnati.\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027one-time restructuring charges and severance costs totaling $14.2 million associated with the decommissioning of our older packaging facility\u0027 \u003c-\u003e \u0027One-time expenses related to closing a packaging plant\u0027","[Loi giai chi tiet]: Thư gửi cổ đông và báo cáo tài chính đều khẳng định nguyên nhân trực tiếp làm giảm lợi nhuận hoạt động là khoản chi phí một lần 14,2 triệu USD dùng cho việc đóng cửa và bồi thường thôi việc tại nhà máy đóng gói ở Cincinnati.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) An unprecedented surge in corporate income tax rates","- Ly do sai: Thuế thu nhập doanh nghiệp trong báo cáo tài chính thực tế giảm từ $16.2M xuống $13.1M do lợi nhuận trước thuế giảm, không hề có sự gia tăng thuế suất.","- Bay ETS: Bẫy Đảo ngược Dữ liệu Tài chính (Opposite Trend Trap)","(C) A sharp contraction in total net sales revenue","- Ly do sai: Doanh thu thuần tăng trưởng 8.5% từ $442.4M lên $480.0M chứ không hề suy giảm.","- Bay ETS: Bẫy Mâu thuẫn Trực tiếp với Số liệu Doanh thu (Direct Contradiction Trap)","(D) Significant losses incurred from derivative financial instruments","- Ly do sai: Bài đọc không đề cập đến bất kỳ khoản lỗ nào từ công cụ phái sinh.","- Bay ETS: Bẫy Thông tin Không Tồn tại (Not Mentioned / Fabricated Trap)","187. According to the financial statement, what was Valenta\u0027s operating income (EBIT) in FY 2024?","Dap an dung: (D) $70.8 million","[Dau vet bai doc / Clue]: Văn bản 2 (Bảng Báo cáo Kết quả Kinh doanh): Dòng \u0027Operating Income (EBIT)\u0027, cột \u0027FY 2024\u0027 ghi rõ: \u0027$70.8\u0027.","[Dien dat tuong duong / Paraphrase]: • Tra cứu trực tiếp bảng số liệu tài chính: Hàng \u0027Operating Income (EBIT)\u0027 gióng sang cột \u0027FY 2024\u0027 = $70.8M.","[Loi giai chi tiet]: Đối chiếu trên bảng dữ liệu tài chính chọn lọc, tại dòng Lợi nhuận thuần từ hoạt động kinh doanh (EBIT), giá trị của năm tài chính 2024 là 70,8 triệu USD.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) $39.3 million","- Ly do sai: 39.3 triệu USD là Lợi nhuận Ròng Hợp nhất (Consolidated Net Income) của năm 2025, không phải EBIT năm 2024.","- Bay ETS: Bẫy Nhầm lẫn Chỉ số \u0026 Mốc Niên độ (Metric \u0026 Temporal Confusion Trap)","(B) $48.8 million","- Ly do sai: 48.8 triệu USD là Lợi nhuận Ròng của năm 2024.","- Bay ETS: Bẫy Nhầm lẫn Lợi nhuận Ròng với EBIT (Net Income vs. Operating Income Trap)","(C) $57.8 million","- Ly do sai: 57.8 triệu USD là EBIT của năm 2025 sau khi bị trừ chi phí tái cấu trúc.","- Bay ETS: Bẫy Sai Niên độ Kế toán (Wrong Fiscal Year Trap)","188. What does Ms. Vance recommend that investors do regarding Valenta\u0027s shares?","Dap an dung: (B) Maintain their current holdings without increasing positions","[Dau vet bai doc / Clue]: Văn bản 3 (Báo cáo Phân tích), Header \u0026 Câu cuối: \u0027Rating: Downgrade from BUY to HOLD... we advise institutional clients to maintain a neutral positioning.\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027Rating: HOLD\u0027 + \u0027maintain a neutral positioning\u0027 \u003c-\u003e \u0027Maintain their current holdings without increasing positions\u0027","[Loi giai chi tiet]: Chuyên gia Clara Vance hạ xếp hạng xuống HOLD (Nắm giữ) và khuyên các nhà đầu tư tổ chức duy trì vị thế trung lập, nghĩa là tiếp tục giữ số cổ phần hiện có mà chưa nên mua thêm.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Sell their entire holding immediately to avoid insolvency","- Ly do sai: Chuyên gia không khuyến nghị BÁN (SELL), công ty vẫn tạo ra dòng tiền hoạt động mạnh $68.4M và không có nguy cơ mất khả năng thanh toán.","- Bay ETS: Bẫy Cực đoan hóa Khuyến nghị (Extreme Recommendation Trap)","(C) Purchase additional shares before the upcoming dividend record date","- Ly do sai: Đây là khuyến nghị MUA (BUY), nhưng chuyên gia vừa hạ xếp hạng khỏi mức BUY do định giá đắt.","- Bay ETS: Bẫy Đánh giá Lạc quan Lỗi thời (Outdated Rating Trap)","(D) Vote against the re-election of Marcus Sterling at the AGM","- Ly do sai: Bản báo cáo chỉ phân tích về định giá tài chính, không kêu gọi cổ đông bất tín nhiệm CEO.","- Bay ETS: Bẫy Bịa đặt Hoạt động Quản trị (Fabricated Governance Trap)","189. In the equity research note, what is indicated about Valenta\u0027s valuation compared to industry peers?","Dap an dung: (C) It is valued at a higher multiple than the peer group average.","[Dau vet bai doc / Clue]: Văn bản 3 (Báo cáo Phân tích), Đoạn 2: \u0027...Valenta trades at a forward P/E multiple of 19.5x our revised FY 2026 EPS forecast... relative to packaged food peers trading at 16.8x.\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027trades at a forward P/E multiple of 19.5x... relative to packaged food peers trading at 16.8x\u0027 \u003c-\u003e \u0027valued at a higher multiple than the peer group average\u0027","[Loi giai chi tiet]: Hệ số giá trên thu nhập dự phóng của Valenta là 19.5 lần, cao hơn đáng kể so với mức bình quân của các doanh nghiệp thực phẩm đóng gói cùng ngành là 16.8 lần.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) It trades at a lower price-to-earnings multiple than rival firms.","- Ly do sai: Nói ngược hoàn toàn: 19.5x cao hơn 16.8x chứ không thấp hơn.","- Bay ETS: Bẫy Ngược Nghĩa So sánh Số liệu (Inverse Comparative Trap)","(B) Its debt-to-equity ratio exceeds statutory regulatory ceilings.","- Ly do sai: Báo cáo phân tích không hề nhắc tới tỷ lệ nợ trên vốn cổ phần hay trần quy định pháp luật.","- Bay ETS: Bẫy Khái niệm Tài chính Lạc đề (Irrelevant Financial Ratio Trap)","(D) Its dividend yield is the highest among consumer brand companies.","- Ly do sai: Báo cáo chỉ nêu mức cổ tức 0.35 USD/quý, không hề có phép so sánh tỷ suất cổ tức cao nhất ngành.","- Bay ETS: Bẫy Nhất thể Tuyệt đối (Unfounded Superlative Trap)","190. Which corporate action would likely cause Horizon Capital Markets to upgrade its rating on Valenta?","Dap an dung: (A) Selling off its underperforming non-core beverage business","[Dau vet bai doc / Clue]: Văn bản 3 (Báo cáo Phân tích), Đoạn cuối: \u0027We would turn constructive on the stock if management demonstrates faster margin expansion from the new Dallas and Atlanta automation hubs or announces the divestiture of its low-margin non-core beverage division.\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027turn constructive on the stock\u0027 \u003c-\u003e \u0027upgrade its rating\u0027","• \u0027announces the divestiture of its low-margin non-core beverage division\u0027 \u003c-\u003e \u0027Selling off its underperforming non-core beverage business\u0027","[Loi giai chi tiet]: Báo cáo của Horizon khẳng định sẽ xem xét chuyển sang quan điểm tích cực (nâng hạng) nếu công ty thông báo thoái vốn (divestiture = sell off) khỏi mảng kinh doanh đồ uống không cốt lõi có biên lợi nhuận thấp.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(B) Canceling the newly authorized $25 million share buyback program","- Ly do sai: Việc hủy chương trình mua lại cổ phiếu sẽ gây thất vọng cho cổ đông chứ không giúp nâng hạng.","- Bay ETS: Bẫy Hành động Tiêu cực Đối với Cổ đông (Adverse Action Trap)","(C) Reopening the decommissioned packaging facility in Cincinnati","- Ly do sai: Nhà máy Cincinnati cũ kỹ và gây tốn kém chi phí, công ty đã đóng cửa vĩnh viễn để chuyển sang kho tự động hóa.","- Bay ETS: Bẫy Hành động Ngược Chiến lược Vận hành (Contradictory Operational Trap)","(D) Increasing annual capital expenditures in overseas packaging plants","- Ly do sai: Gia tăng CAPEX vào nhà máy đóng gói ở nước ngoài không hề được đề xuất.","- Bay ETS: Bẫy Đề xuất Không Căn cứ (Unsubstantiated Proposal Trap)","PHẦN 4: KỸ THUẬT FEYNMAN SONG NGỮ \u0026 SƠ ĐỒ QUY TRÌNH (TƯ DUY PHÂN TÍCH TÀI CHÍNH DOANH NGHIỆP \u0026 BA)","4.1. Sơ đồ Quy trình Luân chuyển Nghiệp vụ (Annual Earnings Reporting, Audit \u0026 Valuation Cycle)","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","Khóa Sổ Kế toán Niên độ \u0026 Trích lập Chi phí Bất thường (Fiscal Year-End Closing \u0026 Restructuring Accrual)"],[],["BƯỚC 2","Kiểm toán Độc lập \u0026 Hội đồng Quản trị Phê duyệt Báo cáo Thường niên (Audited Earnings \u0026 Board Approval)"],[],["BƯỚC 3","Công bố Thông tin Đại chúng \u0026 Thị trường Vốn Tái Định giá (SEC Filings, Earnings Call \u0026 Research Downgrade)"]],[["• Chung tu \u0026 Kenh: Phòng Kế toán Tổng hợp Valenta -\u003e Hệ thống ERP SAP S/4HANA Finance","• Nghiep vu thuc thi: Khóa sổ niên độ tài chính ngày 30/09; ghi nhận doanh thu thuần 480 triệu USD; hạch toán chi phí trích lập dự phòng đóng cửa nhà máy Cincinnati và gói bồi thường thôi việc 14,2 triệu USD vào chi phí hoạt động EBIT","• Ket qua \u0026 Kiem soat: Bảng Cân đối Thử Kiểm toán (Pre-Audit Trial Balance) + Chứng từ Trích lập Chi phí Tái cấu trúc #JE-9041"],["➔"],["• Chung tu \u0026 Kenh: Công ty Kiểm toán Độc lập Big 4 -\u003e Hội đồng Quản trị Valenta","• Nghiep vu thuc thi: Kiểm toán viên phát hành báo cáo chấp nhận toàn phần xác nhận EBIT 57,8 triệu USD và EPS pha loãng 1,96 USD; HĐQT phê duyệt Thư gửi Cổ đông, biểu quyết chia cổ tức quý $0,35 và gói mua lại cổ phiếu quỹ 25 triệu USD","• Ket qua \u0026 Kiem soat: Báo cáo Thường niên Kiểm toán (Form 10-K / Annual Report) + Nghị quyết HĐQT về Cổ tức và Mua lại Cổ phiếu"],["➔"],["• Chung tu \u0026 Kenh: Cổng Công bố Thông tin SEC EDGAR -\u003e Thị trường Chứng khoán NYSE \u0026 Công ty Nghiên cứu Horizon","• Nghiep vu thuc thi: Phát hành thông cáo báo chí và tổ chức hội nghị truyền hình nhà đầu tư (Earnings Call); Chuyên gia phân tích Horizon so sánh P/E dự phóng 19,5x với trung bình ngành 16,8x, chính thức hạ khuyến nghị từ MUA xuống NẮM GIỮ","• Ket qua \u0026 Kiem soat: Báo cáo Đánh giá Cổ phiếu Horizon Research Note (HOLD) + Mục tiêu Giá mới 38,00 USD"]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["STEP 1","FISCAL CLOSING \u0026 RESTRUCTURING ACCRUAL"],[],["STEP 2","EXTERNAL AUDIT \u0026 BOARD REPORT APPROVAL"],[],["STEP 3","PUBLIC DISCLOSURE \u0026 EQUITY VALUATION ADJUSTMENT"]],[["• Documents \u0026 Channels: • Documents \u0026 Channels: Valenta Corporate Accounting Division -\u003e SAP S/4HANA General Ledger","• Core Business Execution: • Core Business Execution: Finalize fiscal year-end books on Sept 30; recognize $480.0M net revenue; post $14.2M restructuring accrual for Cincinnati plant shutdown and employee severance against operating income (EBIT).","• Key Deliverable \u0026 Control: • Key Deliverable \u0026 Control: Pre-Audit Trial Balance + Restructuring Journal Voucher #JE-9041"],["➔"],["• Documents \u0026 Channels: • Documents \u0026 Channels: Independent External Audit Firm -\u003e Valenta Board of Directors","• Core Business Execution: • Core Business Execution: External auditors issue clean audit opinion certifying $57.8M EBIT and $1.96 diluted EPS; Board endorses Shareholder Letter, resolves regular $0.35 quarterly dividend, and authorizes $25M share buyback.","• Key Deliverable \u0026 Control: • Key Deliverable \u0026 Control: Audited Annual Report (Form 10-K) + Board Resolutions on Dividends and Share Repurchases"],["➔"],["• Documents \u0026 Channels: • Documents \u0026 Channels: SEC EDGAR Portal -\u003e NYSE Markets \u0026 Horizon Equity Research Division","• Core Business Execution: • Core Business Execution: Host public investor earnings call; Horizon analyst recalculates forward P/E to 19.5x versus 16.8x peer median, downgrading stock recommendation from BUY to HOLD with a revised $38.00 target.","• Key Deliverable \u0026 Control: • Key Deliverable \u0026 Control: Published Horizon Research Note (HOLD) + Target Price Reduction to $38.00"]]],"t":"table"},"4.2. Tư duy Phân tích Nghiệp vụ Tài chính Doanh nghiệp \u0026 BA (Bản Tiếng Việt)","• Bức tranh Toàn cảnh Tài chính \u0026 Thị trường Vốn (End-to-End Flow): Một chu kỳ công bố Báo cáo thường niên của công ty niêm yết luôn là sự kết hợp chặt chẽ giữa 3 luồng vận hành: (1) Luồng Kế toán \u0026 Quản trị Nội bộ: Doanh nghiệp ghi nhận các sự kiện tái cấu trúc thực tế (đóng nhà máy cũ, trả tiền bồi thường thôi việc) và phản ánh trung thực lên Bảng Kết quả kinh doanh thông qua các khoản mục trích lập bất thường; (2) Luồng Pháp lý \u0026 Công bố Thông tin: Báo cáo tài chính phải qua kiểm toán độc lập nghiêm ngặt, được Hội đồng Quản trị phê chuẩn kèm các chính sách bảo vệ cổ đông (chia cổ tức tiền mặt, mua lại cổ phiếu quỹ) trước khi công bố rộng rãi trên cổng SEC EDGAR; (3) Luồng Định giá Thị trường Vốn: Phố Wall không chỉ nhìn vào con số doanh thu tăng trưởng mà đào sâu vào chất lượng lợi nhuận (Earnings Quality) và các hệ số định giá (P/E, EV/EBITDA, Biên lợi nhuận gộp), từ đó đưa ra xếp hạng khuyến nghị điều hướng dòng vốn của các quỹ tương hỗ và quỹ đầu tư tổ chức.","• Điểm nghẽn \u0026 Rủi ro Vận hành Thực tế (Core Bottleneck \u0026 Risk): Rủi ro phân kỳ nhận thức giữa Ban Điều hành và Giới Phân tích Tài chính (Expectation Gap). Ban điều hành coi khoản lỗ tái cơ cấu 14,2 triệu USD là \u0027khoản mục nhất thời không tái diễn\u0027, nhưng giới phân tích nhìn thấy dấu hiệu biên lợi nhuận gộp bị bào mòn từ 40% xuống 39% do chi phí kho vận tăng. Khi EPS thực tế trượt xa dự báo ($1.96 so với $2.15), cổ phiếu lập tức chịu áp lực bán tháo và định giá P/E bị coi là quá đắt đỏ so với đối thủ cạnh tranh.","• 3 Giải pháp Thiết kế Hệ thống \u0026 Phân tích Nghiệp vụ (BA Solutions):","(1) Xây dựng Hệ thống Báo cáo Quản trị Đa kịch bản (Pro-forma \u0026 Normalized Earnings Modeling): Cấu hình module ERP BI tự động tính toán đồng thời 2 luồng chỉ số: Chuẩn mực GAAP (có chi phí bất thường) và Chuẩn Non-GAAP (loại trừ chi phí tái cơ cấu) giúp CFO cung cấp dữ liệu minh bạch, nhất quán cho các công ty chứng khoán ngay trong buổi Earnings Call.","(2) Tự động hóa Đo lường Tác động của Chương trình Mua lại Cổ phiếu (Automated Share Repurchase Impact Simulator): Thiết lập mô hình dự báo lượng tiền giải ngân 25 triệu USD mua lại cổ phiếu quỹ theo từng bước giá thị trường, tính toán chính xác mức tăng EPS bù đắp pha loãng và tối ưu hóa chi phí vốn bình quân WACC.","(3) Giám sát Chỉ số Hoàn vốn Đầu tư Kho Tự động (Automation ROI Tracking Dashboard): Tích hợp luồng dữ liệu từ trung tâm logistics Dallas và Atlanta vào hệ thống tài chính để chứng minh tỷ lệ tiết giảm chi phí trên mỗi đơn vị sản phẩm (Cost-per-Unit Reduction), tạo cơ sở vững chắc cho các công ty chứng khoán nâng mức định giá mục tiêu.","4.3. Business Analyst \u0026 Financial Systems Executive Summary (Bản Tiếng Anh)","• End-to-End Financial \u0026 Capital Markets Context: The corporate annual reporting cycle harmonizes three distinct operating dimensions: (1) Internal Financial Accounting: Recognizing physical operational restructuring (plant decommission, employee severance) into GAAP earnings via one-time non-recurring charges; (2) Statutory Governance \u0026 Disclosure: Subjecting financial statements to Big 4 external audit scrutiny and Board approval alongside capital return policies (cash dividends, share repurchases) prior to mandatory SEC EDGAR filings; (3) Capital Market Valuation: Wall Street analysts dissect earnings quality, gross margin stability, and forward valuation multiples (P/E, EV/EBITDA), directing institutional capital allocation across global investment portfolios.","• Core Operational Bottleneck \u0026 Risk: The Expectation Gap between corporate management and institutional equity research. Executive leadership treats restructuring costs as transitory, yet equity analysts interpret the 100-basis-point gross margin compression (40% to 39%) as evidence of structural logistics headwinds. A $0.19 EPS consensus miss triggers valuation downgrades and heightens stock volatility.","• Key BA \u0026 Financial System Architecture Solutions:","(1) Pro-Forma \u0026 Adjusted EBITDA Reconciliation Engine: Implement enterprise BI capabilities to automatically generate GAAP vs. Non-GAAP performance analytics, enabling finance executives to communicate clear operational bridges to sell-side analysts during earnings webcasts.","(2) Dynamic Share Buyback Accretion Simulator: Deploy algorithmic treasury tools to model open-market share repurchases against variable market prices, forecasting net EPS accretion and WACC optimization in real time.","(3) Supply Chain Automation ROI Telemetry: Connect fulfillment telemetry from new automated hubs (Dallas/Atlanta) directly to cost accounting modules, delivering empirical unit-cost reduction data to rebuild market confidence.","4.4. Tam giác Liên kết Nhận thức Đa chiều (Multi-Perspective Contextual Anchoring)","1. Lăng kính Viễn thông \u0026 Hạ tầng CNTT Viettel: Bài toán tái cấu trúc trạm phát sóng 2G/3G cũ để dồn vốn đầu tư trạm 5G băng thông rộng. Trong ngắn hạn, chi phí thanh lý tài sản vô hình và khấu hao trạm cũ làm giảm EBIT kế toán, nhưng dòng tiền kinh doanh từ gói cước data 4G/5G vẫn tăng trưởng mạnh mẽ; việc minh bạch chi phí một lần giúp Tập đoàn bảo vệ xếp hạng tín nhiệm và giải trình hiệu quả sử dụng vốn nhà nước.","2. Lăng kính Quản trị Trường Mầm non Ước Mơ Xanh (cô Thu Huyền): Quyết định đóng cửa dãy phòng học gỗ cũ để đầu tư hệ thống phòng học thông minh chuẩn STEAM hè. Chi phí tháo dỡ và thanh lý bàn ghế cũ làm thâm hụt ngân sách quý 2, nhưng ban giám hiệu đã giải thích rõ cho ban phụ huynh về việc tái đầu tư cơ sở vật chất dài hạn, đồng thời duy trì quỹ dự phòng ổn định học phí để giữ vững niềm tin của gia đình học sinh.","3. Lăng kính Bàn học Gia đình (Kèm cặp học sinh Lớp 5 - Bé Hà Ngân): Bài học \u0027Đổi đồ chơi cũ lấy sách học thông minh\u0027: Bé Hà Ngân dọn tủ đồ chơi, gom những món đồ nhựa đã hỏng để bỏ đi (chấp nhận mất tiền đồ chơi cũ - giống như chi phí đóng nhà máy), nhưng đổi lại góc học tập trở nên ngăn nắp và có chỗ kê giá sách khoa học mới (tương tự như xây dựng trung tâm tự động hóa hiện đại).","PHẦN 5: BẢNG TỪ VỰNG \u0026 CẤU TRÚC CỐT LÕI (8 THUẬT NGỮ TÀI CHÍNH \u0026 BÁO CÁO THƯỜNG NIÊN)","1. operating margin (n phr)  /ˈɑːpəreɪtɪŋ ˈmɑːrdʒɪn/  = operating income ratio / EBIT margin / operational profitability","Nghia: Biên lợi nhuận hoạt động (Tỷ lệ lợi nhuận kinh doanh trên doanh thu thuần)","Vd: The company\u0027s operating margin experienced temporary compression due to plant closure expenses. - Biên lợi nhuận hoạt động của công ty đã chịu sự thu hẹp tạm thời do các chi phí đóng cửa nhà máy.","2. non-recurring item (n phr)  /ˌnɑːn rɪˈkɜːrɪŋ ˈaɪtəm/  = one-time charge / extraordinary expense / transitory cost","Nghia: Khoản mục bất thường không lặp lại (chi phí phát sinh một lần)","Vd: Excluding these non-recurring items, core operating earnings grew by twelve percent. - Nếu loại trừ các khoản mục phát sinh không thường xuyên này, lợi nhuận hoạt động cốt lõi đã tăng trưởng 12%.","3. diluted earnings per share (n phr)  /daɪˈluːtɪd ˈɜːrnɪŋz pər ʃer/  = diluted EPS / adjusted net income per common share","Nghia: Lãi pha loãng trên mỗi cổ phần (chỉ số EPS sau khi tính toàn bộ chứng quyền và quyền chọn)","Vd: Diluted earnings per share fell to $1.96, missing Wall Street consensus projections. - Lãi pha loãng trên mỗi cổ phần giảm xuống còn 1,96 USD, không đạt kỳ vọng dự báo của Phố Wall.","4. share repurchase program (n phr)  /ʃer riːˈpɜːrtʃəs ˈproʊɡræm/  = stock buyback plan / corporate share reacquisition","Nghia: Chương trình mua lại cổ phiếu quỹ của doanh nghiệp","Vd: The board authorized a $25 million share repurchase program to enhance shareholder value. - Hội đồng quản trị đã phê duyệt chương trình mua lại cổ phiếu trị giá 25 triệu USD nhằm gia tăng giá trị cho cổ đông.","5. price-to-earnings multiple (n phr)  /praɪs tuː ˈɜːrnɪŋz ˈmʌltɪpl/  = P/E ratio / valuation multiple / equity pricing coefficient","Nghia: Hệ số giá trên thu nhập (Hệ số P/E đo lường mức độ đắt rẻ của cổ phiếu)","Vd: Valenta trades at a forward P/E multiple of 19.5x, well above its peer group average. - Valenta đang giao dịch ở hệ số P/E dự phóng 19,5 lần, cao hơn nhiều so với mức trung bình ngành.","6. divestiture (n)  /daɪˈvestɪtʃər/  = asset sell-off / business spin-off / disposal of non-core subsidiary","Nghia: Sự bán thoái vốn / Bán bớt mảng kinh doanh hoặc tài sản không cốt lõi","Vd: Analysts recommended the divestiture of the low-margin non-core beverage division. - Các chuyên gia phân tích khuyến nghị việc thoái vốn khỏi mảng kinh doanh đồ uống không cốt lõi có biên lợi nhuận thấp.","7. consensus estimate (n phr)  /kənˈsensəs ˈestɪmət/  = Wall Street average projection / analyst median forecast","Nghia: Ước tính đồng thuận (Mức dự báo trung bình của các nhà phân tích Phố Wall)","Vd: Quarterly profits missed the analyst consensus estimate by four cents per share. - Lợi nhuận quý đã thấp hơn mức ước tính đồng thuận của các nhà phân tích là 4 xu trên mỗi cổ phần.","8. decommission (v)  /ˌdiːkəˈmɪʃn/  = permanently shut down / retire an industrial facility / take out of service","Nghia: Đóng cửa vĩnh viễn / Ngừng vận hành và tháo dỡ cơ sở sản xuất","Vd: The company incurred substantial severance costs when decommissioning the older plant. - Công ty đã phát sinh các chi phí thôi việc đáng kể khi ngừng vận hành nhà máy cũ.","==================================================================================================","BÀI 2: Hợp đồng Hạn mức Tín dụng Tuần hoàn Doanh nghiệp (Revolving Credit Facility), Đơn Đề nghị Rút vốn Lưu động (Drawdown Notice) \u0026 Xác nhận Lãi suất Thả nổi SOFR kèm Phí Cam kết (SOFR Floating Rate \u0026 Commitment Fee) (Questions 191-195 - Triple Passage)","Nguồn: ETS TOEIC Part 7 — Triple Passage (Credit Agreement Excerpt, Drawdown Request Notice \u0026 Bank Loan Confirmation Letter)","PHẦN 1: NỘI DUNG BÀI ĐỌC, CÂU HỎI \u0026 BẢN DỊCH SONG NGỮ","1.1. Đề thi Tiếng Anh gốc (Strategy Guide \u0026 Original ETS Passages)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","Questions 191-195 refer to the following credit agreement excerpt, drawdown notice, and bank confirmation letter.","[Passage 1: Credit Agreement Excerpt — Talon Micro-Devices Inc. \u0026 Global Commercial Trust]","SYNDICATED CREDIT FACILITY AGREEMENT (SUMMARY OF TERMS)","Borrower: Talon Micro-Devices Inc.","Administrative Agent \u0026 Lead Arranger: Global Commercial Trust Corporation","Facility Size: $150,000,000 Multi-Currency Revolving Credit Facility","Effective Date: September 1 | Maturity Date: August 31 (3-Year Term)","1. Interest Rate \u0026 Benchmark Definition","Borrowings under the facility accrue interest at a floating rate equal to the CME Term SOFR (Secured Overnight Financing Rate) corresponding to the selected interest period (1-month, 3-month, or 6-month), plus an Applicable Margin of 1.85% per annum. Interest is calculated on an actual/360-day basis and payable on the last day of each interest period.","2. Unused Commitment Fee","The Borrower shall pay a commitment fee of 0.25% per annum on the average daily undrawn and uncancelled portion of the $150,000,000 facility. The commitment fee accrues quarterly in arrears and is payable concurrently with quarterly interest settlements.","3. Financial Covenants","The Borrower must maintain a Consolidated Net Debt-to-EBITDA Leverage Ratio of not greater than 3.25 to 1.00, tested at the end of each fiscal quarter. Failure to satisfy this ratio constitutes an Event of Default unless waived by a supermajority of syndicate lenders.","[Passage 2: Drawdown Request Notice — Talon Micro-Devices Treasury Department]","NOTICE OF BORROWING (DRAWDOWN REQUEST)","Date: October 10","To: Global Commercial Trust Corp. (Syndicated Agency \u0026 Loan Operations)","From: Arthur Vance, Vice President of Corporate Treasury, Talon Micro-Devices Inc.","Re: Credit Agreement dated September 1 ($150M Revolving Facility)","Pursuant to Section 2.03 of the Credit Agreement, Talon Micro-Devices hereby provides irrevocable notice of its request for a borrowing under the revolving facility as follows:","1. Requested Borrowing Date: October 15","2. Aggregate Principal Amount of Borrowing: $40,000,000.00 (Forty Million USD)","3. Selected Interest Period: 3-Month Term SOFR (ending January 15)","4. Business Purpose of Borrowing: Funding seasonal procurement of semiconductor wafer inventory and fabrication consumables in advance of anticipated peak fourth-quarter delivery cycles.","5. Remittance Instructions: Please wire proceeds directly to Talon\u0027s Corporate Operating Account #8812-4409 at Wells Fargo Bank, N.A.","We hereby certify that no Default or Event of Default has occurred and is continuing, and our Net Debt-to-EBITDA ratio as of the date hereof stands at 2.10x, well within covenant thresholds.","[Passage 3: Loan Confirmation \u0026 Rate Fixing Letter — Global Commercial Trust]","GLOBAL COMMERCIAL TRUST CORPORATION","Syndicated Loan Agency \u0026 Servicing Group | 200 Park Avenue, New York, NY","Date: October 15 | Facility Identifier: #TLN-REV-150M","To: Talon Micro-Devices Inc. (Attn: Corporate Treasury)","Dear Mr. Vance:","We are pleased to confirm that your drawdown request of $40,000,000.00 under the Revolving Credit Facility was successfully executed today, October 15. The funds have been wired in accordance with your payment instructions.","Interest Rate Fixing \u0026 Settlement Schedule for the Period (October 15 to January 15 - 90 Days):","• Benchmark 3-Month CME Term SOFR (Fixed on Oct 11): 4.40% per annum","• Applicable Margin: 1.85% per annum","• All-in Floating Borrowing Rate: 6.25% per annum","• Accrued Interest Due on January 15: $625,000.00 ($40M x 6.25% x 90/360)","Unused Commitment Fee Assessment:","• Total Facility Size: $150,000,000.00","• Active Drawn Balance: $40,000,000.00","• Undrawn Facility Portion: $110,000,000.00","• Quarterly Commitment Fee Due on January 15: $68,750.00 ($110M x 0.25% x 90/360)","Total Net Remittance Due to Administrative Agent on January 15: $693,750.00 ($625,000.00 interest + $68,750.00 commitment fee). Automatic debit will occur at 11:00 AM EST on January 15 from your collateral settlement account.","Sincerely,","Brenda Thorne, Managing Director, Loan Syndication \u0026 Agency Services","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","191. What is the primary purpose of the $40,000,000 borrowing requested by Talon Micro-Devices?","(A) To repurchase outstanding corporate bonds on the open market","(B) To fund the acquisition of a regional semiconductor competitor","(C) To finance seasonal inventory purchases before high-demand periods","(D) To pay severance settlements to decommissioned factory workers","192. What financial ratio is Talon required to maintain under the terms of the credit agreement?","(A) Return on equity of at least 15%","(B) Consolidated Net Debt-to-EBITDA ratio of 3.25x or lower","(C) Quick ratio exceeding 2.50x total current liabilities","(D) Dividend payout ratio under 40% of net income","193. In Passage 2, paragraph 1, the word \u0027irrevocable\u0027 is closest in meaning to","(A) temporary","(B) binding","(C) informal","(D) negotiable","194. What total amount must Talon Micro-Devices pay to Global Commercial Trust on January 15?","(A) $68,750.00","(B) $625,000.00","(C) $693,750.00","(D) $40,693,750.00","195. What is indicated about the commitment fee charged under the credit facility?","(A) It is assessed only when the borrower defaults on an interest payment.","(B) It is charged on the portion of the credit line that remains unused.","(C) It is waived if the benchmark SOFR rate rises above 5.0%.","(D) It must be paid upfront as a non-refundable retainer before signing.","1.2. Hướng dẫn làm bài Part 7","CHIẾN THUẬT 5 PHÚT TỐI ƯU: NẮM BẮT BỐI CẢNH, GHÉP NỐI DỮ KIỆN \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Luồng sự việc (Quỹ đạo Quét chữ Z \u0026 3 Câu hỏi Tiềm thức): • Văn bản 1 (Hợp đồng Hạn mức Tín dụng): Quy mô hạn mức $150M; Lãi suất thả nổi SOFR + biên độ 1.85%; Phí cam kết cho phần hạn mức chưa rút là 0.25%/năm; Giao ước tài chính: Net Debt/EBITDA \u003c= 3.25x.","• Văn bản 2 (Đơn Đề nghị Rút vốn): Phó Chủ tịch Ngân quỹ Arthur Vance đề nghị rút $40M vào ngày 15/10 theo kỳ hạn SOFR 3 tháng để mua nguyên liệu sản xuất chip đón đầu mùa bán hàng quý 4; xác nhận tỷ lệ đòn bẩy hiện tại an toàn ở mức 2.10x.","• Văn bản 3 (Thư Xác nhận Lãi suất của Ngân hàng): Ngân hàng giải ngân $40M; chốt SOFR 4.40% + Margin 1.85% = 6.25%/năm; Tiền lãi 90 ngày = $625,000; Phí cam kết trên $110M chưa rút = $68,750; Tổng số tiền phải thanh toán ngày 15/01 là $693,750.","=\u003e Luồng sự việc: Hợp đồng cấp hạn mức tín dụng tuần hoàn $150M -\u003e Doanh nghiệp gửi đơn rút vốn $40M -\u003e Ngân hàng giải ngân, chốt lãi suất thả nổi SOFR và thu phụ phí hạn mức nhàn rỗi.","Bước 2 (20 giây) - Quét nhanh 5 câu hỏi \u0026 Gắn móc từ khóa: • Câu 191: Mục đích chính của khoản vay $40M (Từ khóa: primary purpose, $40,000,000 borrowing).","• Câu 192: Chỉ số tài chính bắt buộc phải duy trì (Từ khóa: financial ratio required to maintain, 3.25x).","• Câu 193: Từ \u0027irrevocable\u0027 gần nghĩa nh
