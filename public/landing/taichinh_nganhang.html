g interest coupons into 3% cash and 4% capitalized Payment-in-Kind (PIK) preserves $7.2M in annual cash liquidity, safeguarding working capital.","• Core Operational Bottleneck \u0026 Risk: The Holdout Creditor Dilemma and Post-Restructuring Relapse (Chapter 22). Out-of-court workouts require near-unanimous syndicate consent; rogue hedge funds acquiring debt at a discount can threaten involuntary bankruptcy filings to force full par repayment. Operationally, financial recapitalizations fail if retail customer retention is not fundamentally revitalized.","• Key BA \u0026 Turnaround System Architecture Solutions:","(1) Direct 13-Week Cash Flow (TWCF) Forecasting Platform: Deploy rolling daily liquidity modeling modules within corporate ERPs, enforcing rigorous operational disbursements and variance analytics to protect the $57M liquidity runway.","(2) Algorithmic PIK Capitalization \u0026 Amortization Sub-Ledger: Implement automated debt servicing algorithms that calculate split-coupon liabilities, automatically generating 3% cash Fedwire payment instructions while programmatically capitalizing 4% PIK interest into open debt principal balances.","(3) Creditor Oversight \u0026 Covenant De-leveraging Telemetry: Construct dedicated governance dashboards for creditor-appointed board directors, automating continuous real-time tracking of post-recapitalization leverage covenants (targeting sub-3.0x Net Debt/EBITDA) and store-level rationalization metrics.","4.4. Tam giác Liên kết Nhận thức Đa chiều (Multi-Perspective Contextual Anchoring)","1. Lăng kính Viễn thông \u0026 Tái cơ cấu Vốn Viettel: Bài toán tái cơ cấu vốn và quản trị các khoản nợ vay tại các công ty liên kết hoặc thị trường nước ngoài gặp khó khăn về tỷ giá và suy thoái kinh tế: Việc chủ động đàm phán kéo dài kỳ hạn nợ với các ngân hàng chủ nợ quốc tế, chuyển một phần nợ vay thành vốn góp cổ phần (Debt-for-Equity Swap) và áp dụng cơ chế vốn hóa tiền lãi giúp doanh nghiệp hồi phục hoạt động kinh doanh mà không bị mất quyền kiểm soát chi phối.","2. Lăng kính Quản trị Trường Mầm non Ước Mơ Xanh (cô Thu Huyền): Bài toán đàm phán tiền thuê mặt bằng mùa hè vắng học sinh: Cô Thu Huyền thương lượng với chủ nhà cho giãn tiến độ nộp tiền thuê nhà 3 tháng hè và đề xuất trả một phần tiền mặt (giống như 3% cash interest), phần còn lại cho trường nợ gộp vào tiền thuê của các tháng mùa thu đông khi học sinh đi học đông đủ (tương tự cơ chế lãi dồn vốn PIK), giúp nhà trường vượt qua giai đoạn thâm hụt dòng tiền mùa vụ an toàn.","3. Lăng kính Bàn học Gia đình (Kèm cặp học sinh Lớp 5 - Bé Hà Ngân): Bài học \u0027Thỏa thuận mượn 10 chiếc bút chì màu\u0027: Hà Ngân lỡ mượn 10 chiếc bút chì màu của bạn nhưng làm gãy mất 4 chiếc và chưa có tiền mua đền ngay; Hà Ngân thỏa thuận với bạn: \u0027Cho tớ trả trước 6 chiếc bút còn nguyên, còn 4 chiếc bị gãy tớ xin đổi bằng 2 cuốn truyện tranh dán hình của tớ (hoán đổi nợ lấy tài sản), và tớ hứa sẽ kèm bạn học môn Toán cả tuần này\u0027 (giúp con hiểu bản chất của việc đàm phán thỏa thuận giải quyết nợ khi gặp khó khăn thay vì trốn tránh).","PHẦN 5: BẢNG TỪ VỰNG \u0026 CẤU TRÚC CỐT LÕI (8 THUẬT NGỮ TÁI CẤU TRÚC NỢ \u0026 XẾP HẠNG TÍN NHIỆM)","1. debt maturity wall (n phr)  /det məˈtʃʊrəti wɔːl/  = large cluster of maturing debt obligations / imminent debt refinancing cliff","Nghia: Bức tường nợ đáo hạn (khối lượng nợ vay khổng lồ cùng đến hạn thanh toán trong một thời điểm)","Vd: The retailer faces an upcoming debt maturity wall of $180 million in late 2026. - Nhà bán lẻ đang đối mặt với một bức tường nợ đáo hạn sắp tới lên tới 180 triệu USD vào cuối năm 2026.","2. debt-for-equity swap (n phr)  /det fər ˈekwəti swɑːp/  = debt conversion into equity / recapitalization exchanging debt for shares","Nghia: Hoán đổi nợ lấy cổ phần (thỏa thuận xóa nợ để đổi lấy quyền sở hữu cổ phần trong doanh nghiệp)","Vd: The restructuring plan included a sixty-million-dollar debt-for-equity swap with senior lenders. - Kế hoạch tái cấu trúc bao gồm một đợt hoán đổi 60 triệu USD nợ lấy cổ phần với các chủ nợ ưu tiên.","3. Payment-in-Kind (PIK) interest (n phr)  /ˈpeɪmənt ɪn kaɪnd ˈɪntrəst/  = capitalized interest / non-cash interest added to loan principal balance","Nghia: Lãi suất dồn vốn PIK (lãi vay không trả bằng tiền mặt mà được cộng dồn trực tiếp vào nợ gốc)","Vd: The company pays 3% cash interest plus 4% Payment-in-Kind interest to conserve liquidity. - Công ty thanh toán 3% tiền lãi bằng tiền mặt cộng thêm 4% lãi dồn vốn PIK để bảo tồn thanh khoản.","4. sub-investment grade / junk bond (n phr)  /sʌb ɪnˈvestmənt ɡreɪd/ - /dʒʌŋk bɑːnd/  = high-yield debt rating / speculative-grade credit below BBB-","Nghia: Dưới hạng đầu tư / Trái phiếu rác (mức xếp hạng tín nhiệm rủi ro cao từ BB+ trở xuống)","Vd: The credit rating downgrade placed the company\u0027s notes into sub-investment grade territory. - Việc hạ bậc xếp hạng tín nhiệm đã đẩy các trái phiếu của công ty vào nhóm dưới hạng đầu tư.","5. out-of-court restructuring (n phr)  /aʊt əv kɔːrt riːˈstrʌktʃərɪŋ/  = consensual debt workout / private creditor settlement without bankruptcy court filing","Nghia: Tái cấu trúc nợ ngoài tòa án (thỏa thuận tái cơ cấu vốn tự nguyện với chủ nợ để tránh phá sản)","Vd: Management pursued an out-of-court restructuring to avoid legal fees and bankruptcy stigma. - Ban điều hành đã theo đuổi việc tái cấu trúc ngoài tòa án để tránh án phí và định kiến phá sản.","6. interest coverage ratio (n phr)  /ˈɪntrəst ˈkʌvərɪdʒ ˈreɪʃioʊ/  = times-interest-earned (TIE) ratio / EBIT-to-interest capability metric","Nghia: Hệ số khả năng thanh toán lãi vay (chỉ số đo lường năng lực trả lãi từ lợi nhuận hoạt động)","Vd: The EBITDA interest coverage ratio compressed to 2.1x, signaling acute financial distress. - Hệ số thanh toán lãi vay trên EBITDA đã thu hẹp xuống còn 2,1 lần, báo hiệu khó khăn tài chính cấp bách.","7. ad hoc creditor committee (n phr)  /ˌæd ˈhɑːk ˈkredɪtər kəˈmɪti/  = informal syndicate lender coalition / organized creditor bargaining group","Nghia: Ủy ban chủ nợ đặc nhiệm (nhóm các chủ nợ lớn liên kết lại để đàm phán tái cấu trúc nợ)","Vd: The restructuring officer submitted the formal recapitalization proposal to the ad hoc creditor committee. - Chuyên viên tái cấu trúc đã đệ trình đề xuất tái cơ cấu vốn chính thức lên ủy ban chủ nợ đặc nhiệm.","8. liquidity runway (n phr)  /lɪˈkwɪdəti ˈrʌnweɪ/  = cash survival timeframe / months of operational solvency remaining before cash exhaustion","Nghia: Dư địa thanh khoản / Đường băng thanh khoản (thời gian doanh nghiệp còn đủ tiền để duy trì sống sót)","Vd: Without immediate debt relief, the firm\u0027s liquidity runway will be completely exhausted within twelve months. - Nếu không được giãn hoãn nợ ngay lập tức, đường băng thanh khoản của công ty sẽ cạn kiệt hoàn toàn trong 12 tháng.","==================================================================================================","BÀI 10: Thỏa thuận Quản lý Thanh khoản Tập trung \u0026 Tài khoản Quét Tiền Tự động (Zero-Balance Sweep Account) \u0026 Báo cáo Lợi suất Tiền gửi Ngân quỹ Doanh nghiệp (Overnight Repo \u0026 Yield Statement) (Questions 181-185 - Double Passage)","Nguồn: ETS TOEIC Part 7 — Double Passage (Corporate Cash Management Agreement \u0026 Monthly Liquidity Yield Statement)","PHẦN 1: NỘI DUNG BÀI ĐỌC, CÂU HỎI \u0026 BẢN DỊCH SONG NGỮ","1.1. Đề thi Tiếng Anh gốc (Strategy Guide \u0026 Original ETS Passages)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","Questions 181-185 refer to the following cash management agreement and monthly yield statement.","[Passage 1: Master Cash Management Agreement Excerpt — First Commercial Treasury Bank]","FIRST COMMERCIAL TREASURY BANK — CORPORATE LIQUIDITY SERVICES","Master Treasury Management \u0026 Automated Liquidity Sweep Agreement","Client: Vanguard Technologies Group Inc. | Master Concentration Account: #TCB-88001","Effective Date: January 1","1. Zero-Balance Account (ZBA) Structure","Vanguard Technologies and its fourteen (14) operating subsidiaries shall maintain designated subsidiary disbursement and collection accounts. Each subsidiary account operates as a Zero-Balance Account (ZBA) with a target end-of-day ledger balance of exactly $0.00. At the 5:00 PM EST close of each banking business day:","• All surplus collected funds from subsidiary collection accounts are automatically swept upward into the Parent Master Concentration Account #TCB-88001.","• Concurrently, if a subsidiary account presents debits (checks presented or outgoing ACH batches), the bank automatically transfers down the exact required funding from the Master Concentration Account to cover disbursements, preventing overdraft penalties.","2. Automated Overnight Sweep \u0026 Yield Optimization","All idle consolidated funds residing in the Master Concentration Account exceeding a mandatory minimum operating liquidity buffer of $10,000,000.00 shall be automatically swept into short-term, interest-bearing money market instruments, including:","• Overnight US Treasury Repurchase Agreements (Repos) backed 102% by US government debt.","• Fixed-term Institutional Certificates of Deposit (CDs) with accredited financial institutions.","3. Account Maintenance \u0026 Administrative Fee Schedule","• Monthly ZBA Maintenance Fee: $25.00 per subsidiary account.","• Electronic Sweep Processing Fee: Tiered flat administrative charge deducted monthly in arrears from gross earned interest.","[Passage 2: Monthly Corporate Liquidity \u0026 Yield Performance Statement — Treasury Operations]","FIRST COMMERCIAL TREASURY BANK — GLOBAL LIQUIDITY REPORTING","Monthly Corporate Yield \u0026 Interest Performance Summary","Reporting Period: September 1 to September 30 (30 Days) | Client: Vanguard Technologies Group Inc.","Master Account: #TCB-88001 | Linked Zero-Balance Accounts: 14 Active Subsidiaries","1. Cash Concentration \u0026 Daily Sweep Statistics:","• Total Aggregate Subsidiary Cash Swept to Master: $840,000,000.00","• Average Daily Master Account Consolidated Ledger Balance: $28,000,000.00","• Mandatory Daily Operating Reserve Buffer Maintained: $10,000,000.00","• Average Nightly Balance Invested in Overnight Treasury Repos: $18,000,000.00 ($28M - $10M buffer)","2. Gross Interest Yield Calculations (Actual/360-day money market convention):","• Overnight US Treasury Repo Yield (Weighted Average Rate: 4.85% per annum):","Calculation: $18,000,000.00 x 4.85% x (30 / 360) = $72,750.00","• Institutional 30-Day Certificate of Deposit Tranche (Fixed Rate: 5.20% on $15.0M allocated CD):","Calculation: $15,000,000.00 x 5.20% x (30 / 360) = $65,000.00","• Total Gross Interest Income Generated in September: $137,750.00 ($72,750.00 + $65,000.00)","3. Banking Service Fees \u0026 Net Remittance:","• Monthly ZBA Sub-Account Fees: 14 accounts x $25.00 = -$350.00","• Treasury Sweep Processing Fee: -$1,500.00","• Total Monthly Bank Administrative Charges: -$1,850.00","Net Interest Income Credited to Master Account #TCB-88001 on October 1: $135,900.00 ($137,750.00 - $1,850.00).","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","181. What is the primary function of a Zero-Balance Account (ZBA)?","(A) To permanently freeze corporate funds during tax audit investigations","(B) To maintain an end-of-day balance of zero by automatically transferring surplus cash","(C) To prevent subsidiaries from making purchases exceeding $25 per transaction","(D) To convert corporate cash into foreign currency derivatives at the close of trading","182. How much cash must be maintained as an operating reserve buffer in the Master Account before funds can be swept into investments?","(A) $1,850.00","(B) $350.00","(C) $10,000,000.00","(D) $28,000,000.00","183. In Passage 1, paragraph 2, the word \u0027consolidated\u0027 is closest in meaning to","(A) combined","(B) discarded","(C) borrowed","(D) delayed","184. What was the net interest income credited to Vanguard Technologies on October 1?","(A) $65,000.00","(B) $72,750.00","(C) $135,900.00","(D) $137,750.00","185. What is indicated about Vanguard Technologies\u0027 subsidiary accounts in Passage 2?","(A) Four of the subsidiary accounts incurred overdraft penalties during September.","(B) The company currently operates fourteen active Zero-Balance Accounts.","(C) Each subsidiary is allowed to invest in high-yield corporate junk bonds independently.","(D) The bank increased the monthly ZBA fee from $25 to $350 per account.","1.2. Hướng dẫn làm bài Part 7","CHIẾN THUẬT 5 PHÚT TỐI ƯU: NẮM BẮT BỐI CẢNH, GHÉP NỐI DỮ KIỆN \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Luồng sự việc (Quỹ đạo Quét chữ Z \u0026 3 Câu hỏi Tiềm thức): • Văn bản 1 (Thỏa thuận Quản lý Ngân quỹ \u0026 Tài khoản Quét Tiền): Ngân hàng First Commercial Treasury cung cấp dịch vụ quản lý dòng tiền cho Vanguard Tech gồm 14 công ty con; cơ chế ZBA: cuối ngày lúc 17:00, toàn bộ tiền dư ở công ty con tự động gom về Tài khoản Mẹ (Master Account), nếu thiếu tiền chi thì tài khoản mẹ tự động bơm xuống vừa khít số chi để số dư tài khoản con luôn bằng 0 USD; số dư trên 10 triệu USD ở tài khoản mẹ tự động đầu tư qua đêm vào Hợp đồng mua lại trái phiếu chính phủ Mỹ (Repo) và Chứng chỉ tiền gửi CD; phí duy trì 25 USD/tài khoản ZBA.","• Văn bản 2 (Báo cáo Lợi suất Tiền gửi Tháng 9): Số dư bình quân tài khoản mẹ 28 triệu USD; trừ 10 triệu USD đệm an toàn còn 18 triệu USD đầu tư Repo qua đêm (lãi 4.85% = 72,750 USD); đầu tư CD 15 triệu USD (lãi 5.20% = 65,000 USD); Tổng thu tiền lãi 137,750 USD; trừ phí ngân hàng 1,850 USD (14 x 25 USD + 1,500 USD phí quét tiền); Số tiền lãi thực nhận vào ngày 01/10 là 135,900 USD.","=\u003e Luồng sự việc: Ký thỏa thuận tài khoản quét tiền tự động ZBA gom tiền từ 14 công ty con -\u003e Tiền nhàn rỗi đầu tư sinh lời qua đêm -\u003e Nhận báo cáo sao kê tháng 9 đối soát tiền lãi ròng 135,900 USD.","Bước 2 (20 giây) - Quét nhanh 5 câu hỏi \u0026 Gắn móc từ khóa: • Câu 181: Chức năng chính của tài khoản số dư bằng 0 ZBA (Từ khóa: primary function, Zero-Balance Account ZBA).","• Câu 182: Số tiền dự phòng đệm thanh khoản bắt buộc ở tài khoản mẹ (Từ khóa: how much cash, operating reserve buffer, Master Account).","• Câu 183: Từ \u0027consolidated\u0027 gần nghĩa nhất với từ nào (Từ khóa: consolidated closest in meaning).","• Câu 184: Tiền lãi thuần được ghi có vào ngày 1 tháng 10 (Từ khóa: net interest income credited, October 1).","• Câu 185: Điều gì đúng về các tài khoản công ty con ở Văn bản 2 (Từ khóa: indicated about subsidiary accounts, Passage 2).","Bước 3 (3 phút 45 giây) - Giải cuốn chiếu \u0026 Khóa đáp án: • Câu 181 (Chi tiết - VB1 Mục 1): \u0027operates as a Zero-Balance Account (ZBA) with a target end-of-day ledger balance of exactly $0.00... surplus collected funds... are automatically swept upward\u0027 -\u003e Chọn (B) Duy trì số dư cuối ngày bằng 0 bằng cách tự động gom tiền thừa.","• Câu 182 (Chi tiết - VB1 Mục 2 \u0026 VB2 Mục 1): \u0027exceeding a mandatory minimum operating liquidity buffer of $10,000,000.00\u0027 -\u003e Chọn (C) 10.000.000 USD.","• Câu 183 (Từ vựng ngữ cảnh - VB1): \u0027consolidated funds\u0027 = dòng tiền đã được gom gộp hợp nhất từ nhiều tài khoản con -\u003e Chọn (A) combined.","• Câu 184 (Ghép nối \u0026 Tra cứu - VB2 Mục 3 dòng cuối): \u0027Net Interest Income Credited to Master Account... on October 1: $135,900.00\u0027 ($137,750 tiền lãi gộp trừ $1,850 phí) -\u003e Chọn (C).","• Câu 185 (Chi tiết - VB1 \u0026 VB2): \u0027Linked Zero-Balance Accounts: 14 Active Subsidiaries\u0027 -\u003e Chọn (B) Hiện đang vận hành 14 tài khoản ZBA đang hoạt động.","Bước 4 (25 giây) - Rà soát \u0026 Đúc kết Feynman: Tự đúc kết 1 câu: Dịch vụ tài khoản quét tiền tự động ZBA giống như một chiếc máy hút bụi tài chính gom toàn bộ tiền lẻ của 14 công ty con về một két sắt mẹ vào 5 giờ chiều, giữ lại 10 triệu USD phòng thân và mang phần tiền thừa đi gửi lấy lãi qua đêm kiếm về 135.900 USD mỗi tháng.","1.3. Dịch Song ngữ Xen kẽ Từng Câu (Sentence-by-Sentence Translation)","[Văn bản 1: Hợp đồng Dịch vụ Quản lý Ngân quỹ \u0026 Tài khoản Quét Tiền Tự động — Ngân hàng First Commercial]","FIRST COMMERCIAL TREASURY BANK — CORPORATE LIQUIDITY SERVICES","Master Treasury Management \u0026 Automated Liquidity Sweep Agreement","Client: Vanguard Technologies Group Inc. | Master Account: #TCB-88001","NGÂN HÀNG QUẢN LÝ NGÂN QUỸ THƯƠNG MẠI FIRST — DỊCH VỤ THANH KHOẢN DOANH NGHIỆP","Hợp đồng Khung Quản lý Ngân quỹ \u0026 Quét Thanh khoản Tự động","Khách hàng: Tập đoàn Công nghệ Vanguard | Tài khoản Tập trung Mẹ: #TCB-88001","Vanguard Technologies and its fourteen (14) operating subsidiaries shall maintain designated subsidiary disbursement and collection accounts operating as Zero-Balance Accounts (ZBA) with a target end-of-day balance of $0.00.","Tập đoàn Công nghệ Vanguard và mười bốn (14) công ty con đang hoạt động sẽ duy trì các tài khoản thu chi của công ty con vận hành dưới hình thức Tài khoản Số dư Bằng Không (ZBA) với số dư sổ cái mục tiêu vào cuối ngày đúng bằng 0,00 USD.","At 5:00 PM EST, all surplus collected funds from subsidiary accounts are automatically swept upward into the Parent Master Concentration Account #TCB-88001.","Vào lúc 17:00 giờ EST, toàn bộ số tiền thu thừa từ các tài khoản công ty con sẽ tự động được quét gom lên Tài khoản Tập trung Mẹ của Công ty Mẹ số #TCB-88001.","Concurrently, if a subsidiary account presents debits, the bank automatically transfers down the exact required funding from the Master Account to cover disbursements, preventing overdraft penalties.","Đồng thời, nếu một tài khoản công ty con phát sinh các khoản ghi nợ chi tiền, ngân hàng sẽ tự động điều chuyển xuống số tiền chính xác cần thiết từ Tài khoản Mẹ để bù đắp các khoản chi, ngăn chặn các khoản phí phạt thấu chi.","All idle consolidated funds residing in the Master Account exceeding a mandatory minimum operating liquidity buffer of $10,000,000.00 shall be automatically swept into overnight money market instruments.","Toàn bộ số tiền nhàn rỗi hợp nhất nằm tại Tài khoản Mẹ vượt quá mức đệm thanh khoản hoạt động tối thiểu bắt buộc là 10.000.000,00 USD sẽ tự động được quét đầu tư vào các công cụ thị trường tiền tệ qua đêm.","Investments include Overnight US Treasury Repurchase Agreements (Repos) backed 102% by government debt and Institutional Certificates of Deposit (CDs). Monthly ZBA fee: $25.00 per account.","Các danh mục đầu tư bao gồm Hợp đồng Mua lại Trái phiếu Chính phủ Mỹ Qua đêm (Repo) được bảo đảm 102% bằng nợ chính phủ và Chứng chỉ Tiền gửi Doanh nghiệp (CD). Phí duy trì ZBA hàng tháng: 25,00 USD mỗi tài khoản.","[Văn bản 2: Báo cáo Hiệu suất Lợi suất Tiền gửi Ngân quỹ Hàng tháng — Khối Vận hành Thanh khoản]","FIRST COMMERCIAL TREASURY BANK — GLOBAL LIQUIDITY REPORTING","Monthly Corporate Yield \u0026 Interest Performance Summary","Period: September 1 to September 30 (30 Days) | Client: Vanguard Technologies Group | Master: #TCB-88001","NGÂN HÀNG QUẢN LÝ NGÂN QUỸ THƯƠNG MẠI FIRST — BÁO CÁO THANH KHOẢN TOÀN CẦU","Báo cáo Tổng hợp Hiệu suất Tiền lãi \u0026 Lợi suất Doanh nghiệp Hàng tháng","Kỳ Báo cáo: 1 Tháng 9 đến 30 Tháng 9 (30 Ngày) | Khách hàng: Tập đoàn Công nghệ Vanguard | Tài khoản Mẹ: #TCB-88001","Total Subsidiary Cash Swept to Master: $840,000,000.00 | Average Daily Consolidated Balance: $28,000,000.00.","Tổng Số tiền từ Công ty Con Quét về Tài khoản Mẹ: 840.000.000,00 USD | Số dư Sổ cái Hợp nhất Bình quân Hàng ngày: 28.000.000,00 USD.","Mandatory Daily Operating Buffer: $10,000,000.00 | Average Nightly Balance in Overnight Treasury Repos: $18,000,000.00 ($28M - $10M buffer).","Mức Đệm Dự trữ Hoạt động Hàng ngày Bắt buộc: 10.000.000,00 USD | Số dư Đêm Bình quân Đầu tư Repo Trái phiếu Kho bạc: 18.000.000,00 USD (28M trừ 10M đệm dự phòng).","Overnight Repo Yield (4.85% per annum): $18,000,000.00 x 4.85% x (30 / 360) = $72,750.00 gross interest.","Lợi suất Repo Trái phiếu Kho bạc Qua đêm (4,85%/năm): 18.000.000,00 USD x 4,85% x (30 ngày / 360 ngày) = 72.750,00 USD tiền lãi gộp.","Institutional 30-Day CD Tranche (Fixed 5.20% on $15.0M): $15,000,000.00 x 5.20% x (30 / 360) = $65,000.00 gross interest. Total Gross Interest: $137,750.00.","Gói Chứng chỉ Tiền gửi CD Doanh nghiệp 30 Ngày (Cố định 5,20% trên 15,0 triệu USD): 15.000.000,00 USD x 5,20% x (30 ngày / 360 ngày) = 65.000,00 USD tiền lãi gộp. Tổng Tiền Lãi Gộp: 137.750,00 USD.","Bank Fees: 14 ZBA accounts x $25 = -$350.00 | Sweep Processing Fee: -$1,500.00 | Total Bank Fees: -$1,850.00.","Phí Ngân hàng: 14 tài khoản ZBA x 25 USD = -350,00 USD | Phí Xử lý Quét tiền Ngân quỹ: -1.500,00 USD | Tổng Phí Ngân hàng: -1.850,00 USD.","Net Interest Credited to Master Account #TCB-88001 on October 1: $135,900.00 ($137,750.00 - $1,850.00).","Số Tiền Lãi Thuần Ghi Có vào Tài khoản Mẹ #TCB-88001 vào Ngày 1 Tháng 10: 135.900,00 USD (137.750,00 USD trừ 1.850,00 USD).","1.4. Dịch chi tiết Câu hỏi \u0026 Phương án Trắc nghiệm","Câu 181. Chức năng chính yếu của Tài khoản Số dư Bằng Không (Zero-Balance Account - ZBA) là gì?","(A) Đóng băng vĩnh viễn dòng tiền doanh nghiệp trong các đợt thanh tra kiểm toán thuế","(B) Duy trì số dư cuối ngày đúng bằng 0 bằng cách tự động điều chuyển số tiền thặng dư","(C) Ngăn chặn các công ty con thực hiện các giao dịch mua sắm vượt quá 25 USD mỗi lần","(D) Chuyển đổi tiền mặt doanh nghiệp thành các công cụ phái sinh tiền tệ vào cuối phiên giao dịch","Câu 182. Bao nhiêu tiền mặt bắt buộc phải duy trì làm đệm dự phòng hoạt động tại Tài khoản Mẹ trước khi tiền được quét đem đi đầu tư?","(A) 1.850,00 USD","(B) 350,00 USD","(C) 10.000.000,00 USD","(D) 28.000.000,00 USD","Câu 183. Trong Văn bản 1, đoạn 2, từ \u0027consolidated\u0027 gần nghĩa nhất với từ nào sau đây?","(A) Được gộp chung, hợp nhất lại (combined)","(B) Bị loại bỏ vứt đi (discarded)","(C) Được vay mượn từ bên ngoài (borrowed)","(D) Bị trì hoãn thanh toán (delayed)","Câu 184. Khoản thu nhập tiền lãi thuần được ghi có vào tài khoản của Vanguard Technologies vào ngày 1 tháng 10 là bao nhiêu?","(A) 65.000,00 USD","(B) 72.750,00 USD","(C) 135.900,00 USD","(D) 137.750,00 USD","Câu 185. Điều gì được chỉ ra về các tài khoản công ty con của Vanguard Technologies trong Văn bản 2?","(A) Bốn tài khoản công ty con đã phát sinh phí phạt thấu chi trong tháng 9.","(B) Tập đoàn hiện đang vận hành mười bốn tài khoản số dư bằng không ZBA đang hoạt động.","(C) Mỗi công ty con được phép tự ý đầu tư vào trái phiếu doanh nghiệp rác một cách độc lập.","(D) Ngân hàng đã tăng phí duy trì tài khoản ZBA hàng tháng từ 25 USD lên 350 USD mỗi tài khoản.","1.5. Tóm tắt Viết lại Toàn bài theo Feynman (Feynman Monograph Summary)","English Executive Summary:","• Corporate Liquidity Consolidation Architecture: Vanguard Technologies operates an automated multi-entity cash pooling agreement with First Commercial Treasury Bank, linking 14 subsidiary Zero-Balance Accounts (ZBAs) that sweep daily excess cash to Parent Master Account #TCB-88001 at 5:00 PM EST while auto-funding disallowance debits.","• Overnight Investment Sweep \u0026 Operating Buffer: All daily consolidated liquidity exceeding a mandatory $10.0M operating buffer is automatically swept into money market instruments, specifically 102% collateralized US Treasury Repurchase Agreements (Repos) and 30-day institutional CDs.","• Monthly Yield Performance \u0026 Net Disbursement: In September, an average invested nightly balance of $18.0M in overnight repos (at 4.85% = $72,750) and a $15.0M CD tranche (at 5.20% = $65,000) generated $137,750.00 in gross interest; after netting $1,850.00 in total bank charges ($350 for 14 ZBA maintenance fees + $1,500 sweep fee), the bank credited $135,900.00 in net interest to the master account on October 1.","Bản tóm tắt Tiếng Việt cốt lõi:","• Kiến Trúc Quản Lý Ngân Quỹ \u0026 Quét Tiền Tập Trung: Tập đoàn Vanguard ký hợp đồng gom thanh khoản tự động với Ngân hàng First Commercial, liên kết 14 tài khoản công ty con theo cơ chế số dư bằng không (ZBA) tự động gom tiền thừa về Tài khoản Mẹ #TCB-88001 lúc 17:00 hàng ngày và tự động cấp tiền thanh toán ghi nợ để triệt tiêu phí phạt thấu chi.","• Đầu Tư Sinh Lời Tự Động \u0026 Hạn Mức Đệm An Toàn: Toàn bộ nguồn vốn hợp nhất vượt trên mức đệm dự phòng hoạt động bắt buộc 10,000,000 USD được hệ thống tự động quét đem đầu tư qua đêm vào Hợp đồng mua lại trái phiếu kho bạc Mỹ (Repo) có tài sản bảo đảm 102% và Chứng chỉ tiền gửi doanh nghiệp 30 ngày (CD).","• Hiệu Suất Lợi Suất \u0026 Quyết Toán Tiền Lãi Tháng 9: Trong tháng 9, số dư bình quân 18 triệu USD đầu tư Repo qua đêm (lãi 4,85% = 72.750 USD) và 15 triệu USD đầu tư CD (lãi 5,20% = 65.000 USD) đã tạo ra 137.750 USD tiền lãi gộp; sau khi trừ 1.850 USD phí dịch vụ ngân hàng (350 USD cho 14 tài khoản ZBA + 1.500 USD phí vận hành quét tiền), ngân hàng đã ghi có 135.900 USD tiền lãi thuần vào Tài khoản Mẹ ngày 01/10.","PHẦN 2: ACTIVE RECALL 5 GIÂY (BẢNG MA TRẬN ĐỊNH VỊ SONG NGỮ)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["1. Đối tượng \u0026 Vai trò: First Commercial Treasury Bank (Ngân hàng đại lý vận hành hệ thống quét tiền ZBA và đầu tư Repo qua đêm) \u003c-\u003e Vanguard Technologies Group (Tập đoàn công nghệ tập trung hóa quản lý ngân quỹ cho 14 công ty con).","1. Stakeholders \u0026 Roles: First Commercial Treasury Bank (Wholesale bank operating automated ZBA sweeps and overnight repo liquidity engines) \u003c-\u003e Vanguard Technologies Group (Corporate parent centralizing cash management across 14 operating subsidiaries)."]],[["2. Boi canh \u0026 Quy trinh loi"],["2. Bối cảnh \u0026 Quy trình lõi: Quản trị Thanh khoản Tự động \u0026 Tối ưu Lợi suất Qua đêm (Cash Management Sweeps \u0026 Overnight Yield Optimization): Thu gom tiền thừa từ 14 công ty con về tài khoản mẹ vào 17:00 hàng ngày -\u003e Duy trì 10 triệu USD đệm an toàn -\u003e Quét phần tiền nhàn rỗi đầu tư Repo qua đêm và CD -\u003e Tự động đối soát và ghi có tiền lãi ròng hàng tháng.","2. Business Context \u0026 Core Flow: Automated Treasury Sweeping \u0026 Overnight Cash Optimization: End-of-day concentration sweeps from 14 subsidiaries into master account -\u003e Enforcing $10M liquidity reserve buffer -\u003e Programmatically investing surplus in overnight repos and CDs -\u003e Crediting net monthly interest."]],[["3. Dau vet suy luan cheo"],["3. Dấu vết suy luận chéo: Số dư bình quân $28M trừ $10M đệm = $18M đầu tư Repo qua đêm (lãi $72,750) cộng $15M CD (lãi $65,000) = $137,750 lãi gộp (VB2) -\u003e Khấu trừ $1,850 phí dịch vụ (14 tài khoản x $25 + $1,500 phí xử lý) -\u003e Số tiền lãi thực nhận được ghi có là $135,900 vào ngày 01/10.","3. Key Cross-Referencing Clues: Average balance $28M minus $10M buffer = $18M in repos yielding $72,750 plus $65,000 CD yield = $137,750 gross interest (Passage 2) -\u003e Netting $1,850 in total bank charges (14 accounts x $25 + $1,500 sweep fee) -\u003e Produces net interest credit of $135,900 on October 1."]]],"t":"table"},"PHẦN 3: ĐÁP ÁN CHUẨN XÁC \u0026 DẤU VẾT TRUY XUẤT CHÉO (CROSS-REFERENCING \u0026 TRAP BREAKDOWN)","181. What is the primary function of a Zero-Balance Account (ZBA)?","Dap an dung: (B) To maintain an end-of-day balance of zero by automatically transferring surplus cash","[Dau vet bai doc / Clue]: Văn bản 1, Mục 1: \u0027Each subsidiary account operates as a Zero-Balance Account (ZBA) with a target end-of-day ledger balance of exactly $0.00... all surplus collected funds... are automatically swept upward into the Parent Master Concentration Account...\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027target end-of-day ledger balance of exactly $0.00... surplus collected funds are automatically swept upward\u0027 \u003c-\u003e \u0027maintain an end-of-day balance of zero by automatically transferring surplus cash\u0027","[Loi giai chi tiet]: Tài khoản Số dư Bằng Không (ZBA) có chức năng cơ bản là tự động quét toàn bộ tiền thừa chuyển về tài khoản tập trung mẹ vào cuối ngày làm việc để số dư sổ cái luôn bằng 0 USD, đồng thời tự động nhận tiền rót xuống khi có lệnh chi trả.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) To permanently freeze corporate funds during tax audit investigations","- Ly do sai: ZBA là công cụ quản lý thanh khoản linh hoạt, không phải biện pháp cưỡng chế phong tỏa tài khoản kiểm toán.","- Bay ETS: Bẫy Phong tỏa Thanh tra Thuế (Tax Investigation Trap)","(C) To prevent subsidiaries from making purchases exceeding $25 per transaction","- Ly do sai: 25 USD là phí duy trì tài khoản hàng tháng, không phải hạn mức thanh toán tối đa của công ty con.","- Bay ETS: Bẫy Nhầm lẫn Phí Tài khoản với Hạn mức Giao dịch (Fee vs. Limit Trap)","(D) To convert corporate cash into foreign currency derivatives at the close of trading","- Ly do sai: Tài khoản ZBA phục vụ tập trung hóa dòng tiền nội tệ, không thực hiện các giao dịch phái sinh ngoại hối.","- Bay ETS: Bẫy Phái sinh Tiền tệ Lạc đề (Irrelevant Currency Derivative Trap)","182. How much cash must be maintained as an operating reserve buffer in the Master Account before funds can be swept into investments?","Dap an dung: (C) $10,000,000.00","[Dau vet bai doc / Clue]: Văn bản 1, Mục 2: \u0027All idle consolidated funds residing in the Master Concentration Account exceeding a mandatory minimum operating liquidity buffer of $10,000,000.00 shall be automatically swept...\u0027","[Dien dat tuong duong / Paraphrase]: • Tra cứu trực tiếp: \u0027mandatory minimum operating liquidity buffer\u0027 = $10,000,000.00.","[Loi giai chi tiet]: Quy định trong hợp đồng ngân quỹ nêu rõ số tiền mặt bắt buộc phải giữ lại làm đệm dự phòng thanh khoản tại tài khoản mẹ là 10.000.000,00 USD; chỉ phần tiền vượt trên 10 triệu USD mới được quét đem đi đầu tư sinh lời.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) $1,850.00","- Ly do sai: 1.850 USD là tổng chi phí dịch vụ ngân hàng trong tháng 9.","- Bay ETS: Bẫy Chi phí Dịch vụ Ngân hàng (Bank Fee Distractor)","(B) $350.00","- Ly do sai: 350 USD là phí duy trì của 14 tài khoản ZBA (14 x $25).","- Bay ETS: Bẫy Phí ZBA Hàng tháng (Monthly ZBA Fee Distractor)","(D) $28,000,000.00","- Ly do sai: 28.000.000 USD là số dư sổ cái hợp nhất bình quân hàng ngày tại tài khoản mẹ trong tháng 9.","- Bay ETS: Bẫy Số dư Sổ cái Bình quân (Average Daily Balance Trap)","183. In Passage 1, paragraph 2, the word \u0027consolidated\u0027 is closest in meaning to","Dap an dung: (A) combined","[Dau vet bai doc / Clue]: Văn bản 1, Mục 2: \u0027All idle consolidated funds residing in the Master Concentration Account...\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027consolidated\u0027 (được hợp nhất, thu gom gộp lại từ nhiều đơn vị thành viên) \u003c-\u003e \u0027combined\u0027 (kết hợp, gộp chung)","[Loi giai chi tiet]: Trong quản trị ngân quỹ doanh nghiệp, \u0027consolidated funds\u0027 là nguồn tiền mặt đã được gom gộp, kết hợp (combined) từ toàn bộ 14 công ty con về một tài khoản tập trung duy nhất.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(B) discarded","- Ly do sai: \u0027Discarded\u0027 nghĩa là bị loại bỏ, vứt đi; trái ngược hoàn toàn với việc thu gom tích lũy dòng tiền.","- Bay ETS: Bẫy Nghĩa Đối lập Tiêu cực (Negative Antonym Trap)","(C) borrowed","- Ly do sai: \u0027Borrowed\u0027 nghĩa là đi vay mượn; đây là tiền mặt tự có từ hoạt động kinh doanh của các công ty con.","- Bay ETS: Bẫy Tiền Vay Mượn (Borrowing Fallacy)","(D) delayed","- Ly do sai: \u0027Delayed\u0027 nghĩa là bị trì hoãn.","- Bay ETS: Bẫy Trì hoãn Thời gian (Delay Trap)","184. What was the net interest income credited to Vanguard Technologies on October 1?","Dap an dung: (C) $135,900.00","[Dau vet bai doc / Clue]: Văn bản 2, Dòng kết luận cuối cùng: \u0027Net Interest Income Credited to Master Account #TCB-88001 on October 1: $135,900.00 ($137,750.00 - $1,850.00).\u0027","[Dien dat tuong duong / Paraphrase]: • Tính toán trực tiếp: $137,750.00 (Tổng lãi gộp) trừ $1,850.00 (Tổng phí ngân hàng) = $135,900.00 tiền lãi thuần được ghi có.","[Loi giai chi tiet]: Sau khi lấy tổng tiền lãi gộp tạo ra từ Repo qua đêm và CD 30 ngày (137.750 USD) trừ đi toàn bộ chi phí dịch vụ ngân hàng (1.850 USD), số tiền lãi thuần thực tế được ghi có vào tài khoản mẹ ngày 1 tháng 10 là 135.900,00 USD.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) $65,000.00","- Ly do sai: 65.000 USD chỉ là phần tiền lãi thu được từ chứng chỉ tiền gửi CD 30 ngày.","- Bay ETS: Bẫy Một Nguồn Tiền Lãi (Single Interest Source Trap)","(B) $72,750.00","- Ly do sai: 72.750 USD chỉ là phần tiền lãi thu được từ hợp đồng Repo qua đêm.","- Bay ETS: Bẫy Lãi Repo Chưa Tính CD (Omitted Component Trap)","(D) $137,750.00","- Ly do sai: 137.750 USD là tổng tiền lãi gộp (Gross Interest) trước khi trừ phí dịch vụ ngân hàng.","- Bay ETS: Bẫy Tiền Lãi Gộp Chưa Trừ Phí (Gross Interest Distractor)","185. What is indicated about Vanguard Technologies\u0027 subsidiary accounts in Passage 2?","Dap an dung: (B) The company currently operates fourteen active Zero-Balance Accounts.","[Dau vet bai doc / Clue]: Văn bản 2, Header mục Client info: \u0027Linked Zero-Balance Accounts: 14 Active Subsidiaries\u0027 và VB1: \u0027fourteen (14) operating subsidiaries... operating as Zero-Balance Accounts (ZBA)\u0027.","[Dien dat tuong duong / Paraphrase]: • \u0027Linked Zero-Balance Accounts: 14 Active Subsidiaries\u0027 \u003c-\u003e \u0027currently operates fourteen active Zero-Balance Accounts\u0027","[Loi giai chi tiet]: Báo cáo của ngân hàng First Commercial xác nhận rõ ràng rằng Vanguard Technologies hiện đang kết nối và vận hành 14 tài khoản số dư bằng không (ZBA) đang hoạt động tương ứng với 14 công ty con.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Four of the subsidiary accounts incurred overdraft penalties during September.","- Ly do sai: Cơ chế ZBA tự động điều chuyển tiền từ tài khoản mẹ xuống bù đắp chi tiêu nên không bao giờ xảy ra phạt thấu chi (preventing overdraft penalties).","- Bay ETS: Bẫy Phạt Thấu chi Không Tồn tại (Non-existent Overdraft Trap)","(C) Each subsidiary is allowed to invest in high-yield corporate junk bonds independently.","- Ly do sai: Toàn bộ tiền thừa được gom về tài khoản mẹ quản lý tập trung và chỉ đầu tư vào trái phiếu kho bạc Repo an toàn, công ty con không được tự ý đầu tư trái phiếu rác.","- Bay ETS: Bẫy Tự ý Đầu tư Trái phiếu Rác (Unauthorized Speculation Trap)","(D) The bank increased the monthly ZBA fee from $25 to $350 per account.","- Ly do sai: Phí vẫn giữ nguyên 25 USD/tài khoản; con số 350 USD là tổng phí duy trì của cả 14 tài khoản gộp lại (14 x $25 = $350).","- Bay ETS: Bẫy Nhầm lẫn Phí Đơn vị với Tổng Phí Gộp (Single vs. Aggregate Fee Trap)","PHẦN 4: KỸ THUẬT FEYNMAN SONG NGỮ \u0026 SƠ ĐỒ QUY TRÌNH (TƯ DUY QUẢN LÝ THANH KHOẢN TẬP TRUNG \u0026 BA)","4.1. Sơ đồ Quy trình Luân chuyển Nghiệp vụ (ZBA Sweeps, Liquidity Buffering \u0026 Overnight Repo Yield)","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","Quét Gom Tiền Tự Động Hai Chiều Cuối Ngày (Automated End-of-Day Two-Way ZBA Sweeps)"],[],["BƯỚC 2","Trích Lập Đệm An Toàn \u0026 Tự Động Quét Tiền Nhàn Rỗi Đầu Tư Qua Đêm (Liquidity Buffer \u0026 Repo)"],[],["BƯỚC 3","Tái Hoàn Trả Gốc Sáng Hôm Sau \u0026 Đối Soát Tiền Lãi Hàng Tháng (Morning Unwind \u0026 Monthly Net Credit)"]],[["• Chung tu \u0026 Kenh: 14 Tài khoản Công ty Con -\u003e Cổng Ngân hàng Điện tử First Commercial Treasury","• Nghiep vu thuc thi: Vào lúc 17:00 hàng ngày, hệ thống tự động quét gom toàn bộ số dư thừa từ 14 công ty con về Tài khoản Mẹ #TCB-88001 và tự động bơm tiền xuống bù đắp các lệnh chi trả, đưa số dư tài khoản con về đúng 0,00 USD","• Ket qua \u0026 Kiem soat: Báo cáo Quyết toán Quét Gom Tiền Hàng ngày (Daily Sweep Log) + Triệt tiêu Hoàn toàn Phí Phạt Thấu chi"],["➔"],["• Chung tu \u0026 Kenh: Tài khoản Tập trung Mẹ #TCB-88001 -\u003e Bàn Giao dịch Thị trường Tiền tệ Ngân hàng","• Nghiep vu thuc thi: Khóa giữ 10.000.000 USD làm đệm dự phòng thanh khoản hoạt động; phần tiền nhàn rỗi vượt hạn mức (bình quân 18 triệu USD) tự động đầu tư vào Hợp đồng mua lại Trái phiếu Kho bạc Mỹ (Repo lãi 4,85%) và CD (5,20%)","• Ket qua \u0026 Kiem soat: Xác nhận Giao dịch Mua lại Qua đêm (Overnight Repo Ticket) + Tài sản Bảo đảm 102% Trái phiếu Kho bạc"],["➔"],["• Chung tu \u0026 Kenh: Bàn Giao dịch Tiền tệ -\u003e Tài khoản Mẹ Vanguard Technologies #TCB-88001","• Nghiep vu thuc thi: Vào 08:00 sáng hôm sau, tiền gốc và lãi tự động hoàn trả về tài khoản mẹ để phục vụ chi tiêu ngày mới; đến cuối tháng đối soát tổng lãi gộp ($137.750) trừ phí dịch vụ ($1.850), ghi có $135.900 tiền lãi ròng ngày 01/10","• Ket qua \u0026 Kiem soat: Báo cáo Lợi suất Ngân quỹ Hàng tháng (Monthly Yield Statement) + Giấy Báo Có Tiền Lãi Ròng $135.900 USD"]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["STEP 1","END-OF-DAY AUTOMATED BIDIRECTIONAL ZBA SWEEPS"],[],["STEP 2","LIQUIDITY BUFFER ENFORCEMENT \u0026 OVERNIGHT REPO INVESTMENT"],[],["STEP 3","MORNING REPO UNWIND \u0026 MONTHLY NET INTEREST CREDITING"]],[["• Documents \u0026 Channels: • Documents \u0026 Channels: 14 Subsidiary Operating Accounts -\u003e First Commercial Treasury Gateway","• Core Business Execution: • Core Business Execution: At 5:00 PM EST daily, automated algorithms sweep surplus cash from 14 subsidiaries up to Master Account #TCB-88001 and fund disbursements downward, returning subsidiary ledgers to exactly $0.00.","• Key Deliverable \u0026 Control: • Key Deliverable \u0026 Control: Daily Two-Way Sweep Log + Elimination of Overdraft Liabilities"],["➔"],["• Documents \u0026 Channels: • Documents \u0026 Channels: Master Concentration Account #TCB-88001 -\u003e Money Market Desk","• Core Business Execution: • Core Business Execution: Isolate mandatory $10.0M operational liquidity buffer; sweep surplus nightly balances ($18.0M average) into 102% collateralized US Treasury Repurchase Agreements (at 4.85%) and 30-day CDs (at 5.20%).","• Key Deliverable \u0026 Control: • Key Deliverable \u0026 Control: Overnight Repo Execution Confirmations + 102% US Treasury Collateral Holding"],["➔"],["• Documents \u0026 Channels: • Documents \u0026 Channels: Money Market Desk -\u003e Master Concentration Account #TCB-88001","• Core Business Execution: • Core Business Execution: Unwind principal and overnight interest back to the Master Account at 8:00 AM EST for daily operations; reconcile $137,750 gross interest against $1,850 fees to credit $135,900 net on Oct 1.","• Key Deliverable \u0026 Control: • Key Deliverable \u0026 Control: Monthly Treasury Yield Performance Statement + Net Interest Credit Advice of $135,900.00"]]],"t":"table"},"4.2. Tư duy Phân tích Nghiệp vụ Quản trị Ngân quỹ Tập trung \u0026 BA (Bản Tiếng Việt)","• Bức tranh Toàn cảnh Quản lý Ngân quỹ Tập trung (End-to-End Flow): Một hệ thống quản trị thanh khoản ngân quỹ doanh nghiệp quy mô tập đoàn đa thành viên vận hành qua 3 luồng: (1) Luồng Gom Tiền và Điều Tiết Hai Chiều Tự Động (Two-Way Cash Concentration Stream): Thay vì để tiền mặt nằm phân tán manh mún tại 14 công ty con (nơi thừa tiền thì để không, nơi thiếu tiền thì bị ngân hàng phạt lãi thấu chi), hệ thống ZBA gom toàn bộ tiền lẻ về một két sắt mẹ duy nhất vào 17:00 hàng ngày và tự động rót tiền xuống đúng bằng số tiền chi trả thực tế; (2) Luồng Bảo toàn An toàn Vốn \u0026 Đầu tư Sinh lời Qua Đêm (Liquidity Buffering \u0026 Overnight Repo Yield Stream): Tập đoàn không đem toàn bộ tiền đi đầu tư mạo hiểm mà thiết lập \u0027Hạn mức đệm an toàn\u0027 (10 triệu USD) luôn sẵn sàng cho ngày hôm sau; phần tiền thặng dư vượt hạn mức (18 triệu USD) được tự động đem đi gửi qua đêm vào các Hợp đồng mua lại Trái phiếu Chính phủ Mỹ (Repo) được bảo đảm 102% tài sản thế chấp rủi ro bằng 0, biến từng đồng tiền nhàn rỗi ban đêm thành lợi nhuận thực tế; (3) Luồng Đối Soát \u0026 Tối Ưu Chi Phí Dịch Vụ Ngân Hàng (Treasury Fee Netting \u0026 Accounting): Toàn bộ chi phí duy trì tài khoản ZBA ($350) và phí vận hành quét tiền ($1.500) được cấn trừ trực tiếp vào tiền lãi gộp thu được ($137.750), giúp tập đoàn thu về dòng tiền lãi thuần hơn 135.900 USD mỗi tháng một cách hoàn toàn tự động mà không tốn công sức kế toán thủ công.","• Điểm nghẽn \u0026 Rủi ro Vận hành Thực tế (Core Bottleneck \u0026 Risk): Rủi ro Lệch Pha Khung Giờ Cắt Lệnh Chuyển Tiền (Cut-Off Time Failure) và Rủi ro Lỗi Bất đồng bộ Số dư Sổ Cái với Tiền Thực tế (Ledger vs. Collected Balance Mismatch). Nếu một công ty con nhận tiền thanh toán bằng séc giấy chưa được ngân hàng bù trừ thu tiền thực (Uncollected funds), mà hệ thống vẫn tự động quét đi, tài khoản mẹ sẽ bị ghi nhận số dư ảo. Ngoài ra, nếu các lệnh chi tiền của công ty con bị kẹt sau khung giờ chốt lệnh 17:00, hệ thống sẽ không kịp bơm tiền từ tài khoản mẹ xuống, dẫn đến nguy cơ các séc thanh toán cho đối tác bị ngân hàng trả về (bounced checks) làm tổn hại uy tín doanh nghiệp.","• 3 Giải pháp Thiết kế Hệ thống \u0026 Phân tích Nghiệp vụ (BA Solutions):","(1) Hệ thống Nhận diện Số dư Thu Thực tế Trước Khi Quét (Collected Balance Validation Filter): Thiết lập bộ lọc logic trên phần mềm ngân quỹ: chỉ quét các khoản tiền mặt đã bù trừ hoàn tất (Good Funds / Collected Balances), tự động loại trừ các khoản séc đang chờ đối soát để ngăn chặn việc điều chuyển số dư ảo trong nội bộ tập đoàn.","(2) Tự động Hóa Phân Bổ Hạn Mức Đệm An Toàn Linh Hoạt Theo Mùa Vụ (Dynamic Liquidity Buffer Engine): Thay vì khóa cứng mức đệm 10 triệu USD quanh năm, hệ thống áp dụng thuật toán máy học dự báo nhu cầu chi tiêu của 14 công ty con: vào những ngày cao điểm trả lương hoặc thanh toán công nợ nhà cung cấp, hệ thống tự động nâng mức đệm lên 15 triệu USD để bảo đảm tuyệt đối không bị thiếu hụt tiền mặt.","(3) Kết nối Trực Tiếp Cổng Ngân hàng Mở Open Banking API (Host-to-Host Treasury API Integration): Xây dựng kênh truyền thông Host-to-Host bảo mật cao theo chuẩn ISO 20022 camt.053 (Báo cáo sao kê điện tử) và pain.001 (Lệnh thanh toán tự động) kết nối trực tiếp ERP tập đoàn với hệ thống ngân hàng First Commercial, tự động cập nhật số dư ZBA từng giây và tự động hạch toán bút toán thu nhập lãi ròng hàng tháng vào sổ cái kế toán tập trung.","4.3. Business Analyst \u0026 Treasury Management Systems Executive Summary (Bản Tiếng Anh)","• End-to-End Treasury Liquidity Sweeping Context: Modern corporate cash concentration unifies three automated dimensions: (1) Dematerialized Two-Way Pooling: Eliminating trapped liquidity across 14 operating subsidiaries by deploying automated Zero-Balance Accounts (ZBAs) that sweep surplus cash to Master Account #TCB-88001 at 5:00 PM EST and fund real-time disbursement debits to eliminate overdraft liabilities; (2) Algorithmic Risk-Free Yield Harvesting: Enforcing a rigid $10.0M working liquidity cushion while automatically deploying surplus overnight balances ($18.0M average) into 102% collateralized US Treasury Repurchase Agreements (4.85%) and 30-day CDs (5.20%); (3) Fee-Netting Settlement Automation: Deducting fixed ZBA maintenance charges ($350) and sweep fees ($1,500) directly against gross monthly interest ($137,750), programmatically posting $135,900.00 in net interest income on the first business day of each month.","• Core Operational Bottleneck \u0026 Risk: Cut-off Window Latency and Collected vs. Ledger Balance Discrepancies. Sweeping uncollected funds creates phantom liquidity that collapses if incoming checks fail clearance. Simultaneously, payment queues received post-5:00 PM EST cut-off fail to trigger automated down-sweeps, creating bounced vendor disbursements and reputational damage.","• Key BA \u0026 Treasury Management System Architecture Solutions:","(1) Collected Funds Pre-Sweep Validation Rules: Embed transaction filters that evaluate the clearing status of subsidiary inflows, ensuring only settled, irrevocable balances (\u0027good funds\u0027) are swept to the master concentration pool.","(2) Dynamic AI Cash Buffer Forecasting Engine: Replace static $10M reserve thresholds with predictive models that ingest subsidiary accounts payable calendars, automatically flexing the master liquidity cushion upward during bi-weekly payroll and month-end vendor clearing cycles.","(3) Direct Host-to-Host (H2H) ISO 20022 Open Banking Integration: Implement secure H2H API gateways parsing real-time ISO 20022 XML feeds (camt.053 bank statements and pain.001 payment instructions), synchronizing intercompany sweep journals and automating net interest ledger reconciliations with zero manual touch.","4.4. Tam giác Liên kết Nhận thức Đa chiều (Multi-Perspective Contextual Anchoring)","1. Lăng kính Quản trị Dòng tiền Tập trung Viettel: Bài toán tập trung hóa dòng tiền của Tập đoàn Viettel từ hàng chục nghìn điểm bán, cửa hàng giao dịch và chi nhánh tỉnh thành trên toàn quốc về Tài khoản Quản lý Ngân quỹ Tập trung (Master Account) tại các ngân hàng lớn. Việc gom tiền tự động cuối ngày giúp Tập đoàn triệt tiêu tình trạng \u0027nơi thừa vốn thì để tài khoản vãng lai không sinh lãi, nơi thiếu vốn thì phải vay ngân hàng chịu lãi suất cao\u0027, đồng thời tối ưu hóa lợi suất tiền gửi qua đêm an toàn hàng trăm tỷ đồng mỗi năm.","2. Lăng kính Quản trị Trường Mầm non Ước Mơ Xanh (cô Thu Huyền): Bài toán quản lý thu học phí của 5 cơ sở lớp mầm non vệ tinh: Cô Thu Huyền yêu cầu các cơ sở gom toàn bộ tiền mặt thu học phí nộp về tài khoản trung tâm của trường vào cuối mỗi buổi chiều; nhà trường giữ lại một khoản tiền mặt nhỏ trong két sắt để các cô mua sữa và rau quả tươi hàng ngày (giống như đệm an toàn 10 triệu USD), còn toàn bộ số tiền lớn được gửi vào tài khoản tiết kiệm linh hoạt sinh lời để tối ưu hóa nguồn thu của nhà trường.","3. Lăng kính Bàn học Gia đình (Kèm cặp học sinh Lớp 5 - Bé Hà Ngân): Bài học \u0027Két sắt tập trung của hai chị em\u0027: Hà Ngân và em trai mỗi bạn có một chiếc ví nhỏ đi học; buổi tối về nhà, bố mẹ dặn hai con bỏ hết tiền thừa vào \u0027Hũ tiết kiệm chung của gia đình\u0027 (giống như tài khoản ZBA gom tiền về tài khoản mẹ), sáng hôm sau bố mẹ lại phát đúng số tiền mua bánh mì ăn sáng vào ví; tiền trong hũ chung khi đầy sẽ được bố mang ra ngân hàng gửi sổ tiết kiệm lấy lãi, giúp Hà Ngân hiểu rõ cơ chế gom tiền tập trung và cách thức đồng tiền sinh sôi nảy nở.","PHẦN 5: BẢNG TỪ VỰNG \u0026 CẤU TRÚC CỐT LÕI (8 THUẬT NGỮ QUẢN LÝ THANH KHOẢN \u0026 NGÂN QUỸ)","1. Zero-Balance Account (ZBA) (n phr)  /ˈzɪroʊ ˈbæləns əˈkaʊnt/  = target-balance account / auto-sweeping subsidiary bank account","Nghia: Tài khoản số dư bằng không (tài khoản tự động gom tiền thừa về tài khoản mẹ và nhận tiền bù đắp chi tiêu để số dư luôn bằng 0)","Vd: Each subsidiary operates a Zero-Balance Account to centralize corporate liquidity. - Mỗi công ty con vận hành một tài khoản số dư bằng không để tập trung hóa thanh khoản tập đoàn.","2. concentration account (n phr)  /ˌkɑːnsenˈtreɪʃn əˈkaʊnt/  = master treasury account / centralized pooling depository","Nghia: Tài khoản tập trung / Tài khoản mẹ (nơi thu gom toàn bộ dòng tiền từ các tài khoản con)","Vd: Surplus cash is automatically swept upward into the Master Concentration Account. - Tiền mặt dư thừa tự động được quét gom lên Tài khoản Tập trung Mẹ.","3. sweep account (n phr)  /swiːp əˈkaʊnt/  = automated cash transfer service / overnight yield reinvestment mechanism","Nghia: Tài khoản quét tiền tự động (tài khoản tự động chuyển phần tiền nhàn rỗi đem đi gửi sinh lời)","Vd: The bank\u0027s automated sweep account maximized returns on idle overnight balances. - Tài khoản quét tiền tự động của ngân hàng đã tối đa hóa lợi suất trên số dư nhàn rỗi qua đêm.","4. repurchase agreement (Repo) (n phr)  /riːˈpɜːrtʃəs əˈɡriːmənt/  = collateralized money market loan / government-backed overnight financing instrument","Nghia: Hợp đồng mua lại Repo (thỏa thuận bán chứng khoán có cam kết mua lại sau một thời gian ngắn để hưởng lãi)","Vd: Idle funds were invested in overnight US Treasury Repurchase Agreements yielding 4.85%. - Nguồn tiền nhàn rỗi được đầu tư vào các Hợp đồng mua lại Trái phiếu Kho bạc Mỹ qua đêm với lợi suất 4,85%.","5. liquidity buffer (n phr)  /lɪˈkwɪdəti ˈbʌfər/  = cash reserve cushion / mandatory operational safety balance","Nghia: Đệm thanh khoản an toàn (khoản tiền mặt bắt buộc phải giữ lại để chi tiêu thường xuyên trước khi đem đầu tư)","Vd: Management maintains a ten-million-dollar liquidity buffer to absorb unexpected disbursements. - Ban điều hành duy trì mức đệm thanh khoản 10 triệu USD để dự phòng các khoản chi bất ngờ.","6. overdraft penalty (n phr)  /ˈoʊvərdræft ˈpenəlti/  = negative balance fee / insufficient funds surcharge","Nghia: Phí phạt thấu chi (khoản phạt khi chi tiêu vượt quá số dư tiền gửi có sẵn trong tài khoản)","Vd: Automated funding from the master account completely prevented overdraft penalties. - Cơ chế tự động bơm vốn từ tài khoản mẹ đã ngăn chặn hoàn toàn các khoản phí phạt thấu chi.","7. collected balance (n phr)  /kəˈlektɪd ˈbæləns/  = cleared cash funds / good available money ready for withdrawal or investment","Nghia: Số dư đã thu thực tế (tiền mặt đã được ngân hàng bù trừ xong, sẵn sàng rút hoặc đầu tư)","Vd: Only collected balances are eligible for overnight liquidity sweep investments. - Chỉ có các số dư đã thu thực tế mới đủ điều kiện để quét đem đi đầu tư thanh khoản qua đêm.","8. certificate of deposit (CD) (n phr)  /sərˈtɪfɪkət əv dɪˈpɑːzɪt/  = fixed-term bank deposit promissory note / time deposit instrument","Nghia: Chứng chỉ tiền gửi CD (giấy tờ có giá do ngân hàng phát hành chứng nhận tiền gửi có kỳ hạn)","Vd: The treasury group allocated fifteen million dollars to an institutional certificate of deposit. - Khối ngân quỹ đã phân bổ 15 triệu USD vào một chứng chỉ tiền gửi dành cho khách hàng tổ chức.","==================================================================================================","PHẦN TỔNG HỢP: MA TRẬN 80 THUẬT NGỮ VÀNG TÀI CHÍNH DOANH NGHIỆP, ĐẦU TƯ, NGÂN HÀNG \u0026 BÁO CÁO THƯỜNG NIÊN (SPACED REPETITION ANKI)",{"rows":[[["STT"],["THUẬT NGỮ \u0026 PHIÊN ÂM (TERM \u0026 IPA)"],["PARAPHRASE ĐỒNG NGHĨA ETS"],["Ý NGHĨA NGHIỆP VỤ \u0026 GỢI NHỚ 5S"]],[["1"],["operating margin (n phr) /ˈɑːpəreɪtɪŋ ˈmɑːrdʒɪn/"],["= operating income ratio / EBIT margin / operational profitability"],["Biên lợi nhuận hoạt động (Tỷ lệ lợi nhuận kinh doanh trên doanh thu thuần)"]],[["2"],["non-recurring item (n phr) /ˌnɑːn rɪˈkɜːrɪŋ ˈaɪtəm/"],["= one-time charge / extraordinary expense / transitory cost"],["Khoản mục bất thường không lặp lại (chi phí phát sinh một lần)"]],[["3"],["diluted earnings per share (n phr) /daɪˈluːtɪd ˈɜːrnɪŋz pər ʃer/"],["= diluted EPS / adjusted net income per common share"],["Lãi pha loãng trên mỗi cổ phần (chỉ số EPS sau khi tính toàn bộ chứng quyền và quyền chọn)"]],[["4"],["share repurchase program (n phr) /ʃer riːˈpɜːrtʃəs ˈproʊɡræm/"],["= stock buyback plan / corporate share reacquisition"],["Chương trình mua lại cổ phiếu quỹ của doanh nghiệp"]],[["5"],["price-to-earnings multiple (n phr) /praɪs tuː ˈɜːrnɪŋz ˈmʌltɪpl/"],["= P/E ratio / valuation multiple / equity pricing coefficient"],["Hệ số giá trên thu nhập (Hệ số P/E đo lường mức độ đắt rẻ của cổ phiếu)"]],[["6"],["divestiture (n) /daɪˈvestɪtʃər/"],["= asset sell-off / business spin-off / disposal of non-core subsidiary"],["Sự bán thoái vốn / Bán bớt mảng kinh doanh hoặc tài sản không cốt lõi"]],[["7"],["consensus estimate (n phr) /kənˈsensəs ˈestɪmət/"],["= Wall Street average projection / analyst median forecast"],["Ước tính đồng thuận (Mức dự báo trung bình của các nhà phân tích Phố Wall)"]],[["8"],["decommission (v) /ˌdiːkəˈmɪʃn/"],["= permanently shut down / retire an industrial facility / take out of service"],["Đóng cửa vĩnh viễn / Ngừng vận hành và tháo dỡ cơ sở sản xuất"]],[["9"],["revolving credit facility (n phr) /rɪˈvɑːlvɪŋ ˈkredɪt fəˈsɪləti/"],["= revolving credit line / flexible corporate credit commitment"],["Hạn mức tín dụng tuần hoàn (cho phép vay, trả nợ và vay lại linh hoạt trong thời hạn)"]],[["10"],["drawdown (n/v) /ˈdrɔːdaʊn/"],["= borrowing tranche / fund disbursement / loan withdrawal"],["Sự rút vốn / Giải ngân một khoản vay theo hạn mức"]],[["11"],["commitment fee (n phr) /kəˈmɪtmənt fiː/"],["= facility availability fee / charge on undrawn loan balance"],["Phí cam kết (khoản phí trả cho ngân hàng trên phần hạn mức tín dụng chưa rút)"]],[["12"],["financial covenant (n phr) /faɪˈnænʃl ˈkʌvənənt/"],["= loan agreement condition / financial ratio restriction / protective clause"],["Giao ước tài chính (các điều khoản bắt buộc bên vay phải duy trì tỷ số an toàn)"]],[["13"],["floating rate (n phr) /ˈfloʊtɪŋ reɪt/"],["= variable interest rate / adjustable borrowing rate / benchmark-linked rate"],["Lãi suất thả nổi (lãi suất biến đổi theo chỉ số cơ sở của thị trường)"]],[["14"],["syndicated loan (n phr) /ˈsɪndɪkeɪtɪd loʊn/"],["= consortium loan / multi-lender credit facility"],["Khoản vay hợp vốn (khoản tín dụng do một nhóm nhiều ngân hàng cùng tài trợ)"]],[["15"],["irrevocable (adj) /ɪˈrevəkəbl/"],["= binding / irreversible / unalterable / incapable of being rescinded"],["Không thể hủy ngang / Có tính ràng buộc pháp lý bắt buộc"]],[["16"],["undrawn balance (n phr) /ˌʌnˈdrɔːn ˈbæləns/"],["= unborrowed credit line / available unused commitment"],["Số dư hạn mức chưa rút (phần tín dụng chưa giải ngân)"]],[["17"],["coupon rate (n phr) /ˈkuːpɑːn reɪt/"],["= nominal interest rate / stated annual bond yield / fixed interest factor"],["Lãi suất coupon (lãi suất danh nghĩa hàng năm ghi trên trái phiếu)"]],[["18"],["maturity date (n phr) /məˈtʃʊrəti deɪt/"],["= redemption date / principal repayment date / expiration date of debt"],["Ngày đáo hạn (thời điểm bên phát hành phải hoàn trả toàn bộ vốn gốc)"]],[["19"],["record date (n phr) /ˈrekərd deɪt/"],["= entitlement cut-off date / official register closing date for dividend or coupon"],["Ngày đăng ký cuối cùng / Ngày chốt danh sách người sở hữu hưởng quyền"]],[["20"],["use of proceeds (n phr) /juːs əv ˈproʊsiːdz/"],["= fund allocation / capital deployment objective / utilization of raised capital"],["Mục đích sử dụng số tiền thu được (từ đợt phát hành chứng khoán)"]],[["21"],["senior unsecured note (n phr) /ˈsiːniər ˌʌnsɪˈkjʊrd noʊt/"],["= unsubordinated debt security without asset collateral backing"],["Trái phiếu ưu tiên không có tài sản bảo đảm (được ưu tiên thanh toán trước nợ thứ cấp khi phá sản)"]],[["22"],["central securities depository (n phr) /ˈsentrəl sɪˈkjʊrətiz dɪˈpɑːzətɔːri/"],["= securities clearing house / book-entry registry / custody facility"],["Trung tâm lưu ký chứng khoán (tổ chức lưu ký và thanh toán bù trừ chứng khoán tập trung)"]],[["23"],["withholding tax (n phr) /wɪðˈhoʊldɪŋ tæks/"],["= tax deducted at source / retention tax on cross-border payments"],["Thuế khấu trừ tại nguồn (khoản thuế bị trừ trực tiếp từ tiền lãi chuyển ra nước ngoài)"]],[["24"],["ex-interest date (n phr) /eks ˈɪntrəst deɪt/"],["= ex-dividend trading cut-off / trading date without right to upcoming interest"],["Ngày giao dịch không hưởng lãi (ngày mà người mua trái phiếu sẽ không được nhận đợt lãi sắp tới)"]],[["25"],["definitive merger agreement (n phr) /dɪˈfɪnətɪv ˈmɜːrdʒər əˈɡriːmənt/"],["= binding acquisition contract / final business combination agreement"],["Hợp đồng sáp nhập dứt khoát (văn bản pháp lý cuối cùng có tính ràng buộc bắt buộc)"]],[["26"],["cost synergy (n phr) /kɔːst ˈsɪnərdʒi/"],["= operational savings from consolidation / economies of scale post-merger"],["Giá trị cộng hưởng chi phí (khoản tiền tiết kiệm được nhờ hợp nhất hai doanh nghiệp)"]],[["27"],["due diligence (n phr) /duː ˈdɪlɪdʒəns/"],["= comprehensive audit investigation / pre-acquisition financial scrutiny"],["Thẩm định chi tiết / Thẩm tra toàn diện (kiểm tra tài chính, pháp lý trước khi mua)"]],[["28"],["merger consideration (n phr) /ˈmɜːrdʒər kənˌsɪdəˈreɪʃn/"],["= acquisition payment method / purchase compensation (cash or stock)"],["Hình thức thanh toán sáp nhập (khoản tiền mặt hoặc cổ phiếu trả cho cổ đông bên bán)"]],[["29"],["annual recurring revenue (ARR) (n phr) /ˈænjuəl rɪˈkɜːrɪŋ ˈrevənuː/"],["= annualized subscription sales / recurring contract value in SaaS"],["Doanh thu định kỳ hàng năm (chỉ số doanh thu cốt lõi của mô hình phần m const isDocHead=s=>(/^((Document|Passage|Text)\s*\d+|Internal Memorandum|Memorandum)\s*:\s*\S/.test(s) && s.length<140) || (DOC_RE.test(s) && s.length<110 && !/:\s/.test(s) && !(s===s.toUpperCase() && /[A-Z]{4}/.test(s)));

  Q.forEach(q=>{

    const os=el('div','opts'); const fb=el('div','q-fb');

      b.addEventListener('click',()=>{
        const right=L.key[q.no]; btns.forEach(x=>x.classList.remove('ok','bad'));
        const good=o.k===right; state[q.no]=good;
        b.classList.add(good?'ok':'bad');
        if(!good&&right){ const rb=btns[q.opts.findIndex(z=>z.k===right)]; rb&&rb.classList.add('ok'); }
        fb.innerHTML=''; const r=el('span','r '+(good?'ok':'bad'),good?'✓ Chính xác':`✗ Chưa đúng · đáp án (${right})`);
        const a=el('a',null,'Xem dấu vết truy xuất'); a.href='#'; a.addEventListener('click',e=>{e.preventDefault(); const t=document.getElementById(`b${L.n}-a${q.no}`); if(t){t.scrollIntoView({behavior:'smooth',block:'center'}); t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash');}});
        add(fb,r,a); upd();
      });
      os.appendChild(b); return b; });
    add(c,os,fb); qz.appendChild(c);
    reset.addEventListener('click',()=>{ btns.forEach(x=>x.classList.remove('ok','bad')); fb.innerHTML=''; delete state[q.no]; upd(); });
  });

}

/* summary paragraph -> one bullet per sentence; a long tail after ": " becomes sub-bullets split at top-level ", and/và/nhờ/đồng thời" or "; " */
const ABBR=/\b(Mr|Ms|Mrs|Dr|St|No|Inc|Co|Ltd|Corp|vs|etc|e\.g|i\.e|approx|Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)\.$/i;
function topSplit(s,test){ // split where test(s,i) matches outside brackets/quotes; returns [pieces]
  const out=[]; let d=0, st=0;
  for(let i=0;i<s.length;i++){ const c=s[i];
    if('(['.includes(c)) d++; else if(')]'.includes(c)) d=Math.max(0,d-1);
    else if(!d){ const n=test(s,i); if(n){ out.push(s.slice(st,i+n.keep).trim()); st=i+n.skip; i=st-1; } } }
  out.push(s.slice(st).trim()); return out.filter(Boolean);
}
function sentences(s){
  return topSplit(s,(t,i)=>{ if(!/[.!?]/.test(t[i])||!/\s/.test(t[i+1]||'')) return null;
    if(ABBR.test(t.slice(Math.max(0,i-6),i+1))) return null;
    const nx=t.slice(i+1).trimStart()[0]||''; if(!/[A-ZÀ-Ỹ0-9"'‘“(]/.test(nx)) return null;
    return {keep:1,skip:1}; });
}
function ideaList(s,vi){
  const ul=el('ul','ideas'+(vi?' vi-t':''));
  sentences(s).forEach(sen=>{
    const li=el('li'); const ci=sen.search(/:\s/); let head=sen, tail='';
    if(ci>20 && sen.length-ci>90){ head=sen.slice(0,ci+1); tail=sen.slice(ci+1).trim(); }
    // long sentence without a colon tail: break at top-level ", allowing / , while / , đồng thời / —"
    if(!tail && sen.length>200){ const ps=topSplit(sen,(t,i)=>{ const m=t.slice(i).match(/^(,\s+(?=(?:allowing|while|whereas|đồng thời|trong khi)\s)|\s*—\s*)/); return m?{keep:0,skip:m[0].length}:null; });
      if(ps.length>1){ head=ps[0]; tail=ps.slice(1); } }
    li.appendChild(document.createTextNode(head));
    if(Array.isArray(tail)){ const sub=el('ul'); tail.forEach(p=>sub.appendChild(el('li',null,p))); li.appendChild(sub); }
    else if(tail){ const parts=topSplit(tail,(t,i)=>{ const m=t.slice(i).match(/^(,\s+(?=(?:and|và|nhờ|đồng thời|rồi|then|while)\s)|;\s+)/); return m?{keep:m[0].startsWith(';')?1:0,skip:m[0].length}:null; });
      const sub=el('ul'); parts.forEach(p=>sub.appendChild(el('li',null,p))); li.appendChild(sub); }
    ul.appendChild(li);
  });
  return ul;
}

/* every table in 4.1 is one diagram (Vietnamese, then the English translation); the text line before a table is its caption.
   Arrow columns ("-->", "➔", "→") are dropped; a step head is "BƯỚC 1: Title" in one cell line or "BƯỚC 1" / "STEP 1" then the title */
function renderFlow(items,box){
  const keep=c=>c.length && !(c.length===1 && /^\s*(-+>|➔|→|➜|⇒|►|>)\s*$/.test(c[0]));
  let cap='';
  items.forEach(it=>{
    if(isStr(it)){ cap=it; return; }
    const tb=it, heads=tb.rows[0].filter(keep), bodies=(tb.rows[1]||[]).filter(keep);
    if(cap){ const c=el('div','strat-t',cap.replace(/:\s*$/,'')); c.style.cssText='color:var(--muted);margin:14px 0 8px'; box.appendChild(c); cap=''; }
    const f=el('div','flow');
    heads.forEach((hc,i)=>{
      const s=el('div','fstep'); const hm=hc[0].match(/^((?:BƯỚC|STEP)\s*\d+)\s*:?\s*(.*)$/i);
      const title=hm?[hm[2],...hc.slice(1)].filter(Boolean).join(' '):hc.join(' ');
      const h=el('h5'); if(hm){ add(h,el('span',null,hm[1]),document.createTextNode(title)); } else h.textContent=title;
      s.appendChild(h);
      (bodies[i]||[]).forEach(x=>{ x=x.replace(/^•\s*/,''); const m=x.match(/^([^:]{2,40}):\s*(.*)$/); const d=el('div','fkv'+(m&&/Đầu ra|Kết quả|Ket qua|Deliverable|Output/i.test(m[1])?' out':''));
        if(m) add(d,el('b',null,m[1]),el('span',null,m[2])); else d.textContent=x; s.appendChild(d); });
      f.appendChild(s);
    });
    box.appendChild(f);
  });
}

  box.appendChild(g);

function shortPart(P){ return ({1:'Văn bản & dịch song ngữ',2:'Active Recall 5 giây',3:'Đáp án & dấu vết',4:'Feynman & quy trình BA',5:'Từ vựng & Paraphrase'})[P.n]||P.title; }
/* page order for PHẦN 1: 1.1 Đề gốc, 1.2 Câu hỏi gốc (both from the doc's 1.1), 1.3 Chiến thuật (the doc's own
   "Hướng dẫn làm bài Part 7" sub-section, or the "Bước" lines inside the doc's 1.1 in older docs), then translation,
   question translation and summary — matched by title so both doc layouts number the same */
function splitPart1(subs){
  const kind=S=>S.id==='1.1'?'1.1':/Hướng dẫn|Strategy|Chiến thuật|Chiến lược/i.test(S.title)?'guide':/Từng Câu|Sentence/i.test(S.title)?'1.2':/Câu hỏi|Question/i.test(S.title)?'1.3':/Song ngữ|Bilingual/i.test(S.title)?'1.2':'1.4';
  const short={'1.2':'Dịch từng câu','1.3':'Dịch câu hỏi','1.4':'Tóm tắt'};
  const s11=subs.find(S=>kind(S)==='1.1'), guide=subs.find(S=>kind(S)==='guide'), out=[];
  if(s11){
    out.push({...s11,src:'1.1',mode:'pass',short:'Đề gốc',title:'Đề thi Tiếng Anh gốc (Original ETS Passages)'});
    out.push({...s11,src:'1.1',mode:'quiz',short:'Câu hỏi gốc',title:'Câu hỏi Tiếng Anh gốc (Original ETS Questions)'});
  }
  if(guide) out.push({...guide,src:'1.1',mode:'guide',short:'Chiến thuật',title:'Hướng dẫn làm bài Part 7 (Strategy Guide)'});
  else if(s11) out.push({...s11,src:'1.1',mode:'strat',short:'Chiến thuật',title:'Hướng dẫn làm bài Part 7 (Strategy Guide)'});
  subs.forEach(S=>{ const k=kind(S); if(k!=='1.1'&&k!=='guide') out.push({...S,src:k,short:short[k]}); });
  out.forEach((S,i)=>S.id='1.'+(i+1));
  return out;
}

function renderParaphrase(){
  const root=el('div'); root.style.setProperty('--c','var(--red)');
  const head=el('div','lesson-head'); head.style.setProperty('--c','var(--c1)');
  const bn=el('div','big-n'); add(bn,el('small',null,'TỔNG HỢP'),document.createTextNode(String(NFIN)));
  const ht=el('div'); add(ht,el('h2',null,finalTitle.replace(/^BẢNG TỔNG HỢP 50 CẶP TỪ /,'').replace(/^(PHẦN TỔNG KẾT|PHAN TONG KET)\s*:\s*/i,'') || finalTitle));
  ht.appendChild(el('div','en-t',`Bảng tổng hợp ${FINLABEL.replace(/^\d+ /,NFIN+' ')} · Nạp Anki`));
  add(head,bn,ht); root.appendChild(head);
  const sec=el('section','part'); sec.style.marginTop='28px';
  const tools=el('div','pp-tools'); const inp=el('input'); inp.type='search'; inp.id='pp-search'; inp.placeholder='Tìm cụm từ, paraphrase hoặc nghĩa…'; inp.setAttribute('aria-label','Tìm trong '+FINLABEL);
  const cnt=el('span','score'); add(tools,inp,cnt); sec.appendChild(tools);
  const w=el('div','tbl-w'); const t=el('table'); const th=el('thead'); const tr=el('tr');
  const hdr=finalTable?finalTable.rows[0].map(c=>c.join(' ')):[]; hdr.forEach(x=>tr.appendChild(el('th',null,x))); th.appendChild(tr); t.appendChild(th);
  const tb=el('tbody'); const rows=[];
  (finalTable?finalTable.rows.slice(1):[]).forEach(r=>{ const row=el('tr'); ['n','t','p','m'].forEach((k,i)=>row.appendChild(el('td',k,(r[i]||[]).join(' ')))); tb.appendChild(row); rows.push([row,row.textContent.toLowerCase()]); });
  t.appendChild(tb); w.appendChild(t); sec.appendChild(w);
  const f=()=>{ const q=inp.value.trim().toLowerCase(); let k=0; rows.forEach(([r,tx])=>{ const show=!q||tx.includes(q); r.hidden=!show; if(show)k++; }); cnt.textContent=`${k}/${rows.length} cặp từ`; };
  inp.addEventListener('input',f); f();
  root.appendChild(sec); root.appendChild(pager(TABS.length-1));
  return root;
}

function pager(i){
  const p=el('div','pager');
  if(i>0){ const b=el('button','prev'); b.type='button'; add(b,el('small',null,'← Trước'),el('b',null,`${TABS[i-1].n} · ${TABS[i-1].label}`)); b.onclick=()=>show(TABS[i-1].id,true); p.appendChild(b); }
  if(i<TABS.length-1){ const b=el('button','next'); b.type='button'; add(b,el('small',null,'Tiếp →'),el('b',null,`${TABS[i+1].n} · ${TABS[i+1].label}`)); b.onclick=()=>show(TABS[i+1].id,true); p.appendChild(b); }
  return p;
}

/* ---------- hero, tabs ---------- */
const hero=document.getElementById('hero');
(function(){
  const left=el('div');
  const t0=intro[0]||''; const m=t0.match(/^(.*?):\s*(.*)$/);
  const eb=el('div','eyebrow'); add(eb,el('b',null,m?m[1]:t0),el('span',null,'· ETS TOEIC Part 7'));
  const h1=el('h1'); if(m){ const parts=m[2].split(' & '); h1.appendChild(document.createTextNode(parts[0])); if(parts[1]){ h1.appendChild(document.createElement('br')); h1.appendChild(el('span',null,'& '+parts[1])); } } else h1.textContent=t0;
  // intro[2] (source/method note) is intentionally not shown
  add(left,eb,h1,el('div','en-sub',intro[1]||''));
  const nq=lessons.reduce((a,L)=>a+L.answers.length,0), nv=lessons.reduce((a,L)=>a+(L.parts.find(p=>p.n===5)?.items.filter(s=>isStr(s)&&/^Ngh(?:ĩa|ia):/.test(s)).length||0),0);
  const st=el('div','stats');
  [[lessons.length,'bài thực hành'],[nq,'câu hỏi ETS gốc'],[nv,'thẻ từ vựng'],[NFIN,FINLABEL.replace(/^\d+ /,'')]].forEach(([v,l])=>{ const s=el('div','stat'); add(s,el('b',null,String(v)),el('span',null,l)); st.appendChild(s); });
  left.appendChild(st);
  const yard=el('div','yard'); yard.setAttribute('aria-label','Chọn nhanh bài học');
  lessons.forEach(L=>{ const b=el('button','box'); b.type='button'; b.style.setProperty('--c',`var(--c${L.n})`); b.dataset.id='bai'+L.n; b.title=SHORT[L.n-1];
    add(b,el('span','code',SHORT[L.n-1]||'BÀI'),el('span','n',String(L.n).padStart(2,'0')),el('span','qr',L.qr)); b.onclick=()=>show('bai'+L.n,true); yard.appendChild(b); });
  add(hero,left,yard);
})();

const tabsEl=document.getElementById('tabs'), main=document.getElementById('main');
const panels={}, tabBtns={};
TABS.forEach((T,i)=>{
  const b=el('button','tab'); b.type='button'; b.setAttribute('role','tab'); b.id='tab-'+T.id; b.setAttribute('aria-controls','panel-'+T.id); b.style.setProperty('--c',T.c);
  const tl=el('span','tl'); add(tl,el('b',null,T.label),el('small',null,T.sub));
  add(b,el('span','door',T.n),tl); b.onclick=()=>show(T.id,false);
  b.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ e.preventDefault(); const j=(i+(e.key==='ArrowRight'?1:-1)+TABS.length)%TABS.length; show(TABS[j].id,false); tabBtns[TABS[j].id].focus(); }});
  tabsEl.appendChild(b); tabBtns[T.id]=b;
  const p=el('section'); p.id='panel-'+T.id; p.setAttribute('role','tabpanel'); p.setAttribute('aria-labelledby','tab-'+T.id); p.hidden=true; main.appendChild(p); panels[T.id]=p;
});

function show(id,scroll){
  if(!panels[id]) id=TABS[0].id;
  const p=panels[id];
  if(!p.firstChild){ if(id==='paraphrase') p.appendChild(renderParaphrase()); else p.appendChild(renderLesson(lessons[+id.replace('bai','')-1])); }
  Object.entries(panels).forEach(([k,v])=>{ v.hidden=k!==id; tabBtns[k].setAttribute('aria-selected',String(k===id)); tabBtns[k].tabIndex=k===id?0:-1; });
  document.querySelectorAll('.box').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  tabBtns[id].scrollIntoView({block:'nearest',inline:'center'});
  try{ history.replaceState(null,'','#'+id); }catch(e){}
  try{ localStorage.setItem('lg-tab',id); }catch(e){}
  if(scroll!==null){ const bar=document.querySelector('.bar'); const y=main.getBoundingClientRect().top+window.scrollY-bar.offsetHeight-8; if(window.scrollY>y||scroll) window.scrollTo({top:y,behavior:'smooth'}); }
}

/* ---------- translation mode ---------- */
const mb=document.getElementById('m-both'), mr=document.getElementById('m-recall');
function setMode(r){ document.body.classList.toggle('recall',r); mb.setAttribute('aria-pressed',String(!r)); mr.setAttribute('aria-pressed',String(r)); try{localStorage.setItem('lg-mode',r?'1':'0');}catch(e){} if(!r) document.querySelectorAll('.peek').forEach(x=>x.classList.remove('peek')); }
mb.onclick=()=>setMode(false); mr.onclick=()=>setMode(true);
main.addEventListener('click',e=>{ if(!document.body.classList.contains('recall')) return; const v=e.target.closest('.vi-r'); if(v) v.classList.toggle('peek'); });
try{ if(localStorage.getItem('lg-mode')==='1') setMode(true); }catch(e){}

document.getElementById('foot').textContent='Nguồn: ChuyenDe_TOEIC_TaiChinh_DauTu_NganHang_BaoCaoThuongNien.docx';

let start=(location.hash||'').slice(1);
if(!panels[start]){ try{ start=localStorage.getItem('lg-tab')||''; }catch(e){ start=''; } }
show(panels[start]?start:TABS[0].id,null);
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(panels[h]) show(h,true); });
})();
</script>
