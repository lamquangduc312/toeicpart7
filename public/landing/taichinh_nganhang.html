ất với từ nào (Từ khóa: irrevocable closest in meaning).","• Câu 194: Tổng số tiền phải trả vào ngày 15 tháng 1 (Từ khóa: total amount must pay, January 15).","• Câu 195: Điều gì đúng về phí cam kết (Từ khóa: commitment fee charged, unused portion).","Bước 3 (3 phút 45 giây) - Giải cuốn chiếu \u0026 Khóa đáp án: • Câu 191 (Chi tiết - VB2 Mục 4): \u0027Funding seasonal procurement of semiconductor wafer inventory... in advance of anticipated peak fourth-quarter delivery cycles\u0027 -\u003e Chọn (C).","• Câu 192 (Chi tiết - VB1 Mục 3): \u0027maintain a Consolidated Net Debt-to-EBITDA Leverage Ratio of not greater than 3.25 to 1.00\u0027 -\u003e Chọn (B).","• Câu 193 (Từ vựng ngữ cảnh - VB2): \u0027irrevocable notice\u0027 = thông báo không thể hủy ngang / có tính ràng buộc pháp lý bắt buộc thực hiện -\u003e Chọn (B) binding.","• Câu 194 (Ghép nối - VB3): Tiền lãi $625,000 + Phí cam kết $68,750 = $693,750 (Lưu ý: Nợ gốc $40M là tín dụng tuần hoàn chưa đáo hạn nên chưa phải trả gốc) -\u003e Chọn (C).","• Câu 195 (Chi tiết - VB1 Mục 2 \u0026 VB3): \u0027commitment fee of 0.25% per annum on the average daily undrawn... portion\u0027 -\u003e Thu trên phần hạn mức chưa dùng ($110M) -\u003e Chọn (B).","Bước 4 (25 giây) - Rà soát \u0026 Đúc kết Feynman: Tự đúc kết 1 câu: Hạn mức tín dụng tuần hoàn cho phép công ty rút linh hoạt 40 triệu USD với lãi suất thả nổi SOFR để nhập hàng đón sóng cuối năm, đồng thời phải trả thêm một khoản \u0027tiền giữ chỗ\u0027 0.25% trên 110 triệu USD phần tiền nhàn rỗi chưa dùng tới.","1.3. Dịch Song ngữ Xen kẽ Từng Câu (Sentence-by-Sentence Translation)","[Văn bản 1: Trích lục Hợp đồng Tín dụng Hợp vốn — Hạn mức Tín dụng Tuần hoàn]","SYNDICATED CREDIT FACILITY AGREEMENT (SUMMARY OF TERMS)","Borrower: Talon Micro-Devices Inc.","Administrative Agent \u0026 Lead Arranger: Global Commercial Trust Corporation","Facility Size: $150,000,000 Multi-Currency Revolving Credit Facility","Effective Date: September 1 | Maturity Date: August 31 (3-Year Term)","HỢP ĐỒNG HẠN MỨC TÍN DỤNG HỢP VỐN (TÓM TẮT ĐIỀU KHOẢN)","Bên vay: Tập đoàn Vi thiết bị Talon","Ngân hàng Đại lý \u0026 Thu xếp Chính: Tập đoàn Tín thác Thương mại Toàn cầu","Quy mô Hạn mức: Hạn mức Tín dụng Tuần hoàn Đa tệ trị giá 150.000.000 USD","Ngày Hiệu lực: Ngày 1 Tháng 9 | Ngày Đáo hạn: Ngày 31 Tháng 8 (Kỳ hạn 3 Năm)","1. Interest Rate \u0026 Benchmark Definition","Borrowings under the facility accrue interest at a floating rate equal to the CME Term SOFR (Secured Overnight Financing Rate) corresponding to the selected interest period (1-month, 3-month, or 6-month), plus an Applicable Margin of 1.85% per annum.","1. Lãi suất \u0026 Định nghĩa Lãi suất Cơ sở","Các khoản rút vốn theo hạn mức chịu lãi suất thả nổi bằng Lãi suất Tài trợ Qua đêm có Đảm bảo (CME Term SOFR) tương ứng với kỳ hạn lãi suất được chọn (1 tháng, 3 tháng hoặc 6 tháng), cộng với Biên độ Áp dụng là 1,85%/năm.","Interest is calculated on an actual/360-day basis and payable on the last day of each interest period.","Tiền lãi được tính trên cơ sở số ngày thực tế/360 ngày và phải trả vào ngày cuối cùng của mỗi kỳ tính lãi.","2. Unused Commitment Fee","The Borrower shall pay a commitment fee of 0.25% per annum on the average daily undrawn and uncancelled portion of the $150,000,000 facility.","2. Phí Cam kết Khoản vay Chưa Rút","Bên vay có nghĩa vụ thanh toán phí cam kết 0,25%/năm tính trên số dư bình quân hàng ngày của phần hạn mức chưa rút và chưa bị hủy trong tổng hạn mức 150.000.000 USD.","The commitment fee accrues quarterly in arrears and is payable concurrently with quarterly interest settlements.","Phí cam kết được tính dồn theo quý trả sau và được thanh toán đồng thời cùng với các kỳ quyết toán tiền lãi hàng quý.","3. Financial Covenants","The Borrower must maintain a Consolidated Net Debt-to-EBITDA Leverage Ratio of not greater than 3.25 to 1.00, tested at the end of each fiscal quarter.","3. Các Giao ước Tài chính","Bên vay bắt buộc phải duy trì Tỷ lệ Đòn bẩy Nợ ròng Hợp nhất trên EBITDA không vượt quá 3,25 lần trên 1,00, được kiểm tra đánh giá vào cuối mỗi quý tài chính.","Failure to satisfy this ratio constitutes an Event of Default unless waived by a supermajority of syndicate lenders.","Việc không đáp ứng được tỷ lệ này sẽ cấu thành Sự kiện Vi phạm Hợp đồng trừ khi được đa số đặc biệt các ngân hàng trong tổ hợp hợp vốn đồng ý miễn trừ.","[Văn bản 2: Thông báo Rút vốn — Ban Ngân quỹ Doanh nghiệp Talon]","NOTICE OF BORROWING (DRAWDOWN REQUEST)","Date: October 10","To: Global Commercial Trust Corp. (Syndicated Agency \u0026 Loan Operations)","From: Arthur Vance, Vice President of Corporate Treasury, Talon Micro-Devices Inc.","Re: Credit Agreement dated September 1 ($150M Revolving Facility)","THÔNG BÁO RÚT VỐN (ĐƠN ĐỀ NGHỊ GIẢI NGÂN)","Ngày: 10 Tháng 10","Kính gửi: Tập đoàn Tín thác Thương mại Toàn cầu (Khối Nghiệp vụ Ngân hàng Đại lý \u0026 Vay vốn Hợp vốn)","Người gửi: Arthur Vance, Phó Chủ tịch Ngân quỹ Doanh nghiệp, Tập đoàn Vi thiết bị Talon","Về việc: Hợp đồng Tín dụng ngày 1 Tháng 9 (Hạn mức Tuần hoàn 150 Triệu USD)","Pursuant to Section 2.03 of the Credit Agreement, Talon Micro-Devices hereby provides irrevocable notice of its request for a borrowing under the revolving facility as follows:","Căn cứ theo Điều 2.03 của Hợp đồng Tín dụng, Talon Micro-Devices trân trọng gửi thông báo không hủy ngang về việc đề nghị rút vốn theo hạn mức tuần hoàn với các thông tin chi tiết như sau:","1. Requested Borrowing Date: October 15","2. Aggregate Principal Amount of Borrowing: $40,000,000.00 (Forty Million USD)","3. Selected Interest Period: 3-Month Term SOFR (ending January 15)","1. Ngày Đề nghị Rút vốn: Ngày 15 Tháng 10","2. Tổng Số tiền Gốc Rút vốn: 40.000.000,00 USD (Bốn mươi triệu USD)","3. Kỳ hạn Tính lãi Được chọn: Kỳ hạn CME Term SOFR 3 Tháng (kết thúc vào ngày 15 Tháng 1)","4. Business Purpose of Borrowing: Funding seasonal procurement of semiconductor wafer inventory and fabrication consumables in advance of anticipated peak fourth-quarter delivery cycles.","4. Mục đích Kinh doanh của Khoản vay: Tài trợ thu mua hàng tồn kho tấm bán dẫn theo mùa vụ và nguyên vật liệu tiêu hao chế tạo chip nhằm đón đầu các chu kỳ giao hàng cao điểm dự kiến trong quý 4.","5. Remittance Instructions: Please wire proceeds directly to Talon\u0027s Corporate Operating Account #8812-4409 at Wells Fargo Bank, N.A.","5. Hướng dẫn Chuyển tiền: Kính đề nghị điện chuyển tiền giải ngân trực tiếp vào Tài khoản Hoạt động Doanh nghiệp số #8812-4409 của Talon tại Ngân hàng Wells Fargo, N.A.","We certify that our Net Debt-to-EBITDA ratio as of the date hereof stands at 2.10x, well within covenant thresholds.","Chúng tôi cam đoan rằng tỷ lệ Nợ ròng trên EBITDA của chúng tôi tính đến ngày hôm nay đang ở mức 2,10 lần, hoàn toàn nằm trong ngưỡng an toàn của giao ước tài chính.","[Văn bản 3: Thư Xác nhận Khoản vay \u0026 Chốt Lãi suất — Ngân hàng Tín thác Toàn cầu]","GLOBAL COMMERCIAL TRUST CORPORATION","Syndicated Loan Agency \u0026 Servicing Group | 200 Park Avenue, New York, NY","Date: October 15 | Facility Identifier: #TLN-REV-150M","To: Talon Micro-Devices Inc. (Attn: Corporate Treasury)","TẬP ĐOÀN TÍN THÁC THƯƠNG MẠI TOÀN CẦU","Khối Dịch vụ \u0026 Ngân hàng Đại lý Cho vay Hợp vốn | 200 Đại lộ Park, New York, NY","Ngày: 15 Tháng 10 | Mã Định danh Hạn mức: #TLN-REV-150M","Kính gửi: Tập đoàn Vi thiết bị Talon (Đồng kính gửi: Ban Ngân quỹ Doanh nghiệp)","We are pleased to confirm that your drawdown request of $40,000,000.00 under the Revolving Credit Facility was successfully executed today, October 15. The funds have been wired in accordance with your payment instructions.","Chúng tôi vui mừng thông báo rằng đề nghị rút vốn 40.000.000,00 USD của quý công ty theo Hạn mức Tín dụng Tuần hoàn đã được thực thi thành công ngày hôm nay, 15 Tháng 10. Tiền giải ngân đã được điện chuyển đúng theo chỉ dẫn thanh toán.","Benchmark 3-Month CME Term SOFR (Fixed on Oct 11): 4.40% per annum | Applicable Margin: 1.85% per annum | All-in Floating Borrowing Rate: 6.25% per annum","Lãi suất Cơ sở CME Term SOFR 3 Tháng (Chốt ngày 11/10): 4,40%/năm | Biên độ Áp dụng: 1,85%/năm | Tổng Lãi suất Vay Thả nổi: 6,25%/năm","Accrued Interest Due on January 15: $625,000.00 ($40M x 6.25% x 90/360)","Tiền Lãi Dự thu Phải trả Ngày 15 Tháng 1: 625.000,00 USD (40 triệu USD x 6,25% x 90 ngày / 360 ngày)","Unused Commitment Fee Assessment: Total Facility: $150.0M | Drawn Balance: $40.0M | Undrawn Facility: $110.0M","Quarterly Commitment Fee Due on January 15: $68,750.00 ($110M x 0.25% x 90/360)","Tính toán Phí Cam kết Phần Chưa Rút: Tổng Hạn mức: 150,0 triệu USD | Dư nợ đã rút: 40,0 triệu USD | Hạn mức chưa rút: 110,0 triệu USD","Phí Cam kết Hàng quý Phải trả Ngày 15 Tháng 1: 68.750,00 USD (110 triệu USD x 0,25% x 90 ngày / 360 ngày)","Total Net Remittance Due to Administrative Agent on January 15: $693,750.00 ($625,000.00 interest + $68,750.00 commitment fee). Automatic debit will occur at 11:00 AM EST on January 15.","Tổng Số tiền Quyết toán Phải nộp cho Ngân hàng Đại lý vào Ngày 15 Tháng 1: 693.750,00 USD (625.000,00 USD tiền lãi + 68.750,00 USD phí cam kết). Lệnh trích nợ tự động sẽ diễn ra vào lúc 11:00 sáng giờ EST ngày 15 Tháng 1.","1.4. Dịch chi tiết Câu hỏi \u0026 Phương án Trắc nghiệm","Câu 191. Mục đích chính yếu của khoản vay rút vốn 40.000.000 USD mà Talon Micro-Devices yêu cầu là gì?","(A) Mua lại các trái phiếu doanh nghiệp đang lưu hành trên thị trường mở","(B) Tài trợ cho thương vụ thâu tóm một đối thủ sản xuất bán dẫn trong khu vực","(C) Tài trợ mua hàng tồn kho theo mùa vụ trước các giai đoạn nhu cầu tiêu thụ tăng cao","(D) Thanh toán các khoản tiền trợ cấp thôi việc cho công nhân nhà máy ngừng hoạt động","Câu 192. Tỷ số tài chính nào Talon bắt buộc phải duy trì theo các điều khoản của hợp đồng tín dụng?","(A) Tỷ suất sinh lời trên vốn chủ sở hữu (ROE) tối thiểu là 15%","(B) Tỷ lệ Nợ ròng hợp nhất trên EBITDA ở mức 3,25 lần hoặc thấp hơn","(C) Tỷ số thanh toán nhanh vượt quá 2,50 lần tổng nợ ngắn hạn","(D) Tỷ lệ chi trả cổ tức dưới 40% lợi nhuận thuần","Câu 193. Trong Văn bản 2, đoạn 1, từ \u0027irrevocable\u0027 gần nghĩa nhất với từ nào sau đây?","(A) Tạm thời (temporary)","(B) Có tính ràng buộc bắt buộc (binding)","(C) Thân mật không chính thức (informal)","(D) Có thể thương lượng lại (negotiable)","Câu 194. Tổng số tiền mà Talon Micro-Devices phải thanh toán cho Ngân hàng Tín thác Toàn cầu vào ngày 15 tháng 1 là bao nhiêu?","(A) 68.750,00 USD","(B) 625.000,00 USD","(C) 693.750,00 USD","(D) 40.693.750,00 USD","Câu 195. Điều gì được chỉ ra về khoản phí cam kết được tính theo hạn mức tín dụng?","(A) Khoản phí này chỉ bị tính khi bên vay không thanh toán được tiền lãi đúng hạn.","(B) Khoản phí này được tính dựa trên phần hạn mức tín dụng chưa được sử dụng đến.","(C) Khoản phí này sẽ được miễn trừ nếu lãi suất cơ sở SOFR tăng vượt quá 5,0%.","(D) Khoản phí này phải được trả trước như một khoản đặt cọc không hoàn lại trước khi ký.","1.5. Tóm tắt Viết lại Toàn bài theo Feynman (Feynman Monograph Summary)","English Executive Summary:","• Syndicated Liquidity Structure: Talon Micro-Devices maintains a 3-year, $150.0M syndicated revolving credit line with Global Commercial Trust, priced at 3-month Term SOFR plus a 1.85% margin, with a 0.25% unused commitment fee on unborrowed funds and a 3.25x Net Debt-to-EBITDA covenant cap.","• Strategic Inventory Drawdown: On October 10, Corporate Treasury requested a $40.0M drawdown for October 15 to secure semiconductor wafer supplies ahead of peak Q4 fabrication cycles, certifying strong balance sheet compliance with a 2.10x leverage ratio.","• Interest Fixing \u0026 Total Quarterly Settlement: The bank disbursed $40.0M at an all-in rate of 6.25% (4.40% SOFR + 1.85% margin), scheduling a total debit of $693,750.00 on January 15, consisting of $625,000.00 in 90-day interest and $68,750.00 in unused commitment fees on the remaining $110.0M facility balance.","Bản tóm tắt Tiếng Việt cốt lõi:","• Cấu trúc Hạn mức Tín dụng Hợp vốn: Tập đoàn Talon duy trì hạn mức tín dụng tuần hoàn 150,000,000 USD kỳ hạn 3 năm với Ngân hàng Đại lý Tín thác Toàn cầu, chịu lãi suất thả nổi cơ sở SOFR 3 tháng + biên độ 1,85%, phí cam kết hạn mức nhàn rỗi 0,25%/năm và trần đòn bẩy Nợ ròng/EBITDA là 3,25 lần.","• Rút vốn Mua Hàng Tồn kho Cao điểm: Ngày 10/10, Ban Ngân quỹ gửi văn bản rút vốn 40,000,000 USD vào ngày 15/10 để tài trợ nguyên liệu bán dẫn cho đợt sản xuất cao điểm quý 4, kèm cam kết tỷ lệ đòn bẩy an toàn ở mức 2,10 lần.","• Chốt Lãi suất Thả nổi \u0026 Quyết toán Phí: Ngân hàng giải ngân 40 triệu USD với tổng lãi suất 6,25%/năm (SOFR 4,40% + Margin 1,85%); ngày 15/01, ngân hàng sẽ tự động trích nợ 693.750 USD, bao gồm 625.000 USD tiền lãi 90 ngày và 68.750 USD phí cam kết trên 110 triệu USD phần hạn mức chưa sử dụng.","PHẦN 2: ACTIVE RECALL 5 GIÂY (BẢNG MA TRẬN ĐỊNH VỊ SONG NGỮ)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["1. Đối tượng \u0026 Vai trò: Talon Micro-Devices (Bên vay doanh nghiệp công nghệ cao rút vốn lưu động) \u003c-\u003e Global Commercial Trust (Ngân hàng đại lý thu xếp hợp vốn, chốt lãi suất SOFR và trích nợ tự động) \u003c-\u003e Wells Fargo (Ngân hàng nhận điện chuyển tiền tài trợ).","1. Stakeholders \u0026 Roles: Talon Micro-Devices (High-tech corporate borrower drawing working capital) \u003c-\u003e Global Commercial Trust (Syndicated facility administrative agent fixing SOFR rates and executing auto-debits) \u003c-\u003e Wells Fargo (Recipient corporate depository bank)."]],[["2. Boi canh \u0026 Quy trinh loi"],["2. Bối cảnh \u0026 Quy trình lõi: Quản trị Thanh khoản Tín dụng Tuần hoàn (Revolving Credit Facility Operations): Doanh nghiệp gửi thông báo rút vốn kỳ hạn 3 tháng tài trợ hàng tồn kho chip -\u003e Ngân hàng chốt lãi suất chuẩn SOFR ngày T-2 -\u003e Tính lãi vay thực tế cộng phí cam kết hạn mức nhàn rỗi (Unused Fee).","2. Business Context \u0026 Core Flow: Revolving Credit Facility Liquidity Management: Corporate issues 3-month borrowing notice to finance peak semiconductor inventory -\u003e Bank fixes Term SOFR benchmark at T-2 -\u003e Accrues actual borrowing interest alongside unused commitment fees."]],[["3. Dau vet suy luan cheo"],["3. Dấu vết suy luận chéo: Hạn mức $150M (VB1) trừ số rút $40M (VB2) ra $110M phần hạn mức chưa rút -\u003e Áp dụng phí cam kết 0.25% (VB1) tính ra $68,750 (VB3) -\u003e Cộng với tiền lãi $625,000 (VB3) ra tổng số tiền quyết toán $693,750.","3. Key Cross-Referencing Clues: $150M facility (Passage 1) minus $40M drawn (Passage 2) yields $110M undrawn -\u003e Applying 0.25% fee (Passage 1) produces $68,750 (Passage 3) -\u003e Summed with $625,000 interest (Passage 3) yields total remittance of $693,750."]]],"t":"table"},"PHẦN 3: ĐÁP ÁN CHUẨN XÁC \u0026 DẤU VẾT TRUY XUẤT CHÉO (CROSS-REFERENCING \u0026 TRAP BREAKDOWN)","191. What is the primary purpose of the $40,000,000 borrowing requested by Talon Micro-Devices?","Dap an dung: (C) To finance seasonal inventory purchases before high-demand periods","[Dau vet bai doc / Clue]: Văn bản 2 (Thông báo Rút vốn), Mục 4: \u0027Business Purpose of Borrowing: Funding seasonal procurement of semiconductor wafer inventory and fabrication consumables in advance of anticipated peak fourth-quarter delivery cycles.\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027Funding seasonal procurement of semiconductor wafer inventory... in advance of anticipated peak fourth-quarter delivery cycles\u0027 \u003c-\u003e \u0027To finance seasonal inventory purchases before high-demand periods\u0027","[Loi giai chi tiet]: Arthur Vance nêu rõ mục đích của khoản rút vốn 40 triệu USD là tài trợ mua sắm tấm bán dẫn theo mùa vụ trước đợt cao điểm giao hàng quý 4.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) To repurchase outstanding corporate bonds on the open market","- Ly do sai: Talon dùng vốn lưu động mua hàng tồn kho sản xuất chứ không dùng để mua lại trái phiếu doanh nghiệp trên thị trường mở.","- Bay ETS: Bẫy Nghiệp vụ Thị trường Vốn Lạc đề (Irrelevant Capital Market Trap)","(B) To fund the acquisition of a regional semiconductor competitor","- Ly do sai: Khoản vay này không dành cho thâu tóm M\u0026A doanh nghiệp đối thủ.","- Bay ETS: Bẫy Thương vụ Thâu tóm Bịa đặt (Fabricated M\u0026A Trap)","(D) To pay severance settlements to decommissioned factory workers","- Ly do sai: Chi phí trợ cấp thôi việc nhà máy là chi tiết ở Bài 1 (Valenta), hoàn toàn không liên quan đến bài đọc này.","- Bay ETS: Bẫy Trộn Dữ kiện Bài học Khác (Cross-Lesson Distractor Trap)","192. What financial ratio is Talon required to maintain under the terms of the credit agreement?","Dap an dung: (B) Consolidated Net Debt-to-EBITDA ratio of 3.25x or lower","[Dau vet bai doc / Clue]: Văn bản 1 (Hợp đồng Tín dụng), Mục 3: \u0027The Borrower must maintain a Consolidated Net Debt-to-EBITDA Leverage Ratio of not greater than 3.25 to 1.00, tested at the end of each fiscal quarter.\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027maintain a Consolidated Net Debt-to-EBITDA Leverage Ratio of not greater than 3.25 to 1.00\u0027 \u003c-\u003e \u0027Consolidated Net Debt-to-EBITDA ratio of 3.25x or lower\u0027","[Loi giai chi tiet]: Điều khoản giao ước tài chính quy định bên vay phải duy trì tỷ lệ đòn bẩy Nợ ròng trên EBITDA không vượt quá 3.25 lần tại các kỳ kiểm tra cuối mỗi quý tài chính.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Return on equity of at least 15%","- Ly do sai: Hợp đồng tín dụng không quy định chỉ số tỷ suất sinh lời trên vốn cổ phần ROE.","- Bay ETS: Bẫy Chỉ số Khả năng Sinh lời (Profitability Metric Trap)","(C) Quick ratio exceeding 2.50x total current liabilities","- Ly do sai: Tỷ số thanh toán nhanh không nằm trong danh mục giao ước của hợp đồng này.","- Bay ETS: Bẫy Tỷ số Thanh khoản Sai lệch (Liquidity Ratio Distractor)","(D) Dividend payout ratio under 40% of net income","- Ly do sai: Không có giới hạn tỷ lệ chi trả cổ tức trong bản tóm tắt hợp đồng tín dụng.","- Bay ETS: Bẫy Giao ước Cổ tức Không Đề cập (Unmentioned Dividend Covenant Trap)","193. In Passage 2, paragraph 1, the word \u0027irrevocable\u0027 is closest in meaning to","Dap an dung: (B) binding","[Dau vet bai doc / Clue]: Văn bản 2, Đoạn 1: \u0027...Talon Micro-Devices hereby provides irrevocable notice of its request for a borrowing under the revolving facility...\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027irrevocable\u0027 (không thể hủy ngang / có tính pháp lý bắt buộc) \u003c-\u003e \u0027binding\u0027 (ràng buộc pháp lý)","[Loi giai chi tiet]: Trong hợp đồng tín dụng và ngân hàng thương mại, \u0027irrevocable notice\u0027 là thông báo không thể thu hồi hoặc hủy ngang sau khi đã phát hành, mang tính ràng buộc bắt buộc (binding) đối với cả bên vay và bên cho vay.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) temporary","- Ly do sai: \u0027Temporary\u0027 nghĩa là tạm thời, trái ngược hoàn toàn với cam kết dứt khoát không hủy ngang.","- Bay ETS: Bẫy Nghĩa Đối lập (Antonym Trap)","(C) informal","- Ly do sai: \u0027Informal\u0027 nghĩa là thân mật, không theo quy chuẩn; trong khi văn bản ngân hàng mang tính pháp lý cao.","- Bay ETS: Bẫy Ngữ cảnh Trịnh trọng (Formality Contrast Trap)","(D) negotiable","- Ly do sai: \u0027Negotiable\u0027 nghĩa là có thể thương lượng thay đổi được; thông báo không hủy ngang là lệnh thực thi cố định.","- Bay ETS: Bẫy Khả năng Điều chỉnh (Malleability Trap)","194. What total amount must Talon Micro-Devices pay to Global Commercial Trust on January 15?","Dap an dung: (C) $693,750.00","[Dau vet bai doc / Clue]: Văn bản 3 (Thư Xác nhận Ngân hàng), Đoạn cuối: \u0027Total Net Remittance Due to Administrative Agent on January 15: $693,750.00 ($625,000.00 interest + $68,750.00 commitment fee).\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027$625,000.00 accrued interest\u0027 + \u0027$68,750.00 commitment fee\u0027 = \u0027$693,750.00 total remittance due\u0027","[Loi giai chi tiet]: Ngày 15 tháng 1 là kỳ quyết toán hàng quý, Talon phải thanh toán tổng cộng 693.750 USD, bao gồm 625.000 USD tiền lãi của khoản rút 40 triệu USD và 68.750 USD phí cam kết trên phần hạn mức 110 triệu USD chưa dùng đến. Nợ gốc 40 triệu USD thuộc hạn mức tuần hoàn 3 năm nên chưa đến hạn trả gốc.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) $68,750.00","- Ly do sai: 68.750 USD chỉ là phí cam kết cho hạn mức chưa rút, thiếu toàn bộ khoản lãi vay 625.000 USD.","- Bay ETS: Bẫy Một Thành phần Chi phí (Single Fee Component Trap)","(B) $625,000.00","- Ly do sai: 625.000 USD chỉ là tiền lãi vay 90 ngày, bỏ quên khoản phí cam kết bắt buộc.","- Bay ETS: Bẫy Bỏ sót Phí Cam kết (Omitted Commitment Fee Trap)","(D) $40,693,750.00","- Ly do sai: Cộng cả 40 triệu USD nợ gốc vào ngày 15/01 là sai, vì đây là khoản vay tuần hoàn 3 năm (đáo hạn vào 31/08 sau 3 năm).","- Bay ETS: Bẫy Hoàn trả Toàn bộ Nợ gốc Quá sớm (Premature Principal Repayment Trap)","195. What is indicated about the commitment fee charged under the credit facility?","Dap an dung: (B) It is charged on the portion of the credit line that remains unused.","[Dau vet bai doc / Clue]: Văn bản 1, Mục 2: \u0027...commitment fee of 0.25% per annum on the average daily undrawn and uncancelled portion of the $150,000,000 facility.\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027undrawn and uncancelled portion of the facility\u0027 \u003c-\u003e \u0027portion of the credit line that remains unused\u0027","[Loi giai chi tiet]: Hợp đồng quy định phí cam kết 0,25%/năm được tính dựa trên số dư bình quân hàng ngày của phần hạn mức chưa rút (undrawn portion = unused credit line), tức là 110 triệu USD chưa giải ngân.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) It is assessed only when the borrower defaults on an interest payment.","- Ly do sai: Phí cam kết là loại phí thanh toán định kỳ thường xuyên, không phải là tiền phạt vi phạm hợp đồng (Penalty fee).","- Bay ETS: Bẫy Nhầm lẫn Phí Thường niên với Phí Phạt (Default Penalty Confusion Trap)","(C) It is waived if the benchmark SOFR rate rises above 5.0%.","- Ly do sai: Hợp đồng không hề có điều khoản miễn phí cam kết khi lãi suất SOFR vượt 5.0%.","- Bay ETS: Bẫy Điều kiện Giả tưởng (Fictitious Condition Trap)","(D) It must be paid upfront as a non-refundable retainer before signing.","- Ly do sai: Phí cam kết được tính sau (in arrears) và thanh toán dồn theo từng quý chứ không phải trả trước trước khi ký hợp đồng.","- Bay ETS: Bẫy Phương thức Thanh toán Sai lệch (In Arrears vs. Upfront Trap)","PHẦN 4: KỸ THUẬT FEYNMAN SONG NGỮ \u0026 SƠ ĐỒ QUY TRÌNH (TƯ DUY HỢP ĐỒNG TÍN DỤNG \u0026 BA)","4.1. Sơ đồ Quy trình Luân chuyển Nghiệp vụ (Syndicated Revolving Facility, Drawdown \u0026 Fee Netting)","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","Lập Kế hoạch Dòng tiền Ngân quỹ \u0026 Phát hành Đơn Rút vốn (Treasury Forecasting \u0026 Drawdown Issuance)"],[],["BƯỚC 2","Chốt Lãi suất Chuẩn SOFR \u0026 Giải ngân Điện chuyển tiền (Rate Fixing, Syndicate Funding \u0026 Wire)"],[],["BƯỚC 3","Đối soát Lãi vay, Phí Cam kết \u0026 Trích nợ Tự động (Interest Accrual, Commitment Fee \u0026 Auto-Debit)"]],[["• Chung tu \u0026 Kenh: Ban Ngân quỹ Talon -\u003e Hệ thống Giao dịch Ngân hàng Trực tuyến Global Commercial Trust","• Nghiep vu thuc thi: Phân tích nhu cầu vốn lưu động thu mua tấm bán dẫn quý 4; kiểm tra tỷ lệ đòn bẩy an toàn 2,10x \u003c 3,25x; phát hành đơn rút vốn không hủy ngang 40 triệu USD kỳ hạn 3 tháng gửi Ngân hàng Đại lý","• Ket qua \u0026 Kiem soat: Đơn Đề nghị Rút vốn Chính thức (Notice of Borrowing) + Chứng thư Tuân thủ Giao ước Tài chính"],["➔"],["• Chung tu \u0026 Kenh: Bàn Giao dịch Tiền tệ Ngân hàng Đại lý -\u003e Mạng lưới Thanh toán Liên ngân hàng Fedwire","• Nghiep vu thuc thi: Chốt lãi suất Term SOFR 3 tháng ở mức 4,40% tại ngày T-2; cộng biên độ 1,85% thành lãi suất vay 6,25%/năm; thu gom vốn từ các ngân hàng thành viên hợp vốn và điện chuyển 40 triệu USD về tài khoản Wells Fargo của Talon","• Ket qua \u0026 Kiem soat: Thư Xác nhận Lãi suất Khoản vay (Rate Fixing Notice) + Điện Xác nhận Giải ngân Fedwire Confirmation"],["➔"],["• Chung tu \u0026 Kenh: Phòng Vận hành Vay vốn Ngân hàng Đại lý -\u003e Tài khoản Ký quỹ Thanh toán Talon","• Nghiep vu thuc thi: Tính toán tiền lãi vay 90 ngày ($625.000) và tính phí cam kết 0,25% trên 110 triệu USD hạn mức nhàn rỗi ($68.750); gửi thông báo thanh toán tổng cộng $693.750 và kích hoạt lệnh trích nợ tự động vào sáng ngày 15/01","• Ket qua \u0026 Kiem soat: Báo cáo Quyết toán Công nợ Tín dụng Quý (Quarterly Billing Advice) + Bút toán Khấu trừ Tự động"]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["STEP 1","TREASURY LIQUIDITY FORECASTING \u0026 DRAWDOWN NOTICE"],[],["STEP 2","BENCHMARK FIXING, SYNDICATE FUNDING \u0026 WIRE TRANSFER"],[],["STEP 3","INTEREST ACCRUAL, UNUSED COMMITMENT FEE \u0026 SETTLEMENT"]],[["• Documents \u0026 Channels: • Documents \u0026 Channels: Talon Corporate Treasury -\u003e Global Commercial Trust Agency Portal","• Core Business Execution: • Core Business Execution: Model peak Q4 working capital needs for semiconductor wafers; verify leverage covenant headroom (2.10x vs. 3.25x cap); submit irrevocable $40.0M 3-month borrowing notice to Administrative Agent.","• Key Deliverable \u0026 Control: • Key Deliverable \u0026 Control: Executed Notice of Borrowing + Covenant Compliance Certificate"],["➔"],["• Documents \u0026 Channels: • Documents \u0026 Channels: Agency Loan Operations Desk -\u003e Fedwire Interbank Settlement System","• Core Business Execution: • Core Business Execution: Fix 3-month Term SOFR at 4.40% on T-2; apply 1.85% margin for an all-in rate of 6.25%; pool funding tranches across syndicate member banks and wire $40.0M to Talon\u0027s Wells Fargo account.","• Key Deliverable \u0026 Control: • Key Deliverable \u0026 Control: Loan Rate Fixing Advice + Fedwire Funds Transfer Confirmation"],["➔"],["• Documents \u0026 Channels: • Documents \u0026 Channels: Administrative Loan Servicing Group -\u003e Talon Collateral Clearing Account","• Core Business Execution: • Core Business Execution: Compute 90-day borrowing interest ($625,000) alongside 0.25% unused commitment fee on $110M undrawn facility ($68,750); execute automated clearing debit of $693,750 on January 15.","• Key Deliverable \u0026 Control: • Key Deliverable \u0026 Control: Quarterly Interest \u0026 Fee Statement + Automated Debit Settlement Record"]]],"t":"table"},"4.2. Tư duy Phân tích Nghiệp vụ Tài chính \u0026 Hợp đồng Ngân hàng (Bản Tiếng Việt)","• Bức tranh Toàn cảnh Hạn mức Tín dụng Hợp vốn (End-to-End Flow): Một hạn mức tín dụng tuần hoàn doanh nghiệp (Revolving Credit Facility) vận hành qua 3 luồng: (1) Luồng Pháp lý \u0026 Giao ước Hợp đồng (Covenant \u0026 Credit Agreement): Hợp đồng khung 150 triệu USD ký kết với tổ hợp ngân hàng quy định rõ trần đòn bẩy Nợ ròng/EBITDA \u003c= 3.25x và điều kiện rút vốn; mỗi lần giải ngân, giám đốc tài chính phải ký cam kết chứng nhận công ty không vi phạm giao ước; (2) Luồng Vận hành Dòng tiền \u0026 Chốt Lãi suất Cơ sở (Rate Fixing \u0026 Disbursement): Lãi suất được neo vào chỉ số lãi suất chuẩn quốc tế (CME Term SOFR) cộng biên độ rủi ro tín dụng của doanh nghiệp (Margin 1.85%); ngân hàng đại lý đứng ra thu tiền từ các ngân hàng thành viên và bơm thẳng vào tài khoản sản xuất kinh doanh của công ty; (3) Luồng Thu Phí Ngân hàng \u0026 Tối ưu Chi phí Vốn (Commitment Fee \u0026 Treasury Management): Ngân hàng phải duy trì lượng vốn sẵn sàng cho doanh nghiệp rút bất kỳ lúc nào nên thu \u0027Phí cam kết\u0027 (Commitment Fee 0.25%) trên phần hạn mức chưa rút. Bài toán của thủ quỹ là cân đối giữa việc rút quá nhiều làm tăng chi phí lãi vay (6.25%) và rút quá ít làm phát sinh phí cam kết trên vốn nhàn rỗi.","• Điểm nghẽn \u0026 Rủi ro Vận hành Thực tế (Core Bottleneck \u0026 Risk): Rủi ro Vi phạm Giao ước Đòn bẩy (Covenant Breach) khi kết quả kinh doanh suy giảm hoặc lãi suất thả nổi biến động mạnh. Nếu EBITDA sụt giảm trong khi nợ vay ngắn hạn tăng cao khiến tỷ lệ Nợ ròng/EBITDA vượt trần 3.25x, ngân hàng đại lý có quyền lập tức phong tỏa toàn bộ hạn mức tín dụng còn lại, nâng biên độ lãi suất phạt, hoặc kích hoạt điều khoản đòi nợ trước hạn (Acceleration of Debt), đẩy công ty vào nguy cơ vỡ nợ kỹ thuật.","• 3 Giải pháp Thiết kế Hệ thống \u0026 Phân tích Nghiệp vụ (BA Solutions):","(1) Hệ thống Giám sát Giao ước Tài chính Theo Thời gian Thực (Real-time Covenant Headroom Monitor): Thiết lập module kiểm soát cảnh báo sớm trên hệ thống ERP Ngân quỹ: Mỗi khi tạo đơn đề nghị rút vốn mới, hệ thống tự động tính toán lại tỷ lệ Nợ ròng/EBITDA dự phóng; nếu vượt ngưỡng an toàn nội bộ (ví dụ 2.80x), hệ thống sẽ cảnh báo đỏ ngăn chặn gửi thông báo rút vốn.","(2) Tự động hóa Tính toán Tối ưu Hóa Chi phí Lãi vay và Phí Cam kết (Borrowing vs. Commitment Fee Optimizer): Xây dựng thuật toán so sánh chi phí cơ hội giữa việc rút vốn ngay để gửi tiết kiệm kỳ hạn ngắn/repo và việc để nguyên hạn mức chịu phí 0.25%, giúp thủ quỹ lựa chọn kỳ hạn rút (1 tháng, 3 tháng hay 6 tháng) tối ưu nhất.","(3) Tích hợp Cổng Điện tử Giao dịch Ngân hàng Đại lý (Syndicated Agency Loan Portal Integration): Kết nối API hai chiều giữa ERP doanh nghiệp và hệ thống Global Commercial Trust để tự động đồng bộ hóa lịch chốt lãi suất SOFR, tự động trích lập chi phí lãi vay hàng ngày (Daily Interest Accrual) và đối soát hóa đơn phí cam kết hàng quý hoàn toàn tự động.","4.3. Business Analyst \u0026 Financial Systems Executive Summary (Bản Tiếng Anh)","• End-to-End Syndicated Credit Facility Context: Corporate revolving credit facilities operate across three functional pillars: (1) Legal \u0026 Covenant Governance: A $150M syndicated agreement binds lenders and borrower, imposing a 3.25x Net Debt-to-EBITDA ceiling; each drawdown mandates formal officer certification of covenant compliance; (2) Operational Funding \u0026 Benchmark Rate Fixing: Borrowing tranches leverage benchmark Term SOFR plus a 1.85% credit spread, with the administrative agent pooling funds across syndicate participants for electronic Fedwire disbursement; (3) Fee Architecture \u0026 Capital Cost Optimization: Lenders charge an unused commitment fee (0.25%) on undrawn facility capacity ($110M) to compensate for allocated regulatory capital. Treasury must balance the all-in cost of borrowed debt (6.25%) against unused facility carry costs.","• Core Operational Bottleneck \u0026 Risk: The threat of Technical Default triggered by covenant breaches. If macroeconomic downturns compress operating EBITDA while seasonal borrowing expands, the Net Debt-to-EBITDA ratio risks breaching the 3.25x covenant cap. A breach triggers immediate facility cancellation, default penalty margins, and cross-default clauses across external debt instruments.","• Key BA \u0026 Financial System Architecture Solutions:","(1) Real-Time Covenant Headroom \u0026 Sensitivity Engine: Implement continuous monitoring algorithms within treasury ERP to simulate post-drawdown leverage ratios against pro-forma EBITDA, locking unauthorized drawdowns if leverage exceeds internal safety buffers (e.g., 2.80x).","(2) Algorithmic Cash Drag \u0026 Commitment Fee Optimizer: Deploy mathematical decision models evaluating liquidity carry costs: comparing short-term overnight yield reinvestment against the 0.25% unused commitment drag across 1-month, 3-month, and 6-month SOFR tenors.","(3) Automated Loan Agency API Integration: Establish secure API connections between corporate ERP and loan agency servicing systems to ingest daily SOFR rate fixes, calculate compound daily interest accruals, and validate quarterly commitment fee invoices with zero human touch.","4.4. Tam giác Liên kết Nhận thức Đa chiều (Multi-Perspective Contextual Anchoring)","1. Lăng kính Viễn thông \u0026 Tài chính Viettel: Bài toán đàm phán hạn mức tín dụng tuần hoàn đa tệ với các ngân hàng quốc tế để tài trợ mua thiết bị mạng vô tuyến và sợi quang viễn thông cho các thị trường nước ngoài (Metfone, Unitel, Mytel). Việc kiểm soát chặt chẽ tỷ lệ đòn bẩy tài chính và tối ưu chi phí phí cam kết hạn mức nhàn rỗi giúp Tập đoàn tiết kiệm hàng triệu USD chi phí tài chính mỗi năm.","2. Lăng kính Quản trị Trường Mầm non Ước Mơ Xanh (cô Thu Huyền): Bài toán mở hạn mức thấu chi tài khoản trường tại ngân hàng để kịp chi trả lương giáo viên và đặt cọc thực phẩm sạch bán trú vào những tháng đầu năm học khi phụ huynh chưa đóng học phí kỳ mới. Khoản thấu chi này đóng vai trò như một hạn mức tuần hoàn, giúp trường vận hành liên tục mà không bị đứt gãy dòng tiền mùa vụ.","3. Lăng kính Bàn học Gia đình (Kèm cặp học sinh Lớp 5 - Bé Hà Ngân): Bài học \u0027Chiếc ví dự phòng ngày hội chợ\u0027: Bố cho Hà Ngân mang chiếc ví có hạn mức 200.000 đồng đi hội chợ trường, nhưng dặn con chỉ lấy ra 50.000 đồng mua sách xếp hình STEAM, còn 150.000 đồng để lại phòng khi có việc gấp; nếu không dùng hết thì bố sẽ tính một khoản \u0027tiền phí cất hộ tượng trưng\u0027 nhỏ để rèn cho Hà Ngân tính cẩn thận và thói quen tính toán chi tiêu.","PHẦN 5: BẢNG TỪ VỰNG \u0026 CẤU TRÚC CỐT LÕI (8 THUẬT NGỮ TÍN DỤNG \u0026 CÔNG CỤ NGÂN HÀNG)","1. revolving credit facility (n phr)  /rɪˈvɑːlvɪŋ ˈkredɪt fəˈsɪləti/  = revolving credit line / flexible corporate credit commitment","Nghia: Hạn mức tín dụng tuần hoàn (cho phép vay, trả nợ và vay lại linh hoạt trong thời hạn)","Vd: The corporation secured a $150 million revolving credit facility to finance operations. - Tập đoàn đã bảo đảm được một hạn mức tín dụng tuần hoàn trị giá 150 triệu USD để tài trợ cho các hoạt động.","2. drawdown (n/v)  /ˈdrɔːdaʊn/  = borrowing tranche / fund disbursement / loan withdrawal","Nghia: Sự rút vốn / Giải ngân một khoản vay theo hạn mức","Vd: Talon executed a $40 million drawdown to purchase inventory before the fourth quarter. - Talon đã thực hiện một đợt rút vốn 40 triệu USD để thu mua hàng tồn kho trước quý 4.","3. commitment fee (n phr)  /kəˈmɪtmənt fiː/  = facility availability fee / charge on undrawn loan balance","Nghia: Phí cam kết (khoản phí trả cho ngân hàng trên phần hạn mức tín dụng chưa rút)","Vd: The company pays a 0.25% commitment fee on the undrawn portion of the credit line. - Công ty phải trả khoản phí cam kết 0,25% trên phần hạn mức tín dụng chưa được sử dụng.","4. financial covenant (n phr)  /faɪˈnænʃl ˈkʌvənənt/  = loan agreement condition / financial ratio restriction / protective clause","Nghia: Giao ước tài chính (các điều khoản bắt buộc bên vay phải duy trì tỷ số an toàn)","Vd: Borrowers must comply with all financial covenants to avoid technical loan default. - Bên vay bắt buộc phải tuân thủ mọi giao ước tài chính để tránh tình trạng vỡ nợ kỹ thuật đối với khoản vay.","5. floating rate (n phr)  /ˈfloʊtɪŋ reɪt/  = variable interest rate / adjustable borrowing rate / benchmark-linked rate","Nghia: Lãi suất thả nổi (lãi suất biến đổi theo chỉ số cơ sở của thị trường)","Vd: The loan carries a floating rate pegged to three-month CME Term SOFR. - Khoản vay áp dụng lãi suất thả nổi được neo theo lãi suất CME Term SOFR kỳ hạn 3 tháng.","6. syndicated loan (n phr)  /ˈsɪndɪkeɪtɪd loʊn/  = consortium loan / multi-lender credit facility","Nghia: Khoản vay hợp vốn (khoản tín dụng do một nhóm nhiều ngân hàng cùng tài trợ)","Vd: Global Commercial Trust served as lead arranger for the syndicated credit facility. - Tập đoàn Tín thác Thương mại Toàn cầu đóng vai trò là ngân hàng thu xếp chính cho khoản tín dụng hợp vốn.","7. irrevocable (adj)  /ɪˈrevəkəbl/  = binding / irreversible / unalterable / incapable of being rescinded","Nghia: Không thể hủy ngang / Có tính ràng buộc pháp lý bắt buộc","Vd: The treasurer submitted an irrevocable drawdown notice to the administrative bank. - Trưởng ban ngân quỹ đã đệ trình một thông báo rút vốn không thể hủy ngang lên ngân hàng đại lý.","8. undrawn balance (n phr)  /ˌʌnˈdrɔːn ˈbæləns/  = unborrowed credit line / available unused commitment","Nghia: Số dư hạn mức chưa rút (phần tín dụng chưa giải ngân)","Vd: A commitment fee is assessed quarterly against the undrawn balance of the credit facility. - Phí cam kết được tính hàng quý dựa trên số dư chưa rút của hạn mức tín dụng.","==================================================================================================","BÀI 3: Bản Cáo bạch Phát hành Trái phiếu Xanh (Green Bond Offering Prospectus) \u0026 Thông báo Thanh toán Lãi Coupon Định kỳ (Semi-Annual Coupon Payment Notice) (Questions 176-180 - Double Passage)","Nguồn: ETS TOEIC Part 7 — Double Passage (Bond Prospectus Excerpt \u0026 Depository Coupon Payment Notice)","PHẦN 1: NỘI DUNG BÀI ĐỌC, CÂU HỎI \u0026 BẢN DỊCH SONG NGỮ","1.1. Đề thi Tiếng Anh gốc (Strategy Guide \u0026 Original ETS Passages)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","Questions 176-180 refer to the following bond prospectus excerpt and coupon payment notice.","[Passage 1: Offering Prospectus Excerpt — Solaria Clean Energy Plc]","SOLARIA CLEAN ENERGY PLC","Offering Summary — $200,000,000 5.40% Senior Unsecured Green Notes due 2030","1. Core Offering Terms","• Issuer: Solaria Clean Energy Plc (London Stock Exchange: SLRA)","• Aggregate Principal Amount: $200,000,000 (Two Hundred Million USD)","• Denomination: Minimum denominations of $1,000 and integral multiples of $1,000","• Annual Coupon Rate: 5.40% per annum, calculated on a 30/360-day count convention","• Payment Frequency: Semi-annually in arrears on May 15 and November 15 of each year, commencing May 15, 2026","• Maturity Date: November 15, 2030 (5-Year Term)","• Credit Ratings: Baa1 (Moody\u0027s) / BBB+ (Standard \u0026 Poor\u0027s)","2. Use of Proceeds (Green Financing Framework)","Net proceeds from the offering (estimated at $197.8 million after underwriting commissions and issuance expenses) will be exclusively allocated to Eligible Green Assets in compliance with the International Capital Market Association (ICMA) Green Bond Principles. Specifically, funds will finance the construction of the Dogger Bank Offshore Wind Turbine Farm (70% of proceeds) and Grid-Scale Lithium-Iron Battery Energy Storage Systems (BESS) in Yorkshire (30% of proceeds).","3. Clearing \u0026 Depository Systems","The notes will be issued in registered book-entry form through the clearing facilities of The Depository Trust Company (DTC) and Euroclear/Clearstream Luxembourg.","[Passage 2: Semi-Annual Coupon Distribution Notice — Euroclear Operations Group]","EUROCLEAR ASSET SERVICES — CORPORATE ACTIONS DIVISION","Notification of Upcoming Fixed-Income Coupon Distribution","Date of Notice: October 25 | Security Identifier: ISIN US83416LAA92","Security Description: Solaria Clean Energy Plc 5.40% Notes due 11/15/2030","To All Registered Custodians \u0026 Institutional Clearing Participants:","Please be advised of the scheduled semi-annual interest distribution for the above-referenced debt security:","• Payment Date: November 15","• Record Date (Cut-off for Holder Entitlement): November 1 (at 5:00 PM GMT)","• Ex-Interest Trading Date: October 31","• Semi-Annual Coupon Distribution Rate: $27.00 per $1,000.00 principal note ($1,000 x 5.40% / 2)","Institutional Account Position Summary:","• Clearing Participant: Vanguard Nordic Asset Management (Account #EU-44018)","• Verified Position as of Record Date: $12,500,000.00 aggregate principal (12,500 note units)","• Gross Semi-Annual Interest Due: $337,500.00 (12,500 units x $27.00)","• Tax Withholding Rate: 0.0% (Exempt under Cross-Border Double Taxation Treaty)","• Net Remittance Amount: $337,500.00 to be credited to Euroclear Cash Settlement Account","*Note: Solaria\u0027s annual Green Project Allocation \u0026 Environmental Impact Report has been published on the issuer\u0027s investor portal, confirming that 100% of proceeds remain committed to scheduled wind turbine installations.","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","176. What will the majority of the money raised from Solaria\u0027s bond sale be used for?","(A) Retiring high-interest bank debt taken out in previous years","(B) Building an offshore wind farm in the North Sea","(C) Acquiring a fossil fuel energy trading subsidiary","(D) Funding corporate headquarters remodeling projects","177. In Passage 2, paragraph 1, the word \u0027entitlement\u0027 is closest in meaning to","(A) obligation","(B) restriction","(C) eligibility","(D) nomination","178. By what date must an investor hold the notes to receive the upcoming interest payment?","(A) October 25","(B) October 31","(C) November 1","(D) November 15","179. How much interest will Vanguard Nordic Asset Management receive on November 15?","(A) $27,000.00","(B) $67,500.00","(C) $337,500.00","(D) $675,000.00","180. What is true about the Solaria green bonds according to the passages?","(A) They pay interest to bondholders on a quarterly basis.","(B) They carry a variable interest rate tied to central bank rates.","(C) They will mature and repay principal in November 2030.","(D) They require individual certificate physical delivery rather than electronic clearing.","1.2. Hướng dẫn làm bài Part 7","CHIẾN THUẬT 5 PHÚT TỐI ƯU: NẮM BẮT BỐI CẢNH, GHÉP NỐI DỮ KIỆN \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Luồng sự việc (Quỹ đạo Quét chữ Z \u0026 3 Câu hỏi Tiềm thức): • Văn bản 1 (Bản Cáo bạch Trái phiếu Xanh): Công ty Năng lượng Solaria phát hành 200 triệu USD trái phiếu xanh, lãi suất cố định 5.40%/năm trả 6 tháng một lần (ngày 15/05 và 15/11), đáo hạn ngày 15/11/2030 (kỳ hạn 5 năm); 70% vốn giải ngân cho dự án điện gió ngoài khơi Dogger Bank, 30% cho pin lưu trữ BESS.","• Văn bản 2 (Thông báo Thanh toán Coupon của Euroclear): Ngày chốt danh sách (Record Date) là 01/11, ngày thanh toán là 15/11; tỷ lệ coupon nửa năm là $27.00 cho mỗi $1,000 mệnh giá; Quỹ Vanguard Nordic nắm 12.5 triệu USD trái phiếu nên nhận đủ 337,500 USD tiền lãi không bị khấu trừ thuế.","=\u003e Luồng sự việc: Bản cáo bạch quy định điều khoản trái phiếu xanh (5.4% trả nửa năm, đáo hạn 2030) -\u003e Trung tâm lưu ký Euroclear thông báo lịch chốt quyền và số tiền lãi coupon chuyển vào tài khoản nhà đầu tư tổ chức.","Bước 2 (20 giây) - Quét nhanh 5 câu hỏi \u0026 Gắn móc từ khóa: • Câu 176: Mục đích chính dùng tiền bán trái phiếu (Từ khóa: majority of money raised, used for).","• Câu 177: Từ \u0027entitlement\u0027 gần nghĩa nhất với từ nào (Từ khóa: entitlement closest in meaning).","• Câu 178: Hạn chót sở hữu để được nhận lãi (Từ khóa: what date, must hold notes, receive interest payment).","• Câu 179: Số tiền lãi Vanguard Nordic nhận được ngày 15/11 (Từ khóa: how much interest, Vanguard Nordic receive, November 15).","• Câu 180: Nhận định nào ĐÚNG về trái phiếu Solaria (Từ khóa: true about Solaria green bonds).","Bước 3 (3 phút 45 giây) - Giải cuốn chiếu \u0026 Khóa đáp án: • Câu 176 (Chi tiết - VB1 Mục 2): 70% nguồn vốn (majority) tài trợ \u0027construction of the Dogger Bank Offshore Wind Turbine Farm\u0027 -\u003e Chọn (B) Xây dựng trang trại điện gió ngoài khơi.","• Câu 177 (Từ vựng ngữ cảnh - VB2): \u0027Cut-off for Holder Entitlement\u0027 = thời điểm chốt quyền / điều kiện đủ tiêu chuẩn nhận tiền lãi -\u003e Chọn (C) eligibility.","• Câu 178 (Chi tiết - VB2): \u0027Record Date (Cut-off for Holder Entitlement): November 1\u0027 -\u003e Chọn (C) Ngày 1 tháng 11.","• Câu 179 (Ghép nối - VB2): Vanguard Nordic nắm $12.5M (12,500 trái phiếu) x $27 = $337,500.00 (Hoặc: $12.5M x 5.4% / 2 = $337,500) -\u003e Chọn (C).","• Câu 180 (Chi tiết - VB1): \u0027Maturity Date: November 15, 2030 (5-Year Term)\u0027 -\u003e Đáo hạn và hoàn trả nợ gốc vào tháng 11 năm 2030 -\u003e Chọn (C).","Bước 4 (25 giây) - Rà soát \u0026 Đúc kết Feynman: Tự đúc kết 1 câu: Trái phiếu xanh Solaria huy động 200 triệu USD xây điện gió ngoài khơi với cam kết trả lãi 5.4%/năm chia làm 2 đợt, và quỹ đầu tư nắm 12.5 triệu USD sẽ được nhận trọn vẹn 337,500 USD tiền lãi nửa năm vào ngày 15/11.","1.3. Dịch Song ngữ Xen kẽ Từng Câu (Sentence-by-Sentence Translation)","[Văn bản 1: Bản Cáo bạch Phát hành Trái phiếu — Công ty Năng lượng Tái tạo Solaria]","SOLARIA CLEAN ENERGY PLC","Offering Summary — $200,000,000 5.40% Senior Unsecured Green Notes due 2030","CÔNG TY ĐIỆN NĂNG LƯỢNG SẠCH SOLARIA PLC","Bản Tóm tắt Phát hành — Trái phiếu Xanh Ưu tiên Không Đảm bảo Trị giá 200.000.000 USD Lãi suất 5,40% Đáo hạn Năm 2030","Issuer: Solaria Clean Energy Plc | Aggregate Principal: $200,000,000 | Denomination: $1,000","Bên phát hành: Công ty Cổ phần Năng lượng Sạch Solaria | Tổng Giá trị Nợ gốc: 200.000.000 USD | Mệnh giá: 1.000 USD","Annual Coupon Rate: 5.40% per annum, calculated on a 30/360-day count convention.","Lãi suất Coupon Hàng năm: 5,40%/năm, được tính theo quy ước số ngày 30/360 ngày.","Payment Frequency: Semi-annually in arrears on May 15 and November 15 of each year, commencing May 15, 2026 | Maturity Date: November 15, 2030.","Định kỳ Trả lãi: Trả sau nửa năm một lần vào ngày 15 Tháng 5 và ngày 15 Tháng 11 hàng năm, bắt đầu từ ngày 15 Tháng 5 Năm 2026 | Ngày Đáo hạn: Ngày 15 Tháng 11 Năm 2030.","Net proceeds will be exclusively allocated to Eligible Green Assets in compliance with ICMA Green Bond Principles.","Toàn bộ số tiền thu ròng sẽ được phân bổ độc quyền cho các Tài sản Xanh Hợp lệ tuân thủ theo các Nguyên tắc Trái phiếu Xanh của ICMA.","Specifically, funds will finance the construction of the Dogger Bank Offshore Wind Turbine Farm (70% of proceeds) and Grid-Scale Lithium-Iron Battery Energy Storage Systems in Yorkshire (30% of proceeds).","Cụ thể, nguồn vốn sẽ tài trợ xây dựng Trang trại Tua-bin Điện gió Ngoài khơi Dogger Bank (70% số tiền thu được) và Hệ thống Pin Lưu trữ Năng lượng Lithium-Sắt quy mô lưới điện tại Yorkshire (30% số tiền thu được).","The notes will be issued in registered book-entry form through DTC and Euroclear.","Các trái phiếu sẽ được phát hành dưới hình thức ghi sổ đăng ký điện tử thông qua các hệ thống thanh toán bù trừ DTC và Euroclear.","[Văn bản 2: Thông báo Chi trả Lãi Coupon Định kỳ — Hệ thống Lưu ký Euroclear]","EUROCLEAR ASSET SERVICES — CORPORATE ACTIONS DIVISION","Notification of Upcoming Fixed-Income Coupon Distribution","Security: Solaria Clean Energy Plc 5.40% Notes due 11/15/2030 | ISIN: US83416LAA92","DỊCH VỤ TÀI SẢN EUROCLEAR — KHỐI HOẠT ĐỘNG DOANH NGHIỆP","Thông báo về Đợt Phân bổ Lãi Coupon Trái phiếu Thu nhập Cố định Sắp tới","Chứng khoán: Trái phiếu Solaria Clean Energy Plc 5,40% Đáo hạn 15/11/2030 | Mã ISIN: US83416LAA92","Payment Date: November 15 | Record Date (Cut-off for Holder Entitlement): November 1 (5:00 PM GMT) | Ex-Interest Date: October 31","Ngày Thanh toán: Ngày 15 Tháng 11 | Ngày Chốt Quyền (Thời hạn cuối cùng xác định tư cách người sở hữu): Ngày 1 Tháng 11 (lúc 17:00 giờ GMT) | Ngày Giao dịch Không Hưởng Lãi: Ngày 31 Tháng 10","Semi-Annual Coupon Distribution Rate: $27.00 per $1,000.00 principal note ($1,000 x 5.40% / 2).","Mức Phân bổ Lãi Coupon Nửa năm: 27,00 USD cho mỗi 1.000,00 USD mệnh giá trái phiếu gốc (1.000 USD x 5,40% / 2).","Clearing Participant: Vanguard Nordic Asset Management | Verified Position: $12,500,000.00 aggregate principal (12,500 note units).","Thành viên Lưu ký Bù trừ: Công ty Quản lý Tài sản Vanguard Nordic | Vị thế Nắm giữ Được xác thực: 12.500.000,00 USD tổng mệnh giá gốc (12.500 đơn vị trái phiếu).","Gross Semi-Annual Interest Due: $337,500.00 | Tax Withholding: 0.0% | Net Remittance: $337,500.00 to be credited to cash account.","Tổng Tiền Lãi Nửa năm Phải trả: 337.500,00 USD | Thuế Khấu trừ tại Nguồn: 0,0% | Số tiền Quyết toán Ròng: 337.500,00 USD sẽ được ghi có vào tài khoản tiền mặt.","Solaria\u0027s Green Project Report confirms that 100% of proceeds remain committed to scheduled wind turbine installations.","Báo cáo Dự án Xanh của Solaria xác nhận rằng 100% số tiền huy động vẫn cam kết dành trọn vẹn cho việc lắp đặt các tua-bin điện gió theo đúng tiến độ.","1.4. Dịch chi tiết Câu hỏi \u0026 Phương án Trắc nghiệm","Câu 176. Phần lớn số tiền huy động được từ đợt bán trái phiếu của Solaria sẽ được sử dụng vào mục đích gì?","(A) Mua lại các khoản nợ vay ngân hàng lãi suất cao đã vay từ những năm trước","(B) Xây dựng trang trại điện gió ngoài khơi ở vùng Biển Bắc","(C) Mua lại một công ty con chuyên kinh doanh năng lượng hóa thạch","(D) Tài trợ cho các dự án sửa chữa, nâng cấp trụ sở chính của tập đoàn","Câu 177. Trong Văn bản 2, đoạn 1, từ \u0027entitlement\u0027 gần nghĩa nhất với từ nào sau đây?","(A) Nghĩa vụ pháp lý (obligation)","(B) Sự giới hạn ngăn cấm (restriction)","(C) Tư cách đủ điều kiện hưởng quyền (eligibility)","(D) Sự bổ nhiệm ứng cử (nomination)","Câu 178. Nhà đầu tư phải nắm giữ trái phiếu muộn nhất vào ngày nào để được nhận đợt thanh toán tiền lãi sắp tới?","(A) Ngày 25 tháng 10","(B) Ngày 31 tháng 10","(C) Ngày 1 tháng 11","(D) Ngày 15 tháng 11","Câu 179. Công ty Quản lý Tài sản Vanguard Nordic sẽ nhận được bao nhiêu tiền lãi vào ngày 15 tháng 11?","(A) 27.000,00 USD","(B) 67.500,00 USD","(C) 337.500,00 USD","(D) 675.000,00 USD","Câu 180. Điều gì là ĐÚNG về trái phiếu xanh của Solaria theo các đoạn văn?","(A) Trái phiếu chi trả tiền lãi cho trái chủ theo định kỳ hàng quý.","(B) Trái phiếu áp dụng mức lãi suất biến đổi gắn liền với lãi suất ngân hàng trung ương.","(C) Trái phiếu sẽ đáo hạn và hoàn trả tiền nợ gốc vào tháng 11 năm 2030.","(D) Trái phiếu bắt buộc phải giao nhận chứng chỉ giấy vật lý thay vì lưu ký điện tử.","1.5. Tóm tắt Viết lại Toàn bài theo Feynman (Feynman Monograph Summary)","English Executive Summary:","• Green Note Offering Terms: Solaria Clean Energy Plc issued $200.0M in 5-year senior unsecured green notes carrying a fixed 5.40% annual coupon paid semi-annually (May 15 and November 15) and maturing November 15, 2030, with 70% of proceeds funding the Dogger Bank Offshore Wind Farm and 30% funding battery energy storage.","• Depository Distribution Logistics: Euroclear issued a coupon notice to custodians establishing a November 1 record date (ex-interest October 31) for the November 15 payout of $27.00 per $1,000 note.","• Institutional Custody Credit: Institutional holder Vanguard Nordic Asset Management, holding a verified $12.5M principal position (12,500 units), is credited with a tax-exempt net semi-annual interest disbursement of $337,500.00 directly into its cash settlement account.","Bản tóm tắt Tiếng Việt cốt lõi:","• Điều khoản Phát hành Trái phiếu Xanh: Công ty Solaria phát hành 200,000,000 USD trái phiếu xanh kỳ hạn 5 năm, lãi suất coupon cố định 5,40%/năm trả định kỳ nửa năm một lần (15/05 và 15/11), đáo hạn ngày 15/11/2030, dành 70% vốn xây điện gió ngoài khơi Dogger Bank và 30% cho pin lưu trữ BESS.","• Quy trình Chốt Quyền Lưu ký Euroclear: Euroclear ban hành thông báo chốt danh sách người hưởng lãi coupon vào ngày 01/11 (giao dịch không hưởng lãi ngày 31/10) để phân bổ 27,00 USD trên mỗi trái phiếu mệnh giá 1.000 USD vào ngày 15/11.","• Giải ngân Tiền lãi cho Quỹ Đầu tư: Quỹ đầu tư Vanguard Nordic nắm giữ vị thế 12,5 triệu USD (12.500 trái phiếu) được tự động ghi có đầy đủ 337.500 USD tiền lãi nửa năm (miễn thuế khấu trừ theo hiệp định) vào tài khoản thanh toán tiền mặt.","PHẦN 2: ACTIVE RECALL 5 GIÂY (BẢNG MA TRẬN ĐỊNH VỊ SONG NGỮ)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["1. Đối tượng \u0026 Vai trò: Solaria Clean Energy Plc (Doanh nghiệp phát hành trái phiếu xanh tài trợ điện gió) \u003c-\u003e Euroclear (Trung tâm lưu ký và thanh toán bù trừ chứng khoán quốc tế) \u003c-\u003e Vanguard Nordic (Nhà đầu tư tổ chức nắm giữ 12.5 triệu USD trái phiếu nhận lãi coupon).","1. Stakeholders \u0026 Roles: Solaria Clean Energy Plc (Corporate green note issuer financing offshore wind) \u003c-\u003e Euroclear (International central securities depository and clearing agent) \u003c-\u003e Vanguard Nordic (Institutional asset manager holding $12.5M principal receiving coupon income)."]],[["2. Boi canh \u0026 Quy trinh loi"],["2. Bối cảnh \u0026 Quy trình lõi: Quản lý Chứng khoán Thu nhập Cố định \u0026 Thanh toán Coupon (Fixed-Income Coupon Distribution): Doanh nghiệp công bố bản cáo bạch trái phiếu xanh -\u003e Đến kỳ hạn 6 tháng, trung tâm lưu ký chốt danh sách trái chủ tại ngày Record Date -\u003e Tự động giải ngân tiền lãi coupon vào tài khoản tiền mặt của nhà đầu tư.","2. Business Context \u0026 Core Flow: Fixed-Income Debt Servicing \u0026 Coupon Payment: Issuer releases green bond prospectus -\u003e At semi-annual intervals, central depository cuts off ownership on the Record Date -\u003e Automatically remits cash coupon interest into investor settlement accounts."]],[["3. Dau vet suy luan cheo"],["3. Dấu vết suy luận chéo: Mệnh giá $1,000 với lãi suất 5.4% trả nửa năm = $27/trái phiếu (VB1 \u0026 VB2) -\u003e Vanguard sở hữu $12.5M nợ gốc tương đương 12,500 đơn vị (VB2) -\u003e Lấy 12,500 x $27 ra đúng $337,500 tiền lãi chuyển về tài khoản ngày 15/11.","3. Key Cross-Referencing Clues: $1,000 par at 5.4% semi-annual = $27 per note (Passages 1 \u0026 2) -\u003e Vanguard holds $12.5M principal or 12,500 note units (Passage 2) -\u003e Multiplying 12,500 units by $27 yields exactly $337,500 credited on November 15."]]],"t":"table"},"PHẦN 3: ĐÁP ÁN CHUẨN XÁC \u0026 DẤU VẾT TRUY XUẤT CHÉO (CROSS-REFERENCING \u0026 TRAP BREAKDOWN)","176. What will the majority of the money raised from Solaria\u0027s bond sale be used for?","Dap an dung: (B) Building an offshore wind farm in the North Sea","[Dau vet bai doc / Clue]: Văn bản 1 (Bản Cáo bạch), Mục 2: \u0027Specifically, funds will finance the construction of the Dogger Bank Offshore Wind Turbine Farm (70% of proceeds)...\u0027","[Dien dat tuong duong / Paraphrase]: • \u002770% of proceeds\u0027 (chiếm đại đa số / majority) \u003c-\u003e \u0027the majority of the money raised\u0027","• \u0027construction of the Dogger Bank Offshore Wind Turbine Farm\u0027 \u003c-\u003e \u0027Building an offshore wind farm in the North Sea\u0027","[Loi giai chi tiet]: Mục Use of Proceeds chỉ rõ 70% số tiền thu được (chiếm đa số) sẽ tài trợ xây dựng trang trại tua-bin điện gió ngoài khơi Dogger Bank.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Retiring high-interest bank debt taken out in previous years","- Ly do sai: Trái phiếu xanh bắt buộc phải giải ngân 100% vào các tài sản xanh hợp lệ, không dùng để trả nợ vay ngân hàng cũ.","- Bay ETS: Bẫy Đảo Nợ Truyền Thống (Debt Refinancing Trap)","(C) Acquiring a fossil fuel energy trading subsidiary","- Ly do sai: Mua công ty năng lượng hóa thạch vi phạm nghiêm trọng Nguyên tắc Trái phiếu Xanh của ICMA.","- Bay ETS: Bẫy Ngược Bản chất Tài chính Xanh (Greenwashing Trap)","(D) Funding corporate headquarters remodeling projects","- Ly do sai: Nguồn vốn không dành cho sửa sang văn phòng trụ sở.","- Bay ETS: Bẫy Chi phí Hành chính Lạc đề (Irrelevant Admin Expense Trap)","177. In Passage 2, paragraph 1, the word \u0027entitlement\u0027 is closest in meaning to","Dap an dung: (C) eligibility","[Dau vet bai doc / Clue]: Văn bản 2, Dòng Record Date: \u0027Record Date (Cut-off for Holder Entitlement): November 1 (at 5:00 PM GMT)...\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027entitlement\u0027 (tư cách hưởng quyền / quyền lợi hợp pháp) \u003c-\u003e \u0027eligibility\u0027 (đủ tư cách / tiêu chuẩn hợp lệ)","[Loi giai chi tiet]: Trong thị trường chứng khoán và lưu ký trái phiếu, \u0027Holder Entitlement\u0027 là tư cách hợp lệ của nhà đầu tư sở hữu chứng khoán tại thời điểm chốt sổ để được quyền nhận phân phối tiền lãi.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) obligation","- Ly do sai: \u0027Obligation\u0027 nghĩa là nghĩa vụ phải trả nợ, trong khi entitlement là quyền lợi được nhận tiền.","- Bay ETS: Bẫy Nhầm lẫn Quyền lợi với Nghĩa vụ (Right vs. Duty Trap)","(B) restriction","- Ly do sai: \u0027Restriction\u0027 nghĩa là sự hạn chế cấm cản, trái ngược hoàn toàn với quyền lợi.","- Bay ETS: Bẫy Từ mang Tính Tiêu cực (Negative Connotation Trap)","(D) nomination","- Ly do sai: \u0027Nomination\u0027 là sự bổ nhiệm hoặc đề cử nhân sự, không dùng cho phân bổ tài chính.","- Bay ETS: Bẫy Thuật ngữ Nhân sự (HR Terminology Trap)","178. By what date must an investor hold the notes to receive the upcoming interest payment?","Dap an dung: (C) November 1","[Dau vet bai doc / Clue]: Văn bản 2, Dòng thứ 3: \u0027Record Date (Cut-off for Holder Entitlement): November 1 (at 5:00 PM GMT)\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027Record Date (Cut-off for Holder Entitlement)\u0027 \u003c-\u003e \u0027date must hold the notes to receive the upcoming interest payment\u0027","[Loi giai chi tiet]: Ngày đăng ký cuối cùng (Record Date) là ngày 1 tháng 11; nhà đầu tư phải có tên trong sổ lưu ký tại thời điểm 17:00 ngày này mới đủ tư cách nhận tiền lãi coupon.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) October 25","- Ly do sai: 25 tháng 10 chỉ là ngày Euroclear phát hành thông báo (Date of Notice).","- Bay ETS: Bẫy Ngày Phát hành Thông báo (Notice Issuance Date Trap)","(B) October 31","- Ly do sai: 31 tháng 10 là Ngày Giao dịch Không Hưởng Quyền Lãi (Ex-Interest Date), không phải ngày chốt sổ quyền.","- Bay ETS: Bẫy Ngày Giao dịch Không Hưởng Quyền (Ex-Interest Date Trap)","(D) November 15","- Ly do sai: 15 tháng 11 là ngày tiền được chuyển vào tài khoản (Payment Date), không phải ngày chốt danh sách sở hữu.","- Bay ETS: Bẫy Nhầm lẫn Ngày Chốt Quyền với Ngày Nhận Tiền (Record vs. Payment Date Trap)","179. How much interest will Vanguard Nordic Asset Management receive on November 15?","Dap an dung: (C) $337,500.00","[Dau vet bai doc / Clue]: Văn bản 2, Mục Position Summary: \u0027Verified Position: $12,500,000.00 aggregate principal (12,500 note units) -\u003e Gross Semi-Annual Interest Due: $337,500.00... Net Remittance: $337,500.00\u0027","[Dien dat tuong duong / Paraphrase]: • Tính toán trực tiếp: 12,500 đơn vị x $27.00/đơn vị = $337,500.00 (Hoặc $12,500,000 x 5.40% / 2 = $337,500.00).","[Loi giai chi tiet]: Vanguard Nordic nắm giữ 12.500 trái phiếu, mỗi trái phiếu nhận 27 USD lãi coupon nửa năm, tổng số tiền lãi thực nhận là 337.500,00 USD (thuế suất 0%).","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) $27,000.00","- Ly do sai: 27.000 USD là phép tính nhầm lẫn khi nhân 1.000 trái phiếu với 27 USD.","- Bay ETS: Bẫy Lỗi Tính nhẩm Đơn vị (Unit Scale Math Trap)","(B) $67,500.00","- Ly do sai: 67.500 USD là con số tính sai tỷ lệ phần trăm.","- Bay ETS: Bẫy Sai lệch Phép chia (Calculation Error Distractor)","(D) $675,000.00","- Ly do sai: 675.000 USD là tiền lãi của CẢ NĂM ($12.5M x 5.4%), trong khi đợt thanh toán này chỉ là đợt nửa năm (Semi-Annual).","- Bay ETS: Bẫy Tiền Lãi Cả Năm Thay vì Nửa Năm (Full Annual Interest Trap)","180. What is true about the Solaria green bonds according to the passages?","Dap an dung: (C) They will mature and repay principal in November 2030.","[Dau vet bai doc / Clue]: Văn bản 1, Mục 1: \u0027Maturity Date: November 15, 2030 (5-Year Term)\u0027 và Tiêu đề: \u00275.40% Senior Unsecured Green Notes due 2030\u0027.","[Dien dat tuong duong / Paraphrase]: • \u0027Maturity Date: November 15, 2030\u0027 \u003c-\u003e \u0027mature and repay principal in November 2030\u0027","[Loi giai chi tiet]: Cáo bạch trái phiếu nêu rõ ngày đáo hạn (Maturity Date) là ngày 15 tháng 11 năm 2030, lúc đó bên phát hành sẽ hoàn trả toàn bộ mệnh giá nợ gốc cho trái chủ.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) They pay interest to bondholders on a quarterly basis.","- Ly do sai: Trái phiếu trả lãi định kỳ nửa năm một lần (Semi-annually), không phải hàng quý.","- Bay ETS: Bẫy Kỳ hạn Trả lãi (Payment Frequency Trap)","(B) They carry a variable interest rate tied to central bank rates.","- Ly do sai: Trái phiếu áp dụng lãi suất cố định 5.40%/năm (Fixed coupon rate), không phải lãi suất biến đổi thả nổi.","- Bay ETS: Bẫy Cố định vs. Thả nổi (Fixed vs. Variable Trap)","(D) They require individual certificate physical delivery rather than electronic clearing.","- Ly do sai: Trái phiếu phát hành dưới dạng ghi sổ điện tử (registered book-entry form) qua DTC và Euroclear, không giao nhận chứng chỉ vật lý.","- Bay ETS: Bẫy Hình thức Lưu ký Chứng khoán (Physical vs. Book-Entry Trap)","PHẦN 4: KỸ THUẬT FEYNMAN SONG NGỮ \u0026 SƠ ĐỒ QUY TRÌNH (TƯ DUY TRÁI PHIẾU DOANH NGHIỆP \u0026 BA)","4.1. Sơ đồ Quy trình Luân chuyển Nghiệp vụ (Green Bond Offering, Depository Clearing \u0026 Coupon Settlement)","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","Phát hành Bản Cáo bạch \u0026 Huy động Vốn Trái phiếu Xanh (Green Bond Prospectus \u0026 Issuance)"],[],["BƯỚC 2","Trung tâm Lưu ký Chốt Danh sách Trái chủ Hưởng lãi (Record Date \u0026 Ownership Snapshot)"],[],["BƯỚC 3","Bên Phát hành Nộp Tiền Lãi \u0026 Quyết toán Ghi có Tự động (Coupon Funding \u0026 Account Credit)"]],[["• Chung tu \u0026 Kenh: Solaria Clean Energy -\u003e Tổ hợp Ngân hàng Đầu tư Bảo lãnh Phát hành -\u003e Sàn LSE","• Nghiep vu thuc thi: Công bố Cáo bạch phát hành 200 triệu USD trái phiếu xanh lãi suất 5,4%/năm; đăng ký mã định danh ISIN US83416LAA92; giải ngân vốn vào dự án điện gió ngoài khơi Dogger Bank (70%) và pin lưu trữ BESS (30%)","• Ket qua \u0026 Kiem soat: Bản Cáo bạch Trái phiếu Xanh (Offering Prospectus) + Khung Tài chính Xanh ICMA Green Bond Framework"],["➔"],["• Chung tu \u0026 Kenh: Hệ thống Lưu ký Chứng khoán Euroclear Brussels \u0026 Depository Trust Company (DTC)","• Nghiep vu thuc thi: Đến chu kỳ trả lãi nửa năm; Euroclear phát hành thông báo ngày 25/10; thực hiện quét chụp dữ liệu chốt quyền sở hữu (Record Date Cut-off) vào 17:00 ngày 01/11; xác nhận Vanguard Nordic sở hữu 12.500 trái phiếu","• Ket qua \u0026 Kiem soat: Bản Chốt Quyền Hưởng Lãi Trái phiếu (Holder Entitlement Register) + Tỷ lệ Coupon $27.00/trái phiếu"],["➔"],["• Chung tu \u0026 Kenh: Tài khoản Thanh toán Ngân hàng Solaria -\u003e Tài khoản Tiền mặt Thành viên Euroclear","• Nghiep vu thuc thi: Solaria chuyển tổng tiền lãi coupon vào tài khoản chỉ định của Euroclear; hệ thống thanh toán bù trừ tự động phân bổ 337.500 USD (miễn thuế khấu trừ) vào tài khoản thanh toán tiền mặt của Vanguard Nordic ngày 15/11","• Ket qua \u0026 Kiem soat: Điện Xác nhận Thanh toán Tiền lãi Coupon (Credit Advice) + Báo cáo Tiến độ Giải ngân Dự án Xanh"]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["STEP 1","GREEN BOND PROSPECTUS ISSUANCE \u0026 CAPITAL ALLOCATION"],[],["STEP 2","DEPOSITORY RECORD DATE SNAPSHOT \u0026 ENTITLEMENT AUDIT"],[],["STEP 3","COUPON FUNDING, TAX CLEARANCE \u0026 AUTOMATED DISBURSEMENT"]],[["• Documents \u0026 Channels: • Documents \u0026 Channels: Solaria Clean Energy -\u003e Investment Bank Underwriters -\u003e LSE / DTC","• Core Business Execution: • Core Business Execution: Issue $200.0M in 5.40% senior green notes under ISIN US83416LAA92; earmark proceeds exclusively to Dogger Bank Offshore Wind (70%) and Yorkshire grid-scale BESS (30%).","• Key Deliverable \u0026 Control: • Key Deliverable \u0026 Control: Offering Prospectus + Third-Party Verified ICMA Green Financing Framework"],["➔"],["• Documents \u0026 Channels: • Documents \u0026 Channels: Euroclear Corporate Actions Division \u0026 Registered Custodians","• Core Business Execution: • Core Business Execution: Broadcast corporate action notice on Oct 25; execute electronic ownership snapshot at 5:00 PM GMT on Nov 1 (Record Date); confirm Vanguard Nordic\u0027s 12,500 note entitlement.","• Key Deliverable \u0026 Control: • Key Deliverable \u0026 Control: Verified Holder Entitlement Snapshot + Fixed Coupon Factor of $27.00/note"],["➔"],["• Documents \u0026 Channels: • Documents \u0026 Channels: Solaria Debt Service Account -\u003e Euroclear Cash Settlement System","• Core Business Execution: • Core Business Execution: Solaria funds total debt service; Euroclear validates 0.0% cross-border tax treaty exemption and credits $337,500.00 net interest into Vanguard Nordic\u0027s depository cash account on Nov 15.","• Key Deliverable \u0026 Control: • Key Deliverable \u0026 Control: Electronic Coupon Payment Credit Advice + Annual Green Impact Report"]]],"t":"table"},"4.2. Tư duy Phân tích Nghiệp vụ Trái phiếu \u0026 Thị trường Vốn (Bản Tiếng Việt)","• Bức tranh Toàn cảnh Thị trường Trái phiếu Xanh (End-to-End Flow): Một đợt phát hành và thanh toán nợ trái phiếu quốc tế vận hành qua 3 luồng: (1) Luồng Pháp lý \u0026 Huy động Vốn (Capital Underwriting \u0026 Green Covenant): Doanh nghiệp năng lượng phối hợp với ngân hàng đầu tư định giá trái phiếu, tuân thủ nghiêm ngặt Khung Trái phiếu Xanh của ICMA (tiền thu được chỉ được tài trợ điện gió và pin lưu trữ); (2) Luồng Lưu ký \u0026 Chốt Quyền Sở hữu Điện tử (Depository \u0026 Corporate Action Lifecycle): Trái phiếu hiện đại không dùng chứng chỉ giấy mà lưu ký 100% dạng số tại Euroclear/DTC; để trả lãi, trung tâm lưu ký vận hành cơ chế \u0027Record Date\u0027 chốt danh sách người nắm giữ tại một thời khắc cố định, giúp bảo đảm tính chính xác khi trái phiếu được mua đi bán lại liên tục trên thị trường thứ cấp; (3) Luồng Dịch vụ Thanh toán Nợ \u0026 Miễn trừ Thuế Quốc tế (Debt Servicing \u0026 Treaty Exemption): Doanh nghiệp chuyển tiền cho cơ quan lưu ký; hệ thống tự động kiểm tra mã số thuế của các quỹ đầu tư tổ chức nước ngoài theo Hiệp định tránh đánh thuế hai lần để giải ngân đúng 100% tiền lãi thực nhận vào ngày thanh toán định kỳ.","• Điểm nghẽn \u0026 Rủi ro Vận hành Thực tế (Core Bottleneck \u0026 Risk): Rủi ro Gian lận Gắn nhãn Xanh (Greenwashing Risk) và Rủi ro Bất đồng bộ Giao dịch Không Hưởng Quyền (Ex-Dividend / Ex-Interest Trading Risk). Nếu doanh nghiệp không thể chứng minh tiền bán trái phiếu được đưa vào đúng dự án điện gió mà dùng tạm để bù đắp chi phí vận hành chung, xếp hạng ESG sẽ bị tụt dốc thảm hại, kích hoạt điều khoản mua lại bắt buộc. Mặt khác, nếu nhà đầu tư mua trái phiếu vào đúng ngày Ex-Interest (31/10) nhưng hệ thống bù trừ của ngân hàng giám sát bị trễ lệnh, quỹ đầu tư sẽ mất quyền nhận khoản lãi coupon nửa năm.","• 3 Giải pháp Thiết kế Hệ thống \u0026 Phân tích Nghiệp vụ (BA Solutions):","(1) Hệ thống Truy vết Vốn Xanh Trên Sổ cái Phân tán (Green Proceeds Segregation Ledger): Thiết lập tài khoản ký quỹ chuyên biệt (Escrow Sub-account) trên hệ thống ERP Tài chính, chỉ cho phép giải ngân tiền khi có chứng từ nghiệm thu lắp đặt tua-bin điện gió từ kỹ sư trưởng độc lập, tự động sinh báo cáo kiểm toán xanh chuẩn ICMA.","(2) Tự động hóa Lịch Hoạt động Doanh nghiệp \u0026 Chốt Quyền Coupon (Automated Corporate Action Calendar Engine): Xây dựng module tích hợp chuẩn tin điện tài chính SWIFT ISO 20022 (MT564/MT566) kết nối trực tiếp với Euroclear để tự động đồng bộ ngày Ex-Date, Record Date và Pay Date, loại bỏ hoàn toàn việc theo dõi thủ công.","(3) Công cụ Quản lý Thuế Khấu trừ Xuyên Biên giới (Cross-Border Withholding Tax Optimizer): Tự động đối soát biểu mẫu khai báo thuế W-8BEN-E của các quỹ đầu tư tổ chức, tự động áp mức khấu trừ 0% đối với các quốc gia có hiệp định thuế song phương, tối ưu hóa dòng tiền lãi ròng cho khách hàng.","4.3. Business Analyst \u0026 Fixed-Income Systems Executive Summary (Bản Tiếng Anh)","• End-to-End Fixed-Income Debt Servicing Context: The lifecycle of international corporate green bonds integrates three core domains: (1) Underwriting \u0026 ESG Framework Governance: Solaria structures a $200M note offering strictly bound by ICMA Green Bond Principles, restricting capital allocation to verifiable renewable assets; (2) Dematerialized Clearing \u0026 Corporate Action Automation: Euroclear maintains digital central ownership; the corporate actions engine executes automated ownership snapshots on the Record Date, neutralizing secondary trading settlement volatility; (3) Cross-Border Debt Servicing \u0026 Tax Clearance: The issuer transmits coupon liquidity to the clearing house, which cross-checks double taxation treaties to credit gross coupon funds without withholding tax drag.","• Core Operational Bottleneck \u0026 Risk: Greenwashing Liability and Settlement Timing Discrepancies. Inability to empirically audit green capital expenditures triggers severe ESG downgrades and covenant acceleration clauses. Furthermore, trade mismatches occurring between Ex-Interest and Record Dates risk erroneous coupon misallocation across custodian nominee accounts.","• Key BA \u0026 Fixed-Income System Architecture Solutions:","(1) Algorithmic Green Proceeds Tracking Ledger: Deploy an automated ERP fund-segregation architecture where green capital drawdowns require cryptographically signed engineering completion certificates prior to milestone release.","(2) ISO 20022 Corporate Action Messaging Gateway: Implement automated SWIFT MT564/MT566 and modern ISO 20022 XML parsing to seamlessly capture depository entitlement records and automate post-trade coupon reconciliations.","(3) Automated Treaty Tax Clearance Engine: Integrate a global withholding tax verification module that pre-validates institutional tax status (e.g., Form W-8BEN-E), enforcing automated 0% tax withholding for eligible treaty jurisdictions.","4.4. Tam giác Liên kết Nhận thức Đa chiều (Multi-Perspective Contextual Anchoring)","1. Lăng kính Viễn thông \u0026 Tài chính Bền vững Viettel: Bài toán nghiên cứu phát hành Trái phiếu Xanh (Green Bonds) để tài trợ chuyển đổi các trạm phát sóng BTS sang sử dụng pin năng lượng mặt trời và làm mát tự nhiên tiết kiệm điện. Việc xây dựng Khung tài chính xanh minh bạch và quản lý kỳ trả lãi coupon qua ngân hàng lưu ký giúp Tập đoàn thu hút nguồn vốn quốc tế chi phí thấp từ các quỹ đầu tư ESG toàn cầu.","2. Lăng kính Quản trị Trường Mầm non Ước Mơ Xanh (cô Thu Huyền): Bài toán huy động \u0027Trái phiếu phụ huynh\u0027 xây dựng nông trại sinh thái mầm non ngoài trời: Nhà trường phát hành phiếu cam kết hoàn vốn trong 3 năm, định kỳ 6 tháng một lần chi trả lợi tức tượng trưng bằng việc giảm trừ học phí hoặc tặng voucher nông sản sạch cho gia đình các bé, giúp trường vừa có vốn đầu tư vừa gắn kết chặt chẽ với phụ huynh.","3. Lăng kính Bàn học Gia đình (Kèm cặp học sinh Lớp 5 - Bé Hà Ngân): Bài học \u0027Chiếc phiếu nợ kỳ hạn của bố\u0027: Hà Ngân cho bố vay 200.000 đồng tiền thưởng đạt học sinh giỏi để mua giá sách mới; bố viết một tấm giấy \u0027Trái phiếu gia đình\u0027 cam kết đúng ngày 15 hàng tháng sẽ trả lãi cho Hà Ngân 10.000 đồng tiền mua bút màu và sau 1 năm sẽ hoàn trả lại đủ 200.000 đồng tiền gốc, giúp con hiểu rõ bản chất của tiền lãi định kỳ (coupon) và tiền gốc đáo hạn (principal).","PHẦN 5: BẢNG TỪ VỰNG \u0026 CẤU TRÚC CỐT LÕI (8 THUẬT NGỮ TRÁI PHIẾU \u0026 THU NHẬP CỐ ĐỊNH)","1. coupon rate (n phr)  /ˈkuːpɑːn reɪt/  = nominal interest rate / stated annual bond yield / fixed interest factor","Nghia: Lãi suất coupon (lãi suất danh nghĩa hàng năm ghi trên trái phiếu)","Vd: The green notes carry a fixed annual coupon rate of 5.40 percent. - Các trái phiếu xanh áp dụng mức lãi suất coupon cố định hàng năm là 5,40%.","2. maturity date (n phr)  /məˈtʃʊrəti deɪt/  = redemption date / principal repayment date / expiration date of debt","Nghia: Ngày đáo hạn (thời điểm bên phát hành phải hoàn trả toàn bộ vốn gốc)","Vd: The corporate bonds will reach their maturity date on November 15, 2030. - Các trái phiếu doanh nghiệp sẽ đến ngày đáo hạn vào ngày 15 tháng 11 năm 2030.","3. record date (n phr)  /ˈrekərd deɪt/  = entitlement cut-off date / official register closing date for dividend or coupon","Nghia: Ngày đăng ký cuối cùng / Ngày chốt danh sách người sở hữu hưởng quyền","Vd: Investors registered as bondholders on the record date will receive the interest payment. - Các nhà đầu tư được đăng ký là người sở hữu trái phiếu vào ngày chốt quyền sẽ nhận được khoản thanh toán tiền lãi.","4. use of proceeds (n phr)  /juːs əv ˈproʊsiːdz/  = fund allocation / capital deployment objective / utilization of raised capital","Nghia: Mục đích sử dụng số tiền thu được (từ đợt phát hành chứng khoán)","Vd: The use of proceeds is strictly restricted to eligible wind turbine installations. - Mục đích sử dụng tiền thu được bị giới hạn nghiêm ngặt cho việc lắp đặt các tua-bin điện gió hợp lệ.","5. senior unsecured note (n phr)  /ˈsiːniər ˌʌnsɪˈkjʊrd noʊt/  = unsubordinated debt security without asset collateral backing","Nghia: Trái phiếu ưu tiên không có tài sản bảo đảm (được ưu tiên thanh toán trước nợ thứ cấp khi phá sản)","Vd: Solaria successfully placed $200 million of senior unsecured green notes. - Solaria đã phát hành thành công 200 triệu USD trái phiếu xanh ưu tiên không có tài sản bảo đảm.","6. central securities depository (n phr)  /ˈsentrəl sɪˈkjʊrətiz dɪˈpɑːzətɔːri/  = securities clearing house / book-entry registry / custody facility","Nghia: Trung tâm lưu ký chứng khoán (tổ chức lưu ký và thanh toán bù trừ chứng khoán tập trung)","Vd: All debt securities are held in registered electronic book-entry form at Euroclear. - Toàn bộ chứng khoán nợ được lưu ký dưới dạng ghi sổ điện tử đăng ký tại Euroclear.","7. withholding tax (n phr)  /wɪðˈhoʊldɪŋ tæks/  = tax deducted at source / retention tax on cross-border payments","Nghia: Thuế khấu trừ tại nguồn (khoản thuế bị trừ trực tiếp từ tiền lãi chuyển ra nước ngoài)","Vd: Cross-border coupon disbursements were exempt from local withholding tax under the treaty. - Các khoản chi trả lãi coupon xuyên biên giới được miễn thuế khấu trừ tại nguồn theo hiệp ước.","8. ex-interest date (n phr)  /eks ˈɪntrəst deɪt/  = ex-dividend trading cut-off / trading date without right to upcoming interest","Nghia: Ngày giao dịch không hưởng lãi (ngày mà người mua trái phiếu sẽ không được nhận đợt lãi sắp tới)","Vd: Bonds purchased on or after the ex-interest date do not include the pending coupon payment. - Trái phiếu mua vào hoặc sau ngày giao dịch không hưởng lãi sẽ không bao gồm khoản thanh toán lãi sắp tới.","==================================================================================================","BÀI 4: Thương vụ Mua bán \u0026 Sáp nhập Doanh nghiệp (M\u0026A Press Release), Báo cáo Thẩm định Tài chính (Financial Due Diligence) \u0026 Thông báo Lựa chọn Thanh toán Hoán đổi Cổ phiếu - Tiền mặt (Cash-and-Stock Merger Election) (Questions 196-200 - Triple Passage)","Nguồn: ETS TOEIC Part 7 — Triple Passage (M\u0026A Press Release, Financial Due Diligence Summary \u0026 Shareholder Merger Election Notice)","PHẦN 1: NỘI DUNG BÀI ĐỌC, CÂU HỎI \u0026 BẢN DỊCH SONG NGỮ","1.1. Đề thi Tiếng Anh gốc (Strategy Guide \u0026 Original ETS Passages)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","Questions 196-200 refer to the following press release, due diligence excerpt, and shareholder notice.","[Passage 1: Joint Press Release — AeroNet Systems \u0026 CognitiveFlow AI]","AERONET SYSTEMS TO ACQUIRE COGNITIVEFLOW AI FOR $640 MILLION IN CASH-AND-STOCK TRANSACTION","Transaction Accelerates Enterprise Cloud Automation and Generative RPA Capabilities","SAN JOSE, CA \u0026 AUSTIN, TX — October 18","AeroNet Systems Corporation (NYSE: ANS) and CognitiveFlow AI Inc. (NASDAQ: CGFL) today announced that they have entered into a definitive merger agreement under which AeroNet will acquire CognitiveFlow in a transaction valued at approximately $640 million in enterprise value.","The agreed offer price represents a 32% premium over CognitiveFlow\u0027s 30-day volume-weighted average trading price. The acquisition combines AeroNet\u0027s global cloud computing infrastructure with CognitiveFlow\u0027s proprietary autonomous robotic process automation (RPA) engines. AeroNet projects that the business combination will generate approximately $35 million in annualized pre-tax cost synergies within 18 months post-closing through corporate overhead streamlining and consolidated data center operations.","The transaction has been unanimously approved by the Boards of Directors of both corporations and is anticipated to close in the first quarter of 2026, subject to customary closing conditions, including clearance under the Hart-Scott-Rodino (HSR) Antitrust Improvements Act and the affirmative vote of CognitiveFlow shareholders.","[Passage 2: Financial Due Diligence Executive Summary — Morgan Stanley M\u0026A Advisory]","PROJECT CYCLONE: FINANCIAL \u0026 QUALITY OF EARNINGS (QoE) DUE DILIGENCE","Client: AeroNet Systems Corporation | Target: CognitiveFlow AI Inc.","Lead Financial Advisor: Morgan Stanley Investment Banking Division","Executive Valuation \u0026 Financial Profile:","• Trailing Twelve Months (TTM) Annual Recurring Revenue (ARR): $80.0 million (34% YoY growth)","• Subscription Gross Margin: 85.2% (driven by multi-tenant SaaS architecture)","• Enterprise Value to ARR Multiple (EV/ARR): 8.0x based on the $640 million transaction value","• Funded Long-Term Debt: $0.0 million (Clean debt-free balance sheet; $28.5 million in unrestricted cash reserves acquired at closing)","Quality of Earnings Adjustments:","Reported TTM operating losses of $4.2 million were adjusted for $4.5 million in non-recurring legal defense fees associated with a settled intellectual property patent dispute with a former competitor. Pro-forma adjusted EBITDA stands at positive $1.8 million.","Preliminary Purchase Price Allocation:","• Identified Intellectual Property \u0026 Algorithms: $420.0 million (useful life of 7 years)","• Customer Relationship Intangibles: $65.0 million (useful life of 10 years)","• Residual Goodwill: $140.0 million (reflecting workforce talent and future platform synergies)","[Passage 3: Merger Consideration Election Notice — Computershare Exchange Agency]","COMPUTERSHARE TRUST COMPANY, N.A. — CORPORATE ACTIONS DIVISION","Notice of Election to Former Shareholders of CognitiveFlow AI Inc. (ISIN: US19247A1043)","Election Deadline: December 5 at 5:00 PM Eastern Standard Time","To Registered Holders of CognitiveFlow AI Common Stock:","Pursuant to the Merger Agreement, registered stockholders as of the November 10 record date may elect to receive one of the following forms of merger consideration for each share of CognitiveFlow common stock held:","• Option 1 (All-Cash Election): Receive $32.00 in cash, without interest, per share.","• Option 2 (All-Stock Election): Receive 0.80 share of newly issued AeroNet Systems common stock per share (fixed exchange ratio based on AeroNet\u0027s benchmark price of $40.00).","• Option 3 (Standard Mixed Consideration - Default): Receive $20.80 in cash (65%) plus 0.28 share of AeroNet common stock (35%) per share.","Illustrative Example for a 5,000-Share Holding:","Under Option 1: 5,000 shares x $32.00 = $160,000.00 gross cash proceeds.","Under Option 3: 5,000 shares = $104,000.00 in cash + 1,400 shares of AeroNet common stock.","Note: If no election form is submitted by December 5, shares will automatically be exchanged under Option 3 (Standard Mixed Consideration). Executive management shares are subject to a mandatory 90-day post-closing lock-up agreement.","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","196. What is a primary strategic motivation for AeroNet\u0027s acquisition of CognitiveFlow?","(A) To enter the retail hardware manufacturing industry","(B) To integrate robotic process automation into its cloud infrastructure","(C) To assume control of physical retail storefronts across North America","(D) To liquidate CognitiveFlow\u0027s assets to repay maturing corporate loans","197. According to the financial due diligence report, what was CognitiveFlow\u0027s Annual Recurring Revenue (ARR)?","(A) $1.8 million","(B) $28.5 million","(C) $35.0 million","(D) $80.0 million","198. What regulatory clearance must be granted prior to completing the merger?","(A) Hart-Scott-Rodino (HSR) antitrust clearance","(B) European Central Bank monetary clearance","(C) Federal Communications Commission broadcast licensing","(D) International Maritime Organization shipping certification","199. If a shareholder owning 5,000 CognitiveFlow shares selects Option 1, what amount will they receive?","(A) $32,000.00","(B) $104,000.00","(C) $160,000.00","(D) $640,000.00","200. What will happen to shareholders who do not submit an election form by December 5?","(A) Their shares will be permanently canceled without compensation.","(B) They will automatically
