u0026 BẢN DỊCH SONG NGỮ","1.1. Đề thi Tiếng Anh gốc (Strategy Guide \u0026 Original ETS Passages)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","Questions 191-195 refer to the following proxy notice, voting certification, and shareholder letter.","[Passage 1: Annual Meeting Proxy Statement Excerpt — BioVanguard Pharmaceuticals]","BIOVANGUARD PHARMACEUTICALS INC. (NASDAQ: BVPH)","Notice of Annual General Meeting of Shareholders \u0026 Proxy Statement Summary","Meeting Date: June 20 at 10:00 AM EDT | Virtual Meeting Webcast: www.virtualshareholdermeeting.com/BVPH2026","Record Date for Voting Entitlement: May 1","To Our Shareholders:","You are cordially invited to attend and vote on the following formal management proposals:","• Proposal 1: Re-election of three Class II Directors (Dr. Elena Rostova, Marcus Sterling, and David Chen) to serve three-year terms.","• Proposal 2: Ratification of Ernst \u0026 Young LLP as the company\u0027s independent registered public accounting firm for fiscal 2026.","• Proposal 3: Approval of the Amended and Restated 2026 Equity Incentive Plan reserving 2,500,000 common shares for key scientific and executive talent retention.","• Proposal 4: Authorization to issue up to 1,000,000 shares of Series A Cumulative Convertible Preferred Stock ($50.00 par value, aggregate capital raise of $50,000,000) to fund multi-center Phase 3 clinical trials for oncology drug candidate BV-409. The preferred stock carries a 6.0% annual cash dividend and is convertible into common stock at a Conversion Price of $40.00 per common share (representing a Conversion Ratio of 1.25 common shares per preferred share).","Approval Threshold: Proposals 1, 2, and 3 require a simple majority of votes cast. Proposal 4 constitutes an amendment to the Certificate of Incorporation and mandates an affirmative supermajority of at least 66.7% of votes cast.","[Passage 2: Certified Voting Results — Independent Inspector of Election]","FIRST AMERICAN ELECTION SERVICES LLC — INDEPENDENT INSPECTORS REPORT","Client: BioVanguard Pharmaceuticals Inc. | Annual General Meeting of Shareholders: June 20","Quorum \u0026 Attendance Certification:","• Total Common Shares Outstanding as of May 1 Record Date: 40,000,000 shares","• Total Shares Represented in Person or by Proxy: 34,200,000 shares (85.5% Quorum Achieved)","Official Tabulation of Shareholder Votes Cast:","Proposal 1 (Director Elections):","• Votes For: 32,216,400 (94.2%) | Votes Withheld: 1,983,600 (5.8%) -\u003e CARRIED","Proposal 2 (Auditor Ratification):","• Votes For: 33,721,200 (98.6%) | Votes Against: 478,800 (1.4%) -\u003e CARRIED","Proposal 3 (Equity Incentive Plan Amendment):","• Votes For: 26,812,800 (78.4%) | Votes Against: 6,840,000 (20.0%) | Abstentions: 547,200 (1.6%) -\u003e CARRIED","Proposal 4 (Series A Convertible Preferred Stock Authorization):","• Votes For: 30,232,800 (88.4%)","• Votes Against: 3,625,200 (10.6%)","• Abstentions: 342,000 (1.0%)","• Status: CARRIED (Exceeded mandatory 66.7% supermajority threshold by 21.7 percentage points)","Certified this 20th day of June by Sarah Jenkins, Lead Inspector of Election.","[Passage 3: Post-AGM Shareholder Update Letter — Office of the Chief Executive]","BIOVANGUARD PHARMACEUTICALS INC.","Shareholder Update: Execution of Series A Preferred Financing Agreement","Date: July 5 | To Our Global Shareholders:","Following the decisive 88.4% shareholder approval of Proposal 4 at our June 20 Annual General Meeting, BioVanguard has executed a definitive securities purchase agreement with life-sciences specialist investment fund OrbiMed Capital.","Key Highlights of the Closed Private Placement:","• Gross Equity Proceeds: $50,000,000 received in full on July 1 through the issuance of 1,000,000 Series A Convertible Preferred Shares.","• Conversion Privilege: The preferred shares may be converted into 1,250,000 common shares at the holder\u0027s option anytime after January 1, 2027, or automatically converted by the company if our common stock trades at or above $48.00 (a 20% premium over the $40.00 conversion price) for twenty consecutive trading days.","• Capital Deployment: Funds have been immediately allocated to open twenty-five specialized medical research centers across the United States and Europe for the Phase 3 clinical evaluation of BV-409.","We thank our shareholders for their resolute confidence in our therapeutic pipeline.","Sincerely,","Dr. Aris Thorne, Chief Executive Officer \u0026 Chairman","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","191. What was the main purpose of Proposal 4 voted on at BioVanguard\u0027s annual meeting?","(A) To replace Ernst \u0026 Young as independent accounting auditors","(B) To approve executive golden parachute termination bonuses","(C) To authorize convertible preferred stock to fund Phase 3 drug trials","(D) To spin off the company\u0027s oncology division into an independent entity","192. What minimum voting threshold was required for Proposal 4 to pass?","(A) 50.1% simple majority","(B) 66.7% supermajority","(C) 75.0% three-quarters majority","(D) 85.5% quorum majority","193. In Passage 1, paragraph 3, the word \u0027amended\u0027 is closest in meaning to","(A) canceled","(B) modified","(C) duplicated","(D) audited","194. How many common shares will OrbiMed Capital receive if all 1,000,000 preferred shares are converted?","(A) 1,000,000 shares","(B) 1,250,000 shares","(C) 2,500,000 shares","(D) 40,000,000 shares","195. What is indicated about the shareholder voting results in Passage 2?","(A) Proposal 3 received the highest percentage of affirmative votes.","(B) Less than half of the outstanding common shares were represented.","(C) All four management proposals on the agenda were successfully carried.","(D) Dr. Elena Rostova failed to win re-election as a Class II director.","1.2. Hướng dẫn làm bài Part 7","CHIẾN THUẬT 5 PHÚT TỐI ƯU: NẮM BẮT BỐI CẢNH, GHÉP NỐI DỮ KIỆN \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Luồng sự việc (Quỹ đạo Quét chữ Z \u0026 3 Câu hỏi Tiềm thức): • Văn bản 1 (Thông báo Họp ĐHĐCĐ \u0026 Phiếu Ủy quyền): ĐHĐCĐ ngày 20/06; Đề xuất 4: Phát hành 1 triệu cổ phiếu ưu đãi chuyển đổi Series A ($50/cổ phiếu = huy động $50M) tài trợ thử nghiệm lâm sàng giai đoạn 3 thuốc ung thư BV-409; tỷ lệ chuyển đổi 1.25 cổ phiếu phổ thông (giá chuyển đổi $40); yêu cầu tỷ lệ biểu quyết đa số đặc biệt tối thiểu 66.7%.","• Văn bản 2 (Biên bản Kiểm phiếu Chính thức): Tỷ lệ tham dự 85.5% (34.2M/40M cổ phiếu); Đề xuất 4 được thông qua với 88.4% tán thành (vượt xa ngưỡng 66.7%); cả 4 tờ trình đều được thông qua (CARRIED).","• Văn bản 3 (Thư Cập nhật của CEO): Công ty đã ký thỏa thuận bán 1 triệu cổ phiếu ưu đãi cho Quỹ OrbiMed Capital thu về đủ $50M; nếu chuyển đổi sẽ đổi thành 1,250,000 cổ phiếu phổ thông; giải ngân ngay cho 25 trung tâm nghiên cứu.","=\u003e Luồng sự việc: Tờ trình ĐHĐCĐ xin phát hành cổ phiếu ưu đãi chuyển đổi $50M -\u003e Cổ đông biểu quyết thông qua 88.4% -\u003e Công ty phát hành thành công cho quỹ đầu tư và giải ngân vốn.","Bước 2 (20 giây) - Quét nhanh 5 câu hỏi \u0026 Gắn móc từ khóa: • Câu 191: Mục đích chính của Đề xuất 4 (Từ khóa: main purpose, Proposal 4).","• Câu 192: Tỷ lệ biểu quyết tối thiểu để Đề xuất 4 được thông qua (Từ khóa: minimum voting threshold, Proposal 4).","• Câu 193: Từ \u0027amended\u0027 gần nghĩa nhất với từ nào (Từ khóa: amended closest in meaning).","• Câu 194: 1 triệu cổ phiếu ưu đãi chuyển đổi thành bao nhiêu cổ phiếu phổ thông (Từ khóa: how many common shares, 1,000,000 preferred shares converted).","• Câu 195: Điều gì đúng về kết quả biểu quyết cổ đông ở Văn bản 2 (Từ khóa: indicated about shareholder voting results, Passage 2).","Bước 3 (3 phút 45 giây) - Giải cuốn chiếu \u0026 Khóa đáp án: • Câu 191 (Chi tiết - VB1 Đề xuất 4): \u0027Authorization to issue up to 1,000,000 shares of Series A Cumulative Convertible Preferred Stock... to fund multi-center Phase 3 clinical trials for oncology drug candidate BV-409\u0027 -\u003e Chọn (C).","• Câu 192 (Chi tiết - VB1 dòng cuối): \u0027mandates an affirmative supermajority of at least 66.7% of votes cast\u0027 -\u003e Chọn (B) 66.7% đa số đặc biệt.","• Câu 193 (Từ vựng ngữ cảnh - VB1): \u0027Amended and Restated Plan\u0027 = kế hoạch đã được sửa đổi, bổ sung cập nhật -\u003e Chọn (B) modified.","• Câu 194 (Ghép nối \u0026 Phép nhân - VB1 \u0026 VB3): Tỷ lệ 1.25 x 1,000,000 = 1,250,000 cổ phiếu phổ thông (VB3 nêu rõ: \u0027converted into 1,250,000 common shares\u0027) -\u003e Chọn (B).","• Câu 195 (Chi tiết - Bảng VB2): Cả 4 đề xuất đều ghi chữ \u0027CARRIED\u0027 (được thông qua) -\u003e Chọn (C) All four management proposals were successfully carried.","Bước 4 (25 giây) - Rà soát \u0026 Đúc kết Feynman: Tự đúc kết 1 câu: Đại hội cổ đông đã bỏ phiếu áp đảo 88.4% cho phép phát hành 50 triệu USD cổ phiếu ưu đãi chuyển đổi, trao cho quỹ đầu tư quyền đổi lấy 1.25 triệu cổ phiếu phổ thông khi thuốc ung thư thử nghiệm thành công.","1.3. Dịch Song ngữ Xen kẽ Từng Câu (Sentence-by-Sentence Translation)","[Văn bản 1: Thông báo Họp ĐHĐCĐ \u0026 Tóm tắt Tờ trình Biểu quyết — Dược phẩm BioVanguard]","BIOVANGUARD PHARMACEUTICALS INC. (NASDAQ: BVPH)","Notice of Annual General Meeting of Shareholders \u0026 Proxy Statement Summary","Meeting Date: June 20 at 10:00 AM EDT | Record Date: May 1","CÔNG TY DƯỢC PHẨM BIOVANGUARD (MÃ NIÊM YẾT NASDAQ: BVPH)","Thông báo Họp Đại hội đồng Cổ đông Thường niên \u0026 Tóm tắt Tờ trình Biểu quyết Ủy quyền","Ngày Họp: 20 Tháng 6 lúc 10:00 sáng EDT | Ngày Chốt Danh sách Cổ đông: 1 Tháng 5","Proposal 1: Re-election of three Class II Directors (Dr. Elena Rostova, Marcus Sterling, and David Chen) to serve three-year terms.","Đề xuất 1: Tái đắc cử ba Thành viên Hội đồng Quản trị Nhóm II (Tiến sĩ Elena Rostova, Marcus Sterling và David Chen) với nhiệm kỳ ba năm.","Proposal 2: Ratification of Ernst \u0026 Young LLP as the company\u0027s independent registered public accounting firm for fiscal 2026.","Đề xuất 2: Phê chuẩn Ernst \u0026 Young LLP làm công ty kiểm toán độc lập đã đăng ký của công ty cho năm tài chính 2026.","Proposal 3: Approval of the Amended and Restated 2026 Equity Incentive Plan reserving 2,500,000 common shares for employee retention.","Đề xuất 3: Thông qua Kế hoạch Ưu đãi Cổ phần 2026 Sửa đổi và Tái lập, dành riêng 2.500.000 cổ phần phổ thông để giữ chân nhân tài khoa học và điều hành.","Proposal 4: Authorization to issue up to 1,000,000 shares of Series A Cumulative Convertible Preferred Stock ($50.00 par value, aggregate capital raise of $50,000,000) to fund multi-center Phase 3 clinical trials for oncology drug candidate BV-409.","Đề xuất 4: Ủy quyền phát hành tối đa 1.000.000 cổ phiếu Ưu đãi Chuyển đổi Tích lũy Series A (mệnh giá 50,00 USD, tổng quy mô huy động vốn 50.000.000 USD) để tài trợ cho các thử nghiệm lâm sàng Giai đoạn 3 đa trung tâm đối với ứng viên thuốc ung thư BV-409.","The preferred stock carries a 6.0% annual dividend and is convertible at $40.00 per common share (Conversion Ratio: 1.25).","Cổ phiếu ưu đãi hưởng mức cổ tức hàng năm 6,0% và có thể chuyển đổi ở Mức giá Chuyển đổi 40,00 USD cho mỗi cổ phần phổ thông (Tỷ lệ Chuyển đổi: 1,25 cổ phần phổ thông trên mỗi cổ phiếu ưu đãi).","Proposals 1, 2, and 3 require a simple majority of votes cast. Proposal 4 mandates an affirmative supermajority of at least 66.7% of votes cast.","Các Đề xuất 1, 2 và 3 yêu cầu đa số quá bán số phiếu biểu quyết. Đề xuất 4 bắt buộc phải đạt tỷ lệ đa số đặc biệt tán thành tối thiểu từ 66,7% tổng số phiếu hợp lệ.","[Văn bản 2: Báo cáo Chứng nhận Kết quả Kiểm phiếu — Thanh tra Bầu cử Độc lập]","FIRST AMERICAN ELECTION SERVICES LLC — INDEPENDENT INSPECTORS REPORT","Client: BioVanguard Pharmaceuticals Inc. | Annual General Meeting: June 20","Quorum: 34,200,000 of 40,000,000 shares (85.5% Quorum Achieved).","CÔNG TY DỊCH VỤ BẦU CỬ ĐỆ NHẤT NƯỚC MỸ — BÁO CÁO THANH TRA ĐỘC LẬP","Khách hàng: Công ty Dược phẩm BioVanguard | Đại hội đồng Cổ đông Thường niên: Ngày 20 Tháng 6","Tỷ lệ Tham dự: 34.200.000 trên 40.000.000 cổ phiếu (Đạt 85,5% Túc số Hợp lệ).","Proposal 1 (Director Elections): Votes For: 32,216,400 (94.2%) | Votes Withheld: 1,983,600 (5.8%) -\u003e CARRIED.","Đề xuất 1 (Bầu HĐQT): Phiếu Tán thành: 32.216.400 (94,2%) | Phiếu Không biểu quyết: 1.983.600 (5,8%) -\u003e THÔNG QUA.","Proposal 2 (Auditor Ratification): Votes For: 33,721,200 (98.6%) | Votes Against: 478,800 (1.4%) -\u003e CARRIED.","Đề xuất 2 (Phê chuẩn Kiểm toán): Phiếu Tán thành: 33.721.200 (98,6%) | Phiếu Chống: 478.800 (1,4%) -\u003e THÔNG QUA.","Proposal 3 (Equity Incentive Plan Amendment): Votes For: 26,812,800 (78.4%) | Votes Against: 6,840,000 (20.0%) -\u003e CARRIED.","Đề xuất 3 (Sửa đổi Quỹ Cổ phần Thưởng ESOP): Phiếu Tán thành: 26.812.800 (78,4%) | Phiếu Chống: 6.840.000 (20,0%) -\u003e THÔNG QUA.","Proposal 4 (Series A Preferred Stock): Votes For: 30,232,800 (88.4%) | Votes Against: 3,625,200 (10.6%) -\u003e CARRIED (Exceeded 66.7% supermajority by 21.7%).","Đề xuất 4 (Phát hành Cổ phiếu Ưu đãi Series A): Phiếu Tán thành: 30.232.800 (88,4%) | Phiếu Chống: 3.625.200 (10,6%) -\u003e THÔNG QUA (Vượt ngưỡng đa số đặc biệt 66,7% thêm 21,7 điểm phần trăm).","[Văn bản 3: Thư Thông báo Hoàn tất Vòng Huy động Vốn — Văn phòng Tổng Giám đốc]","BIOVANGUARD PHARMACEUTICALS INC.","Shareholder Update: Execution of Series A Preferred Financing Agreement","Date: July 5 | To Our Global Shareholders:","CÔNG TY DƯỢC PHẨM BIOVANGUARD","Bản tin Cập nhật Cổ đông: Ký kết Hợp đồng Tài trợ Cổ phiếu Ưu đãi Series A","Ngày: 5 Tháng 7 | Kính gửi Quý Cổ đông Toàn cầu:","Following the decisive 88.4% shareholder approval of Proposal 4 at our AGM, BioVanguard has executed a definitive securities purchase agreement with life-sciences specialist fund OrbiMed Capital.","Sau sự phê chuẩn mang tính quyết định với 88,4% phiếu tán thành của cổ đông đối với Đề xuất 4 tại kỳ họp ĐHĐCĐ, BioVanguard đã ký kết hợp đồng mua bán chứng khoán dứt khoát với quỹ đầu tư chuyên ngành khoa học đời sống OrbiMed Capital.","Gross Equity Proceeds: $50,000,000 received in full on July 1 through the issuance of 1,000,000 Series A Convertible Preferred Shares.","Tổng Số tiền Vốn Cổ phần Gộp: 50.000.000 USD đã nhận đầy đủ vào ngày 1 Tháng 7 thông qua việc phát hành 1.000.000 Cổ phiếu Ưu đãi Chuyển đổi Series A.","The preferred shares may be converted into 1,250,000 common shares at the holder\u0027s option anytime after Jan 1, 2027, or automatically converted if common stock trades at or above $48.00 for 20 consecutive trading days.","Các cổ phiếu ưu đãi có thể được chuyển đổi thành 1.250.000 cổ phần phổ thông theo quyền chọn của người nắm giữ vào bất kỳ lúc nào sau ngày 1 Tháng 1 Năm 2027, hoặc tự động chuyển đổi nếu thị giá cổ phần phổ thông giao dịch từ 48,00 USD trở lên trong suốt 20 ngày giao dịch liên tục.","Funds have been immediately allocated to open twenty-five specialized medical research centers for Phase 3 clinical evaluation of BV-409.","Dr. Aris Thorne, CEO \u0026 Chairman","Nguồn vốn đã được phân bổ lập tức để mở hai mươi lăm trung tâm nghiên cứu y khoa chuyên biệt cho cuộc thử nghiệm lâm sàng Giai đoạn 3 của thuốc BV-409.","Tiến sĩ Aris Thorne, Tổng Giám đốc \u0026 Chủ tịch HĐQT","1.4. Dịch chi tiết Câu hỏi \u0026 Phương án Trắc nghiệm","Câu 191. Mục đích chính của Đề xuất 4 được biểu quyết tại đại hội thường niên của BioVanguard là gì?","(A) Thay thế công ty kiểm toán độc lập Ernst \u0026 Young","(B) Phê duyệt các khoản tiền thưởng thôi việc \u0027dù vàng\u0027 cho ban điều hành","(C) Ủy quyền phát hành cổ phiếu ưu đãi chuyển đổi để tài trợ thử nghiệm thuốc Giai đoạn 3","(D) Tách mảng kinh doanh thuốc ung thư của công ty thành một pháp nhân độc lập","Câu 192. Ngưỡng biểu quyết tối thiểu bắt buộc để Đề xuất 4 được thông qua là bao nhiêu?","(A) Đa số giản đơn 50,1%","(B) Đa số đặc biệt 66,7%","(C) Đa số ba phần tư 75,0%","(D) Túc số tham dự tối thiểu 85,5%","Câu 193. Trong Văn bản 1, đoạn 3, từ \u0027amended\u0027 gần nghĩa nhất với từ nào sau đây?","(A) Đã bị hủy bỏ (canceled)","(B) Đã được sửa đổi, bổ sung (modified)","(C) Được nhân bản sao chép (duplicated)","(D) Đã được kiểm toán sổ sách (audited)","Câu 194. Quỹ đầu tư OrbiMed Capital sẽ nhận được bao nhiêu cổ phiếu phổ thông nếu toàn bộ 1.000.000 cổ phiếu ưu đãi được chuyển đổi?","(A) 1.000.000 cổ phiếu","(B) 1.250.000 cổ phiếu","(C) 2.500.000 cổ phiếu","(D) 40.000.000 cổ phiếu","Câu 195. Điều gì được chỉ ra về kết quả biểu quyết của cổ đông trong Văn bản 2?","(A) Đề xuất 3 nhận được tỷ lệ phần trăm phiếu tán thành cao nhất.","(B) Có chưa đến một nửa tổng số cổ phần phổ thông lưu hành tham dự đại hội.","(C) Toàn bộ bốn đề xuất của ban điều hành trong chương trình nghị sự đều được thông qua thành công.","(D) Tiến sĩ Elena Rostova đã không trúng cử vào vị trí thành viên HĐQT Nhóm II.","1.5. Tóm tắt Viết lại Toàn bài theo Feynman (Feynman Monograph Summary)","English Executive Summary:","• AGM Governance \u0026 Capital Proposal: BioVanguard Pharmaceuticals convened its Annual General Meeting requiring shareholder votes on director re-elections, auditor ratification, an amended ESOP plan, and Proposal 4 authorizing 1.0M Series A Convertible Preferred Shares ($50M raise, 6.0% dividend, $40 conversion price) under a 66.7% supermajority requirement.","• Quorum \u0026 Certified Voting Landslide: Independent inspectors certified an 85.5% shareholder quorum (34.2M shares voted), confirming that all four proposals carried, with Proposal 4 securing 88.4% approval (30,232,800 votes For), surpassing the supermajority threshold by 21.7 percentage points.","• Strategic Private Placement Execution: On July 5, CEO Dr. Aris Thorne announced the closing of the $50.0M private placement with OrbiMed Capital, granting the fund conversion rights into 1,250,000 common shares and immediately deploying capital to open 25 Phase 3 oncology trial centers for BV-409.","Bản tóm tắt Tiếng Việt cốt lõi:","• Chương trình Đại hội Cổ đông \u0026 Tờ trình Huy động Vốn: Dược phẩm BioVanguard tổ chức ĐHĐCĐ thường niên lấy ý kiến cổ đông về bầu lại HĐQT, phê chuẩn kiểm toán, sửa đổi quỹ ESOP và Đề xuất 4 ủy quyền phát hành 1 triệu cổ phiếu ưu đãi chuyển đổi Series A (huy động 50 triệu USD, cổ tức 6%, giá chuyển đổi 40 USD) với điều kiện đa số đặc biệt 66,7%.","• Túc số Tham dự \u0026 Thắng lợi Biểu quyết Áp đảo: Thanh tra độc lập xác nhận tỷ lệ tham dự đạt 85,5% (34,2 triệu cổ phiếu) và toàn bộ 4 tờ trình đều được thông qua (CARRIED), trong đó Đề xuất 4 đạt 88,4% tán thành (hơn 30,2 triệu phiếu), vượt ngưỡng yêu cầu 21,7 điểm phần trăm.","• Ký Kết Bán Cổ phần Ưu đãi Cho Quỹ Đầu tư: Ngày 05/07, Tổng Giám đốc Aris Thorne công bố hoàn tất hợp đồng phát hành riêng lẻ 50 triệu USD cho Quỹ OrbiMed Capital, cho phép chuyển đổi thành 1.250.000 cổ phiếu phổ thông và lập tức mở 25 trung tâm nghiên cứu thử nghiệm lâm sàng Giai đoạn 3 cho thuốc ung thư BV-409.","PHẦN 2: ACTIVE RECALL 5 GIÂY (BẢNG MA TRẬN ĐỊNH VỊ SONG NGỮ)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["1. Đối tượng \u0026 Vai trò: BioVanguard Pharmaceuticals (Doanh nghiệp công nghệ sinh học niêm yết NASDAQ tổ chức ĐHĐCĐ) \u003c-\u003e First American Election Services (Thanh tra độc lập kiểm phiếu và xác thực túc số 85.5%) \u003c-\u003e OrbiMed Capital (Quỹ đầu tư chuyên ngành rót 50 triệu USD mua cổ phiếu ưu đãi chuyển đổi).","1. Stakeholders \u0026 Roles: BioVanguard Pharmaceuticals (NASDAQ biotech holding AGM) \u003c-\u003e First American Election Services (Independent inspector verifying 85.5% quorum and vote tallies) \u003c-\u003e OrbiMed Capital (Life-sciences institutional fund investing $50M in convertible preferred stock)."]],[["2. Boi canh \u0026 Quy trinh loi"],["2. Bối cảnh \u0026 Quy trình lõi: Quản trị Doanh nghiệp \u0026 Phát hành Vốn Cổ phần Lai (Corporate Governance \u0026 Hybrid Equity Financing): ĐHĐCĐ biểu quyết tờ trình thay đổi điều lệ công ty (cần đa số đặc biệt 66.7%) -\u003e Kiểm phiếu độc lập xác nhận thông qua với 88.4% -\u003e Ký kết hợp đồng phát hành riêng lẻ (Private Placement) và tài trợ thử nghiệm lâm sàng.","2. Business Context \u0026 Core Flow: Shareholder Governance \u0026 Hybrid Capital Issuance: AGM votes on charter amendment requiring 66.7% supermajority -\u003e Independent tabulation confirms passage at 88.4% -\u003e Company closes $50M institutional private placement funding Phase 3 oncology trials."]],[["3. Dau vet suy luan cheo"],["3. Dấu vết suy luận chéo: Mỗi cổ phiếu ưu đãi $50 chuyển đổi ở giá $40 ra tỷ lệ 1.25 cổ phiếu phổ thông (VB1) -\u003e Quỹ OrbiMed mua 1,000,000 cổ phiếu ưu đãi (VB3) -\u003e Nhân với 1.25 ra đúng 1,250,000 cổ phiếu phổ thông khi thực hiện quyền chuyển đổi.","3. Key Cross-Referencing Clues: $50 preferred converted at $40 yields a 1.25 ratio (Passage 1) -\u003e OrbiMed purchases 1,000,000 preferred shares (Passage 3) -\u003e 1,000,000 x 1.25 equals exactly 1,250,000 common shares upon conversion."]]],"t":"table"},"PHẦN 3: ĐÁP ÁN CHUẨN XÁC \u0026 DẤU VẾT TRUY XUẤT CHÉO (CROSS-REFERENCING \u0026 TRAP BREAKDOWN)","191. What was the main purpose of Proposal 4 voted on at BioVanguard\u0027s annual meeting?","Dap an dung: (C) To authorize convertible preferred stock to fund Phase 3 drug trials","[Dau vet bai doc / Clue]: Văn bản 1, Mục Proposal 4: \u0027Authorization to issue up to 1,000,000 shares of Series A Cumulative Convertible Preferred Stock ($50.00 par value, aggregate capital raise of $50,000,000) to fund multi-center Phase 3 clinical trials for oncology drug candidate BV-409.\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027issue... Convertible Preferred Stock... to fund multi-center Phase 3 clinical trials\u0027 \u003c-\u003e \u0027authorize convertible preferred stock to fund Phase 3 drug trials\u0027","[Loi giai chi tiet]: Tờ trình số 4 xin ý kiến cổ đông về việc ủy quyền phát hành 1 triệu cổ phiếu ưu đãi chuyển đổi Series A trị giá 50 triệu USD để tài trợ cho các cuộc thử nghiệm lâm sàng Giai đoạn 3 của thuốc ung thư BV-409.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) To replace Ernst \u0026 Young as independent accounting auditors","- Ly do sai: Đề xuất 2 là phê chuẩn (ratification) Ernst \u0026 Young tiếp tục làm kiểm toán viên, không phải thay thế.","- Bay ETS: Bẫy Đảo ngược Nội dung Tờ trình (Proposal Reversal Trap)","(B) To approve executive golden parachute termination bonuses","- Ly do sai: Không có đề xuất nào liên quan đến gói thù lao chấm dứt hợp đồng golden parachute.","- Bay ETS: Bẫy Thù lao Lãnh đạo Không Tồn tại (Non-existent Severance Trap)","(D) To spin off the company\u0027s oncology division into an independent entity","- Ly do sai: Đây là phát hành vốn để tự phát triển thuốc, không phải tách mảng kinh doanh (spin-off).","- Bay ETS: Bẫy Chia tách Doanh nghiệp (Corporate Spin-off Trap)","192. What minimum voting threshold was required for Proposal 4 to pass?","Dap an dung: (B) 66.7% supermajority","[Dau vet bai doc / Clue]: Văn bản 1, Dòng Approval Threshold cuối cùng: \u0027Proposal 4 constitutes an amendment to the Certificate of Incorporation and mandates an affirmative supermajority of at least 66.7% of votes cast.\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027affirmative supermajority of at least 66.7%\u0027 \u003c-\u003e \u002766.7% supermajority\u0027","[Loi giai chi tiet]: Vì Đề xuất 4 là việc sửa đổi Điều lệ công ty để tạo loại cổ phiếu mới nên bắt buộc phải đạt tỷ lệ đa số đặc biệt (supermajority) tối thiểu từ 66,7% tổng số phiếu biểu quyết.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) 50.1% simple majority","- Ly do sai: 50.1% (đa số giản đơn) chỉ áp dụng cho các Đề xuất 1, 2 và 3 thông thường.","- Bay ETS: Bẫy Ngưỡng Đa số Giản đơn (Simple Majority Trap)","(C) 75.0% three-quarters majority","- Ly do sai: 75% là con số bịa đặt, điều lệ công ty chỉ quy định mức 66.7% (tương đương 2/3).","- Bay ETS: Bẫy Con số Tỷ lệ Sai lệch (Arbitrary Threshold Trap)","(D) 85.5% quorum majority","- Ly do sai: 85.5% là tỷ lệ túc số cổ đông tham dự đại hội ở Văn bản 2, không phải ngưỡng biểu quyết thông qua tờ trình.","- Bay ETS: Bẫy Nhầm lẫn Túc số Tham dự với Tỷ lệ Biểu quyết (Quorum vs. Approval Trap)","193. In Passage 1, paragraph 3, the word \u0027amended\u0027 is closest in meaning to","Dap an dung: (B) modified","[Dau vet bai doc / Clue]: Văn bản 1, Mục Proposal 3: \u0027Approval of the Amended and Restated 2026 Equity Incentive Plan...\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027amended\u0027 (đã được sửa đổi, bổ sung cập nhật) \u003c-\u003e \u0027modified\u0027 (được điều chỉnh, sửa đổi)","[Loi giai chi tiet]: Trong văn bản quản trị đại hội cổ đông, \u0027Amended Plan\u0027 là kế hoạch đã được chỉnh sửa, sửa đổi (modified) các điều khoản so với phiên bản gốc ban đầu.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) canceled","- Ly do sai: \u0027Canceled\u0027 nghĩa là bị hủy bỏ, trong khi kế hoạch này được cập nhật để trình đại hội thông qua.","- Bay ETS: Bẫy Nghĩa Tiêu cực Đối lập (Opposite Negation Trap)","(C) duplicated","- Ly do sai: \u0027Duplicated\u0027 nghĩa là sao chép y nguyên.","- Bay ETS: Bẫy Sao chép Trùng lặp (Duplication Fallacy)","(D) audited","- Ly do sai: \u0027Audited\u0027 nghĩa là được kiểm toán số liệu tài chính.","- Bay ETS: Bẫy Thuật ngữ Kiểm toán (Auditing Distractor Trap)","194. How many common shares will OrbiMed Capital receive if all 1,000,000 preferred shares are converted?","Dap an dung: (B) 1,250,000 shares","[Dau vet bai doc / Clue]: Văn bản 3, Mục Highlights: \u0027The preferred shares may be converted into 1,250,000 common shares at the holder\u0027s option...\u0027 (Khớp với VB1: 1,000,000 x 1.25 = 1,250,000).","[Dien dat tuong duong / Paraphrase]: • Phép tính hoán đổi: 1,000,000 cổ phiếu ưu đãi x Tỷ lệ chuyển đổi 1.25 = 1,250,000 cổ phiếu phổ thông.","[Loi giai chi tiet]: Theo điều khoản phát hành và thư cập nhật của CEO, 1 triệu cổ phiếu ưu đãi Series A với tỷ lệ chuyển đổi 1.25 sẽ được đổi thành đúng 1.250.000 cổ phần phổ thông.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) 1,000,000 shares","- Ly do sai: 1.000.000 là số lượng cổ phiếu ưu đãi ban đầu nếu tính tỷ lệ 1:1, bỏ quên hệ số chuyển đổi 1.25.","- Bay ETS: Bẫy Tỷ lệ Chuyển đổi 1:1 (Parity Conversion Trap)","(C) 2,500,000 shares","- Ly do sai: 2.500.000 là số lượng cổ phiếu dành cho quỹ ESOP ở Đề xuất 3.","- Bay ETS: Bẫy Lấy nhầm Số lượng Cổ phiếu ESOP (ESOP Pool Trap)","(D) 40,000,000 shares","- Ly do sai: 40.000.000 là tổng số cổ phần phổ thông đang lưu hành của toàn công ty.","- Bay ETS: Bẫy Tổng Cổ phiếu Lưu hành (Total Shares Outstanding Trap)","195. What is indicated about the shareholder voting results in Passage 2?","Dap an dung: (C) All four management proposals on the agenda were successfully carried.","[Dau vet bai doc / Clue]: Văn bản 2, Báo cáo Tabulation: Cả 4 đề xuất đều kết thúc bằng trạng thái \u0027-\u003e CARRIED\u0027.","[Dien dat tuong duong / Paraphrase]: • \u0027Proposal 1 -\u003e CARRIED\u0027, \u0027Proposal 2 -\u003e CARRIED\u0027, \u0027Proposal 3 -\u003e CARRIED\u0027, \u0027Proposal 4 -\u003e CARRIED\u0027 \u003c-\u003e \u0027All four management proposals on the agenda were successfully carried\u0027","[Loi giai chi tiet]: Báo cáo kiểm phiếu của thanh tra độc lập chứng nhận rõ ràng rằng cả 4 tờ trình do ban điều hành đệ trình (Đề xuất 1 đến 4) đều đã được cổ đông biểu quyết thông qua thành công (CARRIED).","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Proposal 3 received the highest percentage of affirmative votes.","- Ly do sai: Đề xuất 2 mới là đề xuất có tỷ lệ tán thành cao nhất (98.6%), trong khi Đề xuất 3 chỉ đạt 78.4% (thấp nhất trong 4 đề xuất).","- Bay ETS: Bẫy Thứ hạng Tỷ lệ Biểu quyết (Rank Order Inversion Trap)","(B) Less than half of the outstanding common shares were represented.","- Ly do sai: Có tới 85.5% số cổ phần tham dự (34.2 triệu / 40 triệu cổ phiếu), vượt xa mức quá bán.","- Bay ETS: Bẫy Mâu thuẫn với Túc số Đại hội (Quorum Contradiction Trap)","(D) Dr. Elena Rostova failed to win re-election as a Class II director.","- Ly do sai: Đề xuất 1 bầu các thành viên HĐQT trong đó có bà Rostova đã được thông qua áp đảo với 94.2% số phiếu tán thành.","- Bay ETS: Bẫy Thất cử Sai sự thật (False Election Failure Trap)","PHẦN 4: KỸ THUẬT FEYNMAN SONG NGỮ \u0026 SƠ ĐỒ QUY TRÌNH (TƯ DUY QUẢN TRỊ CỔ ĐÔNG VÀ HUY ĐỘNG VỐN \u0026 BA)","4.1. Sơ đồ Quy trình Luân chuyển Nghiệp vụ (AGM Proxy Solicitation, Voting \u0026 Capital Closing)","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","Phát hành Bản Công bố Thông tin Ủy quyền \u0026 Tờ trình ĐHĐCĐ (Proxy Statement Filing \u0026 Mailing)"],[],["BƯỚC 2","Kiểm phiếu Độc lập \u0026 Chứng nhận Thông qua Nghị quyết ĐHĐCĐ (Inspector Tabulation \u0026 Certification)"],[],["BƯỚC 3","Ký Hợp đồng Phát hành Riêng lẻ \u0026 Giải ngân Vốn Nghiên cứu (Private Placement Execution \u0026 Funding)"]],[["• Chung tu \u0026 Kenh: Ban Pháp lý Doanh nghiệp BioVanguard -\u003e Hệ thống Lưu ký SEC EDGAR \u0026 Broadridge","• Nghiep vu thuc thi: Chốt danh sách cổ đông ngày 01/05; gửi tài liệu đại hội và mẫu phiếu ủy quyền điện tử cho 40 triệu cổ phần lưu hành; đệ trình Đề xuất 4 xin phát hành 1 triệu cổ phiếu ưu đãi chuyển đổi $50M với ngưỡng 66,7%","• Ket qua \u0026 Kiem soat: Bản Công bố Thông tin Ủy quyền DEF 14A + Phiếu Biểu quyết Ủy quyền Điện tử (Proxy Ballot)"],["➔"],["• Chung tu \u0026 Kenh: Công ty Thanh tra Bầu cử Độc lập First American -\u003e Đoàn Chủ tịch ĐHĐCĐ","• Nghiep vu thuc thi: Xác thực túc số tham dự đạt 85,5% (34,2 triệu cổ phần); kiểm đếm kết quả biểu quyết: Đề xuất 4 đạt 30.232.800 phiếu Tán thành (88,4%), vượt xa trần 66,7%; công bố cả 4 đề xuất đều được thông qua","• Ket qua \u0026 Kiem soat: Biên bản Kiểm phiếu Chứng thực (Inspector Certificate) + Báo cáo Công bố Kết quả Biểu quyết Form 8-K"],["➔"],["• Chung tu \u0026 Kenh: BioVanguard -\u003e Quỹ Đầu tư Chuyên ngành OrbiMed Capital -\u003e Ngân hàng Lưu ký","• Nghiep vu thuc thi: Ký hợp đồng bán 1 triệu cổ phiếu ưu đãi Series A thu về trọn vẹn $50M tiền mặt; kích hoạt quyền chuyển đổi thành 1.250.000 cổ phần phổ thông; giải ngân vốn mở 25 trung tâm thử nghiệm lâm sàng Giai đoạn 3","• Ket qua \u0026 Kiem soat: Hợp đồng Mua bán Chứng khoán Dứt khoát + Giấy Báo Có Tiền mặt $50.000.000 USD"]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["STEP 1","PROXY STATEMENT FILING \u0026 SHAREHOLDER SOLICITATION"],[],["STEP 2","INDEPENDENT VOTE TABULATION \u0026 SUPERMAJORITY CERTIFICATION"],[],["STEP 3","INSTITUTIONAL PRIVATE PLACEMENT CLOSING \u0026 TRIAL FUNDING"]],[["• Documents \u0026 Channels: • Documents \u0026 Channels: BioVanguard Corporate Governance -\u003e SEC EDGAR \u0026 Broadridge Proxy Gateway","• Core Business Execution: • Core Business Execution: Establish May 1 record date across 40M common shares; distribute proxy cards; table Proposal 4 authorizing 1M Series A Convertible Preferred shares ($50M raise) under a 66.7% charter threshold.","• Key Deliverable \u0026 Control: • Key Deliverable \u0026 Control: SEC Form DEF 14A Proxy Statement + Electronic Shareholder Proxy Ballots"],["➔"],["• Documents \u0026 Channels: • Documents \u0026 Channels: First American Election Services -\u003e AGM Presiding Chairman","• Core Business Execution: • Core Business Execution: Validate 85.5% voting quorum (34.2M shares); tabulate ballots certifying Proposal 4 secured 30,232,800 \u0027For\u0027 votes (88.4%), surpassing the 66.7% supermajority by 21.7 percentage points.","• Key Deliverable \u0026 Control: • Key Deliverable \u0026 Control: Certified Inspector of Election Certificate + Form 8-K Voting Results Disclosure"],["➔"],["• Documents \u0026 Channels: • Documents \u0026 Channels: BioVanguard Treasury -\u003e OrbiMed Capital -\u003e Escrow Depository Bank","• Core Business Execution: • Core Business Execution: Execute definitive securities purchase agreement with OrbiMed Capital; collect $50M gross proceeds for 1M Series A shares convertible into 1.25M common shares; disburse trial funding.","• Key Deliverable \u0026 Control: • Key Deliverable \u0026 Control: Executed Securities Purchase Agreement + $50,000,000 Wire Settlement Confirmation"]]],"t":"table"},"4.2. Tư duy Phân tích Nghiệp vụ Quản trị Cổ đông \u0026 Huy động Vốn Lai (Bản Tiếng Việt)","• Bức tranh Toàn cảnh Đại hội Cổ đông \u0026 Vốn Lai (End-to-End Flow): Một chu kỳ quản trị đại hội cổ đông kết hợp phát hành công cụ vốn lai (Hybrid Capital) vận hành qua 3 luồng: (1) Luồng Quản trị \u0026 Ủy quyền Cổ đông (Proxy Solicitation \u0026 Quorum): Để sửa đổi điều lệ phát hành cổ phiếu mới, luật doanh nghiệp bắt buộc công ty đại chúng phải lấy ý kiến toàn bộ cổ đông qua cổng ủy quyền (Proxy); thanh tra độc lập phải giám sát để bảo đảm đại hội đạt túc số pháp lý (Quorum \u003e= 50%) và tỷ lệ tán thành vượt ngưỡng đa số đặc biệt (Supermajority 66.7%); (2) Luồng Cấu trúc Công cụ Tài chính Lai (Convertible Preferred Instrument Design): Cổ phiếu ưu đãi chuyển đổi là \u0027đứa con lai\u0027 giữa Trái phiếu và Cổ phiếu: Quỹ đầu tư OrbiMed vừa được bảo đảm an toàn vốn với mức cổ tức cố định 6%/năm (giống trái phiếu), vừa sở hữu quyền chọn chuyển đổi thành 1.250.000 cổ phần phổ thông (giống cổ phiếu) để hưởng siêu lợi nhuận nếu thuốc thử nghiệm thành công và thị giá cổ phiếu bay cao; (3) Luồng Giải ngân Nghiên cứu \u0026 Giảm thiểu Pha loãng (Capital Deployment \u0026 Anti-Dilution): Doanh nghiệp huy động được 50 triệu USD tiền mặt tươi để đẩy nhanh tiến độ thử nghiệm lâm sàng Giai đoạn 3 mà không làm pha loãng cổ phiếu ngay lập tức, giúp bảo vệ quyền lợi cho các cổ đông hiện hữu.","• Điểm nghẽn \u0026 Rủi ro Vận hành Thực tế (Core Bottleneck \u0026 Risk): Rủi ro Không Đạt Ngưỡng Biểu quyết Đa số Đặc biệt (Proxy Vote Failure) và Bẫy \u0027Chuyển Đổi Đè Bẹp Thị Giá\u0027 (Death Spiral Conversion). Nếu các cổ đông nhỏ lẻ thờ ơ không gửi phiếu bầu khiến túc số không đủ hoặc các quỹ đối thủ bỏ phiếu chống khiến tỷ lệ tán thành \u003c 66.7%, doanh nghiệp sẽ bị cạn kiệt ngân sách nghiên cứu lâm sàng. Mặt khác, nếu điều khoản giá chuyển đổi không có ngưỡng bảo vệ (Sàn giá cố định $40), khi cổ phiếu lao dốc, quỹ đầu tư sẽ được chuyển đổi thành số lượng cổ phiếu khổng lồ làm pha loãng phá hủy toàn bộ cấu trúc sở hữu của công ty.","• 3 Giải pháp Thiết kế Hệ thống \u0026 Phân tích Nghiệp vụ (BA Solutions):","(1) Nền tảng Bỏ phiếu Ủy quyền Điện tử Trực tuyến Tích hợp Xác thực Đa tầng (Omnichannel Digital Proxy Voting Engine): Kết nối trực tiếp hệ thống đại hội trực tuyến với mạng lưới lưu ký chứng khoán Broadridge, tự động gửi thông báo đẩy và đường link bỏ phiếu một chạm qua email cho cổ đông, nâng tỷ lệ tham gia đại hội đạt túc số vượt trội trên 85%.","(2) Công cụ Mô phỏng Tác động Pha loãng Cổ phần Theo Bước Giá Thị trường (Convertible Dilution \u0026 Water-Fall Modeling Simulator): Xây dựng bảng tính tự động mô phỏng số lượng cổ phiếu phổ thông phát sinh khi OrbiMed chuyển đổi ở các mức thị giá khác nhau ($40, $48, $60); tự động tính toán tác động lên EPS pha loãng để ban lãnh đạo chủ động điều tiết kế hoạch mua lại cổ phiếu quỹ đối ứng.","(3) Giám sát Điều kiện Kích hoạt Chuyển đổi Tự động (Mandatory Conversion Trigger Monitor): Cấu hình thuật toán theo dõi thị giá đóng cửa của cổ phiếu BVPH trên sàn NASDAQ; nếu thị giá duy trì từ 48,00 USD trở lên trong đủ 20 ngày giao dịch liên tục, hệ thống tự động sinh thông báo pháp lý buộc quỹ đầu tư phải chuyển đổi toàn bộ cổ phiếu ưu đãi sang cổ phiếu phổ thông, xóa sạch nghĩa vụ trả cổ tức 6% hàng năm cho công ty.","4.3. Business Analyst \u0026 Shareholder Services Systems Executive Summary (Bản Tiếng Anh)","• End-to-End Shareholder Governance \u0026 Hybrid Capital Context: Hybrid equity capital formation converges three distinct governance streams: (1) Statutory Proxy Governance: Altering corporate charters mandates rigorous proxy solicitation across dematerialized clearing channels, achieving an 85.5% voting quorum and overcoming a 66.7% supermajority legal barrier; (2) Structured Hybrid Instrument Architecture: Series A Convertible Preferred Stock optimizes risk-return dynamics: securing a senior 6.0% cumulative dividend shield for OrbiMed while embedding an asymmetrical equity call option at a $40 conversion price; (3) Non-Dilutive Capital Deployment: Securing $50M in immediate liquidity accelerates Phase 3 clinical site activation without immediate common share dilution.","• Core Operational Bottleneck \u0026 Risk: Proxy Vote Disenfranchisement and Dilutive Death-Spiral Exposure. Sub-threshold shareholder mobilization risks failing the 66.7% charter requirement, paralyzing vital drug pipeline research. Furthermore, unhedged convertible terms lacking conversion floors risk massive equity overhang and predatory short-selling if clinical trials stumble.","• Key BA \u0026 Governance System Architecture Solutions:","(1) Automated Multi-Channel Proxy Tabulation Gateway: Deploy secure digital voting platforms integrated with central depository voting pipes, automating real-time ballot tracking to ensure supermajority quorums days ahead of meeting cut-offs.","(2) Algorithmic Convertible Dilution \u0026 EPS Accretion Engine: Build dynamic capital structure models within financial reporting ERPs to project fully diluted share counts and pro-forma EPS variations across dynamic market pricing corridors.","(3) Automated Soft-Call \u0026 Mandatory Conversion Telemetry: Establish automated market feeds monitoring NASDAQ closing prices; instantly generating legally binding mandatory conversion notices once common shares trade at or above $48.00 for twenty consecutive sessions, extinguishing ongoing 6% dividend liabilities.","4.4. Tam giác Liên kết Nhận thức Đa chiều (Multi-Perspective Contextual Anchoring)","1. Lăng kính Quản trị Cổ đông \u0026 ESOP Viettel: Bài toán tổ chức Đại hội đồng cổ đông thường niên tại các Tổng công ty cổ phần thuộc Tập đoàn Viettel (Viettel Post, Viettel Construction - CTR, Viettel Global): Việc chuẩn bị tờ trình phân phối lợi nhuận, chi trả cổ tức và kế hoạch phát hành cổ phiếu thưởng ESOP giữ chân nhân sự công nghệ đòi hỏi tỷ lệ đồng thuận cao của cổ đông nhà nước và cổ đông đại chúng, bảo đảm tuân thủ luật chứng khoán và gia tăng giá trị vốn hóa doanh nghiệp.","2. Lăng kính Quản trị Trường Mầm non Ước Mơ Xanh (cô Thu Huyền): Bài toán tổ chức \u0027Hội nghị Toàn thể Phụ huynh Đầu năm\u0027: Cô Thu Huyền đệ trình kế hoạch cải tạo hệ thống camera thông minh và mở thêm lớp song ngữ chất lượng cao; nhà trường lấy biểu quyết đồng thuận của toàn thể phụ huynh với tỷ lệ tán thành trên 80% trước khi triển khai, bảo đảm tính minh bạch và sự ủng hộ tuyệt đối của các gia đình học sinh.","3. Lăng kính Bàn học Gia đình (Kèm cặp học sinh Lớp 5 - Bé Hà Ngân): Bài học \u0027Bầu ban cán sự lớp và quỹ kế hoạch nhỏ\u0027: Hà Ngân tham gia đại hội chi đội lớp 5 để bầu ban cán sự và lấy ý kiến cả lớp về việc thu gom giấy vụn gây quỹ; cô giáo giải thích chỉ khi nào có trên 2/3 số bạn giơ tay đồng ý thì kế hoạch mới được thực hiện (giúp Hà Ngân hiểu rõ thế nào là túc số tham dự và tỷ lệ đa số đặc biệt trong biểu quyết tập thể).","PHẦN 5: BẢNG TỪ VỰNG \u0026 CẤU TRÚC CỐT LÕI (8 THUẬT NGỮ ĐẠI HỘI CỔ ĐÔNG \u0026 VỐN LAI)","1. proxy statement (n phr)  /ˈprɑːksi ˈsteɪtmənt/  = shareholder voting document / formal SEC filing DEF 14A / proxy voting circular","Nghia: Bản công bố thông tin ủy quyền (tài liệu gửi cổ đông giải trình các tờ trình trước đại hội)","Vd: Shareholders received the annual proxy statement outlining board proposals. - Các cổ đông đã nhận được bản công bố thông tin ủy quyền hàng năm nêu rõ các đề xuất của HĐQT.","2. supermajority (n)  /ˌsuːpərməˈdʒɔːrəti/  = two-thirds voting threshold / qualified majority of votes cast","Nghia: Đa số đặc biệt (tỷ lệ biểu quyết thông qua ở mức cao, thường là từ 66,7% trở lên)","Vd: Amending the corporate charter required an affirmative supermajority of 66.7 percent. - Việc sửa đổi điều lệ công ty đòi hỏi phải đạt tỷ lệ đa số đặc biệt tán thành là 66,7%.","3. convertible preferred stock (n phr)  /kənˈvɜːrtəbl prɪˈfɜːrd stɑːk/  = hybrid equity with debt-like dividend and common stock conversion right","Nghia: Cổ phiếu ưu đãi chuyển đổi (chứng khoán lai vừa hưởng cổ tức cố định vừa có quyền đổi ra cổ phiếu thường)","Vd: The biotechnology firm issued $50 million of convertible preferred stock to finance research. - Công ty công nghệ sinh học đã phát hành 50 triệu USD cổ phiếu ưu đãi chuyển đổi để tài trợ nghiên cứu.","4. conversion price (n phr)  /kənˈvɜːrʒn praɪs/  = predetermined strike price per common share upon conversion of preferred securities","Nghia: Mức giá chuyển đổi (giá quy ước để đổi một cổ phiếu ưu đãi lấy cổ phần phổ thông)","Vd: The conversion price was set at $40.00, representing a 20% premium over current market value. - Mức giá chuyển đổi được ấn định ở mức 40,00 USD, đại diện cho mức thặng dư 20% so với thị giá hiện tại.","5. quorum (n)  /ˈkwɔːrəm/  = minimum attendance threshold / required legal participation percentage for valid meeting","Nghia: Túc số hợp lệ (số lượng cổ phần tối thiểu bắt buộc phải có mặt để đại hội có giá trị pháp lý)","Vd: An 85.5% quorum was achieved, ensuring the legal validity of all shareholder resolutions. - Đại hội đã đạt túc số tham dự 85,5%, bảo đảm tính hợp pháp cho toàn bộ các nghị quyết của cổ đông.","6. private placement (n phr)  /ˈpraɪvət ˈpleɪsmənt/  = direct institutional share offering / non-public equity sale to accredited investors","Nghia: Phát hành riêng lẻ (việc bán chứng khoán trực tiếp cho các nhà đầu tư tổ chức mà không chào bán công khai)","Vd: BioVanguard completed a private placement of preferred shares with OrbiMed Capital. - BioVanguard đã hoàn tất đợt phát hành riêng lẻ cổ phiếu ưu đãi cho Quỹ OrbiMed Capital.","7. conversion ratio (n phr)  /kənˈvɜːrʒn ˈreɪʃioʊ/  = number of common shares received per converted preferred unit","Nghia: Tỷ lệ chuyển đổi (số lượng cổ phần phổ thông nhận được khi đổi một cổ phiếu ưu đãi)","Vd: The conversion ratio of 1.25 entitles the investor to 125 common shares for every 100 preferred shares. - Tỷ lệ chuyển đổi 1,25 cho phép nhà đầu tư nhận được 125 cổ phiếu thường cho mỗi 100 cổ phiếu ưu đãi.","8. carried (adj)  /ˈkærid/  = officially approved / legally adopted by vote / enacted by shareholder majority","Nghia: Được thông qua (tờ trình hoặc nghị quyết đạt đủ số phiếu tán thành theo luật)","Vd: All four management resolutions were officially carried at the conclusion of the meeting. - Toàn bộ bốn nghị quyết của ban điều hành đã chính thức được thông qua khi kết thúc kỳ họp đại hội.","==================================================================================================","BÀI 9: Báo cáo Đánh giá Tín nhiệm Doanh nghiệp (Credit Rating Action), Bảng Phân tích Cấu trúc Đáo hạn Nợ \u0026 Thư Đề xuất Tái Cấu trúc Nợ Ngoài Tòa án (Out-of-Court Debt Restructuring) (Questions 196-200 - Triple Passage)","Nguồn: ETS TOEIC Part 7 — Triple Passage (Credit Rating Action Commentary, Debt Maturity Profile \u0026 Creditor Restructuring Proposal)","PHẦN 1: NỘI DUNG BÀI ĐỌC, CÂU HỎI \u0026 BẢN DỊCH SONG NGỮ","1.1. Đề thi Tiếng Anh gốc (Strategy Guide \u0026 Original ETS Passages)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","Questions 196-200 refer to the following rating commentary, debt maturity schedule, and restructuring proposal.","[Passage 1: Credit Rating Action Commentary — Standard Global Ratings]","STANDARD GLOBAL RATINGS — RESEARCH UPDATE","Issuer: Apex Retail Group Inc. (NYSE: ARG)","Credit Rating: Downgraded to \u0027BB+\u0027 from \u0027BBB-\u0027 (High-Yield / Sub-Investment Grade) | Outlook: Negative","Date: September 15 | Lead Credit Analyst: Douglas Vance, CFA","Rating Rationale:","Standard Global Ratings has lowered its long-term issuer credit rating on Apex Retail Group to \u0027BB+\u0027 from \u0027BBB-\u0027. The downgrade reflects accelerating operational cash flow deterioration stemming from brick-and-mortar department store customer traffic losses and elevated promotional discounting.","Apex\u0027s Consolidated Net Debt-to-EBITDA ratio rose to 4.8x for the trailing twelve months ended August 31, breaching our negative rating trigger of 4.0x. Concurrently, the company\u0027s EBITDA Interest Coverage Ratio compressed to 2.1x from 3.5x in the prior year. Most critically, the company faces an upcoming \u0027debt maturity wall\u0027 of $180 million in senior secured term loans maturing on December 31, 2026. Given prevailing high interest rate environments and retail market retrenchment, Apex faces severe refinancing headwinds. The Negative Outlook indicates that ratings could be downgraded further into the \u0027B\u0027 category if Apex fails to execute a comprehensive liability management transaction.","[Passage 2: Debt Maturity \u0026 Liquidity Deficit Profile — Alvarez \u0026 Marsal Restructuring Advisory]","APEX RETAIL GROUP INC. — LIQUIDITY \u0026 REFINANCING WORKBENCH","Prepared by: Alvarez \u0026 Marsal Restructuring Advisory Services | Date: October 1","Total Funded Debt Capital Structure ($320.0 Million):","• Tranche A: Senior Secured Bank Credit Facility: $180.0 million | Maturity: December 31, 2026","• Tranche B: Senior Unsecured Notes: $80.0 million | Maturity: October 15, 2028","• Tranche C: Subordinated Convertible Debentures: $60.0 million | Maturity: June 30, 2030","Liquidity Runway \u0026 12-Month Cash Forecast (Through Q4 2026):","• Current Unrestricted Cash \u0026 Cash Equivalents: $32.0 million","• Forecasted 12-Month Operating Cash Inflow: $25.0 million","• Total Liquid Resources Available: $57.0 million","• Imminent Contractual Debt Service \u0026 Maturities Due by Dec 31, 2026: $180.0 million (Tranche A principal)","• Net Structural Liquidity Shortfall / Deficit: -$123.0 million","Strategic Advisory Conclusion:","Apex cannot satisfy the December 2026 Tranche A maturity through organic operational cash generation or traditional bank refinancing. An out-of-court consensual restructuring is urgently required to prevent formal Chapter 11 bankruptcy filing.","[Passage 3: Out-of-Court Debt Restructuring Term Sheet — Office of the Chief Restructuring Officer]","MEMORANDUM TO AD HOC CREDITOR COMMITTEE (TRANCHE A SENIOR LENDERS)","From: David Vance, Chief Restructuring Officer (CRO), Apex Retail Group Inc.","Date: October 20 | Subject: Consensual Recapitalization \u0026 Maturity Extension Term Sheet","Apex Retail Group hereby submits the following comprehensive debt restructuring term sheet for review by our Tranche A senior secured lenders:","1. Three-Year Maturity Extension:","Extend the contractual maturity date of the Tranche A facility by three full years, moving the maturity from December 31, 2026, to December 31, 2029.","2. Debt-for-Equity Swap \u0026 De-leveraging:","Convert $60.0 million of the $180.0 million Tranche A debt into 35.0% of reorganized common equity shares. The remaining restructured debt principal shall stand at $120.0 million, reducing annualized interest burdens and immediately lowering leverage below 3.0x.","3. Cash \u0026 Payment-in-Kind (PIK) Interest Coupon Modification:","Restructure the loan interest rate to 7.0% total per annum, bifurcated as: 3.0% paid in cash quarterly, plus 4.0% capitalized as Payment-in-Kind (PIK) interest added to principal. This structure preserves approximately $7.2 million in annual cash liquidity during our multi-year retail turnaround.","4. Enhanced Governance \u0026 Board Representation:","Grant the Ad Hoc Creditor Committee the contractual right to appoint two independent directors to Apex\u0027s Board of Directors.","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","196. Why did Standard Global Ratings lower Apex Retail\u0027s credit rating to BB+?","(A) The company failed to publish its audited financial statements on time.","(B) Leverage rose to 4.8x and interest coverage weakened amid store traffic declines.","(C) Its chief executive officer was dismissed by the board of directors.","(D) Lenders seized company warehouse inventory under a court order.","197. According to the liquidity profile, what is the total amount of debt maturing on December 31, 2026?","(A) $32.0 million","(B) $57.0 million","(C) $80.0 million","(D) $180.0 million","198. In Passage 2, paragraph 3, the word \u0027consensual\u0027 is closest in meaning to","(A) disputed","(B) mutual","(C) compulsory","(D) unauthorized","199. Under the CRO\u0027s proposal, what will happen to $60.0 million of the Tranche A debt?","(A) It will be immediately paid off using cash reserves from Citibank.","(B) It will be converted into 35% of the company\u0027s reorganized common stock.","(C) It will be transferred to an offshore corporate subsidiary.","(D) It will be written off as a charitable community tax loss.","200. What is a key benefit of the proposed 4.0% Payment-in-Kind (PIK) interest feature?","(A) It allows Apex to pay part of its interest by adding to principal rather than paying cash.","(B) It guarantees lenders immediate quarterly cash dividends in foreign currencies.","(C) It forces the company to liquidate 30% of its physical retail stores.","(D) It automatically upgrades the company\u0027s credit rating back to investment grade.","1.2. Hướng dẫn làm bài Part 7","CHIẾN THUẬT 5 PHÚT TỐI ƯU: NẮM BẮT BỐI CẢNH, GHÉP NỐI DỮ KIỆN \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Luồng sự việc (Quỹ đạo Quét chữ Z \u0026 3 Câu hỏi Tiềm thức): • Văn bản 1 (Báo cáo Đánh giá Tín nhiệm): S\u0026P hạ xếp hạng của Apex Retail từ BBB- xuống BB+ (rơi vào nhóm \u0027trái phiếu rác/lãi suất cao\u0027); lý do: nợ ròng/EBITDA vọt lên 4.8x và chuẩn bị đối mặt với bức tường nợ đáo hạn 180 triệu USD vào cuối năm 2026.","• Văn bản 2 (Bảng Dòng tiền \u0026 Cấu trúc Nợ): Tổng nợ 320 triệu USD; khoản nợ Tranche A 180 triệu USD đáo hạn ngày 31/12/2026; tiền mặt có 32 triệu USD + dòng tiền thu 25 triệu USD = có 57 triệu USD -\u003e Thiếu hụt trầm trọng 123 triệu USD, không thể trả được nợ nếu không tái cấu trúc.","• Văn bản 3 (Đề xuất Tái cấu trúc Nợ của CRO): Đề xuất với chủ nợ: Gia hạn nợ 180 triệu USD thêm 3 năm (đến 2029); Đổi 60 triệu USD nợ lấy 35% cổ phần (Debt-for-Equity Swap); trả lãi 3% tiền mặt + 4% lãi dồn vốn PIK để giữ lại 7.2 triệu USD tiền mặt mỗi năm; cho chủ nợ 2 ghế HĐQT.","=\u003e Luồng sự việc: Bị hạ xếp hạng tín nhiệm do nợ quá hạn đè nặng -\u003e Lập bảng cân đối dòng tiền phát hiện thiếu hụt thanh khoản 123 triệu USD -\u003e Đệ trình phương án tái cấu trúc nợ ngoài tòa án để tránh phá sản.","Bước 2 (20 giây) - Quét nhanh 5 câu hỏi \u0026 Gắn móc từ khóa: • Câu 196: Lý do S\u0026P hạ xếp hạng xuống BB+ (Từ khóa: why S\u0026P lower rating BB+).","• Câu 197: Tổng số nợ đáo hạn ngày 31/12/2026 (Từ khóa: total debt maturing December 31, 2026).","• Câu 198: Từ \u0027consensual\u0027 gần nghĩa nhất với từ nào (Từ khóa: consensual closest in meaning).","• Câu 199: 60 triệu USD nợ Tranche A sẽ được xử lý ra sao (Từ khóa: $60.0 million Tranche A debt, CRO proposal).","• Câu 200: Lợi ích chính của điều khoản lãi suất dồn vốn PIK (Từ khóa: key benefit, Payment-in-Kind PIK interest).","Bước 3 (3 phút 45 giây) - Giải cuốn chiếu \u0026 Khóa đáp án: • Câu 196 (Chi tiết - VB1): \u0027Net Debt-to-EBITDA ratio rose to 4.8x... Interest Coverage Ratio compressed to 2.1x\u0027 amid customer traffic losses -\u003e Chọn (B).","• Câu 197 (Chi tiết - Bảng VB2): Dòng \u0027Tranche A: Senior Secured Bank Credit Facility: $180.0 million | Maturity: December 31, 2026\u0027 -\u003e Chọn (D) 180 triệu USD.","• Câu 198 (Từ vựng ngữ cảnh - VB2): \u0027consensual restructuring\u0027 = tái cấu trúc trên cơ sở đồng thuận tự nguyện giữa hai bên -\u003e Chọn (B) mutual.","• Câu 199 (Ghép nối - VB3 Mục 2): \u0027Convert $60.0 million of the $180.0 million Tranche A debt into 35.0% of reorganized common equity shares\u0027 -\u003e Chọn (B).","• Câu 200 (Chi tiết - VB3 Mục 3): \u00274.0% capitalized as Payment-in-Kind (PIK) interest added to principal... preserves cash liquidity\u0027 -\u003e Trả lãi bằng cách cộng vào nợ gốc thay vì xuất tiền mặt -\u003e Chọn (A).","Bước 4 (25 giây) - Rà soát \u0026 Đúc kết Feynman: Tự đúc kết 1 câu: Đối mặt với khoản nợ 180 triệu USD sắp tới hạn mà trong túi chỉ có 57 triệu USD, tập đoàn bán lẻ đề xuất chủ nợ đổi 60 triệu USD nợ lấy cổ phần và cho phép nợ tiền lãi bằng cách gộp vào gốc (PIK) để thoát khỏi cửa tử phá sản.","1.3. Dịch Song ngữ Xen kẽ Từng Câu (Sentence-by-Sentence Translation)","[Văn bản 1: Báo cáo Hạ Xếp hạng Tín nhiệm Doanh nghiệp — Tổ chức Xếp hạng Standard Global]","STANDARD GLOBAL RATINGS — RESEARCH UPDATE","Issuer: Apex Retail Group Inc. (NYSE: ARG)","Credit Rating: Downgraded to \u0027BB+\u0027 from \u0027BBB-\u0027 (High-Yield / Sub-Investment Grade) | Outlook: Negative","TỔ CHỨC XẾP HẠNG TÍN NHIỆM TOÀN CẦU STANDARD — BẢN TIN CẬP NHẬT","Bên phát hành: Tập đoàn Bán lẻ Apex (Mã niêm yết NYSE: ARG)","Xếp hạng Tín nhiệm: Hạ xuống mức \u0027BB+\u0027 từ mức \u0027BBB-\u0027 (Nhóm Lợi suất cao / Dưới hạng Đầu tư) | Triển vọng: Tiêu cực","The downgrade reflects accelerating operational cash flow deterioration stemming from brick-and-mortar department store customer traffic losses and elevated promotional discounting.","Việc hạ xếp hạng phản ánh sự suy giảm dòng tiền hoạt động ngày càng trầm trọng xuất phát từ việc sụt giảm lượng khách đến các cửa hàng bách hóa vật lý và chi phí chiết khấu khuyến mãi gia tăng.","Apex\u0027s Consolidated Net Debt-to-EBITDA ratio rose to 4.8x, breaching our negative rating trigger of 4.0x, while Interest Coverage compressed to 2.1x from 3.5x.","Tỷ lệ Nợ ròng trên EBITDA hợp nhất của Apex đã tăng lên 4,8 lần, vượt qua ngưỡng kích hoạt hạ bậc tiêu cực 4,0 lần của chúng tôi, đồng thời Hệ số Khả năng Thanh toán Lãi vay bị co hẹp xuống 2,1 lần từ mức 3,5 lần năm trước.","Most critically, the company faces an upcoming \u0027debt maturity wall\u0027 of $180 million in senior secured term loans maturing on December 31, 2026.","Nghiêm trọng hơn cả, công ty đang đối mặt với \u0027bức tường nợ đáo hạn\u0027 sắp tới lên tới 180 triệu USD đối với các khoản vay có bảo đảm ưu tiên đáo hạn vào ngày 31 Tháng 12 Năm 2026.","Given high interest rates and retail retrenchment, Apex faces severe refinancing headwinds; ratings could fall into the \u0027B\u0027 category without a comprehensive liability management transaction.","Trước môi trường lãi suất cao và sự thu hẹp của ngành bán lẻ, Apex đối mặt với những trở ngại tái cấp vốn gay gắt; xếp hạng có thể rơi sâu xuống nhóm \u0027B\u0027 nếu Apex không thực hiện một giao dịch quản trị nghĩa vụ nợ toàn diện.","[Văn bản 2: Bảng Cấu trúc Đáo hạn Nợ \u0026 Thiếu hụt Thanh khoản — Tư vấn Tái cấu trúc A\u0026M]","APEX RETAIL GROUP INC. — LIQUIDITY \u0026 REFINANCING WORKBENCH","Prepared by: Alvarez \u0026 Marsal Restructuring Advisory Services | Date: October 1","Total Funded Debt: $320.0 Million.","TẬP ĐOÀN BÁN LẺ APEX — BẢNG PHÂN TÍCH THANH KHOẢN \u0026 TÁI CẤP VỐN","Được lập bởi: Dịch vụ Tư vấn Tái cấu trúc Alvarez \u0026 Marsal | Ngày: 1 Tháng 10","Tổng Dư nợ Vay: 320,0 Triệu USD.","Tranche A: Senior Bank Credit: $180.0M (Due Dec 31, 2026) | Tranche B: Senior Unsecured Notes: $80.0M (Due 2028) | Tranche C: Subordinated Debentures: $60.0M (Due 2030).","Khoản nợ A: Tín dụng Ngân hàng Có bảo đảm: 180,0 triệu USD (Đáo hạn 31/12/2026) | Khoản nợ B: Trái phiếu Không bảo đảm: 80,0 triệu USD (Đáo hạn 2028) | Khoản nợ C: Trái phiếu Chuyển đổi Thứ cấp: 60,0 triệu USD (Đáo hạn 2030).","Liquidity Runway: Unrestricted Cash: $32.0M + Forecasted 12-Month Operating Cash: $25.0M = Total Liquid Resources: $57.0 million.","Dư địa Thanh khoản: Tiền mặt Khả dụng: 32,0 triệu USD + Dòng tiền Kinh doanh 12 Tháng Dự phóng: 25,0 triệu USD = Tổng Nguồn lực Tiền mặt Có sẵn: 57,0 triệu USD.","Contractual Debt Service Due Dec 31, 2026: $180.0M (Tranche A) -\u003e Net Structural Liquidity Shortfall: -$123.0 million.","Nghĩa vụ Trả nợ Hợp đồng Đáo hạn 31/12/2026: 180,0 triệu USD (Gốc Khoản nợ A) -\u003e Thiếu hụt Thanh khoản Cấu trúc Ròng: -123,0 triệu USD.","Apex cannot satisfy the maturity organically; an out-of-court consensual restructuring is urgently required to prevent Chapter 11 bankruptcy.","Apex không thể tự thanh toán khoản nợ đáo hạn bằng nguồn tiền tự có; một cuộc tái cấu trúc đồng thuận ngoài tòa án là bắt buộc khẩn cấp để ngăn chặn việc nộp đơn phá sản theo Chương 11.","[Văn bản 3: Tờ trình Đề xuất Tái Cấu trúc Nợ Doanh nghiệp — Giám đốc Tái cấu trúc]","MEMORANDUM TO AD HOC CREDITOR COMMITTEE (TRANCHE A SENIOR LENDERS)","From: David Vance, Chief Restructuring Officer (CRO), Apex Retail Group Inc.","Date: October 20 | Subject: Consensual Recapitalization \u0026 Maturity Extension Term Sheet","BẢN GHI NHỚ GỬI ỦY BAN CHỦ NỢ ĐẶC NHIỆM (CÁC CHỦ NỢ ƯU TIÊN KHOẢN A)","Người gửi: David Vance, Giám đốc Tái cấu trúc Doanh nghiệp (CRO), Tập đoàn Bán lẻ Apex","Ngày: 20 Tháng 10 | Tiêu đề: Điều khoản Tái cấu trúc Vốn Đồng thuận \u0026 Gia hạn Kỳ hạn Nợ","1. Three-Year Maturity Extension: Extend Tranche A maturity from December 31, 2026, to December 31, 2029.","1. Gia hạn Nợ Ba Năm: Gia hạn ngày đáo hạn hợp đồng của Khoản nợ A thêm trọn vẹn ba năm, chuyển thời điểm đáo hạn từ ngày 31 Tháng 12 Năm 2026 sang ngày 31 Tháng 12 Năm 2029.","2. Debt-for-Equity Swap: Convert $60.0M of Tranche A debt into 35.0% of reorganized common equity shares, reducing debt to $120.0M and lowering leverage below 3.0x.","2. Hoán đổi Nợ Thành Cổ phần: Chuyển đổi 60,0 triệu USD trong tổng số 180,0 triệu USD nợ Khoản A thành 35,0% cổ phần phổ thông sau tái cơ cấu, giảm nợ vay còn 120,0 triệu USD và hạ đòn bẩy xuống dưới 3,0 lần.","3. Cash \u0026 Payment-in-Kind (PIK) Interest: Restructure interest to 7.0% (3.0% paid in cash quarterly, plus 4.0% capitalized as PIK interest added to principal), preserving $7.2M in annual liquidity.","3. Cơ chế Lãi suất Tiền mặt \u0026 Dồn vốn (PIK): Điều chỉnh lãi suất vay thành 7,0%/năm (gồm 3,0% trả bằng tiền mặt hàng quý, cộng 4,0% được vốn hóa thành Lãi dồn vốn PIK cộng vào nợ gốc), giúp bảo tồn 7,2 triệu USD thanh khoản tiền mặt hàng năm.","4. Governance: Grant the Creditor Committee the contractual right to appoint two independent directors to Apex\u0027s Board of Directors.","4. Quản trị Doanh nghiệp: Trao cho Ủy ban Chủ nợ quyền hợp đồng được bổ nhiệm hai thành viên độc lập tham gia vào Hội đồng Quản trị của Apex.","1.4. Dịch chi tiết Câu hỏi \u0026 Phương án Trắc nghiệm","Câu 196. Tại sao Tổ chức Xếp hạng Standard Global lại hạ xếp hạng tín nhiệm của Apex Retail xuống mức BB+?","(A) Công ty đã không nộp báo cáo tài chính đã được kiểm toán đúng thời hạn quy định.","(B) Tỷ lệ đòn bẩy tăng lên 4,8 lần và khả năng thanh toán lãi suy giảm trong bối cảnh vắng khách.","(C) Tổng giám đốc điều hành của công ty bị hội đồng quản trị bãi nhiệm chức vụ.","(D) Các chủ nợ đã tiến hành tịch thu hàng tồn kho trong kho theo lệnh của tòa án.","Câu 197. Theo bảng phân tích thanh khoản, tổng số nợ sẽ đáo hạn vào ngày 31 tháng 12 năm 2026 là bao nhiêu?","(A) 32,0 triệu USD","(B) 57,0 triệu USD","(C) 80,0 triệu USD","(D) 180,0 triệu USD","Câu 198. Trong Văn bản 2, đoạn 3, từ \u0027consensual\u0027 gần nghĩa nhất với từ nào sau đây?","(A) Đang có tranh chấp kiện tụng (disputed)","(B) Có sự đồng thuận, nhất trí của đôi bên (mutual)","(C) Bắt buộc cưỡng chế (compulsory)","(D) Không được cấp phép (unauthorized)","Câu 199. Theo đề xuất của Giám đốc Tái cấu trúc CRO, điều gì sẽ xảy ra đối với 60,0 triệu USD nợ của Khoản nợ A?","(A) Khoản tiền này sẽ được hoàn trả ngay lập tức bằng nguồn dự trữ tiền mặt tại Citibank.","(B) Khoản nợ sẽ được chuyển đổi thành 35% cổ phần phổ thông sau tái cơ cấu của công ty.","(C) Khoản nợ sẽ được chuyển giao sang cho một công ty con ở nước ngoài gánh chịu.","(D) Khoản nợ sẽ được xóa sổ như một khoản lỗ từ thiện được khấu trừ thuế cộng đồng.","Câu 200. Lợi ích cốt lõi của tính năng lãi suất Dồn vốn (Payment-in-Kind - PIK) 4,0% được đề xuất là gì?","(A) Nó cho phép Apex trả một phần tiền lãi bằng cách gộp vào nợ gốc thay vì phải chi trả bằng tiền mặt.","(B) Nó bảo đảm các chủ nợ nhận được cổ tức tiền mặt hàng quý ngay lập tức bằng ngoại tệ.","(C) Nó bắt buộc công ty phải tiến hành thanh lý đóng cửa 30% số lượng cửa hàng vật lý.","(D) Nó tự động nâng mức xếp hạng tín nhiệm của công ty trở lại nhóm hạng đầu tư an toàn.","1.5. Tóm tắt Viết lại Toàn bài theo Feynman (Feynman Monograph Summary)","English Executive Summary:","• Sovereign Credit Rating Downgrade: Standard Global Ratings downgraded Apex Retail Group to \u0027BB+\u0027 (sub-investment grade, negative outlook) as Net Debt-to-EBITDA climbed to 4.8x and interest coverage eroded to 2.1x, facing an insurmountable $180.0M senior loan maturity on December 31, 2026.","• Refinancing Impasse \u0026 Liquidity Gap: Alvarez \u0026 Marsal\u0027s restructuring review identified a critical $123.0M liquidity shortfall, where total liquid resources ($32M cash + $25M cash flow = $57M) cannot service the upcoming $180M debt maturity, necessitating urgent out-of-court recapitalization.","• CRO Recapitalization \u0026 PIK Proposal: Chief Restructuring Officer David Vance tabled a comprehensive restructuring term sheet proposing: (1) a 3-year maturity extension to 2029; (2) a $60.0M debt-for-equity swap for 35% reorganized stock; (3) splitting interest into 3.0% cash and 4.0% capitalized Payment-in-Kind (PIK) to conserve $7.2M annually; and (4) granting creditors two board seats.","Bản tóm tắt Tiếng Việt cốt lõi:","• Hạ Bậc Tín Nhiệm Xuống Trái Phiếu Rác: S\u0026P hạ bậc tín nhiệm của Tập đoàn Bán lẻ Apex xuống BB+ (dưới hạng đầu tư) do tỷ lệ đòn bẩy Nợ/EBITDA vọt lên 4,8 lần và khả năng trả lãi giảm còn 2,1 lần, đối diện với bức tường nợ 180 triệu USD đáo hạn ngày 31/12/2026.","• Bế Tắc Tái Cấp Vốn \u0026 Thâm Hụt Thanh Khoản: Báo cáo của Alvarez \u0026 Marsal chỉ ra khoản thiếu hụt thanh khoản trầm trọng 123 triệu USD khi tổng nguồn lực tiền mặt (57 triệu USD) không đủ trả nợ gốc 180 triệu USD, bắt buộc phải tái cấu trúc ngoài tòa án để tránh nộp đơn phá sản Chương 11.","• Phương Án Tái Cấu Trúc Đổi Nợ Lấy Cổ Phần \u0026 Lãi PIK: Giám đốc Tái cấu trúc David Vance đề xuất: (1) gia hạn nợ 3 năm sang 2029; (2) đổi 60 triệu USD nợ lấy 35% cổ phần phổ thông; (3) chia tách lãi suất thành 3% tiền mặt và 4% lãi dồn vốn PIK để giữ lại 7,2 triệu USD tiền mặt mỗi năm; và (4) trao 2 ghế HĐQT cho chủ nợ.","PHẦN 2: ACTIVE RECALL 5 GIÂY (BẢNG MA TRẬN ĐỊNH VỊ SONG NGỮ)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["1. Đối tượng \u0026 Vai trò: Apex Retail Group (Tập đoàn bán lẻ đối mặt nguy cơ vỡ nợ kỹ thuật 180M USD) \u003c-\u003e S\u0026P Global Ratings (Tổ chức hạ bậc tín nhiệm xuống BB+) \u003c-\u003e Alvarez \u0026 Marsal \u0026 David Vance (Đơn vị tư vấn và CRO đề xuất phương án tái cơ cấu vốn nợ).","1. Stakeholders \u0026 Roles: Apex Retail Group (Retailer confronting an imminent $180M debt wall) \u003c-\u003e S\u0026P Global Ratings (Rating agency downgrading debt to BB+) \u003c-\u003e Alvarez \u0026 Marsal \u0026 David Vance (CRO proposing consensual debt-for-equity workout)."]],[["2. Boi canh \u0026 Quy trinh loi"],["2. Bối cảnh \u0026 Quy trình lõi: Tái Cấu trúc Nợ Doanh nghiệp Ngoài Tòa án (Out-of-Court Debt Restructuring \u0026 Workout): Công ty không thể tái tài trợ nợ đáo hạn do đòn bẩy cao (4.8x) -\u003e Phát hiện thâm hụt thanh khoản 123 triệu USD -\u003e Đàm phán với chủ nợ gia hạn kỳ hạn, hoán đổi nợ thành cổ phần (Debt-for-Equity) và áp dụng cơ chế lãi suất dồn vốn (PIK).","2. Business Context \u0026 Core Flow: Distressed Debt Restructuring \u0026 Recapitalization: Firm faces refinancing closure from high leverage (4.8x) -\u003e Identifies $123M liquidity deficit -\u003e Negotiates consensual maturity extensions, debt-for-equity swaps, and Payment-in-Kind (PIK) interest modifications."]],[["3. Dau vet suy luan cheo"],["3. Dấu vết suy luận chéo: Nợ đến hạn là $180M nhưng tiền chỉ có $57M (VB2) -\u003e Đề xuất hoán đổi $60M nợ thành cổ phần (VB3 Mục 2) giúp giảm nợ gốc còn $120M -\u003e Kết hợp gia hạn 3 năm sang 2029 và trả lãi PIK giúp doanh nghiệp thoát khỏi nguy cơ cạn kiệt tiền mặt.","3. Key Cross-Referencing Clues: Debt maturity of $180M exceeds available $57M liquidity (Passage 2) -\u003e Proposing a $60M debt-for-equity swap (Passage 3) downsizes principal to $120M -\u003e Merged with a 3-year extension to 2029 and PIK interest, resolving the cash shortfall."]]],"t":"table"},"PHẦN 3: ĐÁP ÁN CHUẨN XÁC \u0026 DẤU VẾT TRUY XUẤT CHÉO (CROSS-REFERENCING \u0026 TRAP BREAKDOWN)","196. Why did Standard Global Ratings lower Apex Retail\u0027s credit rating to BB+?","Dap an dung: (B) Leverage rose to 4.8x and interest coverage weakened amid store traffic declines.","[Dau vet bai doc / Clue]: Văn bản 1, Đoạn 2: \u0027Apex\u0027s Consolidated Net Debt-to-EBITDA ratio rose to 4.8x... breaching our negative rating trigger of 4.0x. Concurrently, the company\u0027s EBITDA Interest Coverage Ratio compressed to 2.1x from 3.5x... stemming from brick-and-mortar department store customer traffic losses...\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027Net Debt-to-EBITDA ratio rose to 4.8x\u0027 + \u0027Interest Coverage Ratio compressed to 2.1x\u0027 \u003c-\u003e \u0027Leverage rose to 4.8x and interest coverage weakened amid store traffic declines\u0027","[Loi giai chi tiet]: Tổ chức S\u0026P hạ xếp hạng của Apex vì tỷ lệ đòn bẩy nợ ròng/EBITDA tăng vọt lên 4,8 lần (vượt ngưỡng chịu đựng 4,0x) và hệ số chi trả lãi vay suy yếu xuống 2,1 lần do lượng khách mua sắm trực tiếp sụt giảm.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) The company failed to publish its audited financial statements on time.","- Ly do sai: Công ty vẫn công bố số liệu tài chính đầy đủ, không vi phạm nghĩa vụ báo cáo.","- Bay ETS: Bẫy Vi phạm Nghĩa vụ Công bố Báo cáo (Reporting Default Trap)","(C) Its chief executive officer was dismissed by the board of directors.","- Ly do sai: Bản báo cáo tín nhiệm phân tích các chỉ số tài chính vĩ mô và vi mô, không nhắc đến việc sa thải CEO.","- Bay ETS: Bẫy Biến động Nhân sự Cấp cao (Executive Dismissal Trap)","(D) Lenders seized company warehouse inventory under a court order.","- Ly do sai: Chưa có hành động siết nợ hay lệnh phong tỏa kho bãi nào từ tòa án; công ty đang chủ động đàm phán ngoài tòa án.","- Bay ETS: Bẫy Cưỡng chế Tịch thu Tài sản (Asset Foreclosure Trap)","197. According to the liquidity profile, what is the total amount of debt maturing on December 31, 2026?","Dap an dung: (D) $180.0 million","[Dau vet bai doc / Clue]: Văn bản 2, Bảng Cấu trúc nợ: \u0027Tranche A: Senior Secured Bank Credit Facility: $180.0 million | Maturity: December 31, 2026\u0027.","[Dien dat tuong duong / Paraphrase]: • Tra cứu trực tiếp: Khoản nợ Tranche A đến hạn ngày 31/12/2026 ghi rõ là $180.0 million.","[Loi giai chi tiet]: Theo bảng phân tích nợ của Alvarez \u0026 Marsal, toàn bộ khoản tín dụng ngân hàng có bảo đảm Khoản A trị giá 180,0 triệu USD sẽ đến hạn thanh toán nợ gốc vào ngày 31 tháng 12 năm 2026.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) $32.0 million","- Ly do sai: 32.0 triệu USD là số dư tiền mặt khả dụng hiện có.","- Bay ETS: Bẫy Số dư Tiền mặt (Cash Reserves Trap)","(B) $57.0 million","- Ly do sai: 57.0 triệu USD là tổng nguồn lực tiền mặt dự kiến trong 12 tháng (tiền có sẵn + dòng tiền kinh doanh).","- Bay ETS: Bẫy Tổng Nguồn lực Khả dụng (Total Liquid Resources Trap)","(C) $80.0 million","- Ly do sai: 80.0 triệu USD là giá trị Khoản nợ B đáo hạn vào năm 2028.","- Bay ETS: Bẫy Khoản nợ Kỳ hạn Khác (Tranche B Maturity Trap)","198. In Passage 2, paragraph 3, the word \u0027consensual\u0027 is closest in meaning to","Dap an dung: (B) mutual","[Dau vet bai doc / Clue]: Văn bản 2, Dòng Strategic Conclusion: \u0027An out-of-court consensual restructuring is urgently required to prevent formal Chapter 11 bankruptcy filing.\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027consensual\u0027 (có sự đồng thuận, tự nguyện thỏa thuận giữa các bên) \u003c-\u003e \u0027mutual\u0027 (chung, có sự nhất trí đôi bên)","[Loi giai chi tiet]: Trong tái cấu trúc tài chính, \u0027consensual restructuring\u0027 là cuộc tái cấu trúc đồng thuận tự nguyện (mutual agreement) đạt được thông qua đàm phán giữa doanh nghiệp và các chủ nợ mà không cần tòa án can thiệp.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) disputed","- Ly do sai: \u0027Disputed\u0027 nghĩa là đang tranh chấp bất đồng, trái ngược hoàn toàn với sự đồng thuận.","- Bay ETS: Bẫy Nghĩa Đối lập Hoàn toàn (Direct Antonym Trap)","(C) compulsory","- Ly do sai: \u0027Compulsory\u0027 nghĩa là bắt buộc cưỡng chế theo luật pháp.","- Bay ETS: Bẫy Cưỡng chế Luật định (Compulsory Fallacy)","(D) unauthorized","- Ly do sai: \u0027Unauthorized\u0027 nghĩa là không được cho phép, trái pháp luật.","- Bay ETS: Bẫy Hành vi Bất hợp pháp (Illegitimacy Distractor)","199. Under the CRO\u0027s proposal, what will happen to $60.0 million of the Tranche A debt?","Dap an dung: (B) It will be converted into 35% of the company\u0027s reorganized common stock.","[Dau vet bai doc / Clue]: Văn bản 3, Mục 2: \u0027Convert $60.0 million of the $180.0 million Tranche A debt into 35.0% of reorganized common equity shares. The remaining restructured debt principal shall stand at $120.0 million...\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027Convert $60.0 million... into 35.0% of reorganized common equity shares\u0027 \u003c-\u003e \u0027converted into 35% of the company\u0027s reorganized common stock\u0027","[Loi giai chi tiet]: Theo điều khoản Đổi Nợ Lấy Cổ Phần (Debt-for-Equity Swap), 60 triệu USD nợ vay sẽ được xóa bỏ để đổi lấy 35% cổ phần phổ thông của công ty sau khi tái cấu trúc.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) It will be immediately paid off using cash reserves from Citibank.","- Ly do sai: Công ty đang thiếu tiền mặt trầm trọng ($123M deficit) nên không thể dùng tiền mặt trả nợ.","- Bay ETS: Bẫy Trả Tiền Mặt Không Khả Thi (Impossible Cash Repayment Trap)","(C) It will be transferred to an offshore corporate subsidiary.","- Ly do sai: Không có đề xuất nào về việc chuyển nợ sang công ty con ở nước ngoài.","- Bay ETS: Bẫy Chuyển Nợ Trốn Tránh (Offshore Evasion Trap)","(D) It will be written off as a charitable community tax loss.","- Ly do sai: Chủ nợ ngân hàng thương mại không xóa nợ làm từ thiện mà đòi lấy quyền sở hữu cổ phần.","- Bay ETS: Bẫy Xóa Nợ Từ Thiện Vô lý (Charity Forgiveness Trap)","200. What is a key benefit of the proposed 4.0% Payment-in-Kind (PIK) interest feature?","Dap an dung: (A) It allows Apex to pay part of its interest by adding to principal rather than paying cash.","[Dau vet bai doc / Clue]: Văn bản 3, Mục 3: \u0027...plus 4.0% capitalized as Payment-in-Kind (PIK) interest added to principal. This structure preserves approximately $7.2 million in annual cash liquidity...\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027capitalized as Payment-in-Kind (PIK) interest added to principal\u0027 \u003c-\u003e \u0027pay part of its interest by adding to principal rather than paying cash\u0027","[Loi giai chi tiet]: Cơ chế lãi suất dồn vốn PIK cho phép công ty không phải trả tiền mặt ngay mà vốn hóa 4.0% tiền lãi cộng dồn thẳng vào nợ gốc, giúp tiết kiệm 7,2 triệu USD tiền mặt mỗi năm để duy trì hoạt động.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(B) It guarantees lenders immediate quarterly cash dividends in foreign currencies.","- Ly do sai: PIK là không trả tiền mặt (non-cash), hoàn toàn không phải trả cổ tức tiền mặt bằng ngoại tệ.","- Bay ETS: Bẫy Trả Tiền Mặt Ngược Bản chất PIK (Cash Distortion Trap)","(C) It forces the company to liquidate 30% of its physical retail stores.","- Ly do sai: Khoản lãi suất này là cơ chế tài chính nhằm cứu vãn dòng tiền, không phải điều khoản cưỡng chế đóng cửa cửa hàng.","- Bay ETS: Bẫy Đóng Cửa Cửa Hàng Bắt Buộc (Forced Store Closure Trap)","(D) It automatically upgrades the company\u0027s credit rating back to investment grade.","- Ly do sai: Lãi suất PIK thường chỉ áp dụng cho doanh nghiệp khó khăn tài chính; nó không tự động giúp nâng hạng tín nhiệm trở lại nhóm an toàn.","- Bay ETS: Bẫy Nâng Hạng Tín Nhiệm Ảo (Automatic Upgrade Fallacy)","PHẦN 4: KỸ THUẬT FEYNMAN SONG NGỮ \u0026 SƠ ĐỒ QUY TRÌNH (TƯ DUY TÁI CẤU TRÚC NỢ \u0026 BA)","4.1. Sơ đồ Quy trình Luân chuyển Nghiệp vụ (Distress Warning, Liquidity Audit \u0026 Workout Execution)","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","Nhận Diện Cảnh Báo Tín Nhiệm \u0026 Phân Tích Thâm Hụt Dòng Tiền (Credit Downgrade \u0026 Liquidity Gap)"],[],["BƯỚC 2","Thành Lập Ủy Ban Chủ Nợ \u0026 Đàm Phán Phương Án Tái Cấu Trúc Vốn (Creditor Committee \u0026 Workout Modeling)"],[],["BƯỚC 3","Ký Kết Thỏa Thuận Khung \u0026 Thực Thi Hoán Đổi Cổ Phần (Lock-Up Agreement \u0026 Equity Issuance)"]],[["• Chung tu \u0026 Kenh: Tổ chức S\u0026P Global Ratings -\u003e Đơn vị Tư vấn Tái cấu trúc Alvarez \u0026 Marsal","• Nghiep vu thuc thi: S\u0026P hạ xếp hạng xuống BB+ do đòn bẩy 4,8x; A\u0026M phân tích cấu trúc nợ 320 triệu USD và phát hiện thâm hụt 123 triệu USD đối với khoản nợ 180 triệu USD đáo hạn ngày 31/12/2026","• Ket qua \u0026 Kiem soat: Báo cáo Cảnh báo Tín nhiệm Đỏ (S\u0026P Rating Action) + Bảng Thẩm định Thâm hụt Thanh khoản 13 Tuần"],["➔"],["• Chung tu \u0026 Kenh: Giám đốc Tái cấu trúc CRO David Vance -\u003e Ủy ban Chủ nợ Ưu tiên Khoản A","• Nghiep vu thuc thi: Thành lập Ủy ban Chủ nợ lâm thời; đàm phán giải pháp tránh phá sản Chương 11: gia hạn nợ 3 năm sang 2029, hoán đổi 60 triệu USD nợ lấy 35% cổ phần và cơ cấu lãi suất kết hợp PIK","• Ket qua \u0026 Kiem soat: Bản Điều khoản Tái Cấu trúc Nợ Đồng thuận (Restructuring Term Sheet) + Mô hình Phục hồi Hoạt động"],["➔"],["• Chung tu \u0026 Kenh: Hội đồng Quản trị Apex -\u003e Toàn thể Chủ nợ Hợp vốn \u0026 Đại lý Lưu ký Chứng khoán","• Nghiep vu thuc thi: Ký kết Thỏa thuận Hỗ trợ Tái cơ cấu (RSA); phát hành cổ phiếu mới trao 35% quyền sở hữu cho ngân hàng, điều chỉnh dư nợ gốc Khoản A xuống 120 triệu USD và bổ nhiệm 2 giám đốc đại diện chủ nợ","• Ket qua \u0026 Kiem soat: Hợp đồng Tái Tài trợ Nợ Sửa đổi (Amended Credit Agreement) + Giấy Chứng nhận Cổ phần Mới Phát hành"]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["STEP 1","CREDIT DOWNGRADE DETECTION \u0026 LIQUIDITY DEFICIT AUDIT"],[],["STEP 2","CREDITOR AD HOC COMMITTEE FORMATION \u0026 WORKOUT NEGOTIATION"],[],["STEP 3","RESTRUCTURING SUPPORT AGREEMENT \u0026 EQUITY CONVERSION CLOSING"]],[["• Documents \u0026 Channels: • Documents \u0026 Channels: S\u0026P Global Ratings -\u003e Alvarez \u0026 Marsal Restructuring Advisory","• Core Business Execution: • Core Business Execution: S\u0026P cuts rating to BB+ on 4.8x leverage; A\u0026M models the $320M debt stack and proves a $123M liquidity shortfall against the $180M maturity wall due December 31, 2026.","• Key Deliverable \u0026 Control: • Key Deliverable \u0026 Control: S\u0026P Rating Downgrade Commentary + 13-Week Liquidity Gap Assessment"],["➔"],["• Documents \u0026 Channels: • Documents \u0026 Channels: Chief Restructuring Officer David Vance -\u003e Tranche A Senior Lenders","• Core Business Execution: • Core Business Execution: Form Ad Hoc Lender Committee to avert Chapter 11 bankruptcy; negotiate a 3-year extension to 2029, a $60M debt-for-equity swap, and a bifurcated 3% cash / 4% PIK interest structure.","• Key Deliverable \u0026 Control: • Key Deliverable \u0026 Control: Executed Consensual Restructuring Term Sheet + De-leveraging Sensitivity Model"],["➔"],["• Documents \u0026 Channels: • Documents \u0026 Channels: Apex Board of Directors -\u003e Syndicate Lenders \u0026 DTC Depository","• Core Business Execution: • Core Business Execution: Execute binding Restructuring Support Agreement (RSA); cancel $60M debt in exchange for 35% reorganized equity; establish amended $120M credit facility and seat two creditor board members.","• Key Deliverable \u0026 Control: • Key Deliverable \u0026 Control: Amended Credit Agreement + Depository DTC Book-Entry Creditor Shares"]]],"t":"table"},"4.2. Tư duy Phân tích Nghiệp vụ Tái Cấu trúc Nợ Doanh nghiệp \u0026 BA (Bản Tiếng Việt)","• Bức tranh Toàn cảnh Tái Cấu trúc Nợ Khó đòi (End-to-End Flow): Một chu kỳ giải cứu doanh nghiệp khỏi bờ vực vỡ nợ (Corporate Turnaround \u0026 Debt Workout) vận hành qua 3 luồng: (1) Luồng Cảnh báo Áp lực Nợ Vay (Debt Maturity Wall \u0026 Liquidity Audit): Doanh nghiệp bị nghẽn thanh khoản do nợ vay đến hạn ($180M) vượt xa nguồn tiền tích lũy ($57M); xếp hạng tín nhiệm bị hạ xuống nhóm \u0027trái phiếu rác\u0027 khiến các kênh vay mới bị đóng băng hoàn toàn; (2) Luồng Đàm phán Đổi Nợ Lấy Cổ phần (Debt-for-Equity Restructuring Mechanism): Để không bị kéo nhau ra tòa phá sản thanh lý tài sản với giá rẻ mạt, chủ nợ và doanh nghiệp chấp nhận thỏa hiệp: ngân hàng \u0027xóa\u0027 60 triệu USD nợ để đổi lấy 35% cổ phần sở hữu công ty, biến chủ nợ thành cổ đông chiến lược cùng chia sẻ vận mệnh tương lai; (3) Luồng Bảo toàn Thanh khoản Qua Cơ chế Lãi Dồn Vốn PIK (Payment-in-Kind Cash Preservation): Lãi suất 7% được xé làm đôi: công ty chỉ trả 3% bằng tiền mặt tươi, còn 4% tiền lãi được vốn hóa ghi nợ thêm vào gốc; giải pháp tài chính tinh tế này giúp doanh nghiệp giữ lại hàng triệu USD tiền mặt quý giá để duy trì chuỗi cung ứng hàng hóa cho các cửa hàng mà không bị đứt gãy kinh doanh.","• Điểm nghẽn \u0026 Rủi ro Vận hành Thực tế (Core Bottleneck \u0026 Risk): Rủi ro \u0027Kẻ Phá Bĩnh Không Hợp tác\u0027 (Holdout Creditor Problem) và Rủi ro Bẫy \u0027Xóa Nợ Nhưng Không Cứu Được Hoạt Động Cốt Lõi\u0027 (Operational Failure Post-Restructuring). Trong hợp vốn nợ, nếu chỉ cần một vài quỹ đầu tư nhỏ từ chối thỏa hiệp ngoài tòa án và đe dọa kiện siết nợ, toàn bộ thỏa thuận sẽ sụp đổ, buộc công ty phải chuyển sang phá sản có chuẩn bị trước (Pre-packaged Chapter 11). Mặt khác, nếu doanh nghiệp chỉ cơ cấu lại bảng cân đối kế toán mà không cắt giảm được chi phí mặt bằng và chuyển đổi sang bán hàng online, dòng tiền sẽ tiếp tục âm và công ty sẽ lại phá sản lần hai (Chapter 22).","• 3 Giải pháp Thiết kế Hệ thống \u0026 Phân tích Nghiệp vụ (BA Solutions):","(1) Hệ thống Dự báo Dòng Tiền Trực tiếp 13 Tuần Chuẩn Phục hồi Doanh nghiệp (13-Week Cash Flow Forecast Engine - TWCF): Xây dựng module quản lý ngân quỹ theo dõi thu chi tiền mặt chi tiết theo từng ngày; thiết lập cơ chế kiểm soát chi tiêu kép (Dual-approval cash disbursement) bảo đảm từng đồng tiền mặt được ưu tiên cho các hoạt động duy trì doanh thu thiết yếu.","(2) Công cụ Tự động Hóa Hạch toán \u0026 Vốn hóa Lãi suất PIK (Automated PIK Accrual \u0026 Capitalization Ledger): Cấu hình hệ thống ERP nợ vay tự động tách dòng lãi vay hàng quý thành 2 bút toán song song: tự động sinh lệnh điện chuyển tiền 3% tiền mặt qua ngân hàng và tự động cập nhật tăng số dư nợ gốc cho phần 4% lãi suất dồn vốn PIK, bảo đảm tính minh bạch tuyệt đối với kiểm toán.","(3) Giám sát Chỉ số Phục hồi Hậu Tái cơ cấu (Turnaround KPI \u0026 Covenant Monitoring Dashboard): Tích hợp bảng điều khiển giám sát trực tiếp dành cho 2 giám đốc đại diện chủ nợ trong HĐQT: theo dõi tự động tỷ lệ Nợ ròng/EBITDA (mục tiêu kéo giảm dưới 3.0x), doanh số trên mỗi mét vuông cửa hàng và tốc độ thanh lý hàng tồn kho cũ để bảo đảm kế hoạch tái cơ cấu đi đúng quỹ đạo cam kết.","4.3. Business Analyst \u0026 Restructuring Systems Executive Summary (Bản Tiếng Anh)","• End-to-End Distressed Recapitalization Context: Corporate debt workouts navigate three operational turnaround phases: (1) Liquidity Diagnostics \u0026 Refinancing Impasse: High leverage (4.8x) and rating downgrades freeze debt capital markets, revealing an acute $123M liquidity gap against a maturing $180M debt wall; (2) Consensual Balance Sheet De-leveraging: Averting value-destructive Chapter 11 liquidations through a $60M debt-for-equity swap, transforming senior lenders into 35% equity stakeholders aligned with corporate revival; (3) Liquidity Shielding via PIK Toggle Structures: Bifurcatin
