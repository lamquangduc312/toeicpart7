ion.","Điều khoản XI: Vi phạm, Tiền Phạt Định trước (Liquidated Damages) và Khấu trừ Thanh toán. 11.1 Biểu Tiền Phạt Vi phạm Định trước: Tự ý Thay đổi Nhà Cung ứng: Sử dụng nhà cung cấp thực phẩm chưa được phê duyệt mà không có văn bản chấp thuận trước 30 ngày của Khu Học chánh: Phạt $5,000 cho mỗi lần vi phạm.","Cold-Chain Temperature Violation: Perishable deliveries arriving above 4.0°C: Immediate rejection of cargo and a liquidated penalty of $3,000 per vehicle.","Vi phạm Nhiệt độ Chuỗi Lạnh: Hàng hóa dễ hỏng khi đến nơi có nhiệt độ trên 4.0°C: Bác bỏ và tiêu hủy lô hàng ngay lập tức và áp dụng mức phạt định trước là $3,000 cho mỗi xe vận chuyển.","Late Delivery: Arriving after 07:00 AM on scheduled school instructional days: $1,000 per occurrence.","Giao hàng Trễ hạn: Đến sau 07:00 sáng vào các ngày học theo lịch của học sinh: Phạt $1,000 cho mỗi lần phát sinh.","11.2 Direct Billing Deductions: Liquidated penalties assessed under Article XI shall be withheld directly from Contractor's monthly recurring catering invoice.","11.2 Khấu trừ Trực tiếp Trên Hóa đơn: Các khoản tiền phạt vi phạm được xác định theo Điều khoản XI sẽ được khấu trừ trực tiếp từ hóa đơn dịch vụ suất ăn định kỳ hàng tháng của Nhà thầu.","[Văn bản 2: Bản ghi nhớ Kết quả Thanh tra Dinh dưỡng & Khấu trừ Phạt Hóa đơn]","Document 2: Nutrition Quality Audit & Invoice Sanction Memorandum","Evergreen School District - Health and Nutrition Safety Directorate","Văn bản 2: Bản ghi nhớ Thanh tra Chất lượng Dinh dưỡng & Chế tài Phạt Hóa đơn","Khu Học chánh Evergreen - Khối An toàn Dinh dưỡng & Sức khỏe Học sinh","October 28. To: Arthur Pendelton, Managing Director, NutriClean Catering Services LLC, Seattle, WA. Subject: Formal Notice of Audit Sanctions and Invoice Deduction - October Billing Cycle.","Ngày 28 tháng 10. Kính gửi: Arthur Pendelton, Giám đốc Điều hành, NutriClean Catering Services LLC, Seattle, WA. Tiêu đề: Thông báo Chính thức về Chế tài Xử phạt Thanh tra & Khấu trừ Hóa đơn - Chu kỳ Cước Tháng 10.","Dear Mr. Pendelton, On October 19, the District Health Inspection Team, accompanied by Municipal Health Inspectors, conducted an unannounced surprise inspection of Delivery Truck #08 arriving at Greenbrier Elementary School cafeteria at 06:45 AM.","Kính gửi Ông Pendelton, Vào ngày 19 tháng 10, Đội Thanh tra Y tế Khu Học chánh, cùng với các Thanh tra viên Y tế Thành phố, đã tiến hành một cuộc kiểm tra đột xuất không báo trước đối với Xe Tải Giao hàng số #08 khi xe đến nhà ăn Trường Tiểu học Greenbrier lúc 06:45 sáng.","Our inspection identified two severe contractual and food safety non-compliance violations: 1. Cold-Chain Refrigeration Failure: The onboard refrigerated container's cooling compressor was switched off during transit. Digital data-loggers confirmed interior cargo temperatures reached 13.5°C (56.3°F), far exceeding the 4.0°C ceiling mandated in Section 6.2.","Đợt thanh tra của chúng tôi đã phát hiện hai vi phạm nghiêm trọng về hợp đồng và không tuân thủ an toàn thực phẩm: 1. Sự cố Hệ thống Làm lạnh Chuỗi Lạnh: Máy nén làm lạnh của thùng xe đông lạnh đã bị tắt trong quá trình vận chuyển. Thiết bị ghi dữ liệu số xác nhận nhiệt độ khoang hàng bên trong lên tới 13.5°C (56.3°F), vượt xa ngưỡng trần 4.0°C bắt buộc tại Khoản 6.2.","The entire shipment of 1,200 cartons of organic whole milk and Greek yogurt was condemned and disposed of immediately. (Section 11.1 Sanction: $3,000.00).","Toàn bộ lô hàng gồm 1,200 hộp sữa tươi hữu cơ nguyên kem và sữa chua Hy Lạp đã bị tịch thu và tiêu hủy ngay lập tức. (Chế tài phạt theo Khoản 11.1: $3,000.00).","2. Unauthorized Ingredient Sourcing: Inspection of shipping manifests revealed that the fresh strawberries and cantaloupe slices delivered in Truck #08 were sourced from Valley Harvest Wholesalers, an unapproved distributor not listed on your Approved Farm Cooperative Schedule. (Section 11.1 Sanction: $5,000.00).","2. Nguồn gốc Nguyên liệu Chưa qua Phê duyệt: Kiểm tra chứng từ vận chuyển cho thấy dâu tây tươi và dưa lưới cắt lát giao trên Xe tải #08 được thu mua từ Nhà bán sỉ Valley Harvest Wholesalers, một nhà phân phối chưa được phê duyệt và không có tên trong Danh mục Hợp tác xã Trang trại Được Phê chuẩn của quý công ty. (Chế tài phạt theo Khoản 11.1: $5,000.00).","Total Liquidated Damages Assessed: $8,000.00. Invoice Adjustment: Your October billing invoice (#INV-10992) for $42,500.00 has been audited. The District Accounting Office has deducted the $8,000.00 in contractual sanctions, resulting in an approved net payment of $34,500.00, scheduled for electronic fund disbursement on November 10.","Tổng Mức Tiền Phạt Định trước Được Xác định: $8,000.00. Điều chỉnh Hóa đơn: Hóa đơn kỳ cước tháng 10 của quý công ty (#INV-10992) với số tiền $42,500.00 đã được đối soát kiểm toán. Phòng Kế toán Khu Học chánh đã khấu trừ khoản tiền phạt hợp đồng $8,000.00, dẫn đến số tiền thanh toán ròng được phê duyệt là $34,500.00, dự kiến giải ngân chuyển tiền điện tử vào ngày 10 tháng 11.","Furthermore, please be advised that any subsequent cold-chain or supplier violation within the next 90 days will trigger immediate contract termination for cause pursuant to Article XIV.","Hơn nữa, xin lưu ý rằng bất kỳ vi phạm chuỗi lạnh hoặc vi phạm nhà cung cấp nào tiếp theo trong vòng 90 ngày tới sẽ kích hoạt việc chấm dứt hợp đồng ngay lập tức do lỗi vi phạm căn cứ theo Điều khoản XIV.","Sincerely, Dr. Eleanor Vance, Director of Nutrition & Student Wellness, Evergreen Public School District.","Trân trọng, Tiến sĩ Eleanor Vance, Giám đốc Dinh dưỡng & Sức khỏe Học sinh, Khu Học chánh Công lập Evergreen.","1.4. 1.4. Dịch chi tiết Câu hỏi & Phương án Trắc nghiệm","[TRANSLATED QUESTIONS & OPTIONS - CAU HOI VA DAP AN DICH NGHIA]:","Câu 191. Yêu cầu bắt buộc đối với các sản phẩm thực phẩm được cung cấp theo hợp đồng suất ăn là gì?","(A) Chúng phải được nhập khẩu trực tiếp từ các trang trại hữu cơ châu Âu.","(B) Chúng phải được vận chuyển độc quyền bằng các xe tải điện không làm lạnh.","(C) Chúng phải đến từ các hợp tác xã được phê duyệt và đáp ứng các tiêu chuẩn hữu cơ.","(D) Chúng phải được đóng gói trong các hộp nhựa dùng được cho lò vi sóng.","Câu 192. Nhiệt độ tối đa cho phép đối với thực phẩm dễ hỏng trong quá trình vận chuyển là bao nhiêu?","(A) 0.0°C","(B) 4.0°C","(C) 13.5°C","(D) 30.0°C","Câu 193. Tại sao chiếc xe tải giao hàng KHÔNG bị phạt lỗi vi phạm giao hàng trễ?","(A) Tài xế có giấy phép miễn trừ ưu tiên giao thông khẩn cấp.","(B) Xe tải đã đến nhà ăn trường học trước 07:00 sáng.","(C) Các lớp học bị hủy bỏ do thời tiết mùa đông khắc nghiệt.","(D) Lịch giao hàng đã được dời lại vào các khung giờ buổi chiều.","Câu 194. Tổng mức tiền phạt vi phạm định trước bị khấu trừ khỏi hóa đơn của NutriClean là bao nhiêu?","(A) $1,000.00","(B) $3,000.00","(C) $5,000.00","(D) $8,000.00","Câu 195. NutriClean sẽ phải đối mặt với hậu quả gì nếu xảy ra một vi phạm an toàn thực phẩm khác trong vòng 90 ngày tới?","(A) Việc chấm dứt hợp đồng cung cấp suất ăn ngay lập tức do lỗi vi phạm.","(B) Yêu cầu bắt buộc phải nộp một khoản tiền bảo lãnh bảo đảm doanh nghiệp $50,000.","(C) Việc tước bằng lái xe vĩnh viễn của ông Arthur Pendelton.","(D) Việc bắt buộc phải chuyển đổi pháp nhân thành tổ chức phi lợi nhuận.","1.5. 1.5. Tóm tắt Viết lại Toàn bài theo Feynman (Feynman Monograph Summary)","[EXECUTIVE SUMMARY & CORE LOGIC - BAN TOM TAT COT LOI]:","English Executive Summary:","• School Catering Governance & Penalties: Evergreen School District's contract strictly mandates certified organic ingredients from pre-approved cooperatives, continuous ≤4.0°C cold-chain transport, and automated invoice penalties ($5k unapproved vendor, $3k temperature breach, $1k late delivery after 7 AM).","• Surprise Audit Violations: An unannounced inspection of Truck #08 on October 19 (arrived on time at 6:45 AM) found the refrigeration compressor off with cargo at 13.5°C ($3,000 fine + disposal of 1,200 milk/yogurt cartons) and unapproved fruit sourcing from Valley Harvest ($5,000 fine).","• Direct Invoice Deduction & Warning: The District deducted the total $8,000 in liquidated damages from NutriClean's $42,500 October bill (disbursing $34,500 net on Nov 10) and issued a formal 90-day final warning threatening immediate contract termination for cause.","Bản tóm tắt Tiếng Việt cốt lõi:","• Quy chuẩn Suất ăn Bán trú & Chế tài Hợp đồng: Hợp đồng của Khu Học chánh Evergreen quy định nguyên liệu hữu cơ 100% từ đối tác được duyệt, xe lạnh duy trì ≤4.0°C, và áp dụng phạt trừ hóa đơn ($5k đổi nguồn cung, $3k sai nhiệt độ, $1k giao trễ sau 7h sáng).","• Vi phạm Phát hiện Qua Thanh tra Đột xuất: Đợt kiểm tra xe #08 ngày 19/10 (đến đúng giờ lúc 6h45) phát hiện máy lạnh bị tắt khiến nhiệt độ vọt lên 13.5°C (phạt $3,000 và tiêu hủy 1,200 hộp sữa chua) cùng hoa quả mua chui từ Valley Harvest (phạt $5,000).","• Khấu trừ Thanh toán & Tối hậu thư 90 Ngày: Khu Học chánh khấu trừ toàn bộ $8,000 tiền phạt vào hóa đơn tháng 10 trị giá $42,500 (chi trả số tiền ròng $34,500 vào ngày 10/11) và phát lệnh cảnh cáo sẽ hủy hợp đồng ngay nếu tái phạm trong 90 ngày.","PHẦN 2: PHẦN 2: ACTIVE RECALL 5 GIÂY (BẢNG MA TRẬN ĐỊNH VỊ SONG NGỮ)",{"t":"table","rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong & Vai tro"],["Bên Giao Thầu / Cơ quan Quản lý: Khu Học chánh Công lập Evergreen (Evergreen Public School District - Giám đốc Dinh dưỡng Dr. Eleanor Vance). Nhà thầu Dịch vụ Suất ăn: NutriClean Catering Services LLC (Arthur Pendelton).","Contracting Authority: Evergreen Public School District (Nutrition Director Dr. Eleanor Vance). Catering Contractor: NutriClean Catering Services LLC (Arthur Pendelton)."]],[["2. Boi canh & Quy trinh loi"],["Thanh tra đột xuất xe lạnh phát hiện 2 lỗi vi phạm: (1) Máy lạnh tắt làm nhiệt độ lên 13.5°C (trần quy định 4.0°C) -> Phạt $3,000; (2) Tự ý đổi nhà cung cấp hoa quả Valley Harvest chưa qua duyệt -> Phạt $5,000. Xe đến 6h45 sáng trước 7h00 nên không bị phạt giao trễ.","Surprise audit uncovered 2 violations: (1) Compressor switched off, cargo at 13.5°C (ceiling 4.0°C) -> $3,000 fine; (2) Unapproved produce vendor (Valley Harvest) -> $5,000 fine. Vehicle arrived at 6:45 AM (before 7:00 AM), avoiding late delivery penalties."]],[["3. Dau vet suy luan cheo"],["Đối soát kế toán: Hóa đơn tháng $42,500 - Tiền phạt vi phạm $8,000 ($3,000 + $5,000) = Tiền thanh toán ròng $34,500 giải ngân ngày 10/11 kèm điều kiện cảnh báo 90 ngày.","Invoice reconciliation: Gross billing $42,500 less $8,000 liquidated penalties ($3,000 + $5,000) equals net payable $34,500 disbursed November 10 under a 90-day final warning."]]]},"PHẦN 3: PHẦN 3: ĐÁP ÁN CHUẨN XÁC & DẤU VẾT TRUY XUẤT CHÉO (CROSS-REFERENCING & COMPREHENSIVE TRAP BREAKDOWN)","191. What is required of food products supplied under the catering agreement?","Dap an dung: (C) They must come from approved cooperatives and meet organic standards.","[Dau vet bai doc / Clue]: Document 1, Section 6.1: 'Contractor... covenants that all poultry, produce, and dairy... shall be 100% Certified Organic and sourced exclusively from pre-approved regional agricultural cooperatives...'","[Dien dat tuong duong / Paraphrase]:","• 100% Certified Organic and sourced from pre-approved regional cooperatives <=> come from approved cooperatives and meet organic standards.","[Loi giai chi tiet]: Văn bản 1 quy định rõ ở Điều khoản 6.1: Toàn bộ thịt gia cầm, nông sản và sữa phải đạt chứng nhận hữu cơ 100% và được thu mua độc quyền từ các hợp tác xã nông nghiệp khu vực đã được phê duyệt trước.","[Phan tich Phuong an Sai & Bay De thi ETS]:","(A) They must be imported directly from European organic farms.","- Ly do sai: Hợp đồng yêu cầu nguồn nông sản khu vực địa phương (regional cooperatives), không phải nhập khẩu từ châu Âu.","- Bay ETS: Bẫy Xuất xứ Nông sản Bịa đặt (Geographic Trap)","(B) They must be delivered exclusively in non-refrigerated electric vans.","- Ly do sai: Hợp đồng bắt buộc phải vận chuyển bằng xe đông lạnh duy trì nhiệt độ dưới 4.0°C.","- Bay ETS: Bẫy Ngược Thực tế (Reversed Fact Trap)","(D) They must be packaged in microwavable plastic containers.","- Ly do sai: Không có điều khoản nào đề cập đến hộp nhựa lò vi sóng.","- Bay ETS: Bẫy Chi tiết Đóng gói Ảo (Packaging Distortion Trap)","192. What maximum temperature is permitted for perishable food during transit?","Dap an dung: (B) 4.0°C","[Dau vet bai doc / Clue]: Document 1, Section 6.2: 'maintaining an interior ambient temperature of 4.0°C (39.2°F) or below at all times during transit...'","[Dien dat tuong duong / Paraphrase]:","• 4.0°C (39.2°F) or below <=> maximum temperature permitted is 4.0°C.","[Loi giai chi tiet]: Điều khoản 6.2 quy định trần nhiệt độ tối đa cho phép trong suốt quá trình vận chuyển chuỗi lạnh là 4.0°C trở xuống.","[Phan tich Phuong an Sai & Bay De thi ETS]:","(A) 0.0°C","- Ly do sai: 0.0°C là nhiệt độ đóng băng, hợp đồng chỉ yêu cầu bảo quản mát từ 4.0°C trở xuống.","- Bay ETS: Bẫy Điểm Đóng Băng (Freezing Point Trap)","(C) 13.5°C","- Ly do sai: 13.5°C là nhiệt độ đo được trên xe vi phạm ở Văn bản 2, không phải nhiệt độ được phép.","- Bay ETS: Bẫy Số liệu Vi phạm Thực tế (Violation Temperature Trap)","(D) 30.0°C","- Ly do sai: 30 là số ngày thông báo trước khi đổi nhà cung cấp, không phải độ C.","- Bay ETS: Bẫy Nhầm lẫn Đơn vị Con số (Unit Confusion Trap)","193. Why was the delivery truck NOT fined for a late arrival violation?","Dap an dung: (B) The truck arrived at the school cafeteria before 07:00 AM.","[Dau vet bai doc / Clue]: Document 1: Late Delivery applies to 'Arriving after 07:00 AM'. Document 2: 'Truck #08 arriving at Greenbrier Elementary School cafeteria at 06:45 AM.'","[Dien dat tuong duong / Paraphrase]:","• Arrived at 06:45 AM before 07:00 AM cutoff <=> Arrived at the school cafeteria before 07:00 AM.","[Loi giai chi tiet]: Văn bản 1 quy định chỉ phạt giao hàng trễ nếu xe đến sau 07:00 sáng. Văn bản 2 ghi rõ xe đến lúc 06:45 sáng (sớm hơn hạn chốt 15 phút), do đó không cấu thành lỗi giao hàng trễ.","[Phan tich Phuong an Sai & Bay De thi ETS]:","(A) The driver possessed an emergency traffic waiver permit.","- Ly do sai: Không hề có giấy miễn trừ giao thông nào được nhắc đến.","- Bay ETS: Bẫy Giấy phép Bịa đặt (Fabricated Permit Trap)","(C) Classes were canceled due to severe winter weather.","- Ly do sai: Tháng 10 trường học vẫn hoạt động giảng dạy bình thường.","- Bay ETS: Bẫy Thời tiết Ảo (Weather Distortion Trap)","(D) Deliveries were rescheduled to afternoon hours.","- Ly do sai: Hợp đồng phục vụ bữa ăn sáng và trưa nên bắt buộc giao trước 7 giờ sáng.","- Bay ETS: Bẫy Đổi Lịch Trình (Rescheduling Trap)","194. What was the total liquidated penalty deducted from NutriClean's invoice?","Dap an dung: (D) $8,000.00","[Dau vet bai doc / Clue]: Document 2: '1. Cold-Chain Refrigeration Failure: $3,000.00. 2. Unauthorized Ingredient Sourcing: $5,000.00. Total Liquidated Damages Assessed: $8,000.00.'","[Dien dat tuong duong / Paraphrase]:","• $3,000 + $5,000 = Total Liquidated Damages Assessed: $8,000.00.","[Loi giai chi tiet]: Văn bản 2 liệt kê rõ 2 lỗi vi phạm: Lỗi tắt máy lạnh hỏng sữa chua phạt $3,000 + Lỗi tự ý đổi nhà cung ứng dâu tây/dưa lưới phạt $5,000 -> Tổng số tiền phạt bị khấu trừ là $8,000.00.","[Phan tich Phuong an Sai & Bay De thi ETS]:","(A) $1,000.00","- Ly do sai: Đây là mức phạt giao hàng trễ (không bị áp dụng trong vụ này).","- Bay ETS: Bẫy Mức Phạt Không Áp Dụng (Unapplied Penalty Trap)","(B) $3,000.00","- Ly do sai: Đây là số tiền phạt riêng cho lỗi chuỗi lạnh, chưa cộng lỗi nhà cung ứng.","- Bay ETS: Bẫy Số liệu Đơn vị Đơn lẻ (Single Infraction Trap)","(C) $5,000.00","- Ly do sai: Đây là tiền phạt riêng cho lỗi đổi nguồn cung cấp không xin phép.","- Bay ETS: Bẫy Số liệu Bộ phận (Partial Figure Trap)","195. What consequence will NutriClean face if another food violation occurs within 90 days?","Dap an dung: (A) The immediate termination of its catering contract for cause","[Dau vet bai doc / Clue]: Document 2, Paragraph 6: 'any subsequent cold-chain or supplier violation within the next 90 days will trigger immediate contract termination for cause pursuant to Article XIV.'","[Dien dat tuong duong / Paraphrase]:","• trigger immediate contract termination for cause <=> The immediate termination of its catering contract for cause.","[Loi giai chi tiet]: Đoạn cuối của Văn bản 2 cảnh báo đanh thép: nếu xảy ra bất kỳ vi phạm chuỗi lạnh hoặc nhà cung cấp nào tiếp theo trong vòng 90 ngày tới, hợp đồng sẽ bị chấm dứt ngay lập tức do lỗi của nhà thầu ('immediate contract termination for cause').","[Phan tich Phuong an Sai & Bay De thi ETS]:","(B) A mandatory $50,000 corporate surety bond requirement","- Ly do sai: Không có quy định phải nộp tiền bảo lãnh $50,000.","- Bay ETS: Bẫy Bảo lãnh Doanh nghiệp Bịa đặt (Surety Bond Trap)","(C) Permanent revocation of Arthur Pendelton's driver license","- Ly do sai: Khu học chánh không có thẩm quyền tước bằng lái xe cá nhân của giám đốc điều hành.","- Bay ETS: Bẫy Thẩm quyền Xử phạt Cá nhân (Individual Penalty Trap)","(D) The forced conversion of its legal entity into a non-profit","- Ly do sai: Chế tài hợp đồng là hủy hợp đồng kinh tế, không thể ép buộc chuyển đổi loại hình doanh nghiệp.","- Bay ETS: Bẫy Pháp nhân Phi thực tế (Entity Conversion Trap)","PHẦN 4: PHẦN 4: KỸ THUẬT FEYNMAN SONG NGỮ & SƠ ĐỒ QUY TRÌNH (TƯ DUY BA & PHÁP LÝ HỢP ĐỒNG)","4.1. 4.1. Sơ đồ Quy trình Luân chuyển Nghiệp vụ (End-to-End Business Workflow Diagram)",{"t":"table","rows":[[["BƯỚC 1","THANH TRA ĐỘT XUẤT & XUẤT DỮ LIỆU SỐ"],[],["BƯỚC 2","ÁP MỨC PHẠT HỢP ĐỒNG & ĐỐI SOÁT HÓA ĐƠN"],[],["BƯỚC 3","GIẢI NGÂN THANH TOÁN & THIẾT LẬP GIÁM SÁT 90 NGÀY"]],[["• Chung tu & Kenh: Thiết bị Ghi Dữ liệu Nhiệt độ Chuỗi Lạnh & Vận đơn Giao hàng","• Nghiep vu thuc thi: Đo nhiệt độ xe tải #08 (13.5°C) và kiểm tra chứng từ nguồn gốc dâu tây từ nhà bán sỉ chưa phê duyệt.","• Ket qua & Kiem soat: Biên bản kiểm tra an toàn thực phẩm tịch thu 1,200 hộp sữa chua và ghi nhận 2 lỗi vi phạm."],["➔"],["• Chung tu & Kenh: Hợp đồng Suất ăn Thể chế (Article XI) & Bảng Kê Cước Tháng","• Nghiep vu thuc thi: Khấu trừ $3,000 lỗi nhiệt độ + $5,000 lỗi nguồn cung cấp = $8,000 từ hóa đơn tháng 10 trị giá $42,500.","• Ket qua & Kiem soat: Bảng đối soát cấn trừ công nợ xác nhận số tiền thanh toán ròng $34,500."],["➔"],["• Chung tu & Kenh: Cổng Chuyển tiền Điện tử & Quy chế Cảnh báo Hợp đồng","• Nghiep vu thuc thi: Phê duyệt chi trả $34,500 vào ngày 10/11 và ban hành thời hạn 90 ngày thử thách chấm dứt hợp đồng nếu tái phạm.","• Ket qua & Kiem soat: Lệnh thanh toán đã trừ phạt và Hồ sơ cảnh báo hợp đồng (90-Day Probation Notice)."]]]},{"t":"table","rows":[[["STEP 1","SURPRISE AUDIT & DIGITAL TELEMETRY"],[],["STEP 2","PENALTY ASSESSMENT & INVOICE OFFSET"],[],["STEP 3","NET DISBURSEMENT & 90-DAY PROBATION"]],[["• Documents & Channels: Digital Temperature Data-Loggers & Shipping Manifests","• Operational Actions: Detect truck cargo at 13.5°C and audit unapproved strawberry sourcing from Valley Harvest Wholesalers.","• Output Deliverables & Controls: Condemnation protocol disposing of 1,200 dairy units and certified citation of 2 breaches."],["➔"],["• Documents & Channels: Food Catering Contract Article XI & Monthly Billing #INV-10992","• Operational Actions: Apply $3,000 temperature fine plus $5,000 supplier fine = $8,000 penalty against $42,500 invoice.","• Output Deliverables & Controls: Approved Net Payment Voucher of $34,500 with itemized penalty withholding."],["➔"],["• Documents & Channels: Electronic Fund Transfer System & Legal Default Notice","• Operational Actions: Execute $34,500 wire payment on November 10 and institute strict 90-day termination-for-cause probation.","• Output Deliverables & Controls: Executed net payment confirmation and binding Contract Default Warning Record."]]]},"4.2. 4.2. Tư duy Phân tích Nghiệp vụ & Quản trị Hợp đồng (Bản Tiếng Việt)","• Bức tranh Toàn cảnh Hợp đồng & Pháp lý (End-to-End Flow): Trong hợp đồng cung ứng dịch vụ thực phẩm và suất ăn thể chế học đường (Institutional Food Service & Catering Contracts), an toàn vệ sinh thực phẩm và chuỗi lạnh (Cold-Chain Integrity) là nghĩa vụ pháp lý tuyệt đối gắn liền với sức khỏe cộng đồng. Hợp đồng chuyển hóa các rủi ro vận hành thành các khoản Tiền Phạt Vi phạm Định trước (Liquidated Damages) và cơ chế Khấu trừ Trực tiếp trên Hóa đơn (Direct Billing Withholding). Quy trình quản trị tuân thủ gồm: Thanh tra thực địa đột xuất (Unannounced Surprise Audits) -> Kiểm tra nhật ký cảm biến nhiệt độ số (IoT Data-Loggers) và hóa đơn nguồn gốc (Provenance Traceability) -> Lập biên bản tịch thu tiêu hủy thực phẩm không đạt chuẩn -> Kế toán đối soát tự động trừ tiền phạt vào bảng kê cước hàng tháng -> Ban hành tối hậu thư giám sát 90 ngày kèm chế tài hủy hợp đồng ngay lập tức nếu tái phạm.","• Điểm nghẽn & Rủi ro Tranh chấp Thực tế (Core Bottleneck & Risk): Nút thắt là hành vi 'Cắt xén Chi phí Vận hành Lén lút' (Subcontractor Cost-Cutting & Unapproved Substitution). Để tiết kiệm chi phí, nhà thầu vận chuyển thường tự ý tắt máy nén điều hòa thùng xe trong các chặng ngắn hoặc mua nguyên liệu trôi nổi rẻ hơn ngoài danh mục hợp tác xã hữu cơ đã kiểm duyệt. Nếu hợp đồng chỉ quy định nhắc nhở hành chính mà thiếu điều khoản phạt tiền định trước (liquidated damages) trừ thẳng vào kỳ thanh toán, bên thuê dịch vụ sẽ không có công cụ răn đe tài chính tức thì.","• 3 Giải pháp Thiết kế Hệ thống & Kiểm soát Hợp đồng (BA & Legal Compliance Architecture):","(1) Hệ thống Cảm biến Nhiệt độ Chuỗi Lạnh Tự động Truyền dữ liệu (IoT Real-Time Telematics & Cloud Logging): Yêu cầu lắp đặt cảm biến nhiệt độ truyền dữ liệu 4G thời gian thực từ thùng xe về cổng thông tin của nhà trường, tự động cảnh báo còi nếu nhiệt độ vượt ngưỡng 4.0°C trước khi xe đến cổng trường.","(2) Cơ chế Truy xuất Nguồn gốc Nguyên liệu Số hóa (Digital Farm-to-Fork Provenance Barcoding): Bắt buộc mọi kiện hàng giao đến phải có mã QR nguồn gốc xuất xứ liên kết trực tiếp với danh mục hợp tác xã đã được nhà trường cấp phép, từ chối nhận hàng ngay tại cửa kho nếu quét mã không hợp lệ.","(3) Điều khoản Khấu trừ Tự động & Chấm dứt Do Lỗi (Automated Penalty Deduction & 90-Day Knife-Edge Clause): Tích hợp trực tiếp các mức phạt vào phần mềm thanh toán, tự động trừ tiền phạt trước khi giải ngân, kết hợp điều khoản '3 lần vi phạm hoặc 1 lần tái phạm trong 90 ngày' sẽ đơn phương chấm dứt hợp đồng và tịch thu toàn bộ tiền bảo lãnh thực hiện hợp đồng.","4.3. 4.3. Business Analyst & Contract Management Executive Summary (Bản Tiếng Anh)","• End-to-End Contract & Legal Context: In institutional catering and public educational food service procurement, food safety standards and cold-chain compliance are governed by non-negotiable public health mandates. Contracts operationalize operational non-compliance into self-executing Liquidated Damages schedules coupled with direct accounts-payable invoice withholding. The compliance governance workflow encompasses surprise physical gate audits, digital IoT temperature data-logger verification, biological provenance manifest checks, immediate cargo condemnation, automatic penalty offset against monthly billing, and the formal imposition of strict 90-day probationary termination-for-cause covenants.","• Core Operational Bottleneck & Dispute Risk: The central compliance vulnerability is surreptitious contractor cost-cutting. Logistics drivers frequently disengage transport refrigeration compressors during transit to conserve fuel, or procurement managers substitute unvetted wholesale produce for contractually mandated organic cooperatives. Absent pre-stipulated liquidated damages enforceable via direct billing set-off, institutions face protracted evidentiary disputes when proving generalized operational damages.","• Key BA & Contract Compliance Architecture Solutions:","(1) Real-Time IoT Cold-Chain Telemetry: Contractually mandate cellular-connected temperature data-loggers streaming uninterrupted ambient metrics directly to district facilities dashboards, triggering automated rejection alerts if cargo exceeds 4.0°C.","(2) Digitally Validated Agricultural Traceability: Enforce QR-code lot traceability verifying that raw agricultural inputs correlate 1:1 with approved cooperative rosters, preventing unauthorized distributor substitution.","(3) Automated Self-Executing Invoice Set-Off Workflows: Program ERP accounts-payable engines to automatically withhold liquidated penalties from monthly invoices, supported by strict probationary termination clauses upon secondary default.","4.4. 4.4. Tam giác Liên kết Nhận thức Đa chiều (Multi-Perspective Contextual Anchoring)","1. Lăng kính Hợp đồng CNTT / Viễn thông Viettel: Quản trị hợp đồng dịch vụ suất ăn công nghiệp / bếp ăn bán trú cho cán bộ nhân viên tại các khu công nghệ cao Viettel Hòa Lạc / Viettel IDC. Hợp đồng dịch vụ ăn uống luôn quy định nghiêm ngặt: nhà cung cấp phải có chứng nhận nguồn gốc thực phẩm sạch, mẫu thức ăn lưu nghiệm 24h; nếu để xảy ra ngộ độc hoặc vi phạm vệ sinh, Viettel phạt 100 triệu đồng trừ vào hóa đơn và hủy hợp đồng ngay lập tức.","2. Lăng kính Quản trị Trường Mầm non Ước Mơ Xanh (cô Thu Huyền): Hợp đồng cung cấp thực phẩm sạch mầm non: Trường ký hợp đồng với công ty rau sạch và sữa tươi học đường với điều khoản rõ ràng: thực phẩm phải giao trước 6h30 sáng mỗi ngày, thịt cá phải có tem kiểm dịch thú y trong ngày và bảo quản lạnh. Nếu nhà cung cấp giao trễ quá 15 phút hoặc sữa chua bị chảy nước do bảo quản nóng, nhà trường phạt trừ 30% giá trị đơn hàng và đổi nhà cung ứng dự phòng ngay lập tức để bảo vệ sức khỏe của trẻ nhỏ.","3. Lăng kính Bàn học Gia đình (Kèm cặp học sinh Lớp 5 - Bé Hà Ngân): Bài học 'Quy tắc vệ sinh an toàn & Tự giác' (Hygiene & Daily Routine Contract): Hà Ngân và bố mẹ có bản cam kết giữ gìn sức khỏe: 'Rửa tay bằng xà phòng trước khi ăn cơm và sau khi đi học về'. Nếu con luôn tự giác thực hiện đúng giờ, con được mẹ thưởng món ăn yêu thích cuối tuần; nếu vi phạm quy tắc vệ sinh, con bị tạm dừng quyền ăn kem lạnh để bảo vệ đường tiêu hóa và cổ họng.","PHẦN 5: PHẦN 5: TỪ VỰNG & PARAPHRASE CHUYÊN SÂU (CHUẨN 3 DÒNG TỐI ƯU NẠP ANKI)","1. Liquidated Damages  /ˈlɪk.wɪ.deɪ.tɪd ˈdæm.ɪ.dʒɪz/  = Pre-agreed Contractual Breach Penalty Amount","Nghia: Khoản tiền phạt bồi thường thiệt hại được các bên thỏa thuận và ấn định trước trong hợp đồng.","Vd: The school district assessed $8,000 in liquidated damages for cold-chain and sourcing violations. - Khu học chánh đã áp mức phạt $8,000 tiền bồi thường định trước cho các vi phạm chuỗi lạnh và nguồn cung.","2. Cold-Chain Transportation  /kəʊld tʃeɪn ˌtræn.spɔːˈteɪ.ʃən/  = Temperature-Controlled Refrigerated Logistics","Nghia: Quy trình vận chuyển chuỗi lạnh có kiểm soát nhiệt độ nghiêm ngặt cho hàng thực phẩm dễ hỏng.","Vd: Dairy products must be transported via cold-chain transportation maintained at or below 4.0°C. - Các sản phẩm bơ sữa bắt buộc phải được vận chuyển bằng chuỗi lạnh duy trì từ 4.0°C trở xuống.","3. Direct Billing Deduction  /dɪˈrekt ˈbɪl.ɪŋ dɪˈdʌk.ʃən/  = Automated Invoice Withholding / Set-off","Nghia: Khoản tiền phạt được khấu trừ trực tiếp trên hóa đơn thanh toán tiền dịch vụ hàng tháng.","Vd: Contractual penalties were applied as a direct billing deduction against the monthly catering fee. - Các khoản phạt hợp đồng được áp dụng dưới dạng khấu trừ trực tiếp trên hóa đơn tiền ăn hàng tháng.","4. Termination for Cause  /ˌtɜː.mɪˈneɪ.ʃən fɔː kɔːz/  = Immediate Contract Cancellation Due to Default","Nghia: Việc chấm dứt hợp đồng ngay lập tức xuất phát từ hành vi vi phạm nghiêm trọng của một bên.","Vd: A second cold-chain breach within 90 days will trigger immediate termination for cause. - Lần vi phạm chuỗi lạnh thứ hai trong vòng 90 ngày sẽ kích hoạt việc chấm dứt hợp đồng ngay lập tức do lỗi vi phạm.","5. Hazard Analysis Critical Control Point (HACCP)  /ˈhæz.əd əˈnæl.ə.sɪs ˈkrɪt.ɪ.kəl kənˈtrəʊl pɔɪnt/  = Systematic Preventive Food Safety Certification","Nghia: Hệ thống quản lý chất lượng phân tích mối nguy và điểm kiểm soát tới hạn trong an toàn thực phẩm.","Vd: All institutional food catering vendors must maintain active HACCP compliance certification. - Toàn bộ các nhà thầu cung cấp suất ăn thể chế bắt buộc phải duy trì chứng chỉ tuân thủ HACCP còn hiệu lực.","6. Unauthorized Substitution  /ʌnˈɔː.θər.aɪzd ˌsʌb.stɪˈtʃuː.ʃən/  = Unapproved Product or Supplier Replacement","Nghia: Hành vi tự ý tráo đổi hoặc thay thế sản phẩm/nhà cung ứng mà chưa có văn bản chấp thuận.","Vd: The vendor was heavily penalized for unauthorized substitution of unvetted fruit wholesalers. - Nhà cung cấp đã bị phạt nặng vì hành vi tự ý tráo đổi nhà bán sỉ hoa quả chưa qua thẩm định.","7. Condemn and Dispose  /kənˈdem ænd dɪˈspəʊz/  = Declare Unfit for Use and Destroy Officially","Nghia: Tịch thu, tuyên bố không đủ tiêu chuẩn sử dụng và tiêu hủy chính thức lô hàng hỏng.","Vd: Inspectors ordered the school to condemn and dispose of the spoiled dairy shipment immediately. - Các thanh tra viên đã ra lệnh cho nhà trường tịch thu và tiêu hủy ngay lập tức lô hàng sữa bị hỏng.","BÀI 9: Hợp đồng Cấp phép Bản quyền Phần mềm Máy chủ Doanh nghiệp, Kiểm toán Bản quyền Tuân thủ & Thỏa thuận Bổ sung Li-xăng (True-Up Settlement) (Questions 191-195 - Triple Passage)","Nguồn: Nguồn: ETS TOEIC Part 7 — Triple Passage (Software License & Audit Clause, Independent Compliance Audit Findings & True-Up Settlement Notice)","PHẦN 1: PHẦN 1: NỘI DUNG BÀI ĐỌC & DỊCH NGHĨA SONG NGỮ","1.1. 1.1. Đề thi Tiếng Anh gốc (Strategy Guide & Original ETS Passages)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","Questions 191-195 refer to the following three documents.","[Passage 1: Enterprise Software License Agreement (EULA) - Section 12]","Document 1: Enterprise Software License Agreement (EULA) - Section 12","Novus Database Systems - License Compliance and Verification Rights","12.1 License Model: Novus Enterprise Database Server software is licensed strictly under a Per-Core Licensing Architecture. Customer must license every physical or virtual core executing the software, with a minimum of four (4) core licenses per server instance, alongside Client Access Licenses (CALs) for every distinct named user accessing the database.","12.2 Right to Inspect and Audit: Novus reserves the contractual right, upon thirty (30) days prior written notice, to conduct an independent compliance audit of Customer's server infrastructure, cloud clusters, and user registries to verify license compliance. Audits shall be conducted during normal business hours by an independent certified accounting or IT audit firm.","12.3 True-Up and Penalty Thresholds:","- Deficit Under 5%: If audit discrepancies show software usage exceeding licensed capacity by less than 5%, Customer shall remediate the deficiency by purchasing required True-Up licenses at standard commercial contract pricing within thirty (30) days.","- Deficit Exceeding 5%: If unlicensed deployment exceeds licensed capacity by 5% or more, Customer shall pay: (a) 100% of the list price for all unlicensed cores and CALs backdated to the initial date of unauthorized deployment; (b) a 20% compliance surcharge penalty; and (c) the full cost of the independent third-party audit firm.","[Passage 2: Independent IT Compliance Audit Report]","Document 2: Independent IT Compliance Audit Report","KPMG Tech Advisory Services - Enterprise Software License Assurance Group","Target Client: Vantage Media Group LLC (Headquarters: Chicago, IL)","Software Audited: Novus Enterprise Database Server v14.2","Audit Date: September 15 - October 10","Infrastructure Evaluated: Primary Corporate Data Center & Secondary Disaster Recovery (DR) Cloud Cluster","Audit Discovery & Discrepancy Findings:","1. Processor Core Deployments:","- Active Licensed Cores: 64 Core Licenses (Contract #NOV-44910)","- Actual Cores in Production & Standby DR: 80 Cores actively allocated across VMware virtual machines (Over-deployment: +16 Cores / 25.0% deficit).","Finding: Vantage Media added 16 virtual processor cores during their July automated failover DR cluster migration without procuring supplementary licenses.","2. Client Access Licenses (CALs):","- Active Purchased CALs: 500 Named User Licenses","- Active Active-Directory User Accounts Accessing Novus DB: 620 Active Users (Over-deployment: +120 CALs / 24.0% deficit).","Overall Licensing Deficit: 24.5% aggregate over-deployment across core and user tiers.","Audit Costs Incurred by KPMG: $18,500.00.","[Passage 3: Executive True-Up Settlement and Remediation Agreement]","Document 3: Executive True-Up Settlement and Remediation Agreement","Novus Database Systems & Vantage Media Group LLC","October 25","To: Jonathan Hayes, Chief Financial Officer","Vantage Media Group LLC","Chicago, IL","Re: Resolution of Software Audit Findings - Contract #NOV-44910","Dear Mr. Hayes,","Novus Database Systems (\"Novus\") has reviewed the final audit report delivered by KPMG Tech Advisory on October 10 regarding your deployment of Novus Enterprise Database Server v14.2.","Because your aggregate licensing deficit of 24.5% substantially exceeds the 5% contractual threshold established in Section 12.3, Novus is contractually entitled to assess list-price license back-pay, a 20% compliance surcharge ($17,280), and full reimbursement of KPMG's $18,500 audit fee.","However, in recognition of our six-year business relationship and your prompt transparency during the audit, Novus hereby proposes the following amicable True-Up Remediation Terms:","1. True-Up License Purchase: Vantage Media purchases permanent licenses for the 16 additional CPU cores ($3,600/core = $57,600) and 120 Client Access Licenses ($240/CAL = $28,800), totaling $86,400.00 USD.","2. Compromise of Penalties: Novus completely waives the 20% compliance surcharge penalty ($17,280 waived).","3. Audit Cost Sharing: Vantage Media agrees to reimburse 50% of KPMG's audit fee ($9,250.00).","Total Consolidated Settlement Payable: $95,650.00 USD (due November 30).","Upon receipt of $95,650.00, Novus will issue updated digital license certificates and grant a full release from all audit claims through October 2026.","Sincerely,","Victoria Sterling, Vice President of Global Licensing, Novus Database Systems","ACCEPTED: Jonathan Hayes, CFO, Vantage Media Group LLC (Date: October 29)","[ORIGINAL ETS QUESTIONS - CAU HOI TIENG ANH GOC]:","191. Under Section 12.1, how is the Novus Enterprise Database Server licensed?","(A) Through an unlimited flat-rate corporate site license","(B) Based on the number of processor cores and named user access licenses","(C) According to monthly gigabytes of data downloaded","(D) On an annual subscription fee per physical building location","192. What was discovered during KPMG's independent IT audit of Vantage Media?","(A) The database had been hacked by foreign ransomware operators.","(B) Vantage Media under-utilized its software and was owed a cash refund.","(C) Sixteen extra processor cores and 120 extra users exceeded licensed capacity.","(D) KPMG was denied access to primary corporate data center racks.","193. What percentage over-deployment triggered Section 12.3's strict penalty clause?","(A) 4.0%","(B) 5.0%","(C) 20.0%","(D) 24.5%","194. In Document 3, what concession did Novus Database Systems make?","(A) It waived the entire 20% compliance surcharge penalty.","(B) It provided 16 CPU core licenses completely free of charge.","(C) It extended Vantage Media's payment deadline by eighteen months.","(D) It agreed to absorb 100% of KPMG's third-party audit expenses.","195. What is the total consolidated payment Vantage Media must remit by November 30?","(A) $17,280.00","(B) $57,600.00","(C) $86,400.00","(D) $95,650.00","1.2. 1.2. Hướng dẫn làm bài Part 7: Chiến lược 5 phút tối ưu, Ghép nối Dữ kiện & Tóm tắt Feynman","[5-MINUTE STRATEGY GUIDE - CHIEN THUAT 5 PHUT]:","CHIẾN LƯỢC 5 PHÚT TỐI ƯU PART 7 (ÁP DỤNG BÀI ĐỌC BA VĂN BẢN KIỂM TOÁN BẢN QUYỀN PHẦN MỀM & THỎA THUẬN TRUE-UP):","Bước 1 (30 giây) - Nắm bắt Bối cảnh & Luồng sự việc (Quỹ đạo chữ Z & 3 Câu hỏi Tiềm thức):","• Quét VB1: Hợp đồng EULA của Novus Database -> Tính phí theo Core và CAL; được quyền kiểm toán báo trước 30 ngày; nếu dùng quá dưới 5% chỉ cần mua bổ sung (True-up); nếu vượt quá >= 5% phải thanh toán 100% bản quyền thiếu + phạt 20% + chịu toàn bộ phí kiểm toán.","• Quét VB2: Báo cáo kiểm toán của KPMG tại Vantage Media -> Đã mua 64 Cores / 500 CALs, thực tế dùng 80 Cores / 620 CALs (vượt 24.5%) do mở rộng cụm dự phòng thảm họa DR; phí kiểm toán KPMG $18,500.","• Quét VB3: Thỏa thuận dàn xếp hòa giải ngày 25/10 -> Novus yêu cầu mua bù $86,400 tiền bản quyền ($57,600 Cores + $28,800 CALs), miễn 100% phí phạt 20% ($17,280), giảm 50% phí kiểm toán ($9,250) -> Tổng tiền thanh toán dứt điểm là $95,650 trước ngày 30/11.","Bước 2 (20 giây) - Quét 5 Câu hỏi & Gắn Móc Từ khóa:","• Câu 191: Mô hình cấp phép ở VB1 (Section 12.1 -> Per-Core Licensing & CALs).","• Câu 192: Phát hiện kiểm toán ở VB2 (extra 16 processor cores and 120 CALs).","• Câu 193: Tỷ lệ vượt mức tổng thể ở VB2 (Overall Licensing Deficit -> 24.5%).","• Câu 194: Nhượng bộ của Novus ở VB3 (waived entire 20% compliance surcharge penalty).","• Câu 195: Tổng số tiền thanh toán trước 30/11 ở VB3 (Total Consolidated Settlement -> $95,650.00).","Bước 3 (3 phút 45 giây) - Giải quyết Cuốn chiếu & Dấu vết Tìm nhanh:","• Câu 191 (Mô hình bản quyền): Đọc Section 12.1 VB1: 'licensed strictly under a Per-Core Licensing Architecture... alongside Client Access Licenses (CALs)' -> Chọn (B).","• Câu 192 (Phát hiện kiểm toán): Đọc VB2 mục 1 & 2: Dùng thêm +16 Cores và +120 CALs người dùng -> Chọn (C).","• Câu 193 (Số liệu phần trăm): VB2 dòng tổng kết: 'Overall Licensing Deficit: 24.5% aggregate over-deployment' (lớn hơn ngưỡng 5%) -> Chọn (D).","• Câu 194 (Điều khoản nhân nhượng): Đọc Term 2 ở VB3: 'Compromise of Penalties: Novus completely waives the 20% compliance surcharge penalty ($17,280 waived)' -> Miễn toàn bộ khoản phạt tuân thủ 20% -> Chọn (A).","• Câu 195 (Ghép nối tổng tiền quyết toán): VB3 tính toán: $86,400 (bản quyền) + $9,250 (50% phí KPMG) = $95,650.00 -> Chọn (D).","Bước 4 (25 giây) - Khóa sổ Đáp án & Tóm tắt Feynman 1 câu:","• Rà soát khóa đáp án: 191-B, 192-C, 193-D, 194-A, 195-D.","• Đúc kết Feynman: 'Công ty truyền thông bị hãng kiểm toán phát hiện dùng lố 16 vi xử lý và 120 tài khoản cơ sở dữ liệu khi mở rộng hệ thống dự phòng, hãng phần mềm nhân nhượng miễn khoản phạt 20% và chia đôi tiền thuê kiểm toán, khách hàng đồng ý nộp $95,650 mua bổ sung bản quyền hợp lệ.'","1.3. 1.3. Bản dịch Song ngữ Từng câu (Sentence-by-Sentence Translation)","[SENTENCE-BY-SENTENCE BILINGUAL TRANSLATION - BAN DICH SONG NGU TUNG CAU]:","[Văn bản 1: Hợp đồng Cấp phép Bản quyền Phần mềm Doanh nghiệp (EULA) - Điều khoản 12]","Document 1: Enterprise Software License Agreement (EULA) - Section 12","Novus Database Systems - License Compliance and Verification Rights","Văn bản 1: Hợp đồng Cấp phép Bản quyền Người dùng Cuối Doanh nghiệp (EULA) - Điều khoản 12","Hệ thống Cơ sở Dữ liệu Novus - Quyền Kiểm tra & Tuân thủ Bản quyền","12.1 License Model: Novus Enterprise Database Server software is licensed strictly under a Per-Core Licensing Architecture.","12.1 Mô hình Bản quyền: Phần mềm Máy chủ Cơ sở Dữ liệu Doanh nghiệp Novus được cấp phép nghiêm ngặt theo Kiến trúc Bản quyền Theo Lõi Vi xử lý (Per-Core Licensing).","Customer must license every physical or virtual core executing the software, with a minimum of four (4) core licenses per server instance, alongside Client Access Licenses (CALs) for every distinct named user accessing the database.","Khách hàng phải mua bản quyền cho mọi lõi vi xử lý vật lý hoặc ảo hóa thực thi phần mềm, với mức tối thiểu bốn (4) bản quyền lõi cho mỗi phiên bản máy chủ, song song với Giấy phép Truy cập Máy trạm (CALs) cho từng người dùng định danh riêng biệt truy cập vào cơ sở dữ liệu.","12.2 Right to Inspect and Audit: Novus reserves the contractual right, upon thirty (30) days prior written notice, to conduct an independent compliance audit of Customer's server infrastructure, cloud clusters, and user registries to verify license compliance.","12.2 Quyền Kiểm tra và Kiểm toán: Novus bảo lưu quyền theo hợp đồng, sau khi gửi thông báo trước bằng văn bản ba mươi (30) ngày, được tiến hành một cuộc kiểm toán tuân thủ độc lập đối với hạ tầng máy chủ, các cụm đám mây và sổ đăng ký người dùng của Khách hàng để xác minh tính tuân thủ bản quyền.","Audits shall be conducted during normal business hours by an independent certified accounting or IT audit firm.","Các cuộc kiểm toán sẽ được thực hiện trong giờ làm việc thông thường bởi một công ty kiểm toán CNTT hoặc công ty kế toán độc lập có chứng chỉ.","12.3 True-Up and Penalty Thresholds: Deficit Under 5%: If audit discrepancies show software usage exceeding licensed capacity by less than 5%, Customer shall remediate the deficiency by purchasing required True-Up licenses at standard commercial contract pricing within thirty (30) days.","12.3 Các Ngưỡng Mua Bổ sung (True-Up) và Xử phạt: Mức Vượt dưới 5%: Nếu sai lệch kiểm toán cho thấy việc sử dụng phần mềm vượt quá dung lượng đã cấp phép dưới 5%, Khách hàng sẽ khắc phục thiếu sót bằng cách mua các bản quyền bổ sung True-Up theo giá hợp đồng thương mại tiêu chuẩn trong vòng ba mươi (30) ngày.","Deficit Exceeding 5%: If unlicensed deployment exceeds licensed capacity by 5% or more, Customer shall pay: (a) 100% of the list price for all unlicensed cores and CALs backdated to the initial date of unauthorized deployment; (b) a 20% compliance surcharge penalty; and (c) the full cost of the independent third-party audit firm.","Mức Vượt Quá 5% trở lên: Nếu việc triển khai không phép vượt quá dung lượng được cấp phép từ 5% trở lên, Khách hàng sẽ phải thanh toán: (a) 100% nguyên giá niêm yết cho toàn bộ các lõi và CAL không có bản quyền tính hồi tố từ ngày đầu tiên triển khai trái phép; (b) khoản tiền phạt phụ thu tuân thủ 20%; và (c) toàn bộ chi phí thuê công ty kiểm toán độc lập bên thứ ba.","[Văn bản 2: Báo cáo Kết quả Kiểm toán Tuân thủ Công nghệ Thông tin Độc lập]","Document 2: Independent IT Compliance Audit Report","KPMG Tech Advisory Services - Enterprise Software License Assurance Group","Văn bản 2: Báo cáo Kết quả Kiểm toán Tuân thủ CNTT Độc lập","Dịch vụ Tư vấn Công nghệ KPMG - Nhóm Đảm bảo Bản quyền Phần mềm Doanh nghiệp","Target Client: Vantage Media Group LLC (Headquarters: Chicago, IL). Software Audited: Novus Enterprise Database Server v14.2. Audit Date: September 15 - October 10. Infrastructure Evaluated: Primary Corporate Data Center & Secondary Disaster Recovery (DR) Cloud Cluster.","Khách hàng Mục tiêu: Vantage Media Group LLC (Trụ sở chính: Chicago, IL). Phần mềm Được Kiểm toán: Máy chủ Cơ sở Dữ liệu Doanh nghiệp Novus phiên bản v14.2. Thời gian Kiểm toán: 15 tháng 9 - 10 tháng 10. Hạ tầng Được Đánh giá: Trung tâm Dữ liệu Doanh nghiệp Chính & Cụm Đám mây Phục hồi Thảm họa (DR) Thứ cấp.","Audit Discovery & Discrepancy Findings: 1. Processor Core Deployments: Active Licensed Cores: 64 Core Licenses (Contract #NOV-44910). Actual Cores in Production & Standby DR: 80 Cores actively allocated across VMware virtual machines (Over-deployment: +16 Cores / 25.0% deficit).","Phát hiện Kiểm toán & Sai lệch: 1. Triển khai Lõi Vi xử lý: Số Lõi Được Cấp phép Hợp lệ: 64 Bản quyền Lõi (Hợp đồng #NOV-44910). Số Lõi Thực tế Vận hành & Dự phòng DR: 80 Lõi được phân bổ hoạt động trên các máy ảo VMware (Sử dụng vượt: +16 Lõi / vượt 25.0%).","Finding: Vantage Media added 16 virtual processor cores during their July automated failover DR cluster migration without procuring supplementary licenses.","Phát hiện: Vantage Media đã bổ sung thêm 16 lõi xử lý ảo trong quá trình chuyển đổi cụm DR dự phòng tự động vào tháng 7 mà không mua bổ sung bản quyền.","2. Client Access Licenses (CALs): Active Purchased CALs: 500 Named User Licenses. Actual Active-Directory User Accounts Accessing Novus DB: 620 Active Users (Over-deployment: +120 CALs / 24.0% deficit).","2. Giấy phép Truy cập Máy trạm (CALs): Số CAL Hợp lệ Đã Mua: 500 Bản quyền Người dùng Định danh. Số Tài khoản Người dùng Thực tế Truy cập DB qua Active-Directory: 620 Người dùng Hoạt động (Sử dụng vượt: +120 CAL / vượt 24.0%).","Overall Licensing Deficit: 24.5% aggregate over-deployment across core and user tiers. Audit Costs Incurred by KPMG: $18,500.00.","Mức Thiếu hụt Bản quyền Tổng thể: Vượt mức tổng hợp 24.5% trên cả hai cấp độ lõi xử lý và người dùng. Chi phí Kiểm toán Phát sinh của KPMG: $18,500.00.","[Văn bản 3: Thỏa thuận Dàn xếp Khắc phục Bổ sung Bản quyền (True-Up Settlement)]","Document 3: Executive True-Up Settlement and Remediation Agreement","Novus Database Systems & Vantage Media Group LLC","Văn bản 3: Thỏa thuận Dàn xếp Hòa giải & Bổ sung Bản quyền Cấp Điều hành","Hệ thống Cơ sở Dữ liệu Novus & Vantage Media Group LLC","October 25. To: Jonathan Hayes, Chief Financial Officer, Vantage Media Group LLC, Chicago, IL. Re: Resolution of Software Audit Findings - Contract #NOV-44910.","Ngày 25 tháng 10. Kính gửi: Jonathan Hayes, Giám đốc Tài chính, Vantage Media Group LLC, Chicago, IL. V/v: Giải quyết Kết quả Kiểm toán Bản quyền Phần mềm - Hợp đồng số #NOV-44910.","Dear Mr. Hayes, Novus Database Systems (\"Novus\") has reviewed the final audit report delivered by KPMG Tech Advisory on October 10 regarding your deployment of Novus Enterprise Database Server v14.2.","Kính gửi Ông Hayes, Novus Database Systems (\"Novus\") đã xem xét báo cáo kiểm toán cuối cùng do KPMG Tech Advisory bàn giao vào ngày 10 tháng 10 liên quan đến việc triển khai Máy chủ Cơ sở Dữ liệu Doanh nghiệp Novus v14.2 của quý công ty.","Because your aggregate licensing deficit of 24.5% substantially exceeds the 5% contractual threshold established in Section 12.3, Novus is contractually entitled to assess list-price license back-pay, a 20% compliance surcharge ($17,280), and full reimbursement of KPMG's $18,500 audit fee.","Bởi vì mức sử dụng vượt tổng thể 24.5% của quý công ty vượt quá đáng kể ngưỡng hợp đồng 5% được quy định tại Khoản 12.3, Novus hoàn toàn có quyền theo hợp đồng để truy thu nguyên giá bản quyền hồi tố, khoản tiền phạt phụ thu tuân thủ 20% ($17,280) và đòi bồi hoàn toàn bộ chi phí kiểm toán $18,500 của KPMG.","However, in recognition of our six-year business relationship and your prompt transparency during the audit, Novus hereby proposes the following amicable True-Up Remediation Terms: 1. True-Up License Purchase: Vantage Media purchases permanent licenses for the 16 additional CPU cores ($3,600/core = $57,600) and 120 Client Access Licenses ($240/CAL = $28,800), totaling $86,400.00 USD.","Tuy nhiên, để ghi nhận mối quan hệ hợp tác kinh doanh sáu năm giữa hai bên và sự minh bạch hợp tác kịp thời của quý công ty trong suốt cuộc kiểm toán, Novus theo đây đề xuất Các Điều khoản Dàn xếp Bổ sung Bản quyền (True-Up) Hòa giải sau: 1. Mua Bổ sung Bản quyền True-Up: Vantage Media mua bản quyền vĩnh viễn cho 16 lõi CPU bổ sung ($3,600/lõi = $57,600) và 120 Giấy phép Truy cập Máy trạm CAL ($240/CAL = $28,800), tổng cộng là $86,400.00 USD.","2. Compromise of Penalties: Novus completely waives the 20% compliance surcharge penalty ($17,280 waived). 3. Audit Cost Sharing: Vantage Media agrees to reimburse 50% of KPMG's audit fee ($9,250.00).","2. Nhượng bộ Tiền phạt: Novus miễn giảm hoàn toàn 100% khoản tiền phạt phụ thu tuân thủ 20% (miễn giảm $17,280). 3. Chia sẻ Chi phí Kiểm toán: Vantage Media đồng ý chi trả 50% chi phí kiểm toán của KPMG ($9,250.00).","Total Consolidated Settlement Payable: $95,650.00 USD (due November 30). Upon receipt of $95,650.00, Novus will issue updated digital license certificates and grant a full release from all audit claims through October 2026.","Tổng Số tiền Quyết toán Hòa giải Hợp nhất Phải nộp: $95,650.00 USD (Hạn nộp ngày 30 tháng 11). Khi nhận đủ số tiền $95,650.00, Novus sẽ cấp các chứng chỉ bản quyền số cập nhật và cấp văn bản bãi nại toàn bộ đối với các khiếu nại kiểm toán cho đến tháng 10 năm 2026.","Sincerely, Victoria Sterling, Vice President of Global Licensing, Novus Database Systems. ACCEPTED: Jonathan Hayes, CFO, Vantage Media Group LLC (Date: October 29).","Trân trọng, Victoria Sterling, Phó Chủ tịch Bản quyền Toàn cầu, Novus Database Systems. CHẤP THUẬN: Jonathan Hayes, Giám đốc Tài chính, Vantage Media Group LLC (Ngày: 29 tháng 10).","1.4. 1.4. Dịch chi tiết Câu hỏi & Phương án Trắc nghiệm","[TRANSLATED QUESTIONS & OPTIONS - CAU HOI VA DAP AN DICH NGHIA]:","Câu 191. Theo Khoản 12.1, phần mềm Máy chủ Cơ sở Dữ liệu Doanh nghiệp Novus được cấp phép bản quyền như thế nào?","(A) Thông qua một bản quyền doanh nghiệp trọn gói cố định không giới hạn.","(B) Căn cứ trên số lượng lõi vi xử lý và giấy phép truy cập của người dùng định danh.","(C) Theo dung lượng dữ liệu tải xuống hàng tháng tính bằng gigabyte.","(D) Dựa trên phí thuê bao hàng năm tính theo từng địa điểm tòa nhà vật lý.","Câu 192. Điều gì đã được phát hiện trong cuộc kiểm toán CNTT độc lập của KPMG tại Vantage Media?","(A) Cơ sở dữ liệu đã bị tin tặc tấn công mã hóa tống tiền từ nước ngoài.","(B) Vantage Media đã sử dụng phần mềm dưới mức cho phép và được hoàn lại tiền mặt.","(C) Mười sáu lõi xử lý bổ sung và 120 người dùng vượt quá dung lượng bản quyền được cấp.","(D) KPMG đã bị từ chối cấp quyền tiếp cận các tủ máy chủ tại trung tâm dữ liệu chính.","Câu 193. Tỷ lệ sử dụng vượt mức nào đã kích hoạt điều khoản phạt nghiêm ngặt của Điều khoản 12.3?","(A) 4.0%","(B) 5.0%","(C) 20.0%","(D) 24.5%","Câu 194. Trong Văn bản 3, Novus Database Systems đã đưa ra sự nhượng bộ nào?","(A) Miễn giảm toàn bộ 100% khoản tiền phạt phụ thu tuân thủ 20%.","(B) Cung cấp miễn phí hoàn toàn 16 bản quyền lõi CPU.","(C) Gia hạn thời hạn thanh toán của Vantage Media thêm mười tám tháng.","(D) Đồng ý tự gánh chịu 100% toàn bộ chi phí kiểm toán của KPMG.","Câu 195. Tổng số tiền hợp nhất mà Vantage Media bắt buộc phải nộp trước ngày 30 tháng 11 là bao nhiêu?","(A) $17,280.00","(B) $57,600.00","(C) $86,400.00","(D) $95,650.00","1.5. 1.5. Tóm tắt Viết lại Toàn bài theo Feynman (Feynman Monograph Summary)","[EXECUTIVE SUMMARY & CORE LOGIC - BAN TOM TAT COT LOI]:","English Executive Summary:","• Software Licensing Audit Rules: Novus Database Systems licenses software per core plus CALs, retaining audit rights (30 days notice); non-compliance under 5% allows standard True-Up purchasing, while deficits ≥5% trigger list-price back-pay, a 20% penalty surcharge, and full audit expenses.","• KPMG Audit Findings: A formal audit of Vantage Media revealed an overall 24.5% licensing deficit (+16 virtual CPU cores and +120 CAL users deployed without licenses during a July disaster recovery migration), alongside $18,500 in KPMG audit fees.","• True-Up Settlement Concessions: In an amicable settlement on October 25, Novus required $86,400 for true-up licenses ($57.6k cores + $28.8k CALs) and 50% audit fee sharing ($9,250), while completely waiving the 20% penalty ($17,280), closing the dispute for $95,650 due November 30.","Bản tóm tắt Tiếng Việt cốt lõi:","• Quy chuẩn Kiểm toán Bản quyền: Novus cấp phép phần mềm theo số lõi CPU kết hợp giấy phép truy cập CALs, bảo lưu quyền kiểm toán định kỳ (báo trước 30 ngày); nếu dùng lố dưới 5% chỉ mua bổ sung (True-up), nhưng nếu vượt ≥5% sẽ bị phạt thêm 20% và chịu toàn bộ phí kiểm toán.","• Kết quả Kiểm toán Độc lập của KPMG: Đợt rà soát hạ tầng tại Vantage Media phát hiện tỷ lệ vượt mức tổng thể 24.5% (+16 lõi CPU ảo và +120 người dùng không phép phát sinh trong đợt chuyển đổi cụm máy chủ dự phòng DR), cùng chi phí kiểm toán của KPMG là $18,500.","• Thỏa thuận Dàn xếp Hòa giải: Để duy trì quan hệ đối tác 6 năm, Novus miễn 100% khoản phạt $17,280 và giảm 50% phí kiểm toán ($9,250), yêu cầu Vantage Media nộp $86,400 mua bổ sung bản quyền hợp lệ, tổng cộng thanh toán dứt điểm $95,650 trước ngày 30/11.","PHẦN 2: PHẦN 2: ACTIVE RECALL 5 GIÂY (BẢNG MA TRẬN ĐỊNH VỊ SONG NGỮ)",{"t":"table","rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong & Vai tro"],["Hãng Phần mềm / Bên Cấp phép: Novus Database Systems (Victoria Sterling). Khách hàng Doanh nghiệp / Bên Mua: Vantage Media Group LLC (CFO Jonathan Hayes). Đơn vị Kiểm toán Độc lập: KPMG Tech Advisory Services.","Software Licensor: Novus Database Systems (VP Victoria Sterling). Enterprise Licensee: Vantage Media Group LLC (CFO Jonathan Hayes). Independent Audit Firm: KPMG Tech Advisory Services."]],[["2. Boi canh & Quy trinh loi"],["Mô hình cấp phép theo Core CPU + CAL. Kiểm toán phát hiện dùng vượt 24.5% (thêm 16 CPU cores và 120 CALs ở cụm máy chủ dự phòng thảm họa DR). Vượt quá ngưỡng 5% nên theo hợp đồng bị phạt thêm 20% phí vi phạm và chịu phí kiểm toán $18,500.","Per-Core + CAL licensing model. KPMG audit revealed 24.5% deficit (unlicensed 16 CPU cores & 120 CALs on DR cluster). Exceeding the 5% threshold contractually triggers full back-pay, a 20% penalty surcharge, and $18,500 audit fee reimbursement."]],[["3. Dau vet suy luan cheo"],["Quyết toán hòa giải (True-Up Compromise): Novus miễn 100% khoản phạt 20% ($17,280), chỉ thu tiền mua bổ sung bản quyền $86,400 + 50% phí kiểm toán $9,250 = Tổng cộng $95,650 thanh toán trước ngày 30/11 để được cấp chứng chỉ hợp lệ.","True-up settlement reconciliation: Novus waived the 20% penalty ($17,280), billing only $86,400 for new licenses plus $9,250 (50% KPMG audit costs) = Total consolidated payout $95,650 due November 30."]]]},"PHẦN 3: PHẦN 3: ĐÁP ÁN CHUẨN XÁC & DẤU VẾT TRUY XUẤT CHÉO (CROSS-REFERENCING & COMPREHENSIVE TRAP BREAKDOWN)","191. Under Section 12.1, how is the Novus Enterprise Database Server licensed?","Dap an dung: (B) Based on the number of processor cores and named user access licenses","[Dau vet bai doc / Clue]: Document 1, Section 12.1: 'licensed strictly under a Per-Core Licensing Architecture. Customer must license every physical or virtual core... alongside Client Access Licenses (CALs) for every distinct named user...'","[Dien dat tuong duong / Paraphrase]:","• Per-Core Licensing Architecture alongside Client Access Licenses for named users <=> Based on the number of processor cores and named user access licenses.","[Loi giai chi tiet]: Điều khoản 12.1 của Hợp đồng EULA quy định rõ ràng rằng phần mềm máy chủ cơ sở dữ liệu Novus được cấp phép nghiêm ngặt theo số lượng lõi vi xử lý vật lý/ảo hóa (Per-Core) kết hợp với giấy phép truy cập máy trạm theo người dùng định danh (CALs).","[Phan tich Phuong an Sai & Bay De thi ETS]:","(A) Through an unlimited flat-rate corporate site license","- Ly do sai: Hợp đồng tính tiền theo từng lõi và từng người dùng, không phải gói trọn gói không giới hạn.","- Bay ETS: Bẫy Bản quyền Không giới hạn (Unlimited Site License Trap)","(C) According to monthly gigabytes of data downloaded","- Ly do sai: Không hề có điều khoản nào tính phí bản quyền theo dung lượng gigabyte tải về.","- Bay ETS: Bẫy Đo lường Dung lượng Dữ liệu (Bandwidth Consumption Trap)","(D) On an annual subscription fee per physical building location","- Ly do sai: Cấp phép theo kiến trúc máy tính (Core/CAL), không tính theo số lượng tòa nhà văn phòng.","- Bay ETS: Bẫy Địa điểm Tòa nhà (Physical Site Trap)","192. What was discovered during KPMG's independent IT audit of Vantage Media?","Dap an dung: (C) Sixteen extra processor cores and 120 extra users exceeded licensed capacity.","[Dau vet bai doc / Clue]: Document 2: '1. Processor Core Deployments: Over-deployment: +16 Cores... 2. Client Access Licenses: Over-deployment: +120 CALs / 24.0% deficit.'","[Dien dat tuong duong / Paraphrase]:","• +16 Cores and +120 CALs over-deployment <=> Sixteen extra processor cores and 120 extra users exceeded licensed capacity.","[Loi giai chi tiet]: Báo cáo kiểm toán của KPMG ở Văn bản 2 phát hiện sai lệch rõ ràng: Vantage Media đã triển khai vượt quá dung lượng được cấp phép 16 lõi vi xử lý ảo và 120 tài khoản người dùng truy cập.","[Phan tich Phuong an Sai & Bay De thi ETS]:","(A) The database had been hacked by foreign ransomware operators.","- Ly do sai: Không có cuộc tấn công mạng hay mã độc tống tiền nào; đây là kiểm toán bản quyền phần mềm.","- Bay ETS: Bẫy An ninh mạng Bịa đặt (Ransomware Distortion Trap)","(B) Vantage Media under-utilized its software and was owed a cash refund.","- Ly do sai: Khách hàng sử dụng vượt mức cấp phép (thiếu bản quyền), không phải dùng dưới mức để được hoàn tiền.","- Bay ETS: Bẫy Nói Ngược Thực tế (Reversed Usage Trap)","(D) KPMG was denied access to primary corporate data center racks.","- Ly do sai: Vantage Media hoàn toàn hợp tác minh bạch cho kiểm tra toàn bộ cụm máy chủ chính và phụ.","- Bay ETS: Bẫy Cản trở Kiểm toán Bịa đặt (Audit Obstruction Trap)","193. What percentage over-deployment triggered Section 12.3's strict penalty clause?","Dap an dung: (D) 24.5%","[Dau vet bai doc / Clue]: Document 2: 'Overall Licensing Deficit: 24.5% aggregate over-deployment across core and user tiers.' Document 3: 'Because your aggregate licensing deficit of 24.5% substantially exceeds the 5% contractual threshold...'","[Dien dat tuong duong / Paraphrase]:","• aggregate licensing deficit of 24.5% exceeding 5% threshold <=> 24.5% percentage over-deployment.","[Loi giai chi tiet]: Văn bản 2 và Văn bản 3 ghi nhận tỷ lệ thiếu hụt bản quyền tổng thể là 24.5%, vượt xa ngưỡng 5% quy định tại Khoản 12.3 và kích hoạt các chế tài phạt tài chính nghiêm ngặt.","[Phan tich Phuong an Sai & Bay De thi ETS]:","(A) 4.0%","- Ly do sai: 4 là số lượng lõi tối thiểu cho một máy chủ, không phải tỷ lệ vi phạm.","- Bay ETS: Bẫy Nhầm lẫn Quy cách Lõi Tối thiểu (Minimum Core Trap)","(B) 5.0%","- Ly do sai: 5.0% là ngưỡng giới hạn hợp đồng để phân biệt mức phạt nhẹ và mức phạt nặng.","- Bay ETS: Bẫy Ngưỡng Hợp đồng (Threshold Trap)","(C) 20.0%","- Ly do sai: 20% là mức phạt phụ thu tuân thủ (compliance surcharge penalty), không phải tỷ lệ dùng vượt.","- Bay ETS: Bẫy Tỷ lệ Tiền phạt (Penalty Percentage Trap)","194. In Document 3, what concession did Novus Database Systems make?","Dap an dung: (A) It waived the entire 20% compliance surcharge penalty.","[Dau vet bai doc / Clue]: Document 3, Remediation Terms, Item 2: 'Compromise of Penalties: Novus completely waives the 20% compliance surcharge penalty ($17,280 waived).'","[Dien dat tuong duong / Paraphrase]:","• Novus completely waives the 20% compliance surcharge penalty <=> It waived the entire 20% compliance surcharge penalty.","[Loi giai chi tiet]: Văn bản 3 nêu rõ sự nhượng bộ lớn của Novus nhằm duy trì quan hệ kinh doanh 6 năm: Novus đồng ý miễn giảm hoàn toàn 100% khoản tiền phạt phụ thu tuân thủ 20% (tiết kiệm cho khách hàng $17,280).","[Phan tich Phuong an Sai & Bay De thi ETS]:","(B) It provided 16 CPU core licenses completely free of charge.","- Ly do sai: Vantage Media vẫn phải thanh toán đủ $57,600 để mua 16 bản quyền lõi CPU này.","- Bay ETS: Bẫy Miễn phí Bản quyền Ảo (Free License Trap)","(C) It extended Vantage Media's payment deadline by eighteen months.","- Ly do sai: Hạn thanh toán là ngày 30/11 cùng năm (trong vòng 1 tháng), không phải 18 tháng.","- Bay ETS: Bẫy Gia hạn Thời hạn Ảo (Extension Trap)","(D) It agreed to absorb 100% of KPMG's third-party audit expenses.","- Ly do sai: Novus chỉ chia sẻ 50% chi phí kiểm toán, yêu cầu Vantage Media trả $9,250 (50% còn lại).","- Bay ETS: Bẫy Hấp thu Toàn bộ Chi phí (Full Absorption Trap)","195. What is the total consolidated payment Vantage Media must remit by November 30?","Dap an dung: (D) $95,650.00","[Dau vet bai doc / Clue]: Document 3, Paragraph 5: 'Total Consolidated Settlement Payable: $95,650.00 USD (due November 30). Upon receipt of $95,650.00, Novus will issue updated digital license certificates...'","[Dien dat tuong duong / Paraphrase]:","• Total Consolidated Settlement Payable: $95,650.00 USD <=> Total consolidated payment is $95,650.00.","[Loi giai chi tiet]: Đoạn cuối của Văn bản 3 chốt con số thanh toán dứt điểm cuối cùng là $95,650.00 USD (bao gồm $86,400 tiền bản quyền bổ sung + $9,250 chia sẻ chi phí kiểm toán của KPMG).","[Phan tich Phuong an Sai & Bay De thi ETS]:","(A) $17,280.00","- Ly do sai: Đây là số tiền phạt 20% đã được Novus miễn trừ.","- Bay ETS: Bẫy Tiền phạt Được Miễn (Waived Penalty Trap)","(B) $57,600.00","- Ly do sai: Đây là tiền mua 16 lõi CPU, chưa tính tiền 120 CALs và phí kiểm toán.","- Bay ETS: Bẫy Chi phí Lõi Đơn lẻ (Core-only Cost Trap)","(C) $86,400.00","- Ly do sai: Đây là tổng tiền mua bản quyền ($57.6k + $28.8k), chưa cộng $9,250 phí kiểm toán.","- Bay ETS: Bẫy Tổng Tiền Bản quyền Chưa cộng Phí (License-only Sum Trap)","PHẦN 4: PHẦN 4: KỸ THUẬT FEYNMAN SONG NGỮ & SƠ ĐỒ QUY TRÌNH (TƯ DUY BA & PHÁP LÝ HỢP ĐỒNG)","4.1. 4.1. Sơ đồ Quy trình Luân chuyển Nghiệp vụ (End-to-End Business Workflow Diagram)",{"t":"table","rows":[[["BƯỚC 1","THÔNG BÁO & KIỂM TOÁN HẠ TẦNG IT"],[],["BƯỚC 2","ĐỐI CHIẾU NGƯỠNG PHẠT & ĐÀM PHÁN TRUE-UP"],[],["BƯỚC 3","THANH TOÁN HỢP NHẤT & CẤP CHỨNG CHỈ HỢP LỆ"]],[["• Chung tu & Kenh: Hợp đồng EULA (Section 12) & Công cụ Quét Bản quyền KPMG","• Nghiep vu thuc thi: Novus gửi thông báo trước 30 ngày; KPMG quét VMware phát hiện dùng vượt 16 lõi CPU và 120 CALs (24.5%).","• Ket qua & Kiem soat: Báo cáo kiểm toán tuân thủ bản quyền độc lập (Independent IT Audit Report)."],["➔"],["• Chung tu & Kenh: Khung Pháp lý EULA & Thỏa thuận Hòa giải Cấp Điều hành","• Nghiep vu thuc thi: Vượt ngưỡng 5% kích hoạt phạt 20%; Novus đồng ý miễn phạt $17,280 và chia đôi phí kiểm toán để giữ quan hệ.","• Ket qua & Kiem soat: Biên bản thỏa thuận khắc phục bổ sung bản quyền (True-Up Settlement Agreement)."],["➔"],["• Chung tu & Kenh: Hệ thống Ngân hàng Doanh nghiệp & Cổng Bản quyền Novus","• Nghiep vu thuc thi: Vantage Media chuyển khoản $95,650 trước ngày 30/11; Novus cập nhật chứng chỉ số hợp lệ 100%.","• Ket qua & Kiem soat: Chứng chỉ bản quyền vĩnh viễn đã cập nhật và Văn bản bãi nại kiểm toán pháp lý."]]]},{"t":"table","rows":[[["STEP 1","AUDIT NOTIFICATION & INFRASTRUCTURE SCAN"],[],["STEP 2","PENALTY ASSESSMENT & TRUE-UP COMPROMISE"],[],["STEP 3","SETTLEMENT DISBURSEMENT & CERTIFICATE RELEASE"]],[["• Documents & Channels: EULA Section 12 Mandate & KPMG IT Discovery Probes","• Operational Actions: Novus serves 30-day notice; KPMG audits VMware environments discovering 24.5% deficit (+16 cores, +120 CALs).","• Output Deliverables & Controls: Independent Forensic IT License Compliance Report documenting over-deployment."],["➔"],["• Documents & Channels: Contractual Penalty Schedule & Executive Settlement Accord","• Operational Actions: Deficit >5% triggers 20% surcharge; Novus waives $17,280 penalty and splits audit fee to preserve partnership.","• Output Deliverables & Controls: Agreed Executive True-Up Remediation Agreement structuring $95,650 compromise."],["➔"],["• Documents & Channels: Corporate Interbank Transfer & Novus Digital Licensing Portal","• Operational Actions: Vantage Media remits $95,650 by November 30; Novus deploys updated digital license keys with full release.","• Output Deliverables & Controls: Fully compliant digital license certificates and binding Audit Liability Release."]]]},"4.2. 4.2. Tư duy Phân tích Nghiệp vụ & Quản trị Hợp đồng (Bản Tiếng Việt)","• Bức tranh Toàn cảnh Hợp đồng & Pháp lý (End-to-End Flow): Trong lĩnh vực phần mềm doanh nghiệp và quản trị cơ sở dữ liệu lớn (Enterprise Software Asset Management - SAM), các hãng công nghệ lớn (như Oracle, Microsoft, IBM, SAP) luôn duy trì Điều khoản Quyền Kiểm toán Bản quyền (Software License Audit Clause) trong hợp đồng EULA. Phần mềm không bán đứt mà cấp quyền sử dụng theo số lõi vi xử lý (Per-Core) và quyền truy cập máy trạm (CALs). Vòng lặp quản trị rủi ro gồm: Thông báo kiểm toán trước 30 ngày -> Đơn vị kiểm toán độc lập (Big 4) quét tự động hạ tầng máy chủ ảo hóa -> Xác định tỷ lệ sai lệch (Discrepancy Ratio) -> Nếu vượt ngưỡng 5%, kích hoạt truy thu nguyên giá, phạt 20% và bắt chịu phí kiểm toán -> Đàm phán thương mại cấp lãnh đạo để chốt gói mua bổ sung (True-Up Settlement), miễn giảm tiền phạt để duy trì hợp đồng dịch vụ bảo trì hàng năm (Annual Maintenance Support).","• Điểm nghẽn & Rủi ro Tranh chấp Thực tế (Core Bottleneck & Risk): Nút thắt lớn nhất là 'Bẫy Cụm Máy chủ Phục hồi Thảm họa Ảo hóa' (Disaster Recovery & Virtualization Licensing Trap). Đội ngũ IT thường lầm tưởng rằng các máy chủ dự phòng thảm họa (Standby DR Cluster) hoặc các máy ảo VMware tự động co giãn không phải mua bản quyền cho đến khi xảy ra thảm họa thật. Trên thực tế, hợp đồng phần mềm luôn quy định: mọi lõi vi xử lý được gán cho máy chủ đang bật đều phải có bản quyền. Khi bị đoàn kiểm toán quét ra, doanh nghiệp đối mặt với khoản truy thu bất ngờ lên tới hàng trăm nghìn USD cùng phí phạt nặng nề.","• 3 Giải pháp Thiết kế Hệ thống & Kiểm soát Hợp đồng (BA & Legal Compliance Architecture):","(1) Hệ thống Quản trị Bản quyền Phần mềm Tự động (Automated Software Asset Management - SAM Tool): Triển khai công cụ giám sát bản quyền liên tục tự động quét số vCPU và tài khoản Active Directory, gửi cảnh báo tức thì cho phòng IT khi số lượng người dùng vượt 95% hạn mức bản quyền đã mua.","(2) Cơ chế Kẹp chặt Cấu hình Ảo hóa (Virtual Machine CPU Affinity Pinning): Cấu hình phần mềm ảo hóa VMware để ghim chặt máy chủ cơ sở dữ liệu vào đúng các lõi vật lý đã mua bản quyền (CPU pinning), ngăn chặn tính năng tự động chuyển vùng làm tăng số lõi vi xử lý ngoài tầm kiểm soát.","(3) Định kỳ Mua Bổ sung True-Up Hàng năm (Annual Contractual True-Up Provision): Đưa vào hợp đồng khung điều khoản cho phép doanh nghiệp tự đối soát và mua bổ sung bản quyền (True-up) định kỳ mỗi 12 tháng theo đơn giá chiết khấu ban đầu mà không bị coi là vi phạm bản quyền hay bị áp dụng chế tài phạt của kiểm toán độc lập.","4.3. 4.3. Business Analyst & Contract Management Executive Summary (Bản Tiếng Anh)","• End-to-End Contract & Legal Context: In enterprise software asset management (SAM) and database governance, software licensors enforce proprietary intellectual property rights via mandatory contractual verification and audit provisions. Commercial licensing operates on Per-Core and Client Access License (CAL) frameworks. The lifecycle progresses from formal statutory notice to third-party technical discovery scans across virtualization clusters, followed by quantitative gap analysis. Exceeding established compliance thresholds (≥5%) triggers backdated list-price recovery, non-compliance penalties, and third-party audit expense shifting, which are ultimately resolved through negotiated executive True-Up remediation accords preserving lucrative recurring software assurance streams.","• Core Operational Bottleneck & Dispute Risk: The primary operational trap is the 'Disaster Recovery (DR) and Virtual Core Ambiguity'. Enterprise infrastructure teams frequently assume that passive standby virtual clusters or dynamically allocated cloud nodes do not require licensing until an actual failover occurs. Licensor contractual architectures universally mandate licensing for all assigned or pooled cores regardless of workload state. This architectural oversight exposes corporate licensees to devastating unbudgeted true-up liability and audit fee clawbacks during surprise reviews.","• Key BA & Contract Compliance Architecture Solutions:","(1) Enterprise Software Asset Management (SAM) Telemetry: Deploy automated continuous discovery agents cross-referencing active Active-Directory user entitlements and hypervisor core assignments against contract entitlement databases.","(2) Virtual Hypervisor Core Affinity & Hard Partitioning: Architect virtualization environments with strict CPU pinning and hard-partitioned clusters to physically restrict database engines from accessing unauthorized physical processor sockets.","(3) Contractual Annual True-Up Windows: Incorporate self-reporting annual true-up mechanisms into master software contracts, allowing enterprises to square up license deficits at baseline discounted rates without triggering punitive third-party audit clauses.","4.4. 4.4. Tam giác Liên kết Nhận thức Đa chiều (Multi-Perspective Contextual Anchoring)","1. Lăng kính Hợp đồng CNTT / Viễn thông Viettel: Quản trị hợp đồng bản quyền cơ sở dữ liệu Oracle / Microsoft SQL Server tại Viettel Telecom. Các kỹ sư quản trị hệ thống Viettel luôn tính toán số Core CPU vật lý khi nâng cấp máy chủ cước và tính toán số lượng CALs cho hàng nghìn nhân viên giao dịch điểm bán; định kỳ hàng năm Viettel thực hiện đối soát True-up bản quyền để đảm bảo tuân thủ 100% luật sở hữu trí tuệ quốc tế và tối ưu hóa ngân sách CNTT.","2. Lăng kính Quản trị Trường Mầm non Ước Mơ Xanh (cô Thu Huyền): Hợp đồng mua bản quyền phần mềm quản lý học phí và sổ liên lạc điện tử mầm non: Trường mua gói bản quyền cho 300 học sinh. Đến đầu năm học mới, tuyển sinh vượt chỉ tiêu lên 350 học sinh, nhà trường chủ động liên hệ công ty phần mềm làm phụ lục hợp đồng 'True-Up' mua bổ sung thêm 50 tài khoản người dùng theo đơn giá ưu đãi ban đầu trước khi hệ thống bị khóa tính năng.","3. Lăng kính Bàn học Gia đình (Kèm cặp học sinh Lớp 5 - Bé Hà Ngân): Khái niệm 'Kiểm toán và Bổ sung đồ dùng' (The Family True-Up Audit): Đầu năm học, mẹ cấp cho Hà Ngân 'hạn mức bản quyền' là 10 quyển vở viết và 5 ngòi bút mực. Cuối học kỳ 1, hai bố con cùng làm một đợt 'kiểm toán' xem con đã dùng hết bao nhiêu quyển vở; phát hiện con viết thêm vở luyện chữ đẹp vượt 3 quyển, bố làm một đợt 'mua bổ sung True-up' tại hiệu sách để thưởng cho sự chăm chỉ của con.","PHẦN 5: PHẦN 5: TỪ VỰNG & PARAPHRASE CHUYÊN SÂU (CHUẨN 3 DÒNG TỐI ƯU NẠP ANKI)","1. End-User License Agreement (EULA)  /ˌendˈjuː.zər ˈlaɪ.səns əˈɡriː.mənt/  = Software Usage Rights and Restrictions Contract","Nghia: Thỏa thuận cấp phép bản quyền phần mềm quy định quyền và hạn chế sử dụng của khách hàng.","Vd: Section 12 of the EULA establishes the software vendor's right to conduct compliance audits. - Điều khoản 12 của hợp đồng EULA xác lập quyền của nhà cung cấp phần mềm được tiến hành kiểm toán tuân thủ.","2. True-Up License Purchase  /truː ʌp ˈlaɪ.səns ˈpɜː.tʃəs/  = Reconciliation Purchase of Additional Licenses","Nghia: Việc mua bổ sung bản quyền phần mềm để bù đắp số lượng sử dụng thực tế vượt quá mức đăng ký ban đầu.","Vd: The company resolved the audit discrepancy by completing an $86,400 true-up license purchase. - Công ty đã giải quyết sai lệch kiểm toán bằng việc hoàn tất mua bổ sung bản quyền True-Up trị giá $86,400.","3. Per-Core Licensing Architecture  /pɜː kɔː ˈlaɪ.səns.ɪŋ ˈɑː.kɪ.tek.tʃər/  = Pricing Model Based on Processor Core Capacity","Nghia: Mô hình tính giá bản quyền phần mềm căn cứ trên số lượng lõi vi xử lý thực thi.","Vd: Enterprise database servers are governed by a per-core licensing architecture. - Các máy chủ cơ sở dữ liệu doanh nghiệp chịu sự quản lý của mô hình cấp phép theo lõi vi xử lý.","4. Client Access License (CAL)  /ˈklaɪ.ənt ˈæk.ses ˈlaɪ.səns/  = Authorized User or Device Access Permit","Nghia: Giấy phép cho phép một máy trạm hoặc một người dùng định danh truy cập vào máy chủ cơ sở dữ liệu.","Vd: Vantage Media deployed 120 client access licenses beyond its contracted limit. - Vantage Media đã triển khai vượt 120 giấy phép truy cập máy trạm so với hạn mức hợp đồng.","5. Compliance Surcharge Penalty  /kəmˈplaɪ.əns ˈsɜː.tʃɑːdʒ ˈpen.əl.ti/  = Financial Fine for Exceeding Licensed Capacity","Nghia: Khoản tiền phạt phụ thu tài chính do hành vi sử dụng vượt quá dung lượng bản quyền cho phép.","Vd: The licensor agreed to waive the 20% compliance surcharge penalty as an amicable concession. - Bên cấp phép đã đồng ý miễn trừ khoản tiền phạt phụ thu tuân thủ 20% như một sự nhượng bộ hòa giải.","6. Disaster Recovery Failover  /dɪˈzɑː.stər rɪˈkʌv.ər.i ˈfeɪlˌəʊ.vər/  = Automated Switch to Backup Server Cluster","Nghia: Cơ chế tự động chuyển mạch sang cụm máy chủ dự phòng khi xảy ra sự cố thảm họa.","Vd: The unlicensed cores were inadvertently activated during a disaster recovery failover migration. - Các lõi vi xử lý không phép đã vô tình bị kích hoạt trong đợt chuyển đổi dự phòng thảm họa.","7. Full Release from Audit Claims  /fʊl rɪˈliːs frəm ˈɔː.dɪt kleɪmz/  = Complete Legal Immunity for Past Licensing Deficits","Nghia: Văn bản bãi nại toàn bộ giải phóng khách hàng khỏi mọi nghĩa vụ khiếu kiện kiểm toán quá khứ.","Vd: Upon receipt of settlement funds, Novus granted a full release from all audit claims. - Khi nhận đủ tiền dàn xếp, Novus đã cấp văn bản bãi nại toàn bộ khỏi mọi khiếu kiện kiểm toán.","BÀI 10: Thanh lý Hợp đồng Xây dựng EPC Trung tâm Dữ liệu, Quyết toán Tiền Giữ lại Bảo hành (Retention Money) & Bàn giao Toàn bộ (Questions 196-200 - Triple Passage)","Nguồn: Nguồn: ETS TOEIC Part 7 — Triple Passage (Datacenter EPC Construction Contract Terms, Defect Rectification Punch-List Sign-off & Bank Retention Money Release Voucher)","PHẦN 1: PHẦN 1: NỘI DUNG BÀI ĐỌC & DỊCH NGHĨA SONG NGỮ","1.1. 1.1. Đề thi Tiếng Anh gốc (Strategy Guide & Original ETS Passages)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","Questions 196-200 refer to the following three documents.","[Passage 1: Engineering, Procurement & Construction (EPC) Master Contract]","Document 1: Engineering, Procurement & Construction (EPC) Master Contract","Global Cloud Infrastructure Partners & Titan Engineering & Construction Corp.","Article 18: Handover, Defect Liability Period (DLP), and Retention Money Release","18.1 Total Contract Price & Retention Fund: The total contract price for the Dublin Hyperscale Data Center Facility (Project Apex-3) is $30,000,000 USD. Employer (Global Cloud Infrastructure) has withheld five percent (5%) of each milestone invoice, accumulating a total Retention Money Reserve of $1,500,000 USD deposited into an escrow account at Standard Chartered Bank.","18.2 Defect Liability Period (DLP): The DLP shall run for a duration of twelve (12) calendar months following the issuance of the Provisional Handover Certificate on October 15, 2025 (expiring October 15, 2026). During this period, Contractor (Titan Engineering) is strictly obligated, at its sole cost, to repair, rectify, or replace any engineering defects, cooling system discrepancies, or structural anomalies.","18.3 Conditions for Retention Release: Retention Money shall be released within fifteen (15) business days following:","(a) The successful completion of the 12-month DLP;","(b) Full technical verification and written sign-off of all outstanding Punch-List defect items by the Independent Supervising Engineering Consultant (Arup Technical Consulting); and","(c) Issuance of the Final Acceptance Certificate signed by Employer's Vice President of Infrastructure.","[Passage 2: Independent Engineering Consultant Final Punch-List Verification Report]","Document 2: Independent Engineering Consultant Final Punch-List Verification Report","Arup Technical Consulting Group - Mission-Critical Infrastructure Practice","Dublin, Ireland","Project Reference: Apex-3 Hyperscale Data Center Facility (Dublin West Campus)","Supervising Engineer: Fiona Gallagher, CEng, Lead Commissioning Auditor","Date of Final Inspection: October 18, 2026","Contractor: Titan Engineering & Construction Corp.","Verification Findings on Outstanding 12-Month DLP Punch-List:","All 18 previously flagged warranty defect items have been inspected and verified as 100% rectified in full accordance with Tier-IV data center engineering standards:","1. Item #14 (CRAC Precision Cooling System): Refrigerant compressor vibration dampers in Data Hall B have been replaced; acoustic sound levels now meet the 65 dBA contractual threshold.","2. Item #16 (Emergency Backup Generator UPS Battery Banks): Two depleted lithium-ion cell modules in Backup String #4 have been replaced with factory-certified units, successfully passing the 4-hour full-load discharge test.","3. Item #18 (FM-200 Fire Suppression Gas Pressure): Pressure gauges across all 24 gaseous suppression cylinders have been recalibrated and recharged to 360 psi baseline.","Conclusion and Recommendation:","The 12-month Defect Liability Period has concluded with zero unrectified engineering deficiencies. Arup Technical Consulting hereby issues full technical sign-off and recommends the immediate issuance of the Final Acceptance Certificate and release of all retained funds.","[Passage 3: Final Acceptance Certificate and Bank Retention Money Release Authorization]","Document 3: Final Acceptance Certificate and Bank Retention Money Release Authorization","Global Cloud Infrastructure Partners - Executive Infrastructure Directorate","October 28, 2026","To: Standard Chartered Bank - Escrow & Corporate Custody Services","40 Herbert Park, Dublin, Ireland","Re: Authorization for Full Release of Retention Escrow Funds - Project Apex-3 (#ESC-99214)","Pursuant to Section 18.3 of EPC Contract #EPC-7701 and following the formal recommendation issued by Independent Supervising Consultant Arup Technical Consulting on October 18, Global Cloud Infrastructure Partners hereby issues this Final Acceptance Certificate and authorizes the unconditional disbursement of all retained funds.","Disbursement Instruction Details:","- Escrow Reference Number: #ESC-99214 (Project Apex-3 Retention Reserve)","- Principal Retention Amount to Disburse: $1,500,000.00 USD","- Accrued Escrow Interest (Net): $28,450.00 USD","- Total Authorized Wire Transfer: $1,528,450.00 USD","- Beneficiary: Titan Engineering & Construction Corp.","- Beneficiary Bank: Bank of Ireland (Commercial Banking Division, Account #9910-88421)","- Effective Value Date: November 4, 2026","With this final transfer, all financial and operational obligations under EPC Contract #EPC-7701 are fully discharged and extinguished.","Sincerely,","Liam O'Connor, Vice President of Infrastructure, Global Cloud Infrastructure Partners","ACCEPTED & ACKNOWLEDGED:","Marcus Vance, Executive Director, Titan Engineering & Construction Corp. (Date: October 29, 2026)","[ORIGINAL ETS QUESTIONS - CAU HOI TIENG ANH GOC]:","196. What was the total principal amount withheld as retention money for Project Apex-3?","(A) $28,450","(B) $1,500,000","(C) $1,528,450","(D) $30,000,000","197. How long was the Defect Liability Period under the EPC construction contract?","(A) 15 business days","(B) 90 calendar days","(C) 12 calendar months","(D) 36 calendar months","198. According to Document 2, what repair was performed on the emergency power system?","(A) Replacing two depleted lithium-ion UPS battery modules","(B) Installing new acoustic sound dampers around diesel generators","(C) Recharging FM-200 fire suppression cylinders to 360 psi","(D) Rebuilding the structural concrete foundation of Data Hall B","199. What did Arup Technical Consulting recommend in its final report?","(A) Extending the Defect Liability Period for another six months","(B) Withholding 50% of the retention funds due to excessive compressor vibration","(C) Issuing the Final Acceptance Certificate and releasing all retained funds","(D) Demolishing Data Hall B to comply with Tier-IV data center standards","200. What is the total wire transfer amount authorized for disbursement to Titan Engineering?","(A) $1,500,000.00","(B) $1,528,450.00","(C) $28,500,000.00","(D) $30,000,000.00","1.2. 1.2. Hướng dẫn làm bài Part 7: Chiến lược 5 phút tối ưu, Ghép nối Dữ kiện & Tóm tắt Feynman","[5-MINUTE STRATEGY GUIDE - CHIEN THUAT 5 PHUT]:","CHIẾN LƯỢC 5 PHÚT TỐI ƯU PART 7 (ÁP DỤNG BÀI ĐỌC BA VĂN BẢN THANH LÝ HỢP ĐỒNG EPC & GIẢI PHÓNG TIỀN GIỮ LẠI BẢO HÀNH):","Bước 1 (30 giây) - Nắm bắt Bối cảnh & Luồng sự việc (Quỹ đạo chữ Z & 3 Câu hỏi Tiềm thức):","• Quét VB1: Hợp đồng EPC Xây dựng Trung tâm Dữ liệu $30,000,000 giữa Global Cloud Infra và Titan Engineering -> Tiền giữ lại bảo hành 5% ($1,500,000) gửi tại Standard Chartered Bank; Thời hạn bảo hành DLP 12 tháng (kết thúc 15/10/2026); Điều kiện giải ngân: Hết DLP, đơn vị tư vấn Arup nghiệm thu hết lỗi Punch-list, và sếp hạ tầng ký bàn giao cuối cùng.","• Quét VB2: Báo cáo nghiệm thu của Tư vấn Arup (Fiona Gallagher) ngày 18/10/2026 -> 18 hạng mục sai sót đã được sửa 100% (CRAC, ắc quy UPS, bình FM-200); khuyến nghị cấp chứng chỉ nghiệm thu và giải phóng toàn bộ tiền giữ lại.","• Quét VB3: Biên bản Nghiệm thu Cuối cùng & Lệ
