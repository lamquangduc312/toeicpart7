,"(B) Tuyển dụng các nhân sự kỹ thuật và nghiên cứu chủ chốt từ phía đối tác.","(C) Đăng ký sáng chế tại các khu vực pháp lý quốc tế mà không có sự đồng thuận chung.","(D) Tiết lộ bảng cân đối kế toán tài chính trong quá trình đàm phán sáp nhập.","Câu 187. Theo Điều khoản 9, tại sao bên tiết lộ thông tin lại có quyền yêu cầu tòa án ban hành lệnh cấm khẩn cấp tạm thời?","(A) Chỉ riêng khoản tiền bồi thường thiệt hại không thể bù đắp thỏa đáng các tổn hại kinh doanh phát sinh.","(B) Cả hai bên đã đồng thuận từ bỏ việc khởi kiện tại tòa án để chuyển sang trọng tài ràng buộc.","(C) Hành vi xâm phạm sở hữu trí tuệ tự động vô hiệu hóa hợp đồng bảo hiểm doanh nghiệp.","(D) Thỏa thuận yêu cầu phải nộp một khoản tiền bảo lãnh bảo đảm hàng triệu đô-la.","Câu 188. Quantum Robotics đã vi phạm điều khoản cấm chèo kéo nhân sự bằng cách nào?","(A) Bằng việc tuyển dụng cựu kiến trúc sư trưởng của Synthex chỉ vài tuần sau khi ông từ chức.","(B) Bằng việc chia sẻ các thuật toán độc quyền với một nhà phát triển đối thủ ở châu Âu.","(C) Bằng việc đăng quảng cáo tuyển dụng công khai trên các bảng tin trường đại học.","(D) Bằng việc chấm dứt dự án tư vấn chung mà không gửi thông báo trước ba mươi ngày.","Câu 189. Bằng chứng về hành vi chiếm đoạt sở hữu trí tuệ nào được trích dẫn trong Văn bản 2?","(A) Một tập tài liệu quảng cáo tiếp thị trái phép được đăng tải trên mạng xã hội.","(B) Một nhật ký tải phần mềm cho thấy mật khẩu tài khoản khách hàng đã bị đánh cắp.","(C) Các thuật toán toán học được sao chép nguyên văn trong một đơn đăng ký sáng chế gần đây.","(D) Các linh kiện phần cứng vật lý bị lấy cắp khỏi phòng thí nghiệm thử nghiệm ở Boston.","Câu 190. Điều gì sẽ xảy ra nếu Quantum Robotics KHÔNG phản hồi thỏa đáng trước ngày 25 tháng 11?","(A) Cơ quan Sáng chế USPTO sẽ tước giấy phép hành nghề kỹ sư của Tiến sĩ Bradley.","(B) Synthex sẽ chính thức khởi kiện tại tòa án liên bang để yêu cầu ban hành lệnh cấm khẩn cấp.","(C) Hợp đồng hợp tác phát triển chung sẽ tự động gia hạn thêm thời hạn mười tám tháng.","(D) Quantum Robotics sẽ bắt buộc phải thanh toán ngay một khoản tiền bồi thường mặt là $100,000.","1.5. 1.5. Tóm tắt Viết lại Toàn bài theo Feynman (Feynman Monograph Summary)","[EXECUTIVE SUMMARY & CORE LOGIC - BAN TOM TAT COT LOI]:","English Executive Summary:","• Non-Disclosure & Restrictive Covenants: The Synthex AI / Quantum Robotics M-NDA protects proprietary algorithms, strictly forbids soliciting or hiring joint senior research personnel for 18 months post-termination, and entitles the injured party to immediate injunctive relief due to irreparable commercial harm.","• Dual Contractual Violations: Quantum Robotics breached Section 5.2 by appointing Synthex's former Lead Vision Architect (Dr. Bradley) as VP just two weeks after his resignation, and committed trade secret theft by filing USPTO patent #63/991,402 containing Synthex's verbatim proprietary code.","• Cease-and-Desist Legal Demands: Synthex counsel issued a strict ultimatum demanding withdrawal of the patent application and placement of Dr. Bradley on administrative leave by November 25, under penalty of immediate Federal District Court litigation for injunctive orders and punitive damages.","Bản tóm tắt Tiếng Việt cốt lõi:","• Khung Bảo mật & Điều khoản Cấm Chèo kéo: Hợp đồng NDA giữa Synthex AI và Quantum Robotics bảo vệ tuyệt đối thuật toán độc quyền, nghiêm cấm tuyển dụng nhân sự nghiên cứu cấp cao của nhau trong vòng 18 tháng sau khi kết thúc hợp tác, và trao quyền xin lệnh cấm khẩn cấp tạm thời của tòa án do thiệt hại không thể bồi thường bằng tiền mặt.","• Vi phạm Kép Trắng trợn: Quantum Robotics đã vi phạm Khoản 5.2 khi tuyển cựu Kiến trúc sư Trưởng Dr. Bradley làm Phó Chủ tịch chỉ 2 tuần sau khi ông nghỉ việc, đồng thời chiếm đoạt bí mật công nghệ khi nộp đơn sáng chế USPTO số #63/991,402 sao chép nguyên văn mã nguồn của Synthex.","• Tối hậu thư Pháp lý Khẩn cấp: Văn phòng luật sư của Synthex ra thời hạn chót đến 17:00 ngày 25/11 yêu cầu rút đơn sáng chế và tạm đình chỉ công tác Dr. Bradley, nếu không sẽ chính thức nộp đơn khởi kiện lên Tòa án Quận Liên bang đòi lệnh cấm hoạt động và trừng phạt tài chính.","PHẦN 2: PHẦN 2: ACTIVE RECALL 5 GIÂY (BẢNG MA TRẬN ĐỊNH VỊ SONG NGỮ)",{"t":"table","rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong & Vai tro"],["Bên Tiết lộ / Bị hại: Tập đoàn Trí tuệ Nhân tạo Synthex AI (đại diện bởi Văn phòng Luật sư Kaufman & Vance LLP). Bên Vi phạm: Công ty Quantum Robotics (CTO Dr. Aris Thorne). Nhân sự bị chèo kéo trái phép: Dr. Kevin Bradley.","Disclosing / Injured Party: Synthex AI Corporation (represented by Kaufman & Vance LLP). Breaching Party: Quantum Robotics Inc. (CTO Dr. Aris Thorne). Poached Personnel: Dr. Kevin Bradley (former Lead Vision Architect)."]],[["2. Boi canh & Quy trinh loi"],["Hai hành vi vi phạm hợp đồng cốt lõi: (1) Vi phạm cam kết cấm lôi kéo nhân sự kỹ thuật trong 18 tháng (Non-solicitation breach); (2) Chiếm đoạt mã nguồn thuật toán đưa vào đơn sáng chế nộp lên cơ quan sáng chế USPTO (Trade secret misappropriation).","Two core contractual breaches: (1) Breach of the 18-month non-solicitation covenant by hiring Dr. Bradley; (2) Misappropriation of proprietary algorithmic source code incorporated into USPTO patent application #63/991,402."]],[["3. Dau vet suy luan cheo"],["Cơ chế chế tài pháp lý: Điều khoản 9 cho phép xin Lệnh cấm khẩn cấp tạm thời (Preliminary Injunction) từ Tòa án Quận Liên bang mà không cần ký quỹ bồi thường, do thiệt hại bí mật kinh doanh là 'irreparable harm' (không thể khắc phục bằng tiền).","Legal remedy mechanism: Section 9 authorizes immediate Emergency Preliminary Injunctive Relief from Federal District Court without bond, since trade secret disclosure causes irreparable commercial harm where monetary damages are inadequate."]]]},"PHẦN 3: PHẦN 3: ĐÁP ÁN CHUẨN XÁC & DẤU VẾT TRUY XUẤT CHÉO (CROSS-REFERENCING & COMPREHENSIVE TRAP BREAKDOWN)","186. What is prohibited under Section 5.2 of the Mutual NDA?","Dap an dung: (B) Recruiting key research and engineering staff from the other party","[Dau vet bai doc / Clue]: Section 5.2: 'Neither party shall directly or indirectly solicit, recruit, or hire any senior engineering personnel or research scientists of the other party... for a period of eighteen (18) months...'","[Dien dat tuong duong / Paraphrase]:","• solicit, recruit, or hire any senior engineering personnel <=> Recruiting key research and engineering staff from the other party.","[Loi giai chi tiet]: Điều khoản 5.2 quy định rõ ràng rằng không bên nào được phép trực tiếp hoặc gián tiếp lôi kéo, tuyển dụng ('solicit, recruit, or hire') nhân sự kỹ thuật cấp cao hoặc nhà khoa học nghiên cứu của bên kia trong vòng 18 tháng.","[Phan tich Phuong an Sai & Bay De thi ETS]:","(A) Using commercial cloud platforms to store proprietary source code","- Ly do sai: Hợp đồng không cấm dùng đám mây, chỉ yêu cầu bảo vệ với mức độ cẩn trọng thương mại hợp lý.","- Bay ETS: Bẫy Giả định Công nghệ (Irrelevant Technology Trap)","(C) Registering patents in international jurisdictions without joint approval","- Ly do sai: Điều khoản 5.2 chỉ nói về cấm chèo kéo nhân sự, không quy định về đơn đăng ký sáng chế quốc tế.","- Bay ETS: Bẫy Lạc Đề Điều khoản (Wrong Section Trap)","(D) Disclosing financial balance sheets during merger negotiations","- Ly do sai: Đây là dự án nghiên cứu công nghệ AI và robot, không liên quan đến đàm phán sáp nhập tài chính.","- Bay ETS: Bẫy Ngữ cảnh Tài chính Sai lệch (False Context Trap)","187. According to Section 9, why is the disclosing party entitled to injunctive relief?","Dap an dung: (A) Monetary compensation alone cannot adequately cure the resulting business harm.","[Dau vet bai doc / Clue]: Section 9: 'unauthorized disclosure or misuse of algorithmic trade secrets will cause irreparable commercial harm for which monetary damages alone would be inadequate.'","[Dien dat tuong duong / Paraphrase]:","• monetary damages alone would be inadequate <=> Monetary compensation alone cannot adequately cure the resulting business harm.","[Loi giai chi tiet]: Điều khoản 9 nêu rõ căn cứ pháp lý để yêu cầu lệnh cấm khẩn cấp của tòa án (injunctive relief) là vì việc lộ bí mật thuật toán sẽ gây ra 'tổn hại không thể khắc phục' mà việc bồi thường tiền mặt đơn thuần không thể bù đắp nổi ('monetary damages alone would be inadequate').","[Phan tich Phuong an Sai & Bay De thi ETS]:","(B) Both parties agreed to waive all court litigation in favor of binding arbitration.","- Ly do sai: Điều khoản 9 trao quyền kiện thẳng ra Tòa án có thẩm quyền (court of competent jurisdiction), không bắt buộc trọng tài.","- Bay ETS: Bẫy Trọng tài vs Tòa án (Arbitration vs Litigation Trap)","(C) Intellectual property infringement automatically voids corporate insurance.","- Ly do sai: Không có điều khoản nào nhắc đến việc vô hiệu hóa bảo hiểm doanh nghiệp.","- Bay ETS: Bẫy Thông tin Không được Đề cập (Not Mentioned Trap)","(D) The agreement requires posting a multimillion-dollar surety bond.","- Ly do sai: Hợp đồng ghi rõ 'without the necessity of posting a bond' (không cần phải nộp tiền bảo lãnh bảo đảm).","- Bay ETS: Bẫy Nói Ngược Điều kiện Pháp lý (Condition Inversion Trap)","188. How did Quantum Robotics violate the non-solicitation clause?","Dap an dung: (A) By hiring a former Synthex lead architect within weeks of his resignation","[Dau vet bai doc / Clue]: Document 2, Paragraph 2: 'Quantum Robotics recently hired Dr. Kevin Bradley, formerly Synthex's Lead Computer Vision Architect... on October 1. Dr. Bradley resigned from Synthex on September 15. This hiring constitutes a blatant, willful breach of the 18-month non-solicitation covenant...'","[Dien dat tuong duong / Paraphrase]:","• hired former Lead Architect on Oct 1 after resigning Sept 15 within 18-month restricted period <=> By hiring a former Synthex lead architect within weeks of his resignation.","[Loi giai chi tiet]: Văn bản 2 chứng minh rõ: Tiến sĩ Bradley nghỉ việc ngày 15/9 và được Quantum Robotics tuyển làm Phó Chủ tịch ngày 1/10 (chỉ sau 2 tuần). Khoảng thời gian này vi phạm hoàn toàn cam kết cấm tuyển dụng nhân sự trong 18 tháng sau khi kết thúc hợp đồng.","[Phan tich Phuong an Sai & Bay De thi ETS]:","(B) By sharing proprietary algorithms with a competing European developer","- Ly do sai: Quantum Robotics nộp đơn sáng chế tại Mỹ cho chính mình, không phải chia sẻ với bên châu Âu.","- Bay ETS: Bẫy Bịa đặt Đối tượng Thứ ba (Fabricated Third-Party Trap)","(C) By publicly advertising employment openings on university campus boards","- Ly do sai: Hành vi vi phạm là tuyển dụng trực tiếp cựu nhân sự Synthex, không liên quan đến quảng cáo tại trường đại học.","- Bay ETS: Bẫy Hành động Thông thường (Normal Activity Trap)","(D) By terminating a joint consulting project without 30 days notice","- Ly do sai: Lỗi vi phạm là chèo kéo nhân sự và ăn cắp thuật toán, không phải lỗi chấm dứt hợp đồng thiếu thông báo.","- Bay ETS: Bẫy Lỗi Vi phạm Không liên quan (Irrelevant Breach Trap)","194. What evidence of intellectual property misappropriation is cited in Document 2?","Dap an dung: (C) Verbatim mathematical algorithms included in a recent patent filing","[Dau vet bai doc / Clue]: Document 2, Paragraph 3: 'filed a provisional patent application... incorporates verbatim mathematical algorithms and proprietary edge-detection source code developed exclusively by Synthex...'","[Dien dat tuong duong / Paraphrase]:","• incorporates verbatim mathematical algorithms in provisional patent application <=> Verbatim mathematical algorithms included in a recent patent filing.","[Loi giai chi tiet]: Văn bản 2 chỉ đích danh bằng chứng chiếm đoạt bí mật công nghệ: trong đơn đăng ký sáng chế số #63/991,402 nộp ngày 4/11, Quantum Robotics đã sao chép nguyên văn các thuật toán toán học ('verbatim mathematical algorithms') và mã nguồn nhận diện đường biên độc quyền của Synthex.","[Phan tich Phuong an Sai & Bay De thi ETS]:","(A) An unauthorized marketing brochure published on social media","- Ly do sai: Không hề có tài liệu quảng cáo nào trên mạng xã hội; bằng chứng là hồ sơ sáng chế nộp tại USPTO.","- Bay ETS: Bẫy Tài liệu Truyền thông Sai lệch (False Media Trap)","(B) A software download log showing stolen customer account passwords","- Ly do sai: Đây là vụ án chiếm đoạt thuật toán thị giác AI, không phải vụ đánh cắp mật khẩu tài khoản người dùng.","- Bay ETS: Bẫy Tội phạm An ninh mạng Nhầm lẫn (Cybercrime Distortion Trap)","(D) Physical hardware components removed from a Boston testing laboratory","- Ly do sai: Tài sản bị chiếm đoạt là tài sản trí tuệ vô hình (thuật toán và mã nguồn), không phải linh kiện phần cứng vật lý.","- Bay ETS: Bẫy Vô hình vs Hữu hình (Tangible vs Intangible Trap)","190. What will happen if Quantum Robotics does NOT respond satisfactorily by November 25?","Dap an dung: (B) Synthex will initiate formal federal court litigation seeking an injunction.","[Dau vet bai doc / Clue]: Document 2, Paragraph 5: 'If we do not receive satisfactory written confirmation by... November 25, Synthex has instructed our firm to immediately file an emergency complaint in the United States District Court... seeking emergency preliminary injunctive relief...'","[Dien dat tuong duong / Paraphrase]:","• file an emergency complaint in the United States District Court seeking injunctive relief <=> Synthex will initiate formal federal court litigation seeking an injunction.","[Loi giai chi tiet]: Đoạn cuối của Văn bản 2 cảnh báo rõ: nếu không nhận được phản hồi thỏa đáng trước 17:00 ngày 25/11, văn phòng luật sư đã nhận chỉ thị nộp đơn kiện khẩn cấp tại Tòa án Quận Liên bang Hoa Kỳ (US District Court) để xin lệnh cấm khẩn cấp tạm thời.","[Phan tich Phuong an Sai & Bay De thi ETS]:","(A) The USPTO will cancel Dr. Bradley's engineering license.","- Ly do sai: USPTO quản lý cấp bằng sáng chế, không cấp hay tước giấy phép hành nghề kỹ sư cá nhân.","- Bay ETS: Bẫy Thẩm quyền Cơ quan Quản lý (Regulatory Authority Trap)","(C) The joint development agreement will automatically renew for eighteen months.","- Ly do sai: Hợp đồng đã kết thúc; con số 18 tháng là thời hạn cấm chèo kéo nhân sự, không phải điều khoản tự động gia hạn.","- Bay ETS: Bẫy Nhầm lẫn Điều khoản Gia hạn (Renewal Trap)","(D) Quantum Robotics will be required to pay an immediate cash settlement of $100,000.","- Ly do sai: Bức thư yêu cầu rút đơn sáng chế và đe dọa kiện ra tòa, không hề đề cập đến số tiền dàn xếp $100,000.","- Bay ETS: Bẫy Số tiền Bịa đặt (Fabricated Amount Trap)","PHẦN 4: PHẦN 4: KỸ THUẬT FEYNMAN SONG NGỮ & SƠ ĐỒ QUY TRÌNH (TƯ DUY BA & PHÁP LÝ HỢP ĐỒNG)","4.1. 4.1. Sơ đồ Quy trình Luân chuyển Nghiệp vụ (End-to-End Business Workflow Diagram)",{"t":"table","rows":[[["BƯỚC 1","KÝ KẾT M-NDA & RÀNG BUỘC PHÁP LÝ"],[],["BƯỚC 2","GIÁM SÁT & THU THẬP CHỨNG CỨ VI PHẠM"],[],["BƯỚC 3","GỬI TỐI HẬU THƯ & KÍCH HOẠT TÒA ÁN LIÊN BANG"]],[["• Chung tu & Kenh: Hợp đồng Bảo mật Song phương (M-NDA Clauses 2, 5, 9)","• Nghiep vu thuc thi: Xác lập định nghĩa bí mật công nghệ, điều khoản cấm chèo kéo nhân sự 18 tháng và quyền xin lệnh cấm.","• Ket qua & Kiem soat: Văn bản thỏa thuận pháp lý ràng buộc làm căn cứ khởi kiện xâm phạm sở hữu trí tuệ."],["➔"],["• Chung tu & Kenh: Cơ sở Dữ liệu USPTO & Kiểm toán Kỹ thuật Độc lập","• Nghiep vu thuc thi: Phát hiện đối tác tuyển dụng trái phép cựu kiến trúc sư trưởng và sao chép nguyên văn mã nguồn vào đơn sáng chế.","• Ket qua & Kiem soat: Hồ sơ chứng cứ xâm phạm bản quyền bao gồm Đơn sáng chế USPTO #63/991,402."],["➔"],["• Chung tu & Kenh: Thư Cảnh báo Pháp lý (Cease & Desist) & US District Court","• Nghiep vu thuc thi: Ra thời hạn chót rút đơn sáng chế trước 25/11; nếu không tuân thủ sẽ nộp đơn xin Lệnh cấm Khẩn cấp tạm thời.","• Ket qua & Kiem soat: Thỏa thuận bãi nại / rút đơn sáng chế hoặc Lệnh cấm tạm thời (Preliminary Injunction) từ Tòa án."]]]},{"t":"table","rows":[[["STEP 1","M-NDA EXECUTION & RESTRICTIVE COVENANTS"],[],["STEP 2","INFRINGEMENT MONITORING & FORENSIC AUDIT"],[],["STEP 3","CEASE-AND-DESIST DEMAND & FEDERAL INJUNCTION"]],[["• Documents & Channels: Mutual Non-Disclosure Agreement (Sections 2, 5.2, 9)","• Operational Actions: Define trade secret scope, mandate 18-month non-solicitation barrier, and establish injunctive relief rights.","• Output Deliverables & Controls: Legally enforceable contractual baseline protecting algorithms and key engineering assets."],["➔"],["• Documents & Channels: USPTO Public Gazette & Internal Source Code Repositories","• Operational Actions: Uncover competitor hiring of former vision architect alongside verbatim code theft in patent filing #63/991,402.","• Output Deliverables & Controls: Forensic intellectual property infringement docket substantiating trade secret misappropriation."],["➔"],["• Documents & Channels: Certified Legal Demand Letter & US Federal District Court","• Operational Actions: Issue strict November 25 cure deadline to withdraw patent, backed by emergency injunction pleadings.","• Output Deliverables & Controls: Formal patent abandonment / compliance certificate or court-ordered Preliminary Injunction."]]]},"4.2. 4.2. Tư duy Phân tích Nghiệp vụ & Quản trị Hợp đồng (Bản Tiếng Việt)","• Bức tranh Toàn cảnh Hợp đồng & Pháp lý (End-to-End Flow): Trong các thỏa thuận hợp tác nghiên cứu phát triển công nghệ cao (High-Tech Joint R&D & Tech Partnerships), Thỏa thuận Bảo mật Thông tin Song phương (Mutual NDA) kết hợp Điều khoản Cấm Chèo kéo Nhân sự (Non-Solicitation Covenant) là tấm khiên bảo vệ sống còn của doanh nghiệp. Giá trị của công ty công nghệ nằm ở thuật toán độc quyền và đội ngũ kỹ sư tinh hoa. Chuỗi hành động bảo vệ pháp lý gồm: Ký kết M-NDA với điều khoản cấm tuyển dụng nhân sự chéo trong 18-24 tháng -> Thường xuyên quét cơ sở dữ liệu sáng chế (USPTO Patent Monitoring) và mạng xã hội chuyên nghiệp -> Phát hiện đối tác vừa tuyển cựu nhân sự vừa nộp đơn sáng chế chứa thuật toán chung -> Phát hành Thư cảnh báo ngừng hành vi vi phạm (Cease-and-Desist Demand Letter) với thời hạn cụ thể -> Khởi kiện tại Tòa án xin Lệnh cấm Khẩn cấp tạm thời (Preliminary Injunction) ngăn chặn hành vi khai thác thương mại trái phép.","• Điểm nghẽn & Rủi ro Tranh chấp Thực tế (Core Bottleneck & Risk): Rủi ro lớn nhất là 'Thất thoát Bí mật Công nghệ qua Con người' (Human Vector IP Leakage). Khi một kỹ sư chủ chốt nhảy việc sang đối tác, ranh giới giữa 'kinh nghiệm cá nhân' và 'bí mật thương mại thuộc sở hữu công ty cũ' thường bị làm mờ. Nếu hợp đồng chỉ quy định bảo mật chung chung mà thiếu điều khoản Cấm Chèo kéo (Non-solicitation) rõ ràng về thời gian và phạm vi, bên bị hại sẽ rất khó chứng minh hành vi ăn cắp tại tòa án. Điểm nghẽn thứ hai là tốc độ: nếu không hành động khẩn cấp trước khi đơn sáng chế được công bố công khai hoặc sản phẩm đối thủ ra thị trường, tính độc quyền của công nghệ sẽ bị triệt tiêu hoàn toàn.","• 3 Giải pháp Thiết kế Hệ thống & Kiểm soát Hợp đồng (BA & Legal Compliance Architecture):","(1) Hệ thống Giám sát Sở hữu Trí tuệ Tự động (Automated Patent & Code Telemetry Bot): Triển khai bot tự động theo dõi các đơn đăng ký sáng chế mới trên cơ sở dữ liệu USPTO/WIPO có chứa các từ khóa thuật toán và quét mã nguồn mở đối chiếu với mã nguồn độc quyền của doanh nghiệp.","(2) Quy trình Cách ly Nhân sự và Kiểm toán Khi Rời tổ chức (Exit Protocol & Forensic Quarantine): Khi kỹ sư chủ chốt từ chức, thực hiện sao lưu pháp lý ổ cứng máy tính (forensic image), ký cam kết tái xác nhận nghĩa vụ bảo mật và gửi thông báo chính thức đến người sử dụng lao động mới nhắc nhở về điều khoản cấm chèo kéo 18 tháng.","(3) Điều khoản Lệnh Cấm Khẩn cấp Không Cần Ký quỹ (Pre-agreed Injunction Relief Clause without Bond): Luôn đưa vào hợp đồng điều khoản khẳng định hành vi vi phạm bí mật kinh doanh là tổn thất không thể khắc phục bằng tiền, cho phép công ty xin lệnh cấm của tòa án ngay lập tức mà không phải chịu chi phí nộp tiền bảo lãnh hàng triệu đô-la.","4.3. 4.3. Business Analyst & Contract Management Executive Summary (Bản Tiếng Anh)","• End-to-End Contract & Legal Context: In high-stakes technology joint ventures and advanced AI collaborations, Mutual Non-Disclosure Agreements (M-NDAs) coupled with strict Non-Solicitation Covenants form the primary legal barrier against intellectual property expropriation. Core enterprise valuation resides within algorithmic assets and elite research talent. The end-to-end protective protocol spans rigorous upfront restrictive drafting (18-24 month non-solicitation boundaries), proactive patent filing intelligence, immediate forensic code comparison upon discovery of unauthorized poaching, formal Cease-and-Desist escalations with explicit cure deadlines, and aggressive emergency litigation for Preliminary Injunctions in Federal District Courts.","• Core Operational Bottleneck & Dispute Risk: The principal vulnerability is trade secret leakage via key personnel attrition. When a lead architect transitions to a collaborative partner, delineating generalized professional knowledge from proprietary employer trade secrets is notoriously contentious. Without explicit, temporally bounded non-solicitation clauses, establishing contractual liability becomes prohibitively difficult. Furthermore, temporal urgency is acute: failure to secure injunctive relief prior to commercial market dissemination permanently destroys trade secret status under uniform trade secrets jurisprudence.","• Key BA & Contract Compliance Architecture Solutions:","(1) Algorithmic Patent Telemetry & Scraping Engines: Establish automated tracking pipelines monitoring USPTO/EPO patent filings matching proprietary mathematical constructs and code signatures developed during collaborative joint projects.","(2) Comprehensive Departure Forensics & Employer Admonition: Enforce strict departure protocols, capturing forensic device disk images and dispatching formal legal notices to new employers reaffirming active non-solicitation and trade secret covenants.","(3) Pre-stipulated Injunctive Relief without Surety Bonds: Contractually embed admissions that intellectual property breaches constitute irreparable injury per se, enabling immediate emergency court injunctions without the punitive operational hurdle of posting multimillion-dollar indemnity bonds.","4.4. 4.4. Tam giác Liên kết Nhận thức Đa chiều (Multi-Perspective Contextual Anchoring)","1. Lăng kính Hợp đồng CNTT / Viễn thông Viettel: Quản trị hợp đồng bảo mật dự án chuyển đổi số / phát triển mạng 5G của Viettel với các đối tác cung cấp giải pháp quốc tế. Hợp đồng NDA luôn quy định: mọi thuật toán tối ưu hóa sóng vô tuyến, mã nguồn phần mềm mạng lõi và dữ liệu cấu hình mạng Viettel đều là tài sản bảo mật tuyệt đối; nghiêm cấm đối tác tuyển dụng chuyên gia nghiên cứu của Viettel trong 24 tháng sau khi dự án kết thúc.","2. Lăng kính Quản trị Trường Mầm non Ước Mơ Xanh (cô Thu Huyền): Thỏa thuận bảo mật giáo trình và cấm lôi kéo giáo viên (Non-Solicitation Agreement): Khi liên kết chuyển giao chương trình giáo dục sớm STEAM bản quyền từ đối tác nước ngoài, trường ký cam kết: đối tác không được tuyển dụng giáo viên nòng cốt của trường sang cơ sở khác, và nhà trường cam kết bảo vệ không sao chép giáo án độc quyền để mở trung tâm riêng trái phép.","3. Lăng kính Bàn học Gia đình (Kèm cặp học sinh Lớp 5 - Bé Hà Ngân): Quy ước 'Tôn trọng bản quyền tác giả gia đình' (Family IP Rule): Khi Hà Ngân sáng tác một câu chuyện tranh hoặc giải một bài toán đố vui theo cách sáng tạo mới, bố mẹ và con gái thỏa thuận đây là 'tác phẩm độc quyền của Hà Ngân'. Ai muốn mượn ý tưởng để kể cho bạn bè phải xin phép tác giả tí hon và ghi rõ nguồn gốc để rèn thói quen tôn trọng sở hữu trí tuệ ngay từ nhỏ.","PHẦN 5: PHẦN 5: TỪ VỰNG & PARAPHRASE CHUYÊN SÂU (CHUẨN 3 DÒNG TỐI ƯU NẠP ANKI)","1. Cease-and-Desist Demand  /siːs ænd dɪˈzɪst dɪˈmɑːnd/  = Formal Demand to Halt Unlawful Conduct","Nghia: Thư yêu cầu pháp lý chính thức bắt buộc chấm dứt ngay hành vi vi phạm pháp luật hoặc hợp đồng.","Vd: Our counsel served a formal cease-and-desist demand to halt the unauthorized patent application. - Luật sư của chúng tôi đã gửi thư yêu cầu chính thức bắt buộc chấm dứt ngay đơn đăng ký sáng chế trái phép.","2. Injunctive Relief  /ɪnˈdʒʌŋk.tɪv rɪˈliːf/  = Court-Ordered Restraining Prohibition","Nghia: Lệnh cấm khẩn cấp của tòa án buộc một bên phải ngừng ngay hành vi vi phạm.","Vd: The software firm sought injunctive relief to prevent the commercial release of the copied algorithm. - Công ty phần mềm đã yêu cầu lệnh cấm của tòa án để ngăn chặn việc tung ra thị trường thuật toán bị sao chép.","3. Non-Solicitation Covenant  /nɒn səˌlɪs.ɪˈteɪ.ʃən ˈkʌv.ən.ənt/  = Contractual Anti-Poaching Employee Clause","Nghia: Cam kết hợp đồng nghiêm cấm hành vi chèo kéo, lôi kéo nhân viên của đối tác.","Vd: The 18-month non-solicitation covenant prevented the vendor from hiring the client's lead architect. - Cam kết cấm chèo kéo trong 18 tháng đã ngăn chặn nhà cung cấp tuyển dụng kiến trúc sư trưởng của khách hàng.","4. Misappropriation of Trade Secrets  /ˌmɪs.əˌprəʊ.priˈeɪ.ʃən əv treɪd ˈsiː.krəts/  = Unlawful Acquisition of Proprietary Information","Nghia: Hành vi chiếm đoạt hoặc sử dụng trái phép bí mật kinh doanh và công nghệ độc quyền.","Vd: The lawsuit charged the competitor with willful misappropriation of proprietary neural network source code. - Vụ kiện cáo buộc đối thủ cạnh tranh có hành vi cố ý chiếm đoạt mã nguồn mạng nơ-ron độc quyền.","5. Irreparable Harm  /ɪˈrep.ər.ə.bəl hɑːm/  = Incurable Damage Inadequately Solved by Money","Nghia: Tổn thất nghiêm trọng không thể khắc phục được bằng tiền bồi thường đơn thuần.","Vd: Public disclosure of proprietary formula causes irreparable harm to market competitive advantage. - Việc tiết lộ công khai công thức độc quyền gây ra tổn hại không thể bù đắp đối với lợi thế cạnh tranh thị trường.","6. Verbatim Copying  /vɜːˈbeɪ.tɪm ˈkɒp.i.ɪŋ/  = Word-for-Word Literal Replication","Nghia: Hành vi sao chép nguyên văn từng câu chữ, mã lệnh mà không có sửa đổi.","Vd: The technical audit revealed verbatim copying of the proprietary sorting algorithms in the patent application. - Cuộc kiểm toán kỹ thuật đã phát hiện việc sao chép nguyên văn các thuật toán phân loại độc quyền trong đơn sáng chế.","7. Competent Jurisdiction  /ˈkɒm.pɪ.tənt ˌdʒʊə.rɪsˈdɪk.ʃən/  = Legally Authorized Court of Law","Nghia: Tòa án hoặc cơ quan tài phán có đầy đủ thẩm quyền pháp lý để xét xử vụ việc.","Vd: Claims for breach of contract must be submitted to a court of competent jurisdiction within the state. - Các khiếu kiện vi phạm hợp đồng bắt buộc phải được đệ trình lên tòa án có thẩm quyền trong phạm vi bang.","BÀI 5: Hợp đồng Khung Dịch vụ Triển khai Hệ thống ERP (MSA), Nghiệm thu Theo Giai đoạn (Milestones) & Giải ngân Tài khoản Ký quỹ (Escrow) (Questions 196-200 - Triple Passage)","Nguồn: Nguồn: ETS TOEIC Part 7 — Triple Passage (Master Services Agreement Statement of Work, User Acceptance Testing - UAT Sign-Off Certificate & Escrow Release Instruction)","PHẦN 1: PHẦN 1: NỘI DUNG BÀI ĐỌC & DỊCH NGHĨA SONG NGỮ","1.1. 1.1. Đề thi Tiếng Anh gốc (Strategy Guide & Original ETS Passages)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","Questions 196-200 refer to the following three documents.","[Passage 1: Statement of Work (SOW #4) - Enterprise Cloud ERP Implementation]","Document 1: Statement of Work (SOW #4) - Enterprise Cloud ERP Implementation","Master Services Agreement Between Axon Enterprise Systems & Horizon Retail Group","Section 3: Project Milestone Schedule and Milestone Deliverables","Total Fixed-Price Contract Value: $600,000. All contract funds have been deposited upfront into an interest-bearing Bank Escrow Account at CitiCommercial Bank (Account #ESC-44091).","Milestone Payment Breakdown:","- Milestone 1: Blueprint Architecture & System Design Specifications (20% / $120,000) - Completed June 30.","- Milestone 2: Core Data Migration & Custom API Integrations (30% / $180,000) - Completed September 15.","- Milestone 3: User Acceptance Testing (UAT), Staff Training & Security Audit (30% / $180,000) - Target Date: November 10.","- Milestone 4: Final Enterprise Cutover, Go-Live Operations & Post-Deployment Support (20% / $120,000) - Target Date: December 20.","Section 4: Acceptance Criteria and Escrow Release Protocol","No milestone funds shall be disbursed from the Escrow Account without a formal Joint User Acceptance Testing (UAT) Sign-Off Certificate executed by the Authorized Project Directors of both parties.","Acceptance Standards: Milestone 3 requires at least 98% of predefined business testing scripts to be validated with zero Critical (Severity 1) or Major (Severity 2) defects. Minor cosmetic anomalies (Severity 3) shall not withhold sign-off, provided Vendor commits to rectifying them prior to Milestone 4 Go-Live.","[Passage 2: User Acceptance Testing (UAT) Sign-Off Certificate]","Document 2: User Acceptance Testing (UAT) Sign-Off Certificate","Horizon Retail Group - Quality Assurance Directorate","Milestone 3 Verification Protocol: Cloud ERP Migration","Target Evaluation Phase: Order-to-Cash (O2C) & Multi-Store Inventory Reconciliation","Testing Window: October 20 - November 8","Total Test Cases Executed: 150 test scenarios","Testing Results Summary:","- Passed Test Cases: 147 test cases (98.0% pass rate)","- Critical Defects (Severity 1): 0 defects identified","- Major Defects (Severity 2): 0 defects identified","- Minor Cosmetic Defects (Severity 3): 3 defects identified (Incident #301: Warehouse tablet display alignment issue; Incident #302: Slow PDF invoice generation under extreme batch load; Incident #303: Incorrect currency symbol on localized POS screen in Montreal branch).","Directorate Certification:","Because the 98% passing threshold has been achieved with zero Severity 1 and Severity 2 defects, Horizon Retail Group hereby approves Conditional Milestone 3 Sign-Off, subject to Axon deploying software patches for Incidents #301-#303 before the December 20 Go-Live cutover.","Authorized Signatures:","Markus Henderson, Project Director, Horizon Retail Group (Date: November 9)","Siddharth Patel, Delivery Lead, Axon Enterprise Systems (Date: November 9)","[Passage 3: Joint Bank Escrow Release Instruction]","Document 3: Joint Bank Escrow Release Instruction","To: Escrow Services Operations <escrow.disbursement@citicommercial.com>","From: Markus Henderson & Siddharth Patel","Date: November 10","Subject: Authorized Escrow Release - Milestone 3 Fulfillment (#ESC-44091)","Dear Escrow Services Team,","Re: Escrow Agreement #ESC-44091 (Horizon Retail Group / Axon Enterprise Systems)","Pursuant to Section 4 of Statement of Work #4 and Section 6 of the Master Escrow Agreement, the undersigned Authorized Representatives hereby provide joint written authorization for the release of Milestone 3 funds.","As evidenced by the attached fully executed UAT Sign-Off Certificate dated November 9, Axon Enterprise Systems has satisfactorily fulfilled all contractual requirements for Milestone 3 (User Acceptance Testing, Staff Training & Security Audit).","Please execute the following escrow fund transfer immediately:","- Escrow Account Number: #ESC-44091 (CitiCommercial Bank)","- Disbursement Amount: $180,000.00 USD (One hundred eighty thousand dollars)","- Beneficiary Account: Axon Enterprise Systems Inc. (Routing #021000089, Account #8841-99201)","- Value Date: November 12","Following this disbursement, the remaining balance of $120,000.00 USD shall continue to be held in escrow pending the successful completion of Milestone 4 (Final Enterprise Cutover & Go-Live).","Sincerely,","Markus Henderson, Project Director, Horizon Retail Group","Siddharth Patel, Delivery Lead, Axon Enterprise Systems","[ORIGINAL ETS QUESTIONS - CAU HOI TIENG ANH GOC]:","196. What was the total agreed value of the enterprise ERP implementation contract?","(A) $120,000","(B) $180,000","(C) $480,000","(D) $600,000","197. What condition was required for Milestone 3 to receive sign-off approval?","(A) Achieving at least a 98% pass rate with no critical or major defects","(B) Completing final data center cutover before November 10","(C) Eradicating all minor cosmetic anomalies across Montreal POS screens","(D) Transitioning 100% of staff to remote working environments","198. According to Document 2, what is Axon required to do before December 20?","(A) Refund $180,000 if Montreal stores fail to open","(B) Fix three minor cosmetic software issues via patches","(C) Conduct another 150 User Acceptance Testing scenarios","(D) Replace warehouse barcode tablet hardware","199. In Document 3, what instruction is given to CitiCommercial Bank?","(A) Close the escrow account and return all funds to Horizon Retail","(B) Transfer $180,000 from the escrow account to Axon's bank account","(C) Withhold all remaining payments until Milestone 4 is canceled","(D) Convert the escrow funds into foreign currency bonds","200. What is the remaining balance in Escrow Account #ESC-44091 after the authorized disbursement?","(A) $0","(B) $120,000","(C) $180,000","(D) $300,000","1.2. 1.2. Hướng dẫn làm bài Part 7: Chiến lược 5 phút tối ưu, Ghép nối Dữ kiện & Tóm tắt Feynman","[5-MINUTE STRATEGY GUIDE - CHIEN THUAT 5 PHUT]:","CHIẾN LƯỢC 5 PHÚT TỐI ƯU PART 7 (ÁP DỤNG BÀI ĐỌC BA VĂN BẢN NGHIỆM THU MILESTONE & GIẢI NGÂN ESCROW):","Bước 1 (30 giây) - Nắm bắt Bối cảnh & Luồng sự việc (Quỹ đạo chữ Z & 3 Câu hỏi Tiềm thức):","• Quét VB1: Phụ lục Hợp đồng SOW #4 triển khai ERP giữa Axon (Nhà thầu) và Horizon Retail (Bên Mua) -> Tổng giá trị $600,000 nạp vào tài khoản Ký quỹ (Escrow) tại CitiCommercial Bank; Milestone 3 chiếm 30% ($180,000), điều kiện pass >= 98% và 0 lỗi nghiêm trọng.","• Quét VB2: Biên bản Nghiệm thu UAT ngày 9/11 -> Chạy 150 kịch bản, đỗ 147 (đạt 98.0%), 0 lỗi nặng, chỉ có 3 lỗi nhỏ -> Ký nghiệm thu có điều kiện (vá lỗi trước Go-Live 20/12).","• Quét VB3: Lệnh liên danh giải ngân ký quỹ ngày 10/11 -> Ra lệnh ngân hàng chuyển $180,000 cho Axon vào ngày 12/11; số dư còn lại trong tài khoản ký quỹ là $120,000 cho Milestone 4.","Bước 2 (20 giây) - Quét 5 Câu hỏi & Gắn Móc Từ khóa:","• Câu 196: Tổng giá trị hợp đồng ở VB1 (Total Fixed-Price Value -> $600,000).","• Câu 197: Điều kiện nghiệm thu Milestone 3 ở VB1 (Acceptance Standards -> 98% pass with zero Severity 1/2).","• Câu 198: Nhiệm vụ của Axon trước 20/12 ở VB2 (deploy software patches for 3 minor defects).","• Câu 199: Lệnh gửi ngân hàng ở VB3 (Disbursement Amount $180,000 to Axon).","• Câu 200: Số dư còn lại trong Escrow ở VB3 (Remaining balance -> $120,000).","Bước 3 (3 phút 45 giây) - Giải quyết Cuốn chiếu & Dấu vết Tìm nhanh:","• Câu 196 (Chi tiết hợp đồng): VB1 ghi rõ ràng: 'Total Fixed-Price Contract Value: $600,000' -> Chọn (D).","• Câu 197 (Tiêu chuẩn kỹ thuật): Đọc Section 4 VB1: 'requires at least 98% of predefined business testing scripts to be validated with zero Critical (Severity 1) or Major (Severity 2) defects' -> Chọn (A).","• Câu 198 (Nghĩa vụ khắc phục): Đọc Directorate Certification ở VB2: 'subject to Axon deploying software patches for Incidents #301-#303 before the December 20 Go-Live cutover' -> 3 lỗi nhỏ cần vá phần mềm -> Chọn (B).","• Câu 199 (Nội dung lệnh ngân hàng): VB3: 'joint written authorization for the release of Milestone 3 funds... Disbursement Amount: $180,000.00 USD... Beneficiary Account: Axon Enterprise Systems' -> Chuyển $180,000 từ tài khoản ký quỹ sang tài khoản Axon -> Chọn (B).","• Câu 200 (Ghép nối số dư): VB3 đoạn cuối nêu rõ: 'Following this disbursement, the remaining balance of $120,000.00 USD shall continue to be held in escrow' (tương ứng 20% cho Milestone 4: $600,000 * 20% = $120,000) -> Chọn (B).","Bước 4 (25 giây) - Khóa sổ Đáp án & Tóm tắt Feynman 1 câu:","• Rà soát khóa đáp án: 196-D, 197-A, 198-B, 199-B, 200-B.","• Đúc kết Feynman: 'Dự án ERP $600,000 hoàn thành kiểm thử người dùng đạt 98% kịch bản, khách hàng ký nghiệm thu mốc 3 kèm điều kiện vá 3 lỗi nhỏ trước ngày vận hành chính thức, hai bên đồng ký lệnh mở tài khoản ký quỹ ngân hàng chuyển $180,000 cho nhà thầu và giữ lại $120,000 mốc cuối.'","1. ase execute the following escrow fund transfer immediately: Escrow Account Number: #ESC-44091 (CitiCommercial Bank). Disbursement Amount: $180,000.00 USD (One hundred eighty thousand dollars). Beneficiary Account: Axon Enterprise Systems Inc. (Routing #021000089, Account #8841-99201). Value Date: November 12.","Xin vui lòng thực hiện lệnh chuyển tiền ký quỹ sau đây ngay lập tức: Số Tài khoản Ký quỹ: #ESC-44091 (Ngân hàng CitiCommercial Bank). Số tiền Giải ngân: $180,000.00 USD (Một trăm tám mươi nghìn đô-la Mỹ). Tài khoản Thụ hưởng: Axon Enterprise Systems Inc. (Mã định tuyến Routing #021000089, Số tài khoản #8841-99201). Ngày Giá trị Hiệu lực: Ngày 12 tháng 11.","Following this disbursement, the remaining balance of $120,000.00 USD shall continue to be held in escrow pending the successful completion of Milestone 4 (Final Enterprise Cutover & Go-Live).","Tiếp sau đợt giải ngân này, số dư còn lại là $120,000.00 USD sẽ tiếp tục được nắm giữ trong tài khoản ký quỹ chờ đợi việc hoàn thành thành công Mốc 4 (Chuyển đổi Toàn diện Doanh nghiệp & Vận hành Chính thức Go-Live).","Sincerely, Markus Henderson, Project Director, Horizon Retail Group; Siddharth Patel, Delivery Lead, Axon Enterprise Systems.","Trân trọng, Markus Henderson, Giám đốc Dự án, Horizon Retail Group; Siddharth Patel, Trưởng nhóm Chuyển giao Giải pháp, Axon Enterprise Systems.","1.4. 1.4. Dịch chi tiết Câu hỏi & Phương án Trắc nghiệm","[TRANSLATED QUESTIONS & OPTIONS - CAU HOI VA DAP AN DICH NGHIA]:","Câu 196. Tổng giá trị đã thỏa thuận của hợp đồng triển khai hệ thống ERP doanh nghiệp là bao nhiêu?","(A) $120,000","(B) $180,000","(C) $480,000","(D) $600,000","Câu 197. Điều kiện nào bắt buộc phải có để Mốc 3 được phê duyệt ký nghiệm thu?","(A) Đạt tỷ lệ kịch bản kiểm thử đạt chuẩn ít nhất 98% và không có lỗi nghiêm trọng hoặc lỗi lớn nào.","(B) Hoàn tất việc chuyển đổi trung tâm dữ liệu cuối cùng trước ngày 10 tháng 11.","(C) Khắc phục triệt để mọi lỗi hiển thị nhỏ trên màn hình POS tại Montreal.","(D) Chuyển đổi 100% nhân sự sang môi trường làm việc từ xa.","Câu 198. Theo Văn bản 2, Axon bắt buộc phải thực hiện điều gì trước ngày 20 tháng 12?","(A) Hoàn trả $180,000 nếu các cửa hàng tại Montreal không khai trương được.","(B) Sửa chữa ba lỗi phần mềm hiển thị nhỏ thông qua các bản vá lỗi.","(C) Tiến hành thêm 150 kịch bản kiểm thử người dùng UAT nữa.","(D) Thay thế toàn bộ phần cứng máy tính bảng quét mã vạch trong kho.","Câu 199. Trong Văn bản 3, chỉ thị nào được gửi tới Ngân hàng CitiCommercial Bank?","(A) Đóng tài khoản ký quỹ và hoàn trả toàn bộ số tiền về cho Horizon Retail.","(B) Chuyển $180,000 từ tài khoản ký quỹ sang tài khoản ngân hàng của Axon.","(C) Giữ lại toàn bộ các khoản thanh toán còn lại cho đến khi Mốc 4 bị hủy bỏ.","(D) Chuyển đổi toàn bộ tiền ký quỹ sang trái phiếu ngoại tệ.","Câu 200. Số dư còn lại trong Tài khoản Ký quỹ #ESC-44091 sau đợt giải ngân được ủy quyền là bao nhiêu?","(A) $0","(B) $120,000","(C) $180,000","(D) $300,000","1.5. 1.5. Tóm tắt Viết lại Toàn bài theo Feynman (Feynman Monograph Summary)","[EXECUTIVE SUMMARY & CORE LOGIC - BAN TOM TAT COT LOI]:","English Executive Summary:","• Contract Structure & Escrow Governance: Horizon Retail and Axon Systems structured their $600,000 Cloud ERP agreement into four milestones backed by a CitiCommercial Bank escrow account, requiring joint UAT sign-off (≥98% pass rate with zero Severity 1/2 defects) to release funds.","• Milestone 3 UAT Verification: The quality audit completed on November 8 passed 147 of 150 scenarios (98.0%) with zero major bugs and only three minor UI issues, prompting Horizon to grant conditional acceptance on November 9 pending pre-Go-Live patches.","• Dual-Authorization Escrow Disbursement: On November 10, both project directors formally instructed CitiCommercial Bank to release $180,000 to Axon on November 12, maintaining the remaining $120,000 in escrow for Milestone 4 final cutover.","Bản tóm tắt Tiếng Việt cốt lõi:","• Cấu trúc Hợp đồng & Cơ chế Ký quỹ Escrow: Horizon Retail và Axon Systems triển khai hợp đồng ERP $600,000 qua 4 mốc với tài khoản ký quỹ ngân hàng CitiCommercial Bank, quy định giải ngân từng đợt chỉ khi có biên bản nghiệm thu UAT chung (đạt ≥98% kịch bản và 0 lỗi lớn).","• Kết quả Đánh giá Nghiệm thu Mốc 3: Đợt kiểm thử kết thúc ngày 8/11 đạt 147/150 kịch bản (98.0%), không có lỗi nghiêm trọng, chỉ tồn đọng 3 lỗi hiển thị nhỏ, giúp Horizon ký duyệt nghiệm thu có điều kiện ngày 9/11 kèm yêu cầu vá lỗi trước ngày Go-Live 20/12.","• Lệnh Đồng thuận Giải ngân Ngân hàng: Ngày 10/11, giám đốc hai bên cùng ký lệnh chỉ thị CitiCommercial Bank giải ngân $180,000 cho Axon vào ngày 12/11, tiếp tục phong tỏa số dư $120,000 cho mốc Go-Live vận hành cuối cùng.","PHẦN 2: PHẦN 2: ACTIVE RECALL 5 GIÂY (BẢNG MA TRẬN ĐỊNH VỊ SONG NGỮ)",{"t":"table","rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong & Vai tro"],["Bên Mua (Chủ đầu tư): Horizon Retail Group (Giám đốc Dự án Markus Henderson). Nhà thầu Công nghệ: Axon Enterprise Systems (Trưởng nhóm Siddharth Patel). Ngân hàng Trung gian Ký quỹ: CitiCommercial Bank.","Client (Buyer): Horizon Retail Group (Project Director Markus Henderson). Technology Contractor: Axon Enterprise Systems (Delivery Lead Siddharth Patel). Escrow Intermediary Bank: CitiCommercial Bank."]],[["2. Boi canh & Quy trinh loi"],["Hợp đồng dự án ERP $600,000 chia 4 mốc. Mốc 3 (UAT & Đào tạo) trị giá 30% ($180,000). Điều kiện giải ngân: Đạt tỷ lệ kiểm thử >=98% và 0 lỗi nghiêm trọng (Severity 1/2). Thực tế đạt 147/150 kịch bản (98.0%) nên đủ chuẩn nghiệm thu.","$600,000 ERP contract divided into 4 milestones. Milestone 3 (UAT & Training) represents 30% ($180,000). Release condition requires ≥98% test pass rate with 0 critical defects. Actual results achieved 147/150 (98.0%), qualifying for escrow release."]],[["3. Dau vet suy luan cheo"],["Đối soát số dư Escrow: Tổng cọc $600,000 - Mốc 1 ($120,000) - Mốc 2 ($180,000) - Mốc 3 ($180,000) = Số dư còn lại đúng $120,000 (tương ứng 20% cho Mốc 4 Go-Live cuối cùng).","Escrow financial balance reconciliation: Initial $600,000 less M1 ($120k), M2 ($180k), and M3 ($180k) leaves an exact remaining escrow balance of $120,000 (20% for Milestone 4 Go-Live)."]]]},"PHẦN 3: PHẦN 3: ĐÁP ÁN CHUẨN XÁC & DẤU VẾT TRUY XUẤT CHÉO (CROSS-REFERENCING & COMPREHENSIVE TRAP BREAKDOWN)","196. What was the total agreed value of the enterprise ERP implementation contract?","Dap an dung: (D) $600,000","[Dau vet bai doc / Clue]: Document 1, Section 3: 'Total Fixed-Price Contract Value: $600,000. All contract funds have been deposited upfront into an interest-bearing Bank Escrow Account...'","[Dien dat tuong duong / Paraphrase]:","• Total Fixed-Price Contract Value: $600,000 <=> Total agreed value was $600,000.","[Loi giai chi tiet]: Văn bản 1 ghi rõ ràng ở đầu Điều khoản 3: Tổng giá trị hợp đồng trọn gói cố định là $600,000 ('Total Fixed-Price Contract Value: $600,000').","[Phan tich Phuong an Sai & Bay De thi ETS]:","(A) $120,000","- Ly do sai: Đây là giá trị của Mốc 1 (20%) hoặc Mốc 4 (20%), không phải tổng giá trị hợp đồng.","- Bay ETS: Bẫy Giá trị Mốc Đơn lẻ (Milestone Portion Trap)","(B) $180,000","- Ly do sai: Đây là giá trị của riêng Mốc 2 hoặc Mốc 3 (30%), không phải toàn bộ hợp đồng.","- Bay ETS: Bẫy Giá trị Mốc Hiện tại (Current Milestone Trap)","(C) $480,000","- Ly do sai: Đây là tổng giá trị tích lũy của 3 mốc đầu tiên ($120k + $180k + $180k = $480k).","- Bay ETS: Bẫy Tổng Tích lũy Bộ phận (Partial Sum Trap)","197. What condition was required for Milestone 3 to receive sign-off approval?","Dap an dung: (A) Achieving at least a 98% pass rate with no critical or major defects","[Dau vet bai doc / Clue]: Document 1, Section 4: 'Milestone 3 requires at least 98% of predefined business testing scripts to be validated with zero Critical (Severity 1) or Major (Severity 2) defects.'","[Dien dat tuong duong / Paraphrase]:","• at least 98% of predefined business testing scripts validated with zero Critical or Major defects <=> Achieving at least a 98% pass rate with no critical or major defects.","[Loi giai chi tiet]: Tiêu chuẩn nghiệm thu được quy định tại Điều khoản 4 của Văn bản 1: Mốc 3 bắt buộc phải đạt tối thiểu 98% kịch bản kiểm thử hợp lệ và không có bất kỳ lỗi Mức độ 1 (Critical) hoặc Mức độ 2 (Major) nào.","[Phan tich Phuong an Sai & Bay De thi ETS]:","(B) Completing final data center cutover before November 10","- Ly do sai: Chuyển đổi toàn diện dữ liệu thuộc Mốc 4 (hạn ngày 20/12), không phải Mốc 3.","- Bay ETS: Bẫy Nhầm lẫn Phạm vi Mốc (Scope Confusion Trap)","(C) Eradicating all minor cosmetic anomalies across Montreal POS screens","- Ly do sai: Hợp đồng nêu rõ lỗi hiển thị nhỏ (Severity 3) không làm đình trệ nghiệm thu mốc 3 mà được sửa trước mốc 4.","- Bay ETS: Bẫy Tuyệt đối hóa Lỗi Giao diện (Minor Defect Trap)","(D) Transitioning 100% of staff to remote working environments","- Ly do sai: Không có điều khoản nào đề cập đến việc chuyển nhân viên sang làm việc từ xa.","- Bay ETS: Bẫy Thông tin Bịa đặt (Fabricated Trap)","198. According to Document 2, what is Axon required to do before December 20?","Dap an dung: (B) Fix three minor cosmetic software issues via patches","[Dau vet bai doc / Clue]: Document 2 Directorate Certification: 'Horizon Retail Group hereby approves Conditional Milestone 3 Sign-Off, subject to Axon deploying software patches for Incidents #301-#303 before the December 20 Go-Live cutover.'","[Dien dat tuong duong / Paraphrase]:","• deploying software patches for Incidents #301-#303 before December 20 <=> Fix three minor cosmetic software issues via patches.","[Loi giai chi tiet]: Văn bản 2 nêu rõ điều kiện để được nghiệm thu Mốc 3 là Axon phải phát hành các bản vá phần mềm cho 3 sự cố nhỏ (#301, #302, #303) trước ngày vận hành chính thức 20/12.","[Phan tich Phuong an Sai & Bay De thi ETS]:","(A) Refund $180,000 if Montreal stores fail to open","- Ly do sai: Chi nhánh Montreal chỉ bị lỗi ký hiệu tiền tệ trên màn hình POS, không có điều khoản đòi hoàn tiền nếu không mở cửa.","- Bay ETS: Bẫy Cường điệu Hậu quả (Exaggerated Consequence Trap)","(C) Conduct another 150 User Acceptance Testing scenarios","- Ly do sai: Giai đoạn kiểm thử UAT 150 kịch bản đã hoàn tất thành công, không phải làm lại từ đầu.","- Bay ETS: Bẫy Lặp lại Quy trình (Process Duplication Trap)","(D) Replace warehouse barcode tablet hardware","- Ly do sai: Sự cố máy tính bảng kho là lỗi căn chỉnh hiển thị phần mềm (display alignment issue), không phải hỏng phần cứng.","- Bay ETS: Bẫy Phần mềm vs Phần cứng (Software vs Hardware Trap)","199. In Document 3, what instruction is given to CitiCommercial Bank?","Dap an dung: (B) Transfer $180,000 from the escrow account to Axon's bank account","[Dau vet bai doc / Clue]: Document 3: 'Please execute the following escrow fund transfer immediately: Escrow Account Number: #ESC-44091... Disbursement Amount: $180,000.00 USD... Beneficiary Account: Axon Enterprise Systems Inc.'","[Dien dat tuong duong / Paraphrase]:","• execute escrow fund transfer Disbursement Amount $180,000 to Beneficiary Axon Enterprise Systems <=> Transfer $180,000 from the escrow account to Axon's bank account.","[Loi giai chi tiet]: Văn bản 3 là lệnh liên danh ủy quyền giải ngân gửi ngân hàng quản lý tài khoản ký quỹ CitiCommercial Bank, yêu cầu giải ngân ngay số tiền $180,000 từ tài khoản ký quỹ #ESC-44091 chuyển vào tài khoản thanh toán của nhà thầu Axon.","[Phan tich Phuong an Sai & Bay De thi ETS]:","(A) Close the escrow account and return all funds to Horizon Retail","- Ly do sai: Tài khoản ký quỹ vẫn tiếp tục mở để nắm giữ $120,000 cho Mốc 4, không bị đóng.","- Bay ETS: Bẫy Đóng Tài khoản Nhầm lẫn (Account Closure Trap)","(C) Withhold all remaining payments until Milestone 4 is canceled","- Ly do sai: Không có việc hủy bỏ Mốc 4; tiền Mốc 4 được giữ lại để chờ nghiệm thu khi Go-Live.","- Bay ETS: Bẫy Suy đoán Tiêu cực (Negative Fabrication Trap)","(D) Convert the escrow funds into foreign currency bonds","- Ly do sai: Lệnh giải ngân chuyển tiền mặt USD trực tiếp, không đầu tư vào trái phiếu ngoại tệ.","- Bay ETS: Bẫy Nghiệp vụ Ngân hàng Bịa đặt (Banking Distortion Trap)","200. What is the remaining balance in Escrow Account #ESC-44091 after the authorized disbursement?","Dap an dung: (B) $120,000","[Dau vet bai doc / Clue]: Document 3, Paragraph 4: 'Following this disbursement, the remaining balance of $120,000.00 USD shall continue to be held in escrow pending the successful completion of Milestone 4...'","[Dien dat tuong duong / Paraphrase]:","• the remaining balance of $120,000.00 USD shall continue to be held in escrow <=> The remaining balance in the escrow account is $120,000.","[Loi giai chi tiet]: Đoạn cuối của Văn bản 3 ghi rõ: sau đợt giải ngân $180,000 cho Mốc 3, số dư còn lại tiếp tục được phong tỏa trong tài khoản ký quỹ là $120,000 (tương ứng với 20% cho Mốc 4).","[Phan tich Phuong an Sai & Bay De thi ETS]:","(A) $0","- Ly do sai: Tài khoản vẫn còn $120,000 chưa giải ngân cho Mốc 4 cuối cùng.","- Bay ETS: Bẫy Số dư Bằng Không (Zero Balance Trap)","(C) $180,000","- Ly do sai: Đây là số tiền vừa được giải ngân cho Mốc 3, không phải số dư còn lại.","- Bay ETS: Bẫy Số liệu Giải ngân (Disbursed Amount Trap)","(D) $300,000","- Ly do sai: Đây là số dư trước khi giải ngân Mốc 3 ($180k + $120k = $300k).","- Bay ETS: Bẫy Số dư Trước Giải ngân (Pre-disbursement Balance Trap)","PHẦN 4: PHẦN 4: KỸ THUẬT FEYNMAN SONG NGỮ & SƠ ĐỒ QUY TRÌNH (TƯ DUY BA & PHÁP LÝ HỢP ĐỒNG)","4.1. 4.1. Sơ đồ Quy trình Luân chuyển Nghiệp vụ (End-to-End Business Workflow Diagram)",{"t":"table","rows":[[["BƯỚC 1","KIỂM THỬ UAT & ĐỐI SOÁT CHỈ TIÊU"],[],["BƯỚC 2","KÝ BIÊN BẢN LIÊN DANH & LỆNH GIẢI NGÂN"],[],["BƯỚC 3","CHUYỂN TIỀN NGÂN HÀNG & PHONG TỎA SỐ DƯ"]],[["• Chung tu & Kenh: Hệ thống Quản lý Kiểm thử (Test Management System) & SOW #4","• Nghiep vu thuc thi: Chạy 150 kịch bản kiểm thử O2C; đạt 147 ca (98.0%), 0 lỗi lớn, phát hiện 3 lỗi hiển thị nhỏ.","• Ket qua & Kiem soat: Biên bản kiểm thử nghiệm thu người dùng (UAT Sign-off) phê duyệt có điều kiện."],["➔"],["• Chung tu & Kenh: Chứng chỉ Nghiệm thu UAT & Thỏa thuận Ký quỹ Escrow","• Nghiep vu thuc thi: Giám đốc hai bên ký nghiệm thu Mốc 3 và lập lệnh liên danh chỉ thị ngân hàng giải ngân $180,000.","• Ket qua & Kiem soat: Văn bản ủy quyền liên danh giải ngân gửi Ngân hàng CitiCommercial Bank."],["➔"],["• Chung tu & Kenh: Hệ thống Ngân hàng Doanh nghiệp CitiCommercial Bank","• Nghiep vu thuc thi: Ngân hàng giải ngân $180,000 sang tài khoản nhà thầu Axon và tiếp tục phong tỏa $120,000 cho Mốc 4.","• Ket qua & Kiem soat: Điện chuyển tiền giải ngân thành công và Sổ kê tài khoản ký quỹ ghi nhận số dư $120,000."]]]},{"t":"table","rows":[[["STEP 1","UAT EXECUTION & METRIC VALIDATION"],[],["STEP 2","JOINT SIGN-OFF & ESCROW INSTRUCTION"],[],["STEP 3","INTERBANK WIRE & BALANCE RETENTION"]],[["• Documents & Channels: QA Test Management Tool & Project Statement of Work #4","• Operational Actions: Execute 150 Order-to-Cash test scripts; achieve 98.0% pass rate (147/150) with zero critical bugs.","• Output Deliverables & Controls: Formal User Acceptance Testing Certificate approved with conditional patch commitment."],["➔"],["• Documents & Channels: Fully Executed UAT Certificate & Master Escrow Agreement","• Operational Actions: Both Project Directors co-sign Milestone 3 acceptance and generate joint escrow disbursement order.","• Output Deliverables & Controls: Irrevocable joint authorization letter instructing CitiCommercial Bank to release $180,000."],["➔"],["• Documents & Channels: CitiCommercial Corporate Escrow Processing Platform","• Operational Actions: Disburse $180,000 wire to Axon's operational account and maintain $120,000 balance for Milestone 4.","• Output Deliverables & Controls: Executed wire transfer voucher & updated escrow ledger showing $120,000 remaining reserve."]]]},"4.2. 4.2. Tư duy Phân tích Nghiệp vụ & Quản trị Hợp đồng (Bản Tiếng Việt)","• Bức tranh Toàn cảnh Hợp đồng & Pháp lý (End-to-End Flow): Trong các dự án chuyển đổi số và triển khai phần mềm doanh nghiệp quy mô lớn (Enterprise ERP Implementation & Systems Integration), mô hình Thanh toán Theo Mốc (Milestone-based Payments) kết hợp Tài khoản Ký quỹ Ngân hàng (Bank Escrow Account) là giải pháp quản trị rủi ro tài chính tiêu chuẩn quốc tế. Khách hàng nạp trước 100% kinh phí vào tài khoản ngân hàng trung gian độc lập để nhà thầu yên tâm về khả năng thanh toán, nhưng tiền chỉ được mở khóa giải ngân từng phần (20%-30%) khi có Biên bản Nghiệm thu Người dùng (UAT Sign-off) có chữ ký số của cả hai bên. Chu kỳ mốc khép kín gồm: Thực thi kịch bản kiểm thử -> Đối chiếu tiêu chí chấp thuận (>=98% pass, 0 lỗi nghiêm trọng) -> Ký nghiệm thu có điều kiện (vá lỗi nhỏ trước Go-Live) -> Phát hành lệnh giải ngân liên danh gửi ngân hàng -> Chuyển tiền vào tài khoản nhà thầu và tiếp tục bảo lưu số dư cho mốc tiếp theo.","• Điểm nghẽn & Rủi ro Tranh chấp Thực tế (Core Bottleneck & Risk): Nút thắt lớn nhất là hiện tượng 'Kéo dài Nghiệm thu UAT' (UAT Scope Creep & Sign-off Stalemates). Khách hàng thường vin vào các lỗi hiển thị nhỏ (cosmetic bugs như lệch font, hiển thị sai đơn vị tiền tệ) để từ chối ký nghiệm thu mốc và trì hoãn giải ngân tiền cho nhà thầu. Ngược lại, nhà thầu muốn Go-Live nhanh để thu tiền dù hệ thống còn lỗi tích hợp ngầm. Nếu hợp đồng không định nghĩa rõ ràng phân cấp mức độ lỗi (Severity 1: Dừng hệ thống, Severity 2: Lỗi lớn gián đoạn, Severity 3: Lỗi giao diện nhỏ) và tỷ lệ chấp thuận định lượng (98%), dự án sẽ rơi vào bế tắc tranh chấp.","• 3 Giải pháp Thiết kế Hệ thống & Kiểm soát Hợp đồng (BA & Legal Compliance Architecture):","(1) Chuẩn hóa Ma trận Phân cấp Lỗi Nghiệp vụ (Defect Severity Matrix with Quantitative Thresholds): Định nghĩa trong hợp đồng chỉ có lỗi Severity 1 & 2 mới được quyền từ chối nghiệm thu; các lỗi Severity 3 được đưa vào danh mục Punch-List và xử lý bằng các bản vá (patches) trong thời gian đệm trước ngày Go-Live.","(2) Cơ chế Ký quỹ Mở khóa Từng phần (Phased Escrow Release with Joint Digital Mandate): Thiết lập quy trình ngân hàng bắt buộc phải có chữ ký số kép (dual-key cryptographic authorization) từ cả hai giám đốc dự án mới giải ngân, ngăn chặn việc một bên tự ý rút tiền hoặc phong tỏa vô lý.","(3) Điều khoản Nghiệm thu Mặc nhiên (Deemed Acceptance Clause): Quy định nếu sau 15 ngày làm việc kể từ khi hoàn tất kiểm thử mà khách hàng không đưa ra văn bản từ chối kèm bằng chứng lỗi cụ thể, mốc thanh toán sẽ tự động được coi là nghiệm thu thành công (deemed accepted) để bảo vệ dòng tiền cho nhà thầu.","4.3. 4.3. Business Analyst & Contract Management Executive Summary (Bản Tiếng Anh)","• End-to-End Contract & Legal Context: In enterprise software integration and digital transformation agreements, milestone deliverables governed by third-party bank escrow structures mitigate performance and credit risks for both parties. The buyer demonstrates solvency by funding the full contract upfront into an independent escrow facility, while the integration vendor is incentivized to achieve verifiable milestones to unlock capital tranches. The operational governance pipeline encompasses test scenario execution, quantitative validation against contractual acceptance criteria (≥98% pass rate with zero Severity 1/2 defects), conditional sign-off documentation, dual-authorized escrow disbursement vouchers, and automated interbank wire settlement.","• Core Operational Bottleneck & Dispute Risk: The primary implementation failure mode is 'UAT Sign-off Stalemate' resulting from subjective defect classification. Clients frequently weaponize minor cosmetic defects (e.g., localized currency glyphs or screen layout margins) to withhold milestone sign-offs, creating severe cash flow crises for system integrators. Conversely, vendors attempt premature cutovers while latent functional discrepancies persist. Contractual ambiguity regarding defect severity classifications and failure to establish quantitative passing thresholds inevitably lead to project paralysis.","• Key BA & Contract Compliance Architecture Solutions:","(1) Rigorous Defect Severity Categorization Framework: Contractually establish that only blocking defects (Severity 1/2) impede milestone acceptance, while cosmetic bugs (Severity 3) are logged into pre-Go-Live patch warranty punch lists.","(2) Dual-Key Escrow Release Protocols: Implement multi-signature banking mandates requiring simultaneous cryptographic authorization from both buyer and vendor project executives prior to wire release, safeguarding fiduciary controls.","(3) Deemed Acceptance Provisions: Incorporate automatic deemed acceptance clauses triggering fund release if the buyer fails to furnish formal written defect objections within 15 business days following formal test completion.","4.4. 4.4. Tam giác Liên kết Nhận thức Đa chiều (Multi-Perspective Contextual Anchoring)","1. Lăng kính Hợp đồng CNTT / Viễn thông Viettel: Quản trị các dự án phần mềm Viettel Solutions ký hợp đồng với khách hàng doanh nghiệp hoặc cơ quan nhà nước. Các dự án CNTT luôn chia làm 4 mốc: (1) Khảo sát thiết kế URD/SRS, (2) Lập trình & Tích hợp API, (3) Kiểm thử chấp nhận người dùng UAT & Đào tạo, (4) Nghiệm thu Golive & Bảo hành. Viettel luôn ký biên bản UAT rõ ràng, phân loại lỗi Severity 1-2-3 để tránh bị chủ đầu tư chậm trễ thanh toán giai đoạn.","2. Lăng kính Quản trị Trường Mầm non Ước Mơ Xanh (cô Thu Huyền): Hợp đồng thuê đơn vị công nghệ xây dựng 'Phần mềm Quản lý Học sinh & Điểm danh Nhận diện Khuôn mặt Mầm non'. Nhà trường và đối tác chia hợp đồng làm 3 giai đoạn thanh toán: giai đoạn 1 (bàn giao thiết bị camera), giai đoạn 2 (thử nghiệm điểm danh thử 1 tháng đạt độ chính xác >98% mới thanh toán 40% tiếp theo), và giai đoạn 3 (bảo hành phần mềm sau 1 năm mới thanh toán 20% tiền giữ lại).","3. Lăng kính Bàn học Gia đình (Kèm cặp học sinh Lớp 5 - Bé Hà Ngân): Kế hoạch ôn tập toán 4 giai đoạn (Milestone Study Plan): Bố và Hà Ngân chia mục tiêu học kỳ 1 thành 4 mốc: Mốc 1 (Học chắc phân số), Mốc 2 (Giải toán chuyển động đều), Mốc 3 (Làm đề thi thử đạt >= 9 điểm với 0 lỗi tính toán ẩu), Mốc 4 (Thi học kỳ chính thức). Khi Hà Ngân hoàn thành Mốc 3 đạt điểm số cam kết, con được 'giải ngân phần thưởng' là một chuyến đi nhà sách mua bộ truyện yêu thích.","PHẦN 5: PHẦN 5: TỪ VỰNG & PARAPHRASE CHUYÊN SÂU (CHUẨN 3 DÒNG TỐI ƯU NẠP ANKI)","1. Statement of Work (SOW)  /ˈsteɪt.mənt əv wɜːk/  = Detailed Project Scope and Deliverables Document","Nghia: Bản mô tả phạm vi công việc chi tiết, sản phẩm bàn giao và mốc tiến độ hợp đồng.","Vd: The deliverables for each deployment phase are formally documented in Statement of Work #4. - Các sản phẩm bàn giao cho từng giai đoạn triển khai được ghi nhận chính thức trong Bản mô tả Phạm vi Công việc SOW #4.","2. User Acceptance Testing (UAT)  /ˈjuː.zər əkˈsep.təns ˈtes.tɪŋ/  = End-User Operational Verification Phase","Nghia: Giai đoạn kiểm thử nghiệm thu hệ thống bởi người dùng thực tế trước khi vận hành chính thức.","Vd: The software passed User Acceptance Testing with an impressive 98% success rate. - Phần mềm đã vượt qua giai đoạn Kiểm thử Nghiệm thu Người dùng với tỷ lệ thành công ấn tượng đạt 98%.","3. Escrow Account Disbursement  /ˈes.krəʊ əˈkaʊnt dɪsˈbɜːs.mənt/  = Release of Third-Party Held Funds","Nghia: Việc giải ngân nguồn tiền được nắm giữ trong tài khoản ký quỹ trung gian của ngân hàng.","Vd: Both project directors authorized the escrow account disbursement following successful testing. - Cả hai giám đốc dự án đã phê duyệt lệnh giải ngân tài khoản ký quỹ sau khi kiểm thử thành công.","4. Milestone Deliverable  /ˈmaɪl.stəʊn dɪˈlɪv.ər.ə.bəl/  = Phased Project Output Required for Payment","Nghia: Sản phẩm hoặc kết quả công việc phải hoàn thành tại một mốc dự án để được thanh toán.","Vd: The system design blueprint served as the primary milestone deliverable for Phase 1. - Bản vẽ thiết kế hệ thống đóng vai trò là sản phẩm bàn giao mốc quan trọng cho Giai đoạn 1.","5. Severity 1 Critical Defect  /sɪˈver.ə.ti wʌn ˈkrɪt.ɪ.kəl ˈdiː.fekt/  = System-Halting Blocker / High-Priority Bug","Nghia: Lỗi kỹ thuật nghiêm trọng cấp độ 1 làm ngưng trệ hoàn toàn hoạt động của hệ thống.","Vd: Sign-off was strictly contingent on achieving zero Severity 1 critical defects. - Việc ký nghiệm thu phụ thuộc nghiêm ngặt vào điều kiện không có bất kỳ lỗi nghiêm trọng cấp độ 1 nào.","6. Conditional Sign-Off  /kənˈdɪʃ.ən.əl saɪn ɒf/  = Approval Contingent on Subsequent Fixes","Nghia: Việc phê duyệt nghiệm thu có điều kiện kèm cam kết phải sửa các lỗi nhỏ còn tồn đọng.","Vd: The client granted conditional sign-off provided minor cosmetic issues were resolved before Go-Live. - Khách hàng chấp thuận ký nghiệm thu có điều kiện với yêu cầu các lỗi hiển thị nhỏ phải được xử lý trước ngày vận hành.","7. Cutover & Go-Live  /ˈkʌtˌəʊ.vər ænd ɡəʊ laɪv/  = System Transition to Live Production Operations","Nghia: Thời điểm chuyển đổi dữ liệu và chính thức đưa hệ thống mới vào vận hành thực tế.","Vd: The final cutover and Go-Live is scheduled for December 20 across all regional retail stores. - Thời điểm chuyển đổi và đưa vào vận hành chính thức được ấn định vào ngày 20 tháng 12 trên toàn bộ chuỗi bán lẻ khu vực.","BÀI 6: Điều khoản Trọng tài Thương mại Quốc tế, Tranh chấp Chậm trễ Vận chuyển Hàng hải & Miễn trừ Bất khả kháng (Force Majeure) (Questions 181-185 - Double Passage)","Nguồn: Nguồn: ETS TOEIC Part 7 — Double Passage (Maritime Charter Contract Dispute Clause & Formal Notice of Force Majeure Rejection)","PHẦN 1: PHẦN 1: NỘI DUNG BÀI ĐỌC & DỊCH NGHĨA SONG NGỮ","1.1. 1.1. Đề thi Tiếng Anh gốc (Strategy Guide & Original ETS Passages)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","Questions 181-185 refer to the following two documents.","[Passage 1: Ocean Freight Charter Party Contract (Extract)]","Document 1: Ocean Freight Charter Party Contract (Extract)","Clause 28: Dispute Resolution, Demurrage & Force Majeure","28.1 Arbitration Clause: Any dispute, controversy, or claim arising out of or in connection with this Maritime Transportation Contract, including its breach, termination, or invalidity, shall be referred to and finally resolved by arbitration administered by the Singapore International Arbitration Centre (SIAC) in accordance with the Arbitration Rules of the SIAC for the time being in force. The arbitral tribunal shall consist of three (3) arbitrators. The seat of arbitration shall be Singapore, and the proceedings shall be conducted in the English language.","28.2 Liquidated Demurrage Penalties: If Charterer or Carrier delays cargo loading or discharge beyond the agreed laytime of four (4) business days, demurrage charges shall accrue at a liquidated rate of $15,000 per running day until completion.","28.3 Force Majeure Invocation: Neither party shall be liable for failure to perform its delivery obligations if such delay results directly from an Event of Force Majeure (acts of God, naval blockades, war, typhoons, or closed shipping straits).","Notice Requirement: The party invoking Force Majeure must serve written notice accompanied by official certified documentation from the local Chamber of Commerce or Maritime Port Authority within five (5) calendar days of the occurrence. Failure to provide timely notice shall permanently waive the right to claim exemption from demurrage liability.","[Passage 2: Legal Demand Letter]","Document 2: Legal Demand Letter","Maritime Law Practice Group - Rajah & Tan LLC (Counsel for Global Agro-Grain Importers)","Marina Bay Financial Centre, Singapore","October 24","To: Captain Hans Richter, Managing Director","Pacific Bulk Navigation Ltd.","Ocean Gateway Tower, Hong Kong","RE: Formal Rejection of Force Majeure Claim & Notice of SIAC Arbitration Filing (Vessel: MV Pacific Horizon)","Dear Captain Richter,","We represent Global Agro-Grain Importers (\"Global Grain\") regarding Charter Party Agreement #CP-8802 for the transport of 45,000 metric tons of bulk grain from Port Kembla, Australia to Hai Phong, Vietnam.","Your vessel, MV Pacific Horizon, arrived at the discharge port twenty-two (22) days behind the contractual Delivery Window of October 1. On October 18, Pacific Bulk Navigation submitted an untimely letter attempting to invoke Section 28.3 (Force Majeure), attributing the 22-day delay to Typhoon Ketsana in the South China Sea.","On behalf of Global Grain, we hereby formally reject your Force Majeure defense on two indisputable legal grounds:","1. Forfeiture Due to Untimely Notice: Section 28.3 explicitly requires Force Majeure notice to be served within five (5) calendar days of the occurrence with certified port authority seals. Meteorological data confirms Typhoon Ketsana dissipated on September 28. Your notice was transmitted on October 18—twenty (20) days post-event. By the express terms of Section 28.3, your failure to give timely notice constitutes an irrevocable waiver of liability exemption.","2. Contributory Operational Negligence: AIS satellite vessel-tracking logs demonstrate that MV Pacific Horizon remained stationary at anchor off Manila Bay for fourteen (14) days not due to typhoon conditions, but due to an unannounced crew labor strike and maritime bunkering payment dispute between Pacific Bulk and its fuel vendor.","Global Grain has sustained severe cargo spoilage and processing downtime totaling $195,000, alongside $270,000 in accrued demurrage ($15,000/day for 18 days beyond laytime).","Unless Pacific Bulk remits full settlement of $465,000 to our client's trust account by November 5, we have been instructed to formally lodge our Notice of Arbitration with the SIAC Registrar in Singapore and seek a pre-judgment maritime asset arrest warrant against your vessels.","Sincerely,","Kenneth Tan, Senior Partner","Rajah & Tan LLC","[ORIGINAL ETS QUESTIONS - CAU HOI TIENG ANH GOC]:","181. According to Clause 28.1, how must unresolved commercial disputes be handled?","(A) Through civil court litigation in Hong Kong","(B) By binding arbitration administered by the SIAC in Singapore","(C) Through informal mediation organized by Australian port authorities","(D) By immediate cancellation of the charter party contract without damages","182. Under Section 28.3, what must a party provide to successfully claim Force Majeure?","(A) A full refund of all prepaid maritime freight charges","(B) Written notice with certified official documentation within five days","(C) Approval from the international maritime insurance syndicate","(D) A replacement cargo vessel dispatched within twenty-four hours","183. Why did Global Grain reject Pacific Bulk Navigation's Force Majeure claim?","(A) The grain cargo was delivered undamaged ahead of schedule.","(B) The vessel operated under an expired maritime transport license.","(C) The notice was submitted late and part of the delay was caused by a labor dispute.","(D) Typhoon Ketsana never made landfall in the Asia-Pacific region.","184. What did AIS satellite tracking data reveal about the MV Pacific Horizon?","(A) It sailed directly through the center of Typhoon Ketsana.","(B) It remained anchored near Manila due to a fuel dispute and crew strike.","(C) It diverted to Australia to take on additional bulk containers.","(D) It was detained by Vietnamese maritime customs officers.","185. What action will Rajah & Tan LLC take if payment is NOT received by November 5?","(A) Terminate the charter party agreement retroactively","(B) File a Notice of Arbitration with the SIAC and seek an asset arrest warrant","(C) Request emergency financial assistance from the Chamber of Commerce","(D) Sell the grain cargo at an international public auction","1.2. 1.2. Hướng dẫn làm bài Part 7: Chiến lược 5 phút tối ưu, Ghép nối Dữ kiện & Tóm tắt Feynman","[5-MINUTE STRATEGY GUIDE - CHIEN THUAT 5 PHUT]:","CHIẾN LƯỢC 5 PHÚT TỐI ƯU PART 7 (ÁP DỤNG BÀI ĐỌC ĐOẠN ĐÔI TRANH CHẤP TRỌNG TÀI SIAC & BẤT KHẢ KHÁNG):","Bước 1 (30 giây) - Nắm bắt Bối cảnh & Luồng sự việc (Quỹ đạo chữ Z & 3 Câu hỏi Tiềm thức):","• Quét VB1: Điều khoản Hợp đồng Vận tải Hàng hải (Clause 28) -> Trọng tài Quốc tế SIAC tại Singapore (3 trọng tài viên, tiếng Anh), tiền phạt chậm dỡ hàng (Demurrage) $15,000/ngày, Bất khả kháng (Force Majeure) phải nộp thông báo kèm xác nhận chính thức trong vòng 5 ngày nếu không sẽ mất quyền miễn trừ.","• Quét VB2: Thư đòi bồi thường của Luật sư Kenneth Tan (đại diện Global Grain) gửi Pacific Bulk -> Tàu MV Pacific Horizon đến trễ 22 ngày; Pacific Bulk nại lý do bão nộp thông báo ngày 18/10 (quá hạn 20 ngày sau bão); dữ liệu vệ tinh AIS phát hiện tàu neo đậu 14 ngày ở Manila do bãi công và nợ tiền dầu -> Đòi $465,000 trước 5/11 nếu không sẽ kiện ra SIAC và xin lệnh bắt giữ tàu.","Bước 2 (20 giây) - Quét 5 Câu hỏi & Gắn Móc Từ khóa:","• Câu 181: Cơ chế giải quyết tranh chấp ở VB1 (Clause 28.1 -> SIAC in Singapore).","• Câu 182: Điều kiện hưởng Bất khả kháng ở VB1 (Section 28.3 -> written notice with certified documentation within 5 days).","• Câu 183: Lý do bác bỏ Bất khả kháng ở VB2 (untimely notice + delay caused by labor dispute).","• Câu 184: Dữ liệu vệ tinh AIS phát hiện điều gì ở VB2 (anchored off Manila Bay due to labor strike and fuel dispute).","• Câu 185: Hậu quả nếu không trả tiền trước 5/11 ở VB2 (file Notice of Arbitration with SIAC & asset arrest warrant).","Bước 3 (3 phút 45 giây) - Giải quyết Cuốn chiếu & Dấu vết Tìm nhanh:","• Câu 181 (Chi tiết trọng tài): Đọc Clause 28.1 VB1: 'finally resolved by arbitration administered by the Singapore International Arbitration Centre (SIAC)' -> Chọn (B).","• Câu 182 (Điều kiện thông báo): Đọc Section 28.3 VB1: 'must serve written notice accompanied by official certified documentation... within five (5) calendar days' -> Chọn (B).","• Câu 183 (Ghép nối 2 lý do bác bỏ): VB2 nêu 2 căn cứ: nộp muộn sau bão 20 ngày và thực tế tàu đỗ do bãi công/nợ tiền dầu -> Khớp đáp án (C).","• Câu 184 (Dữ liệu vệ tinh AIS): VB2 mục 2: 'AIS satellite vessel-tracking logs demonstrate that MV Pacific Horizon remained stationary at anchor off Manila Bay for fourteen (14) days... due to an unannounced crew labor strike and maritime bunkering payment dispute' -> Chọn (B).","• Câu 185 (Hành động pháp lý tiếp theo): VB2 đoạn cuối: 'Unless Pacific Bulk remits full settlement of $465,000... by November 5, we have been instructed to formally lodge our Notice of Arbitration with the SIAC Registrar... and seek a pre-judgment maritime asset arrest warrant' -> Chọn (B).","Bước 4 (25 giây) - Khóa sổ Đáp án & Tóm tắt Feynman 1 câu:","• Rà soát khóa đáp án: 181-B, 182-B, 183-C, 184-B, 185-B.","• Đúc kết Feynman: 'Chủ tàu giao hàng trễ 22 ngày đổ lỗi cho bão nhưng bị lộ tẩy dữ liệu vệ tinh chứng minh tàu dừng 14 ngày do thủy thủ đình công và nợ tiền dầu, lại còn nộp đơn báo bão trễ hạn nên bị luật sư bên mua đòi bồi thường $465,000 dọa kiện ra Trọng tài SIAC Singapore và xin lệnh bắt tàu.'","1.3. 1.3. Bản dịch Song ngữ Từng câu (Sentence-by-Sentence Translation)","[SENTENCE-BY-SENTENCE BILINGUAL TRANSLATION - BAN DICH SONG NGU TUNG CAU]:","[Văn bản 1: Hợp đồng Thuê Tàu Vận tải Biển (Trích đoạn)]","Document 1: Ocean Freight Charter Party Contract (Extract)","Clause 28: Dispute Resolution, Demurrage & Force Majeure","Văn bản 1: Hợp đồng Thuê Tàu Vận tải Biển (Trích đoạn)","Điều khoản 28: Giải quyết Tranh chấp, Phí Lưu Tàu & Bất Khả Kháng","28.1 Arbitration Clause: Any dispute, controversy, or claim arising out of or in connection with this Maritime Transportation Contract, including its breach, termination, or invalidity, shall be referred to and finally resolved by arbitration administered by the Singapore International Arbitration Centre (SIAC) in accordance with the Arbitration Rules of the SIAC for the time being in force.","28.1 Điều khoản Trọng tài: Mọi tranh chấp, bất đồng hoặc khiếu nại phát sinh từ hoặc liên quan đến Hợp đồng Vận tải Hàng hải này, bao gồm hành vi vi phạm, chấm dứt hoặc vô hiệu hợp đồng, sẽ được đưa ra giải quyết chung thẩm bằng trọng tài do Trung tâm Trọng tài Quốc tế Singapore (SIAC) quản lý theo Quy tắc Trọng tài của SIAC đang có hiệu lực thi hành.","The arbitral tribunal shall consist of three (3) arbitrators. The seat of arbitration shall be Singapore, and the proceedings shall be conducted in the English language.","Hội đồng trọng tài sẽ bao gồm ba (3) trọng tài viên. Địa điểm tiến hành trọng tài sẽ là Singapore, và toàn bộ quá trình tố tụng sẽ được tiến hành bằng ngôn ngữ tiếng Anh.","28.2 Liquidated Demurrage Penalties: If Charterer or Carrier delays cargo loading or discharge beyond the agreed laytime of four (4) business days, demurrage charges shall accrue at a liquidated rate of $15,000 per running day until completion.","28.2 Tiền Phạt Lưu Tàu Định trước (Demurrage): Nếu Bên Thuê Tàu hoặc Bên Vận Chuyển làm chậm trễ việc bốc hoặc dỡ hàng hóa vượt quá thời gian làm hàng đã thỏa thuận là bốn (4) ngày làm việc, phí lưu tàu sẽ được tích lũy theo mức phạt định trước là $15,000 cho mỗi ngày lịch liên tục cho đến khi hoàn tất.","28.3 Force Majeure Invocation: Neither party shall be liable for failure to perform its delivery obligations if such delay results directly from an Event of Force Majeure (acts of God, naval blockades, war, typhoons, or closed shipping straits).","28.3 Viện dẫn Sự kiện Bất khả kháng: Không bên nào phải chịu trách nhiệm về việc không thực hiện nghĩa vụ giao hàng của mình nếu sự chậm trễ đó xuất phát trực tiếp từ một Sự kiện Bất khả kháng (thiên tai bất khả kháng, phong tỏa hải quân, chiến tranh, bão biển hoặc các eo biển hàng hải bị phong tỏa đóng cửa).","Notice Requirement: The party invoking Force Majeure must serve written notice accompanied by official certified documentation from the local Chamber of Commerce or Maritime Port Authority within five (5) calendar days of the occurrence.","Yêu cầu về Thông báo: Bên viện dẫn Bất khả kháng bắt buộc phải gửi thông báo bằng văn bản đính kèm tài liệu chứng thực chính thức từ Phòng Thương mại địa phương hoặc Cơ quan Cảng vụ Hàng hải trong vòng năm (5) ngày dương lịch kể từ khi sự kiện xảy ra.","Failure to provide timely notice shall permanently waive the right to claim exemption from demurrage liability.","Việc không cung cấp thông báo kịp thời sẽ làm mất quyền vĩnh viễn đối với việc yêu cầu miễn trừ trách nhiệm bồi thường phí phạt lưu tàu.","[Văn bản 2: Thư Đòi Bồi thường Pháp lý & Thông báo Khởi kiện Trọng tài SIAC]","Document 2: Legal Demand Letter","Maritime Law Practice Group - Rajah & Tan LLC (Counsel for Global Agro-Grain Importers)","Marina Bay Financial Centre, Singapore","Văn bản 2: Thư Yêu cầu Bồi thường Pháp lý","Nhóm Hành nghề Luật Hàng hải - Rajah & Tan LLC (Luật sư Đại diện cho Tập đoàn Nhập khẩu Nông sản Toàn cầu Global Agro-Grain Importers)","Trung tâm Tài chính Vịnh Marina, Singapore","October 24. To: Captain Hans Richter, Managing Director, Pacific Bulk Navigation Ltd., Ocean Gateway Tower, Hong Kong. RE: Formal Rejection of Force Majeure Claim & Notice of SIAC Arbitration Filing (Vessel: MV Pacific Horizon).","Ngày 24 tháng 10. Kính gửi: Thuyền trưởng Hans Richter, Giám đốc Điều hành, Pacific Bulk Navigation Ltd., Tòa tháp Ocean Gateway, Hồng Kông. V/v: Chính thức Bác bỏ Yêu cầu Miễn trừ Bất khả kháng & Thông báo Nộp đơn Khởi kiện Trọng tài SIAC (Tàu: MV Pacific Horizon).","Dear Captain Richter, We represent Global Agro-Grain Importers (\"Global Grain\") regarding Charter Party Agreement #CP-8802 for the transport of 45,000 metric tons of bulk grain from Port Kembla, Australia to Hai Phong, Vietnam.","Kính gửi Thuyền trưởng Richter, Chúng tôi là luật sư đại diện cho Tập đoàn Nhập khẩu Nông sản Toàn cầu Global Agro-Grain Importers (\"Global Grain\") liên quan đến Hợp đồng Thuê Tàu Chuyến số #CP-8802 về việc vận chuyển 45,000 tấn ngũ cốc rời từ Cảng Kembla, Úc đến Hải Phòng, Việt Nam.","Your vessel, MV Pacific Horizon, arrived at the discharge port twenty-two (22) days behind the contractual Delivery Window of October 1. On October 18, Pacific Bulk Navigation submitted an untimely letter attempting to invoke Section 28.3 (Force Majeure), attributing the 22-day delay to Typhoon Ketsana in the South China Sea.","Tàu của quý công ty, tàu MV Pacific Horizon, đã cập cảng dỡ hàng muộn hai mươi hai (22) ngày so với Khung Thời gian Giao hàng theo hợp đồng là ngày 1 tháng 10. Vào ngày 18 tháng 10, Pacific Bulk Navigation đã gửi một bức thư quá hạn nhằm viện dẫn Khoản 28.3 (Bất khả kháng), quy kết sự chậm trễ 22 ngày này cho Cơn bão Ketsana trên Biển Đông.","On behalf of Global Grain, we hereby formally reject your Force Majeure defense on two indisputable legal grounds: 1. Forfeiture Due to Untimely Notice: Section 28.3 explicitly requires Force Majeure notice to be served within five (5) calendar days of the occurrence with certified port authority seals.","Thay mặt cho Global Grain, chúng tôi theo đây chính thức bác bỏ lý lẽ biện hộ Bất khả kháng của quý công ty dựa trên hai căn cứ pháp lý không thể phủ nhận: 1. Mất Quyền do Nộp Thông báo Quá hạn: Khoản 28.3 quy định rõ ràng rằng thông báo Bất khả kháng bắt buộc phải được gửi trong vòng năm (5) ngày dương lịch kể từ khi xảy ra sự kiện kèm theo con dấu chứng thực của cơ quan cảng vụ.","Meteorological data confirms Typhoon Ketsana dissipated on September 28. Your notice was transmitted on October 18—twenty (20) days post-event. By the express terms of Section 28.3, your failure to give timely notice constitutes an irrevocable waiver of liability exemption.","Dữ liệu khí tượng xác nhận Cơn bão Ketsana đã tan vào ngày 28 tháng 9. Thông báo của quý công ty được gửi đi vào ngày 18 tháng 10—hai mươi (20) ngày sau khi sự kiện kết thúc. Căn cứ theo các điều khoản rõ ràng của Khoản 28.3, việc không gửi thông báo kịp thời của quý công ty cấu thành sự từ bỏ không thể hủy ngang đối với quyền miễn trừ trách nhiệm.","2. Contributory Operational Negligence: AIS satellite vessel-tracking logs demonstrate that MV Pacific Horizon remained stationary at anchor off Manila Bay for fourteen (14) days not due to typhoon conditions, but due to an unannounced crew labor strike and maritime bunkering payment dispute between Pacific Bulk and its fuel vendor.","2. Lỗi Bất cẩn Vận hành Đóng góp: Nhật ký theo dõi hải trình vệ tinh AIS chứng minh rằng tàu MV Pacific Horizon đã nằm bất động neo đậu ngoài khơi Vịnh Manila trong mười bốn (14) ngày không phải do điều kiện bão gió, mà do một cuộc đình công lao động bất ngờ của thủy thủ đoàn và tranh chấp thanh toán tiền cung ứng dầu hàng hải giữa Pacific Bulk và nhà cung cấp nhiên liệu.","Global Grain has sustained severe cargo spoilage and processing downtime totaling $195,000, alongside $270,000 in accrued demurrage ($15,000/day for 18 days beyond laytime).","Global Grain đã phải chịu tổn thất nặng nề do hư hỏng phẩm chất hàng hóa nông sản và thời gian ngừng hoạt động của nhà máy chế biến với tổng số tiền $195,000, cùng với $270,000 tiền phạt lưu tàu tích lũy ($15,000/ngày cho 18 ngày vượt quá thời gian làm hàng cho phép).","Unless Pacific Bulk remits full settlement of $465,000 to our client's trust account by November 5, we have been instructed to formally lodge our Notice of Arbitration with the SIAC Registrar in Singapore and seek a pre-judgment maritime asset arrest warrant against your vessels.","Trừ khi Pacific Bulk thanh toán toàn bộ khoản tiền bồi thường $465,000 vào tài khoản ủy thác của thân chủ chúng tôi trước ngày 5 tháng 11, chúng tôi đã được chỉ thị nộp Thông báo Khởi kiện Trọng tài chính thức tới Ban Thư ký SIAC tại Singapore và xin lệnh bắt giữ tài sản hàng hải khẩn cấp trước khi xét xử đối với các đội tàu của quý công ty.","Sincerely, Kenneth Tan, Senior Partner, Rajah & Tan LLC.","Trân trọng, Kenneth Tan, Luật sư Thành viên Cấp cao, Rajah & Tan LLC.","1.4. 1.4. Dịch chi tiết Câu hỏi & Phương án Trắc nghiệm","[TRANSLATED QUESTIONS & OPTIONS - CAU HOI VA DAP AN DICH NGHIA]:","Câu 181. Theo Điều khoản 28.1, các tranh chấp thương mại không giải quyết được bắt buộc phải được xử lý như thế nào?","(A) Thông qua khởi kiện tại tòa án dân sự ở Hồng Kông.","(B) Bằng trọng tài có tính ràng buộc do SIAC quản lý tại Sing
