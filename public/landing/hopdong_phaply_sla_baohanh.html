nh chuyển tiền ngày 28/10/2026 -> Lệnh cho ngân hàng chuyển $1,500,000 tiền gốc + $28,450 tiền lãi ký quỹ = $1,528,450 cho Titan Engineering vào ngày 4/11/2026, thanh lý toàn bộ hợp đồng.","Bước 2 (20 giây) - Quét 5 Câu hỏi & Gắn Móc Từ khóa:","• Câu 196: Số tiền gốc giữ lại bảo hành ở VB1 (Retention Money Reserve -> $1,500,000).","• Câu 197: Thời hạn bảo hành DLP ở VB1 (Defect Liability Period -> 12 calendar months).","• Câu 198: Sửa chữa hệ thống nguồn điện khẩn cấp ở VB2 (Item #16 -> replaced two lithium-ion cell modules in UPS).","• Câu 199: Khuyến nghị của Arup ở VB2 (Conclusion -> issue Final Acceptance Certificate & release retained funds).","• Câu 200: Tổng số tiền chuyển khoản ở VB3 (Total Authorized Wire Transfer -> $1,528,450.00 bao gồm gốc + lãi).","Bước 3 (3 phút 45 giây) - Giải quyết Cuốn chiếu & Dấu vết Tìm nhanh:","• Câu 196 (Chi tiết tiền giữ lại): Đọc Section 18.1 VB1: 'accumulating a total Retention Money Reserve of $1,500,000 USD' ($30M * 5%) -> Chọn (B).","• Câu 197 (Chi tiết thời gian): Đọc Section 18.2 VB1: 'The DLP shall run for a duration of twelve (12) calendar months' -> Chọn (C).","• Câu 198 (Chi tiết kỹ thuật sửa lỗi): Đọc Item #16 ở VB2: 'Two depleted lithium-ion cell modules in Backup String #4 have been replaced' -> Thay 2 bình ắc quy lithium-ion cho hệ thống UPS nguồn dự phòng -> Chọn (A).","• Câu 199 (Khuyến nghị của tư vấn): Đọc Recommendation ở VB2: 'Arup Technical Consulting hereby... recommends the immediate issuance of the Final Acceptance Certificate and release of all retained funds' -> Chọn (C).","• Câu 200 (Ghép nối số tiền giải ngân): Đọc VB3: Tiền gốc $1,500,000 + Tiền lãi $28,450 = 'Total Authorized Wire Transfer: $1,528,450.00 USD' -> Chọn (B).","Bước 4 (25 giây) - Khóa sổ Đáp án & Tóm tắt Feynman 1 câu:","• Rà soát khóa đáp án: 196-B, 197-C, 198-A, 199-C, 200-B.","• Đúc kết Feynman: 'Dự án trung tâm dữ liệu 30 triệu đô sau 1 năm hết hạn bảo hành công trình, nhà thầu đã sửa xong toàn bộ 18 lỗi điều hòa và ắc quy được tư vấn độc lập nghiệm thu, chủ đầu tư làm lệnh ngân hàng trả hết 1.5 triệu đô tiền cọc giữ lại cộng thêm tiền lãi là $1,528,450 để thanh lý dứt điểm hợp đồng.'","1.3. 1.3. Bản dịch Song ngữ Từng câu (Sentence-by-Sentence Translation)","[SENTENCE-BY-SENTENCE BILINGUAL TRANSLATION - BAN DICH SONG NGU TUNG CAU]:","[Văn bản 1: Hợp đồng Tổng thầu Thiết kế, Mua sắm & Xây dựng (EPC) - Điều khoản 18]","Document 1: Engineering, Procurement & Construction (EPC) Master Contract","Global Cloud Infrastructure Partners & Titan Engineering & Construction Corp.","Văn bản 1: Hợp đồng Tổng thầu Thiết kế, Mua sắm & Xây dựng (EPC)","Đối tác Hạ tầng Đám mây Toàn cầu & Tập đoàn Kỹ thuật & Xây dựng Titan","Article 18: Handover, Defect Liability Period (DLP), and Retention Money Release. 18.1 Total Contract Price & Retention Fund: The total contract price for the Dublin Hyperscale Data Center Facility (Project Apex-3) is $30,000,000 USD.","Điều khoản 18: Bàn giao, Thời hạn Trách nhiệm Sai sót (DLP) và Giải phóng Tiền Giữ lại Bảo hành. 18.1 Tổng Giá Hợp đồng & Quỹ Giữ lại Bảo hành: Tổng giá trị hợp đồng cho Công trình Trung tâm Dữ liệu Siêu quy mô Dublin (Dự án Apex-3) là $30,000,000 USD.","Employer (Global Cloud Infrastructure) has withheld five percent (5%) of each milestone invoice, accumulating a total Retention Money Reserve of $1,500,000 USD deposited into an escrow account at Standard Chartered Bank.","Chủ đầu tư (Global Cloud Infrastructure) đã giữ lại năm phần trăm (5%) trên mỗi hóa đơn thanh toán theo mốc, tích lũy thành tổng Quỹ Giữ lại Bảo hành (Retention Money) là $1,500,000 USD được gửi vào tài khoản ký quỹ phong tỏa tại Ngân hàng Standard Chartered Bank.","18.2 Defect Liability Period (DLP): The DLP shall run for a duration of twelve (12) calendar months following the issuance of the Provisional Handover Certificate on October 15, 2025 (expiring October 15, 2026).","18.2 Thời hạn Trách nhiệm Sai sót (DLP): Thời hạn DLP sẽ kéo dài trong thời gian mười hai (12) tháng dương lịch tiếp sau ngày ban hành Chứng chỉ Bàn giao Tạm thời vào ngày 15 tháng 10 năm 2025 (hết hạn ngày 15 tháng 10 năm 2026).","During this period, Contractor (Titan Engineering) is strictly obligated, at its sole cost, to repair, rectify, or replace any engineering defects, cooling system discrepancies, or structural anomalies.","Trong suốt thời hạn này, Nhà thầu (Titan Engineering) có nghĩa vụ nghiêm ngặt, bằng toàn bộ chi phí tự chi trả của mình, phải sửa chữa, khắc phục hoặc thay thế bất kỳ khiếm khuyết kỹ thuật, sai lệch hệ thống làm mát hoặc dị thường kết cấu nào.","18.3 Conditions for Retention Release: Retention Money shall be released within fifteen (15) business days following: (a) The successful completion of the 12-month DLP; (b) Full technical verification and written sign-off of all outstanding Punch-List defect items by the Independent Supervising Engineering Consultant (Arup Technical Consulting); and (c) Issuance of the Final Acceptance Certificate signed by Employer's Vice President of Infrastructure.","18.3 Điều kiện Giải phóng Tiền Giữ lại Bảo hành: Tiền Giữ lại Bảo hành sẽ được giải ngân trong vòng mười lăm (15) ngày làm việc tiếp sau khi: (a) Hoàn thành thành công thời hạn 12 tháng DLP; (b) Đơn vị Tư vấn Kỹ thuật Giám sát Độc lập (Arup Technical Consulting) kiểm tra kỹ thuật đầy đủ và ký xác nhận bằng văn bản đối với toàn bộ các hạng mục sai sót còn tồn đọng trong Danh mục Lỗi (Punch-List); và (c) Ban hành Chứng chỉ Nghiệm thu Hoàn thành Cuối cùng có chữ ký của Phó Chủ tịch Hạ tầng của Chủ đầu tư.","[Văn bản 2: Báo cáo Nghiệm thu Khắc phục Toàn bộ Sai sót của Tư vấn Độc lập]","Document 2: Independent Engineering Consultant Final Punch-List Verification Report","Arup Technical Consulting Group - Mission-Critical Infrastructure Practice","Dublin, Ireland","Văn bản 2: Báo cáo Kiểm tra Nghiệm thu Danh mục Sai sót Cuối cùng của Đơn vị Tư vấn Kỹ thuật Độc lập","Tập đoàn Tư vấn Kỹ thuật Arup - Khối Hạ tầng Trọng yếu Sứ mệnh","Dublin, Ireland","Project Reference: Apex-3 Hyperscale Data Center Facility (Dublin West Campus). Supervising Engineer: Fiona Gallagher, CEng, Lead Commissioning Auditor. Date of Final Inspection: October 18, 2026. Contractor: Titan Engineering & Construction Corp.","Mã số Dự án: Công trình Trung tâm Dữ liệu Siêu quy mô Apex-3 (Khu phức hợp Dublin West Campus). Kỹ sư Giám sát: Fiona Gallagher, Kỹ sư Chuyên nghiệp Có Chứng chỉ (CEng), Trưởng nhóm Kiểm định Vận hành. Ngày Kiểm tra Cuối cùng: Ngày 18 tháng 10 năm 2026. Nhà thầu: Titan Engineering & Construction Corp.","Verification Findings on Outstanding 12-Month DLP Punch-List: All 18 previously flagged warranty defect items have been inspected and verified as 100% rectified in full accordance with Tier-IV data center engineering standards:","Kết quả Kiểm tra đối với Danh mục Sai sót DLP 12 Tháng Còn tồn đọng: Toàn bộ 18 hạng mục khiếm khuyết bảo hành đã được gắn cờ trước đây đã được kiểm tra và chứng thực là đã được khắc phục 100% hoàn toàn tuân thủ theo các tiêu chuẩn kỹ thuật trung tâm dữ liệu chuẩn Tier-IV:","1. Item #14 (CRAC Precision Cooling System): Refrigerant compressor vibration dampers in Data Hall B have been replaced; acoustic sound levels now meet the 65 dBA contractual threshold.","1. Hạng mục #14 (Hệ thống Điều hòa Chính xác CRAC): Các đệm giảm chấn chống rung của máy nén môi chất lạnh tại Phòng Dữ liệu B đã được thay thế; mức độ âm thanh tiếng ồn hiện đáp ứng ngưỡng hợp đồng 65 dBA.","2. Item #16 (Emergency Backup Generator UPS Battery Banks): Two depleted lithium-ion cell modules in Backup String #4 have been replaced with factory-certified units, successfully passing the 4-hour full-load discharge test.","2. Hạng mục #16 (Dàn Ắc quy UPS Máy phát điện Dự phòng Khẩn cấp): Hai mô-đun cell pin lithium-ion bị chai suy giảm dung lượng tại Chuỗi Dự phòng #4 đã được thay thế bằng các thiết bị đạt chứng nhận xuất xưởng, vượt qua thành công bài kiểm tra phóng điện đầy tải trong 4 giờ.","3. Item #18 (FM-200 Fire Suppression Gas Pressure): Pressure gauges across all 24 gaseous suppression cylinders have been recalibrated and recharged to 360 psi baseline.","3. Hạng mục #18 (Áp suất Khí Chữa cháy FM-200): Các đồng hồ đo áp suất trên toàn bộ 24 bình khí chữa cháy sạch đã được hiệu chuẩn lại và nạp lại đạt mức chuẩn 360 psi.","Conclusion and Recommendation: The 12-month Defect Liability Period has concluded with zero unrectified engineering deficiencies. Arup Technical Consulting hereby issues full technical sign-off and recommends the immediate issuance of the Final Acceptance Certificate and release of all retained funds.","Kết luận và Khuyến nghị: Thời hạn Trách nhiệm Sai sót 12 tháng đã kết thúc mà không còn bất kỳ khiếm khuyết kỹ thuật nào chưa được khắc phục. Arup Technical Consulting theo đây ban hành phê duyệt kỹ thuật toàn bộ và khuyến nghị ban hành ngay Chứng chỉ Nghiệm thu Cuối cùng và giải phóng toàn bộ số tiền giữ lại bảo hành.","[Văn bản 3: Chứng chỉ Nghiệm thu Cuối cùng & Lệnh Ủy quyền Giải ngân Tiền Giữ lại Bảo hành]","Document 3: Final Acceptance Certificate and Bank Retention Money Release Authorization","Global Cloud Infrastructure Partners - Executive Infrastructure Directorate","Văn bản 3: Chứng chỉ Nghiệm thu Cuối cùng & Văn bản Ủy quyền Giải ngân Tiền Giữ lại Bảo hành","Đối tác Hạ tầng Đám mây Toàn cầu - Khối Điều hành Hạ tầng","October 28, 2026. To: Standard Chartered Bank - Escrow & Corporate Custody Services, 40 Herbert Park, Dublin, Ireland. Re: Authorization for Full Release of Retention Escrow Funds - Project Apex-3 (#ESC-99214).","Ngày 28 tháng 10 năm 2026. Kính gửi: Ngân hàng Standard Chartered Bank - Dịch vụ Lưu ký Doanh nghiệp & Ký quỹ, 40 Herbert Park, Dublin, Ireland. V/v: Ủy quyền Giải ngân Toàn bộ Quỹ Ký quỹ Giữ lại Bảo hành - Dự án Apex-3 (Tài khoản #ESC-99214).","Pursuant to Section 18.3 of EPC Contract #EPC-7701 and following the formal recommendation issued by Independent Supervising Consultant Arup Technical Consulting on October 18, Global Cloud Infrastructure Partners hereby issues this Final Acceptance Certificate and authorizes the unconditional disbursement of all retained funds.","Căn cứ theo Điều khoản 18.3 của Hợp đồng EPC số #EPC-7701 và tiếp sau khuyến nghị chính thức do Đơn vị Tư vấn Giám sát Độc lập Arup Technical Consulting ban hành ngày 18 tháng 10, Global Cloud Infrastructure Partners theo đây ban hành Chứng chỉ Nghiệm thu Cuối cùng này và ủy quyền cho việc giải ngân vô điều kiện toàn bộ số tiền giữ lại bảo hành.","Disbursement Instruction Details: Escrow Reference Number: #ESC-99214 (Project Apex-3 Retention Reserve). Principal Retention Amount to Disburse: $1,500,000.00 USD. Accrued Escrow Interest (Net): $28,450.00 USD. Total Authorized Wire Transfer: $1,528,450.00 USD.","Chi tiết Chỉ thị Giải ngân: Mã số Tham chiếu Ký quỹ: #ESC-99214 (Quỹ Dự phòng Giữ lại Dự án Apex-3). Số tiền Gốc Giữ lại Giải ngân: $1,500,000.00 USD. Tiền lãi Ký quỹ Tích lũy (Ròng): $28,450.00 USD. Tổng Số tiền Chuyển khoản Điện tử Được Ủy quyền: $1,528,450.00 USD.","Beneficiary: Titan Engineering & Construction Corp. Beneficiary Bank: Bank of Ireland (Commercial Banking Division, Account #9910-88421). Effective Value Date: November 4, 2026.","Đơn vị Thụ hưởng: Titan Engineering & Construction Corp. Ngân hàng Thụ hưởng: Bank of Ireland (Khối Ngân hàng Thương mại, Số tài khoản #9910-88421). Ngày Giá trị Hiệu lực: Ngày 4 tháng 11 năm 2026.","With this final transfer, all financial and operational obligations under EPC Contract #EPC-7701 are fully discharged and extinguished.","Cùng với đợt chuyển tiền cuối cùng này, toàn bộ các nghĩa vụ tài chính và vận hành theo Hợp đồng EPC số #EPC-7701 được hoàn tất và chấm dứt toàn bộ.","Sincerely, Liam O'Connor, Vice President of Infrastructure, Global Cloud Infrastructure Partners. ACCEPTED & ACKNOWLEDGED: Marcus Vance, Executive Director, Titan Engineering & Construction Corp. (Date: October 29, 2026).","Trân trọng, Liam O'Connor, Phó Chủ tịch Hạ tầng, Global Cloud Infrastructure Partners. CHẤP THUẬN & XÁC NHẬN: Marcus Vance, Giám đốc Điều hành, Titan Engineering & Construction Corp. (Ngày: 29 tháng 10 năm 2026).","1.4. 1.4. Dịch chi tiết Câu hỏi & Phương án Trắc nghiệm","[TRANSLATED QUESTIONS & OPTIONS - CAU HOI VA DAP AN DICH NGHIA]:","Câu 196. Tổng số tiền gốc được giữ lại bảo hành cho Dự án Apex-3 là bao nhiêu?","(A) $28,450","(B) $1,500,000","(C) $1,528,450","(D) $30,000,000","Câu 197. Thời hạn Trách nhiệm Sai sót (DLP) theo hợp đồng xây dựng EPC kéo dài trong bao lâu?","(A) 15 ngày làm việc","(B) 90 ngày dương lịch","(C) 12 tháng dương lịch","(D) 36 tháng dương lịch","Câu 198. Theo Văn bản 2, công tác sửa chữa nào đã được thực hiện đối với hệ thống điện khẩn cấp?","(A) Thay thế hai mô-đun cell ắc quy UPS lithium-ion bị suy giảm dung lượng.","(B) Lắp đặt các đệm tiêu âm chống ồn mới xung quanh máy phát điện diesel.","(C) Nạp lại các bình chữa cháy bằng khí sạch FM-200 lên mức áp suất 360 psi.","(D) Đổ lại phần móng bê tông kết cấu của Phòng Dữ liệu B.","Câu 199. Arup Technical Consulting đã đưa ra khuyến nghị gì trong báo cáo cuối cùng của mình?","(A) Gia hạn Thời hạn Trách nhiệm Sai sót thêm sáu tháng nữa.","(B) Giữ lại 50% tiền bảo hành do độ rung của máy nén quá mức cho phép.","(C) Ban hành Chứng chỉ Nghiệm thu Cuối cùng và giải phóng toàn bộ số tiền giữ lại.","(D) Dỡ bỏ Phòng Dữ liệu B để tuân thủ các tiêu chuẩn trung tâm dữ liệu Tier-IV.","Câu 200. Tổng số tiền chuyển khoản điện tử được ủy quyền giải ngân cho Titan Engineering là bao nhiêu?","(A) $1,500,000.00","(B) $1,528,450.00","(C) $28,500,000.00","(D) $30,000,000.00","1.5. 1.5. Tóm tắt Viết lại Toàn bài theo Feynman (Feynman Monograph Summary)","[EXECUTIVE SUMMARY & CORE LOGIC - BAN TOM TAT COT LOI]:","English Executive Summary:","• EPC Contract Retention Structure: Global Cloud Infrastructure withheld 5% ($1,500,000) from Titan Engineering's $30,000,000 datacenter project into a Standard Chartered escrow account, pending a 12-month Defect Liability Period (DLP) and final consultant sign-off.","• 12-Month Punch-List Rectification: On October 18, 2026, supervising engineer Arup Consulting certified that all 18 flagged defects (cooling compressor dampers, UPS lithium battery modules, and fire gas pressure) were 100% rectified to Tier-IV standards.","• Full Release & Contract Close-Out: Global Cloud issued the Final Acceptance Certificate on October 28, authorizing Standard Chartered to wire $1,528,450 ($1,500,000 principal + $28,450 interest) to Titan on November 4, fully discharging all contractual obligations.","Bản tóm tắt Tiếng Việt cốt lõi:","• Cấu trúc Quỹ Giữ lại Bảo hành Hợp đồng EPC: Global Cloud Infrastructure giữ lại 5% ($1,500,000) trên dự án trung tâm dữ liệu 30 triệu USD của Tổng thầu Titan Engineering gửi tại tài khoản ký quỹ Standard Chartered Bank, phong tỏa trong 12 tháng thời hạn bảo hành DLP.","• Nghiệm thu Danh mục Sai sót 12 Tháng: Ngày 18/10/2026, Đơn vị Tư vấn Arup xác nhận toàn bộ 18 hạng mục khiếm khuyết (đệm giảm chấn điều hòa CRAC, bình ắc quy UPS lithium, và áp suất bình khí FM-200) đã được khắc phục 100% đạt chuẩn Tier-IV.","• Giải ngân Toàn bộ & Thanh lý Hợp đồng: Ngày 28/10, Chủ đầu tư ký Chứng chỉ Nghiệm thu Cuối cùng, chỉ thị Standard Chartered Bank chuyển khoản $1,528,450 ($1,500,000 tiền gốc + $28,450 tiền lãi) cho Titan vào ngày 4/11, chính thức hoàn tất thanh lý toàn bộ hợp đồng EPC.","PHẦN 2: PHẦN 2: ACTIVE RECALL 5 GIÂY (BẢNG MA TRẬN ĐỊNH VỊ SONG NGỮ)",{"t":"table","rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong & Vai tro"],["Chủ Đầu tư (Bên Giao thầu): Global Cloud Infrastructure Partners (Liam O'Connor). Tổng thầu EPC: Titan Engineering & Construction Corp. (Marcus Vance). Tư vấn Giám sát Độc lập: Arup Technical Consulting (Fiona Gallagher). Ngân hàng Ký quỹ: Standard Chartered Bank.","Employer (Owner): Global Cloud Infrastructure Partners (VP Liam O'Connor). EPC Main Contractor: Titan Engineering & Construction Corp. (Marcus Vance). Independent Supervising Consultant: Arup Technical Consulting (Fiona Gallagher). Escrow Bank: Standard Chartered Bank."]],[["2. Boi canh & Quy trinh loi"],["Hợp đồng tổng thầu EPC $30 triệu xây dựng trung tâm dữ liệu Tier-IV. Tiền giữ lại bảo hành 5% ($1,500,000). Thời hạn trách nhiệm sai sót (DLP) 12 tháng. Tư vấn độc lập nghiệm thu khắc phục 100% của 18 hạng mục lỗi Punch-List (CRAC, UPS, FM-200).","$30M Tier-IV hyperscale datacenter EPC contract. 5% retention money reserve ($1,500,000). 12-month Defect Liability Period (DLP). Independent consultant verified 100% close-out of all 18 punch-list warranty defects (precision cooling, UPS, gas fire suppression)."]],[["3. Dau vet suy luan cheo"],["Đối soát thanh lý tài chính ngân hàng: Lệnh giải ngân giải phóng toàn bộ số tiền gốc $1,500,000 cộng với khoản lãi ký quỹ phát sinh $28,450 = Tổng số tiền chuyển khoản thanh lý là $1,528,450 trả về tài khoản Bank of Ireland của nhà thầu.","Financial close-out reconciliation: The escrow release instruction authorizes disbursement of the $1,500,000 principal retention fund plus $28,450 net accrued escrow interest = Total transfer of $1,528,450 to Titan's Bank of Ireland account."]]]},"PHẦN 3: PHẦN 3: ĐÁP ÁN CHUẨN XÁC & DẤU VẾT TRUY XUẤT CHÉO (CROSS-REFERENCING & COMPREHENSIVE TRAP BREAKDOWN)","196. What was the total principal amount withheld as retention money for Project Apex-3?","Dap an dung: (B) $1,500,000","[Dau vet bai doc / Clue]: Document 1, Section 18.1: 'withheld five percent (5%) of each milestone invoice, accumulating a total Retention Money Reserve of $1,500,000 USD deposited into an escrow account...'","[Dien dat tuong duong / Paraphrase]:","• Retention Money Reserve of $1,500,000 USD <=> Total principal amount withheld as retention money was $1,500,000.","[Loi giai chi tiet]: Văn bản 1 quy định rõ ở Điều khoản 18.1: Chủ đầu tư giữ lại 5% trên mỗi hóa đơn, tích lũy thành số tiền gốc giữ lại bảo hành (Principal Retention Money) là $1,500,000 USD (tương ứng 5% của gói thầu $30,000,000).","[Phan tich Phuong an Sai & Bay De thi ETS]:","(A) $28,450","- Ly do sai: Đây là số tiền lãi ngân hàng phát sinh trên tài khoản ký quỹ (accrued interest), không phải tiền gốc.","- Bay ETS: Bẫy Tiền lãi Ký quỹ (Interest Trap)","(C) $1,528,450","- Ly do sai: Đây là tổng số tiền chuyển khoản bao gồm cả gốc và lãi ở Văn bản 3, không phải tiền gốc ban đầu.","- Bay ETS: Bẫy Tổng Tiền Gốc và Lãi (Total Disbursement Trap)","(D) $30,000,000","- Ly do sai: Đây là tổng giá trị toàn bộ gói thầu EPC xây dựng trung tâm dữ liệu.","- Bay ETS: Bẫy Tổng Giá trị Gói thầu (Gross Contract Value Trap)","197. How long was the Defect Liability Period under the EPC construction contract?","Dap an dung: (C) 12 calendar months","[Dau vet bai doc / Clue]: Document 1, Section 18.2: 'The DLP shall run for a duration of twelve (12) calendar months following the issuance of the Provisional Handover Certificate...'","[Dien dat tuong duong / Paraphrase]:","• duration of twelve (12) calendar months <=> 12 calendar months.","[Loi giai chi tiet]: Điều khoản 18.2 của Hợp đồng EPC quy định rõ ràng rằng Thời hạn Trách nhiệm Sai sót (Defect Liability Period - DLP) kéo dài trong 12 tháng dương lịch (từ 15/10/2025 đến 15/10/2026).","[Phan tich Phuong an Sai & Bay De thi ETS]:","(A) 15 business days","- Ly do sai: 15 ngày làm việc là thời hạn giải ngân tiền cọc sau khi hoàn tất các thủ tục nghiệm thu.","- Bay ETS: Bẫy Thời hạn Giải ngân (Disbursement Window Trap)","(B) 90 calendar days","- Ly do sai: Con số 90 ngày không xuất hiện trong hợp đồng EPC này.","- Bay ETS: Bẫy Số liệu Bịa đặt (Fabricated Figure Trap)","(D) 36 calendar months","- Ly do sai: 36 tháng là thời hạn bảo hành phần cứng ở Bài 3, không phải thời hạn DLP của công trình xây dựng.","- Bay ETS: Bẫy Thời hạn Hợp đồng Khác (Wrong Contract Trap)","198. According to Document 2, what repair was performed on the emergency power system?","Dap an dung: (A) Replacing two depleted lithium-ion UPS battery modules","[Dau vet bai doc / Clue]: Document 2, Item #16: 'Two depleted lithium-ion cell modules in Backup String #4 have been replaced with factory-certified units, successfully passing the 4-hour full-load discharge test.'","[Dien dat tuong duong / Paraphrase]:","• Two depleted lithium-ion cell modules have been replaced <=> Replacing two depleted lithium-ion UPS battery modules.","[Loi giai chi tiet]: Văn bản 2 mô tả rõ hạng mục khắc phục #16 đối với hệ thống nguồn điện khẩn cấp (Emergency Backup Generator UPS Battery Banks): thay thế hai mô-đun cell pin lithium-ion bị suy giảm dung lượng và thử tải thành công 4 giờ.","[Phan tich Phuong an Sai & Bay De thi ETS]:","(B) Installing new acoustic sound dampers around diesel generators","- Ly do sai: Đệm giảm chấn được lắp cho máy nén điều hòa CRAC ở Hạng mục #14, không phải cho máy phát điện.","- Bay ETS: Bẫy Nhầm lẫn Thiết bị Giảm chấn (Damper Confusion Trap)","(C) Recharging FM-200 fire suppression cylinders to 360 psi","- Ly do sai: Đây là hệ thống chữa cháy bằng khí sạch ở Hạng mục #18, không phải hệ thống cấp nguồn điện.","- Bay ETS: Bẫy Nhầm lẫn Hệ thống Chữa cháy (Fire System Trap)","(D) Rebuilding the structural concrete foundation of Data Hall B","- Ly do sai: Không hề có việc đổ lại móng bê tông nhà xưởng.","- Bay ETS: Bẫy Hư hỏng Kết cấu Cường điệu (Exaggerated Structural Trap)","199. What did Arup Technical Consulting recommend in its final report?","Dap an dung: (C) Issuing the Final Acceptance Certificate and releasing all retained funds","[Dau vet bai doc / Clue]: Document 2, Conclusion and Recommendation: 'Arup Technical Consulting hereby issues full technical sign-off and recommends the immediate issuance of the Final Acceptance Certificate and release of all retained funds.'","[Dien dat tuong duong / Paraphrase]:","• recommends the immediate issuance of the Final Acceptance Certificate and release of all retained funds <=> Issuing the Final Acceptance Certificate and releasing all retained funds.","[Loi giai chi tiet]: Phần Kết luận và Khuyến nghị ở cuối Văn bản 2 nêu rõ Đơn vị Tư vấn Arup khuyến nghị chủ đầu tư ban hành ngay Chứng chỉ Nghiệm thu Cuối cùng (Final Acceptance Certificate) và giải phóng toàn bộ số tiền giữ lại bảo hành.","[Phan tich Phuong an Sai & Bay De thi ETS]:","(A) Extending the Defect Liability Period for another six months","- Ly do sai: Arup xác nhận 100% lỗi đã khắc phục và thời hạn 12 tháng đã kết thúc thành công, không hề kiến nghị gia hạn.","- Bay ETS: Bẫy Gia hạn Thời hạn Sai (False Extension Trap)","(B) Withholding 50% of the retention funds due to excessive compressor vibration","- Ly do sai: Lỗi rung máy nén đã được thay đệm giảm chấn và đạt chuẩn âm thanh 65 dBA, không bị giữ tiền.","- Bay ETS: Bẫy Khấu trừ Bịa đặt (Fabricated Withholding Trap)","(D) Demolishing Data Hall B to comply with Tier-IV data center standards","- Ly do sai: Công trình đạt chuẩn Tier-IV hoàn hảo, không có chuyện đập phá dỡ bỏ.","- Bay ETS: Bẫy Phá bỏ Cực đoan (Demolition Distortion Trap)","200. What is the total wire transfer amount authorized for disbursement to Titan Engineering?","Dap an dung: (B) $1,528,450.00","[Dau vet bai doc / Clue]: Document 3: 'Principal Retention Amount to Disburse: $1,500,000.00 USD. Accrued Escrow Interest (Net): $28,450.00 USD. Total Authorized Wire Transfer: $1,528,450.00 USD.'","[Dien dat tuong duong / Paraphrase]:","• Total Authorized Wire Transfer: $1,528,450.00 USD <=> Total wire transfer amount authorized is $1,528,450.00.","[Loi giai chi tiet]: Văn bản 3 nêu rõ con số chuyển khoản cuối cùng gửi ngân hàng Standard Chartered Bank: $1,500,000 tiền gốc + $28,450 tiền lãi ký quỹ ròng = Tổng số tiền ủy quyền chuyển khoản là $1,528,450.00 USD.","[Phan tich Phuong an Sai & Bay De thi ETS]:","(A) $1,500,000.00","- Ly do sai: Đây là số tiền gốc giữ lại bảo hành khi chưa cộng khoản lãi ký quỹ $28,450.","- Bay ETS: Bẫy Tiền gốc Thiếu Lãi (Principal-only Trap)","(C) $28,500,000.00","- Ly do sai: Đây là 95% giá trị hợp đồng đã thanh toán trong các mốc xây dựng trước đó ($30M - $1.5M).","- Bay ETS: Bẫy Giá trị Tiến độ Xây dựng (Construction Milestones Trap)","(D) $30,000,000.00","- Ly do sai: Đây là tổng giá trị trọn gói toàn bộ công trình EPC.","- Bay ETS: Bẫy Tổng Giá trị Toàn bộ Dự án (Full Project Price Trap)","PHẦN 4: PHẦN 4: KỸ THUẬT FEYNMAN SONG NGỮ & SƠ ĐỒ QUY TRÌNH (TƯ DUY BA & PHÁP LÝ HỢP ĐỒNG)","4.1. 4.1. Sơ đồ Quy trình Luân chuyển Nghiệp vụ (End-to-End Business Workflow Diagram)",{"t":"table","rows":[[["BƯỚC 1","HẾT HẠN DLP & TƯ VẤN KIỂM ĐỊNH PUNCH-LIST"],[],["BƯỚC 2","BAN HÀNH CHỨNG CHỈ BÀN GIAO CUỐI CÙNG"],[],["BƯỚC 3","GIẢI NGÂN GỐC + LÃI & THANH LÝ HỢP ĐỒNG"]],[["• Chung tu & Kenh: Hợp đồng EPC Xây dựng (Article 18) & Báo cáo Giám sát Arup","• Nghiep vu thuc thi: Hết hạn bảo hành 12 tháng; Tư vấn độc lập Arup kiểm định 18 hạng mục lỗi kỹ thuật (CRAC, UPS, FM-200) đạt 100%.","• Ket qua & Kiem soat: Biên bản nghiệm thu danh mục sai sót (Final Punch-List Sign-off Report)."],["➔"],["• Chung tu & Kenh: Chứng chỉ Nghiệm thu Cuối cùng (Final Acceptance Certificate)","• Nghiep vu thuc thi: Phó Chủ tịch Hạ tầng ký nghiệm thu toàn diện công trình Tier-IV và lập chỉ thị giải phóng quỹ ký quỹ.","• Ket qua & Kiem soat: Chứng chỉ Nghiệm thu Cuối cùng (Final Acceptance Certificate) chấm dứt nghĩa vụ nhà thầu."],["➔"],["• Chung tu & Kenh: Ngân hàng Ký quỹ Standard Chartered Bank & Điện Chuyển tiền","• Nghiep vu thuc thi: Ngân hàng giải ngân $1,500,000 tiền gốc + $28,450 tiền lãi ký quỹ = $1,528,450 sang tài khoản Titan Engineering.","• Ket qua & Kiem soat: Văn bản thanh lý hợp đồng toàn diện (Final Contract Close-Out & Discharge)."]]]},{"t":"table","rows":[[["STEP 1","DLP EXPIRATION & INDEPENDENT PUNCH-LIST AUDIT"],[],["STEP 2","FINAL ACCEPTANCE CERTIFICATE ISSUANCE"],[],["STEP 3","ESCROW WIRE RELEASE & CONTRACT CLOSE-OUT"]],[["• Documents & Channels: EPC Master Agreement Article 18 & Arup Engineering Commissioning Audit","• Operational Actions: 12-month DLP concludes; independent auditor Arup verifies 100% close-out across all 18 Tier-IV punch-list items.","• Output Deliverables & Controls: Independent Engineering Final Punch-List Verification Protocol."],["➔"],["• Documents & Channels: Executive Infrastructure Directorate Acceptance Protocol","• Operational Actions: Employer VP signs Final Acceptance Certificate certifying total mechanical & electrical completion.","• Output Deliverables & Controls: Fully executed Final Acceptance Certificate extinguishing performance liabilities."],["➔"],["• Documents & Channels: Standard Chartered Corporate Custody Escrow Platform","• Operational Actions: Bank executes wire of $1,500,000 principal + $28,450 accrued interest = $1,528,450 to Titan's commercial account.","• Output Deliverables & Controls: Executed interbank wire confirmation & comprehensive EPC Contract Discharge Protocol."]]]},"4.2. 4.2. Tư duy Phân tích Nghiệp vụ & Quản trị Hợp đồng (Bản Tiếng Việt)","• Bức tranh Toàn cảnh Hợp đồng & Pháp lý (End-to-End Flow): Trong các dự án xây dựng công nghiệp và hạ tầng công nghệ quy mô lớn theo hình thức Tổng thầu EPC (Engineering, Procurement & Construction), Tiền Giữ lại Bảo hành (Retention Money / Retainage) là công cụ phòng vệ tài chính quyền lực nhất của chủ đầu tư. Thông thường, 5% đến 10% giá trị hợp đồng được khấu trừ trên từng mốc thanh toán và nạp vào tài khoản ký quỹ phong tỏa ngân hàng (Escrow Retention Reserve). Khoản tiền này đóng vai trò là 'con tin tài chính' buộc nhà thầu phải có trách nhiệm sửa chữa mọi sai sót trong suốt Thời hạn Trách nhiệm Sai sót (Defect Liability Period - DLP, thường là 12 đến 24 tháng). Quy trình thanh lý hợp đồng chuẩn quốc tế (FIDIC EPC Silver Book) gồm 3 bước: (1) Đơn vị tư vấn giám sát độc lập (Independent Consulting Engineer) kiểm tra thực tế danh mục sai sót (Punch-List) và ra khuyến nghị; (2) Chủ đầu tư ký Chứng chỉ Nghiệm thu Cuối cùng (Final Acceptance Certificate); (3) Ngân hàng giải phóng toàn bộ số tiền gốc kèm lãi suất ký quỹ tích lũy trả về cho tổng thầu, chính thức thanh lý dứt điểm hợp đồng EPC.","• Điểm nghẽn & Rủi ro Tranh chấp Thực tế (Core Bottleneck & Risk): Nút thắt lớn nhất là tranh chấp 'Kéo dài Giữ tiền Cọc Bảo hành Bất hợp pháp' (Wrongful Retention Withholding). Sau khi công trình đã đưa vào vận hành thương mại 1 năm, chủ đầu tư thường viện cớ các lỗi vận hành do chính nhân viên của mình gây ra để từ chối giải phóng tiền giữ lại $1.5 triệu đô, gây đọng vốn nghiêm trọng cho nhà thầu. Ngược lại, nếu không có Đơn vị Tư vấn Kỹ thuật Độc lập (như Arup) thẩm định trung lập, chủ đầu tư có nguy cơ giải ngân tiền cọc khi các hệ thống ngầm (như ắc quy dự phòng, van rò rỉ làm mát) chưa được sửa dứt điểm.","• 3 Giải pháp Thiết kế Hệ thống & Kiểm soát Hợp đồng (BA & Legal Compliance Architecture):","(1) Cơ chế Ký quỹ Sinh lãi Độc lập (Interest-Bearing Third-Party Retention Escrow): Gửi tiền giữ lại bảo hành tại ngân hàng trung gian quốc tế có sinh lãi ròng cho nhà thầu, loại bỏ nguy cơ chủ đầu tư chiếm dụng vốn lưu động vào mục đích khác.","(2) Quy chuẩn Hóa Vai trò Tư vấn Giám sát Độc lập (Binding Independent Engineer Determination): Hợp đồng quy định rõ kết luận kỹ thuật của Đơn vị Tư vấn Độc lập là căn cứ tối hậu mang tính ràng buộc; khi tư vấn xác nhận danh mục Punch-List đã khắc phục 100%, chủ đầu tư bắt buộc phải ban hành Chứng chỉ Nghiệm thu trong 15 ngày làm việc.","(3) Giải pháp Thay thế Tiền Giữ lại bằng Thư Bảo lãnh Ngân hàng (Retention Bond Substitution Option): Cho phép nhà thầu nộp Thư Bảo lãnh Giữ lại Bảo hành của Ngân hàng (Retention Money Bank Guarantee / Standby L/C) tương đương 5% giá trị hợp đồng để giải ngân tiền mặt ngay tại thời điểm bàn giao tạm thời, giúp tối ưu hóa dòng tiền thi công.","4.3. 4.3. Business Analyst & Contract Management Executive Summary (Bản Tiếng Anh)","• End-to-End Contract & Legal Context: In massive infrastructure engineering and hyperscale datacenter procurement under turnkey EPC frameworks (e.g., FIDIC Silver Book conditions), Retention Money structures represent the primary fiduciary safeguard against latent construction defects. Employers withhold a statutory percentage (typically 5-10%) across interim payment milestones into an interest-bearing third-party escrow facility. This capital reserve incentivizes the EPC contractor to maintain proactive defect liability response teams throughout the 12-to-24-month Defect Liability Period (DLP). The formal contractual close-out workflow mandates rigorous tripartite validation: independent engineering punch-list audit certification, executive issuance of the Final Acceptance Certificate, and irrevocable escrow wire disbursement discharging all performance and financial obligations.","• Core Operational Bottleneck & Dispute Risk: The principal friction point in mega-project close-outs is the wrongful protracted withholding of retention reserves. Project owners frequently conflate routine operational wear resulting from internal facilities staff with contractor latent defects to unlawfully retain capital reserves, precipitating severe liquidity crises for main contractors. Conversely, releasing retention funds without rigorous independent engineering sign-off exposes facility operators to catastrophic latent subsystem failures in precision cooling and emergency power infrastructure.","• Key BA & Contract Compliance Architecture Solutions:","(1) Segregated Interest-Bearing Retention Escrow Accounts: Mandate that withheld funds be quarantined within dedicated corporate custodial escrow facilities with accrued interest credited to the contractor upon discharge.","(2) Incontestable Independent Engineer Adjudication: Contractually establish that the technical certifications of the designated Independent Supervising Engineer are final and binding, compelling employer sign-off within 15 business days following punch-list remediation.","(3) Retention Bank Guarantee Substitution Facilities: Incorporate contractual rights empowering contractors to substitute physical cash retention withholdings with on-demand irrevocable Bank Retention Guarantees, unlocking working capital liquidity upon provisional handover.","4.4. 4.4. Tam giác Liên kết Nhận thức Đa chiều (Multi-Perspective Contextual Anchoring)","1. Lăng kính Hợp đồng CNTT / Viễn thông Viettel: Quản trị các gói thầu xây dựng hạ tầng Trạm BTS / Trung tâm Dữ liệu Viettel Cloud (như TTDL Viettel An Đồn, Hòa Lạc). Ban Quản lý Dự án Viettel luôn giữ lại 5% giá trị hợp đồng xây lắp trong 12 tháng bảo hành công trình. Khi hết 12 tháng, đoàn kiểm tra kỹ thuật của Viettel đi rà soát từng vết nứt tường, hệ thống chống sét, tiếp địa và điều hòa; khi mọi lỗi khắc phục xong mới ký biên bản nghiệm thu dứt điểm và thanh toán 5% tiền bảo hành cho nhà thầu xây dựng.","2. Lăng kính Quản trị Trường Mầm non Ước Mơ Xanh (cô Thu Huyền): Hợp đồng xây dựng và cải tạo cơ sở vật chất mầm non hè: Trường ký hợp đồng với công ty xây dựng làm lại hệ thống vệ sinh và chống thấm sàn mái trị giá 500 triệu đồng. Nhà trường giữ lại 10% (50 triệu đồng) trong 6 tháng mùa mưa. Qua mùa mưa, mái nhà không bị dột và hệ thống thoát nước vận hành hoàn hảo, nhà trường làm lễ bàn giao chính thức và giải ngân nốt 50 triệu đồng tiền giữ lại cho nhà thầu.","3. Lăng kính Bàn học Gia đình (Kèm cặp học sinh Lớp 5 - Bé Hà Ngân): Khái niệm 'Tiền giữ lại bảo hành trách nhiệm' (Feynman Retention Analogy): Khi Hà Ngân được giao nhiệm vụ tự sơn lại kệ sách của mình với phần thưởng 100 điểm thưởng, bố trao cho con 90 điểm ngay khi sơn xong (nghiệm thu tạm thời). 10 điểm còn lại bố 'giữ lại bảo hành' trong 2 tuần: nếu kệ sách không bị bong tróc sơn và con giữ gìn ngăn nắp, bố giải ngân 10 điểm còn lại cộng thêm một món quà nhỏ (giống như tiền lãi ký quỹ ngân hàng) để dạy con bài học về trách nhiệm và chất lượng bền vững.","PHẦN 5: PHẦN 5: TỪ VỰNG & PARAPHRASE CHUYÊN SÂU (CHUẨN 3 DÒNG TỐI ƯU NẠP ANKI)","1. Retention Money Reserve  /rɪˈten.ʃən ˈmʌn.i rɪˈzɜːv/  = Contractor Warranty Holdback Escrow Fund","Nghia: Khoản tiền giữ lại bảo hành (thường là 5-10%) để đảm bảo nghĩa vụ sửa chữa sai sót của nhà thầu.","Vd: The employer withheld 5% of all progress billings, establishing a $1,500,000 retention money reserve. - Chủ đầu tư đã giữ lại 5% trên mọi thanh toán theo tiến độ, tích lũy thành quỹ giữ lại bảo hành $1,500,000.","2. Defect Liability Period (DLP)  /ˈdiː.fekt ˌlaɪ.əˈbɪl.ə.ti ˈpɪə.ri.əd/  = Contractual Warranty and Rectification Window","Nghia: Thời hạn trách nhiệm sai sót sau khi bàn giao tạm thời mà nhà thầu phải tự bỏ chi phí sửa chữa lỗi.","Vd: Titan Engineering was obligated to repair all cooling anomalies during the 12-month DLP. - Titan Engineering có nghĩa vụ sửa chữa toàn bộ sự cố làm mát trong suốt thời hạn bảo hành DLP 12 tháng.","3. Final Acceptance Certificate  /ˈfaɪ.nəl əkˈsep.təns səˈtɪf.ɪ.kət/  = Formal Document Certifying Complete Contractual Handover","Nghia: Chứng chỉ nghiệm thu hoàn thành cuối cùng xác nhận công trình đã hoàn tất 100% và hết nghĩa vụ bảo hành.","Vd: Issuance of the Final Acceptance Certificate authorized the immediate release of all retained escrow funds. - Việc ban hành Chứng chỉ Nghiệm thu Cuối cùng đã ủy quyền cho việc giải ngân ngay lập tức quỹ tiền giữ lại.","4. Outstanding Punch-List Items  /ˌaʊtˈstæn.dɪŋ pʌntʃ lɪst ˈaɪ.təmz/  = Unresolved Defect Checklist Pending Rectification","Nghia: Danh mục các hạng mục sai sót, khiếm khuyết kỹ thuật còn tồn đọng cần khắc phục trước khi thanh lý.","Vd: Arup verified that all 18 outstanding punch-list items were fully rectified to Tier-IV standards. - Arup đã chứng thực toàn bộ 18 hạng mục sai sót tồn đọng đã được khắc phục hoàn toàn đạt chuẩn Tier-IV.","5. Turnkey EPC Contract  /ˈtɜːn.kiː iː.piːˈsiː ˈkɒn.trækt/  = Comprehensive Engineering, Procurement & Construction Agreement","Nghia: Hợp đồng tổng thầu chìa khóa trao tay bao gồm toàn bộ khâu thiết kế, mua sắm thiết bị và xây lắp.","Vd: The hyperscale datacenter facility was constructed under a $30 million turnkey EPC contract. - Công trình trung tâm dữ liệu siêu quy mô được xây dựng theo hợp đồng tổng thầu EPC trị giá 30 triệu đô-la.","6. Accrued Escrow Interest  /əˈkruːd ˈes.krəʊ ˈɪn.trəst/  = Accumulated Earnings on Held Capital","Nghia: Tiền lãi ngân hàng phát sinh tích lũy trên tài khoản ký quỹ phong tỏa trong thời gian bảo hành.","Vd: The bank disbursed $28,450 in accrued escrow interest alongside the principal retention money. - Ngân hàng đã giải ngân $28,450 tiền lãi ký quỹ tích lũy cùng với số tiền gốc giữ lại bảo hành.","7. Discharge of Contractual Obligations  /dɪsˈtʃɑːdʒ əv kənˈtræk.tʃu.əl ˌɒb.lɪˈɡeɪ.ʃənz/  = Total Release from Legal and Operational Liabilities","Nghia: Sự hoàn thành toàn bộ và chấm dứt các nghĩa vụ pháp lý và vận hành theo hợp đồng.","Vd: With the final wire transfer, both parties executed a full discharge of contractual obligations. - Cùng với đợt chuyển tiền cuối cùng, cả hai bên đã hoàn tất việc thanh lý dứt điểm các nghĩa vụ hợp đồng.","PHẦN TỔNG KẾT: MA TRẬN 60 THUẬT NGỮ VÀNG COMMERCIAL CONTRACTS, SLA NEGOTIATIONS & LEGAL COMPLIANCE (SPACED REPETITION ANKI)",{"t":"table","rows":[[["STT"],["Từ Gốc Trong Hợp Đồng / Đề Thi (Original Contract Term)"],["Diễn Đạt Tương Đương / Paraphrase Trong Câu Hỏi & Đáp Án"],["Ngữ Cảnh Pháp Lý, Nghiệp Vụ & Dấu Ấn Nhận Thức (5s Recall)"]],[["01"],["Service Level Agreement (SLA)"],["Contractual Performance Commitment"],["Cam kết chất lượng dịch vụ kỹ thuật chuyển hóa thành nghĩa vụ pháp lý ràng buộc."]],[["02"],["Service Credit"],["Billing Deduction / Fee Rebate Penalty"],["Khoản giảm trừ cước dịch vụ bù trừ cho việc vi phạm cam kết chất lượng uptime."]],[["03"],["Unscheduled Downtime"],["Unplanned Outage / System Interruption"],["Thời gian ngừng hoạt động ngoài kế hoạch làm căn cứ phạt vi phạm SLA."]],[["04"],["Scheduled Maintenance Window"],["Pre-approved Planned Servicing Period"],["Khung giờ bảo trì định kỳ đã thông báo trước được miễn trừ tính vào thời gian chết."]],[["05"],["Lodge a Formal Claim"],["Submit an Official Penalty Request"],["Nộp đơn khiếu nại cước hoặc yêu cầu phạt vi phạm chính thức trong thời hạn hợp đồng."]],[["06"],["Corrective and Preventive Action (CAPA)"],["Root-Cause Rectification & Prevention Plan"],["Kế hoạch hành động khắc phục lỗi gốc rễ và phòng ngừa tái diễn sự cố kỹ thuật."]],[["07"],["Itemized Deduction"],["Categorized Expense Reduction on Invoice"],["Khoản giảm trừ được tách thành một dòng riêng biệt trên bảng kê cước kế toán."]],[["08"],["Surrender of Premises"],["Formal Handover of Leased Property"],["Bàn giao hoàn trả mặt bằng thuê khi hết hạn hợp đồng thuê thương mại 5 năm."]],[["09"],["Reasonable Wear and Tear"],["Normal Deterioration from Everyday Use"],["Hao mòn tự nhiên hợp lý phát sinh từ sử dụng thông thường được miễn trừ sửa chữa."]],[["10"],["Tenant Improvement Allowance (TIA)"],["Landlord Fit-out Subsidy Fund"],["Khoản phụ cấp cải tạo nội thất bên cho thuê cấp cho bên thuê khi ký hợp đồng."]],[["11"],["Security Deposit Reconciliation"],["Deposit Deductions and Refund Balancing"],["Bảng đối soát trừ chi phí sửa chữa và chốt số dư hoàn cọc ngân hàng."]],[["12"],["Dilapidations Clause"],["Property Reinstatement & Repair Terms"],["Điều khoản bắt buộc tháo dỡ vách ngăn và khôi phục hiện trạng ban đầu mặt bằng."]],[["13"],["Cure Window"],["Contractual Grace Period for Rectification"],["Khung thời gian ân hạn (thường 14 ngày) để tự khắc phục sai sót trước khi bị phạt."]],[["14"],["Broom-Clean Condition"],["Clean, Cleared, and Debris-Free State"],["Tình trạng mặt bằng được dọn sạch rác, tháo dỡ vách ngăn và hút bụi sạch sẽ."]],[["15"],["Return Merchandise Authorization (RMA)"],["Defective Hardware Return Tracking Protocol"],["Mã số ủy quyền gửi trả thiết bị lỗi kỹ thuật cho nhà sản xuất kiểm định."]],[["16"],["Advance Hardware Replacement"],["Upfront Hardware Dispatch Before Return"],["Chính sách gửi thiết bị mới thay thế trước khi nhận lại thiết bị cũ bị hỏng."]],[["17"],["Pre-configured Equipment"],["Pre-programmed Ready-to-Deploy Hardware"],["Thiết bị mạng đã nạp sẵn cấu hình IP/Routing giúp cắm là chạy ngay."]],[["18"],["Reverse Logistics"],["Defective Asset Recovery & Return Transport"],["Quy trình logistics thu hồi linh kiện hỏng từ nhà kho khách hàng về phòng lab."]],[["19"],["Voltage Surge"],["Sudden Electrical Spike / Transient Overvoltage"],["Sự cố tăng vọt điện áp đột ngột làm nổ bộ nguồn thiết bị điện tử."]],[["20"],["Certified Field Technician"],["Accredited On-Site Service Engineer"],["Kỹ sư hiện trường có chứng chỉ chuyên môn điều động đến tận nơi hỗ trợ khách hàng."]],[["21"],["Manufacturing Defect"],["Production Flaw in Materials or Workmanship"],["Lỗi phát sinh từ khâu chế tạo của nhà máy thuộc phạm vi bảo hành miễn phí."]],[["22"],["Cease-and-Desist Demand"],["Formal Demand to Halt Unlawful Conduct"],["Thư cảnh báo pháp lý yêu cầu chấm dứt ngay hành vi vi phạm bí mật thương mại."]],[["23"],["Injunctive Relief"],["Court-Ordered Restraining Prohibition"],["Lệnh cấm khẩn cấp của tòa án buộc đối thủ ngừng khai thác sáng chế/thuật toán."]],[["24"],["Non-Solicitation Covenant"],["Contractual Anti-Poaching Employee Clause"],["Cam kết không chèo kéo, tuyển dụng nhân sự nghiên cứu chủ chốt của đối tác (18 tháng)."]],[["25"],["Misappropriation of Trade Secrets"],["Unlawful Acquisition of Proprietary Information"],["Hành vi chiếm đoạt mã nguồn độc quyền nộp vào đơn đăng ký bằng sáng chế USPTO."]],[["26"],["Irreparable Harm"],["Incurable Damage Inadequately Solved by Money"],["Tổn hại thương mại nghiêm trọng không thể bù đắp bằng tiền bồi thường đơn thuần."]],[["27"],["Verbatim Copying"],["Word-for-Word Literal Replication"],["Sao chép nguyên văn từng dòng mã lệnh thuật toán cấu thành chứng cứ vi phạm rõ ràng."]],[["28"],["Competent Jurisdiction"],["Legally Authorized Court of Law"],["Tòa án có thẩm quyền pháp lý xét xử và ban hành phán quyết cưỡng chế thi hành."]],[["29"],["Statement of Work (SOW)"],["Detailed Project Scope and Deliverables Document"],["Phụ lục hợp đồng quy định chi tiết phạm vi công việc, mốc tiến độ và đơn giá."]],[["30"],["User Acceptance Testing (UAT)"],["End-User Operational Verification Phase"],["Giai đoạn kiểm thử nghiệm thu hệ thống bởi người dùng thực tế trước khi Go-Live."]],[["31"],["Escrow Account Disbursement"],["Release of Third-Party Held Funds"],["Lệnh giải ngân nguồn tiền được bảo đảm trong tài khoản ký quỹ trung gian ngân hàng."]],[["32"],["Milestone Deliverable"],["Phased Project Output Required for Payment"],["Sản phẩm bàn giao theo giai đoạn là điều kiện tiên quyết để được giải ngân từng đợt."]],[["33"],["Severity 1 Critical Defect"],["System-Halting Blocker / High-Priority Bug"],["Lỗi nghiêm trọng làm tê liệt hệ thống bắt buộc phải bằng 0 mới được ký nghiệm thu."]],[["34"],["Conditional Sign-Off"],["Approval Contingent on Subsequent Fixes"],["Phê duyệt nghiệm thu có điều kiện kèm cam kết vá lỗi giao diện trước ngày Go-Live."]],[["35"],["Cutover & Go-Live"],["System Transition to Live Production Operations"],["Thời điểm chính thức chuyển đổi dữ liệu và đưa hệ thống vào vận hành trực tiếp."]],[["36"],["International Commercial Arbitration"],["Binding Cross-Border Dispute Resolution Tribunal"],["Phương thức giải quyết tranh chấp thương mại quốc tế bằng trọng tài độc lập (SIAC)."]],[["37"],["Liquidated Demurrage Charges"],["Pre-agreed Delay Penalties for Vessel Laytime"],["Tiền phạt lưu tàu định trước ($15,000/ngày) khi dỡ hàng vượt quá thời gian làm hàng."]],[["38"],["Force Majeure Invocation"],["Legal Defense Citing Unforeseeable Acts of God"],["Viện dẫn điều khoản bất khả kháng để miễn trừ trách nhiệm hợp đồng khi gặp thiên tai."]],[["39"],["Contributory Operational Negligence"],["Internal Fault Contributing to Delay or Failure"],["Lỗi bất cẩn vận hành nội bộ (như đình công, nợ tiền dầu) làm vô hiệu lý do bất khả kháng."]],[["40"],["Irrevocable Waiver of Exemption"],["Permanent Forfeiture of Immunity Rights"],["Mất vĩnh viễn quyền miễn trừ trách nhiệm do không nộp thông báo bão trong hạn 5 ngày."]],[["41"],["Maritime Asset Arrest Warrant"],["Court Order for Ship Detainment & Seizure"],["Lệnh bắt giữ tàu biển của tòa án hàng hải nhằm phong tỏa tài sản bảo đảm thi hành án."]],[["42"],["Laytime Exceedance"],["Overrunning Agreed Cargo Loading/Discharge Hours"],["Việc vượt quá số ngày cho phép làm hàng tại cảng dẫn đến phát sinh tiền phạt lưu tàu."]],[["43"],["Product Liability Insurance"],["Defective Product Indemnification Coverage"],["Bảo hiểm trách nhiệm sản phẩm bảo vệ nhà sản xuất trước thiệt hại do lỗi kỹ thuật."]],[["44"],["Subrogation Rights"],["Insurer's Legal Right to Recover from Faulty Third Parties"],["Quyền thế quyền cho phép công ty bảo hiểm sau khi bồi thường được kiện đòi bên thứ ba."]],[["45"],["Policy Deductible"],["Insured's Out-of-Pocket Retained Payment"],["Mức khấu trừ tự chịu ($10,000) mà người được bảo hiểm phải tự thanh toán cho nạn nhân."]],[["46"],["Full Release of Liability"],["Unconditional Waiver of Future Legal Claims"],["Văn bản bãi nại toàn bộ từ bỏ quyền khiếu kiện để nhận khoản tiền bồi thường dứt điểm."]],[["47"],["Forensic Investigation"],["Scientific Root-Cause Failure Analysis"],["Điều tra kỹ thuật pháp y độc lập chứng minh lỗi do nứt vi mô linh kiện rơ-le nhiệt."]],[["48"],["Business Interruption Loss"],["Lost Operating Profits During Facility Downtime"],["Tổn thất doanh thu và lợi nhuận do nhà hàng phải đóng cửa 14 ngày sau hỏa hoạn."]],[["49"],["Component Vendor Attribution"],["Assigning Defect Blame to Upstream Supplier"],["Quy kết nguồn gốc lỗi kỹ thuật cho nhà cung cấp linh kiện bán dẫn bên thứ ba."]],[["50"],["Liquidated Damages"],["Pre-agreed Contractual Breach Penalty Amount"],["Tiền phạt vi phạm định trước được thỏa thuận cụ thể cho từng lỗi vi phạm an toàn thực phẩm."]],[["51"],["Cold-Chain Transportation"],["Temperature-Controlled Refrigerated Logistics"],["Vận chuyển chuỗi lạnh bảo đảm nhiệt độ thùng xe luôn ở mức 4.0°C trở xuống."]],[["52"],["Direct Billing Deduction"],["Automated Invoice Withholding / Set-off"],["Khấu trừ trực tiếp tiền phạt vi phạm ($8,000) trên hóa đơn thanh toán tiền dịch vụ tháng."]],[["53"],["Termination for Cause"],["Immediate Contract Cancellation Due to Default"],["Chấm dứt hợp đồng ngay lập tức do lỗi vi phạm nghiêm trọng trong thời gian thử thách 90 ngày."]],[["54"],["Hazard Analysis Critical Control Point (HACCP)"],["Systematic Preventive Food Safety Certification"],["Chứng chỉ kiểm soát mối nguy an toàn thực phẩm bắt buộc đối với nhà thầu suất ăn bán trú."]],[["55"],["Unauthorized Substitution"],["Unapproved Product or Supplier Replacement"],["Tự ý thay đổi nhà cung cấp hoa quả chưa qua thẩm định bị phạt nghiêm khắc $5,000."]],[["56"],["Condemn and Dispose"],["Declare Unfit for Use and Destroy Officially"],["Tịch thu và tiêu hủy toàn bộ 1,200 hộp sữa chua bị hỏng do xe vận chuyển tắt điều hòa."]],[["57"],["End-User License Agreement (EULA)"],["Software Usage Rights and Restrictions Contract"],["Hợp đồng bản quyền phần mềm quy định quyền kiểm toán và giới hạn cài đặt máy chủ."]],[["58"],["True-Up License Purchase"],["Reconciliation Purchase of Additional Licenses"],["Mua bổ sung bản quyền để bù đắp số lượng máy chủ/người dùng triển khai vượt mức."]],[["59"],["Retention Money Reserve"],["Contractor Warranty Holdback Escrow Fund"],["Quỹ giữ lại bảo hành 5% ($1,500,000) bảo đảm nghĩa vụ khắc phục sai sót hợp đồng EPC."]],[["60"],["Final Acceptance Certificate"],["Formal Document Certifying Complete Contractual Handover"],["Chứng chỉ nghiệm thu cuối cùng giải phóng tiền cọc giữ lại và thanh lý dứt điểm hợp đồng."]]]}]</script>
<script type="application/json" id="labels">["Cloud SLA & Service Credit","Thuê VP & Hoàn trả mặt bằng","Bảo hành viễn thông & RMA","Bảo mật NDA & Bí mật KD","ERP MSA & Ký quỹ Escrow","Bất khả kháng & Trọng tài SIAC","Bảo hiểm trách nhiệm & Thế quyền","SLA suất ăn & Phạt vi phạm","Kiểm toán bản quyền & True-Up","Tổng thầu EPC & Tiền giữ lại"]</script>
<script>
(function(){
const RAW = JSON.parse(document.getElementById('src').textContent);
const VI_RE = /[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i;
const isVI = s => VI_RE.test(s);
let SHORT = []; try{ SHORT = JSON.parse(document.getElementById('labels').textContent)||[]; }catch(e){}

function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function add(p,...kids){ kids.forEach(k=>k&&p.appendChild(k)); return p; }
const isStr = x => typeof x === 'string';

/* ---------- split document ---------- */
const intro = RAW.slice(0,3);
const lessons = [];
let cur=null, finalTable=null, finalTitle='';
for(let i=3;i<RAW.length;i++){
  const it=RAW[i];
  if(isStr(it) && /^[=\-]{10,}$/.test(it)) continue;
  // "BÀI THỰC HÀNH SỐ N" alone (title on the next line) or "BÀI THỰC HÀNH SỐ N: Title" (title on the same line)
  if(isStr(it) && /^BÀI THỰC HÀNH SỐ\s*\d+/.test(it)){ const t=it.replace(/^BÀI THỰC HÀNH SỐ\s*\d+\s*:?\s*/,''); cur={items:t?[t]:[]}; lessons.push(cur); continue; }
  // "BÀI N: Title" keeps the title on the same line
  if(isStr(it) && /^BÀI\s+\d+\s*:/.test(it)){ cur={items:[it.replace(/^BÀI\s+\d+\s*:\s*/,'')]}; lessons.push(cur); continue; }
  if(isStr(it) && /^(BẢNG TỔNG HỢP|PHẦN TỔNG KẾT|PHAN TONG KET)/.test(it)){ cur=null; finalTitle=it; continue; }
  if(!cur){ if(!isStr(it)) finalTable=it; continue; }
  cur.items.push(it);
}
lessons.forEach((L,idx)=>{
  L.n=idx+1;
  let t=L.items[0]; const tq=t.match(/\s*\((Questions?\s*\d+\s*-\s*\d+[^()]*)\)\s*$/); if(tq) t=t.slice(0,tq.index);
  // trailing "(ENGLISH TITLE)" only when it is a real English title, not a short term like "(Credit Memo)":
  // 4+ words, or an all-caps title of 2+ words such as "(GRAPHIC DESIGN ASSOCIATE)"
  const m=t.match(/^(.*)\s\(([^()]*)\)\s*$/); const nw=m?m[2].split(/\s+/).length:0;
  const isEn=m&&!isVI(m[2])&&(nw>=4||(nw>=2&&m[2]===m[2].toUpperCase()&&/[A-Z]/.test(m[2])));
  L.vi = isEn?m[1]:t; L.en = isEn?m[2]:'';
  L.src = L.items[1].replace(/^Nguồn( bài học)?:\s*/,'');
  const q=(L.src+' '+L.items[0]).match(/Questions?\s*(\d+)\s*-\s*(\d+)/); L.qr = q?`Q${q[1]}–${q[2]}`:'';
  if(!SHORT[idx]){ const w=L.vi.split(/\s+/).slice(0,4).join(' ').toLowerCase(); SHORT[idx]=w.charAt(0).toUpperCase()+w.slice(1); }
  L.parts=[]; let P=null, S=null;
  for(const it of L.items.slice(2)){
    if(isStr(it)){
      const pm=it.match(/^PHẦN\s*(\d)\s*:\s*(.*)$/i);
      if(pm){ P={n:+pm[1],title:pm[2],subs:[],items:[]}; L.parts.push(P); S=null; continue; }
      const sm=it.match(/^(\d\.\d)\.\s+(.*)$/);
      // only "N.x." of the current PHẦN N opens a sub-section; "4.1. Package…" inside a passage is content
      if(sm && P && +sm[1][0]===P.n){ S={id:sm[1],title:sm[2],items:[]}; P.subs.push(S); continue; }
    }
    if(S) S.items.push(it); else if(P) P.items.push(it);
  }
  // answer key from part 3
  L.key={}; L.answers=[];
  const p3=L.parts.find(p=>p.n===3);
  // two formats: "186. (A) text" + [Dau vet]/[Giai thich]
  //          or  "186. stem" + "Dap an dung: (A) text" + [Dau vet bai doc]/[Dien dat tuong duong]/[Loi giai chi tiet]/[Phan tich Phuong an Sai] + "(B) ..." "- Ly do sai:" "- Bay ETS:"
  if(p3){ let a=null, sec='';
    const newA=no=>{ a={no,k:'',t:'',stem:'',trace:'',expl:'',para:[],wrong:[]}; L.answers.push(a); sec=''; };
    for(const s of p3.items){ if(!isStr(s)) continue;
      let m=s.match(/^(\d{3})\.\s*\(([A-D])\)\s*(.*)$/);
      if(m){ newA(m[1]); a.k=m[2]; a.t=m[3]; L.key[m[1]]=m[2]; continue; }
      m=s.match(/^(\d{3})\.\s+(.*)$/);
      if(m){ newA(m[1]); a.stem=m[2]; continue; }
      if(!a) continue;
      m=s.match(/^Dap an dung:\s*\(([A-D])\)\s*(.*)$/i);
      if(m){ a.k=m[1]; a.t=m[2]; L.key[a.no]=m[1]; continue; }
      m=s.match(/^\[([^\]]+)\]:?\s*(.*)$/);
      if(m){ const lab=m[1], rest=m[2];
        if(/^Dau vet/i.test(lab)){ sec='trace'; a.trace=rest; }
        else if(/Paraphrase|Dien dat/i.test(lab)){ sec='para'; rest.split(/\s*•\s*/).filter(Boolean).forEach(x=>a.para.push(x)); }
        else if(/Phuong an Sai|Bay/i.test(lab)){ sec='wrong'; }
        else { sec='expl'; a.expl+=(a.expl?' ':'')+rest; }
        continue; }
      if(sec==='wrong'){
        m=s.match(/^\(([A-D])\)\s*(.*)$/); if(m){ a.wrong.push({k:m[1],t:m[2],why:'',trap:''}); continue; }
        const w=a.wrong[a.wrong.length-1]; m=s.match(/^-\s*(Ly do sai|Bay ETS)\s*:\s*(.*)$/i);
        if(w&&m){ if(/^Ly/i.test(m[1])) w.why=m[2]; else w.trap=m[2]; continue; }
      }
      if(sec==='para' && /^•/.test(s)){ a.para.push(s.replace(/^•\s*/,'')); continue; }
      if(sec==='trace'){ a.trace+=' '+s; continue; }
      a.expl += (a.expl?' ':'')+s;
    }
  }
});
const TABS = lessons.map(L=>({id:'bai'+L.n, n:String(L.n).padStart(2,'0'), label:SHORT[L.n-1]||('Bài '+L.n), sub:L.qr, c:`var(--c${L.n})`}));
const NFIN = finalTable ? finalTable.rows.length-1 : 50;
const FINLABEL = /THU[ẬA]T NG[ỮU]/i.test(finalTitle) ? `${NFIN} thuật ngữ vàng` : `${NFIN} cặp Paraphrase`;
TABS.push({id:'paraphrase', n:String(NFIN), label:FINLABEL, sub:'Tổng hợp nạp Anki', c:'var(--red)'});

/* ---------- line formatting for passages ---------- */
// passage header: known doc types, a bare "[Internal Recommendation] Letter", or generic "Doc Type [N] (Descriptor)";
// a bracket holding a date ("Boston (January 3)", "(Evaluated by …, Director — March 28)") is a dateline or caption, not a header
const DOC_RE=/^(E-mail|Email|Letter \d|Document \d|Internal Memorandum|Webpage|Press Release|Bill of Lading|Economic Logistics Article|Service Proposal)\b|^(?:[A-Z][a-z]+ ){0,3}Letter$|^[A-Z][A-Za-z&\/\- ]{2,50}(?: \d)? \((?![^()]*\b(?:January|February|March|April|May|June|July|August|September|October|November|December) \d)[A-Za-z][^()]*\)$/;
// an ALL-CAPS line like "REQUEST FOR PROPOSALS (RFP #VF-2026-08)" is a letterhead inside a passage, not a new passage
const isDocHead=s=>DOC_RE.test(s) && s.length<110 && !/:\s/.test(s) && !(s===s.toUpperCase() && /[A-Z]{4}/.test(s));
function fmtLine(s){
  if(/^•\s*/.test(s)) return el('div','ln-bul',s.replace(/^•\s*/,''));
  const kv=s.match(/^([A-ZÀ-Ỹa-zà-ỹ][^:]{0,30}):\s+(.+)$/);
  if(kv && !/[.!?]$/.test(kv[1]) && kv[1].split(' ').length<=5){ const d=el('div','ln-kv'); add(d,el('b',null,kv[1]+':'),document.createTextNode(kv[2])); return d; }
  if(s===s.toUpperCase() && /[A-ZÀ-Ỹ]{3}/.test(s) && s.length<130) return el('div','ln-caps',s);
  if(/:$/.test(s) && s.length<60) return el('div','ln-sec',s);
  return el('p',null,s);
}

/* "• Label: text" bullet with a bold label; "• Label:" alone becomes a group heading */
function bullet(s){
  s=s.trim();
  if(/^[^:]{2,150}:$/.test(s)) return el('div','ln-head',s.slice(0,-1));
  const d=el('div','ln-bul'); const m=s.match(/^([^:]{2,150}?):\s+(.*)$/);
  if(m && !/[.!?]$/.test(m[1])){ let rest=m[2]; if(rest.startsWith(m[1]+':')) rest=rest.slice(m[1].length+1).trim();
    add(d,el('b',null,m[1]+': '),document.createTextNode(rest)); }
  else d.textContent=s;
  return d;
}
/* one line of a strategy / BA block: "• ..." bullet, "=> ..." conclusion, "(1) ..." numbered point, else paragraph */
function richLine(s){
  s=s.trim();
  if(/^•/.test(s)){ const r=s.replace(/^•\s*/,''); return r.trim()?bullet(r):null; }
  if(/^=>/.test(s)){ const d=bullet(s.replace(/^=>\s*/,'')); d.className='ln-concl'; return d; }
  if(/^\(\d+\)/.test(s)){ const d=bullet(s); d.className='ln-num'; return d; }
  if(/^-\s/.test(s)){ const d=bullet(s.replace(/^-\s*/,'')); d.className='ln-sub'; return d; }
  return el('p',null,s);
}

/* mode 'pass' = original passages only, 'quiz' = original questions only, 'strat' = strategy steps before the passages,
   'guide' = the whole sub-section is strategy (newer docs give it its own "Hướng dẫn làm bài Part 7" sub-section) */
function render11(L,items,box,mode){
  // passages start at "[ORIGINAL ETS PASSAGES…]", else at "Questions N-M refer to…" or the first passage header after the last "Bước" line
  let iP=items.findIndex(s=>isStr(s)&&/^\[ORIGINAL ETS PASSAGES/i.test(s)), pSkip=1;
  if(iP<0){ iP=items.findIndex(s=>isStr(s)&&/^Questions\s+\d+.*refer to/i.test(s)); pSkip=0; }
  if(iP<0){ let lastStep=-1; items.forEach((s,i)=>{ if(isStr(s)&&/^Bước\s*\d+\s*\(/.test(s)) lastStep=i; });
    iP=items.findIndex((s,i)=>i>lastStep&&isStr(s)&&(isDocHead(s)||/^\[Passage/i.test(s))); pSkip=0; }
  if(mode==='guide'){ iP=items.length; mode='strat'; }  // a stand-alone strategy sub-section is all strategy
  const iQ=items.findIndex(s=>isStr(s)&&/^(\[ORIGINAL ETS QUESTIONS|ETS Questions:?$)/i.test(s));
  const strat=items.slice(0,iP<0?0:iP), pass=items.slice(iP<0?0:iP+pSkip,iQ<0?items.length:iQ), qs=iQ<0?[]:items.slice(iQ+1);
  if(strat.length && mode==='strat'){
    const st=el('div','strat'); const steps=el('div','steps'); let lastTx=null;
    const addBody=(tx,text)=>{ text.split(/\s+•\s+/).forEach((seg,i)=>{ seg=seg.replace(/^•\s*/,'').trim(); if(seg) tx.appendChild(i||/^•/.test(text)?bullet(seg):el('p',null,seg)); }); };
    strat.forEach(s=>{
      const m=s.match(/^(Bước\s*\d+)\s*\(([^)]+)\)\s*-\s*([^:]+?):\s*(.*)$/);
      if(m){ const r=el('div','step'); const w=el('div','when'); add(w,el('b',null,m[1]),el('span',null,m[2]));
        const tx=el('div'); tx.style.cssText='display:flex;flex-direction:column;gap:4px'; tx.appendChild(el('h5',null,m[3])); addBody(tx,m[4]); add(r,w,tx); steps.appendChild(r); lastTx=tx; }
      else if(lastTx){ const r=richLine(s); r&&lastTx.appendChild(r); }
      else st.appendChild(el('div','strat-t',s));
    });
    st.appendChild(steps); box.appendChild(st);
  }
  if(mode==='strat') return;
  // passages
  if(mode==='pass'){
  const papers=el('div','papers'); let pp=null, refer='';
  const newPaper=(tag)=>{ pp=el('article','paper'); if(tag) pp.appendChild(el('span','paper-tag',tag)); papers.appendChild(pp); };
  pass.forEach(s=>{
    if(!isStr(s)) return;
    if(/^Questions\s+\d+.*refer to/i.test(s)){ refer=s; return; }
    const pm=s.match(/^\[(Passage\s*\d+\s*:.*)\]$/i); if(pm){ newPaper(pm[1]); return; }
    if(isDocHead(s)){ newPaper(s); return; }
    if(!pp) newPaper('ETS Passage');
    pp.appendChild(fmtLine(s));
  });
  const lab=el('div','strat-t','Original ETS Passages · Đề thi tiếng Anh gốc'); lab.style.color='var(--muted)';
  box.appendChild(lab); if(refer){ const r=el('p',null,refer); r.style.cssText='font-style:italic;color:var(--muted);margin:0 0 10px'; box.appendChild(r); } box.appendChild(papers);
  return; }
  // quiz; a bare "191" line takes its stem from PHẦN 3
  const Q=[]; let q=null;
  qs.forEach(s=>{ if(!isStr(s)) return;
    let m=s.match(/^(\d{3})(?:\.\s*(.*))?$/); if(m){ const a=L.answers.find(x=>x.no===m[1]); q={no:m[1],stem:m[2]||(a&&a.stem)||'',extra:[],opts:[]}; Q.push(q); return; }
    m=s.match(/^\(([A-D])\)\s*(.*)$/); if(m&&q){ q.opts.push({k:m[1],t:m[2]}); return; }
    if(q) q.extra.push(s);
  });
  L.quiz=Q;
  if(!Q.length) return;
  const qz=el('div','quiz'); const top=el('div','quiz-top');
  const sc=el('div','score'); const reset=el('button','btn','Làm lại'); reset.type='button';
  add(top,el('div','strat-t','Original ETS Questions · Bấm chọn đáp án để tự kiểm tra'),add(el('div'),sc));
  top.lastChild.style.cssText='display:flex;gap:10px;align-items:center'; top.lastChild.appendChild(reset);
  qz.appendChild(top);
  const state={};
  const upd=()=>{ const done=Object.keys(state).length, ok=Object.values(state).filter(Boolean).length;
    sc.innerHTML=''; add(sc,document.createTextNode('Đã làm '),el('b',null,`${done}/${Q.length}`),document.createTextNode(' · Đúng '),el('b',null,String(ok))); };
  Q.forEach(q=>{
    const c=el('div','q'); const st=el('div','q-stem'); const stx=el('div',null,q.stem);
    q.extra.forEach(x=>stx.appendChild(el('div','q-extra',x)));
    add(st,el('span','q-no',q.no),stx); c.appendChild(st);
    const os=el('div','opts'); const fb=el('div','q-fb');
    const btns=q.opts.map(o=>{ const b=el('button','opt'); b.type='button'; add(b,el('span','k',`(${o.k})`),el('span',null,o.t));
      b.addEventListener('click',()=>{
        const right=L.key[q.no]; btns.forEach(x=>x.classList.remove('ok','bad'));
        const good=o.k===right; state[q.no]=good;
        b.classList.add(good?'ok':'bad');
        if(!good&&right){ const rb=btns[q.opts.findIndex(z=>z.k===right)]; rb&&rb.classList.add('ok'); }
        fb.innerHTML=''; const r=el('span','r '+(good?'ok':'bad'),good?'✓ Chính xác':`✗ Chưa đúng · đáp án (${right})`);
        const a=el('a',null,'Xem dấu vết truy xuất'); a.href='#'; a.addEventListener('click',e=>{e.preventDefault(); const t=document.getElementById(`b${L.n}-a${q.no}`); if(t){t.scrollIntoView({behavior:'smooth',block:'center'}); t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash');}});
        add(fb,r,a); upd();
      });
      os.appendChild(b); return b; });
    add(c,os,fb); qz.appendChild(c);
    reset.addEventListener('click',()=>{ btns.forEach(x=>x.classList.remove('ok','bad')); fb.innerHTML=''; delete state[q.no]; upd(); });
  });
  upd(); box.appendChild(qz);
}

function render12(items,box){
  const wrap=el('div','bi'); const head=el('div','bi-head'); add(head,el('span',null,'ENGLISH'),el('span',null,'TIẾNG VIỆT')); wrap.appendChild(head);
  const runs=[];
  items.forEach(s=>{ if(!isStr(s)) return;
    if(/^\[?Văn bản(\s*\d+)?\s*:/.test(s)){ runs.push({doc:s.replace(/^\[(.*)\]$/,'$1')}); return; }
    const lg=isVI(s)?'vi':'en'; const last=runs[runs.length-1];
    if(last&&last.lg===lg) last.lines.push(s); else runs.push({lg,lines:[s]});
  });
  for(let i=0;i<runs.length;i++){
    const r=runs[i];
    if(r.doc){ const d=el('div','bi-doc',r.doc); d.style.padding='12px 16px 8px'; d.style.borderTop='1px solid var(--line)'; d.style.margin='0'; d.style.background='var(--surface-2)'; wrap.appendChild(d); continue; }
    const p=el('div','pair'); const en=el('div','en'), vi=el('div','vi vi-r');
    if(r.lg==='en'){ r.lines.forEach(s=>en.appendChild(fmtLine(s))); const nx=runs[i+1]; if(nx&&nx.lg==='vi'){ nx.lines.forEach(s=>vi.appendChild(fmtLine(s))); i++; } }
    else r.lines.forEach(s=>vi.appendChild(fmtLine(s)));
    add(p,en,vi); wrap.appendChild(p);
  }
  box.appendChild(wrap);
}

function render13(L,items,box){
  const list=el('div','qt'); let card=null, opts=null;
  const strs=items.filter(isStr);
  const isQ=s=>/^(Câu\s+)?\d{3}\.\s/.test(s), isO=s=>/^\([A-D]\)/.test(s);
  // Vietnamese-only lines ("Câu 186. …", "(A) …") borrow the English stem / option from the quiz in 1.1
  let qq=null;
  for(let i=0;i<strs.length;i++){
    const s=strs[i], nx=strs[i+1], hasVi=nx&&!isQ(nx)&&!isO(nx);
    if(isQ(s)){ const m=s.match(/^(?:Câu\s+)?(\d{3})\.\s*(.*)$/); qq=(L.quiz||[]).find(x=>x.no===m[1]);
      card=el('div','qt-card'); card.dataset.no=m[1]; const st=el('div','stem'); const tx=el('div');
      if(isVI(m[2])&&qq&&qq.stem){ tx.appendChild(el('b',null,qq.stem)); tx.appendChild(el('span','vi-t vi-r',m[2])); }
      else { tx.appendChild(el('b',null,m[2])); if(hasVi){ tx.appendChild(el('span','vi-t vi-r',nx)); i++; } }
      add(st,el('span','q-no',m[1]),tx); card.appendChild(st); opts=el('div','qt-opts'); card.appendChild(opts); list.appendChild(card); continue; }
    if(isO(s)&&opts){ const m=s.match(/^\(([A-D])\)\s*(.*)$/); const o=el('div','qt-opt'); if(L.key[card.dataset.no]===m[1]) o.classList.add('correct');
      const tx=el('div'); const eo=qq&&qq.opts.find(x=>x.k===m[1]);
      if(eo&&eo.t!==m[2]&&!hasVi){ tx.appendChild(el('span',null,eo.t)); tx.appendChild(el('span','vi-t vi-r',m[2])); }
      else { tx.appendChild(el('span',null,m[2])); if(hasVi){ tx.appendChild(el('span','vi-t vi-r',nx)); i++; } }
      add(o,el('span','k',`(${m[1]})`),tx); opts.appendChild(o); continue; }
    if(card) card.appendChild(el('p','vi-t vi-r',s));
  }
  box.appendChild(list);
}

function renderPairs(items,box,cls){
  const strs=items.filter(isStr); const g=el('div',cls);

}

/* summary paragraph -> one bullet per sentence; a long tail after ": " becomes sub-bullets split at top-level ", and/và/nhờ/đồng thời" or "; " */
const ABBR=/\b(Mr|Ms|Mrs|Dr|St|No|Inc|Co|Ltd|Corp|vs|etc|e\.g|i\.e|approx|Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)\.$/i;
function topSplit(s,test){ // split where test(s,i) matches outside brackets/quotes; returns [pieces]
  const out=[]; let d=0, st=0;
  for(let i=0;i<s.length;i++){ const c=s[i];
    if('(['.includes(c)) d++; else if(')]'.includes(c)) d=Math.max(0,d-1);
    else if(!d){ const n=test(s,i); if(n){ out.push(s.slice(st,i+n.keep).trim()); st=i+n.skip; i=st-1; } } }
  out.push(s.slice(st).trim()); return out.filter(Boolean);
}
function sentences(s){
  return topSplit(s,(t,i)=>{ if(!/[.!?]/.test(t[i])||!/\s/.test(t[i+1]||'')) return null;
    if(ABBR.test(t.slice(Math.max(0,i-6),i+1))) return null;
    const nx=t.slice(i+1).trimStart()[0]||''; if(!/[A-ZÀ-Ỹ0-9"'‘“(]/.test(nx)) return null;
    return {keep:1,skip:1}; });
}
function ideaList(s,vi){
  const ul=el('ul','ideas'+(vi?' vi-t':''));
  sentences(s).forEach(sen=>{
    const li=el('li'); const ci=sen.search(/:\s/); let head=sen, tail='';
    if(ci>20 && sen.length-ci>90){ head=sen.slice(0,ci+1); tail=sen.slice(ci+1).trim(); }
    // long sentence without a colon tail: break at top-level ", allowing / , while / , đồng thời / —"
    if(!tail && sen.length>200){ const ps=topSplit(sen,(t,i)=>{ const m=t.slice(i).match(/^(,\s+(?=(?:allowing|while|whereas|đồng thời|trong khi)\s)|\s*—\s*)/); return m?{keep:0,skip:m[0].length}:null; });
      if(ps.length>1){ head=ps[0]; tail=ps.slice(1); } }
    li.appendChild(document.createTextNode(head));
    if(Array.isArray(tail)){ const sub=el('ul'); tail.forEach(p=>sub.appendChild(el('li',null,p))); li.appendChild(sub); }
    else if(tail){ const parts=topSplit(tail,(t,i)=>{ const m=t.slice(i).match(/^(,\s+(?=(?:and|và|nhờ|đồng thời|rồi|then|while)\s)|;\s+)/); return m?{keep:m[0].startsWith(';')?1:0,skip:m[0].length}:null; });
      const sub=el('ul'); parts.forEach(p=>sub.appendChild(el('li',null,p))); li.appendChild(sub); }
    ul.appendChild(li);
  });
  return ul;
}

/* every table in 4.1 is one diagram (Vietnamese, then the English translation); the text line before a table is its caption.
   Arrow columns ("-->", "➔", "→") are dropped; a step head is "BƯỚC 1: Title" in one cell line or "BƯỚC 1" / "STEP 1" then the title */
function renderFlow(items,box){
  const keep=c=>c.length && !(c.length===1 && /^\s*(-+>|➔|→|➜|⇒|►|>)\s*$/.test(c[0]));
  let cap='';
  items.forEach(it=>{
    if(isStr(it)){ cap=it; return; }
    const tb=it, heads=tb.rows[0].filter(keep), bodies=(tb.rows[1]||[]).filter(keep);
    if(cap){ const c=el('div','strat-t',cap.replace(/:\s*$/,'')); c.style.cssText='color:var(--muted);margin:14px 0 8px'; box.appendChild(c); cap=''; }
    const f=el('div','flow');
    heads.forEach((hc,i)=>{
      const s=el('div','fstep'); const hm=hc[0].match(/^((?:BƯỚC|STEP)\s*\d+)\s*:?\s*(.*)$/i);
      const title=hm?[hm[2],...hc.slice(1)].filter(Boolean).join(' '):hc.join(' ');
      const h=el('h5'); if(hm){ add(h,el('span',null,hm[1]),document.createTextNode(title)); } else h.textContent=title;
      s.appendChild(h);
      (bodies[i]||[]).forEach(x=>{ x=x.replace(/^•\s*/,''); const m=x.match(/^([^:]{2,40}):\s*(.*)$/); const d=el('div','fkv'+(m&&/Đầu ra|Kết quả|Ket qua|Deliverable|Output/i.test(m[1])?' out':''));
        if(m) add(d,el('b',null,m[1]),el('span',null,m[2])); else d.textContent=x; s.appendChild(d); });
      f.appendChild(s);
    });
    box.appendChild(f);
  });
}

  const head=el('div','lesson-head'); head.style.setProperty('--c',`var(--c${L.n})`);
  const bn=el('div','big-n'); add(bn,el('small',null,'BÀI THỰC HÀNH'),document.createTextNode(String(L.n).padStart(2,'0')));
  const ht=el('div'); add(ht,el('h2',null,L.vi)); if(L.en) ht.appendChild(el('div','en-t',L.en));
  const src=el('div','src'); add(src,el('b',null,'NGUỒN'),el('span',null,L.src)); ht.appendChild(src);
  add(head,bn,ht); root.appendChild(head);

  const lay=el('div','layout'); const toc=el('nav','toc'); toc.setAttribute('aria-label','Mục lục bài '+L.n);
  const content=el('div','content');
  L.parts.forEach(P=>{
    const a=el('a'); a.href=`#b${L.n}-p${P.n}`; add(a,el('b',null,String(P.n)),el('span',null,shortPart(P))); toc.appendChild(a);
    a.addEventListener('click',e=>{e.preventDefault(); document.getElementById(`b${L.n}-p${P.n}`).scrollIntoView({behavior:'smooth'});});
    const sec=partShell(L,P);
    if(P.n===1){ splitPart1(P.subs).forEach(S=>{
        const sa=el('a','toc-sub',S.id+' '+S.short); sa.href='#'; sa.addEventListener('click',e=>{e.preventDefault(); document.getElementById(`b${L.n}-s${S.id.replace('.','-')}`).scrollIntoView({behavior:'smooth'});}); toc.appendChild(sa);
        const b=subShell(L,S);
        if(S.src==='1.1') render11(L,S.items,b,S.mode); else if(S.src==='1.2') render12(S.items,b); else if(S.src==='1.3') render13(L,S.items,b); else renderPairs(S.items,b,'sum');
        sec.appendChild(b); }); }
    else if(P.n===2) renderMatrix(P.items,sec);
    else if(P.n===3) renderAnswers(L,sec);
    else if(P.n===4){ P.subs.forEach(S=>{ const b=subShell(L,S);
        if(S.id==='4.1') renderFlow(S.items,b);
        else { const t=el('div','ba'); const d=el('div'); S.items.filter(isStr).forEach(s=>{ const r=richLine(s); r&&d.appendChild(r); }); t.style.gridTemplateColumns='minmax(0,1fr)'; t.appendChild(d); b.appendChild(t); }
        sec.appendChild(b); }); }
    else if(P.n===5) renderVocab(P.items,sec);
    content.appendChild(sec);
  });
  add(lay,toc,content); root.appendChild(lay);
  root.appendChild(pager(L.n-1));
  return root;
}
function shortPart(P){ return ({1:'Văn bản & dịch song ngữ',2:'Active Recall 5 giây',3:'Đáp án & dấu vết',4:'Feynman & quy trình BA',5:'Từ vựng & Paraphrase'})[P.n]||P.title; }
/* page order for PHẦN 1: 1.1 Đề gốc, 1.2 Câu hỏi gốc (both from the doc's 1.1), 1.3 Chiến thuật (the doc's own
   "Hướng dẫn làm bài Part 7" sub-section, or the "Bước" lines inside the doc's 1.1 in older docs), then translation,
   question translation and summary — matched by title so both doc layouts number the same */
function splitPart1(subs){
  const kind=S=>/Hướng dẫn làm bài|Strategy Guide/i.test(S.title)&&S.id!=='1.1'?'guide':/Từng Câu|Sentence/i.test(S.title)?'1.2':/Câu hỏi|Question/i.test(S.title)?'1.3':/Tóm tắt|Summary/i.test(S.title)?'1.4':S.id==='1.1'?'1.1':'1.4';
  const short={'1.2':'Dịch từng câu','1.3':'Dịch câu hỏi','1.4':'Tóm tắt'};
  const s11=subs.find(S=>kind(S)==='1.1'), guide=subs.find(S=>kind(S)==='guide'), out=[];
  if(s11){
    out.push({...s11,src:'1.1',mode:'pass',short:'Đề gốc',title:'Đề thi Tiếng Anh gốc (Original ETS Passages)'});
    out.push({...s11,src:'1.1',mode:'quiz',short:'Câu hỏi gốc',title:'Câu hỏi Tiếng Anh gốc (Original ETS Questions)'});
  }
  if(guide) out.push({...guide,src:'1.1',mode:'guide',short:'Chiến thuật',title:'Hướng dẫn làm bài Part 7 (Strategy Guide)'});
  else if(s11) out.push({...s11,src:'1.1',mode:'strat',short:'Chiến thuật',title:'Hướng dẫn làm bài Part 7 (Strategy Guide)'});
  subs.forEach(S=>{ const k=kind(S); if(k!=='1.1'&&k!=='guide') out.push({...S,src:k,short:short[k]}); });
  out.forEach((S,i)=>S.id='1.'+(i+1));
  return out;
}

function renderParaphrase(){
  const root=el('div'); root.style.setProperty('--c','var(--red)');
  const head=el('div','lesson-head'); head.style.setProperty('--c','var(--c1)');
  const bn=el('div','big-n'); add(bn,el('small',null,'TỔNG HỢP'),document.createTextNode(String(NFIN)));
  const ht=el('div'); add(ht,el('h2',null,finalTitle.replace(/^BẢNG TỔNG HỢP 50 CẶP TỪ /,'').replace(/^(PHẦN TỔNG KẾT|PHAN TONG KET)\s*:\s*/i,'') || finalTitle));
  ht.appendChild(el('div','en-t',`Bảng tổng hợp ${FINLABEL.replace(/^\d+ /,NFIN+' ')} · Nạp Anki`));
  add(head,bn,ht); root.appendChild(head);
  const sec=el('section','part'); sec.style.marginTop='28px';
  const tools=el('div','pp-tools'); const inp=el('input'); inp.type='search'; inp.id='pp-search'; inp.placeholder='Tìm cụm từ, paraphrase hoặc nghĩa…'; inp.setAttribute('aria-label','Tìm trong '+FINLABEL);
  const cnt=el('span','score'); add(tools,inp,cnt); sec.appendChild(tools);
  const w=el('div','tbl-w'); const t=el('table'); const th=el('thead'); const tr=el('tr');
  const hdr=finalTable?finalTable.rows[0].map(c=>c.join(' ')):[]; hdr.forEach(x=>tr.appendChild(el('th',null,x))); th.appendChild(tr); t.appendChild(th);
  const tb=el('tbody'); const rows=[];
  (finalTable?finalTable.rows.slice(1):[]).forEach(r=>{ const row=el('tr'); ['n','t','p','m'].forEach((k,i)=>row.appendChild(el('td',k,(r[i]||[]).join(' ')))); tb.appendChild(row); rows.push([row,row.textContent.toLowerCase()]); });
  t.appendChild(tb); w.appendChild(t); sec.appendChild(w);
  const f=()=>{ const q=inp.value.trim().toLowerCase(); let k=0; rows.forEach(([r,tx])=>{ const show=!q||tx.includes(q); r.hidden=!show; if(show)k++; }); cnt.textContent=`${k}/${rows.length} cặp từ`; };
  inp.addEventListener('input',f); f();
  root.appendChild(sec); root.appendChild(pager(TABS.length-1));
  return root;
}

function pager(i){
  const p=el('div','pager');
  if(i>0){ const b=el('button','prev'); b.type='button'; add(b,el('small',null,'← Trước'),el('b',null,`${TABS[i-1].n} · ${TABS[i-1].label}`)); b.onclick=()=>show(TABS[i-1].id,true); p.appendChild(b); }
  if(i<TABS.length-1){ const b=el('button','next'); b.type='button'; add(b,el('small',null,'Tiếp →'),el('b',null,`${TABS[i+1].n} · ${TABS[i+1].label}`)); b.onclick=()=>show(TABS[i+1].id,true); p.appendChild(b); }
  return p;
}

const hero=document.getElementById('hero');
(function(){
  const left=el('div');
  const t0=intro[0]||''; const m=t0.match(/^(.*?):\s*(.*)$/);

  // intro[2] (source/method note) is intentionally not shown
  add(left,eb,h1,el('div','en-sub',intro[1]||''));
  const nq=lessons.reduce((a,L)=>a+L.answers.length,0), nv=lessons.reduce((a,L)=>a+(L.parts.find(p=>p.n===5)?.items.filter(s=>isStr(s)&&/^Ngh(?:ĩa|ia):/.test(s)).length||0),0);
  const st=el('div','stats');
  [[lessons.length,'bài thực hành'],[nq,'câu hỏi ETS gốc'],[nv,'thẻ từ vựng'],[NFIN,FINLABEL.replace(/^\d+ /,'')]].forEach(([v,l])=>{ const s=el('div','stat'); add(s,el('b',null,String(v)),el('span',null,l)); st.appendChild(s); });
  left.appendChild(st);
  const yard=el('div','yard'); yard.setAttribute('aria-label','Chọn nhanh bài học');

    add(b,el('span','code',SHORT[L.n-1]||'BÀI'),el('span','n',String(L.n).padStart(2,'0')),el('span','qr',L.qr)); b.onclick=()=>show('bai'+L.n,true); yard.appendChild(b); });
  add(hero,left,yard);
})();

const tabsEl=document.getElementById('tabs'), main=document.getElementById('main');
const panels={}, tabBtns={};
TABS.forEach((T,i)=>{
  const b=el('button','tab'); b.type='button'; b.setAttribute('role','tab'); b.id='tab-'+T.id; b.setAttribute('aria-controls','panel-'+T.id); b.style.setProperty('--c',T.c);
  const tl=el('span','tl'); add(tl,el('b',null,T.label),el('small',null,T.sub));
  add(b,el('span','door',T.n),tl); b.onclick=()=>show(T.id,false);
  b.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ e.preventDefault(); const j=(i+(e.key==='ArrowRight'?1:-1)+TABS.length)%TABS.length; show(TABS[j].id,false); tabBtns[TABS[j].id].focus(); }});
  tabsEl.appendChild(b); tabBtns[T.id]=b;
  const p=el('section'); p.id='panel-'+T.id; p.setAttribute('role','tabpanel'); p.setAttribute('aria-labelledby','tab-'+T.id); p.hidden=true; main.appendChild(p); panels[T.id]=p;
});

function show(id,scroll){
  if(!panels[id]) id=TABS[0].id;
  const p=panels[id];
  if(!p.firstChild){ if(id==='paraphrase') p.appendChild(renderParaphrase()); else p.appendChild(renderLesson(lessons[+id.replace('bai','')-1])); }
  Object.entries(panels).forEach(([k,v])=>{ v.hidden=k!==id; tabBtns[k].setAttribute('aria-selected',String(k===id)); tabBtns[k].tabIndex=k===id?0:-1; });
  document.querySelectorAll('.box').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  tabBtns[id].scrollIntoView({block:'nearest',inline:'center'});
  try{ history.replaceState(null,'','#'+id); }catch(e){}
  try{ localStorage.setItem('lg-tab',id); }catch(e){}
  if(scroll!==null){ const bar=document.querySelector('.bar'); const y=main.getBoundingClientRect().top+window.scrollY-bar.offsetHeight-8; if(window.scrollY>y||scroll) window.scrollTo({top:y,behavior:'smooth'}); }
}

const mb=document.getElementById('m-both'), mr=document.getElementById('m-recall');
function setMode(r){ document.body.classList.toggle('recall',r); mb.setAttribute('aria-pressed',String(!r)); mr.setAttribute('aria-pressed',String(r)); try{localStorage.setItem('lg-mode',r?'1':'0');}catch(e){} if(!r) document.querySelectorAll('.peek').forEach(x=>x.classList.remove('peek')); }
mb.onclick=()=>setMode(false); mr.onclick=()=>setMode(true);
main.addEventListener('click',e=>{ if(!document.body.classList.contains('recall')) return; const v=e.target.closest('.vi-r'); if(v) v.classList.toggle('peek'); });
try{ if(localStorage.getItem('lg-mode')==='1') setMode(true); }catch(e){}

document.getElementById('foot').textContent='Nguồn: ChuyenDe_TOEIC_HopDong_PhapLy_SLA_BaoHanh.docx';

let start=(location.hash||'').slice(1);
if(!panels[start]){ try{ start=localStorage.getItem('lg-tab')||''; }catch(e){ start=''; } }
show(panels[start]?start:TABS[0].id,null);
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(panels[h]) show(h,true); });
})();
