<title>Hợp đồng, SLA & Pháp lý TOEIC 750+</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: cargo-manifest page. Hero with a 3x3 container stack (one container per lesson), sticky container-tab bar, lesson panel with side index of the 5 parts. */
:root{
  /* Tailwind-style neutrals + one primary (Blue 600) */
  --bg:#F9FAFB; --surface:#FFFFFF; --surface-2:#F3F4F6; --ink:#111827; --muted:#6B7280; --line:#E5E7EB;
  --paper:#FFFFFF;
  /* Coordinated palette: navy = governance/trust, cobalt = primary, magenta = errors,
     emerald = correct, ochre = clues & timing, Viettel red = brand marks, xanh mạ = outputs & chips */
  --navy:#102B66; --navy-2:#183B7E; --navy-ink:#102B66;
  --cobalt:#1E62D0; --cobalt-2:#2A7BE8;
  --magenta:#D71A4A; --magenta-2:#E52E5E;
  --emerald:#0A8558; --emerald-2:#12A16E;
  --ochre:#D87D0E; --ochre-2:#E8901C; --ochre-soft:#FDF1E1;
  --brand:var(--cobalt); --brand-soft:#DCE8FB; --vi:var(--navy-2);
  --red:#EE0033; --red-soft:#FFE4EA; --green:#5FA61B; --green-soft:#EAF6DC;
  --ok:var(--emerald); --bad:var(--magenta); --coral:var(--red); --coral-soft:var(--red-soft);
  --c1:var(--brand); --c2:var(--brand); --c3:var(--brand); --c4:var(--brand); --c5:var(--brand); --c6:var(--brand); --c7:var(--brand); --c8:var(--brand); --c9:var(--brand); --c10:var(--brand);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --shadow:0 1px 2px rgba(17,24,39,.05),0 6px 20px -8px rgba(17,24,39,.15);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#030712; --surface:#111827; --surface-2:#0B1120; --ink:#F9FAFB; --muted:#9CA3AF; --line:#1F2937;
  --vi:#9DBDF5; --paper:#111827; --navy-ink:#C9D7F4;
  --brand:var(--cobalt-2); --brand-soft:#132A55; --ochre-soft:#33220B;
  --ok:var(--emerald-2); --bad:var(--magenta-2);
  --red:#FF3B5F; --red-soft:#3B0A16; --green:#8BCF45; --green-soft:#1C2E0E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#030712; --surface:#111827; --surface-2:#0B1120; --ink:#F9FAFB; --muted:#9CA3AF; --line:#1F2937;
  --vi:#9DBDF5; --paper:#111827; --navy-ink:#C9D7F4;
  --brand:var(--cobalt-2); --brand-soft:#132A55; --ochre-soft:#33220B;
  --ok:var(--emerald-2); --bad:var(--magenta-2);
  --red:#FF3B5F; --red-soft:#3B0A16; --green:#8BCF45; --green-soft:#1C2E0E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{display:none}
.wrap{max-width:min(1600px,96vw);width:100%;margin:0 auto;padding-left:clamp(16px,2.5vw,40px);padding-right:clamp(16px,2.5vw,40px)}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--c) 70%,transparent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono)}

/* ---------- Hero ---------- */
.hero{padding-block:clamp(20px,3vw,36px);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.05fr);gap:clamp(20px,3vw,44px);align-items:center}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow b{color:var(--coral);font-weight:500}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3.2vw,44px);line-height:1.15;letter-spacing:-.01em;text-transform:uppercase;margin-top:10px;text-wrap:balance;word-break:break-word}
.hero h1 span{color:var(--red)}
.hero .en-sub{font-family:var(--f-display);font-weight:600;font-size:clamp(14px,1.5vw,18px);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.hero .desc{max-width:62ch;margin-top:16px;color:var(--muted);font-size:15px}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:24px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}

.yard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:620px;justify-self:end;width:100%}
.box{position:relative;min-height:76px;height:auto;aspect-ratio:auto;max-width:100%;border:1px solid var(--line);border-radius:12px;cursor:pointer;color:var(--ink);text-align:left;padding:8px 10px;background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;gap:4px;transition:transform .18s ease,background .18s,border-color .18s,box-shadow .18s}
.box:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 8px 20px -10px color-mix(in srgb,var(--brand) 60%,transparent)}
.box .n{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--brand)}
.box .qr{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.box .code{font-size:11.5px;font-weight:600;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;line-height:1.25;word-break:break-word}
.box.on{background:var(--brand);border-color:var(--brand);color:#fff}
.box.on .n,.box.on .qr,.box.on .code{color:#fff}
.box.alt .n{color:var(--coral)}

/* navy governance band behind the hero */
.hero-band{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff}
.hero-band .eyebrow{color:rgba(255,255,255,.7)}
.hero-band .eyebrow b{color:var(--ochre-2)}
.hero-band h1 span{color:var(--magenta-2)}
.hero-band .en-sub,.hero-band .desc,.hero-band .stat span{color:rgba(255,255,255,.74)}
.hero-band .stat b{color:#fff}
.hero-band .box{border-color:transparent}
.hero-band .box.on{background:var(--cobalt-2);border-color:#fff}

/* ---------- Tab bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-block:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:12px;padding-block:10px}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;flex:1;min-width:0;padding-bottom:2px;scroll-behavior:smooth}
.tab{--c:var(--c1);flex:0 0 auto;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 16px 5px 5px;cursor:pointer;text-align:left;transition:background .15s,border-color .15s}
.tab:hover{border-color:var(--c)}
.tab .door{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--c);font-family:var(--f-display);font-weight:800;font-size:16px;
  background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.tab .tl{display:flex;flex-direction:column;line-height:1.2}
.tab .tl b{font-size:13px;font-weight:600;white-space:nowrap}
.tab .tl small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#fff}
.tab[aria-selected="true"] .door{background:rgba(255,255,255,.22);color:#fff}
.tab[aria-selected="true"] .tl small{color:rgba(255,255,255,.82)}
.mode{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:0 0 auto;background:var(--surface-2)}
.mode button{border:0;background:none;padding:6px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--navy);color:#fff}

/* ---------- Lesson ---------- */
main{padding-block:28px 64px}
.lesson-head{--c:var(--c1);display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start;padding-bottom:24px;border-bottom:2px solid var(--navy-ink)}
.big-n{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,10vw,120px);line-height:.8;color:var(--c);letter-spacing:-.02em}
.big-n small{display:block;font-size:14px;letter-spacing:.2em;color:var(--muted);font-weight:600;margin-bottom:8px}
.lesson-head h2{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3.2vw,38px);line-height:1.05;text-transform:uppercase;color:var(--navy-ink)}
.lesson-head .en-t{font-family:var(--f-display);font-weight:600;font-size:clamp(15px,1.7vw,19px);color:var(--c);letter-spacing:.04em;margin-top:8px;text-transform:uppercase}
.src{display:inline-flex;gap:8px;align-items:center;margin-top:14px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.src b{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--c);letter-spacing:.06em}

.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:36px;margin-top:28px}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 82px);align-self:start;display:flex;flex-direction:column;gap:2px}
.toc a{display:flex;gap:10px;align-items:baseline;text-decoration:none;color:var(--muted);font-size:13.5px;padding:7px 10px;border-radius:6px;line-height:1.3}
.toc a b{font-family:var(--f-display);font-size:17px;color:var(--c);min-width:18px}
.toc a:hover,.toc a.on{background:var(--surface);color:var(--ink)}
.toc .toc-sub{padding-left:38px;font-size:12.5px}
.content{min-width:0;display:flex;flex-direction:column;gap:44px}

.part{display:flex;flex-direction:column;gap:22px;scroll-margin-top:96px}
.part-h{display:flex;gap:14px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px}
.part-h .pn{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.14em;color:#fff;background:var(--red);padding:3px 9px;border-radius:4px;white-space:nowrap}
.part-h h3{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.4vw,26px);text-transform:uppercase;line-height:1.1;color:var(--navy-ink)}
.sub{display:flex;flex-direction:column;gap:14px;scroll-margin-top:96px}
.sub-h{display:flex;gap:10px;align-items:baseline;font-weight:700;font-size:17px}
.sub-h .sn{font-family:var(--f-mono);font-size:12px;color:var(--c);font-weight:500}

/* strategy */
.strat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.strat-t{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;color:var(--c);text-transform:uppercase;line-height:1.5}
.steps{display:grid;gap:12px;counter-reset:s}
.step{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:start}
.step .when{font-family:var(--f-mono);font-size:11.5px;display:flex;flex-direction:column;gap:2px;border-right:2px solid var(--ochre);padding-right:10px}
.step .when span{color:var(--ochre)!important;font-weight:500}
.step .when b{font-family:var(--f-display);font-size:18px;font-weight:700;color:var(--ink)}
.step .when span{color:var(--muted)}
.step h5{margin:0 0 3px;font-size:14.5px;font-weight:700}
.step p{font-size:14.5px;color:var(--ink)}

/* passages = papers */
.papers{display:flex;flex-direction:column;gap:18px}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:22px 24px;display:flex;flex-direction:column;gap:9px;font-size:15px;position:relative}
.paper-tag{align-self:flex-start;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:3px;padding:2px 8px;margin-bottom:4px}
.ln-caps{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.04em;line-height:1.2}
.ln-kv{font-size:14px}
.ln-kv b{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted);margin-right:4px}
.ln-bul{padding-left:16px;position:relative}
.ln-bul::before{content:"";position:absolute;left:2px;top:.7em;width:6px;height:6px;background:var(--c);border-radius:1px}
.ln-sec{font-weight:700;margin-top:6px}
.ln-head{font-weight:700;margin-top:8px;color:var(--navy-ink)}
.ln-num{padding:2px 0 2px 14px;border-left:2px solid var(--brand);margin-left:2px}
.ln-num b{color:var(--brand)}
.ln-concl{background:var(--brand-soft);border-radius:6px;padding:8px 12px;font-size:14px}
.ln-concl b{color:var(--brand)}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:16px}
.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.score{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.score b{color:var(--ink);font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--c)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.q-stem{display:flex;gap:12px;font-weight:600}
.q-no{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--c);line-height:1.2;flex:0 0 auto}
.q-extra{font-style:italic;font-weight:400;color:var(--muted);margin-top:4px}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:8px 12px;cursor:pointer;font-size:14.5px;line-height:1.45;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--c)}
.opt .k{font-family:var(--f-mono);font-weight:500;font-size:13px;color:var(--c);flex:0 0 auto;margin-top:1px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surface))}
.opt.ok .k{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--surface))}
.opt.bad .k{color:var(--bad)}
.q-fb{font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.q-fb .r{font-weight:600}
.q-fb .r.ok{color:var(--ok)} .q-fb .r.bad{color:var(--bad)}
.q-fb a{color:var(--c)}

/* bilingual */
.bi-doc{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;color:var(--c);text-transform:uppercase;padding:10px 0 2px;border-top:1px dashed var(--line);margin-top:6px;line-height:1.5}
.bi-doc:first-child{border-top:0;margin-top:0;padding-top:0}
.bi{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--line)}
.pair:first-child{border-top:0}
.pair>div{padding:11px 16px;display:flex;flex-direction:column;gap:4px;font-size:14.5px;min-width:0}
.pair .en{color:var(--ink)}
.pair .vi{color:var(--vi);background:color-mix(in srgb,var(--vi) 5%,transparent);border-left:1px solid var(--line)}
.lang{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--muted);opacity:.8}
.bi-head{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-bottom:1px solid var(--line)}
.bi-head span{padding:7px 16px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted)}
.bi-head span+span{border-left:1px solid var(--line);color:var(--vi)}

.vi-t{color:var(--vi)}
/* recall mode blurs translations */
.recall .vi-r{filter:blur(6px);cursor:pointer;user-select:none;transition:filter .2s}
.recall .vi-r.peek{filter:none;user-select:auto}

/* question translation */
.qt{display:grid;gap:12px}
.qt-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.qt-card .stem{display:flex;gap:12px}
.qt-card .stem>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.qt-card .stem b{font-weight:600}
.qt-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;padding-left:44px}
.qt-opt{display:flex;gap:8px;font-size:14px;line-height:1.45}
.qt-opt>div{display:flex;flex-direction:column;min-width:0}
.qt-opt .k{font-family:var(--f-mono);color:var(--c);font-size:12.5px;margin-top:1px}
.qt-opt.correct .k{color:#fff;background:var(--ok);border-radius:3px;padding:0 4px;height:fit-content}

/* summary */
.sum{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.sum>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;font-size:14.5px;display:flex;flex-direction:column;gap:8px}
.ideas{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.ideas li{position:relative;padding-left:18px}
.ideas>li::before{content:"";position:absolute;left:3px;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--brand)}
.ideas ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.ideas ul li::before{content:"";position:absolute;left:4px;top:.75em;width:7px;height:1.5px;background:var(--muted)}

/* matrix */
.matrix{display:grid;gap:12px}
.mx{display:grid;grid-template-columns:200px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mx-l{padding:16px;background:color-mix(in srgb,var(--c) 9%,var(--surface));display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line)}
.mx-l .i{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--c)}
.mx-l b{font-size:14.5px;line-height:1.35}
.mx-l small{font-size:12.5px;color:var(--muted);line-height:1.35}
.mx-r{padding:14px 18px;display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.mx-r p{display:flex;gap:10px}
.mx-r .lang{flex:0 0 22px;margin-top:4px}

/* answers */
.ans{display:grid;gap:12px}
.an{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:100px}
.an.flash{animation:flash 1.4s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--c)}100%{box-shadow:0 0 0 0 transparent}}
.an-h{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.an-h .no{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--c)}
.an-h .key{font-family:var(--f-mono);font-weight:500;background:var(--ok);color:#fff;border-radius:4px;padding:1px 8px;font-size:13px}
.an-h .t{font-weight:600}
.trace{font-size:14px;border-left:3px solid var(--ochre);background:var(--ochre-soft);padding:9px 12px;border-radius:0 6px 6px 0;font-style:italic}
.trace .lbl{color:var(--ochre)}
.lbl{font-family:var(--f-mono);font-style:normal;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);display:block;margin-bottom:2px}
.expl{font-size:14.5px}
.an-stem{font-size:14px;color:var(--muted);margin-top:-4px}
.para{display:flex;flex-direction:column;gap:6px;font-size:14px}
.para .pr{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:start;background:var(--green-soft);border-radius:6px;padding:7px 10px}

.ln-sub{padding-left:30px;position:relative;font-size:14px}

/* workflow */
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;position:relative}

.fstep:not(:last-child)::after{content:"";position:absolute;right:-12px;top:30px;width:10px;height:10px;border-top:2px solid var(--c);border-right:2px solid var(--c);transform:rotate(45deg);z-index:1}
.fstep h5{margin:0;font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.15;text-transform:uppercase}

.fkv{font-size:13.5px;display:flex;flex-direction:column;gap:1px}

/* vocab */

.vc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:9px}

.chip{font-size:12.5px;border:1px solid color-mix(in srgb,var(--green) 45%,var(--line));color:var(--ink);border-radius:999px;padding:1px 9px;background:var(--green-soft)}

.vc .mean{font-size:14px;font-weight:500}

/* 50 pairs */
.pp-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pp-tools input{flex:1;min-width:0;max-width:420px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;font:inherit;font-size:14.5px;color:var(--ink)}

td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:8px;flex-wrap:wrap}

0% to 99.49%: 25% Service Credit","- Uptime below 99.0%: 50% Service Credit","4.4 Claim Submission Procedure: To receive a Service Credit, Customer must open a formal billing ticket via the Apex Support Portal within thirty (30) calendar days following the end of the month in which the incident occurred, attaching server timestamp logs documenting the outage.","[Passage 2: Cloud Infrastructure Monitoring & Incident Report]","Document 2: Cloud Infrastructure Monitoring & Incident Report","FinSecure Commercial Banking Group - Infrastructure Operations","Incident Report: Month of October","Target Environment: Production VPC Cluster (Dublin Regional Data Center)","Contracted Service Plan: Apex Enterprise Dedicated Tier ($25,000 / month)","Total Operational Time in October: 31 days (44,640 minutes / 744 hours)","Recorded Outage Summary:","- Incident #1 (October 14, 09:15 - 13:30 UTC): Core Switch firmware malfunction resulted in gateway packet drop. Total downtime: 255 minutes.","- Incident #2 (October 22, 14:00 - 18:30 UTC): Asynchronous storage replication deadlock halted database transactions across primary banking nodes. Total downtime: 270 minutes.","Monthly Performance Summary:","- Total Unscheduled Downtime: 525 minutes (8 hours 45 minutes)","- Total Scheduled Maintenance: 180 minutes (Pre-approved on October 6)","- Calculated Monthly Uptime Percentage: 98.82%","Impact: Online customer transaction processing was suspended for 4.25 hours during business hours on Oct 14, and mobile banking authentication failed for 4.5 hours on Oct 22.","[Passage 3: E-mail]","Document 3: E-mail","To: Marcus Vance <m.vance@apexcloud.com>","From: Sarah Lin <s.lin@finsecurebank.com>","Date: November 8","Subject: Formal SLA Penalty Claim - October Outages & Corrective Action Request","Dear Mr. Vance,","I am writing on behalf of FinSecure Commercial Banking Group to formally lodge a Service Credit claim regarding the extensive service disruptions experienced by our core banking systems during the month of October.","As detailed in the attached monitoring log generated by our network operations center, our production VPC cluster sustained 525 minutes of unscheduled downtime. With an uptime rating of 98.82%, Apex Cloud Platform fell significantly below the guaranteed 99.9% baseline established in Section 4.1 of our Master Service Agreement.","Pursuant to Section 4.3, this level of availability entitles FinSecure to the maximum 50% credit tier, amounting to $12,500. Please ensure this credit is applied as an itemized deduction on our upcoming November billing statement.","Furthermore, given the sensitivity of our online banking operations and strict financial regulatory standards, we request an executive briefing with your engineering team before November 20 to review your Corrective and Preventive Action (CAPA) plan.","Sincerely,","Sarah Lin","Chief Information Officer","FinSecure Commercial Banking Group","[ORIGINAL ETS QUESTIONS - CAU HOI TIENG ANH GOC]:","186. What is indicated in Section 4 of the Service Level Agreement?","(A) Provider will pay cash refunds directly into customer bank accounts.","(B) Maintenance conducted during Sunday early mornings is excluded from downtime calculations.","(C) Customers must submit outage claims within seven business days of an incident.","(D) Service credits are automatically applied without requiring a formal ticket.","187. According to the monitoring report, what caused the outage on October 14?","(A) A database deadlock during storage replication","(B) A power outage at the Dublin regional facility","(C) A hardware failure in a primary network switch","(D) An unauthorized cybersecurity breach","188. What tier of service credit does FinSecure qualify for based on October's performance?","(A) 10%","(B) 25%","(C) 50%","(D) 100%","189. In the e-mail, what does Ms. Lin ask Mr. Vance to do by November 20?","(A) Transfer $12,500 via international wire transfer","(B) Meet with bank leadership to discuss preventive technical measures","(C) Terminate the multi-year cloud hosting contract","(D) Upgrade FinSecure's account to a dedicated cluster at no extra charge","190. What can be inferred about Ms. Lin's claim submission?","(A) It was submitted after the contractual deadline had expired.","(B) It satisfied the 30-day filing deadline outlined in the agreement.","(C) It was rejected because timestamp logs were missing.","(D) It required approval from the central banking regulatory commission.","1.2. 1.2. Hướng dẫn làm bài Part 7: Chiến lược 5 phút tối ưu, Ghép nối Dữ kiện & Tóm tắt Feynman","[5-MINUTE STRATEGY GUIDE - CHIEN THUAT 5 PHUT]:","CHIẾN LƯỢC 5 PHÚT TỐI ƯU PART 7 (ÁP DỤNG BÀI ĐỌC BA VĂN BẢN HỢP ĐỒNG & SLA):","Bước 1 (30 giây) - Nắm bắt Bối cảnh & Luồng sự việc (Quỹ đạo chữ Z & 3 Câu hỏi Tiềm thức):","• Quét VB1: Điều khoản SLA của Apex Cloud Platform -> Nhận diện bảng khấu trừ Service Credit (Uptime dưới 99% được giảm 50% cước phí; hạn gửi Claim 30 ngày).","• Quét VB2: Báo cáo kỹ thuật của khách hàng FinSecure Bank -> Tháng 10 bị 2 vụ downtime (255 phút + 270 phút = 525 phút) -> Uptime thực tế đạt 98.82%.","• Quét VB3: Email của Giám đốc CNTT (Sarah Lin) gửi Apex Cloud ngày 8/11 -> Đòi giảm 50% cước ($12,500) vào hóa đơn tháng 11 và yêu cầu họp giải trình kế hoạch CAPA trước 20/11.","Bước 2 (20 giây) - Quét 5 Câu hỏi & Gắn Móc Từ khóa:","• Câu 186: Mục đích/Quy định VB1 (Section 4 SLA -> Scheduled maintenance).","• Câu 187: Chi tiết kỹ thuật ngày 14/10 (Incident #1 -> Core switch).","• Câu 188: Ghép nối Uptime tháng 10 (98.82% ở VB2) với Biểu phí khấu trừ ở VB1 -> Tỷ lệ 50%.","• Câu 189: Hành động trước 20/11 trong Email (VB3 -> executive briefing to review CAPA plan).","• Câu 190: Suy luận về thời hạn nộp Claim (VB1 quy định trong 30 ngày sau tháng sự cố; sự cố tháng 10 nộp ngày 8/11 là hoàn toàn hợp lệ).","Bước 3 (3 phút 45 giây) - Giải quyết Cuốn chiếu & Dấu vết Tìm nhanh:","• Câu 186 (Chi tiết đơn lẻ): Quét mục 4.2 VB1 thấy 'Scheduled maintenance... between 01:00 and 04:00 UTC on Sundays, shall not count toward Downtime' -> Khớp ngay đáp án (B).","• Câu 187 (Chi tiết đơn lẻ): Quét ngày 'October 14' ở VB2 thấy 'Core Switch firmware malfunction resulted in gateway packet drop' -> 'hardware failure in a primary network switch' -> Chọn (C).","• Câu 188 (Ghép nối 2 văn bản): VB2 ghi 'Monthly Uptime: 98.82%'. So vào VB1 mục 4.3: 'Uptime below 99.0%: 50% Service Credit' -> Khớp ngay mức 50% -> Chọn (C).","• Câu 189 (Chi tiết Email): VB3 đoạn cuối: 'we request an executive briefing with your engineering team before November 20 to review your Corrective and Preventive Action (CAPA) plan' -> 'meet with bank leadership to discuss preventive technical measures' -> Chọn (B).","• Câu 190 (Ghép nối thời hạn): VB1 mục 4.4 yêu cầu nộp 'within thirty (30) calendar days following the end of the month'. Tháng 10 kết thúc 31/10, hạn nộp là 30/11. Email gửi 08/11 -> Đáp ứng đúng thời hạn 30 ngày -> Chọn (B).","Bước 4 (25 giây) - Khóa sổ Đáp án & Tóm tắt Feynman 1 câu:","• Rà soát khóa đáp án: 186-B, 187-C, 188-C, 189-B, 190-B.","• Đúc kết Feynman: 'Nhà cung cấp đám mây làm sập mạng 2 lần khiến tỷ lệ uptime rớt xuống 98.82%, ngân hàng kích hoạt điều khoản hợp đồng SLA đòi giảm nửa tiền cước tháng 11 ($12,500) và bắt họp giải trình trước ngày 20/11.'","1.3. 1.3. Bản dịch Song ngữ Từng câu (Sentence-by-Sentence Translation)","[SENTENCE-BY-SENTENCE BILINGUAL TRANSLATION - BAN DICH SONG NGU TUNG CAU]:","[Văn bản 1: Thỏa thuận Hợp đồng Dịch vụ Khung (MSA) - Phụ lục B: Cam kết Chất lượng Dịch vụ (SLA)]","Document 1: Master Service Agreement (MSA) - Schedule B: Service Level Agreement (SLA)","Apex Cloud Platform Services","Văn bản 1: Hợp đồng Cung cấp Dịch vụ Khung (MSA) - Phụ lục B: Thỏa thuận Mức Dịch vụ (SLA)","Dịch vụ Nền tảng Đám mây Apex Cloud","Section 4: System Availability and Service Credit Schedule.","Điều khoản 4: Biểu Cam kết Độ Khả dụng Hệ thống và Khấu trừ Cước Dịch vụ.","4.1 Uptime Guarantee: Apex Cloud Platform (\"Provider\") commits to maintaining an Monthly Uptime Percentage of at least 99.9% across all production Virtual Private Cloud (VPC) clusters during each calendar billing cycle.","4.1 Cam kết Thời gian Hoạt động Thông suốt: Apex Cloud Platform (\"Bên Cung cấp\") cam kết duy trì Tỷ lệ Hoạt động Hàng tháng đạt tối thiểu 99.9% trên toàn bộ các cụm Đám mây Riêng Ảo (VPC) môi trường vận hành chính thức trong mỗi chu kỳ cước theo tháng dương lịch.","4.2 Calculation of Uptime: Monthly Uptime Percentage is calculated as follows: Monthly Uptime % = [(Total Minutes in Month - Unscheduled Downtime Minutes) / Total Minutes in Month] * 100.","4.2 Phương thức Tính toán Thời gian Thông suốt: Tỷ lệ Hoạt động Hàng tháng được tính theo công thức: % Hoạt động Tháng = [(Tổng số Phút trong Tháng - Số Phút Ngừng Hoạt động Ngoài Kế hoạch) / Tổng số Phút trong Tháng] * 100.","Scheduled maintenance windows, announced at least 72 hours in advance and executed between 01:00 and 04:00 UTC on Sundays, shall not count toward Downtime.","Các khung thời gian bảo trì định kỳ theo kế hoạch, nếu được thông báo trước ít nhất 72 giờ và thực hiện trong khoảng từ 01:00 đến 04:00 giờ chuẩn quốc tế (UTC) vào các ngày Chủ nhật, sẽ không bị tính vào Thời gian Ngừng hoạt động.","4.3 Service Credit Tiers: If Provider fails to meet the guaranteed threshold in any calendar month, Customer shall be entitled to request a financial credit against its subsequent monthly recurring service fee: Uptime 99.5% to 99.89%: 10% Service Credit; Uptime 99.0% to 99.49%: 25% Service Credit; Uptime below 99.0%: 50% Service Credit.","4.3 Các Bậc Khấu trừ Giảm Cước Phạt: Nếu Bên Cung cấp không đạt ngưỡng cam kết trong bất kỳ tháng dương lịch nào, Khách hàng có quyền yêu cầu khoản giảm trừ cước tài chính cấn trừ vào phí dịch vụ định kỳ hàng tháng của kỳ tiếp theo: Thời gian thông suốt từ 99.5% đến 99.89%: Giảm 10% cước; từ 99.0% đến 99.49%: Giảm 25% cước; dưới 99.0%: Giảm 50% cước dịch vụ.","4.4 Claim Submission Procedure: To receive a Service Credit, Customer must open a formal billing ticket via the Apex Support Portal within thirty (30) calendar days following the end of the month in which the incident occurred, attaching server timestamp logs documenting the outage.","4.4 Quy trình Nộp Hồ sơ Khiếu nại Cước: Để được nhận khoản Giảm trừ Cước Phạt, Khách hàng phải mở một phiếu yêu cầu thanh toán chính thức qua Cổng Hỗ trợ Apex trong vòng ba mươi (30) ngày dương lịch kể từ ngày kết thúc tháng xảy ra sự cố, đính kèm nhật ký dấu thời gian máy chủ chứng minh sự cố gián đoạn.","[Văn bản 2: Báo cáo Giám sát Hạ tầng & Nhật ký Sự cố Gián đoạn Hệ thống]","Document 2: Cloud Infrastructure Monitoring & Incident Report","FinSecure Commercial Banking Group - Infrastructure Operations","Văn bản 2: Báo cáo Giám sát Hạ tầng Đám mây & Nhật ký Sự cố Gián đoạn","Khối Vận hành Hạ tầng - Tập đoàn Ngân hàng Thương mại FinSecure","Incident Report: Month of October. Target Environment: Production VPC Cluster (Dublin Regional Data Center).","Báo cáo Sự cố: Tháng 10. Môi trường Mục tiêu: Cụm VPC Môi trường Vận hành Chính thức (Trung tâm Dữ liệu Vùng Dublin).","Contracted Service Plan: Apex Enterprise Dedicated Tier ($25,000 / month). Total Operational Time in October: 31 days (44,640 minutes / 744 hours).","Gói Dịch vụ Theo Hợp đồng: Gói Doanh nghiệp Chuyên dụng Apex Enterprise Dedicated ($25,000 / tháng). Tổng thời gian vận hành trong tháng 10: 31 ngày (44,640 phút / 744 giờ).","Incident #1 (October 14, 09:15 - 13:30 UTC): Core Switch firmware malfunction resulted in gateway packet drop. Total downtime: 255 minutes.","Sự cố #1 (Ngày 14 tháng 10, 09:15 - 13:30 UTC): Lỗi phần mềm vi điều khiển (firmware) của Thiết bị Chuyển mạch Lõi dẫn đến rớt gói tin tại cổng kết nối. Tổng thời gian ngừng hoạt động: 255 phút.","Incident #2 (October 22, 14:00 - 18:30 UTC): Asynchronous storage replication deadlock halted database transactions across primary banking nodes. Total downtime: 270 minutes.","Sự cố #2 (Ngày 22 tháng 10, 14:00 - 18:30 UTC): Xung đột tắc nghẽn (deadlock) trong quá trình nhân bản dữ liệu lưu trữ bất đồng bộ đã làm đình trệ toàn bộ giao dịch cơ sở dữ liệu trên các nút máy chủ ngân hàng chính. Tổng thời gian ngừng hoạt động: 270 phút.","Monthly Performance Summary: Total Unscheduled Downtime: 525 minutes (8 hours 45 minutes). Total Scheduled Maintenance: 180 minutes (Pre-approved on October 6). Calculated Monthly Uptime Percentage: 98.82%.","Tổng kết Hiệu năng Tháng: Tổng thời gian ngừng hoạt động ngoài kế hoạch: 525 phút (8 giờ 45 phút). Tổng thời gian bảo trì theo kế hoạch: 180 phút (Đã được phê duyệt trước vào ngày 6 tháng 10). Tỷ lệ Hoạt động Tháng được tính toán: 98.82%.","Impact: Online customer transaction processing was suspended for 4.25 hours during business hours on Oct 14, and mobile banking authentication failed for 4.5 hours on Oct 22.","Tác động Nghiệp vụ: Tiến trình xử lý giao dịch trực tuyến của khách hàng bị đình chỉ trong 4.25 giờ vào khung giờ hành chính ngày 14/10, và tiến trình xác thực ngân hàng di động bị tê liệt trong 4.5 giờ ngày 22/10.","[Văn bản 3: Thư điện tử Yêu cầu Giảm trừ Cước Phạt SLA & Báo cáo Khắc phục]","Document 3: E-mail","To: Marcus Vance <m.vance@apexcloud.com>","From: Sarah Lin <s.lin@finsecurebank.com>","Date: November 8","Subject: Formal SLA Penalty Claim - October Outages & Corrective Action Request","Văn bản 3: Thư điện tử","Người nhận: Marcus Vance <m.vance@apexcloud.com>","Người gửi: Sarah Lin <s.lin@finsecurebank.com>","Ngày: Ngày 8 tháng 11","Tiêu đề: Yêu cầu Chính thức về Phạt Vi phạm Cam kết SLA - Sự cố Gián đoạn Tháng 10 & Đề nghị Kế hoạch Khắc phục","Dear Mr. Vance, I am writing on behalf of FinSecure Commercial Banking Group to formally lodge a Service Credit claim regarding the extensive service disruptions experienced by our core banking systems during the month of October.","Kính gửi Ông Vance, Tôi thay mặt Tập đoàn Ngân hàng Thương mại FinSecure gửi thư này để chính thức nộp yêu cầu Giảm trừ Cước Phạt Dịch vụ liên quan đến các sự cố gián đoạn dịch vụ nghiêm trọng mà hệ thống ngân hàng lõi của chúng tôi đã gánh chịu trong tháng 10.","As detailed in the attached monitoring log generated by our network operations center, our production VPC cluster sustained 525 minutes of unscheduled downtime.","Như được nêu chi tiết trong nhật ký giám sát đính kèm do trung tâm vận hành mạng của chúng tôi xuất ra, cụm VPC môi trường vận hành thực tế của chúng tôi đã phải chịu 525 phút ngừng hoạt động ngoài kế hoạch.","With an uptime rating of 98.82%, Apex Cloud Platform fell significantly below the guaranteed 99.9% baseline established in Section 4.1 of our Master Service Agreement.","Với tỷ lệ thời gian hoạt động chỉ đạt 98.82%, Apex Cloud Platform đã rớt xuống thấp hơn đáng kể so với mức sàn cam kết 99.9% được quy định tại Khoản 4.1 trong Hợp đồng Cung cấp Dịch vụ Khung của chúng ta.","Pursuant to Section 4.3, this level of availability entitles FinSecure to the maximum 50% credit tier, amounting to $12,500.","Căn cứ theo Khoản 4.3, mức độ sẵn sàng thực tế này cho phép FinSecure được hưởng mức giảm cước tối đa là 50%, tương đương với số tiền $12,500.","Please ensure this credit is applied as an itemized deduction on our upcoming November billing statement.","Xin vui lòng đảm bảo khoản giảm trừ này được hạch toán thành một dòng khấu trừ riêng biệt trên bảng kê cước tháng 11 sắp tới của chúng tôi.","Furthermore, given the sensitivity of our online banking operations and strict financial regulatory standards, we request an executive briefing with your engineering team before November 20 to review your Corrective and Preventive Action (CAPA) plan.","Hơn nữa, xét đến tính chất nhạy cảm của các hoạt động ngân hàng trực tuyến và các tiêu chuẩn khắt khe của cơ quan quản lý tài chính, chúng tôi yêu cầu một cuộc họp giao ban cấp điều hành với đội ngũ kỹ sư của quý công ty trước ngày 20 tháng 11 để xem xét kế hoạch Khắc phục và Phòng ngừa Sự cố (CAPA).","Sincerely, Sarah Lin, Chief Information Officer, FinSecure Commercial Banking Group.","Trân trọng, Sarah Lin, Giám đốc Công nghệ Thông tin (CIO), Tập đoàn Ngân hàng Thương mại FinSecure.","1.4. 1.4. Dịch chi tiết Câu hỏi & Phương án Trắc nghiệm","[TRANSLATED QUESTIONS & OPTIONS - CAU HOI VA DAP AN DICH NGHIA]:","Câu 186. Điều gì được chỉ ra trong Điều khoản 4 của Thỏa thuận Mức Dịch vụ (SLA)?","(A) Nhà cung cấp sẽ hoàn trả tiền mặt trực tiếp vào tài khoản ngân hàng của khách hàng.","(B) Việc bảo trì được thực hiện vào sáng sớm Chủ nhật sẽ không bị tính vào thời gian ngừng hoạt động.","(C) Khách hàng phải nộp khiếu nại bồi thường sự cố trong vòng bảy ngày làm việc kể từ khi phát sinh.","(D) Các khoản giảm trừ cước phạt được tự động khấu trừ mà không cần mở phiếu yêu cầu.","Câu 187. Theo báo cáo giám sát hạ tầng, nguyên nhân gây ra sự cố ngày 14 tháng 10 là gì?","(A) Sự cố tắc nghẽn cơ sở dữ liệu trong quá trình nhân bản vùng lưu trữ.","(B) Mất điện lưới tại trung tâm dữ liệu vùng Dublin.","(C) Sự cố hỏng hóc phần cứng/firmware ở thiết bị chuyển mạch mạng chính.","(D) Một cuộc tấn công mạng xâm nhập trái phép.","Câu 188. FinSecure đủ điều kiện hưởng mức giảm cước dịch vụ nào căn cứ trên kết quả vận hành tháng 10?","(A) 10%","(B) 25%","(C) 50%","(D) 100%","Câu 189. Trong thư điện tử, bà Lin yêu cầu ông Vance thực hiện việc gì trước ngày 20 tháng 11?","(A) Chuyển khoản $12,500 qua điện chuyển tiền quốc tế.","(B) Họp với ban lãnh đạo ngân hàng để thảo luận về các biện pháp kỹ thuật phòng ngừa.","(C) Chấm dứt hợp đồng thuê dịch vụ lưu trữ đám mây nhiều năm.","(D) Nâng cấp tài khoản của FinSecure lên cụm chuyên dụng mà không tính thêm phí.","Câu 190. Có thể suy luận được điều gì về hồ sơ khiếu nại của bà Lin?","(A) Hồ sơ được nộp sau khi thời hạn hợp đồng quy định đã hết hiệu lực.","(B) Hồ sơ đã tuân thủ đúng thời hạn nộp 30 ngày được nêu trong thỏa thuận.","(C) Hồ sơ bị từ chối do thiếu các tệp nhật ký ghi dấu thời gian.","(D) Hồ sơ bắt buộc phải có sự phê chuẩn từ ủy ban quản lý ngân hàng trung ương.","1.5. 1.5. Tóm tắt Viết lại Toàn bài theo Feynman (Feynman Monograph Summary)","[EXECUTIVE SUMMARY & CORE LOGIC - BAN TOM TAT COT LOI]:","English Executive Summary:","• Baseline Agreement & SLA Penalties: Apex Cloud Platform contractually guarantees a minimum monthly uptime of 99.9%, establishing tiered service fee deductions (up to 50% for availability under 99.0%) claimable within 30 days after month-end with log evidence.","• Operational Outage & Impact: In October, FinSecure Bank suffered two major production incidents (core switch firmware malfunction and asynchronous replication deadlock), accumulating 525 minutes of unscheduled downtime and reducing availability to 98.82%.","• Contractual Remedy & Enforcement: CIO Sarah Lin formally filed a timely claim on November 8 demanding the maximum 50% credit ($12,500 deduction on November billing) and mandated an executive CAPA engineering review before November 20.","Bản tóm tắt Tiếng Việt cốt lõi:","• Thỏa thuận Cơ sở & Chế tài Phạt Vi phạm SLA: Apex Cloud Platform cam kết duy trì độ sẵn sàng máy chủ tối thiểu 99.9%, quy định các bậc phạt giảm trừ cước (tối đa giảm 50% nếu uptime dưới 99.0%), yêu cầu nộp hồ sơ chứng minh trong vòng 30 ngày kể từ cuối tháng phát sinh sự cố.","• Sự cố Gián đoạn Thực tế & Hậu quả Vận hành: Trong tháng 10, Ngân hàng FinSecure bị gián đoạn hệ thống 2 lần (do lỗi phần mềm thiết bị chuyển mạch lõi và lỗi nghẽn nhân bản dữ liệu), tổng thời gian downtime là 525 phút khiến độ sẵn sàng rớt xuống 98.82%.","• Kích hoạt Quyền Pháp lý & Biện pháp Khắc phục: Giám đốc CNTT Sarah Lin đã nộp hồ sơ khiếu nại hợp lệ vào ngày 8/11 đòi khấu trừ 50% cước phí tháng 11 ($12,500) và yêu cầu họp đánh giá kế hoạch phòng ngừa sự cố (CAPA) trước ngày 20/11.","PHẦN 2: PHẦN 2: ACTIVE RECALL 5 GIÂY (BẢNG MA TRẬN ĐỊNH VỊ SONG NGỮ)",{"t":"table","rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong & Vai tro"],["Bên Cung cấp: Apex Cloud Platform (dịch vụ điện toán đám mây cho doanh nghiệp). Bên Sử dụng Dịch vụ: Ngân hàng FinSecure Commercial Banking Group (hệ thống ngân hàng lõi). Người đại diện khiếu nại: Sarah Lin (Giám đốc CNTT - CIO).","Provider: Apex Cloud Platform (enterprise cloud infrastructure vendor). Client: FinSecure Commercial Banking Group (production core banking cluster). Claimant Executive: Sarah Lin (Chief Information Officer - CIO)."]],[["2. Boi canh & Quy trinh loi"],["Thỏa thuận chất lượng dịch vụ (SLA) cam kết uptime 99.9%. Thực tế tháng 10 bị downtime 525 phút (uptime rớt xuống 98.82%), rơi vào khung phạt nặng nhất là giảm 50% tiền cước thuê bao tháng ($12,500 trên tổng gói $25,000/tháng).","Contractual SLA guarantees 99.9% uptime. Actual October operational performance suffered 525 minutes of unscheduled downtime (availability dropped to 98.82%), triggering the highest penalty tier of 50% credit ($12,500 against the $25,000 monthly fee)."]],[["3. Dau vet suy luan cheo"],["Ghép nối điều kiện thời hạn: Điều khoản 4.4 yêu cầu nộp claim trong 30 ngày sau khi kết thúc tháng xảy ra sự cố (hạn chót là 30/11 cho tháng 10). Email gửi ngày 8/11 chứng minh khách hàng hoàn toàn tuân thủ đúng khung thời gian hợp đồng.","Cross-referencing timeline: Section 4.4 mandates claim filing within 30 days following month-end (deadline November 30 for October incidents). The email sent on November 8 confirms full compliance with contractual filing windows."]]]},"PHẦN 3: PHẦN 3: ĐÁP ÁN CHUẨN XÁC & DẤU VẾT TRUY XUẤT CHÉO (CROSS-REFERENCING & COMPREHENSIVE TRAP BREAKDOWN)","186. What is indicated in Section 4 of the Service Level Agreement?","Dap an dung: (B) Maintenance conducted during Sunday early mornings is excluded from downtime calculations.","[Dau vet bai doc / Clue]: Section 4.2: 'Scheduled maintenance windows, announced at least 72 hours in advance and executed between 01:00 and 04:00 UTC on Sundays, shall not count toward Downtime.'","[Dien dat tuong duong / Paraphrase]:","• executed between 01:00 and 04:00 UTC on Sundays, shall not count toward Downtime <=> Maintenance conducted during Sunday early mornings is excluded from downtime calculations.","[Loi giai chi tiet]: Văn bản 1 quy định rõ ràng rằng các đợt bảo trì định kỳ được thông báo trước ít nhất 72 giờ và diễn ra vào sáng sớm Chủ nhật (01:00 - 04:00 UTC) sẽ không bị tính vào thời gian ngừng hoạt động (downtime).","[Phan tich Phuong an Sai & Bay De thi ETS]:","(A) Provider will pay cash refunds directly into customer bank accounts.","- Ly do sai: Hợp đồng quy định khoản phạt được cấp dưới dạng 'Service Credit' khấu trừ vào hóa đơn kỳ cước tiếp theo, không phải hoàn tiền mặt vào tài khoản.","- Bay ETS: Bẫy Mâu thuẫn Trực tiếp (Direct Contradiction Trap)","(C) Customers must submit outage claims within seven business days of an incident.","- Ly do sai: Khoản 4.4 quy định thời hạn nộp là 30 ngày dương lịch kể từ khi kết thúc tháng, không phải 7 ngày làm việc.","- Bay ETS: Bẫy Đảo lộn Mốc Thời gian (Temporal Trap)","(D) Service credits are automatically applied without requiring a formal ticket.","- Ly do sai: Khoản 4.4 quy định rõ khách hàng phải chủ động mở ticket qua cổng hỗ trợ đính kèm nhật ký, không hề được áp dụng tự động.","- Bay ETS: Bẫy Nói Ngược Bản chất (Opposite Trap)","187. According to the monitoring report, what caused the outage on October 14?","Dap an dung: (C) A hardware failure in a primary network switch","[Dau vet bai doc / Clue]: Incident #1: 'October 14, 09:15 - 13:30 UTC: Core Switch firmware malfunction resulted in gateway packet drop.'","[Dien dat tuong duong / Paraphrase]:","• Core Switch firmware malfunction <=> A hardware failure in a primary network switch.","[Loi giai chi tiet]: Báo cáo ở Văn bản 2 chỉ rõ sự cố ngày 14/10 là do 'Core Switch firmware malfunction' (trục trặc thiết bị chuyển mạch lõi). Từ 'switch' trong mạng máy tính chính là thiết bị phần cứng chuyển mạch trung tâm.","[Phan tich Phuong an Sai & Bay De thi ETS]:","(A) A database deadlock during storage replication","- Ly do sai: Đây là nguyên nhân của vụ gián đoạn ngày 22 tháng 10 (Incident #2), không phải của ngày 14 tháng 10.","- Bay ETS: Bẫy Đảo lộn Chi tiết Giữa 2 Sự kiện (Event Misattribution Trap)","(B) A power outage at the Dublin regional facility","- Ly do sai: Trung tâm dữ liệu đặt tại Dublin nhưng không hề có thông tin nào đề cập đến sự cố mất điện lưới.","- Bay ETS: Bẫy Thông tin Không được Đề cập (Not Mentioned Trap)","(D) An unauthorized cybersecurity breach","- Ly do sai: Không có cuộc tấn công mạng nào; đây hoàn toàn là sự cố hỏng hóc kỹ thuật phần cứng và phần mềm nội bộ.","- Bay ETS: Bẫy Suy đoán Vô căn cứ (Fabricated Trap)","188. What tier of service credit does FinSecure qualify for based on October's performance?","Dap an dung: (C) 50%","[Dau vet bai doc / Clue]: VB2: 'Calculated Monthly Uptime Percentage: 98.82%'. VB1 Section 4.3: 'Uptime below 99.0%: 50% Service Credit'.","[Dien dat tuong duong / Paraphrase]:","• Calculated Uptime 98.82% + Threshold below 99.0% => Qualifies for 50% Service Credit.","[Loi giai chi tiet]: Đây là câu hỏi ghép nối 2 văn bản điển hình: Văn bản 2 cung cấp dữ kiện tỷ lệ hoạt động thực tế đạt 98.82% (dưới 99.0%). Gióng sang Văn bản 1 (Mục 4.3), mức dưới 99.0% được hưởng mức giảm cước tối đa là 50%.","[Phan tich Phuong an Sai & Bay De thi ETS]:","(A) 10%","- Ly do sai: Mức 10% chỉ áp dụng nếu thời gian hoạt động đạt từ 99.5% đến 99.89%.","- Bay ETS: Bẫy Chọn Nhầm Bậc Quy định (Wrong Tier Trap)","(B) 25%","- Ly do sai: Mức 25% chỉ áp dụng khi thời gian hoạt động đạt từ 99.0% đến 99.49%.","- Bay ETS: Bẫy Số liệu Lân cận (Adjacent Number Trap)","(D) 100%","- Ly do sai: Hợp đồng không hề có mức giảm cước 100%; mức kịch khung cao nhất là 50%.","- Bay ETS: Bẫy Tuyệt đối hóa (Extreme Value Trap)","189. In the e-mail, what does Ms. Lin ask Mr. Vance to do by November 20?","Dap an dung: (B) Meet with bank leadership to discuss preventive technical measures","[Dau vet bai doc / Clue]: Document 3: 'we request an executive briefing with your engineering team before November 20 to review your Corrective and Preventive Action (CAPA) plan.'","[Dien dat tuong duong / Paraphrase]:","• executive briefing to review Corrective and Preventive Action (CAPA) plan <=> meet with bank leadership to discuss preventive technical measures.","[Loi giai chi tiet]: Trong thư điện tử (Văn bản 3), bà Sarah Lin yêu cầu tổ chức một buổi 'executive briefing' (họp giao ban cấp điều hành) trước ngày 20/11 để xem xét kế hoạch CAPA (biện pháp kỹ thuật phòng ngừa tái diễn sự cố).","[Phan tich Phuong an Sai & Bay De thi ETS]:","(A) Transfer $12,500 via international wire transfer","- Ly do sai: Bà Lin yêu cầu khoản tiền này được trừ vào hóa đơn tháng 11 (itemized deduction on billing statement), không phải chuyển khoản ngân hàng.","- Bay ETS: Bẫy Phương thức Thanh toán (False Payment Mode Trap)","(C) Terminate the multi-year cloud hosting contract","- Ly do sai: Bà Lin yêu cầu bồi thường và khắc phục kỹ thuật, không hề yêu cầu chấm dứt hợp đồng.","- Bay ETS: Bẫy Cực đoan hóa Phản ứng (Exaggeration Trap)","(D) Upgrade FinSecure's account to a dedicated cluster at no extra charge","- Ly do sai: Gói cước của FinSecure vốn dĩ đã là 'Enterprise Dedicated Tier' từ trước.","- Bay ETS: Bẫy Từ vựng Giống hệt (Word Match Trap)","190. What can be inferred about Ms. Lin's claim submission?","Dap an dung: (B) It satisfied the 30-day filing deadline outlined in the agreement.","[Dau vet bai doc / Clue]: VB1: Claim must be opened 'within thirty (30) calendar days following the end of the month in which the incident occurred'. Sự cố tháng 10 kết thúc ngày 31/10. VB3: Email gửi ngày November 8.","[Dien dat tuong duong / Paraphrase]:","• Filing on November 8 for October incidents within 30 days post month-end <=> Satisfied the 30-day filing deadline.","[Loi giai chi tiet]: Hợp đồng quy định hạn chót nộp claim là 30 ngày sau khi kết thúc tháng xảy ra sự cố (tức là 30 ngày kể từ 31/10 = hạn là 30/11). Bà Lin gửi email vào ngày 8/11, tức chỉ 8 ngày sau khi kết thúc tháng 10, hoàn toàn thỏa mãn thời hạn quy định.","[Phan tich Phuong an Sai & Bay De thi ETS]:","(A) It was submitted after the contractual deadline had expired.","- Ly do sai: Nói ngược với thực tế: ngày 8/11 còn cách hạn chót 30/11 tới 22 ngày.","- Bay ETS: Bẫy Mâu thuẫn Dữ kiện Thời gian (Temporal Contradiction Trap)","(C) It was rejected because timestamp logs were missing.","- Ly do sai: Bà Lin nêu rõ 'As detailed in the attached monitoring log', tức đã đính kèm đầy đủ log và chưa hề bị từ chối.","- Bay ETS: Bẫy Trái ngược Tình trạng Thực tế (Fact Reversal Trap)","(D) It required approval from the central banking regulatory commission.","- Ly do sai: Văn bản chỉ nhắc đến ngân hàng tuân thủ quy chuẩn quản lý tài chính, không hề nói cần ủy ban phê chuẩn claim cước.","- Bay ETS: Bẫy Suy diễn Ngoài Văn bản (Out-of-Scope Trap)","PHẦN 4: PHẦN 4: KỸ THUẬT FEYNMAN SONG NGỮ & SƠ ĐỒ QUY TRÌNH (TƯ DUY BA & PHÁP LÝ HỢP ĐỒNG)","4.1. 4.1. Sơ đồ Quy trình Luân chuyển Nghiệp vụ (End-to-End Business Workflow Diagram)",{"t":"table","rows":[[["BƯỚC 1","GIÁM SÁT SLA & GHI NHẬN SỰ CỐ"],[],["BƯỚC 2","LẬP HỒ SƠ CLAIM & ĐỐI SOÁT HỢP ĐỒNG"],[],["BƯỚC 3","HẠCH TOÁN GIẢM CƯỚC & KẾ HOẠCH PHÒNG NGỪA"]],[["• Chung tu & Kenh: Hệ thống APM / Cloud Watch & Hợp đồng MSA Schedule B","• Nghiep vu thuc thi: Ghi nhận 2 sự cố gián đoạn (525 phút) rớt uptime xuống 98.82%, vi phạm mức sàn cam kết 99.9%.","• Ket qua & Kiem soat: Báo cáo giám sát hệ thống & Nhật ký dấu thời gian (Timestamp Logs) làm chứng cứ pháp lý."],["➔"],["• Chung tu & Kenh: Cổng Hỗ trợ Khách hàng (Support Portal) & Thư điện tử CIO","• Nghiep vu thuc thi: Chiếu theo Khoản 4.3 để xác định bậc phạt kịch khung 50% và nộp khiếu nại trong hạn 30 ngày.","• Ket qua & Kiem soat: Phiếu Claim hợp lệ yêu cầu giảm trừ $12,500 vào hóa đơn cước dịch vụ tháng 11."],["➔"],["• Chung tu & Kenh: Hệ thống Kế toán Đối soát (Billing & ERP) & Biên bản CAPA","• Nghiep vu thuc thi: Khấu trừ cước trên hóa đơn kỳ tới và triệu tập họp kỹ thuật cấp cao thẩm tra giải pháp khắc phục gốc rễ.","• Ket qua & Kiem soat: Bảng kê cước đã giảm $12,500 và Kế hoạch Hành động Khắc phục (CAPA) được phê duyệt."]]]},{"t":"table","rows":[[["STEP 1","SLA MONITORING & OUTAGE LOGGING"],[],["STEP 2","CLAIM FILING & CONTRACT RECONCILIATION"],[],["STEP 3","BILLING CREDIT ADJUSTMENT & CAPA AUDIT"]],[["• Documents & Channels: APM / CloudWatch Infrastructure & MSA Schedule B","• Operational Actions: Log 2 unscheduled production outages (525 mins), dropping availability to 98.82% below 99.9% baseline.","• Output Deliverables & Controls: Network incident report & verified server timestamp logs as contractual evidence."],["➔"],["• Documents & Channels: Customer Support Portal & Executive CIO E-mail","• Operational Actions: Apply Section 4.3 penalty matrix to qualify for 50% credit tier and file within 30-day window.","• Output Deliverables & Controls: Formal penalty claim requesting $12,500 itemized credit deduction on November invoice."],["➔"],["• Documents & Channels: Billing ERP System & Corrective Action Review","• Operational Actions: Apply itemized billing credit and convene executive technical session to verify root-cause CAPA.","• Output Deliverables & Controls: Adjusted November invoice reflecting $12,500 credit & signed CAPA engineering roadmap."]]]},"4.2. 4.2. Tư duy Phân tích Nghiệp vụ & Quản trị Hợp đồng (Bản Tiếng Việt)","• Bức tranh Toàn cảnh Hợp đồng & Pháp lý (End-to-End Flow): Trong các thỏa thuận dịch vụ công nghệ thông tin (IT Managed Services & Cloud IaaS), Thỏa thuận Mức Dịch vụ (SLA) là phụ lục pháp lý ràng buộc cam kết hiệu năng kỹ thuật thành nghĩa vụ tài chính. Hợp đồng xác lập tỷ lệ Uptime tối thiểu (99.9% tương đương với thời gian ngừng hoạt động tối đa cho phép chỉ khoảng 43.8 phút/tháng). Khi xảy ra sự cố vượt ngưỡng, chuỗi vận hành luân chuyển từ: Giám sát kỹ thuật tự động -> Xuất chứng cứ nhật ký máy chủ -> Nộp hồ sơ khiếu nại cước (Service Credit Claim) -> Kế toán hai bên đối soát và cấn trừ trực tiếp vào kỳ thanh toán sau (Itemized Billing Deduction). Mắt xích tài chính ngân hàng ở đây vận hành qua cơ chế ghi có (Credit Memo) nhằm khấu trừ vào khoản thanh toán định kỳ mà không cần thủ tục hoàn trả tiền mặt phức tạp.","• Điểm nghẽn & Rủi ro Tranh chấp Thực tế (Core Bottleneck & Risk): Rủi ro pháp lý lớn nhất giữa bên thuê hạ tầng và bên cung cấp đám mây là 'Định nghĩa Thời gian Ngừng hoạt động' (Downtime Definition Disputes). Nhà cung cấp thường cố gắng loại trừ các đợt gián đoạn mạng gián tiếp (chẳng hạn đổ lỗi cho đường truyền mạng ISP bên thứ ba hoặc gọi các đợt bảo trì đột xuất là bảo trì khẩn cấp). Điểm nghẽn thứ hai là 'Thời hiệu nộp hồ sơ' (Claim Window Lapse): hợp đồng thường cài cắm thời hạn ngắn (30 ngày sau tháng phát sinh); nếu bộ phận IT của khách hàng chậm trễ đối soát hoặc thiếu chứng cứ log có dấu thời gian (timestamp), quyền lợi tài chính sẽ bị mất hoàn toàn.","• 3 Giải pháp Thiết kế Hệ thống & Kiểm soát Hợp đồng (BA & Legal Compliance Architecture):","(1) Thiết lập Hệ thống Đo lường SLA Độc lập (Synthetic Monitoring & Third-Party Telemetry): Triển khai công cụ giám sát độc lập bên ngoài mạng của nhà cung cấp để tự động ghi nhận và đóng dấu thời gian (immutable timestamp) cho mọi đợt mất kết nối.","(2) Tự động hóa Đối soát Hóa đơn & Đối chiếu Ngưỡng Phạt (Automated Contract Reconciliation Engine): Xây dựng mô-đun trong phần mềm ERP tự động lấy dữ liệu uptime hàng tháng, so khớp với ma trận bậc phạt của SLA và tự động sinh phiếu đề nghị cấn trừ trước ngày khóa sổ kế toán.","(3) Ràng buộc Trách nhiệm Kế hoạch Phòng ngừa (Mandatory CAPA & Termination Clause): Đưa vào hợp đồng điều khoản nếu vi phạm mức SLA thấp nhất (dưới 99%) quá 2 lần trong 6 tháng liên tiếp, bên thuê có quyền đơn phương chấm dứt hợp đồng trước hạn mà không bị phạt, đồng thời yêu cầu bồi hoàn chi phí chuyển đổi dữ liệu.","4.3. 4.3. Business Analyst & Contract Management Executive Summary (Bản Tiếng Anh)","• End-to-End Contract & Legal Context: In enterprise IT outsourcing and Cloud Infrastructure contracts, the Service Level Agreement (SLA) operationalizes technical system reliability into enforceable contractual remedies. The contract establishes a rigorous availability floor (99.9% uptime, permitting no more than 43.8 minutes of unplanned downtime per month). When performance breaches occur, the incident lifecycle progresses from automated infrastructure monitoring to immutable log verification, followed by a formal claim submission and ending with an itemized accounting credit memo deduction on the subsequent invoice. Financial settlement is efficiently executed via accounts payable adjustments rather than cumbersome cash wire refunds.","• Core Operational Bottleneck & Dispute Risk: The primary legal contention revolves around the contractual definition of unscheduled downtime versus excluded maintenance windows. Cloud vendors frequently attempt to disclaim liability by attributing outages to external carrier transit issues or emergency hotfixes. A secondary compliance vulnerability is the strict 30-day post-month-end claim limitation clause; failure by client IT operations to promptly furnish verified timestamp logs within this window results in complete contractual forfeiture of remedies.","• Key BA & Contract Compliance Architecture Solutions:","(1) Independent Telemetry & Automated Log Certification: Implement vendor-agnostic synthetic monitoring probes to record uninterrupted latency and availability metrics with cryptographic timestamp integrity.","(2) Automated Billing Reconciliation Workflow: Embed SLA tier thresholds into corporate procurement ERP modules to automatically compare monthly telemetry against contract matrices and calculate claim deductions before invoice payment approval.","(3) Contractual Remediation & Exit Rights Integration: Enforce mandatory Corrective and Preventive Action (CAPA) reviews alongside early contract termination rights without penalty if availability breaches occur persistently across multiple billing cycles.","4.4. 4.4. Tam giác Liên kết Nhận thức Đa chiều (Multi-Perspective Contextual Anchoring)","1. Lăng kính Hợp đồng CNTT / Viễn thông Viettel: Quản trị SLA dịch vụ Kênh truyền số liệu / Cloud Viettel IDC cam kết độ sẵn sàng 99.99%. Khi xảy ra đứt cáp hoặc sự cố thiết bị chuyển mạch Router/Switch trung tâm, đội ngũ NOC phải kích hoạt quy trình khắc phục sự cố khẩn cấp (MTTR < 2 giờ), xuất file log đo kiểm và tự động tính toán chiết khấu bồi hoàn cước trên hệ thống cước tập trung để tránh tranh chấp với khách hàng doanh nghiệp lớn.","2. Lăng kính Quản trị Trường Mầm non Ước Mơ Xanh (cô Thu Huyền): Hợp đồng cam kết dịch vụ cung cấp đường truyền camera an ninh trực tuyến cho phụ huynh mầm non. Nhà trường quy định nhà mạng phải cam kết tín hiệu thông suốt 99.5% trong giờ học (7h00 - 17h30). Nếu camera bị gián đoạn quá 2 tiếng không khắc phục, bên cung cấp dịch vụ mạng phải khấu trừ 20% phí cước tháng và gửi thông báo xin lỗi công khai tới phụ huynh.","3. Lăng kính Bàn học Gia đình (Kèm cặp học sinh Lớp 5 - Bé Hà Ngân): Bản cam kết thời gian học tập & giải trí (Family SLA): Hà Ngân và bố mẹ thống nhất 'cam kết thời gian tập trung' (Uptime) trong giờ tự học buổi tối là 90 phút không gián đoạn bởi đồ chơi. Nếu hoàn thành đúng cam kết trong tuần, con nhận 'phần thưởng sao tích lũy' (Bonus Credit); nếu vi phạm, thời gian xem phim hoạt hình cuối tuần sẽ bị khấu trừ theo quy ước rõ ràng đã thỏa thuận trước.","PHẦN 5: PHẦN 5: TỪ VỰNG & PARAPHRASE CHUYÊN SÂU (CHUẨN 3 DÒNG TỐI ƯU NẠP ANKI)","1. Service Level Agreement (SLA)  /ˈsɜː.vɪs ˈlev.əl əˈɡriː.mənt/  = Contractual Performance Commitment","Nghia: Thỏa thuận cam kết mức chất lượng dịch vụ giữa nhà cung cấp và khách hàng.","Vd: The cloud vendor breached the SLA when server availability dropped below 99.9%. - Nhà cung cấp đám mây đã vi phạm cam kết SLA khi độ khả dụng của máy chủ giảm xuống dưới 99.9%.","2. Service Credit  /ˈsɜː.vɪs ˈkred.ɪt/  = Billing Deduction / Fee Rebate Penalty","Nghia: Khoản giảm trừ cước dịch vụ bù trừ cho việc vi phạm cam kết chất lượng.","Vd: Clients are eligible for a 50% service credit after prolonged server outages. - Khách hàng đủ điều kiện nhận khoản giảm 50% tiền cước sau sự cố máy chủ ngừng hoạt động kéo dài.","3. Unscheduled Downtime  /ʌnˈskedʒ.uːld ˈdaʊn.taɪm/  = Unplanned Outage / System Interruption","Nghia: Thời gian hệ thống ngừng hoạt động ngoài kế hoạch hoặc do sự cố đột xuất.","Vd: The core switch breakdown caused four hours of unscheduled downtime. - Sự cố hỏng thiết bị chuyển mạch lõi đã gây ra bốn giờ ngừng hoạt động ngoài kế hoạch.","4. Scheduled Maintenance Window  /ˈskedʒ.uːld ˈmeɪn.tən.əns ˈwɪn.dəʊ/  = Pre-approved Planned Servicing Period","Nghia: Khung thời gian bảo trì hệ thống định kỳ đã được phê duyệt trước.","Vd: Upgrades executed during the scheduled maintenance window are exempt from penalties. - Việc nâng cấp được thực hiện trong khung giờ bảo trì theo kế hoạch sẽ được miễn trừ phạt.","5. Lodge a Formal Claim  /lɒdʒ ə ˈfɔː.məl kleɪm/  = Submit an Official Penalty Request","Nghia: Nộp đơn khiếu nại hoặc yêu cầu bồi thường chính thức theo hợp đồng.","Vd: The bank decided to lodge a formal claim for compensation within the 30-day deadline. - Ngân hàng quyết định nộp đơn khiếu nại bồi thường chính thức trong thời hạn 30 ngày.","6. Corrective and Preventive Action (CAPA)  /kəˈrek.tɪv ænd prɪˈven.tɪv ˈæk.ʃən/  = Root-Cause Rectification & Prevention Plan","Nghia: Kế hoạch hành động khắc phục sự cố và phòng ngừa tái diễn rủi ro.","Vd: Regulatory compliance mandates a thorough CAPA review following any critical data outage. - Quy chuẩn tuân thủ bắt buộc phải rà soát kỹ lưỡng kế hoạch CAPA sau bất kỳ sự cố dữ liệu nghiêm trọng nào.","7. Itemized Deduction  /ˈaɪ.tə.maɪzd dɪˈdʌk.ʃən/  = Categorized Expense Reduction on Invoice","Nghia: Khoản khấu trừ được phân tách và liệt kê rõ ràng từng dòng trên hóa đơn.","Vd: The financial penalty was reflected as an itemized deduction on the monthly statement. - Khoản tiền phạt tài chính được thể hiện dưới dạng một dòng khấu trừ chi tiết trên bảng kê hàng tháng.","BÀI 2: Hợp đồng Thuê Mặt bằng Thương mại, Phụ cấp Cải tạo Mặt bằng (Tenant Improvement Allowance) & Hoàn trả Hiện trạng (Dilapidations) (Questions 181-185 - Double Passage)","Nguồn: Nguồn: ETS TOEIC Part 7 — Double Passage (Commercial Lease Agreement Extract & Move-Out Inspection Settlement Memo)","PHẦN 1: PHẦN 1: NỘI DUNG BÀI ĐỌC & DỊCH NGHĨA SONG NGỮ","1.1. 1.1. Đề thi Tiếng Anh gốc (Strategy Guide & Original ETS Passages)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","Questions 181-185 refer to the following two documents.","[Passage 1: Commercial Lease Agreement (Extract)]","Document 1: Commercial Lease Agreement (Extract)","Plaza Tower Office Suites - Article IX: Alterations and Surrender of Premises","Section 9.1 Tenant Improvements: Landlord (Vanguard Commercial Properties) agrees to grant Tenant (Sterling & Partners Law Firm) a Tenant Improvement Allowance of up to $45,000 for the construction of interior glass partitioning and structural wiring on the 14th Floor. All architectural modifications must comply with municipal fire safety codes.","Section 9.2 Surrender Condition: Upon the expiration or earlier termination of this five-year Lease, Tenant shall surrender the Leased Premises in a \"broom-clean\" condition, good order, and in the exact condition existing as of the Commencement Date, reasonable wear and tear excepted.","Section 9.3 Dilapidations & Removal Obligations: Tenant shall, at its sole expense, completely remove all temporary glass partitions, customized cabling, and corporate fixtures installed during occupancy. Additionally, Tenant must repair all wall penetrations, spackle and repaint damaged drywall, and professionally shampoo all commercial carpeting.","Section 9.4 Security Deposit Application: Tenant has deposited the sum of $30,000 as a Security Deposit. If Tenant fails to complete required restoration within fourteen (14) calendar days following lease expiration, Landlord reserves the contractual right to engage an independent contractor to perform restoration work and deduct the actual costs directly from the Security Deposit. Any remaining balance shall be returned via bank wire within thirty (30) days.","[Passage 2: Memorandum]","Document 2: Memorandum","To: Harold Sterling, Managing Partner <h.sterling@sterlinglaw.com>","From: Denise Morales, Property Operations Manager <d.morales@vanguardprop.com>","Date: October 18","Subject: Final Move-Out Inspection & Security Deposit Reconciliation - Suite 1400","Dear Mr. Sterling,","Our building facilities team conducted the final move-out walk-through inspection of Suite 1400 on October 16, following the conclusion of your 5-year lease term on September 30.","We appreciate that your team successfully removed all perimeter glass partition panels and completed the professional steam cleaning of the reception carpet. However, our technical audit identified two outstanding restoration deficiencies that were not rectified within the 14-day cure window ending October 14:","1. Electrical Floor Trench Penetrations: Eight heavy-duty anchor bolt holes in the concrete slab beneath the conference room table were left unplugged, posing structural floor load issues. (Restoration Cost: $1,800)","2. Executive Office Drywall Damage: Deep gouges and unpatched anchors exceeding 2 inches in diameter were found in Rooms 1402 and 1405, requiring drywall patching and color-matched primer repainting. (Restoration Cost: $2,400)","Total Contractor Expenses Incurred: $4,200.","Security Deposit Reconciliation:","- Initial Security Deposit Held: $30,000.00","- Less Approved Repair Invoices: -$4,200.00","- Net Refund Payable to Tenant: $25,800.00","The net sum of $25,800 has been authorized for disbursement and will be transmitted to Sterling & Partners' corporate escrow bank account via ACH transfer on October 22.","Sincerely,","Denise Morales","Vanguard Commercial Properties","[ORIGINAL ETS QUESTIONS - CAU HOI TIENG ANH GOC]:","181. What is the primary purpose of Document 1?","(A) To market vacant commercial office space to corporate tenants","(B) To outline lease rules regarding alterations and end-of-term obligations","(C) To terminate an existing tenancy due to non-payment of rent","(D) To request municipal zoning permits for interior remodeling","182. According to Section 9.2, what is an exception to the requirement that the premises be returned in original condition?","(A) Upgrades funded by the Tenant Improvement Allowance","(B) Structural modifications required by fire safety regulations","(C) Normal deterioration resulting from ordinary everyday usage","(D) Damage caused by municipal utility maintenance teams","183. What restoration task was successfully completed by Sterling & Partners?","(A) Sealing anchor bolt holes in the concrete flooring","(B) Repairing gouges on executive office drywall","(C) Removing custom-built glass partition structures","(D) Repainting all interior walls with fresh primer","184. In the memorandum, the word 'deficiencies' in paragraph 2 is closest in meaning to:","(A) shortcomings","(B) shortages","(C) expenses","(D) amendments","185. How much money will Vanguard Commercial Properties return to Sterling & Partners?","(A) $4,200","(B) $25,800","(C) $30,000","(D) $45,000","1.2. 1.2. Hướng dẫn làm bài Part 7: Chiến lược 5 phút tối ưu, Ghép nối Dữ kiện & Tóm tắt Feynman","[5-MINUTE STRATEGY GUIDE - CHIEN THUAT 5 PHUT]:","CHIẾN LƯỢC 5 PHÚT TỐI ƯU PART 7 (ÁP DỤNG BÀI ĐỌC ĐOẠN ĐÔI HỢP ĐỒNG THUÊ & QUYẾT TOÁN CỌC):","Bước 1 (30 giây) - Nắm bắt Bối cảnh & Luồng sự việc (Quỹ đạo chữ Z & 3 Câu hỏi Tiềm thức):","• Quét VB1: Trích lục Hợp đồng Thuê Văn phòng (Article IX) giữa Vanguard (Bên cho thuê) và Sterling & Partners (Bên thuê) -> Quy định cải tạo, hoàn trả hiện trạng (broom-clean, trừ hao mòn tự nhiên), hạn sửa chữa 14 ngày, tiền cọc $30,000.","• Quét VB2: Memo thanh lý hợp đồng từ Quản lý tòa nhà Denise Morales -> Hết hạn 5 năm ngày 30/9, kiểm tra thấy vách kính đã dỡ, thảm đã giặt; nhưng còn 2 lỗi (sàn và tường nứt) tốn $4,200 khắc phục -> Trả lại $25,800 qua ACH vào 22/10.","Bước 2 (20 giây) - Quét 5 Câu hỏi & Gắn Móc Từ khóa:","• Câu 181: Mục đích VB1 (Section 9 -> Alterations & Surrender obligations).","• Câu 182: Trường hợp ngoại lệ ở Section 9.2 (reasonable wear and tear -> normal deterioration).","• Câu 183: Hạng mục bên thuê ĐÃ hoàn thành (VB2 paragraph 2 -> glass partition panels removed).","• Câu 184: Từ vựng theo ngữ cảnh ('deficiencies' trong memo -> shortcomings/flaws).","• Câu 185: Số tiền hoàn trả thực tế (Reconciliation net refund -> $25,800).","Bước 3 (3 phút 45 giây) - Giải quyết Cuốn chiếu & Dấu vết Tìm nhanh:","• Câu 181 (Mục đích văn bản): Tiêu đề và nội dung Điều khoản IX quy định rõ các quy tắc sửa đổi và bàn giao mặt bằng cuối hạn thuê -> Chọn (B).","• Câu 182 (Ngoại lệ hợp đồng): Đọc Section 9.2: 'in the exact condition existing as of the Commencement Date, reasonable wear and tear excepted' -> 'reasonable wear and tear' chính là hao mòn tự nhiên do sử dụng thông thường ('normal deterioration resulting from ordinary everyday usage') -> Chọn (C).","• Câu 183 (Chi tiết đã làm xong): Quét VB2: 'We appreciate that your team successfully removed all perimeter glass partition panels' -> Chọn (C).","• Câu 184 (Từ vựng ngữ cảnh): Trong ngữ cảnh nghiệm thu bàn giao phát hiện lỗi chưa khắc phục ('two outstanding restoration deficiencies that were not rectified'), 'deficiencies' có nghĩa là khiếm khuyết/thiếu sót -> 'shortcomings' -> Chọn (A).","• Câu 185 (Ghép nối số liệu quyết toán): VB2 bảng tính chi tiết: $30,000 - $4,200 = $25,800 -> Chọn (B).","Bước 4 (25 giây) - Khóa sổ Đáp án & Tóm tắt Feynman 1 câu:","• Rà soát khóa đáp án: 181-B, 182-C, 183-C, 184-A, 185-B.","• Đúc kết Feynman: 'Công ty luật hết hạn 5 năm thuê văn phòng đã dỡ vách kính nhưng còn để lại lỗ thủng trên sàn bê tông và tường thạch cao, ban quản lý tòa nhà thuê thợ sửa hết $4,200 rồi trừ thẳng vào tiền cọc $30,000 và chuyển khoản trả lại $25,800.'","1.3. 1.3. Bản dịch Song ngữ Từng câu (Sentence-by-Sentence Translation)","[SENTENCE-BY-SENTENCE BILINGUAL TRANSLATION - BAN DICH SONG NGU TUNG CAU]:","[Văn bản 1: Hợp đồng Thuê Mặt bằng Thương mại (Trích đoạn)]","Document 1: Commercial Lease Agreement (Extract)","Plaza Tower Office Suites - Article IX: Alterations and Surrender of Premises","Văn bản 1: Hợp đồng Thuê Mặt bằng Thương mại (Trích đoạn)","Khu Văn phòng Tòa tháp Plaza Tower - Điều khoản IX: Cải tạo và Bàn giao Mặt bằng","Section 9.1 Tenant Improvements: Landlord (Vanguard Commercial Properties) agrees to grant Tenant (Sterling & Partners Law Firm) a Tenant Improvement Allowance of up to $45,000 for the construction of interior glass partitioning and structural wiring on the 14th Floor.","Khoản 9.1 Chi phí Cải tạo do Bên Thuê Thực hiện: Bên Cho Thuê (Vanguard Commercial Properties) đồng ý cấp cho Bên Thuê (Công ty Luật Sterling & Partners) một Khoản Phụ cấp Cải tạo Mặt bằng lên đến $45,000 để thi công các vách ngăn kính nội thất và hệ thống dây cáp mạng kỹ thuật tại Tầng 14.","All architectural modifications must comply with municipal fire safety codes.","Mọi sửa đổi về kiến trúc bắt buộc phải tuân thủ các quy chuẩn an toàn phòng cháy chữa cháy của thành phố.","Section 9.2 Surrender Condition: Upon the expiration or earlier termination of this five-year Lease, Tenant shall surrender the Leased Premises in a \"broom-clean\" condition, good order, and in the exact condition existing as of the Commencement Date, reasonable wear and tear excepted.","Khoản 9.2 Điều kiện Bàn giao Mặt bằng: Khi hết hạn hoặc chấm dứt trước hạn Hợp đồng Thuê thời hạn 5 năm này, Bên Thuê phải bàn giao lại Mặt bằng Thuê trong tình trạng \"sạch sẽ gọn gàng\", trật tự tốt và đúng với hiện trạng ban đầu như tại Ngày Bắt đầu Hiệu lực Hợp đồng, ngoại trừ hao mòn tự nhiên hợp lý trong quá trình sử dụng.","Section 9.3 Dilapidations & Removal Obligations: Tenant shall, at its sole expense, completely remove all temporary glass partitions, customized cabling, and corporate fixtures installed during occupancy.","Khoản 9.3 Khôi phục Hiện trạng & Nghĩa vụ Tháo dỡ: Bên Thuê, bằng toàn bộ chi phí tự chi trả của mình, phải tháo dỡ hoàn toàn toàn bộ vách ngăn kính tạm thời, hệ thống dây cáp chuyên dụng và các thiết bị gắn tường doanh nghiệp đã lắp đặt trong thời gian thuê.","Additionally, Tenant must repair all wall penetrations, spackle and repaint damaged drywall, and professionally shampoo all commercial carpeting.","Ngoài ra, Bên Thuê phải trám vá toàn bộ các lỗ xuyên tường, trét bột bả và sơn lại các tấm thạch cao bị hư hỏng, đồng thời giặt sạch bằng dịch vụ chuyên nghiệp toàn bộ thảm trải sàn thương mại.","Section 9.4 Security Deposit Application: Tenant has deposited the sum of $30,000 as a Security Deposit.","Khoản 9.4 Xử lý Tiền Ký quỹ Bảo đảm: Bên Thuê đã đặt cọc số tiền $30,000 dưới dạng Tiền Ký quỹ Bảo đảm.","If Tenant fails to complete required restoration within fourteen (14) calendar days following lease expiration, Landlord reserves the contractual right to engage an independent contractor to perform restoration work and deduct the actual costs directly from the Security Deposit.","Nếu Bên Thuê không hoàn thành công tác khôi phục hiện trạng theo yêu cầu trong vòng mười bốn (14) ngày dương lịch kể từ khi hết hạn hợp đồng thuê, Bên Cho Thuê bảo lưu quyền theo hợp đồng được thuê một nhà thầu độc lập bên ngoài để thực hiện việc sửa chữa và khấu trừ chi phí thực tế trực tiếp từ Tiền Ký quỹ Bảo đảm.","Any remaining balance shall be returned via bank wire within thirty (30) days.","Bất kỳ số dư tiền cọc còn lại nào sẽ được hoàn trả qua lệnh chuyển khoản ngân hàng trong vòng ba mươi (30) ngày.","[Văn bản 2: Bản ghi nhớ Quyết toán Kiểm tra Bàn giao Mặt bằng]","Document 2: Memorandum","To: Harold Sterling, Managing Partner <h.sterling@sterlinglaw.com>","From: Denise Morales, Property Operations Manager <d.morales@vanguardprop.com>","Date: October 18","Subject: Final Move-Out Inspection & Security Deposit Reconciliation - Suite 1400","Văn bản 2: Bản ghi nhớ","Người nhận: Harold Sterling, Giám đốc Điều hành <h.sterling@sterlinglaw.com>","Người gửi: Denise Morales, Quản lý Vận hành Bất động sản <d.morales@vanguardprop.com>","Ngày: Ngày 18 tháng 10","Tiêu đề: Kiểm tra Bàn giao Hoàn trả Mặt bằng Cuối cùng & Đối soát Quyết toán Tiền Ký quỹ - Căn hộ 1400","Dear Mr. Sterling, Our building facilities team conducted the final move-out walk-through inspection of Suite 1400 on October 16, following the conclusion of your 5-year lease term on September 30.","Kính gửi Ông Sterling, Đội ngũ kỹ thuật quản lý tòa nhà của chúng tôi đã tiến hành cuộc kiểm tra thực địa bàn giao hoàn trả mặt bằng cuối cùng đối với Khu Văn phòng 1400 vào ngày 16 tháng 10, tiếp sau sự kiện kết thúc thời hạn thuê 5 năm của quý công ty vào ngày 30 tháng 9.","We appreciate that your team successfully removed all perimeter glass partition panels and completed the professional steam cleaning of the reception carpet.","Chúng tôi đánh giá cao việc đội ngũ của quý công ty đã tháo dỡ thành công toàn bộ các tấm vách ngăn kính bao quanh và hoàn tất việc giặt hơi nước chuyên nghiệp cho thảm khu vực lễ tân.","However, our technical audit identified two outstanding restoration deficiencies that were not rectified within the 14-day cure window ending October 14: 1. Electrical Floor Trench Penetrations: Eight heavy-duty anchor bolt holes in the concrete slab beneath the conference room table were left unplugged, posing structural floor load issues. (Restoration Cost: $1,800). 2. Executive Office Drywall Damage: Deep gouges and unpatched anchors exceeding 2 inches in diameter were found in Rooms 1402 and 1405, requiring drywall patching and color-matched primer repainting. (Restoration Cost: $2,400).","Tuy nhiên, đợt kiểm tra kỹ thuật của chúng tôi đã phát hiện hai khiếm khuyết khôi phục hiện trạng còn tồn đọng chưa được khắc phục trong khung thời gian ân hạn 14 ngày kết thúc vào ngày 14 tháng 10: 1. Lỗ khoan rãnh sàn kỹ thuật điện: Tám lỗ bu-lông neo chịu lực trên sàn bê tông phía dưới bàn phòng họp bị để trống chưa trám vá, gây rủi ro về kết cấu chịu tải sàn. (Chi phí khôi phục: $1,800). 2. Hư hỏng vách thạch cao phòng làm việc điều hành: Các vết khoét sâu và lỗ neo chưa trám có đường kính vượt quá 2 inch tại Phòng 1402 và 1405, đòi hỏi phải trám trét thạch cao và sơn lót đồng màu. (Chi phí khôi phục: $2,400).","Total Contractor Expenses Incurred: $4,200. Security Deposit Reconciliation: Initial Security Deposit Held: $30,000.00. Less Approved Repair Invoices: -$4,200.00. Net Refund Payable to Tenant: $25,800.00.","Tổng Chi phí Nhà thầu Phát sinh Thực tế: $4,200. Đối soát Quyết toán Tiền Ký quỹ Bảo đảm: Tiền ký quỹ ban đầu nắm giữ: $30,000.00. Trừ Hóa đơn sửa chữa đã được phê duyệt: -$4,200.00. Số tiền hoàn cọc ròng phải trả cho Bên Thuê: $25,800.00.","The net sum of $25,800 has been authorized for disbursement and will be transmitted to Sterling & Partners' corporate escrow bank account via ACH transfer on October 22.","Số tiền ròng $25,800 đã được phê duyệt giải ngân và sẽ được chuyển tới tài khoản ngân hàng ký quỹ doanh nghiệp của Sterling & Partners thông qua lệnh thanh toán điện tử ACH vào ngày 22 tháng 10.","Sincerely, Denise Morales, Vanguard Commercial Properties.","Trân trọng, Denise Morales, Quản lý Vận hành, Vanguard Commercial Properties.","1.4. 1.4. Dịch chi tiết Câu hỏi & Phương án Trắc nghiệm","[TRANSLATED QUESTIONS & OPTIONS - CAU HOI VA DAP AN DICH NGHIA]:","Câu 181. Mục đích chính của Văn bản 1 là gì?","(A) Quảng bá diện tích văn phòng thương mại còn trống tới các khách thuê doanh nghiệp.","(B) Quy định các quy tắc hợp đồng thuê liên quan đến việc sửa đổi mặt bằng và nghĩa vụ khi kết thúc thời hạn thuê.","(C) Chấm dứt hợp đồng thuê hiện hữu do bên thuê không thanh toán tiền thuê nhà.","(D) Xin giấy phép quy hoạch xây dựng của chính quyền thành phố cho việc cải tạo nội thất.","Câu 182. Theo Khoản 9.2, đâu là trường hợp ngoại lệ đối với yêu cầu mặt bằng phải được hoàn trả theo đúng hiện trạng ban đầu?","(A) Các nâng cấp được tài trợ bởi Khoản Phụ cấp Cải tạo Mặt bằng.","(B) Các sửa đổi kết cấu theo yêu cầu của quy định phòng cháy chữa cháy.","(C) Sự hao mòn xuống cấp tự nhiên phát sinh từ quá trình sử dụng thông thường hàng ngày.","(D) Các hư hỏng do đội ngũ bảo trì điện nước của thành phố gây ra.","Câu 183. Hạng mục khôi phục nào đã được Công ty Luật Sterling & Partners hoàn thành thành công?","(A) Trám bít các lỗ bu-lông neo trên sàn bê tông.","(B) Sửa chữa các vết khoét hư hỏng trên vách thạch cao phòng điều hành.","(C) Tháo dỡ các hệ thống kết cấu vách ngăn bằng kính theo yêu cầu.","(D) Sơn lại toàn bộ các bức tường nội thất bằng lớp sơn lót mới.","Câu 184. Trong bản ghi nhớ, từ 'deficiencies' trong đoạn 2 gần nghĩa nhất với từ nào sau đây?","(A) các thiếu sót / khiếm khuyết","(B) sự thiếu hụt số lượng","(C) các khoản chi phí","(D) các điều khoản sửa đổi","Câu 185. Vanguard Commercial Properties sẽ hoàn trả lại cho Sterling & Partners bao nhiêu tiền?","(A) $4,200","(B) $25,800","(C) $30,000","(D) $45,000","1.5. 1.5. Tóm tắt Viết lại Toàn bài theo Feynman (Feynman Monograph Summary)","[EXECUTIVE SUMMARY & CORE LOGIC - BAN TOM TAT COT LOI]:","English Executive Summary:","• Commercial Lease Restoration Framework: Vanguard Commercial Properties' lease mandates that upon term expiration, the tenant (Sterling & Partners) must remove all partitions, repair penetrations, and surrender the suite broom-clean (reasonable wear and tear excepted) within 14 days, or restoration costs will be deducted from their $30,000 deposit.","• Move-out Inspection Findings: While Sterling & Partners successfully removed glass wall partitions and shampooed carpets, an inspection on October 16 uncovered unsealed floor bolt holes ($1,800) and severe executive office drywall gouges ($2,400).","• Final Financial Settlement: Vanguard engaged third-party contractors totaling $4,200 in repairs, deducting this sum from the deposit and authorizing an ACH wire refund of the remaining $25,
