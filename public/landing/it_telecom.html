<title>IT Telecom TOEIC 750+</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: cargo-manifest page. Hero with a 3x3 container stack (one container per lesson), sticky container-tab bar, lesson panel with side index of the 5 parts. */
:root{
  /* Tailwind-style neutrals + one primary (Blue 600) */
  --bg:#F9FAFB; --surface:#FFFFFF; --surface-2:#F3F4F6; --ink:#111827; --muted:#6B7280; --line:#E5E7EB;
  --paper:#FFFFFF;
  /* Coordinated palette: navy = governance/trust, cobalt = primary, magenta = errors,
     emerald = correct, ochre = clues & timing, Viettel red = brand marks, xanh mạ = outputs & chips */
  --navy:#102B66; --navy-2:#183B7E; --navy-ink:#102B66;
  --cobalt:#1E62D0; --cobalt-2:#2A7BE8;
  --magenta:#D71A4A; --magenta-2:#E52E5E;
  --emerald:#0A8558; --emerald-2:#12A16E;
  --ochre:#D87D0E; --ochre-2:#E8901C; --ochre-soft:#FDF1E1;
  --brand:var(--cobalt); --brand-soft:#DCE8FB; --vi:var(--navy-2);
  --red:#EE0033; --red-soft:#FFE4EA; --green:#5FA61B; --green-soft:#EAF6DC;
  --ok:var(--emerald); --bad:var(--magenta); --coral:var(--red); --coral-soft:var(--red-soft);
  --c1:var(--brand); --c2:var(--brand); --c3:var(--brand); --c4:var(--brand); --c5:var(--brand); --c6:var(--brand); --c7:var(--brand); --c8:var(--brand); --c9:var(--brand); --c10:var(--brand);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --shadow:0 1px 2px rgba(17,24,39,.05),0 6px 20px -8px rgba(17,24,39,.15);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#030712; --surface:#111827; --surface-2:#0B1120; --ink:#F9FAFB; --muted:#9CA3AF; --line:#1F2937;
  --vi:#9DBDF5; --paper:#111827; --navy-ink:#C9D7F4;
  --brand:var(--cobalt-2); --brand-soft:#132A55; --ochre-soft:#33220B;
  --ok:var(--emerald-2); --bad:var(--magenta-2);
  --red:#FF3B5F; --red-soft:#3B0A16; --green:#8BCF45; --green-soft:#1C2E0E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#030712; --surface:#111827; --surface-2:#0B1120; --ink:#F9FAFB; --muted:#9CA3AF; --line:#1F2937;
  --vi:#9DBDF5; --paper:#111827; --navy-ink:#C9D7F4;
  --brand:var(--cobalt-2); --brand-soft:#132A55; --ochre-soft:#33220B;
  --ok:var(--emerald-2); --bad:var(--magenta-2);
  --red:#FF3B5F; --red-soft:#3B0A16; --green:#8BCF45; --green-soft:#1C2E0E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{display:none}
.wrap{max-width:min(1600px,96vw);width:100%;margin:0 auto;padding-left:clamp(16px,2.5vw,40px);padding-right:clamp(16px,2.5vw,40px)}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--c) 70%,transparent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono)}

/* ---------- Hero ---------- */
.hero{padding-block:clamp(20px,3vw,36px);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.05fr);gap:clamp(20px,3vw,44px);align-items:center}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow b{color:var(--coral);font-weight:500}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,3.2vw,44px);line-height:1.15;letter-spacing:-.01em;text-transform:uppercase;margin-top:10px;text-wrap:balance;word-break:break-word}
.hero h1 span{color:var(--red)}
.hero .en-sub{font-family:var(--f-display);font-weight:600;font-size:clamp(14px,1.5vw,18px);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.hero .desc{max-width:62ch;margin-top:16px;color:var(--muted);font-size:15px}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:24px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}

.yard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:620px;justify-self:end;width:100%}
.box{position:relative;min-height:76px;height:auto;aspect-ratio:auto;max-width:100%;border:1px solid var(--line);border-radius:12px;cursor:pointer;color:var(--ink);text-align:left;padding:8px 10px;background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;gap:4px;transition:transform .18s ease,background .18s,border-color .18s,box-shadow .18s}
.box:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 8px 20px -10px color-mix(in srgb,var(--brand) 60%,transparent)}
.box .n{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--brand)}
.box .qr{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.box .code{font-size:11.5px;font-weight:600;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;line-height:1.25;word-break:break-word}
.box.on{background:var(--brand);border-color:var(--brand);color:#fff}
.box.on .n,.box.on .qr,.box.on .code{color:#fff}
.box.alt .n{color:var(--coral)}

/* navy governance band behind the hero */
.hero-band{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff}
.hero-band .eyebrow{color:rgba(255,255,255,.7)}
.hero-band .eyebrow b{color:var(--ochre-2)}
.hero-band h1 span{color:var(--magenta-2)}
.hero-band .en-sub,.hero-band .desc,.hero-band .stat span{color:rgba(255,255,255,.74)}
.hero-band .stat b{color:#fff}
.hero-band .box{border-color:transparent}
.hero-band .box.on{background:var(--cobalt-2);border-color:#fff}

/* ---------- Tab bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-block:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:12px;padding-block:10px}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;flex:1;min-width:0;padding-bottom:2px;scroll-behavior:smooth}
.tab{--c:var(--c1);flex:0 0 auto;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 16px 5px 5px;cursor:pointer;text-align:left;transition:background .15s,border-color .15s}
.tab:hover{border-color:var(--c)}
.tab .door{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--c);font-family:var(--f-display);font-weight:800;font-size:16px;
  background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.tab .tl{display:flex;flex-direction:column;line-height:1.2}
.tab .tl b{font-size:13px;font-weight:600;white-space:nowrap}
.tab .tl small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#fff}
.tab[aria-selected="true"] .door{background:rgba(255,255,255,.22);color:#fff}
.tab[aria-selected="true"] .tl small{color:rgba(255,255,255,.82)}
.mode{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:0 0 auto;background:var(--surface-2)}
.mode button{border:0;background:none;padding:6px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--navy);color:#fff}

/* ---------- Lesson ---------- */
main{padding-block:28px 64px}
.lesson-head{--c:var(--c1);display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start;padding-bottom:24px;border-bottom:2px solid var(--navy-ink)}
.big-n{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,10vw,120px);line-height:.8;color:var(--c);letter-spacing:-.02em}
.big-n small{display:block;font-size:14px;letter-spacing:.2em;color:var(--muted);font-weight:600;margin-bottom:8px}
.lesson-head h2{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3.2vw,38px);line-height:1.05;text-transform:uppercase;color:var(--navy-ink)}
.lesson-head .en-t{font-family:var(--f-display);font-weight:600;font-size:clamp(15px,1.7vw,19px);color:var(--c);letter-spacing:.04em;margin-top:8px;text-transform:uppercase}
.src{display:inline-flex;gap:8px;align-items:center;margin-top:14px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.src b{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--c);letter-spacing:.06em}

.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:36px;margin-top:28px}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 82px);align-self:start;display:flex;flex-direction:column;gap:2px}
.toc a{display:flex;gap:10px;align-items:baseline;text-decoration:none;color:var(--muted);font-size:13.5px;padding:7px 10px;border-radius:6px;line-height:1.3}
.toc a b{font-family:var(--f-display);font-size:17px;color:var(--c);min-width:18px}
.toc a:hover,.toc a.on{background:var(--surface);color:var(--ink)}
.toc .toc-sub{padding-left:38px;font-size:12.5px}
.content{min-width:0;display:flex;flex-direction:column;gap:44px}

.part{display:flex;flex-direction:column;gap:22px;scroll-margin-top:96px}
.part-h{display:flex;gap:14px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px}
.part-h .pn{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.14em;color:#fff;background:var(--red);padding:3px 9px;border-radius:4px;white-space:nowrap}
.part-h h3{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.4vw,26px);text-transform:uppercase;line-height:1.1;color:var(--navy-ink)}
.sub{display:flex;flex-direction:column;gap:14px;scroll-margin-top:96px}
.sub-h{display:flex;gap:10px;align-items:baseline;font-weight:700;font-size:17px}
.sub-h .sn{font-family:var(--f-mono);font-size:12px;color:var(--c);font-weight:500}

/* strategy */
.strat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.strat-t{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;color:var(--c);text-transform:uppercase;line-height:1.5}
.steps{display:grid;gap:12px;counter-reset:s}
.step{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:start}
.step .when{font-family:var(--f-mono);font-size:11.5px;display:flex;flex-direction:column;gap:2px;border-right:2px solid var(--ochre);padding-right:10px}
.step .when span{color:var(--ochre)!important;font-weight:500}
.step .when b{font-family:var(--f-display);font-size:18px;font-weight:700;color:var(--ink)}
.step .when span{color:var(--muted)}
.step h5{margin:0 0 3px;font-size:14.5px;font-weight:700}
.step p{font-size:14.5px;color:var(--ink)}

/* passages = papers */
.papers{display:flex;flex-direction:column;gap:18px}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:22px 24px;display:flex;flex-direction:column;gap:9px;font-size:15px;position:relative}
.paper-tag{align-self:flex-start;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:3px;padding:2px 8px;margin-bottom:4px}
.ln-caps{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.04em;line-height:1.2}
.ln-kv{font-size:14px}
.ln-kv b{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted);margin-right:4px}
.ln-bul{padding-left:16px;position:relative}
.ln-bul::before{content:"";position:absolute;left:2px;top:.7em;width:6px;height:6px;background:var(--c);border-radius:1px}
.ln-sec{font-weight:700;margin-top:6px}
.ln-head{font-weight:700;margin-top:8px;color:var(--navy-ink)}
.ln-num{padding:2px 0 2px 14px;border-left:2px solid var(--brand);margin-left:2px}
.ln-num b{color:var(--brand)}
.ln-concl{background:var(--brand-soft);border-radius:6px;padding:8px 12px;font-size:14px}
.ln-concl b{color:var(--brand)}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:16px}
.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.score{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.score b{color:var(--ink);font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--c)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.q-stem{display:flex;gap:12px;font-weight:600}
.q-no{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--c);line-height:1.2;flex:0 0 auto}
.q-extra{font-style:italic;font-weight:400;color:var(--muted);margin-top:4px}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:8px 12px;cursor:pointer;font-size:14.5px;line-height:1.45;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--c)}
.opt .k{font-family:var(--f-mono);font-weight:500;font-size:13px;color:var(--c);flex:0 0 auto;margin-top:1px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surface))}
.opt.ok .k{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--surface))}
.opt.bad .k{color:var(--bad)}
.q-fb{font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.q-fb .r{font-weight:600}
.q-fb .r.ok{color:var(--ok)} .q-fb .r.bad{color:var(--bad)}
.q-fb a{color:var(--c)}

/* bilingual */
.bi-doc{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;color:var(--c);text-transform:uppercase;padding:10px 0 2px;border-top:1px dashed var(--line);margin-top:6px;line-height:1.5}
.bi-doc:first-child{border-top:0;margin-top:0;padding-top:0}
.bi{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--line)}
.pair:first-child{border-top:0}
.pair>div{padding:11px 16px;display:flex;flex-direction:column;gap:4px;font-size:14.5px;min-width:0}
.pair .en{color:var(--ink)}
.pair .vi{color:var(--vi);background:color-mix(in srgb,var(--vi) 5%,transparent);border-left:1px solid var(--line)}
.lang{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--muted);opacity:.8}
.bi-head{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-bottom:1px solid var(--line)}
.bi-head span{padding:7px 16px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted)}
.bi-head span+span{border-left:1px solid var(--line);color:var(--vi)}

.vi-t{color:var(--vi)}
/* recall mode blurs translations */
.recall .vi-r{filter:blur(6px);cursor:pointer;user-select:none;transition:filter .2s}
.recall .vi-r.peek{filter:none;user-select:auto}

/* question translation */
.qt{display:grid;gap:12px}
.qt-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.qt-card .stem{display:flex;gap:12px}
.qt-card .stem>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.qt-card .stem b{font-weight:600}
.qt-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;padding-left:44px}
.qt-opt{display:flex;gap:8px;font-size:14px;line-height:1.45}
.qt-opt>div{display:flex;flex-direction:column;min-width:0}
.qt-opt .k{font-family:var(--f-mono);color:var(--c);font-size:12.5px;margin-top:1px}
.qt-opt.correct .k{color:#fff;background:var(--ok);border-radius:3px;padding:0 4px;height:fit-content}

/* summary */
.sum{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.sum>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;font-size:14.5px;display:flex;flex-direction:column;gap:8px}
.ideas{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.ideas li{position:relative;padding-left:18px}
.ideas>li::before{content:"";position:absolute;left:3px;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--brand)}
.ideas ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.ideas ul li::before{content:"";position:absolute;left:4px;top:.75em;width:7px;height:1.5px;background:var(--muted)}

/* matrix */
.matrix{display:grid;gap:12px}
.mx{display:grid;grid-template-columns:200px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mx-l{padding:16px;background:color-mix(in srgb,var(--c) 9%,var(--surface));display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line)}
.mx-l .i{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--c)}
.mx-l b{font-size:14.5px;line-height:1.35}
.mx-l small{font-size:12.5px;color:var(--muted);line-height:1.35}
.mx-r{padding:14px 18px;display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.mx-r p{display:flex;gap:10px}
.mx-r .lang{flex:0 0 22px;margin-top:4px}

/* answers */
.ans{display:grid;gap:12px}
.an{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:100px}
.an.flash{animation:flash 1.4s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--c)}100%{box-shadow:0 0 0 0 transparent}}
.an-h{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.an-h .no{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--c)}
.an-h .key{font-family:var(--f-mono);font-weight:500;background:var(--ok);color:#fff;border-radius:4px;padding:1px 8px;font-size:13px}
.an-h .t{font-weight:600}
.trace{font-size:14px;border-left:3px solid var(--ochre);background:var(--ochre-soft);padding:9px 12px;border-radius:0 6px 6px 0;font-style:italic}
.trace .lbl{color:var(--ochre)}
.lbl{font-family:var(--f-mono);font-style:normal;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);display:block;margin-bottom:2px}
.expl{font-size:14.5px}
.an-stem{font-size:14px;color:var(--muted);margin-top:-4px}
.para{display:flex;flex-direction:column;gap:6px;font-size:14px}
.para .pr{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:start;background:var(--green-soft);border-radius:6px;padding:7px 10px}
.para .pr i{font-style:normal;color:var(--green);font-weight:700}
.para .pr span:last-child{font-weight:600}
.wrong{display:grid;gap:8px}
.wr{border:1px solid var(--line);border-radius:8px;padding:9px 12px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.wr-h{display:flex;gap:8px;align-items:baseline}
.wr-h b{font-family:var(--f-mono);font-weight:500;color:var(--bad);font-size:13px}
.wr-h span{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--bad) 55%,transparent);color:var(--muted)}
.trap{align-self:flex-start;font-size:12px;font-weight:600;color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);border-radius:4px;padding:2px 8px}
.ln-sub{padding-left:30px;position:relative;font-size:14px}
.ln-sub::before{content:"";position:absolute;left:16px;top:.75em;width:6px;height:1.5px;background:var(--muted)}
.ln-sub b{color:var(--navy-ink)}

/* workflow */
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;position:relative}
.fstep{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;position:relative}
.fstep:not(:last-child)::after{content:"";position:absolute;right:-12px;top:30px;width:10px;height:10px;border-top:2px solid var(--c);border-right:2px solid var(--c);transform:rotate(45deg);z-index:1}
.fstep h5{margin:0;font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.15;text-transform:uppercase}
.fstep h5 span{display:block;font-size:12px;color:var(--c);letter-spacing:.14em}
.fkv{font-size:13.5px;display:flex;flex-direction:column;gap:1px}
.fkv b{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fkv.out{background:var(--green-soft);border-radius:6px;padding:8px 10px}
.fkv.out b{color:var(--green)}
.ba{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.ba>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;font-size:14.5px;display:flex;flex-direction:column;gap:8px}
.ba h5{margin:0;font-size:14px;font-weight:700}

/* vocab */
.vocab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.vc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:9px}
.vc-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.vc-h .vn{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.vc-h h5{margin:0;font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.05}
.ipa{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chips .eq{font-family:var(--f-mono);font-size:12px;color:var(--c);margin-right:2px}
.chip{font-size:12.5px;border:1px solid color-mix(in srgb,var(--green) 45%,var(--line));color:var(--ink);border-radius:999px;padding:1px 9px;background:var(--green-soft)}
.chips .eq{color:var(--green)}
.vc .mean{font-size:14px;font-weight:500}
.vc .ex{font-size:13.5px;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:3px}
.vc .ex i{font-style:italic}

/* 50 pairs */
.pp-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pp-tools input{flex:1;min-width:0;max-width:420px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;font:inherit;font-size:14.5px;color:var(--ink)}
.tbl-w{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th{text-align:left;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--navy);padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;width:52px}
td.t{font-weight:600}
td.p{color:var(--muted)}
td.m{color:var(--vi)}
tbody tr:hover td{background:var(--surface-2)}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:8px;flex-wrap:wrap}
.pager button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 16px;cursor:pointer;min-width:0;max-width:48%;text-align:left}
.pager button:hover{border-color:var(--ink)}
.pager button small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pager button b{font-size:14px}
.pager .next{margin-left:auto;align-items:flex-end;text-align:right}
footer{border-top:1px solid var(--line);padding-block:20px 32px;color:var(--muted);font-size:12.5px}

<script type="application/json" id="src">["CHUYÊN ĐỀ ĐỌC HIỂU TOEIC PART 7: HẠ TẦNG CNTT, VIỄN THÔNG, ĐÁM MÂY SAAS, SLA \u0026 TỰ ĐỘNG HÓA RPA","PHƯƠNG PHÁP FEYNMAN SONG NGỮ, ACTIVE RECALL 5S, TRUY XUẤT CHÉO \u0026 SPACED REPETITION ANKI (9 BÀI ĐOẠN 2 \u0026 3 VĂN BẢN — 45 CÂU HỎI)","==================================================================================================","BÀI THỰC HÀNH SỐ 1: CHUYỂN ĐỔI HỆ THỐNG ERP LÊN ĐÁM MÂY, XUNG ĐỘT LỊCH BÁN HÀNG ĐỊA BÀN \u0026 GIẢI PHÁP LƯU ĐỆM NGOẠI TUYẾN (CLOUD ERP MIGRATION, SCHEDULED DOWNTIME \u0026 OFFLINE CACHING)","Nguồn bài học: ETS TOEIC Part 7 (Triple Passage - Cụm 3 đoạn văn: Memorandum, Follow-up E-mail \u0026 IT Failover Notice, Questions 186-190)","PHẦN 1: NỘI DUNG VĂN BẢN \u0026 DỊCH THUẬT SONG NGỮ","1.1. Đề thi Tiếng Anh gốc (Strategy Guide \u0026 Original ETS Passages)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","Memorandum (Internal Announcement)","MEMORANDUM","To: All Department Heads","From: Ronald Sterling, Chief Information Officer","Date: October 14","Subject: Transition to Apex Cloud ERP System","As part of our enterprise digital transformation initiative, our organization will transition from our legacy on-premise servers to the Apex Cloud ERP platform this coming weekend. The data migration process is scheduled to begin at 9:00 P.M. on Friday, October 18, and conclude by 6:00 A.M. on Monday, October 21.","During this scheduled downtime, access to the central subscriber database, electronic invoice processing module, and internal e-mail servers will be temporarily suspended. Please ensure that all urgent client transactions and billing approvals are finalized and submitted prior to Friday afternoon.","Furthermore, we have scheduled mandatory interactive webinars on Tuesday, October 22, and Wednesday, October 23, to demonstrate the upgraded user interface and automated workflow features.","E-mail (Operational Feedback)","To: Ronald Sterling \u003cr.sterling@vanguardcorp.com\u003e","From: Clara Vance \u003cc.vance@vanguardcorp.com\u003e","Date: October 15","Subject: Scheduled Downtime and Weekend Operations","Dear Mr. Sterling,","Our field sales representatives are scheduled to host a major regional promotional campaign this Saturday, October 19, in Da Nang, where they will interact with hundreds of corporate prospects. Because client onboarding requires real-time credit score validation and instant digital service contract generation, suspending central database access during this critical window poses a severe operational risk.","Could the IT infrastructure team deploy an offline local caching solution on our staff tablets or temporarily postpone the server disconnection for the regional sales partition until Sunday night? Otherwise, our field staff will be forced to collect customer paperwork manually, creating severe administrative backlogs and payment settlement delays next week.","Sincerely,","Clara Vance","Regional Sales Director","Technical Dispatch (Revised Migration Protocol)","IT INFRASTRUCTURE \u0026 CLOUD ENGINEERING DISPATCH","Reference: MIG-2026-10B","Date: October 16","Subject: Revised Migration Window \u0026 Offline Sync Protocol","Following consultation with the Regional Sales Division, the Cloud Engineering Team has modified the weekend migration architecture to prevent revenue disruption:","1. Partition Schedule Adjustment: While the core accounting and HR modules will go offline at 9:00 P.M. on Friday as planned, disconnection of the Regional Sales Partition has been postponed until 11:00 P.M. on Sunday, October 20.","2. Offline Local Caching Patch (v4.1): An encrypted local caching package has been pushed to all field tablets. If mobile connectivity fluctuates in Da Nang, tablets will store encrypted e-KYC profiles and pre-authorized bank direct-debit mandates locally, automatically synchronizing with the Apex Cloud gateway once the migration completes on Monday at 6:00 A.M.","3. Post-Migration Verification: Department heads must sign the User Acceptance Testing (UAT) verification log before 10:00 A.M. on Monday.","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","186","(A) To announce the hiring of a new Chief Information Officer","(B) To inform staff about a planned system upgrade","(C) To request budget approval for server hardware","(D) To cancel an upcoming promotional campaign","187","(A) Register for an external cybersecurity seminar","(B) Ship tablet computers to the Da Nang branch","(C) Complete urgent client transactions","(D) Delete outdated customer records from laptops","188","(A) She will be traveling overseas without laptop access.","(B) Her team will be conducting field sales activities on Saturday.","(C) The Tuesday webinar conflicts with her quarterly budget meeting.","(D) Her department has not received the new tablet devices yet.","189","(A) Staff will have to reenter customer information manually.","(B) The Da Nang promotional event will be permanently canceled.","(C) Clients will be charged double for service activation.","(D) Sales representatives will refuse to work overtime.","190","(A) On Friday at 9:00 P.M.","(B) On Saturday at 6:00 A.M.","(C) On Sunday at 12:00 P.M.","(D) On Sunday at 11:00 P.M.","1.2. Hướng dẫn làm bài Part 7","CHIẾN THUẬT 5 PHÚT TỐI ƯU: QUÉT 3 ĐIỂM CHẠM, GIẢI ĐỦ 5 CÂU HỎI \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Luồng quy trình Đoạn ba (Quỹ đạo Quét chữ Z \u0026 Bộ lọc 3 Câu hỏi Tiềm thức): • Chiến thuật Đoạn Ba (30 giây = 10s x 3 văn bản) — Quy trình Nghiệp vụ 3 Chặng Khép kín:","- Tuyệt đối KHÔNG đọc sâu thân bài; mắt di chuyển theo Quỹ đạo hình chữ Z (Z-Pattern Eye Scan) qua 3 điểm chạm của từng văn bản:","• Văn bản 1 (Memorandum - Thông báo nâng cấp hệ thống):","- Điểm chạm 1 (Nét ngang trên): Tiêu đề \u0027MEMORANDUM - Transition to Apex Cloud ERP Platform\u0027 -\u003e Trả lời Q1: Bản ghi nhớ nội bộ thông báo kế hoạch chuyển đổi nâng cấp máy chủ lên Cloud ERP.","- Điểm chạm 2 (Nét chéo xuống footer): \u0027To: Department Heads | From: Ronald Sterling, Chief Information Officer\u0027 -\u003e Trả lời Q2: Giám đốc CNTT (CIO) chỉ đạo toàn thể các trưởng bộ phận.","- Điểm chạm 3 (Nét móc neo hai đầu): Thời gian bảo trì (\u0027scheduled maintenance downtime from Friday 21:00 to Monday 06:00\u0027) \u0026 việc cần làm (\u0027complete all urgent client transactions before Friday 15:00\u0027) -\u003e Trả lời Q3: Cắt mạng cuối tuần để chuyển hệ thống; yêu cầu chốt các giao dịch khách hàng khẩn trước chiều thứ Sáu.","• Văn bản 2 (E-mail - Phản hồi bất cập nghiệp vụ):","- Điểm chạm 1 (Nét ngang trên): Dòng \u0027Subject: Scheduled Downtime and Weekend Operations\u0027 -\u003e Trả lời Q1: Email lo ngại về xung đột lịch bảo trì với hoạt động bán hàng thực địa.","- Điểm chạm 2 (Nét chéo xuống footer): \u0027From: Clara Vance, Regional Sales Director\u0027 gửi \u0027Ronald Sterling, CIO\u0027 -\u003e Trả lời Q2: Giám đốc kinh doanh phản ánh bất cập lên Giám đốc CNTT.","- Điểm chạm 3 (Nét móc neo hai đầu): Xung đột (\u0027field sales reps have client demos all Saturday\u0027) \u0026 nguy cơ (\u0027without database access, staff must reenter customer data manually\u0027) -\u003e Trả lời Q3: Đội kinh doanh đi thị trường thứ Bảy; nếu mất mạng sẽ phải ghi giấy và tốn hàng giờ nhập tay lại.","• Văn bản 3 (Technical Dispatch - Điều phối kỹ thuật điều chỉnh):","- Điểm chạm 1 (Nét ngang trên): Tiêu đề \u0027IT TECHNICAL DISPATCH - Partition 4 Maintenance Rescheduling\u0027 -\u003e Trả lời Q1: Thông báo kỹ thuật điều chỉnh lịch ngắt phân vùng máy chủ và giao thức ngoại tuyến.","- Điểm chạm 2 (Nét chéo xuống footer): Bộ phận Vận hành Hạ tầng Đám mây (Cloud Infrastructure Team) ban hành -\u003e Trả lời Q2: Đội ngũ kỹ sư IT đưa ra giải pháp tháo gỡ cho khối kinh doanh.","- Điểm chạm 3 (Nét móc neo hai đầu): Phương án linh hoạt (\u0027Partition 4 Sales database remains active in read-only mode until Sunday 23:00\u0027) \u0026 giải pháp dự phòng (\u0027offline local caching enabled\u0027) -\u003e Trả lời Q3: Lùi giờ ngắt phân vùng bán hàng sang 23:00 Chủ Nhật và bật tính năng lưu đệm ngoại tuyến.","• Quy trình nghiệp vụ 3 chặng khép kín: Khởi phát (Memo IT: Cắt mạng từ tối thứ Sáu để nâng cấp Cloud) -\u003e Xung đột (Email Sales: Đội kinh doanh đi thị trường thứ Bảy, nguy cơ phải nhập tay lại) -\u003e Giải pháp (Dispatch IT: Lùi giờ ngắt phân vùng bán hàng sang 23h Chủ nhật).","=\u003e Chốt luồng sự việc sau 30s: Lịch bảo trì nâng cấp Cloud cuối tuần của IT gây nguy cơ gián đoạn bán hàng thứ Bảy khiến nhân viên phải nhập tay lại, nên IT đã điều chỉnh lùi giờ cắt phân vùng bán hàng sang đêm Chủ nhật.","Bước 2 (20 giây) - Quét nhanh 5 câu hỏi \u0026 Phân loại (Chỉ đọc câu hỏi, KHÔNG đọc 4 đáp án A, B, C, D): • Nguyên tắc đọc Bước 2 (3-4 giây/câu): Lướt nhanh 5 câu hỏi trước để gắn \u00275 móc từ khóa\u0027 vào bộ nhớ tạm; TUYỆT ĐỐI CHỈ ĐỌC CÂU HỎI, KHÔNG ĐỌC 4 ĐÁP ÁN (A, B, C, D) để tránh nhiễu:","• Q186: Thấy \u0027primary purpose of the memorandum\u0027 -\u003e Câu hỏi Mục đích ở Văn bản 1 (Móc: mục đích Memo).","• Q187: Thấy \u0027instructed to do before Friday afternoon\u0027 -\u003e Câu hỏi Chi tiết thời gian ở Văn bản 1 (Móc: việc phải làm trước chiều thứ Sáu).","• Q188: Thấy \u0027Why is Ms. Vance concerned\u0027 -\u003e Câu ghép nối Văn bản 1 + 2 (Móc: lý do bà Vance lo lắng về lịch bảo trì).","• Q189: Thấy \u0027What will happen if database access is not provided\u0027 -\u003e Câu Chi tiết hệ quả ở Văn bản 2 (Móc: hậu quả nếu mất kết nối CSDL).","• Q190: Thấy \u0027According to the IT dispatch, when will the regional sales partition be disconnected\u0027 -\u003e Câu ghép nối Văn bản 2 + 3 (Móc: thời điểm mới ngắt phân vùng bán hàng).","Bước 3 (3 phút 45 giây) - Cách trả lời \u0026 Dấu hiệu tìm nhanh nhất cho đủ 5 câu hỏi (Giải cuốn chiếu \u0026 Chốt đáp án từng câu): • Q186 (Câu hỏi Mục đích - 20s): [Dấu hiệu tìm nhanh nhất]: Nhìn dòng \u0027Subject: Transition to Apex Cloud ERP System\u0027 và câu 1 Memo (\u0027transition from our legacy on-premise servers to the Apex Cloud platform\u0027) =\u003e Thông báo kế hoạch nâng cấp hệ thống (\u0027inform staff about a planned system upgrade\u0027) =\u003e Chọn (B).","• Q187 (Câu hỏi Chi tiết - 25s): [Dấu hiệu tìm nhanh nhất]: Quét tìm cụm \u0027prior to Friday afternoon\u0027 ở đoạn 2 Memo: \u0027ensure that all urgent client transactions are finalized and submitted prior to Friday afternoon\u0027 =\u003e Hoàn tất các giao dịch khách hàng khẩn cấp (\u0027Complete urgent client transactions\u0027) =\u003e Chọn (C).","• Q188 (Câu ghép nối Văn bản 1 + 2 - 45s): [Dấu hiệu tìm nhanh nhất]: Ghép Dữ kiện 1 (Memo báo cắt hệ thống từ tối thứ Sáu đến sáng thứ Hai) + Dữ kiện 2 (Email bà Vance: \u0027host a regional promotional campaign this Saturday in Da Nang\u0027) =\u003e Đội ngũ của bà có hoạt động bán hàng thực địa vào thứ Bảy =\u003e Chọn (B).","• Q189 (Câu hỏi Chi tiết suy luận - 35s): [Dấu hiệu tìm nhanh nhất]: Đọc câu cuối Email bà Vance: \u0027Otherwise, our field staff will be forced to collect customer paperwork manually, creating severe administrative backlogs\u0027 =\u003e Nhân viên phải thu thập giấy tờ và nhập lại dữ liệu thủ công (\u0027reenter customer information manually\u0027) =\u003e Chọn (A).","• Q190 (Câu ghép nối Văn bản 2 + 3 - 50s): [Dấu hiệu tìm nhanh nhất]: Ở Email 2, bà Vance đề xuất hoãn ngắt phân vùng bán hàng đến \u0027Sunday midnight\u0027. Gióng sang Văn bản 3 mục \u0027Partition Schedule Adjustment\u0027: \u0027disconnection of the Regional Sales Partition has been postponed until 11:00 P.M. on Sunday, October 20\u0027 =\u003e Lúc 11 giờ đêm Chủ nhật =\u003e Chọn (D).","Bước 4 (25 giây cuối giờ thi + Củng cố sau giờ thi) - Kiểm tra khóa đáp án \u0026 Đúc kết Feynman 1 câu: • [Trong 5 phút làm bài - 25 giây cuối]: Rà nhanh các cặp từ đồng nghĩa (finalized = complete; collect paperwork manually = reenter manually; postponed until 11:00 P.M. Sunday) và khóa sổ 5 đáp án B - C - B - A - D.","• [Sau khi làm bài - Củng cố kiến thức dài hạn bằng Feynman]: Tự đúc kết bản chất cả bài thành 1 câu tiếng Việt đời thường: \u0027IT định cắt mạng cả cuối tuần để chuyển máy chủ lên mây nhưng trùng lịch bán hàng thứ Bảy ở Đà Nẵng, nên phải lùi giờ cắt phân vùng bán hàng sang 11h đêm Chủ nhật và bật chế độ lưu tạm ngoại tuyến.\u0027","1.3. Dịch Song ngữ Xen kẽ Từng Câu (Sentence-by-Sentence Translation)","Văn bản 1: Bản ghi nhớ nội bộ về việc chuyển đổi hệ thống ERP (Internal Memorandum)","MEMORANDUM","To: All Department Heads","From: Ronald Sterling, Chief Information Officer","Date: October 14","Subject: Transition to Apex Cloud ERP System","BẢN GHI NHỚ NỘI BỘ","Người nhận: Toàn thể Trưởng các bộ phận","Người gửi: Ronald Sterling, Giám đốc Công nghệ Thông tin (CIO)","Ngày: 14 tháng 10","Tiêu đề: Chuyển đổi sang Hệ thống Hoạch định Nguồn lực Doanh nghiệp Đám mây (Apex Cloud ERP)","As part of our enterprise digital transformation initiative, our organization will transition from our legacy on-premise servers to the Apex Cloud ERP platform this coming weekend.","Nằm trong chiến lược chuyển đổi số toàn doanh nghiệp, tổ chức của chúng ta sẽ thực hiện chuyển đổi từ hệ thống máy chủ vật lý tại chỗ (on-premise) cũ sang nền tảng đám mây Apex Cloud ERP vào dịp cuối tuần này.","The data migration process is scheduled to begin at 9:00 P.M. on Friday, October 18, and conclude by 6:00 A.M. on Monday, October 21.","Quá trình di chuyển dữ liệu (data migration) được lên lịch bắt đầu vào lúc 9:00 tối thứ Sáu, ngày 18 tháng 10, và hoàn tất trước 6:00 sáng thứ Hai, ngày 21 tháng 10.","During this scheduled downtime, access to the central subscriber database, electronic invoice processing module, and internal e-mail servers will be temporarily suspended.","Trong suốt khoảng thời gian ngừng hoạt động theo lịch trình này, quyền truy cập vào cơ sở dữ liệu thuê bao trung tâm, phân hệ xử lý hóa đơn điện tử và máy chủ thư điện tử nội bộ sẽ bị tạm ngưng.","Please ensure that all urgent client transactions and billing approvals are finalized and submitted prior to Friday afternoon.","Đề nghị các bộ phận đảm bảo toàn bộ các giao dịch khách hàng khẩn cấp và phê duyệt thanh toán phải được hoàn tất và gửi đi trước chiều thứ Sáu.","Furthermore, we have scheduled mandatory interactive webinars on Tuesday, October 22, and Wednesday, October 23, to demonstrate the upgraded user interface and automated workflow features.","Thêm vào đó, chúng tôi đã lên lịch các buổi hội thảo đào tạo trực tuyến bắt buộc vào thứ Ba (22/10) và thứ Tư (23/10) nhằm hướng dẫn trực quan giao diện người dùng mới cùng các tính năng luồng công việc tự động.","Văn bản 2: Thư điện tử phản hồi từ Giám đốc Bán hàng Khu vực (Operational E-mail)","E-mail","To: Ronald Sterling \u003cr.sterling@vanguardcorp.com\u003e","From: Clara Vance \u003cc.vance@vanguardcorp.com\u003e","Date: October 15","Subject: Scheduled Downtime and Weekend Operations","Thư điện tử","Người nhận: Ronald Sterling \u003cr.sterling@vanguardcorp.com\u003e","Người gửi: Clara Vance \u003cc.vance@vanguardcorp.com\u003e","Ngày: 15 tháng 10","Tiêu đề: Thời gian Ngừng Hệ thống theo Lịch trình và Hoạt động Kinh doanh Cuối tuần","Dear Mr. Sterling,","Kính gửi ông Sterling,","Our field sales representatives are scheduled to host a major regional promotional campaign this Saturday, October 19, in Da Nang, where they will interact with hundreds of corporate prospects.","Đội ngũ nhân viên kinh doanh địa bàn của chúng tôi đã được lên lịch tổ chức một chiến dịch xúc tiến bán hàng khu vực trọng điểm vào thứ Bảy tuần này, ngày 19 tháng 10 tại Đà Nẵng, nơi họ sẽ tiếp xúc trực tiếp với hàng trăm khách hàng doanh nghiệp tiềm năng.","Because client onboarding requires real-time credit score validation and instant digital service contract generation, suspending central database access during this critical window poses a severe operational risk.","Bởi vì quy trình hòa mạng đón khách hàng mới đòi hỏi phải xác thực điểm tín dụng theo thời gian thực và khởi tạo hợp đồng dịch vụ điện tử tức thời, nên việc tạm ngưng quyền truy cập cơ sở dữ liệu trung tâm trong khung giờ then chốt này gây ra rủi ro vận hành vô cùng nghiêm trọng.","Could the IT infrastructure team deploy an offline local caching solution on our staff tablets or temporarily postpone the server disconnection for the regional sales partition until Sunday night?","Liệu đội ngũ hạ tầng CNTT có thể triển khai giải pháp lưu trữ bộ đệm cục bộ ngoại tuyến (offline local caching) trên máy tính bảng của nhân viên, hoặc tạm thời lùi thời điểm ngắt kết nối máy chủ đối với phân vùng bán hàng khu vực đến tối Chủ nhật được không?","Otherwise, our field staff will be forced to collect customer paperwork manually, creating severe administrative backlogs and payment settlement delays next week.","Nếu không, nhân viên hiện trường của chúng tôi sẽ buộc phải thu thập hồ sơ giấy tờ của khách hàng một cách thủ công, gây ra tình trạng ùn tắc hành chính nghiêm trọng và chậm trễ đối soát thanh toán vào tuần tới.","Sincerely,","Clara Vance | Regional Sales Director","Trân trọng,","Clara Vance | Giám đốc Bán hàng Khu vực","Văn bản 3: Thông báo Điều chỉnh Kỹ thuật từ Đội Hạ tầng Đám mây (Technical Dispatch)","IT INFRASTRUCTURE \u0026 CLOUD ENGINEERING DISPATCH","Reference: MIG-2026-10B","Date: October 16","Subject: Revised Migration Window \u0026 Offline Sync Protocol","THÔNG BÁO ĐIỀU PHỐI HẠ TẦNG CNTT \u0026 KỸ THUẬT ĐÁM MÂY","Số tham chiếu: MIG-2026-10B","Ngày: 16 tháng 10","Tiêu đề: Khung giờ Di chuyển Dữ liệu Điều chỉnh \u0026 Giao thức Đồng bộ Ngoại tuyến","Following consultation with the Regional Sales Division, the Cloud Engineering Team has modified the weekend migration architecture to prevent revenue disruption:","Sau buổi làm việc thống nhất với Khối Bán hàng Khu vực, Đội ngũ Kỹ thuật Đám mây đã điều chỉnh kiến trúc di chuyển dữ liệu cuối tuần nhằm ngăn chặn nguy cơ đứt gãy doanh thu:","1. Partition Schedule Adjustment: While the core accounting and HR modules will go offline at 9:00 P.M. on Friday as planned, disconnection of the Regional Sales Partition has been postponed until 11:00 P.M. on Sunday, October 20.","1. Điều chỉnh Lịch trình Phân vùng: Trong khi các phân hệ Kế toán lõi và Nhân sự vẫn sẽ ngừng hoạt động lúc 9:00 tối thứ Sáu theo đúng kế hoạch, việc ngắt kết nối Phân vùng Bán hàng Khu vực được lùi lại đến 11:00 đêm Chủ nhật, ngày 20 tháng 10.","2. Offline Local Caching Patch (v4.1): An encrypted local caching package has been pushed to all field tablets.","2. Bản cập nhật Bộ đệm Cục bộ Ngoại tuyến (v4.1): Một gói lưu trữ đệm cục bộ được mã hóa đã được đẩy tự động xuống toàn bộ máy tính bảng hiện trường.","If mobile connectivity fluctuates in Da Nang, tablets will store encrypted e-KYC profiles and pre-authorized bank direct-debit mandates locally, automatically synchronizing with the Apex Cloud gateway once the migration completes on Monday at 6:00 A.M.","Nếu kết nối mạng di động tại Đà Nẵng chập chờn, máy tính bảng sẽ lưu trữ cục bộ hồ sơ định danh điện tử (e-KYC) đã mã hóa cùng lệnh ủy nhiệm thu ngân hàng được cấp phép trước, sau đó tự động đồng bộ lên cổng Apex Cloud ngay khi quá trình chuyển đổi hoàn tất vào 6:00 sáng thứ Hai.","3. Post-Migration Verification: Department heads must sign the User Acceptance Testing (UAT) verification log before 10:00 A.M. on Monday.","3. Xác nhận Sau Chuyển đổi: Trưởng các bộ phận bắt buộc phải ký biên bản xác nhận Kiểm thử Nghiệm thu Người dùng (UAT) trước 10:00 sáng thứ Hai.","1.4. Dịch chi tiết Câu hỏi \u0026 Phương án Trắc nghiệm","186. Mục đích chính của bản ghi nhớ nội bộ là gì?","(A) Để thông báo về việc tuyển dụng Giám đốc Công nghệ Thông tin mới","(B) Để thông báo cho nhân viên về kế hoạch nâng cấp chuyển đổi hệ thống","(C) Để yêu cầu phê duyệt ngân sách mua sắm phần cứng máy chủ","(D) Để hủy bỏ một chiến dịch xúc tiến bán hàng sắp diễn ra","187. Trưởng các bộ phận được hướng dẫn làm việc gì trước chiều thứ Sáu?","(A) Đăng ký tham gia hội thảo an ninh mạng bên ngoài","(B) Vận chuyển máy tính bảng tới chi nhánh Đà Nẵng","(C) Hoàn tất các giao dịch khách hàng khẩn cấp","(D) Xóa các hồ sơ khách hàng lỗi thời khỏi máy tính xách tay","188. Tại sao bà Vance lại lo ngại về lịch bảo trì hệ thống đã định?","(A) Bà ấy sẽ đi công tác nước ngoài mà không có quyền truy cập máy tính.","(B) Đội ngũ của bà sẽ triển khai các hoạt động bán hàng thực địa vào ngày thứ Bảy.","(C) Buổi hội thảo trực tuyến ngày thứ Ba bị trùng lịch họp ngân sách quý của bà.","(D) Bộ phận của bà vẫn chưa nhận được các thiết bị máy tính bảng mới.","189. Bà Vance hàm ý điều gì sẽ xảy ra nếu quyền truy cập cơ sở dữ liệu không được cung cấp?","(A) Nhân viên sẽ phải nhập lại thông tin hồ sơ khách hàng một cách thủ công.","(B) Sự kiện xúc tiến bán hàng tại Đà Nẵng sẽ bị hủy bỏ vĩnh viễn.","(C) Khách hàng sẽ bị tính phí gấp đôi khi kích hoạt dịch vụ.","(D) Nhân viên kinh doanh sẽ từ chối làm thêm giờ.","190. Theo thông báo điều phối kỹ thuật, khi nào phân vùng bán hàng khu vực sẽ bị ngắt kết nối?","(A) Vào lúc 9:00 tối thứ Sáu","(B) Vào lúc 6:00 sáng thứ Bảy","(C) Vào lúc 12:00 trưa Chủ nhật","(D) Vào lúc 11:00 đêm Chủ nhật","1.5. Tóm tắt Viết lại Toàn bài theo Feynman (Feynman Monograph Summary)","English Executive Summary:","• CIO Ronald Sterling issues a company-wide memorandum announcing a weekend migration from legacy on-premise servers to the Apex Cloud ERP platform, scheduling full system downtime from Friday at 9:00 P.M. until Monday at 6:00 A.M.","• Regional Sales Director Clara Vance immediately raises an operational concern: her field sales team is hosting a major corporate sales campaign in Da Nang on Saturday, which requires real-time credit checks and digital contract generation.","• To prevent manual paperwork backlogs, the Cloud Engineering Team modifies the rollout plan, postponing the Regional Sales Partition disconnection until Sunday at 11:00 P.M. and deploying an encrypted offline caching patch (v4.1) on staff tablets.","Bản tóm tắt Tiếng Việt cốt lõi:","• Giám đốc CNTT (CIO) Ronald Sterling ban hành bản ghi nhớ toàn công ty thông báo kế hoạch chuyển đổi từ máy chủ vật lý cũ lên nền tảng đám mây Apex Cloud ERP vào cuối tuần, dự kiến tạm ngưng hệ thống từ 21:00 thứ Sáu đến 06:00 sáng thứ Hai.","• Giám đốc Bán hàng khu vực Clara Vance lập tức phản hồi lo ngại: đội ngũ kinh doanh địa bàn sẽ tổ chức chiến dịch bán hàng doanh nghiệp lớn tại Đà Nẵng vào thứ Bảy, đòi hỏi phải chấm điểm tín dụng và tạo hợp đồng điện tử theo thời gian thực.","• Để ngăn chặn ùn tắc hồ sơ giấy thủ công, Đội Kỹ thuật Đám mây đã điều chỉnh kiến trúc chuyển đổi, lùi giờ ngắt phân vùng bán hàng sang 23:00 Chủ nhật và cài đặt bản vá lưu đệm ngoại tuyến mã hóa (v4.1) trên máy tính bảng.","PHẦN 2: ACTIVE RECALL 5 GIÂY (BẢNG MA TRẬN ĐỊNH VỊ SONG NGỮ)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["Đối tượng \u0026 Vai trò: Ronald Sterling (Giám đốc CNTT - CIO chủ trì chuyển đổi Cloud ERP) \u003c-\u003e Clara Vance (Giám đốc Bán hàng Khu vực bảo vệ hoạt động kinh doanh hiện trường Đà Nẵng) \u003c-\u003e Đội Kỹ thuật Đám mây (Thiết kế kiến trúc phân vùng \u0026 bộ đệm ngoại tuyến).","Stakeholders \u0026 Roles: Ronald Sterling (CIO leading the Cloud ERP migration) \u003c-\u003e Clara Vance (Regional Sales Director safeguarding Da Nang field sales) \u003c-\u003e Cloud Engineering Team (Architecting partition isolation and offline caching)."]],[["2. Boi canh \u0026 Quy trinh loi"],["Bối cảnh \u0026 Quy trình lõi: Xung đột kinh điển giữa Quản trị Thay đổi Hạ tầng CNTT (Scheduled Maintenance Downtime) và Tính liên tục Kinh doanh (Business Continuity). Giải quyết bằng kỹ thuật tách phân vùng (Partitioning) và đồng bộ bộ đệm ngoại tuyến (Offline Caching Sync).","Business Context \u0026 Core Flow: Classic friction between IT Infrastructure Change Management (Scheduled Downtime) and Commercial Business Continuity. Resolved via database partitioning and encrypted offline local caching synchronization."]],[["3. Dau vet suy luan cheo"],["Dấu vết suy luận chéo then chốt: Memo 1 ấn định cắt toàn bộ máy chủ từ 21:00 thứ Sáu -\u003e Email 2 cảnh báo chiến dịch Đà Nẵng diễn ra ngày thứ Bảy và xin lùi đến đêm Chủ nhật -\u003e Thông báo 3 chốt lùi riêng Phân vùng Bán hàng đến 23:00 Chủ nhật (20/10).","Key Cross-Referencing Clues: Memo 1 sets full server cutoff for Friday 9:00 P.M. -\u003e Email 2 flags Saturday\u0027s Da Nang campaign and requests postponement until Sunday night -\u003e Dispatch 3 confirms Regional Sales Partition cutoff is moved to Sunday 11:00 P.M."]]],"t":"table"},"PHẦN 3: ĐÁP ÁN CHUẨN XÁC \u0026 DẤU VẾT TRUY XUẤT CHÉO","186. What is the primary purpose of the memorandum?","Dap an dung: (B) To inform staff about a planned system upgrade","[Dau vet bai doc / Clue]: Memorandum, Đoạn 1: \u0027As part of our enterprise digital transformation initiative, our organization will transition from our legacy on-premise servers to the Apex Cloud ERP platform this coming weekend.\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027transition from our legacy on-premise servers to the Apex Cloud ERP platform\u0027 \u003c-\u003e \u0027a planned system upgrade\u0027","• \u0027digital transformation initiative\u0027 \u003c-\u003e \u0027system upgrade\u0027","[Loi giai chi tiet]: Mục đích cốt lõi của bản ghi nhớ là thông báo kế hoạch chuyển đổi/nâng cấp từ hệ thống máy chủ vật lý cũ sang nền tảng đám mây Apex Cloud ERP vào dịp cuối tuần.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) To announce the hiring of a new Chief Information Officer","- Ly do sai: Văn bản do Giám đốc CNTT hiện tại ban hành để chỉ đạo kỹ thuật, không phải thông báo bổ nhiệm nhân sự lãnh đạo mới.","- Bay ETS: Bẫy Bổ nhiệm Nhân sự Thượng tầng (Executive Hiring Distractor Trap)","(C) To request budget approval for server hardware","- Ly do sai: Hệ thống đang bỏ máy chủ vật lý để chuyển lên điện toán đám mây SaaS; không có yêu cầu phê duyệt ngân sách mua phần cứng.","- Bay ETS: Bẫy Ngân sách Phần cứng Trái ngược (Hardware Budget Reverse Trap)","(D) To cancel an upcoming promotional campaign","- Ly do sai: Nội dung thuần túy về hạ tầng CNTT, không liên quan đến việc hủy bỏ chiến dịch tiếp thị hay khuyến mại.","- Bay ETS: Bẫy Hoạt động Tiếp thị Lạc đề (Marketing Cancellation Trap)","187. What are department heads instructed to do before Friday afternoon?","Dap an dung: (C) Complete urgent client transactions","[Dau vet bai doc / Clue]: Memorandum, Đoạn 2: \u0027Department heads must ensure that all pending invoices and mission-critical customer transactions are fully posted to the database no later than 3:00 P.M. on Friday.\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027pending invoices and mission-critical customer transactions are fully posted\u0027 \u003c-\u003e \u0027Complete urgent client transactions\u0027","[Loi giai chi tiet]: Trưởng các bộ phận được chỉ đạo phải hoàn tất và chốt toàn bộ các hóa đơn tồn đọng cùng các giao dịch trọng yếu của khách hàng lên hệ thống trước 15:00 chiều thứ Sáu.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Back up local hard drives to external USB sticks","- Ly do sai: Nhân viên IT sẽ sao lưu dữ liệu tập trung qua mạng, không yêu cầu các sếp phòng ban tự sao lưu ra ổ USB cá nhân.","- Bay ETS: Bẫy Thao tác Thủ công Lạc hậu (Manual Backup Distractor Trap)","(B) Disconnect all office desktop computers physically","- Ly do sai: Hệ thống cắt kết nối logic ở tầng máy chủ, không bắt nhân viên rút dây nguồn máy tính vật lý tại văn phòng.","- Bay ETS: Bẫy Hành vi Vật lý Không cần thiết (Physical Disconnection Trap)","(D) Submit vacation requests for the following month","- Ly do sai: Văn bản không đề cập đến việc nộp đơn xin nghỉ phép tháng tới.","- Bay ETS: Bẫy Nhân sự Không liên quan (Irrelevant HR Request Trap)","188. Why is Ms. Vance concerned about the scheduled maintenance?","Dap an dung: (B) Her team will be conducting field sales activities on Saturday.","[Dau vet bai doc / Clue]: Email từ Ms. Vance: \u0027...our regional enterprise sales representatives have scheduled on-site client demonstrations and contractual negotiations across the tri-state area throughout Saturday...\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027scheduled on-site client demonstrations throughout Saturday\u0027 \u003c-\u003e \u0027Her team will be conducting field sales activities on Saturday\u0027","[Loi giai chi tiet]: Bà Vance bày tỏ lo ngại vì đội ngũ kinh doanh dự án của bà đã lên lịch trình diễn sản phẩm và đàm phán hợp đồng trực tiếp tại trụ sở khách hàng trong suốt ngày thứ Bảy, cần truy cập dữ liệu để báo giá.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) She has lost her administrator password credentials","- Ly do sai: Bà không bị mất mật khẩu; bà lo lắng về việc toàn bộ hệ thống bị ngắt mạng trong lúc nhân viên đi thị trường.","- Bay ETS: Bẫy Sự cố Cá nhân Hư cấu (Password Loss Falsehood Trap)","(C) Her department\u0027s computers were damaged in a power surge","- Ly do sai: Không có sự cố sốc điện làm hỏng máy tính; các thiết bị vẫn hoạt động bình thường.","- Bay ETS: Bẫy Hư hỏng Thiết bị Bịa đặt (Power Surge Distractor Trap)","(D) She was not invited to the executive briefing session","- Ly do sai: Bà nhận được bản ghi nhớ thông báo chung và đang chủ động phản hồi về bất cập nghiệp vụ.","- Bay ETS: Bẫy Tự ái Hành chính Không có thật (Meeting Exclusion Trap)","189. What does Ms. Vance imply will happen if database access is not provided?","Dap an dung: (A) Staff will have to reenter customer information manually.","[Dau vet bai doc / Clue]: Email từ Ms. Vance: \u0027Without read-only access to customer inventory records, our reps will have to record order commitments on paper order forms and spend hours manually transcribing them once the network returns.\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027record commitments on paper and spend hours manually transcribing them\u0027 \u003c-\u003e \u0027Staff will have to reenter customer information manually\u0027","[Loi giai chi tiet]: Bà Vance ám chỉ rằng nếu không được cấp quyền truy cập dữ liệu tối thiểu, nhân viên bán hàng sẽ buộc phải ghi đơn đặt hàng ra giấy và tốn hàng giờ nhập liệu thủ công lại vào máy tính khi hệ thống hoạt động trở lại.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(B) Key enterprise clients will cancel their contracts","- Ly do sai: Bà lo ngại hiệu suất làm việc bị chậm trễ và tốn công sức nhập liệu, chưa đến mức khách hủy bỏ toàn bộ hợp đồng.","- Bay ETS: Bẫy Cường điệu Hậu quả Hợp đồng (Contract Cancellation Overstatement)","(C) The company will be subjected to regulatory tax penalties","- Ly do sai: Đây là dữ liệu bán hàng nội bộ, không liên quan đến việc bị cơ quan thuế xử phạt hành chính.","- Bay ETS: Bẫy Xử phạt Pháp lý Lạc đề (Regulatory Penalty Trap)","(D) Sales representatives will stage an immediate walkout","- Ly do sai: Không có đe dọa bãi công hay bỏ việc; các đại diện bán hàng vẫn nỗ lực phục vụ khách hàng.","- Bay ETS: Bẫy Tranh chấp Lao động Bịa đặt (Labor Walkout Distractor Trap)","190. According to the technical dispatch, when will the regional sales partition be disconnected?","Dap an dung: (D) On Sunday at 11:00 P.M.","[Dau vet bai doc / Clue]: Technical Dispatch (Văn bản 3): \u0027To accommodate Regional Sales operations, Partition 4 (Sales \u0026 CRM database) will remain in read-only standby mode until Sunday, 11:00 P.M., when final cloud data synchronization commences.\u0027","[Dien dat tuong duong / Paraphrase]: • \u0027Partition 4 (Sales \u0026 CRM) will remain in read-only standby mode until Sunday, 11:00 P.M.\u0027 \u003c-\u003e \u0027On Sunday at 11:00 P.M.\u0027","[Loi giai chi tiet]: Văn bản điều phối kỹ thuật số 3 xác nhận để hỗ trợ bộ phận kinh doanh, phân vùng dữ liệu CRM bán hàng sẽ được duy trì hoạt động chế độ chỉ đọc xuyên suốt thứ Bảy và chỉ chính thức ngắt kết nối vào 23:00 Chủ Nhật.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) On Friday at 5:00 P.M.","- Ly do sai: 17:00 chiều thứ Sáu là thời điểm ngắt các phân vùng kế toán và nhân sự thông thường, phân vùng bán hàng được hoãn lại.","- Bay ETS: Bẫy Mốc Khởi điểm Ban đầu (Standard Partition Deadline Trap)","(B) On Saturday at 8:00 A.M.","- Ly do sai: 8:00 sáng thứ Bảy là lúc nhân viên kinh doanh bắt đầu đi gặp khách hàng ngoài thị trường.","- Bay ETS: Bẫy Thời điểm Bắt đầu Hoạt động (Activity Start Time Trap)","(C) On Sunday at noon","- Ly do sai: Trưa Chủ Nhật hệ thống CRM vẫn đang mở cho nhân viên truy vấn, chưa ngắt kết nối.","- Bay ETS: Bẫy Mốc Thời gian Giữa chặng (Midday Distractor Trap)","PHẦN 4: KỸ THUẬT FEYNMAN SONG NGỮ \u0026 SƠ ĐỒ QUY TRÌNH (TƯ DUY PHÂN TÍCH NGHIỆP VỤ CHUỖI CUNG ỨNG \u0026 BA)","4.1. Sơ đồ Quy trình Luân chuyển Nghiệp vụ (End-to-End Cloud Migration \u0026 Banking Settlement Workflow)","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","LẬP LỊCH CHUYỂN ĐỔI CLOUD ERP \u0026 CHỐT GIAO DỊCH TRƯỚC GIỜ CẮT MẠNG"],[],["BƯỚC 2","BÁN HÀNG HIỆN TRƯỜNG QUA BỘ ĐỆM MÃ HÓA \u0026 ỦY NHIỆM THU NGÂN HÀNG"],[],["BƯỚC 3","ĐỒNG BỘ ĐÁM MÂY, NGHIỆM THU UAT \u0026 GIẢI NGÂN ĐỐI SOÁT NGÂN HÀNG"]],[["• Chung tu \u0026 Kenh: Bản ghi nhớ CIO (Memorandum), Hệ thống On-Premise \u0026 Cổng Thanh toán","• Nghiep vu thuc thi: Khóa sổ toàn bộ giao dịch khẩn và lệnh thanh toán trước chiều thứ Sáu; tách biệt phân vùng Kế toán/HR (cắt 21:00 thứ Sáu) và phân vùng Bán hàng (lùi tới 23:00 Chủ nhật).","• Ket qua \u0026 Kiem soat: Bảo toàn dữ liệu gốc trước khi di chuyển lên đám mây Apex Cloud"],["➔"],["• Chung tu \u0026 Kenh: Máy tính bảng (Offline Cache v4.1), Hồ sơ e-KYC \u0026 Cổng Tín dụng Ngân hàng","• Nghiep vu thuc thi: Nhân viên tại Đà Nẵng chấm điểm tín dụng, ký hợp đồng số và lưu tạm lệnh Ủy nhiệm thu Ngân hàng (Direct-Debit Mandate) đã mã hóa ngay trên bộ nhớ đệm máy tính bảng.","• Ket qua \u0026 Kiem soat: Không gián đoạn bán hàng thứ Bảy; loại bỏ 100% hồ sơ giấy thủ công"],["➔"],["• Chung tu \u0026 Kenh: Cổng Apex Cloud ERP, Biên bản Nghiệm thu UAT \u0026 Liên Ngân hàng (ACH)","• Nghiep vu thuc thi: 06:00 sáng thứ Hai hệ thống Cloud mở lại, tự động đồng bộ toàn bộ hợp đồng từ tablet lên máy chủ, đẩy lệnh khấu trừ tự động sang Ngân hàng khách hàng và ký nghiệm thu UAT trước 10:00.","• Ket qua \u0026 Kiem soat: Hoàn tất chuyển đổi số, hạch toán doanh thu và thu tiền đúng hạn"]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["STEP 1","CLOUD ERP MIGRATION SCHEDULING \u0026 PRE-CUTOVER TRANSACTION FREEZE"],[],["STEP 2","FIELD SALES CONTINUITY VIA ENCRYPTED OFFLINE CACHING \u0026 DEBIT MANDATES"],[],["STEP 3","CLOUD SYNCHRONIZATION, UAT SIGN-OFF \u0026 ACH SETTLEMENT RELEASE"]],[["• Documents \u0026 Channels: CIO Executive Memorandum, Legacy On-Premise Servers \u0026 Payment Gateway","• Core Business Execution: Freeze all pending transactions and wire payment queues prior to Friday afternoon; partition maintenance window: Accounting/HR cut over Friday 9:00 PM, while Field Sales window is deferred until Sunday 11:00 PM.","• Key Deliverable \u0026 Control: Full integrity of baseline enterprise data preserved prior to Apex Cloud ERP cutover"],["➔"],["• Documents \u0026 Channels: Enterprise Field Tablets (Offline Cache v4.1), e-KYC Forms \u0026 Bank Direct-Debit Mandates","• Core Business Execution: Field sales representatives in Da Nang evaluate customer credit scores, capture biometric digital signatures, and cache encrypted electronic direct-debit mandates locally on mobile hardware.","• Key Deliverable \u0026 Control: Zero interruption to weekend sales operations; 100% elimination of manual paper contracts"],["➔"],["• Documents \u0026 Channels: Apex Cloud ERP Portal, User Acceptance Testing (UAT) Sign-Off \u0026 Interbank ACH Network","• Core Business Execution: Cloud systems reopen Monday at 6:00 AM; automated pipelines sync cached tablet contracts to central databases, batch direct-debit instructions to customer banks, and conclude formal UAT approval by 10:00 AM.","• Key Deliverable \u0026 Control: Seamless digital transition, timely revenue recognition, and zero financial reconciliation discrepancy"]]],"t":"table"},"4.2. Tư duy Phân tích Nghiệp vụ Chuỗi Cung Ứng \u0026 BA (Bản Tiếng Việt)","• Bức tranh Toàn cảnh Chuỗi cung ứng (End-to-End Flow): Một dự án chuyển đổi hạ tầng máy chủ ERP lên đám mây (Cloud Migration) trong doanh nghiệp lớn không chỉ là bài toán kỹ thuật của khối CNTT mà luôn vận hành xuyên suốt 3 luồng: (1) Luồng Vận hành Kinh doanh \u0026 Kỹ thuật (Operational \u0026 System Flow): Khối CNTT cần khoảng thời gian ngừng hệ thống (Scheduled Downtime) từ tối thứ Sáu đến sáng thứ Hai để đồng bộ cơ sở dữ liệu, nhưng Khối Kinh doanh lại có chiến dịch bán hàng trực tiếp vào ngày thứ Bảy đòi hỏi truy cập thời gian thực -\u003e (2) Luồng Chứng từ Hợp đồng \u0026 Định danh Pháp lý (Documentary \u0026 Legal Flow): Tại điểm bán lưu động, nhân viên phải xác thực hồ sơ định danh điện tử (e-KYC), kiểm tra điểm tín dụng (Credit Validation) và khởi tạo Hợp đồng dịch vụ điện tử có giá trị pháp lý ngay tại chỗ; nếu mất mạng phải viết giấy tay sẽ gây ùn tắc nhập liệu và rủi ro sai sót thông tin -\u003e (3) Luồng Ngân hàng, Tín dụng \u0026 Đối soát Thanh toán (Banking \u0026 Settlement Flow): Để hợp đồng B2B có hiệu lực tức thời, hệ thống bán hàng phải kết nối cổng Ngân hàng để kiểm tra hạn mức tín dụng/bảo lãnh thanh toán của khách hàng doanh nghiệp và ghi nhận lệnh Ủy nhiệm thu tự động (Pre-authorized Direct-Debit Mandate / ACH). Khi áp dụng bộ đệm ngoại tuyến (Offline Caching), toàn bộ chứng từ hợp đồng và lệnh thanh toán ngân hàng được mã hóa lưu tạm trên tablet, sau đó tự động đẩy lên Cloud ERP và truyền sang Ngân hàng thanh toán ngay sáng thứ Hai để giải ngân doanh thu.","• Điểm nghẽn \u0026 Rủi ro Vận hành Thực tế (Core Bottleneck \u0026 Risk): Điểm nghẽn lớn nhất là \u0027Đóng băng nguyên khối\u0027 (Monolithic Cutover) — cắt toàn bộ các phân hệ cùng lúc vào tối thứ Sáu mà không đánh giá lịch hoạt động hiện trường của khối kinh doanh. Hậu quả là đứt gãy luồng xác thực tín dụng và ký hợp đồng tại sự kiện Đà Nẵng, buộc nhân viên phải thu thập giấy tờ thủ công, làm chậm trễ chu kỳ thu tiền qua ngân hàng (Cash Conversion Cycle) và tăng tỷ lệ rớt đơn.","• 3 Giải pháp Thiết kế Hệ thống \u0026 Kiểm soát Nghiệp vụ (BA \u0026 Supply Chain Architecture):","(1) Kiến trúc Di chuyển Dữ liệu Phân tách theo Phân vùng (Decoupled Partition Migration): Thay vì tắt toàn bộ hệ thống cùng lúc, thiết kế cơ chế tách phân vùng cơ sở dữ liệu (Database Partitioning) — cho phép khóa phân hệ Kế toán/Nhân sự từ tối thứ Sáu nhưng giữ phân vùng Bán hàng hoạt động độc lập đến 23:00 đêm Chủ nhật.","(2) Cơ chế Lưu trữ Bộ đệm Cục bộ Mã hóa \u0026 Hàng đợi Đồng bộ (Encrypted Offline Caching \u0026 Message Queue): Trang bị phân hệ Offline-First trên ứng dụng máy tính bảng (bản vá v4.1), cho phép lưu trữ an toàn hồ sơ e-KYC, hợp đồng số và ủy nhiệm thu ngân hàng khi mất kết nối máy chủ, sau đó tự động đồng bộ bất đồng bộ (Asynchronous Sync) lên Cloud ERP vào 06:00 sáng thứ Hai.","(3) Quy trình Kiểm thử Nghiệm thu Người dùng (UAT Sign-off) \u0026 Đối soát Thanh toán Tự động: Bắt buộc trưởng các bộ phận kiểm tra chéo số lượng hợp đồng phát sinh cuối tuần với bảng kê giao dịch ngân hàng và ký biên bản nghiệm thu UAT trước 10:00 sáng thứ Hai trước khi đóng dự án chuyển đổi.","4.3. Business Analyst \u0026 Supply Chain Executive Summary (Bản Tiếng Anh)","• End-to-End Supply Chain Context: Enterprise ERP cloud migration requires orchestrating three interdependent streams: (1) Technical \u0026 Commercial Operations—aligning weekend server cutover windows with active regional field sales campaigns; (2) Legal \u0026 Documentary Compliance—capturing real-time e-KYC verification, credit validation, and legally binding digital service contracts on-site; and (3) Banking \u0026 Financial Settlement—securing pre-authorized bank direct-debit mandates (ACH) and credit line approvals that synchronize with core billing ledgers once cloud gateways go live.","• Core Operational Bottleneck \u0026 Risk: Executing a monolithic Friday-night server shutdown severs real-time database access during Saturday\u0027s high-volume promotional campaign in Da Nang, forcing field representatives into manual paper collection, delaying interbank payment settlement, and creating severe administrative backlogs.","• Key BA \u0026 System Architecture Solutions:","(1) Phased Partition Cutover Architecture: Decouple back-office modules (Accounting/HR offline Friday 9:00 P.M.) from frontline revenue partitions, postponing Regional Sales disconnection until Sunday at 11:00 P.M.","(2) Encrypted Offline Caching \u0026 Asynchronous Queueing: Deploy tablet patch v4.1 to store encrypted e-KYC records, digital contracts, and bank direct-debit authorizations locally during connectivity gaps, auto-syncing with Apex Cloud on Monday at 6:00 A.M.","(3) Mandatory Post-Migration UAT \u0026 Banking Reconciliation: Require department heads to validate migrated weekend transactions against bank settlement queues and sign formal UAT verification logs by Monday at 10:00 A.M.","PHẦN 5: TỪ VỰNG \u0026 PARAPHRASE CHUYÊN SÂU (CHUẨN 3 DÒNG TỐI ƯU NẠP ANKI)","1. Transition / Migrate to a cloud platform  /trænˈzɪʃn/ - /ˈmaɪɡreɪt/  \u003c=\u003e Perform a planned system upgrade / Switch to digital infrastructure","Nghia: Chuyển đổi / Di chuyển hệ thống dữ liệu lên nền tảng đám mây","Vd: Our organization will transition from legacy on-premise servers to the Apex Cloud platform this weekend. - Tổ chức của chúng ta sẽ chuyển đổi từ các máy chủ vật lý tại chỗ cũ sang nền tảng đám mây Apex vào cuối tuần này.","2. Legacy on-premise servers  /ˈleɡəsi ɒn ˈpremɪs ˈsɜːrvərz/  \u003c=\u003e Outdated in-house hardware / Existing local computer systems","Nghia: Hệ thống máy chủ vật lý cũ đặt tại trụ sở doanh nghiệp","Vd: Maintaining legacy on-premise servers requires high electricity costs and frequent hardware repairs. - Việc duy trì các máy chủ vật lý cũ tại chỗ đòi hỏi chi phí điện năng cao và phải sửa chữa phần cứng thường xuyên.","3. Scheduled downtime  /ˈʃedjuːld ˈdaʊntaɪm/  \u003c=\u003e Planned maintenance window / Temporary system suspension","Nghia: Thời gian ngừng hoạt động hệ thống theo lịch trình để bảo trì/nâng cấp","Vd: During the scheduled downtime, access to the central database will be temporarily suspended. - Trong thời gian ngừng hoạt động theo lịch trình, quyền truy cập vào cơ sở dữ liệu trung tâm sẽ bị tạm ngưng.","4. Finalize and submit  /ˈfaɪnəlaɪz ænd səbˈmɪt/  \u003c=\u003e Complete and send / Conclude and process","Nghia: Hoàn tất dứt điểm và gửi trình duyệt (giao dịch, hồ sơ)","Vd: All urgent client transactions must be finalized and submitted prior to Friday afternoon. - Tất cả các giao dịch khách hàng khẩn cấp phải được hoàn tất và gửi đi trước chiều thứ Sáu.","5. Client onboarding  /ˈklaɪənt ˈɔːnbɔːrdɪŋ/  \u003c=\u003e New customer registration / Account setup and activation","Nghia: Quy trình tiếp nhận, hòa mạng và thiết lập tài khoản cho khách hàng mới","Vd: Seamless client onboarding requires real-time credit validation and digital contract signing. - Quy trình hòa mạng khách hàng mới liền mạch đòi hỏi phải xác thực tín dụng thời gian thực và ký hợp đồng số.","6. Offline local caching  /ˌɔːfˈlaɪn ˈloʊkl ˈkæʃɪŋ/  \u003c=\u003e Temporary device data storage without internet connection","Nghia: Giải pháp lưu trữ bộ đệm dữ liệu cục bộ trên thiết bị khi mất mạng","Vd: Deploying an offline local caching solution allows tablets to store contracts when servers are unreachable. - Việc triển khai giải pháp lưu trữ bộ đệm cục bộ ngoại tuyến giúp máy tính bảng lưu được hợp đồng khi không kết nối được máy chủ.","7. Administrative backlogs  /ədˈmɪnɪstreɪtɪv ˈbæklɔːɡz/  \u003c=\u003e Accumulation of uncompleted paperwork / Processing delays","Nghia: Tình trạng ùn tắc, tồn đọng hồ sơ thủ tục hành chính chưa xử lý kịp","Vd: Collecting paperwork manually will create severe administrative backlogs next week. - Việc thu thập giấy tờ thủ công sẽ gây ra tình trạng ùn tắc hành chính nghiêm trọng vào tuần tới.","8. Mandatory interactive webinar  /ˈmændətɔːri ˌɪntərˈæktɪv ˈwebɪnɑːr/  \u003c=\u003e Required online training session / Compulsory virtual workshop","Nghia: Buổi hội thảo đào tạo trực tuyến có tương tác bắt buộc tham gia","Vd: All staff must attend the mandatory interactive webinar on Tuesday to learn the new interface. - Toàn bộ nhân viên phải tham dự buổi đào tạo trực tuyến bắt buộc vào thứ Ba để nắm bắt giao diện mới.","==================================================================================================","BÀI THỰC HÀNH SỐ 2: PHẢN HỒI TRẢI NGHIỆM ỨNG DỤNG DI ĐỘNG, BẢN VÁ LỖI KHẨN CẤP \u0026 KIỂM THỬ NGHIỆM THU UAT (MOBILE APP FEEDBACK, DRIVER HOTFIX \u0026 UAT RELEASE NOTES)","Nguồn bài học: ETS TOEIC Part 7 (Triple Passage - Cụm 3 đoạn văn: App Store Review, Developer Response \u0026 UAT Release Notes, Questions 191-195)","PHẦN 1: NỘI DUNG VĂN BẢN \u0026 DỊCH THUẬT SONG NGỮ","1.1. Đề thi Tiếng Anh gốc (Strategy Guide \u0026 Original ETS Passages)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","App Store Review (User Feedback)","APP STORE CUSTOMER REVIEW","Application: QuickPay Merchant Solutions (v3.2.1)","Rating: 3 / 5 Stars","Reviewer: Elena Rostova, Retail Store Manager | Date: November 2","Our field and in-store sales team has been utilizing QuickPay Merchant Solutions for six months. The recent update to version 3.2.1 introduced an elegant user interface; however, several disruptive technical glitches have emerged.","Specifically, when sales representatives attempt to scan client QR codes and product barcodes in low-light environments, the application frequently freezes, forcing them to restart the smartphone before completing the credit card checkout. Furthermore, generating daily end-of-day revenue reports still requires logging in via a desktop web browser. It would be substantially more efficient if the development team could optimize full reporting capabilities directly on the mobile app so that store supervisors can approve financial reconciliations on the go.","Developer Response (Customer Support)","DEVELOPER RESPONSE","From: QuickPay Product Support Team","Date: November 3","To: Elena Rostova","Dear Ms. Rostova,","Thank you for sharing your constructive feedback regarding version 3.2.1. Our mobile engineering department has successfully identified the camera auto-focus driver bug and deployed an emergency software patch (Version 3.2.2) early this morning. Updating your mobile application immediately via the App Store will permanently eliminate the camera freezing issue.","Regarding your second recommendation, we are pleased to confirm that mobile revenue reconciliation and downloadable executive summaries are currently undergoing User Acceptance Testing (UAT). We have sent an invitation to your registered merchant e-mail to join our 14-day UAT pilot panel prior to the official Q1 release on January 15.","Release Notes (Product Launch Summary)","QUICKPAY MERCHANT SOLUTIONS — VERSION 3.3.0 RELEASE NOTES","Official Rollout Date: January 15","Document ID: QP-REL-330","Key Highlights in Major Release v3.3.0:","• Cross-Device Reporting Parity: Store supervisors can now generate, filter, and approve end-of-day revenue reconciliations directly on iOS and Android devices without desktop browser dependency.","• Instant Bank Settlement Trigger: Approved mobile reconciliations now transmit encrypted batch settlement files directly to the merchant\u0027s acquiring bank via API, accelerating T+0 fund disbursement.","• UAT Pilot Appreciation: Merchant managers who participated in the 14-day UAT pilot panel in December (including lead retail tester E. Rostova) will receive an automatic 20% subscription rebate on their February billing statement.","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","191","(A) Customer credit cards are being charged twice.","(B) The camera scanner stops functioning in dim lighting.","(C) The user interface is outdated and difficult to read.","(D) Passwords expire every twenty-four hours.","192","(A) cools down","(B) locks prices","(C) becomes unresponsive","(D) stores permanently","193","(A) By switching to a desktop web browser","(B) By upgrading to application version 3.2.2","(C) By replacing their smartphone cameras","(D) By waiting for the January 15 software release","194","(A) It is available exclusively on desktop computers.","(B) It requires a separate monthly subscription fee.","(C) It was permanently removed in version 3.2.1.","(D) It can only be accessed by bank auditors.","195","(A) She referred three new retail stores to QuickPay.","(B) She pre-paid her annual software license in full.","(C) Her store experienced a two-day payment outage.","(D) She served as a tester during the UAT pilot phase.","1.2. Hướng dẫn làm bài Part 7","CHIẾN THUẬT 5 PHÚT TỐI ƯU: QUÉT 3 ĐIỂM CHẠM, GIẢI ĐỦ 5 CÂU HỎI \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Luồng quy trình Đoạn ba (Quỹ đạo Quét chữ Z \u0026 Bộ lọc 3 Câu hỏi Tiềm thức): • Chiến thuật Đoạn Ba (30 giây = 10s x 3 văn bản) — Quy trình Nghiệp vụ 3 Chặng Khép kín:","- Tuyệt đối KHÔNG đọc sâu thân bài; mắt lướt theo Quỹ đạo hình chữ Z (Z-Pattern Eye Scan) qua 3 điểm chạm:","• Văn bản 1 (App Store Review / Bug Report - Phản hồi lỗi ứng dụng di động):","- Điểm chạm 1 (Nét ngang trên): Tiêu đề \u0027User Bug Report: Mobile WMS Inventory Scanner App\u0027 -\u003e Trả lời Q1: Phản ánh lỗi kỹ thuật ứng dụng quét mã vạch kho bãi.","- Điểm chạm 2 (Nét chéo xuống footer): Người đánh giá \u0027Elena Rostova, Warehouse Operations Manager\u0027 -\u003e Trả lời Q2: Quản lý kho hàng báo cáo sự cố phần mềm cho nhà phát triển SaaS.","- Điểm chạm 3 (Nét móc neo hai đầu): Triệu chứng lỗi (\u0027camera scanner module fails in dim lighting below 150 lux\u0027) \u0026 hiện tượng (\u0027interface freezes completely, requiring force-restart\u0027) -\u003e Trả lời Q3: Camera không quét được mã khi thiếu sáng và giao diện bị đơ (becomes unresponsive).","• Văn bản 2 (Release Notes - Ghi chú bản vá phần mềm):","- Điểm chạm 1 (Nét ngang trên): Tiêu đề \u0027Release Notes: Mobile App Patch Version 3.2.2\u0027 -\u003e Trả lời Q1: Bản ghi chú công bố cập nhật phần mềm sửa lỗi khẩn cấp.","- Điểm chạm 2 (Nét chéo xuống footer): Ban phát triển sản phẩm \u0027Apex Software Engineering Team\u0027 -\u003e Trả lời Q2: Hãng phần mềm cung cấp bản vá lỗi cho người dùng.","- Điểm chạm 3 (Nét móc neo hai đầu): Bản vá (\u0027Patch 3.2.2 released Nov 3 resolves low-light camera sensitivity\u0027) \u0026 lộ trình (\u0027revenue analytics restricted exclusively to desktop web throughout Q4\u0027) -\u003e Trả lời Q3: Nâng cấp bản 3.2.2 vào 3/11 để sửa lỗi quét mã; báo cáo doanh thu chỉ mở trên máy tính để bàn trong quý 4.","• Văn bản 3 (E-mail - Thư tri ân người dùng thử nghiệm UAT):","- Điểm chạm 1 (Nét ngang trên): Dòng \u0027Subject: Gratitude for Beta Testing \u0026 Subscription Rebate\u0027 -\u003e Trả lời Q1: Email thông báo chiết khấu hoàn tiền cảm ơn tham gia thử nghiệm.","- Điểm chạm 2 (Nét chéo xuống footer): \u0027From: SaaS Product Lead\u0027 gửi \u0027Elena Rostova\u0027 -\u003e Trả lời Q2: Trưởng dự án phần mềm gửi thư riêng cho quản lý kho.","- Điểm chạm 3 (Nét móc neo hai đầu): Đặc quyền (\u0027for serving as tester during UAT pilot phase, receive a 20% invoice rebate on February renewal\u0027) -\u003e Trả lời Q3: Tặng mức giảm cước thuê bao 20% vào tháng 2 vì đã tham gia nhóm thử nghiệm chấp nhận người dùng UAT.","• Quy trình nghiệp vụ 3 chặng khép kín: Báo lỗi (Review: Camera app kho bị đơ khi thiếu sáng) -\u003e Bản vá (Release Notes: Bản 3.2.2 sửa lỗi ngày 3/11; doanh thu chỉ có trên máy tính bàn) -\u003e Tri ân (Email: Giảm 20% hóa đơn tháng 2 vì đã làm tester đợt UAT).","=\u003e Chốt luồng sự việc sau 30s: Quản lý kho báo lỗi camera app bị đơ khi thiếu sáng, hãng phần mềm phát hành bản vá 3.2.2 sửa lỗi (báo cáo doanh thu chỉ xem trên máy bàn) và tặng 20% giảm giá tháng 2 cho người dùng tham gia thử nghiệm UAT.","Bước 2 (20 giây) - Quét nhanh 5 câu hỏi \u0026 Phân loại (Chỉ đọc câu hỏi, KHÔNG đọc 4 đáp án A, B, C, D): • Nguyên tắc đọc Bước 2 (3-4 giây/câu): Lướt nhanh 5 câu hỏi trước để gắn \u00275 móc từ khóa\u0027 vào bộ nhớ tạm:","• Q191: Thấy \u0027problem does Ms. Rostova report\u0027 -\u003e Câu hỏi Chi tiết lỗi ở Văn bản 1 (Móc: lỗi ứng dụng bà Rostova gặp).","• Q192: Thấy \u0027word \"freezes\" in paragraph 1, line 5, is closest in meaning to\u0027 -\u003e Câu hỏi Từ vựng theo ngữ cảnh (Móc: từ freezes nghĩa là gì).","• Q193: Thấy \u0027resolve the barcode scanner issue today\u0027 -\u003e Câu ghép nối Văn bản 1 + 2 (Móc: cách khắc phục lỗi quét mã vạch ngay hôm nay).","• Q194: Thấy \u0027What is indicated about the revenue reporting capability\u0027 -\u003e Câu ghép nối Văn bản 1 + 2 + 3 (Móc: tính năng báo cáo doanh thu).","• Q195: Thấy \u0027Why will Ms. Rostova receive a 20% subscription rebate\u0027 -\u003e Câu ghép nối Văn bản 1 + 3 (Móc: lý do bà Rostova được giảm 20% phí thuê bao).","Bước 3 (3 phút 45 giây) - Cách trả lời \u0026 Dấu hiệu tìm nhanh nhất cho đủ 5 câu hỏi (Giải cuốn chiếu \u0026 Chốt đáp án từng câu): • Q191 (Câu hỏi Chi tiết - 25s): [Dấu hiệu tìm nhanh nhất]: Quét Văn bản 1 tìm từ \u0027glitches\u0027 / \u0027Specifically\u0027: \u0027when sales representatives attempt to scan client barcodes in low-light environments, the application frequently freezes\u0027 =\u003e Trình quét camera ngừng hoạt động trong điều kiện ánh sáng yếu (\u0027camera scanner stops functioning in dim lighting\u0027) =\u003e Chọn (B).","• Q192 (Câu hỏi Từ vựng ngữ cảnh - 20s): [Dấu hiệu tìm nhanh nhất]: Áp dụng kỹ thuật Thế chỗ Feynman: \u0027...in low-light environments, the application frequently [...], forcing them to restart the smartphone\u0027 =\u003e Bắt buộc phải khởi động lại điện thoại chứng tỏ ứng dụng bị treo/đứng hình (\u0027hangs / becomes unresponsive\u0027) =\u003e Chọn (C).","• Q193 (Câu ghép nối Văn bản 1 + 2 - 40s): [Dấu hiệu tìm nhanh nhất]: Ở Văn bản
