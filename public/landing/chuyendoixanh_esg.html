<title>Chuyển đổi xanh ESG TOEIC 750+</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: cargo-manifest page. Hero with a 3x3 container stack (one container per lesson), sticky container-tab bar, lesson panel with side index of the 5 parts. */
:root{
  /* Tailwind-style neutrals + one primary (Blue 600) */
  --bg:#F9FAFB; --surface:#FFFFFF; --surface-2:#F3F4F6; --ink:#111827; --muted:#6B7280; --line:#E5E7EB;
  --paper:#FFFFFF;
  /* Coordinated palette: navy = governance/trust, cobalt = primary, magenta = errors,
     emerald = correct, ochre = clues & timing, Viettel red = brand marks, xanh mạ = outputs & chips */
  --navy:#102B66; --navy-2:#183B7E; --navy-ink:#102B66;
  --cobalt:#1E62D0; --cobalt-2:#2A7BE8;
  --magenta:#D71A4A; --magenta-2:#E52E5E;
  --emerald:#0A8558; --emerald-2:#12A16E;
  --ochre:#D87D0E; --ochre-2:#E8901C; --ochre-soft:#FDF1E1;
  --brand:var(--cobalt); --brand-soft:#DCE8FB; --vi:var(--navy-2);
  --red:#EE0033; --red-soft:#FFE4EA; --green:#5FA61B; --green-soft:#EAF6DC;
  --ok:var(--emerald); --bad:var(--magenta); --coral:var(--red); --coral-soft:var(--red-soft);
  --c1:var(--brand); --c2:var(--brand); --c3:var(--brand); --c4:var(--brand); --c5:var(--brand); --c6:var(--brand); --c7:var(--brand); --c8:var(--brand); --c9:var(--brand); --c10:var(--brand);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --shadow:0 1px 2px rgba(17,24,39,.05),0 6px 20px -8px rgba(17,24,39,.15);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#030712; --surface:#111827; --surface-2:#0B1120; --ink:#F9FAFB; --muted:#9CA3AF; --line:#1F2937;
  --vi:#9DBDF5; --paper:#111827; --navy-ink:#C9D7F4;
  --brand:var(--cobalt-2); --brand-soft:#132A55; --ochre-soft:#33220B;
  --ok:var(--emerald-2); --bad:var(--magenta-2);
  --red:#FF3B5F; --red-soft:#3B0A16; --green:#8BCF45; --green-soft:#1C2E0E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#030712; --surface:#111827; --surface-2:#0B1120; --ink:#F9FAFB; --muted:#9CA3AF; --line:#1F2937;
  --vi:#9DBDF5; --paper:#111827; --navy-ink:#C9D7F4;
  --brand:var(--cobalt-2); --brand-soft:#132A55; --ochre-soft:#33220B;
  --ok:var(--emerald-2); --bad:var(--magenta-2);
  --red:#FF3B5F; --red-soft:#3B0A16; --green:#8BCF45; --green-soft:#1C2E0E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{text-wrap:balance;margin:0}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--c) 70%,transparent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono)}

/* ---------- Hero ---------- */
.hero{padding-block:40px 32px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:40px;align-items:center}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow b{color:var(--coral);font-weight:500}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,6.2vw,76px);line-height:.95;letter-spacing:-.01em;text-transform:uppercase;margin-top:14px}
.hero h1 span{color:var(--red)}
.hero .en-sub{font-family:var(--f-display);font-weight:600;font-size:clamp(16px,1.8vw,21px);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:12px}
.hero .desc{max-width:62ch;margin-top:16px;color:var(--muted);font-size:15px}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:24px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}

.yard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:440px;justify-self:end;width:100%}
.box{position:relative;aspect-ratio:2.1/1;max-width:100%;border:1px solid var(--line);border-radius:14px;cursor:pointer;color:var(--ink);text-align:left;padding:10px 12px;
  background:var(--surface);display:flex;flex-direction:column;justify-content:space-between;transition:transform .18s ease,background .18s,border-color .18s,box-shadow .18s}
.box:hover{transform:translateY(-3px);border-color:var(--brand);box-shadow:0 8px 20px -10px color-mix(in srgb,var(--brand) 60%,transparent)}
.box .n{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--brand)}
.box .qr{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.box .code{font-size:11.5px;font-weight:500;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box.on{background:var(--brand);border-color:var(--brand);color:#fff}
.box.on .n,.box.on .qr,.box.on .code{color:#fff}
.box.alt .n{color:var(--coral)}

/* navy governance band behind the hero */
.hero-band{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff}
.hero-band .eyebrow{color:rgba(255,255,255,.7)}
.hero-band .eyebrow b{color:var(--ochre-2)}
.hero-band h1 span{color:var(--magenta-2)}
.hero-band .en-sub,.hero-band .desc,.hero-band .stat span{color:rgba(255,255,255,.74)}
.hero-band .stat b{color:#fff}
.hero-band .box{border-color:transparent}
.hero-band .box.on{background:var(--cobalt-2);border-color:#fff}

/* ---------- Tab bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-block:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:12px;padding-block:10px}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;flex:1;min-width:0;padding-bottom:2px;scroll-behavior:smooth}
.tab{--c:var(--c1);flex:0 0 auto;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 16px 5px 5px;cursor:pointer;text-align:left;transition:background .15s,border-color .15s}
.tab:hover{border-color:var(--c)}
.tab .door{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--c);font-family:var(--f-display);font-weight:800;font-size:16px;
  background:color-mix(in srgb,var(--c) 14%,var(--surface))}
.tab .tl{display:flex;flex-direction:column;line-height:1.2}
.tab .tl b{font-size:13px;font-weight:600;white-space:nowrap}
.tab .tl small{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--c);border-color:var(--c);color:#fff}
.tab[aria-selected="true"] .door{background:rgba(255,255,255,.22);color:#fff}
.tab[aria-selected="true"] .tl small{color:rgba(255,255,255,.82)}
.mode{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:0 0 auto;background:var(--surface-2)}
.mode button{border:0;background:none;padding:6px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--navy);color:#fff}

/* ---------- Lesson ---------- */
main{padding-block:28px 64px}
.lesson-head{--c:var(--c1);display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start;padding-bottom:24px;border-bottom:2px solid var(--navy-ink)}
.big-n{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,10vw,120px);line-height:.8;color:var(--c);letter-spacing:-.02em}
.big-n small{display:block;font-size:14px;letter-spacing:.2em;color:var(--muted);font-weight:600;margin-bottom:8px}
.lesson-head h2{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3.2vw,38px);line-height:1.05;text-transform:uppercase;color:var(--navy-ink)}
.lesson-head .en-t{font-family:var(--f-display);font-weight:600;font-size:clamp(15px,1.7vw,19px);color:var(--c);letter-spacing:.04em;margin-top:8px;text-transform:uppercase}
.src{display:inline-flex;gap:8px;align-items:center;margin-top:14px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
.src b{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--c);letter-spacing:.06em}

.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:36px;margin-top:28px}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 82px);align-self:start;display:flex;flex-direction:column;gap:2px}
.toc a{display:flex;gap:10px;align-items:baseline;text-decoration:none;color:var(--muted);font-size:13.5px;padding:7px 10px;border-radius:6px;line-height:1.3}
.toc a b{font-family:var(--f-display);font-size:17px;color:var(--c);min-width:18px}
.toc a:hover,.toc a.on{background:var(--surface);color:var(--ink)}
.toc .toc-sub{padding-left:38px;font-size:12.5px}
.content{min-width:0;display:flex;flex-direction:column;gap:44px}

.part{display:flex;flex-direction:column;gap:22px;scroll-margin-top:96px}
.part-h{display:flex;gap:14px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:10px}
.part-h .pn{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.14em;color:#fff;background:var(--red);padding:3px 9px;border-radius:4px;white-space:nowrap}
.part-h h3{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,2.4vw,26px);text-transform:uppercase;line-height:1.1;color:var(--navy-ink)}
.sub{display:flex;flex-direction:column;gap:14px;scroll-margin-top:96px}
.sub-h{display:flex;gap:10px;align-items:baseline;font-weight:700;font-size:17px}
.sub-h .sn{font-family:var(--f-mono);font-size:12px;color:var(--c);font-weight:500}

/* strategy */
.strat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.strat-t{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;color:var(--c);text-transform:uppercase;line-height:1.5}
.steps{display:grid;gap:12px;counter-reset:s}
.step{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:start}
.step .when{font-family:var(--f-mono);font-size:11.5px;display:flex;flex-direction:column;gap:2px;border-right:2px solid var(--ochre);padding-right:10px}
.step .when span{color:var(--ochre)!important;font-weight:500}
.step .when b{font-family:var(--f-display);font-size:18px;font-weight:700;color:var(--ink)}
.step .when span{color:var(--muted)}
.step h5{margin:0 0 3px;font-size:14.5px;font-weight:700}
.step p{font-size:14.5px;color:var(--ink)}

/* passages = papers */
.papers{display:flex;flex-direction:column;gap:18px}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);padding:22px 24px;display:flex;flex-direction:column;gap:9px;font-size:15px;position:relative}
.paper-tag{align-self:flex-start;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:3px;padding:2px 8px;margin-bottom:4px}
.ln-caps{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.04em;line-height:1.2}
.ln-kv{font-size:14px}
.ln-kv b{font-family:var(--f-mono);font-size:12px;font-weight:500;color:var(--muted);margin-right:4px}
.ln-bul{padding-left:16px;position:relative}
.ln-bul::before{content:"";position:absolute;left:2px;top:.7em;width:6px;height:6px;background:var(--c);border-radius:1px}
.ln-sec{font-weight:700;margin-top:6px}
.ln-head{font-weight:700;margin-top:8px;color:var(--navy-ink)}
.ln-num{padding:2px 0 2px 14px;border-left:2px solid var(--brand);margin-left:2px}
.ln-num b{color:var(--brand)}
.ln-concl{background:var(--brand-soft);border-radius:6px;padding:8px 12px;font-size:14px}
.ln-concl b{color:var(--brand)}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:16px}
.quiz-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.score{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.score b{color:var(--ink);font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--c)}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.q-stem{display:flex;gap:12px;font-weight:600}
.q-no{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--c);line-height:1.2;flex:0 0 auto}
.q-extra{font-style:italic;font-weight:400;color:var(--muted);margin-top:4px}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:8px 12px;cursor:pointer;font-size:14.5px;line-height:1.45;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--c)}
.opt .k{font-family:var(--f-mono);font-weight:500;font-size:13px;color:var(--c);flex:0 0 auto;margin-top:1px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--surface))}
.opt.ok .k{color:var(--ok)}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--surface))}
.opt.bad .k{color:var(--bad)}
.q-fb{font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.q-fb .r{font-weight:600}
.q-fb .r.ok{color:var(--ok)} .q-fb .r.bad{color:var(--bad)}
.q-fb a{color:var(--c)}

/* bilingual */
.bi-doc{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;color:var(--c);text-transform:uppercase;padding:10px 0 2px;border-top:1px dashed var(--line);margin-top:6px;line-height:1.5}
.bi-doc:first-child{border-top:0;margin-top:0;padding-top:0}
.bi{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--line)}
.pair:first-child{border-top:0}
.pair>div{padding:11px 16px;display:flex;flex-direction:column;gap:4px;font-size:14.5px;min-width:0}
.pair .en{color:var(--ink)}
.pair .vi{color:var(--vi);background:color-mix(in srgb,var(--vi) 5%,transparent);border-left:1px solid var(--line)}
.lang{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--muted);opacity:.8}
.bi-head{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-bottom:1px solid var(--line)}
.bi-head span{padding:7px 16px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--muted)}
.bi-head span+span{border-left:1px solid var(--line);color:var(--vi)}

.vi-t{color:var(--vi)}
/* recall mode blurs translations */
.recall .vi-r{filter:blur(6px);cursor:pointer;user-select:none;transition:filter .2s}
.recall .vi-r.peek{filter:none;user-select:auto}

/* question translation */
.qt{display:grid;gap:12px}
.qt-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.qt-card .stem{display:flex;gap:12px}
.qt-card .stem>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.qt-card .stem b{font-weight:600}
.qt-opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;padding-left:44px}
.qt-opt{display:flex;gap:8px;font-size:14px;line-height:1.45}
.qt-opt>div{display:flex;flex-direction:column;min-width:0}
.qt-opt .k{font-family:var(--f-mono);color:var(--c);font-size:12.5px;margin-top:1px}
.qt-opt.correct .k{color:#fff;background:var(--ok);border-radius:3px;padding:0 4px;height:fit-content}

/* summary */
.sum{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.sum>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;font-size:14.5px;display:flex;flex-direction:column;gap:8px}
.ideas{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.ideas li{position:relative;padding-left:18px}
.ideas>li::before{content:"";position:absolute;left:3px;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--brand)}
.ideas ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.ideas ul li::before{content:"";position:absolute;left:4px;top:.75em;width:7px;height:1.5px;background:var(--muted)}

/* matrix */
.matrix{display:grid;gap:12px}
.mx{display:grid;grid-template-columns:200px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mx-l{padding:16px;background:color-mix(in srgb,var(--c) 9%,var(--surface));display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line)}
.mx-l .i{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;color:var(--c)}
.mx-l b{font-size:14.5px;line-height:1.35}
.mx-l small{font-size:12.5px;color:var(--muted);line-height:1.35}
.mx-r{padding:14px 18px;display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.mx-r p{display:flex;gap:10px}
.mx-r .lang{flex:0 0 22px;margin-top:4px}

/* answers */
.ans{display:grid;gap:12px}
.an{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:100px}
.an.flash{animation:flash 1.4s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--c)}100%{box-shadow:0 0 0 0 transparent}}
.an-h{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.an-h .no{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--c)}
.an-h .key{font-family:var(--f-mono);font-weight:500;background:var(--ok);color:#fff;border-radius:4px;padding:1px 8px;font-size:13px}
.an-h .t{font-weight:600}
.trace{font-size:14px;border-left:3px solid var(--ochre);background:var(--ochre-soft);padding:9px 12px;border-radius:0 6px 6px 0;font-style:italic}
.trace .lbl{color:var(--ochre)}
.lbl{font-family:var(--f-mono);font-style:normal;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--c);display:block;margin-bottom:2px}
.expl{font-size:14.5px}
.an-stem{font-size:14px;color:var(--muted);margin-top:-4px}
.para{display:flex;flex-direction:column;gap:6px;font-size:14px}
.para .pr{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:start;background:var(--green-soft);border-radius:6px;padding:7px 10px}
.para .pr i{font-style:normal;color:var(--green);font-weight:700}
.para .pr span:last-child{font-weight:600}
.wrong{display:grid;gap:8px}
.wr{border:1px solid var(--line);border-radius:8px;padding:9px 12px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.wr-h{display:flex;gap:8px;align-items:baseline}
.wr-h b{font-family:var(--f-mono);font-weight:500;color:var(--bad);font-size:13px}
.wr-h span{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--bad) 55%,transparent);color:var(--muted)}
.trap{align-self:flex-start;font-size:12px;font-weight:600;color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);border-radius:4px;padding:2px 8px}
.ln-sub{padding-left:30px;position:relative;font-size:14px}
.ln-sub::before{content:"";position:absolute;left:16px;top:.75em;width:6px;height:1.5px;background:var(--muted)}

/* workflow */
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;position:relative}
.fstep{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;position:relative}
.fstep:not(:last-child)::after{content:"";position:absolute;right:-12px;top:30px;width:10px;height:10px;border-top:2px solid var(--c);border-right:2px solid var(--c);transform:rotate(45deg);z-index:1}
.fstep h5{margin:0;font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.15;text-transform:uppercase}
.fstep h5 span{display:block;font-size:12px;color:var(--c);letter-spacing:.14em}

.fkv.out{background:var(--green-soft);border-radius:6px;padding:8px 10px}

.ba{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}

/* vocab */
.vocab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.vc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:9px}

.vc-h h5{margin:0;font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.05}
.ipa{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chips .eq{font-family:var(--f-mono);font-size:12px;color:var(--c);margin-right:2px}
.chip{font-size:12.5px;border:1px solid color-mix(in srgb,var(--green) 45%,var(--line));color:var(--ink);border-radius:999px;padding:1px 9px;background:var(--green-soft)}
.chips .eq{color:var(--green)}
.vc .mean{font-size:14px;font-weight:500}
.vc .ex{font-size:13.5px;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:3px}

/* 50 pairs */
.pp-tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pp-tools input{flex:1;min-width:0;max-width:420px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;font:inherit;font-size:14.5px;color:var(--ink)}
.tbl-w{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th{text-align:left;font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--navy);padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n{font-family:var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;width:52px}
td.t{font-weight:600}
td.p{color:var(--muted)}
td.m{color:var(--vi)}
tbody tr:hover td{background:var(--surface-2)}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:8px;flex-wrap:wrap}
.pager button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 16px;cursor:pointer;min-width:0;max-width:48%;text-align:left}
.pager button:hover{border-color:var(--ink)}
.pager button small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.pager button b{font-size:14px}
.pager .next{margin-left:auto;align-items:flex-end;text-align:right}
footer{border-top:1px solid var(--line);padding-block:20px 32px;color:var(--muted);font-size:12.5px}

<script type="application/json" id="src">["CHUYÊN ĐỀ ĐỌC HIỂU TOEIC PART 7: CHUYỂN ĐỔI XANH, MÔI TRƯỜNG \u0026 BÁO CÁO PHÁT TRIỂN BỀN VỮNG ESG","PHƯƠNG PHÁP FEYNMAN SONG NGỮ, ACTIVE RECALL 5S, TRUY XUẤT CHÉO \u0026 SPACED REPETITION ANKI (9 BÀI ĐOẠN 2 \u0026 3 VĂN BẢN — 45 CÂU HỎI)","==================================================================================================","BÀI 1: KIỂM TOÁN DẤU CHÂN CARBON \u0026 KẾ HOẠCH GIẢM PHÁT THẢI KHÍ NHÀ KÍNH SCOPE 1, 2, 3 (ENTERPRISE CARBON FOOTPRINT AUDIT \u0026 SCOPE 1-2-3 DECARBONIZATION ROADMAP)","TOEIC Part 7 - Đề thi ETS / Hacker Format (Questions 181-185 - Double Passage)","PHẦN 1: BẢN GỐC ĐỀ THI, CHIẾN THUẬT NẮM BẮT DỮ KIỆN \u0026 BẢN DỊCH SONG NGỮ ĐỐI CHIẾU","1.1 BẢN GỐC ĐỀ THI (ORIGINAL READING PASSAGES)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","INTERNAL DIRECTIVE \u0026 DECARBONIZATION MANDATE","Pinnacle Industrial Manufacturing Corp — Global Sustainability \u0026 ESG Office","Directive Ref: #ESG-DIR-2026-03 | Issued: March 2, 2026","To: All Plant Managers, Facility Directors, and Operations Leads","From: Helena Vance, Chief Sustainability Officer (CSO)","Date: March 2, 2026","Subject: Mandatory 2026 Enterprise Greenhouse Gas (GHG) Emissions Inventory \u0026 Audit Protocol","In accordance with our corporate commitment to align with the Science Based Targets initiative (SBTi) and European Carbon Border Adjustment Mechanism (CBAM) compliance standards, Pinnacle Industrial Manufacturing Corp is launching its comprehensive 2026 Enterprise Decarbonization Roadmap.","All twelve manufacturing plants across North America and Western Europe are required to compile and submit their standardized Scope 1 (direct fuel combustion) and Scope 2 (purchased electricity and steam) operational activity data to the central sustainability portal no later than Wednesday, April 15, 2026.","Key Strategic Targets for FY2026:","• Scope 1 \u0026 2 Reduction: Achieve a minimum 30% reduction in combined direct emissions compared to our 2023 baseline, accelerated by our capital transition to biomass-electric boilers and high-efficiency heat recovery networks.","• Scope 3 Footprint Baseline: For the first time, each business unit must conduct a comprehensive upstream value-chain survey assessing emissions generated by primary Tier-1 raw material suppliers and third-party logistics carriers.","Following internal data consolidation, Veritas Climate Consulting will conduct an unannounced, on-site verification audit across five randomly selected production facilities between April 20 and May 5, 2026.","INDEPENDENT AUDIT SCORECARD \u0026 ASSURANCE SUMMARY","Veritas Climate Consulting — Environmental Assurance Division","Audit Ref: #VCC-PIN-2026-55 | Issued: May 10, 2026","CONFIDENTIAL CLIENT SUMMARY","To: Executive Committee, Pinnacle Industrial Manufacturing Corp","From: Marcus Thorne, Lead Climate Assurance Auditor, Veritas Climate Consulting","Date: May 10, 2026","Subject: Third-Party Assurance Findings: 2026 Mid-Year GHG Inventory Verification","Veritas Climate Consulting has completed its rigorous on-site verification and activity data audit across Pinnacle\u0027s designated manufacturing hubs. Based on ISO 14064-3 limited assurance standards, we present the verified emissions scorecard:","1. Scope 1 \u0026 2 Performance (Direct \u0026 Energy Indirect Emissions):","Pinnacle recorded an audited 28.4% reduction in combined Scope 1 and Scope 2 emissions compared to the 2023 baseline, successfully tracking toward its 30% annual target. The primary catalyst was the successful commissioning of biomass-electric boilers at the Frankfurt and Detroit facilities, which eliminated 42,000 metric tons of carbon dioxide equivalent (tCO2e).","2. Scope 3 Footprint Breakdown (Value-Chain Emissions):","Our supply-chain lifecycle analysis revealed that Scope 3 emissions account for an overwhelming 71.0% of Pinnacle\u0027s total carbon footprint (totaling 620,000 tCO2e), heavily concentrated in raw metal smelting and long-haul maritime transport.","Auditor Recommendation \u0026 Mandatory Corrective Action:","While Pinnacle\u0027s internal operational decarbonization is commendable, corporate net-zero targets will remain out of reach without aggressive value-chain interventions. We recommend that Pinnacle institute a mandatory \u0027Green Supplier Mandate\u0027 effective Q4 2026, requiring all Tier-1 suppliers with contract values exceeding $500,000 to submit third-party audited carbon footprints as a binding condition for annual contract renewal.","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","181. What is the primary objective of the directive issued by Helena Vance?","(A) To announce factory closures resulting from supply chain disruptions","(B) To mandate a greenhouse gas emissions inventory and decarbonization protocol","(C) To solicit bids from external biomass fuel suppliers across Europe","(D) To negotiate new labor agreements for manufacturing plant operators","182. By what date must Pinnacle manufacturing plants submit their operational emissions data?","(A) March 2","(B) April 15","(C) May 5","(D) May 10","183. According to the audit report, what factor contributed most to the reduction in Scope 1 emissions?","(A) The installation of solar rooftop panels at corporate headquarters","(B) The commissioning of biomass-electric boilers at major manufacturing plants","(C) A 50 percent cut in international corporate travel","(D) The permanent outsourcing of heavy stamping operations to contractors","184. What does the second passage reveal about Pinnacle\u0027s Scope 3 emissions?","(A) They were eliminated entirely through renewable energy credits.","(B) They comprise 71 percent of the corporation\u0027s overall carbon footprint.","(C) They decreased by 28.4 percent compared to the 2023 baseline.","(D) They are exempt from European regulatory scrutiny under CBAM.","185. What action does Veritas Climate Consulting advise Pinnacle to implement in Q4 2026?","(A) Relocating all manufacturing operations to South America","(B) Requiring major Tier-1 suppliers to provide verified carbon footprint audits","(C) Suspending all capital investments in facility energy efficiency","(D) Discontinuing third-party environmental verification audits permanently","1.2 BẢNG HƯỚNG DẪN CHIẾN THUẬT 5 PHÚT \u0026 DẤU VẾT SUY LUẬN CHÉO GIỮA CÁC ĐOẠN","CHIẾN THUẬT 5 PHÚT TỐI ƯU: NẮM BẮT BỐI CẢNH, GHÉP NỐI DỮ KIỆN \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Quét Z-Pattern: Quét 2 văn bản: Văn bản 1 là Thông báo \u0026 Chỉ thị Bền vững Nội bộ của Tập đoàn Sản xuất Công nghiệp Pinnacle ban hành lộ trình giảm phát thải khí nhà kính (GHG) theo nghị định thư quốc tế, bắt buộc toàn bộ 12 nhà máy hoàn thành kiểm kê phát thải Scope 1, 2, 3 trước ngày 15/4/2026; Văn bản 2 là Báo cáo Thẩm định Độc lập của Viện Kiểm định Khí hậu Veritas Climate Consulting công bố ngày 10/5/2026 xác nhận Pinnacle đã cắt giảm 28,4% phát thải Scope 1 và 2 nhờ chuyển đổi lò hơi điện sinh học, nhưng phát thải chuỗi cung ứng Scope 3 vẫn chiếm tới 71% tổng lượng phát thải carbon của tập đoàn.","Bước 2 (60 giây) - Móc nối Logic \u0026 Sơ đồ Tinh thần: Thiết lập chuỗi giá trị khử carbon doanh nghiệp: Ban hành chỉ thị kiểm kê phát thải toàn diện theo chuẩn GHG Protocol (Văn bản 1: mục tiêu cắt giảm 30% phát thải trực tiếp vào cuối năm 2026) ➔ Kiểm toán độc lập của bên thứ ba \u0026 phân loại rủi ro Scope (Văn bản 2: phát thải Scope 1 \u0026 2 đạt tiến độ giảm 28,4%, nhưng phát thải Scope 3 chuỗi cung ứng ngoài tầm kiểm soát trực tiếp chiếm 71%) ➔ Kế hoạch hành động ràng buộc nhà cung cấp loại 1 (Tier-1 Suppliers) phải ký cam kết xanh hóa trước Q4/2026.","Bước 3 (120 giây) - Định vị Manh mối \u0026 Giải đề Tốc độ: Câu 181 hỏi mục đích chính của văn bản chỉ thị (công bố lộ trình kiểm kê khí nhà kính và mục tiêu giảm phát thải); Câu 182 hỏi thời hạn chót các nhà máy phải nộp dữ liệu kiểm kê sơ bộ (ngày 15 tháng 4); Câu 183 hỏi sáng kiến nào đã mang lại kết quả giảm phát thải Scope 1 rõ rệt nhất (chuyển đổi hệ thống lò hơi sang điện sinh học); Câu 184 (câu hỏi liên kết) hỏi phạm vi phát thải nào chiếm tỷ trọng lớn nhất trong tổng dấu chân carbon (Scope 3 với 71%); Câu 185 (câu hỏi liên kết) hỏi biện pháp tiếp theo tập đoàn sẽ thực hiện trong Quý 4 (yêu cầu các nhà cung cấp Tier-1 nộp báo cáo carbon độc lập).","Bước 4 (30 giây) - Đúc kết Feynman 1 Câu: Hiểu bản chất: Kiểm toán carbon doanh nghiệp không thể chỉ nhìn vào ống khói của chính nhà máy mình (Scope 1) hay hóa đơn điện mua vào (Scope 2), mà thách thức cốt lõi nằm ở Scope 3 - tức lượng phát thải khổng lồ ẩn giấu trong toàn bộ chuỗi cung ứng và vận chuyển của các nhà cung cấp đối tác.","1.3 BẢN DỊCH SONG NGỮ ĐỐI CHIẾU VIỆT - ANH (BILINGUAL PARALLEL TRANSLATION)","VĂN BẢN 1: CHỈ THỊ NỘI BỘ VỀ KIỂM KÊ KHÍ NHÀ KÍNH (INTERNAL DIRECTIVE \u0026 DECARBONIZATION MANDATE)","To: All Plant Managers, Facility Directors, and Operations Leads","From: Helena Vance, Chief Sustainability Officer (CSO)","Date: March 2, 2026","Subject: Mandatory 2026 Enterprise Greenhouse Gas (GHG) Emissions Inventory \u0026 Audit Protocol","Kính gửi: Toàn thể Giám đốc Nhà máy, Giám đốc Cơ sở Vận hành và Trưởng bộ phận Khai thác","Từ: Helena Vance, Giám đốc Bền vững Cấp cao (CSO)","Ngày: 2 tháng 3 năm 2026","Chủ đề: Quy thức Kiểm toán \u0026 Kiểm kê Phát thải Khí nhà kính (GHG) Bắt buộc Toàn Doanh nghiệp Năm 2026","In accordance with our corporate commitment to align with the Science Based Targets initiative (SBTi) and European Carbon Border Adjustment Mechanism (CBAM) compliance standards, Pinnacle Industrial Manufacturing Corp is launching its comprehensive 2026 Enterprise Decarbonization Roadmap.","Tuân thủ cam kết của tập đoàn nhằm đồng bộ hóa với Sáng kiến Mục tiêu Dựa trên Cơ sở Khoa học (SBTi) và các tiêu chuẩn tuân thủ Cơ chế Điều chỉnh Biên giới Carbon của Châu Âu (CBAM), Tập đoàn Sản xuất Công nghiệp Pinnacle chính thức khởi động Lộ trình Khử Carbon Doanh nghiệp Toàn diện năm 2026.","All twelve manufacturing plants across North America and Western Europe are required to compile and submit their standardized Scope 1 (direct fuel combustion) and Scope 2 (purchased electricity and steam) operational activity data to the central sustainability portal no later than Wednesday, April 15, 2026.","Toàn bộ 12 nhà máy sản xuất trên khắp Bắc Mỹ và Tây Âu bắt buộc phải tổng hợp và nộp dữ liệu hoạt động vận hành chuẩn hóa cho Phạm vi 1 (đốt nhiên liệu trực tiếp) và Phạm vi 2 (điện và hơi nước mua ngoài) lên cổng thông tin bền vững trung tâm muộn nhất vào Thứ Tư, ngày 15 tháng 4 năm 2026.","Key Strategic Targets for FY2026:","• Scope 1 \u0026 2 Reduction: Achieve a minimum 30% reduction in combined direct emissions compared to our 2023 baseline, accelerated by our capital transition to biomass-electric boilers and high-efficiency heat recovery networks.","• Scope 3 Footprint Baseline: For the first time, each business unit must conduct a comprehensive upstream value-chain survey assessing emissions generated by primary Tier-1 raw material suppliers and third-party logistics carriers.","Các Mục tiêu Chiến lược Trọng tâm cho Năm Tài chính 2026:","• Cắt giảm Phát thải Scope 1 \u0026 2: Đạt mức cắt giảm tối thiểu 30% tổng lượng phát thải trực tiếp so với mức cơ sở năm 2023, được đẩy nhanh bằng quá trình chuyển đổi vốn sang hệ thống lò hơi điện sinh học và mạng lưới thu hồi nhiệt hiệu suất cao.","• Thiết lập Mức Cơ sở Dấu chân Carbon Scope 3: Lần đầu tiên, từng đơn vị kinh doanh phải tiến hành khảo sát toàn diện chuỗi giá trị thượng nguồn nhằm đánh giá lượng phát thải do các nhà cung cấp nguyên liệu thô Cấp 1 (Tier-1) và các đơn vị vận tải logistics bên thứ ba tạo ra.","Following internal data consolidation, Veritas Climate Consulting will conduct an unannounced, on-site verification audit across five randomly selected production facilities between April 20 and May 5, 2026.","Sau khi hợp nhất dữ liệu nội bộ, Viện Tư vấn Khí hậu Veritas Climate Consulting sẽ tiến hành một cuộc kiểm toán xác minh tại chỗ bất ngờ tại 5 cơ sở sản xuất được lựa chọn ngẫu nhiên từ ngày 20 tháng 4 đến ngày 5 tháng 5 năm 2026.","VĂN BẢN 2: BÁO CÁO KIỂM TOÁN CARBON CỦA ĐƠN VỊ ĐỘC LẬP (INDEPENDENT AUDIT SCORECARD)","CONFIDENTIAL CLIENT SUMMARY","To: Executive Committee, Pinnacle Industrial Manufacturing Corp","From: Marcus Thorne, Lead Climate Assurance Auditor, Veritas Climate Consulting","Date: May 10, 2026","Subject: Third-Party Assurance Findings: 2026 Mid-Year GHG Inventory Verification","TÓM TẮT BẢO MẬT DÀNH CHO KHÁCH HÀNG","Kính gửi: Ban Giám đốc Điều hành, Tập đoàn Sản xuất Công nghiệp Pinnacle","Từ: Marcus Thorne, Chuyên gia Kiểm toán Trưởng về Bảo đảm Khí hậu, Veritas Climate Consulting","Ngày: 10 tháng 5 năm 2026","Chủ đề: Các Phát hiện Đảm bảo của Bên Thứ ba: Xác minh Kiểm kê Khí nhà kính Giữa năm 2026","Veritas Climate Consulting has completed its rigorous on-site verification and activity data audit across Pinnacle\u0027s designated manufacturing hubs. Based on ISO 14064-3 limited assurance standards, we present the verified emissions scorecard:","Veritas Climate Consulting đã hoàn thành đợt kiểm toán dữ liệu hoạt động và xác minh tại chỗ nghiêm ngặt trên khắp các trung tâm sản xuất được chỉ định của Pinnacle. Dựa trên các tiêu chuẩn bảo đảm có giới hạn ISO 14064-3, chúng tôi xin trình bày bảng điểm phát thải đã được xác minh:","1. Scope 1 \u0026 2 Performance (Direct \u0026 Energy Indirect Emissions):","Pinnacle recorded an audited 28.4% reduction in combined Scope 1 and Scope 2 emissions compared to the 2023 baseline, successfully tracking toward its 30% annual target. The primary catalyst was the successful commissioning of biomass-electric boilers at the Frankfurt and Detroit facilities, which eliminated 42,000 metric tons of carbon dioxide equivalent (tCO2e).","1. Kết quả Phát thải Scope 1 \u0026 2 (Phát thải Trực tiếp \u0026 Gián tiếp từ Năng lượng):","Pinnacle ghi nhận mức cắt giảm đã qua kiểm toán 28,4% lượng phát thải Scope 1 và Scope 2 kết hợp so với mức cơ sở năm 2023, bám sát mục tiêu 30% hàng năm. Động lực chính là việc đưa vào vận hành thành công hệ thống lò hơi điện sinh học tại các cơ sở Frankfurt và Detroit, giúp loại bỏ 42.000 tấn carbon dioxide tương đương (tCO2e).","2. Scope 3 Footprint Breakdown (Value-Chain Emissions):","Our supply-chain lifecycle analysis revealed that Scope 3 emissions account for an overwhelming 71.0% of Pinnacle\u0027s total carbon footprint (totaling 620,000 tCO2e), heavily concentrated in raw metal smelting and long-haul maritime transport.","2. Phân tích Dấu chân Carbon Scope 3 (Phát thải Chuỗi Giá trị):","Phân tích vòng đời chuỗi cung ứng của chúng tôi tiết lộ rằng phát thải Scope 3 chiếm tỷ trọng áp đảo lên tới 71,0% tổng dấu chân carbon của Pinnacle (tương đương 620.000 tCO2e), tập trung chủ yếu vào quá trình luyện kim loại thô và vận tải đường biển đường dài.","Auditor Recommendation \u0026 Mandatory Corrective Action:","While Pinnacle\u0027s internal operational decarbonization is commendable, corporate net-zero targets will remain out of reach without aggressive value-chain interventions. We recommend that Pinnacle institute a mandatory \u0027Green Supplier Mandate\u0027 effective Q4 2026, requiring all Tier-1 suppliers with contract values exceeding $500,000 to submit third-party audited carbon footprints as a binding condition for annual contract renewal.","Khuyến nghị của Kiểm toán viên \u0026 Hành động Khắc phục Bắt buộc:","Mặc dù quá trình khử carbon trong vận hành nội bộ của Pinnacle rất đáng biểu dương, các mục tiêu phát thải ròng bằng 0 (Net-Zero) của tập đoàn sẽ không thể đạt được nếu thiếu sự can thiệp quyết liệt vào chuỗi giá trị. Chúng tôi khuyến nghị Pinnacle ban hành \u0027Chỉ thị Nhà cung cấp Xanh\u0027 bắt buộc có hiệu lực từ Quý 4 năm 2026, yêu cầu tất cả các nhà cung cấp Tier-1 có giá trị hợp đồng trên 500.000 USD phải nộp báo cáo dấu chân carbon đã được kiểm toán độc lập như một điều kiện ràng buộc để gia hạn hợp đồng hàng năm.","1.4 CÂU HỎI ĐỀ THI \u0026 DỊCH NGHĨA PHÂN TÍCH (QUESTIONS \u0026 TRANSLATIONS)","181. Mục đích chủ yếu của bản chỉ thị do bà Helena Vance ban hành là gì?","(A) Thông báo việc đóng cửa nhà máy do gián đoạn chuỗi cung ứng","(B) Quy định bắt buộc việc kiểm kê phát thải khí nhà kính và quy thức khử carbon","(C) Kêu gọi chào thầu từ các nhà cung cấp nhiên liệu sinh khối trên khắp châu Âu","(D) Đàm phán các thỏa ước lao động mới cho công nhân vận hành nhà máy sản xuất","182. Các nhà máy sản xuất của Pinnacle phải nộp dữ liệu phát thải vận hành trước ngày nào?","(A) Ngày 2 tháng 3","(B) Ngày 15 tháng 4","(C) Ngày 5 tháng 5","(D) Ngày 10 tháng 5","183. Theo báo cáo kiểm toán, yếu tố nào đóng góp lớn nhất vào việc cắt giảm lượng phát thải Scope 1?","(A) Việc lắp đặt hệ thống pin năng lượng mặt trời áp mái tại trụ sở tập đoàn","(B) Việc đưa vào vận hành hệ thống lò hơi điện sinh học tại các nhà máy sản xuất lớn","(C) Mức cắt giảm 50% các chuyến công tác quốc tế của nhân sự tập đoàn","(D) Việc thuê ngoài vĩnh viễn các hoạt động dập kim loại nặng cho các nhà thầu phụ","184. Văn bản thứ hai tiết lộ điều gì về lượng phát thải Scope 3 của tập đoàn Pinnacle?","(A) Chúng đã được triệt tiêu hoàn toàn nhờ các chứng chỉ năng lượng tái tạo","(B) Chúng chiếm tới 71% tổng dấu chân carbon của toàn bộ tập đoàn","(C) Chúng đã giảm được 28,4% so với mức cơ sở năm 2023","(D) Chúng được miễn trừ khỏi sự giám sát pháp lý theo cơ chế CBAM của châu Âu","185. Viện Tư vấn Khí hậu Veritas khuyên Pinnacle triển khai hành động gì vào Quý 4 năm 2026?","(A) Chuyển toàn bộ hoạt động sản xuất sang khu vực Nam Mỹ","(B) Yêu cầu các nhà cung cấp Tier-1 chủ chốt nộp báo cáo kiểm toán dấu chân carbon","(C) Đình chỉ toàn bộ các khoản đầu tư vốn vào hiệu quả năng lượng của các cơ sở","(D) Chấm dứt vĩnh viễn các cuộc kiểm toán thẩm định môi trường của bên thứ ba","1.5 TÓM TẮT FEYNMAN RÚT GỌN (EXECUTIVE FEYNMAN SUMMARY)","Bản tóm tắt bằng Tiếng Anh (English Summary):","• Pinnacle Industrial Manufacturing issued an enterprise-wide decarbonization directive requiring all 12 plants to submit Scope 1 and Scope 2 emissions activity data by April 15, aiming for a 30% reduction by upgrading to biomass-electric boilers.","• Third-party assurance firm Veritas Climate Consulting audited facilities across North America and Europe, certifying an impressive 28.4% cut in operational Scope 1 and 2 emissions (saving 42,000 tCO2e).","• However, the value-chain lifecycle assessment exposed that Scope 3 emissions represent an overwhelming 71% of Pinnacle\u0027s total carbon footprint (620,000 tCO2e), mainly from raw metal smelting and freight.","• Veritas recommended instituting a mandatory \u0027Green Supplier Mandate\u0027 in Q4 2026, compelling Tier-1 vendors with contracts over $500,000 to submit audited carbon reports as a prerequisite for contract renewal.","Bản tóm tắt bằng Tiếng Việt (Vietnamese Summary):","• Tập đoàn Pinnacle ban hành chỉ thị khử carbon bắt buộc 12 nhà máy nộp dữ liệu phát thải Scope 1 và Scope 2 trước ngày 15/4, hướng tới mục tiêu giảm 30% phát thải trực tiếp nhờ chuyển đổi sang lò hơi điện sinh học.","• Viện kiểm toán độc lập Veritas tiến hành xác minh thực địa và chứng nhận Pinnacle đã cắt giảm thành công 28,4% phát thải Scope 1 \u0026 2 (triệt tiêu 42.000 tấn CO2e tại Frankfurt và Detroit).","• Mặc dù vậy, kiểm kê vòng đời chuỗi giá trị cho thấy lượng phát thải Scope 3 chiếm tỷ trọng khổng lồ tới 71% tổng lượng phát thải của tập đoàn (620.000 tấn CO2e), tập trung ở khâu luyện kim và vận tải biển.","• Veritas khuyến nghị ban hành \u0027Chỉ thị Nhà cung cấp Xanh\u0027 vào Quý 4/2026, buộc các nhà cung cấp Tier-1 có hợp đồng trên 500.000 USD phải nộp báo cáo kiểm toán carbon độc lập để được tái ký hợp đồng.","PHẦN 2: BẢNG LUYỆN TẬP PHẢN XẠ NHANH ACTIVE RECALL (5 GIÂY / MỤC)",{"rows":[[["HANG MUC PHAN TICH (5S RECALL)"],["NOI DUNG SONG NGU DOI CHIEU (VI - EN)"]],[["1. Doi tuong \u0026 Vai tro"],["1. Đối tượng \u0026 Vai trò: Helena Vance (Giám đốc Bền vững CSO của Pinnacle) ban hành chỉ thị khử carbon; 12 Giám đốc Nhà máy chịu trách nhiệm nộp dữ liệu kiểm kê Scope 1 \u0026 2; Marcus Thorne (Kiểm toán viên trưởng Veritas Climate Consulting) thực hiện thẩm định độc lập theo chuẩn ISO 14064-3.","1. Characters \u0026 Roles: Helena Vance (CSO of Pinnacle) issues enterprise decarbonization directive; 12 Plant Managers submit Scope 1 \u0026 2 activity data; Marcus Thorne (Lead Auditor at Veritas Climate Consulting) executes ISO 14064-3 independent assurance."]],[["2. Boi canh \u0026 Quy trinh loi"],["2. Bối cảnh \u0026 Quy trình lõi: Quản trị môi trường, kiểm toán dấu chân carbon và tuân thủ thuế carbon biên giới CBAM (Greenhouse Gas Protocol \u0026 Value-Chain Decarbonization). Thu thập dữ liệu phát thải nội bộ trước 15/4 ➔ Kiểm toán thực địa độc lập phát hiện giảm 28,4% phát thải trực tiếp nhưng Scope 3 chiếm tới 71% ➔ Thiết lập hàng rào kỹ thuật ràng buộc nhà cung cấp chuỗi giá trị (Green Supplier Mandate vào Q4/2026).","2. Context \u0026 Core Workflow: Environmental governance, carbon accounting, and EU CBAM regulatory compliance. Collecting internal operational emissions before April 15 ➔ Independent verification certifying 28.4% operational drop while isolating a 71% Scope 3 concentration ➔ Deploying mandatory supply-chain compliance gates (Green Supplier Mandate in Q4 2026)."]],[["3. Dau vet suy luan cheo"],["3. Dấu vết suy luận chéo: Móc nối giải pháp lò hơi sinh học ở Văn bản 1 với con số giảm phát thải thực tế 42.000 tấn CO2e ở Văn bản 2; liên kết rủi ro chuỗi cung ứng Scope 3 chiếm 71% tổng phát thải ở Văn bản 2 với khuyến nghị bắt buộc kiểm toán carbon các nhà cung cấp Tier-1 trên 500.000 USD.","3. Cross-Referencing Clues: Linking the biomass boiler transition plan in Passage 1 with the audited 42,000 tCO2e reduction milestone in Passage 2; correlating the 71% Scope 3 supply-chain footprint in Passage 2 with the mandatory Q4 Green Supplier audit requirement for \u003e$500k vendors."]]],"t":"table"},"PHẦN 3: GIẢI MÃ ĐÁP ÁN, PHÂN TÍCH BẪY ETS \u0026 TRÍCH XUẤT TỪ VỰNG TINH HOA","What is the primary objective of the directive issued by Helena Vance?","Dap an dung: (B) To mandate a greenhouse gas emissions inventory and decarbonization protocol","[Dau vet bai doc / Clue]: Văn bản 1: \u0027Subject: Mandatory 2026 Enterprise Greenhouse Gas (GHG) Emissions Inventory \u0026 Audit Protocol... launching its comprehensive 2026 Enterprise Decarbonization Roadmap.\u0027","[Dien dat tuong duong / Paraphrase]: Mandatory GHG Emissions Inventory \u0026 Decarbonization Roadmap ➔ mandate a greenhouse gas emissions inventory and decarbonization protocol","[Loi giai chi tiet]: Văn bản 1 nêu rõ mục đích chính là ban hành quy thức kiểm kê khí nhà kính bắt buộc và khởi động lộ trình khử carbon toàn diện cho 12 nhà máy của tập đoàn.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) To announce factory closures resulting from supply chain disruptions","- Ly do sai: Văn bản nói về nâng cấp và kiểm toán môi trường, không đề cập đến việc đóng cửa nhà máy.","- Bay ETS: Bẫy Đóng cửa Nhà máy (Factory Closure Trap)","(C) To solicit bids from external biomass fuel suppliers across Europe","- Ly do sai: Chỉ thị nhắc đến lò hơi sinh học như một giải pháp công nghệ, không phải thư mời thầu mua nhiên liệu.","- Bay ETS: Bẫy Mua sắm Nhiên liệu (Procurement Trap)","(D) To negotiate new labor agreements for manufacturing plant operators","- Ly do sai: Văn bản không liên quan đến đàm phán hợp đồng lao động hay tiền lương công nhân.","- Bay ETS: Bẫy Thỏa ước Lao động (Labor Agreement Trap)","By what date must Pinnacle manufacturing plants submit their operational emissions data?","Dap an dung: (B) April 15","[Dau vet bai doc / Clue]: Văn bản 1: \u0027...submit their standardized Scope 1... and Scope 2... operational activity data to the central sustainability portal no later than Wednesday, April 15, 2026.\u0027","[Dien dat tuong duong / Paraphrase]: no later than Wednesday, April 15, 2026 ➔ April 15","[Loi giai chi tiet]: Chỉ thị quy định rõ hạn chót các nhà máy phải nộp dữ liệu hoạt động Scope 1 và Scope 2 là Thứ Tư, ngày 15 tháng 4 năm 2026.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) March 2","- Ly do sai: Ngày 2 tháng 3 là ngày ban hành văn bản chỉ thị nội bộ.","- Bay ETS: Bẫy Ngày Ban hành (Issuance Date Trap)","(C) May 5","- Ly do sai: Ngày 5 tháng 5 là ngày kết thúc đợt kiểm toán tại chỗ của Veritas.","- Bay ETS: Bẫy Ngày Kết thúc Kiểm toán (Audit End Date Trap)","(D) May 10","- Ly do sai: Ngày 10 tháng 5 là ngày Veritas phát hành báo cáo thẩm định chính thức.","- Bay ETS: Bẫy Ngày Báo cáo (Report Date Trap)","According to the audit report, what factor contributed most to the reduction in Scope 1 emissions?","Dap an dung: (B) The commissioning of biomass-electric boilers at major manufacturing plants","[Dau vet bai doc / Clue]: Văn bản 2: \u0027The primary catalyst was the successful commissioning of biomass-electric boilers at the Frankfurt and Detroit facilities, which eliminated 42,000 metric tons of carbon dioxide equivalent (tCO2e).\u0027","[Dien dat tuong duong / Paraphrase]: commissioning of biomass-electric boilers ➔ The commissioning of biomass-electric boilers at major manufacturing plants","[Loi giai chi tiet]: Báo cáo kiểm toán xác nhận động lực hàng đầu giúp cắt giảm lượng phát thải trực tiếp là việc đưa vào vận hành hệ thống lò hơi điện sinh học tại các cơ sở Frankfurt và Detroit.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) The installation of solar rooftop panels at corporate headquarters","- Ly do sai: Không có thông tin về việc lắp pin năng lượng mặt trời tại trụ sở chính.","- Bay ETS: Bẫy Năng lượng Mặt trời Giả định (Solar Assumption Trap)","(C) A 50 percent cut in international corporate travel","- Ly do sai: Cắt giảm công tác thuộc về Scope 3 (công tác công vụ), không phải nguyên nhân chính của Scope 1.","- Bay ETS: Bẫy Giảm Công tác (Travel Reduction Trap)","(D) The permanent outsourcing of heavy stamping operations to contractors","- Ly do sai: Văn bản không đề cập đến việc thuê ngoài hoạt động dập để trốn phát thải.","- Bay ETS: Bẫy Thuê ngoài Sản xuất (Outsourcing Trap)","What does the second passage reveal about Pinnacle\u0027s Scope 3 emissions?","Dap an dung: (B) They comprise 71 percent of the corporation\u0027s overall carbon footprint.","[Dau vet bai doc / Clue]: Văn bản 2: \u0027...revealed that Scope 3 emissions account for an overwhelming 71.0% of Pinnacle\u0027s total carbon footprint (totaling 620,000 tCO2e)...\u0027","[Dien dat tuong duong / Paraphrase]: account for an overwhelming 71.0% of Pinnacle\u0027s total carbon footprint ➔ comprise 71 percent of the corporation\u0027s overall carbon footprint","[Loi giai chi tiet]: Phân tích vòng đời chuỗi cung ứng chỉ ra rằng lượng phát thải Scope 3 chiếm tới 71% tổng dấu chân carbon của toàn bộ tập đoàn.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) They were eliminated entirely through renewable energy credits.","- Ly do sai: Scope 3 chiếm lượng phát thải khổng lồ 620.000 tấn và chưa hề được triệt tiêu.","- Bay ETS: Bẫy Triệt tiêu Hoàn toàn (Total Elimination Trap)","(C) They decreased by 28.4 percent compared to the 2023 baseline.","- Ly do sai: Con số giảm 28,4% là thành tích của Scope 1 \u0026 2, không phải Scope 3.","- Bay ETS: Bẫy Nhầm lẫn Số liệu Scope (Scope Confusion Trap)","(D) They are exempt from European regulatory scrutiny under CBAM.","- Ly do sai: Ngược lại, tập đoàn đang phải tuân thủ nghiêm ngặt theo các tiêu chuẩn CBAM của châu Âu.","- Bay ETS: Bẫy Miễn trừ Pháp lý (Regulatory Exemption Trap)","What action does Veritas Climate Consulting advise Pinnacle to implement in Q4 2026?","Dap an dung: (B) Requiring major Tier-1 suppliers to provide verified carbon footprint audits","[Dau vet bai doc / Clue]: Văn bản 2: \u0027We recommend that Pinnacle institute a mandatory \u0027Green Supplier Mandate\u0027 effective Q4 2026, requiring all Tier-1 suppliers with contract values exceeding $500,000 to submit third-party audited carbon footprints...\u0027","[Dien dat tuong duong / Paraphrase]: requiring all Tier-1 suppliers... to submit third-party audited carbon footprints ➔ Requiring major Tier-1 suppliers to provide verified carbon footprint audits","[Loi giai chi tiet]: Veritas khuyến nghị ban hành chính sách bắt buộc từ Quý 4 yêu cầu tất cả nhà cung cấp Cấp 1 có hợp đồng trên 500.000 USD phải nộp báo cáo kiểm toán carbon độc lập.","[Phan tich Phuong an Sai \u0026 Bay De thi ETS]:","(A) Relocating all manufacturing operations to South America","- Ly do sai: Không có khuyến nghị di dời nhà máy sang Nam Mỹ.","- Bay ETS: Bẫy Di dời Địa lý (Relocation Trap)","(C) Suspending all capital investments in facility energy efficiency","- Ly do sai: Khuyến nghị yêu cầu mở rộng can thiệp ra chuỗi cung ứng chứ không ngừng đầu tư hiệu quả năng lượng.","- Bay ETS: Bẫy Ngừng Đầu tư Vốn (Investment Freeze Trap)","(D) Discontinuing third-party environmental verification audits permanently","- Ly do sai: Kiểm toán độc lập là bắt buộc để duy trì chứng nhận CBAM và SBTi.","- Bay ETS: Bẫy Hủy bỏ Kiểm toán (Audit Cancellation Trap)","PHẦN 4: BẢN PHÂN TÍCH FEYNMAN ĐA GÓC NHÌN \u0026 QUY TRÌNH LUỒNG ĐỒNG HÓA","4.1 SƠ ĐỒ LUỒNG QUY TRÌNH ĐỒNG HÓA NGHIỆP VỤ (END-TO-END WORKFLOW MATRIX)","So do Quy trinh Luan chuyen Nghiep vu (Ban Tieng Viet):",{"rows":[[["BƯỚC 1","THU THẬP DỮ LIỆU PHÁT THẢI \u0026 THIẾT LẬP MỨC CƠ SỞ"],[],["BƯỚC 2","KIỂM TOÁN HIỆN TRƯỜNG \u0026 CHỨNG NHẬN ISO 14064-3"],[],["BƯỚC 3","RÀNG BUỘC CHUỖI GIÁ TRỊ \u0026 THỰC THI GREEN MANDATE"]],[["• Chung tu \u0026 Kenh: Cổng Thông Tin Phát Thải Bền Vững \u0026 Hóa Đơn Nhiên Liệu 12 Nhà Máy","• Nghiep vu thuc thi: 12 nhà máy tổng hợp số đo tiêu thụ dầu khí (Scope 1) và điện mua ngoài (Scope 2) trước 15/4 ➔ Khởi động khảo sát chuỗi giá trị thượng nguồn Scope 3.","• Ket qua \u0026 Kiem soat: Bộ dữ liệu kiểm kê hoạt động phát thải sơ bộ toàn tập đoàn."],["➔"],["• Chung tu \u0026 Kenh: Đơn Vị Độc Lập Veritas Climate Consulting \u0026 Trạm Đo Telemetry","• Nghiep vu thuc thi: Kiểm toán tại chỗ 5 nhà máy ➔ Xác nhận Scope 1 \u0026 2 giảm 28,4% nhờ lò hơi điện sinh học, nhưng bóc tách Scope 3 chiếm tới 71% (620.000 tấn CO2e).","• Ket qua \u0026 Kiem soat: Báo cáo kiểm toán độc lập và bảng điểm phát thải minh bạch chuẩn quốc tế."],["➔"],["• Chung tu \u0026 Kenh: Hệ Thống Quản Lý Đấu Thầu Mua Sắm B2B \u0026 Hợp Đồng Tier-1","• Nghiep vu thuc thi: Ban hành Chỉ thị Nhà cung cấp Xanh vào Q4/2026 ➔ Bắt buộc các đối tác \u003e500.000 USD nộp chứng nhận kiểm toán carbon mới được tái ký hợp đồng thương mại.","• Ket qua \u0026 Kiem soat: Kiểm soát phát thải Scope 3, bảo vệ doanh nghiệp trước thuế carbon biên giới CBAM."]]],"t":"table"},"End-to-End Business Workflow Diagram (English Translation):",{"rows":[[["PHASE 1","ACTIVITY DATA CONSOLIDATION \u0026 BASELINE INVENTORY"],[],["PHASE 2","ON-SITE VERIFICATION \u0026 ISO 14064-3 LIMITED ASSURANCE"],[],["PHASE 3","VALUE-CHAIN GATING \u0026 GREEN SUPPLIER MANDATE"]],[["• Documents \u0026 Channels: Central Sustainability Portal \u0026 12 Plant Fuel Telemetry Records","• Core Business Execution: 12 plants compile Scope 1 direct combustion and Scope 2 purchased power data by April 15 ➔ Launch upstream Scope 3 supplier survey.","• Key Deliverable \u0026 Control: Consolidated enterprise greenhouse gas inventory baseline."],["➔"],["• Documents \u0026 Channels: Veritas Independent Audit Team \u0026 Facility Monitoring Stations","• Core Business Execution: Inspect 5 plants on-site ➔ Certify 28.4% Scope 1/2 reduction via biomass boilers while isolating an overwhelming 71% Scope 3 concentration.","• Key Deliverable \u0026 Control: Third-party verified carbon scorecard and lifecycle diagnostic."],["➔"],["• Documents \u0026 Channels: Enterprise Procurement B2B System \u0026 Master Vendor Agreements","• Core Business Execution: Institutionalize Green Supplier Mandate in Q4 ➔ Require verified carbon audits for Tier-1 suppliers \u003e$500k as condition for renewal.","• Key Deliverable \u0026 Control: End-to-end Scope 3 governance ensuring EU CBAM compliance resilience."]]],"t":"table"},"4.2 GÓC NHÌN BẢN CHẤT NGHIỆP VỤ \u0026 ỨNG DỤNG THỰC TẾ (FEYNMAN VIETNAMESE PERSPECTIVES)","• Bức tranh Toàn cảnh Nghiệp vụ (End-to-End Business Flow): Trong kỷ nguyên chuyển đổi xanh, một doanh nghiệp tuyên bố \u0027thân thiện với môi trường\u0027 không còn dựa vào các hoạt động trồng cây hay khẩu hiệu suông. Các định chế tài chính quốc tế và các thị trường xuất khẩu lớn (như EU với cơ chế thuế carbon CBAM) bắt buộc doanh nghiệp phải kiểm toán dấu chân carbon theo 3 phạm vi rõ ràng: Scope 1 (khói bụi trực tiếp từ nhà máy, xe cộ công ty sở hữu), Scope 2 (lượng than đá tiêu thụ để tạo ra điện mà công ty mua từ lưới điện), và Scope 3 (toàn bộ lượng khí thải gián tiếp sinh ra từ khai thác mỏ quặng của nhà cung ứng cho đến tàu biển chở hàng đi bán). Nghịch lý phổ biến là doanh nghiệp cắt giảm rất tốt trong nội bộ (nhờ lắp pin mặt trời, đổi lò hơi sinh học), nhưng 70-80% ô nhiễm lại nằm ở các đối tác bên ngoài; do đó, vũ khí tối hậu là buộc các nhà cung ứng phải xanh hóa nếu muốn tiếp tục được ký hợp đồng.","• Lăng kính Viễn thông / CNTT Viettel: Tại Tập đoàn Viettel và các trung tâm dữ liệu (Viettel IDC, hạ tầng Viettel Tammi), bài toán tối ưu năng lượng xanh được triển khai với tính kỷ luật công nghệ cao. Các Trung tâm Dữ liệu (Data Center) tiêu thụ lượng điện khổng lồ (Scope 2) để làm mát hàng vạn máy chủ. Viettel áp dụng công nghệ làm mát bằng chất lỏng (Liquid Cooling) và sử dụng điện năng lượng mặt trời áp mái tại các trạm BTS viễn thông nhằm giảm tối đa hệ số hiệu quả sử dụng điện năng (PUE \u003c 1.3). Khi đối tác phần cứng quốc tế (như các hãng máy chủ server) cung cấp thiết bị cho Viettel, Viettel đưa tiêu chí chứng nhận nhãn sinh thái EPEAT và báo cáo kiểm kê carbon của nhà sản xuất vào hồ sơ mời thầu, nhằm kiểm soát phát thải Scope 3 chuỗi cung ứng.","• Lăng kính Quản trị Mầm non Ước Mơ Xanh: Tại trường mầm non, việc chuyển đổi xanh và thực hành lối sống bền vững được giáo dục từ những hành động cụ thể nhất. \u0027Phát thải Scope 1 \u0026 2\u0027 của nhà trường chính là lượng điện bật máy lạnh ở các lớp học và lượng gas đun nấu tại bếp ăn bán trú. Nhà trường lắp đặt hệ thống máy nước nóng năng lượng mặt trời và chuyển dần sang bếp từ công nghiệp để giảm phát thải khí độc hại. \u0027Phát thải Scope 3\u0027 chính là chuỗi thực phẩm rau củ quả được xe tải giao đến trường mỗi sáng. Cô Hiệu trưởng Ước Mơ Xanh ưu tiên ký hợp đồng với các trang trại hữu cơ địa phương có cự ly vận chuyển ngắn dưới 20 km để giảm thiểu khí thải xe cộ và bảo đảm độ tươi ngon của bữa ăn cho các bé.","• Lăng kính Bàn học Gia đình (Kèm cặp Bé Hà Ngân Lớp Lá 5 Tuổi): Để giải thích cho bé Hà Ngân, ba dùng hình ảnh \u0027Chiếc Ba-lô Khói Đen Của Nhà Máy Đồ Chơi\u0027: \u0027Con tưởng tượng mỗi nhà máy sản xuất xe đồ chơi đều đeo một chiếc ba-lô đựng khói đen. Chiếc túi nhỏ ở phía trước là khói bay ra từ bếp lò của bác thợ mộc (Scope 1). Chiếc túi thứ hai là bóng đèn điện thắp sáng phòng học đồ chơi (Scope 2). Hai túi này nhà máy đã dọn dẹp rất sạch sẽ, thay bóng đèn thông minh và không đốt củi than nữa. Nhưng ở phía sau lưng có một chiếc bao tải khổng lồ to gấp 3 lần (Scope 3), đựng đầy khói của những chiếc xe tải chở gỗ và tàu thủy chở nhựa từ rừng xa về. Bác giám đốc nhà máy liền đặt ra quy định: bác lái xe tải nào muốn chở hàng vào xưởng thì phải đi xe điện hoặc xe không nhả khói đen, nếu không xưởng sẽ không mua gỗ nữa. Nhờ vậy, bầu trời quanh trường học của bé Hà Ngân lúc nào cũng trong xanh mát mẻ!\u0027","4.3 BẢN PHÂN TÍCH FEYNMAN CHUYÊN SÂU DÀNH CHO BUSINESS ANALYST (ENGLISH BA PERSPECTIVE)","• Enterprise GHG Accounting \u0026 Structural Decoupling of Scope 3 Emissions: From a Business Architecture and corporate compliance viewpoint, Pinnacle\u0027s case study demonstrates the classic structural disparity in modern ESG reporting. While internal operational controls (Scope 1 \u0026 2) achieved a commendable 28.4% reduction via capital-intensive boiler retrofits, the enterprise discovered that 71.0% of its real carbon liability lies upstream in Scope 3. Under the GHG Protocol Corporate Value Chain Standard and emerging regulatory mandates like the EU Corporate Sustainability Due Diligence Directive (CSDDD), enterprises cannot claim true ESG leadership without actively auditing and governing their external supplier ecosystem.","• Contractual Gating Mechanisms for Supply Chain Sustainability: What elevates this case for systems analysts is the operational solution recommended by Veritas: the \u0027Green Supplier Mandate\u0027. Treating sustainability as a voluntary survey yields low compliance and unreliable data. By integrating third-party verified carbon audits directly into the master vendor procurement pipeline—making it a mandatory gate for contracts exceeding $500,000—Pinnacle converts ESG compliance from an aspirational marketing initiative into an enforceable commercial SLA. This contractually mitigates future border carbon tariffs (CBAM) while driving tangible value-chain decarbonization.","PHẦN 5: BỘ TỪ VỰNG TINH HOA \u0026 THUẬT NGỮ CHUYỂN ĐỔI XANH \u0026 ESG (CORE VOCABULARY)","Decarbonization Roadmap  /diːˌkɑːr.bən.aɪˈzeɪ.ʃən ˈroʊd.mæp/  Carbon Abatement Strategy / Net-Zero Transition Plan / Emission Reduction Trajectory","Nghia: Lộ trình khử carbon, kế hoạch chiến lược dài hạn có mục tiêu đo lường được nhằm loại bỏ hoặc giảm thiểu tối đa lượng phát thải khí nhà kính trong hoạt động của tổ chức.","Vd: The board approved a capital expenditure plan to fund the 2026 enterprise decarbonization roadmap. - Hội đồng quản trị đã phê duyệt kế hoạch chi tiêu vốn để tài trợ cho lộ trình khử carbon doanh nghiệp năm 2026.","Scope 1, 2, 3 Emissions  /skoʊp wʌn, tuː, θriː iˈmɪʃ.ənz/  Direct, Indirect \u0026 Value-Chain Greenhouse Gas Emissions Tiers","Nghia: Ba phạm vi phát thải khí nhà kính theo chuẩn quốc tế: Scope 1 là phát thải trực tiếp từ cơ sở sở hữu; Scope 2 là phát thải gián tiếp từ điện mua ngoài; Scope 3 là phát thải trong toàn bộ chuỗi giá trị.","Vd: The environmental audit revealed that Scope 3 emissions represented over seventy percent of the total corporate footprint. - Cuộc kiểm toán môi trường chỉ ra rằng phát thải Scope 3 chiếm hơn 70% tổng dấu chân carbon của doanh nghiệp.","Biomass-Electric Boiler  /ˈbaɪ.oʊˌmæs ɪˈlek.trɪk ˈbɔɪ.lɚ/  Renewable Steam Generator / Biofuel Combustion Boiler / Clean Thermal System","Nghia: Hệ thống lò hơi điện sinh học, thiết bị tạo nhiệt và hơi nước sử dụng nhiên liệu sinh khối tái tạo kết hợp điện năng sạch thay vì đốt than đá hoặc dầu mỏ truyền thống.","Vd: Replacing coal units with biomass-electric boilers eliminated forty-two thousand metric tons of carbon emissions. - Việc thay thế các tổ máy chạy than bằng lò hơi điện sinh học đã loại bỏ 42.000 tấn khí thải carbon.","Limited Assurance  /ˈlɪm.ə.t̬ɪd əˈʃʊr.əns/  Moderate Audit Verification / Negative Assurance Review / Third-Party Carbon Attestation","Nghia: Bảo đảm có giới hạn (chuẩn kiểm toán ISO 14064-3), mức độ xác nhận của bên thứ ba độc lập khẳng định không phát hiện sai lệch trọng yếu nào trong dữ liệu báo cáo môi trường.","Vd: The independent consultancy delivered a limited assurance statement confirming the accuracy of the emissions data. - Công ty tư vấn độc lập đã đưa ra tuyên bố bảo đảm có giới hạn xác nhận tính chính xác của dữ liệu phát thải.","Carbon Border Adjustment Mechanism (CBAM)  /ˈkɑːr.bən ˈbɔːr.dɚ əˈdʒʌst.mənt ˈmek.ə.nɪ.zəm/  Carbon Border Tariff / Environmental Import Duty / Cross-Border Emissions Equalization Tax","Nghia: Cơ chế điều chỉnh biên giới carbon (CBAM), chính sách áp thuế carbon của Liên minh Châu Âu đối với hàng hóa nhập khẩu có mức phát thải cao nhằm bảo đảm công bằng sinh thái.","Vd: Exporters must provide certified emissions scorecards to avoid punitive tariffs under European CBAM regulations. - Các doanh nghiệp xuất khẩu phải cung cấp bảng điểm phát thải được chứng nhận để tránh các khoản thuế trừng phạt theo quy định CBAM của Châu Âu.","Tier-1 Supplier  /tɪr wʌn səˈplaɪ.ɚ/  Direct Vendor / Primary Contractor / First-Level Supply Partner","Nghia: Nhà cung cấp Cấp 1, đơn vị cung ứng vật tư, nguyên liệu hoặc dịch vụ trực tiếp cho doanh nghiệp sản xuất đầu chuỗi mà không thông qua bất kỳ khâu trung gian nào.","Vd: The procurement office mandated that all Tier-1 suppliers submit third-party audited carbon footprints for contract renewal. - Phòng mua sắm đã quy định bắt buộc toàn bộ nhà cung cấp Cấp 1 phải nộp báo cáo kiểm toán carbon độc lập để được gia hạn hợp đồng.","==================================================================================================","BÀI 2: CHUYỂN DỊCH NĂNG LƯỢNG TÁI TẠO \u0026 HỢP ĐỒNG MUA BÁN ĐIỆN TRỰC TIẾP PPA (CORPORATE RENEWABLE PPA \u0026 ONSITE SOLAR ROOFTOP TRANSITION)","TOEIC Part 7 - Đề thi ETS / Hacker Format (Questions 186-190 - Triple Passage)","PHẦN 1: BẢN GỐC ĐỀ THI, CHIẾN THUẬT NẮM BẮT DỮ KIỆN \u0026 BẢN DỊCH SONG NGỮ ĐỐI CHIẾU","1.1 BẢN GỐC ĐỀ THI (ORIGINAL READING PASSAGES)","[ORIGINAL ETS PASSAGES - DE THI TIENG ANH GOC]:","EXECUTIVE CORPORATE ANNOUNCEMENT","OmniLogistics Distribution Hub — Infrastructure \u0026 Energy Transition Office","Press Release Ref: #PR-2026-06 | Issued: June 15, 2026","RENEWABLE ENERGY MILESTONE","To: Corporate Stakeholders, Supply Chain Partners, and Regional Personnel","From: David Chen, Executive Vice President of Global Logistics Operations","Date: June 15, 2026","Subject: OmniLogistics Launches 4.5 MW Rooftop Solar Project \u0026 10-Year Corporate PPA","As part of OmniLogistics\u0027 binding environmental pledge to achieve 100% renewable electricity across all Western US hubs by 2028, we are proud to announce the commencement of our flagship clean energy transition at our 500,000-square-foot Nevada Multimodal Logistics Campus.","Project Architecture:","1. Onsite Photovoltaic Installation: We have retrofitted our central warehouse roofing with a state-of-the-art 4.5 Megawatt (MW) commercial solar array. Once energized, this onsite installation will generate approximately 65% of the facility\u0027s daytime electrical load, powering our automated sorting systems, conveyor belts, and electric forklift charging banks.","2. Offsite Corporate Power Purchase Agreement (PPA): To supply the remaining 35% of electricity required for our intensive nocturnal sorting operations, OmniLogistics has executed a comprehensive 10-year direct Corporate PPA with Helios Clean Energy Ltd., sourcing bundled solar power from their Mojave Desert utility farm.","Final physical grid interconnection testing is scheduled for early August under the regulatory oversight of the Pacific Utility Board.","CORPORATE POWER PURCHASE AGREEMENT (PPA) SUMMARY","Helios Clean Energy Ltd. \u0026 OmniLogistics Hub — Legal Service Contract","Contract Ref: #PPA-NV-2026-88 | Effective Date: July 1, 2026","SUMMARY OF MASTER ENERGY SERVICE TERMS","Parties: Helios Clean Energy Ltd. (Power Provider) \u0026 OmniLogistics Hub (Offtaker)","Contract Term: 10 Years (July 1, 2026 through June 30, 2036)","Key Commercial \u0026 Technical Provisions:","• Contracted Tariff: OmniLogistics agrees to purchase bundled electricity at a fixed, unescalated tariff of $0.068 per kilowatt-hour (kWh). This rate includes all associated Bundled Renewable Energy Certificates (RECs) certified under Green-e standards.","• Minimum Guaranteed Output: Helios guarantees an annual cumulative delivery benchmark of 8,500 Megawatt-hours (MWh). If annual generation falls below 95% of this threshold due to provider equipment failure, Helios will issue a financial credit to OmniLogistics calculated at the prevailing wholesale market spot price differential.","• Onsite Facility Maintenance: Helios will manage full operational maintenance for the onsite 4.5 MW rooftop installation, encompassing 24/7 IoT inverter telemetry and semi-annual robotic panel washings to prevent particulate soiling.","UTILITY INTERCONNECTION \u0026 TARIFF ACTIVATION NOTICE","Pacific Utility Board — Regional Grid Operations Division","Notice Ref: #PUB-GRID-2026-941 | Issued: August 18, 2026","NOTICE OF FINAL INSPECTION APPROVAL \u0026 COMMERCIAL ENERGIZATION","To: David Chen (OmniLogistics Hub) \u0026 Project Engineering (Helios Clean Energy)","From: Sharon Gallagher, Director of Grid Interconnection, Pacific Utility Board","Date: August 18, 2026","Subject: Interconnection Acceptance \u0026 Activation of Net Energy Metering (NEM 3.0)","This letter serves as formal notification that the 4.5 MW rooftop photovoltaic installation and dedicated transformer substation at OmniLogistics\u0027 Nevada Multimodal Campus successfully passed all mandatory grid safety and anti-islanding synchronization tests conducted on August 12, 2026.","Metering and Export Tariff Terms:","A bidirectional, four-quadrant revenue smart meter has been activated. Under our Net Energy Metering (NEM 3.0) framework, surplus electricity generated by OmniLogistics during low-demand weekend operating windows will be exported to the municipal grid and credited at our wholesale avoided-cost export rate ($0.042/kWh), offsetting utility charges during winter peak demand billing cycles.","Commercial Operation Date (COD):","Permission to Operate (PTO) is granted effective Monday, August 24, 2026, on which date the system may commence full commercial power generation.","[ORIGINAL ETS QUESTIONS \u0026 OPTIONS]:","186. According to the announcement in the first passage, what percentage of daily power will be supplied by the onsite rooftop solar array?","(A) 28 percent","(B) 35 percent","(C) 65 percent","(D) 100 percent","187. In the contract in the second passage, what is the fixed electricity tariff agreed upon between the parties?","(A) $0.042 per kilowatt-hour","(B) $0.068 per kilowatt-hour","(C) $0.095 per kilowatt-hour","(D) $0.120 per kilowatt-hour","188. What compensation must Helios Clean Energy provide if annual electricity generation falls below guaranteed levels?","(A) Free installation of additional rooftop solar panels","(B) An automatic extension of the contract term by two years","(C) A financial credit calculated from the market spot price differential","(D) Replacement of all electric forklifts at the distribution hub","189. According to the utility notice in the third passage, what will happen to excess electricity generated on weekends?","(A) It will be stored in emergency backup diesel generators.","(B) It will be curtailed to avoid overloading local residential lines.","(C) It will be exported to the grid and credited at a wholesale tariff.","(D) It will be transferred free of charge to neighboring commercial facilities.","190. When will the solar energy system officially begin commercial operation?","(A) June 15, 2026","(B) July 1, 2026","(C) August 12, 2026","(D) August 24, 2026","1.2 BẢNG HƯỚNG DẪN CHIẾN THUẬT 5 PHÚT \u0026 DẤU VẾT SUY LUẬN CHÉO GIỮA CÁC ĐOẠN","CHIẾN THUẬT 5 PHÚT TỐI ƯU: NẮM BẮT BỐI CẢNH, GHÉP NỐI DỮ KIỆN \u0026 TÓM TẮT FEYNMAN (1 PHÚT / CÂU):","Bước 1 (30 giây) - Nắm bắt Bối cảnh \u0026 Quét Z-Pattern: Quét 3 văn bản: Văn bản 1 là Thông báo của Trung tâm Phân phối OmniLogistics công bố kế hoạch lắp đặt 4,5 MW điện mặt trời áp mái tự cấp 65% nhu cầu điện và ký hợp đồng PPA 10 năm bù đắp 35% điện năng ban đêm; Văn bản 2 là Hợp đồng Mua bán Điện Trực tiếp (PPA) giữa nhà phát triển năng lượng Helios Clean Energy và OmniLogistics chốt giá cố định 0,068 USD/kWh kèm chứng chỉ năng lượng tái tạo REC và bảo lãnh sản lượng 8.500 MWh/năm; Văn bản 3 là Thông báo Đấu nối Lưới điện của Pacific Utility Board xác nhận nghiệm thu kỹ thuật thành công, lắp đồng hồ hai chiều đo đếm bù trừ điện dư thừa cuối tuần (0,042 USD/kWh) và ngày vận hành thương mại là 24/8/2026.","Bước 2 (60 giây) - Móc nối Logic \u0026 Sơ đồ Tinh thần: Thiết lập quy trình chuyển đổi năng lượng xanh: Lập kế hoạch tự sản tự tiêu kết hợp mua ngoài (Văn bản 1: 65% áp mái + 35% PPA) ➔ Ký hợp đồng thương mại ràng buộc pháp lý \u0026 cơ chế bồi thường thiếu hụt sản lượng (Văn bản 2: giá 0,068 USD/kWh, phạt bồi hoàn theo giá giao ngay nếu hụt dưới 95%) ➔ Nghiệm thu kỹ thuật đấu nối lưới điện \u0026 kích hoạt cơ chế bù trừ Net Metering (Văn bản 3: bán điện dư thừa 0,042 USD/kWh và đóng điện ngày 24/8).","Bước 3 (120 giây) - Định vị Manh mối \u0026 Giải đề Tốc độ: Câu 186 hỏi tỷ lệ điện do hệ thống áp mái tại chỗ cung cấp (65%); Câu 187 hỏi mức giá điện cố định đã ký trong hợp đồng PPA (0,068 USD/kWh); Câu 188 hỏi phương thức đền bù của Helios nếu sản lượng hụt dưới 95% (khấu trừ tiền phạt chênh lệch theo giá giao ngay thị trường); Câu 189 (câu hỏi liên kết) hỏi sản lượng điện dư thừa vào cuối tuần sẽ được xử lý ra sao (bán lên lưới điện và bù trừ hóa đơn với giá 0,042 USD/kWh); Câu 190 (câu hỏi liên kết) hỏi thời điểm chính thức vận hành thương mại toàn hệ thống (ngày 24 tháng 8 năm 2026).","Bước 4 (30 giây) - Đúc kết Feynman 1 Câu: Hiểu bản chất: Doanh nghiệp xanh hóa nguồn điện bằng chiến lược kép: ban ngày tận dụng mái kho bãi tự phát điện sạch giá rẻ, ban đêm mua điện tái tạo qua hợp đồng dài hạn PPA cố định giá để khóa rủi ro lạm phát tiền điện và bán điện thừa ngày nghỉ lên lưới quốc gia.","1.3 BẢN DỊCH SONG NGỮ ĐỐI CHIẾU VIỆT - ANH (BILINGUAL PARALLEL TRANSLATION)","VĂN BẢN 1: THÔNG BÁO VỀ DỰ ÁN NĂNG LƯỢNG MẶT TRỜI (EXECUTIVE CORPORATE ANNOUNCEMENT)","RENEWABLE ENERGY MILESTONE","To: Corporate Stakeholders, Supply Chain Partners, and Regional Personnel","From: David Chen, Executive Vice President of Global Logistics Operations","Date: June 15, 2026","Subject: OmniLogistics Launches 4.5 MW Rooftop Solar Project \u0026 10-Year Corporate PPA","DẤU MỐC NĂNG LƯỢNG TÁI TẠO","Kính gửi: Các Bên liên quan Doanh nghiệp, Đối tác Chuỗi Cung ứng và Nhân sự Khu vực","Từ: David Chen, Phó Chủ tịch Điều hành Vận hành Logistics Toàn cầu","Ngày: 15 tháng 6 năm 2026","Chủ đề: OmniLogistics Khởi động Dự án Điện Mặt trời Áp mái 4,5 MW \u0026 Hợp đồng PPA Doanh nghiệp 10 Năm","As part of OmniLogistics\u0027 binding environmental pledge to achieve 100% renewable electricity across all Western US hubs by 2028, we are proud to announce the commencement of our flagship clean energy transition at our 500,000-square-foot Nevada Multimodal Logistics Campus.","Như một phần trong cam kết môi trường có tính ràng buộc của OmniLogistics nhằm đạt 100% điện năng tái tạo tại tất cả các trung tâm miền Tây nước Mỹ vào năm 2028, chúng tôi tự hào công bố sự khởi đầu của dự án chuyển dịch năng lượng sạch trọng điểm tại Khu Phức hợp Logistics Đa phương thức Nevada rộng 500.000 foot vuông của chúng ta.","Project Architecture:","1. Onsite Photovoltaic Installation: We have retrofitted our central warehouse roofing with a state-of-the-art 4.5 Megawatt (MW) commercial solar array. Once energized, this onsite installation will generate approximately 65% of the facility\u0027s daytime electrical load, powering our automated sorting systems, conveyor belts, and electric forklift charging banks.","Kiến trúc Dự án:","1. Lắp đặt Hệ thống Quang điện Tại chỗ: Chúng tôi đã cải tạo mái kho trung tâm bằng hệ thống pin mặt trời thương mại tiên tiến công suất 4,5 Megawatt (MW). Sau khi được đóng điện, hệ thống tại chỗ này sẽ tạo ra khoảng 65% phụ tải điện ban ngày của cơ sở, cung cấp năng lượng cho hệ thống phân loại tự động, băng chuyền và các trạm sạc xe nâng điện.","2. Offsite Corporate Power Purchase Agreement (PPA): To supply the remaining 35% of electricity required for our intensive nocturnal sorting operations, OmniLogistics has executed a comprehensive 10-year direct Corporate PPA with Helios Clean Energy Ltd., sourcing bundled solar power from their Mojave Desert utility farm.","Final physical grid interconnection testing is scheduled for early August under the regulatory oversight of the Pacific Utility Board.","2. Hợp đồng Mua bán Điện Trực tiếp Doanh nghiệp Ngoài khuôn viên (PPA): Để cung cấp 35% lượng điện còn lại cần thiết cho các hoạt động phân loại hàng hóa cường độ cao vào ban đêm, OmniLogistics đã ký kết hợp đồng PPA doanh nghiệp trực tiếp toàn diện thời hạn 10 năm với Helios Clean Energy Ltd., mua nguồn điện mặt trời kèm chứng chỉ từ trang trại năng lượng quy mô lớn tại Sa mạc Mojave của họ.","Các thử nghiệm đấu nối vật lý vào lưới điện cuối cùng dự kiến diễn ra vào đầu tháng 8 dưới sự giám sát quản lý của Ban Tiện ích Thái Bình Dương (Pacific Utility Board).","VĂN BẢN 2: TÓM TẮT HỢP ĐỒNG PPA NĂNG LƯỢNG MẶT TRỜI (PPA SERVICE CONTRACT SUMMARY)","SUMMARY OF MASTER ENERGY SERVICE TERMS","Parties: Helios Clean Energy Ltd. (Power Provider) \u0026 OmniLogistics Hub (Offtaker)","Contract Term: 10 Years (July 1, 2026 through June 30, 2036)","TÓM TẮT CÁC ĐIỀU KHOẢN DỊCH VỤ NĂNG LƯỢNG CHÍNH","Các bên: Helios Clean Energy Ltd. (Đơn vị Cung cấp Năng lượng) \u0026 OmniLogistics Hub (Bên Mua Điện - Offtaker)","Thời hạn Hợp đồng: 10 Năm (Từ ngày 1 tháng 7 năm 2026 đến hết ngày 30 tháng 6 năm 2036)","Key Commercial \u0026 Technical Provisions:","• Contracted Tariff: OmniLogistics agrees to purchase bundled electricity at a fixed, unescalated tariff of $0.068 per kilowatt-hour (kWh). This rate includes all associated Bundled Renewable Energy Certificates (RECs) certified under Green-e standards.","Các Điều khoản Thương mại \u0026 Kỹ thuật Trọng tâm:","• Biểu giá Hợp đồng: OmniLogistics đồng ý mua điện trọn gói với mức giá cố định, không trượt giá là 0,068 USD trên mỗi kilowatt-giờ (kWh). Mức giá này đã bao gồm toàn bộ các Chứng chỉ Năng lượng Tái tạo (REC) đi kèm được chứng nhận theo tiêu chuẩn Green-e.","• Minimum Guaranteed Output: Helios guarantees an annual cumulative delivery benchmark of 8,500 Megawatt-hours (MWh). If annual generation falls below 95% of this threshold due to provider equipment failure, Helios will issue a financial credit to OmniLogistics calculated at the prevailing wholesale market spot price differential.","• Sản lượng Tối thiểu Cam kết: Helios bảo lãnh sản lượng phát lũy kế hàng năm đạt mốc chuẩn 8.500 Megawatt-giờ (MWh). Nếu sản lượng thực tế hàng năm giảm xuống dưới 95% ngưỡng này do lỗi thiết bị của nhà cung cấp, Helios sẽ cấp một khoản bù trừ tài chính (credit) cho OmniLogistics được tính theo mức chênh lệch giá giao ngay trên thị trường bán buôn hiện hành.","• Onsite Facility Maintenance: Helios will manage full operational maintenance for the onsite 4.5 MW rooftop installation, encompassing 24/7 IoT inverter telemetry and semi-annual robotic panel washings to prevent particulate soiling.","• Bảo trì Cơ sở Tại chỗ: Helios sẽ chịu trách nhiệm toàn bộ việc bảo dưỡng vận hành cho hệ thống áp mái 4,5 MW tại chỗ, bao gồm việc giám sát đo lường bộ biến tần IoT 24/7 và rửa tấm pin bằng robot định kỳ 6 tháng một lần để ngăn ngừa bụi bẩn tích tụ.","VĂN BẢN 3: THÔNG BÁO ĐẤU NỐI LƯỚI ĐIỆN VÀ BIỂU GIÁ (UTILITY INTERCONNECTION NOTICE)","NOTICE OF FINAL INSPECTION APPROVAL \u0026 COMMERCIAL ENERGIZATION","To: David Chen (OmniLogistics Hub) \u0026 Project Engineering (Helios Clean Energy)","From: Sharon Gallagher, Director of Grid Interconnection, Pacific Utility Board","Date: August 18, 2026","Subject: Interconnection Acceptance \u0026 Activation of Net Energy Metering (NEM 3.0)","THÔNG BÁO PHÊ DUYỆT NGHIỆM THU CUỐI CÙNG \u0026 ĐÓNG ĐIỆN THƯƠNG MẠI","Kính gửi: David Chen (OmniLogistics Hub) \u0026 Bộ phận Kỹ thuật Dự án (Helios Clean Energy)","Từ: Sharon Gallagher, Giám đốc Đấu nối Lưới điện, Ban Tiện ích Thái Bình Dương","Ngày: 18 tháng 8 năm 2026","Chủ đề: Nghiệm thu Đấu nối \u0026 Kích hoạt Đo đếm Bù trừ Điện Năng (NEM 3.0)","This letter serves as formal notification that the 4.5 MW rooftop photovoltaic installation and dedicated transformer substation at OmniLogistics\u0027 Nevada Multimodal Campus successfully passed all mandatory grid safety and anti-islanding synchronization tests conducted on August 12, 2026.","Văn bản này đóng vai trò là thông báo chính thức xác nhận hệ thống quang điện áp mái 4,5 MW và trạm biến áp chuyên dụng tại Khu phức hợp Đa phương thức Nevada của OmniLogistics đã vượt qua thành công toàn bộ các bài kiểm tra an toàn lư
