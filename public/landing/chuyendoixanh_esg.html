 hoàn, mô hình quản lý vật liệu đóng gói khép kín nơi mọi bao bì sau khi sử dụng đều được tái chế cơ học hoặc phân hủy sinh học hoàn toàn mà không tạo ra chất thải ra môi trường."]],[["21"],["Post-Consumer Recycled (PCR) Content","/poʊst kənˈsuː.mɚ rɪˈsaɪ.kəld ˈkɑːn.tent/"],["Recycled Secondary Fiber Content / Post-Use Recycled Material Ratio / Reclaimed Cardboard Share"],["Hàm lượng tái chế sau tiêu dùng (PCR), tỷ lệ phần trăm nguyên liệu trong sản phẩm (giấy, nhựa) được sản xuất từ các vật phẩm đã qua sử dụng của người tiêu dùng được thu gom và tái chế lại."]],[["22"],["Compostability Standard (ASTM D6400)","/ˌkɑːm.poʊ.stəˈbɪl.ə.t̬i ˈstæn.dɚd/"],["Industrial Biodegradation Benchmark / Organic Disintegration Protocol / Eco-Composting Standard"],["Tiêu chuẩn khả năng ủ phân hữu cơ (ASTM D6400 / EN 13432), quy chuẩn kỹ thuật quốc tế kiểm định một vật liệu có khả năng phân rã hoàn toàn thành mùn đất trong môi trường ủ phân công nghiệp mà không để lại độc tố."]],[["23"],["Mycelium Packaging","/maɪˈsiː.li.əm ˈpæk.ɪ.dʒɪŋ/"],["Mushroom Root Void-Fill / Bio-Based Cushioning Substrate / Agricultural Waste Packaging"],["Bao bì sợi nấm (Mycelium), vật liệu đóng gói sinh học đột phá được nuôi cấy từ hệ sợi nấm kết hợp với phụ phẩm nông nghiệp (vỏ trấu, bã gai dầu), thay thế hoàn hảo cho xốp nhựa EPS và tự phân hủy hoàn toàn."]],[["24"],["Landfill Diversion Rate","/ˈlænd.fɪl daɪˈvɝː.ʒən reɪt/"],["Waste Avoidance Percentage / Landfill Recovery Ratio / Circular Repurposing Rate"],["Tỷ lệ chuyển hướng rác thải khỏi bãi chôn lấp, chỉ số đo lường tỷ lệ phần trăm tổng khối lượng rác thải phát sinh được xử lý qua tái chế, tái sử dụng hoặc ủ phân thay vì mang đi chôn lấp độc hại."]],[["25"],["Environmental Due Diligence","/ɪnˌvaɪ.rənˈmen.t̬əl duː ˈdɪl.ə.dʒəns/"],["Ecological Risk Auditing / Supply Chain Environmental Vetting / Sustainability Compliance Assessment"],["Thẩm định môi trường chuỗi cung ứng, quá trình điều tra, đánh giá toàn diện các rủi ro sinh thái và mức độ tuân thủ pháp luật môi trường của các đối tác kinh doanh trước và trong quá trình hợp tác."]],[["26"],["Corrective Action Plan (CAP)","/kəˈrek.tɪv ˈæk.ʃən plæn/"],["Remediation Action Schedule / Defect Resolution Roadmap / Compliance Cure Plan"],["Kế hoạch hành động khắc phục (CAP), văn bản cam kết có thời hạn bắt buộc doanh nghiệp vi phạm phải thực hiện các biện pháp sửa chữa kỹ thuật để khắc phục các điểm không phù hợp đã được thanh tra phát hiện."]],[["27"],["EcoVadis Rating","/ˌiː.koʊˈvæd.ɪs ˈreɪ.tɪŋ/"],["Independent ESG Scorecard / Third-Party Sustainability Metric / Corporate Social Responsibility Index"],["Bảng xếp hạng đánh giá tính bền vững EcoVadis, thang điểm đánh giá độc lập uy tín toàn cầu (thang 0-100) đo lường hiệu quả quản trị của doanh nghiệp trên 4 trụ cột: Môi trường, Lao động, Đạo đức và Mua sắm."]],[["28"],["Chemical Passivation","/ˈkem.ɪ.kəl ˌpæs.əˈveɪ.ʃən/"],["Metal Anti-Corrosion Treatment / Surface Acid Passivation / Protective Oxide Coating Process"],["Quy trình thụ động hóa hóa chất kim loại, phương pháp xử lý bề mặt kim loại bằng axit hoặc hóa chất chuyên dụng để tạo lớp màng oxit bảo vệ chống ăn mòn và gỉ sét cho các linh kiện hàng không."]],[["29"],["Chemical Precipitation","/ˈkem.ɪ.kəl prɪˌsɪp.əˈteɪ.ʃən/"],["Heavy Metal Coagulation / Wastewater Sedimentation Process / Effluent Neutralization Treatment"],["Kết tủa hóa chất xử lý nước thải, kỹ thuật cho hóa chất phản ứng để biến các ion kim loại nặng hòa tan (như crom, niken) thành chất rắn không tan lắng đọng xuống đáy để lọc bỏ sạch khỏi nước thải."]],[["30"],["Corporate Sustainability Due Diligence Directive (CSDDD)","/ˈkɔːr.pɚ.ət səˌsteɪ.nəˈbɪl.ə.t̬i duː ˈdɪl.ə.dʒəns dɪˈrek.tɪv/"],["EU Mandatory ESG Supply Law / European Value-Chain Due Diligence Act / Cross-Border Supply Accountability Mandate"],["Chỉ thị thẩm định tính bền vững doanh nghiệp của Liên minh Châu Âu (CSDDD), luật pháp mang tính ràng buộc buộc các công ty lớn phải chịu trách nhiệm pháp lý về các tác động tiêu cực đến môi trường trong toàn bộ chuỗi cung ứng."]],[["31"],["Fleet Electrification","/fliːt iˌlek.trə.fəˈkeɪ.ʃən/"],["Commercial EV Transition / Zero-Emission Fleet Conversion / Vehicle Fleet Decarbonization"],["Điện hóa đội xe, quá trình chuyển đổi toàn bộ hoặc một phần đội phương tiện vận tải thương mại (xe tải, xe buýt, xe giao hàng) từ động cơ đốt trong truyền thống sang phương tiện chạy điện hoàn toàn."]],[["32"],["Fleet-as-a-Service (FaaS)","/fliːt æz ə ˈsɝː.vɪs/"],["Turnkey Commercial EV Leasing / Bundled Mobility Service / Full-Service Fleet Outsourcing"],["Đội xe như một Dịch vụ (FaaS), mô hình kinh doanh cho thuê trọn gói phương tiện xe điện bao gồm xe, trạm sạc, bảo trì bảo dưỡng, bảo hiểm và phần mềm quản lý mà bên thuê không cần bỏ vốn mua xe."]],[["33"],["State of Health (SoH)","/steɪt əv helθ/"],["Battery Retention Capacity / Usable Battery Lifespan Ratio / Energy Storage Degradation Metric"],["Trạng thái sức khỏe của pin (SoH), chỉ số phần trăm đo lường khả năng lưu trữ năng lượng hiện tại của khối pin so với dung lượng thiết kế ban đầu khi còn mới xuất xưởng."]],[["34"],["Dynamic Load Management (DLM)","/daɪˈnæm.ɪk loʊd ˈmæn.ədʒ.mənt/"],["Smart Charging Optimization Software / Automated Power Balancing System / Peak Demand Shaving Controller"],["Quản lý phụ tải sạc động (DLM), phần mềm điều khiển thông minh tự động phân bổ công suất sạc điện giữa các trụ sạc tùy theo nhu cầu và lịch biểu giá điện để tránh quá tải lưới điện và giảm tiền điện."]],[["35"],["Fuel Displacement","/ˈfjuː.əl dɪsˈpleɪs.mənt/"],["Fossil Fuel Elimination / Diesel Consumption Abatement / Petroleum Substitution"],["Sự thay thế / loại bỏ nhiên liệu hóa thạch, khối lượng nhiên liệu xăng dầu được tiết kiệm hoặc triệt tiêu hoàn toàn nhờ việc chuyển đổi sang sử dụng năng lượng điện tái tạo."]],[["36"],["Operating Expenditure (OPEX)","/ˌɑː.pəˈreɪ.t̬ɪŋ ɪkˈspen.də.tʃɚ/"],["Recurring Operating Costs / Day-to-Day Maintenance Expenses / Operational Overhead"],["Chi phí vận hành (OPEX), các khoản chi phí định kỳ hàng ngày cần thiết để duy trì hoạt động kinh doanh (tiền điện, tiền bảo trì, thay lốp xe, lương tài xế)."]],[["37"],["Green Bond Issuance","/ɡriːn bɑːnd ˈɪʃ.uː.əns/"],["Sustainable Debt Offering / Climate Bond Placement / Green Capital Mobilization"],["Phát hành trái phiếu xanh, hoạt động huy động vốn nợ trên thị trường tài chính nơi toàn bộ số tiền thu được được cam kết pháp lý chỉ dùng để tài trợ cho các dự án bảo vệ môi trường và chuyển đổi xanh."]],[["38"],["Second-Party Opinion (SPO)","/ˈsek.ənd ˌpɑːr.t̬i əˈpɪn.jən/"],["Independent ESG Verification / External Framework Attestation / Third-Party Green Credibility Assessment"],["Ý kiến độc lập của bên thứ ba (SPO), báo cáo thẩm định do các tổ chức đánh giá ESG chuyên nghiệp (như Sustainalytics) ban hành để xác thực tính minh bạch và độ tin cậy của khung tài chính xanh của doanh nghiệp."]],[["39"],["Use of Proceeds","/juːs əv ˈproʊ.siːdz/"],["Capital Allocation Mandate / Earmarked Fund Purpose / Ring-Fenced Expenditure Scope"],["Mục đích sử dụng tiền thu được, điều khoản cốt lõi trong hợp đồng trái phiếu quy định số vốn huy động chỉ được phép giải ngân vào danh mục các dự án xanh đủ điều kiện được định trước."]],[["40"],["Ring-Fenced Account","/rɪŋ fenst əˈkaʊnt/"],["Segregated Sub-Account / Dedicated Escrow Ledger / Isolated Capital Reserve"],["Tài khoản cách ly / phong tỏa riêng biệt, tài khoản ngân hàng chuyên dụng được tách rời hoàn toàn khỏi quỹ lưu động chung của công ty nhằm đảm bảo tiền vốn trái phiếu xanh không bị chi dùng sai mục đích."]],[["41"],["Green Bond Principles (GBP)","/ɡriːn bɑːnd ˈprɪn.sə.pəlz/"],["ICMA Sustainable Debt Guidelines / Global Green Bond Standards / Voluntary Capital Framework"],["Các nguyên tắc trái phiếu xanh (ICMA GBP), bộ quy tắc chuẩn mực quốc tế do Hiệp hội Thị trường Vốn Quốc tế ban hành gồm 4 trụ cột hướng dẫn việc phát hành, quản lý dòng tiền và báo cáo trái phiếu xanh minh bạch."]],[["42"],["Avoided Emissions (Abatement)","/əˈvɔɪ.dɪd iˈmɪʃ.ənz/"],["Carbon Abatement Volume / Mitigated Greenhouse Gas Tonnage / Displaced Emissions Metric"],["Lượng phát thải tránh được (cắt giảm phát thải), chỉ số đo lường khối lượng khí thải nhà kính (tCO2e) được ngăn chặn không phát sinh vào bầu khí quyển nhờ việc vận hành các dự án năng lượng sạch thay thế cho nhiên liệu hóa thạch."]],[["43"],["Zero Liquid Discharge (ZLD)","/ˈzɪr.oʊ ˈlɪk.wɪd ˈdɪs.tʃɑːrdʒ/"],["Closed-Loop Effluent Recycling / Total Wastewater Elimination / Complete Water Reclamation System"],["Quy trình công nghệ xử lý nước thải khép kín không xả thải thể lỏng, trong đó toàn bộ nước thải công nghiệp được tinh chế và tái tuần hoàn 100%, chất thải rắn sót lại được cô đặc và ép khô thành bánh bùn."]],[["44"],["Water Stewardship","/ˈwɑː.t̬ɚ ˈstuː.ɚd.ʃɪp/"],["Responsible Water Management / Hydrological Conservation Governance / Sustainable Watershed Protection"],["Quản trị và sử dụng có trách nhiệm nguồn tài nguyên nước, bao gồm việc bảo tồn lưu vực, giảm thiểu ô nhiễm và đảm bảo chia sẻ công bằng nguồn nước sạch với cộng đồng địa phương."]],[["45"],["Curtail","/kɚˈteɪl/"],["Restrict / Reduce / Cut back / Scale down / Limit"],["Cắt giảm, hạn chế, thu hẹp quy mô chi tiêu, sản xuất hoặc hành động để ngăn ngừa tổn thất hoặc tối ưu hóa nguồn lực."]],[["46"],["Effluent","/ˈef.lu.ənt/"],["Industrial Wastewater / Liquid Discharge / Process Runoff / Treated Outflow"],["Nước thải công nghiệp hoặc dòng chất lỏng xả ra từ các nhà máy, bể chứa hoặc hệ thống xử lý công nghệ vào môi trường tự nhiên."]],[["47"],["Telemetry","/təˈlem.ə.tri/"],["Automated Remote Monitoring / Sensor Data Logging / Remote Signal Tracking / Operational Tele-monitoring"],["Công nghệ đo đạc và truyền dữ liệu vận hành từ xa qua cảm biến IoT, cho phép giám sát liên tục lưu lượng, nhiệt độ, áp suất hoặc nồng độ hóa chất trong nhà máy."]],[["48"],["Dehydration","/ˌdiː.haɪˈdreɪ.ʃən/"],["Dewatering / Desiccation / Sludge Moisture Removal / Solidification Process"],["Quá trình khử nước, loại bỏ độ ẩm hoặc tách chất lỏng ra khỏi bùn thải công nghiệp để tạo thành bánh bùn khô dễ dàng vận chuyển và xử lý an toàn."]],[["49"],["Limited Assurance","/ˈlɪm.ə.t̬ɪd əˈʃʊr.əns/"],["Independent Audit Verification / Negative Assurance Statement / Third-Party Environmental Verification"],["Mức độ bảo đảm có giới hạn trong kiểm toán, trong đó kiểm toán viên độc lập thực hiện các thủ tục phân tích và điều tra để đưa ra kết luận rằng không phát hiện sai sót trọng yếu nào trong dữ liệu công bố."]],[["50"],["Power Usage Effectiveness (PUE)","/ˈpaʊ.ɚ ˈjuː.sɪdʒ ɪˌfek.tɪv.nəs/"],["Data Center Energy Efficiency Metric / Computing Power Efficiency Ratio"],["Chỉ số hiệu quả sử dụng năng lượng của trung tâm dữ liệu, được tính bằng tổng năng lượng tiêu thụ chia cho năng lượng cung cấp cho các thiết bị CNTT. Chỉ số PUE càng gần 1.0 phản ánh hiệu quả sử dụng điện càng cao."]],[["51"],["Laud","/lɑːd/"],["Praise / Commend / Acclaim / Applaud / Extol"],["Ca ngợi, tán thưởng, khen ngợi nồng nhiệt trước công chúng vì một thành tích hoặc đóng góp xuất sắc."]],[["52"],["Parity","/ˈper.ə.t̬i/"],["Equality / Balance / Equivalence / Equal Representation"],["Sự bình đẳng, cân bằng, tính ngang hàng về tỷ lệ, địa vị, quyền lợi hoặc giá trị (đặc biệt trong bình đẳng giới hoặc cân đối thù lao)."]],[["53"],["Stakeholder","/ˈsteɪkˌhoʊl.dɚ/"],["Interested Party / Affected Constituency / Shareholder and Community Representative"],["Bên liên quan, bất kỳ cá nhân, tổ chức hay cộng đồng nào có lợi ích, quyền lợi hoặc chịu tác động từ các quyết định và hoạt động của doanh nghiệp."]],[["54"],["Mentorship Pipeline","/ˈmen.tɔːr.ʃɪp ˈpaɪp.laɪn/"],["Executive Coaching Channel / Talent Succession Pathway / Leadership Development Track"],["Lộ trình đào tạo kèm cặp và kế thừa tài năng, một hệ thống chính thức kết nối các nhân sự tiềm năng với các lãnh đạo cấp cao để bồi dưỡng kỹ năng và chuẩn bị thăng tiến."]]],"t":"table"}]</script>
<script type="application/json" id="labels">["Kiểm toán carbon","Điện tái tạo PPA","Công trình xanh LEED","Kinh tế tuần hoàn","Rủi ro chuỗi cung ứng","Điện hóa đội xe","Trái phiếu xanh","Tài nguyên nước ZLD","Báo cáo ESG \u0026 Net-Zero"]</script>
<script>
(function(){
const RAW = JSON.parse(document.getElementById('src').textContent);
const VI_RE = /[àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]/i;
const isVI = s => VI_RE.test(s);
let SHORT = []; try{ SHORT = JSON.parse(document.getElementById('labels').textContent)||[]; }catch(e){}

function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function add(p,...kids){ kids.forEach(k=>k&&p.appendChild(k)); return p; }
const isStr = x => typeof x === 'string';

/* ---------- split document ---------- */
const intro = RAW.slice(0,3);
const lessons = [];
let cur=null, finalTable=null, finalTitle='';
for(let i=3;i<RAW.length;i++){
  const it=RAW[i];
  if(isStr(it) && /^[=\-]{10,}$/.test(it)) continue;
  // "BÀI THỰC HÀNH SỐ N" alone (title on the next line) or "BÀI THỰC HÀNH SỐ N: Title" (title on the same line)
  if(isStr(it) && /^BÀI THỰC HÀNH SỐ\s*\d+/.test(it)){ const t=it.replace(/^BÀI THỰC HÀNH SỐ\s*\d+\s*:?\s*/,''); cur={items:t?[t]:[]}; lessons.push(cur); continue; }
  // "BÀI N: Title" keeps the title on the same line
  if(isStr(it) && /^BÀI\s+\d+\s*:/.test(it)){ cur={items:[it.replace(/^BÀI\s+\d+\s*:\s*/,'')]}; lessons.push(cur); continue; }
  if(isStr(it) && /^(BẢNG TỔNG HỢP|PHẦN TỔNG KẾT|PHAN TONG KET)/.test(it)){ cur=null; finalTitle=it; continue; }
  if(!cur){ if(!isStr(it)) finalTable=it; continue; }
  cur.items.push(it);
}
/* a lesson written without "PHẦN n:" lines ("1. ĐỀ BÀI GỐC" … "5. CÔ ĐỌNG", "ACTIVE RECALL 5S" + table,
   "ĐÁP ÁN CHI TIẾT", "4.1 …", "BỘ TỪ VỰNG …") gets the PHẦN / "1.N." lines the parser expects */
function normalizeNoParts(arr){
  if(arr.some(s=>isStr(s)&&/^PHẦN\s*\d\s*:/i.test(s))) return arr;
  const up=s=>s===s.toUpperCase()&&/[A-ZÀ-Ỹ]{3}/.test(s);
  const out=[]; let ph=0, last1=0, p2tab=false;
  arr.forEach(it=>{
    if(!isStr(it)){ if(ph===1&&last1>=5){ out.push('PHẦN 2: Active Recall 5S'); ph=2; } if(ph===2) p2tab=true; out.push(it); return; }
    const m=it.match(/^([1-5])\.\s+(.+)$/);
    if(m&&up(m[2])&&ph<=1){ if(!ph){ out.push('PHẦN 1: Văn bản đọc hiểu & dịch song ngữ'); ph=1; } out.push(`1.${m[1]}. ${m[2]}`); last1=+m[1]; return; }
    if(ph===1&&last1>=5&&up(it)&&/ACTIVE RECALL/i.test(it)){ out.push('PHẦN 2: '+it); ph=2; return; }
    if(ph===2&&p2tab){ ph=3; if(up(it)){ out.push('PHẦN 3: '+it); return; } out.push('PHẦN 3: Đáp án & dấu vết truy xuất'); }
    if(ph===3&&/^4\.1\s/.test(it)){ out.push('PHẦN 4: Phân tích Feynman & quy trình nghiệp vụ'); ph=4; }
    if(ph===4&&up(it)&&/TỪ VỰNG|VOCABULARY/i.test(it)){ out.push('PHẦN 5: '+it); ph=5; return; }
    out.push(it);
  });
  return out;
}
lessons.forEach((L,idx)=>{
  L.n=idx+1;
  let t=L.items[0]; const tq=t.match(/\s*\((Questions?\s*\d+\s*-\s*\d+[^()]*)\)\s*$/); if(tq) t=t.slice(0,tq.index);
  // trailing "(ENGLISH TITLE)" only when it is a real English title, not a short term like "(Credit Memo)":
  // 4+ words, or an all-caps title of 2+ words such as "(GRAPHIC DESIGN ASSOCIATE)"
  const m=t.match(/^(.*)\s\(([^()]*)\)\s*$/); const nw=m?m[2].split(/\s+/).length:0;
  const isEn=m&&!isVI(m[2])&&(nw>=4||(nw>=2&&m[2]===m[2].toUpperCase()&&/[A-Z]/.test(m[2])));

/* ---------- line formatting for passages ---------- */
// passage header: known doc types, a bare "[Internal Recommendation] Letter", or generic "Doc Type [N] (Descriptor)";
// a bracket holding a date ("Boston (January 3)", "(Evaluated by …, Director — March 28)") is a dateline or caption, not a header
const DOC_RE=/^(E-mail|Email|Letter \d|Document \d|Internal Memorandum|Webpage|Press Release|Bill of Lading|Economic Logistics Article|Service Proposal)\b|^(?:[A-Z][a-z]+ ){0,3}Letter$|^[A-Z][A-Za-z&\/\- ]{2,50}(?: \d)? \((?![^()]*\b(?:January|February|March|April|May|June|July|August|September|October|November|December) \d)[A-Za-z][^()]*\)$/;
// an ALL-CAPS line like "REQUEST FOR PROPOSALS (RFP #VF-2026-08)" is a letterhead inside a passage, not a new passage
// "Document 2: Cloud Infrastructure Monitoring & Incident Report" names the paper after the colon
const isDocHead=s=>(/^((Document|Passage|Text)\s*\d+|Internal Memorandum|Memorandum)\s*:\s*\S/.test(s) && s.length<140) || (DOC_RE.test(s) && s.length<110 && !/:\s/.test(s) && !(s===s.toUpperCase() && /[A-Z]{4}/.test(s)));
function fmtLine(s){
  if(/^•\s*/.test(s)) return el('div','ln-bul',s.replace(/^•\s*/,''));
  const kv=s.match(/^([A-ZÀ-Ỹa-zà-ỹ][^:]{0,30}):\s+(.+)$/);
  if(kv && !/[.!?]$/.test(kv[1]) && kv[1].split(' ').length<=5){ const d=el('div','ln-kv'); add(d,el('b',null,kv[1]+':'),document.createTextNode(kv[2])); return d; }
  if(s===s.toUpperCase() && /[A-ZÀ-Ỹ]{3}/.test(s) && s.length<130) return el('div','ln-caps',s);
  if(/:$/.test(s) && s.length<60) return el('div','ln-sec',s);
  return el('p',null,s);
}

/* "• Label: text" bullet with a bold label; "• Label:" alone becomes a group heading */
function bullet(s){
  s=s.trim();
  if(/^[^:]{2,150}:$/.test(s)) return el('div','ln-head',s.slice(0,-1));
  const d=el('div','ln-bul'); const m=s.match(/^([^:]{2,150}?):\s+(.*)$/);
  if(m && !/[.!?]$/.test(m[1])){ let rest=m[2]; if(rest.startsWith(m[1]+':')) rest=rest.slice(m[1].length+1).trim();
    add(d,el('b',null,m[1]+': '),document.createTextNode(rest)); }
  else d.textContent=s;
  return d;
}
/* one line of a strategy / BA block: "• ..." bullet, "=> ..." conclusion, "(1) ..." numbered point, else paragraph */
function richLine(s){
  s=s.trim();
  if(/^•/.test(s)){ const r=s.replace(/^•\s*/,''); return r.trim()?bullet(r):null; }
  if(/^=>/.test(s)){ const d=bullet(s.replace(/^=>\s*/,'')); d.className='ln-concl'; return d; }
  if(/^\(\d+\)/.test(s)){ const d=bullet(s); d.className='ln-num'; return d; }
  if(/^-\s/.test(s)){ const d=bullet(s.replace(/^-\s*/,'')); d.className='ln-sub'; return d; }
  return el('p',null,s);
}

/* summary paragraph -> one bullet per sentence; a long tail after ": " becomes sub-bullets split at top-level ", and/và/nhờ/đồng thời" or "; " */
const ABBR=/\b(Mr|Ms|Mrs|Dr|St|No|Inc|Co|Ltd|Corp|vs|etc|e\.g|i\.e|approx|Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)\.$/i;
function topSplit(s,test){ // split where test(s,i) matches outside brackets/quotes; returns [pieces]
  const out=[]; let d=0, st=0;
  for(let i=0;i<s.length;i++){ const c=s[i];
    if('(['.includes(c)) d++; else if(')]'.includes(c)) d=Math.max(0,d-1);
    else if(!d){ const n=test(s,i); if(n){ out.push(s.slice(st,i+n.keep).trim()); st=i+n.skip; i=st-1; } } }
  out.push(s.slice(st).trim()); return out.filter(Boolean);
}
function sentences(s){
  return topSplit(s,(t,i)=>{ if(!/[.!?]/.test(t[i])||!/\s/.test(t[i+1]||'')) return null;
    if(ABBR.test(t.slice(Math.max(0,i-6),i+1))) return null;
    const nx=t.slice(i+1).trimStart()[0]||''; if(!/[A-ZÀ-Ỹ0-9"'‘“(]/.test(nx)) return null;
    return {keep:1,skip:1}; });
}
function ideaList(s,vi){
  const ul=el('ul','ideas'+(vi?' vi-t':''));
  sentences(s).forEach(sen=>{
    const li=el('li'); const ci=sen.search(/:\s/); let head=sen, tail='';
    if(ci>20 && sen.length-ci>90){ head=sen.slice(0,ci+1); tail=sen.slice(ci+1).trim(); }
    // long sentence without a colon tail: break at top-level ", allowing / , while / , đồng thời / —"
    if(!tail && sen.length>200){ const ps=topSplit(sen,(t,i)=>{ const m=t.slice(i).match(/^(,\s+(?=(?:allowing|while|whereas|đồng thời|trong khi)\s)|\s*—\s*)/); return m?{keep:0,skip:m[0].length}:null; });
      if(ps.length>1){ head=ps[0]; tail=ps.slice(1); } }
    li.appendChild(document.createTextNode(head));
    if(Array.isArray(tail)){ const sub=el('ul'); tail.forEach(p=>sub.appendChild(el('li',null,p))); li.appendChild(sub); }
    else if(tail){ const parts=topSplit(tail,(t,i)=>{ const m=t.slice(i).match(/^(,\s+(?=(?:and|và|nhờ|đồng thời|rồi|then|while)\s)|;\s+)/); return m?{keep:m[0].startsWith(';')?1:0,skip:m[0].length}:null; });
      const sub=el('ul'); parts.forEach(p=>sub.appendChild(el('li',null,p))); li.appendChild(sub); }
    ul.appendChild(li);
  });
  return ul;
}

/* every table in 4.1 is one diagram (Vietnamese, then the English translation); the text line before a table is its caption.
   Arrow columns ("-->", "➔", "→") are dropped; a step head is "BƯỚC 1: Title" in one cell line or "BƯỚC 1" / "STEP 1" then the title */
function renderFlow(items,box){
  const keep=c=>c.length && !(c.length===1 && /^\s*(-+>|➔|→|➜|⇒|►|>)\s*$/.test(c[0]));
  let cap='';
  items.forEach(it=>{
    if(isStr(it)){ cap=it; return; }
    const tb=it, heads=tb.rows[0].filter(keep), bodies=(tb.rows[1]||[]).filter(keep);
    if(cap){ const c=el('div','strat-t',cap.replace(/:\s*$/,'')); c.style.cssText='color:var(--muted);margin:14px 0 8px'; box.appendChild(c); cap=''; }
    const f=el('div','flow');
    heads.forEach((hc,i)=>{
      const s=el('div','fstep'); const hm=hc[0].match(/^((?:BƯỚC|STEP)\s*\d+)\s*:?\s*(.*)$/i);
      const title=hm?[hm[2],...hc.slice(1)].filter(Boolean).join(' '):hc.join(' ');
      const h=el('h5'); if(hm){ add(h,el('span',null,hm[1]),document.createTextNode(title)); } else h.textContent=title;
      s.appendChild(h);
      (bodies[i]||[]).forEach(x=>{ x=x.replace(/^•\s*/,''); const m=x.match(/^([^:]{2,40}):\s*(.*)$/); const d=el('div','fkv'+(m&&/Đầu ra|Kết quả|Ket qua|Deliverable|Output/i.test(m[1])?' out':''));
        if(m) add(d,el('b',null,m[1]),el('span',null,m[2])); else d.textContent=x; s.appendChild(d); });
      f.appendChild(s);
    });
    box.appendChild(f);
  });
}

    const h=el('div','vc-h'); add(h,el('span','vn',String(m&&m[1]?m[1]:n).padStart(2,'0')),el('h5',null,m?m[2]:s)); if(m) h.appendChild(el('span','ipa',m[3]));
    c.appendChild(h);

  });
  box.appendChild(g);
}

function shortPart(P){ return ({1:'Văn bản & dịch song ngữ',2:'Active Recall 5 giây',3:'Đáp án & dấu vết',4:'Feynman & quy trình BA',5:'Từ vựng & Paraphrase'})[P.n]||P.title; }
/* page order for PHẦN 1: 1.1 Đề gốc, 1.2 Câu hỏi gốc (both from the doc's 1.1), 1.3 Chiến thuật (the doc's own
   "Hướng dẫn làm bài Part 7" sub-section, or the "Bước" lines inside the doc's 1.1 in older docs), then translation,
   question translation and summary — matched by title so both doc layouts number the same */
function splitPart1(subs){
  const kind=S=>S.id==='1.1'?'1.1':/Hướng dẫn|Strategy|Chiến thuật|Chiến lược/i.test(S.title)?'guide':/Từng Câu|Sentence/i.test(S.title)?'1.2':/Câu hỏi|Question/i.test(S.title)?'1.3':/Song ngữ|Bilingual/i.test(S.title)?'1.2':'1.4';
  const short={'1.2':'Dịch từng câu','1.3':'Dịch câu hỏi','1.4':'Tóm tắt'};
  const s11=subs.find(S=>kind(S)==='1.1'), guide=subs.find(S=>kind(S)==='guide'), out=[];
  if(s11){
    out.push({...s11,src:'1.1',mode:'pass',short:'Đề gốc',title:'Đề thi Tiếng Anh gốc (Original ETS Passages)'});
    out.push({...s11,src:'1.1',mode:'quiz',short:'Câu hỏi gốc',title:'Câu hỏi Tiếng Anh gốc (Original ETS Questions)'});
  }
  if(guide) out.push({...guide,src:'1.1',mode:'guide',short:'Chiến thuật',title:'Hướng dẫn làm bài Part 7 (Strategy Guide)'});
  else if(s11) out.push({...s11,src:'1.1',mode:'strat',short:'Chiến thuật',title:'Hướng dẫn làm bài Part 7 (Strategy Guide)'});
  subs.forEach(S=>{ const k=kind(S); if(k!=='1.1'&&k!=='guide') out.push({...S,src:k,short:short[k]}); });
  out.forEach((S,i)=>S.id='1.'+(i+1));
  return out;
}

  const yard=el('div','yard'); yard.setAttribute('aria-label','Chọn nhanh bài học');
  lessons.forEach(L=>{ const b=el('button','box'); b.type='button'; b.style.setProperty('--c',`var(--c${L.n})`); b.dataset.id='bai'+L.n; b.title=SHORT[L.n-1];
    add(b,el('span','code',SHORT[L.n-1]||'BÀI'),el('span','n',String(L.n).padStart(2,'0')),el('span','qr',L.qr)); b.onclick=()=>show('bai'+L.n,true); yard.appendChild(b); });
  add(hero,left,yard);
})();

const tabsEl=document.getElementById('tabs'), main=document.getElementById('main');
const panels={}, tabBtns={};
TABS.forEach((T,i)=>{
  const b=el('button','tab'); b.type='button'; b.setAttribute('role','tab'); b.id='tab-'+T.id; b.setAttribute('aria-controls','panel-'+T.id); b.style.setProperty('--c',T.c);
  const tl=el('span','tl'); add(tl,el('b',null,T.label),el('small',null,T.sub));
  add(b,el('span','door',T.n),tl); b.onclick=()=>show(T.id,false);
  b.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key==='ArrowLeft'){ e.preventDefault(); const j=(i+(e.key==='ArrowRight'?1:-1)+TABS.length)%TABS.length; show(TABS[j].id,false); tabBtns[TABS[j].id].focus(); }});
  tabsEl.appendChild(b); tabBtns[T.id]=b;
  const p=el('section'); p.id='panel-'+T.id; p.setAttribute('role','tabpanel'); p.setAttribute('aria-labelledby','tab-'+T.id); p.hidden=true; main.appendChild(p); panels[T.id]=p;
});

function show(id,scroll){
  if(!panels[id]) id=TABS[0].id;
  const p=panels[id];
  if(!p.firstChild){ if(id==='paraphrase') p.appendChild(renderParaphrase()); else p.appendChild(renderLesson(lessons[+id.replace('bai','')-1])); }
  Object.entries(panels).forEach(([k,v])=>{ v.hidden=k!==id; tabBtns[k].setAttribute('aria-selected',String(k===id)); tabBtns[k].tabIndex=k===id?0:-1; });
  document.querySelectorAll('.box').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
  tabBtns[id].scrollIntoView({block:'nearest',inline:'center'});
  try{ history.replaceState(null,'','#'+id); }catch(e){}
  try{ localStorage.setItem('lg-tab',id); }catch(e){}
  if(scroll!==null){ const bar=document.querySelector('.bar'); const y=main.getBoundingClientRect().top+window.scrollY-bar.offsetHeight-8; if(window.scrollY>y||scroll) window.scrollTo({top:y,behavior:'smooth'}); }
}

/* ---------- translation mode ---------- */
const mb=document.getElementById('m-both'), mr=document.getElementById('m-recall');
function setMode(r){ document.body.classList.toggle('recall',r); mb.setAttribute('aria-pressed',String(!r)); mr.setAttribute('aria-pressed',String(r)); try{localStorage.setItem('lg-mode',r?'1':'0');}catch(e){} if(!r) document.querySelectorAll('.peek').forEach(x=>x.classList.remove('peek')); }
mb.onclick=()=>setMode(false); mr.onclick=()=>setMode(true);
main.addEventListener('click',e=>{ if(!document.body.classList.contains('recall')) return; const v=e.target.closest('.vi-r'); if(v) v.classList.toggle('peek'); });
try{ if(localStorage.getItem('lg-mode')==='1') setMode(true); }catch(e){}

document.getElementById('foot').textContent='Nguồn: ChuyenDe_TOEIC_ChuyenDoiXanh_ESG.docx';

let start=(location.hash||'').slice(1);
if(!panels[start]){ try{ start=localStorage.getItem('lg-tab')||''; }catch(e){ start=''; } }
show(panels[start]?start:TABS[0].id,null);
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(panels[h]) show(h,true); });
})();
</script>
